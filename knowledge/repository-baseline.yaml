schema: starci/knowledge-source@1
id: repository-baseline
title: Repository baseline for a new StarCi TypeScript repository
purpose: |
  What a new StarCi repository carries from its first commit, for the Nest (backend) and Next
  (frontend) profiles: manifest and engines, strict TypeScript, the house ESLint canon with zero
  warnings, the test runner with coverage thresholds, git hooks, CI gates, coverage and quality
  dashboards, ignore rules and line endings. backend.scaffold and interface.scaffold write it; the
  stack itself is fixed by CONTEXT.md. This file decides toolchain wiring only - never product
  layout, dependencies an SDS owns, or business behaviour.
appliesTo: [backend, frontend]
family: cross-cutting
provenance:
  readAt: '2026-09-23'
  observedReference:
    - repository: nivo-backend
      commit: a44246f1c9b7dcbaa0f36432b38375159321cb43
      files: [package.json, tsconfig.json, apps/core/tsconfig.app.json, nest-cli.json, jest.config.js, eslint.config.mjs, .husky/pre-commit, .husky/pre-push, .github/workflows/ci.yml, codecov.yml, sonar-project.properties, .gitignore, .gitattributes, src/features/core/api/core/http/health/transport/http/health.controller.ts]
    - repository: nivo-fe
      commit: aae8d15c8097ec767227fcc14bfe231f07f0213b
      files: [package.json, apps/app/package.json, apps/app/tsconfig.json, apps/app/next.config.ts, apps/app/postcss.config.mjs, apps/app/vitest.config.ts, apps/app/src/app/globals.css, eslint.config.mjs, vitest.config.ts, vitest.setup.ts, .husky/pre-push, .github/workflows/ci.yml, codecov.yml, sonar-project.properties, .gitignore]
    - registry: npm
      packages: ['@starci/eslint-canon-be@1.2.1', '@starci/eslint-canon-fe@3.0.2', '@starci/grammar@0.4.13', 'lint-staged@16.4.0']
  limitations: |
    The owner's current repositories are the observed reference, not certification; where they
    differ from each other or from this baseline, the observations below say so and the baseline
    value wins for a new repository. Package versions are the observed pins at readAt; recheck the
    published kit versions when scaffolding. The shapes were proven at readAt by materialising each
    profile into an empty directory and running npm install, typecheck, lint, the test runner, build,
    the start script answering GET /health/live, and check-scoped-lint --all with the shape's
    architecture.json, all with exit 0; tests/repository-baseline.spec.mjs repeats that proof.
parameters:
  name: npm package name of the new repository - the bound repository name
  app: Nest application folder under apps/ - the service name the record or design declares
  grammarFamily: The bound @starci/grammar family whose stylesheet the app imports (core, heritage or offset-pop)
guidance:
  - id: BASELINE-ONE-SOURCE
    requirement: |
      Every value a scaffold writes into manifests, toolchain configuration, hooks, CI, coverage and
      quality configuration comes from the shapes below for the repository's profile. A profile shape
      extends common: maps merge with the profile's keys added, and a profile list is appended to the
      common list. An angle-bracket placeholder resolves to the common key it names or to a declared
      parameter; an angle-bracket token that starts with a capital or is a TypeScript type keyword
      (Promise<void>, Readonly<NodeJS.ProcessEnv>) is source text and stays as written. common.*
      references resolve to the value they name, and a modules/models/code-patterns.yaml#dotted.path
      citation resolves to the value that file owns. The manifest is composed as common.manifest
      orders it, with starci taken from the profile shape, and every entry under files is written
      byte for byte at its path with only its placeholders filled. A value the shapes do not carry is
      a named gap in the scaffold evidence, never an improvised choice.
  - id: BASELINE-CHECK-ONLY-GATES
    requirement: |
      CI and pre-push run check-only commands (lint:check, typecheck, test:ci, build). Only the
      pre-commit hook and the local lint script may fix, and only the staged files.
  - id: BASELINE-ONE-COVERAGE-RUN
    requirement: |
      One test run writes one lcov report; Codecov and Sonar both read that file from the same
      successful execution. Two runs for two dashboards produce numbers that disagree.
  - id: BASELINE-SONAR-LOCAL
    requirement: |
      Sonar is proven against the local SonarQube, not against CI: the implement op runs
      scripts/checks/sonar-local.mjs scan after the coverage run, and its summary (analysis id,
      revision, processed quality-gate status, issue counts, dashboard URL) is the Sonar evidence.
      The helper resolves host, project and token from the stack declaration and the source stack
      custody and creates what is missing; no op asks the owner for a Sonar token, host, project or
      GitHub secret. The CI Sonar steps are optional and skip when the repository has no SONAR_TOKEN
      secret.
  - id: BASELINE-STACK-SERVICES
    requirement: |
      Preflight before the first CI, Codecov or Sonar file is written: the repository's stack
      declaration services block (knowledge/application-stacks.yaml STACK-SERVICES) names the Sonar
      project key and host, the Codecov project and auth, and the CI secret/variable names, and the
      baseline files take them from it - sonar-project.properties sonar.projectKey is the declared key.
      node scripts/checks/check-starcistacks.mjs REPOSITORY [--new] is the preflight; a missing block in an
      existing repository is a suspect with its follow-up, never an owner ask.
  - id: BASELINE-ZERO-WARNINGS
    requirement: |
      Lint gates use the profile's canon kit with the shared max-warnings value; a warning fails the
      gate exactly like an error.
  - id: BASELINE-HOOKS-RUN
    requirement: |
      The hooks are proven by running them: a staged change makes the pre-commit hook execute
      lint-staged, and the pre-push hook runs typecheck and affected tests. A hook file that was
      never executed is not a baseline.
  - id: BASELINE-HEALTH-SURFACE
    requirement: |
      The skeleton exposes only process-local liveness per docs/application-runtime-config-and-health.md.
      Readiness over dependencies arrives with the SDS that declares those dependencies.
  - id: BASELINE-CODE-PATTERN-CLEAN
    requirement: |
      The skeleton is clean under the runtime's own gate, not only under the repository's lint:
      node scripts/checks/check-scoped-lint.mjs --profile nest|next --root REPOSITORY
      --architecture-config architecture.json --all exits 0 on the files the shape writes. The canon
      kit is installed at exactly the version and content digest modules/models/code-patterns.yaml
      pins, which is why the shape cites that file instead of restating a range. The package.json
      starci contracts and architecture.json declare only what the skeleton owns; a scaffold slice
      that adds an owner, env parser, error family or transport extends them in the same change.
  - id: BASELINE-ONE-LAYOUT
    requirement: |
      Nest is a monorepo of deployable apps: apps/<app>/src holds only main.ts and app.module.ts,
      features live under src/features and capabilities under src/modules, as
      docs/backend-source-pattern.md draws the default tree. nest build compiles the whole tsconfig
      rootDir, so the entry is dist/apps/<app>/src/main.js, the path start:prod runs. Next is one app
      rooted at src/app; build writes .next and start serves it with next start.
shapes:
  - id: common
    packageManager: npm@11.6.2
    lockfile: package-lock.json
    install: npm ci
    engines:
      node: '>=<nodeMajor>'
    nodeMajor: 22
    manifest:
      file: package.json
      name: <name>
      version: 0.1.0
      private: true
      order: [name, version, private, packageManager, engines, scripts, lint-staged, starci, dependencies, devDependencies]
      lint-staged: common.hooks.lintStaged
    typescript:
      strict: true
      noEmitCheck: tsc --noEmit --pretty false
    lint:
      maxWarnings: 0
      config: eslint.config.mjs
    scripts:
      lint: eslint . --fix --max-warnings=<lint.maxWarnings>
      lint:check: eslint . --max-warnings=<lint.maxWarnings>
      typecheck: tsc --noEmit --pretty false
      prepare: husky
    devDependencies:
      typescript: ^5.7.3
      '@types/node': ^<nodeMajor>
      eslint: ^9.18.0
      '@eslint/js': ^9.18.0
      typescript-eslint: ^8.67.0
      globals: ^15.14.0
      husky: ^9.1.7
      lint-staged: ^16.4.0
    coverage:
      reportsDirectory: coverage
      lcov: coverage/lcov.info
      thresholds:
        statements: 80
        lines: 80
        functions: 80
        branches: 75
    hooks:
      manager: husky
      preCommit: npx lint-staged
      prePush: npm run typecheck && npm run test:affected
      files:
        .husky/pre-commit: common.hooks.preCommit
        .husky/pre-push: common.hooks.prePush
      lintStaged:
        '*.{ts,tsx,mts,cts,js,mjs,cjs}': eslint --fix --max-warnings=<lint.maxWarnings>
    ci:
      file: .github/workflows/ci.yml
      triggers:
        push: [main]
        pullRequest: true
      permissions:
        contents: read
        id-token: write
      gates: [lint, typecheck, test, build]
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with: {node-version: <nodeMajor>, cache: npm}
        - run: npm ci
        - name: lint
          run: npm run lint:check
        - name: typecheck
          run: npm run typecheck
        - name: test
          run: npm run test:ci
        - name: build
          run: npm run build
        - uses: codecov/codecov-action@v5
          with: {files: coverage/lcov.info, disable_search: true, fail_ci_if_error: true, use_oidc: true}
        - uses: SonarSource/sonarqube-scan-action@v7
          if: "env.SONAR_TOKEN != ''"
          env: {SONAR_HOST_URL: vars.SONAR_HOST_URL}
        - uses: SonarSource/sonarqube-quality-gate-action@v1
          if: "env.SONAR_TOKEN != ''"
          env: {SONAR_HOST_URL: vars.SONAR_HOST_URL}
          timeoutMinutes: 10
      jobEnv: {SONAR_TOKEN: secrets.SONAR_TOKEN}
      sonarSteps: optional - they run only when the repository carries the SONAR_TOKEN secret; see sonar.ciSecrets
    codecov:
      file: codecov.yml
      projectTarget: 80%
      patchTarget: 90%
      informational: false
      comment: false
    sonar:
      file: sonar-project.properties
      projectKey: <name>
      hostUrl: https://sonar.starci.org
      sourceEncoding: UTF-8
      lcovReportPaths: coverage/lcov.info
      nodeMaxspace: 8192
      localRun:
        helper: scripts/checks/sonar-local.mjs scan --cwd REPOSITORY --wait --out E/sonar.json --log E/sonar.txt
        server: the local SonarQube the stack declaration's quality.sonar entry names; stack source-host (the default) is the runtime source repository's dev stack, compose .stacks/dev/infra/compose/sonarqube.yaml, container starci-sonarqube
        hostUrl: http://localhost:9010
        hostOverride: the helper passes SONAR_HOST_URL in the scanner env and -Dsonar.host.url on its command line, which wins over the file; sonar-project.properties keeps hostUrl above, the public name of the same server, for CI and dashboard links
        custody: the admin token runtime/files/sonarqube-admin-token.key creates the project; the project analysis token lives at runtime/files/sonarqube-KEY-token.key (KEY = projectKey), minted by the helper through the stack-secret tool when missing; values reach only the scanner env
        workDirectory: outside the repository (sonar.working.directory in a temp directory), so a scan leaves no .scannerwork behind
      ciSecrets: optional follow-up, never an owner ask - an operator with repository admin may set the SONAR_TOKEN secret and SONAR_HOST_URL variable from custody; without them the CI Sonar steps skip and the local helper's processed gate is the Sonar proof
    gitignore:
      - node_modules/
      - dist/
      - coverage/
      - .env
      - .env.*
      - '!.env.example'
      - .starciwork/runtime.sqlite*
      - .starciwork/_local/
      - config.yaml
    editorconfig:
      render: 'root = true, then one [*] section carrying every other key below'
      root: true
      charset: utf-8
      end_of_line: lf
      indent_style: space
      indent_size: 4
      insert_final_newline: true
      trim_trailing_whitespace: true
    gitattributes:
      - '* text=auto eol=lf'
      - '*.enc -text'
      - '*.key -text'
      - '*.identity -text'
      - '*.age -text'
  - id: nest
    appliesTo: backend
    extends: common
    eslintKit: '@starci/eslint-canon-be'
    testRunner: jest
    testDependencies: [jest, ts-jest, '@types/jest', '@nestjs/testing', supertest, '@types/supertest']
    dependencies:
      '@nestjs/common': ^11.0.1
      '@nestjs/core': ^11.0.1
      '@nestjs/platform-express': ^11.0.1
      '@nestjs/terminus': ^11.1.1
      reflect-metadata: ^0.2.2
      rxjs: ^7.8.1
    devDependencies:
      '@nestjs/cli': ^11.0.0
      '@nestjs/schematics': ^11.0.0
      '@nestjs/testing': ^11.0.1
      '@starci/eslint-canon-be': modules/models/code-patterns.yaml#profiles.nest.canon.version
      '@types/express': ^5.0.0
      '@types/jest': ^29.5.14
      '@types/supertest': ^7.2.1
      jest: ^29.7.0
      supertest: ^7.2.2
      ts-jest: ^29.4.12
    scripts:
      build: nest build
      start: nest start
      start:dev: nest start --watch
      start:prod: node dist/apps/<app>/src/main
      test: jest
      test:unit: jest
      test:ci: jest --ci --coverage --coverageReporters=lcov --coverageReporters=text-summary
      test:affected: jest --changedSince=origin/main --passWithNoTests
    sonar:
      sources: apps,src
      tests: apps,src
      exclusions: '**/*.spec.ts,**/*.e2e-spec.ts,**/dist/**,**/coverage/**'
      testInclusions: '**/*.spec.ts'
    health: GET /health/live, the Terminus liveness check with no indicators, at the transport path docs/application-runtime-config-and-health.md names for Nest
    starci:
      codePatterns:
        nest:
          boundaries:
            schema: starci/nest-boundary-contract@1
            envParsers: [src/modules/platform/env/config.ts]
            cacheOwners: []
            jestLifecycleEntries: []
          errorIdentity:
            schema: starci/nest-error-identity@1
            profile: capability
            throwRoots: [apps/<app>/src, src]
            families:
              - id: env
                path: src/modules/platform/env/errors/env-error.ts
                export: EnvError
                declarationRoots: [src/modules/platform/env/errors]
                codeProperty: code
                causeProperties: [cause]
          transportErrors:
            schema: starci/nest-transport-error-contract@1
            errorTypes:
              - id: env
                path: src/modules/platform/env/errors/env-error.ts
                export: EnvError
                codeProperty: code
                messageProperty: message
                causeProperties: [cause]
            transports: []
            mappers: []
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "module": "nodenext",
            "moduleResolution": "nodenext",
            "resolvePackageJsonExports": true,
            "target": "ES2023",
            "esModuleInterop": true,
            "allowSyntheticDefaultImports": true,
            "isolatedModules": true,
            "experimentalDecorators": true,
            "emitDecoratorMetadata": true,
            "resolveJsonModule": true,
            "removeComments": true,
            "sourceMap": true,
            "outDir": "./dist",
            "rootDir": "./",
            "baseUrl": "./",
            "skipLibCheck": true,
            "strict": true,
            "noFallthroughCasesInSwitch": true,
            "forceConsistentCasingInFileNames": true,
            "paths": {
              "@features/*": ["./src/features/*"],
              "@modules/*": ["./src/modules/*"]
            }
          },
          "include": ["apps/**/*", "src/**/*"]
        }
      tsconfig.build.json: |
        {
          "extends": "./tsconfig.json",
          "exclude": ["node_modules", "dist", "coverage", "**/*.spec.ts"]
        }
      nest-cli.json: |
        {
          "$schema": "https://json.schemastore.org/nest-cli",
          "collection": "@nestjs/schematics",
          "monorepo": true,
          "root": "apps/<app>",
          "sourceRoot": "apps/<app>/src",
          "compilerOptions": {
            "deleteOutDir": true,
            "webpack": false,
            "tsConfigPath": "tsconfig.build.json"
          },
          "projects": {
            "<app>": {
              "type": "application",
              "root": "apps/<app>",
              "entryFile": "main",
              "sourceRoot": "apps/<app>/src",
              "compilerOptions": {
                "tsConfigPath": "tsconfig.build.json",
                "webpack": false
              }
            }
          }
        }
      jest.config.js: |
        const { pathsToModuleNameMapper } = require("ts-jest")
        const { compilerOptions } = require("./tsconfig.json")

        /** @type {import("jest").Config} */
        module.exports = {
            preset: "ts-jest",
            testEnvironment: "node",
            testMatch: ["**/*.spec.ts"],
            moduleNameMapper: pathsToModuleNameMapper(compilerOptions.paths, { prefix: `${__dirname}/` }),
            transform: {
                "^.+\\.ts$": ["ts-jest", { tsconfig: "tsconfig.json", diagnostics: true }],
            },
            clearMocks: true,
            collectCoverageFrom: ["apps/**/*.ts", "src/**/*.ts", "!**/*.spec.ts", "!**/*.d.ts", "!**/main.ts", "!**/*.module.ts", "!**/index.ts"],
            coverageDirectory: "<coverage.reportsDirectory>",
            coverageThreshold: {
                global: {
                    statements: <coverage.thresholds.statements>,
                    lines: <coverage.thresholds.lines>,
                    functions: <coverage.thresholds.functions>,
                    branches: <coverage.thresholds.branches>,
                },
            },
        }
      eslint.config.mjs: |
        import js from "@eslint/js"
        import globals from "globals"
        import tseslint from "typescript-eslint"
        import { defineConfig } from "eslint/config"
        import starciBe, { recommended as starciRecommended } from "@starci/eslint-canon-be"

        const sources = ["apps/**/*.ts", "src/**/*.ts"]

        // The code-pattern manifest keeps these canon rules off: an architecture or script check replaces each.
        const replacedByChecks = [
            "starci-be/exception-name-ends-in-exception",
            "starci-be/exception-code-matches-class-name",
            "starci-be/exception-metadata-type-named-for-class",
            "starci-be/exception-extends-abstract",
            "starci-be/exception-in-errors-folder",
            "starci-be/require-exception-object-arg",
            "starci-be/throw-abstract-exception",
            "starci-be/no-handler-encoded-failure",
            "starci-be/must-deep-module-import",
            "starci-be/no-folder-reexport",
            "starci-be/handler-has-twin-spec",
        ]
        // A warning already fails the zero-warning gate, so the canon's warn level is stated as error.
        const asError = (setting) => (setting === "warn" ? "error" : Array.isArray(setting) && setting[0] === "warn" ? ["error", ...setting.slice(1)] : setting)
        const canonRules = Object.fromEntries(Object.entries(starciRecommended).map(([rule, setting]) => [rule, replacedByChecks.includes(rule) ? "off" : asError(setting)]))

        export default defineConfig([
            { ignores: ["**/node_modules/**", "**/dist/**", "**/coverage/**"] },
            { linterOptions: { noInlineConfig: true, reportUnusedDisableDirectives: "error" } },
            {
                plugins: { js },
                extends: ["js/recommended"],
                languageOptions: { globals: globals.node },
            },
            ...tseslint.configs.recommended.map((config) => ({ ...config, files: sources })),
            {
                files: sources,
                languageOptions: {
                    parserOptions: { emitDecoratorMetadata: true, experimentalDecorators: true },
                },
                rules: {
                    "@typescript-eslint/consistent-type-imports": "error",
                    indent: ["error", 4],
                    quotes: ["error", "double"],
                    semi: ["error", "never"],
                },
            },
            {
                files: sources,
                plugins: { "starci-be": starciBe },
                rules: canonRules,
            },
        ])
      architecture.json: |
        {
          "schema": "starci/architecture-config@1",
          "kinds": ["backend"],
          "tsconfig": "tsconfig.json",
          "backend": {
            "apps": ["apps"],
            "features": ["src/features"],
            "modules": ["src/modules"],
            "moduleRegistration": {
              "providerIdentity": "exported-class-token",
              "handlerDecorators": []
            }
          },
          "owners": [
            { "id": "feature-system-health", "root": "src/features/system-health", "entry": "src/features/system-health/index.ts" },
            { "id": "module-platform-env", "root": "src/modules/platform/env", "entry": "src/modules/platform/env/index.ts" }
          ]
        }
      apps/<app>/src/main.ts: |
        import {
            NestFactory,
        } from "@nestjs/core"
        import {
            readServerConfig,
        } from "@modules/platform/env"
        import {
            AppModule,
        } from "./app.module"

        /** Parses the environment before composing the application, then serves until a shutdown signal. */
        const bootstrap = async (): Promise<void> => {
            const config = readServerConfig()
            const app = await NestFactory.create(AppModule)
            app.enableShutdownHooks()
            await app.listen(config.port)
        }

        void bootstrap()
      apps/<app>/src/app.module.ts: |
        import {
            Module,
        } from "@nestjs/common"
        import {
            SystemHealthModule,
        } from "@features/system-health"

        @Module({
            imports: [SystemHealthModule],
        })
        /** Composition root: the features this service runs. */
        export class AppModule {}
      src/features/system-health/index.ts: |
        export {
            SystemHealthModule,
        } from "./system-health.module"
      src/features/system-health/system-health.module.ts: |
        import {
            Module,
        } from "@nestjs/common"
        import {
            TerminusModule,
        } from "@nestjs/terminus"
        import {
            LiveController,
        } from "./transport/http/live.controller"

        @Module({
            imports: [TerminusModule],
            controllers: [LiveController],
        })
        /** Process-local liveness; readiness arrives with the SDS that declares dependencies. */
        export class SystemHealthModule {}
      src/features/system-health/transport/http/live.controller.ts: |
        import {
            Controller,
            Get,
        } from "@nestjs/common"
        import {
            HealthCheck,
            HealthCheckService,
        } from "@nestjs/terminus"
        import type {
            HealthCheckResult,
        } from "@nestjs/terminus"

        @Controller("health")
        /** Liveness probe: answers from process-local state and never touches a dependency. */
        export class LiveController {
            constructor(
                /** Terminus executor; it runs no indicator, so a dependency outage never restarts the process. */
                private readonly health: HealthCheckService,
            ) {}

            /** Reports the process alive while its event loop still answers requests. */
            @Get("live")
            @HealthCheck()
            live(): Promise<HealthCheckResult> {
                return this.health.check([])
            }
        }
      src/features/system-health/transport/http/live.controller.spec.ts: |
        import {
            Test,
        } from "@nestjs/testing"
        import {
            TerminusModule,
        } from "@nestjs/terminus"
        import {
            LiveController,
        } from "./live.controller"

        describe("LiveController",
            () => {
                it("reports ok from process-local state",
                    async () => {
                        const moduleRef = await Test.createTestingModule({
                            imports: [TerminusModule],
                            providers: [LiveController],
                        }).compile()
                        const controller = moduleRef.get(LiveController)
                        await expect(controller.live()).resolves.toMatchObject({
                            status: "ok",
                        })
                        await moduleRef.close()
                    })
            })
      src/modules/platform/env/index.ts: |
        export {
            parseServerConfig,
            readServerConfig,
        } from "./config"
        export type {
            ServerOptions,
        } from "./config"
        export {
            EnvError,
        } from "./errors/env-error"
      src/modules/platform/env/config.ts: |
        import {
            EnvError,
        } from "./errors/env-error"

        /** Typed server configuration, validated once before the listener starts. */
        export interface ServerOptions {
            /** TCP port the HTTP listener binds. */
            readonly port: number
        }

        const DEFAULT_PORT = 3000
        const MAX_PORT = 65535

        /** Validates the server keys of an environment snapshot; a malformed PORT refuses startup. */
        export const parseServerConfig = (env: Readonly<NodeJS.ProcessEnv>): ServerOptions => {
            const raw = env.PORT
            if (raw === undefined || raw === "") {
                return {
                    port: DEFAULT_PORT,
                }
            }
            const port = Number(raw)
            if (!Number.isInteger(port) || port < 1 || port > MAX_PORT) {
                throw new EnvError("ENV_PORT_INVALID", `PORT must be an integer from 1 to ${MAX_PORT}.`)
            }
            return {
                port,
            }
        }

        /** Parses the live process environment, the one place this service reads it. */
        export const readServerConfig = (): ServerOptions => parseServerConfig(process.env)
      src/modules/platform/env/config.spec.ts: |
        import {
            EnvError,
        } from "./errors/env-error"
        import {
            parseServerConfig,
            readServerConfig,
        } from "./config"

        describe("parseServerConfig",
            () => {
                it("falls back to port 3000 when PORT is unset",
                    () => {
                        expect(parseServerConfig({})).toEqual({
                            port: 3000,
                        })
                    })

                it("accepts an integer PORT inside the TCP range",
                    () => {
                        expect(parseServerConfig({
                            PORT: "8080",
                        })).toEqual({
                            port: 8080,
                        })
                    })

                it("rejects a malformed PORT without echoing its value",
                    () => {
                        expect(() => parseServerConfig({
                            PORT: "80a",
                        })).toThrow(EnvError)
                        expect(() => parseServerConfig({
                            PORT: "70000",
                        })).toThrow("PORT must be an integer from 1 to 65535.")
                    })
            })

        describe("readServerConfig",
            () => {
                it("reads the port from the live process environment",
                    () => {
                        expect(readServerConfig().port).toBeGreaterThan(0)
                    })
            })
      src/modules/platform/env/errors/env-error.ts: |
        /** Startup configuration refusal: names the key and the rule it broke, never the supplied value. */
        export class EnvError extends Error {
            /** Stable machine code for the refused key and rule. */
            readonly code: string

            constructor(code: string, message: string) {
                super(message)
                this.name = "EnvError"
                this.code = code
            }
        }
  - id: next
