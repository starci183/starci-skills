            })
        })
observations:
  - id: package-manager
    observed: Both repositories pin packageManager npm@11.6.2 and install with npm ci in CI. nivo-fe also
      carries a stray pnpm-lock.yaml beside package-lock.json; the baseline keeps one lockfile.
  - id: node
    observed: Both ci.yml files set up Node 22; neither package.json declares engines, so the baseline
      adds the engines line. nivo-backend pins @types/node ^22 and nivo-fe ^20; the baseline ties it to nodeMajor.
  - id: strict
    observed: nivo-fe app tsconfigs set strict true. nivo-backend sets only strictNullChecks with
      noImplicitAny false and strictBindCallApply false - the gap a new repository does not inherit, so
      the nest tsconfig keeps nivo-backend's module, target and decorator options under strict true.
      nivo-backend's incremental flag is dropped because nest build deletes dist while the build info
      survives and the next build emits nothing.
  - id: lint
    observed: Both use a flat eslint.config.mjs over the canon kit (@starci/eslint-canon-be ^1.2.1,
      @starci/eslint-canon-fe 3.0.2, both the published versions at readAt); the baseline installs the
      exact version code-patterns.yaml pins, because a caret range drifts past the pinned content
      digest the code-pattern gate verifies. The nest config states the canon's warn rules as error and
      turns off the rules the code-pattern manifest replaces with architecture or script checks, and
      refuses inline configuration, as that gate requires. nivo-fe lint:check passes
      the zero-warning budget to eslint; nivo-backend lint:check passes none. Both alias format:check to
      the lint check - formatting is the canon's stylistic rules, not a separate formatter. nivo-backend
      also forces one element or argument per line and three repository-local rules; the baseline keeps
      only its indent, quote and semicolon rules. typescript-eslint is pinned once at nivo-fe's ^8.67.0.
  - id: tests
    observed: nivo-backend runs jest with ts-jest (diagnostics on) and test:ci writes lcov plus
      text-summary. nivo-fe runs one root vitest invocation with the v8 provider writing a single
      coverage/lcov.info, jsdom, and the jest-dom matchers registered in a setup file.
  - id: coverage-thresholds
    observed: nivo-fe package.json starci.deliveryAssurance.unitCoverage and its codecov.yml
      (informational false) carry the threshold values the shapes adopt; nivo-backend codecov.yml is
      informational only and its jest config declares no coverageThreshold.
  - id: hooks
    observed: Both run husky through the prepare script. Both pre-push hooks run lint:check and
      test:unit; nivo-backend pre-commit runs a secrets guard, nivo-fe has no pre-commit, and neither
      uses lint-staged - the baseline adds staged lint on commit and moves typecheck plus affected
      tests to push. lint-staged 16 is the pin because 17 requires Node 22.22.1, above the engines floor.
  - id: nest-layout
    observed: nivo-backend is a Nest monorepo with apps/<app>/src composition roots and @features/@modules
      path aliases; the baseline keeps that shape for one app, and adds src/modules/platform/env as the
      one env parser plus EnvError as the one error family the code-pattern contracts require. Its liveness is a Terminus check with no
      indicators at /health/live, which the baseline keeps; its readiness indicators are SDS-owned.
  - id: grammar
    observed: nivo-fe apps pin @starci/grammar 0.4.13 (the published version at readAt) beside @heroui/react
      and @heroui/styles ^3.2.1, which the grammar declares as peers. globals.css imports tailwind, HeroUI
      styles and the grammar common sheet, and adds the grammar dist as a Tailwind source; nivo-fe supplies
      its own family sheet where a new app imports the bound grammar family sheet, which already imports
      the common sheet - the architecture grammar contract admits one style entry.
  - id: next-output
    observed: nivo-fe builds output standalone for its container image, where next start refuses that
      output; the baseline builds the default output so next start serves the build, and a deployment
      design that wants a standalone image adds it with its own start command.
  - id: ci
    observed: Both ci.yml files trigger on push to main and pull requests, run npm ci, lint:check,
      typecheck, build and test:ci, then upload coverage/lcov.info with codecov-action v5 (OIDC,
      fail_ci_if_error) and scan with sonarqube-scan-action v7 followed by the quality-gate action.
  - id: sonar
    observed: Both sonar-project.properties point at sonar.starci.org with UTF-8 sources, spec
      exclusions, lcov report paths and the analyzer heap raised for large trees. nivo-backend's
      npm run sonar:check against sonar.starci.org fails with HTTP 401 when no token reaches its env
      (collab conversation-r3 evidence, 2026-09-24); the baseline runs Sonar through the local helper
      instead, which supplies the project token from custody.
  - id: ignore-and-eol
    observed: Both .gitignore files exclude node_modules, coverage, .env and .env.* with .env.example
      re-included; nivo-backend also ignores .starciwork/_local/. nivo-backend .gitattributes keeps
      encrypted payloads out of text conversion and forces LF on scripts. Neither repository has an
      .editorconfig; the baseline one follows their four-space indentation.
