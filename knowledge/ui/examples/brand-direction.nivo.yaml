  rubric:
    gateCap: 5
    checks:
      - id: H1
        group: hierarchy
        gate: true
        test: "Squint at the desktop PNG for three seconds: exactly one heaviest element, and it is the page
          title or the surface's named job - never art, never a KPI figure on a non-dashboard page"
        cites:
          - proof/taste.yaml TASTE-1 case-1, case-3 and case-5
          - composition/hierarchy.yaml HIERARCHY-6
      - id: H2
        group: hierarchy
        test: Page title 20px visibly above section headings 16px, above card titles 14px; no weight 700; at
          most three sizes inside any card
        cites:
          - proof/taste.yaml TASTE-1 case-2
          - proof/taste.yaml TASTE-6 case-1
      - id: H3
        group: hierarchy
        test: "Top to bottom: header, summary, attention and result notices, collection - the same order in
          the mobile PNG"
        cites:
          - composition/hierarchy.yaml HIERARCHY-3 case-1 and case-2
      - id: H4
        group: hierarchy
        test: Gaps read 24 > 16 > 12 > 8/4 and left edges in each region align; no off-scale gap
        cites:
          - proof/taste.yaml TASTE-3
          - proof/taste.yaml TASTE-4
      - id: B1
        group: brand
        gate: true
        test: The primary fill is the brand primary token and no other saturated hue appears
