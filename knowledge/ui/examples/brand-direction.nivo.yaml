      - id: G2
        group: grammar
        test: Attention and last-result notices are the real HeroUI Alert - white surface, small toned glyph
          left of the title, title in the tone colour, the grammar Button in its actions slot by tone
          (accent→primary, danger→danger, else secondary); no tone fill, no IconTile
        cites:
          - composition/taste.yaml DISCIPLINE-1 case-5
          - composition/feedback.yaml FEEDBACK-2
      - id: G3
        group: grammar
        test: Capability ratios are one DNA Meter - never Progress, never a hand-segmented or hand-made bar
        cites:
          - composition/taste.yaml DISCIPLINE-1 case-5
          - composition/accent.yaml ACCENT-4
    beautyAnchors:
      - score: 1-2
        anchor: A text dump - no icons, no actions, grey badges, a grey box that reads like an error, ids on
          screen (calibration anchor-low)
      - score: 3-4
        anchor: Correct tokens but plain - icons or actions present yet no focal point, several filled
          primaries or none, untoned status, attention buried below the list
      - score: 5-6
        anchor: Attention first and toned badges, but a weak onward action, slugs visible, uneven summary
          weights (calibration anchor-mid, about 5)
      - score: "7"
        anchor: A clear summary, notices and cards and a good mobile, with one or two anti-patterns - a
          black meter, a primary per card, ticks on facts, tinted tiles
      - score: "8"
        anchor: Every check passes; enterprise-console class; minor rhythm or copy nits only
      - score: "9"
        anchor: Passes everything and feels designed - one accent moment, calm neutrals, numbers that read
          at a glance, notices that invite the fix, a mobile that feels native (calibration
          anchor-high, about 8 to 9)
      - score: "10"
        anchor: A reviewer who knows neither product sorts it beside Linear, Stripe or Vercel consoles
          without hesitation (TASTE-12 case-2)
