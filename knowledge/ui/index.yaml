schema: starci/knowledge-source@1
id: ui
title: UI knowledge
appliesTo:
  - ui
purpose: |-
  These topics retain observable composition, presentation and proof criteria. They do not supply product facts, route authority, permissions or a mandatory design-system package.

  [Code patterns](../patterns/fe/index.yaml) address source conventions; [Grammar snapshots](../grammars/index.yaml) describe one reference family. Exact package exports and rendered behavior must be inspected in the current target, never inferred from a table here.
topics:
  - title: Composition
    path: composition/index.yaml
    question: Regions, hierarchy, actions, states and responsive ownership
    applicableWorkOp: Selected interface planning/direction/implementation op
  - title: Presentation
    path: presentation/index.yaml
    question: Values and boundaries owned by the application versus its installed
      components
    applicableWorkOp: Selected interface implementation or repair op
  - title: Proof
    path: proof/index.yaml
    question: What the running surface actually shows and does
    applicableWorkOp: Selected interface audit or UAT op
guidance:
  - id: image-first-direction
    requirement: |-
      For every large frontend task, choose the smallest representative set of critical screens that covers
      the highest-risk journeys, layout anatomy, interactions and brand moments. Generate those visual
      directions with built-in `image_gen.imagegen` using accepted business/SDS, the current brand and masters,
      relevant UI rules, and actual inspected Grammar anatomy/reference inputs. Retain each exact prompt,
      generated asset and actual tool provenance; do not assert an image-model identity the tool did not expose.
      Map every remaining screen, state and responsive band to the representative direction and actual Grammar
      components in an explicit coverage/component/state map. A generated direction is proposed design input,
      not exact component/render/API proof and not a screenshot of a working product. Frontend implementation
      must still produce real Grammar renders and code checks, and browser UAT remains a separate evidence layer.
  - id: binding-criteria
    requirement: |-
      Select applicable stable rule IDs in the chosen `.starciwork` node's acceptance assertions. Record expected owner, state, viewport and observable condition in that node's Markdown or namespaced extensions; record actual observations and captured assets in its evidence bundle. Use the [current metadata contract](../../core/README.json) for fields and completion. A markup claim, score or copied example is not proof.
      Terms such as direction, observation record and verdict in a topic denote domain decisions and findings for that selected node. They prescribe no separate response files, session ledger, automatic dispatch or extra global validator. Missing instruments or a missing installed API remain explicit limitations, not invented success.
      Where the installed stack uses the documented Common/family pattern, inspect component ownership before adding app styles. Assess the actual reusable output, family delta and application delta separately. Preserve semantic state, focus, accessibility and public props; a missing capability is a source-backed gap to report to its owner, not permission to invent a substitute API.
      Rule IDs remain stable. A rubric applies only when selected by the accepted scope; its score and thresholds do not override business acceptance or authorize shipping, deployment, data mutation or another op. Historical observations may motivate a check but cannot establish current completion.
