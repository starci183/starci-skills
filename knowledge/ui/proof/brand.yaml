schema: starci/knowledge-source@1
id: ui.proof.brand
title: Brand proof
appliesTo:
  - ui
family: proof
purpose: |-
  This file answers one question: is the surface that was rendered wearing the brand the product decided,
  or one the renderer chose for it?
  A brand record names the colour tokens, their roles, the mascot and where it may appear. None of that is
  proved by the record, by the prompt that produced the picture, or by a reviewer who likes the result. It
  is proved from the rendered bytes: the colours the capture is actually made of, and the artwork the
  surface actually carries. These observations are cheap and mechanical, which is exactly why an
  off-brand render survives so long without them - everyone assumes someone else compared the two.
  A claim that cannot be observed here is recorded as unproven, never as passed.
rules:
  - id: BRAND-1
    title: The render's primary and danger are the brand's tokens
    governs: |-
      Governs the two colours that carry meaning: the one that invites the main action and the one that warns.
    cases:
      - id: case-1
        when: The capture's dominant saturated colours are collected
        observe: |-
          The colour filling the primary action matches the brand record's `primary` token within the runtime's colour tolerance. A primary drawn in a hue the record does not carry falsifies it
      - id: case-2
        when: The surface carries a destructive or failing outcome
        observe: |-
          Its colour matches the record's `danger` token, not an approximation of it and not the primary. A destructive control painted in the primary falsifies it
      - id: case-3
        when: The brand's primary appears nowhere in the capture
        observe: |-
          The observation fails even when every colour present is on-brand: a surface drawn only in the brand's neutrals has dropped the brand's own colour
      - id: case-4
        when: The capture is of a theme the record answers separately
        observe: |-
          The comparison uses that theme's declared values. Measuring a dark capture against the default values falsifies the measurement, not the render
      - id: case-5
        when: No brand record exists for the surface
        observe: |-
          The verdict is unproven and names the missing record. Approving a palette because it looks coherent falsifies the lens
    notThisRule: |-
      whether the two colours can actually be told apart, and whether text on them is legible, is measured as
      COLOR-3 and CONTRAST-1.
    verification:
      automated:
        - command: runRenderChecks (scripts/checks/render.mjs)
          checks:
            - palette-off-brand
            - primary-absent
          note: |-
            Reads the capture's own pixels, buckets the saturated ones and compares each dominant bucket
            against every brand colour token and scale step.
    relatedRules:
      - TASTE-5
      - CONTRAST-1
      - COLLECTION-1
  - id: BRAND-2
    title: The mascot appears where the brand names a slot, and nowhere else
    governs: |-
      Governs the brand's character: where it may stand, where it may not, and how it is declared.
    cases:
      - id: case-1
        when: The brand allows the mascot on the surface that was rendered
        observe: |-
          The design record declares an artwork slot for it, naming the mascot or a brand master it is drawn from. A surface the brand invites the mascot onto with no slot declared falsifies it
      - id: case-2
        when: The brand forbids the mascot on the surface that was rendered
        observe: |-
          It is absent from the capture. Any appearance of the character on a forbidden surface falsifies it, whatever the record says
      - id: case-3
        when: The mascot is present in the capture
        observe: |-
          It is the brand's own master, at or above the record's minimum size, and obeys the record's stated rules. A redrawn, recoloured or shrunken character falsifies it
      - id: case-4
        when: The brand names no mascot
        observe: |-
          There is nothing to prove here, and the observation is recorded as not applicable rather than as a pass
    notThisRule: |-
      whether an image earns its place in the composition at all is TASTE-8.
    verification:
      automated:
        - command: runRenderChecks (scripts/checks/render.mjs)
          checks:
            - mascot-slot-missing
          note: |-
            Compares the brand's allowed surfaces against the artwork slots the design record declares for
            each surface it names.
    relatedRules:
      - TASTE-8
      - COVERAGE-1
  - id: BRAND-3
    title: Any colour outside the brand and the grammar palette is a defect
    governs: |-
      Governs every other colour the surface is made of, not only the two that carry meaning.
    cases:
      - id: case-1
        when: A saturated colour occupies a material share of the capture
        observe: |-
          It resolves to a brand colour token, a step of a brand scale, or the grammar family's own palette. A dominant hue that resolves to none of them falsifies it
      - id: case-2
        when: |-
          A colour is off by less than the runtime's tolerance from a declared one
        observe: |-
          It counts as that colour: a capture is antialiased and composited, and a difference below perception is not a second colour
      - id: case-3
        when: A gradient, a chart series or an illustration introduces hues
        observe: |-
          Each of them traces to a declared colour or to an artwork slot the record declared. An unnamed palette invented inside an image falsifies it
      - id: case-4
        when: The capture cannot be read in the format it was stored in
        observe: |-
          The verdict is unproven and names the format. A palette nobody could read is never recorded as on-brand
      - id: case-5
        when: A colour outside the palette is deliberate
        observe: |-
          The brand record carries it as a declared token before the render is accepted; a decision recorded only in review does not make the pixels on-brand
    notThisRule: |-
      how many distinct hues a surface may spend at all, regardless of where they came from, is TASTE-5.
    verification:
      automated:
        - command: runRenderChecks (scripts/checks/render.mjs)
          checks:
            - palette-off-brand
          note: |-
            Every dominant bucket of the capture names its nearest declared colour and the distance to it, so
            a failing observation says which hue and how far off it was.
    relatedRules:
      - TASTE-5
      - BRAND-1
doesNotDecide: |-
  Which action deserves the dominant emphasis is [CTA](../composition/cta.yaml) and
  [Accent](../composition/accent.yaml), what holds a collection is
  [Collection](../composition/collection.yaml), and what the design specification must enumerate is
  [Coverage](../composition/coverage.yaml). Whether the chosen colours survive measurement is
  [Contrast](contrast.yaml), whether the surface is good enough to ship once it is on-brand is
  [Taste](taste.yaml), and whether every rendered claim traces to authority is
  [Render truth](render-truth.yaml). Whether the brand record itself matches the shipped stylesheet is the
  brand record's own machine check, not an observation of this capture.
