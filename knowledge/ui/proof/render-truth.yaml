schema: starci/knowledge-source@1
id: ui.proof.render-truth
title: Render truth proof
appliesTo:
  - ui
family: proof
purpose: |-
  This file answers one question: does every visible and announced claim on the rendered page trace
  back to something the product actually established?
  A claim is anything the page asserts: a word, a glyph, a tone, a state, a live announcement, a
  promise of recovery. The audit inventories the claims that were rendered and traces each to its
  source. A claim with no source is invented, whichever layer invented it.
rules:
  - id: TRUTH-1
    title: Neutral facts stay neutral
    governs: |-
      Governs content that authority supplied without any status attached.
    cases:
      - id: case-1
        when: Authority supplied a plain fact
        observe: |-
          It renders as ordinary text with no status role, no success or error state, and no urgency. An alert role on default text falsifies it
      - id: case-2
        when: A glyph, a tone, or a placement was added around the fact
        observe: |-
          None of them reads as an outcome or an endorsement. A tick mark and a success treatment on a capability statement falsifies it
      - id: case-3
        when: A family paints the region
        observe: |-
          Neutral facts stay neutral under that paint. A whole set of plan facts painted as warnings falsifies it
      - id: case-4
        when: The state or the viewport changes
        observe: |-
          The claim is re-inventoried there, because a fact that was neutral at one width may not be at another
  - id: TRUTH-2
    title: Availability follows authority
    governs: Governs claims about what the current reader may do.
    cases:
      - id: case-1
        when: Authority confirms a static capability is unavailable here
        observe: |-
          The row carries `state="unavailable"` with an exact label and a description naming the verified condition. Copy implying the feature is already enabled falsifies it
      - id: case-2
        when: |-
          The unavailable thing is a command rather than a static capability
        observe: |-
          The action owner carries `isDisabled`, and the disabled semantics are in the rendered output
      - id: case-3
        when: The state mark alone would be the evidence
        observe: |-
          It is decorative or absent here, so the accessible truth still depends on the supplied text. Inferring a spoken unavailable status from paint falsifies it
      - id: case-4
        when: An action is visible and is taken as proof of permission
        observe: |-
          Visibility is not permission. Permission is resolved from authority and then drives the real owner
      - id: case-5
        when: A family paints the unavailable row
        observe: |-
          It stays inactive. Affirmative paint over an unavailable fact falsifies it
  - id: TRUTH-3
    title: Progress is not an outcome
    governs: Governs the boundary between work in flight and a result.
    cases:
      - id: case-1
        when: A command has accepted work
        observe: |-
          Progress stays on that command, its label survives, and duplicate activation is blocked while the work runs
      - id: case-2
        when: A result is claimed
        observe: |-
          Authority confirmed it first. A success message rendered while the request is still pending falsifies it
      - id: case-3
        when: Navigation is claimed
        observe: |-
          The navigation effect actually exists. A message saying the reader is being taken somewhere, when nothing started, falsifies it, and a navigation status rendered as an error falsifies it twice
      - id: case-4
        when: Pending and outcome would occupy the same moment
        observe: |-
          They do not. A family painting affirmative over a pending control falsifies the current state
      - id: case-5
        when: A recovery or a route is stated in the copy
        observe: |-
          It exists and can be reached. A promised retry with no wired recovery falsifies the promise
  - id: TRUTH-4
    title: Claim evidence and falsifiers
    governs: Governs what closes a render-truth claim.
    cases:
      - id: case-1
        when: Any reachable state is being closed
        observe: |-
          Every claim carried by text, icon, shape, tone, placement, motion, native state, live region, and accessibility semantics is inventoried in that state
      - id: case-2
        when: A claim has been inventoried
        observe: |-
          It is traced to business authority, the current runtime result, the current permission, and the effect or recovery that actually exists
      - id: case-3
        when: The state, the theme, or the viewport changes
        observe: |-
          The inventory is rerun there. One theme or one stale-and-refreshed state left unchecked closes nothing
      - id: case-4
        when: A family or the application adds a delta
        observe: |-
          The isolated published output, the family delta, the application delta, and the current pixels are compared separately
      - id: case-5
        when: Copy review or source props are offered as the evidence
        observe: |-
          They are not sufficient. A rendered claim is proved by the rendered output and its traced authority
  - id: TRUTH-5
    title: The render-truth verdict
    governs: |-
      Governs how selected observations are summarized in the current `.starciwork` node's evidence.
    cases:
      - id: case-1
        when: The lens runs
        observe: |-
          `TRUTH-1` to `TRUTH-4` are judged on every capture that renders a fact, an availability, a progress signal or an outcome, each traced to the authority behind it
      - id: case-2
        when: The verdict is computed
        observe: |-
          The gating set is the whole set: `pass` requires every criterion to pass, because one claim the page cannot back is one claim a reader will act on
      - id: case-3
        when: |-
          There is no store or authority the claims can be checked against
        observe: |-
          The verdict is `blocked`. Approving claims because they look plausible falsifies it
      - id: case-4
        when: A failure has been measured
        observe: |-
          Record an incorrectly designed claim separately from missing product authority; name the source needed to verify the fact. Do not fabricate authority or dispatch another op.
    notes:
      - |-
        The scored set is `TRUTH-1` to `TRUTH-4`; this rule only summarizes and is not itself scored.
      - |-
        Store assertions, observations and artifact references in the selected node's evidence; there is
    remark: |-
      no separate receipt table or downstream verdict-copying rule. Missing evidence never earns a pass.
doesNotDecide: |-
  Which rank a fact receives is [Hierarchy](../composition/hierarchy.yaml), which conditions exist and
  which carrier holds each is [State](../composition/state.yaml), and where a message belongs is
  [Feedback](../composition/feedback.yaml). Whether the claim is announced correctly is
  [Accessibility](accessibility.yaml), whether movement implies it is [Motion](motion.yaml), and whether
  the reader can reach the control that acts on it is [Focus](focus.yaml).
