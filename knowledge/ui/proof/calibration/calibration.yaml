schemaVersion: 9
note: Reference calibration dataset, not a Work metadata schema or execution policy. When its rubric
  is selected, score the three anchor sheets beside the assessed surface; an anchor beyond the
  published tolerance makes the numeric comparison uncalibrated. Store observations in the selected
  .starciwork node's evidence. The ux bands cover only criteria answerable from a still render,
  never behavioral UAT or proof of a real task run. No receipt, dispatcher, automatic retry or
  product mutation is authorized by this dataset.
tolerance: 1
lenses:
  taste: TASTE-13
  ux: UX-12
anchors:
  - id: anchor-low
    file: anchor-low.html
    bands:
      taste:
        - 1
        - 2
      ux:
        - 1
        - 2
    why: no single largest element, a 180px band whose only occupant is an ornament, four filled
      accents, drifting left edges, five type sizes, a half-empty grid row, module names as labels
      and bare numbers
  - id: anchor-mid
    file: anchor-mid.html
    bands:
      taste:
        - 3
        - 3
      ux:
        - 3
        - 3
    why: edges aligned, one radius family, three type sizes and warnings marked, but the title barely
      outranks its sections, two filled accents compete, one number carries no unit and the empty
      state explains without offering the action
  - id: anchor-high
    file: anchor-high.html
    bands:
      taste:
        - 4
        - 5
      ux:
        - 4
        - 5
    why: one focal point a scale step above every section, monotonic rhythm, one accent on one action,
      every number with its unit, warnings visibly distinct, a designed empty state with the action
      that ends it, and the primary action pinned within reach when narrow
