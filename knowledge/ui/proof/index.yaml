schema: starci/knowledge-source@1
id: ui.proof
title: UI proof
appliesTo:
  - ui
family: proof
purpose: |-
  Proof is the decision layer that only exists after the page has rendered:
  ```text
  business
  -> composition decides regions, rank, actions, states and emphasis
  -> presentation resolves CSS values on app-owned boundaries
  -> rendered UI  <- proof observes here
  ```
  Every rule in this folder is consumed by the audit operator, with one exception named in the catalog
  below: [UX](ux.yaml) is read by `uat.verify` as well, because most of its criteria are answered by a task
  run rather than by a capture. That operator has no access to intent,
  only to output: the accessibility tree that was computed, the element that actually holds focus, the
  frame where the animation stopped, and the claim the page ended up making. These topics belong
  together because none of them can be established by reading source. A `:focus-visible` rule does not
  prove a visible indicator, a `label` prop does not prove a computed name, a `motion` attribute does
  not prove a transition, and an approved copy deck does not prove what the rendered page asserts.
  Each rule therefore states the observation that would falsify it, so a passing verdict always names
  something that was looked at.
topics:
  - title: Accessibility
    path: accessibility.yaml
    decides: Whether names, relationships, targets and contrast reach every reader
    rules: A11Y-1 to A11Y-5
  - title: Contrast
    path: contrast.yaml
    decides: Whether distinctions and text survive measurement in every theme and state
    rules: COLOR-3, COLOR-5, CONTRAST-1
  - title: Focus
    path: focus.yaml
    decides: Where focus is visible, how far it travels, and where it returns
    rules: FOCUS-1 to FOCUS-6
  - title: Motion
    path: motion.yaml
    decides: Whether meaning survives with the movement stopped, reduced or interrupted
    rules: MOTION-1 to MOTION-5
  - title: Render truth
    path: render-truth.yaml
    decides: Whether every rendered claim traces back to real authority
    rules: TRUTH-1 to TRUTH-5
  - title: Taste
    path: taste.yaml
    decides: Whether a surface that passes every canon rule is still good enough to ship
    rules: TASTE-1 to TASTE-13
  - title: UX
    path: ux.yaml
    decides: Whether a person with a task actually finished it on the running product
    rules: UX-1 to UX-12 (read by `uat.verify`)
  - title: Calibration
    path: calibration/calibration.json
    decides: "The scale a scored lens is proved on: three anchor sheets
      (`calibration/anchor-low.html`, `anchor-mid.html`, `anchor-high.html`),
      each with the `taste` and `ux` band it is expected to land in and the
      one-line reason, plus the tolerance; read by TASTE-13 Case 9"
    rules: data, no rule of its own
catalogNotes: |-
  Each topic keeps its criteria and aggregation rule. Select applicable criteria in the `.starciwork`
  node before verification and bind assertions to actual runtime evidence. Rubric labels
  `ship`, `fix-first`, `blocked` are assessment conclusions, not node states or release authority.
  No receipt, response table, dispatcher or copied verdict is required between ops.
  Missing evidence, failing required assertions and unapproved scope cannot become `done`.
  One topic is retired here. `UI-1` to `UI-11` were a scorecard file that named the lenses and pointed
  at the rules that owned them; every one of them now resolves to the topic rule that survived, and
  those numbers are never reused. The mapping is recorded in
  [the consolidation evidence](https://github.com/starci183/starci-skills/blob/edf72554425f918e80c9205e9c6db10596e722f0/tests/evidence/20260903-consolidation.json).
guidance:
  - id: rule-shape
    requirement: |-
      `A11Y-1`, `FOCUS-5`, and the other `PREFIX-n` names are stable ordinal addresses within their topic.
      The number is not a severity or a conformance level. A topic may publish a non-contiguous series:
      `contrast.json` publishes only `COLOR-3`, `COLOR-5` and `CONTRAST-1`, because the other numbers of that
      prefix were retired with the topic they came from and are never reused, and the whole `UI-` prefix is
      retired.
      Every rule carries its heading, one line naming what the rule governs, and one table:
      | Case | When | Observe |
      | --- | --- | --- |
      | Case 1 | The concrete rendered situation that reaches this rule. | The exact runtime evidence, and what seeing it would falsify. |
      The `Observe` cell names a thing that can be captured from the running page — a computed name, an
      active element, a measured rectangle, a computed duration, a traced result — and says what a
      contrary observation would disprove. It never restates an intention.
      A case that belongs to a neighbouring rule is not a table row. It goes on one line after the table,
      as `Not this rule: <condition> is PREFIX-n`. Each file closes with a
      `## What this file does not decide` section linking its siblings and the composition knowledge that
      made the decision being tested.
      Component/prop examples describe the documented Grammar family. Verify the selected project's
      actual installed API/source before applying them; not every product uses this family. Record
      capability gaps with source evidence, not automatic library-edit authority or invented APIs.
      Historical-note links are provenance, not executable instructions or current product evidence.
