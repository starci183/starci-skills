schema: starci/knowledge-source@1
id: ui.composition.collection
title: Collection composition
appliesTo:
  - ui
family: composition
purpose: |-
  This file answers one question: when the page shows several of the same thing, what holds them?
  A collection and an item are two different compositions, and the commonest defect in a drawn interface
  is to confuse them: the direction wraps a list of entities in a card because a card looks tidy, and the
  reader is told that the whole list is one object with one boundary, one heading and one action. The
  page then has to invent a second heading inside that boundary, the rows lose their own affordances, and
  every later decision about rank, emphasis and scrolling is made inside a container that should not have
  existed. This is decided while the page is still a description, because no later CSS value repairs it.
  Applicability: composition names here describe the documented Grammar family; verify the installed
  source and the selected `.starciwork` specification before use. Gap labels are findings, not dispatch
  commands.
ownerVocabulary:
  owners:
    - name: A page section
      meaning: A region of the page introduced by its own heading, holding a collection
    - name: A card
      meaning: One bounded object presenting one item's face to the page
    - name: A row
      meaning: One member of a collection, inside the collection's own container
  notes: |-
    Wrapping a collection in a card is a composition defect, not a presentation preference: it is settled
    before any class is written and no border, radius or padding value repairs it afterwards. Where the
    grammar publishes no container for the collection the direction needs, record the gap and the proposed
    owner; adding a reusable composition requires separately authorized library scope.
rules:
  - id: COLLECTION-1
    title: A list of entities is a section, never a card
    governs: |-
      Governs what holds several instances of the same kind of thing.
    cases:
      - id: case-1
        when: The page shows three or more instances of one kind of entity
        assert: |-
          The specification places them in a page section introduced by its own heading, and names no card as their wrapper
      - id: case-2
        when: |-
          The collection needs a title, a count, a filter or an action of its own
        assert: |-
          They belong to the section's heading region, above the collection, and not to a boundary drawn around the rows
      - id: case-3
        when: |-
          The direction is tempted to wrap the collection so it reads as one block
        assert: |-
          The grouping is carried by the heading and the spacing of the section; no bounded surface encloses the rows to achieve it
      - id: case-4
        when: The rendered markup of the collection is read
        assert: |-
          No card surface is an ancestor of the list, table or repeated-row container that holds the entities
      - id: case-5
        when: |-
          A published collection container exists for this kind of collection
        assert: |-
          The specification names that container and supplies only the rows and labels into it
      - id: case-6
        when: The grammar publishes no container for the collection the page needs
        assert: |-
          A gap names the missing container, and no substitute card appears in the tree
    notThisRule: |-
      which of several regions carries the strongest anchor is HIERARCHY-2, and which face a bounded object
      presents once it is composed is SURFACE-2.
    relatedRules:
      - SURFACE-2
      - TASTE-7
      - HIERARCHY-2
      - COVERAGE-1
  - id: COLLECTION-2
    title: A card is one item
    governs: |-
      Governs what a bounded surface is allowed to contain.
    cases:
      - id: case-1
        when: A card is proposed
        assert: |-
          It presents exactly one entity, or one summary of one subject, and the specification names which one
      - id: case-2
        when: |-
          A card would hold several kinds of content belonging to one subject
        assert: |-
          They are bands of that one card, divided by rules rather than by further cards, and the card still presents one subject
      - id: case-3
        when: A row of the collection needs its own boundary
        assert: |-
          The boundary belongs to the row, not to the collection; the rows are peers with equal treatment, and no card encloses them all
      - id: case-4
        when: Card nesting is proposed
        assert: |-
          No card sits inside a card to group repeated content; a second boundary inside the first must name a different subject
      - id: case-5
        when: The reader is meant to compare the items
        assert: |-
          Comparison is carried by equal rows in one section, not by equal cards that each repeat the collection's own heading
    notThisRule: |-
      how deeply cards may nest once they are composed, and whether equal peers carry equal elevation, is
      observed after rendering as TASTE-7.
    relatedRules:
      - SURFACE-2
      - TASTE-7
      - HIERARCHY-2
      - COVERAGE-1
doesNotDecide: |-
  Which visible task regions exist at all is [Layout](layout.yaml), which rank the content inside them
  carries is [Hierarchy](hierarchy.yaml), how the collection recomposes as space changes is
  [Responsive](responsive.yaml), which action a row carries is [CTA](cta.yaml) and [Action](action.yaml),
  and what the specification must enumerate about the collection's states is [State](state.yaml) and
  [Coverage](coverage.yaml). Which surface token a bounded object takes once it is composed is
  [Surface](../presentation/surface.yaml). Whether the rendered result obeyed this direction is observed
  afterwards, in [Taste](../proof/taste.yaml) and [Brand](../proof/brand.yaml).
