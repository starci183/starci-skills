schema: starci/knowledge-source@1
id: ui.presentation.measure
title: Measure presentation
appliesTo:
  - ui
family: presentation
purpose: |-
  This file answers one question: how much room does an application-owned content region take?
  Composition has already chosen the DOM tree and the Grammar objects. Measure resolves width and
  height constraints on regions the application owns. The internal dimensions of a card, input, control,
  or shell belong to Grammar.
ownerVocabulary:
  owners:
    - name: App
      meaning: The region belongs to the application
      applicationWrites: The class
    - name: A component name
      meaning: Common already constrains this dimension
      applicationWrites: Nothing. Pass the prop
    - name: —
      meaning: Common exposes no public path
      applicationWrites: The class, recorded as a workaround
  notes: |-
    Every region that can receive long content also carries `min-w-0`. Without it a flex or grid child
    refuses to shrink below its content and pushes its neighbours out of the viewport. Common applies it
    throughout its own renderers; an application region that wraps text must do the same.
componentOwnership:
  title: Measure Common already owns
  notes: |-
    Retained ownership reference, not proof of the current package/API. Verify actual installed source/props/tokens before use; correct outdated rows within selected maintenance scope using [source and maintenance](index.yaml#source-and-maintenance).
  rows:
    - component: Button
      element: root, width="fill"
      rule: MEASURE-2
    - component: HorizontalScrollRegion
      element: root
      rule: MEASURE-3
    - component: NavigationFeatureNav
      element: root
      rule: MEASURE-2
    - component: PageContainer
      element: root
      rule: MEASURE-1
    - component: PressableField
      element: root
      rule: MEASURE-2
    - component: Progress
      element: root
      rule: MEASURE-2
    - component: Rail
      element: body, height="fill"
      rule: MEASURE-6
    - component: Sidebar
      element: root, presentation!="drawer"
      rule: MEASURE-6
    - component: Sidebar
      element: root, presentation="drawer"
      rule: MEASURE-2
    - component: TextAction
      element: root
      rule: MEASURE-3
    - component: VerticalScrollRegion
      element: root, isScrollable
      rule: MEASURE-7
    - component: WorkspaceShell
      element: layout
      rule: MEASURE-1
topics:
