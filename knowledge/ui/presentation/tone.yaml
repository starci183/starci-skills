schema: starci/knowledge-source@1
id: ui.presentation.tone
title: Tone presentation
appliesTo:
  - ui
family: presentation
purpose: |-
  This file answers one question: given a line of copy whose rank is already decided, which public tone
  prop expresses that rank?
  Tone is a semantic choice, not a colour choice. The application selects how much attention a line
  deserves; Grammar resolves that to a token. The application never writes a text colour class and
  never overrides colour inside another Grammar component.
ownerVocabulary:
  owners:
    - name: A component name
      meaning: "`Text` resolves this tone"
      applicationWrites: The prop only
    - name: —
      meaning: The meaning has no public tone
      applicationWrites: Nothing. Report the gap
  notes: |-
    Tone belongs to Grammar. The owner cell names which component resolves the token.

    There is no `App` owner in this file. A `text-*` colour class written by the application is
    `APP_OVERRIDE`, and a raw hex or palette value is rejected even when it matches the token.
    Status colour is not tone. Success, warning, danger, and information are semantic states owned by the
    components that carry them, and they are never expressed by choosing a text colour.
scale:
  steps:
    - id: TONE-1
    - id: TONE-2
    - id: TONE-3
  notes: |-
    The public tone set is closed and ordered by how much attention each level claims.

    `Text size="xs"` resolves to muted regardless of the tone requested, because the smallest size is
    supporting information by definition. `Heading level={4}` carries the same muted treatment. Asking
    for another tone at that size does not raise it.
componentOwnership:
  title: Tone Common already owns
  notes: |-
    Retained ownership reference, not proof of the current package/API. Verify actual installed source/props/tokens before use; correct outdated rows within selected maintenance scope using [source and maintenance](index.yaml#source-and-maintenance).
  rows:
    - component: ChatWorkspace
      element: drawer close, hasRail, isCompactRail
      rule: TONE-1
    - component: ChatWorkspace
      element: rail trigger, hasRail, isCompactRail
      rule: TONE-1
    - component: Heading
      element: root, scale!="display", level=4
      rule: TONE-2
    - component: IconTile
      element: root, not (isSkeleton
    - component: Input
      element: reveal, not (!isSecret
    - component: PressableField
      element: placeholder
      rule: TONE-2
    - component: PressableField
      element: root
      rule: TONE-1
    - component: PressableField
      element: shortcut, shortcut!=undefined
      rule: TONE-2
    - component: Sidebar
      element: item
      rule: TONE-1
    - component: Sidebar
      element: section label, group.label!=undefined, not collapsed
      rule: TONE-2
    - component: SurfaceAccordionCard
      element: div
      rule: TONE-1
    - component: SurfaceListCard
      element: fact, not (label === undefined
    - component: Text
      element: root, not isSkeleton, resolvedTone="accent"
      rule: TONE-3
    - component: Text
      element: root, not isSkeleton, resolvedTone="default"
      rule: TONE-1
    - component: Text
      element: root, not isSkeleton, resolvedTone="muted"
      rule: TONE-2
    - component: TextAction
      element: root, appearance="disclosure"
      rule: TONE-3
    - component: TextAction
      element: root, appearance="muted"
      rule: TONE-2
    - component: TextAction
      element: root, appearance="plain"
      rule: TONE-1
    - component: TextAction
      element: root, appearance="route", isCurrent
      rule: TONE-3
    - component: TextAction
      element: root, appearance="route", not isCurrent
      rule: TONE-2
    - component: TextAction
      element: root, appearance="section", isCurrent
      rule: TONE-3
    - component: TextAction
      element: root, appearance="section", not isCurrent
      rule: TONE-1
    - component: TextAction
      element: root, appearance="tab", not isCurrent
      rule: TONE-2
guidance:
  - id: contrast
    title: Contrast
    requirement: |-
      Tone tokens are defined against the surface they sit on. A tone chosen on one surface and rendered on
      another is a contrast finding, not a preference, and it is measured against the composed background
      rather than the intended one.
      The application changes the surface, never the token, when contrast fails.
rules:
  - id: TONE-1
    title: '`tone="default"`'
    governs: |-
      The line reads at ordinary attention. This is the resolved tone when none is given, except at the
      smallest size.
    cases:
      - id: case-1
        when: |-
          Copy or a fact the application ranked as normal reading content
        owner: "`Text`"
        render: '`<Text tone="default">Enrollment is active.</Text>`'
      - id: case-2
        when: |-
          The body of a paired title and explanation where both must be read
        owner: "`Text`"
        render: Both lines stay default; weight separates them
    notThisRule: |-
      making lower-rank metadata compete with the content beside it. Use TONE-2.
  - id: TONE-2
    title: '`tone="muted"`'
    governs: |-
      The line recedes on purpose, because something next to it carries the meaning.
    cases:
      - id: case-1
        when: |-
          A qualifier, unit, or timestamp attached to a fact stated nearby
        owner: "`Text`"
        render: |-
          `<Text tone="muted">Taxes are calculated at checkout.</Text>`
      - id: case-2
        when: |-
          The description under a title, where the title carries the identity
        owner: "`Text`"
        render: '`<Text size="sm" tone="muted">Ready for junior roles</Text>`'
      - id: case-3
        when: Any line at the smallest size
        owner: "`Text`"
        render: '`size="xs"` already resolves to muted'
    notThisRule: |-
      the only sentence explaining an important fact, or hiding copy that is simply too long. Muting an explanation nobody else states removes it from the page in practice.
  - id: TONE-3
    title: '`tone="accent"`'
    governs: |-
      One short span stands out because its meaning is already exceptional in context.
    cases:
      - id: case-1
        when: |-
          A single short label whose emphasis the application has already decided
        owner: "`Text`"
        render: '`<Text tone="accent" weight="semibold">Recommended</Text>`'
    notThisRule: |-
      whole paragraphs, repeated peers, or decoration. Accent repeated across siblings stops marking anything. Accent also never carries meaning alone, because colour is not readable by every reader.
doesNotDecide: |-
  How large or heavy the line is set is [Font](font.yaml). Which surface it sits on, and the semantic
  colour of that surface, are outside presentation entirely.
