schema: starci/knowledge-source@1
id: ui.presentation.overflow
title: Overflow presentation
appliesTo:
  - ui
family: presentation
purpose: |-
  This file answers one question: when content exceeds its region, which boundary owns that, and what
  does it do?
  Composition has chosen the tree and [Measure](measure.yaml) has bounded the region. Overflow resolves
  what happens at the edge of a boundary the application owns. Clipping and scrolling inside a card,
  rail, table frame, or shell belong to Grammar.
ownerVocabulary:
  owners:
    - name: App
      meaning: The boundary belongs to the application
      applicationWrites: The class
    - name: A component name
      meaning: Common already owns this boundary
      applicationWrites: Nothing. Compose it
    - name: —
      meaning: Common exposes no public path
      applicationWrites: The class, recorded as a workaround
  notes: |-
    A scroll boundary is never written alone. It travels with a bound from [Measure](measure.yaml), because
    a region with no height cap never overflows and its scroll class does nothing.
componentOwnership:
  title: Overflow Common already owns
  notes: |-
    Retained ownership reference, not proof of the current package/API. Verify actual installed source/props/tokens before use; correct outdated rows within selected maintenance scope using [source and maintenance](index.yaml#source-and-maintenance).
  rows:
    - component: ChatWorkspace
      element: conversation
      rule: OVERFLOW-4
    - component: ChatWorkspace
      element: conversation
      rule: OVERFLOW-5
    - component: ChatWorkspace
      element: drawer body, hasRail, isCompactRail
      rule: OVERFLOW-2
    - component: ChatWorkspace
      element: overlay rail, hasRail, isCompactRail
      rule: OVERFLOW-4
    - component: ChatWorkspace
      element: overlay rail, hasRail, isCompactRail
      rule: OVERFLOW-5
    - component: ChatWorkspace
      element: overlay rail, hasRail, not isCompactRail
      rule: OVERFLOW-4
    - component: ChatWorkspace
      element: overlay rail, hasRail, not isCompactRail
      rule: OVERFLOW-5
    - component: FencedCodeBlock
      element: root
      rule: OVERFLOW-4
    - component: HorizontalScrollRegion
      element: root
      rule: OVERFLOW-5
    - component: HorizontalScrollRegion
      element: root, overflow!="needed"
      rule: OVERFLOW-3
    - component: HorizontalScrollRegion
      element: root, overflow="needed"
      rule: OVERFLOW-4
    - component: IconTile
      element: root
      rule: OVERFLOW-2
    - component: MarkdownTableFrame
      element: root
      rule: OVERFLOW-4
    - component: MediaFrame
      element: root
      rule: OVERFLOW-2
    - component: OtpInput
      element: root
      rule: OVERFLOW-3
    - component: OtpInput
      element: root
      rule: OVERFLOW-5
    - component: Rail
      element: body, height!="fill"
      rule: OVERFLOW-3
    - component: Sidebar
      element: root
      rule: OVERFLOW-2
    - component: SurfaceAccordionCard
      element: accordion shell
      rule: OVERFLOW-2
    - component: SurfaceAccordionCard
      element: accordion shell, not bounded
      rule: OVERFLOW-1
    - component: SurfaceCard
      element: card content, frame!="frameless"
      rule: OVERFLOW-2
    - component: SurfaceCard
      element: card content, frame="frameless"
      rule: OVERFLOW-1
    - component: SurfaceListCard
      element: root
      rule: OVERFLOW-2
    - component: VerticalScrollRegion
      element: root, isScrollable, overflow!="needed"
      rule: OVERFLOW-3
    - component: VerticalScrollRegion
      element: root, isScrollable, overflow="needed"
      rule: OVERFLOW-4
    - component: WorkspaceShell
      element: floating layer, hasFloatingLayer
      rule: OVERFLOW-4
