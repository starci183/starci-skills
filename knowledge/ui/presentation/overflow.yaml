catalogNotes: |-
  Exactly one boundary owns each axis. Two nested scrollers on the same axis trap the reader between
  them, and neither reaches the end reliably.
rules:
  - id: OVERFLOW-1
    title: Visible
    governs: |-
      The boundary does not clip, because something must be allowed to cross it.
    cases:
      - id: case-1
        when: |-
          A region whose child carries a focus ring, shadow, or badge that sits outside the box
        owner: "`App`"
        render: No class. Visible is the default
      - id: case-2
        when: A surface that must not clip its own highlight
        owner: "`SurfaceCard`"
        render: The frameless variant already stays visible
    notThisRule: |-
      leaving a bounded region visible to avoid deciding. Content that escapes silently overlaps whatever follows it.
  - id: OVERFLOW-2
    title: Clipped
    governs: Content is cut at the boundary and cannot be reached.
    cases:
      - id: case-1
        when: A rounded region whose children must stay inside the radius
        owner: "`SurfaceCard`"
        render: Compose the card; it already clips
      - id: case-2
        when: A media viewport that crops its image to a fixed frame
        owner: "`MediaFrame`"
        render: Compose the frame; it already clips
      - id: case-3
        when: |-
          An app-owned decorative region whose overflow carries no information
        owner: "`App`"
        render: "`overflow-hidden`"
    notThisRule: |-
      text that does not fit. That is [Text flow](text-flow.yaml), and it truncates visibly rather than disappearing.
    remark: |-
      Clipping content the reader needs is silent data loss. It looks correct in a screenshot at one width
      and fails at another, which is why it is the hardest overflow defect to find.
  - id: OVERFLOW-3
    title: Scrolls on one axis
    governs: |-
      The boundary always scrolls one axis, because its content is expected to exceed it.
    cases:
      - id: case-1
        when: A row of items intentionally wider than the viewport
        owner: "`HorizontalScrollRegion`"
        render: Compose the region
      - id: case-2
        when: A bounded panel or list whose content grows
        owner: "`VerticalScrollRegion`"
        render: Compose the region
      - id: case-3
        when: A rail body that scrolls while its shell stays put
        owner: "`Rail`"
        render: Compose the rail
    notThisRule: |-
      a region whose content usually fits. Use OVERFLOW-4 so the bar appears only when it means something.
    remark: |-
      The other axis stays clipped or visible on purpose. A region that scrolls both axes hides content in
      a direction the reader has no reason to look.
  - id: OVERFLOW-4
    title: Scrolls when needed
    governs: The boundary scrolls only when content actually exceeds it.
    cases:
      - id: case-1
        when: A wide table inside a narrower column
        owner: "`MarkdownTableFrame`"
        render: Compose the frame
      - id: case-2
        when: Long code lines that must not wrap
        owner: "`FencedCodeBlock`"
        render: Compose the block
      - id: case-3
        when: A tab strip that exceeds its width only in some languages
        owner: "`Tabs`"
        render: Compose the tabs
      - id: case-4
        when: |-
          An app-owned bounded region whose content sometimes exceeds it
        owner: "`App`"
        render: "`overflow-auto` with the matching height cap"
    notThisRule: |-
      an always-visible bar on a region that usually fits, which reads as a defect the first time a reader sees it empty.
  - id: OVERFLOW-5
    title: Contained
    governs: |-
      Scrolling stops at this boundary instead of continuing into the page behind it.
    cases:
      - id: case-1
        when: A scrolling panel, drawer, or overlay above page content
        owner: "`—`"
        render: "`overscroll-contain` with the scroll rule"
      - id: case-2
        when: A horizontal row inside a vertically scrolling page
        owner: "`HorizontalScrollRegion`"
        render: Compose the region; it already contains the inline axis
    notThisRule: |-
      containment on the page's own scroller, which would trap the reader.
    remark: |-
      Without containment, reaching the end of the inner region hands the gesture to the page and the
      reader loses their place. On a touch device the effect is worse, because the page moves under a
      finger that was scrolling something else.
doesNotDecide: |-
  How large the region is, and whether it has a height cap at all, is [Measure](measure.yaml). What text
  does when it does not fit is [Text flow](text-flow.yaml).
