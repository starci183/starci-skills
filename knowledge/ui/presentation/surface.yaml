schema: starci/knowledge-source@1
id: ui.presentation.surface
title: Surface presentation
appliesTo:
  - ui
family: presentation
purpose: |-
  This file answers one question: given a region the application already decided to render, which
  semantic surface token does that region take, and which foreground token pairs with it?
  A surface and its foreground always travel together. The application never picks a background alone,
  because a background chosen without its paired foreground leaves the copy on top of it unmeasured,
  which is a contrast defect rather than a preference. Paint inside a Grammar object belongs to
  Grammar; this file resolves only the faces the application owns.
ownerVocabulary:
  owners:
    - name: App
      meaning: The region belongs to the application
      applicationWrites: The class pair
    - name: A component name
      meaning: Grammar already paints this face
      applicationWrites: Nothing. Pass the prop
    - name: —
      meaning: Grammar exposes no public path for this face
      applicationWrites: The class pair, recorded as a workaround
  notes: |-
    Each case names who owns the face. The owner decides whether the application writes a class at all.

    Writing a class where a component is the owner is `APP_REIMPLEMENTATION`. Writing one where the owner
    is `—` stays linked to `COMMON_CAPABILITY_MISSING`. Reaching into a Grammar component with a selector
    or a passed class to repaint it is `APP_OVERRIDE`.
componentOwnership:
  title: Surfaces Common already owns
  notes: |-
    Retained ownership reference, not proof of the current package/API. Verify actual installed source/props/tokens before use; correct outdated rows within selected maintenance scope using [source and maintenance](index.yaml#source-and-maintenance).
  rows:
    - component: ChatWorkspace
      element: drawer close, hasRail, isCompactRail
      rule: SURFACE-2
    - component: ChatWorkspace
      element: rail trigger, hasRail, isCompactRail
      rule: SURFACE-2
    - component: IconTile
      element: root, not (isSkeleton
    - component: IconTile
      element: root, not (isSkeleton
    - component: MediaFrame
      element: root, treatment!="plain"
      rule: SURFACE-3
    - component: MediaFrame
      element: root, treatment="plain"
      rule: SURFACE-1
    - component: PressableField
      element: root
      rule: SURFACE-4
    - component: Sidebar
      element: item
      rule: SURFACE-4
    - component: SurfaceAccordionCard
      element: accordion shell, bounded
      rule: SURFACE-2
    - component: SurfaceAccordionCard
      element: accordion shell, not bounded
      rule: SURFACE-1
    - component: SurfaceCard
      element: card content, frame!="frameless"
      rule: SURFACE-2
    - component: SurfaceCard
      element: card content, frame="frameless"
      rule: SURFACE-1
    - component: SurfaceCard
      element: root, wholeAction!=undefined
      rule: SURFACE-4
    - component: SurfaceListCard
      element: root
      rule: SURFACE-2
    - component: TextAction
      element: root, isCurrent, appearance="choice"
      rule: '"route"'
topics:
