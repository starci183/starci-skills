schema: starci/knowledge-source@1
id: application-stacks
title: Complete application stacks for development and Ubuntu VPS
purpose: |
  Author a reproducible deployment of the whole selected application, with encrypted
  credentials and verified lifecycle. Accepted architecture decides its components.
  This knowledge does not authorize app changes or deployment. Kubernetes is deferred.
appliesTo: [backend, frontend, runtime]
family: cross-cutting
provenance:
  readAt: '2026-09-15'
  sources:
    - https://docs.docker.com/compose/how-tos/use-secrets/
    - https://docs.docker.com/compose/how-tos/startup-order/
    - https://docs.docker.com/reference/compose-file/include/
    - https://docs.docker.com/engine/install/ubuntu/
    - https://docs.docker.com/engine/swarm/stack-deploy/
    - https://docs.docker.com/engine/swarm/secrets/
    - https://getsops.io/docs/
  limitations: |
    Repository audits motivate the rules, not certification. The bundled synthetic stack
    covers a small app, not all apps or Ubuntu hosts. Recheck official versions and image
    behavior when authoring. Static checks cannot prove that an inventory is truthful.
guidance:
  - id: STACK-SCOPE
    requirement: |
      .stacks is the application-owned deployment package for the whole app. Inventory actual
      frontend, APIs, workers, scheduled/init/migration jobs, stateful services, ingress and
      external dependencies from accepted architecture. Include only applicable components.
      Give every component an environment-specific managed service, explicit external binding
      or justified exclusion. Bind multi-repo build contexts/revisions without adjacent-clone assumptions.
  - id: STACK-OWNERSHIP
    requirement: |
      Ownership, network location and failure domain are distinct. Outside Kubernetes does
      not mean outside the application's managed stack. A different container/project/key
      does not establish independent recovery. External storage names its owner, endpoint
      reference, access scope and tolerated failures. Resolve host/container/remote addresses
      separately; never reuse app storage credentials as independent backup by inference.
  - id: STACK-DEV
    requirement: |
      Dev defaults to Docker Compose and cold-starts the whole selected app on a clean supported
      machine with Docker Linux containers and declared bootstrap tools, without host app runtimes, forgotten files,
      manual realms or unnamed volumes. Provide one prepare/up path, health-gated idempotent
      init/migration jobs, application readiness and a dependency-backed smoke journey.
      Generate declared local service secrets once, encrypt and reuse them. Provider-issued
      credentials are researched owner inputs only for enabled features requiring them.
  - id: STACK-SECRETS
    requirement: |
      Keep encrypted artifacts and public recipient metadata versioned. Store the decryption
      identity outside Git/images/ciphertext bundle; specify owner, secure import, backup,
      recovery and rotation. Existing ciphertext with a missing key must fail, never trigger
      replacement generation. Use reviewed SOPS/age or a declared custody adapter. Generate
      locally owned secrets with a cryptographic RNG and the consumer's format; separate dev
      from production values and preserve them on retries. File encryption does not rotate
      an already configured database account or restore an old archive without its original key.
  - id: STACK-MATERIALIZE
    requirement: |
      Compose secrets bind-mount runtime files; they are not encrypted storage or protection
      from host/Docker administrators. Decrypt into private staging, validate every required
      nonempty regular file, deny symlink/path escapes and expose the complete set with proper
      permissions. Clean failed staging; retain source files while container recreation needs
      them. Mount only to named consumers and verify each image's actual _FILE support.
      Values never enter argv, image layers, Compose environment, printed config, logs, model
      context or evidence. Rotation coordinates server/client activation and verification.
      VPS Swarm instead uses immutable versioned engine secrets, created through private stdin
      and granted to exact services. Retained plaintext Compose mount files are not the Swarm
      custody model. Preserve encrypted source and recovery identities; stage new secret names,
      update and verify consumers, then retire old names only when no consumer needs them.
  - id: STACK-VPS
    requirement: |
      VPS defaults to Docker Swarm on declared supported Ubuntu/CPU versions with sufficient
      memory/disk, reachable build/image sources, trusted SSH and persistent storage. Bootstrap
      supported Docker Engine and explicitly selected Swarm membership idempotently; never
      initialize or join an unrelated daemon by inference. Separate host provisioning from app
      deploy: no specific cloud, Terraform or Kubernetes dependency. Refuse unsupported hosts
      instead of claiming every Ubuntu machine works. Publish only intended ingress; Docker
      port publishing is not protected merely by an assumed UFW rule. Declare DNS/TLS prerequisites.
      Render Swarm-compatible stack definitions with prebuilt immutable images; Compose build,
      depends_on and a successful stack-deploy command are not Swarm rollout/readiness proof.
      Bind manager/key custody, node placement and local-volume failure boundaries explicitly.
  - id: STACK-LIFECYCLE
    requirement: |
      Produce app-owned prepare/up/status/logs/down/doctor entrypoints and VPS update/rollback/
      backup/restore entrypoints or explicit safe refusal paths. Bind exact app/environment/
      project/release and serialize deploys. Stage immutable images/config, execute approved
      migrations, await app readiness, run the selected journey, then record the active release.
      Distinguish restart, image rollback and data rollback; preserve old release/config and
      volume ownership. Never reverse irreversible migrations or erase unrelated data to recover.
  - id: STACK-RECOVERY
    requirement: |
      Cover all stateful owners, consistent capture, independent artifact/key custody, restore
      ordering, corruption/wrong-key refusal and current post-restore authority. Test restore
      in isolation before claiming recovery. Same-host storage may survive containers but
      cannot be claimed to survive host/disk loss. Ask only unresolved owner policy; prepare
      technical keys and setup within existing authority.
  - id: STACK-EVIDENCE
    requirement: |
      Read docs/application-stacks.md, docs/application-stacks-vps.md and the synthetic kit
      examples/application-stacks. Author .stacks/application-stacks.yaml against
      schemas/application-stacks.schema.json. Declare dev docker-compose and VPS docker-swarm.
      Render the actual deployment model with docker compose config or docker stack config and run
      `node <skill root>/bin/starci.mjs stacks check <repo-root> --environment dev|vps
      --deployment-model <rendered.yaml-or-json>`. This is static conformance only. Separately prove empty
      cold-start, missing/wrong-key refusal, preserved secrets/data after recreation, failed
      init/readiness and scoped cleanup. VPS adds actual Ubuntu bootstrap, relevant DNS/TLS,
      update and image/data recovery. Record revisions, tools, platform, executed and unrun cases.
  - id: STACK-RECONCILE
    requirement: |
      Reconcile existing deployment A and application contracts B with requirement C as current
      A', B', C'. Retain useful fragments/custody, correct stale docs and affected consumers,
      and reverify. Preserve VPS Swarm as the default; do not silently replace its deployment
      semantics with Compose, reset old data for a passing test or inherit stale acceptance. .stacks does
      not own SRS/SDS or workflow state. Runtime maintenance does not grant app deployment.
