schema: starci/op-gate@1
# The READ-CODE-CHECK-FIX-REPORT loop every code-writing op follows (owner 2026-10-01), as data. Three readers use it:
#   scripts/checks/read-digest.mjs   prints what a slice must READ before coding (the pattern files of its file kinds, the
#                                    matching example files, the slot map) and records the READ digest with each file's sha256
#   scripts/checks/gate.mjs          the one gate the op forces every round and the Kernel re-runs at landing
#   scripts/kernel/gate-settle.mjs   re-reads the attached gate JSON and READ digest at `api settle` and refuses a done that
#                                    is red, could not run, or skipped READ
# The round bound is each op's `params.gateRounds`; nothing here restates it.
purpose: >-
  The loop an op runs: READ only what the slice needs (the pattern files of the file kinds it will touch, the example files of
  the same slots, the slot map of its folders from `hfs explain`), CODE, FORCE THE CHECKS with gate.mjs, FIX and repeat up to
  params.gateRounds rounds, REPORT with the gate JSON and the READ digest attached. Still red after the last round is
  `blocked` with the exact findings; `done` while red is refused at settle.
enforcedOps:
  - backend.scaffold
  - backend.implement
  - interface.scaffold
  - interface.implement
  - package.scaffold
  - code.refactor
  - test.author
  - unit.verify
  - integration.verify
  - e2e.verify
  - grammar.update
  - task.execute
gate:
  script: scripts/checks/gate.mjs
  schema: starci/gate@1
  attach: gate.json
digest:
  script: scripts/checks/read-digest.mjs
  schema: starci/read-digest@1
  attach: read-digest.json
# The example app whose files show each slot done right, per side. A slot's example files are the files of the example side
# that its `hfs explain` pattern matches.
examples:
  be: examples/todo-app/be
  fe: examples/todo-app/fe
# File kind -> pattern files. A touched file's kind is the slot `hfs explain` names; its family is the slot id's first
# segment. It owes the family's `always` files plus those of the longest dotted slot prefix listed under `slots`.
# Paths are relative to knowledge/patterns/.
kinds:
  be:
    always: [be/index.yaml, be/folder.yaml, be/naming.yaml, be/imports.yaml, be/typing.yaml, be/function.yaml, be/comment.yaml]
    slots:
      be.app: [be/architecture-check.yaml, be/config.yaml, be/injection.yaml]
      be.app.worker: [be/architecture-check.yaml, be/config.yaml, be/background.yaml]
      be.feature: [be/architecture-check.yaml, be/injection.yaml]
      be.feature.application: [be/cqrs.yaml, be/error.yaml, be/injection.yaml]
      be.feature.transport: [be/transport.yaml, be/api-auth.yaml]
      be.transport: [be/transport.yaml, be/api-auth.yaml]
      be.transport.message: [be/transport.yaml, be/background.yaml, be/idempotency.yaml]
      be.transport.schedule: [be/transport.yaml, be/background.yaml]
      be.contract: [be/transport.yaml]
      be.domain: [be/error.yaml, be/messages.yaml]
      be.errors: [be/error.yaml, be/messages.yaml]
      be.feature.messages: [be/messages.yaml]
      be.persistence: [be/persistence.yaml]
      be.platform: [be/infra.yaml, be/config.yaml, be/logging.yaml, be/temporal.yaml, be/resilience.yaml]
      be.integrations: [be/infra.yaml, be/resilience.yaml, be/idempotency.yaml]
      be.tests: [be/test.yaml]
      be.root-e2e: [be/test.yaml]
      be.starciwork: [repo/starciwork.yaml]
      be.starcistacks: [repo/starcistacks.yaml]
      be.sops: [repo/secrets.yaml]
      be.package-manifest: [repo/pins.yaml]
      be.lockfile: [repo/pins.yaml]
      be.tool-config: [repo/tooling.yaml]
      be.tool-config-local: [repo/tooling.yaml]
      be.nest-cli: [repo/tooling.yaml]
  fe:
    always: [fe/index.yaml, fe/folder.yaml, fe/naming.yaml, fe/imports.yaml, fe/typing.yaml, fe/function.yaml, fe/comment.yaml]
    slots:
      fe.app: [fe/multi-app.yaml, fe/boundaries.yaml, fe/architecture-check.yaml]
      fe.route: [fe/boundaries.yaml, fe/architecture-check.yaml, fe/error.yaml]
      fe.feature: [fe/boundaries.yaml, fe/css.yaml, fe/error.yaml]
      fe.components: [fe/boundaries.yaml, fe/css.yaml]
      fe.hooks: [fe/boundaries.yaml, fe/transport.yaml]
      fe.modules: [fe/boundaries.yaml]
      fe.modules.api: [fe/transport.yaml, fe/error.yaml]
      fe.transport: [fe/transport.yaml, fe/error.yaml]
      fe.modules.i18n: [fe/i18n.yaml]
      fe.modules.brand: [fe/css.yaml]
      fe.contract: [fe/transport.yaml]
      fe.package: [fe/packages.yaml]
      fe.package.api: [fe/packages.yaml, fe/transport.yaml, fe/error.yaml]
      fe.package.i18n: [fe/packages.yaml, fe/i18n.yaml]
      fe.package.ui: [fe/packages.yaml, fe/css.yaml]
      fe.package-manifest: [repo/pins.yaml]
      fe.lockfile: [repo/pins.yaml]
      fe.tool-config: [repo/tooling.yaml]
      fe.tool-config-repo: [repo/tooling.yaml]
      fe.tool-config-local: [repo/tooling.yaml]
  repo:
    always: [repo/index.yaml, repo/folder.yaml]
    slots:
      repo.tool-config: [repo/tooling.yaml]
      repo.quality-config: [repo/tooling.yaml, repo/formatter.yaml]
      repo.hooks: [repo/tooling.yaml]
      repo.ci: [repo/tooling.yaml]
      repo.plaintext-env: [repo/secrets.yaml]
      repo.declaration: [repo/tooling.yaml]
      repo.packages: [repo/pins.yaml]
  app:
    always: [repo/index.yaml, repo/folder.yaml]
    slots: {}
