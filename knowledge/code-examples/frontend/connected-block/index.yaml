schema: starci/code-example@1
id: connected-block
title: Connected block and pure renderer pair
purpose: |
  Show one feature block unit under the shape-slot law: connected index.tsx owns
  data, localization and navigation, folds each api into a Slot and picks the
  shape; pure component.tsx receives only { state, props, on } of atoms. state is
  a drawn SHAPE ("summary" | "detail"), never a data status: the slot's loading,
  forbidden, error and empty render through SlotView. index.tsx exports
  ExampleBlock only, never ExampleBlockBase. Grammar imports come from the
  verified @starci/grammar/common entry. The full multi-tier reference (page,
  layout, overlay, block, branch, composite, leaf, SWR hooks, react-hook-form +
  zod) is examples/shape-slot. Domain names are synthetic Example*.
appliesTo: [frontend]
relatedLint:
  - starci-fe/base-props-atom
  - starci-fe/base-import-pair
  - starci-fe/no-data-status-shape
  - starci-fe/slot-status-through-slotview
relatedRules:
  - FE-FUNCTION-1
  - FE-FUNCTION-2
  - FE-FUNCTION-3
  - FE-FUNCTION-4
  - FE-FUNCTION-5
  - FE-FOLDER-1
  - FE-FOLDER-2
  - FE-FOLDER-6
files:
  - path: index.tsx
    role: Connected owner; "use client"; folds the query into a Slot, resolves i18n/router, picks the shape; exports ExampleBlock only.
  - path: component.tsx
    role: Pure renderer; { state, props, on } of atoms; state is a shape; data status only through SlotView.
  - path: classNames.ts
    role: Owns unit class strings; component.tsx never inlines className literals.
entrypoint: index.tsx
adapt:
  - Replace Example* names with the target block name and folder under blocks/<domain>/.
  - Remap next-intl, @/i18n/navigation and @/hooks imports to the host's approved entries.
  - Replace useQueryExampleStatusSwr with the target's real useQueryXSwr hook.
  - Keep SlotView, Slot/toSlot/SlotLabels and hooks/slot useSlotLabels as in examples/shape-slot; component.tsx never branches on isLoading/isError itself.
  - Name the pair X / XBase with XProps / XBaseProps; only X leaves the folder.
  - Resolve every label in the connected half; never pass translation keys into Base.
  - Keep Button commands on onPress and destinations on href; never combine them.
  - Keep router.push (or equivalent) in the connected half; pass openHelp as an action.
dependencies:
  packages:
    - "@starci/grammar"
    - react
    - next-intl
  assumptions: |
    Illustrative Next.js client-block shape. Grammar symbols Button, Heading, Text
    and SurfaceCard were verified against the runtime's packages/grammar
    (package name @starci/grammar, public entry ./common, version 0.4.13) source
    renderers.ts and the built dist/common/index.js. App hooks and i18n are
    adapter seams, not Grammar APIs.
verification:
  syntax: true
  typecheck: true
  lint: true
  limitations: |
    Verified 2026-09-27 by dropping these files into examples/shape-slot as
    fe/apps/shape-slot/src/components/blocks/ExampleBlock (with stub @/hooks and
    @/modules/i18n/navigation seams): tsc clean, @starci/eslint-canon-fe clean including
    the shape-slot rules. Mock-only connected mapping is not browser UAT.
provenance:
  sources:
    - examples/ecommerce-app/fe/apps/app/src/components/blocks/SessionForm/index.tsx
    - examples/ecommerce-app/fe/apps/app/src/components/blocks/SessionForm/component.tsx
    - examples/ecommerce-app/fe/apps/app/src/components/blocks/SessionForm/classNames.ts
    - examples/ecommerce-app/fe/apps/app/src/components/blocks/SignOutAction/component.tsx
    - packages/grammar/src/common/renderers.ts
    - packages/grammar/src/core/primitive/Button/index.tsx
    - packages/grammar/package.json
  simplifications: |
    Replaced cart/account business flows with a synthetic status summary.
    Kept the three-part pure contract (state/props/on), connected ownership of
    hooks, colocated classNames ownership, and Grammar Button onPress-versus-href
    discrimination. Omitted the source product's leaves, overlays and payment surfaces.
grammarExportsVerified:
  package: "@starci/grammar"
  entry: "@starci/grammar/common"
  versionObserved: "0.4.13"
  exports:
    - Button
    - Heading
    - Text
    - SurfaceCard
  notes: |
    Verified as functions from packages/grammar/dist/common/index.js and as named
    re-exports in packages/grammar/src/common/renderers.ts. ButtonProps is a
    discriminated union: DestinationButton (href, onPress?: never) |
    CommandButton (onPress, href?: never).
