schema: starci/code-example@1
id: domain
title: A domain capability - a service that owns its rules and publishes inside its transaction
purpose: |
  Show a domain service: one transaction on the connection of its context, with the event published inside it, and the unit spec beside it.
appliesTo: [backend]
relatedRules:
  - BE-DOMAIN-1
  - BE-DOMAIN-2
files:
  - path: payment.service.ts
    role: The service with its transaction and the published event.
  - path: payment.service.spec.ts
    role: The unit spec beside the service.
entrypoint: payment.service.ts
adapt:
  - One folder per capability under modules/domain/<capability>/, on one context connection.
dependencies:
  packages: []
  assumptions: |
    The named EntityManager injector and the event bus capability exist in the host.
verification:
  syntax: true
  typecheck: false
  lint: false
  tests: []
  limitations: |
    Does not show persistence; see knowledge/patterns/be/domain.yaml.
provenance:
  sources:
    - knowledge/patterns/be/domain.yaml
  simplifications: |
    Synthetic names; entities, mappers and module wiring are omitted.
