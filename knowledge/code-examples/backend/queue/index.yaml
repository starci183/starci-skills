schema: starci/code-example@1
id: queue
title: A typed queue producer called inside the domain transaction
purpose: |
  Show how background work starts: a typed producer in modules/queues/<queue>/ writes the queue outbox with its own tx
  parameter, and a domain service calls it inside the transaction of the change that needs the work.
appliesTo: [backend]
relatedRules:
  - BE-QUEUES-1
  - BE-QUEUES-2
  - BE-QUEUES-3
files:
  - path: receipt.queue.ts
    role: Typed producer and queue name.
  - path: pay-order.service.ts
    role: Domain service enqueueing in its transaction.
entrypoint: pay-order.service.ts
adapt:
  - One folder per queue under modules/queues/<queue>/.
  - A schedule is a job scheduler declared in the same queue file; there is no cron.
  - The processor is features/jobs/<job>/transport/queue/<job>.processor.ts and dispatches one command.
dependencies:
  packages: []
  assumptions: |
    The platform queue capability and the named EntityManager injector exist in the host.
verification:
  syntax: true
  typecheck: false
  lint: false
  tests: []
  limitations: |
    Does not show the BullMQ relay or the processor; see knowledge/patterns/be/queues.yaml.
provenance:
  sources:
    - knowledge/patterns/be/queues.yaml
  simplifications: |
    Synthetic receipt and payment names; entities and module wiring are omitted.
