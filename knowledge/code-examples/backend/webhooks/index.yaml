schema: starci/code-example@1
id: webhooks
title: Signed provider webhook door
purpose: |
  Show the webhooks kind end to end: the door that verifies the signature and replay window as its
  first statement and makes one domain call, its bounded payload, its unit spec, and the domain
  intake that claims the inbox and publishes the event in its own transaction. Distinct from an api
  transport: a webhook has no application layer and no bus.
appliesTo: [backend]
relatedRules:
  - BE-WEBHOOK-1
  - BE-WEBHOOK-2
  - BE-WEBHOOK-3
  - BE-WEBHOOK-4
  - BE-AUTH-3
files:
  - path: payment-gateway.webhook.ts
    role: The signed door, one controller with one POST handler.
  - path: payment-notification.request.ts
    role: The typed, bounded provider payload.
  - path: payment-gateway.webhook.spec.ts
    role: The door's own spec, built with the Nest testing module and kit doubles.
  - path: payment.service.excerpt.ts
    role: The domain intake that claims the inbox and publishes in its transaction (an excerpt of the domain service).
entrypoint: payment-gateway.webhook.ts
adapt:
  - Rename the provider, the headers the provider signs with and the payload fields to the provider's contract.
  - Enable the raw body for the api app (rawBody on the Nest application) so verify reads the bytes the provider signed.
  - Keep the event classes in modules/events/<service>/ equal to be/contracts/<service>/events.json.
dependencies:
  packages: [class-validator, "@nestjs/common", "@nestjs/testing", "@starci/jest-preset"]
  assumptions: |
    The host provides WebhookSignatureService (platform/http-security), the domain PaymentService with its
    inbox and event bus, and the typed event classes. This folder shows the shapes, not those modules.
verification:
  syntax: true
  typecheck: false
  lint: false
  tests: []
  limitations: |
    Does not show the raw-body bootstrap, the provider fake of the test world or the webhooks/* e2e scenarios;
    see knowledge/patterns/be/webhooks.yaml.
provenance:
  sources:
    - knowledge/patterns/be/webhooks.yaml
  simplifications: |
    A synthetic payment gateway; the event fields are reduced to what the example needs.
