schema: starci/code-example@1
id: api
title: An api feature - a resolver, its command and handler, and the e2e flow
purpose: |
  Show an api feature: a GraphQL resolver that dispatches one command, a handler that calls the domain service, and the e2e flow of the operation.
appliesTo: [backend]
relatedRules:
  - BE-API-1
  - BE-API-2
files:
  - path: start-checkout.resolver.ts
    role: The GraphQL door of one operation.
  - path: start-checkout.handler.ts
    role: The handler that calls the domain service.
  - path: start-checkout.e2e-spec.ts
    role: The operation on the booted app, a refusal and an unauthenticated call.
entrypoint: start-checkout.resolver.ts
adapt:
  - One resolver per operation under features/<feature>/transport/graphql/.
  - Every operation gets an e2e spec on the real app.
dependencies:
  packages: []
  assumptions: |
    The CQRS buses and the identity principal decorator exist in the host.
verification:
  syntax: true
  typecheck: false
  lint: false
  tests: []
  limitations: |
    Does not show the dto files or the mapper; see knowledge/patterns/be/api.yaml.
provenance:
  sources:
    - knowledge/patterns/be/api.yaml
  simplifications: |
    Synthetic names; entities, mappers and module wiring are omitted.
