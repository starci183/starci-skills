schema: starci/code-example-catalog@1
title: Backend code examples
purpose: |
  Multi-file interaction examples extracted from starci-academy-backend shapes.
  They teach ownership and wiring; they are not product requirements or runnable apps.
examples:
  - id: named-exception
    path: named-exception
    title: AbstractException declaration shape
  - id: saga
    path: saga
    title: A saga with steps, compensations and a fenced state
  - id: event-bus
    path: event-bus
    title: Publish an event in the domain transaction and consume it
  - id: queue
    path: queue
    title: A typed queue producer called inside the domain transaction
  - id: fenced-job
    path: fenced-job
    title: A fenced background job - claim, guarded writes and a run key
  - id: projection
    path: projection
    title: A projection kept current by a reactor
