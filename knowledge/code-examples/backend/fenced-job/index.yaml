schema: starci/code-example@1
id: fenced-job
title: A fenced background job - claim, guarded writes and a run key
purpose: |
  Show how a job survives a zombie worker: an atomic claim that bumps the fencing token, guarded writes that require the token in
  their type, a processor that extends the fenced base, and a step whose external effect carries a run key that includes the token.
appliesTo: [backend]
relatedRules:
  - BE-JOBS-1
  - BE-JOBS-2
  - BE-JOBS-3
  - BE-JOBS-4
  - BE-JOBS-5
files:
  - path: job-claim.shape.ts
    role: The JobClaims port, GuardedWrite, RunKey and the claim SQL.
  - path: send-receipt.processor.ts
    role: A processor extending FencedProcessor.
  - path: mail.step.ts
    role: A step implementing JobStep with the run key.
entrypoint: send-receipt.processor.ts
adapt:
  - The job row is written only by platform/jobs; a step calls the guarded methods.
  - The run key is made by JobClaims.runKey and nothing else.
  - The provider must honour the key as an idempotency key; otherwise constrain overlap and reconcile first.
dependencies:
  packages: []
  assumptions: |
    The platform jobs capability, the integration port and the injectors exist in the host; this folder shows the interaction and is
    not a runnable app.
verification:
  syntax: true
  typecheck: false
  lint: false
  tests: []
  limitations: |
    Does not show the migration, the module wiring or the enqueue side; see knowledge/patterns/be/jobs.yaml and queues.yaml.
provenance:
  sources:
    - knowledge/patterns/be/jobs.yaml
  simplifications: |
    Synthetic receipt and mailer names; the failure path of the base class is omitted.
