schema: starci/code-example-catalog@1
title: Extracted code examples
purpose: |
  These focused multi-file excerpts make the pattern rules directly usable. They are examples,
  not product requirements, standalone applications or permission to copy a database connection.
  Resolve target imports and business types while preserving the illustrated responsibilities.
  Examples supplement mandatory pattern topics. A compiling snippet does not prove correct
  authorization, concurrency or production module registration. Verify those against the
  accepted SRS/SDS and the actual application.
examples:
  - id: connected-block
    path: frontend/connected-block
    lane: frontend
    summary: |
      Connected owner and pure renderer with resolved state, labels and actions; verified
      @starci/grammar/common entry. Test Base states separately from the connected owner's
      mapping and callbacks; mock-only mapping tests are not browser UAT.
    relatedRules:
      - FE-FUNCTION-1
      - FE-FUNCTION-2
      - FE-FUNCTION-4
      - REF-FE-1
