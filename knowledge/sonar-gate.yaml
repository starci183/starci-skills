schema: starci/sonar-gate@1
id: sonar-gate
title: The Sonar quality gate every product is held to
purpose: |
  The one place the Sonar thresholds live. A product repository never restates them: its
  .starcistacks/application-stacks.yaml `services.sonar.qualityGate` names the gate below, and
  scripts/gates/sonar-local.mjs (1) makes the local SonarQube's gate of that name carry exactly these
  conditions and selects it for the project, and (2) judges an op's slice - the lines it changed - against
  the same numbers. Code-writing ops cannot settle done while the slice is red
  (scripts/kernel/sonar-settle.mjs). Changing a number here changes every repository on the next scan.
  The gate has two parts: `newCode` (the recent work: coverage, duplication, blocker/critical issues, hotspots) and
  `overall` (the whole code: coverage, no imported HFS, ESLint or stylelint finding, no bug, code smell or
  vulnerability, every hotspot reviewed, no duplicated-lines excess, no cognitive-complexity issue). The one Sonar
  mechanism of the HFS canon is packages/hfs/README.md section "Sonar".
gate:
  name: starci-quality
  # A project with no new-code baseline judges the whole project as new code; a fixed
  # window keeps "new code" the recent work on main, so the server gate is passable on a healthy main.
  newCodePeriod: {type: NUMBER_OF_DAYS, value: 30}
newCode:
  # Coverage of the measured logic files only (the `ruleParams.be.logicRoles` roles of the `coverage: required` slots). The be unit run writes coverage/lcov.info (@starci/jest-preset coverageReporters lcov) and the
  # managed sonar-project.properties imports it (sonar.javascript.lcov.reportPaths=be/coverage/lcov.info) with
  # sonar.coverage.exclusions = the complement of the measured files (SonarQube has no coverage inclusions), rendered by hfs sync from the one derivation scripts/hfs/coverage-scope.mjs (be/jest.config.js and codecov.yml
  # are rendered from it too; a hand edit of any of them is R204 HFS_COVERAGE_SCOPE_DRIFT). The feature tier, declaration files, tests and
  # fe/ are never coverage targets, so coverage on these conditions is the coverage of the modules' logic alone.
  coverage:
    metric: new_coverage
    minPercent: 100
  # SonarQube's ignoreSmallChanges: fewer changed lines than this are not held to duplication.
  ignoreBelowChangedLines: 20
  duplication:
    metric: new_duplicated_lines_density
    maxPercent: 3
  issues:
    # An open issue of these severities on a changed line fails the slice; lesser ones are listed, never blocking.
    blockingSeverities: [BLOCKER, CRITICAL]
    metrics: {BLOCKER: new_blocker_violations, CRITICAL: new_critical_violations}
    max: 0
  hotspots:
    metric: new_security_hotspots_reviewed
    minReviewedPercent: 100
    unreviewedMax: 0
# The whole code, not only the new code. Every finding of the HFS canon reaches Sonar through ONE entry, `hfs lint`
# (packages/hfs, contract changes hfs-sonar-import and hfs-lint-entry), which writes ONE file, reports/lint.sonar.json
# (`npm run lint -- --sonar reports/lint.sonar.json`), named by sonar.externalIssuesReportPaths; the gate holds the open-issue count of
# the whole project at zero. The file carries three engines:
#   starci-hfs   the repository findings of `hfs check` (managed files, tree, pins, CI, contracts; the rule id is the finding code)
#   eslint       ESLint's json over the repository (the BE and FE canon plugins alike, per-file and project-graph rules)
#   stylelint    stylelint's json over the style glob (front ends)
# The engines share ONE placement rule (a finding on a file Sonar does not index is filed on the first source file); Sonar's own
# ESLint import (sonar.eslint.reportPaths) is not used because it drops such issues.
# A SonarQube gate condition cannot filter issues by engine, so the condition is the project's open issues (`violations`,
# overall code): the three engines above are the imports it counts, and every native Sonar issue counts with them. That is
# stricter than the engines alone and it is intended: a project that meets this gate has no open issue of any origin.
overall:
  issues:
    metric: violations
    max: 0
    engines: [starci-hfs, eslint, stylelint]
    # The dashboard counts (`sonar-local dashboard`): each type of open issue, each held at `max`.
    types: {bugs: BUG, code_smells: CODE_SMELL, vulnerabilities: VULNERABILITY}
  # Every security hotspot of the whole code is reviewed (the dashboard's "hotspots reviewed").
  hotspots:
    metric: security_hotspots_reviewed
    minReviewedPercent: 100
  # The measured files' coverage (see newCode.coverage), overall and per file: with the exclusions in place each measured file is its
  # own measure, so one measured file below 100 fails the slice verdict (sonar-local evaluateSlice) and the dashboard verdict
  # (sonar-local dashboard) although the project average may round to 100. A file outside the scope is never read.
  coverage:
    metric: coverage
    minPercent: 100
    perFile: true
  # HFS_DUPLICATE_CODE (R21): duplicated lines density of the whole project, the Sonar enforcer of the machine's clone check.
  # SonarJS runs its own token-based detection (sonar.cpd.* minimums are not read for TypeScript), so ruleParams.<profile>.duplicateBlock
  # is enforced by the machine and imported as starci-hfs issues, and this density is the Sonar-side backstop.
  duplication:
    metric: duplicated_lines_density
    maxPercent: 3
  # HFS_SIZE_GROWTH (R20): the cognitive complexity of a function is the Sonar rule S3776 (typescript:S3776, Sonar way, default
  # threshold); an open S3776 issue is an open issue of `overall.issues`, so the zero-issue condition is its gate.
  cognitiveComplexity:
    rule: typescript:S3776
    via: overall.issues
# Lite is the same quality policy without a test or coverage world. Readers select this block from hfs.json edition;
# keeping both gates in this document makes every threshold data, never a branch-local restatement.
lite:
  gate:
    name: starci-quality-lite
    newCodePeriod: {type: NUMBER_OF_DAYS, value: 30}
  newCode:
    ignoreBelowChangedLines: 20
    duplication:
      metric: new_duplicated_lines_density
      maxPercent: 3
    issues:
      blockingSeverities: [BLOCKER, CRITICAL]
      metrics: {BLOCKER: new_blocker_violations, CRITICAL: new_critical_violations}
      max: 0
    hotspots:
      metric: new_security_hotspots_reviewed
      minReviewedPercent: 100
      unreviewedMax: 0
  overall:
    issues:
      metric: violations
      max: 0
      engines: [starci-hfs, eslint, stylelint]
      types: {bugs: BUG, code_smells: CODE_SMELL, vulnerabilities: VULNERABILITY}
    hotspots:
      metric: security_hotspots_reviewed
      minReviewedPercent: 100
    duplication:
      metric: duplicated_lines_density
      maxPercent: 3
    cognitiveComplexity:
      rule: typescript:S3776
      via: overall.issues
# The Sonar enforcers of the rule catalog (knowledge/hfs/rules.yaml): the failure code each condition above is the gate of.
enforces:
  - {rule: R20, code: HFS_SIZE_GROWTH, enforcer: cognitive-complexity, condition: cognitiveComplexity}
  - {rule: R21, code: HFS_DUPLICATE_CODE, enforcer: duplicated-lines-density, condition: duplication}
  - {rule: R21, code: HFS_DUPLICATE_SYMBOL, enforcer: duplicated-lines-density, condition: duplication}
# Ops that write product code: each runs sonar-local on its own change and cannot settle done while the gate is red.
enforcedOps: [backend.implement, interface.implement, code.refactor]
reasoning: |
  Chosen against the four projects the local server holds on 2026-09-29 (whole-project duplicated lines
  1.6 / 2.1 / 1.7 / 0.0 percent), so new code that meets them is at or below what main already carries.
  coverage 100 on the measured logic files, overall and new code (owner 2026-10-01): the unit project already fails below its per-file
  100 threshold on the `ruleParams.be.logicRoles` files of the `coverage: required` slots; Sonar imports the same run's lcov with the same scope, so the dashboard, the slice
  verdict and the server gate show the number the runner enforces, file by file. Only the modules' logic counts: business logic
  lives there, the feature tier is thin (R203) and proven by integration and e2e, and the front end has no unit tests.
  duplication 3: the Sonar way value; the worst project today is 2.1, so 3 rejects a real copy-paste block and
  passes ordinary work.
  blocker/critical 0: the two severities that are defects, not style. main carries old debt of both kinds
  (one product repository carries 3 blocker and 137 critical), so the SLICE verdict reads only changed lines and never main's backlog;
  major and lower are reported on the summary and never fail a slice.
  overall issues 0 and overall duplication 3: the server gate is also the owner's definition of done for the HFS canon:
  a repository that carries any open ESLint, stylelint or HFS finding is not green, whatever the age of the line. The
  op slice keeps judging changed lines (an op cannot fix a repository's whole backlog); the dashboard and CI show the
  whole-project condition. Adopting a repository therefore means clearing its imported findings, which `hfs check`,
  eslint and stylelint already demand at land.
  hotspots 0 unreviewed: a hotspot is a question the author must answer; on changed lines it is answered in the
  same slice.
