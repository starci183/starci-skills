schema: starci/knowledge-source@1
id: fe.boundaries
title: Frontend boundaries
purpose: |-
  Given a frontend failure or a render mode decision, which boundary handles it? Every app has error, not-found and
  loading boundaries, and every route is server-first with a client boundary only where interaction needs one.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [fe.app, fe.route, fe.feature, fe.components, fe.hooks, fe.modules]
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - https://nextjs.org/docs/app/getting-started/error-handling
    - https://nextjs.org/docs/app/getting-started/server-and-client-components
    - https://nextjs.org/docs/app/api-reference/file-conventions/loading
  limitations: |-
    Static checks prove that the boundary files exist, that route files are server components and that "use client" sits
    only where allowed. They do not prove that a boundary recovers correctly or that a loading state is well drawn; the
    UI evidence and browser checks do.
rules:
  - id: FE-BOUNDARY-1
    title: Mandatory error, not-found and loading boundaries
    kind: mandatory
    hfsRules: [R53]
    requirement: |-
      Every app has `app/global-error.tsx`, `app/[locale]/error.tsx`, `app/[locale]/not-found.tsx` and
      `app/[locale]/layout.tsx`, and a `loading.tsx` for every route group that reads data. `error.tsx` and
      `global-error.tsx` are client components because Next requires it. Their props follow the installed Next contract, and
      retry re-runs the failed read. `Suspense fallback={null}` is forbidden. `errorState` records declare the Outcome envelope
      whenever the code has an `Outcome`.
    rationale: |-
      Without a boundary a render error blanks the whole page, and a route with no loading file shows nothing while it
      waits.
    cases:
      - id: case-1
        when: A render error in a route group
        write: app/[locale]/error.tsx renders the error slot with a retry that calls reset().
      - id: case-2
        when: An unknown route
        write: app/[locale]/not-found.tsx renders the not-found notice with a link built by modules/routes.
      - id: case-3
        when: A route group that reads data
        write: app/[locale]/(console)/loading.tsx draws the skeleton shape of that group.
    verification:
      automated:
        - FE_ERROR_BOUNDARY_MISSING
        - FE_SUSPENSE_NULL_FALLBACK
      manual:
        - Trigger a render error and an unknown route and confirm the boundaries render and recover.
    relatedExamples: []
  - id: FE-BOUNDARY-2
    title: Boundaries render a slot, not an error status
    kind: mandatory
    hfsRules: [R51, R53, R92]
    requirement: |-
      A boundary and a connected block turn an SWR read (its data, its error and the GraphQLResponse it carries) or a caught
      error into a slot through `toSlot`; they never read `error.status`. A refused read shows the forbidden notice or
      navigates to sign-in, any other failure offers a retry that re-runs exactly that read (the hook's mutate), and copy
      comes from the i18n catalog.
    rationale: |-
      One adapter renders every failure the same way, and the recovery action stays explicit.
    cases:
      - id: case-1
        when: A read is refused
        write: toSlot gives isForbidden true; a primary slot shows the forbidden notice and a secondary slot unmounts.
    verification:
      automated:
        - FE_HTTP_STATUS_COLLAPSE
        - FE_OUTCOME_KIND_UNHANDLED
        - FE_ERROR_BOUNDARY_MISSING
        - FE_SUSPENSE_NULL_FALLBACK
        - FE_COMPONENT_API
        - FE_COMPONENT_WORLD_OWNERSHIP
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_CONNECTED_BLOCK_RENDER_PAIR
        - FE_PURE_REACHES_DATA
        - FE_PURE_WORLD_HOOK
        - FE_PURE_WORLD_IMPORT
      manual: []
    relatedExamples: []
  - id: FE-BOUNDARY-3
    title: Server first
    kind: mandatory
    hfsRules: [R55, R54]
    requirement: |-
      Route files (page, layout, template, loading, not-found) are server components. `"use client"` appears only in the
      `index.tsx` of a block that has interaction or client data hooks, in a leaf with intrinsic interaction, and in
      `error.tsx` and `global-error.tsx`. A layout is never a client component. The i18n catalog is split by namespace
      and a client component receives only the picked part through `NextIntlClientProvider messages`. `force-dynamic` is
      forbidden on a client page.
    rationale: |-
      A client layout ships the whole subtree and the whole catalog to every page, and a server-first tree keeps the client
      bundle to the interactive parts.
    cases:
      - id: case-1
        when: A page with a static header and one interactive table
        write: The page and the header are server components; only the table block index.tsx is "use client".
      - id: case-2
        when: A client block needs messages
        write: 'The server layout passes `pick(messages, ["sales"])` to the provider; the block reads only the sales namespace.'
    verification:
      automated:
        - FE_CLIENT_BOUNDARY
        - FE_CLIENT_SERVER_IMPORT
        - FE_CLIENT_REACHES_SERVER
        - FE_SERVER_ONLY_MARK
        - FE_STORAGE_OUTSIDE_MODULES
        - FE_DANGEROUS_HTML
        - FE_ROUTE_FILES_THIN
        - FE_NEXT_CONVENTIONS
        - FE_PAGE_METADATA_MISSING
        - FE_ROUTE_ONE_PAGE
        - FE_ROUTE_DRAWING_DECISION
        - FE_ROUTE_CLIENT_BOUNDARY
        - FE_ROUTE_CLIENT_HOOK
        - FE_ROUTE_DEFAULT_EXPORT
      manual:
        - Confirm the client bundle of a page contains only the interactive parts.
    relatedExamples: []
  - id: FE-BOUNDARY-4
    title: A cookie is written by the server with its attributes stated
    kind: mandatory
    hfsRules: [R107]
    requirement: |-
      A session cookie is written by the back end only (an HttpOnly refresh-token cookie of the auth endpoint, sent back by
      the Apollo http link and axios with credentials); the front end serves no route handler or Server Action that could
      set one (FE-ROUTE). A cookie the front end writes itself (a locale or preference set in `proxy.ts` through
      `response.cookies.set`) uses one `as const` options constant declared by the module that owns the cookie, stating
      `httpOnly` as a literal, `secure` from `modules/config` and `sameSite` `lax` or `strict`. A session token never reaches
      page script outside modules/auth.
    rationale: |-
      A cookie left to the defaults is readable by any script on the page and rides cross-site requests, so one injected
      script or one forged form takes the session.
    cases:
      - id: case-1
        when: proxy.ts remembers the locale
        write: 'response.cookies.set(LOCALE_COOKIE, locale, LOCALE_COOKIE_OPTIONS) with LOCALE_COOKIE_OPTIONS = { httpOnly: false, sameSite: "lax", path: "/", secure: LOCALE_COOKIE_SECURE } as const in modules/i18n.'
      - id: case-2
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a front end set the session cookie in a sign-in route handler or Server Action"
        write: 'The back end sets the HttpOnly session cookie on its auth endpoint (or modules/auth holds the provider session); the front-end door is removed.'
    verification:
      automated:
        - FE_COOKIE_ATTRIBUTES
      manual:
        - Confirm that no page script reads the session and that a preference cookie with httpOnly false holds nothing the server trusts.
    relatedExamples: []
