schema: starci/knowledge-source@1
id: fe.multi-app
title: Frontend multiple apps
purpose: |-
  Given a front end that serves several audiences, how are the apps separated and how does a design record
  name the app it belongs to? Each app is independent under fe/apps/<app>; sharing is through packages.
appliesTo:
  - frontend
family: fe
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - modules/schemas/work-layout.yaml
  limitations: |-
    Static checks prove isolation between apps and that a ui-screen names an app declared in hfs.json. They do not prove
    that the split of screens between apps is the right product decision.
rules:
  - id: FE-APPS-1
    title: One independent app per audience
    kind: mandatory
    hfsRules: [R64, R01, R02]
    requirement: |-
      Each app is `fe/apps/<app>/` — slot `fe.app.next`: an npm workspace of the app root with its own `package.json`
      (named `@<project>/<app>`) — declared in `hfs.json` `sides.fe.apps` with kind `next`. An app never imports another app. Code that two apps need is a
      `fe/packages/<pkg>` (see packages.yaml). Each app carries the required module instances of slot `fe.modules` and,
      unless a shared api package owns it (slot `fe.package.api`), its own transport module (slot `fe.modules.api`); a
      catalog shared across
      apps is exported by a package, and each app still declares its own default locale in `modules/i18n`.
    rationale: |-
      Independent apps build, deploy and fail separately, and a hidden import between apps makes one deploy break another.
    cases:
      - id: case-1
        when: Two apps need the same translated legal text
        write: Put the catalog namespace in fe/packages/content and import it in each app's modules/i18n/request.ts.
    verification:
      automated:
        - FE_APP_ISOLATION
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_MIN_INSTANCES
        - HFS_REQUIRED_FILE_MISSING
        - HFS_ROOT_ENTRY_MISSING
        - HFS_APPS_REQUIRED
        - HFS_APP_LAYOUT_INVALID
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
      manual: []
    relatedExamples: []
  - id: FE-APPS-2
    title: A draft is a branch, not an app
    kind: mandatory
    hfsRules: [R01, R64, R21]
    requirement: |-
      A design draft or a preview of an app is a branch or a preview deployment of that app, never a second app folder with
      the same routes. Two apps that serve the same routes with the same files are one app.
    rationale: |-
      A second copy of every route diverges byte by byte and doubles every change.
    cases:
      - id: case-1
        when: A landing redesign in progress
        write: Work on a branch of fe/apps/landing and use a preview deployment for review.
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - FE_APP_ISOLATION
        - HFS_DUPLICATE_CODE
        - HFS_DUPLICATE_SYMBOL
        - FE_CROSS_APP_DUPLICATE
      manual: []
    relatedExamples: []
  - id: FE-APPS-3
    title: A ui-screen record names its app
    kind: mandatory
    hfsRules: [R64]
    requirement: |-
      Every `work/ui-screen@2` record declares `app`, a name from `hfs.json` `sides.fe.apps`, and its implementation records
      point to `fe/apps/<app>` of the app repository. Drawing and implementation read the app from the record and never guess it from the
      screen name or the route.
    rationale: |-
      With several apps in one front end, a screen with no declared app forces the draw and implement operations to guess
      where it belongs.
    cases:
      - id: case-1
        when: A screen of the console app
        write: 'a ui-screen record with `app: <app>` whose implementation cites fe/apps/<app>.'
    verification:
      automated:
        - FE_APP_ISOLATION
      manual:
        - Confirm the declared app is the one that serves the screen's route.
    relatedExamples: []
