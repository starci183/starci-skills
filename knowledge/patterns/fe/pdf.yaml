schema: starci/knowledge-source@1
id: fe.pdf
title: PDF view
purpose: |-
  How is a PDF shown? react-pdf, in a block.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: []
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-PDF
    title: "react-pdf in a block"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      PDF viewing uses react-pdf in a client block with its worker configured once; @react-pdf-viewer and direct pdfjs-
      dist use are refused.
    rationale: |-
      One viewer keeps the worker setup in one place.
    cases:
      - id: case-1
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a page embedded a PDF with a second viewer"
        write: "Use react-pdf."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
