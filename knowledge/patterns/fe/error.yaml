schema: starci/knowledge-source@1
id: fe.error
title: Error
purpose: |
  Given a failure in the frontend, how is it represented and where does it go? A failure is an Outcome from the client,
  becomes a slot status in the connected half, and reaches a boundary only when it is a render failure.
appliesTo:
  - frontend
family: fe
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/patterns/fe/transport.yaml
    - knowledge/patterns/fe/boundaries.yaml
    - knowledge/grammars/starci/playbook.yaml
    - https://nextjs.org/docs/app/getting-started/error-handling
  limitations: |
    Static checks prove that failures are mapped through Outcome and slots and that boundaries exist. Whether failure copy
    and recovery match business policy is reviewed against the accepted SRS and the UI evidence.
rules:
  - id: FE-ERROR-1
    title: Failure is resolved before presentation
    kind: mandatory
    hfsRules: [R51, R53]
    requirement: |
      A read failure is a slot status, never a shape: the connected half folds each Outcome with `toSlot` (a refused
      outcome becomes isForbidden, any other failure isError), and the pure half renders it through `SlotView` with a
      retry that re-runs that read (knowledge/grammars/starci/playbook.yaml guidance state-recipes). A command failure is
      resolved by the connected half into field errors (zod message keys resolved by next-intl) or a toast. XState never
      holds failed, error or forbidden. Tests assert the mapping and retry eligibility.
    rationale: |
      One recipe renders every read failure the same way; transport details stop at the connected half and recovery
      conditions stay explicit.
    cases:
      - id: case-1
        when: "A read fails"
        write: >
          toSlot(order) gives { isError: true }; SlotView renders EmptyNotice with the retry action, and the connected half
          wires retryOrder to re-run exactly that read
      - id: case-2
        when: "A read is refused (401 or 403)"
        write: >
          toSlot gives { isForbidden: true, isError: false }; a primary slot shows the forbidden notice, a secondary slot
          unmounts, and a session refusal navigates to sign-in from the data layer
      - id: case-3
        when: "Failure copy"
        write: >
          labels.error, labels.forbidden and labels.retry come from useSlotLabels (the shared slot message namespace); no
          failure string is written in component.tsx
      - id: case-4
        when: "A command fails"
        write: >
          the connected half resolves the failure into a field error or a toast; the pure half receives only the resolved
          string
      - id: case-5
        when: "Connected spec"
        write: >
          asserts the mapping: given a refused outcome the captured props.status.isForbidden is true, and the state still
          names a drawn shape
    verification:
      automated:
        - FE_ERROR_WORLD_STATE_MAPPING
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_HTTP_STATUS_COLLAPSE
        - starci-fe/no-data-status-shape
        - starci-fe/slot-status-through-slotview
      manual:
        - Confirm failure copy and recovery eligibility match business policy.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-2
    title: Failures cross the client as an Outcome
    kind: mandatory
    hfsRules: [R51, R52]
    requirement: |
      The one client of the app returns `Outcome<T>` (ok, refused, invalid, not-found, unavailable). A reader or hook
      handles the outcome before returning data, valid empty data stays a value, and required missing data is `unavailable`
      or a hard stop (FE-ERROR-3). A GraphQL error is mapped by its extensions code to one of the outcomes; the message is
      never shown. Normal business dispositions such as pending or refused-by-policy remain typed data of the result.
    rationale: |
      One vocabulary keeps failure distinct from valid empty data and keeps server text out of the interface.
    cases:
      - id: case-1
        when: "A read allows empty data"
        write: "handle the outcome first; returning the empty value is then valid"
      - id: case-2
        when: "A write with feedback"
        write: >
          runWithToast(action, options) returns a boolean after surfacing the refused or unavailable outcome through the
          toast module; the caller flips local state
      - id: case-3
        when: "Default copy"
        write: >
          copy comes from the catalog by outcome code (refused, unavailable, invalid); no default English strings in code
    verification:
      automated:
        - FE_HTTP_STATUS_COLLAPSE
        - FE_ERROR_ENVELOPE_POLICY
        - FE_WRITE_FEEDBACK_OWNER
      manual:
        - Verify business dispositions, retry eligibility, failure copy and redaction.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-3
    title: throw new Error where silence would be wrong
    kind: mandatory
    hfsRules: [R51]
    requirement: |
      `throw new Error(...)` marks results the code cannot continue without: a required payload that is absent, a slot
      rendered outside its owner, an environment value missing in production. It does not replace typed normal business
      dispositions or an Outcome. A custom Error subclass is not required.
    rationale: |
      Hard stops prevent silent null continuation when a required payload or owner context is missing.
    cases:
      - id: case-1
        when: "Required value absent"
        write: "if (value === undefined) throw new Error(\"Sales summary returned no value\")"
      - id: case-2
        when: "Slot used outside its owner"
        write: >
          if (value === undefined) throw new Error("SalesBlock slots must be rendered inside SalesBlockBase")
      - id: case-3
        when: "Environment value missing in production"
        write: >
          modules/config throws when it loads if a required NEXT_PUBLIC value is missing; there is no localhost fallback
    verification:
      automated:
        - FE_REQUIRED_VALUE_FAILURE
        - FE_ENV_OWNER
      manual:
        - Select domain-required bindings and confirm which absence modes must stop continuation.
    relatedExamples: []

  - id: FE-ERROR-4
    title: Propagation and ownership
    kind: mandatory
    hfsRules: [R53]
    requirement: |
      A data owner maps a failure to an explicit UI state or lets the data client hold it (a hook does not catch what SWR
      stores). Writes that need feedback name one feedback owner. An uncaught render failure goes to the mandatory
      app/[locale]/error.tsx or app/global-error.tsx, whose props follow the installed Next contract (see boundaries.yaml).
      Telemetry lives in instrumentation files and modules/config.
    rationale: |
      Propagation stays at the layer that already owns user-visible state or the process boundary.
    cases:
      - id: case-1
        when: "Inside a hook"
        write: "not caught; SWR stores the failure and the connected half reads it and calls toSlot"
      - id: case-2
        when: "Selected feedback write"
        write: "runWithToast returns false and toasts; the caller flips a local state"
      - id: case-3
        when: "Render crash"
        write: "apps/<app>/src/app/global-error.tsx and app/[locale]/error.tsx"
      - id: case-4
        when: "Telemetry"
        write: "apps/<app>/src/instrumentation.ts, instrumentation-client.ts"
    verification:
      automated:
        - FE_NEXT_ERROR_BOUNDARY_LOCATION
        - FE_ERROR_BOUNDARY_MISSING
      manual:
        - Verify feedback applicability, recovery safety, copy, redaction and telemetry behavior.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-5
    title: Grammar package
    kind: mandatory
    hfsRules: [R63]
    requirement: |
      Grammar throws TypeError for invalid conformance definitions at module init and for invalid vocabulary values in
      assertPresentationState.
    rationale: |
      Package-level TypeError fails fast on invalid family definitions before product composition.
    cases:
      - id: case-1
        when: "Invalid definition at module init"
        write: >
          throw new TypeError(`Invalid ${definition.familyId} Grammar conformance: missing=[...], unknown=[...]`) in
          defineGrammarRuleConformance
      - id: case-2
        when: "Invalid vocabulary value"
        write: "assertPresentationState(\"unknown\") throws TypeError"
    verification:
      automated: []
      manual:
        - Verify conformance helpers against installed @starci/grammar/common exports.
    relatedExamples: []
