schema: starci/knowledge-source@1
id: fe.function
title: Function
purpose: |
  Given a frontend component, hook or helper, what shape does the function take, what does it receive,
  and what does it return?
appliesTo:
  - frontend
family: fe
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - src/components/pages/AuthenticationPage/*
    - pages/CartPage/index.tsx
    - blocks/ai/StarCiAiChat/*
    - blocks/ai/CourseAdvisorRecommendationCard/*
    - leaves/ButtonStateSample/index.tsx
    - hooks/swr/useQueryCourseSwr.ts
    - hooks/swr/useMutateAddToCartSwr.ts
    - packages/grammar/src/core/primitive/Button/index.tsx
  limitations: |
    Cited counts and notes are historical observations at skill commit
    edf72554425f918e80c9205e9c6db10596e722f0, not a census of the current project. Inspect actual
    source, manifest/lockfile, aliases and lint/test configuration in the selected repository before use.
    Historical links supply provenance, not scripts or execution instructions. Verify installed Grammar
    exports at @starci/grammar/common.
rules:
  - id: FE-FUNCTION-1
    title: A component is a named arrow const with one props parameter
    kind: mandatory
    requirement: |
      App components are named `export const` arrows with one props parameter: the connected X takes
      `(props: XProps)`, its pure XBase takes `(props: XBaseProps)`. They do not destructure at the
      signature. No app file has `export default` except a Next route file (page, layout and the other
      App Router files), which declares `const Page = …` and ends `export default Page`. Grammar
      package components may destructure with defaults; that package convention differs from the app
      and stays internally consistent.
    rationale: |
      A single props object keeps the three-part contract readable and matches the dominant app census
      (441 export const X = ( against 0 export function under src/components).
    cases:
      - id: case-1
        when: "Any app component"
        write: >
          export const AuthenticationPageView = (props: AuthenticationPageProps) => { … }
          (441 export const X = ( against 0 export function under src/components; 428 take
          (props: XProps), 0 destructure at the signature)
      - id: case-2
        when: "Reading fields"
        write: "const { on } = props at the top, or props.props.labels, props.state inline"
      - id: case-3
        when: "Expression body when there is no local state"
        write: >
          export const ButtonStateSample = (props: ButtonStateSampleProps) => (
          <span …>{props.props.label}</span> )
      - id: case-4
        kind: residual
        when: "Grammar package component"
        write: >
          destructures with defaults at the signature:
          export const Button = ({ children, variant = "secondary", size = "md", type = "button", …,
          onPress }: ButtonProps) => … — the package convention differs from the app convention; each
          side is internally consistent
      - id: case-5
        when: "A Next route file"
        write: >
          const Page = async (props: PageProps) => { const { handoffId } = await props.params; return
          <OperatePage handoffId={handoffId} canEdit /> } then export default Page
          (examples/shape-slot src/app/[workspaceId]/operate/[handoffId]/page.tsx); every other file
          uses a named export only
    verification:
      automated: []
      manual:
        - "Confirm app components take (props: XProps) or (props: XBaseProps) without signature destructuring."
        - Confirm the only default exports are Next route files.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-2
    title: The pure half takes { state, props, on } of atoms
    kind: mandatory
    requirement: |
      A split unit's `component.tsx` exports XBase taking XBaseProps = `{ state, props, on }`. `state`
      is XState, a union of drawn shapes, each value one drawing the owner approved, and never a data
      status (pending, loading, failed, error, empty, forbidden, closed, …). `props` holds atoms only:
      strings, numbers, booleans, arrays, plain objects, one `Slot<T>` per api and resolved labels.
      `on` holds actions whose arguments are atoms. The children XBase renders are written inside it,
      never handed in; only a layout also takes `children`, the router's slot. `component.tsx` exports
      `xDefaultState`, the shape the skeleton follows while a slot loads. A slot's data status renders
      only through `SlotView` (knowledge/grammars/starci/playbook.yaml guidance state-recipes). Pure
      leaves, composites and branches take their narrow fields directly.
    rationale: |
      A pure half of atoms renders from a fixture, so audit can draw every shape; keeping data status
      out of `state` keeps each approved drawing free of states nobody drew.
    cases:
      - id: case-1
        when: "A block with two apis"
        write: >
          export type HandoffBlockBaseProps = { readonly state: HandoffBlockState; readonly props:
          HandoffBlockData; readonly on: HandoffBlockActions } with HandoffBlockState = "prepared" |
          "sent" | "returned" and HandoffBlockData = { order: Slot<Order>; handoff: Slot<Handoff>;
          labels: HandoffBlockLabels } (examples/shape-slot components/blocks/sales/HandoffBlock)
      - id: case-2
        when: "A layout"
        write: >
          export type WorkspaceLayoutBaseProps = { readonly state: WorkspaceLayoutState; readonly props:
          WorkspaceLayoutData; readonly children: ReactNode }; children is the one non-atom, and only a
          layout takes it
      - id: case-3
        when: "A slot is loading, forbidden, failed or empty"
        write: >
          <SlotView slot={props.props.order} placeholder={orderPlaceholder} labels={labels.orderSlot}
          onRetry={props.on.retryOrder}>{(value, isSkeleton) => …}</SlotView>; never
          if (props.props.order.isLoading) in component.tsx and never "loading" in XState
      - id: case-4
        when: "The skeleton needs a shape"
        write: 'export const handoffBlockDefaultState: HandoffBlockState = "prepared" beside the XState type'
      - id: case-5
        when: "A leaf needs only a label and busy state"
        write: >
          Use the narrow fields directly (MoneyText, StatusChip); do not wrap them to imitate a block
          contract.
      - id: case-6
        when: "The owner has resolved a navigation or mutation"
        write: >
          Pass an href or an action in `on`; never a router, mutation or transport object.
    verification:
      automated:
        - starci-fe/base-props-atom
        - starci-fe/no-data-status-shape
        - starci-fe/slot-status-through-slotview
      manual:
        - Confirm every XState value is a shape the owner drew, and xDefaultState names one of them.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-3
    title: Contracts live with their owning boundary
    kind: mandatory
    requirement: |
      A public feature, module or render contract is declared beside its owner and exported from that
      owner's public entry. A local render helper keeps an unexported local props type. Components that
      take no input declare no empty Record props solely to satisfy a template.
    rationale: |
      Contract placement should reveal ownership and avoid ambiguous duplicate XProps declarations.
    cases:
      - id: case-1
        when: "A render component owns an independently useful props contract"
        write: >
          Declare it in the render unit or a feature-owned model file and export it through the feature entry.
      - id: case-2
        when: "A connected entry accepts route or parent input"
        write: >
          Declare the input beside that entry; keep transport response types behind the data mapper.
      - id: case-3
        when: "Local sub-render"
        write: "type TurnProps = { readonly turn: StarCiAiTurn; … } unexported, above const Turn"
      - id: case-4
        when: "A component takes no input"
        write: "Declare it with no parameter; do not add Record<never, never> and void props."
    verification:
      automated: []
      manual:
        - Confirm each exported contract has one owner and one public entry.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-4
    title: What each applicable half does
    kind: mandatory
    requirement: |
      When a unit owns a product/world boundary, its index.tsx is the connected X: it holds
      translations, locale, router, session and data hooks, folds each read into a Slot with `toSlot`,
      picks the shape from data, resolves every label, and renders the pure XBase from sibling
      component.tsx. Only that sibling index.tsx (and the unit's specs) imports component.tsx, and
      index.tsx exports X only, never XBase. Each Block reads its own apis; a page composes Blocks with
      atoms and reads none; an overlay runs commands only; a layout reads none. A form lives in the
      connected half: react-hook-form with a zod resolver, the schema's messages are message keys, and
      the connected half resolves them with next-intl before they reach XBase as strings. The pure
      sibling has no runtime world/transport dependency.
      Pure blocks, composites, branches and leaves require no twin. Intrinsic browser interaction such
      as refs, focus, disclosure, measurement, drag and reduced motion may remain in one visual unit;
      an authored custom helper for it still lives under hooks/ui.
    rationale: |
      Separating real world access makes presentation fixture-testable and prevents hidden requests,
      while avoiding boilerplate where there is no independent render contract.
    cases:
      - id: case-1
        when: "Connected half"
        write: >
          "use client"; const order = useQueryOrderSwr({ handoffId }); const state = handoff.data?.status
          ?? handoffBlockDefaultState; return <HandoffBlockBase state={state} props={{ order:
          toSlot(order), labels: { …, orderSlot: slotLabels(t("emptyOrder")) } }} on={{ retryOrder: () =>
          { void order.mutate() } }} /> (examples/shape-slot HandoffBlock/index.tsx)
      - id: case-2
        when: "Pure half"
        write: >
          component.tsx does not call hooks or transport and renders only resolved props/actions; no
          file outside its folder imports it, and index.tsx does not re-export XBase.
      - id: case-3
        when: "Route-derived input"
        write: >
          const routeState = (value: string | null) => { switch (value) { case "sign-up": return {
          mode: "signUp" as const, step: "details" as const, measure: "form" as const } … } } in
          index.tsx, then const initial = routeState(authState)
      - id: case-4
        when: "Navigation as an action"
        write: "on={{ signedIn: () => router.replace(\"/dashboard\") }}"
      - id: case-5
        when: "A pure half choosing between a connected block and its pure sibling"
        write: >
          Never: props.data === null ? <X /> : <XView {...props.data} /> lets the pure half decide,
          per render, whether a child fetches its own data. The pure half mounts one of them, the same
          one every time; the page-level provider lives in index.tsx, which resolves the data and hands
          XView its props. The occurrences are in
          https://github.com/starci183/starci-skills/blob/edf72554425f918e80c9205e9c6db10596e722f0/tests/evidence/20260903-presentation-sweep.json
      - id: case-6
        kind: exception
        when: "Intrinsic visual interaction without product-world or transport ownership"
        write: "Keep one client component; a missing component.tsx/Base twin is not a violation."
      - id: case-7
        when: "A form"
        write: >
          const form = useForm<SendHandoffFormValues>({ resolver: zodResolver(sendHandoffSchema) }) in
          the overlay's index.tsx; the schema says z.string().min(1,
          "sales.send.errors.fingerprintRequired"); XBase receives { value, error: tRoot(key) } per field
          (examples/shape-slot features/overlays/sales/SendHandoffOverlay)
    verification:
      automated:
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_CONNECTED_BLOCK_RENDER_PAIR
        - FE_COMPONENT_WORLD_OWNERSHIP
        - FE_CUSTOM_HOOK_LOCATION
        - starci-fe/base-import-pair
        - starci-fe/slot-status-through-slotview
      manual:
        - Confirm the pure sibling never imports world hooks, and require a split only for a real boundary.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-5
    title: When a helper is extracted
    kind: mandatory
    requirement: |
      Boolean predicates, string builders, repeated JSX fragments and render IIFEs stay in the same
      file. Class variants go to classNames.ts.
    rationale: |
      Same-file helpers preserve unit cohesion without creating helpers/ folders under components.
    cases:
      - id: case-1
        when: "A boolean over the shape union"
        write: >
          const shapeOffersSend = (state: HandoffBlockState): boolean => state === "prepared" ||
          state === "returned" above the component
      - id: case-2
        when: "A string builder"
        write: "const turnMarkdown = (turn: StarCiAiTurn, partialLabel: string): string => { … }"
      - id: case-3
        when: "A repeated JSX fragment"
        write: "const Turn = (props: TurnProps) => { … } in the same file, not a new folder"
      - id: case-4
        when: "A branch inside the render"
        write: "an IIFE — const transcript = (() => { if (…) return …; if (…) return …; return … })()"
      - id: case-5
        when: "A class variant"
        write: "goes to classNames.ts as getAiChatBubbleClassName(role)"
    verification:
      automated:
        - no-helper-folder-in-components
      manual: []
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-6
    title: Data lifecycle shape
    kind: mandatory
    requirement: |
      A custom data hook under hooks/<domain> owns one request lifecycle and calls a transport function
      through its module boundary: a read is `useQueryXSwr`, a write `useMutateXSwr`, and one read is
      one api, so it feeds one slot. If SWR is selected, unavailable inputs produce a null key and every identity
      that changes the result participates in the key. Mutation identity includes the affected resource.
      Map wire data and failures to the feature contract before presentation.
    rationale: |
      Cache identity and transport mapping are product behavior; neither belongs in a render component
      or a repository-wide hook bucket.
    cases:
      - id: case-1
        when: "Read"
        write: >
          export const useQueryCourseSwr = ({ displayId }: UseQueryCourseSwrParams = {}) => { const
          viewer = useViewerKey(); return useSWR<CourseDetail | null>(displayId === undefined ? null :
          [QUERY_COURSE_SWR_KEY, displayId, viewer ?? "guest"], async () => { const result = await
          queryCourse({ request: { displayId } }); return result.data?.course?.data ?? null }) }
      - id: case-2
        when: "Write"
        write: >
          export const useMutateAddToCartSwr = (courseId?: string) => useSWRMutation(courseId ===
          undefined ? null : [MUTATE_ADD_TO_CART_SWR_KEY, courseId], async (_key: readonly [string,
          string], { arg }: AddToCartTrigger) => mutationAddToCart({ courseId: arg.courseId }))
      - id: case-3
        when: "Return"
        write: >
          Return the lifecycle needed by the feature consumer. Passthrough is valid when the SWR shape is
          the declared product contract; otherwise map it rather than leaking wire envelopes.
      - id: case-4
        when: "Key"
        write: "null when the input is missing; the viewer identity is part of a read key"
    verification:
      automated:
        - FE_SWR_KEY_IDENTITY
        - FE_SWR_MUTATION_RESOURCE_IDENTITY
        - FE_CUSTOM_HOOK_LOCATION
      manual:
        - Confirm the declared identity set includes every domain input that can change the result.
        - Confirm wire errors and response envelopes stop at the data boundary.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-7
    title: Route file
    kind: mandatory
    requirement: |
      A page.tsx declares `const Page` and ends `export default Page`. It may resolve framework-owned
      server inputs, turns params into atoms, then mounts one page-level visual owner. A resource that
      does not exist ends in `notFound()` here: 404 is never a page state, a shape or a slot status. A
      redirect/notFound-only route mounts none. It does not compose a second shell/root or make a
      product drawing decision.
    rationale: |
      Route files stay thin so drawing ownership remains in pages/blocks.
    cases:
      - id: case-1
        when: "Visual page.tsx"
        write: >
          const Page = async (props: PageProps) => { const { handoffId } = await props.params; return
          <OperatePage handoffId={handoffId} canEdit /> } then export default Page; the route makes no
          drawing decision
      - id: case-2
        kind: exception
        when: "Redirect/notFound-only page.tsx"
        write: "Resolve params/searchParams as needed and redirect or terminate without a visual tree."
    verification:
      automated: []
      manual: []
    relatedExamples: []
