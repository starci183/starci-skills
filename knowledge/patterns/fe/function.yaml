schema: starci/knowledge-source@1
id: fe.function
title: Function
purpose: |
  Given a frontend component, hook or helper, what shape does the function take, what does it receive and what does it
  return? Components are server-first; the connected half owns the world and the pure half draws atoms.
appliesTo:
  - frontend
family: fe
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/grammars/starci/playbook.yaml
    - knowledge/patterns/fe/transport.yaml
    - knowledge/patterns/fe/boundaries.yaml
    - https://nextjs.org/docs/app/getting-started/server-and-client-components
  limitations: |
    Static checks prove the component shapes and where hooks and transport are used. They do not prove rendered behavior.
    Verify installed Grammar exports at @starci/grammar/common.
rules:
  - id: FE-FUNCTION-1
    title: A component is a named arrow const with one props parameter
    kind: mandatory
    hfsRules: [R55]
    requirement: |
      App components are named `export const` arrows with one props parameter: the connected X takes `(props: XProps)`, its
      pure XBase takes `(props: XBaseProps)`. They do not destructure at the signature. No app file has `export default`
      except a Next route file (page, layout, template, loading, error, not-found, global-error), which declares
      `const Page = ...` and ends `export default Page`. Grammar package components may destructure with defaults; that
      package convention stays internally consistent.
    rationale: |
      A single props object keeps the three-part contract readable.
    cases:
      - id: case-1
        when: "Any app component"
        write: "export const AuthenticationPageView = (props: AuthenticationPageProps) => { ... }"
      - id: case-2
        when: "Reading fields"
        write: "const { on } = props at the top, or props.props.labels and props.state inline"
      - id: case-3
        when: "Expression body when there is no local state"
        write: "export const ButtonStateSample = (props: ButtonStateSampleProps) => (<span>{props.props.label}</span>)"
      - id: case-4
        when: "A Next route file"
        write: >
          const Page = async (props: PageProps) => { const { handoffId } = await props.params; return <OperatePage
          handoffId={handoffId} /> } then export default Page
    verification:
      automated:
        - FE_ROUTE_DEFAULT_EXPORT
      manual:
        - "Confirm app components take (props: XProps) or (props: XBaseProps) without signature destructuring."
        - Confirm the only default exports are Next route files.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-2
    title: The pure half takes { state, props, on } of atoms
    kind: mandatory
    hfsRules: [R55, R67]
    requirement: |
      A split unit's `component.tsx` exports XBase taking XBaseProps = `{ state, props, on }`. `state` is XState, a union of
      drawn shapes, each value one drawing the owner approved, and never a data status (pending, loading, failed, error,
      empty, forbidden, closed). `props` holds atoms only: strings, numbers, booleans, arrays, plain objects, one `Slot<T>` per
      api and resolved labels. `on` holds actions whose arguments are atoms. The children XBase renders are written inside
      it, never handed in; only a layout also takes `children`, the router's slot. `component.tsx` exports `xDefaultState`,
      the shape the skeleton follows while a slot loads. A slot's data status renders only through `SlotView`
      (knowledge/grammars/starci/playbook.yaml guidance state-recipes). Pure leaves, composites and branches take their
      narrow fields directly.
    rationale: |
      A pure half of atoms renders from a fixture, so audit can draw every shape; keeping data status out of `state` keeps
      each approved drawing free of states nobody drew.
    cases:
      - id: case-1
        when: "A block with two apis"
        write: >
          export type HandoffBlockBaseProps = { readonly state: HandoffBlockState; readonly props: HandoffBlockData;
          readonly on: HandoffBlockActions } with HandoffBlockState = "prepared" | "sent" | "returned" and HandoffBlockData
          = { order: Slot<Order>; handoff: Slot<Handoff>; labels: HandoffBlockLabels } (examples/shape-slot)
      - id: case-2
        when: "A layout"
        write: >
          export type WorkspaceLayoutBaseProps = { readonly state: WorkspaceLayoutState; readonly props: WorkspaceLayoutData;
          readonly children: ReactNode }; children is the one non-atom, and only a layout takes it
      - id: case-3
        when: "A slot is loading, forbidden, failed or empty"
        write: >
          <SlotView slot={props.props.order} placeholder={orderPlaceholder} labels={labels.orderSlot}
          onRetry={props.on.retryOrder}>{(value, isSkeleton) => ...}</SlotView>; never a data-status branch in component.tsx
          and never "loading" in XState
      - id: case-4
        when: "The skeleton needs a shape"
        write: 'export const handoffBlockDefaultState: HandoffBlockState = "prepared" beside the XState type'
      - id: case-5
        when: "The owner has resolved a navigation or mutation"
        write: "Pass an href or an action in `on`; never a router, mutation or transport object."
    verification:
      automated:
        - starci-fe/base-props-atom
        - starci-fe/no-data-status-shape
        - starci-fe/slot-status-through-slotview
      manual:
        - Confirm every XState value is a shape the owner drew, and xDefaultState names one of them.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-3
    title: Contracts live with their owning boundary
    kind: mandatory
    hfsRules: [R30]
    requirement: |
      A public feature, module or render contract is declared beside its owner and exported from that owner's public entry.
      A local render helper keeps an unexported local props type. Components that take no input declare no empty Record props
      solely to satisfy a template.
    rationale: |
      Contract placement should reveal ownership and avoid ambiguous duplicate XProps declarations.
    cases:
      - id: case-1
        when: "A render component owns an independently useful props contract"
        write: "Declare it in the render unit or a feature-owned model file and export it through the feature entry."
      - id: case-2
        when: "A connected entry accepts route or parent input"
        write: "Declare the input beside that entry; keep transport response types behind the data mapper."
      - id: case-3
        when: "A component takes no input"
        write: "Declare it with no parameter; do not add Record<never, never> and void props."
    verification:
      automated:
        - ARCH_OWNER_EXPORT_BYPASS
      manual:
        - Confirm each exported contract has one owner and one public entry.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-4
    title: What each applicable half does
    kind: mandatory
    hfsRules: [R55, R65]
    requirement: |
      When a unit owns a product or world boundary, its index.tsx is the connected X. A connected block that needs client
      interaction or client data hooks is `"use client"`; a connected block that only reads is an async server component that
      awaits a reader from modules/api. Either way the connected half holds translations, locale, session and data, folds each
      read into a Slot with `toSlot`, picks the shape from data, resolves every label, and renders the pure XBase from the
      sibling component.tsx. Only that sibling index.tsx (and the unit's specs) imports component.tsx, and index.tsx exports X
      only, never XBase. Each Block reads its own apis; a page composes Blocks with atoms and reads none; an overlay runs
      commands only; a layout reads none. A form lives in the connected half: react-hook-form with a zod resolver, the
      schema's messages are message keys, and the connected half resolves them with next-intl before they reach XBase as
      strings. The pure sibling has no runtime world or transport dependency. Pure blocks, composites, branches and leaves
      require no twin. Intrinsic browser interaction such as refs, focus, disclosure, measurement, drag and reduced motion may
      remain in one visual unit; an authored custom helper for it still lives under hooks/ui.
    rationale: |
      Separating real world access makes presentation fixture-testable and prevents hidden requests, while avoiding
      boilerplate where there is no independent render contract.
    cases:
      - id: case-1
        when: "Connected half, client"
        write: >
          "use client"; const order = useQueryOrderSwr({ handoffId }); const state = handoff.data?.status ??
          handoffBlockDefaultState; return <HandoffBlockBase state={state} props={{ order: toSlot(order), labels }} on={{
          retryOrder: () => { void order.mutate() } }} />
      - id: case-2
        when: "Connected half, server"
        write: >
          const order = await readOrder(handoffId); return <HandoffBlockBase state={handoffBlockDefaultState} props={{ order:
          toSlot(order), labels }} on={noopActions} />
      - id: case-3
        when: "Pure half"
        write: >
          component.tsx does not call product hooks or transport and renders only resolved props and actions; no file outside
          its folder imports it, and index.tsx does not re-export XBase.
      - id: case-4
        when: "Navigation as an action"
        write: 'on={{ signedIn: () => router.replace(routes.dashboard()) }} with router from modules/i18n/navigation'
      - id: case-5
        when: "A pure half choosing between a connected block and its pure sibling"
        write: >
          Never. The pure half mounts one of them, the same one every time; the provider that resolves data lives in
          index.tsx, which hands the pure sibling its props.
      - id: case-6
        kind: exception
        when: "Intrinsic visual interaction without product-world or transport ownership"
        write: "Keep one client component; a missing component.tsx and Base twin is not a violation."
      - id: case-7
        when: "A form"
        write: >
          const form = useForm<SendHandoffFormValues>({ resolver: zodResolver(sendHandoffSchema) }) in the overlay's
          index.tsx; the schema says z.string().min(1, "sales.send.errors.fingerprintRequired"); XBase receives { value,
          error: t(key) } per field
    verification:
      automated:
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_CONNECTED_BLOCK_RENDER_PAIR
        - FE_COMPONENT_WORLD_OWNERSHIP
        - FE_CUSTOM_HOOK_LOCATION
        - FE_CLIENT_BOUNDARY
        - FE_SIZE_AND_STATE_BUDGET
        - starci-fe/base-import-pair
        - starci-fe/slot-status-through-slotview
      manual:
        - Confirm the pure sibling never imports world hooks, and require a split only for a real boundary.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-5
    title: When a helper is extracted
    kind: mandatory
    hfsRules: [R21, R56]
    requirement: |
      Boolean predicates, string builders, repeated JSX fragments and render IIFEs stay in the same file. Class variants go
      to classNames.ts. A helper shared by several hooks of one domain goes to `<domain>.shared.ts` and is defined once; a
      helper defined twice under one name is a finding.
    rationale: |
      Same-file helpers preserve unit cohesion without creating helpers/ folders under components, and one shared file per
      domain prevents copies.
    cases:
      - id: case-1
        when: "A boolean over the shape union"
        write: 'const shapeOffersSend = (state: HandoffBlockState): boolean => state === "prepared" || state === "returned" above the component'
      - id: case-2
        when: "A repeated JSX fragment"
        write: "const Turn = (props: TurnProps) => { ... } in the same file, not a new folder"
      - id: case-3
        when: "A class variant"
        write: "goes to classNames.ts as getBubbleClassName(role)"
      - id: case-4
        when: "A token reader used by every sales hook"
        write: "hooks/sales/sales.shared.ts exports salesAccessToken once; the hooks import it"
    verification:
      automated:
        - no-helper-folder-in-components
        - HFS_DUPLICATE_CODE
      manual: []
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-6
    title: Data lifecycle shape
    kind: mandatory
    hfsRules: [R50, R56]
    requirement: |
      A hook under hooks/<domain> owns one request lifecycle and calls a function of modules/api: a read is `useQueryXSwr`, a
      write `useMutateXSwr`, and one read is one api, so it feeds one slot. Unavailable inputs produce a null key, and every
      identity that changes the result participates in the key, including the viewer. Mutation identity includes the affected
      resource. The hook returns the lifecycle the feature consumer needs and maps the Outcome and wire data to the feature
      contract before presentation. A hook never calls fetch and never contains a poll loop of its own.
    rationale: |
      Cache identity and transport mapping are product behavior; neither belongs in a render component or a repository-wide
      bucket.
    cases:
      - id: case-1
        when: "Read"
        write: >
          export const useQuerySalesSummarySwr = ({ token }: Params) => useSWR<SalesSummary | null>(token === undefined ?
          null : [QUERY_SALES_SUMMARY_SWR_KEY, token], () => readSalesSummaryClient(token))
      - id: case-2
        when: "Write"
        write: >
          export const useMutateSendHandoffSwr = (handoffId?: string) => useSWRMutation(handoffId === undefined ? null :
          [MUTATE_SEND_HANDOFF_SWR_KEY, handoffId], (_key, { arg }: Trigger) => sendHandoff(arg))
      - id: case-3
        when: "Key"
        write: "null when the input is missing; the viewer identity is part of a read key"
    verification:
      automated:
        - FE_SWR_KEY_IDENTITY
        - FE_SWR_MUTATION_RESOURCE_IDENTITY
        - FE_CUSTOM_HOOK_LOCATION
        - FE_FETCH_OUTSIDE_TRANSPORT
      manual:
        - Confirm the declared identity set includes every domain input that can change the result.
    relatedExamples:
      - connected-block

  - id: FE-FUNCTION-7
    title: Route file
    kind: mandatory
    hfsRules: [R54, R53]
    requirement: |
      A page.tsx declares `const Page` and ends `export default Page`, and exports `generateMetadata`. It may resolve
      framework-owned server inputs, turns params into atoms, then mounts one page-level visual owner. A resource that does
      not exist ends in `notFound()` here: 404 is never a page state, a shape or a slot status. A redirect or notFound-only
      route mounts none. It does not compose a second shell or root, make a product drawing decision, hold an inline component
      or call a hook.
    rationale: |
      Route files stay thin so drawing ownership remains in pages and blocks.
    cases:
      - id: case-1
        when: "Visual page.tsx"
        write: >
          const Page = async (props: PageProps) => { const { handoffId } = await props.params; return <OperatePage
          handoffId={handoffId} /> } then export default Page; the route makes no drawing decision
      - id: case-2
        kind: exception
        when: "Redirect or notFound-only page.tsx"
        write: "Resolve params as needed and redirect or terminate without a visual tree."
    verification:
      automated:
        - FE_ROUTE_FILES_THIN
        - FE_ROUTE_DEFAULT_EXPORT
        - FE_NEXT_CONVENTIONS
      manual: []
    relatedExamples: []
