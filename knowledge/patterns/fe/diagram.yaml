id: fe.diagram
title: Diagrams
purpose: |-
  How are text diagrams rendered? mermaid, in a block.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
