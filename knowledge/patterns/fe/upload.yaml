schema: starci/knowledge-source@1
id: fe.upload
title: File upload
purpose: |-
  How does a user upload a file? react-dropzone in a block and a presigned PUT through modules/api/rest.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [fe.modules.api]
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-UPLOAD
    title: "react-dropzone and a presigned PUT"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      A drop zone uses react-dropzone in a block; the file is sent by a presigned PUT through modules/api/rest after a
      GraphQL mutation (or REST call) returns the presigned URL, reported through useRestWithToast; large files never
      pass through a front-end server. filepond and uppy are refused.
    rationale: |-
      A presigned upload keeps media out of the front end and the API process.
    cases:
      - id: case-1
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a lite app uploaded through Supabase Storage from the front end"
        write: "The back end issues a presigned URL (the Supabase storage integration in lite, object storage in full) and the front end PUTs the file with axios."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
