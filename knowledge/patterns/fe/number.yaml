schema: starci/knowledge-source@1
id: fe.number
title: Money and decimals
purpose: |-
  How is money computed and shown? decimal.js in modules/utils for arithmetic; the next-intl formatter for display.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [fe.modules]
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-NUMBER
    title: "decimal.js for money arithmetic, next-intl for display"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      Money and decimal arithmetic uses decimal.js in modules/utils (never float math on money); display uses the next-
      intl number formatter with the currency. big.js, bignumber.js and numeral are refused.
    rationale: |-
      Float arithmetic loses cents, and one formatter keeps currency display per locale.
    cases:
      - id: case-1
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a cart summed prices with numbers"
        write: "Sum with decimal.js in modules/utils and display with the next-intl formatter."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
