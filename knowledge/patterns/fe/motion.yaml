schema: starci/knowledge-source@1
id: fe.motion
title: Motion
purpose: |-
  Which motion library does the front end use? framer-motion, added when a feature needs motion.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: []
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-MOTION
    title: "framer-motion when a feature needs motion"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      Animation beyond the grammar transitions uses framer-motion and honours reduced motion; react-spring and gsap are
      refused.
    rationale: |-
      One motion library keeps timing and reduced-motion handling consistent.
    cases:
      - id: case-1
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a feature added a second animation library"
        write: "Use framer-motion."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
