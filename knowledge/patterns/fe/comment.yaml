schema: starci/knowledge-source@1
id: fe.comment
title: Comment
purpose: |
  Given a frontend declaration or statement, does it carry a comment, where does it sit and what does it say? Comments state
  ownership and consequence, never the name, and never switch a rule off.
appliesTo:
  - frontend
family: fe
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/patterns/be/comment.yaml
  limitations: |
    A lint rule proves that a comment exists and has the right form. Whether it explains the actual consequence is agent
    review.
rules:
  - id: FE-COMMENT-1
    title: Every export carries a docblock
    kind: mandatory
    hfsRules: [R18, R91]
    requirement: |
      Every export carries a /** */ docblock. The one-liner states ownership or role ("owned by", "resolved by the connected
      owner", "no transport lives here"), not the name. Lint require-export-jsdoc enforces presence.
    rationale: |
      The docblock is what an editor shows at every call site.
    cases:
      - id: case-1
        when: "A component"
        write: '/** Render the connected cart route. */ or /** Draw every owner state from resolved fixture data; no transport or translation lives here. */'
      - id: case-2
        when: "A props type"
        write: '/** Complete state, data and action contract for the pure advisor surface. */'
      - id: case-3
        when: "A class-name export"
        write: '/** Messenger-like visual roles owned by the course-advisor surface. */'
      - id: case-4
        when: "A constant"
        write: '/** Canonical state inventory shared by connected owners and their presentational twins. */'
      - id: case-5
        when: "A route"
        write: '/** The routed authentication screen. The route mounts one page and makes no drawing decision. */'
    verification:
      automated:
        - HFS_INLINE_SUPPRESSION
        - FE_SOURCE_FORM
        - FE_SOURCE_LAYOUT_INVALID
      manual: []
    relatedExamples: []

  - id: FE-COMMENT-2
    title: Fields are documented when the name is not enough
    kind: mandatory
    hfsRules: [R18]
    requirement: |
      Document handlers, source-sensitive props, hook params and Grammar props when the name alone does not carry the
      constraint. Self-evident fields carry nothing.
    rationale: |
      A comment on every field trains readers to skip comments.
    cases:
      - id: case-1
        when: "A handler"
        write: '/** Called after the panel establishes a session. */ readonly signedIn?: () => void'
      - id: case-2
        when: "A prop whose source matters"
        write: '/** URL-owned journey rendered before the browser hydrates stored challenge metadata. */ readonly initialMode?: AuthMode'
      - id: case-3
        when: "A hook param"
        write: '/** The short human-facing identifier the route carries, not a UUID. */ displayId?: string'
      - id: case-4
        when: "Self-evident fields"
        write: "readonly id: string and readonly body: string carry nothing"
    verification:
      automated:
        - HFS_INLINE_SUPPRESSION
      manual:
        - Review that each field comment adds a constraint the name does not carry.
    relatedExamples: []

  - id: FE-COMMENT-3
    title: Decision prose on hooks and documents
    kind: mandatory
    hfsRules: [R18]
    requirement: |
      Hooks and GraphQL documents carry multi-paragraph docblocks whose paragraphs open with a capitalized claim and then give
      the reason. @param is used where it adds a constraint and is not the norm for pages.
    rationale: |
      Cache keys and selection sets encode decisions that a later reader cannot rediscover from the code.
    cases:
      - id: case-1
        when: "A key decision"
        write: 'THE DISPLAY ID IS PART OF THE KEY, which is what makes two pages in one session safe: they never share cached state.'
      - id: case-2
        when: "A rejected alternative"
        write: 'IT SENDS displayId AND NEVER id, because the server resolves the public identifier and answers an unknown one with a not-found outcome.'
    verification:
      automated:
        - HFS_INLINE_SUPPRESSION
      manual:
        - Review that the claim, the evidence and the rejected alternative are stated.
    relatedExamples: []

  - id: FE-COMMENT-4
    title: Line comments are sentences about why
    kind: mandatory
    hfsRules: [R18]
    requirement: |
      // comments sit above the statement and explain a consequence; none restates the code. A rule that must be different in
      a file is changed in .claude, never switched off inline.
    rationale: |
      The reason and the consequence are what the code cannot say.
    cases:
      - id: case-1
        when: "A guard's reason"
        write: '// a server-rendered form has no submit handler yet, so its secret-bearing controls stay disabled until hydration'
      - id: case-2
        when: "Copy decision"
        write: '// the transport case does not say the details were wrong, because nobody knows that: the request never got an answer'
    verification:
      automated:
        - HFS_INLINE_SUPPRESSION
      manual:
        - Review that the comment explains a consequence.
    relatedExamples: []

  - id: FE-COMMENT-5
    title: What a comment never contains
    kind: mandatory
    hfsRules: [R18, R58, R91]
    requirement: |
      Comments never contain a second language, emoji, an inline suppression (eslint-disable, ts-ignore, ts-expect-error) or a
      restated symbol name alone. User copy lives in modules/i18n/messages/<locale>.json and is never written in source, with
      no escape annotation.
    rationale: |
      A suppression turns a rule into a convention, and copy in source cannot be translated or checked.
    cases:
      - id: case-1
        when: "A second language"
        write: "English only in identifiers, string literals, comments and test titles (lint no-vietnamese-in-source); copy lives in the i18n catalogs (modules/i18n/messages/<locale>.json)"
      - id: case-2
        when: "Emoji"
        write: "none (lint no-emoji-in-source)"
      - id: case-3
        when: "A lint suppression"
        write: "none; HFS_INLINE_SUPPRESSION fails the change and the code is fixed"
      - id: case-4
        when: "A restated name"
        write: '/** Props for CartPage. */ alone is not accepted; the docblock adds what the page owns'
    verification:
      automated:
        - HFS_INLINE_SUPPRESSION
        - FE_I18N_LITERAL
        - FE_SOURCE_FORM
        - FE_SOURCE_LAYOUT_INVALID
      manual: []
    relatedExamples: []
