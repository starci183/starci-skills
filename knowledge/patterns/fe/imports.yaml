schema: starci/knowledge-source@1
id: fe.imports
title: Imports
purpose: |
  Given a frontend file, what may it import, through which path, and in which order?
appliesTo:
  - frontend
family: fe
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - tsconfig.json (paths)
    - eslint.config.mjs
    - src/hooks/index.ts
    - src/components/**
    - src/hooks/swr/**
  limitations: |
    Cited counts and notes are historical observations at skill commit
    edf72554425f918e80c9205e9c6db10596e722f0, not a census of the current project. Inspect actual
    source, manifest/lockfile, aliases and lint/test configuration in the selected repository before use.
    Historical links supply provenance, not scripts or execution instructions.
    One case is closed here: FE-IMPORTS-7 Case 9 folded into Case 7, because where a band is mounted
    and whether a band was drawn by hand are one law about one object and were drifting as two. The
    historical observations that justified the case are recorded in
    https://github.com/starci183/starci-skills/blob/edf72554425f918e80c9205e9c6db10596e722f0/tests/evidence/20260903-presentation-sweep.json.
    Verify installed Grammar exports at the public entry @starci/grammar/common; do not revive stale
    @grammar/* aliases as canonical.
rules:
  - id: FE-IMPORTS-1
    title: Paths
    kind: mandatory
    requirement: |
      Same-unit imports use relative paths. Cross-folder imports inside one configured source root may
      use that root's declared alias. Cross-package imports use the dependency package name and a declared
      package export. Grammar objects come from a verified installed family entry. Type-only imports mark types.
    rationale: |
      Aliases are source-root conveniences, while package exports are ownership contracts. TypeScript
      paths do not create or replace a package API.
    cases:
      - id: case-1
        when: "Another owner under the same configured src root"
        write: "Use the repository's resolved alias, such as @/features/pages/AuthenticationPage."
      - id: case-2
        when: "A Grammar object"
        write: >
          import { SurfaceCard, Text, Heading, Badge, Button } from "@starci/grammar/common" —
          current public entry, verified against the source package exports
      - id: case-3
        when: "HeroUI"
        write: >
          import { cn } from "@heroui/react" in classNames.ts (136 of 151); vendor components in leaves
          (48) and blocks (74); page component.tsx never (0/49)
      - id: case-4
        when: "Files inside the same unit"
        write: "./component, ./classNames, ./index"
      - id: case-5
        when: "Type only"
        write: >
          import type { AuthenticationMode } from "@/features/pages/AuthenticationPage"; type-only syntax does
          not permit bypassing an owner or package public entry.
      - id: case-6
        when: "A local file dependency or workspace package"
        write: >
          Import @starci/grammar/common through package.json exports; never reach packages/grammar/src
          through @/ or a tsconfig path.
    verification:
      automated: []
      manual:
        - Verify @starci/grammar/common exports before importing; do not use package root or former @grammar/*.
    relatedExamples:
      - connected-block

  - id: FE-IMPORTS-2
    title: Order
    kind: residual
    requirement: |
      Import order is not lint-enforced (no import/order rule is configured). The dominant order, read
      from the first import of 417 component files, is framework, then Grammar, then own tiers, then
      own unit. Historical source interleaves Grammar and @/components/… imports; some files order
      imports alphabetically by binding instead. The order above is dominant, not universal.
    rationale: |
      Recording the dominant order without claiming mechanical enforcement avoids inventing a lint
      rule the reference did not configure.
    cases:
      - id: case-1
        when: "Framework first"
        write: "react (108 files), next-intl (45), next / next/navigation (16), swr"
      - id: case-2
        when: "Then Grammar"
        write: "@starci/grammar/common"
      - id: case-3
        when: "Then own tiers"
        write: >
          @/components/branches/…, @/components/leaves/…, @/hooks, @/modules/… (88 files start with
          @/components)
      - id: case-4
        when: "Own unit last"
        write: >
          import { aiChatClassNames, getAiChatBubbleClassName } from "./classNames", import {
          AuthenticationPageView } from "./component"
    verification:
      automated: []
      manual: []
    relatedExamples: []

  - id: FE-IMPORTS-3
    title: Data enters through the owning feature or module
    kind: mandatory
    requirement: |
      Every authored custom hook lives under hooks/<domain>. Feature owners and connected blocks import
      those hooks through a resolved hooks public entry; hooks reach transport/domain capabilities through
      module public entries. Leaves, branches and composites may call a hooks/ui intrinsic custom hook whose
      resolved implementation remains free of product/session/API lifecycle. They do not call product hooks.
    rationale: |
      One hook location makes declaration ownership auditable while resolved implementation closure keeps
      intrinsic UI helpers distinct from product lifecycle. A root barrel is optional, not a waiver.
    cases:
      - id: case-1
        when: "Authentication owns a browser request lifecycle"
        write: >
          import { useAuthentication } from "@/hooks"; its declaration is under
          src/hooks/authentication/useAuthentication.ts.
      - id: case-2
        when: "A hook reaches GraphQL"
        write: >
          Import the typed operation/client through @/modules/api; do not import transport from presentation.
      - id: case-3
        when: "A presentation needs a feature model"
        write: >
          Import the feature/view type through the feature entry, not a GraphQL response or Apollo type.
      - id: case-4
        when: "A leaf needs an intrinsic custom auto-scroll hook"
        write: >
          Call hooks/ui/useAutoScroll through the selected hooks entry. The resolved hook may use React
          refs/effects; reaching session, transport, modules or product hooks makes it product-world state.
    verification:
      automated:
        - FE_CUSTOM_HOOK_LOCATION
        - FE_COMPONENT_WORLD_OWNERSHIP
      manual:
        - Confirm a data lifecycle has a feature owner and reusable presentation does not import it.
    relatedExamples:
      - connected-block

  - id: FE-IMPORTS-4
    title: Responsibility direction
    kind: mandatory
    requirement: |
      App adapters import internal code only through public entries below features/{pages,layouts,overlays},
      including type-only imports and re-exports. Features compose components, hooks and modules. Components
      never point to app/features; hooks never point to app/features/components; modules never point to
      app/features/components/hooks. Product visuals may import Grammar. Re-export barrels and aliases obey
      the same resolved direction.
    rationale: |
      One-way responsibility direction keeps route/product/data ownership above reusable presentation
      across single-source repositories and workspaces.
    cases:
      - id: case-1
        when: "Route → feature page"
        write: >
          import { AuthenticationPage } from "@/features/pages/AuthenticationPage"
      - id: case-2
        when: "Feature → module and visual contract"
        write: >
          The feature page imports @/components/blocks/… and @/hooks; its hook imports @/modules/api.
      - id: case-3
        when: "Reusable visual → Grammar and approved vendor"
        write: >
          import type { ButtonVariant } from "@starci/grammar/common"; world-reading hooks or imports
          from higher tiers are not valid leaf precedents
      - id: case-4
        when: "App needs an internal provider/helper/type"
        write: "Move its owner behind a feature public entry; app-local sibling imports are not a loophole."
      - id: case-5
        when: "Pure half → data layer"
        write: "never at runtime; 18 component.tsx files use import type from @/modules/api/graphql/queries/… only"
    verification:
      automated:
        - FE_APP_INTERNAL_IMPORT_OUTSIDE_FEATURES
        - FE_FEATURE_DEPENDENCY_DIRECTION
      manual:
        - Confirm leaves do not import higher tiers or world-reading hooks.
    relatedExamples:
      - connected-block

  - id: FE-IMPORTS-5
    title: Vendor boundaries
    kind: mandatory
    requirement: |
      Only the Icon leaf imports @heroicons/react. Headings come from Grammar Heading, never raw h2.
      Grammar peerDependencies are exactly @heroui/react and react.
    rationale: |
      Vendor glyph and heading ownership stays behind Grammar so product units compose one surface.
    cases:
      - id: case-1
        when: "Glyphs"
        write: >
          only the Icon leaf imports @heroicons/react (1 component file); everything else takes the
          Grammar Icon with a source prop (lint no-vendor-icon-outside-icon-leaf,
          heroicons-is-the-glyph-vendor)
      - id: case-2
        when: "Headings"
        write: "Heading from Grammar, never a raw <h2> (lint no-heading-tag-outside-heading-component)"
      - id: case-3
        when: "Grammar package dependencies"
        write: >
          peerDependencies are exactly @heroui/react and react; dependencies is empty
          (package-boundary.test.mjs)
    verification:
      automated:
        - no-vendor-icon-outside-icon-leaf
        - heroicons-is-the-glyph-vendor
        - no-heading-tag-outside-heading-component
      manual: []
    relatedExamples: []

  - id: FE-IMPORTS-6
    title: Re-exports
    kind: mandatory
    requirement: |
      Feature, module and package public entries use explicit named exports for their supported contract,
      never `export *` across ownership boundaries. Grammar family entries use named re-exports with the
      package's emitted suffix convention. Local block/page re-exporting remains optional.
    rationale: |
      Explicit named re-exports keep the public surface auditable.
    cases:
      - id: case-1
        when: "A feature public entry"
        write: "Export its route-facing entry, application contract and intended hooks explicitly."
      - id: case-2
        when: "Grammar family entry"
        write: >
          export { COMMON_SPACING_SCALE, COMMON_SPACING_TOKENS, type CommonSpacingStep, … } from
          "./spacing.js" — named, with .js suffix
      - id: case-3
        kind: residual
        when: "Block index re-exporting its twin"
        write: >
          export * from "./component" at the end of index.tsx — 19 of 95 block indexes and 19 of 49
          page indexes do this; the majority do not
    verification:
      automated: []
      manual: []
    relatedExamples: []

  - id: FE-IMPORTS-7
    title: Forbidden
    kind: mandatory
    requirement: |
      Do not bypass another owner or package public entry, let resolved presentation runtime-import
      transport, default-export from reusable src/components, inline
      eslint-disable, use namespace outside the configured exception, import Grammar from the package
      root or mixed families, load a second family stylesheet under one root, clone Common shell
      geometry, or put product names/business logic into Grammar public exports.
    rationale: |
      These bans protect mockability, lint integrity and Grammar family boundaries.
    cases:
      - id: case-1
        when: "A reusable visual imports a data hook or a consumer deep-imports another feature"
        write: "Move lifecycle to the feature owner or consume the owner's explicit public entry."
      - id: case-2
        when: "Default export from src/components"
        write: "0 exist"
      - id: case-3
        when: "Inline lint config"
        write: >
          eslint-disable appears in 0 files; src/components/blocks/**/{index,component}.tsx run with
          noInlineConfig: true
      - id: case-4
        kind: exception
        when: "namespace"
        write: "only src/modules/api/graphql/clients/options.ts, by config exception"
      - id: case-5
        when: "Mixing families, or importing the package root"
        write: >
          renderers and prop types come from the installed public family entry or
          @starci/grammar/common; never from the package root or mixed families. Verify the exact
          exported entry and do not copy former @grammar aliases.
      - id: case-6
        when: "A second family stylesheet under one root"
        write: >
          select one family at the composition root and load its verified stylesheet once; do not
          invent an entry from an old package version
      - id: case-7
        when: >
          An app-local clone of a Common renderer, an anonymous layout, or a shell band the application
          draws itself
        write: >
          Use the Common renderer and pass props. A shell unit — a folder whose name ends in Layout,
          Shell, TopBar, Navbar, Nav, Sidebar or Rail — composes a Grammar shell object and writes
          classes only inside the slots it is handed. The test is not whether a shell folder holds
          classes, it is whether it composes a shell object at all: a bar assembled from divs is shell
          geometry whatever it is named, and the band, its inset and its separator belong to the
          composed object. The same case places the band. It is mounted beside the page in the route
          layout, never inside a shell object's header slot, because that slot is wrapped in a banner by
          its owner while a band already is one, so the nesting publishes two banner landmarks for one
          band; the slot is the page-level hero and takes page copy
      - id: case-8
        when: "A product name in a Grammar public export, or business logic inside Common/Core"
        write: >
          Learn, Console, Dashboard stay in product code; routes, permissions, persistence and effects
          never enter the package
    verification:
      automated: []
      manual:
        - Confirm Grammar imports use verified @starci/grammar/common exports only.
    relatedExamples: []
openQuestions:
  - id: hooks-to-modules-api-path-style
    summary: |
      Hooks reach modules/api through ../../modules/api/… in 57 files and @/modules/api/… in 56.
      This is historical Academy debt. New or changed feature owners use a same-feature relative path
      and consume the API module through its public entry; no global path style is inferred from counts.
  - id: connected-index-reexport-component
    summary: |
      export * from "./component" at the end of a connected index.tsx is present in 19/95 blocks
      and absent in the rest. Not legislated.
