schema: starci/knowledge-source@1
id: fe.folder
title: Folder
purpose: |
  Given a piece of frontend code, which directory and which file name does it get? Apply the HFS frontend tree
  (knowledge/hfs/README.md section 6, slots fe.*).
appliesTo:
  - frontend
family: fe
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - https://nextjs.org/docs/app/getting-started/project-structure
    - https://next-intl.dev/docs/routing
    - packages/grammar/src/**
  limitations: |
    Folder rules place code by responsibility. They do not prove rendered behavior or accessibility. Inspect the
    selected app's actual source, manifests, aliases and lint configuration. Verify installed Grammar
    exports at @starci/grammar/common.
rules:
  - id: FE-FOLDER-1
    title: Responsibility directories
    kind: mandatory
    hfsRules: [R01, R02, R59, R64, R26, R54, R56, R91, R94]
    requirement: |
      The front end of every app (`fe/`) is an fe/apps/<app>/ monorepo even with one app — each app declared in
      `hfs.json` `sides.fe.apps` with kind `next` (slot `fe.app.next`; the scaffold writes `landing` and `app`) — and all
      product source lives under fe/apps/<app>/src. An fe/src/ does not exist. Each Next source root
      (fe/apps/<app>/src) uses app/ for framework adapters; features/{pages,layouts,overlays} for route-facing product
      composition; components/{blocks,composites,branches,leaves} for product visuals; hooks/<domain> for React hooks;
      and modules/<capability> for cohesive reusable technical and domain capabilities. Every app carries the required
      module instances of slot `fe.modules` and one brand.css under modules/brand when it sets brand tokens
      (`fe.modules.brand`). No other empty role
      folder is required. Grammar remains a separate product-agnostic package. The only files that may sit directly in the
      source root (the directory holding app/) are the framework-pinned root files listed in frameworkPinnedRootFiles
      below: Next.js loads them from that exact place. Each is a thin framework adapter whose internal imports enter
      modules or a feature public entry only; every other rule still applies to it, except that the export names the
      framework mandates there (frameworkPinnedRootExports) keep their framework spelling. HFS uses proxy.ts for locale
      routing; a middleware.* file is refused on Next 16 and later by the Next conventions check and the slot
      fe.source-root-pinned, even though the machine list names it as a file Next loads. Any other file at the source
      root, including a helper folder beside a pinned file, has no owner and is refused.
    frameworkPinnedRootFiles:
      # Machine list read by scripts/hfs/architecture/framework-pinned.mjs (FE_SOURCE_LAYOUT_INVALID accepts exactly
      # these basenames directly in a Next source root; FE_TIER_DIRECTION keeps them thin). Exact names,
      # case-sensitive, no globs. It lists what the framework loads from the source root. Which of them a repository may
      # keep is decided by the slot fe.source-root-pinned and FE_NEXT_CONVENTIONS, not by this list.
      # Machine list read by scripts/hfs/architecture/framework-pinned.mjs (FE_SOURCE_LAYOUT_INVALID
      # accepts exactly these basenames directly in a Next source root;
      # their imports follow the FE_TIER_DIRECTION matrix). Exact names, case-sensitive, no globs. Supervisor rulings
      # (proxy is the Next 16 name of middleware, listed so the list survives the upgrade).
      - middleware.ts
      - middleware.js
      - middleware.mjs
      - proxy.ts
      - proxy.js
      - proxy.mjs
      - instrumentation.ts
      - instrumentation.js
      - instrumentation.mjs
      - instrumentation-client.ts
      - instrumentation-client.js
      - instrumentation-client.mjs
      - next-env.d.ts
    frameworkPinnedRootExports:
      # Export names the framework mandates in a pinned root file, keyed by file stem: a naming review keeps exactly these
      # names in exactly these files when they sit directly in a Next source root.
      middleware: [config, middleware, default]
      proxy: [config, proxy, default]
      instrumentation: [register, onRequestError]
      instrumentation-client: [onRouterTransitionStart]
    rationale: |
      One fixed source root per app keeps every front end the same shape while preventing app helpers, component-local
      hooks and feature-local transport buckets from becoming undeclared owners.
    cases:
      - id: case-1
        when: "A routed authentication scenario"
        write: "fe/apps/<app>/src/features/pages/AuthenticationPage/index.tsx"
      - id: case-2
        when: "A reusable API client, reader or session capability"
        write: >
          fe/apps/<app>/src/modules/api/ or fe/apps/<app>/src/modules/session/ with one explicit public index.ts entry
      - id: case-3
        when: "A reusable product visual without scenario ownership"
        write: "an owner folder of slot `fe.components` under the layer it belongs to — for example fe/apps/<app>/src/components/leaves/<Name>/index.tsx"
      - id: case-4
        when: "A React hook"
        write: "fe/apps/<app>/src/hooks/<domain>/useAutoScroll.ts; built-in React hook calls may remain in visuals"
      - id: case-5
        kind: exception
        when: "Next.js only loads the file from the source root (proxy, instrumentation, instrumentation-client, next-env.d.ts)"
        write: >
          fe/apps/<app>/src/proxy.ts beside fe/apps/<app>/src/app/ as a thin adapter; locale routing logic lives in
          fe/apps/<app>/src/modules/i18n/ and the adapter imports it; the names the framework mandates there
          (frameworkPinnedRootExports, for example export const config = { matcher }) keep their framework spelling
      - id: case-6
        when: "Any other file or folder directly under the source root (an `i18n/request.ts` or a `config.ts` there), and an fe/src/"
        write: >
          Move it to its owner, for example fe/apps/<app>/src/modules/i18n/request.ts, and point framework configuration
          (fe/apps/<app>/next.config.ts) at the new path
      - id: case-7
        when: "The per-slot data-status recipe"
        write: >
          fe/apps/<app>/src/components/composites/SlotView/index.tsx, fe/apps/<app>/src/modules/slot/index.ts (Slot, toSlot,
          SlotLabels) and fe/apps/<app>/src/hooks/slot/useSlotLabels.ts, one copy each (examples/shape-slot)
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_MIN_INSTANCES
        - HFS_REQUIRED_FILE_MISSING
        - HFS_ROOT_ENTRY_MISSING
        - HFS_APPS_REQUIRED
        - HFS_APP_LAYOUT_INVALID
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
        - FE_I18N_PLACEMENT
        - FE_I18N_NAVIGATION
        - FE_I18N_FORMATTER
        - FE_APP_ISOLATION
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
        - FE_ROUTE_FILES_THIN
        - FE_NEXT_CONVENTIONS
        - FE_PAGE_METADATA_MISSING
        - FE_ROUTE_ONE_PAGE
        - FE_ROUTE_DRAWING_DECISION
        - FE_ROUTE_CLIENT_BOUNDARY
        - FE_ROUTE_CLIENT_HOOK
        - FE_ROUTE_DEFAULT_EXPORT
        - FE_HOOKS_ARE_HOOKS
        - FE_CUSTOM_HOOK_LOCATION
        - FE_BLOCK_PRODUCT_HOOK_DEFINITION
        - FE_COMPONENT_DEEP_HOOK_IMPORT
        - FE_SOURCE_FORM
        - FE_SOURCE_LAYOUT_INVALID
        - FE_SLOT_FILE_ROLE
      manual:
        - Confirm the unit's responsibility and public entry, rather than assigning it by consumer count.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-2
    title: Discoverable files for one unit
    kind: mandatory
    hfsRules: [R02, R55, R65, R20, R92]
    requirement: |
      A split unit (a connected block, and a feature page, layout or overlay) uses index.tsx for the connected X and
      sibling component.tsx for the pure XBase, its XBaseProps and xDefaultState, plus XState when the shape is its own union
      (a shape that is a domain status is typed with that status, never a second name for it). Only that index.tsx imports
      component.tsx. Pure blocks, composites, branches and leaves use index.tsx only and never gain an
      empty twin. classNames.ts is present only when the unit owns class strings. Budgets: component.tsx 300 lines,
      connected index.tsx 200 lines, at most 6 data hooks and 6 useState per connected unit.
    rationale: |
      Stable basenames make class names and the connected and presentational split discoverable without forwarding
      twins, and budgets keep a unit reviewable.
    cases:
      - id: case-1
        when: "Connected block with product-world lifecycle"
        write: "blocks/CatalogBlock/{index.tsx,component.tsx}; every nonempty index render reaches the sibling"
      - id: case-2
        when: "Feature page, layout or overlay"
        write: >
          features/pages/OperatePage/{index.tsx,component.tsx,classNames.ts}, features/layouts/WorkspaceLayout/…,
          features/overlays/SendHandoffOverlay/… (examples/shape-slot)
      - id: case-3
        when: "Single visual unit"
        write: "leaves/ButtonStateSample/{classNames.ts,index.tsx}; no component.tsx twin without a separate world owner"
      - id: case-4
        when: "Custom hook or reusable module"
        write: "hooks/<domain>/useX.ts or modules/<capability>/...; do not create visual twins"
    verification:
      automated:
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_MIN_INSTANCES
        - HFS_REQUIRED_FILE_MISSING
        - HFS_ROOT_ENTRY_MISSING
        - HFS_APPS_REQUIRED
        - HFS_APP_LAYOUT_INVALID
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
        - FE_CLIENT_BOUNDARY
        - FE_CLIENT_SERVER_IMPORT
        - FE_CLIENT_REACHES_SERVER
        - FE_SERVER_ONLY_MARK
        - FE_STORAGE_OUTSIDE_MODULES
        - FE_DANGEROUS_HTML
        - FE_SIZE_AND_STATE_BUDGET
        - FE_LIST_KEY
        - FE_EFFECT_CLEANUP
        - FE_SWALLOWED_ERROR
        - FE_CONSOLE_CALL
        - HFS_SIZE_GROWTH
        - HFS_SIZE_SOFT_BACKLOG
        - FE_COMPONENT_API
        - FE_COMPONENT_WORLD_OWNERSHIP
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_CONNECTED_BLOCK_RENDER_PAIR
        - FE_PURE_REACHES_DATA
        - FE_PURE_WORLD_HOOK
        - FE_PURE_WORLD_IMPORT
      manual:
        - Confirm each file owns a real responsibility; do not add a component.tsx twin by habit.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-3
    title: Route files adapt to one visual owner and every app has its boundaries
    kind: mandatory
    hfsRules: [R53, R54, R55, R57, R26]
    requirement: |
      Route files under app/[locale]/ (page, layout, template, loading, not-found) are server components. A route may
      resolve framework server inputs (params, searchParams, headers, cookies), then mounts one page-level visual owner.
      A route whose complete responsibility is redirect or notFound mounts none. A route file holds no inline component, no
      drawing decision and no hook, and a redirect from an old URL lives in next.config redirects(), never in a page. Every app has
      app/global-error.tsx, app/[locale]/layout.tsx, app/[locale]/error.tsx and app/[locale]/not-found.tsx, and a loading.tsx
      for each route group that reads data. Each page exports generateMetadata. force-dynamic on a client page is forbidden.
    rationale: |
      Keeping default exports in the App Router layer prevents components from becoming route-coupled, and mandatory
      boundaries turn a render failure into a recoverable screen instead of a blank page.
    cases:
      - id: case-1
        when: "A route"
        write: >
          app/[locale]/authentication/page.tsx: const AuthenticationRoute = async () => <AuthenticationPage />, then export
          default AuthenticationRoute
      - id: case-2
        kind: exception
        when: "Redirect or notFound adapter"
        write: "Resolve framework inputs and redirect or terminate without a visual owner."
      - id: case-3
        when: "Global app files"
        write: >
          app/globals.css, app/global-error.tsx, app/[locale]/error.tsx, app/[locale]/not-found.tsx, app/sitemap.ts,
          app/robots.ts, app/health/{live,ready}/route.ts
    verification:
      automated:
        - FE_ERROR_BOUNDARY_MISSING
        - FE_SUSPENSE_NULL_FALLBACK
        - FE_ROUTE_FILES_THIN
        - FE_NEXT_CONVENTIONS
        - FE_PAGE_METADATA_MISSING
        - FE_ROUTE_ONE_PAGE
        - FE_ROUTE_DRAWING_DECISION
        - FE_ROUTE_CLIENT_BOUNDARY
        - FE_ROUTE_CLIENT_HOOK
        - FE_ROUTE_DEFAULT_EXPORT
        - FE_CLIENT_BOUNDARY
        - FE_CLIENT_SERVER_IMPORT
        - FE_CLIENT_REACHES_SERVER
        - FE_SERVER_ONLY_MARK
        - FE_STORAGE_OUTSIDE_MODULES
        - FE_DANGEROUS_HTML
        - FE_OWNER_REACHABLE
        - FE_ROUTE_HARDCODED
        - FE_HREF_RESOLVES
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
      manual:
        - Confirm visual routes have one page owner and redirect-only routes have no visual tree.
    relatedExamples: []

  - id: FE-FOLDER-4
    title: Hooks are hooks; readers and transport live in modules
    kind: mandatory
    hfsRules: [R56, R50, R49, R21, R26]
    requirement: |
      hooks/<domain>/ holds React hooks (use*.ts, one hook per file) and exactly one <domain>.shared.ts for shared
      non-hook helpers of that domain (key builders, token readers). A file in hooks/ that is not a hook and is not the shared
      file is a finding. Server-side readers (fetch and map, no React) live in modules/api/<domain>/read-*.ts and are
      wrapped in React cache() when several blocks call them in one request. Generic client plumbing, the Outcome type,
      the generated wire types (from be/contracts/, through the root codegen) live in modules/api; environment reading lives in modules/config; every
      href builder lives in modules/routes; locale routing lives in modules/i18n; colour values live in modules/brand.
      A helper name defined twice across hook files is a finding.
    rationale: |
      A rule that says what a hooks folder is also says where everything else goes, so nobody copies a helper sixteen
      times or fills hooks/ with server fetch functions.
    cases:
      - id: case-1
        when: "Authentication request lifecycle"
        write: "fe/apps/<app>/src/hooks/authentication/useAuthentication.ts"
      - id: case-2
        when: "A helper shared by the hooks of one domain"
        write: "fe/apps/<app>/src/hooks/sales/sales.shared.ts, for example useSalesAccessToken's token reader"
      - id: case-3
        when: "A server read used by several blocks"
        write: "fe/apps/<app>/src/modules/api/sales/read-sales-summary.ts, exported through modules/api/index.ts"
      - id: case-4
        when: "The API client"
        write: "fe/apps/<app>/src/modules/api/client.ts and fe/apps/<app>/src/modules/api/outcome.ts"
      - id: case-5
        when: "Intrinsic custom helper"
        write: "fe/apps/<app>/src/hooks/ui/useAutoScroll.ts; direct useRef and useState calls may remain in their visual owner"
    verification:
      automated:
        - FE_HOOKS_ARE_HOOKS
        - FE_CUSTOM_HOOK_LOCATION
        - FE_BLOCK_PRODUCT_HOOK_DEFINITION
        - FE_COMPONENT_DEEP_HOOK_IMPORT
        - FE_TRANSPORT_OWNER
        - FE_EFFECT_FETCH
        - FE_SWR_KEY_IDENTITY
        - FE_SWR_MUTATION_RESOURCE_IDENTITY
        - FE_ENV_OWNER
        - HFS_DUPLICATE_CODE
        - HFS_DUPLICATE_SYMBOL
        - FE_CROSS_APP_DUPLICATE
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
      manual:
        - Confirm each lifecycle has one feature owner and transport mechanics have one module owner.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-5
    title: Package unit
    kind: mandatory
    hfsRules: [R63]
    requirement: |
      A shared front-end package is fe/packages/<pkg>/ with package.json (explicit exports), src/index.ts and tsconfig.json,
      built to dist, and no spec (the front end has no tests, FE_NO_TESTS). The design system is the runtime's own
      `@starci/grammar` package (`.claude/packages/grammar`, installed from the npm registry): its components live under
      packages/grammar/src/core/<tier>/<Name>/ of the runtime with collocated class strings and specs, and its family
      entries and built-output proof stay at its package roots. See packages.yaml for the shared UI package shape.
    rationale: |
      Package layout separates primitives from app composition and keeps public entry verification against dist.
    cases:
      - id: case-1
        when: "A Grammar component (runtime package)"
        write: "packages/grammar/src/core/<primitive|composite|branch|composition>/<Name>/index.tsx"
      - id: case-2
        when: "A Grammar component's class strings and spec (runtime package)"
        write: "sibling classNames.ts and index.spec.tsx"
      - id: case-3
        when: "Grammar built-output proof (runtime package)"
        write: "common/index.test.mjs, core/index.test.mjs, package-boundary.test.mjs (node:test against dist/)"
    verification:
      automated:
        - FE_PACKAGE_SHAPE
      manual:
        - Verify public app imports use @starci/grammar/common and installed exports, never the package root.
    relatedExamples: []

  - id: FE-FOLDER-6
    title: Keep units cohesive
    kind: mandatory
    hfsRules: [R49, R21, R91, R92]
    requirement: |
      A unit folder contains files that change for the same responsibility. Do not create generic helpers/ or utils/
      buckets inside components, read deployment configuration in presentation, or split files solely to meet a count.
      Collocated subordinate renders and pure helpers are valid when they remain private to the owner; a separately stable
      responsibility receives its own named owner.
    rationale: |
      Cohesion prevents helper sprawl and duplicated configuration while avoiding one-component-per-folder ceremony that
      has no dependency boundary.
    cases:
      - id: case-1
        when: "A small subordinate render is private to one owner"
        write: "Keep it local with an unexported contract; extract it when it gains a stable public responsibility."
      - id: case-2
        when: "Class strings in component.tsx"
        write: "Never; they go to classNames.ts (lint class-names-in-colocated-file, no-inline-class-name)"
      - id: case-3
        when: "A helpers/ or utils/ folder"
        write: "Do not use it to hide mixed feature, transport or visual responsibilities."
      - id: case-4
        when: "A deployment constant"
        write: >
          Never. process.env.NEXT_PUBLIC_* is read only in fe/apps/<app>/src/modules/config and reached through that module,
          with no localhost fallback; a missing value in production throws when the module loads.
    verification:
      automated:
        - FE_ENV_OWNER
        - HFS_DUPLICATE_CODE
        - HFS_DUPLICATE_SYMBOL
        - FE_CROSS_APP_DUPLICATE
        - FE_SOURCE_FORM
        - FE_SOURCE_LAYOUT_INVALID
        - FE_COMPONENT_API
        - FE_COMPONENT_WORLD_OWNERSHIP
        - FE_WORLD_OWNER_RENDER_BOUNDARY
        - FE_CONNECTED_BLOCK_RENDER_PAIR
        - FE_PURE_REACHES_DATA
        - FE_PURE_WORLD_HOOK
        - FE_PURE_WORLD_IMPORT
      manual:
        - Confirm extraction is justified by ownership or lifecycle rather than file length or count.
    relatedExamples: []
