schema: starci/knowledge-source@1
id: fe.folder
title: Folder
purpose: |
  Given a piece of frontend code, which directory and which file name does it get?
appliesTo:
  - frontend
family: fe
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - src/app/[lang]/authentication/page.tsx
    - src/app/[lang]/layout.tsx
    - src/app/providers.tsx
    - src/components/pages/AuthenticationPage/**
    - src/components/blocks/auth/AuthenticationPanel/**
    - src/hooks/auth/useAuthPanel.ts
    - src/modules/api/graphql/**
    - src/components/**
    - src/hooks/**
    - src/modules/api/**
    - src/app/**
    - packages/grammar/src/**
  limitations: |
    Cited counts and notes are historical observations at skill commit
    edf72554425f918e80c9205e9c6db10596e722f0, not a census of the current project. Inspect actual
    source, manifest/lockfile, aliases and lint/test configuration in the selected repository before use.
    Historical links supply provenance, not scripts or execution instructions. Counts are file counts
    at the time of reading; old counts cannot claim a fresh scan. Verify installed Grammar exports at
    @starci/grammar/common.
rules:
  - id: FE-FOLDER-1
    title: Responsibility directories
    kind: mandatory
    requirement: |
      Each Next source root uses app/ for framework adapters; features/{pages,layouts,overlays} for
      route-facing product composition; components/{blocks,composites,branches,leaves} for product
      visuals; hooks/<domain> for every authored custom hook; and modules/<capability> for cohesive
      reusable technical/domain capabilities. No empty role folder is required. Grammar remains a
      separate product-agnostic package.
    rationale: |
      Stable, explicit role roots remain portable across a single source root and a monorepo while
      preventing app helpers, component-local hooks and feature-local transport buckets from becoming
      undeclared owners.
    cases:
      - id: case-1
        when: "A routed authentication scenario"
        write: "src/features/pages/AuthenticationPage/index.tsx"
      - id: case-2
        when: "A reusable API client or session store"
        write: >
          src/modules/api/ or src/modules/session/ with one explicit public index.ts entry
      - id: case-3
        when: "A reusable product visual without scenario ownership"
        write: "src/components/{blocks,composites,branches,leaves}/<Name>/index.tsx"
      - id: case-4
        when: "An authored custom hook, including an intrinsic useAutoScroll helper"
        write: "src/hooks/<domain>/useAutoScroll.ts; built-in React hook calls may remain in visuals"
    verification:
      automated:
        - FE_SOURCE_LAYOUT_INVALID
        - FE_CUSTOM_HOOK_LOCATION
      manual:
        - Confirm the unit's responsibility and public entry, rather than assigning it by consumer count.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-2
    title: Discoverable files for one unit
    kind: mandatory
    requirement: |
      A connected block uses index.tsx for product-world ownership and sibling component.tsx for its
      resolved pure render owner. Pure blocks, composites, branches and leaves normally use index.tsx
      only and never gain an empty twin by census. classNames.ts is present only when the unit owns class
      strings; a Base suffix is not required.
    rationale: |
      Stable basenames make class, tests, and an applicable connected/presentational split discoverable
      without requiring empty forwarding twins.
    cases:
      - id: case-1
        when: "Connected block with product-world lifecycle"
        write: "blocks/catalog/CatalogBlock/{index.tsx,component.tsx}; every nonempty index render reaches the sibling"
      - id: case-2
        when: "Feature page, layout or overlay"
        write: "Use its index.tsx public entry; split further only for a real subordinate responsibility"
      - id: case-3
        when: "Block unit (blocks/ai/StarCiAiChat/)"
        write: "classNames.ts · component.spec.tsx · component.tsx · index.spec.tsx · index.tsx"
      - id: case-4
        when: "Single visual unit (leaves/ButtonStateSample/)"
        write: >
          classNames.ts · index.tsx — no component.tsx/Base twin is required without a separate world owner
      - id: case-5
        when: "Custom hook or reusable module"
        write: "hooks/<domain>/useX.ts or modules/<capability>/...; do not create visual twins"
    notes: |
      Counts across pages (50): index.tsx 49, component.tsx 49, component.spec.tsx 42,
      index.spec.tsx 24, audit.json 22, classNames.ts 9. Across blocks (109): component.tsx 101,
      index.tsx 95, classNames.ts 76, index.spec.tsx 61, component.spec.tsx 55. Across leaves
      (40): index.tsx 40, classNames.ts 33, index.spec.tsx 19.
      A page that composes a block into a Grammar frame usually has no classNames.ts; the 9 pages
      that have one alias a Grammar page frame. Use the current public package entry
      @starci/grammar/common and verify each named export; historical class helper names are not
      guaranteed APIs.
      Example alias shape:
        // pages/AuthenticationPage/classNames.ts
        import { cn } from "@heroui/react"
        /** Grammar-owned page frame; this app alias adds no visual override. */
        export const authenticationPageClassName = cn(formPageClassName)
    verification:
      automated:
        - class-names-in-colocated-file
        - no-inline-class-name
        - FE_CONNECTED_BLOCK_RENDER_PAIR
      manual:
        - Confirm each file owns a real responsibility; do not add a component.tsx/Base twin by census.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-3
    title: Route files adapt to one visual owner
    kind: mandatory
    requirement: |
      A route may resolve framework server inputs and then mounts one page-level visual owner. A route
      whose complete responsibility is redirect or notFound mounts none. Route files do not compose a
      shell beside the page or make product drawing decisions.
    rationale: |
      Keeping default exports in the App Router layer prevents components from becoming route-coupled.
    cases:
      - id: case-1
        when: "A route"
        write: >
          app/[lang]/authentication/page.tsx: import { AuthenticationPage } from
          "@/features/pages/AuthenticationPage" … const AuthenticationRoute = () =>
          <AuthenticationPage {...{}} /> … export default AuthenticationRoute
      - id: case-2
        kind: exception
        when: "Redirect/notFound adapter"
        write: "Resolve framework inputs and redirect or terminate without a visual owner."
      - id: case-3
        when: "Global app files"
        write: >
          app/globals.css, app/providers.tsx, app/global-error.tsx, app/sitemap.ts, app/robots.ts,
          each with a sibling .spec
    verification:
      automated:
        - FE_APP_INTERNAL_IMPORT_OUTSIDE_FEATURES
      manual:
        - Confirm visual routes have one page owner and redirect/notFound-only routes have no visual tree.
    relatedExamples: []

  - id: FE-FOLDER-4
    title: Feature data and module placement
    kind: mandatory
    requirement: |
      Every authored custom hook lives under hooks/<domain>, including intrinsic helpers. Hooks call
      cohesive modules for transport/domain capabilities and never import app, features or components.
      Generic API client/link/error plumbing and generated wire contracts live in modules/api; shared
      session, routing, theme and feedback capabilities live in their owning modules. A root hooks barrel
      is optional and cannot weaken domain grouping.
    rationale: |
      This separates product scenario ownership from reusable transport mechanics without creating a
      global bucket for unrelated hooks.
    cases:
      - id: case-1
        when: "Authentication request lifecycle"
        write: "src/hooks/authentication/useAuthentication.ts"
      - id: case-2
        when: "Feature wire mapping"
        write: "src/hooks/authentication/useAuthentication.ts maps module results to the feature-facing lifecycle"
      - id: case-3
        when: "Generic Apollo client/link chain"
        write: "src/modules/api/client/create-apollo-client.ts"
      - id: case-4
        when: "Shared session storage"
        write: "src/modules/session/session-store.ts, exported through src/modules/session/index.ts"
      - id: case-5
        when: "Intrinsic custom helper"
        write: "src/hooks/ui/useAutoScroll.ts; direct useRef/useState calls may remain in their visual owner"
    verification:
      automated:
        - FE_CUSTOM_HOOK_LOCATION
        - FE_FEATURE_DEPENDENCY_DIRECTION
      manual:
        - Confirm each lifecycle has one feature owner and transport mechanics have one module owner.
    relatedExamples:
      - connected-block

  - id: FE-FOLDER-5
    title: Grammar package unit
    kind: mandatory
    requirement: |
      Grammar components live under packages/grammar/src/core/<tier>/<Name>/ with collocated class
      strings and specs. Family entries and built-output proof stay at the package roots.
    rationale: |
      Package layout separates primitives from app composition and keeps public entry verification
      against dist/.
    cases:
      - id: case-1
        when: "A Grammar component"
        write: "packages/grammar/src/core/<primitive|composite|branch|composition>/<Name>/index.tsx (39 index.tsx)"
      - id: case-2
        when: "Its class strings"
        write: "sibling classNames.ts (13), e.g. core/branch/Rail/classNames.ts"
      - id: case-3
        when: "Its spec"
        write: "sibling index.spec.tsx (24); CSS proof in styles.spec.ts (6)"
      - id: case-4
        when: "Family entry"
        write: >
          core/index.ts, core/styles.css, core/dna.ts; common/index.ts re-exports state.js,
          spacing.js, conformance.js, renderers.js, registry.js
      - id: case-5
        when: "Built-output proof"
        write: "common/index.test.mjs, core/index.test.mjs, package-boundary.test.mjs (node:test against dist/)"
    verification:
      automated: []
      manual:
        - Verify public app imports use @starci/grammar/common and installed exports, not package root or former @grammar/*.
    relatedExamples: []

  - id: FE-FOLDER-6
    title: Keep units cohesive
    kind: mandatory
    requirement: |
      A unit folder contains files that change for the same responsibility. Do not create generic helpers/
      or utils/ buckets inside components, read deployment configuration in presentation, or split files
      solely to meet a count. Collocated subordinate renders and pure helpers are valid when they remain
      private to the owner; a separately stable responsibility receives its own named owner.
    rationale: |
      Cohesion prevents helper sprawl and duplicated configuration while avoiding one-component-per-folder
      ceremony that has no dependency boundary.
    cases:
      - id: case-1
        when: "A small subordinate render is private to one owner"
        write: >
          Keep it local with an unexported contract; extract it when it gains a stable public responsibility.
      - id: case-2
        when: "Class strings in component.tsx"
        write: "Never; they go to classNames.ts (lint class-names-in-colocated-file, no-inline-class-name)"
      - id: case-3
        when: "A helpers/ or utils/ folder"
        write: "Do not use it to hide mixed feature, transport or visual responsibilities."
      - id: case-4
        when: "A deployment constant"
        write: >
          Never. process.env.NEXT_PUBLIC_* lives under src/modules/ and is reached through the module
          that owns it. A component folder that reads the variable inline takes a default with it, so
          the same environment change acquires one home per folder that read it. The occurrences are in
          https://github.com/starci183/starci-skills/blob/edf72554425f918e80c9205e9c6db10596e722f0/tests/evidence/20260903-presentation-sweep.json
    verification:
      automated:
        - class-names-in-colocated-file
        - no-inline-class-name
        - no-helper-folder-in-components
      manual:
        - Confirm no process.env.NEXT_PUBLIC_* reads inside component folders.
        - Confirm extraction is justified by ownership or lifecycle rather than file length/count.
    relatedExamples: []
openQuestions:
  - id: currency-and-locale-literals
    summary: |
      A currency or locale literal is not a deployment constant. The formatter is built where the locale is
      read, so the money literal sits in the connected half beside it, and the observations point that way
      rather than towards a shared module — recorded in
      https://github.com/starci183/starci-skills/blob/edf72554425f918e80c9205e9c6db10596e722f0/tests/evidence/20260903-presentation-sweep.json.
      FE-FOLDER-6 Case 5 therefore covers deployment constants only, and whether a currency belongs to a
      money module of its own is an owner decision this file does not make.
  - id: extra-files-inside-block-folders
    summary: |
      22 files under src/components/blocks fall outside the five canonical names: the
      blocks/profile/overview/ sub-tree (OverviewCourses.tsx, SkillSnapshot.tsx, shared.ts,
      useOverviewEvidence.ts, …), learn/CourseMockInterviewResultBlock/verdict.ts,
      profile/ProfileCvBuilder/buildCvTexSource.ts, and three classNames.spec.ts/styles.spec.ts.
      No dominant convention exists for where a block-private helper module goes, so this file does not
      legislate one.
