schema: starci/knowledge-source@1
id: fe.theme
title: Theme
purpose: |-
  How is light and dark theme switched? next-themes, provided once in components/providers.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [fe.components.providers]
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-THEME
    title: "next-themes in components/providers"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      The ThemeProvider of next-themes (attribute class) is mounted once in components/providers; a theme toggle uses
      useTheme. No hand-written theme context or storage key.
    rationale: |-
      One provider keeps the grammar tokens and the theme class in step.
    cases:
      - id: case-1
        when: "The provider"
        write: "<ThemeProvider attribute=\"class\" defaultTheme=\"system\"> in components/providers/<Name>/index.tsx"
      - id: case-2
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a front end stored the theme in its own context"
        write: "Use next-themes in components/providers."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
