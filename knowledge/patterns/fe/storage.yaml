schema: starci/knowledge-source@1
id: fe.storage
title: Browser storage
purpose: |-
  How does the front end persist values in the browser? modules/storage (local and session) serializing through
  modules/superjson; components never touch storage.
appliesTo:
  - frontend
family: fe
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [fe.modules]
provenance:
  reviewedAt: 2026-10-13
  sources:
    - "knowledge/hfs/fe-stack.yaml"
  limitations: |-
    FE_STACK_FORBIDDEN proves that no forbidden alternative is declared or imported; it does not prove the canonical
    library is used well. starci-academy illustrates the usage; the catalog decides.
rules:
  - id: FE-STORAGE
    title: "modules/storage with superjson"
    kind: mandatory
    hfsRules: [R244]
    requirement: |-
      Browser persistence goes through modules/storage/{local,session} with an enum of keys and typed values, serialized
      by modules/superjson (custom types such as Decimal and dayjs registered once). No component, hook or store calls
      localStorage, sessionStorage or document.cookie directly; localforage and store2 are refused.
    rationale: |-
      One storage owner keeps keys, types and serialization in one place.
    cases:
      - id: case-1
        when: "A typed key"
        write: "LocalStorage.get(LocalStorageId.AccessToken) from modules/storage/local (starci-academy)"
      - id: case-2
        date: "2026-10-13"
        source: owner
        when: "Owner ruling 2026-10-13: a store read localStorage directly"
        write: "Add the key to modules/storage and call it from there."
    verification:
      automated:
        - FE_STACK_FORBIDDEN
      manual: []
    relatedExamples: []
