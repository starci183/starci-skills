schema: starci/knowledge-source@1
id: be.event-bus
title: Event bus
purpose: |-
  Given a fact another context or a background process must react to, how does it travel? Work inside ONE context stays
  synchronous: the handler calls that context's domain service in one transaction and no event exists. An event exists only to
  cross contexts or to trigger asynchronous work (jobs, sagas, reactors, projections). It is a typed event class, published with
  `eventBus.publish(event, tx)` by a domain service inside its transaction, and travels one durable path: transactional outbox,
  relay, Kafka, consumer with retry and dead letter. `platform/event-bus` is the one owner and the only importer of `kafkajs`.
appliesTo:
  - backend
family: be
pattern: event-bus
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (Kafka only, transactional outbox, typed event classes, publish(event, tx))
    - https://microservices.io/patterns/data/transactional-outbox.html
  limitations: |-
    Static checks prove who may publish, with which transaction, and that a consumer is a named door that forwards the event
    id. They do not prove broker configuration, partition keys, schema evolution or the operational handling of a dead letter;
    the test-world scenarios (`event-bus/*`) prove the delivery behaviour against a real broker.
rules:
  - id: BE-EVENT-BUS-1
    title: Inside one context nothing is an event
    kind: mandatory
    hfsRules: [R152]
    requirement: |-
      Work that stays inside one context (one connection, one set of tables) is synchronous: the handler dispatches to that
      context's domain service, which does the whole change in one transaction. No event, no queue and no bus is involved, and a
      caller that needs the result reads it from the return value. A fact is published as an event only when (a) another context
      must react to it, or (b) the work it triggers is asynchronous by nature (a job, a saga step, a reactor, a projection
      refresh). One transaction touches one context's connection only.
    rationale: |-
      An event inside one context buys eventual consistency, a failure mode and a broker round trip for work the transaction
      already makes atomic. Events are the price of crossing a boundary, not a style.
    cases:
      - id: case-1
        when: 'A buyer adds an item to the cart (same context, the answer is needed now)'
        write: 'add-cart-item.handler.ts dispatches to CartService.addItem, which updates the cart rows in one transaction and returns the cart. No event. (passing)'
      - id: case-2
        when: 'Order needs to know whether a payment settled (payment is another context)'
        write: 'Order never reads the payment tables or imports the payment service. PaymentService publishes PaymentSettledEvent in its transaction; an order reactor keeps a local copy of the status, or a projection serves the read. (a direct read is the violation)'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_TIER_DIRECTION
      manual:
        - Confirm each published event crosses a context or starts asynchronous work, and no handler publishes to tell itself something.
    relatedExamples: [event-bus]
  - id: BE-EVENT-BUS-2
    title: An event is a typed class that equals its vendored contract
    kind: mandatory
    hfsRules: [R151]
    requirement: |-
      Events are classes in `be/src/modules/events/<service>/<event>.event.ts`, one per file, named after the event
      (`order.placed` is `order-placed.event.ts`): a class extending the platform `BaseEvent` with literal
      `static readonly eventName` and `static readonly version`, a payload typed in the class, a `create()` that builds it
      and a `parse()` that reads a delivered payload back. Each class is an entry of the vendored contract
      `be/contracts/<service>/events.json` at the same name and version and every contract entry has its class. Schemas
      evolve only additively; a breaking change is a new event name (`<event>.v2`).
    rationale: |-
      The class is what the publisher and the consumer compile against; the contract is what another service pins. Two
      sources of truth drift, so a check holds them equal.
    cases:
      - id: case-1
        when: A new event
        write: 'modules/events/order/order-placed.event.ts with eventName "order.placed" and version 1, then `npm run contract:emit` so be/contracts/order/events.json lists it.'
    verification:
      automated:
        - BE_EVENT_CLASS_CONTRACT
      manual:
        - Confirm a payload change is additive.
    relatedExamples: [event-bus]
  - id: BE-EVENT-BUS-3
    title: Publish through the bus, in the domain transaction, to Kafka only
    kind: mandatory
    hfsRules: [R152, R90, R87]
    requirement: |-
      `eventBus.publish(event, tx)` is called only in `modules/domain`, with the manager of the transaction that makes the
      domain change (`this.entityManager.transaction(async (manager) => { ...; await this.eventBus.publish(event, manager) })`).
      It writes a row in the outbox table of that transaction's connection; the relay hands committed rows to Kafka (topic
      `events.<service>`, key = aggregate id) and marks them sent. `kafkajs` is imported only by `platform/event-bus`. Nest's
      `EventBus`, `@EventsHandler`, `@OnEvent` and `EventEmitter2` do not exist, and nothing publishes to Kafka directly.
      There is no in-process or local transport: unit specs use a recording fake of the `EventBus` port, allowed in `*.spec.ts`.
    rationale: |-
      The outbox row commits with the domain change, so a rolled-back change never emits and a committed one is never lost;
      Kafka then gives ordered, replayable, cross-service delivery.
    cases:
      - id: case-1
        when: A domain service places an order
        write: 'await this.entityManager.transaction(async (manager) => { await manager.save(...); await this.eventBus.publish(OrderPlacedEvent.create({ ... }), manager) })'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_INFRA_OWNER
        - BE_CQRS_SHAPE
      manual: []
    relatedExamples: [event-bus]
  - id: BE-EVENT-BUS-4
    title: A consumer is a thin door; delivery is at least once with retry and a dead letter
    kind: mandatory
    hfsRules: [R153, R80]
    requirement: |-
      A consumer is `transport/message/<event>.consumer.ts` implementing `EventConsumer<E>` with `readonly event = <Event>Event`;
      `handle(delivery)` dispatches one command and forwards `delivery.eventId`. Delivery is at least once: the domain service the
      command reaches claims the event id in `platform/inbox` as its first awaited expression, inside its own transaction, so a
      redelivery is a no-op. A throw schedules a retry with exponential backoff on the retry topic (`events.<service>.retry`);
      after the event's `attempts` the message goes to the dead-letter topic (`events.<service>.dlq`), which an operator reads
      and requeues through `eventBus.deadLetters(event)` and `eventBus.requeue(id)` (a cli command). `eventBus.pendingRetries(event)`
      lets a failure-injection spec wait for a retry.
    rationale: |-
      A claim persisted before the handler finishes would lose the event on a crash; claiming in the effect's transaction makes
      the effect and the claim one atomic fact.
    cases:
      - id: case-1
        when: A consumer of order.placed
        write: 'order-placed.consumer.ts: handle(delivery) { await this.commandBus.execute(new IssueInvoiceCommand({ request: { eventId: delivery.eventId, ... } })) }'
    verification:
      automated:
        - BE_EVENT_CONSUMER_SHAPE
        - BE_INBOX_DEDUPE_MISSING
      manual:
        - Confirm the retry budget and backoff fit the consumer's side effects.
    relatedExamples: [event-bus]
  - id: BE-EVENT-BUS-5
    title: A declared event bus is proven on the test world
    kind: mandatory
    hfsRules: [R155]
    requirement: |-
      An app that declares the pattern (`hfs.json` `sides.be.patterns: ["event-bus"]`) has e2e or integration tests, titled
      `event-bus/<scenario>: ...`, for each scenario of `ruleParams.be.patternScenarios.event-bus`, run against a real Kafka:
      `atomic-with-transaction` (the outbox row exists exactly when the domain change commits), `relay-only-after-commit` (nothing is
      published for a rolled-back transaction), `redelivery-then-dead-letter` (a failing consumer is retried, then buried) and
      `duplicate-delivery-is-a-noop` (a redelivered event changes nothing twice).
    rationale: |-
      Delivery behaviour is not visible to a linter; a real broker run is the only proof.
    cases:
      - id: case-1
        when: The order e2e suite
        write: "it('event-bus/atomic-with-transaction: the row commits with the order', ...)"
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual: []
    relatedExamples: [event-bus]
