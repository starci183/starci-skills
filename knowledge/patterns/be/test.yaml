schema: starci/knowledge-source@1
id: be.test
title: Test
purpose: |-
  Given a backend unit, where does its spec live, how is the subject built, what does it assert and what does it leave
  alone? Two test kinds exist. Unit specs run automatically. E2E runs by hand.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/patterns/be/folder.yaml
    - https://docs.nestjs.com/fundamentals/testing
    - https://jestjs.io/docs/configuration
  limitations: |-
    A green spec proves what it exercised. A mocked manager is not database isolation, and a stubbed module is not
    registration evidence. Which behavior needs a test is decided from the effect and the failure risk, never from a
    file count.

    Policy 2026-09-29. Write or update the spec of the source you add or change, even when the goal does not ask for it,
    and run only those specs and the specs that import them. The whole unit suite runs only at push. E2E runs only when
    asked.
rules:
  - id: BE-TEST-1
    title: Placement, kinds and topology
    kind: mandatory
    hfsRules: [R12, R47]
    requirement: |-
      Exactly two test kinds exist. Unit is `<name>.spec.ts` beside its subject. E2E is `*.e2e-spec.ts` under
      `src/tests/e2e/<area>/`, with live third-party suites under `src/tests/e2e/live/<area>/`, environment code
      (containers, boot of the real AppModule) in `src/tests/e2e/setup/` and shared data in `src/tests/fixtures/`. One root
      `jest.config.js` uses the preset `@starci/jest-preset` and declares exactly two projects, `unit` and `e2e`. The unit
      project maps no module into `src/tests/e2e`. Scripts are `test:unit`, `test:e2e` and `test:e2e:live`. `test:e2e`
      is `npm run typecheck:e2e && jest --selectProjects e2e`. The live suite is separated by the folder `live/` with
      `E2E_LIVE=1`, never by file name, and `test:e2e:live` differs from `test:e2e`. E2E runs by hand: no e2e spec, e2e
      code or e2e-only dependency enters husky, lint-staged, the default typecheck, coverage or Codecov, or an
      automatic CI trigger; a kept e2e workflow is `workflow_dispatch` only. `tsconfig.json` excludes
      `src/tests/e2e/**`, `tsconfig.e2e.json` backs `typecheck:e2e`, and coverage and `test:ci` read the unit project only.
    rationale: |-
      One placement rule makes discovery mechanical, and keeping e2e out of the automatic gates keeps the routine
      gates fast and deterministic while the manual gate still refuses to run on code that does not type check.
    cases:
      - id: case-1
        when: Unit
        write: place-order.use-case.spec.ts beside place-order.use-case.ts
      - id: case-2
        when: E2E
        write: src/tests/e2e/checkout/place-order.e2e-spec.ts with globalSetup and globalTeardown in src/tests/e2e/setup/
      - id: case-3
        when: A live third-party suite
        write: src/tests/e2e/live/payments/payos-webhook.e2e-spec.ts, run only by `E2E_LIVE=1 jest --selectProjects e2e src/tests/e2e/live`
      - id: case-4
        when: Projects
        write: 'jest.config.js is `module.exports = { preset: "@starci/jest-preset", projects: [unit, e2e] }` produced by the preset factory, with no second jest config and no per-lane script.'
      - id: case-5
        when: Type checking
        write: '`typecheck` covers app and unit specs at pre-push and CI; `typecheck:e2e` runs `tsc -p tsconfig.e2e.json` and `test:e2e` depends on it, so e2e never runs on code that does not compile.'
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_E2E_IN_AUTOMATIC_GATE
        - HFS_TEST_KIND_RETIRED
        - unit-test-colocated
      manual:
        - Record which transport, service, database and external boundary an e2e run actually exercised.
    relatedExamples: []
  - id: BE-TEST-2
    title: Test the real public execution contract
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      A use-case or handler spec constructs the real subject with typed dependency doubles and calls its public entry
      (`execute`). Doubles come from `mock<T>()` in `@starci/jest-preset` or typed builders in `src/tests/fixtures/`;
      `as never`, `as unknown as` and any other cast that pretends a double is the real type are forbidden. A spec never
      reads source code with `fs` or a regular expression to assert an architecture rule; architecture is lint.
    rationale: |-
      A typed double fails to compile when the contract changes, while a cast keeps a stale spec green.
    cases:
      - id: case-1
        when: Subject
        write: 'const orders = mock<OrderRepository>(); const useCase = new PlaceOrderUseCase(orders, mock<CreditPolicy>())'
      - id: case-2
        when: Ordered answers
        write: 'orders.exists.mockResolvedValueOnce(false)'
      - id: case-3
        when: The call
        write: 'await useCase.execute(input, principal), never a protected hook'
    verification:
      automated:
        - BE_SPEC_QUALITY
      manual:
        - Review that a double matches the real dependency contract.
    relatedExamples: []
  - id: BE-TEST-3
    title: Construct according to the boundary under test
    kind: mandatory
    hfsRules: [R32, R48]
    requirement: |-
      Use direct construction for isolated capability behavior. Use `Test.createTestingModule` or the real AppModule
      when proving registration, injection, named tokens or lifecycle. Every app has `<app>.composition.spec.ts` that
      boots the real AppModule with stubbed options and resolves real provider tokens. E2E boots the real AppModule and
      overrides providers; it never assembles a lane module by hand. Database mocks establish local behavior only;
      transaction, lock and crash claims need the real store. Configuration is substituted at the owned config
      boundary by passing options, never by patching `process.env`.
    rationale: |-
      A hand-assembled module can pass while the real app cannot start, so composition is proved on the real module.
    cases:
      - id: case-1
        when: The composition spec
        write: 'const moduleRef = await Test.createTestingModule({ imports: [AppModule.register(stubOptions)] }).compile(); expect(moduleRef.get(PlaceOrderUseCase)).toBeDefined()'
      - id: case-2
        when: An e2e provider override
        write: 'Test.createTestingModule({ imports: [AppModule.register(options)] }).overrideProvider(MAILER).useValue(fakeMailer)'
      - id: case-3
        when: Config
        write: 'pass `parseOrdersConfig({ ORDERS_TTL: "900" })` output as options; do not set process.env'
    verification:
      automated:
        - BE_APP_COMPOSITION_ONLY
        - BE_TEST_TOPOLOGY
      manual:
        - Confirm the composition spec fails when a module or provider is missing.
    relatedExamples: []
  - id: BE-TEST-4
    title: What is asserted
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      Assert error class and code, ordering of side effects, returned rows and persisted arguments as relevant. Test titles
      start with a word from `NEST_TEST_TITLE_ACTIONS` (accepts, rejects, returns, preserves, refuses, maps, creates).
      This action-prefix rule is machine-checked; whether title and assertions describe the required behavior is agent
      review. Adding vocabulary is a reviewed profile change, never a per-file suppression.
    rationale: |-
      Assertions on type, code and state prove behavior. Message strings and call counts alone do not.
    cases:
      - id: case-1
        when: The error
        write: 'await expect(useCase.execute(input, principal)).rejects.toMatchObject({ code: "ORDER_NOT_FOUND" })'
      - id: case-2
        when: Ordering of side effects
        write: 'expect(reserve).not.toHaveBeenCalled() after a rejected credit check'
      - id: case-3
        when: A typed outcome
        write: 'await expect(useCase.execute(input, principal)).resolves.toEqual({ kind: "refused", reason: "credit-limit" })'
      - id: case-4
        when: Phrasing
        write: 'it("rejects anonymous callers before querying order state", ...)'
    verification:
      automated:
        - NEST_TEST_NAME_FORM
      manual:
        - Review that titles and assertions describe the required behavior.
    relatedExamples: []
  - id: BE-TEST-5
    title: What is not asserted
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      Do not ship call-only specs, e2e steps that only check a success flag, sleep-based waits, live model calls in
      e2e, or branched outcomes inside one flow step. The e2e canon rules apply to `src/tests/e2e/**` through `lint:e2e`,
      which runs by hand and must be green before an e2e conclusion is drawn.
    rationale: |-
      A test that cannot fail for the wrong reason is not evidence, and time-based waiting hides races.
    cases:
      - id: case-1
        when: A call alone
        write: a spec that only proves a mock was invoked fails no-call-only-spec
      - id: case-2
        when: Envelope instead of state
        write: an e2e step asserts the persisted row, not `success true`
      - id: case-3
        when: Elapsed time
        write: poll for state; never sleep in a flow
      - id: case-4
        when: A provider call
        write: only a live e2e under src/tests/e2e/live/ may call a provider
      - id: case-5
        when: Branching
        write: one step proves one outcome
    verification:
      automated:
        - no-call-only-spec
        - e2e-asserts-persisted-state
        - no-sleep-in-flow
        - no-model-call-in-e2e
        - harness-calls-provider-directly
        - no-branch-in-flow-step
        - BE_SPEC_QUALITY
      manual: []
    relatedExamples: []
  - id: BE-TEST-6
    title: Names
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      The outer suite names the exported class or function under test. Nested suites name scenarios or public methods.
      Layout of calls and imports is Prettier's concern and is not a test rule.
    rationale: |-
      A failure names the subject it measures.
    cases:
      - id: case-1
        when: describe
        write: 'describe("PlaceOrderUseCase", () => { ... })'
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-TEST-7
    title: Coverage and ts-jest
    kind: mandatory
    hfsRules: [R11, R47]
    requirement: |-
      ts-jest runs with `diagnostics: false` and `isolatedModules: true` in both projects; types are checked once, by
      `typecheck` and `typecheck:e2e`. Coverage is collected from the unit project only, and its exclusion list is the
      one list that `sonar.coverage.exclusions` is generated from. Excluded from coverage: tests, fixtures, `main.ts`,
      declaration files.
    rationale: |-
      Checking types twice slows unit runs and jest with diagnostics checks only the files it loads; one typecheck
      source cannot rot silently, and one exclusion list keeps Codecov and Sonar numbers equal.
    cases:
      - id: case-1
        when: The transform
        write: 'transform: { "^.+\\.ts$": ["ts-jest", { diagnostics: false, isolatedModules: true }] } supplied by @starci/jest-preset'
      - id: case-2
        when: Coverage denominator
        write: 'collectCoverageFrom: ["src/**/*.ts", "apps/**/*.ts", "!src/tests/**", "!**/*.spec.ts", "!**/*.e2e-spec.ts", "!**/*.d.ts", "!**/main.ts"]'
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
