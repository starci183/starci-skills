schema: starci/knowledge-source@1
id: be.test
title: Test
purpose: |-
  Given a backend unit, where does its spec live, how is the subject built, what does it assert and what does it leave
  alone? Four test kinds exist by folder. Unit specs run automatically. Integration, e2e and contract run by hand.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - knowledge/patterns/be/folder.yaml
    - owner-locked BE convention 2026-09-30
    - https://docs.nestjs.com/fundamentals/testing
    - https://jestjs.io/docs/configuration
  limitations: |-
    A green spec proves what it exercised. A mocked manager is not database isolation, and a stubbed module is not
    registration evidence. Which behavior needs a test is decided from the effect and the failure risk, never from a
    file count.

    Policy 2026-09-29. Write or update the spec of the source you add or change, even when the goal does not ask for it,
    and run only those specs and the specs that import them. The whole unit suite runs only at push. E2E runs only when
    asked.
rules:
  - id: BE-TEST-1
    title: Placement, kinds and topology
    kind: mandatory
    hfsRules: [R12, R47]
    requirement: |-
      Four test kinds exist and the folder and the file suffix always agree. Unit is `<name>.spec.ts` beside its subject.
      Integration is `src/tests/integration/<capability>/*.integration-spec.ts` (one capability module on the real database, no
      HTTP, through `useTestWorld({ modules })`). E2E is `src/tests/e2e/<area>/*.e2e-spec.ts` (through
      `useTestWorld({ apps })`). Contract is `src/tests/contract/<provider>/*.contract-spec.ts` (provider sandboxes, skipped
      without sandbox config). `src/tests/world/` is the only test infrastructure (`global-setup.ts`, `use-test-world.ts`,
      `fakes/<provider>/` network-edge fakes with `failNext`, `replayWebhook`, `delay`); `src/tests/fixtures/` holds typed
      doubles and builders. There is no `live/` folder and no `src/tests/e2e/world`. One root `jest.config.js` uses the
      preset `@starci/jest-preset` and declares exactly four projects: `unit`, `integration`, `e2e` and `contract`. The unit
      project maps no module into `src/tests/{world,integration,e2e,contract}`. Scripts are `test` (unit), `test:integration`,
      `test:e2e` and `test:contract`, each of the last three `npm run typecheck:tests && jest --selectProjects <name>`;
      `test:contract` is never part of `test` or `test:e2e`. Integration, e2e and contract run by hand: none of their specs,
      code or dependencies enters husky, lint-staged, the default typecheck, coverage or Codecov, or an automatic CI
      trigger; a kept e2e workflow is `workflow_dispatch` only. `tsconfig.json` excludes `src/tests/world`,
      `src/tests/integration`, `src/tests/e2e` and `src/tests/contract`, `src/tests/tsconfig.json` backs `typecheck:tests`,
      and coverage and `test:ci` read the unit project only.
    rationale: |-
      One placement rule makes discovery mechanical, and keeping integration, e2e and contract out of the automatic gates keeps the routine
      gates fast and deterministic while the manual gates still refuse to run on code that does not type check.
    cases:
      - id: case-1
        when: Unit
        write: place-order.handler.spec.ts beside place-order.handler.ts
      - id: case-2
        when: Integration
        write: src/tests/integration/inbox/claim-once.integration-spec.ts calling useTestWorld({ modules }) and asserting rows through world.db
      - id: case-3
        when: E2E
        write: src/tests/e2e/checkout/place-order.e2e-spec.ts calling useTestWorld({ apps }) with globalSetup in src/tests/world/
      - id: case-4
        when: Projects
        write: 'jest.config.js is `module.exports = require("@starci/jest-preset").starciJestConfig()`, declaring the projects unit, integration, e2e and contract, with no second jest config and no per-lane script.'
      - id: case-5
        when: Type checking
        write: '`typecheck` covers app, unit specs and fixtures at pre-push and CI; `typecheck:tests` runs `tsc -p src/tests/tsconfig.json` and `test:integration`, `test:e2e` and `test:contract` depend on it, so they never run on code that does not compile.'
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_E2E_IN_AUTOMATIC_GATE
        - HFS_TEST_KIND_RETIRED
      manual:
        - Record which transport, service, database and external boundary an e2e run actually exercised.
    relatedExamples: []
  - id: BE-TEST-2
    title: Test the real public execution contract with typed doubles
    kind: mandatory
    hfsRules: [R48, R72]
    requirement: |-
      A unit spec constructs the real subject with `new` and typed doubles and calls its public entry (a handler's
      `execute`, a service method). Doubles come from `mock<T>()` in `@starci/jest-preset/mock`, `FakeClock`, and
      `mockEntityManager()` and `fakeTransaction()` from `src/tests/fixtures/database.ts`. No cast of any kind appears in a
      spec (`as never`, `as unknown as`, `as X`), no `x!`, and a spec never reads source code with `fs` or a regular
      expression to assert an architecture rule; architecture is lint. A twin spec exists for every handler, domain service,
      consumer, job, guard, mapper, policy, client and `*.sql.ts` row mapper, and asserts results and state, not only calls.
    rationale: |-
      A typed double fails to compile when the contract changes, while a cast keeps a stale spec green.
    cases:
      - id: case-1
        when: Subject
        write: 'const entityManager = mockEntityManager(); const clock = new FakeClock("2026-01-01T00:00:00.000Z"); const handler = new StartCheckoutHandler(logger, entityManager, clock, mock<PurchaseService>())'
      - id: case-2
        when: Ordered answers
        write: 'entityManager.findOne.mockResolvedValueOnce(null)'
      - id: case-3
        when: The call
        write: 'await handler.execute(command), never the protected process hook'
    verification:
      automated:
        - BE_SPEC_QUALITY
        - BE_TYPE_ESCAPE
      manual:
        - Review that a double matches the real dependency contract.
    relatedExamples: []
  - id: BE-TEST-3
    title: Construct according to the boundary under test
    kind: mandatory
    hfsRules: [R32, R48]
    requirement: |-
      Use direct construction for isolated behavior. `Test.createTestingModule` is used only in composition specs; integration and e2e specs boot through `useTestWorld`.
      Every app has `<app>.composition.spec.ts` that boots the real `AppModule.register(testOptions)` and resolves real
      provider tokens. An e2e boots the real apps through `useTestWorld({ apps })` on Testcontainers Postgres, runs the real
      migrations through the `apps/migrate` runner function once in `global-setup.ts`, fakes only external services at the
      network edge (`world.fake.<provider>`), overrides no provider or DI token and never a guard, authenticates through an
      identity fixture that issues real tokens, asserts persisted state and waits with `waitFor` deadlines. Database mocks
      establish local behavior only; transaction, lock and crash claims need the real store (an integration spec). Configuration
      is substituted at the owned config boundary by passing options, never by patching `process.env`.
    rationale: |-
      A hand-assembled module can pass while the real app cannot start, so composition is proved on the real module.
    cases:
      - id: case-1
        when: The composition spec
        write: 'const moduleRef = await Test.createTestingModule({ imports: [AppModule.register(testOptions)] }).compile(); expect(moduleRef.get(CheckoutModule)).toBeDefined()'
      - id: case-2
        when: An external service in e2e
        write: 'const world = useTestWorld({ apps: { core: { module: AppModule } } }); world.fake.payos.failNext(); await world.fake.payos.replayWebhook(payload)'
      - id: case-3
        when: Config
        write: 'pass parsePurchaseConfig(EnvSource of a plain object) output as options; do not set process.env'
    verification:
      automated:
        - BE_APP_COMPOSITION_ONLY
        - BE_TEST_TOPOLOGY
      manual:
        - Confirm the composition spec fails when a module or provider is missing.
    relatedExamples: []
  - id: BE-TEST-4
    title: What is asserted
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      Assert the refusal code or error code, ordering of side effects, returned rows, persisted state and the `where` that holds
      ownership, as relevant. Test titles start with a word from `NEST_TEST_TITLE_ACTIONS` (accepts, rejects, returns,
      preserves, refuses, maps, creates). This action-prefix rule is machine-checked; whether title and assertions describe the
      required behavior is agent review. Adding vocabulary is a reviewed profile change, never a per-file suppression.
    rationale: |-
      Assertions on type, code and state prove behavior. Message strings and call counts alone do not.
    cases:
      - id: case-1
        when: The error
        write: 'await expect(handler.execute(command)).rejects.toMatchObject({ code: "PURCHASE_OFFER_NOT_FOUND" })'
      - id: case-2
        when: Ordering of side effects
        write: 'expect(manager.insert).not.toHaveBeenCalled() after a refused credit check'
      - id: case-3
        when: A typed outcome
        write: 'await expect(handler.execute(command)).resolves.toEqual({ kind: "refused", code: PurchaseErrorCode.AlreadyOwned })'
      - id: case-4
        when: Phrasing
        write: 'it("refuses a learner who already owns the offer", ...)'
    verification:
      automated:
        - NEST_TEST_NAME_FORM
      manual:
        - Review that titles and assertions describe the required behavior.
    relatedExamples: []
  - id: BE-TEST-5
    title: What is not asserted
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      Do not ship call-only specs, e2e steps that only check a success flag, sleep-based waits (wait with `waitFor` deadlines),
      guard overrides, provider or DI overrides under `src/tests`, live model calls in e2e, or branched outcomes inside one flow step. The e2e canon rules apply to `src/tests/e2e/**` through `lint:check`.
    rationale: |-
      A test that cannot fail for the wrong reason is not evidence, and time-based waiting hides races.
    cases:
      - id: case-1
        when: A call alone
        write: a spec that only proves a mock was invoked fails no-call-only-spec
      - id: case-2
        when: A success flag instead of state
        write: an e2e step asserts the persisted row, not a success flag
      - id: case-3
        when: Elapsed time
        write: poll for state; never sleep in a flow
      - id: case-4
        when: A provider call
        write: only a contract spec under src/tests/contract/<provider>/ may call a provider sandbox
      - id: case-5
        when: Branching
        write: one step proves one outcome
    verification:
      automated:
        - no-call-only-spec
        - e2e-asserts-persisted-state
        - no-sleep-in-flow
        - no-model-call-in-e2e
        - harness-calls-provider-directly
        - no-branch-in-flow-step
        - BE_SPEC_QUALITY
      manual: []
    relatedExamples: []
  - id: BE-TEST-6
    title: Names
    kind: mandatory
    hfsRules: [R48]
    requirement: |-
      The outer suite names the exported class or function under test. Nested suites name scenarios or public methods.
      Layout of calls and imports is Prettier's concern and is not a test rule.
    rationale: |-
      A failure names the subject it measures.
    cases:
      - id: case-1
        when: describe
        write: 'describe("PlaceOrderHandler", () => { ... })'
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-TEST-7
    title: Coverage and ts-jest
    kind: mandatory
    hfsRules: [R11, R47]
    requirement: |-
      ts-jest runs with `diagnostics: false` and `isolatedModules: true` in every project; types are checked once, by
      `typecheck` and `typecheck:tests`. Coverage is collected from the unit project only, and its exclusion list is the
      one list that `sonar.coverage.exclusions` is generated from. Excluded from coverage: tests, fixtures, `main.ts`,
      declaration files.
    rationale: |-
      Checking types twice slows unit runs and jest with diagnostics checks only the files it loads; one typecheck
      source cannot rot silently, and one exclusion list keeps Codecov and Sonar numbers equal.
    cases:
      - id: case-1
        when: The transform
        write: 'transform: { "^.+\\.ts$": ["ts-jest", { diagnostics: false, isolatedModules: true }] } supplied by @starci/jest-preset'
      - id: case-2
        when: Coverage denominator
        write: 'collectCoverageFrom: ["src/**/*.ts", "apps/**/*.ts", "!src/tests/**", "!**/*.spec.ts", "!**/*.e2e-spec.ts", "!**/*.d.ts", "!**/main.ts"]'
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
