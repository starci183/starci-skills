schema: starci/knowledge-source@1
id: be.error
title: Error
purpose: |-
  Given a failure or a refusal in the backend, how is it declared, returned or thrown, logged and mapped onto HTTP and
  GraphQL? Expected refusals are `Outcome` unions; exceptional failures are one `DomainError` family per capability with a
  code enum and an exhaustive code-to-kind table; the transport maps kind to status; undeclared errors are masked.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/patterns/be/folder.yaml
    - knowledge/patterns/be/logging.yaml
    - knowledge/patterns/be/messages.yaml
    - owner-locked BE convention 2026-09-30
    - https://docs.nestjs.com/exception-filters
  limitations: |-
    Static checks judge where an error is declared, what it extends, whether the kind table is exhaustive and whether a
    `catch` handles its error. Whether a message is safe for a client, whether a refusal should be an exception, and whether
    a status fits the contract are reviewed against the accepted SRS and SDS and by transport tests.
rules:
  - id: BE-ERROR-1
    title: One base owned by platform, one family per capability
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      `platform/errors` owns `DomainError`, the closed `ErrorKind = "invalid" | "unauthenticated" | "forbidden" | "not-found" | "conflict" | "rate-limited" | "unavailable" | "internal"`,
      the one kind-to-HTTP table (400, 401, 403, 404, 409, 429, 503, 500), one `ExceptionFilter` for REST and one
      `formatError` for GraphQL. Each capability owns `errors/<c>.error.ts` and declares nothing else: one code enum, one
      exhaustive kind table and one error class. There are no per-case error classes and no `exceptions/` folder. A
      `DomainError` carries no HTTP status.
    rationale: |-
      One class per case is hundreds of files of boilerplate with no type-level exhaustiveness, and a status derived from a
      name suffix is a heuristic; a code enum with a `Record` table makes the compiler prove every code has a kind.
    cases:
      - id: case-1
        when: A capability family
        write: |-
          /** Codes of the purchase capability. */
          export enum PurchaseErrorCode {
              /** The offer does not exist or is not on sale. */
              OfferNotFound = "PURCHASE_OFFER_NOT_FOUND",
              /** The learner already owns the offer. */
              AlreadyOwned = "PURCHASE_ALREADY_OWNED",
          }
          /** How each purchase code travels. */
          export const PURCHASE_ERROR_KINDS: Record<PurchaseErrorCode, ErrorKind> = {
              [PurchaseErrorCode.OfferNotFound]: "not-found",
              [PurchaseErrorCode.AlreadyOwned]: "conflict",
          }
          /** The one error class of the purchase capability. */
          export class PurchaseError extends DomainError<PurchaseErrorCode> {}
    verification:
      automated:
        - BE_ERROR_HOME
      manual:
        - Confirm the family ownership and the public and private error boundary fit the accepted SDS.
    relatedExamples: []
  - id: BE-ERROR-2
    title: Codes are capability-prefixed and unique
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      Code values are `<CAPABILITY>_<WHAT>` in UPPER_SNAKE with no `_EXCEPTION` or `_ERROR` suffix, and are unique across the
      repository. The constructor of the family takes `({ code, params?, cause? })`: `params` interpolate the display text and
      `cause` keeps the raw caught value; an error never carries prose. A code that must survive a process or storage boundary
      is stable text, never a class name.
    rationale: |-
      A stable, greppable code is what transports map and clients match on; prose in the error moves user copy into the
      wrong layer.
    cases:
      - id: case-1
        when: Throwing
        write: 'throw new PurchaseError({ code: PurchaseErrorCode.OfferNotFound, params: { offerId } })'
      - id: case-2
        when: Wrapping a foreign failure
        write: 'throw new DatabaseError({ code: DatabaseErrorCode.QueryFailed, cause: error })'
    verification:
      automated:
        - BE_ERROR_HOME
      manual:
        - Review the capability vocabulary of the codes.
    relatedExamples: []
  - id: BE-ERROR-3
    title: Expected refusals are returned, exceptional failures are thrown
    kind: mandatory
    hfsRules: [R38, R40]
    requirement: |-
      An expected business refusal is returned as `Outcome<V, C> = { kind: "ok"; value: V } | { kind: "refused"; code: C; params?: ... }`
      from `platform/primitives`, where `C` is a subset of the capability's code enum. The transport turns a refusal into the
      capability error with `unwrapOutcome(outcome, <C>Error)`, the only place a refusal becomes a throw. An escaping failure
      is a `DomainError`. Not used: `throw new Error`, the Nest `HttpException` family, a throw of a non-`DomainError`, a
      domain throwing a platform error outward, and a catch that discards its error.
    rationale: |-
      A union makes the compiler force the caller to handle a refusal, while an exception hides it from the type system.
    cases:
      - id: case-1
        when: An expected refusal
        write: 'return { kind: "refused", code: PurchaseErrorCode.AlreadyOwned, params: { offerId } }'
      - id: case-2
        when: A missing aggregate the caller cannot recover from
        write: 'throw new PurchaseError({ code: PurchaseErrorCode.OfferNotFound, params: { offerId } })'
      - id: case-3
        when: Rethrowing
        write: 'catch (error) { if (isRetryable(error)) { return retryLater() } throw error }'
    verification:
      automated:
        - BE_ERROR_HOME
        - BE_LOGGER_REQUIRED
      manual:
        - Distinguish an exceptional failure from an SRS-defined refusal and test both paths.
    relatedExamples: []
  - id: BE-ERROR-4
    title: Wrapping a foreign error and handling every catch
    kind: mandatory
    hfsRules: [R38, R40]
    requirement: |-
      When an ownership boundary replaces a caught failure, pass the exact caught value (a non-Error value included) as
      `cause` of the capability error. Every `catch` block does exactly one of three things: rethrows, calls a method of a
      value typed `Logger`, or returns an `Outcome` that carries the cause. An empty `catch {}` and a catch that discards its
      error are forbidden. A spec proves the constructed error keeps the cause.
    rationale: |-
      A swallowed error turns a real failure into an unexplained state and leaves no trace for the on-call reader.
    cases:
      - id: case-1
        when: Crypto
        write: 'catch (error) { throw new CryptoError({ code: CryptoErrorCode.DecryptionFailed, cause: error }) }'
      - id: case-2
        when: An at-least-once consumer that continues
        write: 'catch (error) { this.logger.error(ConsumerLogEvent.MessageFailed, error, { topic }); return { kind: "refused", code: ConsumerErrorCode.Skipped } }'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
      manual:
        - Verify whether the boundary should recover, rethrow or translate the failure and test the retained cause.
    relatedExamples: []
  - id: BE-ERROR-5
    title: One REST filter and one GraphQL formatter, registered once per app
    kind: mandatory
    hfsRules: [R39]
    requirement: |-
      Each api app registers one `ExceptionFilter` and one `formatError`, both from `platform/errors`, through `APP_FILTER` in
      `app.module.ts`. The filter maps a `DomainError` kind to a status through the one kind table and returns the code and
      the display text resolved by code through `MessageCatalog` and `RequestLocale`. GraphQL failures use HTTP 200 per
      GraphQL-over-HTTP and carry `errors[].extensions.{code,kind}`. Anything that is not a `DomainError` is masked to
      `INTERNAL` and a generic message, with the detail only in the log. Clients match on `extensions.code`, never on the
      message. Both are exercised in a transport test that includes an unknown error.
    rationale: |-
      A client must never receive an internal message, a SQL error or a stack, and one mapping per protocol means masking and
      codes cannot differ per operation.
    cases:
      - id: case-1
        when: Registration
        write: 'apps/api/src/app.module.ts provides { provide: APP_FILTER, useClass: ErrorFilter } and passes formatError to the GraphQL module options.'
      - id: case-2
        when: An unknown error
        write: 'the filter answers { code: "INTERNAL", message: <generic text> } with status 500 and logs the original with its stack.'
    verification:
      automated:
        - BE_ERROR_MASKED
      manual:
        - Exercise the registered filter over HTTP and GraphQL, including unknown errors and redaction.
    relatedExamples: []
  - id: BE-ERROR-6
    title: Display text of an error comes from the catalog by code
    kind: mandatory
    hfsRules: [R78, R38]
    requirement: |-
      A client never reads `message`. The filter and `formatError` resolve the display text by code through `MessageCatalog`
      (`errors.<code>` keys in the owning capability's `messages/`) and `RequestLocale` (stored preference, else
      `Accept-Language` vi or en, else `vi`). An error constructor takes `params` for interpolation and never prose.
    rationale: |-
      Locale is a fact about the receiver; resolving it once per response keeps every error translated the same way.
    cases:
      - id: case-1
        when: A catalog entry
        write: 'purchase/messages/purchase.messages.ts holds "errors.PURCHASE_ALREADY_OWNED": { vi: "...", en: "..." } with {{offerId}} placeholders.'
    verification:
      automated:
        - BE_USER_COPY_LITERAL
      manual:
        - Confirm the vi and en texts of a code carry the same meaning.
    relatedExamples: []
  - id: BE-ERROR-7
    title: Logging a failure
    kind: mandatory
    hfsRules: [R40]
    requirement: |-
      A failure is logged through the `Logger` port of `platform/logging`, injected with `InjectLogger()`, with an enum member
      of the owner's `<owner>.log-events.ts` as the first argument and the error as the cause:
      `this.logger.error(PurchaseLogEvent.CheckoutFailed, error, { offerId })`. Never `console.*`, never the Nest `Logger`,
      never an interpolated message as identity. `ICQRSHandler.execute` already logs `OperationFailed` for a handler that
      throws, so a handler does not log the same failure again.
    rationale: |-
      A stable identity makes a failure searchable and alertable, and a cause keeps the stack.
    cases:
      - id: case-1
        when: Identity
        write: 'an enum member such as PurchaseLogEvent.CheckoutFailed, never a string message'
      - id: case-2
        when: Never
        write: 'console.error, the Nest Logger, `${error.message}` as the identity'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
        - BE_LOG_SECRET
      manual: []
    relatedExamples: []
