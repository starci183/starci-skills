schema: starci/knowledge-source@1
id: be.error
title: Error
purpose: |-
  Given a failure in the backend, how is it declared, thrown, wrapped, logged and mapped onto HTTP and GraphQL? One
  error profile applies to every backend: capability-owned errors that extend the platform `DomainError`, expected
  outcomes as typed unions, one masking filter per app.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/patterns/be/folder.yaml
    - knowledge/patterns/be/logging.yaml
    - docs/backend-source-pattern.md
    - https://docs.nestjs.com/exception-filters
  limitations: |-
    Static checks judge where an error is declared, what it extends and whether a `catch` handles its error. Whether a
    message is safe for a client, whether an outcome should be an exception, and whether a status code fits the
    contract are reviewed against the accepted SRS and SDS and by transport tests.
rules:
  - id: BE-ERROR-1
    title: One base, owned by platform, extended by capabilities
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      `platform/errors` exports `DomainError extends Error` with a stable UPPER_SNAKE `code`, a `cause` field that keeps
      the raw caught value, and no HTTP status. Each capability declares its own family base
      (`<Capability>Error extends DomainError`) and its errors in its own `errors/` folder. There is no application-wide
      subclass hierarchy and no central error folder. Domain identity is independent of HTTP or GraphQL status;
      transport adapters own public mapping.
    rationale: |-
      Errors belong to the capability that decides them. A single platform base gives the filters one type to handle
      without making platform know any domain vocabulary.
    cases:
      - id: case-1
        when: The base
        write: 'export class DomainError extends Error { readonly code: string; readonly cause?: unknown; constructor(code: string, message: string, options?: { cause?: unknown }) { super(message, options); this.code = code; this.name = new.target.name; this.cause = options?.cause } }'
      - id: case-2
        when: A capability family
        write: 'src/modules/domain/orders/errors/orders.error.ts declares `export class OrdersError extends DomainError {}` and the capability index.ts exports it.'
      - id: case-3
        when: Public mapping
        write: The HTTP and GraphQL transports own a code to status table with an explicit fallback; a DomainError never carries a status.
    verification:
      automated:
        - BE_ERROR_HOME
        - NEST_ERROR_DECLARATION_IDENTITY
      manual:
        - Confirm the family ownership and the public and private error boundary fit the accepted SDS.
    relatedExamples: []
  - id: BE-ERROR-2
    title: Declaring one error
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      An error is one class in `<capability>/errors/<name>.error.ts` named `<Subject>Error`, extending its capability
      family. Its constructor takes one named object of the facts needed to diagnose or recover, passes a stable
      UPPER_SNAKE `code` (the class name in upper snake case without the suffix) and a short message, and forwards
      `cause`. The message is a diagnostic sentence and never replaces the code.
    rationale: |-
      One declaration form makes codes stable, greppable and mappable, and keeps the raw cause for the log.
    cases:
      - id: case-1
        when: A declaration
        write: 'export class OrderNotFoundError extends OrdersError { constructor(input: { orderId: string; cause?: unknown }) { super("ORDER_NOT_FOUND", "Order not found", { cause: input.cause }) } }'
      - id: case-2
        when: An interpolated message
        write: 'super("QUOTA_EXHAUSTED", `Quota exhausted for window ${input.window}`, { cause: input.cause })'
      - id: case-3
        when: A code must survive a process or storage boundary
        write: The error declares an explicit serializer that keeps `code` and a JSON-safe payload; the round trip is tested.
    verification:
      automated:
        - BE_ERROR_HOME
        - NEST_ERROR_DECLARATION_IDENTITY
      manual:
        - Review message safety and whether the declared fields are needed for diagnosis or recovery.
    relatedExamples: []
  - id: BE-ERROR-3
    title: Throwing
    kind: mandatory
    hfsRules: [R38, R40]
    requirement: |-
      An escaping failure is an instance of a capability error. A domain never throws a platform error (`EnvError`,
      `PersistenceError`) and a repository translates a driver error into a capability error. A bare `new Error` never
      escapes as the selected failure. Rethrowing the same unchanged caught value is valid. Expected business outcomes
      (pending verification, refused by policy and similar SRS-defined dispositions) are returned as typed union
      results, never thrown. A protocol-native Nest HTTP exception is allowed only in a health probe that resolves its
      own status.
    rationale: |-
      Exceptions mean the operation cannot continue. A refused or pending outcome is a normal result the caller must
      handle, and making it a throw hides it from the type system.
    cases:
      - id: case-1
        when: A missing aggregate
        write: 'if (!order) { throw new OrderNotFoundError({ orderId }) }'
      - id: case-2
        when: An expected refusal
        write: 'return { kind: "refused", reason: "credit-limit" } as part of `type PlaceOrderResult = Placed | Refused | Pending`.'
      - id: case-3
        when: Rethrowing
        write: 'catch (error) { if (isRetryable(error)) { return retry() } throw error }'
      - id: case-4
        when: A driver error in a repository
        write: 'catch (error) { throw new OrderStorageError({ operation: "insert", cause: error }) }'
    verification:
      automated:
        - BE_ERROR_HOME
        - NEST_THROWN_ERROR_IDENTITY
      manual:
        - Distinguish exceptional failure from an explicitly typed SRS disposition and test health allowances.
    relatedExamples: []
  - id: BE-ERROR-4
    title: Wrapping a foreign error and handling every catch
    kind: mandatory
    hfsRules: [R38, R40]
    requirement: |-
      When an ownership boundary replaces a caught failure, pass the exact caught value (including a non-Error value) as
      `cause` of the capability error. Every `catch` block does exactly one of three things: rethrows, logs through the
      `Logger` port, or returns a typed outcome that carries the cause. An empty `catch {}` and a `catch` that discards
      its error are forbidden. A normalized diagnostic may be added as extra metadata; it never replaces the raw cause.
      A spec proves the constructed error keeps the cause.
    rationale: |-
      A swallowed error turns a real failure into an unexplained state and leaves no trace for the on-call reader.
    cases:
      - id: case-1
        when: Crypto
        write: 'catch (error) { throw new DecryptionFailedError({ cause: error }) }'
      - id: case-2
        when: An at-least-once consumer that continues
        write: 'catch (error) { this.logger.error(ConsumerLog.MessageFailed, { topic, cause: error }); return { kind: "skipped", cause: error } }'
      - id: case-3
        when: A recoverable read
        write: 'catch (error) { return { kind: "unavailable", retryable: true, cause: error } }'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
        - NEST_FOREIGN_ERROR_CAUSE
      manual:
        - Verify whether the boundary should recover, rethrow or translate the failure and test the retained cause.
    relatedExamples: []
  - id: BE-ERROR-5
    title: HTTP mapping and masking
    kind: mandatory
    hfsRules: [R39]
    requirement: |-
      Each app registers exactly one HTTP `ExceptionFilter` from `platform/errors` through `APP_FILTER` in
      `app.module.ts`. The filter maps a `DomainError` code to a status through the transport-owned table with an
      explicit fallback, returns `{ statusCode, code, message }`, and masks every undeclared error as a 500 with a
      generic message while the detail goes only to the log. A GraphQL host is left to `formatError`. The filter is
      exercised over HTTP in a transport test that includes an unknown error.
    rationale: |-
      A client must never receive an internal message, a SQL error or a stack, and a code-to-status table owned by the
      transport keeps domain errors independent of the protocol.
    cases:
      - id: case-1
        when: The filter
        write: '@Catch() export class ErrorFilter implements ExceptionFilter { catch(exception: unknown, host: ArgumentsHost): void { const known = exception instanceof DomainError; const status = known ? statusOf(exception.code) : 500; this.logger.error(ErrorLog.Http, { code: known ? exception.code : "UNEXPECTED", cause: exception }); response.status(status).json({ statusCode: status, code: known ? exception.code : "INTERNAL", message: known ? exception.message : "Internal error" }) } }'
      - id: case-2
        when: Registration
        write: 'apps/api/src/app.module.ts provides { provide: APP_FILTER, useClass: ErrorFilter }.'
      - id: case-3
        when: A status table
        write: 'const STATUS_BY_CODE: Readonly<Record<string, number>> = { ORDER_NOT_FOUND: 404, CREDIT_LIMIT: 409 }, with 500 as the fallback.'
    verification:
      automated:
        - BE_ERROR_MASKED
        - NEST_TRANSPORT_ERROR_MAPPER
      manual:
        - Exercise the registered filter over HTTP, including unknown errors, redaction and delegated hosts.
    relatedExamples: []
  - id: BE-ERROR-6
    title: GraphQL mapping and masking
    kind: mandatory
    hfsRules: [R39]
    requirement: |-
      When GraphQL is served, the app's `formatError` from `platform/errors` maps a `DomainError` to a stable
      `extensions.code` and a transport-owned status, and replaces every other error with a generic message and code
      `INTERNAL`, logging the original. Clients match on `extensions.code`, never on the message. A typed business
      disposition stays a normal field of the result. If the API carries the extension status into the HTTP status, the
      installed response plugin consumes that same value.
    rationale: |-
      GraphQL errors leave through one formatter, so masking and codes cannot differ per resolver.
    cases:
      - id: case-1
        when: A domain error
        write: 'formatError returns { ...formatted, extensions: { code: original.code, http: { status: statusOf(original.code) } } }.'
      - id: case-2
        when: Any other error
        write: 'formatError returns { message: "Internal error", extensions: { code: "INTERNAL", http: { status: 500 } } } and logs the original with its stack.'
    verification:
      automated:
        - BE_ERROR_MASKED
        - NEST_TRANSPORT_ERROR_MAPPER
      manual:
        - Test the wire status, public redaction and expected business dispositions.
    relatedExamples: []
  - id: BE-ERROR-7
    title: Logging a failure
    kind: mandatory
    hfsRules: [R40]
    requirement: |-
      Failures are logged through the `Logger` port of `platform/logging` with an enum member as identity and a structured
      payload that carries the error code and cause. Never `console.*`, never the Nest `Logger`, never an interpolated
      message as identity.
    rationale: |-
      A stable identity makes a failure searchable and alertable, and a structured payload keeps the cause.
    cases:
      - id: case-1
        when: Identity
        write: 'an enum member such as ErrorLog.Http, never a string message'
      - id: case-2
        when: Payload
        write: '{ code: exception.code, status, cause: exception.cause }'
      - id: case-3
        when: Never
        write: 'console.error, the Nest Logger, `${error.message}` as the identity'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
        - no-interpolated-log-message
        - no-error-wording-as-log-identity
      manual: []
    relatedExamples: []
