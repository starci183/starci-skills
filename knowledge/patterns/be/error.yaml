schema: starci/knowledge-source@1
id: be.error
title: Error
purpose: >-
  Given a failure in the backend, how is it declared, thrown, wrapped, logged, and mapped onto HTTP and
  GraphQL?


  Profile scope: these historical Academy forms apply where that existing profile is selected. The revised
  docs/backend-source-pattern.md and be.folder/function/typing rules take precedence for ownership and code
  shape. Counts are evidence, not requirements. Do not add obsolete forwarding classes, expose entities,
  centralize domain policy or mandate process overrides to reproduce an example. Migrate conflicting installed
  lint coherently under authority; never suppress it to claim conformance.
appliesTo:
  - backend
family: be
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - modules/platform/exceptions/errors/abstract.ts
    - errors/ai/ai-quota-exhausted.ts
    - errors/courses/challenge-not-found.ts
    - errors/api/graphql.ts
    - modules/platform/exceptions/filters/abstract-exception-http.filter.ts
    - apps/core/src/app.module.ts
    - modules/api/apollo/server/interceptors/graphql-transform.interceptor.ts
    - modules/api/apollo/server/monolithic/monolithic-apollo-server.module.ts
    - modules/api/apollo/server/types/graphql-response.ts
    - features/api/core/graphql/mutations/courses/add-to-cart/add-to-cart.handler.ts
  limitations: >-
    Historical reference-source observations preserved at the extraction commit; not a fresh audit of current
    repository conformance. Counts and file totals cited in rationale or cases are provenance from that
    extraction, not claims about today. Inspect the selected repository's actual types/APIs, aliases and
    lint/test setup; verify reference conformance within approved .starciwork scope. Target legacy code does
    not override the reference. Current business requirements and architecture belong to .starciwork; code
    patterns do not approve them.


    Verified at extraction: 294 files under errors/** declare a class that extends AbstractException; the only
    class extending Error directly is AbstractException itself; lint throw-abstract-exception,
    exception-extends-abstract and exception-in-errors-folder are at error for src/** and off only under
    src/tests/** and apps/*/test/**.
rules:
  - id: BE-ERROR-1
    title: The base
    kind: mandatory
    requirement: In the legacy Academy exception profile, thrown failures use its AbstractException API. In the
      adopted pattern, domain error codes/results stay with the capability and transport adapters map them
      safely. A domain error is not required to carry HTTP status. Unexpected private causes remain internal;
      the public protocol explicitly maps expected outcomes and unknown failures.
    rationale: ""
    cases:
      - id: case-1
        when: Shape
        write: "export class AbstractException extends Error { readonly code: string; readonly metadata?:
          Record<string, unknown>; readonly httpStatus?: number; constructor(message: string, name: string,
          metadata?: Record<string, unknown>, httpStatus?: number) { super(message); this.code = name;
          this.name = name; this.metadata = metadata; this.httpStatus = httpStatus } … }"
      - id: case-2
        when: Serialisation
        write: "toJSON(): string → { message, code, metadata }; static fromJSON<T extends AbstractException>(…)"
      - id: case-3
        when: Cause
        write: "getOriginalError(): unknown { return this.metadata?.originalError }; export interface
          AbstractExceptionMetadata { originalError?: unknown; normalizedError?: Error }"
      - id: case-4
        when: Status
        write: httpStatus is optional; undefined means 500 at both transports
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-ERROR-2
    title: Declaring one exception
    kind: mandatory
    requirement: Declare a metadata interface first, then the class extending AbstractException with a single
      metadata object argument.
    rationale: httpStatus set in 94 of 294 files at extraction, left undefined in the rest.
    cases:
      - id: case-1
        when: Metadata interface first
        write: "export interface ChallengeNotFoundExceptionMetadata extends AbstractExceptionMetadata { id?: string }"
      - id: case-2
        when: Class
        write: 'export class ChallengeNotFoundException extends AbstractException { constructor({ id, originalError }:
          ChallengeNotFoundExceptionMetadata) { super("Challenge not found", "CHALLENGE_NOT_FOUND_EXCEPTION",
          { id, originalError }) } }'
      - id: case-3
        when: Interpolated message
        write: super(`AI quota exhausted (${window})`, "AI_QUOTA_EXHAUSTED_EXCEPTION", { window, originalError })
      - id: case-4
        when: With a status
        write: fourth argument HttpStatus.<X>
      - id: case-5
        when: Single object argument
        write: "always one metadata object, even when empty: throw new UserNotFoundException({}) (lint
          require-exception-object-arg)"
    verification:
      automated:
        - require-exception-object-arg
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-ERROR-3
    title: Throwing
    kind: mandatory
    requirement: Throw the named AbstractException for a failed operation. Do not hide failures in an ad hoc
      success:false envelope. Explicitly specified typed business dispositions remain normal domain results.
      Anonymous Error must not escape as the selected application failure. Constructing an Error internally for
      a retained diagnostic or normalization is allowed when the selected named failure still carries the raw
      cause identity.
    rationale: ""
    cases:
      - id: case-1
        when: Guard in a handler
        write: "if (!courseExists) { throw new CourseNotFoundException({ id: courseId }) }"
      - id: case-2
        when: Conflict
        write: "throw new CourseAlreadyEnrolledException({ courseId, userId: user.id })"
      - id: case-3
        when: Thrown failures versus business outcomes
        write: throw the named AbstractException for a failed operation; do not hide it in an ad hoc success:false
          envelope. An explicitly specified typed business disposition (for example pending verification or
          refused by policy) remains a normal domain result. The installed no-handler-encoded-failure rule is
          a warning and is not authority to change SRS outcomes.
      - id: case-4
        when: Named escaping failure
        write: >-
          Do not throw a bare new Error as the selected application failure. A wrapper may keep
          normalizedError: new Error(String(error)) only in addition to originalError: error.
    verification:
      automated: []
      manual:
        - Distinguish thrown AbstractException failures from explicitly typed business disposition results
          required by SRS.
    relatedExamples:
      - graphql-command
  - id: BE-ERROR-4
    title: Wrapping a foreign error
    kind: mandatory
    requirement: >-
      When an ownership boundary replaces a caught failure, pass the caught input through the selected
      error family's declared cause field. Rethrowing the same caught failure is valid; recovery does not
      require manufacturing a wrapper. The Academy exception profile uses originalError in metadata on
      AbstractException. Other selected families may use cause. Preserve the exact caught value, including
      non-Error values. A normalized diagnostic may be additional metadata; it never replaces the raw cause.
      Tests verify that the constructed error actually retains the cause.
    rationale: 25 non-exception files wrap this way at extraction.
    cases:
      - id: case-1
        when: Crypto
        write: "catch (error) { throw new DecryptionFailedException({ originalError: error, normalizedError:
          error instanceof Error ? error : new Error(String(error)) }) }"
      - id: case-2
        when: Cursor parsing
        write: "catch (error) { throw new CourseCommunityCursorException({ originalError: error }) }"
      - id: case-3
        when: At-least-once consumer
        write: "catch (error) { const exception = new KafkaCdcMessageException({ topic, originalError: error }); …
          log and continue }"
      - id: case-4
        when: Upstream GraphQL
        write: GraphQLDataNotFoundException({ query, variables, url, originalError })
    verification:
      automated:
        - NEST_FOREIGN_ERROR_CAUSE
      manual:
        - Verify whether the boundary should recover, rethrow or translate the failure and test retained cause.
    relatedExamples:
      - graphql-command
      - transactional-service
  - id: BE-ERROR-5
    title: HTTP mapping
    kind: mandatory
    requirement: >-
      An exposed HTTP boundary maps the selected error family through its actual Nest ExceptionFilter.catch
      entry. The response status and statusCode agree; code and message come from the selected public mapping.
      The transport may own a code-to-status map with an explicit unknown-code fallback. A domain error need
      not own an HTTP status. Hosts delegated to another transport rethrow the same error. The exact mapper
      is registered through a resolved
      static APP_FILTER useClass/useExisting provider or @UseFilters boundary; dynamic bootstrap registration
      requires separate boot evidence and is unavailable to the static rule. Verify running registration,
      safe public messages and structured logging in transport tests.
    rationale: ""
    cases:
      - id: case-1
        when: The filter
        write: '@Catch(AbstractException) export class AbstractExceptionHttpFilter implements ExceptionFilter {
          catch(exception: AbstractException, host: ArgumentsHost): void { if (host.getType<string>() ===
          "graphql") { throw exception } const status = exception.httpStatus ??
          HttpStatus.INTERNAL_SERVER_ERROR; … response.status(status).json({ statusCode: status, code:
          exception.code, message: exception.message }) } }'
      - id: case-2
        when: Registration
        write: "apps/core/src/app.module.ts: { provide: APP_FILTER, useClass: AbstractExceptionHttpFilter }"
      - id: case-3
        when: Logged before responding
        write: 'this.winstonService.log(WinstonLog.HttpExceptionLogged, { op: "http.exception.logged", error:
          exception.message, meta: { code: exception.code, status } })'
      - id: case-4
        when: GraphQL host
        write: rethrown untouched so Apollo's pipeline owns it
    verification:
      automated:
        - NEST_TRANSPORT_ERROR_MAPPER
      manual:
        - Exercise the registered filter over HTTP, including unknown errors, redaction and delegated hosts.
    relatedExamples:
      - graphql-command
  - id: BE-ERROR-6
    title: GraphQL mapping
    kind: mandatory
    requirement: >-
      When GraphQL is selected, its formatter maps the selected error family to stable extensions.code and
      the declared transport-owned status, with an explicit unknown-error fallback. If the selected API
      carries extension status into HTTP status, the installed response plugin must consume that same value.
      A resolver result envelope is a separately selected API contract; GraphQL and the Academy
      GraphQLTransformInterceptor envelope are not mandatory for every Nest project. Typed business
      dispositions remain normal results. Clients use the declared error code rather than parsing messages.
    rationale: ""
    cases:
      - id: case-1
        when: Success envelope
        write: 'GraphQLTransformInterceptor maps every resolver result to { data, message, success: true } with
          message from @GraphQLSuccessMessage({ [Locale.En]: "…", [Locale.Vi]: "…" }) resolved by locale'
      - id: case-2
        when: Failure envelope
        write: 'catchError((err) => … observer.next({ success: false, message: err?.message ?? "Internal server
          error", error: err?.name ?? "Error" })) — error carries the exception code because AbstractException
          sets this.name = name'
      - id: case-3
        when: formatError
        write: "in MonolithicApolloServerModule: if (original instanceof AbstractException) { return {
          ...formattedError, extensions: { ...formattedError.extensions, code: original.code, http: { status:
          original.httpStatus ?? 500 }, …retryAfterSeconds } } }"
      - id: case-4
        when: Everything else
        write: "return { ...formattedError, extensions: { ...formattedError.extensions, http: { status: 500,
          ...(formattedError.extensions?.http as ApolloHttpExtension | undefined) } } }"
      - id: case-5
        when: Transport status
        write: httpStatusFromExceptionsPlugin reads extensions.http.status and sets the real HTTP status
      - id: case-6
        when: Client contract
        write: "interface GraphQLResponse<T = unknown> { data?: T; message: string; success: boolean; error?: string
          }; the FE matches on error code, not on status"
    verification:
      automated:
        - NEST_TRANSPORT_ERROR_MAPPER
      manual:
        - Test the selected GraphQL envelope and wire status, public redaction and expected business dispositions.
    relatedExamples:
      - graphql-command
  - id: BE-ERROR-7
    title: Logging a failure
    kind: mandatory
    requirement: Failures log through Winston with an enum identity and structured payload. Never console.error or
      Nest Logger.
    rationale: ""
    cases:
      - id: case-1
        when: Identity
        write: "an enum member: WinstonLog.HttpExceptionLogged (lint no-interpolated-log-message,
          no-error-wording-as-log-identity)"
      - id: case-2
        when: Payload
        write: '{ op: "http.exception.logged", error: exception.message, meta: { code, status } }'
      - id: case-3
        when: Never
        write: console.error, Nest Logger
    verification:
      automated:
        - no-interpolated-log-message
        - no-error-wording-as-log-identity
      manual: []
    relatedExamples: []
