schema: starci/knowledge-source@1
id: be.idempotency
title: Inbox dedupe
purpose: |-
  Given a door a delivery can repeat through - a signed webhook, a queue message, a relayed outbox row - how does the receiver
  make a repeat a no-op instead of a second charge, a second email or a second state transition? One inbox table keyed by
  (source, event id) sits in front of every such door, reached through `InjectInbox()`.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - knowledge/patterns/be/persistence.yaml
  limitations: |-
    Static checks read the first awaited expression of a consumer or signed-webhook handler and the type of its receiver.
    They cannot see whether the claim still runs first after a later edit adds an earlier await, which is what the service spec of the
    service the consumer calls (the consumer itself is thin) and the e2e run assert.
rules:
  - id: BE-IDEMPOTENCY-1
    title: A consumer or signed webhook claims the event before it acts
    kind: mandatory
    hfsRules: [R80, R85]
    requirement: |-
      Every consumer (`transport/message/<event>.consumer.ts`) and every `@Public({ reason: PublicReason.SignedWebhook })`
      handler takes `@InjectInbox() private readonly inbox: Inbox` and, as its first awaited expression, calls
      `await this.inbox.claim(source, eventId)`; when it answers `false` the handler returns without any side effect. `source`
      is a short constant naming the provider or the internal publisher; `eventId` is the id the delivery itself carries (a
      provider's event id, a queue message id, an outbox row id) and is never generated by the receiver. The rule finds the
      claim by the declared type of the receiver (`Inbox`), not by a method or variable name. A class that only produces (the
      relay of the outbox) is not a consumer and is not asked for a claim.
    rationale: |-
      A sender that gets no timely reply resends: a payment provider retries a webhook, a queue redelivers a message it never
      saw acknowledged. Identifying the receiver by type removes the keyword match a renamed variable could satisfy.
    cases:
      - id: case-1
        when: A signed webhook controller
        write: 'the webhook door (webhooks.yaml) verifies the signature and calls one domain intake method; that method of the domain service claims (PAYOS_SOURCE, eventId) as its first awaited expression, returns when the claim answers false, and publishes the event in its transaction.'
      - id: case-2
        when: A consumer
        write: 'be/src/features/api/billing/transport/message/payment-captured.consumer.ts claims (source, eventId) as its first awaited expression, then dispatches one command.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
      manual:
        - Trace that the claim executes on every path before the side effect, including an early return added later.
    relatedExamples: []
  - id: BE-IDEMPOTENCY-2
    title: The inbox is one table, owned by platform, shared by every door
    kind: mandatory
    hfsRules: [R80, R35]
    requirement: |-
      `platform/inbox` owns one table, `inbox_claims(id uuid primary key, source text not null, event_id text not null,
      claimed_at timestamptz not null)`, with a unique constraint on `(source, event_id)`, created by a migration under
      `platform/inbox/persistence/migrations/`. `Inbox.claim(source, eventId)` inserts a row on the shared manager and returns
      `true`, or catches the unique violation of a repeat and returns `false`; it never reads first and writes after, which
      races two concurrent deliveries of the same event.
    rationale: |-
      One shared table with one owner keeps the guarantee "this (source, event id) claims at most once" in one place, and
      insert-and-catch is what makes the claim atomic under concurrent delivery.
    cases:
      - id: case-1
        when: The migration
        write: 'be/src/modules/platform/inbox/persistence/migrations/1790000000000-create-inbox-claims.ts creates inbox_claims with CONSTRAINT inbox_claims_source_event_id_key UNIQUE (source, event_id).'
      - id: case-2
        when: The adapter
        write: 'async claim(source, eventId) { try { await this.entityManager.insert(InboxClaimEntity, { source, eventId, claimedAt: this.clock.now() }); return true } catch (error) { if (isUniqueViolation(error)) return false; throw error } }'
    verification:
      automated:
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
      manual:
        - Confirm no capability declares a second inbox-shaped table instead of using this one.
    relatedExamples: []
