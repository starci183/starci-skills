schema: starci/knowledge-source@1
id: be.idempotency
title: Inbox dedupe
purpose: |-
  Given a door a delivery can repeat through - a signed webhook, a queue message, a relayed outbox row - how does the receiver
  make a repeat a no-op instead of a second charge, a second email or a second state transition? One inbox table keyed by
  (source, event id) sits in front of every such door, reached through `InjectInbox()`.
appliesTo:
  - backend
family: be
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [be.transport.message, be.feature.reactors, be.integrations]
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - knowledge/patterns/be/persistence.yaml
  limitations: |-
    Static checks judge the delivery entry of the service a thin door calls: the genuine Inbox receiver, the first await,
    and the return on false. For a sole returned or awaited EntityManager transaction, they also inspect its actual inline
    callback, require the claim in its first statement, and bind the claim's manager to that callback's parameter.
    They do not prove getter effects, called helpers, database rollback or broker delivery; service specs and the real test world
    prove failure and redelivery behaviour. Non-inline callbacks and dynamic isolation expressions are not static proof here.
rules:
  - id: BE-IDEMPOTENCY-1
    title: The delivery service claims the event before it acts
    kind: mandatory
    hfsRules: [R80, R85]
    requirement: |-
      A consumer (`transport/message/<event>.consumer.ts`) or `@Public({ reason: PublicReason.SignedWebhook })` controller is
      a thin door: it forwards the delivery's `eventId` through one command to the domain service. A public delivery method
      of that service (its first parameter carries `eventId`) takes `@InjectInbox() private readonly inbox: Inbox`, claims
      `(source, eventId)` first and returns when the claim answers `false`. When the service owns an EntityManager transaction,
      the first awaited work in the transaction callback is `this.inbox.claim(source, eventId, manager)`, with that callback's
      own manager. The claim, domain writes and outbox rows commit or roll back together; never move the claim to the shared
      manager outside the transaction to satisfy a static check. A duplicate return ends the callback and no outer delivery
      work follows it. `source` names the provider or publisher; `eventId` comes from the delivery and is never generated by
      the receiver. The rule identifies the Inbox and EntityManager by their declared type origins, not variable names.
      An outbox relay that only produces is not a delivery service and is not asked for a claim.
    rationale: |-
      A sender that gets no timely reply resends: a payment provider retries a webhook, a queue redelivers a message it never
      saw acknowledged. Identifying the receiver by type removes the keyword match a renamed variable could satisfy.
    cases:
      - id: case-1
        when: A signed webhook controller
        write: 'the webhook door (webhooks.yaml) verifies the signature and calls one domain intake method; that method of the domain service claims (PAYOS_SOURCE, eventId) as its first awaited expression, returns when the claim answers false, and publishes the event in its transaction.'
      - id: case-2
        when: A consumer
        write: 'be/src/features/api/billing/transport/message/payment-captured.consumer.ts forwards delivery.eventId in one command; its domain service claims first inside its own transaction with the callback manager, then writes and publishes through that manager.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
        - BE_RAW_INJECT
      manual:
        - Trace that the claim executes on every path before the side effect, including an early return added later.
    relatedExamples: []
  - id: BE-IDEMPOTENCY-2
    title: The inbox is one table, owned by platform, shared by every door
    kind: mandatory
    hfsRules: [R80, R35, R34]
    requirement: |-
      `platform/inbox` owns one table, `inbox_claims(id uuid primary key, source text not null, event_id text not null,
      claimed_at timestamptz not null)`, with a unique constraint on `(source, event_id)`, created by a migration under
      `platform/inbox/persistence/migrations/`. `Inbox.claim(source, eventId, tx?)` inserts atomically on the supplied
      transaction manager, or on the configured manager when no caller transaction is supplied. A conflict-safe insert
      (`ON CONFLICT (source, event_id) DO NOTHING RETURNING event_id`) returns `true` for a new row and `false` for a
      duplicate without aborting the caller's transaction. It never reads first and writes after, which races two concurrent
      deliveries of the same event.
    rationale: |-
      One shared table with one owner keeps the guarantee "this (source, event id) claims at most once" in one place, and
      the atomic conflict-safe insert makes the claim safe under concurrent delivery and keeps a duplicate transaction usable.
    cases:
      - id: case-1
        when: The migration
        write: 'be/src/modules/platform/inbox/persistence/migrations/1790000000000-create-inbox-claims.ts creates inbox_claims with CONSTRAINT inbox_claims_source_event_id_key UNIQUE (source, event_id).'
      - id: case-2
        when: The adapter
        write: 'async claim(source, eventId, tx?) { const manager = tx ?? this.managers[0]; const rows = await manager.query(CLAIM_EVENT, [source, eventId, this.clock.now()]); return rows.length > 0 } // CLAIM_EVENT is the conflict-safe insert in the inbox owner persistence file.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
      manual:
        - Confirm no capability declares a second inbox-shaped table instead of using this one.
    relatedExamples: []
