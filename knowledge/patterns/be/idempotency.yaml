schema: starci/knowledge-source@1
id: be.idempotency
title: Inbox dedupe
purpose: |-
  Given a door delivery can repeat through - a webhook, an outbox publish a consumer reads, a queue message - how
  does the receiver make a repeat a no-op instead of a second charge, a second email or a second state transition?
  One inbox table keyed by (source, event id) sits in front of every such door.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - packages/eslint/be/idempotency.mjs
    - knowledge/patterns/be/persistence.yaml
  limitations: |-
    Static checks find a webhook or consumer with no textual reference to an inbox or dedupe port and refuse it.
    Detecting a consumer is a shape judgment (a decorated handler, a class name, a filename); it cannot see whether
    the claim actually runs before the side effect in every code path, which needs the call graph and stays a review
    question.
rules:
  - id: BE-IDEMPOTENCY-1
    title: A webhook or consumer claims the event before it acts
    kind: mandatory
    hfsRules: [R80]
    requirement: |-
      A `@Public()` webhook controller method, and any outbox or queue consumer, constructor-injects `InboxPort`
      from `platform/inbox` and calls `await this.inbox.claim(source, eventId)` as the first statement of the
      handling method, before any side effect; a `false` result (already claimed) returns immediately with no side
      effect. `source` is a short constant naming the provider or internal publisher (`'zalo'`, `'payos'`,
      `'sepay'`, `'internal-outbox'`); `eventId` is the id the delivery itself carries (a provider's webhook event
      id, a queue message id, an outbox row id) - never one generated by the receiver. A consumer is recognized by
      more than its filename: a method whose decorator is `@EventPattern`, `@MessagePattern`, `@OnEvent` or
      `@Process`, or a class whose name ends `Consumer` or `OutboxConsumer`, is a consumer regardless of what file it
      sits in, same as `<event>.consumer.ts` under `transport/message/` is. A class that only publishes - the
      producer half of the outbox, typically named `<capability>-outbox.service.ts` / `*OutboxService`, which reads
      pending rows and calls a broker or provider - is not a consumer and is not asked for a claim unless it also
      carries a consuming decorator or shape; do not flag a producer for lacking dedupe it has no delivery to
      dedupe.
    rationale: |-
      A sender that gets no timely reply resends: a payment provider retries a webhook, a queue redelivers a message
      it never saw acknowledged. Naming the shape (decorator, class suffix) instead of only a path convention
      catches a consumer a repository places outside `transport/message/` or names differently, without pulling a
      producer that has no repeat-delivery problem into the same net.
    cases:
      - id: case-1
        when: A webhook controller
        write: '@Public({ reason: "external" }) async handle(@Body() body) { if (!(await this.inbox.claim("payos", body.eventId))) return; ...apply the payment... }'
      - id: case-2
        when: A filename-based consumer
        write: 'src/features/billing/transport/message/payment-captured.consumer.ts claims (source, eventId) as its first statement.'
      - id: case-3
        when: A shape-based consumer outside transport/message
        write: '@Injectable() class PaymentCapturedHandler { @EventPattern("payment.captured") async handle(payload) { if (!(await this.inbox.claim("internal-outbox", payload.eventId))) return; ... } }'
      - id: case-4
        when: A producer is not a consumer
        write: 'PaymentOutboxService reads pending outbox rows on a schedule and calls the payment provider; it has no delivery to dedupe and carries no InboxPort, and is not flagged.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
      manual:
        - Trace that the claim call actually executes on every path before the side effect, including an early return added later, which the rule cannot see.
    relatedExamples: []
  - id: BE-IDEMPOTENCY-2
    title: The inbox is one table, owned by platform, shared by every door
    kind: mandatory
    hfsRules: [R80]
    requirement: |-
      `platform/inbox` owns one table, `inbox_claims(id uuid primary key, source text not null, event_id text not
      null, claimed_at timestamptz not null)`, with a unique constraint on `(source, event_id)`, created by a
      migration under `platform/inbox/persistence/migrations/` that creates the table `IF NOT EXISTS` (several
      repositories and lanes may each carry a migration that creates this same table; the guard keeps a second one a
      no-op instead of a failed deploy). `InboxPort.claim(source, eventId)` inserts a row and returns `true`, or
      catches the unique-violation on a repeat and returns `false`; it never does a read-then-write check, which
      races two concurrent deliveries of the same event.
    rationale: |-
      One shared table with one owner keeps the guarantee ("this (source, event id) claims at most once") in one
      place instead of each capability inventing its own dedupe table with its own race. Insert-and-catch, not
      check-then-insert, is what makes the claim atomic under concurrent delivery.
    cases:
      - id: case-1
        when: The migration
        write: 'src/modules/platform/inbox/persistence/migrations/<yyyyMMddHHmmss>-create-inbox-claims.ts runs `CREATE TABLE IF NOT EXISTS inbox_claims (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), source text NOT NULL, event_id text NOT NULL, claimed_at timestamptz NOT NULL DEFAULT now(), CONSTRAINT inbox_claims_source_event_id_key UNIQUE (source, event_id))`.'
      - id: case-2
        when: The adapter
        write: 'async claim(source, eventId) { try { await manager.insert(InboxClaimEntity, { source, eventId, claimedAt: this.clock.now() }); return true } catch (error) { if (isUniqueViolation(error)) return false; throw error } }'
    verification:
      automated:
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
      manual:
        - Confirm the migration is idempotent (IF NOT EXISTS) and that no capability declares a second inbox-shaped table instead of importing this one.
    relatedExamples: []
