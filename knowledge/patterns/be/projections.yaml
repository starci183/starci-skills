schema: starci/knowledge-source@1
id: be.projections
title: Projections (read models)
purpose: |-
  Given a read that needs data of another context (a join of order and payment, a count over many aggregates), where does it come
  from? Never from a cross-context join: a projection keeps a read model, a table of its own under the owning context's
  connection, that a reactor or a job recomputes from the source events. `modules/projections/<name>/` holds the projection class
  (`recompute*` writes, `get*` reads) and its entity; only the projection writes its table, and the api reads only through `get*`.
appliesTo:
  - backend
family: be
pattern: projection
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (projections replace cross-context joins)
  limitations: |-
    Static checks prove who writes the table, the method vocabulary, that the entity stays inside and that the api never recomputes.
    They do not prove that a recompute is idempotent or that a replay rebuilds the same rows; the test-world scenarios
    (`projection/*`) prove both.
rules:
  - id: BE-PROJECTIONS-1
    title: Only the projection writes its table
    kind: mandatory
    hfsRules: [R161, R86]
    requirement: |-
      The entity of a projection (`<name>.projection-entity.ts`) is written only by `<name>.projection.ts` of the same folder:
      no domain service, handler, reactor, job or other projection writes it. Its table, migrations and connection registration
      sit in `modules/projections/<name>/persistence/`, on the connection of the context that owns the read model.
    rationale: |-
      A read model with one writer can always be rebuilt from its sources; a second writer makes the table a source of truth that
      replay would destroy.
    cases:
      - id: case-1
        when: A payment settles and the order summary must show it
        write: 'The payment event reaches an order reactor, which dispatches RecomputeOrderSummaryCommand; its handler calls OrderSummaryProjection.recomputeOrderSummary(orderId).'
    verification:
      automated:
        - BE_PROJECTION_WRITE_OWNER
        - BE_SQL_TABLE_OWNER
      manual:
        - Confirm the projection sits on the connection of the context that serves the read.
    relatedExamples: [projection]
  - id: BE-PROJECTIONS-2
    title: A projection speaks recompute and get, and hides its entity
    kind: mandatory
    hfsRules: [R162]
    requirement: |-
      Every public method of the projection class is `recompute*` (an idempotent write from the source facts that can replay from
      scratch) or `get*` (a read). The `index.ts` of the projection exports the class and its contracts, never the entity. A feature
      of kind api calls only `get*`; a reactor, a job or a cli command calls `recompute*`.
    rationale: |-
      A closed vocabulary keeps writes replayable and reads shape-independent, and the kind rule keeps the request path off the
      write side.
    cases:
      - id: case-1
        when: The api serves an order summary
        write: 'show-order-summary.handler.ts calls this.orderSummary.getOrderSummary(orderId) and never recomputeOrderSummary.'
    verification:
      automated:
        - BE_PROJECTION_SHAPE
      manual:
        - Confirm each recompute reads only source facts and upserts by a natural key.
    relatedExamples: [projection]
  - id: BE-PROJECTIONS-3
    title: A projection publishes nothing and is kept current by a reactor or a job
    kind: mandatory
    hfsRules: [R152, R156]
    requirement: |-
      A projection never publishes an event or enqueues a job (`eventBus.publish` and queue producers are refused outside
      `modules/domain`). A reactor under `features/reactors/<name>-projection/` consumes the source event and dispatches a command
      whose handler calls `recompute*`; a rebuild is a job or a cli command that calls `recompute*` for every key. A projection
      reads the facts of its own context through that context's domain services, never another context's tables.
    rationale: |-
      The read model is derived data: an event from it would let derived data drive the system of record.
    cases:
      - id: case-1
        when: Rebuild every summary
        write: 'features/jobs/rebuild-order-summary: a processor that pages order ids and calls recomputeOrderSummary for each.'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_KIND_ISOLATION
      manual:
        - Confirm no projection class holds an event bus or a queue producer.
    relatedExamples: [projection]
  - id: BE-PROJECTIONS-4
    title: A declared projection is proven on the test world
    kind: mandatory
    hfsRules: [R155]
    requirement: |-
      An app that declares `projection` has tests titled `projection/<scenario>: ...` for `recompute-is-idempotent` (the same recompute
      twice leaves one identical row) and `replay-rebuilds` (dropping the table and replaying the events rebuilds the same rows).
    rationale: |-
      Idempotence and replayability are the two properties that make a read model safe to operate.
    cases:
      - id: case-1
        when: The order-summary e2e suite
        write: "it('projection/replay-rebuilds: truncate then replay gives the same summaries', ...)"
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual: []
    relatedExamples: [projection]
  - id: BE-PROJECTIONS-5
    title: A projection stays inside the context that serves the read
    kind: mandatory
    hfsRules: [R175]
    requirement: |-
      A projection sits on the connection of one context. Its entity declares no relation and its migration no foreign key onto a table
      of another context, and no file of the projection imports a file of a capability of another context (its entities, services or SQL).
      The facts it summarises from another context arrive as events through a reactor, never through a join or an import.
    rationale: |-
      A read model that reaches into another context's schema rebuilds the coupling the contexts were split to avoid.
    cases:
      - id: case-1
        when: An order summary that shows the payment status
        write: 'The payment event reaches an order reactor, which dispatches a command that stores the status locally and calls recomputeOrderSummary; the projection never joins the payment tables.'
    verification:
      automated:
        - BE_CONTEXT_COUPLING
      manual:
        - Confirm the projection sits on the connection of the context that serves the read.
    relatedExamples: [projection]
files:
  - path: src/modules/projections/<name>/index.ts
    slot: be.projections
    template: projections/projection.index.ts.tpl
    role: Exports the projection class and its contracts, never the entity.
    rules: [BE_PROJECTION_SHAPE]
  - path: src/modules/projections/<name>/<name>.options.ts
    slot: be.projections
    template: projections/projection.options.ts.tpl
    role: The empty options of the projection (the configurable module base needs a type).
  - path: src/modules/projections/<name>/<name>.module-definition.ts
    slot: be.projections
    template: projections/projection.module-definition.ts.tpl
    role: The configurable-module base; isGlobal is the app root's decision.
  - path: src/modules/projections/<name>/<name>.module.ts
    slot: be.projections
    template: projections/projection.module.ts.tpl
  - path: src/modules/projections/<name>/<name>.projection.ts
    slot: be.projections
    template: projections/projection.projection.ts.tpl
    role: recompute* and get* only.
    rules: [BE_PROJECTION_SHAPE, BE_PROJECTION_WRITE_OWNER]
  - path: src/modules/projections/<name>/<name>.projection-entity.ts
    slot: be.projections
    template: projections/projection.entity.ts.tpl
    role: The read-model table; written only by the projection.
    rules: [BE_PROJECTION_WRITE_OWNER]
  - path: src/modules/projections/<name>/<name>.contracts.ts
    slot: be.projections
    optional: true
  - path: src/modules/projections/<name>/persistence/connection.ts
    slot: be.persistence
    template: projections/persistence.connection.ts.tpl
  - path: src/modules/projections/<name>/persistence/migrations/<epochMs13>-create-<name>.ts
    slot: be.persistence
    template: projections/migration.ts.tpl
  - path: src/features/reactors/<name>-projection/transport/message/<event>.consumer.ts
    slot: be.transport.message
    role: The reactor door that triggers a recompute.
    rules: [BE_EVENT_CONSUMER_SHAPE]
  - path: src/tests/e2e/<area>/<name>.e2e-spec.ts
    slot: be.tests.e2e
    role: "Titles projection/<scenario>: ... prove the pattern."
    spec: projection/recompute-is-idempotent, projection/replay-rebuilds
    rules: [BE_PATTERN_SPEC_MISSING]
