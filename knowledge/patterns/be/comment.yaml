schema: starci/knowledge-source@1
id: be.comment
title: Comment
purpose: |-
  Given a backend declaration or statement, does it carry a comment, where does it sit, and what does it say?
appliesTo:
  - backend
family: be
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - features/api/core/graphql/mutations/courses/add-to-cart/*
    - features/api/core/graphql/queries/courses/course/course.handler.ts
    - modules/platform/exceptions/errors/abstract.ts
    - errors/courses/challenge-not-found.ts
    - modules/platform/exceptions/filters/abstract-exception-http.filter.ts
    - modules/databases/postgresql/primary/enums/locale.ts
    - modules/api/apollo/server/monolithic/monolithic-apollo-server.module.ts
    - eslint.config.mjs
  limitations: |-
    Historical reference-source observations preserved at the extraction commit; not a fresh audit of current repository conformance. Counts and file totals cited in rationale or cases are provenance from that extraction, not claims about today. Inspect the selected repository's actual types/APIs, aliases and lint/test setup; verify reference conformance within approved .starciwork scope. Target legacy code does not override the reference. Current business requirements and architecture belong to .starciwork; code patterns do not approve them.
rules:
  - id: BE-COMMENT-1
    title: Every export has a docblock, placed after the decorators
    kind: mandatory
    requirement: |-
      Every export carries a docblock. On decorated classes the block sits between the class decorators and export class.
    rationale: |-
      1676 of 2009 non-spec files under features/api/core/graphql contain a docblock at extraction; lint require-export-jsdoc is at error.
    cases:
      - id: case-1
        when: Resolver
        write: |-
          @Resolver()
          /**
           * GraphQL entry for adding a course to the current user's shopping cart.
           */
          export class AddToCartResolver
      - id: case-2
        when: Handler
        write: |-
          @CommandHandler(AddToCartCommand)
          @Injectable()
          /**
           * Handler for the addToCart mutation.
           *
           * Idempotently places a `(user, course)` row into the cart: …
           */
          export class AddToCartHandler
      - id: case-3
        when: Module
        write: |-
          @Module({ … })
          /** Isolated Nest registration for staging a course in the cart before checkout. */
          export class AddToCartSingleMutationModule
      - id: case-4
        when: Input type
        write: |-
          @InputType({ description: "…" })
          /** Request for the addToCart mutation -- identifies the course to add to the caller's cart. */
          export class AddToCartRequest
      - id: case-5
        when: Undecorated export
        write: |-
          directly above: /** CQRS command carrying the request/user context for the addToCart mutation. */
          export class AddToCartCommand
      - id: case-6
        when: Interceptor
        write: |-
          @Injectable()
          /**
           * Interceptor that wraps resolver result in { data, message, success } and handles errors.
           *
           * @example
           * Use @GraphQLSuccessMessage("Done") on a resolver; …
           */
    verification:
      automated:
        - require-export-jsdoc
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-COMMENT-2
    title: The docblock states responsibility and invariant, not the name
    kind: mandatory
    requirement: |-
      Docblocks explain why a declaration exists, what must not happen, who throws it, or why a field is nullable — not a restated name.
    rationale: |

    cases:
      - id: case-1
        when: Why a field is nullable
        write: |-
          `data` … is marked `nullable: true` because the transform interceptor sets `data = null` on the error path -- a non-nullable field would crash GraphQL and mask the real error instead of surfacing it. (AddToCartResponse)
      - id: case-2
        when: Why a class exists
        write: |-
          Nest's default filter only maps subclasses of `HttpException` to their status code -- `AbstractException` extends plain `Error`, so without this filter every thrown `AbstractException` falls through to a generic 500. (AbstractExceptionHttpFilter)
      - id: case-3
        when: What must not happen
        write: |-
          Fails the request when the challenge id is unknown -- downstream must not grade a ghost challenge. (ChallengeNotFoundException)
      - id: case-4
        when: Who throws it
        write: |-
          Thrown by `AiEntitlementService.consume` when the user has no remaining allowance in one of the sliding windows, …
      - id: case-5
        when: Restated name (residual debt, not the pattern)
        write: |-
          /** Constructor. */ still appears in 27 files at extraction (add-to-cart.handler.ts among them); lint no-restated-name-jsdoc names it as debt, not as the pattern
    verification:
      automated:
        - no-restated-name-jsdoc
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-COMMENT-3
    title: Methods and fields
    kind: mandatory
    requirement: |-
      Methods, fields and generic templates carry responsibility-focused docs including params/returns and cross-references where useful.
    rationale: |

    cases:
      - id: case-1
        when: Method
        write: |-
          /**
           * Processes the addToCart command.
           * @param command - The command carrying request + authenticated user.
           * @returns The cart row holding the course (created or already present).
           */
      - id: case-2
        when: Field
        write: |-
          /** Unique error code for identification */ readonly code: string; /** Id of the course the user wants to place in their cart. */ courseId: string
      - id: case-3
        when: Interface field with a cross-reference
        write: |-
          /** Enrollment id for the active course (user x course), injected by {@link GraphQLEnrollmentGuard} from the `x-course-id` header. … */ enrollmentId?: string
      - id: case-4
        when: Generic
        write: |-
          @template TParams - The parameters type. (ICQRSHandler)
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-COMMENT-4
    title: Enum members are each documented
    kind: mandatory
    requirement: |-
      Every enum member has a docblock.
    rationale: |

    cases:
      - id: case-1
        when: Locale
        write: |-
          /** Serve Vietnamese copy; missing Vi falls through to `fallbackLocale`. */ Vi = "vi", /** Serve English copy; also the usual `defaultLocale` / fallback. */ En = "en"
    verification:
      automated:
        - require-enum-member-jsdoc
      manual: []
    relatedExamples: []
  - id: BE-COMMENT-5
    title: Line comments are prose about why
    kind: mandatory
    requirement: |-
      Line comments sit above the statement, in lowercase sentence form, and give the consequence that motivates the code.
    rationale: |-
      9720 // lines in non-spec src/ at extraction; the ` -- ` join appears in 1299 of them; a plain sentence is the majority form.
    cases:
      - id: case-1
        when: A guard
        write: |-
          // reject unauthenticated callers up front -- cart rows are per-user
      - id: case-2
        when: A constraint
        write: |-
          // idempotent add: if the (user, course) row already exists, return it as-is --
          // creating a second one would violate UQ_cart_items_user_course
      - id: case-3
        when: A scope decision
        write: |-
          // a course the user already OWNS must not be carted -- real enrollment (paid)
          // only, so a trial/preview row (is_enrolled = false) still allows adding to cart
      - id: case-4
        when: A hand-off
        write: |-
          // hand off to the command handler which performs the DB work
      - id: case-5
        when: Error policy
        write: |-
          // any OTHER error (graphql-js's own execution errors …) is by definition an UNEXPECTED server bug, never the client's fault -- default it to 500 too
      - id: case-6
        when: The ` -- ` join
        write: |-
          used in a minority of lines; a plain sentence is the majority form
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-COMMENT-6
    title: Block comments for multi-paragraph reasoning inside a body
    kind: mandatory
    requirement: |-
      Multi-paragraph reasoning inside a function body uses /* … */ blocks that open with a capitalised claim, then evidence, then corrected history when applicable.
    rationale: |

    cases:
      - id: case-1
        when: course.handler.ts
        write: |-
          /*
           * EITHER IDENTIFIER ADDRESSES THE SAME OBJECT, because the synchronizer writes both.
           * `MaterializeAndUploadService` uploads … It used to refuse anything but a display id, … That reading was wrong about the bucket …
           */ — opens with a capitalised claim, then the evidence, then the corrected history
      - id: case-2
        when: Config
        write: |-
          the eslint.config.mjs blocks that record why a rule is at error, with the measured debt (nợ=0 (296/296) in source)
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-COMMENT-7
    title: What a comment never contains
    kind: mandatory
    requirement: |-
      Comments stay ASCII with no emoji or AI symbols. Vietnamese client strings carry a vn-ok reason. No line suppressions; exceptions live in config with a comment. No restated-name docblocks.
    rationale: |

    cases:
      - id: case-1
        when: Non-ASCII
        write: |-
          lint no-non-ascii-source, no-ai-symbol, no-emoji; comments stay ASCII
      - id: case-2
        when: Vietnamese (sanctioned exception with reason)
        write: |-
          [Locale.Vi]: "Thêm khóa học vào giỏ hàng thành công", // vn-ok: vi-locale string emitted to clients (lint require-vn-ok-reason)
      - id: case-3
        when: A suppression
        write: |-
          eslint-disable-next-line (lint no-line-suppression); exceptions live in config with a comment
      - id: case-4
        when: A restated name
        write: |-
          see BE-COMMENT-2 case-5
    verification:
      automated:
        - no-non-ascii-source
        - no-ai-symbol
        - no-emoji
        - no-vietnamese
        - require-vn-ok-reason
        - no-line-suppression
      manual: []
    relatedExamples: []
