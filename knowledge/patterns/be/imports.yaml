schema: starci/knowledge-source@1
id: be.imports
title: Imports
purpose: |-
  Given a backend file, what may it import, through which path and in which direction? Layout of the import block
  (braces, line breaks, wrapping) is Prettier's decision and is not a rule.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/patterns/be/architecture-check.yaml
    - https://www.typescriptlang.org/docs/handbook/modules/reference.html
  limitations: |-
    Static analysis resolves aliases, relative paths, literals, re-exports and packages through the repository's actual
    TypeScript project. It does not prove Nest provider identity. A path that cannot resolve is a configuration failure.
rules:
  - id: BE-IMPORTS-1
    title: Paths
    kind: mandatory
    hfsRules: [R30]
    requirement: |-
      Across owners use the repository aliases from `@starci/tsconfig` (`@modules/*`, `@features/*`, `@tests/*`) or a
      workspace package export, and always resolve to the target owner's `index.ts`. Inside one owner use relative
      imports and never import the owner's own public `index.ts` back into its implementation. Deep imports into another
      owner's files are forbidden; a barrel that re-exports a folder wholesale (`export *`) is forbidden.
    rationale: |-
      One public entry per owner is the only way to change internals without a cross-repository search.
    cases:
      - id: case-1
        when: Across a capability boundary
        write: 'import { OrdersModule } from "@modules/domain/orders"'
      - id: case-2
        when: Inside one owner
        write: 'import { OrderRepository } from "./persistence/order.repository"'
      - id: case-3
        when: Test helpers
        write: 'import { orderBuilder } from "@tests/fixtures/orders"'
    verification:
      automated:
        - BE_PUBLIC_SURFACE
        - ARCH_OWNER_EXPORT_BYPASS
        - ARCH_OWNER_EXPORT_STAR
        - ARCH_PACKAGE_EXPORT_BYPASS
        - no-self-module-alias
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-2
    title: Layout is Prettier's
    kind: mandatory
    hfsRules: [R19]
    requirement: |-
      The layout of an import declaration (single line, wrapped, trailing comma) is produced by Prettier and is neither
      linted nor reviewed. Type-only bindings use `import type`; the type-import lint rule checks usage. Side-effect,
      default-only and namespace imports use their valid TypeScript forms.
    rationale: |-
      A formatter that decides layout removes a whole class of review noise and one-binding-per-line inflation.
    cases:
      - id: case-1
        when: A type-only binding
        write: 'import type { EntityManager } from "typeorm"'
    verification:
      automated:
        - HFS_FORMAT
        - "@typescript-eslint/consistent-type-imports"
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-3
    title: Order
    kind: residual
    hfsRules: [R19]
    requirement: |-
      Import order is not enforced. The conventional grouping is the Nest and framework packages first, then capability
      imports through aliases, then relative imports, and is left to the author.
    rationale: |-
      Order carries no dependency meaning that a check could judge.
    cases:
      - id: case-1
        when: A conventional file
        write: '@nestjs packages, then @modules and @features aliases, then ./ relative imports'
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-4
    title: Layering direction
    kind: mandatory
    hfsRules: [R26, R27, R28, R30]
    requirement: |-
      Dependencies follow the tier matrix in be/architecture-check.yaml BE-ARCHITECTURE-1. A feature never imports a
      feature. Cross-owner imports use explicit public entries and required Nest module registrations. Global
      registration is reserved for `platform/{config,logging,database}`. Named connections, tenant or provider
      instances and request scopes stay explicit. A cycle between owners, including through `import type`, is a finding.
    rationale: |-
      The direction is what lets owners be tested and split separately.
    cases:
      - id: case-1
        when: Across a capability boundary
        write: Import the explicit public entry and the module that exports the required provider; do not register that provider a second time.
      - id: case-2
        when: Inside one owner
        write: Use local relative paths.
    verification:
      automated:
        - BE_TIER_DIRECTION
        - ARCH_OWNER_CYCLE
        - BE_FEATURE_IMPORTS_FEATURE
        - ARCH_PACKAGE_EXPORT_BYPASS
      manual:
        - Review same-source public API use, exports and actual DI identity.
    relatedExamples: []
  - id: BE-IMPORTS-5
    title: What a transport or use case imports
    kind: mandatory
    hfsRules: [R26, R37]
    requirement: |-
      A use case imports plain application contracts and capability public APIs. A resolver or controller imports its
      transport DTOs plus the public use-case API. A bus handler additionally imports its message and the framework
      handler interface. No transport file imports another feature, and no application file imports a transport file.
    rationale: |-
      The import set of a unit shows its responsibility.
    cases: []
    verification:
      automated:
        - BE_APPLICATION_IMPORTS_TRANSPORT
        - BE_FEATURE_IMPORTS_FEATURE
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-6
    title: Forbidden
    kind: mandatory
    hfsRules: [R40, R43, R30]
    requirement: |-
      Source exports are named; the only default export is an actual Jest globalSetup or globalTeardown entry. Raw
      environment access belongs to `platform/config/env-source.ts`; all other source receives typed options. Raw cache
      tokens stay inside their declared cache owner. No `console.*` and no Nest `Logger` in application source; use the
      `Logger` port of `platform/logging`.
    rationale: |-
      One reader of the environment and one logger port keep configuration and diagnostics in one place.
    cases:
      - id: case-1
        when: Default export
        write: Named exports everywhere; the normalized Jest configuration proves a lifecycle exception, not its file name.
      - id: case-2
        when: process.env
        write: Only platform/config/env-source.ts reads it; a capability config parses the values that EnvSource passes.
      - id: case-3
        when: console.* or the Nest Logger
        write: Use `this.logger.info(OrderLog.Placed, { orderId })` on the injected Logger port.
    verification:
      automated:
        - BE_CONFIG_OWNER
        - BE_LOGGER_REQUIRED
        - NEST_NAMED_EXPORTS
        - NEST_ENV_ACCESS
        - NEST_CACHE_TOKEN_BOUNDARY
        - no-nest-logger
        - no-framework-logger
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-7
    title: Jest sees the same aliases
    kind: mandatory
    hfsRules: [R47]
    requirement: |-
      The jest preset mirrors the tsconfig path aliases in `moduleNameMapper`, and specs mock module paths through those
      aliases.
    rationale: |-
      A spec must resolve the same module the compiler resolves.
    cases:
      - id: case-1
        when: The preset
        write: 'moduleNameMapper: { "^@modules/(.*)$": "<rootDir>/src/modules/$1", "^@features/(.*)$": "<rootDir>/src/features/$1", "^@tests/(.*)$": "<rootDir>/src/tests/$1" }'
    verification:
      automated:
        - NEST_JEST_ALIAS_PARITY
        - BE_TEST_TOPOLOGY
      manual: []
    relatedExamples: []
