schema: starci/knowledge-source@1
id: be.index
title: Backend code patterns
purpose: |-
  Read knowledge/hfs/README.md (HFS) and docs/backend-source-pattern.md first. The standard defines ownership, the
  tier direction, one schema authority, default-deny, per-capability configuration and background work as a transport,
  then the concrete Nest and TypeScript code forms below. Each rule cites the HFS rule ids it implements (hfsRules) and
  the finding codes that judge it (verification.automated).
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - docs/backend-source-pattern.md
    - docs/portable-source-architecture.md
  limitations: |-
    Patterns place code and shape it. They do not approve business requirements or architecture, which belong to
    .starciwork, and static checks do not prove behavior. Inspect the selected repository's installed types, APIs, aliases
    and lint and test setup.
topics:
  - id: be.architecture-check
    title: Architecture check
    path: architecture-check.yaml
    decides: Tier direction matrix, acyclic owners, thin application composition roots, public owner surface, composed features
    rules: BE-ARCHITECTURE-1 … BE-ARCHITECTURE-5
  - id: be.folder
    title: Folder
    path: folder.yaml
    decides: Composition, feature application and transport, reusable capabilities, persistence, errors and test ownership
    rules: BE-FOLDER-1 … BE-FOLDER-7
  - id: be.naming
    title: Naming
    path: naming.yaml
    decides: Kebab file suffixes per slot, class role suffixes, error identity, enums, constants, methods, GraphQL fields
    rules: BE-NAMING-1 … BE-NAMING-8
  - id: be.function
    title: Function
    path: function.yaml
    decides: Direct use cases, transport adapters, transaction identity, concurrency invariants, static and dynamic module selection
    rules: BE-FUNCTION-1 … BE-FUNCTION-8
  - id: be.imports
    title: Imports
    path: imports.yaml
    decides: Aliases and public entries, layering direction, banned imports; layout is Prettier's
    rules: BE-IMPORTS-1 … BE-IMPORTS-7
  - id: be.comment
    title: Comment
    path: comment.yaml
    decides: Docblock after decorators, responsibility over name, enum member docs, prose comments, ASCII, no suppression
    rules: BE-COMMENT-1 … BE-COMMENT-7
  - id: be.typing
    title: Typing
    path: typing.yaml
    decides: Strict flags, plain application contracts, protocol DTOs, bounded input, no casts
    rules: BE-TYPING-1 … BE-TYPING-7
  - id: be.error
    title: Error
    path: error.yaml
    decides: DomainError, capability-owned errors, typed outcomes, the masking HTTP filter and GraphQL formatError
    rules: BE-ERROR-1 … BE-ERROR-7
  - id: be.test
    title: Test
    path: test.yaml
    decides: Unit and e2e placement, the jest topology, typed doubles, composition specs, what an assertion proves
    rules: BE-TEST-1 … BE-TEST-7
  - id: be.api-auth
    title: API authentication and input bounds
    path: api-auth.yaml
    decides: Default deny with APP_GUARD and public reasons, identity-owned verification, signed webhooks, typed operations, bounded input
    rules: BE-AUTH-1 … BE-AUTH-5
  - id: be.config
    title: Configuration and secrets
    path: config.yaml
    decides: One environment reader, config per capability, no default secrets or addresses, sealed secrets
    rules: BE-CONFIG-1 … BE-CONFIG-4
  - id: be.logging
    title: Logging
    path: logging.yaml
    decides: The mandatory Logger port, enum identities, structured payloads, handled catches
    rules: BE-LOGGING-1 … BE-LOGGING-3
  - id: be.persistence
    title: Persistence and migrations
    path: persistence.yaml
    decides: Migrations as the only schema authority, apps/migrate, persistence per capability, SQL in repositories, the outbox, no transaction spanning an external call, the named shared EntityManager
    rules: BE-PERSISTENCE-1 … BE-PERSISTENCE-7
  - id: be.background
    title: Background work
    path: background.yaml
    decides: Jobs and consumers as transports, worker apps, runners for every sweep, lease and fencing
    rules: BE-BACKGROUND-1 … BE-BACKGROUND-4
  - id: be.messages
    title: Messages catalog and locale
    path: messages.yaml
    decides: User-facing copy through a per-capability or per-feature vi/en catalog, the MessageCatalog port, request and non-request locale resolution
    rules: BE-MESSAGES-1, BE-MESSAGES-2
  - id: be.temporal
    title: The injected clock
    path: temporal.yaml
    decides: Clock as the only reader of the ambient clock, FakeClock in specs
    rules: BE-TEMPORAL-1
  - id: be.idempotency
    title: Inbox dedupe
    path: idempotency.yaml
    decides: A webhook or consumer claims the event through the shared inbox before it acts, consumer detection by shape not only filename, the inbox_claims table
    rules: BE-IDEMPOTENCY-1, BE-IDEMPOTENCY-2
  - id: be.resilience
    title: Retry through the shared helper
    path: resilience.yaml
    decides: A retried operation goes through platform/retry, never a hand-written loop
    rules: BE-RESILIENCE-1
