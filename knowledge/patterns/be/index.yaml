schema: starci/knowledge-source@1
id: be.index
title: Backend code patterns
purpose: Read docs/backend-source-pattern.md and docs/portable-source-architecture.md first. The adopted
  pattern defines ownership, explicit public APIs and concrete Nest/TypeScript code forms.
  folder/function/typing and architecture-check are current normative topics. Historical
  naming/import/comment/error/test cases are profile-specific examples subordinate to those revised
  boundaries. Source counts are not mandatory class/file inventories; current source evidence and behavior are
  checked separately.
appliesTo:
  - backend
family: be
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - the historical reference backend source
    - apps/core/src/app.module.ts for filter registration
    - tsconfig.json
    - jest.config.ts
    - eslint.config.mjs
  limitations: Historical reference-source observations preserved at the extraction commit; not a fresh audit of
    current repository conformance. Counts and file totals cited in rationale or cases are provenance from
    that extraction, not claims about today. Inspect the selected repository's actual types/APIs, aliases and
    lint/test setup; verify reference conformance within approved .starciwork scope. Target legacy code does
    not override the reference. Current business requirements and architecture belong to .starciwork; code
    patterns do not approve them.
topics:
  - id: be.architecture-check
    title: Architecture check
    path: architecture-check.yaml
    decides: Enforceable modules/features/apps dependency direction and thin application composition roots
    rules: BE-ARCHITECTURE-1 … BE-ARCHITECTURE-4
  - id: be.folder
    title: Folder
    path: folder.yaml
    decides: Composition, feature application/transport, reusable capabilities, persistence and test ownership
    rules: BE-FOLDER-1 … BE-FOLDER-7
  - id: be.naming
    title: Naming
    path: naming.yaml
    decides: Kebab file suffixes, class role suffixes, exception identity, enums, constants, methods
    rules: BE-NAMING-1 … BE-NAMING-8
  - id: be.function
    title: Function
    path: function.yaml
    decides: Direct use cases, optional meaningful bus handlers, transport adapters, transaction identity and
      static/dynamic module selection
    rules: BE-FUNCTION-1 … BE-FUNCTION-8
  - id: be.imports
    title: Imports
    path: imports.yaml
    decides: "@modules/@features/@tests aliases, brace style, order, layering direction, banned imports"
    rules: BE-IMPORTS-1 … BE-IMPORTS-7
  - id: be.comment
    title: Comment
    path: comment.yaml
    decides: Docblock after decorators, responsibility over name, enum member docs, // prose, ASCII and vn-ok
    rules: BE-COMMENT-1 … BE-COMMENT-7
  - id: be.typing
    title: Typing
    path: typing.yaml
    decides: Protocol DTOs, plain application contracts, explicit public types, validation and serialization
    rules: BE-TYPING-1 … BE-TYPING-7
  - id: be.error
    title: Error
    path: error.yaml
    decides: AbstractException shape, metadata, wrapping, the HTTP filter, the GraphQL interceptor and formatError
    rules: BE-ERROR-1 … BE-ERROR-7
  - id: be.test
    title: Test
    path: test.yaml
    decides: Colocated .spec.ts, lanes by suffix, direct construction with as never, what an assertion proves
    rules: BE-TEST-1 … BE-TEST-7
