schema: starci/knowledge-source@1
id: be.reactors
title: Reactors
purpose: |-
  Given a fact another context announced that this context must remember or act on, who listens? A reactor: a feature of kind
  `reactors` under `features/reactors/<reactor>/` that consumes events of another context and either keeps a local copy of what
  this context needs (the payment status inside order) or triggers a projection recompute. It is a thin door (R203 `BE_FEATURE_THIN`):
  it maps the delivery and dispatches one command, and the domain service of its own context does the work in one transaction.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (reactors keep local copies and trigger projections)
  limitations: |-
    Static checks prove the consumer shape, the kind boundary and composition. They do not prove that the local copy is replayable or
    that the event carries what the copy needs; the context rules and the test-world scenarios prove that.
rules:
  - id: BE-REACTORS-1
    title: A reactor consumes events and dispatches commands
    kind: mandatory
    hfsRules: [R153, R80, R203]
    requirement: |-
      A reactor holds `transport/message/<event>.consumer.ts` (implementing `EventConsumer<E>` with `readonly event = <Event>Event`),
      `<reactor>-message.module.ts` and an `application/` of plain CQRS. The consumer is thin (R203 `BE_FEATURE_THIN`):
      `handle(delivery)` maps the delivery and dispatches one command, forwarding
      `delivery.eventId`; the domain service the command reaches claims the event id in `platform/inbox` inside its own transaction,
      so a redelivery is a no-op.
    rationale: |-
      Delivery is at least once; the reactor stays a door and the decision stays in the domain.
    cases:
      - id: case-1
        when: order learns that a payment settled
        write: 'features/reactors/payment-status/transport/message/payment-settled.consumer.ts dispatches RecordPaymentStatusCommand with delivery.eventId.'
    verification:
      automated:
        - BE_EVENT_CONSUMER_SHAPE
        - BE_INBOX_DEDUPE_MISSING
        - BE_FEATURE_THIN
      manual: []
    relatedExamples: [event-bus]
  - id: BE-REACTORS-2
    title: A reactor never imports another kind and never reads another context
    kind: mandatory
    hfsRules: [R156, R26]
    requirement: |-
      A reactor imports only `modules/*`; it meets the api, saga and jobs kinds through events. It never reads another context's
      tables or imports its entities, services or SQL: what it needs from that context arrives in the event, or is read from a
      projection. An order service that needs the payment status either keeps a local copy fed by a reactor (passing) or reads a
      projection; joining or importing the payment tables is the violation.
    rationale: |-
      Contexts stay separately deployable only when cross-context data travels as events.
    cases:
      - id: case-1
        when: order shows the payment status
        write: 'passing: an order-owned payment_status copy written by the reactor command; violating: order SQL joining the payment table or importing PaymentService.'
    verification:
      automated:
        - BE_KIND_ISOLATION
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
      manual:
        - Confirm the event carries every field the copy needs.
    relatedExamples: [event-bus]
  - id: BE-REACTORS-3
    title: The local copy lives in the reactor's own context and is replayable
    kind: mandatory
    hfsRules: [R152, R80]
    requirement: |-
      The copy is a table of the context that owns the reactor, on that context's connection, written by a domain service of that
      context (one transaction touches one context's connection). The write is an idempotent upsert keyed by the aggregate id and
      guarded by the event version or id, so replaying the event stream rebuilds the same rows.
    rationale: |-
      A copy that cannot be rebuilt is a second source of truth.
    cases:
      - id: case-1
        when: The same payment.settled event is delivered twice
        write: 'The second delivery claims nothing in the inbox and the row is unchanged.'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_INBOX_DEDUPE_MISSING
      manual:
        - Confirm a replay from the start of the topic gives the same rows.
    relatedExamples: [event-bus]
  - id: BE-REACTORS-4
    title: A reactor is composed by a worker or api app
    kind: mandatory
    hfsRules: [R46, R31]
    requirement: |-
      The message module of a reactor is imported by the root module of an app of kind `worker` or `api`, and an e2e run boots that
      app's real AppModule and drives the event through the bus.
    rationale: |-
      A consumer that no app composes never runs.
    cases:
      - id: case-1
        when: A new reactor
        write: 'Import PaymentStatusMessageModule in the order app module in the same change and cover it in the order e2e.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
        - BE_FEATURE_NOT_COMPOSED
      manual: []
    relatedExamples: [event-bus]
files:
  - path: src/features/reactors/<reactor>/index.ts
    slot: be.feature.reactors
    template: reactors/reactor.index.ts.tpl
  - path: src/features/reactors/<reactor>/<reactor>.module.ts
    slot: be.feature.reactors
    template: reactors/reactor.module.ts.tpl
  - path: src/features/reactors/<reactor>/application/<action>.command.ts
    slot: be.feature.application
    template: reactors/application.command.ts.tpl
  - path: src/features/reactors/<reactor>/application/<action>.handler.ts
    slot: be.feature.application
    template: reactors/application.handler.ts.tpl
  - path: src/features/reactors/<reactor>/application/<action>.contracts.ts
    slot: be.feature.application
    template: reactors/application.contracts.ts.tpl
  - path: src/features/reactors/<reactor>/transport/message/<event>.consumer.ts
    slot: be.transport.message
    template: reactors/consumer.ts.tpl
    role: The consumer door of one event.
    rules: [BE_EVENT_CONSUMER_SHAPE]
  - path: src/features/reactors/<reactor>/transport/message/<reactor>-message.module.ts
    slot: be.transport.message
    template: reactors/message.module.ts.tpl
    role: Registers the consumers with the registry.
  - path: src/tests/e2e/<area>/<event>.e2e-spec.ts
    slot: be.tests.e2e
    role: The reactor's event flow through the bus, redelivery included.
