schema: starci/knowledge-source@1
id: be.feature.webhooks
title: Provider webhooks
purpose: |-
  Given a delivery a payment, identity or shipping provider POSTs to us, how is it received? A webhook is a feature KIND:
  `be/src/features/webhooks/<provider>/` holds one signed door that proves the delivery came from the provider (signature and
  replay window), then hands it to exactly ONE domain intake method. That method records the delivery (deduplicated through the
  inbox) and publishes the domain event with `eventBus.publish(event, tx)` inside its own transaction, because publishing is
  allowed only from `modules/domain`. The door writes nothing and decides nothing; everything after the proof is an event.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - knowledge/patterns/be/api-auth.yaml
    - knowledge/patterns/be/idempotency.yaml
    - owner decision 2026-10-02 (feature kinds: webhooks, realtime, reactors, saga, jobs, cli; no kind imports another)
  limitations: |-
    Static checks prove the door's shape, that the proof is its first statement and that the only thing it can call after it is
    one domain service method. They do not prove the HMAC scheme matches the provider's documentation, that the replay window
    is the right length or that the intake is idempotent; the provider fake of the test world and the three
    `webhooks/*` scenarios prove those against the real stack.
rules:
  - id: BE-WEBHOOK-1
    title: A webhook is a kind folder with one door, its module and its own spec
    kind: mandatory
    hfsRules: [R01, R02, R47]
    requirement: |-
      A provider webhook lives in `be/src/features/webhooks/<provider>/` (slot `be.feature.webhooks`), enabled by declaring the pattern
      `webhooks` in `hfs.json` `sides.be.patterns`. The folder holds `index.ts` (the module class an app composes), `transport/http/<provider>-http.module.ts`, `transport/http/<provider>.webhook.ts` (the
      door), `<provider>.webhook.spec.ts` (its spec — the kind's door has no service of its own, so the door carries it) and an optional `transport/http/dto/` of typed
      payload classes (`<event>.request.ts`). Nothing else exists there: no application layer, no handler, no consumer. The kind
      imports only `modules/*`, never another kind, and only an api-kind app composes `<provider>-http.module.ts`.
    rationale: |-
      A webhook is an external caller we do not control, so its door is kept apart from the api features a client uses. One place
      and one shape let a reader find every public signed door and its proof in one folder.
    cases:
      - id: case-1
        when: A new provider (a payment gateway)
        write: 'features/webhooks/payment-gateway/ with index.ts, transport/http/payment-gateway-http.module.ts, transport/http/payment-gateway.webhook.ts, transport/http/payment-gateway.webhook.spec.ts and transport/http/dto/payment-notification.request.ts.'
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_MIN_INSTANCES
        - HFS_REQUIRED_FILE_MISSING
        - HFS_ROOT_ENTRY_MISSING
        - HFS_APPS_REQUIRED
        - HFS_APP_LAYOUT_INVALID
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
        - BE_TEST_TOPOLOGY
        - BE_CONTRACT_UNGUARDED
      manual:
        - Confirm the provider endpoint is one door and that a second endpoint of the same provider is a second door only when it has a different proof.
    relatedExamples: [webhooks]
  - id: BE-WEBHOOK-2
    title: The door verifies first, then makes one domain call
    kind: mandatory
    hfsRules: [R182, R183, R41, R42, R203]
    requirement: |-
      `<provider>.webhook.ts` is one `@Controller` with one `@Post` handler declared
      `@Public({ reason: PublicReason.SignedWebhook })`, thin (R203 `BE_FEATURE_THIN`). The handler's FIRST statement is the unconditional
      `this.<signature>.verify({ provider, rawBody, signature, timestamp })` of the `WebhookSignatureService` of `platform/http-security`
      (HMAC-SHA256 over `<timestamp>.<raw body>` with the provider's secret, a constant-time comparison and a replay window on the signed timestamp; it throws before anything else runs). The provider key and its secret and tolerance are options of `platform/http-security` (`options.webhooks[provider]`). The
      second and last call is one method of a domain service, the intake. The door injects only that service and the signature
      service (injected with `@InjectWebhookSignature()`), holds no branch, loop or `try`, calls nothing else (no parsing, mapping or publishing) and returns nothing: the
      provider gets its status code and an empty body. `@RateLimit(RateTier.Strict)` is required by the signed-webhook reason.
    rationale: |-
      The signature is the authentication of a public door. Making the proof the first statement removes every path to the intake
      that skips it, and a door with one call and no decision has nothing left to test except the proof and the hand-over.
    cases:
      - id: case-1
        when: The door of a payment gateway
        write: |-
          @Controller("webhooks/payment-gateway")
          export class PaymentGatewayWebhook {
              constructor(
                  @InjectWebhookSignature() private readonly signature: WebhookSignatureService,
                  private readonly payments: PaymentService,
              ) {}

              @Post()
              @HttpCode(HttpStatus.NO_CONTENT)
              @Public({ reason: PublicReason.SignedWebhook })
              @RateLimit(RateTier.Strict)
              async receive(@Req() request: RawBodyRequest<Request>, @Headers("x-signature") signature: string | undefined, @Headers("x-timestamp") timestamp: string | undefined, @Body() body: PaymentNotificationRequest): Promise<void> {
                  this.signature.verify({ provider: "payment-gateway", rawBody: request.rawBody, signature, timestamp })
                  await this.payments.acceptNotification(body)
              }
          }
      - id: case-2
        when: A delivery whose raw body must be hashed
        write: 'enable the raw body for the app (`NestFactory.create(..., { rawBody: true })` in the api app) and read `request.rawBody`; never hash a re-serialized `body`.'
    verification:
      automated:
        - BE_WEBHOOK_SHAPE
        - BE_WEBHOOK_UNVERIFIED
        - BE_DEFAULT_DENY
        - BE_INPUT_BOUNDED
        - BE_FEATURE_THIN
      manual:
        - Review that the raw body, not a re-serialized one, is verified, and that the replay window matches the provider's tolerance.
    relatedExamples: [webhooks]
  - id: BE-WEBHOOK-3
    title: The intake publishes the event inside its own transaction
    kind: mandatory
    hfsRules: [R80, R152, R151]
    requirement: |-
      The domain intake method (`PaymentService.acceptNotification`) is the delivery method of R80: its first awaited expression
      claims `(source, eventId)` in the `Inbox` and it returns when the claim answers false, so a redelivery is a no-op. It then
      records the delivery and calls `this.eventBus.publish(PaymentConfirmedEvent.create({...}), manager)` inside the same
      transaction (`entityManager.transaction`). The events are typed classes in `modules/events/<service>/<event>.event.ts` that
      equal their `be/contracts/<service>/events.json` entry (`payment.confirmed`, `payment.failed`). The webhook door never
      imports `modules/events` or the event bus.
    rationale: |-
      Recording the delivery and writing the outbox row in one transaction means a crash cannot lose or duplicate the event, and
      keeping the publish in `modules/domain` keeps one place that owns the transaction boundary.
    cases:
      - id: case-1
        when: A confirmed payment arrives
        write: 'acceptNotification claims the inbox row, updates the payment row and publishes PaymentConfirmedEvent in one transaction; a second delivery of the same eventId changes nothing.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
        - BE_OUTBOX_WRITE_TX
        - BE_EVENT_CLASS_CONTRACT
      manual:
        - Confirm each provider event kind maps to exactly one published event and that an unknown kind is acknowledged and ignored, not published.
    relatedExamples: [webhooks]
  - id: BE-WEBHOOK-4
    title: Three behaviours are proven on the test world
    kind: mandatory
    hfsRules: [R155]
    requirement: |-
      Declaring the pattern `webhooks` requires e2e or integration tests titled `webhooks/<scenario>: ...` for each scenario
      `bad-signature-is-refused` (a tampered body is refused and nothing is published), `replay-is-refused` (a stale timestamp is
      refused and nothing is published) and `accepted-delivery-publishes-once` (a valid delivery publishes the event once and a
      redelivery publishes nothing more). The provider is the network-edge fake of the test world (`world.fake.<provider>`), which
      signs with the test secret; a real provider is never called. The unit spec `<provider>.webhook.spec.ts` covers the door
      itself with the Nest testing module, a real `WebhookSignatureService` configured with a test secret and a double of the
      domain service.
    rationale: |-
      The door has no logic of its own, so the risk is in the wiring: the raw body, the headers, the real signature scheme and the
      transaction behind the intake. Only a signed request through the real app proves it.
    cases:
      - id: case-1
        when: The e2e of the payment gateway
        write: 'e2e/payment/payment-gateway-webhook.e2e-spec.ts has `it("webhooks/bad-signature-is-refused: ...")`, `it("webhooks/replay-is-refused: ...")` and `it("webhooks/accepted-delivery-publishes-once: ...")`.'
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual:
        - Confirm the fake signs exactly as the provider documents and that a contract spec guards its payload fixtures.
    relatedExamples: [webhooks]
files:
  - path: src/features/webhooks/<provider>/index.ts
    slot: be.feature.webhooks
    template: webhooks/webhook.index.ts.tpl
    role: The public surface of the kind folder, the module class an api-kind app composes.
  - path: src/features/webhooks/<provider>/transport/http/<provider>-http.module.ts
    slot: be.feature.webhooks.http
    template: webhooks/webhook.http.module.ts.tpl
    role: Nest module of the door, composed only by an api-kind app.
  - path: src/features/webhooks/<provider>/transport/http/<provider>.webhook.ts
    slot: be.feature.webhooks.http
    template: webhooks/webhook.door.ts.tpl
    role: The signed door, one controller with one POST handler.
    rules: [BE_WEBHOOK_SHAPE, BE_WEBHOOK_UNVERIFIED, BE_DEFAULT_DENY, BE_INPUT_BOUNDED]
    spec: src/features/webhooks/<provider>/transport/http/<provider>.webhook.spec.ts
  - path: src/features/webhooks/<provider>/transport/http/<provider>.webhook.spec.ts
    slot: be.feature.webhooks.http
    template: webhooks/webhook.door.spec.ts.tpl
    role: Unit spec of the door beside it.
  - path: src/features/webhooks/<provider>/transport/http/dto/<event>.request.ts
    slot: be.feature.webhooks.dto
    role: The typed, bounded provider payload.
    rules: [BE_INPUT_BOUNDED]
    template: webhooks/webhook.request.ts.tpl
  - path: src/modules/platform/http-security/webhook-signature.service.ts
    slot: be.platform
    role: WebhookSignatureService, the one owner of the signature and replay proof.
    spec: src/modules/platform/http-security/webhook-signature.service.spec.ts
    optional: true
  - path: src/modules/domain/<capability>/<capability>.service.ts
    slot: be.domain
    role: The intake method, which claims the inbox and publishes the event in its transaction.
    rules: [BE_INBOX_DEDUPE_MISSING, BE_OUTBOX_WRITE_TX]
    optional: true
  - path: src/modules/events/<service>/<event>.event.ts
    slot: be.events
    role: The typed event the intake publishes.
    rules: [BE_EVENT_CLASS_CONTRACT]
    optional: true
  - path: src/tests/e2e/<area>/<provider>-webhook.e2e-spec.ts
    slot: be.tests.e2e
    role: "Titles webhooks/<scenario>: ... prove the pattern against the provider fake."
    spec: webhooks/bad-signature-is-refused, webhooks/replay-is-refused, webhooks/accepted-delivery-publishes-once
    rules: [BE_PATTERN_SPEC_MISSING]
    optional: true
