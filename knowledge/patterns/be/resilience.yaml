schema: starci/knowledge-source@1
id: be.resilience
title: Retry through the shared helper
purpose: |-
  Given an operation that may fail transiently - a flaky dependency, a lock contention error, a rate limit - how does
  code retry it? Through one shared, bounded, jittered, abortable helper, never a hand-written loop at the call
  site.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - packages/eslint/be/resilience.mjs
    - knowledge/patterns/be/persistence.yaml
  limitations: |-
    Static checks find a loop that both catches an error and waits before repeating and refuse it. They cannot judge
    whether an operation is safe to retry (idempotent) at all; that is a review question the SRS and the operation's
    own contract answer.
rules:
  - id: BE-RESILIENCE-1
    title: A retried operation goes through platform/retry
    kind: mandatory
    hfsRules: [R81]
    requirement: |-
      Code that must retry a transient failure calls `retry(fn, options)` from `platform/retry`
      (`retry<T>(fn: (attempt: number) => Promise<T>, options: { maxAttempts: number; baseDelayMs: number;
      maxDelayMs: number; signal?: AbortSignal }): Promise<T>` - bounded attempts, full-jitter exponential backoff
      capped at `maxDelayMs`, rejects on abort, rethrows the last error once attempts are exhausted) instead of a
      hand-written `for`/`while`/`do...while` loop that catches an error and waits before trying again. The retried
      operation is extracted into an `async (attempt) => { ... }` callback; `maxAttempts`, `baseDelayMs` and
      `maxDelayMs` are named constants, not inline magic numbers. A polling loop with no `catch` (waiting for a
      state to change) is not a retry and is left alone.
    rationale: |-
      A hand-rolled retry loop has no attempt bound visible at the call site, no jitter (so many callers retry in
      lockstep and hit the dependency in synchronized waves), and no way to honor an abort signal from a caller that
      gave up. One helper gives every retry the same bounded, jittered, abortable shape and puts the backoff math in
      one place to get right once.
    cases:
      - id: case-1
        when: A flaky outbound call
        write: 'const RETRY_MAX_ATTEMPTS = 4; const RETRY_BASE_DELAY_MS = 200; const RETRY_MAX_DELAY_MS = 5_000; return retry((attempt) => this.client.charge(input), { maxAttempts: RETRY_MAX_ATTEMPTS, baseDelayMs: RETRY_BASE_DELAY_MS, maxDelayMs: RETRY_MAX_DELAY_MS, signal })'
      - id: case-2
        when: A loop with no attempt bound in the original code
        write: 'a `while (true)` retry loop becomes `retry(fn, { maxAttempts: 5, ... })`; the report names 5 as a value the pattern chose, not one the original code stated.'
      - id: case-3
        when: A distinct give-up branch
        write: 'if the original loop had a separate "give up after N" branch, that branch stays after the retry(...) call site, in a catch, instead of being folded into the loop.'
      - id: case-4
        when: A polling wait is not a retry
        write: 'while (!(await isReady())) { await sleep(POLL_INTERVAL_MS) } catches nothing and is left alone; it is waiting for a state, not retrying a failure.'
    verification:
      automated:
        - BE_HAND_ROLLED_RETRY
      manual:
        - Confirm the retried operation is actually safe to run more than once (idempotent, or itself claims through the inbox) before adding a retry around it.
    relatedExamples: []
