schema: starci/knowledge-source@1
id: be.typing
title: Backend typing
purpose: Apply the adopted responsibility pattern. Read docs/backend-source-pattern.md for the coherent
  layout, code forms, source critique and verification limits.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-16
  sources:
    - docs/backend-source-pattern.md
    - starci-academy-backend@1731b15ba4ed526477e3c572b9d82c31ab64f1d5/src/features/api/core/graphql/mutations/courses/add-to-cart/
    - starci-academy-backend@1731b15ba4ed526477e3c572b9d82c31ab64f1d5/src/modules/databases/postgresql/primary/primary.module-definition.ts
    - https://docs.nestjs.com/fundamentals/dynamic-modules
    - https://docs.nestjs.com/techniques/validation
  limitations: Adopted Nest/TypeScript profile, not universal framework law. Historical Academy examples contain
    debt and do not override these revised rules. Existing profile-specific lint/source needs an authorized
    coherent update; runtime installation neither modifies product source nor refreshes proof. Static
    checks do not establish behavior.
rules:
  - id: BE-TYPING-1
    title: Types express actual contracts
    kind: mandatory
    requirement: Use interface for extensible object contracts and type for unions, intersections and aliases;
      follow the selected profile for equivalent object syntax. TypeScript types do not validate untrusted
      runtime data. Contract ownership matters more than interface-versus-type census.
    rationale: Compile-time shape and runtime validation are distinct.
    verification:
      automated: []
      manual:
        - Validate external payloads before using narrowed values.
    relatedExamples: []
  - id: BE-TYPING-2
    title: Name public inputs and outputs
    kind: mandatory
    requirement: Public use-case and capability APIs have explicit input/output contracts; object inputs use a
      named contract, and simple primitives can be positional. Do not return ORM entities or SDK response
      objects as the public application contract. Internal inferred locals need no ceremonial interface.
    rationale: A stable public API makes boundary changes visible.
    verification:
      automated: []
      manual:
        - Review contract semantics and serialization compatibility.
    relatedExamples: []
  - id: BE-TYPING-3
    title: Mutability follows lifecycle
    kind: mandatory
    requirement: Injected dependencies and message payloads are readonly by default. Deserialization DTO classes
      may be mutable where installed runtime metadata/transform tooling requires it; decoration alone is not a
      universal reason to mandate mutability. Never mutate a received command to store execution progress.
    rationale: Execution state and request data have separate owners.
    verification:
      automated: []
      manual:
        - Check runtime DTO construction and mutation behavior.
    relatedExamples: []
  - id: BE-TYPING-4
    title: Enumerate stable domain values deliberately
    kind: mandatory
    requirement: Use explicit serialized values for public enums or discriminated unions. Avoid const enum across
      package/runtime boundaries. Domain values stay with their domain owner; database-only values stay with
      persistence. GraphQL exposure is an adapter concern.
    rationale: Serialization stability and ownership outlast naming conventions.
    verification:
      automated: []
      manual:
        - Verify client/database contract compatibility.
    relatedExamples: []
  - id: BE-TYPING-5
    title: Unknown inputs require narrowing
    kind: mandatory
    requirement: Use unknown for untrusted payloads/errors, then parse or narrow. Do not obtain conformance with
      any, double casts or TypeScript suppressions. Test doubles may use narrow documented harness conversions
      without pretending they validate production behavior.
    rationale: Casts cannot establish the trust or correctness of external data.
    verification:
      automated:
        - "@typescript-eslint/no-explicit-any"
      manual:
        - Inspect suppression changes and unvalidated data flow.
    relatedExamples: []
  - id: BE-TYPING-6
    title: Generics preserve meaning
    kind: mandatory
    requirement: Use descriptive generic parameters only when the abstraction supports more than one meaningful
      type. Do not create an all-purpose ExecuteParams wrapper carrying unrelated entities, tokens and context
      fields into every feature.
    rationale: An oversized generic envelope leaks dependencies and authority.
    verification:
      automated: []
      manual:
        - Review the smallest data and authority each operation needs.
    relatedExamples: []
  - id: BE-TYPING-7
    title: DTOs are owned protocol representations
    kind: mandatory
    requirement: Put runtime GraphQL/HTTP DTO classes under the owning feature transport. Apply the installed
      semantic validation rules; GraphQL ID/string shape alone is insufficient. Keep plain application
      contracts under application/. Map output deliberately; nullability and error representation follow the
      accepted API contract, not a universal response wrapper. Name actual entity tables and review
      query/loading behavior within persistence.
    rationale: Protocol, application and persistence contracts evolve at different boundaries.
    verification:
      automated: []
      manual:
        - Test validation, unknown/nested input handling and safe output fields.
    relatedExamples: []
