schema: starci/knowledge-source@1
id: be.feature.realtime
title: Realtime channels
purpose: |-
  Given a state change a connected client must see without asking, how is it pushed? Realtime is a feature KIND:
  `be/src/features/realtime/<channel>/` holds one door per channel, a socket gateway (`<channel>.gateway.ts`) or a GraphQL
  subscription (`<x>.subscription.ts`), that READS and PUSHES only. It never writes. The push is fed by a reactor: an event
  consumer in `features/reactors/` receives the domain event and publishes to a topic of the `RealtimeHub` of `platform/realtime`;
  the door only subscribes the client to a topic of that hub, scoped to the client's principal.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - knowledge/patterns/be/transport.yaml
    - knowledge/patterns/be/api-auth.yaml
    - owner decision 2026-10-02 (feature kinds: webhooks, realtime, reactors, saga, jobs, cli; no kind imports another)
  limitations: |-
    Static checks prove the door's role, that the hub is the only thing injected and that a subscribed topic is built from the
    principal. They do not prove the topic naming is collision free across channels, that an initial snapshot is consistent with
    the stream, or the behaviour of the socket under reconnects; the three `realtime/*` scenarios prove delivery, isolation and
    cleanup on the real stack.
rules:
  - id: BE-REALTIME-1
    title: A channel is a kind folder with one door, its module and its own spec
    kind: mandatory
    hfsRules: [R01, R02, R47, R161]
    requirement: |-
      A push channel lives in `be/src/features/realtime/<channel>/` (slot `be.feature.realtime`), enabled by declaring the pattern
      `realtime` in `hfs.json` `sides.be.patterns`. The folder holds `index.ts` (the module class an app composes), `<channel>-realtime.module.ts`, ONE door and its spec: either
      `<channel>.gateway.ts` (one `@WebSocketGateway` class whose handlers are `@SubscribeMessage`) with
      `<channel>.gateway.spec.ts`, or `<x>.subscription.ts` (one `@Resolver` class whose operations are `@Subscription`) with
      `<x>.subscription.spec.ts`, plus optional `dto/` (`<name>.{input,type,args}.ts`). A door carries no query, mutation, field
      resolver or REST route. The kind imports only `modules/*`, never another kind, and only an api-kind app composes its module.
    rationale: |-
      One file per door keeps a protocol's machinery in one place, and keeping queries and mutations out guarantees that what a
      client can do through a realtime door is listen.
    cases:
      - id: case-1
        when: A GraphQL subscription of order status
        write: 'features/realtime/order-status/index.ts, order-status-realtime.module.ts, order-status.subscription.ts and order-status.subscription.spec.ts.'
      - id: case-2
        when: A socket gateway
        write: 'features/realtime/chat/chat-realtime.module.ts, chat.gateway.ts and chat.gateway.spec.ts.'
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_SLOT_NOT_ENABLED
        - BE_REALTIME_SHAPE
        - BE_TEST_TOPOLOGY
      manual:
        - Confirm a query or mutation an old subscription door carried now lives in an api feature.
    relatedExamples: [realtime]
  - id: BE-REALTIME-2
    title: A realtime door reads and pushes, it never writes
    kind: mandatory
    hfsRules: [R162]
    requirement: |-
      The only value a realtime door injects is the `RealtimeHub` of `platform/realtime` (`subscribe(topic)` returns an async
      iterable of frames, `publish(topic, frame)` pushes one; a topic is a typed `RealtimeTopic<T>` built by the owning domain
      contract, never a string written in a door). No `EntityManager`, `CommandBus`, `QueryBus`, event bus, queue or
      service of `modules/domain` is injected: a domain service may write, so it is not provably read-only. The data a client
      needs is pushed by a reactor; the socket library and the pub/sub engine (`socket.io`, `graphql-subscriptions`, `graphql-ws`)
      are imported only by `platform/realtime`.
    rationale: |-
      A door that can only touch the hub cannot change business state, so the biggest risk of a long-lived unauthenticated-looking
      connection, a write through it, is removed by type.
    cases:
      - id: case-1
        when: A subscription that pushes order status changes
        write: |-
          @Resolver()
          export class OrderStatusSubscription {
              constructor(private readonly hub: RealtimeHub) {}

              @Subscription(() => OrderStatusChangedType)
              orderStatusChanged(@CurrentPrincipal() principal: Principal, @Args("orderId") orderId: string): AsyncIterable<OrderStatusChangedType> {
                  return this.hub.subscribe(orderStatusTopic(principal.id, orderId))
              }
          }
    verification:
      automated:
        - BE_REALTIME_WRITES
        - BE_INFRA_OWNER
      manual:
        - Confirm the frame type carries only what the principal may see.
    relatedExamples: [realtime]
  - id: BE-REALTIME-3
    title: The topic is built from the principal
    kind: mandatory
    hfsRules: [R163, R41]
    requirement: |-
      Every `@SubscribeMessage` and `@Subscription` handler takes `@CurrentPrincipal()` of `domain/identity` and builds the topic it
      passes to `hub.subscribe` from the principal's id (plus a client-supplied id only inside that prefix) with the topic
      builder of the owning domain contract, so one client cannot
      listen to another's channel. The reactor that pushes uses the same topic builder from the owning domain contract, never a
      hand-written string. The default-deny guards apply to the door like to any other.
    rationale: |-
      A topic taken from client input alone is an authorization hole: knowing an order id would be enough to watch it.
    cases:
      - id: case-1
        when: Subscribing to one order's status
        write: 'hub.subscribe(orderStatusTopic(principal.id, orderId)); the reactor publishes to orderStatusTopic(buyerId, orderId) of the order owner, so a different principal receives nothing.'
    verification:
      automated:
        - BE_REALTIME_TOPIC_SCOPE
        - BE_DEFAULT_DENY
      manual:
        - Review that the topic builder shared with the reactor lives in the domain contract and is used by both sides.
    relatedExamples: [realtime]
  - id: BE-REALTIME-4
    title: Three behaviours are proven on the test world
    kind: mandatory
    hfsRules: [R135]
    requirement: |-
      Declaring the pattern `realtime` requires e2e or integration tests titled `realtime/<scenario>: ...` for each scenario
      `subscriber-receives-push` (a connected client receives the frame a reactor pushes after the domain event),
      `foreign-topic-is-isolated` (another principal subscribed to the same channel receives nothing) and
      `disconnect-releases-subscription` (after the client disconnects the hub holds no subscription for it). The client is a real
      socket or GraphQL-over-websocket client of the test world. The unit spec of the door covers its wiring with the Nest testing
      module and a recording hub double.
    rationale: |-
      The door has no logic, so the risk is delivery, isolation and leaks on a real connection, which only a client against the
      real app shows.
    cases:
      - id: case-1
        when: The e2e of the order status channel
        write: 'e2e/order/order-status-push.e2e-spec.ts has `it("realtime/subscriber-receives-push: ...")`, `it("realtime/foreign-topic-is-isolated: ...")` and `it("realtime/disconnect-releases-subscription: ...")`.'
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual:
        - Confirm the e2e client waits with the world's waitFor and never sleeps.
    relatedExamples: [realtime]
files:
  - path: src/features/realtime/<channel>/index.ts
    slot: be.feature.realtime
    role: The public surface of the kind folder, the module class an api-kind app composes.
  - path: src/features/realtime/<channel>/<channel>-realtime.module.ts
    slot: be.feature.realtime
    role: Nest module of the door, composed only by an api-kind app.
  - path: src/features/realtime/<channel>/<channel>.gateway.ts
    slot: be.feature.realtime
    role: A socket door (one WebSocketGateway class); exactly one of gateway or subscription per channel file name.
    rules: [BE_REALTIME_SHAPE, BE_REALTIME_WRITES, BE_REALTIME_TOPIC_SCOPE]
    spec: src/features/realtime/<channel>/<channel>.gateway.spec.ts
    optional: true
  - path: src/features/realtime/<channel>/<channel>.gateway.spec.ts
    slot: be.feature.realtime
    role: Unit spec of the gateway beside it.
    optional: true
  - path: src/features/realtime/<channel>/<x>.subscription.ts
    slot: be.feature.realtime
    role: A GraphQL subscription door (one Resolver class).
    rules: [BE_REALTIME_SHAPE, BE_REALTIME_WRITES, BE_REALTIME_TOPIC_SCOPE]
    spec: src/features/realtime/<channel>/<x>.subscription.spec.ts
    optional: true
  - path: src/features/realtime/<channel>/<x>.subscription.spec.ts
    slot: be.feature.realtime
    role: Unit spec of the subscription beside it.
    optional: true
  - path: src/features/realtime/<channel>/dto/<name>.type.ts
    slot: be.feature.realtime.dto
    role: The typed frame or the typed arguments of the door.
    rules: [BE_INPUT_BOUNDED]
    optional: true
  - path: src/modules/platform/realtime/realtime.hub.ts
    slot: be.platform
    role: RealtimeHub, the one owner of the socket and subscription engine (publish and subscribe).
    spec: src/modules/platform/realtime/realtime.service.spec.ts
  - path: src/features/reactors/<name>/transport/message/<event>.consumer.ts
    slot: be.transport.message
    role: The reactor consumer that receives the domain event and pushes the frame through the hub.
  - path: src/tests/e2e/<area>/<channel>-push.e2e-spec.ts
    slot: be.tests.e2e
    role: "Titles realtime/<scenario>: ... prove the pattern against a real client."
    spec: realtime/subscriber-receives-push, realtime/foreign-topic-is-isolated, realtime/disconnect-releases-subscription
    rules: [BE_PATTERN_SPEC_MISSING]
