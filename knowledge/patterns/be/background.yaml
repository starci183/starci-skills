schema: starci/knowledge-source@1
id: be.background
title: Backend background work
purpose: |-
  Given work that runs without a request (a schedule, a sweep, event or queue consumption, retry), where does it live and which
  process runs it? Background work is a transport that dispatches one command, composed by the api app that owns it or by a worker app scaled apart. Events travel
  through event-bus.yaml and jobs through queues.yaml; this topic keeps the rule that a runner must exist.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - docs/backend-source-pattern.md
    - https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html
  limitations: |-
    Static checks prove that a background method has a runner and that an app composes it. They do not prove lease
    correctness, fencing at the remote resource or crash recovery; those need failure-injection tests against the actual
    authority.
rules:
  - id: BE-BACKGROUND-1
    title: Background work is a transport
    kind: mandatory
    hfsRules: [R46, R88, R90]
    requirement: |-
      Work that runs without a request is a transport that dispatches one command exactly as a resolver does and holds no
      business decision. An event is consumed by `transport/message/<event>.consumer.ts` (knowledge/patterns/be/event-bus.yaml). A
      job that was enqueued or scheduled is processed by a processor (knowledge/patterns/be/queues.yaml for the producer and the
      BullMQ job schedulers). `@Cron`, `@Interval`, `@Timeout`, `setInterval` for work, `new Worker(`, `@Processor`, `WorkerHost`, `kafkajs`
      and Nest's in-process event bus appear nowhere outside `platform/{event-bus,queue}`.
    rationale: |-
      One shape for every entry protocol keeps handlers reusable and lets the app choose which protocols it serves.
    cases:
      - id: case-1
        when: A recurring task
        write: 'a BullMQ job scheduler declared in modules/queues/<queue>/<queue>.queue.ts; its processor dispatches the command (queues.yaml).'
      - id: case-2
        when: A queue consumer
        write: 'transport/message/payment-settled.consumer.ts maps the payload to SettlePaymentRequest and dispatches SettlePaymentCommand after claiming the event in the inbox.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
        - BE_INFRA_OWNER
        - BE_TRANSPORT_SHAPE
      manual: []
    relatedExamples: []
  - id: BE-BACKGROUND-2
    title: The owning api app runs it; a worker app only scales it apart
    kind: mandatory
    hfsRules: [R46, R31]
    requirement: |-
      An app of kind `worker` or `api` composes the message transport and the job processors of its own service (a separate worker app
      is opt-in, for a service that must scale its consumers on their own). Every message transport and processor is composed by at
      least one app, and an e2e run boots that app's real AppModule. A schedule is a BullMQ job scheduler, so it runs once for the
      fleet whatever the replica count.
    rationale: |-
      A job or consumer that no process composes never runs.
    cases:
      - id: case-1
        when: A service app
        write: 'be/apps/order/src/app.module.ts imports PaymentStatusMessageModule and SendReceiptModule next to its api transport modules.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
        - BE_FEATURE_NOT_COMPOSED
        - BE_APP_COMPOSITION_ONLY
      manual: []
    relatedExamples: []
  - id: BE-BACKGROUND-3
    title: Every sweep has a runner
    kind: mandatory
    hfsRules: [R46]
    requirement: |-
      A method named `sweep*`, `deliver*`, `reconcile*`, `retry*` or `relay*` must be reachable from a consumer or a processor that an
      app composes. A method with no runner is a finding even when it is tested, because durable recovery that nothing invokes
      does not recover anything.
    rationale: |-
      A built and unit-tested sweep or reconcile that nothing schedules gives the false impression of durable recovery.
    cases:
      - id: case-1
        when: A new sweep
        write: 'add a scheduler to the queue and a processor that dispatches the sweep command, and compose the processor in the owning api app (or the worker app) in the same change.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
      manual:
        - Confirm the schedule and the overlap policy fit the recovery contract.
    relatedExamples: []
  - id: BE-BACKGROUND-4
    title: Producers publish through the event bus or a typed queue producer
    kind: mandatory
    hfsRules: [R82, R90, R137]
    requirement: |-
      A producer publishes an event with `eventBus.publish(event, tx)` or enqueues a job with a typed queue producer
      (`enqueueX(payload, tx)`), only from a domain service and only inside its transaction. See event-bus.yaml and queues.yaml.
      `Queue`, `Worker`, `kafkajs` and `KafkaClientService` are used only inside `platform/queue` and `platform/event-bus`.
    rationale: |-
      The outbox row commits with the write, so the publish is atomic with it.
    cases:
      - id: case-1
        when: A publish atomic with a write
        write: 'await this.entityManager.transaction(async (manager) => { await manager.save(OrderEntity, order); await this.eventBus.publish(OrderPlacedEvent.create({ orderId: order.id }), manager) })'
    verification:
      automated:
        - BE_INFRA_OWNER
        - BE_OUTBOX_WRITE_TX
        - BE_TRANSACTION_EXTERNAL_CALL
        - BE_RAW_INJECT
      manual: []
    relatedExamples: []
