schema: starci/knowledge-source@1
id: be.background
title: Backend background work
purpose: |-
  Given work that runs without a request (a schedule, a sweep, event or queue consumption, retry), where does it live and which
  process runs it? Background work is a thin transport (R203 `BE_FEATURE_THIN`) that dispatches one command, composed by the api app that owns it or by a worker app scaled apart. Events travel
  through event-bus.yaml and jobs through queues.yaml; this topic keeps the rule that a runner must exist.
appliesTo:
  - backend
family: be
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [be.app.worker, be.transport.message, be.feature.jobs]
provenance:
  reviewedAt: 2026-10-14
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - owner-approved Swarm canon 2026-10-14 (application-owned schedules, no host crontab)
    - docs/architecture.md
    - https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html
  limitations: |-
    Static checks prove that a background method has a runner and that an app composes it. They do not prove lease
    correctness, fencing at the remote resource or crash recovery; those need failure-injection tests against the actual
    authority.
rules:
  - id: BE-BACKGROUND-1
    title: The owning api app runs it; a worker app only scales it apart
    kind: mandatory
    hfsRules: [R46, R31, R32]
    requirement: |-
      An app of kind `worker` or `api` composes the message transport and the job processors of its own service (a separate worker app
      is opt-in, for a service that must scale its consumers on their own). Every message transport and processor is composed by at
      least one app, and an e2e run boots that app's real AppModule. A schedule is a BullMQ job scheduler, so it runs once per
      deployment whatever the replica count.
    rationale: |-
      A job or consumer that no process composes never runs.
    cases:
      - id: case-1
        when: A service app
        write: 'be/apps/order/src/compose/background.ts lists OrderPaymentStatusMessageModule and SendReceiptQueueModule (with the queue and its schedulers), and the root app.module.ts spreads that group next to its api transport modules.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
        - BE_FEATURE_NOT_COMPOSED
        - BE_APP_COMPOSITION_ONLY
        - BE_APP_BUSINESS_ROLE
      manual: []
    relatedExamples: []
  - id: BE-BACKGROUND-2
    title: Every background task has a runner
    kind: mandatory
    hfsRules: [R46]
    requirement: |-
      A job processor, scheduler, saga or event handler (including a consumer), and methods called from it directly or
      transitively, are background work. Its runner must be composed by an app of kind `worker` or `api`. Resolvers and
      controllers are never background; method names such as `retry*` or `replay*` alone do not establish background work.
      A background method with no runner is a finding even when it is tested, because durable recovery that nothing invokes
      does not recover anything.
    rationale: |-
      A built and unit-tested sweep or reconcile that nothing schedules gives the false impression of durable recovery.
    cases:
      - id: case-1
        when: A new sweep
        write: 'add a scheduler to the queue and a processor that dispatches the sweep command, and compose the processor in the owning api app (or the worker app) in the same change.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
      manual:
        - Confirm the schedule and the overlap policy fit the recovery contract.
    relatedExamples: []
# Edition lite (owner ruling 2026-10-12, R212 case-1): the same ports and rules, a Supabase adapter behind them.
liteAdapter:
  summary: >-
    Under lite background work keeps its runners: processors and consumers are composed by the api app or by the optional worker
    app, exactly as full. Recurring work is app-owned: a back-end scheduler, pgmq jobs or pg_cron ticks that enqueue work.
    Deployment never installs a host crontab. A scheduled CLI batch follows the replicated-job and declared swarm-cronjob
    scheduler contract of repo.starcistacks or is converted to an application scheduler.
  ports:
    - {port: schedule, adapter: "pg_cron in a supabase migration calling pgmq.send"}
    - {port: runner, adapter: the api app or the optional worker app polling its pgmq queues}
  see: [knowledge/patterns/be/supabase-queues.yaml, knowledge/patterns/repo/starcistacks.yaml]
