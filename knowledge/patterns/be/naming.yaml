schema: starci/knowledge-source@1
id: be.naming
title: Naming
purpose: |-
  Given a backend file, class, type, constant, method or GraphQL field, what is it called? Names carry the slot and the
  role, so a reader and the slot check can tell where a unit belongs from its name alone.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/README.md
    - knowledge/patterns/be/folder.yaml
  limitations: |-
    A name does not prove responsibility. A file named `.repository.ts` that holds a use case is a finding of design
    review even when the suffix check passes.
rules:
  - id: BE-NAMING-1
    title: Files are kebab-case with a role suffix that matches the slot
    kind: mandatory
    hfsRules: [R01, R29]
    requirement: |-
      File basenames are kebab-case. The suffix is the role the slot allows (see slots.yaml `allows`).
    rationale: |-
      The slot check derives what a file is from where it sits and what it is called; an unlisted suffix is an
      undeclared file.
    cases:
      - id: case-1
        when: Feature application
        write: place-order.use-case.ts, place-order.contracts.ts, place-order.command.ts, place-order.query.ts, place-order.handler.ts
      - id: case-2
        when: Feature transport
        write: place-order.controller.ts, place-order.resolver.ts, place-order.mapper.ts, dto/place-order.request.ts, dto/place-order.response.ts, dto/place-order.input.ts, orders-http.module.ts, orders-graphql.module.ts
      - id: case-3
        when: Background transport
        write: settle-payments.job.ts in transport/schedule, payment-settled.consumer.ts in transport/message, orders-schedule.module.ts, orders-message.module.ts
      - id: case-4
        when: Capability
        write: orders.module.ts, orders.config.ts, orders.options.ts, orders.service.ts, orders.contracts.ts, credit-limit.policy.ts, order.repository.ts
      - id: case-5
        when: Persistence
        write: entities/order.entity.ts, migrations/20260929101500-create-orders.ts, connection.ts
      - id: case-6
        when: Errors
        write: errors/orders.error.ts for the family base, errors/order-not-found.error.ts for one error
      - id: case-7
        when: Spec
        write: 'unit `place-order.use-case.spec.ts` beside its subject; e2e `place-order.e2e-spec.ts` under src/tests/e2e/checkout/'
      - id: case-8
        when: App
        write: main.ts, app.module.ts, api.options.ts, api.composition.spec.ts
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - BE_SCHEMA_OWNER
      manual: []
    relatedExamples: []
  - id: BE-NAMING-2
    title: Classes are PascalCase subject plus role
    kind: mandatory
    hfsRules: [R29]
    requirement: |-
      A class name is the PascalCase subject plus the role suffix that matches its file: UseCase, Command, Query,
      Handler, Controller, Resolver, Consumer, Job, Module, Service, Policy, Repository, Entity, Error, Request,
      Response, Input, Guard, Filter.
    rationale: |-
      One vocabulary for roles keeps grep and DI error messages readable.
    cases:
      - id: case-1
        when: Use case and transport
        write: PlaceOrderUseCase, PlaceOrderController, PlaceOrderResolver
      - id: case-2
        when: Modules
        write: OrdersModule for the application module, OrdersHttpModule, OrdersGraphqlModule, OrdersScheduleModule, OrdersMessageModule per transport
      - id: case-3
        when: Persistence
        write: OrderEntity, OrderRepository
      - id: case-4
        when: Cross-cutting
        write: AuthGuard, ErrorFilter, SettlePaymentsJob
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-NAMING-3
    title: Error identity
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      An error class is `<Subject>Error` and extends its capability family `<Capability>Error`, which extends
      `DomainError`. Its `code` is the subject in UPPER_SNAKE without the suffix. The message is a short diagnostic
      sentence and never replaces the code.
    rationale: |-
      A stable code, not a class name or message, is what transports map and clients match on.
    cases:
      - id: case-1
        when: Class
        write: OrderNotFoundError, QuotaExhaustedError
      - id: case-2
        when: Code
        write: '"ORDER_NOT_FOUND", "QUOTA_EXHAUSTED"'
      - id: case-3
        when: Message
        write: 'a short sentence such as "Order not found"'
    verification:
      automated:
        - BE_ERROR_HOME
        - NEST_ERROR_DECLARATION_IDENTITY
      manual:
        - Review capability vocabulary and message safety.
    relatedExamples: []
  - id: BE-NAMING-4
    title: Enums
    kind: mandatory
    hfsRules: [R40]
    requirement: |-
      Enums are PascalCase with PascalCase members and string values. Log and throttle identities are enum members.
    rationale: |-
      String values are stable on the wire, and an enum member is a searchable identity.
    cases:
      - id: case-1
        when: Declaration
        write: 'export enum Locale { Vi = "vi", En = "en" }'
      - id: case-2
        when: Log identity
        write: 'ErrorLog.Http, OrderLog.Placed, never a string message'
      - id: case-3
        when: GraphQL registration
        write: 'registerEnumType(Locale, { name: "Locale" }) in the transport that exposes it, not in the domain'
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-NAMING-5
    title: Constants
    kind: mandatory
    hfsRules: [R44]
    requirement: |-
      Module-level constants are UPPER_SNAKE. Exported function values are camelCase arrows. Decorator factories keep
      PascalCase. A connection name is `export const CONNECTION` in `persistence/connection.ts` and equals a name in
      `hfs.json` `connections`.
    rationale: |-
      Constants are visible at a glance and a connection name has exactly one definition.
    cases:
      - id: case-1
        when: Module-level value
        write: 'const ORDER_TTL_SECONDS = 900, export const CONNECTION = "primary"'
      - id: case-2
        when: Function value
        write: 'export const orderTotal = (lines: readonly OrderLine[]): number => ...'
      - id: case-3
        when: Decorator factory
        write: 'export const Public = (options: { reason: string }) => SetMetadata(PUBLIC_KEY, options)'
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-NAMING-6
    title: Methods
    kind: mandatory
    hfsRules: [R29]
    requirement: |-
      A direct use case exposes `execute`. A bus handler implements the installed handler interface. A capability service
      uses meaningful verbs. Background jobs expose one entry named for the work (`run`, `sweep`, `deliver`,
      `reconcile`, `retry`) and call a use case. A resolver or controller method follows the schema or route contract.
      A name never carries a version to hide an incompatible change and never a bare verb export.
    rationale: |-
      The public method name tells a caller what the unit promises, and versioned names accumulate incompatible forks.
    cases:
      - id: case-1
        when: A use case
        write: 'async execute(input: PlaceOrderInput, principal: Principal): Promise<PlaceOrderResult>'
      - id: case-2
        when: A capability service
        write: 'assertWithinCreditLimit, reserveStock, releaseReservation'
      - id: case-3
        when: A job
        write: 'async run(): Promise<void> in SettlePaymentsJob, calling SettlePaymentsUseCase.execute'
      - id: case-4
        when: Not allowed
        write: 'get, run2, placeOrderV2'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
        - no-bare-verb-export
        - no-version-in-name
      manual: []
    relatedExamples: []
  - id: BE-NAMING-7
    title: Type names
    kind: mandatory
    hfsRules: [R37]
    requirement: |-
      Object type names use the suffixes `Input` and `Result` for application contracts, `Options` for configuration,
      `Request` and `Response` for HTTP DTOs, and `Input` and `Type` for GraphQL DTOs. A decorated class may keep a
      companion plain interface. No contract name ends in `Entity`.
    rationale: |-
      A suffix tells which layer owns the type and keeps ORM entities out of contracts.
    cases:
      - id: case-1
        when: Application contract
        write: PlaceOrderInput, PlaceOrderResult
      - id: case-2
        when: Options
        write: OrdersOptions parsed by parseOrdersConfig
      - id: case-3
        when: DTO
        write: PlaceOrderRequest, PlaceOrderResponse in transport/http/dto; PlaceOrderInput and OrderType in transport/graphql/dto
    verification:
      automated:
        - BE_ENTITY_IN_CONTRACT
      manual: []
    relatedExamples: []
  - id: BE-NAMING-8
    title: GraphQL surface
    kind: mandatory
    hfsRules: [R41, R42]
    requirement: |-
      GraphQL field names are camelCase. Each operation is one typed field; there is no generic `execute` field that
      switches on an operation name. The argument holding the input object is named `input`. A house decorator keeps its
      established name and every public operation carries `@Public({ reason })` or requires the default guard.
    rationale: |-
      A typed field per operation lets the contract, the guard and the input bounds be checked per operation.
    cases:
      - id: case-1
        when: Field
        write: '@Mutation(() => PlaceOrderResult, { name: "placeOrder" })'
      - id: case-2
        when: Argument
        write: '@Args("input") input: PlaceOrderInput'
      - id: case-3
        when: A public field
        write: '@Public({ reason: "sign-in door" })'
    verification:
      automated:
        - BE_DEFAULT_DENY
        - BE_INPUT_BOUNDED
      manual: []
    relatedExamples: []
