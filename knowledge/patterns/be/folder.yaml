schema: starci/knowledge-source@1
id: be.folder
title: Backend folder
purpose: |-
  Given backend code, which directory does it live in? Apply the HFS backend tree: the `be.*` slots of
  knowledge/hfs/slots.yaml are its machine form, and docs/architecture.md states the code forms.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - docs/architecture.md
    - owner-locked BE convention 2026-09-30
    - https://docs.nestjs.com/fundamentals/dynamic-modules
  limitations: |-
    A folder rule places code by responsibility. It does not prove behavior, registration or data ownership. The e2e run of the
    real apps, the migration run and the behavior tests prove those separately.
rules:
  - id: BE-FOLDER-1
    title: Responsibility roots
    kind: mandatory
    hfsRules: [R01, R02, R29, R89, R26, R145]
    requirement: |-
      The back end of every app (`be/`) is a `be/apps/<app>/` monorepo even with one app (slots `be.app.api`,
      `be.app.worker`, `be.app.cli`; the cli app is named cli). Apps own process composition only.
      `be/src/features/<kind>/` owns what triggers the application, grouped by trigger kind (BE-FOLDER-2; the kinds are
      `triggerKinds` of slots.yaml, one feature slot or root per kind). `be/src/modules/<tier>/<capability>` owns
      cohesive reusable capabilities where `<tier>` is a module tier of `tiers.be` in slots.yaml: `domain` for business
      rules, `platform` for technical runtime, `integrations` for a third-party provider or protocol, and the opt-in
      pattern tiers it adds. `be/src/tests/` holds the non-unit tests and shared test data (the `be.tests.*` slots).
      Nothing else exists at `be/src/` level, and no teaching, mock or sandbox code lives under `be/src/`. No folder named `types`,
      `constants`, `utils`, `helpers`, `shared`, `common`, `testing` or `exceptions` exists under `be/src/modules` or
      `be/src/features`: types live in `<name>.contracts.ts`, constants in the file that owns them, and a helper with no owner goes
      to the platform capability that uses it. A feature above 250 source files is split by product capability. A module may
      have one consumer.
    rationale: |-
      Ownership decides placement; repository topology and consumer count do not. A closed tier set keeps every capability
      addressable by the same dependency rules, and catch-all folders hide mixed ownership.
    cases:
      - id: case-1
        when: A new business rule with owned state
        write: 'be/src/modules/domain/<capability>/ with index.ts, <capability>.module.ts, <capability>.module-definition.ts, <capability>.options.ts and colocated specs.'
      - id: case-2
        when: A technical runtime facility such as scheduling or messaging
        write: be/src/modules/platform/<capability>/ with index.ts and its port, decorators and module files.
      - id: case-3
        when: A payment or LLM provider client
        write: 'be/src/modules/integrations/<provider>/ with index.ts, <provider>.config.ts, <provider>.decorators.ts, <provider>.client.ts and errors/.'
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_MIN_INSTANCES
        - HFS_REQUIRED_FILE_MISSING
        - HFS_ROOT_ENTRY_MISSING
        - HFS_APPS_REQUIRED
        - HFS_APP_LAYOUT_INVALID
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
        - BE_FEATURE_SHAPE
        - BE_FEATURE_LAYOUT_INVALID
        - BE_APPLICATION_IMPORTS_TRANSPORT
        - BE_APPLICATION_TRANSPORT_FRAMEWORK
        - BE_SOURCE_FORM
        - BE_PUBLIC_CONTRACT_FORM
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
        - HFS_MONO_NEST_PROJECTS
      manual:
        - Verify the actual owner and public API, not only folder names.
    relatedExamples: []
  - id: BE-FOLDER-2
    title: Features are grouped by trigger kind
    kind: mandatory
    hfsRules: [R29, R87, R147, R149, R28, R179, R180]
    requirement: |-
      `be/src/features/` holds one folder per trigger kind and nothing else: `features/api/<feature>/` for a feature a
      request triggers (api.yaml, slot `be.feature`), `features/cli/` for the one-off actions an operator runs (cli.yaml,
      slot `be.cli`), and one root under `features/` per further kind of `triggerKinds` in slots.yaml — the slots
      `be.feature.webhooks`, `be.feature.realtime`, `be.feature.saga`, `be.feature.reactors` and `be.feature.jobs`, each
      enabled by declaring its pattern in `hfs.json` `sides.be.patterns`. A kind never imports another kind, every kind
      imports only downward into `src/modules/*`, and only `be/apps/*` composes a feature.
      The shape of a feature root — its entries, `application/` and one `transport/<protocol>/` per protocol — is the
      `requires`/`allows` of its kind's slot and nothing else. `application/` (slot `be.feature.application`) holds the
      CQRS files of api.yaml and no folder named after a protocol. Each transport folder holds exactly one Nest module
      `<feature>-<protocol>.module.ts`, its resolvers, controllers or consumers, and `dto/` where the slot has one (the
      `be.transport.*` slots and each kind's own transport slots). A socket gateway or a subscription is the realtime
      kind and a provider webhook the webhooks kind.
    rationale: |-
      The trigger decides which app composes the code, so grouping by trigger keeps each app's composition one folder and
      makes a cross-kind import visible from the path alone.
    cases:
      - id: case-1
        when: A new GraphQL operation of the checkout feature
        write: be/src/features/api/checkout/ (its shape is api.yaml BE-API-1).
      - id: case-2
        when: A new seed or migrate command
        write: be/src/features/cli/<group>/subs/<name>.cli.ts (its shape is cli.yaml BE-CLI-2).
      - id: case-3
        when: A cli command needs the checkout scenario
        write: It calls the domain service under src/modules/domain, never a file of features/api.
    verification:
      automated:
        - BE_FEATURE_SHAPE
        - BE_FEATURE_LAYOUT_INVALID
        - BE_APPLICATION_IMPORTS_TRANSPORT
        - BE_APPLICATION_TRANSPORT_FRAMEWORK
        - BE_CQRS_SHAPE
        - BE_READONLY_BOUNDARY
        - BE_CLI_REQUIRED
        - BE_CLI_COMMAND_SHAPE
        - BE_FEATURE_IMPORTS_FEATURE
        - BE_KIND_DECLARATION
        - BE_KIND_EMPTY
      manual: []
    relatedExamples: []
  - id: BE-FOLDER-3
    title: Registration is executable composition
    kind: mandatory
    hfsRules: [R31, R32, R45]
    requirement: |-
      An app registers the capability modules once and the transport modules it serves (architecture-check.yaml
      BE-ARCHITECTURE-3). Api feature modules are static: `<feature>.module.ts` (the handlers) and one
      `<feature>-<protocol>.module.ts` per transport folder; there is no module per operation and no module-definition in an
      api feature (the cli feature root uses the module-definition pattern, cli.yaml). An e2e run boots the real `AppModule.register(options)` through `useTestWorld({ apps })`, so a transport that is not
      composed fails there.
    rationale: |-
      Import syntax and a unit spec do not establish a working DI container; only the real app booted in the world does.
    cases:
      - id: case-1
        when: A feature is added
        write: The app registers `<Feature>GraphqlModule` or `<Feature>HttpModule` and an e2e run of the app serves it.
    verification:
      automated:
        - BE_FEATURE_NOT_COMPOSED
        - BE_APP_COMPOSITION_ONLY
        - BE_APP_BUSINESS_ROLE
        - BE_MODULE_SHAPE
        - BE_MODULE_HANDLER_REGISTRATION
        - BE_MODULE_PROVIDER_REREGISTRATION
      manual:
        - Boot the applicable app container and resolve real provider tokens.
    relatedExamples: []
  - id: BE-FOLDER-4
    title: Capability shape follows owned behavior
    kind: mandatory
    hfsRules: [R30, R38, R85, R89, R01, R26]
    requirement: |-
      A domain, platform or integration capability has exactly one `index.ts` at its root, and only the parts it owns:
      the closed `requires`/`allows` of its slot (`be.domain`, `be.platform`, `be.integrations`, or the pattern tiers'
      `be.events`, `be.queues`, `be.projections`) — its module and module-definition when it registers providers, its
      config and options when it is configured, and its errors (`be.errors`), messages (`be.domain.messages`) and
      persistence (`be.persistence`) in their sub-slots. Same-owner imports are
      relative and never go through the owner's own `index.ts`; a nested `index.ts` does not exist. No empty conventional
      folder is created.
    rationale: |-
      A capability boundary is useful independently of boilerplate, and one public entry per owner is the only way to change
      internals without a cross-repository search.
    cases:
      - id: case-1
        when: A pure helper with no owner
        write: platform/primitives holds Outcome, time helpers, hashing and ids; a helper with an owner sits beside that owner.
      - id: case-2
        when: A capability has no configuration
        write: Do not create an empty config file; a capability without options still declares `export type XOptions = Record<string, never>`.
    verification:
      automated:
        - BE_PUBLIC_SURFACE
        - ARCH_OWNER_EXPORT_BYPASS
        - ARCH_OWNER_EXPORT_STAR
        - HFS_ALIAS_REEXPORT
        - ARCH_PACKAGE_EXPORT_BYPASS
        - BE_ERROR_HOME
        - BE_RAW_INJECT
        - BE_SOURCE_FORM
        - BE_PUBLIC_CONTRACT_FORM
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - BE_TIER_DIRECTION
        - FE_TIER_DIRECTION
        - ARCH_PACKAGE_IMPORTS_APP
      manual:
        - Check exported contracts, state owner and lifetime.
    relatedExamples: []
  - id: BE-FOLDER-5
    title: Errors live with their semantic owner
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      A capability's errors live in `errors/<c>.error.ts`: its code enum, its exhaustive kind table and its one error class
      extending `DomainError` from `platform/errors`. `platform/errors` owns only the base, the kind table of HTTP statuses,
      the filter and the GraphQL formatter. A folder named `exceptions/` does not exist. See error.yaml for the shape.
    rationale: |-
      Error policy belongs to the capability that decides it, and a central bucket forces every domain to depend on platform
      for its own vocabulary.
    cases:
      - id: case-1
        when: The purchase capability refuses a state change
        write: be/src/modules/domain/purchase/errors/purchase.error.ts with PurchaseErrorCode, PURCHASE_ERROR_KINDS and PurchaseError.
    verification:
      automated:
        - BE_ERROR_HOME
      manual:
        - Review safe client projection and private cause and log separation.
    relatedExamples: []
  - id: BE-FOLDER-6
    title: Persistence lives with the capability that owns the table
    kind: mandatory
    hfsRules: [R34, R35, R36]
    requirement: |-
      Entities, constraints and migrations live in `persistence/` of the capability that owns the table — slot
      `be.persistence`, under a domain, platform or projections capability (`platform/<c>/persistence/` for technical
      tables such as outbox, inbox and lease) — within the slot's closed `allows` (entities, epoch-named migrations, the
      SQL and row files, `connection.ts`); there is no `persistence/index.ts` and no `*.repository.ts`.
      `platform/database` owns the connection mechanism and the connection
      files; the app composes the explicit entity and migration lists. No feature transport owns a schema definition. See
      persistence.yaml.
    rationale: |-
      Schema ownership by capability keeps the tier direction (platform never imports domain) and gives every table one
      reviewer.
    cases:
      - id: case-1
        when: The purchase capability adds a table
        write: be/src/modules/domain/purchase/persistence/entities/purchase.entity.ts and an epoch-named migration beside it, and its SQL in persistence/purchase.sql.ts.
    verification:
      automated:
        - BE_SCHEMA_AUTHORITY
        - BE_SCHEMA_OWNER
        - BE_SQL_OUTSIDE_PERSISTENCE
      manual:
        - Verify the data owner, the actual connection and the transaction boundary.
    relatedExamples: []
  - id: BE-FOLDER-7
    title: Tests belong to behavior
    kind: mandatory
    hfsRules: [R47, R48]
    requirement: |-
      A unit spec sits beside its subject: required for the spec-required roles of `ruleParams.be.unitRoles` of slots.yaml
      (`<name>.service.spec.ts` beside its `<name>.service.ts`, `<name>.cli.spec.ts` beside its `<name>.cli.ts`) and beside a
      webhook or realtime door with no service of its own, and allowed beside any other file of a `ruleParams.be.logicRoles`
      role inside a slot whose `coverage` is `required` — such a file owes 100 per file, not a spec of its own (test.yaml
      BE-TEST-1, BE-TEST-13). A unit spec of anything else is a finding. Integration, e2e and provider contract specs are the slots `be.tests.integration`,
      `be.tests.e2e` and `be.tests.contract`; the folder and the suffix agree. Test infrastructure
      (containers, boot of the real apps, network-edge fakes) lives only in slot `be.tests.world` and typed doubles and builders in
      `be.tests.fixtures`. There is no other test kind. Fixtures never import a feature and no `testing/` folder exists under
      `be/src/modules`.
    rationale: |-
      Useful evidence checks invariants at their real boundary, and one placement rule keeps discovery mechanical.
    cases:
      - id: case-1
        when: A flow across GraphQL and the database
        write: be/src/tests/e2e/checkout/place-order.e2e-spec.ts using useTestWorld({ apps }) from be/src/tests/world/ to boot the real apps.
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - BE_CONTRACT_UNGUARDED
        - BE_SPEC_QUALITY
      manual:
        - A mocked manager test is not database isolation, boot or remote-effect evidence.
    relatedExamples: []
