schema: starci/knowledge-source@1
id: be.folder
title: Backend folder
purpose: |-
  Given backend code, which directory does it live in? Apply the HFS backend tree. Read knowledge/hfs/README.md section 5
  for the tree and docs/backend-source-pattern.md for the code forms.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - docs/backend-source-pattern.md
    - owner-locked BE convention 2026-09-30
    - https://docs.nestjs.com/fundamentals/dynamic-modules
  limitations: |-
    A folder rule places code by responsibility. It does not prove behavior, registration or data ownership. The e2e run of the
    real apps, the migration run and the behavior tests prove those separately.
rules:
  - id: BE-FOLDER-1
    title: Responsibility roots
    kind: mandatory
    hfsRules: [R01, R02, R29, R89]
    requirement: |-
      Every backend repository is an `apps/<app>/` monorepo even with one app. Apps own process composition only.
      `src/features/<feature>` owns the application layer and the transport adapters. `src/modules/<tier>/<capability>` owns
      cohesive reusable capabilities where `<tier>` is exactly `domain` (business rules), `platform` (technical runtime) or
      `integrations` (third-party provider or protocol). `src/tests/{e2e,fixtures}` holds non-unit tests and shared test data.
      Nothing else exists at `src/` level, and no teaching, mock or sandbox code lives under `src/`. No folder named `types`,
      `constants`, `utils`, `helpers`, `shared`, `common`, `testing` or `exceptions` exists under `src/modules` or
      `src/features`: types live in `<name>.contracts.ts`, constants in the file that owns them, and a helper with no owner goes
      to the platform capability that uses it. A feature above 250 source files is split by product capability. A module may
      have one consumer.
    rationale: |-
      Ownership decides placement; repository topology and consumer count do not. A closed tier set keeps every capability
      addressable by the same dependency rules, and catch-all folders hide mixed ownership.
    cases:
      - id: case-1
        when: A new business rule with owned state
        write: 'src/modules/domain/<capability>/ with index.ts, <capability>.module.ts, <capability>.module-definition.ts, <capability>.options.ts and colocated specs.'
      - id: case-2
        when: A technical runtime facility such as scheduling or messaging
        write: src/modules/platform/<capability>/ with index.ts and its port, decorators and module files.
      - id: case-3
        when: A payment or LLM provider client
        write: 'src/modules/integrations/<provider>/ with index.ts, <provider>.config.ts, <provider>.decorators.ts, <provider>.client.ts and errors/.'
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_REQUIRED_MISSING
        - BE_TIER_DIRECTION
        - HFS_APPS_REQUIRED
        - HFS_MODULE_TIER_INVALID
        - BE_SOURCE_FORM
      manual:
        - Verify the actual owner and public API, not only folder names.
    relatedExamples: []
  - id: BE-FOLDER-2
    title: One feature, one explicit protocol boundary
    kind: mandatory
    hfsRules: [R29, R87]
    requirement: |-
      A feature root holds `index.ts`, `<feature>.module.ts`, `application/`, `transport/<protocol>/` and, when it has copy,
      `messages/`, and nothing else. `application/` holds the CQRS files of cqrs.yaml and no folder named after a protocol. A
      protocol lives in `transport/graphql`, `transport/http`, `transport/websocket`, `transport/schedule`,
      `transport/message` or `transport/cli`, each with exactly one Nest module `<feature>-<protocol>.module.ts`, its
      resolvers, controllers, gateways, jobs, consumers or cli files, and `dto/` where the protocol has DTOs.
    rationale: |-
      Several entry protocols share one operation without importing transport DTOs into the application layer, and an app can
      compose only the transports it serves.
    cases:
      - id: case-1
        when: An operation reachable over HTTP and GraphQL
        write: application/place-order.command.ts and its handler once; transport/http/place-order.controller.ts and transport/graphql/place-order.resolver.ts each dispatch it.
      - id: case-2
        when: A conversion has substance
        write: transport/graphql/place-order.mapper.ts with toPlaceOrderType and toPlaceOrderRequest.
      - id: case-3
        when: A feature grows past 250 source files
        write: Split it by product capability into features, moving shared behavior into a domain capability.
    verification:
      automated:
        - BE_FEATURE_SHAPE
        - BE_CQRS_SHAPE
      manual:
        - Review application contracts for request-context, ORM entity and protocol DTO leaks.
    relatedExamples: []
  - id: BE-FOLDER-3
    title: Registration is executable composition
    kind: mandatory
    hfsRules: [R31, R32, R45]
    requirement: |-
      An app registers the capability modules once and the transport modules it serves (architecture-check.yaml
      BE-ARCHITECTURE-3). Feature modules are static: `<feature>.module.ts` (the handlers) and one
      `<feature>-<protocol>.module.ts` per transport folder; there is no module per operation and no module-definition in a
      feature. An e2e run boots the real `AppModule.register(options)` through `useTestWorld({ apps })`, so a transport that is not
      composed fails there.
    rationale: |-
      Import syntax and a unit spec do not establish a working DI container; only the real app booted in the world does.
    cases:
      - id: case-1
        when: A feature is added
        write: The app registers `<Feature>GraphqlModule` or `<Feature>HttpModule` and an e2e run of the app serves it.
    verification:
      automated:
        - BE_FEATURE_NOT_COMPOSED
        - BE_MODULE_SHAPE
      manual:
        - Boot the applicable app container and resolve real provider tokens.
    relatedExamples: []
  - id: BE-FOLDER-4
    title: Capability shape follows owned behavior
    kind: mandatory
    hfsRules: [R30, R38, R85, R89]
    requirement: |-
      A domain, platform or integration capability has exactly one `index.ts` at its root, and only the parts it owns:
      `<c>.module.ts` and `<c>.module-definition.ts` when DI registration is needed, `<c>.config.ts` and `<c>.options.ts` when it
      is configured, `<c>.decorators.ts` (its injectors and tokens), `<c>.log-events.ts`, `<c>.cache-keys.ts`, `errors/`,
      `messages/`, `persistence/`, `*.service.ts`, `*.policy.ts`, `*.contracts.ts` and colocated specs. Same-owner imports are
      relative and never go through the owner's own `index.ts`; a nested `index.ts` does not exist. No empty conventional
      folder is created.
    rationale: |-
      A capability boundary is useful independently of boilerplate, and one public entry per owner is the only way to change
      internals without a cross-repository search.
    cases:
      - id: case-1
        when: A pure helper with no owner
        write: platform/primitives holds Outcome, time helpers, hashing and ids; a helper with an owner sits beside that owner.
      - id: case-2
        when: A capability has no configuration
        write: Do not create an empty config file; a capability without options still declares `export type XOptions = Record<string, never>`.
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - BE_PUBLIC_SURFACE
        - BE_TIER_DIRECTION
        - BE_SOURCE_FORM
      manual:
        - Check exported contracts, state owner and lifetime.
    relatedExamples: []
  - id: BE-FOLDER-5
    title: Errors live with their semantic owner
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      A capability's errors live in `errors/<c>.error.ts`: its code enum, its exhaustive kind table and its one error class
      extending `DomainError` from `platform/errors`. `platform/errors` owns only the base, the kind table of HTTP statuses,
      the filter and the GraphQL formatter. A folder named `exceptions/` does not exist. See error.yaml for the shape.
    rationale: |-
      Error policy belongs to the capability that decides it, and a central bucket forces every domain to depend on platform
      for its own vocabulary.
    cases:
      - id: case-1
        when: The purchase capability refuses a state change
        write: src/modules/domain/purchase/errors/purchase.error.ts with PurchaseErrorCode, PURCHASE_ERROR_KINDS and PurchaseError.
    verification:
      automated:
        - BE_ERROR_HOME
      manual:
        - Review safe client projection and private cause and log separation.
    relatedExamples: []
  - id: BE-FOLDER-6
    title: Persistence lives with the capability that owns the table
    kind: mandatory
    hfsRules: [R34, R35, R36]
    requirement: |-
      Entities, constraints and migrations live in `persistence/` of the capability that owns the table (`domain/<c>/persistence/`,
      or `platform/<c>/persistence/` for technical tables such as outbox, inbox and lease): `entities/<table>.entity.ts`,
      `migrations/<epochMs13>-<kebab-name>.ts`, `<name>.sql.ts`, `<name>.rows.ts` and `connection.ts`. There is no
      `persistence/index.ts` and no `*.repository.ts`. `platform/database` owns the connection mechanism and the connection
      files; the app composes the explicit entity and migration lists. No feature transport owns a schema definition. See
      persistence.yaml.
    rationale: |-
      Schema ownership by capability keeps the tier direction (platform never imports domain) and gives every table one
      reviewer.
    cases:
      - id: case-1
        when: The purchase capability adds a table
        write: src/modules/domain/purchase/persistence/entities/purchase.entity.ts and an epoch-named migration beside it, and its SQL in persistence/purchase.sql.ts.
    verification:
      automated:
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
        - BE_SQL_OUTSIDE_PERSISTENCE
      manual:
        - Verify the data owner, the actual connection and the transaction boundary.
    relatedExamples: []
  - id: BE-FOLDER-7
    title: Tests belong to behavior
    kind: mandatory
    hfsRules: [R47, R48]
    requirement: |-
      Unit specs are `<name>.service.spec.ts` beside their `<name>.service.ts` and nothing else has a unit spec. Integration specs are
      `src/tests/integration/<capability>/*.integration-spec.ts`, e2e specs `src/tests/e2e/<area>/*.e2e-spec.ts` and provider
      contract specs `src/tests/contract/<provider>/*.contract-spec.ts`; the folder and the suffix agree. Test infrastructure
      (containers, boot of the real apps, network-edge fakes) lives only in `src/tests/world/` and typed doubles and builders in
      `src/tests/fixtures/`. There is no other test kind. Fixtures never import a feature and no `testing/` folder exists under
      `src/modules`.
    rationale: |-
      Useful evidence checks invariants at their real boundary, and one placement rule keeps discovery mechanical.
    cases:
      - id: case-1
        when: A flow across GraphQL and the database
        write: src/tests/e2e/checkout/place-order.e2e-spec.ts using useTestWorld({ apps }) from src/tests/world/ to boot the real apps.
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_TEST_KIND_RETIRED
      manual:
        - A mocked manager test is not database isolation, boot or remote-effect evidence.
    relatedExamples: []
