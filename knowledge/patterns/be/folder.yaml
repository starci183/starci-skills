schema: starci/knowledge-source@1
id: be.folder
title: Backend folder
purpose: |-
  Given backend code, which directory does it live in? Apply the HFS backend tree. Read knowledge/hfs/README.md
  section 5 for the tree and docs/backend-source-pattern.md for the code forms.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - docs/backend-source-pattern.md
    - https://docs.nestjs.com/fundamentals/dynamic-modules
    - https://docs.nestjs.com/techniques/validation
  limitations: |-
    A folder rule places code by responsibility. It does not prove behavior, registration or data ownership. The
    composition spec, the migration run and the behavior tests prove those separately.
rules:
  - id: BE-FOLDER-1
    title: Responsibility roots
    kind: mandatory
    hfsRules: [R01, R02, R29]
    requirement: |-
      Every backend repository is an `apps/<app>/` monorepo even with one app. Apps own process composition only.
      `src/features/<feature>` owns use-case orchestration and transport adapters. `src/modules/<tier>/<capability>`
      owns cohesive reusable capabilities where `<tier>` is exactly `domain` (business rules), `platform` (technical
      runtime) or `integrations` (third-party provider or protocol); any other tier name is forbidden, and a generic
      helper with no owner goes to the platform capability that uses it. `src/tests/{e2e,fixtures}` holds non-unit
      tests and shared test data. A module may have one consumer. A root `src/` without `apps/` does not exist.
    rationale: |-
      Ownership decides placement; repository topology and consumer count do not. A closed tier set keeps every
      capability addressable by the same dependency rules.
    cases:
      - id: case-1
        when: A new business rule with owned state
        write: src/modules/domain/<capability>/ with index.ts, <capability>.module.ts and colocated specs.
      - id: case-2
        when: A technical runtime facility such as scheduling or messaging
        write: src/modules/platform/<capability>/ with index.ts.
      - id: case-3
        when: A payment or LLM provider client
        write: src/modules/integrations/<provider>/ with index.ts, <provider>.config.ts, errors/ and the client.
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_REQUIRED_MISSING
        - BE_TIER_DIRECTION
        - HFS_APPS_REQUIRED
        - HFS_MODULE_TIER_INVALID
        - HFS_APPS_REQUIRED
        - BE_TIER_DIRECTION
      manual:
        - Verify the actual owner and public API, not only folder names.
    relatedExamples: []
  - id: BE-FOLDER-2
    title: One feature, one explicit protocol boundary
    kind: mandatory
    hfsRules: [R29]
    requirement: |-
      A feature root holds `index.ts`, `<feature>.module.ts`, `application/` and `transport/<protocol>/` and nothing
      else. `application/` holds protocol-neutral use cases and contracts (`<action>.use-case.ts`,
      `<action>.contracts.ts`, optional `<action>.{command,query,handler}.ts`) and no folder named after a protocol.
      A protocol lives in `transport/http`, `transport/graphql`, `transport/message` or `transport/schedule` (and
      `transport/websocket` when its slot is declared), each with exactly one Nest module
      `<feature>-<protocol>.module.ts`, its controllers, resolvers, consumers or jobs, and `dto/`. A direct
      `<action>.use-case.ts` is the default; a command, query and handler exist only for an adopted bus. A feature above
      250 source files is split by product capability.
    rationale: |-
      Several entry protocols share one scenario without importing transport DTOs into the application layer, and an app
      can compose only the transports it serves.
    cases:
      - id: case-1
        when: A scenario reachable over HTTP and GraphQL
        write: application/place-order.use-case.ts once; transport/http/place-order.controller.ts and transport/graphql/place-order.resolver.ts each call it.
      - id: case-2
        when: An HTTP response needs conversion
        write: transport/http/place-order.mapper.ts only when the conversion has substance; otherwise map inline.
      - id: case-3
        when: A feature grows past 250 source files
        write: Split it by product capability into features, moving shared behavior into a domain capability.
    verification:
      automated:
        - BE_FEATURE_SHAPE
        - BE_APPLICATION_IMPORTS_TRANSPORT
      manual:
        - Review application contracts for request-context, ORM entity and protocol DTO leaks.
    relatedExamples: []
  - id: BE-FOLDER-3
    title: Registration is executable composition
    kind: mandatory
    hfsRules: [R31, R32, R45]
    requirement: |-
      An app imports the actual transport modules and capability modules it serves and exports only the required APIs.
      Fixed registration uses a static module. A dynamic `register(options)` exists for real caller configuration or an
      instance identity and receives a typed options object. A CQRS-selected feature registers its bus and handlers.
      There is one Nest module per transport plus one application module, never one module per operation.
    rationale: |-
      Import syntax and direct construction in a spec do not establish a working DI container.
    cases:
      - id: case-1
        when: A feature is added
        write: The app imports `<Feature>HttpModule` or `<Feature>GraphqlModule` and the composition spec resolves one of its real providers.
      - id: case-2
        when: A capability needs caller configuration
        write: '`ConfigurableModuleBuilder<Options>().build()` with a real options type, consumed through `register(options)`.'
    verification:
      automated:
        - BE_FEATURE_NOT_COMPOSED
        - BE_MODULE_SHAPE
      manual:
        - Boot the applicable app container and resolve real provider tokens.
    relatedExamples: []
  - id: BE-FOLDER-4
    title: Capability shape follows owned behavior
    kind: mandatory
    hfsRules: [R30, R38]
    requirement: |-
      A domain or platform capability has an explicit `index.ts`, and only the parts it owns: `<capability>.module.ts`
      when DI registration is needed, `<capability>.config.ts` and `<capability>.options.ts` when it is configured,
      `errors/`, `persistence/`, `policies/`, `*.service.ts`, `*.contracts.ts` and colocated specs. The names
      `testing/`, `exceptions/`, `utils/`, `helpers/` and `shared/` are not capabilities and do not exist as folders.
      Helpers stay with their owner; no empty conventional folder is created.
    rationale: |-
      A capability boundary is useful independently of boilerplate, and a catch-all folder hides mixed ownership.
    cases:
      - id: case-1
        when: A pure helper with no owner
        write: platform/primitives holds isRecord, hashing, ids and cookies; a helper with an owner sits beside that owner.
      - id: case-2
        when: A capability has no configuration
        write: Do not create an empty config or options file.
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - BE_PUBLIC_SURFACE
        - BE_TIER_DIRECTION
      manual:
        - Check exported contracts, state owner and lifetime.
    relatedExamples: []
  - id: BE-FOLDER-5
    title: Errors live with their semantic owner
    kind: mandatory
    hfsRules: [R38]
    requirement: |-
      A capability's errors live in its own `errors/` folder (`<capability>.error.ts` for the family base and
      `<name>.error.ts` per error), extending `DomainError` from `platform/errors`. `platform/errors` owns only the
      generic base, the HTTP filter, the GraphQL `formatError` and the transport-owned code to status table. A
      folder named `exceptions/` does not exist as a capability. See error.yaml for the shape.
    rationale: |-
      Error policy belongs to the capability that decides it, and a central bucket forces every domain to depend on
      platform for its own vocabulary.
    cases:
      - id: case-1
        when: The orders capability refuses a state change
        write: src/modules/domain/orders/errors/order-not-found.error.ts extending OrdersError.
    verification:
      automated:
        - BE_ERROR_HOME
      manual:
        - Review safe client projection and private cause and log separation.
    relatedExamples: []
  - id: BE-FOLDER-6
    title: Persistence lives with the capability that owns the table
    kind: mandatory
    hfsRules: [R34, R35, R36]
    requirement: |-
      Entities, constraints and migrations live in `persistence/` of the capability that owns the table
      (`domain/<capability>/persistence/`, or `platform/<capability>/persistence/` for technical tables such as outbox
      and lease). `persistence/connection.ts` exports the connection name from `hfs.json` `connections`. Migrations are
      `migrations/<yyyyMMddHHmmss>-<kebab-name>.ts`, entities `entities/<table>.entity.ts`, raw SQL only in
      `<name>.repository.ts`. `platform/database` owns the connection mechanism; the app composes the explicit entity
      and migration lists. No feature transport owns a schema definition. See persistence.yaml.
    rationale: |-
      Schema ownership by capability keeps the tier direction (platform never imports domain) and gives every table one
      reviewer.
    cases:
      - id: case-1
        when: The orders capability adds a table
        write: src/modules/domain/orders/persistence/entities/order.entity.ts and a timestamped migration beside it.
    verification:
      automated:
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
        - BE_SQL_OUTSIDE_REPOSITORY
      manual:
        - Verify the data owner, the actual connection token and the transaction boundary.
    relatedExamples: []
  - id: BE-FOLDER-7
    title: Tests belong to behavior
    kind: mandatory
    hfsRules: [R47, R48]
    requirement: |-
      Unit specs are `<name>.spec.ts` beside their subject. Every e2e spec is `*.e2e-spec.ts` under
      `src/tests/e2e/<area>/`, live third-party suites under `src/tests/e2e/live/<area>/`, environment code (containers,
      boot of the real AppModule) in `src/tests/e2e/setup/` and shared data in `src/tests/fixtures/`. There is no other test kind.
      Fixtures never import a feature and no `testing/` folder exists under `src/modules`.
    rationale: |-
      Useful evidence checks invariants at their real boundary, and one placement rule keeps discovery mechanical.
    cases:
      - id: case-1
        when: A flow across HTTP and the database
        write: src/tests/e2e/checkout/place-order.e2e-spec.ts using src/tests/e2e/setup/ to boot the real AppModule.
    verification:
      automated:
        - BE_TEST_TOPOLOGY
        - HFS_TEST_KIND_RETIRED
      manual:
        - A mocked manager test is not database isolation, boot or remote-effect evidence.
    relatedExamples: []
