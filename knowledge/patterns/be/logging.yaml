schema: starci/knowledge-source@1
id: be.logging
title: Backend logging
purpose: |-
  Given a backend event worth recording, how is it logged and where does the logger come from? One mandatory `Logger` port
  in `platform/logging` reached through `InjectLogger()`, enum identities declared by their owner, structured fields, and a
  JSON-lines adapter.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/rules.yaml
    - knowledge/patterns/be/error.yaml
    - owner-locked BE convention 2026-09-30
    - https://docs.nestjs.com/techniques/logger
  limitations: |-
    Static checks prove that the port exists, that identities are enum members, that no `catch` swallows an error and that a
    value typed `Secret` or `Pii` never reaches a logger call. They do not prove that a log line carries the right facts;
    review and behavior tests do.
rules:
  - id: BE-LOGGING-1
    title: platform/logging exists and exposes one port
    kind: mandatory
    hfsRules: [R40, R85, R90]
    requirement: |-
      `platform/logging` is a required platform capability. It exports the `Logger` port (`info`, `warn`,
      `error(event, fields)` and `error(event, cause, fields)`) and `InjectLogger()`. The default adapter writes one JSON line
      per event to stdout or stderr, stamped by the `Clock`; shipping the lines to a collector is not the application's job.
      `new AppLogger`, the Nest `Logger`, `console.*` and `winston` outside `platform/logging` do not exist. A class takes the
      port as `@InjectLogger() private readonly logger: Logger`.
    rationale: |-
      Without a mandatory logging capability a backend can pass every check and still record nothing when it fails, and a
      second logging library is a second format for the collector.
    cases:
      - id: case-1
        when: Injection
        write: 'constructor(@InjectLogger() private readonly logger: Logger) {}'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
        - BE_INFRA_OWNER
        - BE_RAW_INJECT
        - HFS_SLOT_REQUIRED_MISSING
      manual: []
    relatedExamples: []
  - id: BE-LOGGING-2
    title: Identity is an enum member of the owner, fields are structured
    kind: mandatory
    hfsRules: [R40, R71]
    requirement: |-
      Each owner declares `<owner>.log-events.ts` with `export enum <Owner>LogEvent { CheckoutFailed = "purchase.checkout.failed" }`
      and the first argument of a log call is a member of an enum of that kind; platform never declares a central enum of
      domain names. Fields are structured ids and codes. A value typed `Secret` or `Pii` passed to a logger call is an error,
      as is a field named after a credential or a personal identifier; log an id or a masked form.
    rationale: |-
      A stable identity is searchable and alertable, and typed brands catch a secret that a name list would miss.
    cases:
      - id: case-1
        when: A call
        write: 'this.logger.info(PurchaseLogEvent.CheckoutOpened, { purchaseId, offerId })'
      - id: case-2
        when: A failure
        write: 'this.logger.error(PurchaseLogEvent.CheckoutFailed, error, { offerId })'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
        - BE_LOG_SECRET
      manual:
        - Review fields for secrets and personal data.
    relatedExamples: []
  - id: BE-LOGGING-3
    title: Every catch handles its error
    kind: mandatory
    hfsRules: [R40]
    requirement: |-
      Every `catch` rethrows, calls a method of a value typed `Logger`, or returns an `Outcome` that carries the cause. An
      empty `catch {}` and a `catch` that ignores the caught value are findings.
    rationale: |-
      A swallowed failure leaves an unexplained state and no trace.
    cases:
      - id: case-1
        when: A recoverable failure
        write: 'catch (error) { this.logger.warn(PaymentLogEvent.ProviderUnavailable, { code: PaymentErrorCode.ProviderUnavailable }); return { kind: "refused", code: PaymentErrorCode.ProviderUnavailable } }'
    verification:
      automated:
        - BE_LOGGER_REQUIRED
      manual:
        - Verify the chosen handling is right for the failure.
    relatedExamples: []
