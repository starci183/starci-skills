schema: starci/knowledge-source@1
id: be.messages
title: Messages catalog and locale
purpose: |-
  Given text a user reads - an error's display text, a notification's subject or body, a response's `message` or
  `description` - where does it live, how is it looked up, and which locale does a lookup resolve to? User-facing copy lives
  in the owner's `messages/<owner>.messages.ts` (vi and en, same keys, `{{param}}` placeholders), reached through
  `InjectMessageCatalog()`; the locale comes from `InjectRequestLocale()` so no call site derives it.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-30
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - packages/eslint/be/user-copy.mjs
  limitations: |-
    Static checks find a literal written where copy belongs and refuse it. They cannot judge translation quality, whether a
    key is reused correctly across capabilities, or whether the resolved locale matches the product decision for a caller;
    those are reviewed against the accepted SRS and a real request or job run.
rules:
  - id: BE-MESSAGES-1
    title: One keyed catalog per owner, read through MessageCatalog
    kind: mandatory
    hfsRules: [R78]
    requirement: |-
      Text a user reads never sits in source as a literal: a `subject`, `title`, `body`, `text` or `message` property of a
      `notify`, `send` or `publish` call, and a `message`, `description` or `title` property of a transport response, all come
      from `messages/<owner>.messages.ts` of the owner (`be/src/modules/{domain,platform,integrations}/<c>/messages/` or
      `be/src/features/<f>/messages/`): one keyed entry per message, `vi` and `en` maps with the same keys, named `{{param}}`
      interpolation for anything a literal built with `+` or a template. A class reads the catalog through
      `@InjectMessageCatalog() private readonly messages: MessageCatalog`, never by importing a catalog file. An error's display
      text is the entry `errors.<code>` (error.yaml). A short
      code-shaped literal (`UPPER_SNAKE`, a single bare word) is a code or an enum value, not copy, and stays in source. No
      Vietnamese text exists in source outside the `messages/` catalogs.
    rationale: |-
      A literal cannot be translated, cannot be found by the key a test asserts on, and drifts the moment one call site is
      edited and its sibling is not. One port gives every owner the same lookup and interpolation shape.
    cases:
      - id: case-1
        when: A notification
        write: 'this.notifier.send({ subject: this.messages.get("billing.invoice-subject", { number }), body: this.messages.get("billing.invoice-body", { amount }) })'
      - id: case-2
        when: An error text
        write: 'purchase/messages/purchase.messages.ts holds "errors.PURCHASE_ALREADY_OWNED": { vi: "...", en: "..." }; the filter resolves it by the error code.'
      - id: case-3
        when: The catalog file
        write: 'be/src/modules/domain/billing/messages/billing.messages.ts exports one keyed map, `{ "billing.invoice-subject": { vi: "...", en: "..." } }`, composed into the platform catalog at startup with every other owner''s catalog.'
    verification:
      automated:
        - BE_USER_COPY_LITERAL
        - BE_SOURCE_FORM
      manual:
        - Confirm the vi and en text carry the same meaning and that an interpolated value cannot leak a secret or an internal id a client should not see.
    relatedExamples: []
  - id: BE-MESSAGES-2
    title: Locale resolution is one port, never guessed at the call site
    kind: mandatory
    hfsRules: [R78, R85]
    requirement: |-
      `platform/i18n` exposes `RequestLocale`, injected with `InjectRequestLocale()`, that resolves the locale a
      `MessageCatalog.get` lookup reads; no call site derives a locale itself. Inside a request (HTTP or GraphQL): the
      authenticated principal's stored locale preference, else the first of `vi` or `en` the `Accept-Language` header names,
      else `vi`. Outside a request (a scheduled job, a queue consumer building a notification): the recipient's own stored
      locale preference when it is known, else `vi`, passed to `MessageCatalog.get(key, params, { locale })` explicitly.
      `InjectRequestLocale` is used only where a request context exists.
    rationale: |-
      Locale is a fact about who receives the text, resolved once by one owner from the evidence the context actually has, so
      one job does not ship Vietnamese and the next English for the same recipient.
    cases:
      - id: case-1
        when: A request-scoped handler or filter
        write: 'RequestLocale resolves the principal preference, else Accept-Language vi or en, else "vi"; the catalog reads it with no extra argument.'
      - id: case-2
        when: A notification job
        write: 'the job loads the recipient row, resolves recipient.localePreference ?? "vi", and calls this.messages.get(key, params, { locale }).'
      - id: case-3
        when: No preference and no header
        write: 'both paths fall back to "vi"; a header naming a language other than vi or en is treated as absent.'
    verification:
      automated:
        - BE_USER_COPY_LITERAL
      manual:
        - Confirm a job resolves the recipient's own preference, never the acting operator's or a fixed default; confirm a header outside vi and en falls back to vi rather than throwing.
    relatedExamples: []
