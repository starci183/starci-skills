schema: starci/knowledge-source@1
id: be.api-auth
title: API authentication and input bounds
purpose: |-
  Given an api app, which routes are open, who verifies the caller and how is input bounded? Every route is denied by
  default. Opening a route is a written, reviewed decision.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - https://docs.nestjs.com/guards
    - https://www.rfc-editor.org/rfc/rfc8725.html
    - https://nodejs.org/api/crypto.html#cryptotimingsafeequala-b
  limitations: |-
    Static checks prove that a guard is registered and that no route is open without a reason. They do not prove that a
    policy is correct, that a token is verified with the right audience, or that a rate limit is effective. Those need
    contract tests and negative-path evidence.
rules:
  - id: BE-AUTH-1
    title: Default deny with APP_GUARD and @Public
    kind: mandatory
    hfsRules: [R41]
    requirement: |-
      `domain/identity` exports `AuthGuard`, `@Public({ reason })` and `@Roles()`. Every api app registers the guard as
      `APP_GUARD` in `app.module.ts`. A route or GraphQL operation is open only when it carries `@Public({ reason })` with
      a written reason: sign-in and recovery doors, a signed webhook, a health probe. Any other operation requires the
      authenticated principal. A worker, migrate or cli app exposes no route.
    rationale: |-
      With allow-by-default a forgotten decorator publishes a route unnoticed. With default deny it fails closed and the
      exception carries its own justification.
    cases:
      - id: case-1
        when: Registration
        write: 'apps/api/src/app.module.ts provides { provide: APP_GUARD, useClass: AuthGuard }.'
      - id: case-2
        when: An open door
        write: '@Public({ reason: "sign-in door, authenticates by password" }) on SignInController.signIn'
      - id: case-3
        when: A role-restricted operation
        write: '@Roles(Role.Admin) on the resolver, checked by the same guard.'
    verification:
      automated:
        - BE_DEFAULT_DENY
        - HFS_SLOT_REQUIRED_MISSING
      manual:
        - Review each `@Public` reason and confirm that the operation may be reached without a session.
    relatedExamples: []
  - id: BE-AUTH-2
    title: Identity owns verification
    kind: mandatory
    hfsRules: [R26, R41]
    requirement: |-
      Verifying a token or session belongs to `domain/identity`, which uses `integrations/<provider>` for the identity
      provider. Platform never verifies a caller and a GraphQL context factory never authenticates. For JWT, verify the
      allowed algorithms, issuer and intended audience; decoding is not verification. A workspace or tenant header is a
      selector, never proof of access, and resource authorization stays in the use case so jobs and other entry points
      cannot bypass a controller guard.
    rationale: |-
      Authentication is a business capability with its own state and errors. Placing it in platform reverses the tier
      direction.
    cases:
      - id: case-1
        when: Verifying a bearer token
        write: 'AuthGuard calls IdentityService.verify(token), implemented with integrations/keycloak; the principal is put on the request context.'
    verification:
      automated:
        - BE_TIER_DIRECTION
        - BE_DEFAULT_DENY
      manual:
        - Confirm the audience, issuer and algorithm allow list against the provider contract.
    relatedExamples: []
  - id: BE-AUTH-3
    title: Signed webhooks and constant-time comparison
    kind: mandatory
    hfsRules: [R41]
    requirement: |-
      A webhook is `@Public({ reason })` and verifies its signature with the shared verifier before any parsing effect.
      Every comparison of a secret, signature or token uses `timingSafeEqual` on equal-length buffers. A secret is never
      compared with `===`.
    rationale: |-
      A public door is only safe when the request proves its origin, and a variable-time comparison leaks the secret.
    cases:
      - id: case-1
        when: A provider webhook
        write: '@Public({ reason: "PayOS webhook, signed" }) then `verifySignature(rawBody, header, secret)` from the shared verifier, which calls timingSafeEqual.'
    verification:
      automated:
        - BE_DEFAULT_DENY
      manual:
        - Review that the raw body, not a re-serialized one, is verified.
    relatedExamples: []
  - id: BE-AUTH-4
    title: Typed operations, no generic tunnels
    kind: mandatory
    hfsRules: [R41]
    requirement: |-
      Each operation is its own typed field or route. `@Body() x: unknown`, a `GraphQLJSON` parameter and a
      `switch (input.operation)` in transport are forbidden; a generic operation name that fans out to many behaviors
      becomes one operation per behavior.
    rationale: |-
      A tunnel defeats the contract, the guard and the input bounds, because the checker sees one operation where there
      are many.
    cases:
      - id: case-1
        when: A generic execute mutation
        write: 'Split into placeOrder, cancelOrder and refundOrder, each with its own input type and guard.'
    verification:
      automated:
        - BE_DEFAULT_DENY
      manual:
        - Review that no operation name is decided by a string in a payload.
    relatedExamples: []
  - id: BE-AUTH-5
    title: Bounded input and rate-limited doors
    kind: mandatory
    hfsRules: [R42]
    requirement: |-
      Every string field of an input has a length or format bound. GraphQL applies depth and complexity limits. The auth
      and webhook doors are rate limited by a throttling decorator that names its level.
    rationale: |-
      Unbounded input and unthrottled doors are the cheapest denial of service and brute-force paths.
    cases:
      - id: case-1
        when: An input field
        write: '@IsString() @MaxLength(200) note!: string'
      - id: case-2
        when: A door
        write: '@UseThrottler(ThrottlerConfig.Strict) on SignInController.signIn'
    verification:
      automated:
        - BE_INPUT_BOUNDED
      manual:
        - Confirm the chosen bounds against the accepted contract.
    relatedExamples: []
