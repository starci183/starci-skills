schema: starci/knowledge-source@1
id: be.function
title: Function
purpose: |-
  Given a backend handler, service, resolver, module or helper, what shape does it take, what does it receive, and what does it return?
appliesTo:
  - backend
family: be
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - features/api/core/graphql/mutations/courses/add-to-cart/*
    - features/api/core/graphql/queries/courses/course/course.handler.ts
    - modules/platform/cqrs/icqrs-handler.ts
    - features/api/core/types/execute.ts
    - modules/bussiness/projections/user-stats/kpi-current.util.ts
    - modules/api/apollo/server/interceptors/graphql-transform.interceptor.ts
  limitations: |-
    Historical reference-source observations preserved at the extraction commit; not a fresh audit of current repository conformance. Counts and file totals cited in rationale or cases are provenance from that extraction, not claims about today. Inspect the selected repository's actual types/APIs, aliases and lint/test setup; verify reference conformance within approved .starciwork scope. Target legacy code does not override the reference. Current business requirements and architecture belong to .starciwork; code patterns do not approve them.
rules:
  - id: BE-FUNCTION-1
    title: "Handler: extend the template, override process"
    kind: mandatory
    requirement: |-
      Command and query handlers extend ICQRSHandler, implement the Nest CQRS interface, and override protected async process. Callers use the inherited execute door.
    rationale: |-
      140 handlers extend ICQRSHandler at extraction; 138 also implement the Nest interface; process is overridden in 140/140.
    cases:
      - id: case-1
        when: Class head
        write: |-
          @CommandHandler(AddToCartCommand) @Injectable() export class AddToCartHandler extends ICQRSHandler<AddToCartCommand, CartItemEntity> implements ICommandHandler<AddToCartCommand, CartItemEntity>
      - id: case-2
        when: Query variant
        write: |-
          @QueryHandler(CourseQuery) @Injectable() export class CourseHandler extends ICQRSHandler<CourseQuery, CourseEntity> implements IQueryHandler<CourseQuery, CourseEntity>
      - id: case-3
        when: The one method
        write: |-
          protected override async process(command: AddToCartCommand): Promise<CartItemEntity> { … } (lint handler-overrides-process)
      - id: case-4
        when: The public door
        write: |-
          inherited: async execute(params: TParams): Promise<TResponse> { return await this.process(params) } in ICQRSHandler
      - id: case-5
        when: First statement
        write: |-
          const { request, user } = command.params then guards
    verification:
      automated:
        - handler-overrides-process
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-FUNCTION-2
    title: "Message: an inert envelope"
    kind: mandatory
    requirement: |-
      Command and query classes carry only readonly params: ExecuteParams<T>; no methods or derived fields.
    rationale: |

    cases:
      - id: case-1
        when: Command
        write: |-
          export class AddToCartCommand { constructor(readonly params: ExecuteParams<AddToCartRequest>) {} }
      - id: case-2
        when: Query
        write: |-
          export class CourseQuery { constructor(readonly params: ExecuteParams<CourseRequest>) {} }
      - id: case-3
        when: The envelope type
        write: |-
          interface ExecuteParams<T> { request: T; locale?: Locale; user?: UserEntity; enrollmentId?: string; keycloakToken?: KeycloakTokenIntrospectResponse }
      - id: case-4
        when: Nothing else
        write: |-
          no methods, no derived fields (lint message-carries-params-only)
    verification:
      automated:
        - message-carries-params-only
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-FUNCTION-3
    title: "GraphQL feature service: forward to the bus"
    kind: mandatory
    requirement: |-
      This case applies to feature services, not capability services under modules. A GraphQL feature service injects CommandBus or QueryBus and forwards execute to the matching message. A capability service owns cohesive domain behavior and may inject its correctly named EntityManager directly. Do not wrap that manager in a StorePort or repository facade.
    rationale: |

    cases:
      - id: case-1
        when: Shape
        write: |-
          @Injectable() export class AddToCartService { constructor(private readonly commandBus: CommandBus) {} async execute(params: ExecuteParams<AddToCartRequest>): Promise<CartItemEntity> { return this.commandBus.execute(new AddToCartCommand(params)) } }
      - id: case-2
        when: Query variant
        write: |-
          same with QueryBus and new CourseQuery(params)
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-FUNCTION-4
    title: "Resolver: decorate the door, build the envelope"
    kind: mandatory
    requirement: |-
      Resolvers decorate the GraphQL door in the established order, build ExecuteParams, and call only the feature service with no business logic.
    rationale: |

    cases:
      - id: case-1
        when: Method decorators, in this order
        write: |-
          @UseThrottler(ThrottlerConfig.Medium) · @UseGuards(KeycloakAuthGraphQLGuard) · @GraphQLSuccessMessage({ [Locale.En]: "…", [Locale.Vi]: "…" }) · @UseInterceptors(GraphQLTransformInterceptor) · @Mutation(() => AddToCartResponse, { name: "addToCart", description: "…" })
      - id: case-2
        when: Parameters
        write: |-
          @KeycloakGraphQLUser() user: UserEntity, @Args("request", { description: "…" }) request: AddToCartRequest, @GraphQLLocale() locale: Locale
      - id: case-3
        when: Body
        write: |-
          return this.addToCartService.execute({ request, user, locale }) — one call, no logic
      - id: case-4
        when: Return type
        write: |-
          the entity or object the Response.data field declares: Promise<CartItemEntity>
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-FUNCTION-5
    title: Constructor injection
    kind: mandatory
    requirement: |-
      Mandatory: database-owning code injects EntityManager through the named decorator for its actual connection (backed by InjectEntityManager). No injected Repository, public store.manager escape hatch, or substitute storage facade. Instance-scoped code must not inject Core primary. Use the transaction callback manager for every operation in that transaction. Dependencies are private readonly; handlers call super().
    rationale: |-
      2489 private readonly against 26 private without readonly at extraction.
    cases:
      - id: case-1
        when: Required dependency
        write: |-
          constructor(private readonly s3ReadService: S3ReadService, private readonly s3NameResolverService: S3NameResolverService) { super() }
      - id: case-2
        when: Entity manager
        write: |-
          @InjectPrimaryPostgreSQLEntityManager() private readonly entityManager: EntityManager — never a repository (lint must-inject-entity-manager, no-injected-repository)
      - id: case-3
        when: Optional dependency
        write: |-
          @Optional() private readonly mountFilesystemService?: MountFilesystemService
      - id: case-4
        when: Handler
        write: |-
          calls super() because ICQRSHandler is an abstract class
    verification:
      automated:
        - must-inject-entity-manager
        - no-injected-repository
      manual: []
    relatedExamples:
      - graphql-command
      - transactional-service
  - id: BE-FUNCTION-6
    title: Guards, then work, then return
    kind: mandatory
    requirement: |-
      Handlers authenticate and validate before querying or writing; idempotent read-before-write returns existing rows; persistence uses create then save on the injected manager.
    rationale: |

    cases:
      - id: case-1
        when: Authentication
        write: |-
          if (!user) { throw new UserNotFoundException({}) } before any query
      - id: case-2
        when: Existence
        write: |-
          const courseExists = await this.entityManager.exists(CourseEntity, { where: { id: courseId } }); if (!courseExists) { throw new CourseNotFoundException({ id: courseId } })
      - id: case-3
        when: Idempotent read-before-write
        write: |-
          const existing = await this.entityManager.findOne(CartItemEntity, { where: { course: { id: courseId }, user: { id: user.id } } }); if (existing) { return existing }
      - id: case-4
        when: Persist
        write: |-
          const cartItem = this.entityManager.create(CartItemEntity, { user: { id: user.id }, course: { id: courseId } }); return this.entityManager.save(cartItem)
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-FUNCTION-7
    title: Helpers
    kind: mandatory
    requirement: |-
      Shared pure helpers are exported arrow consts with named parameter interfaces; decorator factories use SetMetadata; helpers live beside consumers as .util.ts or under utils/.
    rationale: |-
      245 exported arrow consts against 20 export function under src/modules at extraction.
    cases:
      - id: case-1
        when: Pure mapping shared by two callers
        write: |-
          export const getKpiCurrentValues = (stats: UserStatsResult): Record<KpiKey, number> => ({ [KpiKey.Lessons]: stats.weeklyLessons, … }) in kpi-current.util.ts
      - id: case-2
        when: Decorator factory
        write: |-
          export const GraphQLSuccessMessage = (message: GraphQLSuccessMessage) => SetMetadata(SUCCESS_MESSAGE_METADATA, message)
      - id: case-3
        when: Parameter list
        write: |-
          a named interface, not an inline object (lint no-inline-param-type); single primitive params stay positional
      - id: case-4
        when: Where it lives
        write: |-
          beside its consumer as <name>.util.ts, or under the module's utils/
    verification:
      automated:
        - no-inline-param-type
      manual: []
    relatedExamples:
      - transactional-service
  - id: BE-FUNCTION-8
    title: Module
    kind: mandatory
    requirement: |-
      Units use ConfigurableModuleBuilder in a module-definition file; the module class extends ConfigurableModuleClass and lists providers; parents register via .register({ … }).
    rationale: |

    cases:
      - id: case-1
        when: Definition file
        write: |-
          export const { ConfigurableModuleClass, MODULE_OPTIONS_TOKEN, OPTIONS_TYPE } = new ConfigurableModuleBuilder().setExtras({ isGlobal: false }, (definition, extras) => ({ ...definition, global: extras.isGlobal })).build()
      - id: case-2
        when: Module file
        write: |-
          @Module({ providers: [AddToCartService, AddToCartResolver, AddToCartHandler] }) export class AddToCartSingleMutationModule extends ConfigurableModuleClass {}
      - id: case-3
        when: Registration by the parent
        write: |-
          AddToCartSingleMutationModule.register({ … }) in courses.module.ts
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
