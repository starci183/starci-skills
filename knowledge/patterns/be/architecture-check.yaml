schema: starci/knowledge-source@1
id: be.architecture-check
title: Enforceable backend architecture boundaries
purpose: |-
  Define portable backend responsibility and dependency boundaries independently of monorepo or single-project topology.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-16
  sources:
    - https://docs.nestjs.com/modules
    - https://docs.nestjs.com/cli/monorepo
    - https://www.typescriptlang.org/docs/handbook/modules/reference.html
    - starci-academy-backend@1731b15ba4ed526477e3c572b9d82c31ab64f1d5/apps/**
    - starci-academy-backend@1731b15ba4ed526477e3c572b9d82c31ab64f1d5/src/features/**
    - starci-academy-backend@1731b15ba4ed526477e3c572b9d82c31ab64f1d5/src/modules/**
  limitations: |-
    Static TypeScript dependency analysis does not prove Nest dependency-injection identity, provider scope, runtime registration, transaction boundaries, or business behavior. The selected repository's manifests, tsconfig, installed TypeScript, and resolved package exports remain authority. Reference code contains both useful examples and known dependency debt.
rules:
  - id: BE-ARCHITECTURE-1
    title: Dependency direction follows responsibility
    kind: mandatory
    requirement: |-
      Runtime dependencies point from executable applications to use-case features to cohesive capabilities/modules. A capability/module cannot reach a feature or app, and a feature cannot reach an app, whether the import is relative, aliased, exported through a barrel/package, or a static dynamic-import/require literal.
    rationale: |-
      Capabilities stay reusable when scenarios and executable composition cannot flow back into them. Monorepo, standard, and explicitly bound same-root backend/frontend layouts change build topology, not this dependency direction or the single Work/runtime owner.
    cases:
      - id: case-1
        when: A feature implements an entry scenario or use case
        write: Orchestrate capability/module public APIs and keep transport adapters at the feature boundary.
      - id: case-2
        when: Cohesive domain or infrastructure logic has one consumer
        write: It may still be a module; ownership and responsibility do not require two consumers.
      - id: case-3
        when: An internal alias, relative import, or package export cannot resolve
        write: Treat it as configuration/source failure, not a passing architecture check.
    verification:
      automated:
        - BE_MODULE_IMPORTS_FEATURE
        - BE_MODULE_IMPORTS_APP
        - BE_FEATURE_IMPORTS_APP
        - ARCH_PACKAGE_IMPORTS_APP
        - ARCH_PACKAGE_EXPORT_BYPASS
        - ARCH_INTERNAL_IMPORT_UNRESOLVED
      manual:
        - Confirm a proposed module owns a cohesive capability rather than hiding one feature's scenario orchestration.
    relatedExamples: []
  - id: BE-ARCHITECTURE-2
    title: Apps own bootstrap and composition
    kind: mandatory
    requirement: |-
      An executable app owns process startup, root module assembly, middleware/bootstrap wiring, and narrowly scoped app configuration. Business handlers, services, controllers, resolvers, repositories, and entities live under the owning feature or capability/module. Bootstrap code may call framework APIs and select modules/providers; that exception does not authorize business behavior in apps.
    rationale: |-
      A thin composition root makes startup explicit while keeping product behavior independently testable below it.
    cases:
      - id: case-1
        when: Process entry
        write: Bootstrap the framework, install cross-cutting process adapters, start the app, and handle startup failure.
      - id: case-2
        when: Root dependency composition
        write: Import feature/capability modules and select app-specific providers in the root module.
      - id: case-3
        kind: exception
        when: App-specific config or bootstrap type is required
        write: Use a narrowly named bootstrap/config/env/constants/types file with no business handler or service role.
    verification:
      automated:
        - BE_APP_COMPOSITION_ONLY
        - BE_APP_BUSINESS_ROLE
      manual:
        - Verify app callbacks are startup/composition adapters rather than product use cases moved behind a neutral filename.
    relatedExamples: []
  - id: BE-ARCHITECTURE-3
    title: Modules export explicit capability APIs
    kind: mandatory
    requirement: |-
      A module exports only the providers/contracts consumers need and consumers import the owning module rather than re-registering its providers. Register a truly application-wide stateless/shared module once at the app boundary when appropriate. Do not make named database clients, tenant/workspace instances, request-scoped providers, or differently configured provider instances globally interchangeable.
    rationale: |-
      Nest module exports form the public API, while duplicate direct provider registration can create distinct instances. Global scope is a semantic lifetime decision, not a shortcut for imports.
    cases:
      - id: case-1
        when: Several features need one shared stateless platform capability
        write: Export a narrow module API and, when its identity is intentionally app-wide, register that module once in the app composition root.
      - id: case-2
        when: Providers differ by token, connection, tenant, workspace, request, or configuration
        write: Preserve explicit module imports and provider identities; do not globalize or collapse them.
      - id: case-3
        when: A feature needs a module provider
        write: Import the module that exports it instead of listing the provider again.
    verification:
      automated: []
      manual:
        - Review provider token, scope, configuration, lifetime, and duplicate registration with a meaningful boot/DI test.
    relatedExamples: []
