schema: starci/knowledge-source@1
id: be.architecture-check
title: Enforceable backend architecture boundaries
purpose: |-
  Define the backend responsibility tiers, the one dependency direction between them and the thin application
  composition root. Every rule here is judged by the architecture machine of @starci/hfs, which reads the tiers and the
  direction matrix from knowledge/hfs/slots.yaml and never keeps a path list of its own.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - docs/backend-source-pattern.md
    - https://docs.nestjs.com/modules
    - https://www.typescriptlang.org/docs/handbook/modules/reference.html
  limitations: |-
    Static TypeScript dependency analysis does not prove Nest dependency-injection identity, provider scope, runtime
    registration, transaction boundaries or business behavior. The composition spec that boots the real AppModule and
    the behavior evidence separately prove registration. The selected repository's manifests, tsconfig and resolved
    package exports are the resolution authority.
rules:
  - id: BE-ARCHITECTURE-1
    title: Dependency direction follows the tier matrix
    kind: mandatory
    hfsRules: [R26, R28]
    requirement: |-
      Imports follow one matrix. An app may import features, domain, platform, integrations and packages. A feature may
      import domain, platform, integrations and packages, and never another feature. A domain capability may import
      other domain capabilities (acyclic), platform, integrations and packages. An integration may import platform and
      packages only. A platform capability may import platform (acyclic) and packages only. An `import type`, a
      re-export, a static dynamic-import literal and a package export count exactly like a value import. A type that
      platform and domain both need moves down to platform or is passed through options.
    rationale: |-
      Domain owns invariants, platform is technical runtime, integrations translate providers. Any upward edge makes
      an owner impossible to test or split, and a type-only edge hides a real cycle from the compiler and the linter.
    cases:
      - id: case-1
        when: A feature needs behavior that another feature already has
        write: Move that behavior into a domain capability and let both features import it.
      - id: case-2
        when: A platform module needs a domain enum or entity list
        write: Receive the list through `register(options)` composed by the app, or move the neutral type to platform.
      - id: case-3
        when: A domain capability needs a provider
        write: Import the integration public API. The integration owns its own contract, errors and config; it never imports the domain.
      - id: case-4
        when: An internal alias, relative import or package export cannot resolve
        write: Treat it as a configuration failure, never as a passing check.
    verification:
      automated:
        - BE_TIER_DIRECTION
        - BE_FEATURE_IMPORTS_FEATURE
        - ARCH_PACKAGE_IMPORTS_APP
        - ARCH_PACKAGE_EXPORT_BYPASS
        - ARCH_INTERNAL_IMPORT_UNRESOLVED
        - ARCH_DYNAMIC_DEPENDENCY_UNPROVEN
      manual:
        - Confirm that a proposed shared type belongs to platform or options rather than hiding an upward dependency.
    relatedExamples: []
  - id: BE-ARCHITECTURE-2
    title: Apps own bootstrap and composition only
    kind: mandatory
    hfsRules: [R32, R33]
    requirement: |-
      An app directory `apps/<app>/src` holds `main.ts`, `app.module.ts`, an optional `<app>.options.ts` and the
      required `<app>.composition.spec.ts`. `main.ts` reads the environment once through `EnvSource`, parses every
      capability config into options, calls `AppModule.register(options)`, and handles startup failure. `app.module.ts`
      imports feature transport modules and capability modules, registers `APP_GUARD` and `APP_FILTER`, and holds no
      business handler, service, controller, resolver, repository or entity. The composition spec boots the real
      AppModule with stubbed options and resolves real provider tokens. A process entrypoint (`main.ts`, `bootstrap()`,
      a top-level `void x()`) exists only under `apps/*/src`; migrations run from `apps/migrate`.
    rationale: |-
      A thin composition root makes startup explicit and keeps product behavior independently testable below it.
    cases:
      - id: case-1
        when: Process entry
        write: main.ts reads env, parses options, creates the Nest app from AppModule.register(options), installs process-level adapters, starts, and reports a startup failure with the failing key or module name.
      - id: case-2
        when: Root dependency composition
        write: app.module.ts lists `OrdersHttpModule`, `IdentityModule.register(options.identity)` and the platform modules, plus the APP_GUARD and APP_FILTER providers.
      - id: case-3
        when: A second process kind is needed
        write: Add `apps/worker`, `apps/migrate` or `apps/cli` and declare its kind in hfs.json; never grow the api app.
    verification:
      automated:
        - BE_APP_COMPOSITION_ONLY
        - BE_APP_BUSINESS_ROLE
        - BE_ENTRYPOINT_ONLY_IN_APPS
        - HFS_SLOT_REQUIRED_MISSING
      manual:
        - Verify that the composition spec resolves real tokens and fails when a module is missing.
    relatedExamples: []
  - id: BE-ARCHITECTURE-3
    title: Modules export explicit capability APIs
    kind: mandatory
    hfsRules: [R30, R45]
    requirement: |-
      Each owner (feature, domain capability, platform capability, integration) exposes one `index.ts` with named
      exports only, no `export *`, at most 60 exports, and no repository token or ORM entity type. A consumer imports
      the owning module and never re-registers its provider. `@Global()` is allowed only on `platform/{config,logging,database}`.
      A dynamic module uses `ConfigurableModuleBuilder<Options>` with a real options type and a `static register`. Named
      connections, tenant or workspace instances and request-scoped providers keep distinct tokens and are never made
      globally interchangeable.
    rationale: |-
      Nest exports are the module's public API. A duplicated provider registration creates a second instance, and
      global scope is a lifetime decision, not a shortcut for imports.
    cases:
      - id: case-1
        when: Several features need one shared stateless capability
        write: Export a narrow module API from that capability and import the module in each consumer.
      - id: case-2
        when: Providers differ by connection, tenant or configuration
        write: Keep explicit `register(options)` calls and distinct tokens.
      - id: case-3
        when: A feature needs a provider of another owner
        write: Import the module that exports it and inject it; do not list the provider again.
    verification:
      automated:
        - BE_PUBLIC_SURFACE
        - BE_MODULE_SHAPE
      manual:
        - Review provider token, scope, lifetime and duplicate registration through the composition spec.
    relatedExamples: []
  - id: BE-ARCHITECTURE-4
    title: Application contracts do not depend on transport adapters
    kind: mandatory
    hfsRules: [R29, R37]
    requirement: |-
      Use cases and their plain contracts in `application/` do not import transport DTOs, request or session framework
      context, generated GraphQL types or protocol decorators, and no ORM entity appears in a contract. Transport
      adapters under `transport/<protocol>/` import application contracts and project results. Nest injection alone is
      allowed in `application/`; a namespace alias must not hide a protocol decorator.
    rationale: |-
      Several protocols reuse one scenario only when its contract depends on none of their request or response shapes.
    cases:
      - id: case-1
        when: A use case needs the caller
        write: Accept a principal (id and role) in a plain contract; never a request object, token or ORM user.
      - id: case-2
        when: A result reaches a resolver
        write: The resolver maps the plain result to its output type in `<action>.mapper.ts` when the conversion has substance.
    verification:
      automated:
        - BE_APPLICATION_IMPORTS_TRANSPORT
        - BE_APPLICATION_TRANSPORT_FRAMEWORK
        - BE_ENTITY_IN_CONTRACT
      manual:
        - Check generated wire types and same-source public API leaks outside recognizable configured paths.
    relatedExamples: []
  - id: BE-ARCHITECTURE-5
    title: Owners form an acyclic graph and every feature is composed
    kind: mandatory
    hfsRules: [R27, R31]
    requirement: |-
      No cycle exists between owners at any tier, and `import type` edges are part of the graph. Every feature and every
      transport module is imported by at least one app. Code that no app composes never runs, so it is a finding even
      when its specs pass.
    rationale: |-
      A cycle prevents separate testing and splitting, and an uncomposed feature is dead code that still looks
      finished.
    cases:
      - id: case-1
        when: Two capabilities need each other
        write: Extract the shared contract into a third capability or into platform, and make both depend on it.
      - id: case-2
        when: A new feature is added
        write: Add its transport modules to the app that serves it in the same change and extend the composition spec.
    verification:
      automated:
        - ARCH_OWNER_CYCLE
        - BE_FEATURE_NOT_COMPOSED
      manual:
        - Confirm the app that composes a feature is the one that should serve it.
    relatedExamples: []
