schema: starci/knowledge-source@1
id: repo.secrets
title: Repository secrets
purpose: |
  Given a secret, where does it live, who may open it and how does it reach a process? Sealed only at
  `.starcistacks/<env>/secrets/<slug>.enc`, opened only by the owner or by a process at run time.
appliesTo:
  - backend
  - frontend
family: repo
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [repo.plaintext-env, app.sops, app.plaintext-env]
provenance:
  reviewedAt: 2026-10-14
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/application-stacks.yaml
    - modules/schemas/work-resource.schema.yaml
    - https://github.com/getsops/sops
  limitations: |
    Owner ruling 2026-10-14: `starci app secret init` records the project's public age recipient in `.sops.yaml` and keeps
    the private identity only in untracked host-local `.claude/secret.env` as `SOPS_AGE_KEY`. Existing recipient rules are retained;
    sharing an identity across projects does not provide key isolation. Agents never expose secret values or private keys.
rules:
  - id: REPO-SECRETS-1
    title: One sealed location
    kind: mandatory
    hfsRules: [R06, R09, R10, R277]
    requirement: |
      A sealed secret exists only as a sops `*.enc` file at `.starcistacks/<env>/secrets/<slug>.enc`. No `*.enc` exists
      anywhere else in the app, and none exists under `.starciwork`. `.sops.yaml` is required at the app root; neither side holds one.
      The front end holds no secret; anything it needs at runtime is public configuration read by `modules/config`.
    rationale: |
      One location makes custody auditable and lets a scanner refuse every other place a secret could hide.
    cases:
      - id: case-1
        when: A database password
        write: .starcistacks/dev/secrets/orders-db-password.enc
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
        - HFS_IDENTITY_CUSTODY
        - SEALED_CUSTODY_LOCATION
        - SEALED_FILE_IN_WORK
        - HFS_STACKS_SHAPE
        - HFS_SECRET_PLAINTEXT_FILE
        - HFS_SECRET_OUTSIDE_ENC
      manual: []
    relatedExamples: []
  - id: REPO-SECRETS-2
    title: Plaintext never enters the tree
    kind: mandatory
    hfsRules: [R06, R277]
    requirement: |
      `.env`, `.env.*`, `secrets.env`, `.secrets/`, `*.pem`, `*.key` and `runtime/files/*` do not exist in the working tree, ignored or not. A
      decrypted value lives only in memory or under `%LOCALAPPDATA%/StarCi/secrets/<project>/<env>/` and is passed to a process
      by a `*_FILE` variable that `platform/config` `EnvSource` resolves. On macOS the base is `~/Library/Application Support`;
      on Linux it is `$XDG_DATA_HOME` (default `~/.local/share`). The key inventory is
      `.starcistacks/<env>/runtime/env/KEYS.md`, which lists slug names only.
    rationale: |
      A name in .gitignore does not make plaintext safe: caches, worktrees and agent context still see it.
    cases:
      - id: case-1
        when: A process needs a secret
        write: The launcher exports ORDERS_DB_PASSWORD_FILE pointing at the decrypted file outside the app.
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
        - HFS_SECRET_PLAINTEXT_FILE
        - HFS_SECRET_OUTSIDE_ENC
      manual: []
    relatedExamples: []
  - id: REPO-SECRETS-3
    title: Agents never touch values or keys
    kind: mandatory
    hfsRules: [R06]
    requirement: |
      An agent never reads, prints or commits a secret value, never opens an `*.enc` file, and never generates or rotates a key.
      Sealing a new secret and any key operation is performed by the owner. A workflow that needs a secret asks the owner
      through its ask surface and continues when the sealed file exists.
    rationale: |
      A value that enters an agent's context can leak into a log, a prompt or a commit.
    cases:
      - id: case-1
        when: A missing secret
        write: Report the slug and path that must be sealed and wait; never invent a value.
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
      manual:
        - Confirm no value appears in a log, a report or a commit.
    relatedExamples: []
  - id: REPO-SECRETS-4
    title: The recipient truth is documented
    kind: mandatory
    hfsRules: [R10, R253]
    requirement: |
      The stack text describes the actual age recipients in the project's root `.sops.yaml`; it never assumes a shared master
      recipient. The owner runs `starci app secret init` to create or reuse an external identity and set the sealed-location
      custody rule. The identity lives only as `SOPS_AGE_KEY` in the untracked host-local `.claude/secret.env`.
      The private key reaches sops through its child environment, never an argument
      or printed output. The identity stays outside Git and
      the owner backs it up in a protected key store. Existing recipients are preserved; decryption requires their matching
      identity. CI obtains that identity from its secret store, never from a committed key or a newly generated substitute.
      The scaffolded `env-source.config.ts`, `origin.guard.ts` and `webhook-signature.service.ts` remain byte-identical to
      their canon templates; changes to these custody-sensitive implementations belong to the runtime template owner.
    rationale: |
      The recipient policy and key custody must match the configured encryption, so operators can recover the right identity
      without relying on an isolation claim that the selected recipients do not provide.
    cases: []
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_AGE_KEY_CUSTODY
        - HFS_CANON_COPY_DRIFT
      manual:
        - Compare the recipient statement with .sops.yaml.
    relatedExamples: []
  - id: REPO-SECRETS-5
    title: Typed readers and sealed key names agree
    kind: mandatory
    hfsRules: [R248, R249]
    requirement: |
      Compare the key names read by each typed `<app>.env.ts` and capability `*.config.ts` reader with the sealed members,
      the key inventory and the stack's declared variables. Each required key is sealed or declared, every sealed key has
      a reader or declared consumer, and one key occurs in only one sealed member. Public `NEXT_PUBLIC_*` keys are never
      sealed, and each key in an environment example has a reader. Keep these contracts equal in lite and full.
      The owner runs `starci app secret verify <env>` to check stored values in memory against the reader's declared
      integer, boolean, absolute URL, duration, enum or nonempty string/secret shape. Concrete environment-example values
      obey the same shape. Verification reports the key and violated shape without displaying any value.
    rationale: |
      A sealed inventory that matches the typed readers catches missing deployment inputs and obsolete secrets before boot.
    cases:
      - id: case-1
        when: A typed reader requires a new secret
        write: Declare its key and consumer, have the owner seal it in one member, then verify its declared shape.
    verification:
      automated:
        - ENV_REQUIRED_UNSET
        - ENV_SEALED_UNREAD
        - ENV_DUPLICATE
        - ENV_PUBLIC_SEALED
        - ENV_EXAMPLE_DRIFT
        - ENV_VALUE_SHAPE
      manual: []
    relatedExamples: []
  - id: REPO-SECRETS-6
    title: Executable scripts preserve custody
    kind: mandatory
    hfsRules: [R252]
    requirement: |
      Scripts and workflow commands never source plaintext secret dotenv files or home-directory credential files,
      enable shell xtrace or request `--reveal`. They use the sealed-secret materialization contract. Service-role
      references belong only to the back-end Supabase integration, never a deployment script or another source owner.
    rationale: |
      A safe sealed file loses its custody guarantee when a launcher loads an unmanaged copy or exposes it in a trace.
    cases: []
    verification:
      automated:
        - HFS_SCRIPT_PLAINTEXT_LOAD
        - HFS_SCRIPT_XTRACE
        - HFS_SERVICE_ROLE_SCOPE
      manual: []
    relatedExamples: []
