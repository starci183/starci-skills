schema: starci/knowledge-source@1
id: repo.secrets
title: Repository secrets
purpose: |
  Given a secret, where does it live, who may open it and how does it reach a process? Sealed only at
  `.starcistacks/<env>/secrets/<slug>.enc`, opened only by the owner or by a process at run time.
appliesTo:
  - backend
  - frontend
family: repo
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/application-stacks.yaml
    - modules/schemas/work-resource.schema.yaml
    - https://github.com/getsops/sops
  limitations: |
    Today the truth is one shared master age key for every project. Per-project recipients are an owner key operation and are
    recorded as a follow-up; agents never generate, rotate or read keys or values.
rules:
  - id: REPO-SECRETS-1
    title: One sealed location
    kind: mandatory
    hfsRules: [R06, R09]
    requirement: |
      A sealed secret exists only as a sops `*.enc` file at `.starcistacks/<env>/secrets/<slug>.enc`. No `*.enc` exists anywhere
      else, and none exists under `.starciwork`. `.sops.yaml` is required in the backend repository and forbidden in a frontend
      repository. A frontend holds no secret; anything it needs at runtime is public configuration read by `modules/config`.
    rationale: |
      One location makes custody auditable and lets a scanner refuse every other place a secret could hide.
    cases:
      - id: case-1
        when: A database password
        write: .starcistacks/dev/secrets/orders-db-password.enc
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
        - HFS_STACKS_SHAPE
        - HFS_IDENTITY_CUSTODY
      manual: []
    relatedExamples: []
  - id: REPO-SECRETS-2
    title: Plaintext never enters the tree
    kind: mandatory
    hfsRules: [R06]
    requirement: |
      `.env`, `.env.*`, `.secrets/`, `*.pem`, `*.key` and `runtime/files/*` do not exist in the working tree, ignored or not. A
      decrypted value lives only in memory or under `%LOCALAPPDATA%/StarCi/secrets/<project>/<env>/` and is passed to a process
      by a `*_FILE` variable that `platform/config` `EnvSource` resolves. The key inventory is
      `.starcistacks/<env>/runtime/env/KEYS.md`, which lists slug names only.
    rationale: |
      A name in .gitignore does not make plaintext safe: caches, worktrees and agent context still see it.
    cases:
      - id: case-1
        when: A process needs a secret
        write: The launcher exports ORDERS_DB_PASSWORD_FILE pointing at the decrypted file outside the repository.
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
      manual: []
    relatedExamples: []
  - id: REPO-SECRETS-3
    title: Agents never touch values or keys
    kind: mandatory
    hfsRules: [R06]
    requirement: |
      An agent never reads, prints or commits a secret value, never opens an `*.enc` file, and never generates or rotates a key.
      Sealing a new secret and any key operation is performed by the owner. A workflow that needs a secret asks the owner
      through its ask surface and continues when the sealed file exists.
    rationale: |
      A value that enters an agent's context can leak into a log, a prompt or a commit.
    cases:
      - id: case-1
        when: A missing secret
        write: Report the slug and path that must be sealed and wait; never invent a value.
    verification:
      automated:
        - HFS_PLAINTEXT_SECRET
      manual:
        - Confirm no value appears in a log, a report or a commit.
    relatedExamples: []
  - id: REPO-SECRETS-4
    title: The recipient truth is documented
    kind: mandatory
    hfsRules: [R10]
    requirement: |
      The stack text states what the code does: one shared master age key is the recipient for every project today. Per-project
      recipients are recorded as an owner follow-up, not described as existing.
    rationale: |
      A document that promises isolation the key does not provide misleads whoever relies on it.
    cases: []
    verification:
      automated: []
      manual:
        - Compare the recipient statement with .sops.yaml.
    relatedExamples: []
