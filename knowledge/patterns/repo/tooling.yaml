schema: starci/knowledge-source@1
id: repo.tooling
title: Repository tooling
purpose: |
  Given a tool configuration in an app (ESLint, TypeScript, Jest, stylelint, Prettier, husky, CI, Sonar), who owns its content? `.claude` owns it. The
  app root and each side (`be/`, `fe/`) hold a thin call into a `.claude` package, or a file that `hfs sync` (run at the app root)
  generates and hash-checks.
appliesTo:
  - backend
  - frontend
family: repo
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [be.tool-config, be.tool-config-local, be.nest-cli, fe.tool-config, fe.tool-config-local, repo.side-root-forbidden, app.declaration, app.package-manifest, app.tool-config, app.format-config, app.tool-config-local, app.quality-config, app.hooks, app.ci, app.scripts]
provenance:
  reviewedAt: 2026-10-01
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/canon-pins.yaml
    - packages/hfs/templates
    - packages/tsconfig
    - packages/prettier-config
    - packages/jest-preset
  limitations: |
    A managed file equal to its render proves the template was applied. It does not prove that a tool runs in the gate the
    rule names; the gate definitions and the CI run prove that.
rules:
  - id: REPO-TOOLING-1
    title: Configs are thin calls into canon packages
    kind: mandatory
    hfsRules: [R16, R22, R05, R103]
    requirement: |
      `be/eslint.config.mjs` calls `starciBeConfig({ hfs: loadHfs(import.meta.url) })` and `fe/eslint.config.mjs`
      `starciFeConfig({ hfs: loadHfs(import.meta.url) })`. `be/tsconfig.json` extends `@starci/tsconfig/be.json` and adds its three
      `paths` (`@features/*`, `@modules/*`, `@tests/*`); `fe/tsconfig.json` extends `@starci/tsconfig/next.json` and adds nothing;
      the `src/tests/tsconfig.json` of `be.tool-config` extends `be/tsconfig.json` and `@starci/tsconfig/e2e.json`, and the
      `jest.config.js` of `be.tool-config` calls `starciJestConfig()` of `@starci/jest-preset`. `fe/stylelint.config.mjs` calls
      `starciStylelintConfig({ appTokens: loadAppTokens(import.meta.url) })` of `@starci/stylelint-canon`, and the root `.prettierrc`
      is the string `@starci/prettier-config`. All of these are rendered by `hfs sync` and compared by `hfs check` (R05, R17, R22);
      only `fe/turbo.json` is the app's own. The app root holds no tsconfig, eslint, stylelint or jest configuration. An app
      defines no local rule, plugin, override, disabled rule or architecture script, keeps no tool configuration key in a
      `package.json`, and copies no canon config.
    rationale: |
      Three copies of an ESLint config are three standards. One package makes every app answer to the same rules.
    cases:
      - id: case-1
        when: The ESLint config
        write: 'be/eslint.config.mjs: import { loadHfs, starciBeConfig } from "@starci/eslint-canon-be"; export default starciBeConfig({ hfs: loadHfs(import.meta.url) })'
      - id: case-2
        when: The TypeScript config
        write: 'be/tsconfig.json: { "extends": "@starci/tsconfig/be.json", "compilerOptions": { "paths": { "@modules/*": ["./src/modules/*"] } } }'
    verification:
      automated:
        - HFS_TOOL_CONFIG_LOCAL
        - HFS_TS_STRICT
        - FE_TYPE_ESCAPE
        - HFS_MANAGED_FILE_DRIFT
        - HFS_REPO_LOCAL_CHECK
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-2
    title: Generated files come from hfs sync
    kind: mandatory
    hfsRules: [R04, R05, R11]
    requirement: |
      Files that cannot extend a package are rendered by `hfs sync --write` at the app root from the templates in
      `packages/hfs/templates/` and hash-checked: the managed `app.*` slots — `app.hooks`, `app.ci` and the optional
      `app.ci-e2e`, the managed block of `app.git-meta`, `app.quality-config`, `app.format-config` — and
      the `scripts` block of `app.package-manifest`, plus each side's tool configuration (REPO-TOOLING-1). The managed list is the
      `managedBy` slots of `slots.yaml`. `.sops.yaml`, `.starcistacks/application-stacks.yaml` and `be/nest-cli.json` are written once by `hfs scaffold app` and are
      the app's own afterwards. Any difference from the render is a finding; the fix is to run `hfs sync --write`, never to
      edit the file. A template change is a change in `.claude`, after which each app moves to the new `@starci/hfs` pin.
    rationale: |
      A hand-edited hook or workflow drifts, and drift is how a gate stops running.
    cases:
      - id: case-1
        when: A workflow must change
        write: Change the template in .claude, publish @starci/hfs at a new pin, then run hfs sync --write in each app.
    verification:
      automated:
        - HFS_GITIGNORE_BLOCK_DRIFT
        - HFS_MANAGED_FILE_DRIFT
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-3
    title: The same machine at every gate
    kind: mandatory
    hfsRules: [R13, R24]
    requirement: |
      Pre-commit, pre-push, the op gate (`scripts/gates/gate.mjs`, which runs `hfs lint --changed` at the app root), the
      Kernel's landing and CI run the same `@starci/hfs` at the version pinned in `canon-pins.yaml`. CI runs `npm run lint`
      (`hfs lint`, which includes the app check); pre-push runs `typecheck`, `lint` and `format:check`. There is no rule only
      agents can run. Every `@starci/*` package is installed from the npm registry at the pinned version.
    rationale: |
      An app that is green under an old rule while the agent grades it under a new rule wastes every cycle.
    cases:
      - id: case-1
        when: CI
        write: The managed ci.yml runs `npm ci`, then `npm run lint -- --sonar reports/lint.sonar.json` at the app root.
    verification:
      automated:
        - HFS_CI_MISSING_CANON
        - HFS_HOOKS_PATH_REDIRECTED
        - HFS_ARCH_CONFIG_UNREAD
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-4
    title: No inline configuration and no rule off
    kind: mandatory
    hfsRules: [R17, R18, R104]
    requirement: |
      `noInlineConfig` is true in both ESLint factories: no `eslint-disable`, no `@ts-ignore`, no `@ts-expect-error`. The ESLint
      configuration of each side is the rendered one-liner; no rule is off, warned or redefined, and a rule that a check
      supersedes is removed from the canon plugin in the .claude runtime, never switched off in an app.
    rationale: |
      A rule declared covered by a check that no gate runs is a rule that does not exist.
    cases:
      - id: case-1
        when: A rule seems wrong for the app
        write: Propose the change in the .claude runtime; any edit of be/eslint.config.mjs or fe/eslint.config.mjs fails HFS_RULE_OFF_WITHOUT_REPLACEMENT.
    verification:
      automated:
        - HFS_RULE_OFF_WITHOUT_REPLACEMENT
        - HFS_INLINE_SUPPRESSION
        - HFS_LINT_SUPPRESSION_FILE
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-5
    title: Caches and outputs are redirected by the presets
    kind: mandatory
    hfsRules: [R03]
    requirement: |
      The canon presets set every tool's cache and working directory outside the app (`eslint --cache-location`, jest
      `cacheDirectory`, turbo `cacheDir`, `sonar.working.directory`) under `%LOCALAPPDATA%/StarCi/cache/<repo>/<tool>/`. No cache
      folder exists in the working tree. Build output stays ignored and in place.
    rationale: |
      A cache in the tree is untracked noise that agents and reviewers must keep ignoring.
    cases: []
    verification:
      automated:
        - HFS_UNTRACKED_ROOT_ENTRY
        - HFS_EMPTY_DIR
        - HFS_GHOST_TREE
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-6
    title: Integration, e2e and contract are outside the automatic gates
    kind: mandatory
    hfsRules: [R12, R47, R97]
    requirement: |
      No integration, e2e or contract spec, test world or e2e-only dependency joins husky, lint-staged, the default typecheck,
      coverage, or an automatic CI trigger. The root `typecheck:tests` (`tsc -p be/src/tests/tsconfig.json`) runs first in
      `test:integration`, `test:e2e` and `test:contract`, which run jest from `be/`. `lint` lints the back-end e2e trees in its
      ESLint run (linting is not running e2e). A kept e2e workflow is `workflow_dispatch` only. The front end has no tests at
      all (FE_NO_TESTS): no e2e script, config or workflow under `fe/`.
    rationale: |
      These suites are slow and environment-bound, but their code must not rot, so their type check is a separate manual gate.
    cases: []
    verification:
      automated:
        - HFS_E2E_IN_AUTOMATIC_GATE
        - BE_TEST_TOPOLOGY
        - BE_CONTRACT_UNGUARDED
        - FE_NO_TESTS
      manual: []
    relatedExamples: []
