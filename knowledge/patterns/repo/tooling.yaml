schema: starci/knowledge-source@1
id: repo.tooling
title: Repository tooling
purpose: |
  Given a tool configuration in a repository (ESLint, TypeScript, Jest, stylelint, husky, CI, Sonar,
  Codecov), who owns its content? `.claude` owns it. A repository holds a thin call into a `.claude` package, or a file that
  `hfs sync` generates and hash-checks.
appliesTo:
  - backend
  - frontend
family: repo
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/canon-pins.yaml
    - packages/tsconfig
    - packages/prettier-config
    - packages/jest-preset
  limitations: |
    A managed file equal to its render proves the template was applied. It does not prove that a tool runs in the gate the
    rule names; the gate definitions and the CI run prove that.
rules:
  - id: REPO-TOOLING-1
    title: Configs are thin calls into canon packages
    kind: mandatory
    hfsRules: [R16, R22]
    requirement: |
      `eslint.config.mjs` calls `starciBeConfig({ hfs })` or `starciFeConfig({ hfs })`. `tsconfig.json` extends
      `@starci/tsconfig/{be,next}.json` (a back end adds its three `paths`, a front end adds nothing); a back end's `src/tests/tsconfig.json`
      extends `@starci/tsconfig/e2e.json`. The jest config calls `@starci/jest-preset`, `stylelint.config.mjs` `starciStylelintConfig({ appTokens: loadAppTokens(import.meta.url) })`
      of `@starci/stylelint-canon`, and the Prettier config is the `.prettierrc` string `@starci/prettier-config`. All of these are
      rendered by `hfs sync` and compared by `hfs check` (R05, R17, R22); only `turbo.json` is the repository's own. A repository defines no local rule, plugin,
      override, disabled rule or architecture script, keeps no tool configuration key in `package.json`, and copies no canon config.
    rationale: |
      Three copies of an ESLint config are three standards. One package makes every repository answer to the same rules.
    cases:
      - id: case-1
        when: The ESLint config
        write: 'import { starciBeConfig } from "@starci/eslint-canon-be"; export default starciBeConfig({ hfs: "./hfs.json" })'
      - id: case-2
        when: The TypeScript config
        write: '{ "extends": "@starci/tsconfig/be.json", "compilerOptions": { "paths": { "@modules/*": ["src/modules/*"] } } }'
    verification:
      automated:
        - HFS_TOOL_CONFIG_LOCAL
        - HFS_MANAGED_FILE_DRIFT
        - HFS_TS_STRICT
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-2
    title: Generated files come from hfs sync
    kind: mandatory
    hfsRules: [R04, R05, R11]
    requirement: |
      Files that cannot extend a package are rendered by `hfs sync` from templates in `.claude` and hash-checked: `.husky/`,
      `.github/workflows/ci.yml` (and the optional `e2e.yml`), the managed block of `.gitignore`, `sonar-project.properties`,
      `codecov.yml`, `.sops.yaml`. Any difference from the render is a finding; the fix is to run `hfs sync`, never to edit the
      file. A template change is a change in `.claude`, after which `hfs sync` updates the repositories.
    rationale: |
      A hand-edited hook or workflow drifts, and drift is how a gate stops running.
    cases:
      - id: case-1
        when: A workflow must change
        write: Change the template in .claude and run hfs sync in each repository.
    verification:
      automated:
        - HFS_MANAGED_FILE_DRIFT
        - HFS_GITIGNORE_BLOCK_DRIFT
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-3
    title: The same machine at every gate
    kind: mandatory
    hfsRules: [R13, R24]
    requirement: |
      Pre-commit, pre-push, op settle, land gate and CI run the same `@starci/hfs` at the version pinned in
      `canon-pins.yaml`. CI runs `npx @starci/hfs check`; pre-push runs `typecheck`, `lint:check` and `hfs check --fast`. There is
      no rule only agents can run. Every `@starci/*` package is installed from the npm registry at the pinned version.
    rationale: |
      A repository that is green under an old rule while the agent grades it under a new rule wastes every cycle.
    cases:
      - id: case-1
        when: CI
        write: A step `npx @starci/hfs check` runs after install with the pinned version.
    verification:
      automated:
        - HFS_CI_MISSING_CANON
        - HFS_ARCH_CONFIG_UNREAD
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-4
    title: No inline configuration and no rule off
    kind: mandatory
    hfsRules: [R17, R18]
    requirement: |
      `noInlineConfig` is true in both ESLint factories: no `eslint-disable`, no `@ts-ignore`, no `@ts-expect-error`. The ESLint
      configuration of a repository is the rendered one-liner; no rule is off, warned or redefined, and a rule that a check
      supersedes is removed from the canon plugin in the .claude runtime, never switched off in a repository.
    rationale: |
      A rule declared covered by a check that no gate runs is a rule that does not exist.
    cases:
      - id: case-1
        when: A rule seems wrong for the repository
        write: Propose the change in the .claude runtime; any edit of eslint.config.mjs fails HFS_RULE_OFF_WITHOUT_REPLACEMENT.
    verification:
      automated:
        - HFS_RULE_OFF_WITHOUT_REPLACEMENT
        - HFS_INLINE_SUPPRESSION
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-5
    title: Caches and outputs are redirected by the presets
    kind: mandatory
    hfsRules: [R03]
    requirement: |
      The canon presets set every tool's cache and working directory outside the repository (`eslint --cache-location`, jest
      `cacheDirectory`, turbo `cacheDir`, `sonar.working.directory`) under `%LOCALAPPDATA%/StarCi/cache/<repo>/<tool>/`. No cache
      folder exists in the working tree. Build output stays ignored and in place.
    rationale: |
      A cache in the tree is untracked noise that agents and reviewers must keep ignoring.
    cases: []
    verification:
      automated:
        - HFS_UNTRACKED_ROOT_ENTRY
      manual: []
    relatedExamples: []
  - id: REPO-TOOLING-6
    title: Integration, e2e and contract are outside the automatic gates
    kind: mandatory
    hfsRules: [R12]
    requirement: |
      No integration, e2e or contract spec, test world or e2e-only dependency joins husky, lint-staged, the default typecheck,
      or coverage, or an automatic CI trigger. A back end has `typecheck:tests` (`src/tests/tsconfig.json`) and its
      `test:integration`, `test:e2e` and `test:contract` run it first; a front end has no e2e script, config or workflow.
      `lint:check` lints the back-end e2e trees in its one ESLint run (linting is not running e2e). A kept e2e workflow is
      `workflow_dispatch` only. A front end has no tests at all (FE_NO_TESTS).
    rationale: |
      These suites are slow and environment-bound, but their code must not rot, so their type check is a separate manual gate.
    cases: []
    verification:
      automated:
        - HFS_E2E_IN_AUTOMATIC_GATE
        - BE_TEST_TOPOLOGY
        - FE_NO_TESTS
      manual: []
    relatedExamples: []
