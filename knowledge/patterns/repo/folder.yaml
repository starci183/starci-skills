schema: starci/knowledge-source@1
id: repo.folder
title: Repository folder
purpose: |
  The one standard repository tree (HFS) for every StarCi repository: which entries the repository root may carry, where
  application source lives, which roots are backend-only, what is ignored, what may not exist in the working tree at all, and
  the one package manager. knowledge/hfs/README.md section 4 draws the same map; knowledge/hfs/slots.yaml is the machine form;
  the BE and FE pattern topics own the source rules inside it.
appliesTo:
  - backend
  - frontend
family: repo
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - docs/source-layout.md
    - docs/backend-source-pattern.md
    - docs/architecture-rules.md
  limitations: |
    The tree law governs entries and top-level placement only; it does not certify a repository's contents, behavior or
    deployment. Record shape inside .starciwork stays with modules/schemas/work-layout.yaml; stack declaration shape stays
    with knowledge/application-stacks.yaml and scripts/checks/check-starcistacks.mjs.
rules:
  - id: REPO-FOLDER-1
    title: Every tracked path has a slot
    kind: mandatory
    hfsRules: [R01, R02, R24]
    requirement: |
      Every tracked path of a repository matches exactly one slot of knowledge/hfs/slots.yaml. A repository declares itself in
      `hfs.json` (`hfs` major, `profile`, `project`, `apps` with kinds, `optionalSlots`, `connections`) and nothing else; there
      is no owner list, path, allowlist or disabled rule. Required on both profiles: README.md, hfs.json, package.json,
      package-lock.json, .gitignore, .gitattributes, tsconfig.json, eslint.config.mjs, .editorconfig, .nvmrc,
      .prettierignore, sonar-project.properties, codecov.yml, .husky/, .github/workflows/ci.yml and apps/. Optional: packages/
      (built packages with explicit exports), scripts/ (lasting tooling only, `*.mjs`, no product code and no one-off codemod),
      docs/{adr,runbooks,guides}/ (opt-in), .npmrc, .dockerignore, apps/<app>/Dockerfile. A backend repository additionally
      requires src/, nest-cli.json, jest.config.js, .starciwork/, .starcistacks/ and .sops.yaml, and forbids a root e2e/. A
      frontend repository allows vitest, Playwright and turbo config and a root e2e/, and forbids src/, .starciwork/,
      .starcistacks/ and .sops.yaml. Anything else at the root moves to its owner: infrastructure, compose, docker and
      environment templates, seeds and database init to `.starcistacks/<env>/`; migrations to the owning capability's
      `persistence/`; product docs and workflow notes to `.starciwork` records or `docs/`; code generators to `scripts/` or a
      real `packages/<pkg>`. A missing hfs.json, or a run that analysed zero files, is a failure.
    rationale: |
      One closed contract makes every repository machine-checkable and leaves no unnamed place for output, second layouts or
      drifting metadata to collect. Growth adds a slot; it never edits one.
    cases:
      - id: case-1
        when: A new kind of content is needed
        write: Propose a new slot (minor version); do not add a tolerated exception.
      - id: case-2
        when: A file matches no slot
        write: Move it to its owner or delete it; HFS_SLOT_UNDECLARED names the path.
    verification:
      automated:
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_REQUIRED_MISSING
        - HFS_ARCH_CONFIG_UNREAD
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_ENTRY_MISSING
        - HFS_ROOT_MARKDOWN_FORBIDDEN
      manual:
        - Judge each leftover root entry by its owner and move it, never by tolerating a new root name.
    relatedExamples: []
  - id: REPO-FOLDER-2
    title: apps/<app> is the only application root
    kind: mandatory
    hfsRules: [R01, R32, R33, R64]
    requirement: |
      Every repository, backend and frontend, is an apps/<app>/ monorepo even with one application; a single-app repository
      names the app by its role (for example web). A backend app's composition lives in apps/<app>/src (main.ts, app.module.ts,
      optional <app>.options.ts and the required <app>.composition.spec.ts) and nothing else; shared backend source lives in
      src/features and src/modules. A frontend app carries its own package.json, next.config.ts, tsconfig.json and
      postcss.config.mjs in apps/<app>/, and all product source sits under apps/<app>/src; a frontend repository has no root
      src/. Apps never import each other. There is one topology for every repository.
    rationale: |
      One topology removes the layout fork that lets per-project roots drift and keeps every app's source root addressable by
      the same FE and BE rules.
    cases:
      - id: case-1
        when: A repository with one application
        write: apps/web/ for a frontend or apps/api/ for a backend, never a root src/ alone.
    verification:
      automated:
        - HFS_APPS_REQUIRED
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_APP_LAYOUT_INVALID
        - FE_APP_ISOLATION
      manual:
        - Confirm apps/<app> holds composition and config only and product source has a named owner.
    relatedExamples: []
  - id: REPO-FOLDER-3
    title: npm is the only package manager
    kind: mandatory
    hfsRules: [R14]
    requirement: |
      package.json plus package-lock.json and npm ci or npm install are the only package-management contract. `packageManager`,
      when declared, names npm. pnpm-lock.yaml, pnpm-workspace.yaml, yarn.lock, bun.lock, bun.lockb and any other manager's
      lockfile or workspace file do not exist in the repository. package.json declares npm workspaces
      (`"workspaces": ["apps/*", "packages/*"]`) whenever the repository holds more than one package.
    rationale: |
      Two lockfiles disagree silently and hide the real dependency resolution a build ran against.
    cases:
      - id: case-1
        when: A workspace repository
        write: 'package.json has "workspaces": ["apps/*", "packages/*"] and one root package-lock.json.'
    verification:
      automated:
        - HFS_PACKAGE_MANAGER_MIXED
        - HFS_DEP_VERSION_SKEW
      manual:
        - Confirm package.json packageManager names npm and the lockfile is the one CI installs.
    relatedExamples: []
  - id: REPO-FOLDER-4
    title: .starciwork and .starcistacks live only in the backend repository
    kind: mandatory
    hfsRules: [R07, R10]
    requirement: |
      .starciwork/, .starcistacks/ and .sops.yaml are required in the project's backend repository and forbidden in a
      frontend repository; the frontend consumes the same records and never copies them. See starciwork.yaml and
      starcistacks.yaml for their contents.
    rationale: |
      One canonical Work tree per project keeps product records authoritative, and deployment custody is backend-owned.
    cases:
      - id: case-1
        when: A frontend needs a product record
        write: Read it from the backend repository through the project binding; do not copy it.
    verification:
      automated:
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_FE
      manual:
        - node scripts/checks/work-validate.mjs <repo>/.starciwork passes on the backend tree.
        - node scripts/checks/check-starcistacks.mjs <repo> exits 0 on the backend tree.
    relatedExamples: []
  - id: REPO-FOLDER-5
    title: Storage states, ignored and external
    kind: mandatory
    hfsRules: [R03, R06, R07]
    requirement: |
      Content is `tracked`, `ignored` or `external`. Ignored, and only ignored, are the tool build outputs that must exist in
      place: node_modules, dist, .next, coverage, test-results, playwright-report, next-env.d.ts, *.tsbuildinfo, and generated
      code (`__generated__/`, Nest schema.gql) produced by `codegen`. External, meaning they must not exist in the working
      tree at all, are: tool caches (.eslintcache, .turbo, .scannerwork, .jest-cache, .cache, .tools), which the canon presets
      redirect to %LOCALAPPDATA%/StarCi/cache/<repo>/<tool>/; worktrees (.worktrees, worktrees), which live under
      D:/starci-lanes/<project>/<lane>/; agent output (report*.json, *.tmp.json, %*% names, nul, .artifacts, .tmp-*,
      *-lint.json, design-plans/, draw rounds, UAT captures), which lives in the scratchpad or the blob store and is cited by
      `{name, sha256}`; and plaintext secrets (.env*, .secrets/, *.pem, runtime/files/*). An entry that is ignored but must be
      external is still a finding.
    rationale: |
      Evidence and caches change every run, bloat history and are reviewed by nobody; a name in .gitignore does not make a
      secret or a cache safe to keep in the tree.
    cases:
      - id: case-1
        when: An agent produces a report
        write: Write it to the scratchpad and cite it by hash; never at the repository root.
      - id: case-2
        when: A tool wants a cache directory
        write: Configure it through the canon preset so it points outside the repository.
    verification:
      automated:
        - HFS_UNTRACKED_ROOT_ENTRY
        - HFS_GITIGNORE_BLOCK_DRIFT
        - HFS_AGENT_DATA_TRACKED
        - HFS_PLAINTEXT_SECRET
      manual:
        - Confirm git status is clean with no untracked entry outside an ignored slot.
    relatedExamples: []
  - id: REPO-FOLDER-6
    title: Repository README and GitHub presentation
    kind: mandatory
    hfsRules: [R05]
    requirement: |
      README.md starts with the repository name as its level-one heading and one concise description line. Its standard
      sections, in order, are Overview, Stack, Repository layout (the HFS map), and Development (install, typecheck, lint,
      build and test commands). When .starciwork is present, add a Work section pointing readers at that product record tree.
      Other sections may follow. Badges represent live external services only. Do not publish a badge for a local or private
      SonarQube instance or any README URL pointing at localhost, loopback, RFC1918 or private hosts. Local development
      endpoints may be documented as inline code, never as remote links or badges. .gitattributes is required; .github holds
      CI and may hold optional PR and issue templates and CODEOWNERS. The GitHub repository description and topics are set with
      gh repo edit. docs/repo-presentation.md is the maintenance checklist.
    rationale: |
      A consistent entry page makes the HFS tree and real checks discoverable without advertising local-only services as
      public project health.
    cases: []
    verification:
      automated:
        - HFS_README_TITLE_INVALID
        - HFS_README_DESCRIPTION_INVALID
        - HFS_README_DEVELOPMENT_INCOMPLETE
        - HFS_README_SECTION_MISSING
        - HFS_README_SECTION_ORDER
        - HFS_README_WORK_POINTER_MISSING
        - HFS_README_PRIVATE_URL
        - HFS_README_BADGE_NOT_LIVE
      manual:
        - Confirm every badge's target currently reports a live external service.
        - Review GitHub description and topics against the repository's current purpose.
    relatedExamples:
      - examples/todo-app-backend/README.md
      - examples/todo-app-frontend/README.md
      - examples/ecommerce-app-be/README.md
      - examples/ecommerce-app-fe/README.md
