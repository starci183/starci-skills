schema: starci/knowledge-source@1
id: repo.starcistacks
title: App-root .starcistacks
purpose: |
  Given a deployment, runtime or infrastructure declaration, what may live in the app's `.starcistacks` (at the app root)? One
  application stack file and one folder per environment with a fixed shape. Neither side (`be/`, `fe/`) holds a `.starcistacks`.
appliesTo:
  - backend
family: repo
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [app.starcistacks]
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/application-stacks.yaml
    - docs/application-stacks.md
    - scripts/gates/starcistacks.mjs
  limitations: |
    The shape check proves where declarations live. It proves neither startup nor recovery; readiness and recovery evidence
    do. Package profiles and lifecycle are owned by knowledge/application-stacks.yaml.
rules:
  - id: REPO-STACKS-1
    title: One shape per environment
    kind: mandatory
    hfsRules: [R10, R01]
    requirement: |
      `.starcistacks/` is `application-stacks.yaml` plus one folder per environment (`dev/`, `vps/`, ...), each holding only
      `README.md`, `environment.json` where the schema asks for it, `infra/{compose,k8s,terraform}/`, `runtime/{config,env}/`,
      `secrets/<slug>.enc` and `seeds/` (the environment's seed data, loaded only by a cli seed command). `runtime/env/KEYS.md` lists slug names and never values. There is no `runtime/files/`.
      A `DESIGN.md`, `deployment.json` or `k8s/` at its root does not exist; design notes go to `be/docs/` and Kubernetes
      manifests to `<env>/infra/k8s/`.
    rationale: |
      One shape lets the stack check and the deploy tooling find everything without a per-project map.
    cases:
      - id: case-1
        when: A new environment
        write: .starcistacks/vps/{README.md,environment.json,infra/,runtime/,secrets/,seeds/}
      - id: case-2
        when: A Kubernetes manifest
        write: .starcistacks/vps/infra/k8s/orders-deployment.yaml
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
      manual:
        - starci gate starcistacks <app> exits 0 (the app root).
    relatedExamples: []
  - id: REPO-STACKS-2
    title: Shared host services are declared, not copied
    kind: mandatory
    hfsRules: [R10, R11]
    requirement: |
      Shared host services (SonarQube first) are declared in `application-stacks.yaml` with `owner: host` pointing at the host
      extension `.claude/ext/<service>/`; they are never copied into an app. There is no `.stacks` root. The generated root
      `sonar-project.properties` holds no `sonar.host.url`.
    rationale: |
      A copied service drifts from the host that runs it and leaks host addresses into a project.
    cases:
      - id: case-1
        when: The Sonar block
        write: 'sonar: { provider: sonarqube, mode: local, stack: { owner: host, root: .claude/ext/sonar, environment: dev } }'
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-3
    title: Deployment declarations, not deployment effects
    kind: mandatory
    hfsRules: [R10]
    requirement: |
      Placement, package profile, endpoint contexts, ports and persistent-data custody are declared per application component
      (knowledge/application-stacks.yaml). A declaration proves neither startup nor recovery, and installing this standard
      neither converts nor deploys an existing app. The migrate step of the back end (the cli image run as `cli migrate run`)
      runs first and once per connection in every profile; seed data is loaded only by a cli seed command (`cli seed <name>`),
      never by a migration, an api app or a stack hook.
    rationale: |
      Declarations stay reviewable, and a deploy effect always has separate evidence.
    cases: []
    verification:
      automated:
        - HFS_STACKS_SHAPE
      manual:
        - Run the applicable readiness and recovery checks.
    relatedExamples: []
