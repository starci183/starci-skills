schema: starci/knowledge-source@1
id: repo.starcistacks
title: App-root .starcistacks
purpose: |
  Given a deployment, runtime or infrastructure declaration, what may live in the app's `.starcistacks` (at the app root)? One
  application stack file and one folder per environment with a fixed shape. Neither side (`be/`, `fe/`) holds a `.starcistacks`.
appliesTo:
  - backend
family: repo
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [app.starcistacks]
provenance:
  reviewedAt: 2026-10-14
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - knowledge/application-stacks.yaml
    - docs/application-stacks.md
    - scripts/gates/starcistacks.mjs
    - owner-approved Swarm canon 2026-10-14 (lite production runtime and app-owned scheduled work)
  limitations: |
    The shape check proves where declarations live. It proves neither startup nor recovery; readiness and recovery evidence
    do. Package profiles and lifecycle are owned by knowledge/application-stacks.yaml.
rules:
  - id: REPO-STACKS-1
    title: One shape per environment
    kind: mandatory
    hfsRules: [R10, R01, R212, R276]
    requirement: |
      app.starcistacks owns the application-root declaration and the permitted shape of each environment; neither side owns
      a stack tree. Read that slot's requires, allows, forbidden and edition overlay instead of copying its file list.
      Full permits its declared infra runtimes, runtime configuration, sealed custody and cli-owned seeds. Lite requires the
      declaration and permits Swarm infra, the environment's runbook and record, and sealed custody; the other infra runtimes,
      runtime and seeds trees remain forbidden. Lite components never duplicate a Supabase-provided backing service.
      Deployment design belongs to be.docs; the stack tree holds the declared topology and operational record.
      Lite runs no PostgreSQL, Redis or MongoDB backing image. A database-dependent sidecar uses SQLite on a named
      persistent volume declared by its component and mounted in the rendered model; a sidecar requiring another
      database is refused. Full retains its declared backing topology.
    rationale: |
      One shape lets the stack check and the deploy tooling find everything without a per-project map.
    cases:
      - id: case-1
        when: A new environment
        write: Use the app.starcistacks shape for the selected edition and declare the environment and its runtime.
      - id: case-2
        when: A Kubernetes manifest
        write: Use the Kubernetes infra location of app.starcistacks under full; lite refuses that runtime.
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_SLOT_UNDECLARED
        - HFS_SLOT_AMBIGUOUS
        - HFS_SLOT_NOT_ENABLED
        - HFS_FORBIDDEN_PRESENT
        - HFS_TRACKED_MUST_BE_IGNORED
        - HFS_ROOT_ENTRY_FORBIDDEN
        - HFS_ROOT_MARKDOWN_FORBIDDEN
        - HFS_ROOT_SRC_FORBIDDEN_FE
        - HFS_SRC_LAYOUT_INVALID
        - HFS_MODULE_TIER_INVALID
        - HFS_WORK_IN_FE
        - HFS_STACKS_IN_SIDE
        - HFS_EDITION_INVALID
        - HFS_EDITION_FORBIDDEN_PRESENT
        - HFS_STARCIWORK_LITE_FORBIDDEN
        - STACKS_LITE_SELFHOSTED_DB
        - STACKS_SIDECAR_VOLUME_UNDECLARED
        - STACKS_SIDECAR_DB_UNSUPPORTED
      manual:
        - starci gate starcistacks <app> exits 0 (the app root).
    relatedExamples: []
  - id: REPO-STACKS-4
    title: Scheduled work on Swarm is application-owned
    kind: mandatory
    hfsRules: [R10, R212, R250, R268]
    requirement: |
      Recurring work is owned by the application: a back-end scheduler dispatches a command, a pgmq job has an api or worker
      runner, or a lite pg_cron tick enqueues work. Deployment never installs a host crontab from app.ci-deploy, app.deploy,
      app.scripts, app.scripts.delivery or app.starcistacks. The checker reports the offending file and line.
      Deployment scripts delegate to docker, starci or the named back-end CLI action; they contain no inline JavaScript,
      SQL, psql or downloaded shell logic. Compose up, down and pull target only an explicitly dev environment.
      Every app scheduler, active pg_cron schedule, selected scheduled component and rendered replicated-job also has a
      matching top-level jobs declaration with its schedule and named CLI invocation; a rendered job uses that same
      invocation without shell chaining. A workflow never schedules application work.
      A scheduled CLI batch is converted to an app scheduler or declared as a component with `role: job`,
      `mode: replicated-job`, a cron `schedule` and a `scheduler` naming a declared `role: scheduler` component running
      swarm-cronjob. Both components belong to the target environment. The stack job has deploy mode replicated-job,
      zero replicas, restart condition
      none and matching swarm.cronjob.enable and swarm.cronjob.schedule service labels.
    rationale: |
      A schedule declared with its runner remains reviewable and moves with the application release. A host crontab adds a
      second runtime authority that the stack cannot reconcile.
    cases:
      - id: case-1
        when: A report CLI command must run every day
        write: >-
          Declare report as role job with mode replicated-job, scheduler cron and schedule "0 3 * * *"; declare cron as role
          scheduler with the swarm-cronjob image. Wire report with deploy mode replicated-job, zero replicas, restart condition none and the matching
          service labels. docs/application-stacks.md "Scheduled work on Swarm" owns the manifest and stack example.
      - id: case-2
        when: A lite recurring queue task
        write: Use a pg_cron tick to enqueue through pgmq and compose its consumer in the api or worker app; no host crontab.
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_EDITION_INVALID
        - HFS_EDITION_FORBIDDEN_PRESENT
        - HFS_STARCIWORK_LITE_FORBIDDEN
        - HFS_HOST_CRON
        - HFS_DEPLOY_NO_LOGIC
        - HFS_DEPLOY_COMPOSE_ON_VPS
        - HFS_DEPLOY_SCHEDULER
        - HFS_SCHEDULE_UNDECLARED
      manual:
        - Confirm completion, retry and overlap handling belongs to the job and that its scheduler has the required runtime access.
    relatedExamples: []
  - id: REPO-STACKS-5
    title: Rendered Swarm services preserve declared custody and ingress
    kind: mandatory
    hfsRules: [R266, R275]
    requirement: |
      Each Swarm environment declares one ingress component and its hosts. Its component has role ingress and a
      digest-pinned supported image; Traefik and Caddy are both accepted. Only that ingress publishes ports. Every host
      has a route, DNS ownership receipt and TLS ownership evidence. DNS and TLS provider actions remain owner-run.
      Swarm secrets are external and immutable, matching their declared runtimeName and positive version; services pass
      no secret environment literals. Stateful services declare placement constraints. Every Swarm service has a
      digest-pinned image, healthcheck, update_config with order, failure_action rollback and monitor, rollback_config
      and restart_policy. A lite api composing realtime features pins replicas to 1;
      full retains its declared replica topology.
    rationale: |
      Judging the rendered model connects the deployment's actual ports, secrets and service policies to its declaration.
    cases: []
    verification:
      automated:
        - STACKS_SECRET_NOT_EXTERNAL
        - STACKS_SECRET_UNVERSIONED
        - STACKS_SECRET_ENV_LITERAL
        - STACKS_PORT_PUBLISHED
        - STACKS_SECOND_INGRESS
        - STACKS_DNS_UNDECLARED
        - STACKS_HOST_UNROUTED
        - STACKS_TLS_UNDECLARED
        - STACKS_PLACEMENT_MISSING
        - STACKS_HEALTHCHECK_MISSING
        - STACKS_UPDATE_POLICY_MISSING
        - STACKS_REALTIME_SCALED
        - STACKS_INGRESS_UNDECLARED
        - STACKS_INGRESS_UNKNOWN
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-6
    title: Releases and backups have reviewable recovery evidence
    kind: mandatory
    hfsRules: [R267]
    requirement: |
      Each Swarm environment declares an immutable images lock, active and previous release pointers and nonempty
      health assertions. Every stateful component and declared managed backing dependency has a backup target,
      retention, owner and tracked restore proof. The rendered deployment model is available and valid; an unavailable
      model fails the check. Owner-run setup and recovery actions are declared with their evidence.
    rationale: |
      Release and backup declarations make the previous release and the proof of data recovery assessable before deployment.
    cases: []
    verification:
      automated:
        - STACKS_RELEASE_UNDECLARED
        - BACKUP_UNDECLARED
        - BACKUP_PROOF_MISSING
        - STACKS_MODEL_UNAVAILABLE
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-7
    title: Swarm deploys call the canon verbs and declare their configuration
    kind: mandatory
    hfsRules: [R293, R294]
    requirement: |
      An app does not re-implement the Swarm deploy tooling the canon ships. Deploy sources (tracked files under deploy/
      and scripts/, the scripts of package.json and every workflow except the managed stack-deploy.yml) never call a
      docker command that a `starci app stack` verb owns, and deploy/ holds no script named after a verb; the app calls
      `starci app stack <verb>` instead. The app's constants (stack name, images, volumes, secret grants, configs, verify
      checks, jobs and backup volumes) live in `environments.<env>.deploy` of application-stacks.yaml, which is judged by
      the same normaliser the verbs use: names match their patterns, files and services exist, sealed members have a
      secrets file and the backup image is pinned by a real digest. docs/application-stacks.md "Swarm deploy tooling"
      lists the verbs and the block.
    rationale: |
      One tested implementation of the deploy procedure keeps every app on the same guards, and a coherent declaration
      lets the verbs refuse before any effect instead of failing halfway.
    cases: []
    verification:
      automated:
        - STACK_TOOLING_REIMPLEMENTED
        - STACKS_DEPLOY_CONFIG_INVALID
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-2
    title: Shared host services are declared, not copied
    kind: mandatory
    hfsRules: [R10, R11]
    requirement: |
      Shared host services (SonarQube first) are declared in `application-stacks.yaml` with `owner: host` pointing at the host
      extension `.claude/ext/<service>/`; they are never copied into an app. There is no `.stacks` root. The generated root
      `sonar-project.properties` holds no `sonar.host.url`.
    rationale: |
      A copied service drifts from the host that runs it and leaks host addresses into a project.
    cases:
      - id: case-1
        when: The Sonar block
        write: 'sonar: { provider: sonarqube, mode: local, stack: { owner: host, root: .claude/ext/sonar, environment: dev } }'
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-3
    title: Deployment declarations, not deployment effects
    kind: mandatory
    hfsRules: [R10]
    requirement: |
      Placement, package profile, endpoint contexts, ports and persistent-data custody are declared per application component
      (knowledge/application-stacks.yaml). A declaration proves neither startup nor recovery, and installing this standard
      neither converts nor deploys an existing app. The migrate step of the back end (the cli image run as `cli migrate run`)
      runs first and once per connection in every profile; seed data is loaded only by a cli seed command (`cli seed <name>`),
      never by a migration, an api app or a stack hook.
    rationale: |
      Declarations stay reviewable, and a deploy effect always has separate evidence.
    cases: []
    verification:
      automated:
        - HFS_STACKS_SHAPE
      manual:
        - Run the applicable readiness and recovery checks.
    relatedExamples: []
