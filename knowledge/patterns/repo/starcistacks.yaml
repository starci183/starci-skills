schema: starci/knowledge-source@1
id: repo.starcistacks
title: Repository .starcistacks
purpose: |
  Given a deployment, runtime or infrastructure declaration, what may live in the backend repository's `.starcistacks`? One
  application stack file and one folder per environment with a fixed shape.
appliesTo:
  - backend
family: repo
provenance:
  reviewedAt: 2026-09-29
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/application-stacks.yaml
    - docs/application-stacks.md
    - scripts/checks/check-starcistacks.mjs
  limitations: |
    The shape check proves where declarations live. It proves neither startup nor recovery; readiness and recovery evidence
    do. Package profiles and lifecycle are owned by knowledge/application-stacks.yaml.
rules:
  - id: REPO-STACKS-1
    title: One shape per environment
    kind: mandatory
    hfsRules: [R10]
    requirement: |
      `.starcistacks/` is `application-stacks.yaml` plus one folder per environment (`dev/`, `vps/`, ...), each holding only
      `README.md`, `environment.json` where the schema asks for it, `infra/{compose,k8s,terraform}/`, `runtime/{config,env}/`,
      `secrets/<slug>.enc` and `seeds/`. `runtime/env/KEYS.md` lists slug names and never values. There is no `runtime/files/`.
      A root `DESIGN.md`, `deployment.json` or `k8s/` does not exist; design notes go to `docs/` and Kubernetes manifests to
      `<env>/infra/k8s/`.
    rationale: |
      One shape lets the stack check and the deploy tooling find everything without a per-project map.
    cases:
      - id: case-1
        when: A new environment
        write: .starcistacks/vps/{README.md,environment.json,infra/,runtime/,secrets/,seeds/}
      - id: case-2
        when: A Kubernetes manifest
        write: .starcistacks/vps/infra/k8s/orders-deployment.yaml
    verification:
      automated:
        - HFS_STACKS_SHAPE
      manual:
        - node scripts/checks/check-starcistacks.mjs <repo> exits 0.
    relatedExamples: []
  - id: REPO-STACKS-2
    title: Shared host services are declared, not copied
    kind: mandatory
    hfsRules: [R10, R11]
    requirement: |
      Shared host services (SonarQube first) are declared in `application-stacks.yaml` with `owner: host` pointing at the host
      extension `.claude/ext/<service>/`; they are never copied into a project. There is no `.stacks` root. The generated
      `sonar-project.properties` holds no `sonar.host.url`.
    rationale: |
      A copied service drifts from the host that runs it and leaks host addresses into a project.
    cases:
      - id: case-1
        when: The Sonar block
        write: 'sonar: { provider: sonarqube, mode: local, stack: { owner: host, root: .claude/ext/sonar, environment: dev } }'
    verification:
      automated:
        - HFS_STACKS_SHAPE
        - HFS_SONAR_CONFIG
      manual: []
    relatedExamples: []
  - id: REPO-STACKS-3
    title: Deployment declarations, not deployment effects
    kind: mandatory
    hfsRules: [R10]
    requirement: |
      Placement, package profile, endpoint contexts, ports and persistent-data custody are declared per application component
      (knowledge/application-stacks.yaml). A declaration proves neither startup nor recovery, and installing this standard
      neither converts nor deploys an existing app. The migrate step of a backend (apps/migrate) runs first and once per
      connection in every profile.
    rationale: |
      Declarations stay reviewable, and a deploy effect always has separate evidence.
    cases: []
    verification:
      automated:
        - HFS_STACKS_SHAPE
      manual:
        - Run the applicable readiness and recovery checks.
    relatedExamples: []
