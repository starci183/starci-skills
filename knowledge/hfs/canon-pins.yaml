    group: framework
    side: be
    why: 'the Nest bridge of TypeORM; the reference app declares ^11.0.3 and resolves 11.0.3.'
  typeorm:
    version: 0.3.31
    group: framework
    side: be
    why: 'the one ORM of a back end; the reference app declares ^0.3.20 and resolves 0.3.31.'
  pg:
    version: 8.23.1
    group: framework
    side: be
    why: 'the Postgres driver behind TypeORM; the reference app declares ^8.12.0 and resolves 8.23.1.'
  reflect-metadata:
    version: 0.2.2
    group: framework
    side: be
    why: 'the decorator-metadata runtime Nest reads; the reference app declares ^0.2.2 and resolves 0.2.2.'
  rxjs:
    version: 7.8.2
    group: framework
    side: be
    why: 'the observable runtime Nest is built on; the reference app declares ^7.8.1 and resolves 7.8.2.'
  tslib:
    version: 2.8.1
    group: framework
    side: be
    why: 'the helper runtime the TypeScript emit references (importHelpers); the reference app declares ^2.8.1 and resolves 2.8.1.'
  server-only:
    version: 0.0.1
    group: framework
    side: fe
    why: 'the Next.js marker that fails a client bundle that imports it; the i18n workspace of the reference app declares ^0.0.1.'
  next-intl:
    version: 4.13.6
    group: framework
    side: fe
    why: every HFS front end uses next-intl with the [locale] segment (starci app scaffold writes it); the measured front end resolves 4.13.6.
  graphql:
    version: 16.14.2
    group: framework
    side: both
    why: 'one app package.json for both sides (hfs 4): where the two sides declared different ranges (^16.14.1 on a back end, ^16.14.2 on a front end), the higher wins; the measured product installs resolve 16.14.2. The example apps declared ^16.14.2 as well; each app root now has one dependencies entry at the pin.'
  supertest:
    version: 7.3.0
    group: tooling
    side: be
    why: the e2e world of a back end calls the app over HTTP (/health/live in the skeleton); two product back ends resolve 7.3.0, one 7.2.2.
  # --- ui
  '@xyflow/react':
    version: 12.11.6
    group: ui
    side: fe
    why: 'Grammar FlowGraph imports React Flow from @xyflow/react; every Grammar consumer declares this required peer at the version used by the Grammar package.'
  '@heroui/react':
