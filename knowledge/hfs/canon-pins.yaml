schema: starci/canon-pins@1
purpose: >-
  The exact version of every dependency a StarCi product repository pins. One version per dependency for the whole
  family. Raising a version is a change to this file first (with the package bump when it is a @starci package),
  then the repositories' own upgrade lane (each sets the exact version and reinstalls; nothing else installs a @starci package). Read on 2026-09-29 from the packages under
  .claude/packages and from the installed node_modules of the six product repositories; where they disagreed the
  newest version installed in more than one repository won, and the runtime's own version won for @starci packages.
  An app (hfs 4) has ONE package.json for both sides, so a
  dependency both sides declared at different versions takes one: its pin where it has one, otherwise the higher of the
  two, pinned here with a why (2026-10-01: every such conflict but graphql was already pinned). The runtime's example apps
  merged the same way on 2026-10-01: no dependency outside this file was declared at two versions across their sides, so
  every choice is a pin (each side's older @starci pins and graphql moved to the version here). `side` names the side whose code uses
  the dependency; the app root package.json carries the pins of both.
pins:
  # --- @starci packages. Every @starci package is a PUBLISHED npm package (install: registry): a product repository
  # installs the exact pinned version from the npm registry in the root and every workspace package.json, never `file:`.
  '@starci/heroicons':
    version: 0.3.4
    group: starci
    install: registry
    side: fe
    source: packages/heroicons/package.json
    why: 'StarCi custom Heroicons-compatible cuts; eslint-canon-fe (icon.mjs) admits @starci/heroicons/24/outline and /16/solid as icon sources, so an app that uses them gets this exact version.'
  '@starci/grammar':
    version: 0.9.14
    group: starci
    install: registry
    side: fe
    source: packages/grammar/package.json
    why: 'the grammar front ends read: the brand layer sets `--font-sans` and `--font-mono` and the grammar reads them; it carries the Input tel kind, the copyable and read-only Input, the IconButton disclosure props and count badge, ChatBubble, FillViewport, Textarea mentions and Enter-to-send, the leading PrimaryRailLayout rail, the plate-less Image, ListRow, the soft Alert, Progress steps, the floating primary IconButton, FlowGraph, the STATE-8 loading views and the bordered selectable TagGroup chips. The runtime source version wins for a @starci package.'
  '@starci/eslint-canon-be':
    version: 3.4.0
    group: starci
    install: registry
    side: be
    source: packages/eslint/be/package.json
    why: 'the back-end ESLint canon: `loadHfs(import.meta.url)` of be/eslint.config.mjs finds the app-root hfs.json (kind app) and gives every linted file the view of the be side, and the project graph is built per side; its bundled runtime copies (slots, canon-pins, failure codes, the architecture machine) put .starcistacks and .sops.yaml at the app root; `starciBeConfig({ hfs: loadHfs(import.meta.url) })` is the typed factory and the BE-CONVENTION laws are its rules.'
  '@starci/eslint-canon-fe':
    version: 8.4.0
    group: starci
    install: registry
    side: fe
    source: packages/eslint/fe/package.json
    why: 'the front-end ESLint canon: `loadHfs(import.meta.url)` of fe/eslint.config.mjs finds the app-root hfs.json (kind app) and gives every linted file the view of the fe side, and the project graph is built per side; its bundled runtime copies (slots, canon-pins, failure codes, the architecture machine) put .starcistacks and .sops.yaml at the app root; the front end has no tests (FE_NO_TESTS R97 in hfs) and no-vietnamese-in-source (R91) applies.'
  '@starci/stylelint-canon':
    version: 2.0.9
    group: starci
    install: registry
    side: fe
    source: packages/stylelint/package.json
    why: 'the front-end stylelint canon: no-class-selector refuses a compound class selector (`div.card`); the brand layer accepts `--font-sans` and `--font-mono`; status-contrast measures the HeroUI soft pairs per theme; brand-layer-shape reads the shared :root,.light,.dark block and the info soft pair; appTokens come from loadAppTokens(import.meta.url) for the managed one-line stylelint.config.mjs.'
  '@starci/tsconfig':
    version: 2.0.4
    group: starci
    install: registry
    side: both
    source: packages/tsconfig/package.json
  '@starci/prettier-config':
    version: 1.0.3
    group: starci
    install: registry
    side: both
    source: packages/prettier-config/package.json
  '@starci/jest-preset':
    version: 2.3.0
    group: starci
    install: registry
    side: be
    source: packages/jest-preset/package.json
    why: 'the Jest preset of a back end: the world runner runs up to min(--maxWorkers, slots) world files at once, each in its own process bound to one data slot of the test world (STARCI_TEST_WORLD_SLOT), and reads test-world state protocol 2 only: it pairs exactly with @starci/test-world, and any other state file is JEST_PRESET_WORLD_PAIR_MISMATCH. The unit run writes the lcov Sonar and Codecov import (services only); the integration, e2e and contract projects run every spec file in a worker process of its own (world-runner.cjs), so a process-global framework registry (@nestjs/graphql type metadata) never leaks between e2e files; it ships the unit kit (mockEntityManager, fakeTransaction, fakeIds, FakeClock, Outcome matchers) and the recordingOutbox claim side.'
  '@starci/test-world':
    version: 1.2.1
    group: starci
    install: registry
    side: be
    source: packages/test-world/package.json
    why: 'the shared e2e library of every back end (R47, R48), a devDependency of every back end: the warm stack behind toxiproxy, the network-edge fakes, the Nest boot, the typed useTestWorld handle, useSandbox for contract specs and the outage lock. Kafka is real own infra (the one digest-pinned apache/kafka KRaft image, a broker listener and proxy per slot, slot-prefixed topics, consumer groups and client ids) and Postgres is schema-per-context (a schema and a login role per context in a shared database). Each worker has its own data slot (<ns>_w<k>) with its own databases, Keycloak realm, leased Redis DB, bucket/collection/topic prefixes, fakes host, toxiproxy proxies and outage lock; a run provisions min(jest workers, workers cap, default 2) slots, and state file protocol 2 pairs exactly with @starci/jest-preset (TEST_WORLD_PAIR_MISMATCH otherwise). A modules world boots real peer apps beside its modules, world.apps.<name>.during(fn) is the outage of a peer app, w.keycloak.clientSecret(client) answers the run-generated secret of a confidential realm client, world.keycloak.events/sessions read the realm user events and live sessions, world.infra.postgresql.connection(name) takes one database connection down while the others serve, and world.resolve and scope.resolve take any Nest token. Every path a declaration names (`stack`, seeds, the realm, Dockerfiles) resolves from the app root (the directory of hfs.json); the globalSetup registers the path aliases as TypeScript resolves them. Its CLI main is exported at ./cli for starci app stack.'
  '@starci/cli':
    version: 1.4.0
    group: starci
    install: registry
    side: both
    source: packages/cli/package.json
    why: 'the only StarCi command package; product repositories install it for starci app, while @starci/hfs remains its pinned transitive implementation.'
  '@starci/hfs':
    version: 4.4.0
    group: starci
    install: registry
    side: both
    source: packages/hfs/package.json
    why: 'the transitive app implementation used by @starci/cli; it carries the generated runtime slice read by starci app commands.'
  # --- tooling
  typescript:
    version: 5.9.3
    group: tooling
    side: both
    why: all six product repositories resolve 5.9.3 already; the declared ranges (^5, ^5.7.3) become exact.
  turbo:
    version: 2.11.6
    group: tooling
    side: fe
    why: 'every app is a monorepo (R143): turbo runs build, dev, lint and typecheck over the fe workspaces fe/apps/* and fe/packages/* from the app root turbo.json, as nivo-fe does; 2.11.6 is the newest 2.x on 2026-10-02.'
  prettier:
    version: 3.9.6
    group: tooling
    side: both
    why: only one product repository had it installed (3.9.6); the other five adopt it with the formatter change.
  stylelint:
    version: 17.15.0
    group: tooling
    side: fe
    why: no repository has it installed; 17.15.0 is the current release, and the canon plugin needs the ESM-only 17 line.
  postcss-value-parser:
    version: 4.2.0
    group: tooling
    side: fe
    why: peer of @starci/stylelint-canon (it parses declaration values); 4.2.0 is what stylelint 17.15.0 itself resolves.
  eslint:
    version: 9.39.5
    group: tooling
    side: both
    why: five product repositories resolve 9.39.5, the sixth 9.39.4.
  eslint-plugin-react-hooks:
    version: 7.1.1
    group: tooling
    side: fe
    why: '2.0.0 (C0 release): the BE-CONVENTION machine, emit-contracts (GraphQL SDL and OpenAPI from the typed operation table), the four-project test layout, FE has no tests, repo.scripts slot, secrets guard in work-hygiene, rule ids R<2-3 digits>.'
  '@types/node':
    version: 22.20.4
    group: tooling
    side: both
    why: one front end resolves 20.19.43 and one back end 22.20.0; the package engines are node >=22.
  '@types/express':
    version: 4.17.25
    group: tooling
    side: be
    why: the Express types of a back end; the reference app declares ^4.17.21 and resolves 4.17.25.
  '@types/react':
    version: 19.3.0
    group: tooling
    side: fe
    why: the React types of a front end; the reference app declares ^19.0.0 and resolves 19.3.0.
  '@types/react-dom':
    version: 19.3.0
    group: tooling
    side: fe
    why: the React DOM types of a front end; the reference app declares ^19.0.0 and resolves 19.3.0.
  husky:
    version: 9.1.7
    group: tooling
    side: both
    why: the managed git hooks of the app root (pre-commit, pre-push); the reference app declares ^9.1.7 and resolves 9.1.7.
  ts-node-dev:
    version: 2.0.0
    group: tooling
    side: be
    why: 'the watch runner of the managed dev:be:<app> script (ts-node-dev --respawn -r tsconfig-paths/register); 2.0.0 is its latest release.'
  tsc-alias:
    version: 1.9.7
    group: tooling
    side: be
    why: 'rewrites the path aliases in the compiled output (build:be); the reference app declares ^1.8.10 and resolves 1.9.7.'
  tsconfig-paths:
    version: 4.2.0
    group: tooling
    side: be
    why: 'loads the path aliases for the dev runner (dev:be:<app>); the reference app declares ^4.2.0 and resolves 4.2.0.'
  # --- test
  jest:
    version: 29.7.0
    group: test
    side: be
  ts-jest:
    version: 29.4.12
    group: test
    side: be
  '@types/jest':
    version: 29.5.14
    group: test
    side: be
