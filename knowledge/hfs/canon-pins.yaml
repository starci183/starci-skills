    group: framework
    side: be
    why: readiness probes with dependency indicators use Terminus (the liveness route of the scaffolded skeleton does not, being a thin door over the liveness service); every measured product back end resolves 11.1.1.
  '@nestjs/cqrs':
    version: 11.0.3
    group: framework
    side: be
    why: 'the CQRS module of the application layer (commands, queries, handlers); the reference app declares ^11.0.3 and resolves 11.0.3.'
  '@nestjs/typeorm':
