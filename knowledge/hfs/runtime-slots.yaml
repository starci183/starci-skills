# knowledge/hfs/runtime-slots.yaml - the one place that says what may exist in the StarCi runtime repository (.claude) and
# where. The same loader as the product manifest knowledge/hfs/slots.yaml (scripts/hfs/slots.mjs, manifest `kind`
# runtime) and the same machinery: scripts/hfs/runtime-check.mjs runs the tree check (checkRepo) with this manifest, then
# the runtime rules of knowledge/hfs/rules.yaml (gate runtime) under scripts/hfs/runtime-rules/. Every tracked path of the
# runtime matches exactly one slot. The slots describe the CURRENT tree and the TARGET tree of the runtime HFS design: a
# current path the target moves is a forbidden slot whose goesTo names its successor. The ONE explicit allowlist of the
# runtime is modules/kernel/allowlist.yaml (scripts/checks/check-one-allowlist.mjs); every exception list lives in one
# named section of it and only shrinks.
schema: starci/runtime-slots@1
kind: runtime
version: 1.2.0

versioning:
  patch: wording, why text, examples; no check result can change.
  minor: add a slot (optional), add a rule, add an api system.
  major: change or remove a slot, change the tier matrix or infraOwners, move a pinned path. Owner approval; no compatibility window.
  pins: the runtime has no pins of its own; the packages it publishes are pinned in knowledge/hfs/canon-pins.yaml.

presenceValues: [required, optional, opt-in, forbidden]
trackedValues: [tracked, ignored, external, generated]
testValues: [unit-beside, e2e, none]
profiles: [runtime]

# Tiers and the direction matrix (owner granularity; dynamic imports count; no owner cycles). Importing inside the same
# owner is always allowed. tests/** takes no part (tier none).
tiers:
  runtime:
    entry:      {mayImport: [checks, reconciler, supervisor, kernel, domain, gates, machine, hfs, api, db, base]}
    checks:     {mayImport: [checks, reconciler, supervisor, kernel, domain, gates, machine, hfs, api, db, base, package]}
    reconciler: {mayImport: [supervisor, kernel, domain, gates, machine, hfs, api, db, base]}
    supervisor: {mayImport: [kernel, domain, gates, machine, hfs, api, db, base]}
    kernel:     {mayImport: [domain, gates, machine, hfs, api, db, base]}
    domain:     {mayImport: [domain, gates, machine, hfs, api, db, base], acyclic: true}
    gates:      {mayImport: [machine, hfs, api, db, base, package]}
    machine:    {mayImport: [api, db, base]}
    hfs:        {mayImport: [api, base, package]}
    api:        {mayImport: [base]}
    db:         {mayImport: [base]}
    base:       {mayImport: [base], acyclic: true}
    package:    {mayImport: [package]}
crossOwner: inside a tier, a domain owner imports another owner's files directly (no index.mjs required); cycles between owners are refused (ARCH_OWNER_CYCLE).
crossSystem: an api system never imports another api system; a domain composes two systems (RT_API_SHAPE).

ruleParams:
  runtime:
    # HFS_SIZE_GROWTH: a runtime source file above soft may not grow against the base revision; a new file stays within soft.
    fileLines: {soft: 500, hardGrowth: true}
    # The runtime's production source: what the external-owner, tier, base-purity and source-name rules read.
    sourceRoots: [bin, engine, scripts, ui/api, ui/server.mjs, ui/harness-process.mjs, ui/harness-verbs.mjs]
    # RT_EXTERNAL_OWNER: a module specifier, a global or a spawned program word -> the owners allowed to use it ([] means
    # nowhere in runtime production code). An owner is api/<system> (the folder scripts/api/<system>/), api/* (any api
    # system) or engine/db (the DB tier). A program word is read from the spawn's command with the TypeScript AST
    # (scripts/lib/spawn-calls.mjs); process.execPath reads as node. Agent CLIs are AGENT_CLI_SPAWN's
    # (scripts/checks/check-host-boundary.mjs), not listed here.
    infraOwners:
      modules:
        "node:child_process": [api/*]
        child_process: [api/*]
        "node:http": [api/http, api/sonar, api/telegram, api/windsurf]
        http: [api/http, api/sonar, api/telegram, api/windsurf]
        "node:https": [api/http, api/sonar, api/telegram, api/windsurf]
        https: [api/http, api/sonar, api/telegram, api/windsurf]
        "node:net": [api/http]
        net: [api/http]
        "node:dgram": []
        "node:sqlite": [engine/db]
        "node:worker_threads": [api/node]
        undici: [api/http]
      globals:
        fetch: [api/http, api/sonar, api/telegram, api/windsurf]
        WebSocket: []
      programs:
        orca: [api/orca]
        git: [api/git]
        npm: [api/npm]
        npx: [api/npm]
        docker: [api/docker]
        docker-compose: [api/docker]
        sonar-scanner: [api/sonar]
        sonar: [api/sonar]
        sops: [api/sops]
        cloudflared: [api/cloudflared]
        node: [api/node, api/npm]           # npm runs as node + its bundled npm-cli.js on Windows
        powershell: [api/process]
        pwsh: [api/process]
        schtasks: [api/process]
        taskkill: [api/process]
        tasklist: [api/process]
        wmic: [api/process]
        ps: [api/process]
        netstat: [api/process]
        lsof: [api/process]
        sh: [api/process]
        bash: [api/process]
        where: [api/orca, api/process]
        cmd: [api/fs, api/process]
    # RT_BASE_IMPURE: the base tier never writes the filesystem; it reads process.env only in these declared seams.
    baseWriteMembers: [writeFileSync, appendFileSync, rmSync, rmdirSync, renameSync, unlinkSync, mkdirSync, copyFileSync, cpSync, symlinkSync, linkSync, truncateSync, writeFile, appendFile, rm, rmdir, rename, unlink, mkdir, copyFile, cp, symlink, link, truncate, mkdtempSync, mkdtemp, createWriteStream]
    baseEnvSeams: [scripts/lib/env.mjs, scripts/lib/sleep-sync.mjs, scripts/gates/runtime-host.mjs, engine/config.mjs, engine/runtime-root.mjs, engine/secrets.mjs, engine/temp-root.mjs]
    # RT_API_SHAPE: the systems that carry a calls contract; every call file of such a system is a calls id and vice versa.
    apiContracts:
      orca: modules/host/orca/calls.yaml
    # RT_SOURCE_NAME: the basename stem of a runtime source file; the one-off names it may never carry; the basenames that
    # may repeat inside a tier.
    sourceName: "^[a-z0-9]+(-[a-z0-9]+)*$"
    oneOffNames: ["_*", "tmp-*", "fix-*", "*-backfill", "backfill-*", "migrate-*", "*-old", "*.bak*", "repair-*"]
    sharedBasenames: [lib.mjs, index.mjs]
    # RT_GENERATED_DRIFT and GENERATED_UNTRACKED: the generated copies, declared once. They are git-ignored output of the
    # declared generatedBy; a checkout regenerates them and no path below them may be tracked.
    generated:
      - {root: packages/hfs/runtime, generatedBy: scripts/hfs/sync-runtime.mjs}
      - {root: packages/eslint/be/runtime, generatedBy: scripts/hfs/sync-runtime.mjs}
      - {root: packages/eslint/fe/runtime, generatedBy: scripts/hfs/sync-runtime.mjs}
      - {root: ui/src/i18n/generated, generatedBy: scripts/hfs/sync-runtime.mjs}
    # RT_PINNED_PATH_MOVED: paths persisted outside git (provider hooks, settings, the scheduled task, rendered prompts).
    pinned:
      - {path: packages/cli/bin/starci.mjs, why: the @starci/cli npm bin}
      - {path: scripts/kernel/cli.mjs, why: every Kernel and op prompt runs it}
      - {path: scripts/kernel/start-workflow.mjs, why: the native workflow launcher}
      - {path: scripts/supervisor/start-supervisor.mjs, why: the supervisor seat launch}
      - {path: "scripts/api/orca/<call>.mjs", why: the only Orca form agent prose may cite (scripts/checks/check-host-boundary.mjs)}
    # The retained runtime self-checks `starci runtime check` runs after the runtime check, in this order.
    selfChecks:
      - {id: ops-registry, run: scripts/route/build-ops-registry.mjs, args: [--check]}
      - {id: providers, run: scripts/checks/check-providers.mjs}
      - {id: cli-catalog-drift, run: scripts/cli/gen-catalog.mjs, args: [--check]}
      - {id: cli-parity, run: scripts/checks/check-cli-parity.mjs}
      - {id: cli-only-entry, run: scripts/checks/check-cli-only-entry.mjs}
      - {id: runtime-public-docs, run: scripts/checks/check-runtime-public-docs.mjs}
      - {id: schema-catalog, run: scripts/checks/check-schema-catalog.mjs}
      - {id: schema-shared, run: scripts/checks/check-schema-shared.mjs}
      - {id: json-exceptions, run: scripts/checks/check-json-exceptions.mjs}
      - {id: one-allowlist, run: scripts/checks/check-one-allowlist.mjs}
      - {id: generated-untracked, run: scripts/checks/check-generated-untracked.mjs}
      - {id: work-deep, run: scripts/work/validate/check-work-deep.mjs}
      - {id: host-boundary, run: scripts/checks/check-host-boundary.mjs}
      - {id: module-yaml, run: scripts/checks/check-module-yaml.mjs}
      - {id: op-manifest, run: scripts/checks/check-op-manifest.mjs}
      - {id: failure-codes, run: scripts/checks/check-failure-codes.mjs}
      - {id: hfs-rules, run: scripts/checks/check-hfs-rules.mjs}
      - {id: doc-language, run: scripts/checks/check-doc-language.mjs}
      - {id: i18n-catalog, run: scripts/checks/check-i18n-catalog.mjs}
      - {id: grammar-dist, run: scripts/checks/check-grammar-dist.mjs}
      - {id: canon-pins, run: scripts/checks/check-canon-pins.mjs}
      - {id: example-coupling, run: scripts/checks/check-example-coupling.mjs}
      - {id: doc-owner, run: scripts/checks/check-doc-owner.mjs}
      - {id: dead-scripts, run: scripts/checks/check-dead-scripts.mjs}
      - {id: helper-once, run: scripts/checks/check-helper-once.mjs}
      - {id: clones, run: scripts/checks/check-clones.mjs}
      - {id: export-used, run: scripts/checks/check-export-used.mjs}
      - {id: env, run: scripts/checks/check-env.mjs}
      - {id: specs, run: scripts/checks/check-specs.mjs}
      - {id: worktree-add, run: scripts/checks/check-worktree-add.mjs}
      - {id: examples-ci, run: scripts/checks/check-examples-ci.mjs}
      - {id: guidance-commands, run: scripts/checks/check-guidance-commands.mjs}
      - {id: port-once, run: scripts/checks/check-port-once.mjs}
      - {id: spec-budget, run: scripts/checks/check-spec-budget.mjs}
      - {id: default-once, run: scripts/checks/check-default-once.mjs}
      - {id: version-pin-once, run: scripts/checks/check-version-pin-once.mjs}
      - {id: slot-id-shape, run: scripts/checks/check-slot-id-shape.mjs}
      - {id: undeclared-identifiers, run: scripts/checks/check-undeclared-identifiers.mjs}

slots:

  # ----- root -----------------------------------------------------------------------------------------------
  - id: runtime.declaration
    profiles: [runtime]
    path: hfs.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    why: '{"hfs": 1, "kind": "runtime", "project": "starci"}: the runtime is judged by this manifest'
  - id: runtime.package-manifest
    profiles: [runtime]
    path: "{package.json,package-lock.json}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.root-docs
    profiles: [runtime]
    path: "{README.md,CHANGELOG.md,CONTRIBUTING.md,CONTEXT.md,LICENSE,THIRD_PARTY_NOTICES.md}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [HFS_DOC_NOT_ENGLISH, RT_CITED_PATH_MISSING]
  - id: runtime.config-example
    profiles: [runtime]
    path: config.example.yaml
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.secret-example
    profiles: [runtime]
    path: secret.env.example
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.git-meta
    profiles: [runtime]
    path: "{.gitignore,.gitattributes}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.ci
    profiles: [runtime]
    path: ".github/workflows/<workflow>.yml"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.coverage-config
    profiles: [runtime]
    path: codecov.yml
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.sonar-config
    profiles: [runtime]
    path: sonar-project.properties
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.agent-settings
    profiles: [runtime]
    path: .claude/settings.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [RT_PINNED_PATH_MOVED]
  - id: runtime.local-config
    profiles: [runtime]
    path: "{config.yaml,config.json,secret.env,settings.local.json,scheduled_tasks.lock,.runtime/}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
  - id: runtime.build-output
    profiles: [runtime]
    path: "{**/node_modules/,**/dist/,**/coverage/,**/storybook-static/,**/reference-renders/,**/*.tsbuildinfo}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
  - id: runtime.state-in-tree
    profiles: [runtime]
    path: "{runtime/,worktrees/,mcp/,.starciwork/,.secrets/,.venv/,ex-testing/,ui/.secrets/,ui/.git-starci-status-backup}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "the state root: guards under <runtime root>/.runtime/guards (scripts/guards/guards-root.mjs), lanes under <lanes root>/<project>/<lane>, workflow worktrees owned by Orca, secrets under %LOCALAPPDATA%/StarCi/secrets"
    rules: [HFS_FORBIDDEN_PRESENT, HFS_UNTRACKED_ROOT_ENTRY]
  - id: runtime.agent-output
    profiles: [runtime]
    path: "{_*.mjs,_*.cjs,_*.py,tmp-*,**/tmp-*.mjs,*.bak*,nul,*.txt,3-jobs,LEAD.md,*.log,report*.json,*.tmp.json,.experiments/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "the agent scratchpad or <tmp>/<lane>/; a durable finding goes to docs/<topic>.md"
    rules: [HFS_FORBIDDEN_PRESENT, HFS_UNTRACKED_ROOT_ENTRY]

  # ----- entry ----------------------------------------------------------------------------------------------
  - id: runtime.cli
    profiles: [runtime]
    path: packages/cli/bin/starci.mjs
    presence: required
    tracked: tracked
    tier: entry
    tests: none
    coverage: required
    rules: [RT_PINNED_PATH_MOVED, RT_TIER_DIRECTION]
  - id: runtime.cli-source
    profiles: [runtime]
    # The dispatcher the one `starci` binary runs (packages/cli keeps its published identity under runtime.package): its source is measured by the root suite, its spec stays beside it.
    path: packages/cli/src/
    presence: required
    tracked: tracked
    tier: package
    tests: unit-beside
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_SPEC_PLACEMENT]
  - id: runtime.cli-generated
    profiles: [runtime]
    # Rendered by `starci runtime gen-catalog --write` and the runtime-install generator; never authored, never measured.
    path: "packages/cli/src/{catalog,runtime-install}.generated.mjs"
    presence: required
    tracked: tracked
    tier: package
    tests: none
    coverage: none
    rules: [RT_TIER_DIRECTION]
  - id: runtime.ui
    profiles: [runtime]
    # The harness UI app: a node API server (server.mjs, harness-*.mjs, api/**) and a Vite client (src/**), with its own package.json.
    path: "ui/"
    presence: required
    tracked: tracked
    tier: entry
    owner: true
    requires: [package.json, server.mjs, README.md, CONTRACT.md]
    allows: [package.json, package-lock.json, .gitignore, README.md, CONTRACT.md, DESIGN.md, DEPLOYMENT.md, components.json, eslint.config.mjs, index.html, tsconfig.json, vite.config.ts, server.mjs, harness-process.mjs, harness-verbs.mjs, start.cmd, ports.mjs, ports.d.mts, "api/**", "src/**", "public/**", "fixtures/**"]
    forbids: [run-cloudflared.ps1]
    tests: none
    coverage: none
    rules: [RT_EXTERNAL_OWNER, RT_TIER_DIRECTION]
  - id: runtime.ui-server
    profiles: [runtime]
    # The executable server source of the harness UI, measured by the root suite; the tool configuration, the fixture seeder and the Vite client (src/**, measured by the UI's own tooling) stay under runtime.ui.
    path: "ui/{api/,server.mjs,ports.mjs,harness-process.mjs,harness-verbs.mjs}"
    presence: required
    tracked: tracked
    tier: entry
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION]

  # ----- engine ---------------------------------------------------------------------------------------------
  - id: runtime.foundation
    profiles: [runtime]
    path: "engine/{runtime-root,config,secrets,invalid-config,orca-config,resources-config,temp-root,plain-object,canonical-json,by-code-unit,constants,digest,admission,refuse}.mjs"
    presence: required
    tracked: tracked
    tier: base
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_BASE_IMPURE, RT_EXTERNAL_OWNER]
  - id: runtime.vendored-yaml
    profiles: [runtime]
    # The vendored, frozen YAML bundle (engine/yaml-license.json names its license): a dependency copy, not authored source.
    path: engine/yaml.mjs
    presence: required
    tracked: tracked
    tier: base
    tests: none
    coverage: none
    rules: [RT_TIER_DIRECTION, RT_BASE_IMPURE, RT_EXTERNAL_OWNER]
  - id: runtime.foundation-data
    profiles: [runtime]
    path: engine/yaml-license.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.db
    profiles: [runtime]
    # Store connection owners and their schema and receipt modules. No api import: a value a store needs from git is passed in.
    path: "engine/db/{ledger,ledger-paths,machine,machine-connection,machine-schema,provider-reservations,blob,authorizer}.mjs"
    presence: required
    tracked: tracked
    tier: db
    tests: none
    coverage: required
    rules: [RT_EXTERNAL_OWNER, RT_TIER_DIRECTION]
  - id: runtime.db-schema
    profiles: [runtime]
    path: "engine/db/schema/{runtime,machine}.sql"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    why: "One schema file per store, executed as data by its writer; English comments only"

  # ----- scripts: api (the only external-system callers) ------------------------------------------------------
  - id: runtime.api-system
    profiles: [runtime]
    # One folder per external system: its lib.mjs runner and one file per call (<object>-<verb>.mjs, mirroring the
    # external command words), each exporting exactly one call function named after the file.
    path: "scripts/api/<system>/"
    presence: required
    tracked: tracked
    tier: api
    owner: true
    minInstances: 1
    requires: [lib.mjs]
    allows: [lib.mjs, "<call>.mjs"]
    forbids: [index.mjs]
    tests: none
    coverage: required
    rules: [RT_API_SHAPE, RT_EXTERNAL_OWNER, RT_TIER_DIRECTION, RT_SOURCE_NAME]

  # ----- scripts: base, hfs, machine ----------------------------------------------------------------------------
  - id: runtime.lib
    profiles: [runtime]
    path: "scripts/lib/<name>.mjs"
    presence: required
    tracked: tracked
    tier: base
    tests: none
    coverage: required
    rules: [RT_BASE_IMPURE, RT_EXTERNAL_OWNER, RT_TIER_DIRECTION, RT_HELPER_REDEFINED, RT_HELPER_NEAR_COPY, RT_SOURCE_NAME]
  - id: runtime.hfs
    profiles: [runtime]
    # The ONE standard engine: product HFS (slots, check, architecture machine) and this runtime HFS. Bundled into the
    # published packages by sync-runtime.mjs, so it imports nothing but base, api and packages/hfs.
    path: "scripts/hfs/"
    presence: required
    tracked: tracked
    tier: hfs
    owner: true
    requires: [slots.mjs, check.mjs, runtime-check.mjs, sync-runtime.mjs, architecture.mjs, architecture/, rules/, runtime-rules/]
    allows: ["<name>.mjs", "rules/<rule>.mjs", "runtime-rules/<rule>.mjs", "architecture/<check>.mjs", "sql/<module>.mjs"]
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME]
  - id: runtime.machine
    profiles: [runtime]
    path: "scripts/machine/<name>.mjs"
    presence: required
    tracked: tracked
    tier: machine
    tests: none
    coverage: required
    why: host-wide services over machine.sqlite shared by kernel, supervisor and reconciler (decisions, home, lessons, op-metrics, worktrees, lane-owner, host-resources, ram-throttle, pool-backoff, artifact-hold, terminal-ledger, close-verify)
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME]

  # ----- scripts: kernel, supervisor, reconciler ------------------------------------------------------------------
  - id: runtime.kernel
    profiles: [runtime]
    path: "scripts/kernel/"
    presence: required
    tracked: tracked
    tier: kernel
    owner: true
    requires: [cli.mjs, start-workflow.mjs, verbs/, settle/]
    allows: ["<name>.mjs", "verbs/<verb>.mjs", "verbs/shared/<name>.mjs", "status/<view>.mjs", "settle/<name>.mjs", api-boolean-flags.txt]
    forbids: [api-verbs/, api-lib/, api-status/]
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME, HFS_SIZE_GROWTH, RT_PINNED_PATH_MOVED]
  - id: runtime.kernel-verbs
    profiles: [runtime]
    # One file per modules/cli/commands/kernel/<verb>.yaml (check-cli-parity).
    path: "scripts/kernel/verbs/<verb>.mjs"
    presence: required
    tracked: tracked
    tier: inherit
    tests: none
    coverage: required
    requires: ["/modules/cli/commands/kernel/<verb>.yaml"]
    rules: [RT_TIER_DIRECTION]
  - id: runtime.supervisor
    profiles: [runtime]
    path: "scripts/supervisor/<name>.mjs"
    presence: required
    tracked: tracked
    tier: supervisor
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME, HFS_SIZE_GROWTH, RT_PINNED_PATH_MOVED]
  - id: runtime.reconciler
    profiles: [runtime]
    path: "scripts/reconciler/"
    presence: required
    tracked: tracked
    tier: reconciler
    owner: true
    requires: [boot.mjs, start.mjs, engine.mjs, controllers/]
    allows: ["<name>.mjs", "controllers/<controller>.mjs"]
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME, RT_PINNED_PATH_MOVED]

  # ----- scripts: domain owners -------------------------------------------------------------------------------
  - id: runtime.domain
    profiles: [runtime]
    # One capability per folder; owners import each other without cycles.
    path: "scripts/{agent,route,goal,context,connectors,guards,uat,example,install,housekeeping,work,cli}/"
    presence: required
    tracked: tracked
    tier: domain
    owner: true
    allows: ["<name>.mjs", "<part>/<name>.mjs"]
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, ARCH_OWNER_CYCLE, RT_EXTERNAL_OWNER, RT_SOURCE_NAME, HFS_SIZE_GROWTH]

  # ----- scripts: gates and runtime self-checks ---------------------------------------------------------------
  - id: runtime.gates
    profiles: [runtime]
    # Product op/land gates and proof producers (schema starci/<gate>@N).
    path: "scripts/gates/<gate>.mjs"
    presence: required
    tracked: tracked
    tier: gates
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME, HFS_SIZE_GROWTH]
  - id: runtime.checks
    profiles: [runtime]
    # Runtime self-checks only: each judges the runtime tree with catalogued codes; run by `starci runtime check`.
    path: "scripts/checks/check-<topic>.mjs"
    presence: required
    tracked: tracked
    tier: checks
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME]
  - id: runtime.checks-lib
    profiles: [runtime]
    # Shared implementation helpers used only by runtime self-checks.
    path: "scripts/checks/lib/<name>.mjs"
    presence: required
    tracked: tracked
    tier: checks
    tests: none
    coverage: required
    rules: [RT_TIER_DIRECTION, RT_EXTERNAL_OWNER, RT_SOURCE_NAME]

  # ----- contracts, knowledge, docs, skills ---------------------------------------------------------------------
  - id: runtime.contracts
    profiles: [runtime]
    path: "modules/{cli,kernel,goal,ops,host,models,reconciler,schemas,supervisor}/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [RT_CITED_PATH_MISSING]
  - id: runtime.cli-catalog
    profiles: [runtime]
    # The unified starci CLI catalog (scripts/cli/catalog.mjs validates; gen-catalog.mjs generates packages/cli + docs/cli.md from it).
    path: "modules/cli/commands/{_global.yaml,<group>/_group.yaml,<group>/<verb>.yaml}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [RT_CITED_PATH_MISSING]
  - id: runtime.i18n-catalog
    profiles: [runtime]
    # The Vietnamese message catalog of owner-visible runtime text (scripts/lib/i18n.mjs, scripts/checks/check-i18n-catalog.mjs).
    path: "modules/i18n/messages/<area>.yaml"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.host-contract
    profiles: [runtime]
    path: "modules/host/<system>/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    allows: ["<name>.yaml"]
    rules: [RT_API_SHAPE]
  - id: runtime.knowledge
    profiles: [runtime]
    path: "knowledge/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [HFS_DOC_NOT_ENGLISH, RT_CITED_PATH_MISSING]
  - id: runtime.hfs-manifests
    profiles: [runtime]
    path: "knowledge/hfs/{slots.yaml,rules.yaml,facts.yaml,runtime-slots.yaml,canon-pins.yaml,peer-integrations.yaml,README.md}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.docs
    profiles: [runtime]
    path: "docs/{<topic>.md,examples/<topic>.md}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [HFS_DOC_NOT_ENGLISH, RT_CITED_PATH_MISSING, RT_DOC_NO_OWNER]
  - id: runtime.skill
    profiles: [runtime]
    path: "skills/starci/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    requires: [SKILL.md]
    allows: [SKILL.md, "references/**", agents/openai.yaml]
    rules: [RT_CITED_PATH_MISSING, RT_GUIDANCE_REFUSED_COMMAND]
  - id: runtime.init
    profiles: [runtime]
    path: init/AGENTS.md
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none

  # ----- tests ----------------------------------------------------------------------------------------------
  - id: runtime.tests
    profiles: [runtime]
    # Specs at tests/<area>/<module>[.<topic>].spec.mjs, shared spec code in tests/helpers/, data in tests/fixtures/,
    # --import preloads in tests/setup/; RT_SPEC_PLACEMENT judges the layout inside.
    path: "tests/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    rules: [RT_SPEC_PLACEMENT]

  # ----- packages, generated copies -----------------------------------------------------------------------------
  - id: runtime.packages-meta
    profiles: [runtime]
    path: "packages/{README.md,package.json,package-lock.json,eslint/.gitignore,eslint/CHANGELOG.md,eslint/README.md}"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.package
    profiles: [runtime]
    # A published @starci package: its own layout under its own package.json; specs beside the source as <name>.spec.*.
    path: "packages/{cli,fe-kit,grammar,heroicons,hfs,jest-preset,prettier-config,stylelint,test-world,tsconfig,eslint/be,eslint/fe}/"
    presence: required
    tracked: tracked
    tier: package
    owner: true
    requires: [package.json]
    forbids: [scripts/sync-runtime.mjs]
    tests: unit-beside
    coverage: none
    rules: [RT_TIER_DIRECTION, RT_SPEC_PLACEMENT]
  - id: runtime.package-runtime-copy
    profiles: [runtime]
    # Byte copies of runtime files a published package needs in a product repository; never edited, never imported by
    # runtime code. The roots are ruleParams.runtime.generated: git-ignored output that pack, tests and the check
    # regenerate; a tracked path below them is GENERATED_UNTRACKED.
    path: "packages/{hfs,eslint/be,eslint/fe}/runtime/"
    presence: optional
    tracked: generated
    generatedBy: scripts/hfs/sync-runtime.mjs
    tier: none
    tests: none
    rules: [RT_GENERATED_DRIFT, GENERATED_UNTRACKED]

  # ----- dev stacks, examples, benchmark ---------------------------------------------------------------------
  - id: runtime.ext
    profiles: [runtime]
    path: "ext/<service>/"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    allows: [compose.yaml, cloudflared.yaml, README.md, .gitignore, "secrets/*.enc", secrets/KEYS.md]
  - id: runtime.example-catalog
    profiles: [runtime]
    path: examples/index.yaml
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
  - id: runtime.example
    profiles: [runtime]
    # A product example app; its inside is judged by the PRODUCT HFS (hfs.json kind app; check-example-architecture).
    path: "examples/<app>/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    requires: [hfs.json]
  - id: runtime.example-data
    profiles: [runtime]
    path: "examples/starcistacks-services/"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    why: a .starcistacks services fixture, not an app (no hfs.json)
  - id: runtime.example-runtime-reserved
    profiles: [runtime]
    path: "examples/.runtimes/"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "the curated per-project fixture paths of runtime.example-runtime-fixtures"
  - id: runtime.example-runtime-fixtures
    profiles: [runtime]
    # Curated sample PROJECT snapshots and selected public CAS fixtures; operational storage stays external.
    # The sample producer must validate project identity, digest/prefix, public payloads and absence of workflow/history rows.
    path: "examples/.runtimes/<example-project>/"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none
    requires: [runtime.sqlite]
    allows: ["artifacts/<sha-prefix>/<sha256>", "artifacts/<sha-prefix>/<sha256>.json"]
    why: "CAS fixture paths follow engine/db/blob.mjs; path admission does not qualify the payload or grant runtime effects."
  - id: runtime.example-runtime-transients
    profiles: [runtime]
    path: "examples/.runtimes/<example-project>/{runtime.sqlite-wal,runtime.sqlite-shm,runtime.sqlite-journal,artifacts-views/,cache/,views/,captures/,logs/,traces/}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
  - id: runtime.benchmark
    profiles: [runtime]
    path: "benchmark/{README.md,expectations.yaml,snapshots/<snapshot>.json}"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    coverage: none

consumers:
  - scripts/hfs/slots.mjs
  - scripts/hfs/runtime-check.mjs
  - scripts/checks/check-host-boundary.mjs
  - scripts/checks/check-contract-cites.mjs
  - packages/cli/bin/starci.mjs
