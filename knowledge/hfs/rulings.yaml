# HFS owner decisions, including the historical clauses their successors amend.
# Rule cases retain their catalog identity; the canonical case citation is ruling:R212/case-4.
# Dates identify the recorded decision, not the date a worker implements its enforcer.
# enforcedBy names rule owners; it does not claim that another alpha.15 batch has already landed.
# Structured rule/case links have the same meaning as R212/case-4 in the ruling-cite index.
schema: starci/hfs-rulings@1

rulings:
  - id: hfs-complete-standard
    date: '2026-10-14'
    topic: standard.coverage
    status: live
    ownerRuling: 1
    source: A15-STANDARD section 0.1 item 1
    statement: >-
      Alpha.15 is the complete HFS standard for lite and full; every applicable surface in each edition
      needs its requirement, rule, enforcer, template, example, documentation and proof.
    supersedes: []
    enforcedBy: [R247, R274]

  - id: lite-production-swarm
    date: '2026-10-14'
    topic: deploy.lite-production
    status: live
    ownerRuling: 2
    source: A15-STANDARD section 0.1 item 2
    statement: >-
      Lite production declares runtime docker-swarm in .starcistacks/application-stacks.yaml and tracks
      the rendered stack under .starcistacks/production/infra/swarm/. The VPS runs neither Compose nor
      a host crontab; scheduling is app-owned through the back-end scheduler, pgmq or a pg_cron tick,
      or through a declared replicated-job.
    supersedes:
      - {rule: R212, case: case-1}
      - {rule: R212, case: case-2}
      - {rule: R212, case: case-3}
    amendmentScope: Lite hosting, stack layout and scheduling clauses only.
    enforcedBy: [R10, R212, R250, R266, R267, R268]

  - id: single-declared-ingress
    date: '2026-10-14'
    topic: deploy.ingress
    status: live
    ownerRuling: 3
    source: A15-STANDARD section 0.1 item 3
    statement: >-
      Any single declared ingress component is accepted, including Traefik or Caddy, with its image
      pinned by digest; the canon selects no particular ingress implementation.
    supersedes: []
    enforcedBy: [R266, R275]

  - id: lite-backing-services
    date: '2026-10-14'
    topic: deploy.lite-backing-services
    status: live
    ownerRuling: 4
    source: A15-STANDARD section 0.1 item 4
    statement: >-
      Lite uses Supabase and has no self-hosted Postgres. A sidecar that needs a database uses SQLite
      on a declared persistent volume; a sidecar requiring Postgres, Redis or Mongo is refused.
    supersedes: []
    enforcedBy: [R276]

  - id: sealed-secret-custody
    date: '2026-10-14'
    topic: security.secret-custody
    status: live
    ownerRuling: 5
    source: A15-STANDARD section 0.1 item 5
    statement: >-
      Product secrets exist only as sops/age sealed .starcistacks/<env>/secrets/*.enc members.
      Plaintext secret files are never tracked, placed in deploy/ or put in a workflow; the private age
      identity is held only as SOPS_AGE_KEY in the owner's untracked .claude/secret.env.
    supersedes: [platform-age-file-custody]
    enforcedBy: [R06, R253, R277]

  - id: R212/case-4
    date: '2026-10-14'
    topic: work.lite-boundary
    status: live
    ownerRuling: 6
    source: knowledge/hfs/rules.yaml R212 cases.case-4; A15-STANDARD section 0.1 item 6
    statement: >-
      Lite .starciwork admits only .gitignore, optional workspace.yaml and brand/** in the existing brand
      tooling layout. workspace.yaml may carry project identity and repository roles; readers skip full
      catalog, shell and feature metadata. The tree is optional without brand records; full keeps its Work tree.
    supersedes:
      - {rule: R212, case: case-1}
      - {rule: R212, case: case-2}
      - lite-work-brand-only
    amendmentScope: The lite Work boundary; other historical code and adapter clauses keep their own successors.
    enforcedBy: [R212]

  - id: typed-app-environment
    date: '2026-10-14'
    topic: code.be-environment
    status: live
    ownerRuling: 7
    source: A15-STANDARD section 0.1 item 7
    statement: >-
      Every back-end app has apps/<app>/src/<app>.env.ts with an interface and read<App>Env(env: EnvSource).
      The app reads its environment through that boundary; main.ts delegates and holds no parsing of its own,
      and app.module.ts spreads composition groups instead of holding an inline module list.
    supersedes: [R245]
    amendmentScope: The optional inline parsing clause of R245; the other app-role restrictions remain in force.
    enforcedBy: [R248, R289]

  - id: fe-auth-only
    date: '2026-10-13'
    topic: security.fe-data-door
    status: live
    ownerRuling: 8
    source: A15-STANDARD section 0.1 item 8; knowledge/hfs/rules.yaml R212 cases.case-2
    statement: >-
      The front end uses Supabase for Auth only and accesses application data through the back end.
      The front-end client boundary and the database grants, policies and realtime publication boundary
      enforce this decision; declared direct-access exceptions are explicit and listed.
    supersedes: []
    enforcedBy: [R217, R254]

  - id: graphql-default-door
    date: '2026-10-13'
    topic: code.be-transport
    status: live
    ownerRuling: 9
    source: A15-STANDARD section 0.1 item 9
    statement: >-
      GraphQL is the default application door. REST is reserved for probes, auth handshakes, signed
      webhooks, byte streams and the public v1 table; the reason and route evidence apply in both editions.
    supersedes: []
    enforcedBy: [R278, R290]

  - id: owner-run-steps
    date: '2026-10-14'
    topic: deploy.owner-steps
    status: live
    ownerRuling: 10
    source: A15-STANDARD section 0.1 item 10
    statement: >-
      DNS changes, provider URIs, docker swarm init and key rotation remain owner-run steps.
      The standard requires those steps and their evidence to be declared and never automates them.
    supersedes: []
    enforcedBy: [R266, R267]

  - id: lite-contract-specs
    date: '2026-10-14'
    topic: proof.lite-contract
    status: live
    source: A15-STANDARD section 2.2 decision 1
    statement: >-
      Lite may have tests/contract and test:contract. The owner's HFS standard relaxes the older contract
      refusal in R212, be.tests.contract and edition.mjs; e2e, stack and browser runs remain full-only.
    supersedes:
      - {rule: R212, case: case-1}
    amendmentScope: The lite contract-world prohibition only; the full-only e2e boundary remains.
    enforcedBy: [R212]

  - id: lite-webhook-after-commit
    date: '2026-10-14'
    topic: code.be-webhook-handoff
    status: live
    source: A15-STANDARD section 2.2 decision 2
    statement: >-
      Lite webhook intake records its receipt and typed outbox event in the transaction. A reactor or job
      processes the event after commit; processing never runs inside the intake transaction.
    supersedes: []
    enforcedBy: [R263]

  - id: locale-accept-language
    date: '2026-10-14'
    topic: code.fe-locale-header
    status: live
    source: A15-STANDARD section 2.2 decision 3
    statement: >-
      The single front-end locale writer sends Accept-Language, and back-end localization reads that
      header; the previous custom locale header is retired in templates, lint and examples.
    supersedes: []
    enforcedBy: [R50]

  - id: lite-fe-app-cardinality
    date: '2026-10-14'
    topic: code.fe-app-cardinality
    status: live
    source: A15-STANDARD section 2.2 decision 4
    statement: Lite may have more than one front-end app; the earlier single-app wording is removed.
    supersedes: []
    enforcedBy: [R212]

  - id: code-function-feature-budgets
    date: '2026-10-14'
    topic: code.size-budgets
    status: live
    source: A15-STANDARD section 2.2 decision 5
    statement: A function is at most 80 lines in back-end and front-end code, and a feature holds at most 250 files.
    supersedes: []
    enforcedBy: [R291, R292]

  - id: R265
    date: '2026-10-14'
    topic: code.be-composition
    status: live
    source: A15-STANDARD section 2 R265 and section 2.1 R245 text
    statement: >-
      App module composition is type-based, including aliased imports, saved registrations and typed
      scheduler arrays. compose/<area>.ts holds composition only; business branches or arrows belong
      in their feature or domain role, and app.module.ts spreads the composition groups.
    supersedes: [R245]
    amendmentScope: The name-based composition detector only; the app-role restrictions remain in force.
    enforcedBy: [R32, R265, R289]

  - id: R246
    date: '2026-10-14'
    topic: code.be-app-file-budgets
    status: live
    source: knowledge/hfs/rules.yaml R246
    statement: >-
      App-role budgets are absolute: main.ts 80 lines, <app>.env.ts 150, <app>.options.ts 200,
      compose/<area>.ts 120 and app.module.ts 250. Parsing and composition move to their owning
      roles when an app file outgrows its budget.
    supersedes: []
    enforcedBy: [R246]

  - id: observability-required-signals
    date: '2026-10-14'
    topic: observability.required
    status: live
    source: A15-STANDARD section 0.2 observability decisions
    statement: The logger port, live and ready probes, and Docker HEALTHCHECK are mandatory in both editions.
    supersedes: []
    enforcedBy: [R40, R71, R189, R262]

  - id: observability-deferred-signals
    date: '2026-10-14'
    topic: observability.deferred
    status: live
    source: A15-STANDARD section 0.2 observability decisions; section 6
    statement: >-
      Request-id correlation, metrics and tracing are outside alpha.15; their mandatory status remains
      pending an owner decision and creates no new alpha.15 failure code.
    supersedes: []
    enforcedBy: []
    gap: P2 owner decision pending; no mandatory request-id, metrics or tracing enforcer is scheduled.

  - id: fe-error-reporter-optional
    date: '2026-10-14'
    topic: observability.fe-reporter
    status: live
    source: A15-STANDARD section 0.2 observability decisions
    statement: >-
      A front-end error reporter is documented optional and declared through hfs.json observe.reporter;
      FE_OBSERVE_MISSING is not introduced unless the owner makes the reporter mandatory.
    supersedes: []
    enforcedBy: []
    gap: Optional declaration only; no missing-reporter finding is authorized.

  - id: R212/case-1 # Historical decision; Work boundary amended by ruling:R212/case-4.
    date: '2026-10-12'
    topic: edition.shared-architecture
    status: amended
    source: knowledge/hfs/rules.yaml R212 cases.case-1
    statement: >-
      The initial lite decision keeps the full monorepo and code architecture, unit-spec requirements,
      Supabase adapters and an additive upgrade path. Its hosting, realtime, contract and Work clauses
      are historical and are amended by the successors below.
    supersedes: []
    amendedBy: [R212/case-2, R212/case-4, lite-production-swarm, lite-contract-specs]
    amendmentScope: Realtime adapter, lite Work boundary, production stack and scheduling, and contract specs.
    enforcedBy: [R212]

  - id: R212/case-2 # Historical decision; Work boundary amended by ruling:R212/case-4.
    date: '2026-10-13'
    topic: edition.shared-frontend-and-realtime
    status: amended
    source: knowledge/hfs/rules.yaml R212 cases.case-2
    statement: >-
      Lite and full share the same front-end standard and code structure. Lite realtime uses a socket.io
      gateway inside one back-end api process without a Redis adapter; the front end uses Supabase for
      Auth only. Later decisions amend the hosting and lite Work clauses while retaining those boundaries.
    supersedes:
      - {rule: R212, case: case-1}
    amendedBy: [R212/case-4, lite-production-swarm]
    amendmentScope: The lite Work and production hosting clauses only.
    enforcedBy: [R212, R217]

  - id: R212/case-3 # Historical hosting clause amended by owner:lite-production-swarm.
    date: '2026-10-13'
    topic: edition.adapters-baseline-and-assets
    status: amended
    source: knowledge/hfs/rules.yaml R212 cases.case-3
    statement: >-
      Both editions share the HFS tree above the platform and integration seam, with different database,
      identity, storage, queue, realtime and event-bus adapters. Existing apps cut over through a baseline
      marked applied without re-running it and archive prior migrations. Static templates are domain-owned
      TypeScript constants; small build-time binaries are be.assets, and large or user media use object storage.
    supersedes: []
    amendedBy: [lite-production-swarm]
    amendmentScope: The lite production hosting clause; adapter, baseline and asset policies remain.
    enforcedBy: [R212, R213, R257, R282]

  - id: R245
    date: '2026-10-14'
    topic: code.be-app-roles
    status: amended
    source: knowledge/hfs/rules.yaml R245; A15-STANDARD section 0.1 item 7
    statement: >-
      The app roles separate boot, typed environment, options, composition groups and the app module.
      The older option to parse environment inline in main.ts is replaced by a required typed app environment
      boundary, and the name-based composition detector is replaced by type-based checks.
    supersedes: []
    amendedBy: [typed-app-environment, R265, R289]
    amendmentScope: Optional inline environment parsing and the name-based composition detector.
    enforcedBy: [R245, R265, R289]

  - id: lite-work-brand-only
    date: '2026-10-14'
    topic: work.lite-boundary
    status: superseded
    source: knowledge/hfs/rules.yaml R212 cases.case-4 quote and amended ruling
    statement: The initial restriction to brand records was clarified to permit .gitignore and optional workspace.yaml too.
    supersedes: []
    amendedBy: [R212/case-4]
    enforcedBy: [R212]

  - id: platform-age-file-custody
    date: '2026-10-14'
    topic: security.age-key-custody
    status: superseded
    source: knowledge/patterns/repo/secrets.yaml provenance.limitations and REPO-SECRETS-4; A15-STANDARD section 3 seeds
    statement: >-
      The dated repository-secrets guidance retained the platform default age identity file outside Git.
      The standard replaces that custody guidance with SOPS_AGE_KEY in .claude/secret.env.
    supersedes: []
    amendedBy: [sealed-secret-custody]
    enforcedBy: [R253]

  - id: module-definition-everywhere
    date: '2026-10-15'
    topic: code.be-module-shape
    status: live
    ownerRuling: 11
    source: owner ruling 2026-10-15 (alpha.16 module-definition job); knowledge/patterns/be/folder.yaml BE-FOLDER-3
    statement: >-
      Every NestJS module has a module definition: capability modules, sub-modules, features, transport
      modules, cli groups and integrations. The earlier clause "no module-definition in an api feature" is
      superseded. A module <x> has <x>.module-definition.ts (ConfigurableModuleBuilder<XOptions>, method
      name register), <x>.options.ts (export type XOptions, Record<string, never> when it takes nothing
      yet) and <x>.module.ts (a class extending ConfigurableModuleClass); app compose groups and modules
      register it with XModule.register({...}).
    supersedes: []
    amendmentScope: The BE-FOLDER-3 clause that forbade a module-definition in an api feature, and the plain-static-module clause of R45 for sub-modules, features and transports.
    enforcedBy: [R45, R295]

  - id: heroicons-family-icon-set
    date: '2026-10-13'
    topic: code.fe-glyph-source
    status: live
    source: modules/kernel/owner-rulings.yaml heroicons-family-icon-set; A15-STANDARD section 2.1 R286
    statement: >-
      The heroicons family is the application icon set. @heroicons/react supplies the base glyphs and
      @starci/heroicons supplies missing brand or domain glyphs in the same style, through the Icon leaf.
      Only a leaf declared as a brand mark in hfs.json may hold inline path artwork.
    supersedes: []
    enforcedBy: [R93, R286]

  - id: ambient-id-test-world-exemption
    date: '2026-10-16'
    topic: code.be-ambient-id
    status: live
    ownerRuling: 12
    source: owner ruling 2026-10-16 "Theo y tro" (alpha.18 single release, a17 PROPOSALS section D, R142); packages/eslint/be/ambient-id.mjs
    statement: >-
      The test world (slot be.tests.world) is the composition root of tests and names real resources, so it is
      exempt from BE_AMBIENT_ID exactly as it is from the clock rule: ambient id sources (randomUUID, uuid v1/v4/v6/v7,
      nanoid, ulid) stay forbidden everywhere else, specs included, outside platform/ids. The enforcer's exemption and its
      regression spec are the intended behaviour; the catalog law is amended to say so.
    supersedes: []
    amendmentScope: The clause of R142 that said ambient ids are used only inside platform/ids "specs included", without the test-world exception.
    enforcedBy: [R142]

  - id: feature-type-file-register-enum-type
    date: '2026-10-16'
    topic: code.be-graphql-enum
    status: live
    ownerRuling: 13
    source: owner ruling 2026-10-16 "Theo y tro" (the owner delegated the decision to main) (alpha.18 NIVO canon request D); packages/eslint/be/feature-thin.mjs
    statement: >-
      A registerEnumType(...) call of @nestjs/graphql is allowed at module top level of a feature GraphQL
      <name>.type.ts file of the be.transport.graphql slot, because starci app emit loads only the resolver,
      scalar and include module files and the schema enum must be registered in a file the resolver imports.
      The same call in any other role or slot, nested in a function, or imported from another module still
      fails HFS_FEATURE_LOGIC_ROLE.
    supersedes: []
    amendmentScope: Clause of R264 that allowed no executable call in a feature <name>.type.ts file, for registerEnumType only.
    enforcedBy: [R264]

  - id: hooks-compose-hooks
    date: '2026-10-16'
    topic: code.fe-hooks
    status: live
    ownerRuling: 14
    source: owner ruling 2026-10-16 "Theo y tro" (the owner delegated the decision to main) (alpha.18 NIVO canon request C); packages/eslint/fe/hooks-folder.mjs
    statement: >-
      A function in a hooks folder is a hook when it calls a hook: a React, SWR or Redux hook, a use* function
      imported from the app's own hooks folders (hooks/swr wrappers, sibling domain hooks; resolved by TypeScript
      symbol resolution through barrels), or an explicitly listed library hook (next-intl useTranslations,
      useLocale, useFormatter, useNow, useTimeZone, useMessages; next/navigation; react-hook-form; zustand). A file
      that exports a non-hook (a helper, a constant, a component) still fails.
    supersedes: []
    amendmentScope: The direct-call-only reading of FE_HOOKS_ARE_HOOKS fake-hook detection in R56.
    enforcedBy: [R56]

  - id: credential-guarded-rest-door
    date: '2026-10-16'
    topic: code.be-transport
    status: live
    ownerRuling: 15
    source: owner ruling 2026-10-16 "Theo y tro" (the owner delegated the decision to main) (alpha.18.1 patch, NIVO findings rest-door-needs-a-reason and rest-route-declared); packages/eslint/be/operations.mjs
    statement: >-
      A REST route that serves an external machine client (n8n, loyalty till, external API, agent tools) and is
      protected by a credential guard satisfies the evidence of BE_REST_DOOR_EVIDENCE and BE_REST_ROUTE_UNDECLARED
      through that guard, so its wire format is not forced into the defineOperations contract. The declaration is
      the route's (or its controller's) @Credential({ kind: "<literal>" }) decorator imported from the domain identity
      capability, and the same capability declares a CredentialGuard class implementing CanActivate; both are resolved by
      TypeScript symbol resolution. Anonymous public REST routes still need one of the four closed PublicReason values
      and an unguarded route still fails.
    supersedes: []
    amendmentScope: Clause of R278 that allowed a public versioned operation table as the only evidence for a JSON REST route outside probes, handshakes, webhooks and byte streams.
    enforcedBy: [R278, R290]

  - id: auth-callback-email-link
    date: '2026-10-17'
    topic: code.fe-route
    status: live
    ownerRuling: 16
    source: owner ruling 2026-10-17 "Theo y tro" (the owner delegated the decision to main) (alpha.18.1 patch, NIVO canon request F); packages/eslint/fe/callback-shape.mjs
    statement: >-
      A Supabase auth callback route (fe.route.callback), owned by the auth module, may perform exactly the
      one exchangeAuthCode(code) (or auth.exchangeCodeForSession(code)) and, for an email confirmation or recovery link,
      exactly one awaited verifyOtp({ token_hash, type }) of the auth owner (the auth client, or verifyOtp from
      modules/auth/server), whose two properties are read from the query values token_hash and type. Nothing else is
      added: no other call, no cookie write, no data access, no second HTTP handler, no JSON response; a token_hash
      never reaches a redirect target.
    supersedes: []
    amendmentScope: Clause of R287 that allowed the PKCE code exchange as the only credential exchange of the callback.
    enforcedBy: [R287]

  - id: auth-callback-pure-helpers
    date: '2026-10-17'
    topic: code.fe-route
    status: live
    ownerRuling: 19
    source: owner ruling 2026-10-17 "Theo y tro" (the owner delegated the decision to main) (alpha.18.1 patch, NIVO canon request F2); packages/eslint/fe/callback-shape.mjs
    statement: >-
      The auth callback may call pure helpers imported from the app's modules/routes or modules/auth to compute the
      redirect target and to validate next (requestOrigin, safeNextPath), may read static route tables of modules/routes,
      and may branch on the exchange outcome's success or ok flag. A pure helper is found by TypeScript symbol
      resolution: a synchronous function that returns text, holds no await or yield, reaches no network, storage, DOM,
      process, require or console global, and calls only locals, language built-ins, readers of modules/config and other
      pure helpers of modules/routes or modules/auth. A helper that does I/O, awaits, imports a library value or a
      module outside those owners, or returns a non-text value is refused, as is a credential (code, token_hash) passed
      to a helper. Open-redirect protection is a security property and stays in the owner modules.
    supersedes: []
    amendmentScope: Clause of R287 that allowed only APP_ROUTES and inline expressions in the callback and an exchange outcome read only through error.
    enforcedBy: [R287]

  - id: oauth-redirect-not-webhook
    date: '2026-10-17'
    topic: code.be-transport
    status: live
    ownerRuling: 17
    source: owner ruling 2026-10-17 "Theo y tro" (the owner delegated the decision to main) (alpha.18.1 patch, NIVO canon request G); packages/eslint/be/webhooks.mjs
    statement: >-
      A third-party OAuth redirect into the API (the consent callback of Google or Meta) is not a webhook door. A GET
      route that declares @Public({ reason: PublicReason.AuthHandshake }) of the identity owner, on the route or on its
      controller, is exempt from the webhook, callback and events path test of BE_WEBHOOK_SCOPE when its path is not a
      webhook or events path. A POST route, a webhook or events path, any other reason (a local enum member included) and
      every SignedWebhook route stay judged: signed deliveries still belong in the webhook door.
    supersedes: []
    amendmentScope: Clause of R263 that sent every public controller route containing webhook, callback or events into the webhook door.
    enforcedBy: [R263]

  - id: webhook-receipt-port
    date: '2026-10-17'
    topic: code.be-transport
    status: live
    ownerRuling: 18
    source: owner ruling 2026-10-17 "Theo y tro" (the owner delegated the decision to main) (alpha.18.1 patch, NIVO canon request J); packages/eslint/be/lib/webhook-handoff-intake.mjs
    statement: >-
      The receipt transaction of a webhook intake records the inbox delivery and publishes its typed outbox event. A call
      inside it on a domain receipt port is that record and not processing. A receipt port is a domain class with no
      base class whose constructor takes only platform ports and TypeORM, at least one of them the platform Inbox. A call on any other
      domain service, on the command or query bus, or a process callback inside the transaction is processing and fails
      BE_WEBHOOK_SCOPE with the finding that names the intake, not the signed metadata.
    supersedes: []
    amendmentScope: Reading of R263 under which every domain service call inside the receipt transaction was business processing, including a domain receipt wrapper of the platform Inbox.
    enforcedBy: [R263]

  - id: alpha20-secrets-by-consumer
    date: '2026-10-17'
    topic: standard.ci-custody
    status: live
    ownerRuling: 20
    source: "the owner (thay) in chat to the main coordinator, relayed to the a20 lead; owner:alpha20-secrets-by-consumer (2026-10-17)"
    statement: >-
      The five consumer classes are app secrets in sealed .enc members, app public config in the manifest, CI secrets in GitHub secrets, CI public config in GitHub vars, and Dependabot secrets in its own store. The services block renders Sonar, Codecov, Dependabot and audit configuration. Runtime examples use SonarCloud and Codecov cloud; private apps use their own Sonar host (NIVO: sonar.starci.org). CI quality includes audit in the release gate, skipping Codecov without coverage, parallel fast/test/build jobs with a dependent Sonar job, lockfile caches, immutable SHA pins, and cut/app gate refusal on red main CI with an owner-only override recording who and why. Remove the alpha.19 bootstrap and add encrypted outside-repository DB dump plus explicitly armed linked reset with backup and auth/storage choices.
    supersedes: []
    enforcedBy: [R296, R297, R298, R269, R251]

  - id: owner:quality-services-optional
    date: '2026-10-17'
    topic: standard.quality-services
    status: live
    source: "the owner in chat to main, relayed to the a20 lead"
    statement: >-
      sonar and codecov each get an `optional` setting in services (default true for self-hosted sonar). When optional and the provider is not reachable, the CI step SKIPS with a clear notice instead of failing. Sonar: probe <host>/api/system/status == UP with a short timeout before the scan and quality-gate steps. Codecov: skip when the upload endpoint or OIDC token is unavailable (fail_ci_if_error false when optional), plus the existing skip-without-lcov. When optional: false, keep it strict. The same applies to the app release gate's --sonar. Render it for the examples and skeletons too.
    supersedes: []
    enforcedBy: []
