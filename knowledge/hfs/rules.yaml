  - id: R295
    code: "BE_MODULE_DEFINITION_MISSING"
    law: "Every NestJS module of the product has a module definition (owner ruling 2026-10-15, owner:module-definition-everywhere): capability modules, sub-modules, features, transport modules and cli groups alike. For a module `<x>` the folder holds `<x>.module-definition.ts` (`export const { ConfigurableModuleClass, MODULE_OPTIONS_TOKEN, OPTIONS_TYPE } = new ConfigurableModuleBuilder<XOptions>().setClassMethodName(\"register\").build()`; the representative module of a capability keeps `.setExtras({ isGlobal: false }, ...)`), `<x>.options.ts` (`export type XOptions`, `Record<string, never>` with a one-line doc when it takes nothing yet) and `<x>.module.ts` (`@Module({...}) export class XModule extends ConfigurableModuleClass {}`, no `register` override except the capability representative's). A module appears in an `imports` array or in an app composition group only as `XModule.register({...})`, never as a bare class. The `AppModule` of an app root and the test world are composition roots and are not judged."
    kinds: [lint, codemod]
    gates: [pre-commit, settle, land, ci]
    failureCodes: ["BE_MODULE_DEFINITION_MISSING"]
    enforcers:
      - {kind: eslint-be, id: module-definition-required}
      - {kind: eslint-be, id: capability-module-shape}
    editions: [lite, full]
    docs:
