# knowledge/hfs/rules.yaml - the machine-readable catalog of the HFS rules (the ids run R01 up without gaps; count them, never type the count).
#
# One entry per rule: its id, its finding code, a Vietnamese title, the law in one line, how a violation is fixed
# (`kinds`), the gates it runs at, the failure codes it reports, and every enforcer that judges it. The prose of each
# rule is knowledge/hfs/README.md (section 12 lists the same ids and codes); this file is the data behind it. Read it only
# through scripts/lib/hfs-slots.mjs (loadRuleCatalog, rules); its shape is modules/schemas/hfs-rules.schema.yaml.
#
# An enforcer is a check that exists or one still owed. `status: planned` marks one owed: the architecture machine, the
# hfs CLI, stylelint and Sonar lanes fill them, and the entry's `status` is removed the day the check ships (the check
# refuses a planned enforcer that already exists). An existing eslint enforcer is a rule id of the plugin
# `@starci/eslint-canon-be` or `@starci/eslint-canon-fe`; an existing machine, hfs or work-validate enforcer names the file
# (`at`) that emits one of the rule's codes. scripts/checks/check-hfs-rules.mjs holds all of this to the packages, the
# scripts and modules/kernel/failure-codes.yaml.
#
# Every rule is an error from 2.0. There is no baseline, allowlist or suppression file. Codes are quoted: the failure-code
# scanner reads this file as an emitter of every code it names.
schema: starci/hfs-rules@1
version: 1.0.0
gates:
  pre-commit: lint-staged on staged files - Prettier, ESLint canon, stylelint, secrets guard; under 10 seconds
  pre-push: typecheck, lint:check, hfs check --fast and the affected unit specs; runs every pre-commit rule again
  settle: hfs check --paths <owned paths> and ESLint on the op's paths; a red result does not settle the op
  land: full hfs check, canon scan, unit and build before a commit enters main; runs every rule
  ci: GitHub Actions runs the same pinned hfs check, lint, typecheck, unit with coverage, build and prettier --check
  sonar: Sonar quality gate - duplication, cognitive complexity and coverage on new code
enforcerKinds:
  eslint-be: a rule of the plugin @starci/eslint-canon-be (id without the plugin prefix)
  eslint-fe: a rule of the plugin @starci/eslint-canon-fe (id without the plugin prefix)
  stylelint: a rule of the @starci/stylelint-canon package
  machine: a check of the architecture machine (scripts/checks/architecture), which reads the import graph
  hfs: a check of the hfs CLI that reads the repository tree, configuration, contracts or catalogs
  work-validate: a check of scripts/checks/work-validate.mjs over a .starciwork tree
  sonar: a condition of the Sonar quality gate
rules:
  - id: R01
    code: "HFS_SLOT_UNDECLARED"
    title_vi: "Đường dẫn không thuộc ô nào"
    law: "Every tracked path matches exactly one slot."
    kinds: [check]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["HFS_SLOT_UNDECLARED"]
    enforcers:
      - {kind: hfs, id: slot-undeclared, status: planned}
  - id: R02
    code: "HFS_SLOT_REQUIRED_MISSING"
    title_vi: "Ô thiếu tệp bắt buộc"
    law: "A slot is missing a required file (feature `index.ts`, app composition spec, FE `global-error.tsx`)."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_SLOT_REQUIRED_MISSING"]
    enforcers:
      - {kind: hfs, id: slot-required-missing, status: planned}
  - id: R03
    code: "HFS_UNTRACKED_ROOT_ENTRY"
    title_vi: "Mục lạ ở gốc kho"
    law: "No untracked or ignored entry outside an `ignored` slot."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_UNTRACKED_ROOT_ENTRY", "HFS_EMPTY_DIR", "HFS_GHOST_TREE"]
    enforcers:
      - {kind: hfs, id: untracked-root-entry, at: scripts/lib/hfs-check.mjs}
  - id: R04
    code: "HFS_GITIGNORE_BLOCK_DRIFT"
    title_vi: "Khối .gitignore lệch bản render"
    law: "The managed `.gitignore` block equals its render."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_GITIGNORE_BLOCK_DRIFT"]
    enforcers:
      - {kind: hfs, id: gitignore-block-drift, status: planned}
  - id: R05
    code: "HFS_MANAGED_FILE_DRIFT"
    title_vi: "Tệp do .claude quản lý bị lệch"
    law: "A managed file equals its template render."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_MANAGED_FILE_DRIFT"]
    enforcers:
      - {kind: hfs, id: managed-file-drift, at: packages/hfs/sync/managed.mjs}
  - id: R06
    code: "HFS_PLAINTEXT_SECRET"
    title_vi: "Bí mật dạng rõ trong kho"
    law: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`."
    kinds: [check, design]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_PLAINTEXT_SECRET"]
    enforcers:
      - {kind: hfs, id: plaintext-secret, status: planned}
  - id: R07
    code: "HFS_AGENT_DATA_TRACKED"
    title_vi: "Dữ liệu của agent bị track"
    law: "`.starciwork` holds product records only."
    kinds: [check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["HFS_AGENT_DATA_TRACKED"]
    enforcers:
      - {kind: work-validate, id: agent-data-tracked, at: scripts/checks/check-example-work.mjs}
  - id: R08
    code: "HFS_WORK_NODE_RETIRED"
    title_vi: "Còn record work/node đã bỏ"
    law: "Only flat family records, never `work/node`."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_WORK_NODE_RETIRED"]
    enforcers:
      - {kind: work-validate, id: work-node-retired, at: scripts/checks/check-example-work.mjs}
  - id: R09
    code: "HFS_IDENTITY_CUSTODY"
    title_vi: "Bí mật của identity sai chỗ"
    law: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_IDENTITY_CUSTODY", "SEALED_CUSTODY_LOCATION", "SEALED_FILE_IN_WORK"]
    enforcers:
      - {kind: work-validate, id: sealed-custody-location, at: scripts/checks/check-work-artifacts.mjs}
      - {kind: work-validate, id: identity-custody-role, at: scripts/checks/check-example-work.mjs}
  - id: R10
    code: "HFS_STACKS_SHAPE"
    title_vi: "Hình dạng .starcistacks sai"
    law: "`.starcistacks` has the standard shape and the host Sonar owner."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_STACKS_SHAPE"]
    enforcers:
      - {kind: hfs, id: stacks-shape, status: planned}
  - id: R11
    code: "HFS_SONAR_CONFIG"
    title_vi: "Cấu hình Sonar lệch"
    law: "Sonar config is generated, with no host URL and matching coverage exclusions."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_SONAR_CONFIG"]
    enforcers:
      - {kind: hfs, id: sonar-config, status: planned}
  - id: R12
    code: "HFS_E2E_IN_AUTOMATIC_GATE"
    title_vi: "e2e chạy trong cổng tự động"
    law: "e2e never joins husky, coverage or automatic CI."
    kinds: [check]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_E2E_IN_AUTOMATIC_GATE"]
    enforcers:
      - {kind: machine, id: e2e-in-automatic-gate, at: scripts/checks/architecture/hfs.mjs}
  - id: R13
    code: "HFS_CI_MISSING_CANON"
    title_vi: "CI thiếu bước canon"
    law: "CI runs the pinned `@starci/hfs check`; pre-push runs typecheck and lint; a clone never redirects `core.hooksPath` away from husky."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_CI_MISSING_CANON", "HFS_HOOKS_PATH_REDIRECTED"]
    enforcers:
      - {kind: machine, id: hooks-path-not-redirected, at: scripts/checks/architecture/hfs.mjs}
      - {kind: hfs, id: ci-missing-canon, status: planned}
  - id: R14
    code: "HFS_DEP_VERSION_SKEW"
    title_vi: "Một gói nhiều phiên bản"
    law: "One version per dependency in the workspace."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_DEP_VERSION_SKEW"]
    enforcers:
      - {kind: hfs, id: dep-version-skew, status: planned}
  - id: R15
    code: "HFS_CANON_PIN_DRIFT"
    title_vi: "Phiên bản canon lệch bản pin"
    law: "Canon packages and frameworks match `canon-pins.yaml`."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_CANON_PIN_DRIFT"]
    enforcers:
      - {kind: hfs, id: canon-pin-drift, at: scripts/lib/hfs-check.mjs}
  - id: R16
    code: "HFS_TOOL_CONFIG_LOCAL"
    title_vi: "Kho tự đặt luật cục bộ"
    law: "Configs only call the factories; no local rules."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_TOOL_CONFIG_LOCAL"]
    enforcers:
      - {kind: hfs, id: tool-config-local, at: packages/hfs/sync/managed.mjs}
      - {kind: hfs, id: tool-config-forbidden, at: scripts/lib/hfs-check.mjs}
  - id: R17
    code: "HFS_RULE_OFF_WITHOUT_REPLACEMENT"
    title_vi: "Cấu hình ESLint lệch bản render"
    law: "The ESLint configuration is the rendered one-liner, so no rule is off, warned or redefined in a repository."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_RULE_OFF_WITHOUT_REPLACEMENT"]
    enforcers:
      - {kind: hfs, id: rule-off-without-replacement, at: packages/hfs/sync/managed.mjs}
  - id: R18
    code: "HFS_INLINE_SUPPRESSION"
    title_vi: "Tắt luật tại chỗ"
    law: "No inline suppression of any kind."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_INLINE_SUPPRESSION"]
    enforcers:
      - {kind: eslint-be, id: no-inline-suppression}
      - {kind: eslint-fe, id: no-inline-lint-config}
  - id: R19
    code: "HFS_FORMAT"
    title_vi: "Chưa format bằng Prettier"
    law: "Prettier is the only formatter."
    kinds: [codemod]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_FORMAT"]
    enforcers:
      - {kind: hfs, id: format, status: planned}
  - id: R20
    code: "HFS_SIZE_GROWTH"
    title_vi: "Tệp vượt ngân sách còn phình thêm"
    law: "Over-budget files do not grow; new files are inside budget."
    kinds: [check, design]
    gates: [land, ci, sonar]
    failureCodes: ["HFS_SIZE_GROWTH"]
    enforcers:
      - {kind: eslint-be, id: file-size-growth}
      - {kind: eslint-fe, id: file-size-growth, status: planned}
      - {kind: hfs, id: size-growth, status: planned}
      - {kind: sonar, id: cognitive-complexity, status: planned}
  - id: R21
    code: "HFS_DUPLICATE_CODE"
    title_vi: "Mã trùng lặp"
    law: "No duplicated blocks or twice-defined helpers."
    kinds: [check, design]
    gates: [land, ci, sonar]
    failureCodes: ["HFS_DUPLICATE_CODE", "HFS_DUPLICATE_SYMBOL"]
    enforcers:
      - {kind: machine, id: duplicate-code, at: scripts/checks/architecture/clones.mjs}
      - {kind: machine, id: duplicate-symbol, at: scripts/checks/architecture/symbols.mjs}
      - {kind: sonar, id: duplicated-lines-density, status: planned}
  - id: R22
    code: "HFS_TS_STRICT"
    title_vi: "tsconfig hạ cờ strict"
    law: "tsconfig extends `@starci/tsconfig` and lowers no flag; no assertion, `!` or `any` in product source."
    kinds: [codemod, design, lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["HFS_TS_STRICT", "FE_TYPE_ESCAPE"]
    enforcers:
      - {kind: eslint-fe, id: no-type-assertion}
      - {kind: eslint-fe, id: no-non-null-assertion}
      - {kind: eslint-fe, id: no-explicit-any}
      - {kind: hfs, id: ts-strict, at: packages/hfs/sync/ts-strict.mjs}
      - {kind: eslint-fe, id: no-double-cast}
  - id: R23
    code: "HFS_CONTRACT_SNAPSHOT_DRIFT"
    title_vi: "Bản hợp đồng lệch bản thật"
    law: "Contract snapshot equals the emit, the FE copy equals the BE."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_CONTRACT_SNAPSHOT_DRIFT"]
    enforcers:
      - {kind: hfs, id: contract-snapshot-drift, status: planned}
  - id: R24
    code: "HFS_ARCH_CONFIG_UNREAD"
    title_vi: "Máy kiến trúc không đọc được hfs.json"
    law: "The machine reads `hfs.json`; zero files analysed is red."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_ARCH_CONFIG_UNREAD"]
    enforcers:
      - {kind: machine, id: arch-config-unread, status: planned}
  - id: R25
    code: "HFS_UNUSED_EXPORT"
    title_vi: "Mã chết: export công khai và tệp không ai dùng"
    law: "No public export without a consumer; no source file nothing reaches."
    kinds: [check, codemod]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["HFS_UNUSED_EXPORT", "HFS_UNUSED_FILE"]
    enforcers:
      - {kind: machine, id: dead-exports, at: scripts/checks/architecture/dead-exports.mjs}
  - id: R26
    code: "BE_TIER_DIRECTION"
    title_vi: "Hướng import giữa các tầng bị cấm"
    law: "The tier direction matrix."
    kinds: [check, design]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TIER_DIRECTION"]
    enforcers:
      - {kind: machine, id: tier-direction, at: scripts/checks/architecture/tiers.mjs}
  - id: R27
    code: "ARCH_OWNER_CYCLE"
    title_vi: "Vòng phụ thuộc giữa các owner"
    law: "No owner cycles, type-only included."
    kinds: [check, design]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["ARCH_OWNER_CYCLE"]
    enforcers:
      - {kind: machine, id: owner-cycle, at: scripts/checks/architecture/tiers.mjs}
  - id: R28
    code: "BE_FEATURE_IMPORTS_FEATURE"
    title_vi: "Feature import feature khác"
    law: "A feature never imports a feature."
    kinds: [check, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_FEATURE_IMPORTS_FEATURE"]
    enforcers:
      - {kind: machine, id: feature-imports-feature, at: scripts/checks/architecture/tiers.mjs}
  - id: R29
    code: "BE_FEATURE_SHAPE"
    title_vi: "Feature sai hình dạng"
    law: "Feature root is `index.ts`, module, `application/`, `transport/<protocol>/`."
    kinds: [check, codemod, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_FEATURE_SHAPE"]
    enforcers:
      - {kind: machine, id: feature-shape, status: planned}
  - id: R30
    code: "BE_PUBLIC_SURFACE"
    title_vi: "Import sâu qua cổng công khai"
    law: "Every owner has one `index.ts`; cross-owner imports use it, same-owner imports are relative and never go through it; it holds only named `export { }` lines, no `export *`, no alias re-export, at most 60 exports."
    kinds: [check, lint, codemod]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_PUBLIC_SURFACE", "ARCH_OWNER_EXPORT_BYPASS", "ARCH_OWNER_EXPORT_STAR", "HFS_ALIAS_REEXPORT"]
    enforcers:
      - {kind: eslint-be, id: import-owner-entry}
      - {kind: eslint-be, id: no-folder-reexport}
      - {kind: machine, id: owner-export-bypass, at: scripts/checks/architecture/owners.mjs}
      - {kind: machine, id: alias-reexport, at: scripts/checks/architecture/symbols.mjs}
      - {kind: machine, id: index-export-count, status: planned}
      - {kind: eslint-be, id: no-relative-capability-escape}
      - {kind: eslint-be, id: no-self-module-alias}
  - id: R31
    code: "BE_FEATURE_NOT_COMPOSED"
    title_vi: "Feature không được app nào compose"
    law: "Every feature and transport module is composed by an app."
    kinds: [check, design]
    gates: [land, ci]
    failureCodes: ["BE_FEATURE_NOT_COMPOSED"]
    enforcers:
      - {kind: machine, id: feature-not-composed, at: scripts/checks/architecture/reachability.mjs}
  - id: R32
    code: "BE_APP_COMPOSITION_ONLY"
    title_vi: "App chứa logic ngoài việc compose"
    law: "Apps compose only; the composition spec boots the real module."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["BE_APP_COMPOSITION_ONLY"]
    enforcers:
      - {kind: machine, id: app-composition-only, at: scripts/checks/architecture/backend.mjs}
      - {kind: machine, id: composition-spec-boots-real-module, status: planned}
  - id: R33
    code: "BE_ENTRYPOINT_ONLY_IN_APPS"
    title_vi: "Entrypoint nằm ngoài apps"
    law: "Entrypoints only in `apps/*/src`."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["BE_ENTRYPOINT_ONLY_IN_APPS"]
    enforcers:
      - {kind: machine, id: entrypoint-only-in-apps, at: scripts/checks/architecture/entrypoint.mjs}
  - id: R34
    code: "BE_SCHEMA_AUTHORITY"
    title_vi: "Schema bị định nghĩa lúc chạy"
    law: "Migrations are the only schema authority; `synchronize` is `false`."
    kinds: [lint, codemod, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SCHEMA_AUTHORITY"]
    enforcers:
      - {kind: eslint-be, id: no-runtime-schema}
  - id: R35
    code: "BE_SCHEMA_OWNER"
    title_vi: "Entity hoặc migration sai chủ"
    law: "Entities and migrations live in the owning capability's `persistence/`."
    kinds: [check, codemod, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SCHEMA_OWNER"]
    enforcers:
      - {kind: machine, id: schema-owner, status: planned}
  - id: R36
    code: "BE_SQL_OUTSIDE_PERSISTENCE"
    title_vi: "SQL thô ngoài persistence/<name>.sql.ts"
    law: "Raw SQL is `sql`-tagged `SqlText` in `persistence/<name>.sql.ts` of the owning capability; `.query()` takes only `SqlText`; no QueryBuilder."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SQL_OUTSIDE_PERSISTENCE"]
    enforcers:
      - {kind: eslint-be, id: sql-text-only}
      - {kind: eslint-be, id: no-query-builder}
  - id: R37
    code: "BE_ENTITY_IN_CONTRACT"
    title_vi: "Entity ORM lộ ra hợp đồng"
    law: "No ORM entity in a contract or transport type."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_ENTITY_IN_CONTRACT"]
    enforcers:
      - {kind: eslint-be, id: no-entity-in-contract}
  - id: R38
    code: "BE_ERROR_HOME"
    title_vi: "Lỗi đặt sai nhà"
    law: "Errors live in the owning capability's `errors/` and extend `DomainError`."
    kinds: [lint, check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["BE_ERROR_HOME"]
    enforcers:
      - {kind: eslint-be, id: error-home}
      - {kind: eslint-be, id: throw-domain-error}
      - {kind: eslint-be, id: error-family-shape}
      - {kind: machine, id: error-home, at: scripts/checks/architecture/error-codes.mjs}
  - id: R39
    code: "BE_ERROR_MASKED"
    title_vi: "Lỗi nội bộ lộ ra client"
    law: "One filter per app; undeclared errors are masked."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["BE_ERROR_MASKED"]
    enforcers:
      - {kind: machine, id: error-masked, at: scripts/checks/architecture/error-masked.mjs}
  - id: R40
    code: "BE_LOGGER_REQUIRED"
    title_vi: "Catch nuốt lỗi"
    law: "`platform/logging` exists and its `Logger` port is the only logger; every `catch` logs, rethrows or returns a reasoned outcome, and a log call names its event with a member of an owner's `<owner>.log-events.ts` enum."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_LOGGER_REQUIRED"]
    enforcers:
      - {kind: eslint-be, id: catch-must-account}
      - {kind: eslint-be, id: no-error-wording-as-log-identity}
      - {kind: eslint-be, id: no-interpolated-log-message}
      - {kind: eslint-be, id: no-framework-logger}
  - id: R41
    code: "BE_DEFAULT_DENY"
    title_vi: "Mặc định không chặn truy cập"
    law: "APP_GUARD plus `@Public({ reason: PublicReason.X })`; no `@UseGuards`; typed bodies; `timingSafeEqual`."
    kinds: [lint, check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_DEFAULT_DENY"]
    enforcers:
      - {kind: eslint-be, id: no-untyped-body}
      - {kind: eslint-be, id: public-needs-reason}
      - {kind: eslint-be, id: secret-compare-timing-safe}
      - {kind: eslint-be, id: no-auth-use-guards}
      - {kind: machine, id: default-deny-app-guard, at: scripts/checks/architecture/default-deny.mjs}
  - id: R42
    code: "BE_INPUT_BOUNDED"
    title_vi: "Input không giới hạn"
    law: "Bounded input, cursor-only pagination, depth limits, rate limits; every property of an input class carries the `class-validator` decorators its type calls for."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_INPUT_BOUNDED"]
    enforcers:
      - {kind: eslint-be, id: input-bounded}
      - {kind: eslint-be, id: no-offset-pagination}
  - id: R43
    code: "BE_CONFIG_OWNER"
    title_vi: "Đọc process.env ngoài platform/config"
    law: "Only `platform/config` reads `process.env`; config per capability."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_CONFIG_OWNER"]
    enforcers:
      - {kind: eslint-be, id: no-direct-env-read}
  - id: R44
    code: "BE_SECRET_DEFAULT"
    title_vi: "Giá trị mặc định cho bí mật hoặc URL hạ tầng"
    law: "No default for a secret key or infrastructure URL."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["BE_SECRET_DEFAULT"]
    enforcers:
      - {kind: eslint-be, id: no-secret-default}
  - id: R45
    code: "BE_MODULE_SHAPE"
    title_vi: "Module sai hình dạng"
    law: "`@Global` nowhere and `isGlobal: true` only at app roots; no cross-owner module imports; typed options; one module per transport."
    kinds: [lint, check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_MODULE_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: no-global-decorator}
      - {kind: eslint-be, id: is-global-only-in-app}
      - {kind: eslint-be, id: no-cross-owner-module-import}
      - {kind: eslint-be, id: capability-module-shape}
      - {kind: eslint-be, id: typed-module-definition}
      - {kind: eslint-be, id: static-module-register}
      - {kind: eslint-be, id: no-new-injectable}
      - {kind: eslint-be, id: no-module-let}
      - {kind: eslint-be, id: one-module-per-file}
      - {kind: machine, id: register-once, at: scripts/checks/architecture/register-once.mjs}
      - {kind: machine, id: module-per-transport, status: planned}
  - id: R46
    code: "BE_BACKGROUND_UNOWNED"
    title_vi: "Việc nền không có ai chạy"
    law: "Every sweep, outbox or retry has a job or consumer run by a worker app."
    kinds: [check, design]
    gates: [land, ci]
    failureCodes: ["BE_BACKGROUND_UNOWNED"]
    enforcers:
      - {kind: machine, id: background-unowned, status: planned}
  - id: R47
    code: "BE_TEST_TOPOLOGY"
    title_vi: "Cấu hình test lệch chuẩn"
    law: "One jest config, projects `unit` and `e2e`, live by folder, `diagnostics: false`; a handler, domain service, consumer, job, guard, mapper, policy, client and row mapper has a twin spec beside it; no `.test.ts`, `int-spec` or `harness-spec`."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["BE_TEST_TOPOLOGY"]
    enforcers:
      - {kind: hfs, id: test-topology, status: planned}
      - {kind: eslint-be, id: unit-test-colocated}
  - id: R48
    code: "BE_SPEC_QUALITY"
    title_vi: "Spec đọc mã nguồn hoặc ép kiểu mock"
    law: "No source-reading specs; a spec asserts results or state, not only calls; no `as` and no `x!` in a spec (the borrowed rules of R72); an e2e enters through transport, waits with `waitFor`, boots through `src/tests/e2e/setup`, reads persisted state back and reaches no model provider."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SPEC_QUALITY"]
    enforcers:
      - {kind: eslint-be, id: spec-no-source-read}
      - {kind: eslint-be, id: e2e-uses-production-transport}
      - {kind: eslint-be, id: no-branch-in-flow-step}
      - {kind: eslint-be, id: no-sleep-in-flow}
      - {kind: eslint-be, id: no-wiring-in-flow-spec}
      - {kind: eslint-be, id: e2e-asserts-persisted-state}
      - {kind: eslint-be, id: no-api-shaped-e2e-filename}
      - {kind: eslint-be, id: no-call-only-spec}
      - {kind: eslint-be, id: no-marker-model-stub}
      - {kind: eslint-be, id: no-model-call-in-e2e}
  - id: R49
    code: "FE_ENV_OWNER"
    title_vi: "Đọc biến môi trường ngoài modules/config"
    law: "Only `modules/config` reads the environment; no localhost fallback."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_ENV_OWNER"]
    enforcers:
      - {kind: eslint-fe, id: no-env-outside-config}
      - {kind: eslint-fe, id: no-hardcoded-endpoint-fallback}
  - id: R50
    code: "FE_TRANSPORT_OWNER"
    title_vi: "fetch ngoài client duy nhất"
    law: "One `fetch` in `modules/api/client.ts`, with timeout and abort."
    kinds: [check, lint, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_TRANSPORT_OWNER", "FE_EFFECT_FETCH"]
    enforcers:
      - {kind: eslint-fe, id: fetch-only-in-api-client}
      - {kind: eslint-fe, id: client-fetch-has-signal}
      - {kind: eslint-fe, id: no-shared-transport-state}
      - {kind: eslint-fe, id: no-data-fetch-in-effect}
      - {kind: machine, id: transport-owner, status: planned}
      - {kind: eslint-fe, id: api-client-attaches-the-locale}
      - {kind: eslint-fe, id: locale-header-belongs-to-the-link}
  - id: R51
    code: "FE_HTTP_STATUS_COLLAPSE"
    title_vi: "Gộp mọi mã HTTP thành một nhánh"
    law: "One `Outcome<T>`; 401 and 403 become `refused`."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_HTTP_STATUS_COLLAPSE", "FE_OUTCOME_KIND_UNHANDLED"]
    enforcers:
      - {kind: eslint-fe, id: client-maps-auth-to-refused}
      - {kind: eslint-fe, id: no-http-status-collapse}
      - {kind: eslint-fe, id: outcome-kinds-exhaustive}
  - id: R52
    code: "FE_WIRE_GENERATED"
    title_vi: "Kiểu wire gõ tay"
    law: "Wire types generated from the contract copy."
    kinds: [lint, check, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_WIRE_GENERATED"]
    enforcers:
      - {kind: eslint-fe, id: no-hand-typed-wire}
      - {kind: hfs, id: wire-generated, status: planned}
  - id: R53
    code: "FE_ERROR_BOUNDARY_MISSING"
    title_vi: "Thiếu error boundary"
    law: "Global, locale error, not-found and loading boundaries exist."
    kinds: [check, codemod, lint]
    gates: [settle, land, ci]
    failureCodes: ["FE_ERROR_BOUNDARY_MISSING", "FE_SUSPENSE_NULL_FALLBACK"]
    enforcers:
      - {kind: eslint-fe, id: no-null-suspense-fallback}
      - {kind: machine, id: error-boundary-missing, at: scripts/checks/architecture/required-files.mjs}
  - id: R54
    code: "FE_ROUTE_FILES_THIN"
    title_vi: "Tệp route không mỏng"
    law: "Route files mount one owner; Next conventions (`proxy.ts`, metadata)."
    kinds: [check, lint]
    gates: [settle, land, ci]
    failureCodes: ["FE_ROUTE_FILES_THIN", "FE_NEXT_CONVENTIONS", "FE_PAGE_METADATA_MISSING"]
    enforcers:
      - {kind: eslint-fe, id: no-middleware-file}
      - {kind: eslint-fe, id: page-exports-metadata}
      - {kind: machine, id: route-files-thin, status: planned}
  - id: R55
    code: "FE_CLIENT_BOUNDARY"
    title_vi: "use client sai chỗ"
    law: "Server first; `\"use client\"` only where allowed."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_CLIENT_BOUNDARY", "FE_CLIENT_SERVER_IMPORT", "FE_STORAGE_OUTSIDE_MODULES", "FE_DANGEROUS_HTML"]
    enforcers:
      - {kind: eslint-fe, id: use-client-only-at-boundary}
      - {kind: eslint-fe, id: client-no-server-import}
      - {kind: eslint-fe, id: web-storage-only-in-modules}
      - {kind: eslint-fe, id: no-dangerous-html}
  - id: R56
    code: "FE_HOOKS_ARE_HOOKS"
    title_vi: "hooks/ chứa thứ không phải hook"
    law: "`hooks/` hold hooks and one shared file per domain."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["FE_HOOKS_ARE_HOOKS"]
    enforcers:
      - {kind: eslint-fe, id: hooks-folder-holds-hooks-only}
      - {kind: machine, id: hooks-are-hooks, status: planned}
  - id: R57
    code: "FE_OWNER_REACHABLE"
    title_vi: "Owner không được route nào mount"
    law: "Every owner is mounted; every href resolves to a route."
    kinds: [check, design, lint]
    gates: [settle, land, ci]
    failureCodes: ["FE_OWNER_REACHABLE", "FE_ROUTE_HARDCODED"]
    enforcers:
      - {kind: eslint-fe, id: no-hardcoded-route}
      - {kind: machine, id: owner-reachable, at: scripts/checks/architecture/reachability.mjs}
  - id: R58
    code: "FE_I18N_LITERAL"
    title_vi: "Chữ hiển thị không đi qua t()"
    law: "No display text at any tier, no escape comment."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_I18N_LITERAL"]
    enforcers:
      - {kind: eslint-fe, id: no-hardcoded-copy}
      - {kind: eslint-fe, id: html-lang-from-locale}
      - {kind: eslint-fe, id: no-copy-resolution-below-block}
  - id: R59
    code: "FE_I18N_PLACEMENT"
    title_vi: "i18n sai chuẩn next-intl"
    law: "`next-intl`, `[locale]`, `modules/i18n/`."
    kinds: [check, codemod, lint]
    gates: [settle, land, ci]
    failureCodes: ["FE_I18N_PLACEMENT", "FE_I18N_NAVIGATION", "FE_I18N_FORMATTER"]
    enforcers:
      - {kind: eslint-fe, id: locale-segment-is-locale}
      - {kind: eslint-fe, id: no-second-i18n-stack}
      - {kind: eslint-fe, id: navigation-from-intl}
      - {kind: eslint-fe, id: no-native-anchor}
      - {kind: eslint-fe, id: use-intl-formatter}
      - {kind: hfs, id: i18n-placement, status: planned}
  - id: R60
    code: "FE_I18N_CATALOG"
    title_vi: "Catalog ngôn ngữ lệch key"
    law: "Same keys in every catalog, real catalog in specs, `pick` for clients."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["FE_I18N_CATALOG"]
    enforcers:
      - {kind: eslint-fe, id: no-mocked-translations}
      - {kind: hfs, id: i18n-catalog, status: planned}
  - id: R61
    code: "FE_STYLE_TOKEN_ONLY"
    title_vi: "CSS ngoài token"
    law: "Token-only CSS; colour only in `brand.css`; every `@source` resolves (sub-check `FE_STYLE_SOURCE_UNRESOLVED`)."
    kinds: [lint, check, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_STYLE_TOKEN_ONLY", "FE_STYLE_SOURCE_UNRESOLVED"]
    enforcers:
      - {kind: stylelint, id: token-only, status: planned}
      - {kind: eslint-fe, id: no-raw-brand-value}
      - {kind: hfs, id: style-source-unresolved, status: planned}
      - {kind: eslint-fe, id: no-fractional-step}
      - {kind: eslint-fe, id: no-arbitrary-value}
      - {kind: eslint-fe, id: no-hand-rolled-heading}
      - {kind: eslint-fe, id: no-unresolved-token-class}
      - {kind: eslint-fe, id: no-heading-tag-outside-heading-component}
  - id: R62
    code: "FE_NATIVE_FORM_CONTROL"
    title_vi: "Control form thô"
    law: "No raw form controls in product tiers."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_NATIVE_FORM_CONTROL", "FE_NATIVE_IMAGE"]
    enforcers:
      - {kind: eslint-fe, id: no-native-form-control}
      - {kind: eslint-fe, id: no-native-img}
      - {kind: eslint-fe, id: image-has-size}
  - id: R63
    code: "FE_PACKAGE_SHAPE"
    title_vi: "Gói dùng chung sai hình dạng"
    law: "Packages build to `dist` with explicit exports and no dead unit."
    kinds: [check, design]
    gates: [land, ci]
    failureCodes: ["FE_PACKAGE_SHAPE"]
    enforcers:
      - {kind: machine, id: package-shape, status: planned}
  - id: R64
    code: "FE_APP_ISOLATION"
    title_vi: "App import app khác"
    law: "Apps never import apps; ui-screen declares `app`."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["FE_APP_ISOLATION"]
    enforcers:
      - {kind: machine, id: app-isolation, at: scripts/checks/architecture/tiers.mjs}
  - id: R65
    code: "FE_SIZE_AND_STATE_BUDGET"
    title_vi: "Vượt ngân sách hook và state"
    law: "Hook and state budgets; no hand-written poll loop; keyed lists; timers cleared; no swallowed error or console."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_SIZE_AND_STATE_BUDGET", "FE_LIST_KEY", "FE_EFFECT_CLEANUP", "FE_SWALLOWED_ERROR", "FE_CONSOLE_CALL"]
    enforcers:
      - {kind: eslint-fe, id: component-line-budget}
      - {kind: eslint-fe, id: unit-hook-budget}
      - {kind: eslint-fe, id: no-hand-rolled-polling}
      - {kind: eslint-fe, id: list-item-has-key}
      - {kind: eslint-fe, id: no-index-key}
      - {kind: eslint-fe, id: no-inline-literal-prop-in-list}
      - {kind: eslint-fe, id: timer-needs-effect-cleanup}
      - {kind: eslint-fe, id: no-empty-catch}
      - {kind: eslint-fe, id: no-console}
  - id: R66
    code: "FE_E2E_SHAPE"
    title_vi: "Spec e2e sai hình dạng"
    law: "Playwright shape, three viewports, no environment coupling."
    kinds: [lint, codemod]
    gates: [land, ci]
    failureCodes: ["FE_E2E_SHAPE"]
    enforcers:
      - {kind: eslint-fe, id: e2e-spec-location}
      - {kind: eslint-fe, id: e2e-no-absolute-path}
      - {kind: eslint-fe, id: e2e-no-docker}
      - {kind: eslint-fe, id: e2e-no-cross-repo-write}
      - {kind: eslint-fe, id: e2e-no-skip}
      - {kind: eslint-fe, id: e2e-typed-helpers}
      - {kind: eslint-fe, id: playwright-viewports}
  - id: R67
    code: "FE_SPEC_QUALITY"
    title_vi: "Spec component kém chất lượng"
    law: "No class pinning, no barrel specs, axe per connected screen."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_SPEC_QUALITY"]
    enforcers:
      - {kind: eslint-fe, id: no-class-string-in-spec}
      - {kind: eslint-fe, id: spec-tests-its-neighbour}
      - {kind: eslint-fe, id: no-barrel-spec}
      - {kind: eslint-fe, id: no-double-cast-in-spec}
      - {kind: eslint-fe, id: connected-spec-has-axe}
      - {kind: eslint-fe, id: unit-test-colocated}
  - id: R68
    code: "BE_SQL_INTERPOLATED"
    title_vi: "Giá trị chạy lúc chạy bị ghép vào chuỗi SQL"
    law: "SQL text carries no runtime substitution; values are numbered parameters."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SQL_INTERPOLATED"]
    enforcers:
      - {kind: eslint-be, id: no-interpolated-sql}
  - id: R69
    code: "BE_QUERY_UNBOUNDED"
    title_vi: "Truy vấn đọc không có giới hạn số dòng"
    law: "A read that can return many rows states `take`, `limit` or `LIMIT`, or pages by cursor."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_QUERY_UNBOUNDED"]
    enforcers:
      - {kind: eslint-be, id: query-needs-limit}
  - id: R70
    code: "BE_HTTP_TIMEOUT"
    title_vi: "Gọi HTTP ra ngoài không có timeout"
    law: "Every outbound `fetch`, axios or HttpService call states a timeout or an abort signal."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_HTTP_TIMEOUT"]
    enforcers:
      - {kind: eslint-be, id: http-needs-timeout}
  - id: R71
    code: "BE_LOG_SECRET"
    title_vi: "Bí mật hoặc dữ liệu cá nhân bị ghi vào log"
    law: "A `Logger` call carries no `Secret` or `Pii` value and no credential or personal identifier by name; log an id or a masked form."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_LOG_SECRET"]
    enforcers:
      - {kind: eslint-be, id: no-secret-in-log}
  - id: R72
    code: "BE_TYPE_ESCAPE"
    title_vi: "Ép kiểu never hoặc khẳng định non-null"
    law: "No type escape in any file, specs included: no `as X` (only `as const`), `<X>y`, `x!` or `any` (the factory turns on the typescript-eslint rules `consistent-type-assertions` with `never`, `no-non-null-assertion` and `no-explicit-any`), no `Function` type, no `eval`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TYPE_ESCAPE"]
    enforcers:
      - {kind: eslint-be, id: no-function-or-eval}
  - id: R73
    code: "BE_ASYNC_NO_AWAIT"
    title_vi: "Hàm async không có await"
    law: "An `async` function contains an `await`; otherwise it is not `async`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_ASYNC_NO_AWAIT"]
    enforcers:
      - {kind: eslint-be, id: async-needs-await}
  - id: R74
    code: "BE_MIGRATION_REVERSIBLE"
    title_vi: "Migration không có down đảo ngược được"
    law: "Every migration declares a `down()` that reverses its `up()`; never empty, never a bare throw."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_MIGRATION_REVERSIBLE"]
    enforcers:
      - {kind: eslint-be, id: migration-down-reversible}
  - id: R75
    code: "BE_RETURN_TYPE"
    title_vi: "Handler hoặc phương thức công khai thiếu kiểu trả về"
    law: "Handlers and public methods of an Injectable, Resolver or Controller declare their return type."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_RETURN_TYPE"]
    enforcers:
      - {kind: eslint-be, id: explicit-handler-return-type}
  - id: R76
    code: "BE_JSON_PARSE_UNGUARDED"
    title_vi: "JSON.parse không nằm trong try"
    law: "`JSON.parse` sits inside a `try` in its own function and fails as a typed outcome."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_JSON_PARSE_UNGUARDED"]
    enforcers:
      - {kind: eslint-be, id: json-parse-needs-guard}
  - id: R77
    code: "BE_QUERY_IN_LOOP"
    title_vi: "Truy vấn chạy trong vòng lặp (N+1)"
    law: "A repository, entity-manager or query-builder read does not run once per element of a loop; read once before the loop by key list."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_QUERY_IN_LOOP"]
    enforcers:
      - {kind: eslint-be, id: no-query-in-loop}
  - id: R78
    code: "BE_USER_COPY_LITERAL"
    title_vi: "Chữ hiển thị cho người dùng viết thẳng trong mã nguồn"
    law: "A literal exception message, notification text or response copy comes from the per-capability messages catalog through the typed `MessageCatalog` port, not from source."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_USER_COPY_LITERAL"]
    enforcers:
      - {kind: eslint-be, id: user-copy-through-catalog}
  - id: R79
    code: "BE_AMBIENT_CLOCK"
    title_vi: "Đọc đồng hồ hệ thống trực tiếp"
    law: "`Date.now`, a bare `new Date()`, `performance.now`, `process.hrtime` and `Temporal.Now` are referenced only inside `platform/clock`, specs included; code asks the injected `Clock` port and specs use `FakeClock`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_AMBIENT_CLOCK"]
    enforcers:
      - {kind: eslint-be, id: no-ambient-clock}
  - id: R80
    code: "BE_INBOX_DEDUPE_MISSING"
    title_vi: "Thiếu chống trùng lặp qua inbox"
    law: "Every consumer and every `SignedWebhook` handler makes `claim(source, eventId)` on the `Inbox` port its first awaited expression and returns early when the claim answers `false`."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_INBOX_DEDUPE_MISSING"]
    enforcers:
      - {kind: eslint-be, id: inbox-dedupe-required}
  - id: R81
    code: "BE_HAND_ROLLED_RETRY"
    title_vi: "Tự viết vòng lặp thử lại thay vì dùng bộ trợ giúp chung"
    law: "A loop that catches an error and waits before trying again goes through the shared `platform/retry` helper, never a hand-written loop."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_HAND_ROLLED_RETRY"]
    enforcers:
      - {kind: eslint-be, id: no-hand-rolled-retry}
  - id: R82
    code: "BE_TRANSACTION_EXTERNAL_CALL"
    title_vi: "Giao dịch cơ sở dữ liệu bao trùm một lệnh gọi ra ngoài"
    law: "No transaction spans an external call; commit first and call out after, or write an outbox message inside the transaction."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TRANSACTION_EXTERNAL_CALL"]
    enforcers:
      - {kind: eslint-be, id: no-external-call-in-transaction}
  - id: R83
    code: "BE_UNNAMED_DATA_ACCESS"
    title_vi: "Truy cập cơ sở dữ liệu không qua EntityManager dùng chung có tên"
    law: "The database is reached through the shared EntityManager, injected as a constructor parameter by the `Inject<Conn>EntityManager()` of a declared connection and called directly; no bare `@InjectEntityManager()`, `getRepository`, repository, QueryBuilder or property injection; a `DataSource` or `QueryRunner` only in `platform/database`, `apps/migrate` and the test bootstrap `src/tests/fixtures`, whose EntityManager the specs use."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_UNNAMED_DATA_ACCESS"]
    enforcers:
      - {kind: eslint-be, id: named-entity-manager-only}
      - {kind: eslint-be, id: no-injected-repository}
      - {kind: eslint-be, id: must-inject-entity-manager}
      - {kind: eslint-be, id: no-eager-relation}
      - {kind: eslint-be, id: no-outer-manager-in-transaction}
      - {kind: eslint-be, id: require-entity-table-name}
  - id: R84
    code: "BE_CONNECTION_DUPLICATE"
    title_vi: "Một cơ sở dữ liệu có hơn một kết nối hoặc injector"
    law: "One physical database is one connection and one `Inject<Conn>EntityManager()` injector declared once in `platform/database`; `hfs.json` connections, connection files, injectors and module registrations correspond one to one."
    kinds: [lint, check]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_CONNECTION_DUPLICATE"]
    enforcers:
      - {kind: eslint-be, id: one-connection-per-database}
      - {kind: machine, id: connection-map, at: scripts/checks/architecture/connection-map.mjs}
  - id: R85
    code: "BE_RAW_INJECT"
    title_vi: "Phụ thuộc hạ tầng không được tiêm qua Inject*()"
    law: "Every injected infrastructure dependency arrives through a zero-argument `Inject<Thing>()` from its owner's `<owner>.decorators.ts` over a `unique symbol` token; raw `@Inject(` exists only there."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_RAW_INJECT"]
    enforcers:
      - {kind: eslint-be, id: injector-only}
      - {kind: eslint-be, id: injector-shape}
      - {kind: eslint-be, id: injector-type-match}
      - {kind: eslint-be, id: infra-needs-injector}
      - {kind: eslint-be, id: no-module-ref}
      - {kind: eslint-be, id: no-forward-ref}
      - {kind: eslint-be, id: no-string-token}
  - id: R86
    code: "BE_SQL_TABLE_OWNER"
    title_vi: "SQL ghi bảng của năng lực khác hoặc đọc không giới hạn"
    law: "SQL writes only the tables of its own capability's entities, reads only tables of owners it may import, and every multi-row SELECT is bounded."
    kinds: [check, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SQL_TABLE_OWNER"]
    enforcers:
      - {kind: machine, id: sql-owner, at: scripts/checks/architecture/sql-owner.mjs}
  - id: R87
    code: "BE_CQRS_SHAPE"
    title_vi: "Tầng ứng dụng sai hình CQRS"
    law: "The application layer is CQRS: typed `Command<R>`/`Query<R>` messages carrying one `params`, handlers extending `ICQRSHandler` that override `process`; no use-case classes, forwarder services or in-process events."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_CQRS_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: handler-overrides-process}
      - {kind: eslint-be, id: message-carries-params-only}
      - {kind: eslint-be, id: message-typed-result}
      - {kind: eslint-be, id: no-use-case}
      - {kind: eslint-be, id: no-event-bus}
      - {kind: eslint-be, id: execute-params-shape}
  - id: R88
    code: "BE_TRANSPORT_SHAPE"
    title_vi: "Tầng giao tiếp làm nhiều hơn chuyển lệnh"
    law: "A transport handler maps its input, dispatches exactly one command or query through the injected bus and maps the result; it injects nothing else, returns no envelope and takes no `GraphQLJSON`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TRANSPORT_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: door-lives-in-features}
      - {kind: eslint-be, id: no-capability-imports-features}
      - {kind: eslint-be, id: rest-door-needs-a-reason}
      - {kind: eslint-be, id: transport-dispatch-only}
      - {kind: eslint-be, id: no-response-envelope}
      - {kind: eslint-be, id: no-graphql-json}
      - {kind: eslint-be, id: em-injection-slots}
  - id: R89
    code: "BE_SOURCE_FORM"
    title_vi: "Tệp nguồn BE sai quy ước tên hoặc hình thức"
    law: "Files use the closed role-suffix vocabulary of the slot manifest; named exports only; every export and public member has English JSDoc; no emoji or Vietnamese outside message catalogs."
    kinds: [lint, check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SOURCE_FORM"]
    enforcers:
      - {kind: eslint-be, id: require-export-jsdoc}
      - {kind: eslint-be, id: require-enum-member-jsdoc}
      - {kind: eslint-be, id: no-non-ascii-source}
      - {kind: eslint-be, id: no-restated-name-jsdoc}
      - {kind: eslint-be, id: no-bare-verb-export}
      - {kind: eslint-be, id: no-vendor-module-factory-name}
      - {kind: eslint-be, id: no-version-in-name}
      - {kind: eslint-be, id: no-const-enum}
      - {kind: eslint-be, id: no-inline-object-type}
      - {kind: eslint-be, id: no-inline-param-type}
      - {kind: eslint-be, id: no-default-export}
      - {kind: hfs, id: source-suffix, at: scripts/lib/hfs-check.mjs}
      - {kind: machine, id: source-names, at: scripts/checks/architecture/source-names.mjs}
  - id: R90
    code: "BE_INFRA_OWNER"
    title_vi: "Thư viện hạ tầng dùng ngoài năng lực sở hữu"
    law: "Each raw infrastructure library (HTTP, cache, queue, scheduler, logger, date, config, events) is imported or referenced only by its one owning platform or integration capability."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_INFRA_OWNER"]
    enforcers:
      - {kind: eslint-be, id: infra-import-owner}
  - id: R91
    code: "FE_SOURCE_FORM"
    title_vi: "Tệp nguồn FE sai quy ước tên, vị trí hoặc chú thích"
    law: "Front-end files sit in their tier folder with the fixed names, export arrow functions named after the folder, carry English JSDoc and no emoji."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_SOURCE_FORM"]
    enforcers:
      - {kind: eslint-fe, id: require-export-jsdoc}
      - {kind: eslint-fe, id: no-emoji-in-source}
      - {kind: eslint-fe, id: no-shell-tier}
      - {kind: eslint-fe, id: source-tier-marker-matches-folder}
      - {kind: eslint-fe, id: surface-folder-two-files-only}
      - {kind: eslint-fe, id: route-tree-holds-routes-only}
      - {kind: eslint-fe, id: route-slot-fixed-name}
      - {kind: eslint-fe, id: no-helper-folder-in-components}
      - {kind: eslint-fe, id: export-matches-folder}
      - {kind: eslint-fe, id: no-runtime-namespace}
      - {kind: eslint-fe, id: monorepo-tier-belongs-to-its-side}
      - {kind: eslint-fe, id: prefer-arrow-export}
      - {kind: eslint-fe, id: handler-on-prefix}
      - {kind: eslint-fe, id: no-second-language-in-path}
      - {kind: eslint-fe, id: no-direct-const-alias}
  - id: R92
    code: "FE_COMPONENT_API"
    title_vi: "Component FE sai bề mặt công khai"
    law: "A component exposes the canon surface: typed named props and slots, a presentational twin for every connected block, status through the slot view, no className or CSS doors, no resting twin or placeholder prop, class names in the colocated file."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_COMPONENT_API"]
    enforcers:
      - {kind: eslint-fe, id: no-inline-parameter-type}
      - {kind: eslint-fe, id: public-component-signature}
      - {kind: eslint-fe, id: no-per-part-classname-prop}
      - {kind: eslint-fe, id: no-public-classname-prop}
      - {kind: eslint-fe, id: no-public-frame-css-props}
      - {kind: eslint-fe, id: no-css-door-type-laundering}
      - {kind: eslint-fe, id: base-props-atom}
      - {kind: eslint-fe, id: base-import-pair}
      - {kind: eslint-fe, id: no-data-status-shape}
      - {kind: eslint-fe, id: slot-status-through-slotview}
      - {kind: eslint-fe, id: presentational-purity}
      - {kind: eslint-fe, id: connected-block-has-presentational-twin}
      - {kind: eslint-fe, id: no-resting-twin-component}
      - {kind: eslint-fe, id: no-placeholder-prop}
      - {kind: eslint-fe, id: no-resting-branch-at-call-site}
      - {kind: eslint-fe, id: no-inline-class-name}
      - {kind: eslint-fe, id: class-names-in-colocated-file}
      - {kind: eslint-fe, id: cn-arguments-are-single-tokens}
  - id: R93
    code: "FE_VENDOR_BOUNDARY"
    title_vi: "Thư viện giao diện bên ngoài dùng ngoài chủ sở hữu"
    law: "Vendor primitives and icons reach components only through their named owner: heroicons through the icon leaf at the glyph scale, every vendor primitive behind a named owner, no internal StarCi href."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_VENDOR_BOUNDARY"]
    enforcers:
      - {kind: eslint-fe, id: no-vendor-icon-outside-icon-leaf}
      - {kind: eslint-fe, id: heroicons-is-the-glyph-vendor}
      - {kind: eslint-fe, id: no-off-scale-glyph-size}
      - {kind: eslint-fe, id: no-decorative-icon-in-metric-cell}
      - {kind: eslint-fe, id: vendor-primitive-has-named-owner}
      - {kind: eslint-fe, id: no-internal-starci-href}
