    law: "Exposed database objects keep their access boundaries in lite and full. Policies refuse tautological true, is-not-null and self-equality predicates; policies for browser roles prove a principal predicate. An exposed view or materialized view uses security_invoker or the migration set ends with access revoked from anon and authenticated. Disabling RLS or moving a table into an exposed schema preserves the R214 RLS obligation. A security definer declaration, including alter function, preserves R215 safety checks and the migration set ends with execute revoked from authenticated when exposed, in addition to R215's public and anon revocation. A storage.objects policy scopes an ownership prefix to the principal unless its bucket id ends _public."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["DB_POLICY_TAUTOLOGY", "DB_VIEW_UNSAFE", "DB_DEFINER_REVOKE", "DB_STORAGE_PREFIX"]
