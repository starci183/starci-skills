      - {path: tests/hfs-proofs/hfs-sonar-config.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/hfs-sonar-config.spec.mjs, edition: lite, codes: [HFS_SONAR_CONFIG]}
      - {path: tests/hfs-proofs/hfs-sonar-config.spec.mjs, edition: full, codes: [HFS_SONAR_CONFIG]}
    law: "Sonar config is generated, with no host URL, importing the be lcov with the logic of be/src/modules (the coverage scope derived from the slot manifest) as the only coverage scope."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_SONAR_CONFIG"]
    enforcers:
      - {kind: hfs, id: sonar-config, at: packages/hfs/sync/managed.mjs}
  - id: R12
    code: "HFS_E2E_IN_AUTOMATIC_GATE"
    editions: [lite, full]
    docs: [docs/legacy-custody-e2e-coverage.md#r12-automatic-test-execution]
    proves:
