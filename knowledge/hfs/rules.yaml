# knowledge/hfs/rules.yaml - the machine-readable catalog of the HFS rules (the ids run R01 up without gaps; count them, never type the count).
#
# One entry per rule: its id, its finding code, a Vietnamese title, the law in one line, how a violation is fixed
# (`kinds`), the gates it runs at, the failure codes it reports, and every enforcer that judges it. The prose of each
# rule is knowledge/hfs/README.md (section 12 lists the same ids and codes); this file is the data behind it. Read it only
# through scripts/lib/hfs-slots.mjs (loadRuleCatalog, rules); its shape is modules/schemas/hfs-rules.schema.yaml.
#
# An enforcer is a check that exists or one still owed. `status: planned` marks one owed: the architecture machine, the
# hfs CLI, stylelint and Sonar lanes fill them, and the entry's `status` is removed the day the check ships (the check
# refuses a planned enforcer that already exists). An existing eslint enforcer is a rule id of the plugin
# `@starci/eslint-canon-be` or `@starci/eslint-canon-fe`; an existing machine, hfs or work-validate enforcer names the file
# (`at`) that emits one of the rule's codes. scripts/checks/check-hfs-rules.mjs holds all of this to the packages, the
# scripts and modules/kernel/failure-codes.yaml.
#
# Every rule is an error from 2.0. There is no baseline, allowlist or suppression file. Codes are quoted: the failure-code
# scanner reads this file as an emitter of every code it names.
schema: starci/hfs-rules@1
version: 1.0.0
gates:
  pre-commit: lint-staged on staged files - Prettier, ESLint canon, stylelint, secrets guard; under 10 seconds
  pre-push: typecheck, lint (hfs lint) and the affected unit specs; runs every pre-commit rule again
  settle: hfs check --paths <owned paths> and ESLint on the op's paths; a red result does not settle the op
  land: full hfs check, canon scan, unit and build before a commit enters main; runs every rule
  ci: GitHub Actions runs the same pinned hfs check, lint, typecheck, unit with coverage, build and prettier --check
  sonar: Sonar quality gate - duplication, cognitive complexity and coverage on new code
enforcerKinds:
  eslint-be: a rule of the plugin @starci/eslint-canon-be (id without the plugin prefix)
  eslint-fe: a rule of the plugin @starci/eslint-canon-fe (id without the plugin prefix)
  stylelint: a rule of the @starci/stylelint-canon package
  machine: a check of the architecture machine (scripts/checks/architecture), which reads the import graph
  hfs: a check of the hfs CLI that reads the repository tree, configuration, contracts or catalogs
  work-validate: a check of scripts/checks/work-validate.mjs over a .starciwork tree
  sonar: a condition of the Sonar quality gate
rules:
  - id: R01
    code: "HFS_SLOT_UNDECLARED"
    law: "Every tracked path matches exactly one slot."
    kinds: [check, lint]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["HFS_SLOT_UNDECLARED", "HFS_SLOT_AMBIGUOUS", "HFS_SLOT_NOT_ENABLED", "HFS_FORBIDDEN_PRESENT", "HFS_TRACKED_MUST_BE_IGNORED", "HFS_ROOT_ENTRY_FORBIDDEN", "HFS_ROOT_MARKDOWN_FORBIDDEN", "HFS_ROOT_SRC_FORBIDDEN_FE", "HFS_SRC_LAYOUT_INVALID", "HFS_MODULE_TIER_INVALID", "HFS_WORK_IN_FE", "HFS_STACKS_IN_FE"]
    enforcers:
      - {kind: hfs, id: slot-undeclared, at: scripts/lib/hfs-check.mjs}
      - {kind: eslint-be, id: slot-undeclared}
      - {kind: eslint-fe, id: slot-undeclared}
      - {kind: machine, id: repository-tree-layout, at: scripts/checks/architecture/hfs.mjs}
  - id: R02
    code: "HFS_SLOT_REQUIRED_MISSING"
    law: "A slot is missing a required file (feature `index.ts`, app `main.ts`, FE `global-error.tsx`), or the root README breaks its standard shape (title, description, standard sections in order, Work pointer, live badges only, no private URL)."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_SLOT_REQUIRED_MISSING", "HFS_MIN_INSTANCES", "BE_REQUIRED_MODULE_MISSING", "HFS_REQUIRED_FILE_MISSING", "HFS_ROOT_ENTRY_MISSING", "HFS_APPS_REQUIRED", "HFS_APP_LAYOUT_INVALID", "HFS_README_TITLE_INVALID", "HFS_README_DESCRIPTION_INVALID", "HFS_README_SECTION_MISSING", "HFS_README_SECTION_ORDER", "HFS_README_DEVELOPMENT_INCOMPLETE", "HFS_README_WORK_POINTER_MISSING", "HFS_README_PRIVATE_URL", "HFS_README_BADGE_NOT_LIVE"]
    enforcers:
      - {kind: hfs, id: slot-required-missing, at: scripts/lib/hfs-check.mjs}
      - {kind: machine, id: required-files, at: scripts/checks/architecture/required-files.mjs}
      - {kind: machine, id: repository-tree-required, at: scripts/checks/architecture/hfs.mjs}
  - id: R03
    code: "HFS_UNTRACKED_ROOT_ENTRY"
    law: "No untracked or ignored entry outside an `ignored` slot."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_UNTRACKED_ROOT_ENTRY", "HFS_EMPTY_DIR", "HFS_GHOST_TREE"]
    enforcers:
      - {kind: hfs, id: untracked-root-entry, at: scripts/lib/hfs-check.mjs}
  - id: R04
    code: "HFS_GITIGNORE_BLOCK_DRIFT"
    law: "The managed `.gitignore` block equals its render."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_GITIGNORE_BLOCK_DRIFT"]
    enforcers:
      - {kind: hfs, id: gitignore-block-drift, at: packages/hfs/sync/managed.mjs}
  - id: R05
    code: "HFS_MANAGED_FILE_DRIFT"
    law: "A managed file equals its template render."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_MANAGED_FILE_DRIFT"]
    enforcers:
      - {kind: hfs, id: managed-file-drift, at: packages/hfs/sync/managed.mjs}
  - id: R06
    code: "HFS_PLAINTEXT_SECRET"
    law: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`."
    kinds: [check, design]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_PLAINTEXT_SECRET"]
    enforcers:
      - {kind: hfs, id: plaintext-secret, at: scripts/lib/hfs-rules/secrets.mjs}
      - {kind: hfs, id: plaintext-secret-staged, at: packages/hfs/sync/hygiene.mjs}
  - id: R07
    code: "HFS_AGENT_DATA_TRACKED"
    law: "`.starciwork` holds product records only."
    kinds: [check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["HFS_AGENT_DATA_TRACKED"]
    enforcers:
      - {kind: work-validate, id: agent-data-tracked, at: scripts/checks/check-example-work.mjs}
  - id: R08
    code: "HFS_WORK_NODE_RETIRED"
    law: "Only flat family records, never `work/node`."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_WORK_NODE_RETIRED"]
    enforcers:
      - {kind: work-validate, id: work-node-retired, at: scripts/checks/check-example-work.mjs}
  - id: R09
    code: "HFS_IDENTITY_CUSTODY"
    law: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_IDENTITY_CUSTODY", "SEALED_CUSTODY_LOCATION", "SEALED_FILE_IN_WORK"]
    enforcers:
      - {kind: work-validate, id: sealed-custody-location, at: scripts/checks/check-work-artifacts.mjs}
      - {kind: work-validate, id: identity-custody-role, at: scripts/checks/check-example-work.mjs}
  - id: R10
    code: "HFS_STACKS_SHAPE"
    law: "`.starcistacks` has the standard shape and the host Sonar owner."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_STACKS_SHAPE"]
    enforcers:
      - {kind: hfs, id: stacks-shape, at: scripts/lib/hfs-rules/stacks.mjs}
  - id: R11
    code: "HFS_SONAR_CONFIG"
    law: "Sonar config is generated, with no host URL and no coverage import."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_SONAR_CONFIG"]
    enforcers:
      - {kind: hfs, id: sonar-config, at: packages/hfs/sync/managed.mjs}
  - id: R12
    code: "HFS_E2E_IN_AUTOMATIC_GATE"
    law: "e2e never joins husky, coverage or automatic CI."
    kinds: [check]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_E2E_IN_AUTOMATIC_GATE"]
    enforcers:
      - {kind: machine, id: e2e-in-automatic-gate, at: scripts/checks/architecture/hfs.mjs}
  - id: R13
    code: "HFS_CI_MISSING_CANON"
    law: "CI runs the pinned `@starci/hfs check`; pre-push runs typecheck and lint; a clone never redirects `core.hooksPath` away from husky."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_CI_MISSING_CANON", "HFS_HOOKS_PATH_REDIRECTED"]
    enforcers:
      - {kind: machine, id: hooks-path-not-redirected, at: scripts/checks/architecture/hfs.mjs}
      - {kind: hfs, id: ci-missing-canon, at: scripts/lib/hfs-rules/pipeline.mjs}
  - id: R14
    code: "HFS_DEP_VERSION_SKEW"
    law: "One version per dependency in the workspace, a root `overrides` pin included, and npm is the only package manager."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_DEP_VERSION_SKEW", "HFS_PACKAGE_MANAGER_MIXED"]
    enforcers:
      - {kind: hfs, id: dep-version-skew, at: scripts/lib/hfs-rules/deps.mjs}
      - {kind: machine, id: package-manager, at: scripts/checks/architecture/hfs.mjs}
  - id: R15
    code: "HFS_CANON_PIN_DRIFT"
    law: "Canon packages and frameworks match `canon-pins.yaml`."
    kinds: [check, codemod]
    gates: [pre-push, land, ci]
    failureCodes: ["HFS_CANON_PIN_DRIFT"]
    enforcers:
      - {kind: hfs, id: canon-pin-drift, at: scripts/lib/hfs-check.mjs}
  - id: R16
    code: "HFS_TOOL_CONFIG_LOCAL"
    law: "Configs only call the factories; no local rules."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_TOOL_CONFIG_LOCAL"]
    enforcers:
      - {kind: hfs, id: tool-config-local, at: packages/hfs/sync/managed.mjs}
      - {kind: hfs, id: tool-config-forbidden, at: scripts/lib/hfs-check.mjs}
  - id: R17
    code: "HFS_RULE_OFF_WITHOUT_REPLACEMENT"
    law: "The ESLint configuration (and a front end's stylelint configuration) is the rendered one-liner, so no rule is off, warned or redefined in a repository."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_RULE_OFF_WITHOUT_REPLACEMENT"]
    enforcers:
      - {kind: hfs, id: rule-off-without-replacement, at: packages/hfs/sync/managed.mjs}
  - id: R18
    code: "HFS_INLINE_SUPPRESSION"
    law: "No inline suppression of any kind."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_INLINE_SUPPRESSION"]
    enforcers:
      - {kind: eslint-be, id: no-inline-suppression}
      - {kind: eslint-fe, id: no-inline-lint-config}
      - {kind: stylelint, id: no-inline-lint-config}
  - id: R19
    code: "HFS_FORMAT"
    law: "Prettier is the only formatter."
    kinds: [codemod]
    gates: [pre-commit, pre-push, land, ci]
    failureCodes: ["HFS_FORMAT"]
    enforcers:
      - {kind: hfs, id: format, at: packages/hfs/sync/format.mjs}
  - id: R20
    code: "HFS_SIZE_GROWTH"
    law: "Over-budget files do not grow; new files are inside budget."
    kinds: [lint, design]
    gates: [land, ci, sonar]
    failureCodes: ["HFS_SIZE_GROWTH", "HFS_SIZE_SOFT_BACKLOG"]
    enforcers:
      - {kind: eslint-be, id: file-size-growth}
      - {kind: eslint-fe, id: file-size-growth}
      - {kind: sonar, id: cognitive-complexity, at: knowledge/sonar-gate.yaml}
  - id: R21
    code: "HFS_DUPLICATE_CODE"
    law: "No duplicated blocks or twice-defined helpers."
    kinds: [lint, design]
    gates: [land, ci, sonar]
    failureCodes: ["HFS_DUPLICATE_CODE", "HFS_DUPLICATE_SYMBOL", "FE_CROSS_APP_DUPLICATE"]
    enforcers:
      - {kind: eslint-be, id: duplicate-code}
      - {kind: eslint-fe, id: duplicate-code}
      - {kind: eslint-be, id: duplicate-symbol}
      - {kind: eslint-fe, id: duplicate-symbol}
      - {kind: eslint-fe, id: cross-app-duplicate}
      - {kind: sonar, id: duplicated-lines-density, at: knowledge/sonar-gate.yaml}
  - id: R22
    code: "HFS_TS_STRICT"
    law: "tsconfig extends `@starci/tsconfig` and lowers no flag; no assertion, `!` or `any` in product source."
    kinds: [codemod, design, lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["HFS_TS_STRICT", "FE_TYPE_ESCAPE"]
    enforcers:
      - {kind: eslint-fe, id: no-type-assertion}
      - {kind: eslint-fe, id: no-non-null-assertion}
      - {kind: eslint-fe, id: no-explicit-any}
      - {kind: hfs, id: ts-strict, at: packages/hfs/sync/ts-strict.mjs}
      - {kind: eslint-fe, id: no-double-cast}
  - id: R23
    code: "HFS_CONTRACT_SNAPSHOT_DRIFT"
    law: "Contract snapshot equals the emit, the FE copy equals the BE."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_CONTRACT_SNAPSHOT_DRIFT"]
    enforcers:
      - {kind: hfs, id: contract-snapshot-drift, at: scripts/lib/hfs-rules/contract.mjs}
  - id: R24
    code: "HFS_ARCH_CONFIG_UNREAD"
    law: "The machine reads `hfs.json`; zero files analysed is red."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_ARCH_CONFIG_UNREAD"]
    enforcers:
      - {kind: machine, id: arch-config-unread, at: scripts/checks/architecture/config-unread.mjs}
  - id: R25
    code: "HFS_UNUSED_EXPORT"
    law: "No public export without a consumer; no source file nothing reaches."
    kinds: [lint, codemod]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["HFS_UNUSED_EXPORT", "HFS_UNUSED_FILE"]
    enforcers:
      - {kind: eslint-be, id: dead-exports}
      - {kind: eslint-fe, id: dead-exports}
  - id: R26
    code: "BE_TIER_DIRECTION"
    law: "The tier direction matrix; a shared package never imports an app."
    kinds: [lint, design]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TIER_DIRECTION", "FE_TIER_DIRECTION", "ARCH_PACKAGE_IMPORTS_APP"]
    enforcers:
      - {kind: eslint-be, id: tier-direction}
      - {kind: eslint-fe, id: tier-direction}
      - {kind: eslint-be, id: package-imports-app}
      - {kind: eslint-fe, id: package-imports-app}
  - id: R27
    code: "ARCH_OWNER_CYCLE"
    law: "No owner cycles, type-only included."
    kinds: [lint, design]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["ARCH_OWNER_CYCLE"]
    enforcers:
      - {kind: eslint-be, id: owner-cycle}
      - {kind: eslint-fe, id: owner-cycle}
  - id: R28
    code: "BE_FEATURE_IMPORTS_FEATURE"
    law: "A feature never imports a feature."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_FEATURE_IMPORTS_FEATURE"]
    enforcers:
      - {kind: eslint-be, id: feature-imports-feature}
  - id: R29
    code: "BE_FEATURE_SHAPE"
    law: "Feature root is `index.ts`, module, `application/`, `transport/<protocol>/`; `application/` never imports `transport/` or a protocol framework."
    kinds: [check, codemod, design, lint]
    gates: [settle, land, ci]
    failureCodes: ["BE_FEATURE_SHAPE", "BE_FEATURE_LAYOUT_INVALID", "BE_APPLICATION_IMPORTS_TRANSPORT", "BE_APPLICATION_TRANSPORT_FRAMEWORK"]
    enforcers:
      - {kind: machine, id: feature-shape, at: scripts/checks/architecture/feature-shape.mjs}
      - {kind: eslint-be, id: feature-layout}
      - {kind: eslint-be, id: application-never-imports-transport}
  - id: R30
    code: "BE_PUBLIC_SURFACE"
    law: "Every owner has one `index.ts`; cross-owner imports use it, same-owner imports are relative and never go through it; it holds only named `export { }` lines, no `export *`, no alias re-export (`export { X as Y }`, `export const Y = X`, `export type Y = X`, `export interface Y extends X {}`: one declaration has one name), at most 60 exports; cross-package imports use the package name and a declared export."
    kinds: [lint, codemod]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_PUBLIC_SURFACE", "ARCH_OWNER_EXPORT_BYPASS", "ARCH_OWNER_EXPORT_STAR", "HFS_ALIAS_REEXPORT", "ARCH_PACKAGE_EXPORT_BYPASS"]
    enforcers:
      - {kind: eslint-be, id: import-owner-entry}
      - {kind: eslint-be, id: no-folder-reexport}
      - {kind: eslint-be, id: owner-export-bypass}
      - {kind: eslint-fe, id: owner-export-bypass}
      - {kind: eslint-be, id: alias-reexport}
      - {kind: eslint-fe, id: alias-reexport}
      - {kind: eslint-be, id: no-relative-capability-escape}
      - {kind: eslint-be, id: no-self-module-alias}
      - {kind: eslint-be, id: package-export-bypass}
      - {kind: eslint-fe, id: package-export-bypass}
  - id: R31
    code: "BE_FEATURE_NOT_COMPOSED"
    law: "Every feature, transport module and capability module is composed by an app."
    kinds: [lint, design]
    gates: [land, ci]
    failureCodes: ["BE_FEATURE_NOT_COMPOSED"]
    enforcers:
      - {kind: eslint-be, id: feature-not-composed}
  - id: R32
    code: "BE_APP_COMPOSITION_ONLY"
    law: "Apps compose only; an app is proven by the e2e world (`useTestWorld({ apps })`), never by a unit spec."
    kinds: [lint, codemod]
    gates: [settle, land, ci]
    failureCodes: ["BE_APP_COMPOSITION_ONLY", "BE_APP_BUSINESS_ROLE"]
    enforcers:
      - {kind: eslint-be, id: app-composition-only}
  - id: R33
    code: "BE_ENTRYPOINT_ONLY_IN_APPS"
    law: "Entrypoints only in `apps/*/src`."
    kinds: [lint, codemod]
    gates: [land, ci]
    failureCodes: ["BE_ENTRYPOINT_ONLY_IN_APPS"]
    enforcers:
      - {kind: eslint-be, id: entrypoint-only-in-apps}
  - id: R34
    code: "BE_SCHEMA_AUTHORITY"
    law: "Migrations are the only schema authority; `synchronize` is `false`."
    kinds: [lint, codemod, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SCHEMA_AUTHORITY"]
    enforcers:
      - {kind: eslint-be, id: no-runtime-schema}
  - id: R35
    code: "BE_SCHEMA_OWNER"
    law: "Entities and migrations live in the owning capability's `persistence/`; its `<c>Entities` and `<c>Migrations` are registered under exactly one declared connection, which every `Inject<Conn>EntityManager` of the capability names (no `CONNECTION` alias)."
    kinds: [lint, codemod, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SCHEMA_OWNER"]
    enforcers:
      - {kind: eslint-be, id: schema-owner}
  - id: R36
    code: "BE_SQL_OUTSIDE_PERSISTENCE"
    law: "Raw SQL is `sql`-tagged `SqlText` in `persistence/<name>.sql.ts` of the owning capability; `.query()` takes only `SqlText`; no QueryBuilder."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SQL_OUTSIDE_PERSISTENCE"]
    enforcers:
      - {kind: eslint-be, id: sql-text-only}
      - {kind: eslint-be, id: no-query-builder}
  - id: R37
    code: "BE_ENTITY_IN_CONTRACT"
    law: "No ORM entity in a contract or transport type."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_ENTITY_IN_CONTRACT"]
    enforcers:
      - {kind: eslint-be, id: no-entity-in-contract}
  - id: R38
    code: "BE_ERROR_HOME"
    law: "Errors live in the owning capability's `errors/` and extend `DomainError`."
    kinds: [lint, codemod]
    gates: [settle, land, ci]
    failureCodes: ["BE_ERROR_HOME"]
    enforcers:
      - {kind: eslint-be, id: error-home}
      - {kind: eslint-be, id: throw-domain-error}
      - {kind: eslint-be, id: error-family-shape}
      - {kind: eslint-be, id: error-code-unique}
  - id: R39
    code: "BE_ERROR_MASKED"
    law: "One filter per app; undeclared errors are masked."
    kinds: [lint, codemod]
    gates: [land, ci]
    failureCodes: ["BE_ERROR_MASKED"]
    enforcers:
      - {kind: eslint-be, id: error-masked}
  - id: R40
    code: "BE_LOGGER_REQUIRED"
    law: "`platform/logging` exists and its `Logger` port is the only logger; every `catch` logs, rethrows or returns a reasoned outcome, and a log call names its event with a member of an owner's `<owner>.log-events.ts` enum."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_LOGGER_REQUIRED"]
    enforcers:
      - {kind: eslint-be, id: catch-must-account}
      - {kind: eslint-be, id: no-error-wording-as-log-identity}
      - {kind: eslint-be, id: no-interpolated-log-message}
      - {kind: eslint-be, id: no-framework-logger}
  - id: R41
    code: "BE_DEFAULT_DENY"
    law: "APP_GUARD plus `@Public({ reason: PublicReason.X })`; no `@UseGuards`; typed bodies; `timingSafeEqual`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_DEFAULT_DENY"]
    enforcers:
      - {kind: eslint-be, id: no-untyped-body}
      - {kind: eslint-be, id: public-needs-reason}
      - {kind: eslint-be, id: secret-compare-timing-safe}
      - {kind: eslint-be, id: no-auth-use-guards}
      - {kind: eslint-be, id: default-deny-app-guard}
  - id: R42
    code: "BE_INPUT_BOUNDED"
    law: "Bounded input, cursor-only pagination, depth limits, rate limits; every property of an input class carries the `class-validator` decorators its type calls for; a door opened for `PublicReason.AuthHandshake` or `PublicReason.SignedWebhook` carries `RateTier.Strict` of `platform/http-security`."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_INPUT_BOUNDED"]
    enforcers:
      - {kind: eslint-be, id: input-bounded}
