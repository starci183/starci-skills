# knowledge/hfs/rules.yaml - the machine-readable catalog of the HFS rules (count the rules, never type the count).
#
# One entry per rule: its id, its finding code, the law in one line, how a violation is fixed
# (`kinds`), the gates it runs at, the failure codes it reports, and every enforcer that judges it. The prose of each
# rule is knowledge/hfs/README.md (section 12 lists the same ids and codes); this file is the data behind it. Read it only
# through scripts/hfs/slots.mjs (loadRuleCatalog, rules); its shape is modules/schemas/hfs-rules.schema.yaml.
#
# An enforcer is a check that exists or one still owed. `status: planned` marks one owed: the architecture machine, the
# hfs CLI, stylelint and Sonar lanes fill them, and the entry's `status` is removed the day the check ships (the check
# refuses a planned enforcer that already exists). An existing eslint enforcer is a rule id of the plugin
# `@starci/eslint-canon-be` or `@starci/eslint-canon-fe`; an existing machine, hfs or work-validate enforcer names the file
# (`at`) that emits one of the rule's codes. scripts/checks/check-hfs-rules.mjs holds all of this to the packages, the
# scripts and modules/kernel/failure-codes.yaml.
#
# Every rule is an error. There is no baseline, allowlist or suppression file for a product. The runtime gate
# (the StarCi runtime repository judged by knowledge/hfs/runtime-slots.yaml) has exactly one, the shrink-only sections of
# modules/kernel/allowlist.yaml, held by RT_ALLOWLIST_SPRAWL. Codes are quoted: the failure-code
# scanner reads this file as an emitter of every code it names.
schema: starci/hfs-rules@3
version: 3.1.0
gates:
  pre-commit: the managed .husky/pre-commit at the app root - starci app hygiene (staged .starciwork and .starcistacks paths, secrets guard), typecheck, ESLint per side and stylelint on the staged files, prettier --check, the unit specs the staged files touch
  pre-push: typecheck, lint (starci app lint), format:check and the unit specs affected since origin/main; runs every pre-commit rule again
  settle: the op gate `starci gate run` over the op's changed files (merge guard, starci app lint --changed, codegen, tsc, the slice's specs; only findings new against the workflow's previous checkpoint block), re-read at starci kernel settle, which refuses a red done; a green settle commits the op's checkpoint on wf-<workflowId>
  land: the workflow's finish, the only time main is touched - gate.mjs over the whole workflow branch against its merge-base with main, the merge guard, review.verify of the exact head that lands, the branch rebased onto main, then main fast-forwarded and pushed
  ci: GitHub Actions runs the same pinned starci app lint, format:check, typecheck, unit with the per-file coverage threshold, build:be and build:fe, then the Sonar scan and gate
  sonar: Sonar quality gate (knowledge/sonar-gate.yaml) - the imported lint findings, duplication, cognitive complexity and the coverage of the logic of be/src/modules at 100
  runtime: "`starci runtime check` (npm run check) of the StarCi runtime repository itself: scripts/checks/check-runtime.mjs runs node --check, scripts/hfs/runtime-check.mjs with knowledge/hfs/runtime-slots.yaml, and the retained self-checks"
enforcerKinds:
  eslint-be: a rule of the plugin @starci/eslint-canon-be (id without the plugin prefix)
  eslint-fe: a rule of the plugin @starci/eslint-canon-fe (id without the plugin prefix)
  stylelint: a rule of the @starci/stylelint-canon package
  machine: a check of the architecture machine (scripts/hfs/architecture), which reads the import graph
  hfs: a check of the hfs CLI that reads the repository tree, configuration, contracts or catalogs
  work-validate: a check of scripts/work/validate/work-validate.mjs over a .starciwork tree
  sonar: a condition of the Sonar quality gate
  runtime: a rule module of the runtime check (scripts/hfs/runtime-check.mjs, scripts/hfs/runtime-rules/*) or an emitter whose findings it judges, over the runtime repository
rules:
  - id: R01
    code: "HFS_SLOT_UNDECLARED"
    law: "Every tracked path matches exactly one slot."
    kinds: [check, lint]
    gates: [settle, land, ci, runtime]
    failureCodes: ["HFS_SLOT_UNDECLARED", "HFS_SLOT_AMBIGUOUS", "HFS_SLOT_NOT_ENABLED", "HFS_FORBIDDEN_PRESENT", "HFS_TRACKED_MUST_BE_IGNORED", "HFS_ROOT_ENTRY_FORBIDDEN", "HFS_ROOT_MARKDOWN_FORBIDDEN", "HFS_ROOT_SRC_FORBIDDEN_FE", "HFS_SRC_LAYOUT_INVALID", "HFS_MODULE_TIER_INVALID", "HFS_WORK_IN_FE", "HFS_STACKS_IN_SIDE"]
    enforcers:
      - {kind: hfs, id: slot-undeclared, at: scripts/hfs/check.mjs}
      - {kind: eslint-be, id: slot-undeclared}
      - {kind: eslint-fe, id: slot-undeclared}
      - {kind: machine, id: repository-tree-layout, at: scripts/hfs/architecture/hfs.mjs}
      - {kind: runtime, id: runtime-tree, at: scripts/hfs/runtime-check.mjs}
    editions: [lite, full]
    docs: [docs/architecture.md#r01]
    templateNa: "Slot ownership judges where a path sits in the tree, not what a file holds: the managed templates render files into the slots that own them, and no template exists for a path that no slot, two slots or a forbidden slot own."
    proves:
      - {path: tests/hfs-proofs/hfs-slot-ownership.spec.mjs, editions: [lite, full], codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED, HFS_FORBIDDEN_PRESENT, HFS_TRACKED_MUST_BE_IGNORED]}
      - {path: tests/hfs-proofs/hfs-repository-tree-layout.spec.mjs, editions: [lite, full], codes: [HFS_ROOT_ENTRY_FORBIDDEN, HFS_ROOT_MARKDOWN_FORBIDDEN, HFS_ROOT_SRC_FORBIDDEN_FE, HFS_SRC_LAYOUT_INVALID, HFS_MODULE_TIER_INVALID, HFS_WORK_IN_FE, HFS_STACKS_IN_SIDE]}
      - {path: packages/eslint/be/slot-ownership.spec.mjs, editions: [lite, full], codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED]}
      - {path: packages/eslint/fe/slot-ownership.spec.mjs, editions: [lite, full], codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED]}
    exemplifiedBy:
      - {path: examples/lite-app/be/src/features/webhooks/calendar/transport/http/calendar.webhook.ts, edition: lite}
      - {path: examples/ecommerce-app/be/src/features/webhooks/sepay/transport/http/sepay.webhook.ts, edition: full}
      - {path: tests/hfs-proofs/hfs-slot-ownership.spec.mjs, editions: [lite, full], codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED, HFS_FORBIDDEN_PRESENT, HFS_TRACKED_MUST_BE_IGNORED]}
    witness:
      - {path: tests/hfs-proofs/hfs-slot-ownership.spec.mjs, edition: lite, codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED, HFS_FORBIDDEN_PRESENT, HFS_TRACKED_MUST_BE_IGNORED]}
      - {path: tests/hfs-proofs/hfs-slot-ownership.spec.mjs, edition: full, codes: [HFS_SLOT_UNDECLARED, HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED, HFS_FORBIDDEN_PRESENT, HFS_TRACKED_MUST_BE_IGNORED]}
      - {path: tests/hfs-proofs/hfs-repository-tree-layout.spec.mjs, edition: lite, codes: [HFS_ROOT_ENTRY_FORBIDDEN, HFS_ROOT_MARKDOWN_FORBIDDEN, HFS_ROOT_SRC_FORBIDDEN_FE, HFS_SRC_LAYOUT_INVALID, HFS_MODULE_TIER_INVALID, HFS_WORK_IN_FE, HFS_STACKS_IN_SIDE]}
      - {path: tests/hfs-proofs/hfs-repository-tree-layout.spec.mjs, edition: full, codes: [HFS_ROOT_ENTRY_FORBIDDEN, HFS_ROOT_MARKDOWN_FORBIDDEN, HFS_ROOT_SRC_FORBIDDEN_FE, HFS_SRC_LAYOUT_INVALID, HFS_MODULE_TIER_INVALID, HFS_WORK_IN_FE, HFS_STACKS_IN_SIDE]}
  - id: R02
    code: "HFS_SLOT_REQUIRED_MISSING"
    law: "A slot is missing a required file (feature `index.ts`, app `main.ts`, FE `global-error.tsx`), or the root README breaks its standard shape (title, description, standard sections in order, Work pointer, live badges only, no private URL)."
    kinds: [check, codemod]
    gates: [settle, land, ci, runtime]
    failureCodes: ["HFS_SLOT_REQUIRED_MISSING", "HFS_MIN_INSTANCES", "HFS_REQUIRED_FILE_MISSING", "HFS_ROOT_ENTRY_MISSING", "HFS_APPS_REQUIRED", "HFS_APP_LAYOUT_INVALID", "HFS_README_TITLE_INVALID", "HFS_README_DESCRIPTION_INVALID", "HFS_README_SECTION_MISSING", "HFS_README_SECTION_ORDER", "HFS_README_DEVELOPMENT_INCOMPLETE", "HFS_README_WORK_POINTER_MISSING", "HFS_README_PRIVATE_URL", "HFS_README_BADGE_NOT_LIVE"]
    enforcers:
      - {kind: hfs, id: slot-required-missing, at: scripts/hfs/check.mjs}
      - {kind: machine, id: required-files, at: scripts/hfs/architecture/required-files.mjs}
      - {kind: machine, id: repository-tree-required, at: scripts/hfs/architecture/hfs.mjs}
      - {kind: runtime, id: runtime-required, at: scripts/hfs/runtime-check.mjs}
  - id: R03
    code: "HFS_UNTRACKED_ROOT_ENTRY"
    law: "No untracked or ignored entry outside an `ignored` slot."
    kinds: [check, codemod]
    gates: [pre-push, land, ci, runtime]
    failureCodes: ["HFS_UNTRACKED_ROOT_ENTRY", "HFS_EMPTY_DIR", "HFS_GHOST_TREE"]
    enforcers:
      - {kind: hfs, id: untracked-root-entry, at: scripts/hfs/check.mjs}
      - {kind: runtime, id: runtime-untracked, at: scripts/hfs/runtime-check.mjs}
  - id: R04
    code: "HFS_GITIGNORE_BLOCK_DRIFT"
    editions: [lite, full]
    docs: [docs/legacy-managed-rule-coverage.md#r04]
    proves:
      - {path: tests/hfs-proofs/hfs-gitignore-block-drift.spec.mjs, editions: [lite, full]}
    exemplifiedBy:
      - {path: packages/hfs/templates/app/gitignore-lite, edition: lite}
      - {path: packages/hfs/templates/app/gitignore, edition: full}
      - {path: tests/hfs-proofs/hfs-gitignore-block-drift.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/hfs-gitignore-block-drift.spec.mjs, edition: lite, codes: [HFS_GITIGNORE_BLOCK_DRIFT]}
      - {path: tests/hfs-proofs/hfs-gitignore-block-drift.spec.mjs, edition: full, codes: [HFS_GITIGNORE_BLOCK_DRIFT]}
    law: "The managed `.gitignore` block equals its render."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_GITIGNORE_BLOCK_DRIFT"]
    enforcers:
      - {kind: hfs, id: gitignore-block-drift, at: packages/hfs/sync/managed.mjs}
  - id: R05
    code: "HFS_MANAGED_FILE_DRIFT"
    editions: [lite, full]
    docs: [docs/legacy-managed-rule-coverage.md#r05]
    proves:
      - {path: tests/hfs-proofs/hfs-managed-file-drift.spec.mjs, editions: [lite, full]}
    exemplifiedBy:
      - {path: packages/hfs/templates/app/hooks/husky/pre-push, editions: [lite, full]}
      - {path: tests/hfs-proofs/hfs-managed-file-drift.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/hfs-managed-file-drift.spec.mjs, edition: lite, codes: [HFS_MANAGED_FILE_DRIFT]}
      - {path: tests/hfs-proofs/hfs-managed-file-drift.spec.mjs, edition: full, codes: [HFS_MANAGED_FILE_DRIFT]}
    law: "A managed file equals its template render."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_MANAGED_FILE_DRIFT"]
    enforcers:
      - {kind: hfs, id: managed-file-drift, at: packages/hfs/sync/managed.mjs}
  - id: R06
    code: "HFS_PLAINTEXT_SECRET"
    law: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`."
    kinds: [check, design]
    gates: [pre-commit, land, ci]
    failureCodes: ["HFS_PLAINTEXT_SECRET"]
    enforcers:
      - {kind: hfs, id: plaintext-secret, at: scripts/hfs/rules/secrets.mjs}
      - {kind: hfs, id: plaintext-secret-staged, at: packages/hfs/sync/hygiene.mjs}
    editions: [lite, full]
    docs: [docs/legacy-managed-rule-coverage.md#r06-plaintext-secrets]
    templateNa: "Encrypted secrets are supplied by the app secret command; plaintext secret files are forbidden and are never scaffolded."
    proves: [tests/hfs-proofs/hfs-plaintext-secret.spec.mjs]
    exemplifiedBy:
      - {path: tests/hfs-proofs/hfs-plaintext-secret.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/hfs-plaintext-secret.spec.mjs, editions: [lite, full], codes: [HFS_PLAINTEXT_SECRET]}
  - id: R07
    code: "HFS_AGENT_DATA_TRACKED"
    law: "`.starciwork` holds product records only."
    kinds: [check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["HFS_AGENT_DATA_TRACKED"]
    enforcers:
      - {kind: work-validate, id: agent-data-tracked, at: scripts/work/validate/check-example-work.mjs}
  - id: R09
    code: "HFS_IDENTITY_CUSTODY"
    law: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_IDENTITY_CUSTODY", "SEALED_CUSTODY_LOCATION", "SEALED_FILE_IN_WORK"]
    enforcers:
      - {kind: work-validate, id: sealed-custody-location, at: scripts/work/validate/check-work-artifacts.mjs}
      - {kind: work-validate, id: identity-custody-role, at: scripts/work/validate/check-example-work.mjs}
  - id: R10
    code: "HFS_STACKS_SHAPE"
    law: "`.starcistacks` has the edition-aware standard shape and the host Sonar owner; Swarm stacks have digest-pinned images, healthchecks, rollout, rollback and restart policies, versioned external secrets, ingress-only published ports and declared schedulers for replicated jobs. Recurring work is app-owned; host crontab installation is forbidden. Lite declares Supabase as managed backing and runs no duplicate backing-service component."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["HFS_STACKS_SHAPE"]
    enforcers:
      - {kind: hfs, id: stacks-shape, at: scripts/hfs/rules/stacks.mjs}
      - {kind: hfs, id: stacks-runtime, at: scripts/hfs/rules/stacks-runtime.mjs}
      - {kind: hfs, id: stacks-evidence-runtime, at: scripts/hfs/stacks-gate.mjs}
      - {kind: hfs, id: starcistacks-runtime, at: scripts/hfs/starcistacks-runtime.mjs}
      - {kind: hfs, id: starcistacks-runtime-gate, at: scripts/gates/starcistacks.mjs}
  - id: R11
    code: "HFS_SONAR_CONFIG"
    editions: [lite, full]
    docs: [docs/legacy-managed-rule-coverage.md#r11]
    proves:
      - {path: tests/hfs-proofs/hfs-sonar-config.spec.mjs, editions: [lite, full]}
    exemplifiedBy:
