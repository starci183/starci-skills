  - id: R294
    code: "STACKS_DEPLOY_CONFIG_INVALID"
    law: "In lite and full apps, every docker-swarm environment of .starcistacks/application-stacks.yaml that declares environments.<env>.deploy declares a coherent block: it is judged by the same normalizeDeploy the `starci app stack` verbs use, against the real tree. Unknown fields are refused, names, keys, volumes, hosts, URLs and commands match their patterns, the config and public environment files exist below .starcistacks/<env>/, every service names a service of the first stack source, every sealed member has a secrets/<member>.enc file, verify entries and configs are well formed with unique config names, and the backup helper image is pinned by a real sha256 digest (no placeholder). Each problem is one finding at environments.<env>.<field>; an environment without a deploy block is not a finding."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["STACKS_DEPLOY_CONFIG_INVALID"]
    enforcers:
      - {kind: hfs, id: stacks-deploy, at: scripts/hfs/rules/stacks-deploy.mjs}
