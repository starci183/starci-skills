  - id: R71
    code: "BE_LOG_SECRET"
    law: "A `Logger` call carries no `Secret` or `Pii` value and no credential or personal identifier by name; log an id or a masked form. A constructed error carries no `Secret` value and no text value named like a credential."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_LOG_SECRET"]
    enforcers:
      - {kind: eslint-be, id: no-secret-in-log}
      - {kind: eslint-be, id: no-secret-in-error}
  - id: R72
    code: "BE_TYPE_ESCAPE"
    law: "No type escape in any file, specs included: no `as X` (only `as const`), `<X>y`, `x!` or `any` (the factory turns on the typescript-eslint rules `consistent-type-assertions` with `never`, `no-non-null-assertion` and `no-explicit-any`), no `Function` type, no `eval`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TYPE_ESCAPE"]
    enforcers:
      - {kind: eslint-be, id: no-function-or-eval}
  - id: R73
    code: "BE_ASYNC_NO_AWAIT"
    law: "An `async` function contains an `await`; otherwise it is not `async`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_ASYNC_NO_AWAIT"]
    enforcers:
      - {kind: eslint-be, id: async-needs-await}
  - id: R74
    code: "BE_MIGRATION_REVERSIBLE"
    law: "Every migration declares a `down()` that reverses its `up()`; never empty, never a bare throw."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_MIGRATION_REVERSIBLE"]
    enforcers:
      - {kind: eslint-be, id: migration-down-reversible}
  - id: R75
    code: "BE_RETURN_TYPE"
    law: "Handlers and public methods of an Injectable, Resolver or Controller declare their return type."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_RETURN_TYPE"]
    enforcers:
      - {kind: eslint-be, id: explicit-handler-return-type}
  - id: R76
    code: "BE_JSON_PARSE_UNGUARDED"
    law: "`JSON.parse` sits inside a `try` in its own function and fails as a typed outcome."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_JSON_PARSE_UNGUARDED"]
    enforcers:
      - {kind: eslint-be, id: json-parse-needs-guard}
  - id: R77
    code: "BE_QUERY_IN_LOOP"
    law: "A read through the shared EntityManager does not run once per element of a loop; read once before the loop by key list."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_QUERY_IN_LOOP"]
    enforcers:
      - {kind: eslint-be, id: no-query-in-loop}
  - id: R78
    code: "BE_USER_COPY_LITERAL"
    law: "A literal exception message, notification text or response copy comes from the per-capability messages catalog through the typed `MessageCatalog` port, not from source."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_USER_COPY_LITERAL"]
    enforcers:
      - {kind: eslint-be, id: user-copy-through-catalog}
  - id: R79
    code: "BE_AMBIENT_CLOCK"
    law: "`Date.now`, a bare `new Date()`, `performance.now`, `process.hrtime` and `Temporal.Now` are referenced only inside `platform/clock`, specs included; code asks the injected `Clock` port and specs use `FakeClock`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_AMBIENT_CLOCK"]
    enforcers:
      - {kind: eslint-be, id: no-ambient-clock}
  - id: R80
    code: "BE_INBOX_DEDUPE_MISSING"
    law: "Every service method that takes a delivery (a public method of a `*.service.ts` whose first parameter has an `eventId`) makes `claim(source, eventId)` on the `Inbox` port its first awaited expression and returns early when the claim answers `false`; consumers and `SignedWebhook` controllers stay thin doors (R88) and dispatch to the handler whose service claims."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_INBOX_DEDUPE_MISSING"]
    enforcers:
      - {kind: eslint-be, id: inbox-dedupe-required}
  - id: R81
    code: "BE_HAND_ROLLED_RETRY"
    law: "A loop that catches an error and waits before trying again goes through the shared `platform/retry` helper, never a hand-written loop."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_HAND_ROLLED_RETRY"]
    enforcers:
      - {kind: eslint-be, id: no-hand-rolled-retry}
  - id: R82
    code: "BE_TRANSACTION_EXTERNAL_CALL"
    law: "No transaction spans an external call; commit first and call out after, or write an outbox message inside the transaction."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TRANSACTION_EXTERNAL_CALL"]
    enforcers:
      - {kind: eslint-be, id: no-external-call-in-transaction}
  - id: R83
    code: "BE_UNNAMED_DATA_ACCESS"
    law: "The database is reached through the shared EntityManager, injected as a constructor parameter by the `Inject<Conn>EntityManager()` of a declared connection and called directly; no bare `@InjectEntityManager()`, `getRepository`, repository, QueryBuilder or property injection; a `DataSource` or `QueryRunner` only in `platform/database`, `be/apps/migrate` and the test world `be/src/tests/world`, whose `world.db.<connection>` EntityManager the specs use. No class outside an application handler, a domain service or a platform persistence capability takes, holds or returns an `EntityManager`, `Repository`, `DataSource` or `QueryRunner` (a repository under any name, a store, dao, gateway or persistence wrapper included), no exported function whose first parameter is an `EntityManager` (a statement module), and no wrapper return type, awaited value or `provide:` token hands out a connection object."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_UNNAMED_DATA_ACCESS"]
    enforcers:
      - {kind: eslint-be, id: named-entity-manager-only}
      - {kind: eslint-be, id: no-injected-repository}
      - {kind: eslint-be, id: must-inject-entity-manager}
      - {kind: eslint-be, id: no-repository-class}
      - {kind: eslint-be, id: no-eager-relation}
      - {kind: eslint-be, id: no-outer-manager-in-transaction}
      - {kind: eslint-be, id: require-entity-table-name}
  - id: R84
    code: "BE_CONNECTION_DUPLICATE"
    law: "One physical database is one connection and one `Inject<Conn>EntityManager()` injector declared once in `platform/database`; `hfs.json` connections, connection files, injectors and module registrations correspond one to one."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_CONNECTION_DUPLICATE"]
    enforcers:
      - {kind: eslint-be, id: one-connection-per-database}
      - {kind: eslint-be, id: connection-map}
  - id: R85
    code: "BE_RAW_INJECT"
    law: "Every injected infrastructure dependency arrives through a zero-argument `Inject<Thing>()` from its owner's `<owner>.decorators.ts` over a `unique symbol` token; raw `@Inject(` exists only there, and every such token is exported so a spec can provide it; a constructor parameter of a provider is typed by a class or carries an `Inject<Thing>()`, never a bare primitive, `Map`, union or interface."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_RAW_INJECT"]
    enforcers:
      - {kind: eslint-be, id: injector-only}
      - {kind: eslint-be, id: injector-shape}
      - {kind: eslint-be, id: injector-type-match}
      - {kind: eslint-be, id: infra-needs-injector}
      - {kind: eslint-be, id: provider-param-token}
      - {kind: eslint-be, id: no-module-ref}
      - {kind: eslint-be, id: no-forward-ref}
      - {kind: eslint-be, id: no-string-token}
      - {kind: eslint-be, id: injection-token-exported}
  - id: R86
    code: "BE_SQL_TABLE_OWNER"
    law: "SQL writes only the tables of its own capability's entities, reads only tables of its own context (its own capability's, or a same-context capability it may import; a cross-context JOIN is refused), and every multi-row SELECT is bounded."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_SQL_TABLE_OWNER"]
    enforcers:
      - {kind: eslint-be, id: sql-owner}
  - id: R87
    code: "BE_CQRS_SHAPE"
    law: "The application layer is CQRS: typed `Command<R>`/`Query<R>` messages carrying one `params`, handlers extending `ICQRSHandler` that override `process`, where `process` is one `return this.<service>.<method>(...)` and the handler injects only `*Service` classes and the Logger (no EntityManager, no branch, no loop, no second call); no use-case classes, forwarder services or in-process events (`EventBus`, `EventEmitter`, an RxJS `Subject`, a stored listener list); a message and an injected dependency are `readonly`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_CQRS_SHAPE", "BE_READONLY_BOUNDARY"]
    enforcers:
      - {kind: eslint-be, id: handler-overrides-process}
      - {kind: eslint-be, id: handler-is-thin}
      - {kind: eslint-be, id: message-carries-params-only}
      - {kind: eslint-be, id: message-typed-result}
      - {kind: eslint-be, id: no-use-case}
      - {kind: eslint-be, id: no-event-bus}
      - {kind: eslint-be, id: execute-params-shape}
      - {kind: eslint-be, id: readonly-boundary}
  - id: R88
    code: "BE_TRANSPORT_SHAPE"
    law: "A transport handler maps its input, dispatches exactly one command or query through the injected bus and maps the result; it injects nothing else (no EntityManager, no Inbox), holds no branch, loop or other call besides pure mapper functions and `unwrapOutcome` of `platform/primitives`, returns no envelope and takes no `GraphQLJSON`."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_TRANSPORT_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: door-lives-in-features}
      - {kind: eslint-be, id: no-capability-imports-features}
      - {kind: eslint-be, id: rest-door-needs-a-reason}
      - {kind: eslint-be, id: transport-is-thin}
      - {kind: eslint-be, id: no-response-envelope}
      - {kind: eslint-be, id: no-graphql-json}
      - {kind: eslint-be, id: em-injection-slots}
  - id: R89
    code: "BE_SOURCE_FORM"
    law: "Files use the closed role-suffix vocabulary of the slot manifest; named exports only; every export has English JSDoc (its public members: R109); no emoji, and no Vietnamese in identifiers, string literals, comments or test titles outside message catalogs and the i18n fixtures slot; a public input or output is a named contract, never an inline object type; no `Mock*`, `Fake*` or `Stub*` class, function or constant in production source."
    kinds: [lint, check, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SOURCE_FORM", "BE_PUBLIC_CONTRACT_FORM"]
    enforcers:
      - {kind: eslint-be, id: require-export-jsdoc}
      - {kind: eslint-be, id: require-enum-member-jsdoc}
      - {kind: eslint-be, id: no-non-ascii-source}
      - {kind: eslint-be, id: no-restated-name-jsdoc}
      - {kind: eslint-be, id: no-bare-verb-export}
      - {kind: eslint-be, id: no-vendor-module-factory-name}
      - {kind: eslint-be, id: no-version-in-name}
      - {kind: eslint-be, id: no-const-enum}
      - {kind: eslint-be, id: no-inline-object-type}
      - {kind: eslint-be, id: no-inline-param-type}
      - {kind: eslint-be, id: no-test-double-in-source}
      - {kind: eslint-be, id: no-default-export}
      - {kind: hfs, id: source-suffix, at: scripts/hfs/check.mjs}
      - {kind: eslint-be, id: source-suffix}
      - {kind: eslint-be, id: source-names}
      - {kind: eslint-be, id: public-contract-form}
  - id: R90
    code: "BE_INFRA_OWNER"
    law: "Each raw infrastructure library (HTTP, cache, queue, scheduler, logger, date, config, events) is imported or referenced only by its one owning platform or integration capability, and the `HttpClient` port of `platform/http` is called only by an `integrations` capability."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_INFRA_OWNER"]
    enforcers:
      - {kind: eslint-be, id: infra-import-owner}
      - {kind: eslint-be, id: http-client-only-in-integrations}
  - id: R91
    code: "FE_SOURCE_FORM"
    law: "Front-end files sit in their tier folder with the fixed names, export arrow functions named after the folder, carry English JSDoc, no emoji, and no Vietnamese in identifiers, string literals, comments or test titles outside the i18n catalogs and the i18n e2e fixtures slot."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_SOURCE_FORM", "FE_SOURCE_LAYOUT_INVALID"]
    enforcers:
      - {kind: eslint-fe, id: require-export-jsdoc}
      - {kind: eslint-fe, id: no-emoji-in-source}
      - {kind: eslint-fe, id: no-vietnamese-in-source}
      - {kind: eslint-fe, id: no-shell-tier}
      - {kind: eslint-fe, id: source-tier-marker-matches-folder}
      - {kind: eslint-fe, id: surface-folder-two-files-only}
      - {kind: eslint-fe, id: route-tree-holds-routes-only}
      - {kind: eslint-fe, id: route-slot-fixed-name}
      - {kind: eslint-fe, id: no-helper-folder-in-components}
      - {kind: eslint-fe, id: export-matches-folder}
      - {kind: eslint-fe, id: no-runtime-namespace}
      - {kind: eslint-fe, id: monorepo-tier-belongs-to-its-side}
      - {kind: eslint-fe, id: prefer-arrow-export}
      - {kind: eslint-fe, id: handler-on-prefix}
      - {kind: eslint-fe, id: no-second-language-in-path}
      - {kind: eslint-fe, id: no-direct-const-alias}
      - {kind: eslint-fe, id: frontend-source-layout}
  - id: R92
    code: "FE_COMPONENT_API"
    law: "A component exposes the canon surface: typed named props and slots, a presentational twin for every connected block, status through the slot view, no className or CSS doors, no resting twin or placeholder prop, class names in the colocated file; a pure component reaches no hook, router, locale or API."
    kinds: [lint, design]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_COMPONENT_API", "FE_COMPONENT_WORLD_OWNERSHIP", "FE_WORLD_OWNER_RENDER_BOUNDARY", "FE_CONNECTED_BLOCK_RENDER_PAIR", "FE_PURE_REACHES_DATA", "FE_PURE_WORLD_HOOK", "FE_PURE_WORLD_IMPORT"]
    enforcers:
      - {kind: eslint-fe, id: no-inline-parameter-type}
      - {kind: eslint-fe, id: public-component-signature}
      - {kind: eslint-fe, id: no-per-part-classname-prop}
      - {kind: eslint-fe, id: no-public-classname-prop}
      - {kind: eslint-fe, id: no-public-frame-css-props}
      - {kind: eslint-fe, id: no-css-door-type-laundering}
      - {kind: eslint-fe, id: base-props-atom}
      - {kind: eslint-fe, id: base-import-pair}
      - {kind: eslint-fe, id: no-data-status-shape}
      - {kind: eslint-fe, id: slot-status-through-slotview}
      - {kind: eslint-fe, id: presentational-purity}
      - {kind: eslint-fe, id: connected-block-has-presentational-twin}
      - {kind: eslint-fe, id: no-resting-twin-component}
      - {kind: eslint-fe, id: no-placeholder-prop}
      - {kind: eslint-fe, id: no-resting-branch-at-call-site}
      - {kind: eslint-fe, id: no-inline-class-name}
      - {kind: eslint-fe, id: class-names-in-colocated-file}
      - {kind: eslint-fe, id: cn-arguments-are-single-tokens}
      - {kind: eslint-fe, id: component-purity}
  - id: R93
    code: "FE_VENDOR_BOUNDARY"
    law: "Vendor primitives and icons reach components only through their named owner: heroicons through the icon leaf at the glyph scale, every vendor primitive behind a named owner; the Grammar package is imported only through its selected code and style entry and keeps its declared contract."
    kinds: [lint, codemod]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_VENDOR_BOUNDARY", "ARCH_GRAMMAR_CONTRACT_INVALID", "ARCH_GRAMMAR_EXPORT_BYPASS"]
    enforcers:
      - {kind: eslint-fe, id: no-vendor-icon-outside-icon-leaf}
      - {kind: eslint-fe, id: heroicons-is-the-glyph-vendor}
      - {kind: eslint-fe, id: no-off-scale-glyph-size}
      - {kind: eslint-fe, id: no-decorative-icon-in-metric-cell}
      - {kind: eslint-fe, id: vendor-primitive-has-named-owner}
      - {kind: eslint-fe, id: grammar-entry}
  - id: R94
    code: "FE_SLOT_FILE_ROLE"
    law: "A front-end file is owned by a slot and named by it: a slot that owns a directory (route, feature, components, hooks, api module) holds only the files its `allows` list names, and holds them inside a folder of its own."
    kinds: [check, design]
    gates: [settle, land, ci]
    failureCodes: ["FE_SLOT_FILE_ROLE"]
    enforcers:
      - {kind: machine, id: fe-slot-allows, at: scripts/hfs/architecture/fe-slot-allows.mjs}
  - id: R95
    code: "BE_OPERATION_CONTRACT"
    law: "A versioned operation is declared once in the app's typed operation table (`OperationContract<Input, Output, RefusalCode>` registered by `defineOperations`): its input and output are closed types (never `any`, `unknown` or `Record<string, unknown>`), its refusal codes a closed union of string literals, and the route that serves the table takes `OperationRequest<Table>` and answers `Promise<OperationReply<Table>>` of that one table."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_OPERATION_CONTRACT"]
    enforcers:
      - {kind: eslint-be, id: operation-contract-decidable}
      - {kind: eslint-be, id: operation-route-driven-by-table}
  - id: R96
    code: "HFS_DOC_NOT_ENGLISH"
    law: "Every Markdown and YAML document under a side's docs/, src/ and apps/ (be/, fe/) and under the runtime's knowledge/ and docs/ is English, code fences included; only YAML data in a message-catalog or i18n-fixtures slot may hold another language."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["HFS_DOC_NOT_ENGLISH"]
    enforcers:
      - {kind: machine, id: doc-language, at: scripts/hfs/architecture/doc-language.mjs}
  - id: R97
    code: "FE_NO_TESTS"
    law: "The front end (`fe/`) has no tests by standard: no `*.spec.*`, `*.test.*` or `*-spec.*` file, no `e2e/`, `__tests__/`, `__mocks__/` or `test-support/` directory, no vitest, Playwright, jest or Cypress configuration or setup file, no test script, and no test-runner, test-environment, testing-library or axe dependency in any `package.json`; there is no exception, `scripts/` included."
    kinds: [check]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["FE_NO_TESTS"]
    enforcers:
      - {kind: hfs, id: fe-no-tests, at: scripts/hfs/rules/fe-no-tests.mjs}
  - id: R98
    code: "BE_TEST_BUILDER_HOME"
    law: "A test data builder lives only in `be/src/tests/fixtures/builders/<area>.builder.ts` (slot `be.tests.fixtures.builders`, its SQL text in `<area>.sql.ts` beside it): a `*.repository.ts`, `*.factory.ts` or `*.fixture.ts` under `be/src/tests` and a `*.builder.ts` elsewhere are BE_SOURCE_FORM findings, and any other module of the test tree that exports a function creating persisted rows through an EntityManager, DataSource or QueryRunner is a builder in the wrong place."
    kinds: [lint]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TEST_BUILDER_HOME"]
    enforcers:
      - {kind: eslint-be, id: persisting-builder-in-builders-slot}
  - id: R99
    code: "BE_TEST_ROW_BY_BUILDER"
    law: "A unit, integration or e2e spec never hand-builds rows: no raw INSERT/UPDATE/DELETE text, no `save`, `insert`, `upsert`, `update`, `delete` or `remove` on an EntityManager, DataSource or QueryRunner, and no persistence entity built as an object literal more than once in the spec; rows come from the area's builder."
    kinds: [lint]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TEST_ROW_BY_BUILDER"]
    enforcers:
      - {kind: eslint-be, id: spec-no-raw-insert}
      - {kind: eslint-be, id: spec-no-repeated-row-literal}
  - id: R100
    code: "BE_TEST_CONSTRAINTS_ON"
    law: "Nothing under `be/src/tests` disables or drops a database constraint: no `session_replication_role`, `SET CONSTRAINTS ... DEFERRED`, `DEFERRABLE INITIALLY DEFERRED`, `ALTER TABLE ... DISABLE`, `DISABLE TRIGGER`, `DROP CONSTRAINT`, and no `dropForeignKey(s)`, `dropCheckConstraint(s)` or `dropUniqueConstraint(s)` on a QueryRunner; a builder creates the parent chain instead."
    kinds: [lint]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TEST_CONSTRAINTS_ON"]
    enforcers:
      - {kind: eslint-be, id: tests-keep-constraints}
  - id: R101
    code: "BE_TEST_BUILDER_ARRANGES"
    law: "A test data builder arranges data only: it imports no assertion or test-framework global (`expect`, `jest`, `@jest/globals`) and its defaults are deterministic (no `Date.now()`, argless `new Date()`, `Math.random()`, `randomUUID()` or `crypto.random*`)."
    kinds: [lint]
    gates: [pre-push, settle, land, ci]
    failureCodes: ["BE_TEST_BUILDER_ARRANGES"]
    enforcers:
      - {kind: eslint-be, id: builder-arranges-only}
  - id: R102
    code: "BE_SPEC_PLACEMENT"
    law: "A back-end spec or test file lives in one of the four test layers and nowhere else: a unit spec `<name>.service.spec.ts` beside its service, or an integration, e2e or contract spec under `be/src/tests/{integration,e2e,contract}`; a `*.spec.*`, `*.test.*` or `*-spec.*` file anywhere else, `scripts/` and `tools/` included, is a finding."
    kinds: [check, lint]
    gates: [land, ci]
    failureCodes: ["BE_SPEC_PLACEMENT"]
    enforcers:
      - {kind: hfs, id: spec-placement, at: scripts/hfs/rules/spec-placement.mjs}
      - {kind: eslint-be, id: spec-placement}
  - id: R103
    code: "HFS_REPO_LOCAL_CHECK"
    law: "A repository keeps no check, lint rule or lint plugin of its own: no `check-*` file in `scripts/` or `tools/`, no `eslint-local-rules*` or local eslint plugin, no script that runs one; every check lives in the `.claude` runtime and the canons."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_REPO_LOCAL_CHECK"]
    enforcers:
      - {kind: hfs, id: repo-local-check, at: scripts/hfs/rules/repo-local-checks.mjs}
  - id: R104
    code: "HFS_LINT_SUPPRESSION_FILE"
    law: "A repository keeps no lint-suppression file, script or option: no `eslint.suppressions*`, no `lint:suppressions` script, no eslint `--suppress-all` or `--suppressions-location` flag and no suppressions configuration passed to eslint; a finding is fixed in the code."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_LINT_SUPPRESSION_FILE"]
    enforcers:
      - {kind: hfs, id: lint-suppression, at: scripts/hfs/rules/lint-suppression.mjs}
  - id: R105
    code: "HFS_PROOF_COMMAND_FILE_MISSING"
    law: "A proof command of a `.starciwork` record (`requiresProof.<kind>.command`) is runnable as written: every repository file it names exists."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_PROOF_COMMAND_FILE_MISSING"]
    enforcers:
      - {kind: hfs, id: proof-command-files, at: scripts/hfs/rules/proof-commands.mjs}
  - id: R106
    code: "FE_I18N_KEYS"
    law: "The catalogs of a front-end app and its source agree both ways: a literal key read through `next-intl` (`useTranslations`, `getTranslations`, `t`, `t.rich`, `t.raw`, `t.markup`) exists in every locale, and a catalog key that no string of the app's or the shared packages' source can be reading is deleted."
    kinds: [lint]
    gates: [land, ci]
    failureCodes: ["FE_I18N_KEYS"]
    enforcers:
      - {kind: eslint-fe, id: i18n-keys}
  - id: R107
    code: "FE_COOKIE_ATTRIBUTES"
    law: "A cookie the front end writes through Next's response cookies (`response.cookies.set`, `cookies().set`) states `httpOnly` as a literal (`true` for a session, `false` only for a preference page script reads), carries `secure` and has `sameSite` `lax` or `strict`."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_COOKIE_ATTRIBUTES"]
    enforcers:
      - {kind: eslint-fe, id: response-cookie-attributes}
  - id: R108
    code: "BE_ERROR_CAUSE_DROPPED"
    law: "A `throw` that escapes a `catch` (or a promise `.catch` handler) rethrows the caught value or carries it: the replacement capability error takes the exact caught value as `cause`; a `catch` with no binding throws nothing new."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_ERROR_CAUSE_DROPPED"]
    enforcers:
      - {kind: eslint-be, id: replacement-throw-carries-cause}
  - id: R109
    code: "BE_MEMBER_DOC_MISSING"
    law: "Every public member of an exported class, interface or object type alias in product source opens with English JSDoc: methods, accessors, fields and signatures; a private, protected or `#` member, the constructor, an index signature and a property set to a literal or a named constant are not judged, and overloads of one name share one doc."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_MEMBER_DOC_MISSING"]
    enforcers:
      - {kind: eslint-be, id: require-public-member-jsdoc}
  - id: R110
    code: "FE_PROPS_MUTABLE"
    law: "The props type of an exported rendering function in front-end product source is readonly all the way down: every field and index signature is `readonly`, and every collection it holds, directly or in a nested object, is `readonly T[]`, `readonly [A, B]` or `ReadonlyArray<T>`."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["FE_PROPS_MUTABLE"]
    enforcers:
      - {kind: eslint-fe, id: props-fields-readonly}
  - id: R111
    code: "HFS_PEER_INTEGRATION_MISSING"
    law: "An app declares the runtime peer every driver integration it uses needs: when the app root package.json depends on every package of a pair of knowledge/hfs/peer-integrations.yaml (at the named major), it declares the pair's `requires` in its dependencies (`@nestjs/apollo` on `@nestjs/platform-express` 11, Express 5, needs `@as-integrations/express5`)."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_PEER_INTEGRATION_MISSING"]
    enforcers:
      - {kind: hfs, id: peer-integrations, at: scripts/hfs/rules/peer-integrations.mjs}
  - id: R112
    code: "BE_INTEGRATION_SPEC_MISSING"
    law: "Every integration of a back end (`src/modules/integrations/<provider>/` holding `<provider>.config.ts`) has at least one `src/tests/integration/<provider>/*.integration-spec.ts` that, read as a syntax tree, calls `useTestWorld({ modules })` with a factory registering the integration's own module (`<Provider>Module.register`, imported from the integration folder; an inline array, a local const or an exported const of another file), references the ErrorCode enum the integration exports, and drives an outage through the world (`world.infra.<service>.cut|latency|during|connection`, `world.fake.<name>.failNext`, `world.apps.<peer>.during`, `world.interruptDatabase`); the finding sits on the integration folder."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_INTEGRATION_SPEC_MISSING"]
    enforcers:
      - {kind: hfs, id: integration-specs, at: scripts/hfs/rules/integration-specs.mjs}
  - id: R113
    code: "FE_GRAPHQL_CONTRACT"
    law: "Every GraphQL operation a front end keeps in a `.graphql` file under `fe/` is one its back end serves: it is judged against the contract snapshot (`be/contracts/<service>/schema.graphql`) whose root type declares its first root field, and every selected field, argument and input field must be declared there, every required argument and required input field given, every variable passed with the argument's named type, every leaf selected without and every object with a selection, and every declared variable used; a root field no contract declares is a finding too."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["FE_GRAPHQL_CONTRACT"]
    enforcers:
      - {kind: hfs, id: fe-contract-documents, at: scripts/hfs/rules/fe-contract-documents.mjs}
  - id: R114
    code: "RT_EXTERNAL_OWNER"
    law: "In the runtime repository a process, the network, SQLite or an external binary is reached only by its owner in ruleParams.runtime.infraOwners of knowledge/hfs/runtime-slots.yaml: an owned module specifier, global or spawned program word is used only by the files of scripts/api/<system> or engine/db that the map names."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_EXTERNAL_OWNER"]
    enforcers:
      - {kind: runtime, id: external-owner, at: scripts/hfs/runtime-rules/external-owner.mjs}
  - id: R115
    code: "RT_TIER_DIRECTION"
    law: "Every relative import between two runtime owners goes from a tier to a tier its mayImport lists in tiers.runtime of knowledge/hfs/runtime-slots.yaml; owner cycles are ARCH_OWNER_CYCLE."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_TIER_DIRECTION"]
    enforcers:
      - {kind: runtime, id: runtime-tiers, at: scripts/hfs/runtime-rules/tier-direction.mjs}
  - id: R116
    code: "RT_BASE_IMPURE"
    law: "The runtime base tier (the engine foundation and scripts/lib) never writes the filesystem and reads process.env only in a declared seam of ruleParams.runtime.baseEnvSeams."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_BASE_IMPURE"]
    enforcers:
      - {kind: runtime, id: base-pure, at: scripts/hfs/runtime-rules/base-pure.mjs}
  - id: R117
    code: "RT_API_SHAPE"
    law: "A call file of scripts/api/<system>/ exports exactly one function named in camelCase after the file; only the files of its own system import its lib.mjs; no api system imports another; a system with a calls contract has a call file only for a call id the contract declares."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_API_SHAPE"]
    enforcers:
      - {kind: runtime, id: api-shape, at: scripts/hfs/runtime-rules/api-shape.mjs}
  - id: R118
    code: "RT_SPEC_PLACEMENT"
    law: "A runtime spec is tests/<area>/<module>[.<topic>].spec.mjs, shared spec code is tests/helpers/<name>.mjs, preloads tests/setup/<name>.mjs and data tests/fixtures/**; a package spec sits beside its source as <name>.spec.*; no file uses the .test. suffix."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_SPEC_PLACEMENT"]
    enforcers:
      - {kind: runtime, id: spec-placement, at: scripts/hfs/runtime-rules/test-layout.mjs}
  - id: R119
    code: "RT_SOURCE_NAME"
    law: "A runtime source file is named <kebab-name>.mjs, never a one-off of ruleParams.runtime.oneOffNames (_*, tmp-*, fix-*, *-backfill, migrate-*, *-old, *.bak*), and its basename is unique inside its tier except lib.mjs and index.mjs."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_SOURCE_NAME"]
    enforcers:
      - {kind: runtime, id: source-name, at: scripts/hfs/runtime-rules/source-name.mjs}
  - id: R120
    code: "RT_RETIRED_PRESENT"
    law: "No path of retired[] and no `from` of moved[] in modules/kernel/retired-paths.yaml is tracked again, and no symbol of its retiredSymbols[] is declared in runtime production code."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_RETIRED_PRESENT"]
    enforcers:
      - {kind: runtime, id: retired-present, at: scripts/hfs/runtime-rules/retired.mjs}
  - id: R121
    code: "RT_GENERATED_DRIFT"
    law: "A generated copy of the runtime (packages/hfs/runtime, packages/eslint/be/runtime, packages/eslint/fe/runtime) equals what scripts/hfs/sync-runtime.mjs writes from the single source."
    kinds: [check, codemod]
    gates: [land, runtime]
    failureCodes: ["RT_GENERATED_DRIFT"]
    enforcers:
      - {kind: runtime, id: generated-drift, at: scripts/hfs/sync-runtime.mjs}
  - id: R122
    code: "RT_CITED_PATH_MISSING"
    law: "A runtime path cited by live prose or contracts (modules outside the contract history, docs, skills, knowledge, CONTEXT.md, README.md, CONTRIBUTING.md, init, the ui docs) exists; a retired or moved path is cited only by history."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_CITED_PATH_MISSING"]
    enforcers:
      - {kind: runtime, id: cited-path, at: scripts/checks/check-contract-cites.mjs}
  - id: R123
    code: "RT_PENDING_STALE"
    law: "Every entry of the pending list of knowledge/hfs/runtime-slots.yaml names a runtime finding code and still allows a finding, and no entry allows a finding the base revision's list did not allow: the list only shrinks."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_PENDING_STALE", "RT_PENDING_ADDED"]
    enforcers:
      - {kind: runtime, id: pending-ratchet, at: scripts/hfs/runtime-rules/pending.mjs}
  - id: R124
    code: "RT_PINNED_PATH_MOVED"
    law: "A pinned path of ruleParams.runtime.pinned (persisted outside git) exists, or moved through a modules/kernel/retired-paths.yaml moved[] entry marked quiesced: true, landed with the fleet stopped."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_PINNED_PATH_MOVED"]
    enforcers:
      - {kind: runtime, id: pinned-path, at: scripts/hfs/runtime-rules/retired.mjs}
  - id: R125
    code: "RT_NODE_MODULES_LINK"
    law: "No runtime source creates a junction or a symlink for a node_modules folder, through node:fs (symlink, symlinkSync, directly or through a local wrapper) or a spawned link command (mklink /J or /D, New-Item -ItemType Junction or SymbolicLink, ln -s): every checkout installs its own dependencies with a real npm ci from the cache."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_NODE_MODULES_LINK"]
    enforcers:
      - {kind: runtime, id: node-modules-link, at: scripts/hfs/runtime-rules/node-modules-link.mjs}
  - id: R126
    code: "RT_CONTROL_CHARACTER"
    law: "Tracked text source of the runtime (*.mjs, *.cjs, *.js, *.ts, *.tsx, *.yaml, *.yml, *.md, *.json outside the generated copies) holds no raw control character (U+0000 to U+001F except tab, LF and CR, and U+007F); the character is written as its escape."
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RT_CONTROL_CHARACTER"]
    enforcers:
      - {kind: runtime, id: control-characters, at: scripts/hfs/runtime-rules/control-chars.mjs}
  - id: R127
    code: "HFS_MONO_WORKSPACES"
    law: "Every app is a monorepo, even with one service: the app root package.json declares `workspaces` exactly `[\"fe/apps/*\", \"fe/packages/*\"]`, `packageManager` as `npm@<exact version>` and `turbo` in its devDependencies (at the canon pin), and the app root holds the managed `turbo.json` (app.task-graph: build, dev, lint and typecheck, build depending on `^build` with cached `.next` and `dist` outputs)."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["HFS_MONO_WORKSPACES"]
    enforcers:
      - {kind: hfs, id: monorepo, at: scripts/hfs/rules/monorepo.mjs}
  - id: R128
    code: "HFS_MONO_FE_WORKSPACE"
    law: "Every fe app `fe/apps/<app>` is an npm workspace: its `package.json` is named `@<project>/<app>`, is private, declares its own runtime dependencies and has exactly the scripts `build: next build`, `dev: next dev`, `lint: hfs lint --workspace .`, `start: next start` and `typecheck: tsc --noEmit`; every fe package `fe/packages/<pkg>` is private with `build`, `typecheck` and the same workspace `lint` script."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["HFS_MONO_FE_WORKSPACE"]
    enforcers:
      - {kind: hfs, id: monorepo, at: scripts/hfs/rules/monorepo.mjs}
  - id: R129
    code: "HFS_MONO_NEST_PROJECTS"
    law: "The back end is a Nest monorepo of `be/apps/<app>`, even with one service: `be/nest-cli.json` is `\"monorepo\": true`, its default project (`root`, `sourceRoot`) is an api app, and its `projects` are exactly the be apps hfs.json declares, each `{\"type\": \"application\", \"root\": \"apps/<app>\", \"sourceRoot\": \"apps/<app>/src\"}`."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["HFS_MONO_NEST_PROJECTS"]
    enforcers:
      - {kind: hfs, id: monorepo, at: scripts/hfs/rules/monorepo.mjs}
  - id: R130
    code: "HFS_MONO_WORKSPACE_DEP"
    law: "An fe workspace declares every package its files import (read with TypeScript's import pre-processor, its tsconfig path aliases excluded) in its own `package.json`, a sibling workspace package at `\"*\"`; the app root `package.json` never declares a workspace package."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["HFS_MONO_WORKSPACE_DEP"]
    enforcers:
      - {kind: hfs, id: monorepo, at: scripts/hfs/rules/monorepo.mjs}
  - id: R131
    code: "BE_EVENT_CLASS_CONTRACT"
    law: "Every typed event class `be/src/modules/events/<service>/<event>.event.ts` (one class with literal `static readonly eventName` and `version`, in a file named after its event: dots become dashes) equals an entry of the vendored contract `be/contracts/<service>/events.json` at the same name and version, and every entry of a vendored contract has its class; a class the contract does not list, a version mismatch, a contract entry with no class or a misnamed file is a finding (pattern event-bus)."
    kinds: [check, codemod]
    gates: [settle, land, ci]
    failureCodes: ["BE_EVENT_CLASS_CONTRACT"]
    enforcers:
      - {kind: hfs, id: event-class-contract, at: scripts/hfs/rules/event-bus.mjs}
  - id: R132
    code: "BE_OUTBOX_WRITE_TX"
    law: "The outbox is written only by a domain service, with the manager of its own transaction: `eventBus.publish(event, tx)` and a queue producer's `enqueueX(payload, tx)` are called only in a file of `modules/domain` (the test world, e2e and fixtures aside), and `tx` is the `manager` parameter of a `.transaction(async (manager) => ...)` callback or a function parameter typed `EntityManager`; the injected shared manager, an alias, an outer manager or a missing argument is a finding. The call is found by the receiver's TYPE (the `EventBus` port of platform/event-bus) or by the resolved signature's declaring tier (queues), never by a name."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_OUTBOX_WRITE_TX"]
    enforcers:
      - {kind: eslint-be, id: outbox-write-tx}
  - id: R133
    code: "BE_EVENT_CONSUMER_SHAPE"
    law: "A class that implements the `EventConsumer` port of platform/event-bus (by type origin) is `transport/message/<event>.consumer.ts` (slot be.transport.message), its file stem is the kebab form of its event class's literal `eventName` (dots become dashes), and its `handle` reads `delivery.eventId` so the dispatched command carries the id the domain service claims in platform/inbox; a `.consumer.ts` that implements no `EventConsumer` is a finding."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_EVENT_CONSUMER_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: event-consumer-shape}
  - id: R134
    code: "BE_QUEUE_PRODUCER_SHAPE"
    law: "In `modules/queues/<queue>/<queue>.queue.ts` every exported function or class method that writes the `QueueOutbox` port of platform/queue declares a `tx` parameter typed `EntityManager` and passes that parameter as the first argument of the write; a write with another manager, an outer manager or none is a finding (pattern queue)."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_QUEUE_PRODUCER_SHAPE"]
    enforcers:
      - {kind: eslint-be, id: queue-producer-shape}
  - id: R135
    code: "BE_PATTERN_SPEC_MISSING"
    law: "Every pattern a back end declares (hfs.json sides.be.patterns) is proven on the test world: each scenario id of ruleParams.be.patternScenarios.<pattern> has a test titled `<pattern>/<scenario>: ...` (the first argument of `it(` or `test(`) in an e2e or integration spec under be/src/tests; a declared pattern with a missing scenario is a finding."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_PATTERN_SPEC_MISSING"]
    enforcers:
      - {kind: hfs, id: pattern-spec-missing, at: scripts/hfs/rules/event-bus.mjs}
  - id: R136
    code: "BE_KIND_ISOLATION"
    law: "No trigger kind imports another: a feature whose owner slot names one `trigger` (api, webhooks, realtime, saga, reactors, jobs, cli) never imports (static, dynamic, re-export or type-only) a feature of another kind; each kind imports only `modules/*` and only be/apps/* compose features. The kinds meet through the event bus: a domain service publishes `eventBus.publish(event, tx)` and the other kind consumes it. The importing and imported owners are read from the slot view (slot field `trigger`), never from a folder name; the finding replaces BE_FEATURE_IMPORTS_FEATURE when both features name different kinds."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_KIND_ISOLATION"]
    enforcers:
      - {kind: eslint-be, id: kind-isolation}
      - {kind: machine, id: tiers, at: scripts/hfs/architecture/tiers.mjs}
  - id: R137
    code: "HFS_SERVICE_PLACEMENT"
    law: "A back-end service lives only at `be/apps/<service>/`: a folder with a `Dockerfile` of its own, or with a `package.json` other than the app's own and a `fe/packages/<pkg>` workspace's, outside `be/apps/<service>/` (and outside a front end's `fe/apps/<app>/Dockerfile`) is a second service root and a finding; a service is a Nest app of the one repository that shares the `be/src` libraries and the one package.json, and its image is built from its own Dockerfile."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_SERVICE_PLACEMENT"]
    enforcers:
      - {kind: hfs, id: services-placement, at: scripts/hfs/rules/services.mjs}
  - id: R138
    code: "HFS_IMAGE_UNPINNED"
    law: "In a product with more than one service (two or more be apps of kind api or worker) every component `image` of `.starcistacks/application-stacks.yaml` is pinned: a digest (`@sha256:<64 hex>`) or an exact version tag (`x.y.z`, optionally with a suffix); no tag, `latest`, a branch word or a major or minor-only tag is a finding. An own service image is `<repo>/<service>:<x.y.z>`, built from `be/apps/<service>/Dockerfile`; a service the product does not own stays a pinned third-party image."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_IMAGE_UNPINNED"]
    enforcers:
      - {kind: hfs, id: services-image-pins, at: scripts/hfs/rules/services.mjs}
  - id: R139
    code: "HFS_SERVICE_STACK_DECLARATION"
    law: "Every api or worker app `be/apps/<service>` of a product with more than one service is a component of the same name with `role: service` in `.starcistacks/application-stacks.yaml`."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_SERVICE_STACK_DECLARATION"]
    enforcers:
      - {kind: hfs, id: services-stack-declaration, at: scripts/hfs/rules/services.mjs}
  - id: R140
    code: "HFS_EVENT_CONTRACT"
    law: "The async contract between services is vendored under `be/contracts/<service>/events.json` (`starci/event-contract@1`, emitted by `hfs emit-contracts` from the literal `EVENTS` table of `be/apps/<service>/src/events.ts`, never written by hand) and equals that table; an event that undoes the step of another declares `compensates: \"<event>\"` and the named event must exist in a contract; a consumer declares what it reads in the literal `CONSUMES` table of `be/apps/<app>/src/consumes.ts` (service, event, version), every entry must exist in the provider's vendored snapshot at the same version, and every queue a consumer defines with `defineQueue` of `platform/messaging` must be listed in a consumes table; a missing or stale snapshot, an unknown event, a version mismatch or an unlisted consumer queue is a finding."
    kinds: [check, codemod]
    gates: [land, ci]
    failureCodes: ["HFS_EVENT_CONTRACT"]
    enforcers:
      - {kind: hfs, id: services-event-contract, at: scripts/hfs/rules/services.mjs}
  - id: R141
    code: "BE_ASYNC_SPEC_MISSING"
    law: "Every event an app consumes (an entry of its `consumes.ts`) is named by an e2e spec, a file `be/src/tests/e2e/<area>/*.e2e-spec.ts` that boots the apps through `useTestWorld` (it publishes the event, reads the effect back and redelivers it); when the contract of the event declares `compensates: \"<event>\"` it is a saga step, and a spec naming it also names the compensated event, so the spec drives the whole flow: the step, the failure, then the compensated state."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_ASYNC_SPEC_MISSING"]
    enforcers:
      - {kind: hfs, id: services-async-specs, at: scripts/hfs/rules/services.mjs}
  - id: R142
    code: "BE_SERVICE_ISOLATION"
    law: "A service app (`be/apps/<service>/`) imports no file of a sibling service app: the app that owns the importing file and the app that owns the file a specifier resolves to (a relative path or an alias of the program's own `compilerOptions.paths`) are read from the HFS slot view, and two different apps is a finding; services share only the `be/src` libraries and meet through the wire (a client of the sibling's API, or the events of its vendored contract under `be/contracts/<service>/`)."
    kinds: [lint]
    gates: [pre-commit, pre-push, settle, land, ci]
    failureCodes: ["BE_SERVICE_ISOLATION"]
    enforcers:
      - {kind: eslint-be, id: service-isolation}
  - id: R143
    code: "BE_SAGA_STEP_COMPENSATION"
    law: "In a product that declares the `saga` pattern (`patterns: [\"saga\"]` in hfs.json sides.be) a saga is the folder `be/src/features/<feature>/saga/` (`<saga>.saga.ts` the orchestrator, `steps/<step>.step.ts`, `compensations/<step>.compensation.ts`): every step has a compensation of the same name and every compensation a step, the orchestrator imports every step and every compensation of its folder, and a folder of steps or compensations has an orchestrator; the folders themselves are slots enabled only by the declared pattern, so an undeclared saga is `HFS_SLOT_NOT_ENABLED`."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_SAGA_STEP_COMPENSATION"]
    enforcers:
      - {kind: hfs, id: saga-step-compensation, at: scripts/hfs/rules/saga.mjs}
  - id: R144
    code: "BE_SAGA_STATE_VERSIONED"
    law: "Every saga orchestrator has `<saga>.saga-state.ts` beside it, whose exported state type declares `status` and `version: number`, and imports the fenced store of `platform/saga`: the persisted state of a run moves only through the store, every transition naming the version it read, so a zombie delivery cannot move a run twice."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_SAGA_STATE_VERSIONED"]
    enforcers:
      - {kind: hfs, id: saga-state-versioned, at: scripts/hfs/rules/saga.mjs}
  - id: R145
    code: "BE_SAGA_EVENT_CONTRACT"
    law: "A saga step and a saga compensation each name their event (`readonly event = \"<name>\"`), both events are declared in a vendored contract (`be/contracts/<service>/events.json`), and the contract of the compensation's event declares `compensates: \"<event of the step of the same name>\"`."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_SAGA_EVENT_CONTRACT"]
    enforcers:
      - {kind: hfs, id: saga-event-contract, at: scripts/hfs/rules/saga.mjs}
  - id: R146
    code: "BE_SAGA_CONSUMER_DEDUPE"
    law: "A consumer of a feature that holds a saga (`transport/message/<event>.consumer.ts`) passes the id of the delivery on (`message.eventId`) to the command it dispatches: the saga takes every event through the inbox (R80), so the consumer must hand it the dedupe key."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_SAGA_CONSUMER_DEDUPE"]
    enforcers:
      - {kind: hfs, id: saga-consumer-dedupe, at: scripts/hfs/rules/saga.mjs}
  - id: R147
    code: "BE_SAGA_E2E_MISSING"
    law: "Every compensation path of a saga has an e2e spec (`be/src/tests/e2e/<area>/*.e2e-spec.ts` through `useTestWorld`) that names the event of the compensation and injects a failure through the world (an outage of an infra service or an app with `during`, `cut` or `latency`, a fake's `failNext`, `interruptDatabase`): the compensation is proven under a fault, not only on the happy flow."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["BE_SAGA_E2E_MISSING"]
    enforcers:
      - {kind: hfs, id: saga-e2e, at: scripts/hfs/rules/saga.mjs}
  - id: R148
    code: "BE_CONTEXT_OWNER"
    law: "A connection of hfs.json is a bounded context owned by one api or worker app (`owner`, `isolation` database or schema): an app composes only the connections and capabilities of the contexts it owns, and the migrate and cli apps compose every declared connection (migrations run only through them, once per connection)."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_CONTEXT_OWNER"]
    enforcers:
      - {kind: eslint-be, id: context-owner}
  - id: R149
    code: "BE_CONTEXT_COUPLING"
    law: "Contexts are coupled only by events: no entity relation, no migration foreign key and no import (entities, services or SQL) of a domain or projection capability reaches a capability of another context."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_CONTEXT_COUPLING"]
    enforcers:
      - {kind: eslint-be, id: context-coupling}
  - id: R150
    code: "BE_CONTEXT_TRANSACTION"
    law: "One transaction touches one context's connection: inside `transaction(async (manager) => ...)` of a connection's entity manager no entity manager of another connection is used and no capability of another context is called; work across contexts is a saga."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_CONTEXT_TRANSACTION"]
    enforcers:
      - {kind: eslint-be, id: context-transaction}
  - id: R151
    code: "BE_CONTRACT_BREAKING"
    law: "An event contract evolves only additively: `be/contracts/<service>/events.json` against its pinned previous copy `events.pin.json` keeps every event, stream, version, payload field and type, adds only optional fields, and a breaking change is a new `<event>.v2` key."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["BE_CONTRACT_BREAKING"]
    enforcers:
      - {kind: hfs, id: contract-compat, at: scripts/hfs/rules/contract-compat.mjs}
  - id: R152
    code: "BE_CONTEXT_PLATFORM_TABLES"
    law: "A platform capability the manifest lists as `perConnection` (the event-bus outbox, the job table) has its entities and migrations registered on every connection whose entity manager is passed to it."
    kinds: [lint, design]
    gates: [settle, land, ci]
    failureCodes: ["BE_CONTEXT_PLATFORM_TABLES"]
    enforcers:
      - {kind: eslint-be, id: context-platform-tables}
