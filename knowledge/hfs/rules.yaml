  - id: R221
    code: "CI_TRIGGERS_RELEASE_ONLY"
    law: "The only workflow triggers are a push of release tags, a person dispatching it and, in the runtime's own workflows (`.github/workflows/` at the root), a push to `main`: every tracked workflow declares an `on` that holds only `push` filtered to `tags: ['v*']` (and, in the runtime's own workflows, `branches: [main]`; no paths or ignore filter beside them) and `workflow_dispatch`. The examples and the hfs app templates (so every scaffolded app inherits it) take the tag and the dispatch only: an app's CI runs once per release, on its tag. A push to any other branch, a pull_request, a schedule, a workflow_call or any other event refuses the workflow."
    scope: runtime
    editions: [lite, full]
    docs: [docs/git-governance.md#r221]
    proves: [tests/hfs-proofs/ci-triggers-release-only.spec.mjs]
    exemplifiedBy:
      - {path: packages/hfs/templates/app/ci-workflows-lite/github/workflows/ci.yml, edition: lite}
      - {path: packages/hfs/templates/app/ci-workflows/github/workflows/ci.yml, edition: full}
      - {path: tests/hfs-proofs/ci-triggers-release-only.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/ci-triggers-release-only.spec.mjs, edition: lite, codes: [CI_TRIGGERS_RELEASE_ONLY]}
      - {path: tests/hfs-proofs/ci-triggers-release-only.spec.mjs, edition: full, codes: [CI_TRIGGERS_RELEASE_ONLY]}
    kinds: [check]
    gates: [runtime]
    failureCodes: ["CI_TRIGGERS_RELEASE_ONLY"]
    enforcers:
      - {kind: runtime, id: git-triggers, at: scripts/hfs/runtime-rules/git-triggers.mjs}
  - id: R222
    code: "RELEASE_NOTES"
    law: "A release tag `v<version>` on HEAD has its CHANGELOG.md section `## [<version>]` with no TODO, PENDING or TBD left in it and no `in preparation` mark: the tag message and the GitHub Release are that section, so a tag is never cut over an unfinished or missing section."
    scope: runtime
    editions: [lite, full]
    docs: [docs/git-governance.md#r222]
    templateNa: "Release tags at HEAD and their finished changelog sections are authored release evidence, not app scaffold output."
    proves: [tests/hfs-proofs/release-notes.spec.mjs]
