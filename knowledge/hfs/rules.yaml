  - id: R293
    code: "STACK_TOOLING_REIMPLEMENTED"
    law: "In lite and full apps, an app does not re-implement the Swarm deploy tooling the canon ships as `starci app stack <verb>`. Tracked deploy sources (files under deploy/ and scripts/, the scripts of package.json and every workflow except the managed stack-deploy.yml) never call a docker command a verb owns (docker stack deploy and config, docker secret and config create and rm, docker service ls, ps, inspect and update, docker swarm init, docker volume create, docker node ls), and deploy/ holds no render, provision, converge, verify, prune, rollback, release, backup, prepare, doctor, jobs or public script. A finding names the file and the replacing verb, never a snippet; docker stack rm, ls, ps and services, docker compose, docker run, exec, ps and logs, comments, documents and `starci app stack ...` command lines are not judged."
    kinds: [check]
    gates: [settle, land, ci]
    failureCodes: ["STACK_TOOLING_REIMPLEMENTED"]
    enforcers:
      - {kind: hfs, id: stack-tooling, at: scripts/hfs/rules/stack-tooling.mjs}
    editions: [lite, full]
