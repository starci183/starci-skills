      - {kind: eslint-be, id: spec-module-definition-only-providers}
      - {kind: eslint-be, id: spec-no-module-mock}
      - {kind: eslint-be, id: no-return-only-generic}
      - {kind: eslint-be, id: spec-infra-double-from-kit}
      - {kind: eslint-be, id: spec-exact-values}
      - {kind: eslint-be, id: spec-no-skip}
      - {kind: eslint-be, id: unit-spec-providers}
