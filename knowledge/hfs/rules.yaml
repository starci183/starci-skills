      - {path: tests/hfs-proofs/release-notes.spec.mjs, edition: full, codes: [RELEASE_NOTES]}
    kinds: [check]
    gates: [runtime]
    failureCodes: ["RELEASE_NOTES"]
    enforcers:
      - {kind: runtime, id: release-notes, at: scripts/hfs/runtime-rules/release-notes.mjs}
  - id: R223
    code: "RIGHTS_ROLE_DENIED"
    law: "By the caller's role, the command guard refuses git push, git tag, raw git commit/add/rm/mv, raw git synchronization writes, npm publish, a whole-suite run outside the release cut and unit.verify/e2e.verify, npm ci without the host lock, a release cut, and raw side-effecting tools; modules/kernel/command-policy.yaml is the one rule table read by both the PreToolUse guard and the PATH shim."
    scope: runtime
    kinds: [check]
    gates: [land, runtime]
    failureCodes: ["RIGHTS_ROLE_DENIED", "RIGHTS_GIT_PUSH", "RIGHTS_GIT_TAG", "RIGHTS_GIT_COMMIT", "RIGHTS_GIT_SYNC", "RIGHTS_NPM_PUBLISH", "RIGHTS_NPM_CI_UNLOCKED", "RIGHTS_SUITE_RUN", "RIGHTS_RELEASE_CUT", "RIGHTS_RAW_TOOL"]
    enforcers:
      - {kind: runtime, id: role-rights, at: scripts/hfs/runtime-rules/rights-policy.mjs}
  - id: R224
    code: "RIGHTS_PROTECTED_ZONE"
    law: "The protected zone declared once in modules/kernel/protected-zone.yaml is edited only by the owner path; a supervisor self-upgrade files an owner proposal, and an op never writes the .claude runtime checkout."
