      - {path: tests/hfs-proofs/hfs-e2e-automatic-gate.spec.mjs, editions: [lite, full]}
    witness:
      - {path: tests/hfs-proofs/hfs-e2e-automatic-gate.spec.mjs, editions: [lite, full]}
    law: "e2e never joins husky, coverage or automatic CI."
    kinds: [check]
    gates: [land, ci]
    failureCodes: ["HFS_E2E_IN_AUTOMATIC_GATE"]
    enforcers:
