    law: "A feature file (a role of ruleParams.be.thinRoles inside a slot of tier feature: handler, resolver, controller, consumer, processor, step, saga, saga-step, compensation, webhook, gateway, subscription, cli, mapper, the saga orchestrator service) maps its parameters and makes ONE delegating call into modules/ (a service, the command or query bus, the event bus, a queue producer): no branch, loop, ternary, try or throw and no computation. Business logic lives in modules/**, where every logic file owes 100 per file; orchestration (step order, compensation, claim, fencing, retry) lives in platform/*; the feature layer is proven by integration and e2e. The gate calls a kind requires are not delegation: a webhook's first verification call of R183 when followed by one separate intake, and a job step's `JobClaims` fence (`advance`, `runKey`); a combined domain verification and intake call counts as the delegation. A logger call, a pure mapper function and a modules function in argument position are free too; a mapper may map a collection item by item (`map`) and write a date as text (`toISOString`), and a cli group command shows its help. A webhook POST may return the declared literal PROVIDER_ACK and its optional GET may echo only its first domain verifier result; neither is an extra delegation. A webhook door and its HTTP module import or inject no CommandBus, QueryBus of @nestjs/cqrs or feature command handler: the inbox recording intake is the handoff, and a reactor or job dispatches after commit."
    kinds: [lint]
    gates: [pre-commit, settle, land, ci]
    failureCodes: ["BE_FEATURE_THIN"]
    enforcers:
      - {kind: eslint-be, id: feature-thin}
