schema: starci/knowledge-source@1
id: knowledge
title: Knowledge
purpose: |
  This tree contains scoped development reference material, not task orchestration.
  See patterns/scan-coverage.yaml for current source-scan coverage and known automated-check gaps.
appliesTo:
  - knowledge
provenance:
  reviewedAt: 2026-09-30
  limitations: |
    Component names, tokens and ownership tables describe the installed family and the standard at
    the review date. Verify the actual installed package and source before using them; do not invent
    missing APIs or substitute a different framework family. A source-derived business description
    remains unapproved until its owner accepts it.
guidance:
  - id: load-order
    requirement: Read hfs/README.md (HFS, the one source and storage standard), hfs/rules.yaml (the one rule
      catalog), architecture-rules.yaml, coding-reference.yaml and the smallest applicable English Nest/Next topic.
      All projects use Next.js/NestJS under HFS. Code patterns are checked by
      executable scripts; design patterns and edge cases are reviewed by agents using Markdown guidance.
      Knowledge has no translated mirrors and grants no execution authority. Product requirements, design,
      scope and state belong in .starciwork; execution evidence (captures, runs, logs, reports) lives in the
      project ledger and the blob store and a record cites it (modules/schemas/work-layout.yaml productPaths).
branches:
  - id: architecture-rules
    title: Common Nest/Next architecture rules
    path: architecture-rules.yaml
    use: Semantic design obligations (ownership, state, effects, concurrency, operability, evidence, deployment) that
      need a reviewing agent; every machine-decidable obligation is a rule of hfs/rules.yaml.
  - id: design-patterns
    title: Enterprise design pattern decisions
    path: design-patterns.yaml
    use: Semantic selection and failure review with primary research; scoped agent review and real behavior evidence.
  - id: application-stacks
    title: Complete application stacks
    path: application-stacks.yaml
    use: Whole-app dev and Ubuntu VPS Compose deployment, encrypted custody, lifecycle and verification.
  - id: sonar-gate
    title: Sonar quality gate
    path: sonar-gate.yaml
    use: The one place the Sonar thresholds live (new code - services' coverage 100, duplication, blocker/critical issues,
      unreviewed hotspots - and the overall part - coverage 100 per service, no open issue, every hotspot reviewed), the ops that must pass them and the why codes; an app only names the gate
      in the app root's .starcistacks.
  - id: code-examples
    title: Code examples
    path: code-examples/index.yaml
    use: Focused extracted examples for applying the rules directly.
  - id: hfs-slots
    title: HFS slot manifest
    path: hfs/slots.yaml
    use: The one manifest of what may exist in an app (the root and its be/ and fe/ sides), where, and which tier may
      import which; read only through scripts/lib/hfs-slots.mjs. An app carries one hfs.json of kind app
      (modules/schemas/hfs-repo.schema.yaml).
  - id: hfs-rules
    title: HFS rule catalog
    path: hfs/rules.yaml
    use: The one rule catalog - finding code, Vietnamese title, gates, failure codes and every enforcer of every
      HFS rule; read only through scripts/lib/hfs-slots.mjs (loadRuleCatalog, rules) and held to the packages, the
      scripts and every knowledge file that names a rule code by scripts/checks/check-hfs-rules.mjs. The executable
      obligation inventory that maps rules to machines is modules/models/code-patterns.yaml.
  - id: enforcement
    title: Enforcement
    path: patterns/enforcement.yaml
    use: Anti-bypass requirements and explicitly proposed cross-project upgrades.
  - id: hfs
    title: HFS
    path: hfs/README.md
    use: The one source and storage standard for every StarCi app - principles, slots and versioning,
      hfs.json, the app map (root, be/, fe/), backend and frontend trees, tests, secrets, tooling, gates, done criteria and the
      rule table of the catalog. The slot manifest hfs/slots.yaml is its machine form.
  - id: repo-patterns
    title: Repository patterns
    path: patterns/repo/index.yaml
    use: The repository-level law - root map and storage states, the app-root .starciwork and .starcistacks, sealed
      secrets, shared tooling, the formatter, version pins and size budgets.
  - id: backend-patterns
    title: Backend patterns
    path: patterns/be/index.yaml
    use: Concrete NestJS code patterns under HFS, the owner-locked BE convention of 2026-09-30 - tiers, module shape,
      injectors, CQRS application layer, transport, persistence with one connection per database, errors and
      outcomes, logging, configuration, default-deny authentication, infrastructure ownership and background work;
      executable code checks and separately scoped semantic review.
  - id: frontend-patterns
    title: Frontend patterns
    path: patterns/fe/index.yaml
    use: Concrete Next.js and Grammar code patterns under HFS - data transport, boundaries, i18n, CSS tokens,
      packages and multiple apps; executable code checks and separately scoped semantic review.
  - id: ui
    title: UI
    path: ui/index.yaml
    use: Composition, presentation and rendered-proof criteria selected for the current scope, including the
      owner's UX/UI discipline (composition/taste.yaml DISCIPLINE-1..3, HIERARCHY-6, ACCENT-6) and the worked
      brand.direction example a product's brand record settles per archetype (ui/examples/brand-direction.nivo.yaml).
  - id: grammars
    title: Grammar snapshots
    path: grammars/index.yaml
    use: Family-specific package observations, not a guarantee of current exports.
related:
  - coding-reference.yaml
  - patterns/scan-coverage.yaml
