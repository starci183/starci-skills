schema: starci/knowledge-source@1
id: knowledge
title: Knowledge
purpose: |
  This tree contains scoped development reference material, not task orchestration.
  See patterns/scan-coverage.yaml for current source-scan coverage and known automated-check gaps.
appliesTo:
  - knowledge
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  limitations: |
    Component names, tokens, ownership tables and source counts describe the reference family
    at observation time. Verify the actual installed package/source before using them; do not
    invent missing APIs or substitute a different framework family. A source-derived business
    description remains unapproved until its owner accepts it. Historical evidence links are
    pinned Git provenance at the extraction commit, not current instructions or current product
    proof. If the remote link is unavailable, inspect that exact object with
    `git show <commit>:<path>` in this skills repository.
guidance:
  - id: load-order
    requirement: Read architecture-rules.yaml, coding-reference.yaml and the smallest applicable English Nest/Next
      topic. All projects use Next.js/NestJS and the owner Academy patterns. Code patterns are checked by
      executable scripts; design patterns and edge cases are reviewed by agents using Markdown guidance.
      Knowledge has no translated mirrors and grants no execution authority. Product requirements, design,
      scope, state and evidence belong in .starciwork.
branches:
  - id: architecture-rules
    title: Common Nest/Next architecture rules
    path: architecture-rules.yaml
    use: Shared ownership/effect invariants, fixed stack and executable-code versus agent-design verification.
  - id: design-patterns
    title: Enterprise design pattern decisions
    path: design-patterns.yaml
    use: Semantic selection and failure review with primary research; scoped agent review and real behavior evidence.
  - id: code-pattern-enforcement
    title: Executable code-pattern coverage
    path: code-pattern-enforcement.yaml
    use: Runtime-owned obligation inventory, complete mechanical coverage and explicit missing/conflicting checkers.
  - id: application-stacks
    title: Complete application stacks
    path: application-stacks.yaml
    use: Whole-app dev and Ubuntu VPS Compose deployment, encrypted custody, lifecycle and verification.
  - id: repository-baseline
    title: Repository baseline
    path: repository-baseline.yaml
    use: Toolchain a new Nest or Next repository carries from its first commit - strict TypeScript, canon lint,
      test runner and coverage, git hooks, CI gates, Codecov/Sonar, ignore rules and line endings.
  - id: code-examples
    title: Code examples
    path: code-examples/index.yaml
    use: Focused extracted examples for applying the rules directly.
  - id: enforcement
    title: Enforcement
    path: patterns/enforcement.yaml
    use: Anti-bypass requirements and explicitly proposed cross-project upgrades.
  - id: backend-patterns
    title: Backend patterns
    path: patterns/be/index.yaml
    use: Concrete NestJS code patterns derived from Academy; executable code checks and separately scoped semantic
      review.
  - id: frontend-patterns
    title: Frontend patterns
    path: patterns/fe/index.yaml
    use: Concrete Next.js and Grammar code patterns derived from Academy; executable code checks and separately
      scoped semantic review.
  - id: ui
    title: UI
    path: ui/index.yaml
    use: Composition, presentation and rendered-proof criteria selected for the current scope.
  - id: grammars
    title: Grammar snapshots
    path: grammars/index.yaml
    use: Family-specific package observations, not a guarantee of current exports.
related:
  - coding-reference.yaml
  - patterns/scan-coverage.yaml
