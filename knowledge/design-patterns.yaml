schema: starci/knowledge-source@1
id: design-patterns
title: Enterprise design decisions and failure review
purpose: >-
  Agent-reviewed semantic guidance for the fixed TypeScript, Next.js and NestJS stack.
  Read docs/design-pattern-catalog.md and select applicable DP-01 through DP-16 from
  concrete scenario invariants. Code-pattern obligations remain executable and cannot
  be waived by this review. This catalog does not require every mechanism in every project.
appliesTo:
  - backend
  - frontend
family: cross-cutting
provenance:
  reviewedAt: 2026-09-16
  sources:
    - docs/design-pattern-catalog.md
    - docs/design-pattern-source-review-20260916.md
  limitations: >-
    Primary framework/database documentation, original engineering analyses and selected
    source inspection are recorded in the linked Markdown.
    Neither proves current product behavior, provider effects, deployed topology or
    complete code-rule enforcement. Runtime installation does not migrate product source.
guidance:
  - id: pattern-selection
    requirement: >-
      Select mechanisms from an actual ownership, consistency, authority or failure
      requirement. Record applicability and the rejected simpler alternative in the
      existing owning design; do not manufacture pattern nodes or compulsory layers.
  - id: effect-and-recovery
    requirement: >-
      Review atomicity, idempotency, publication/consumption, durable progress, obsolete
      executors and unknown outcomes wherever the scenario crosses those boundaries.
      Verify the real applicable effect and crash/concurrency boundary before acceptance.
  - id: frontend-lifecycle
    requirement: >-
      Review authoritative versus derived state, client/server data exposure, identity,
      ordering, mutation and reconnect recovery. Intrinsic visual interaction does not
      by itself require an additional state owner or presentational twin.
  - id: evidence-separation
    requirement: >-
      Scripts establish adopted mechanical coverage. Agent review establishes a reasoned
      design assessment and identifies behavioral evidence obligations; it cannot claim
      an unexecuted check or waive a missing code checker. Distinguish source observations
      from accepted SRS/SDS and verified implementation.
