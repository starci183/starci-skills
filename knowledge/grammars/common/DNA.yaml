gaps:
  - components:
      - GrammarRoot
    missing: |
      `GrammarRoot` publishes `theme` (`system`/`light`/`dark`) and writes `data-grammar-theme`, but no
      Common sheet reads `data-grammar-theme` anywhere, and every shipped rule that does is conjoined
      with a family scope. A page that imports `@starci/grammar/common/styles.css` alone writes the
      attribute and binds nothing to it, so an explicit `theme="dark"` is inert
    evidence:
      - packages/grammar/src/core/primitive/GrammarRoot/index.tsx:17
      - packages/grammar/src/common/styles.css
      - packages/grammar/src/core/styles.css:78
      - packages/grammar/src/heritage/styles.css
      - packages/grammar/src/offset-pop/styles.css:110
  - components:
      - GrammarRoot
    missing: |
      the published rhythm reaches only the anatomy added in 0.5.0: `src/common/styles.css` assigns the
      five `--grammar-*` values and reads none of them, so a base renderer's gap can only be steered
      through the `--starci-core-*` names a family sheet aliases
    evidence:
      - packages/grammar/src/common/styles.css:9
      - packages/grammar/src/common/spacing.ts:15
      - packages/grammar/src/core/styles.css:34
  - components:
      - PageContainer
    missing: |
      `MARGIN-AUTO` is stamped on every `PageContainer` root, while the generated canonical catalog
      publishes MARGIN-0..6 only. A family that names the id `defineGrammarRuleConformance` cannot list
      it: `unknown` rejects any id absent from `COMMON_UI_RULE_IDS`, so a shipped claim is unusable in
      family conformance
    evidence:
      - packages/grammar/src/core/primitive/PageContainer/index.tsx:17
      - packages/grammar/src/common/rule-catalog.generated.ts
      - packages/grammar/src/common/conformance.ts
      - knowledge/ui/presentation/margin.yaml
  - components:
      - Calendar
      - Checkbox
      - CheckboxGroup
      - RadioGroup
      - ComboBox
      - DataTable
      - DateField
      - DatePicker
      - DateRangePicker
      - Disclosure
      - Accordion
      - NumberField
      - Pagination
      - SearchField
      - Select
      - Slider
      - Switch
      - Textarea
      - TimeField
    missing: |
      32 of the 384 grammar classes the renderers emit have no selector in any shipped sheet (Common,
      Core, Heritage, Offset Pop), and every one is a documented consumer hook, not a gap in the
      anatomy: 12 control-identity names on a root the shared `.starci-core-field` /
      `.starci-core-choice` rule already draws (`starci-core-select`, `-combo-box`, `-search-field`,
      `-number-field`, `-textarea`, `-checkbox`, `-radio`, `-switch`, `-choice-group`, `-date-field`,
      `-time-field`, `-date-picker`) and 20 names on HeroUI parts whose vendor paint Common leaves as it
      is (`-list`, `-list-popover`, `-calendar-grid`, `-slider-track`, `-slider-fill`, …). A stylesheet
      that selects on them adds to the anatomy; it styles nothing the package already styles. The list
      is `CONSUMER_HOOK_CLASSES` in `tests/grammar-contracts.spec.mjs`, which fails on any other
      unpainted class and on a hook the emitting renderer's docs do not name
    evidence:
      - scripts/checks/grammar-knowledge.mjs
      - tests/grammar-contracts.spec.mjs
      - packages/grammar/src/common/components-forms.css
      - packages/grammar/src/common/components-navigation.css
      - packages/grammar/src/common/components-overlays.css
  - components:
      - SurfaceAccordionCard
    missing: |
      no card-suffix class on its own root. Its root is `starci-core-surface-accordion-card`, which ends
      in neither `-surface` nor `-surface-card`, so a host that identifies card surfaces by that suffix
      — the rule `scripts/checks/render.mjs` `cardClassesOf` applies — does not see an accordion card as a card,
      while its inner label row still carries `starci-core-surface-label`
    evidence:
      - packages/grammar/src/core/branch/SurfaceAccordionCard/classNames.ts
      - scripts/checks/render.mjs:337
  - components:
      - Badge
      - Heading
      - VerticalScrollRegion
      - StateMark
      - StaticStateRow
      - LeadingNumber
      - OtpInput
    missing: |
      a class hook of their own on some paths. `Badge`, `Heading`, `VerticalScrollRegion` and `StateMark`
      emit no `starci-core-*` class at all — they are addressed by `data-component`/`data-tier`/
      `data-contract` attributes and by the vendor's own classes — while `StaticStateRow`,
      `LeadingNumber` and `OtpInput` reach theirs only through constants imported from
      `src/core/classNames.ts`. A stylesheet that selects on `.starci-core-*` silently skips the first
      group
    evidence:
      - packages/grammar/src/core/primitive/Badge/index.tsx
      - packages/grammar/src/core/primitive/Heading/index.tsx
      - packages/grammar/src/core/composite/VerticalScrollRegion/index.tsx
      - packages/grammar/src/core/StateMark.tsx
      - packages/grammar/src/core/classNames.ts
  - components:
      - Common token contract
    missing: |
      any programmatic list of the names a consumer may override. `STARCI_CORE_TOKEN_NAMES` and
      `OFFSET_POP_TOKEN_NAMES` live in the family entries (`src/core/dna.ts`, `src/offset-pop/dna.ts`),
      and `src/common/index.ts` re-exports only state, spacing, conformance, renderers and registry — so
      the public Common entry publishes no token vocabulary, and the table above exists only because the
      CSS was read
    evidence:
      - packages/grammar/src/common/index.ts
      - packages/grammar/src/core/dna.ts
      - packages/grammar/src/offset-pop/dna.ts
  - components:
      - Common spacing vocabulary
    missing: |
      a published token for any padding step. `COMMON_SPACING_TOKENS` names five things (four gaps and a
      page inset) over a seven-step scale; the insets and corners Common actually draws come from
      `--starci-core-surface-inset`, `--starci-core-row-inset`, literal rem values in the component
      sheets and the vendor radius ramp (`--radius`, `--radius-sm|md|lg|xl`), none of which Common assigns
    evidence:
      - packages/grammar/src/common/spacing.ts:2
      - packages/grammar/src/common/styles.css
      - packages/grammar/src/common/components-forms.css
  - components:
      - WorkspaceShell
      - NavigationFeatureNav
      - Subnav
      - SurfaceCard
      - TopBar
      - BottomNav
      - Toaster
      - Dialog
    missing: |
      an elevation or stacking prop. Order lives in token defaults Common only reads
      (`--starci-core-navbar-z` 50, `--starci-core-subnav-z` 40, `--starci-core-workspace-floating-z` 40,
      `--starci-core-top-bar-z` 40, `--starci-core-bottom-nav-z` 40) and in literal `z-index` values (the
      modal backdrop 50 and the Toaster 60 in components-overlays.css, 20 and 1 on surface parts), so a
      product that must reorder the toaster or a modal against a band has no name to override
    evidence:
      - packages/grammar/src/common/styles.css
      - packages/grammar/src/common/components-overlays.css
      - packages/grammar/src/common/components-navigation.css
  - components:
      - BottomNav
      - Toaster
    missing: |
      a reader for the BottomNav offset. A fixed `BottomNav` makes its root publish
      `--starci-core-bottom-nav-offset` (4rem plus the bottom safe-area inset), but no shipped rule reads
      it: page content is not padded above the bar, and a bottom-placed `Toaster` sits at the page inset
      from the viewport bottom, on top of the bar (z 60 over 40). The app must pad its own content by that
      variable and place the toaster at the top while a fixed BottomNav is shown
    evidence:
      - packages/grammar/src/common/components-navigation.css
      - packages/grammar/src/common/components-overlays.css
      - packages/grammar/src/core/branch/Toast/index.tsx
