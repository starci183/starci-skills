    - informative
    - affirmative
    - cautionary
    - negative
    - pending
    - unavailable
  publishedSpacingTokens:
    inline: "--grammar-inline-gap"
    row: "--grammar-row-gap"
    section: "--grammar-section-gap"
    region: "--grammar-region-gap"
    pageInset: "--grammar-page-inset"
  publishedSpacingScale: "0=0, 1=0.25rem, 2=0.5rem, 3=0.75rem, 4=1rem, 6=1.5rem, 8=2rem"
  ruleCatalog: "COMMON_UI_RULE_IDS is generated from the knowledge tree by scripts/generate-rule-catalog.mjs (150 ids at capture)"
