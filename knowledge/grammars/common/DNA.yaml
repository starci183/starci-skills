observations:
  - id: common-supplies-no-colour
    observation: |
      The Common sheets assign 14 custom properties: the five `--grammar-*` rhythm values on
      `.grammar-common-root`, the band geometry, the workspace tracks, the highlight angle, the verdict
      edge, the overlay tone (`--starci-core-overlay-tone`, a pointer to a semantic variable such as
      `var(--danger, …)`, never a literal colour) and the BottomNav offset. None is a colour literal.
      `src/common/styles.spec.ts` enforces that by asserting the sheet does not contain
      `--starci-core-accent: #7547ff`, so this is owned direction, not an oversight of this version.
  - id: the-rhythm-reaches-the-new-anatomy-only
    observation: |
      The three component sheets read the published rhythm directly (`var(--grammar-row-gap, 0.75rem)`
      and the like, 49 reads), so the forms, overlay and navigation renderers respond to the scale Common
      owns. `src/common/styles.css` itself still reads no `--grammar-*` name: the 42 base renderers'
      rules read the `--starci-core-*` namespace with literal fallbacks, and only a family sheet aliases
      that namespace to the published scale (`src/core/styles.css` assigns
      `--starci-core-inline-gap: var(--grammar-inline-gap)`). A page that imports
      `@starci/grammar/common/styles.css` alone and sets `--grammar-region-gap` therefore moves the new
      renderers' gaps and none of the base renderers'.
  - id: overlays-portal-into-the-scope
    observation: |
      Every portalled overlay lands inside the nearest `.grammar-common-root`, never in `<body>`:
      Dialog, AlertDialog, Drawer, Popover and DropdownMenu through `useOverlayContainer`
      (`src/core/overlayScope.tsx`, exported as `resolveOverlayContainer` and `GRAMMAR_ROOT_SELECTOR`),
      and the Select, ComboBox, DatePicker and DateRangePicker popovers through `useGrammarPortal`
      (`src/core/primitive/Field/index.tsx`). So the family scope, its tokens, `data-grammar-theme` and
      forced-colours mapping still apply to the overlay surface. With no Grammar root around the trigger
      the body is used and every family rule stops applying. Two helpers implement the same rule.
  - id: toaster-is-in-place
    observation: |
      `Toaster` is rendered in place, not portalled: a fixed `section` with two persistent live regions
      (polite `role="status"`, assertive `role="alert"`) and a labelled list of toasts, drawing from one
      queue (`toastQueue`, or an isolated `createToastQueue()`). It is inside a family scope only if it
      is mounted inside that family's root. Default placement `bottom-end`; at 40rem and below it spans
      the inline width between the page insets; `z-index: 60`, above the modal backdrop (50).
  - id: card-surface-canon
    observation: |
      Of the three `*Card` renderers, the classes that name a card surface itself — this is what
      `scripts/checks/render.mjs` `cardClassesOf` keeps (a `starci-core-*` name ending in `-surface` or
      `-surface-card` after the `--modifier` is stripped) — are `starci-core-surface`,
      `starci-core-surface-card`, `starci-core-frameless-surface` and `starci-core-form-surface`. The
      last is applied beside `starci-core-surface-card` on the same element (`measure: form`), so it
      marks a card, never a region inside one. `SurfaceListCard` contributes only
      `starci-core-surface`; `starci-core-surface-content`, `-label`, `-fact` and `-footer` are regions
      inside a card and are listed beside their component without being card hooks. None of the 53
      renderers added in 0.5.0 is named `*Card`, so the card canon is unchanged.
  - id: family-selection-is-a-string
    observation: |
      `COMMON_GRAMMAR_COMPONENTS` is a frozen map of the same 95 components the barrels export, and
      `defineGrammarFamily` merges a family's `replacements` and `extensions` over it — rejecting an
      extension that collides with a Common name and a replacement for an unknown name. What it cannot
      reject is a root that carries no family attribute at all, which is the shape a consumer page is in
      when it imports Common's sheet and stops there.
  - id: vendor-anatomy-underneath
    observation: |
      Each renderer builds on a HeroUI part (`Card.Header`, `Drawer.Trigger`, `Accordion.Heading`,
      `Select.Popover`, `Modal`, `Table`, `Typography` for Heading) and the vendor's own class names
      appear on the same elements as the grammar's. Where a grammar rule must win over the vendor's
      `components` layer, the Common sheets re-state the box in their own `@layer` with `!important`
      rather than relying on a consumer's Tailwind scan — the debt `src/shipped-geometry.spec.ts` and
      `src/common/styles.spec.ts` refuse.
  - id: every-renderer-stamps-rule-ids
    observation: |
      Every one of the 95 renderers stamps at least one `data-contract` rule id (`claims` /
      `computedClaims` per renderer above; `tests/grammar-contracts.spec.mjs` holds it). The base
      renderers mostly claim paint - spacing, font, tone, surface, boundary, overflow ids that
      `src/__test__/styleClaims.ts` checks against the shipped declaration. The 53 renderers added in
      0.5.0 claim behaviour instead: A11Y, FOCUS, FIELD, CONTROL-STATE, STATE, FEEDBACK, ICON, MEDIA,
      MOTION, LAYOUT-4 and CORE-BOUNDARY-4 on the node that implements each (a field root, a roving
      list, a modal surface), proved by their render specs rather than by a declaration. Families still
      select them through `data-component`, `data-tier` and the `data-grammar-*` state hooks.
guidance:
  - id: common-is-not-a-family
    requirement: |
      Do not read this snapshot as a visual family's palette. A brand bound to `identity.family: common`
      is bound to the semantic entry; the colour it must supply comes from the family sheet it installs
      on the Common root, or from the host's own tokens.
    rationale: |
      Common's own sheets assign no colour, so a colour claim checked only against this table would pass
      while the page stayed unpainted.
  - id: read-the-line
    requirement: |
      Treat `source`/`uses`/`value` as pointers to re-open, not as a substitute for opening. A row whose
      line no longer carries that name is evidence the snapshot is stale, not evidence about the package.
    rationale: |
      Every row was measured at one commit; the package moves faster than the canon.
  - id: refresh-not-rewrite
    requirement: |
      When the package moves, refresh the measured blocks with
      `node scripts/checks/grammar-knowledge.mjs --write` and then re-read the authored observations and
      gaps against the new source; do not hand-edit a measured row.
    rationale: |
      Hand-edited rows are what let the 0.4.13 snapshot describe 42 renderers while the package shipped 95.
  - id: gaps-are-findings
    requirement: |
      A recorded gap is a finding at the captured commit, not a live inventory and not authority to edit
      the library. Extending the package needs separately authorized scope and operation.
    rationale: |
      Knowledge snapshots describe; they do not license a change to the thing they describe.

