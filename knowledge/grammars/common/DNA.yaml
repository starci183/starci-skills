identity:
  package: "@starci/grammar"
  version: "0.5.0"
  checkout: "b6a13be97a9d1e15b7d3f628709158e81c744a2a"
  familyId: "common"
  rootComponent: "GrammarRoot"
  rootClass: "grammar-common-root"
  rootAttributes: "data-grammar=\"common\" data-grammar-theme=\"<system|light|dark>\""
  familyScope: |
    None. Common is the neutral boundary: it writes no `data-grammar-family` value, and every rule in
    its own sheets is scoped on `.grammar-common-root` alone or on a renderer's own class. A visual
    family installs its material DNA by adding `[data-grammar-family="<id>"]` to that root
    (`defineGrammarFamily` returns `scopeProps` and rejects a style scope that does not equal its own
    id); `GrammarRootProps` types the attribute as an open string, so the root itself validates nothing.
  styleEntrypoint: "@starci/grammar/common/styles.css"
  publicEntry: "@starci/grammar/common"
  cssLayers: "declares starci-grammar-common, starci-grammar-core, starci-grammar-heritage, starci-grammar-offset-pop; writes into starci-grammar-common only"
  dependencyDirection: |
    `src/common/styles.css` imports its three component sheets (`components-forms.css`,
    `components-overlays.css`, `components-navigation.css`) and nothing else; `src/core/styles.css` and
    `src/offset-pop/styles.css` import `../common/styles.css`, and Offset Pop additionally imports its own
    three component sheets. No family sheet is imported by Common.
  familiesOverCommon:
    - id: core
      root: CoreGrammarRoot
      snapshot: starci/DNA.yaml
    - id: offset-pop
      root: OffsetPopGrammarRoot
      snapshot: offset-pop/DNA.yaml
    - id: heritage
      root: HeritageGrammarRoot
      snapshot: "none in this catalog"
  peerDependencies:
    react: ">=18"
    "@heroui/react": ">=3.2.0"
  presentationStates:
