schema: starci/knowledge-source@1
id: grammar.common.dna
title: Common Grammar — DNA
purpose: |
  Package snapshot of the `@starci/grammar/common` public entry: the custom-property names its own
  stylesheet set writes or reads, the 95 renderers it publishes with the class names and rule ids those
  sources stamp, and the absences observed while reading them. Historical observation only — not a
  claim that the currently installed package has these names, classes or gaps. Static source
  inspection does not prove runtime behavior; nothing here was rendered in a browser.
  Common is the semantic/props entry, not a visual family: it supplies renderer anatomy and the
  universal `--grammar-*` rhythm, and it supplies no colour of its own.
appliesTo:
  - grammar
family: common
provenance:
  package: "@starci/grammar"
  version: "0.5.0"
  publicEntry: "@starci/grammar/common"
  styleEntrypoint: "@starci/grammar/common/styles.css"
  exportsEntry: "packages/grammar/package.json → ./common (dist/common/index.js), ./common/styles.css"
  observedSource: "packages/grammar/src/common (host source tree of @starci/grammar@0.5.0)"
  checkout: "b6a13be97a9d1e15b7d3f628709158e81c744a2a"
  captured: "2026-09-23"
  generatedBy: "scripts/checks/grammar-knowledge.mjs --write (tokens[], renderers[], identity.counts, provenance.digests)"
  driftCheck: |
    `node scripts/checks/grammar-knowledge.mjs` re-measures the package source and reports every row of
    this file that no longer matches it (renderer list, kind, group, props type, classes, rule ids;
    token names, values, fallbacks and owners; counts; the package version). `tests/grammar-knowledge.spec.mjs`
    runs the same comparison under `npm test`, so the snapshot cannot silently fall behind the package
    again. Line positions (`source`), use counts (`uses`, `alsoReadBy`) and `digests` are pointers that
    `--write` refreshes; they are not compared.
  installedCopy: |
    The todo-app example still installs @starci/grammar@0.4.13 (its brand record, rev 3, cites that
    installed `dist/common/styles.css`). This snapshot describes 0.5.0 source and therefore no longer
    describes that installed copy: the 53 renderers added in 0.5.0 and the three component sheets are
    absent from it.
  method: |
    Every table below is a measurement of the Common entry's own source, taken by
    `scripts/checks/grammar-knowledge.mjs` (static reads only; nothing built or rendered). `digests` is
    the sha256 of each file that measurement read, so a reader can tell whether these tables still
    describe the tree in front of them; a digest that moved means re-capture, not reinterpretation.
      * tokens[] — every custom property named outside a comment in the Common stylesheet set:
        `src/common/styles.css` and the three sheets it imports (`components-forms.css`,
        `components-overlays.css`, `components-navigation.css`), the entry sheet read first. A name the
        set assigns is `assignedBy: common`, with its first value and `valueRules` (how many distinct
        values the set assigns, shown when more than one). A name a renderer writes as an inline style
        is `assignedBy: renderer` with `writtenBy`. Every other name is only read inside a `var()`:
        `assignedBy: family` for the `--starci-core-*` namespace a visual sheet may supply, `host` for
        the generic/system names the same fallback chains reach; `commonFallback` is the first read's
        fallback. `uses`/`alsoReadBy` count reads; `source` is the first position, re-readable at its line.
      * renderers[] — the names `COMMON_GRAMMAR_COMPONENTS` in `src/common/registry.tsx` holds (the 42
        base names plus the three frozen group maps it spreads: `COMMON_FORMS_COMPONENTS`,
        `COMMON_OVERLAYS_COMPONENTS`, `COMMON_NAVIGATION_COMPONENTS`), each resolved through the Common
        barrels (`renderers.ts`, `renderers-<group>.ts`) to its module. `group` is `base` or the group
        map it came from. `kind` is the physical storage path under `src/core` (primitive/composite/
        branch/composition, or `core` for a file directly in it), which `renderers.ts` documents as
        internal compatibility storage, not a public tier. `classes` are the `starci-core-*` and
        `grammar-*` string literals in the renderer's own module (its directory, or its single file)
        plus those in the declarations of the non-renderer helpers it imports by name from another
        package module (class constants, the Field anatomy parts), one hop. A nested renderer's classes
        are NOT folded in; they are listed under that renderer. `claims` are the rule ids written in a
        literal `data-contract="…"`; `computedClaims` are ids that appear only in an expression the
        component assembles. Only the union of the two is stable.
  censusChange: |
    Relative to the 0.4.13 capture (2026-09-19): all 108 token rows reproduce unchanged; six base
    renderers lose a class the old census had folded in from a nested renderer (EmptyNotice:
    `starci-core-button`, `starci-core-icon-tile`; Sidebar: `starci-core-icon-button`;
    NavigationFeatureNav: `starci-core-page-container`; ChatWorkspace and WorkspaceShell:
    `starci-core-visually-hidden`) because the class rule above no longer folds nested renderers in.
  limitations: |
    Snapshot generated 2026-09-23 from @starci/grammar@0.5.0 source at the recorded host commit, read
    statically. Before use, inspect the selected repository's manifest/lockfile, exported types,
    renderers and CSS, and record actual source/version in the .starciwork node; if source is
    unavailable, report unverified. Do not infer current APIs or defects from these tables, and do not
    invent an API that is absent from them. Specifically what this census does NOT measure:
      * No props tables here. `propsType` names the exported props type only; the closed value sets
        (`variant`, `tone`, `placement`, …) are measured in the family snapshots' `closedValues`
        (starci/DNA.yaml, offset-pop/DNA.yaml), from the same source.
      * No rendered DOM. Vendor classes ride along on real markup (`button`, `button--md`, `textfield`,
        `input`, `label`, `typography typography--h1`, the HeroUI slot classes of Select, Modal,
        Drawer, Toast, Table, … and the consumer's own Tailwind utilities); `classes[]` names only
        grammar-owned classes, so it is not a complete class list for any element.
      * No runtime behaviour: state, focus, motion, contrast and dark mode were not executed or measured.
      * Values are quoted from the Common layer alone. Where Common only reads a name, this snapshot
        deliberately carries no value for it: the colour values live in a family sheet
        (`src/core/styles.css`, `src/offset-pop/styles.css`), which belongs to that family's snapshot.
      * A brand record may declare token names this snapshot does not carry — the Tailwind primitives
        `--color-white` and `--color-black` appear in no grammar source file at this version, so they
        are absent from `tokens[]` by design, not by omission. `scripts/checks/brand.mjs` `tokens-in-grammar`
        will report such a name as missing; that is the brand importing outside the grammar, not a
        grammar gap.
