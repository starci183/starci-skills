schema: starci/knowledge-source@1
id: grammar.starci.dna
title: StarCi Core — DNA
purpose: |
  Package snapshot of the StarCi Core Grammar family: the DNA module's values, the tokens Core's sheet
  sets on its root (and the Common-read `--starci-core-*` names it inherits), the 95 Common renderers
  Core publishes with their closed prop values, classes and stamped rule ids, and gaps. Historical
  observation only — not a claim that the currently installed package has these APIs or gaps. Static
  source inspection does not prove runtime behavior.
appliesTo:
  - grammar
family: starci
provenance:
  package: "@starci/grammar"
  version: "0.5.0"
  checkout: "b6a13be97a9d1e15b7d3f628709158e81c744a2a"
  captured: "2026-09-23"
  publicEntry: "@starci/grammar/common"
  familyEntry: "@starci/grammar/core"
  styleEntrypoint: "@starci/grammar/core/styles.css"
  generatedBy: "scripts/checks/grammar-knowledge.mjs --write (dna, tokens[], renderers[], identity.counts, provenance.digests)"
  driftCheck: |
    `node scripts/checks/grammar-knowledge.mjs` (and `tests/grammar-knowledge.spec.mjs` under `npm test`)
    compares this file with the source: `dna` must deep-equal every object `src/core/dna.ts` exports,
    each token row's value/dark/overrides must equal what `src/core/styles.css` (or Common) sets, and the
    renderer rows must equal the Common registry census, closed values included.
  method: |
    * dna — every frozen object `src/core/dna.ts` exports, loaded by stripping its TypeScript types, key
      for key (`STARCI_CORE_DNA`, the spacing scale, token names, band token names, light and dark
      defaults).
    * tokens[] — every custom property `src/core/styles.css` assigns on the family root
      `.grammar-common-root[data-grammar-family="core"]` (`valueFrom: family`; `dark` is the explicit
      `[data-grammar-theme="dark"]` value; `overrides` are the system-dark and forced-colours blocks),
      plus every `--starci-core-*` name the Common sheets assign (`valueFrom: common`), read with a
      fallback (`common-fallback`) or receive from a renderer's inline style (`renderer`) — Core
      inherits those anatomy knobs and a brand bound to `starci` may override them.
    * renderers[] — the same Common registry census as common/DNA.yaml (Core replaces only
      `GrammarRoot`), plus `closedValues`: every `readonly prop?: <closed type>` member of the props type
      and of the local types its declaration names or its members are typed as. A literal union (or an
      alias of one declared beside the renderer) is listed as `values`; a closed alias imported from
      elsewhere in the package as `type`.
  censusChange: |
    Relative to the 0.4.13 capture (2026-09-05): every one of the 66 earlier token values reproduces;
    the rows now also carry Core's semantic bindings (`--accent`, `--background`, `--field-*`,
    `--shadow-surface`, …) and the new Common anatomy knobs. Closed values are re-derived: a few rows
    gained a member the old census missed (`Icon.source`, `Text.parentEmphasis`, `Rail.landmark`,
    `WorkspaceShell.mainLandmark`), `Sidebar` lost `source` (a member of its item type, not its props),
    and `FencedCodeBlock`/`MarkdownTableFrame` lost a `measure` that belongs to `MarkdownArticle`.
    Unreleased after 0.5.0 (source only, not yet on the registry): the tertiary surface role -
    `surfaceTertiary` in the DNA (light `oklch(93.73% 0.0012 354.13)`, the StarCi Academy render's
    tertiary face; dark `oklch(27.21% 0.0023 354.13)`), the knob `--starci-core-surface-tertiary`, and
    the family-owned bindings `--starci-surface-tertiary` / `--starci-surface-tertiary-foreground`.
    HeroUI's `--surface-tertiary` is deliberately not re-bound: it stays Common's derived mix. An app on
    the registry 0.5.0 declares `--starci-surface-tertiary` in its own theme.
  limitations: |
    Snapshot generated 2026-09-23 from package @starci/grammar@0.5.0 at the recorded checkout.
    Before use, inspect the selected repository's manifest/lockfile, exported types, renderers
    and CSS; record actual source/version in .starciwork. If source is unavailable, report
    unverified; do not infer current APIs or defects from these tables. The current public
    consumer entry observed for FE work is @starci/grammar/common — verify installed exports
    rather than inventing APIs. Family ownership boundaries are in family.yaml; composition
    references are idioms.yaml and playbook.yaml.
  digests:
    - path: "packages/grammar/src/core/index.ts"
