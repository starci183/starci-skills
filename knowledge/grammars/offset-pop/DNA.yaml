observations:
  - id: one-seam-per-row-pair
    observation: |
      Static rows (`[data-grammar-row]`, StaticStateRow) have no hover or focus treatment, and the seam
      between two rows is exactly one 2px line: the family repaints Common's between-rows edge
      (`[data-grammar-row] + [data-grammar-row]`, `border-block-start` at the outline width) instead of
      adding a second edge below each row. BOUNDARY-3 stays inherited.
  - id: interactive-rows
    observation: |
      ListBox options, Select/ComboBox options and selectable DataTable rows are their own pointer and
      focus target and take their states from the vendor's attributes: `data-hovered` (or `data-focused`
      on a popover option) paints the yellow 32% wash on an unselected, enabled row; `data-focus-visible`
      a 2px `--focus` ring at offset 0 on the row edge (DataTable keeps Common's inset pink ring);
      selected paints `--accent-soft` (theme-aware: `#f8dbe8` light, `#3b2936` dark) with an
      `inset 0.25rem` pink leading edge and the `--offset-pop-accent-text` label. Reduced motion drops the
      transitions and any transform; forced colours keep a Highlight edge in place of the fill.
  - id: current-and-selected-share-the-soft-fill
    observation: |
      A focused, hovered or open DropdownMenu item and the selected row states read the same
      theme-aware `--accent-soft` fill in every theme, so there is no separate dark-only rule for them.

