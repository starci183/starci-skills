schema: starci/knowledge-source@1
id: grammar.offset-pop.dna
title: Offset Pop — DNA
purpose: |
  Package snapshot of the Offset Pop Grammar family: the DNA module's values (the Core-shaped colour,
  geometry, rhythm, elevation and motion groups plus the family's `offset` and `palette` groups), the
  tokens Offset Pop's sheets set on its root with their dark and forced-colours values, the 95 Common
  renderers it publishes with their closed prop values, classes and stamped rule ids, and gaps.
  Historical observation only — not a claim that the currently installed package has these APIs or
  gaps. Static source inspection does not prove runtime behavior.
appliesTo:
  - grammar
family: offset-pop
provenance:
  package: "@starci/grammar"
  version: "0.5.0"
  checkout: "b6a13be97a9d1e15b7d3f628709158e81c744a2a"
  captured: "2026-09-23"
  publicEntry: "@starci/grammar/common"
  familyEntry: "@starci/grammar/offset-pop"
  styleEntrypoint: "@starci/grammar/offset-pop/styles.css"
  generatedBy: "scripts/checks/grammar-knowledge.mjs --write (dna, tokens[], renderers[], identity.counts, provenance.digests)"
  driftCheck: |
    `node scripts/checks/grammar-knowledge.mjs` (and `tests/grammar-knowledge.spec.mjs` under `npm test`)
    compares this file with the source: `dna` must deep-equal every object `src/offset-pop/dna.ts`
    exports (accentText and the `offset`/`palette` groups included), each token row's value, dark value
    and overrides must equal what the family sheets set on the root, and the renderer rows must equal
    the Common registry census, closed values included.
  method: |
    * dna — every frozen object `src/offset-pop/dna.ts` exports, loaded by stripping its TypeScript
      types, key for key.
    * tokens[] — every custom property the family's own sheets (`src/offset-pop/styles.css` and the three
      `components-*.css` it imports) assign on the family root
      `.grammar-common-root[data-grammar-family="offset-pop"]`: the `--offset-pop-*` contract, the
      compatibility names (`--offset-pop-surface-muted`, `--offset-pop-transition`) and the Common
      semantic variables the family binds (`--accent`, `--accent-soft`, `--link`, `--field-*`, …).
      `value` is the light/default value, `dark` the explicit `[data-grammar-theme="dark"]` value, and
      `overrides` every other root-level block (system dark, narrow width, reduced motion, forced
      colours). The five band names Offset Pop re-exports (`OFFSET_POP_BAND_TOKEN_NAMES`) are Common's
      and carry Common's value (`valueFrom: common`). Custom properties set below the root (the
      per-state `--offset-pop-state-color`, the field ring) are family internals and are not rows.
    * renderers[] — the same Common registry census as common/DNA.yaml (Offset Pop replaces only
      `GrammarRoot`), plus `closedValues`, measured exactly as in starci/DNA.yaml.
  limitations: |
    Snapshot generated 2026-09-23 from @starci/grammar@0.5.0 source (integration commit plus the
    `lane-op/polish` row and Subnav fixes), read statically. Before use, inspect the selected
    repository's manifest/lockfile, exported types, renderers and CSS; record actual source/version in
    .starciwork. If source is unavailable, report unverified; do not infer current APIs or defects from
    these tables. Family boundaries are in family.yaml; composition references are idioms.yaml and
    playbook.yaml.
