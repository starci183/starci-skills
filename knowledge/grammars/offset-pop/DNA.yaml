gaps:
  - components:
      - "BottomNav"
      - "Toaster"
    missing: |
      the fixed BottomNav publishes `--starci-core-bottom-nav-offset` and nothing reads it (see
      common/DNA.yaml): Offset Pop draws the dock with a thicker ink top edge and an upward hard shadow,
      and a bottom-placed Toaster still lands on top of it. Content padding and toaster placement are
      the app's
    evidence:
      - "packages/grammar/src/common/components-navigation.css"
      - "packages/grammar/src/offset-pop/components-navigation.css"
      - "packages/grammar/src/common/components-overlays.css"
  - components:
      - "Offset Pop token contract"
    missing: |
      no DNA name for the press vector or the small chip shadow. Button and its press use a literal
      `0.25rem 0.25rem` offset, the current BottomNav pill and selected ListBox row `0.125rem 0.1875rem`;
      only the surface/overlay shadow reads `--offset-pop-shadow-x/-y`, so the narrow-viewport shadow
      drop (0.5rem to 0.25rem) moves surfaces but not buttons or chips
    evidence:
      - "packages/grammar/src/offset-pop/styles.css"
      - "packages/grammar/src/offset-pop/components-navigation.css"
  - components:
      - "Offset Pop palette"
    missing: |
      `yellow` and `mint` have no semantic name of their own beyond warning and success: the yellow row
      wash (`color-mix(… yellow 32% …)`) and the yellow BottomNav badge read the palette ink directly,
      so an adapter that retunes `--offset-pop-warning` leaves those washes on the old yellow
    evidence:
      - "packages/grammar/src/offset-pop/components-navigation.css"
      - "packages/grammar/src/offset-pop/components-forms.css"
      - "packages/grammar/src/offset-pop/dna.ts"
