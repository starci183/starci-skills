  package: "@starci/grammar"
  version: "0.4.13"
  checkout: "5c10a6734181a69f8482d8786a7d9e161c249c93"
  familyId: "common"
  rootComponent: "GrammarRoot"
  rootClass: "grammar-common-root"
  rootAttributes: "data-grammar=\"common\" data-grammar-theme=\"<system|light|dark>\""
  familyScope: |
    None. Common is the neutral boundary: it writes no `data-grammar-family` value, and every rule in
    its own sheet is scoped on `.grammar-common-root` alone. A visual family installs its material DNA
    by adding `[data-grammar-family="<id>"]` to that root (`defineGrammarFamily` returns `scopeProps`
    and rejects a style scope that does not equal its own id); `GrammarRootProps` types the attribute as
    an open string, so the root itself validates nothing.
