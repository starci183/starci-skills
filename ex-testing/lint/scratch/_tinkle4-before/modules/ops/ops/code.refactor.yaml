# modules/ops/ops/code.refactor.yaml - TINKLE-1 pure-yaml port of .claude/ops/code.refactor/operator.yaml
# The operator contract below is verbatim; the trailing 'business:' block is the added
# analysis (inference marked where the contract does not state it literally).

id: code.refactor
goal:
  en: Restructure one selected slice of code under a proven behavior invariant - the same regression
    check run before and after the change - never a behavior edit disguised as a refactor.
nodeKinds:
  - implementation
completionProfile: implementation
sideEffects:
  - owned source edits that restructure without changing observable behavior
  - scoped local commits when authorized
  - the declared regression and architecture checks run before and after in their declared sandbox
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap: report it and propose a separately selected scope op; do not
        create a target or invent its acceptance/graph here."
  - id: business
    path: .starciwork/<business>/business/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
        inputs in the selected .starciwork graph. Intent governs the behavior that must be
        preserved; a needed missing input is a reported graph/scope gap, not a silently added
        dependency.
  - id: architecture
    path: .starciwork/<business>/architecture/**/index.yaml
    purpose:
      en: Read the declared boundaries, contracts, data ownership and rationale the restructure must
        stay inside. A refactor that needs a different contract or boundary is a design change, not
        a refactor - report the gap instead of stretching this op.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read applicable
        instructions, manifests, the owning code, every caller and the existing tests. The
        restructure binds the exact inspected tree; a proposed change to a file that was not opened
        is not a refactor plan.
  - id: coverage
    path: repository:<repo-id>/<manifest-paths> + the slice's existing regression suite and its real
      runner
    purpose:
      en: Establish before any edit which declared check actually exercises the slice's observable
        behavior and that it can run in this environment. The check must exist, cover the changed
        surface and run verbatim - a test suite that does not exist, does not cover the slice or
        cannot run is reported `blocked` with blocker kind `test-gap`, which routes to test.author;
        it is never a reason to skip the invariant or to write the missing coverage inside this op.
  - id: conventions
    path: knowledge/coding-reference.json + knowledge/patterns/fe/INDEX.json +
      knowledge/patterns/be/INDEX.json
    purpose:
      en: Read the adopted naming, error-identity, structure and typing conventions the restructure
        must preserve or improve toward - a refactor that degrades declared pattern conformance is a
        regression, not a cleanup. Load the applicable FE or BE topic files for the selected
        repository only; conventions never authorize behavior changes.
  - id: machines
    path: scripts/check-scoped-lint.mjs + checks/code-patterns/*.mjs + checks/architecture/*.mjs +
      model/code-patterns.json + docs/architecture-check.md
    purpose:
      en: When the slice lives in a checked FE/BE repository, read the sealed architecture and
        code-pattern machines' supported arguments, report schema, exit codes and coverage limits.
        The same machine set runs verbatim BEFORE and AFTER the restructure; an architecture or
        pattern regression introduced by a pure refactor is a failure, not a refactor outcome. This
        read grants no fix-flag or repair authority.
  - id: matrix
    path: selected complete-job matrix request + workflows/jobs.json
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: model/registry.json + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority. Do not revive V2 dispatch chains, retired profiles
        or extra-agent permissions.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - state
      - blocker
      - completion.inputDigest
      - completion.evidence
      - completion.codeRefs
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic node prose. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: repository:<repo-id>/<write-ceiling>
    fields:
      - restructured source files only
    content:
      en: Only exact owned paths in the approved code-scope, restructured without observable behavior
        change - moves, renames, extractions, deletions of dead code and equivalent rewrites. No
        feature, fix, contract, schema or configuration change rides inside a refactor; a needed
        behavior change is a separate selected operation, never an edit hidden in this one.
  - id: evidence
    path: E/manifest.yaml + E/regression-before.json + E/regression-after.json +
      E/architecture-before.json + E/architecture-after.json + E/diff-map.json + E/result.md
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: "Store the exact regression command, cwd/repo, source commit/tree, exit code, counts and
        sanitized output for the before run and for the after run - the same command on both sides
        of the change. Store the same machine-check reports before and after where the slice lives
        in a checked repository. Map every moved or renamed symbol to its destination and record the
        full diff summary. Operator-specific observed result in E/result.md: the before/after parity
        statement with the observed outputs, and any behavior difference found - which is a failure,
        not a refactor outcome."
  - id: matrixHandoff
    path: E/job-result.json
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - target
      - business
      - architecture
      - repo
      - coverage
      - conventions
      - machines
      - profile
    writes:
      - evidence
    action:
      en: "Bind the exact restructure request and inspect the slice plus every caller. Select the one
        declared regression check that exercises the slice's observable behavior and run it BEFORE
        the first edit, verbatim, keeping command, tree/commit, exit code, counts and sanitized
        output. Where the slice lives in a checked FE/BE repository, run starci code-patterns check
        --profile <nest|next> --root ROOT --all BEFORE the first edit too and keep the machine report
        and exit code. A green baseline is the invariant's left side; a red baseline is reported
        failed with the observed output - a refactor does not begin on a suite already red. No
        existing, covering, runnable check is reported `blocked` with blocker kind `test-gap` and
        this op stops; it never authors the missing tests itself. Resolve the execution profile and
        actual tool availability before selecting instruments; this does not switch the
        model/runtime or spawn workers."
  - reads:
      - architecture
      - conventions
      - repo
    writes:
      - source
    action:
      en: Restructure inside the declared write ceiling in the smallest behavior-preserving steps -
        move, rename, extract, inline, delete dead code - updating every inspected caller in the same
        change so the tree stays consistent and the adopted code conventions hold. Public contracts,
        persisted shapes, wire protocols, error identities and observable side effects stay
        identical; when the requested restructure cannot hold them, stop at the boundary and report
        the gap instead of editing behavior.
  - reads:
      - coverage
      - machines
      - repo
    writes:
      - evidence
    action:
      en: Run the SAME regression check AFTER the change, verbatim, on the restructured tree and
        record it beside the before run; where the machines ran before, run the SAME starci
        code-patterns check AFTER the change on the same roots and record it beside the before
        report. Parity means the same commands, same scope, same counts and the same green results;
        a different command, a narrowed selection, a new test failure or a new architecture/pattern
        violation is not parity - it is failed with the diff between the two outputs. Nothing is
        re-worded or skipped to make the after run look like the before run.
  - reads:
      - target
      - repo
      - coverage
      - matrix
    writes:
      - node
      - evidence
      - matrixHandoff
    action:
      en: Review the actual diff and verify no unrelated or behavior-changing edit slipped in - the
        mapping of moved symbols to destinations must account for the whole change. Commit only when
        authorized, read back the full SHA/diff and prove the tested tree corresponds to that commit;
        otherwise report uncommitted honestly. Report done exactly once with both regression runs
        bound; never report a refactor that kept only a before run or only an after run. When
        selected in a job matrix, produce E/job-result.json bound to the exact request, its output
        schema and every required criterion.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly proposed, required
        assertions are covered, input bindings are current, and an honest not-run/fail cannot earn
        done.
  - id: regression-parity
    requirement:
      en: The same declared regression check ran verbatim before AND after the change, on the exact
        before tree and the exact after tree, with both exit codes, counts and outputs recorded; the
        after result matches the before result. Where the slice lives in a checked FE/BE repository,
        the same starci code-patterns check ran verbatim on both sides with its reports retained; a
        new architecture or pattern violation after the change is a failure. A missing, different or
        narrowed check on either side is a failure, and no coverage at all is the `test-gap`
        blocker, never a silent pass.
  - id: behavior-invariant
    requirement:
      en: The diff is explainable as pure restructuring - every changed symbol maps to a move,
        rename, extraction or equivalent rewrite, no public contract, persisted shape, error identity
        or observable side effect changed, and no feature or fix rode inside the change.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository,
        and separately retain integration/tested mappings. Report uncommitted or no-change honestly.
blockers:
  - code: TEST_COVERAGE_ABSENT
    condition:
      en: No existing regression check covers the slice's observable behavior or the covering check
        cannot run in this environment. Report blocked with blocker kind `test-gap`; the graph routes
        it to test.author and this op never writes the missing coverage itself.
  - code: SCOPE_WIDENING
    condition:
      en: The requested restructure needs a path outside the selected write ceiling; report the exact
        paths as blocker kind shared-change rather than widening the allowlist.
  - code: REQUIREMENT_UNSETTLED
    condition:
      en: "The behavior to preserve is not settled by the accepted requirement - report blocked with
        blocker kind srs-gap, never pick a reading in code."
  - code: DESIGN_GAP
    condition:
      en: "The design record is silent about the boundary or contract the restructure must hold -
        report blocked with blocker kind sds-gap, never invent the contract."
  - code: ENVIRONMENT_UNAVAILABLE
    condition:
      en: "The declared regression runner, a declared architecture/code-pattern machine, a
        dependency or the sandbox cannot start here and the cause is provably unfixable from the
        allowlist - report blocked with blocker kind environment naming the exact missing piece."
  - code: AUTHORITY_REQUIRED
    condition:
      en: "Completing the request needs an authority the goal does not grant - report blocked with
        blocker kind authority, an owner decision, never a silent widening."
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  manifest-paths: Manifest and script files defining the declared regression check
  write-ceiling: Explicit owned source paths
commitPolicy:
  mode: scoped-local-commit
  ownership: exact-selected-paths
  verify: git-readback-full-sha-and-diff
  push: false
  reuseAuthorization: true
  noChange: return-existing-verified-commit-no-empty-commit
refactorPolicy:
  behaviorInvariant: required
  regressionCheck: same-check-verbatim-before-and-after
  architectureCheck: starci-code-patterns-check-same-machines-before-and-after
  baselineRed: failed-not-refactored
  coverageAbsent: blocked-test-gap
  productBehavior: unchanged
  scopeEdits: owned-paths-only
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# TINKLE-1 business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "Can this code slice be restructured while the same regression check proves
    identical observable behavior before and after?"
  whenNeeded:
    - When a selected code slice needs restructuring - move/rename/extract/dead-code removal - under a proven behavior invariant.
    - Only where a covering regression check exists to bound the before/after proof.
  whenNot:
    - Any behavior, contract, schema or config change is a separate operation - never smuggled into a refactor.
    - No covering regression check = test-gap blocked (routes to test.author), never a refactor by inspection.
    - Red baseline = failed, not "refactored"; a refactor never starts from failing regression.
    - Requirement unsettled (srs-gap) or design gap (sds-gap) routes to its owner, not resolved here.
  consumes:
    - Target node, business/architecture boundaries for the slice.
    - Repo slice + all callers; the existing regression suite and check commands; coding conventions; sealed check machines.
  produces:
    - Restructured source only (inside write ceiling); diff-map of moved/renamed symbols.
    - Before/after regression reports + architecture/pattern machine reports; scoped commit when authorized.
  failureModes:
    - TEST_COVERAGE_ABSENT (test-gap), SCOPE_WIDENING (shared-change), REQUIREMENT_UNSETTLED (srs-gap), DESIGN_GAP (sds-gap), ENVIRONMENT_UNAVAILABLE, AUTHORITY_REQUIRED, DECLARED_DEPENDENCY_UNMET.
    - Behavioral drift discovered mid-run = restore and report; the proof is identical regression output, not reviewer opinion.
# ---------------------------------------------------------------------------
# route: resolver index (added by tinkle-6 per tinkle/_common.md amendment).
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [refactor, cleanup, maintenance]
  prerequisites: ["delivered code + existing regression coverage"]
  riskHints: [source-edits]
