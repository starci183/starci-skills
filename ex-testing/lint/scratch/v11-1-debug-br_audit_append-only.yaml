schema: work/business-rule
id: br.audit.append-only
title: A log line is never altered
state: done
statements:
  - Once a line is appended, its stored bytes and its position in the chain never change again.
  - Any alteration of a line, or removal of a line, is detectable by recomputing the chain.
authorityRefs:
  - "owner-intent: A log nobody can trust is worthless; the check has to be real, not a promise."
acceptance:
  - id: ac.audit.append-only.chain-detects-tamper
    given: A log with several appended lines, each line's hash covering its own content and the previous
      line's hash
    when: A test mutates one stored field on an already-appended line, or removes one line from the
      middle of the store, then asks the module to recompute the chain from the first line forward
    then:
      - The recomputation reports the exact index where the recomputed hash first stops matching the
        stored one, not merely "invalid" - a removed line must surface as a broken prevHash link at the
        line that followed it, and a changed field must surface as a content mismatch at that line.
      - The same recomputation over an untouched log reports every line valid.
      - "The check that proves this: a node:test (or Nest e2e) suite that appends N lines, snapshots the
        chain, mutates the underlying storage directly (bypassing the module's own write path, the way a
        rogue admin or a compromised disk would), and asserts the recomputed break index equals the
        mutated line's index. A test that only calls the module's own append/verify pair without an
        out-of-band mutation does not prove tamper-evidence; it proves the happy path."
module: src/modules/bussiness/audit

