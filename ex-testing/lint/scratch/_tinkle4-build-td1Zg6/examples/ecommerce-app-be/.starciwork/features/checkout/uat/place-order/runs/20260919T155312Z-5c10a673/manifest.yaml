schema: starci/uat-run-manifest@1
id: uat.checkout.place-order.runs.20260919T155312Z-5c10a673
nodeId: uat.checkout.place-order
inputDigest: 4a3f00479964a76d190089c3f34c1e6aa99ddd8adfa3d3ab46c7db1c1c5f783d
outcome: pass
assertions:
  - id: step1.loading
    expected: yes
    observed: yes
    note: The sign-in submit shows its own pending label ("Signing in…") while /api/session answers; the
      catalogue read is a server render, so the grid is the settled answer.
  - id: step1.completion
    expected: yes
    observed: yes
    note: After signing in through /api/session, /en/browse listed the catalogue with prices (the order
      service's session-guarded cart query's catalog snapshot).
  - id: step2.completion
    expected: yes
    observed: yes
    note: "The tile's add control answered \"In your cart: 1\" (the addCartItem mutation's line
      quantity) and /en/cart renders the Enamel mug line."
  - id: step3.loading
    expected: yes
    observed: yes
    note: The confirm button renders its pending label ("Confirming…") while placeOrder answers.
  - id: step3.completion
    expected: yes
    observed: yes
    note: 'The confirmation card answered order 3eeedc00-a96b-4bb4-8337-e27bfae42981 with status, total
      and payment id; the cart then read as the empty state ("Your cart is empty": true).'
  - id: step4.completion
    expected: yes
    observed: yes
    note: Re-pressing the same rendered confirmation re-sent the same idempotency key; the service
      returned the first order (same orderId shown) marked "already sent" - no second order was
      written.
  - id: step4.errorFeedback
    expected: no
    observed: no
    note: A replayed confirmation must not surface a refusal line.
  - id: step5.errorFeedback
    expected: yes
    observed: yes
    note: 'The empty-cart refusal rendered: "The order service refused: your cart is empty. Nothing was
      placed and nothing changed."'
  - id: step6.errorFeedback
    expected: yes
    observed: yes
    note: "The insufficient-stock refusal named the product, the stock that exists and the asked
      quantity (catalogue stock is 2, the cart asked for 3); the cart kept its lines (Steel thermos
      still listed: true)."
  - id: step7.order-known
    expected: yes
    observed: yes
    note: The provider's own machine door (GET /internal/buyers/d301ed91-8683-48cf-acab-40e8ff6a35fa)
      answered hasOrders=true - for a person this run registered, that flag can only be the order
      confirmed at step 3 (3eeedc00-a96b-4bb4-8337-e27bfae42981).
  - id: step7.completion
    expected: yes
    observed: yes
    note: The account page names this run's signed-in person and renders the buyer confirmation - "The
      order service confirms this account has placed orders" - the order-for-identity postcondition
      the product serves (no per-order list door exists; none is claimed). The person was registered
      by this run, so that answer is this run's confirmed order and no one else's.
