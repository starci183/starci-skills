schema: work/sds-component
id: sds.checkout.order-flow
title: Cart to confirmed order, across the two services
state: done
responsibility: >-
  Holds the checkout transaction: a verified session, accumulated cart lines, guarded stock, one
  captured payment, one confirmed order. The session lives in the identity service's Redis, not
  here - every authenticated call crosses the wire to learn who is calling, and who owns the
  session's own design is the identity feature's record to write.
interfaces:
  - Only the checkout feature's HTTP transport writes these tables; the identity service never touches them.
  - The buyer answer this component gives (contract.checkout.order-for-identity) is derived - a count over written orders, never a copied flag.
owners:
  - {role: module, path: src/modules/bussiness/order}
  - {role: module, path: src/modules/bussiness/cart}
  - {role: module, path: src/modules/bussiness/payment}
  - {role: module, path: src/modules/bussiness/catalog}
refs: [br.checkout.place-order, fr.checkout.place-order, contract.checkout.order-for-identity]
dependsOn: [integration.checkout.postgres]

extensions:
  work3:
    integrations:
      - id: postgres
        provider: postgresql
        credential:
          name: ORDER_DATABASE_URL
          providedBy: owner
          where: .starcistacks/dev - the dev container runs with trust authentication, so the credential is the URL itself
        sandbox: true
      - id: redis
        provider: redis
        credential:
          name: IDENTITY_REDIS_URL
          providedBy: owner
          where: .starcistacks/dev - same trust posture, this example's session store
        sandbox: true

stateMachine:
  states: [anonymous, carting, confirmed, refused]
  initial: anonymous
  terminal: [confirmed]
  transitions:
    - id: t-verify
      from: anonymous
      to: carting
      on: session-verified-over-http
      guard: The identity service answered with a person for this bearer token.
    - id: t-add
      from: carting
      to: carting
      on: cart-line-added
      guard: The product id is present and the quantity is a positive integer; catalog
        membership is not checked here - a line the catalog does not know persists until
        confirmation refuses it.
      effect: The line accumulates on (person, product).
    - id: t-stock
      from: carting
      to: refused
      on: confirmation-requested
      guard: The cart is empty, a line names a product the catalog does not know, or some
        line requests more than the catalog holds.
      effect: A named refusal (cart-empty, unknown-product or insufficient-stock); nothing is written and no stock moves.
    - id: t-pay
      from: carting
      to: confirmed
      on: confirmation-requested
      guard: Every line is in stock and the session still verifies.
      effect: Stock is consumed, order, lines and the captured payment are written in one transaction.
    - id: t-confirm
      from: confirmed
      to: confirmed
      on: idempotency-key-replayed
      guard: The replay carries the key the first confirmation used, for the same person.
      effect: The first answer is returned with replayed set to true; no second order exists.

sequence:
  participants: [browser, order, identity, postgres]
  steps:
    - {from: browser, to: order, message: "mutation addCartItem on /graphql with the bearer session token, observable: http"}
    - {from: order, to: identity, message: "POST /internal/sessions/verify with the token in the JSON body, observable: http"}
    - {from: identity, to: order, message: "the personId, or a 401 the order propagates as its own refusal, observable: http"}
    - {from: order, to: postgres, message: "INSERT/UPDATE the cart line, observable: write"}
    - {from: browser, to: order, message: "mutation placeOrder on /graphql with the idempotency key in the input, observable: http"}
    - {from: order, to: postgres, message: "guarded stock UPDATE, one order, its lines, one captured payment, cart DELETE - one transaction, observable: write"}
    - {from: order, to: browser, message: "the confirmed order with its total in minor units, observable: http"}
  note: >-
    Only interactions an end-to-end run can observe are bound here, per the layout's rule for
    `sequence`. Internal call order inside the confirmation transaction is the implementation's
    business.

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

change:
  rev: 2
  kind: clarifying
  at: 2026-09-19T14:00:00.000Z
  reason: >-
    Sequence messages named the retired REST doors (POST /cart/items, POST /sessions/verify,
    POST /orders); the shipped surface is GraphQL mutations on /graphql plus
    POST /internal/sessions/verify on the identity service. t-add's guard claimed the product
    is in the catalog at add time - the code does not check it there (CartService upserts
    blindly); catalog membership is enforced at confirmation as the unknown-product refusal,
    which t-stock now names.
