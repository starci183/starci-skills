schema: starci/uat-run-manifest@1
id: uat.identity.sign-in.runs.20260919T151633Z-5c10a673
nodeId: uat.identity.sign-in
inputDigest: 3dae04f43b2b6515fe818d36c280f114fe0ceb767eb07623fbb745a5104d770a
outcome: pass
assertions:
  - id: loading
    expected: yes
    observed: yes
    note: The register submit relabelled to "Registering…" and disabled itself while the request was in
      flight (SessionForm working state).
  - id: completion
    expected: yes
    observed: yes
    note: After one POST /api/session (mode=register), the account page re-rendered server-side and
      shows "Signed in as uat-person-20260919t151633z-5c10a673@ecommerce.dev." with the Sign out
      action - the registered pair signed the person in.
  - id: fr.identity.sign-in
    expected: yes
    observed: yes
    note: Register ran the identity register door then signIn behind it; the opaque bearer landed in the
      httpOnly northwind-session cookie and the server render verified it to this person.
  - id: errorFeedback
    expected: yes
    observed: yes
    note: 'The wrong pair was refused with HTTP 401 (INVALID_CREDENTIALS) and the form rendered one
      role="alert" line: "That email and password did not open a session.".'
  - id: br.identity.sign-in
    expected: yes
    observed: yes
    note: Wrong-password-on-known-email and any-password-on-unknown-email both answered 401
      INVALID_CREDENTIALS and rendered the identical refusal "That email and password did not open a
      session." - indistinguishable, naming neither half
      (ac.identity.sign-in.wrong-pair-is-refused-alike).
  - id: validation
    expected: yes
    observed: yes
    note: With the password empty the submit stayed disabled; Enter and a forced click produced zero
      POST /api/session calls - refused before the credential check, exactly as
      fr.identity.sign-in's exception flow states.
  - id: errorFeedback
    expected: yes
    observed: yes
    note: Re-registering uat-person-20260919t151633z-5c10a673@ecommerce.dev answered 409 EMAIL_TAKEN and
      the form rendered the conflict refusal "That email already has an account — sign in instead.".
