schema: work/functional-requirement
id: fr.identity.sign-in
title: Sign in
state: done
actors: [person]
trigger: The person submits an email and a password, or registers a new pair.
mainFlow:
  - The pair is checked against the stored hash.
  - A live session is issued and returned as an opaque bearer token.
exceptionFlows:
  - A registration needs a plausible email and a password of at least 8 characters; anything less is refused before any account work.
  - A wrong pair is refused without naming which half was wrong.
  - A request missing a half is refused before any credential check.
  - A registration with a taken email is refused as a conflict.
postconditions:
  - The token verifies over HTTP for as long as its TTL lives, and only the identity service reads the store.
composes:
  - rule: br.identity.sign-in
    module: src/modules/bussiness/session
  - rule: br.identity.sign-in
    module: src/modules/bussiness/account

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npx jest --config src/tests/e2e/jest.config.js identity/sign-up-sign-in

change:
  rev: 2
  kind: clarifying
  at: 2026-09-19T14:00:00.000Z
  reason: >-
    The register door enforces an input precondition the record omitted - a plausible email
    and a password of at least 8 characters, refused as REQUEST_INVALID before AccountService
    runs - and the same rule is reached through the account module on the credential check,
    not only through the session module.
