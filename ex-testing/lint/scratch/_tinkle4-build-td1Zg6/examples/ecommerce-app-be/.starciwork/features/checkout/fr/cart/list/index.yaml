schema: work/functional-requirement
id: fr.checkout.cart.list
title: Read the cart
state: todo
actors: [person]
trigger: The person with a live session asks to see their cart, over the cart query.
mainFlow:
  - The session is verified against the identity service over HTTP before the cart is read.
  - The answer is the person's own lines in product order, joined with the catalog's live price-and-stock snapshot; an empty cart answers empty lines.
exceptionFlows:
  - A call whose bearer token does not verify is refused before any cart read.
postconditions:
  - Nothing is written; the answer reflects what the cart and the catalog hold at that moment.
composes:
  - rule: br.checkout.cart
    module: src/modules/bussiness/cart

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npx jest --config src/tests/e2e/jest.config.js checkout/checkout-journey

change: {rev: 1, kind: initial, at: 2026-09-19T14:00:00.000Z}
