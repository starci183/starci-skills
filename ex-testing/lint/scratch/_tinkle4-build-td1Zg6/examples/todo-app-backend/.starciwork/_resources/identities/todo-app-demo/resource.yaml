# work-layout.yaml concept 4 (_resources): the disposable demo identity uat.verify's `accounts` read
# resolves before creating a scoped test account. One sealed custody backs every UAT flow's accounts.yaml;
# accounts.yaml now carries {role, identity} refs into this resource instead of literal passwords (see the
# uatFlow shape note in work-layout.yaml).
schema: work/resource
id: identity.todo-app.demo
kind: identity
owner: todo-app-backend
revision: uat.enc@2026-09-18
disposable: true
custody:
  provider: keycloak
  # v7-3 (2026-09-19): the realm is the code's, not the project's. The imported realm file declares
  # "realm": "todo" (.starcistacks/dev/infra/compose/realm-todo.json, mounted with --import-realm),
  # app-config.service.ts defaults the token URL to /realms/todo/..., and integration.login.keycloak
  # names /realms/todo/... too. "todo-app" is this workspace's project name (workspace.yaml project),
  # which the record ids below also carry - an id segment is not a realm claim. A realm target that
  # does not exist is a silent hazard, not a loud one: see environment.todo-app.dev's probe note.
  realm: todo
  sealed: .starcistacks/dev/secrets/uat.enc
  decryptWith: age identity declared by .starcistacks/application-stacks.yaml (DEMO-ONLY, committed for
    reader round-trip, never a real recipient)
roles:
  - person
  - operator
  - owner
  - owner-at-cap
  - editor
  - viewer
  - stranger
details:
  reuse: Reuse this identity's seeded rows first; create a disposable row through the Keycloak admin API
    only for a role the sealed file has not seeded, and record it as owned/disposable in the run ledger.
