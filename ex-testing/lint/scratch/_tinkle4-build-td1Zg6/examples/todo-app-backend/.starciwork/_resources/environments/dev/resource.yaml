# work-layout.yaml concept 4 (_resources): typed custody for uat.verify's `environment` read.
# The op text (ops/uat.verify/operator.yaml, reads.environment) names the path as
# .starciwork/_resources/environments/<environment>/resource.yaml with schema work/resource@1; the
# layout's owner forbids the @N suffix on this family, so this file is authored as plain work/resource
# and the mapping note in work-layout.yaml records the discrepancy rather than silently picking one.
schema: work/resource
id: environment.todo-app.dev
kind: environment
owner: todo-app-backend
revision: application-stacks.yaml@2026-09-18
target:
  # v7-3 (2026-09-19): the compose file lives under the stack directory, not at a bare
  # infra/compose/compose.yaml - that path resolved to nothing in this repository. The real file is
  # the one whose services this environment's ports and origins come from.
  compose: .starcistacks/dev/infra/compose/compose.yaml
  origins:
    web: http://localhost:3000
    api: http://localhost:3001
    keycloak: http://localhost:8089
    postgres: postgres://localhost:5432
configuration:
  renderedFrom: .starcistacks/application-stacks.yaml
  rendered: .starcistacks/dev/environment.json
  ports:
    web: 3000
    api: 3001
    keycloak: 8089
    postgres: 5432
    redis: 6379
    minio: 9000
    prometheus: 9090
probes:
  - id: web-reachable
    method: http-get
    target: http://localhost:3000
    expect: 200
  - id: api-reachable
    method: http-get
    target: http://localhost:3001/health
    expect: 200
  - id: keycloak-realm-ready
    method: http-get
    # v7-3 (2026-09-19): the realm this probe reads is the one the stack imports. realm-todo.json
    # declares "realm": "todo" and keycloak.yaml boots it with --import-realm, so the old
    # /realms/todo-app target could never go green on a healthy stack - Keycloak answers 404 for a
    # realm that does not exist. The silent hazard is the near miss: expect 200 verifies only that
    # *some* realm answers, so the moment a realm is named by two authorities (project name here,
    # import file there) a probe that keeps passing proves readiness for the wrong one. The name now
    # comes from the import file, and custody.realm on identity.todo-app.demo says the same thing.
    target: http://localhost:8089/realms/todo
    expect: 200
allowedEffects:
  - seed prerequisite SQL rows under owner=uat-*
  # v7-3: same correction as custody.realm on identity.todo-app.demo.
  - create/delete disposable Keycloak users under the todo realm
  - delete run-owned rows by exact recorded id
  - no schema migration, no production data, no unrelated table truncation
details:
  status: supported
  runtime: docker-compose
