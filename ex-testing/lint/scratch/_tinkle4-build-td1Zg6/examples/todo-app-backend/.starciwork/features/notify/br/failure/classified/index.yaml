schema: work/business-rule
id: br.notify.failure.classified
title: A mail host outage, a bounce and an unsubscribe are three different outcomes
state: done
statements:
  - A transient failure (the mail host is unreachable) retries up to a bounded number of attempts and
    is not reported as an error while attempts remain.
  - A permanent bounce (the address is rejected by the provider) is terminal and does not retry.
  - A recipient who unsubscribed is suppressed before an attempt is ever made, so an unsubscribe never
    shows up as a delivery failure at all.
  - Retries exhausted on a transient failure is recorded as its own outcome, not silently merged into a
    bounce and not silently dropped.
authorityRefs:
  - "owner-intent: An operator paging on 'delivery error' should not be woken by an unsubscribe, and
    should not be told an outage is the same problem as a bad address."
acceptance:
  - id: ac.notify.failure.classified.retries-transient
    given: A dispatched delivery that fails with a transient reason
    when: It is retried within the retry budget
    then:
      - The delivery returns to queued with failureClass transient, not bounced.
      - A later dispatch from that state can still reach delivered.
      - Exhausting the retry budget lands on bounced with failureClass retries-exhausted, a value
        distinct from a real bounce.
  - id: ac.notify.failure.classified.suppresses-bounced-address
    given: A dispatched delivery that the provider permanently rejects
    when: The rejection is recorded
    then:
      - The delivery reaches bounced with failureClass permanent-bounce.
      - It does not retry.
  - id: ac.notify.failure.classified.suppresses-unsubscribed
    given: A recipient who unsubscribed from the channel
    when: An event for them is enqueued
    then:
      - The delivery reaches suppressed with failureClass unsubscribed before any dispatch attempt.
      - No delivery attempt is ever made against the transport.
module: src/modules/bussiness/notify
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "DeliveryService (src/modules/bussiness/notify/delivery.service.ts) classifies NotifySmtpPort's two thrown exceptions (NotifySmtpTransientFailureException, NotifySmtpPermanentRejectionException) plus the recipient's own unsubscribed flag into the three outcomes this rule names, with a bounded RETRY_BUDGET. Proven by delivery.service.spec.ts's three ac cases (retries-transient, suppresses-bounced-address, suppresses-unsubscribed) against FakeNotifySmtpClient, and exercised live by scripts/live-proof-notify.sh, which observes a real dispatch attempt (attempt incremented) against the configured but unreachable dev SMTP host. gap.notify.unbuilt-module's blocker is resolved; module updated from the retired src/notify/delivery prototype path. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.notify.failure.classified#<former-ac-id>. Encoding change only, no semantic change."}
