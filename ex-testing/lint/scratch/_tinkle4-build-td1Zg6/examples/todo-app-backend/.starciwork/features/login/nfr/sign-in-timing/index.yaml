schema: work/non-functional-requirement
id: nfr.login.sign-in-timing
title: A refusal does not leak through timing
quality: security
state: done
observableCriterion: An unknown email and a wrong password produce the identical refusal - same status,
  same body - because both are answered by the same single Keycloak round-trip, not by two different code
  paths whose durations could be told apart.
measurement:
  how: The parity test in src/app.boot.spec.ts drives both shapes through the real HTTP route and asserts
    identical status and body. There is no separate timing-difference budget to measure, because
    sign-in.use-case.ts never branches on which half was wrong before calling Keycloak once. An unknown
    email and a wrong password both fall through to the same keycloakClient.signIn() call and the same
    KeycloakInvalidCredentialsException-to-InvalidCredentialsException translation, so whichever half is
    wrong takes the same code path and the same one round-trip.
  threshold: identical response (status and body) for both refusal shapes
  environment: test (jest, against the FakeKeycloakClient boundary)
refs: [br.login.password.sign-in]
change:
  rev: 2
  kind: breaking
  at: 2026-09-18T07:35:00.000Z
  withdraws: ["The refusal for an unknown email and for a wrong password differ by less than 10 ms at the 95th percentile over 1000 attempts.",
    "node scripts/load/sign-in-timing.mjs with 1000 attempts of each shape"]
  reason: rev 1 measured a timing delta with a load-test script that was never written (scripts/load/sign-in-timing.mjs does not exist in this repository). The real design does not need a statistical
    timing budget at all - whichever half of the pair is wrong, the code takes the identical single
    Keycloak round-trip, so there is no separate code path whose timing could differ in the first place.
    The observable criterion moves from "the timing gap is small" to "there is no gap to measure, by
    construction", proven by the parity test already in src/app.boot.spec.ts.
requiresProof:
  measurement:
    required: true
