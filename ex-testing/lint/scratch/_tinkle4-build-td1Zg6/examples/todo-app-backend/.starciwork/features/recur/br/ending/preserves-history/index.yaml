schema: work/business-rule
id: br.recur.ending.preserves-history
title: Ending a rule does not delete what it already made
state: done
statements:
  - Ending a rule stops it from generating any occurrence dated after the day it ended.
  - No occurrence the rule already materialised is deleted. Each one already completed or skipped stays
    exactly as it is; each one still materialised becomes orphaned instead.
authorityRefs:
  - "product-intent: a person's completed history must not depend on whether they later stopped the rule that produced it."
acceptance:
  - id: ac.recur.ending.preserves-history.ended-rule-keeps-past-occurrences
    given: A weekday rule with one completed occurrence (2026-09-14) and one still-materialised
      occurrence (2026-09-15)
    when: The owner ends the rule effective 2026-09-15
    then:
      - The 2026-09-14 occurrence's status stays completed; it is not touched.
      - The 2026-09-15 occurrence's status becomes orphaned.
      - No row for either occurrence is deleted.
      - The generator produces no occurrence dated after 2026-09-15 for this rule on any later run.
module: src/modules/bussiness/recur
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "impl.recur.todo-app-backend.engine now exists: module corrected from the stale pre-migration path src/recur/occurrence to the real module root src/modules/bussiness/recur (OccurrenceService.orphanEndedOccurrences), and the gap.recur.unbuilt-module blockedBy edge is removed since that gap is now closed by this feature's implementation. ac.recur.ending.preserves-history.ended-rule-keeps-past-occurrences passes at src/modules/bussiness/recur/end-recurrence.handler.spec.ts. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.recur.ending.preserves-history#<former-ac-id>. Encoding change only, no semantic change."}
