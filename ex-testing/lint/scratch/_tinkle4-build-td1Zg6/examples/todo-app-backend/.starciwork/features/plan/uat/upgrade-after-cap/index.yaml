schema: work/uat-flow
id: uat.plan.upgrade-after-cap
title: Hit the cap, get refused, upgrade, create past it
state: inprogress
entry: /plan/usage
actor: owner-at-cap
accounts: accounts.yaml
environment: environment.todo-app.dev
fixtures: [fixture.todo-app.seed]
steps:
    - {order: 1, actor: owner-at-cap, action: "Sign in as an owner already at 20 active tasks.", expected: "the usage screen shows the at-cap state", checks: []}
    - {order: 2, actor: owner-at-cap, action: "Attempt to create a 21st task.", expected: "the create is refused, naming the cap and the upgrade path", checks: [{id: errorFeedback, expected: yes}, {id: validation, expected: yes}]}
    - {order: 3, actor: owner-at-cap, action: "Start checkout for the paid plan and complete it at the gateway sandbox.", expected: "the gateway acknowledges the payment", checks: [{id: loading, expected: yes}]}
    - {order: 4, actor: owner-at-cap, action: "Return to the app once the gateway acknowledges.", expected: "the usage screen shows no cap", checks: [{id: completion, expected: yes}]}
    - {order: 5, actor: owner-at-cap, action: "Create the 21st task.", expected: "it appears in the list", checks: [{id: completion, expected: yes}]}
effects:
  - "seed 20 active task rows for the owner"
  - "authorized paid AI/gateway sandbox checkout call"
cleanup:
  - "delete the 21 run-owned task rows by recorded id"
  - "revert the plan to free through the gateway sandbox test API"
blockedBy:
  - {record: fr.plan.upgrade, because: "Steps 3-5 (checkout completes at the gateway, the cap lifts, the 21st task lands) stay pending with this fr: the owner directive forbids simulating the signed webhook, and the app's own upgradePlan call carries SePay's real refusal - HTTP 404, no credential configured (gap.plan.sepay-not-reachable) - so the gateway leg cannot be walked at all."}
  - {record: gap.plan.live-proof, because: "uat.verify has now run this flow (runs/20260919T143402Z-5c10a673) and it settles fail, not pass: the cap half is proven live but the run records ux.plan.create-refusal-feedback observed no (the task screen renders no refusal feedback for the refused create) and both gateway-leg assertions not-run. The gap names both absences."}
change:
  rev: 4
  kind: clarifying
  at: 2026-09-19T14:40:00.000Z
  reason: "v9-3 implemented the spec and ran it against the live shared stack. The run proves the cap half: the seeded owner reaches activeCount 20 through the app's own createTask, the usage screen shows at-cap naming the cap with the upgrade action, and the 21st create is refused on the wire as PLAN_CAP_EXCEEDED naming cap and /plan/usage with nothing written. What remains open is the gateway leg (no webhook simulation per the owner directive; SePay's create-intent answers 404 without a real credential) and the observed no-feedback create surface on /tasks. Partially proven - inprogress, not done."
