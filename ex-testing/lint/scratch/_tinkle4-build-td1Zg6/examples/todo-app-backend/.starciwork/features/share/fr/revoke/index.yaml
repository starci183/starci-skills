schema: work/functional-requirement
id: fr.share.revoke
title: Revoke a collaborator
state: done
actors: [owner]
trigger: The owner revokes a pending or accepted invitation on their own task.
mainFlow:
  - The owner names one collaborator on their own task.
  - The invitation becomes revoked.
exceptionFlows:
  - Revoking an already expired or already revoked invitation is refused.
postconditions:
  - The collaborator's next read of the task finds their access gone, with no sweep in between.
composes:
  - {rule: br.share.revoke.on-read, module: src/modules/bussiness/share}

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T16:00:00.000Z
  reason: br.share.revoke.on-read is done; RevokeCollaboratorHandler dispatches to
    InvitationService.revoke, proven by revoke-collaborator.handler.spec.ts, invitation.service.spec.ts
    (both exceptionFlows) and scripts/live-proof-share.sh's revoke steps against the real GraphQL
    endpoint. requiresProof.uat.required is not yet satisfied by a recorded uat.verify walk - see the
    same gap.share.live-proof note on fr.share.invite's own change entry.
