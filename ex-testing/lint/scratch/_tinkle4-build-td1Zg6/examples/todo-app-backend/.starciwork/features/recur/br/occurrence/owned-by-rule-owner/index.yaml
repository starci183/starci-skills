schema: work/business-rule
id: br.recur.occurrence.owned-by-rule-owner
title: An occurrence belongs to the rule's owner
state: done
statements:
  - Every occurrence a rule materialises carries the owner of that rule, bound at materialisation and
    never rewritten.
  - Only that owner may complete or skip the occurrence; anyone else's attempt is refused and the
    occurrence is unchanged.
acceptance:
  - id: ac.recur.occurrence.owned-by-rule-owner.refuses-non-owner
    given: A materialised occurrence of a rule owned by p1
    when: p2 attempts to complete or skip it
    then:
      - The attempt is refused, naming "not the owner".
      - The occurrence's status, complete and completedAt are unchanged.
module: src/modules/bussiness/recur
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "impl.recur.todo-app-backend.engine now exists: module corrected from the stale pre-migration path src/recur/occurrence to the real module root src/modules/bussiness/recur (OccurrenceService's ownership guard), and the gap.recur.unbuilt-module blockedBy edge is removed since that gap is now closed by this feature's implementation. ac.recur.occurrence.owned-by-rule-owner.refuses-non-owner passes at src/modules/bussiness/recur/occurrence.service.spec.ts, complete-occurrence.handler.spec.ts and skip-occurrence.handler.spec.ts. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.recur.occurrence.owned-by-rule-owner#<former-ac-id>. Encoding change only, no semantic change."}
