schema: work/functional-requirement
id: fr.recur.make-recurring
title: Make a task recurring
state: todo
actors: [owner]
trigger: The owner turns an existing task, or a new one, into a recurring rule.
mainFlow:
  - The owner picks a frequency (every weekday, every N days, or a day of the month), a time of day and
    a time zone, defaulting to their own.
  - The rule is created, owned by the submitter, and its first occurrence is previewed.
exceptionFlows:
  - A day-of-month rule naming a day that does not exist every month (e.g. the 31st) is accepted; nothing
    is refused at creation, per decision.recur.impossible-date.
postconditions:
  - Exactly one recurrence rule exists for that submission, and it exists whether or not the day it names
    exists in the current month.
composes:
  - {rule: br.recur.impossible-date.skips, module: src/modules/bussiness/recur}
  - {rule: br.recur.timezone.owner-local-time, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real, unit-tested (composes' both rules pass) and this flow's own backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's makeRecurring/upcomingOccurrences steps). What remains unmet is this record's own uat.required and e2e proof: uat.recur.make-recurring has no runs/ folder yet (gap.recur.live-proof, not mine to close - ui/uat records are out of this lane's scope) and requiresProof.e2e, whose command now names the real spec (src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts walks makeRecurring -> occurrences against the assembled stack) but has no passing run captured as evidence here yet."}
change: {rev: 2, kind: editorial, at: 2026-09-19T00:00:00.000Z, reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern 'recur/make-recurring' matched no file under src/tests/e2e; recurrence-lifecycle.e2e-spec.ts is the spec that walks make recurring -> occurrences -> edit -> end against the assembled stack. Rev 1's module-path correction stands."}
