schema: work/ui-screen
id: ui.notify.preferences
title: The notification preferences screen
state: done
brand:
  rev: 3
refs:
  - fr.notify.unsubscribe
ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The notification preferences screen. The representative state is
    refused.
  surfaces:
    - name: preferences
      route: /notify/preferences
      purpose: control digest and unsubscribe settings
      actors:
        - owner
  states:
    - name: loading
      trigger: first paint, preferences not yet fetched
      behavior: the toggle renders in a disabled/skeleton state, no message shown
    - name: subscribed
      trigger: the owner currently receives the digest
      behavior: the toggle is on, save is available
    - name: unsubscribed
      trigger: the owner has unsubscribed
      behavior: the toggle is off; a non-danger message confirms the change on the next successful save
    - name: saving
      trigger: save clicked, response pending
      behavior: the save Button is disabled and shows a busy label
    - name: refused
      trigger: save fails, for example a stale link
      behavior: "a Text(live: assertive) appears above the toggle; the toggle keeps its pre-save value"
  coverage:
    scale: bounded
    representativeScreens:
      - preferences
