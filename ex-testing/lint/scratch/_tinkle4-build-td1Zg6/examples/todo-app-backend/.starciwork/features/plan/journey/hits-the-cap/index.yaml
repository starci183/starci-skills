schema: work/customer-journey
id: journey.plan.hits-the-cap
title: A free person fills up their list and pays to keep going
state: todo
crossesFeatures: [task, plan]
steps:
  - {actor: person, does: "Creates twenty tasks one at a time, expects: Each appears, same as always."}
  - {actor: person, does: "Tries to create a twenty-first, expects: A refusal that says why and how to fix it."}
  - {actor: person, does: "Upgrades from that refusal and the gateway acknowledges, expects: A short checkout, then a confirmation."}
  - {actor: person, does: "Creates the twenty-first task, expects: It appears; the usage screen shows no cap."}
requirements: [fr.task.create, fr.plan.upgrade, fr.plan.usage.view]

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

change:
  rev: 3
  kind: clarifying
  at: 2026-09-19T14:45:00.000Z
  reason: "v9-3's uat.plan.upgrade-after-cap run walked this journey's first two steps live (cap
    reached, 21st refused); the blockedBy because texts claiming 'has not run' are corrected. The
    upgrade/checkout steps remain unproven and the edges stay."
  withdraws:
    - "its required live uat proof has not run (gap.plan.live-proof)."

blockedBy:
  - {record: fr.plan.upgrade, because: "fr.plan.upgrade is todo: the usage screen and upgrade action exist and the cap half was walked live (run 20260919T143402Z), but the live SePay leg is unproven and cannot be simulated per the owner directive (gap.plan.live-proof)."}
  - {record: fr.plan.usage.view, because: "fr.plan.usage.view is todo: the usage screen exists, is render-proven, and its at-cap state was observed live in run 20260919T143402Z - but that run settles fail, not pass, so the required live uat proof stays open (gap.plan.live-proof)."}
