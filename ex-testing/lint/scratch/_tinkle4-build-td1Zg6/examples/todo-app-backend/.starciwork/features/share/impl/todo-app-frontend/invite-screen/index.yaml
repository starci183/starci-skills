    direction and uat.share.invite-and-collaborate both name /tasks/:taskId/share, and the
    frontend canon's route -> feature -> block -> hooks layering (FE_* checks in
    cli/main.mjs architecture + scripts/check-scoped-lint.mjs, both green) requires the
    feature/block/hooks homes, so the served route is /tasks/<id>/share.
    Rendered proof: the 10 PNG+HTML captures in ./assets were captured from this worktree's own
    `next start` production build at localhost:3010 driving the live backend at :3001; the only
    harness seam is a Playwright route that rewrites Access-Control-Allow-Origin for the 3010
