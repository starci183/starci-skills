schema: work/business-rule
id: br.plan.downgrade.freeze
title: A downgrade is accepted immediately and freezes creation if it leaves the person over the cap
state: done
statements:
  - A downgrade from a paid plan to free takes effect the moment it is requested; it is never refused for
    being over the new cap.
  - No task is deleted, archived, or otherwise touched by a downgrade.
  - While the active count is over the free cap, task creation is refused exactly as ac.plan.caps.limit
    refuses an at-cap create, until the count is at or under 20 again by the owner completing or deleting.
authorityRefs:
  - "decision.plan.downgrade.policy chose accept-and-freeze over refusing the downgrade or trimming data."
acceptance:
  - id: ac.plan.downgrade.freeze.over-cap-blocks-create
    given: A paid person with 40 active tasks who downgrades to free
    when: They then try to create one more task
    then:
      - The downgrade itself already happened; the subscription is free.
      - The create is refused, naming the same over-the-cap reason an at-cap create would.
  - id: ac.plan.downgrade.freeze.existing-tasks-untouched
    given: A paid person with 40 active tasks
    when: They downgrade to free
    then:
      - All 40 tasks still exist, unowned change, uncompleted change, untouched.
      - Only the subscription row changes.
module: src/modules/bussiness/plan
change:
  rev: 3
  kind: editorial
  at: 2026-09-19T15:59:33.966Z
  reason: SubscriptionService.tDowngrade (accept-and-freeze) always accepts and never touches a task row;
    PlanCapGuardPolicy then refuses the next create from whatever count the owner is actually at. Proven
    by subscription.service.spec.ts and cap-guard.policy.spec.ts's own
    ac.plan.downgrade.freeze.* cases.
    rev 3 (v11 ac-collapse) - acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.plan.downgrade.freeze#<former-ac-id>. Encoding change only, no semantic change.
refs: [decision.plan.downgrade.policy, br.plan.caps.limit]
