schema: work/uat-flow
id: uat.notify.digest-and-unsubscribe
title: Two events settle into one digest, then an unsubscribe silences the next one
state: inprogress
entry: /notify/preferences
actor: owner
accounts: accounts.yaml
environment: environment.todo-app.dev
fixtures: [fixture.todo-app.seed]
steps:
    - {order: 1, actor: owner, action: "Sign in as the owner.", expected: "the preferences screen is reachable", checks: []}
    - {order: 2, actor: owner, action: "Trigger two notify-worthy events for the owner inside one digest window.", expected: "both events are recorded for the window", checks: []}
    - {order: 3, actor: owner, action: "Read the owner's inbox.", expected: "exactly one message covers both events", checks: [{id: completion, expected: yes}]}
    - {order: 4, actor: owner, action: "Unsubscribe from email in the preferences screen.", expected: "the preference is saved as unsubscribed", checks: [{id: completion, expected: yes}]}
    - {order: 5, actor: owner, action: "Trigger a third notify-worthy event.", expected: "the event is recorded", checks: []}
    - {order: 6, actor: owner, action: "Confirm no new message arrives for it.", expected: "the inbox is unchanged since step 3", checks: []}
effects:
  - "trigger three notify-worthy product events for the seeded owner"
  - "save one preference change"
cleanup:
  - "restore the preference to its pre-run value; delete any disposable message rows created for this run"
proves: [fr.notify.digest, fr.notify.unsubscribe, br.notify.digest.window, br.notify.unsubscribe.honored]
blockedBy:
  - {record: fr.notify.on-new-device, because: "Answered by the v9-2 walk: steps 2 and 5's \"notify-worthy events\" were produced by real task completions (fr.notify.on-completion, done) driven through the app's own UI - an honest trigger mechanism the record's steps deliberately leave unnamed. fr.notify.on-new-device staying todo narrows which mechanisms exist, but does not block this flow's evidence: nothing in the steps requires the new-device mechanism specifically."}
  - {record: gap.notify.live-proof, because: "uat.verify has now run this flow (settling run runs/20260919T144517Z-5c10a673, Outcome: partial-pass, real screens + video + verified cleanup). Every product-leg assertion is yes; the single not-run leg is inbox arrival - the product has no in-app inbox and this stack has no reachable SMTP host (integration.notify.smtp / gap.notify.smtp-host-unreachable), so steps 3 and 6's 'read the owner's inbox' has no honest surface to read. The record stays inprogress under the owner directive that external-provider legs are never faked."}
change: {rev: 3, kind: clarifying, at: 2026-09-19T14:48:32.000Z, reason: "v9-2 implemented the spec (it was a test.skip stub) and ran it against the live shared stack; the settling run 20260919T144517Z-5c10a673 walks all seven steps with screens, video and read-back-verified cleanup, settling partial-pass. Proven yes via the stack's own Postgres (the product exposes no notifications query): both task completions share one digest_group_id, the window flushes once into a single dispatched batch rendering both task names, the preferences unsubscribe persists through the real GraphQL mutation, and the third event's delivery attempt is born suppressed (failure_class=unsubscribed, attempt=0). Steps 3/6's inbox legs stay not-run - no in-app inbox exists and no dev SMTP host is reachable - so the record is inprogress, not done, per the external-provider settlement in ex-testing/briefs/v9/_common.md."}
