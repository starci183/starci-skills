schema: work/functional-requirement
id: fr.recur.see-upcoming
title: See a rule's upcoming occurrences
state: todo
actors: [owner]
trigger: The owner opens their recurring task's schedule.
mainFlow:
  - The owner sees every occurrence already materialised (with its status) and a preview of the dates the
    rule will next fire on, computed live from the rule, not read from stored rows.
exceptionFlows:
  - An ended rule shows no upcoming preview, only its history.
postconditions:
  - Nothing shown as "upcoming" implies a row exists yet; a preview is not a promise the generator has
    already kept.
composes:
  - {rule: br.recur.impossible-date.skips, module: src/modules/bussiness/recur}
refs: [data.recur.rule, data.recur.occurrence]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved on the backend - impl.recur.todo-app-backend.engine is real and unit-tested (UpcomingOccurrencesHandler, upcoming-occurrences.handler.spec.ts, including the ended-rule-shows-no-preview exceptionFlow), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's upcomingOccurrences steps, before and after ending). The frontend schedule screen (impl.recur.todo-app-frontend.schedule) remains unbuilt and is outside this lane's scope. What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e, whose command now names the real spec (src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts reads upcoming occurrences before and after ending) but has no passing run captured as evidence here yet."}
change: {rev: 2, kind: editorial, at: 2026-09-19T00:00:00.000Z, reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern 'recur/see-upcoming' matched no file under src/tests/e2e; recurrence-lifecycle.e2e-spec.ts covers the upcoming-occurrences read. Rev 1's module-path correction stands."}
