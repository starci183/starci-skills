# naming the wrong directory. src/app/sign-in exists, but it holds only turtle-master.png/route.ts -
# the mascot bytes the rev-2 reason credits the MediaFrame with serving - not the screen. The page
# that renders this record's own four captured states is src/app/[lang]/sign-in/page.tsx (locales
# en|vi), so the route ownership is now both directories: the page and its media handler. A path
# that exists but is not the implementation is invisible to an existence check; that is the hazard.
