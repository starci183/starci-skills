observations:
  - Captures were taken against the production build served by `next start` (localhost:3199) via
    Playwright chromium; the one GraphQL sign-in call was held in flight to expose the working
    state, then answered with an UNAUTHENTICATED refusal for the refused state.
  - "Every state was captured at desktop-1280 and mobile-390 with zero horizontal page overflow and
    zero console errors; the enabled submit renders the brand primary #2F6BFF with a black label,
    and empty/refused/working carry the direction's pale-blue unavailable treatment."
  - This repository carries no coverage runner and no Sonar configuration, so those two quality
    checks are recorded as not-run, never claimed as pass.
  - The pre-direction surface (src/features/pages/sign-in, src/components/blocks/sign-in-form)
    remains on disk unmounted; it sits outside this lane's write scope and outside this record's
    owners, which now name the directories that actually render the screen.
# gap.login.direction-not-drawn closed once interface.draw ran and ui.login.sign-in reached done
# (see that record's evidence.yaml); the blockedBy edge that named it was removed at rev 1 because
# the gate refuses a blocker whose target has since reached done. rev 2 claims done: the route and
# block the owners name now render the settled direction, proven by the captures under assets/ and
# the replayable commands in evidence.yaml.
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T14:25:00.000Z
  reason: "Implemented the settled ui.login.sign-in direction: /sign-in now renders the split-screen
    auth shell through Grammar primitives (PrimaryRailLayout with collapsedOrder primary-first,
    MediaFrame over the brand turtle master's own bytes served by the turtle-master.png route
    handler, SurfaceCard/Input/Button/TextAction furniture) across all four states with the uniform
    refusal, retained email and cleared password. owners now name the directories that actually
    render the screen; the earlier feature/block paths described the pre-direction surface. Eight
    running-page captures (four states x two viewports, PNG plus rendered markup) under assets/ are
    the render proof, and evidence.yaml replays typecheck, unit, lint and build."
