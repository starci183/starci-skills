schema: work/gap
id: gap.audit.render-proof
title: The privacy captures fail the canonical render checks - impl.audit.todo-app-frontend.privacy cannot claim done
state: todo
statement: "impl.audit.todo-app-frontend.privacy keeps real captures - 12 PNG+markup pairs,
  six states across desktop-1280 and mobile-390, plus two real export downloads, taken from the
  running product per the interface.implement contract. The artifacts are real; the proof is not.
  Run through checks/render.mjs (the canon scripts/example-render-proof.mjs composes), every one of
  the 12 captures fails palette-off-brand: the PNGs carry 10-17 dominant saturated colours that match
  no brand token or scale step - chroma smearing baked into the captures themselves (they passed
  through a lossy stage before landing as PNG), so the bytes the checker reads are genuinely off
  palette even where the underlying page is on brand. And entity-list-in-card cannot run at all:
  the brand record declares identity family `common`, for which the host carries no DNA snapshot,
  so a card cannot be told from a section in the kept markup. A skip is not a pass. Until captures
  exist whose own bytes pass the checks under a family whose anatomy is resolvable, the done claim
  is unproven and the record is held at todo, blockedBy this gap. Repro:
  node scripts/example-render-proof.mjs --work examples/todo-app-backend/.starciwork --record impl.audit.todo-app-frontend.privacy"
closedBy: impl.audit.todo-app-frontend.privacy
change:
  rev: 1
  kind: initial
  at: 2026-10-12T00:00:00.000Z
  reason: "Opened by the render-proof wiring (grit item 55): the first pass of the canonical
    checks over the existing real captures surfaced both failures above, and neither can be
    closed by editing checks/*.mjs or fabricating fresh captures - the lane that owns the
    frontend has to re-capture honestly."
