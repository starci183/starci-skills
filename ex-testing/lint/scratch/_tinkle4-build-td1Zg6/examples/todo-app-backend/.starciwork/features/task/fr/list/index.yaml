schema: work/functional-requirement
id: fr.task.list
title: List my tasks
state: todo
actors: [owner]
trigger: The owner reads their task list.
mainFlow:
  - The list contains exactly the owner's tasks, each with its id, title and complete flag.
  - A counts read over the same list reports how many are open and how many complete.
exceptionFlows:
  - A read with no live session is refused; nobody else's tasks are ever listed or counted.
postconditions:
  - No row owned by another person appears in the list or moves the counts.
composes:
  - {rule: br.task.list.owned, module: src/modules/bussiness/task}
refs: [decision.task.list.scope, contract.task.list-for-dashboard]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/task/task-lifecycle.e2e-spec.ts
  uat:
    required: true

change: {rev: 1, kind: initial, at: 2026-09-19T00:00:00.000Z}

# The read had handlers but no record (v6-3 Q1): the listTasks and taskCounts queries
# (src/features/todo/graphql/queries/task/{list-tasks,task-counts}) resolve the session actor and
# dispatch to ListTasksHandler/TaskCountsHandler (src/modules/bussiness/task), both reading through
# TaskService.listOwnedBy - so the counts the dashboard contract describes are the same owned read, and
# both doors refuse a dead session with SESSION_NOT_FOUND before any row is touched. The compose is a
# single rule because the code enforces a single rule here: listOwnedBy is the only source on both read
# paths, which is br.task.list.owned verbatim.
#
# ac children are not authored: the one checkable consequence is already named -
# ac.task.list.owned.excludes-others is the named test in list-tasks.handler.spec.ts, and the
# stranger-invisibility half runs e2e in src/tests/e2e/task/task-isolation.e2e-spec.ts beside the
# lifecycle spec the e2e command names. requiresProof.uat stays required: the only task uat flow,
# uat.task.create (done - runs/20260919T112844Z-5c10a673), walks "the task list loads" as its landing
# step, but whether that settles this requirement's uat proof is the kernel's derivation, not a claim
# this record may author.
