schema: work/policy-decision
id: decision.notify.digest-window
title: What "quiet window" means and when a digest flushes
state: done
outcome: decided
question: The product is asked for a per-person quiet window and a digest so several events become one
  message. Are those the same window, and when does the batch actually go out?
options:
  - id: separate-dnd-and-batch-window
    summary: A quiet window (do-not-disturb hours, e.g. 22:00-07:00) suppresses send timing only; a
      separate fixed batch window (e.g. every 10 minutes) always groups events regardless of time of day.
    consequence: Two independent concepts, two independent configurations, and a message that is both
      delayed by quiet hours and grouped by the batch window - correct but needs a scheduler for the
      quiet-hours case this feature does not build.
  - id: one-rolling-window-per-channel
    summary: One window per person per channel. It opens on the first admitted event and closes
      windowMs later; every event admitted before close joins the group; the group becomes one message
      at close. There is no separate do-not-disturb clock.
    consequence: Simple, and it is what "so several events become one message" literally asks for. It
      does not model calendar-time quiet hours (e.g. never before 7am); that is future scope, not
      claimed here.
recommendation: one-rolling-window-per-channel
recommendationReason: The brief's own wording - "a per-person quiet window and a digest, so several
  events become one message" - describes one mechanism, not two. Building the calendar do-not-disturb
  clock without a caller that needs it would be unproven scope with no test behind it.
chosen: one-rolling-window-per-channel
defaultWindow: 10 minutes, configurable per pipeline instance via windowMs
