outcome: partial-pass
assertions:
  - id: ux.notify.preferences.reachable
    expected: yes
    observed: yes
    note: The signed-in owner reached /notify/preferences and the screen settled into a real state (not
      loading, not refused) - the record's step-1 expectation.
  - id: br.notify.digest.window
    expected: yes
    observed: yes
    note: Both task completions landed as notify_notifications rows sharing one digest_group_id
      (d1f12ffe-7c3e-441a-9871-cb5b19e6bd98) - the second event joined the still-open window the
      first one opened. Read back from the stack's own Postgres because the product exposes no
      notifications query.
  - id: fr.notify.digest
    expected: yes
    observed: yes
    note: 'The shared window (d1f12ffe-7c3e-441a-9871-cb5b19e6bd98) flushed once after its 1-minute
      close and the real scheduler dispatched both members as ONE batch
      (DeliveryService.dispatchBatch renders a single message per flushed group - "2 updates" naming
      both tasks). Read back from Postgres: one window, one flush, one batch.'
  - id: ux.notify.inbox-arrival
    expected: yes
    observed: not-run
    note: "The record's step 3 asks to read the owner's inbox and see the one message. The product's
      only inbox is the person's external email mailbox: no in-app inbox UI exists and this stack
      has no reachable SMTP host (integration.notify.smtp / gap.notify.smtp-host-unreachable), so
      the rendered message was dispatched, refused transiently by the transport, and never arrived
      anywhere a walk could read. Per the owner directive, external-provider legs are never faked;
      this leg stays unproven."
  - id: fr.notify.unsubscribe
    expected: yes
    observed: yes
    note: "The preferences screen's \"Unsubscribe from email\" action settled the screen on
      unsubscribed, and a correctly-headed notificationPreferences read-back returns unsubscribed:
      true - the preference is saved, not merely displayed."
  - id: br.notify.unsubscribe.honored
    expected: yes
    observed: yes
    note: The third event was recorded (its notify_notifications row exists) but its delivery attempt
      was created already suppressed with failure_class=unsubscribed and attempt=0 - no dispatch was
      ever made, so no message could have arrived. That is the provable form of the record's step 6
      ("no new message arrives") given that no reachable inbox exists.
