schema: work/functional-requirement
id: fr.audit.log.read
title: Read the log
state: done
actors: [operator]
trigger: An authorized operator asks to see recent activity, optionally filtered by action or target.
mainFlow:
  - The operator's authorization is checked.
  - Matching lines are returned, each resolved through readLine so a tombstoned line reads as
    tombstoned rather than throwing.
exceptionFlows:
  - An unauthorized reader is refused before any line is touched.
postconditions:
  - No response ever includes a sealed actor blob or a keyId a reader could use to correlate lines
    across an erasure.
composes:
  - {rule: br.audit.append-only, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/audit/export-and-log.e2e-spec.ts
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-19T00:00:00.000Z
  reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern
    'audit/log-read' matched no file under src/tests/e2e; export-and-log.e2e-spec.ts is the spec that
    reads auditLog and exportMyData against the assembled stack. Rev 2's clarifying content stands;
