schema: work/functional-requirement
id: fr.notify.on-new-device
title: Notify a person when their session signs in from a new device
state: todo
actors: [person]
trigger: A sign-in creates a session that single-device semantics would end a prior live session for.
mainFlow:
  - The new sign-in is admitted as an event with a stable id, the person as recipient, and kind
    new-device.
  - It joins the person's open digest window for the email channel.
exceptionFlows:
  - The person unsubscribed from email; the event is suppressed.
postconditions:
  - Within the person's digest window after the new sign-in, one message names that a new device signed
    in, unless suppressed.
composes:
  - {rule: br.notify.delivery.once, module: src/modules/bussiness/notify}
  - {rule: br.notify.digest.window, module: src/modules/bussiness/notify}
refs: [contract.notify.new-device-signal]
subscribes: [event.login.new-device-signin]

blockedBy:
  - {record: gap.notify.new-device-event, because: "login exposes no device field on a session today; this record stays todo until event.login.new-device-signin is actually raised, which subscribes now names as the trigger instead of overloading contract.notify.new-device-signal for it."}

change: {rev: 1, kind: clarifying, at: 2026-09-19T12:00:00.000Z, reason: "Dropped the conflictsWith edge on br.login.session.single-device: misuse on two counts - it described an absence (no device field exists), not a contradiction, and its claim that decision.login.session.devices 'is still open' has been false since that decision was decided single-device. The real absence is already named by the blockedBy edge on gap.notify.new-device-event below, which in turn roots at gap.login.device-field through event.login.new-device-signin."}
