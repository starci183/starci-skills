schema: work/business-rule
id: br.login.session.restores
title: A session survives a browser restart
state: done
statements:
  - A signed-in person who returns within thirty days is still signed in.
  - A session that has expired is refused without an error the person must understand.
acceptance:
  - id: ac.login.session.restores.returning-within-the-window-stays-signed-in
    given: A person signed in yesterday
    when: They open the product again
    then:
      - They are signed in without typing a password.
module: [src/modules/bussiness/session]
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.login.session.restores#<former-ac-id>. Encoding change only, no semantic change."}
