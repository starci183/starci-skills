schema: work/customer-journey
id: journey.notify.told-about-completion
title: A person closes their laptop and later learns their task was handled
state: todo
crossesFeatures: [task, notify]
steps:
  - {actor: owner, does: "Completes a task and closes the browser, expects: nothing further from them is required."}
  - {actor: owner, does: "Some time later, checks email, expects: a message naming the completed task, not a raw log line."}
  - {actor: owner, does: "Had unsubscribed last week, expects: no message at all, and no sense that something went wrong."}
requirements: [fr.task.complete, fr.notify.on-completion, fr.notify.digest, fr.notify.unsubscribe]

change: {rev: 2, kind: clarifying, at: 2026-09-19T12:00:00.000Z, reason: "The because text below still described fr.task.complete's edge list as it was before the rev-3/rev-4 cleanups - br.task.complete.once's edge was dropped when that rule went done and gap.task.collaborator-completion is closed, so the real remaining chain is fr.task.complete -> br.task.single-owner -> gap.task.single-owner-editor-arm. Text corrected; the edge itself is unchanged."}
blockedBy:
  - {record: fr.task.complete, because: "The first step (\"completes a task\") is fr.task.complete, which is itself todo - blockedBy br.task.single-owner rev 4, which is in turn held by gap.task.single-owner-editor-arm (no captured run exercises the rule's accepted-editor arm). The notify half of this journey (fr.notify.on-completion, fr.notify.digest, fr.notify.unsubscribe) is done and live-proven (scripts/live-proof-notify.sh), but a journey crossing task and notify cannot be walked while either half is still todo."}
