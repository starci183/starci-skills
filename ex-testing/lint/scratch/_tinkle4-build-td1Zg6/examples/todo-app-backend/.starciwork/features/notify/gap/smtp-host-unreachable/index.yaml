schema: work/gap
id: gap.notify.smtp-host-unreachable
title: No dev SMTP host is declared or reachable for a live send
state: todo
statement: NotifySmtpClient (src/modules/integrations/notify-smtp/notify-smtp.client.ts) is a real SMTP
  client - it really opens a TCP socket and speaks EHLO/MAIL FROM/RCPT TO/DATA - but no compose
  component, port or dev host for an SMTP server exists in application-stacks.yaml at this commit,
  matching integration.notify.smtp's own `sandbox` note. A probe from the notify lane's worktree against
  the configured default (SMTP_HOST=localhost, SMTP_PORT=1025) refuses the connection, so
  scripts/live-proof-notify.sh observes a real dispatch attempt (t-dispatch, attempt incremented) that
  then fails transiently for exactly that reason - the classification (br.notify.failure.classified) is
  proven, but no message has ever actually reached a real inbox. Adding a dev SMTP host to
  application-stacks.yaml would mean touching the shared stacks file every lane's compose stack reads,
  which the common brief asks lanes not to do for infrastructure only one feature needs.
closedBy: integration.notify.smtp
change: {rev: 1, kind: initial, at: 2026-09-18T12:00:00.000Z}
