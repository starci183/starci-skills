schema: work/gap
id: gap.login.device-field
title: No device field exists on a session or person
state: todo
statement: sds.login.session-store's stateMachine and data.login.person's fields carry no device identity.
  session.mjs's accept()/actorOf() take no device argument. decision.login.session.devices is now decided
  (single-device), so the question of how many devices a session model allows is settled, but no
  implementation has yet added the field the decision needs to be carried out against - there is still no
  deviceId anything downstream could honestly be given.
