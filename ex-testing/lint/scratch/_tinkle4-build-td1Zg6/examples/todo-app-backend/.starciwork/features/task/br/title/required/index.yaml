schema: work/business-rule
id: br.task.title.required
title: A task without a title does not exist
state: done
statements:
  - A task is created only with a non-empty title, trimmed of surrounding whitespace.
acceptance:
  - id: ac.task.title.required.refuses-empty
    given: A creation request
    when: Its title is empty or only whitespace
    then:
      - Creation is refused.
      - Nothing is written.
module: src/modules/bussiness/task
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.task.title.required#<former-ac-id>. Encoding change only, no semantic change."}
