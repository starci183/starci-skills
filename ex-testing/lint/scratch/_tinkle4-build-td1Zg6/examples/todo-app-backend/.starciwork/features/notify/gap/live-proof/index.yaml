schema: work/gap
id: gap.notify.live-proof
title: uat.notify.digest-and-unsubscribe's inbox-arrival leg is unproven - no in-app inbox, no reachable SMTP host
state: todo
statement: >-
  uat.notify.digest-and-unsubscribe now has a real implemented spec and a real run folder
  (runs/20260919T144517Z-5c10a673) with screens, video and an honest partial-pass result.md - but it
  cannot reach pass today. The record's steps 3 and 6 ask the walker to read the owner's inbox, see one
  digest message covering both events, then confirm nothing new arrives after unsubscribe. The product's
  only inbox is the person's external email mailbox: no in-app notifications surface exists, and this
  stack has no reachable SMTP host (integration.notify.smtp / gap.notify.smtp-host-unreachable - the
  configured default localhost:1025 refuses connections). The run's dispatch went out for real and was
  refused transiently by the transport, so a message arriving has no honest surface to observe and per
  the owner directive the leg is never faked. What IS proven live: two real task completions share one
  digest_group_id, the window flushes once into a single dispatched batch rendering both task names,
  unsubscribe persists through the real GraphQL mutation, and the third event's delivery attempt is born
  suppressed (failure_class=unsubscribed, attempt=0). The spec's read-backs go to the stack's own
  Postgres because the product exposes no notifications query.
closedBy: uat.notify.digest-and-unsubscribe
change: {rev: 3, kind: clarifying, at: 2026-09-19T14:48:32.000Z, reason: "v9-2 implemented the stub spec and ran it; the open blocker narrows from 'never executed' to exactly the inbox-arrival leg, whose two absences (no in-app inbox surface, no reachable dev SMTP host) are owned by integration.notify.smtp / gap.notify.smtp-host-unreachable."}
