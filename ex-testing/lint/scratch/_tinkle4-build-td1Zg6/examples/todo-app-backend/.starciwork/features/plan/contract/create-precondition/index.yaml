schema: work/contract
id: contract.plan.create-precondition
title: What task creation must ask the plan before it writes
state: done
between:
  provider: plan
  consumer: task
owner: plan
surface:
  - name: checkCanCreateTask
    shape: "TaskCreationPolicy.assertMayCreate(principal, input) -> Promise<void>, throwing PlanCapExceededException to refuse"
    guarantee: allowed is false (the call throws) only when the person's effective plan (read through
      sds.plan.subscription-lifecycle's t-revert-on-read) has no room for one more active task
      (br.plan.caps.limit, counted by br.plan.active-scope). A refusal names the cap and the upgrade
      path; it never explains by omission.
    stability: Adding metadata to the thrown exception is additive; changing when it throws, or throwing a
      type that is not an AbstractException, is breaking.
guarantees:
  - The check reads live state at call time; it is never cached across a create.
consumerObligations:
  - The task create path calls the registered policy before writing and honors a refusal by refusing the
    create and propagating its reason and upgrade path unchanged.
refs: [br.plan.caps.limit, sds.plan.cap-guard]

requiresProof:
  provider: {required: true}
  consumer: {required: true}

change:
  rev: 3
  kind: clarifying
  at: 2026-09-19T12:00:00.000Z
  reason: "Dropped the conflictsWith on fr.task.create: the edges lane corrected that record's flow to
    state the cap refusal this contract's consumerObligations always described (and the code always
    enforced - rev 2's create-precondition.contract.spec.ts proof), so the two records no longer
    describe incompatible realities. No decision record was authored - there was no open policy
    question, only a lagging fr. Rev 2's reason stands: both sides proven together by
    create-precondition.contract.spec.ts, the surface corrected to the throw-based
    TaskCreationPolicy.assertMayCreate the pre-existing seam actually exposes."

blockedBy: []

# The consumer obligation is proven against the real CreateTaskHandler/TaskCreationPolicyRegistry
# classes, and fr.task.create's own record now states the same reality - its exceptionFlows carry the
# plan-cap refusal and its composes name br.plan.caps.limit. The conflictsWith edge that recorded the
# old disagreement is dropped with the rev-3 change above; sds.plan.cap-guard's appliesTo:
# [fr.task.create] stays true and is untouched.
