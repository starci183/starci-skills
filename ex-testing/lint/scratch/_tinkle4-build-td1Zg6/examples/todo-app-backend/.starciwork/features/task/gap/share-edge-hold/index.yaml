schema: work/gap
id: gap.task.share-edge-hold
title: br.task.single-owner's done flag is held by an out-of-lane blocker edge
state: todo
statement: >-
  When br.task.single-owner flips to done, every blockedBy edge pinned to it refuses its holder at
  once - a blocker edge on a done record is stale by rule. contract.share.completion-guard-for-task
  (features/share/**, owned by the share lane) cites it at rev 4, so the flip cannot land cleanly
  until that pinned edge is retired or re-pinned in a file the task lane may not write. The rule's own
  flip is additionally gated on real re-proof, named by gap.task.single-owner-editor-arm; this gap
  names only the edge-retirement half of the sequencing.
verificationSource: authored-claim
because: >-
  Verifiable by reading the gate's blockedBy-staleness rule against the contract's pinned edge: the
  moment br.task.single-owner reaches done at rev 4 or later, the contract's cite is stale and the
  contract is refused until the edge moves. The rev-1 statement's premise is corrected - the rule's
  evidence is stale, not fresh, so the flip is not merely a mechanical edge away; and its tail claim
  is corrected too: the chains that dead-ended at the rule now terminate at
  gap.task.single-owner-editor-arm, not here.
closedBy: [contract.share.completion-guard-for-task]
change: {rev: 2, kind: clarifying, at: 2026-09-19T12:00:00.000Z, reason: "Rev 1 was written while the rule's evidence was fresh; it has since gone stale over the missing accepted-editor arm, so 'the flip is held by a mechanical edge, not by missing evidence' no longer holds - the missing evidence is now named by gap.task.single-owner-editor-arm. What remains true is the narrower fact this record now states: flipping the rule refuses the contract's pinned edge until the share side moves it."}
