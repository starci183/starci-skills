schema: work/functional-requirement
id: fr.task.reopen
title: Reopen a completed task
state: todo
actors: [owner]
trigger: The owner reopens a task they previously completed.
mainFlow:
  - The owner names a task they own that is currently complete.
  - The task reads incomplete again and its completion timestamp is cleared.
exceptionFlows:
  - A task the actor does not own is refused.
composes:
  - {rule: br.task.complete.once, module: src/modules/bussiness/task}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/task/task-lifecycle.e2e-spec.ts
  uat:
    required: true

