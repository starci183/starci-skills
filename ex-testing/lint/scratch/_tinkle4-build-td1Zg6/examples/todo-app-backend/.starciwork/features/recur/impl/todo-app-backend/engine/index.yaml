# owners corrected from the stale pre-migration file paths (src/recur/rule.service.ts etc, none of which
# ever existed) to the real module root and its two GraphQL feature directories, matching this codebase's
# own owners-names-directories convention (schemas/work-layout.yaml). Two new entities (RuleEntity,
# OccurrenceEntity) and one migration were added under the already-shared
# src/modules/platform/databases/postgresql/primary module - that module's own ownership stays recorded
# once, on impl.task.todo-app-backend.platform-database, the same way it already covers TaskEntity/
# SessionEntity; this record does not re-claim it.
#
# data.recur.occurrence extends data.task.task: every occurrence's base task fields are written through
# CommandBus.execute(new CreateTaskCommand(...)) (GeneratorService), the task capability's own create
# seam, so TaskCreationPolicyRegistry and event.task.created both see every occurrence exactly like any
# other task - never a hand-rolled insert into `tasks`.
change: {rev: 2, kind: editorial, at: 2026-09-19T15:00:00.000Z, reason: "Implemented. gap.recur.unbuilt-module is closed by this record (closedBy on that gap); every br/sds this record proves is itself done, proven by real jest specs plus a live run (including a real integration.recur.scheduler tick). rev 2: live re-proof found a real defect - ruleId on EndRecurrenceInput and EditRecurrenceInput had @Field but no class-validator decorator, so the global ValidationPipe(whitelist:true) stripped it and findOneBy({id: undefined}) matched an arbitrary first-row rule; fixed with @IsString() matching every other ID input field, and the record now carries assets/live-proof.mjs, an EveryNDays n=1 live probe that exercises signIn -> makeRecurring -> real scheduler tick -> materialised occurrence -> endRecurrence orphaning on any calendar date (the checked-in script's EveryWeekday rule is calendar-gated)."}
