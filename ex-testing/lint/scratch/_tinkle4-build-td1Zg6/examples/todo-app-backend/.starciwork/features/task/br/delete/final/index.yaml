schema: work/business-rule
id: br.task.delete.final
title: A deleted task does not come back
state: done
statements:
  - Deleting a task removes it; there is no recovery path in this product.
acceptance:
  - id: ac.task.delete.final.stays-gone
    given: A task the owner deleted
    when: Any read for the task names its identifier
    then:
      - The identifier resolves to no task, now and after a restart.
module: [src/modules/bussiness/task]
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.task.delete.final#<former-ac-id>. Encoding change only, no semantic change."}
# Proven at rev 1: ac.task.delete.final.stays-gone is the named jest test in
# delete-task.handler.spec.ts - after the delete, findById rejects with TASK_NOT_FOUND and the
# owner's own list no longer contains the row - and the same sequence passes against a live API
# built from this source tree over the shared dev stack (scripts/live-proof.sh: deleteTask ->
# deleted:true, then the tasks query no longer contains the deleted task). The "and after a
# restart" half of the criterion rides on there being exactly one durable store: the delete is a
# DELETE against the shared Postgres TaskEntity table, no second cache exists on the read path,
# and that store's persistence is what impl.task.todo-app-backend.platform-database is done for.
# The tension with the audit log keeping the task's identifier in an append-only line is now
# resolved by decision.audit.deleted-task-target (chosen: history-not-resolution): "resolves to
# nothing" is scoped to task read paths - the row is gone from the only store task reads - while
# the log's target field keeps the identifier as the record of the deletion. data.audit.log-line's
# conflictsWith edge is retired accordingly and ac.task.delete.final.stays-gone's wording narrowed
# to the decided reading.
