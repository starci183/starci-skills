schema: work/business-rule
id: br.task.list.owned
title: A list shows only the reader's own tasks
state: done
statements:
  - A task list contains exactly the tasks owned by the person reading it.
acceptance:
  - id: ac.task.list.owned.excludes-others
    given: Two people each own tasks
    when: One of them reads their list
    then:
      - Every row belongs to the reader.
      - No row of the other person appears.
module: src/modules/bussiness/task
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.task.list.owned#<former-ac-id>. Encoding change only, no semantic change."}
# Proven at rev 1, unchanged: ac.task.list.owned.excludes-others is the named jest test in
