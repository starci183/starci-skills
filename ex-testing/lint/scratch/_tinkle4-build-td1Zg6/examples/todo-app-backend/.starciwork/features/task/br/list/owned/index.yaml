# boundary is proven live too - scripts/live-proof.sh's two-identity steps (demo2 creates a task;
# demo1's tasks query never contains it) pass against an API built from this source tree, and its
# no-/malformed-Authorization steps prove the GraphQL tasks query refuses a stranger outright
