schema: work/gap
id: gap.audit.operator-role
title: No operator/admin role exists to authorize reading the log
state: done
statement: "Closed by decision.audit.operator-role (decided: audit-verified-roster). The absence lived in
  the session shape - SessionService.findActive resolves an actor as a SessionRecord of
  {token, personId, issuedAt, expiresAt} (sds.login.session-store) and data.login.person has no role
  field, so no call site could present a verifiable role claim. The decision resolved it inside the
  capability that owns the read rather than by rewriting login's session contract: AuditOperatorService
  (src/modules/bussiness/audit/audit-operator.service.ts) mints the operator claim by matching the
  authenticated subject against a trusted server-side roster, and AuditLogHandler dispatches on that
  verified claim - an allowlisted subject reads the whole chain with fr.audit.log.read's action/target
  filters via audit-operator-read.ts's assertOperatorRead/isOperatorRead pair; everything else, and
  every actor while the roster is empty (the production default), reads exactly their own lines; an empty
  actor is refused before any line is touched (AuditOperatorRoleNotAuthorizedException, stable code
  AUDIT_OPERATOR_ROLE_NOT_AUTHORIZED). The read is proven behind impl.audit.todo-app-backend.operator-read
  and fr.audit.log.read's fresh evidence; Erasure stays self-service - the roster authorizes reading the
  chain, not acting as another person."
closedBy: [decision.audit.operator-role]
change:
  rev: 3
  kind: clarifying
  at: 2026-09-19T12:00:00.000Z
  reason: "decision.audit.operator-role landed as decided (audit-verified-roster), which is the record this
    gap named as its closer, so the gap is closed. A verifiable operator claim now exists and is wired end
    to end in src/modules/bussiness/audit - the operator branch is reachable, no longer a dead path - and
    the fail-closed behavior (no/unverifiable claim refuses; never a broader read) plus the whole-chain
    filtered read are proven by fresh runs bound to impl.audit.todo-app-backend.operator-read and
    fr.audit.log.read."
