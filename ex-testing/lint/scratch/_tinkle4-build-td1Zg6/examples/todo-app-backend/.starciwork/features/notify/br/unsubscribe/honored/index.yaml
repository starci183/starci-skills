schema: work/business-rule
id: br.notify.unsubscribe.honored
title: An unsubscribed person receives nothing on that channel
state: done
statements:
  - Unsubscribing from a channel is per person and per channel, and takes effect for every event
    enqueued after it, immediately.
  - Suppression by unsubscribe is not an error outcome; it is the requested outcome.
acceptance:
  - id: ac.notify.unsubscribe.honored.suppresses-future-sends
    given: A person who has unsubscribed from a channel
    when: An event that would otherwise notify them on that channel is enqueued
    then:
      - The resulting delivery is suppressed, not queued and not sent.
      - Re-subscribing lets a later event reach the digest window again.
module: src/modules/bussiness/notify
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "PreferencesService (src/modules/bussiness/notify/preferences.service.ts) upserts by the (personId, channel) pair and NotifyService.admit reads it on every admission before a notification ever joins a digest window, so an unsubscribe takes effect immediately for every event enqueued afterward. Proven by preferences.service.spec.ts's ac.notify.unsubscribe.honored.suppresses-future-sends case, notify.service.spec.ts's end-to-end suppress-then-resubscribe case, and scripts/live-proof-notify.sh (real unsubscribe mutation, then a real task completion lands suppressed with failureClass unsubscribed and attempt 0). gap.notify.unbuilt-module's blocker is resolved; module updated from the retired src/notify/preferences prototype path. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.notify.unsubscribe.honored#<former-ac-id>. Encoding change only, no semantic change."}
