schema: work/business-rule
id: br.recur.timezone.owner-local-time
title: An occurrence's due instant follows the owner's clock, not a fixed offset
state: done
statements:
  - A rule stores an IANA time zone and a local time of day. An occurrence's due instant is resolved from
    that local time and zone at generation time, never from a UTC offset fixed once at rule creation.
  - Two owners with the same rule (same local time of day) in different zones are not due at the same
    instant, and the same owner's rule is not even due at the same instant on every day of the year if
    their zone observes daylight saving time.
  - "A local time that a DST transition made ambiguous (occurs twice, on the fold) always resolves to its
    earlier instant. A local time a DST transition made impossible (does not occur, in the gap) resolves to
    the nominal time shifted forward by the size of the gap."
authorityRefs:
  - "decision.recur.timezone.anchor: the owner's wall clock, not a stored offset."
  - "decision.recur.timezone.dst: earliest-of-fold, shift-forward-by-gap."
acceptance:
  - id: ac.recur.timezone.owner-local-time.dst-spring-forward-shifts-by-gap
    given: A daily rule (Europe/Berlin, local time 02:30) whose next date is 2026-03-29, the night
      Europe/Berlin clocks jump 02:00 -> 03:00 so that 02:30 never happens
    when: The generator materialises the 2026-03-29 occurrence
    then:
      - The occurrence's dueAtUtc is exactly 2026-03-29T01:30:00.000Z (03:30 CEST local:
          the nominal 02:30 shifted forward by the one-hour gap), not 2026-03-29T00:30:00.000Z (03:00
          CEST, the transition instant itself) and not any instant that formats to 02:30 local, which
          does not exist.
  - id: ac.recur.timezone.owner-local-time.dst-fall-back-picks-earliest
    given: A daily rule (America/New_York, local time 01:30) whose next date is 2024-11-03, the night
      America/New_York clocks fall 02:00 -> 01:00 so that 01:30 happens twice
    when: The generator materialises the 2024-11-03 occurrence
    then:
      - The occurrence's dueAtUtc is exactly 2024-11-03T05:30:00.000Z (01:30 EDT, the earlier of the two
        real instants that both read 01:30 local), not 2024-11-03T06:30:00.000Z (01:30 EST, the later
        one).
      - Exactly one occurrence exists for windowKey <rule>:2024-11-03; the fold never produces two.
  - id: ac.recur.timezone.owner-local-time.distinct-zones-differ
    given: Two identical daily 09:00 rules, one owned by a person in Asia/Ho_Chi_Minh (no DST) and one
      by a person in Europe/Berlin (observes DST)
    when: The generator materialises both rules' occurrence for 2026-01-15 and again for 2026-07-15
    then:
      - "The Ho_Chi_Minh occurrence's dueAtUtc is 2026-01-15T02:00:00.000Z and 2026-07-15T02:00:00.000Z:
        the same UTC offset (+07:00) on both dates."
      - "The Berlin occurrence's dueAtUtc is 2026-01-15T08:00:00.000Z (CET, +01:00) and
        2026-07-15T07:00:00.000Z (CEST, +02:00): a different UTC offset between the two dates, for the
        same rule."
      - On both dates, the Ho_Chi_Minh and Berlin occurrences' dueAtUtc values differ from each other,
        even though both rules say "09:00" in their own owner's clock.
module: src/modules/bussiness/recur
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "impl.recur.todo-app-backend.engine now exists: module corrected from the stale pre-migration path src/recur/zone to the real module root src/modules/bussiness/recur (zone.util.ts's resolveLocalTimeToUtc), and the gap.recur.unbuilt-module blockedBy edge is removed since that gap is now closed by this feature's implementation. All three acceptance criteria pass at src/modules/bussiness/recur/zone.util.spec.ts against the pinned spring-forward (2026-03-29T01:30:00.000Z) and fall-back (2024-11-03T05:30:00.000Z) instants. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.recur.timezone.owner-local-time#<former-ac-id>. Encoding change only, no semantic change."}
