# Run-owned ephemeral stack for the end-to-end suite (npm run test:e2e).
#
# The suite starts and disposes this project itself, on every run, with a project name and volume set
# unique to that run. It is derived from the declared dev stack
# (.starcistacks/dev/infra/compose/{postgres,keycloak,redis}.yaml) and reuses that stack's tracked
# inputs read-only - the seed scripts and the Keycloak realm import - so the schema and the demo
# identities the scenarios sign in with are the same bytes the dev stack ships. It does NOT reuse the
# dev stack's host ports, volumes or containers: every port here is allocated by the suite at run time
# (127.0.0.1 only) and every volume belongs to this project, so a concurrent `todo-app-dev` stack is
# never touched and never becomes the proof surface.
#
# Secrets are generated per run by the suite and passed in through the environment, so no plaintext
# credential sits in this tracked file and no decrypted dev secret materialization is needed to run
# the suite. Bind-mount sources come from E2E_BACKEND_ROOT, which E2EStackService sets to the app
# root as an absolute path - the mounts resolve correctly wherever this file sits in the tree.
# minio and prometheus are deliberately absent: the api does not read them (the two
# remaining dev-stack services it depends on are postgres, keycloak and redis), and the operator's
# stack proof covers the dependencies the slice actually needs.

name: ${E2E_COMPOSE_PROJECT}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${E2E_PG_USER}
      POSTGRES_PASSWORD: ${E2E_PG_PASSWORD}
      POSTGRES_DB: ${E2E_PG_DB}
    ports:
      - "127.0.0.1:${E2E_PG_PORT}:5432"
    volumes:
      - ${E2E_BACKEND_ROOT}/.starcistacks/dev/seeds:/docker-entrypoint-initdb.d:ro
      - todo-e2e-postgres:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${E2E_KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${E2E_KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: "8089"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${E2E_BACKEND_ROOT}/.starcistacks/dev/infra/compose/realm-todo.json:/opt/keycloak/data/import/realm-todo.json:ro
    ports:
      - "127.0.0.1:${E2E_KC_PORT}:8089"
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT}:6379"

volumes:
  todo-e2e-postgres: {}
