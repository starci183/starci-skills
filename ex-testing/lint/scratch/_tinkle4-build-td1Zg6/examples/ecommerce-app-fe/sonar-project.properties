sonar.projectKey=starci-ecommerce-app-fe
sonar.projectName=StarCi Ecommerce App FE
sonar.host.url=https://sonar.starci.org
sonar.sourceEncoding=UTF-8

# The vitest harness runs once at this root (`npm run test:coverage`) and writes
# coverage/lcov.info here, so the report path and the analysed tree stay in one place.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.e2e-spec.*,**/dist/**,**/coverage/**,**/.next/**
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/*.e2e-spec.*

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.d.ts
sonar.typescript.tsconfigPaths=tsconfig.json

# The JS/TS analyzer runs in a bridge Node process whose default heap is sized for a
# small project. Keep the heap explicit for the application source.
sonar.javascript.node.maxspace=8192
