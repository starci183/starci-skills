schema: starci/knowledge-source@1
id: ui.proof.motion
title: Motion proof
appliesTo:
  - ui
family: proof
purpose: |-
  This file answers one question: if the movement stopped, was interrupted, or was never allowed to
  run, would the reader still know everything the page was telling them?
  Motion is always supplementary. A rendered page is judged on the frame where nothing is moving, and
  on the frame where the animation was cut off halfway. Each rule below names the observation that
  would falsify it.
rules:
  - id: MOTION-1
    title: Meaning exists without movement
    governs: |-
      Governs whether any essential meaning is carried by movement alone.
    cases:
      - id: case-1
        when: Accepted work is in progress
        observe: |-
          The initiating command still shows its name, exposes busy state, and refuses a second activation in a static frame. A spinner as the only sign that work exists falsifies it
      - id: case-2
        when: A state changed
        observe: |-
          A persistent carrier holds it: stable copy, native state, a controlled value, geometry, or a published relationship. A pulsing paint as the only selected cue falsifies it
      - id: case-3
        when: Animation is disabled entirely
        observe: |-
          The same meaning is readable. Anything that disappears with the animation was never carried
      - id: case-4
        when: Content is animating out
        observe: |-
          Once it is hidden it leaves no focus stop and no accessibility node. A hidden but still focusable exiting link falsifies it
      - id: case-5
        when: Only an animated capture exists as evidence
        observe: |-
          Nothing is closed. The static frame and the interrupted outcome are still unknown
  - id: MOTION-2
    title: Preference changes choreography, not outcome
    governs: |-
      Governs what a reduced-motion preference is allowed to change.
    cases:
      - id: case-1
        when: The system preference or the published motion mode changes
        observe: |-
          The trigger, the content, the landmark, the focus order, and the final geometry are identical before and after. Different collapsed content under the reduced path falsifies it
      - id: case-2
        when: |-
          A rail publishes `motion` as `static`, `animated`, or `reduced`
        observe: |-
          The attribute is present, but the published CSS changes animated scroll behaviour and does not implement a rail-collapse transition. Claiming choreography from the prop name alone falsifies the finding
      - id: case-3
        when: Reusable rail-collapse choreography is genuinely required
        observe: |-
          No published path provides it, so the missing capability is recorded rather than assumed
      - id: case-4
        when: Application CSS animates that collapse in the meantime
        observe: |-
          It is a tracked workaround with an owner and a removal condition, not a new contract
      - id: case-5
        when: A family supplies scoped choreography
        observe: |-
          It supplies an equivalent reduced path, ending in the same final state
  - id: MOTION-3
    title: Timing comes from the owner that published it
    governs: Governs where duration, delay, and easing are read from.
    cases:
      - id: case-1
        when: |-
          A transition runs on a published element, such as a tooltip, a whole-card response, or a decorative highlight
        observe: |-
          The computed duration, delay, and easing match the rule that actually won in the current render, not a source string or a fallback variable
      - id: case-2
        when: A family adds its own timing
        observe: |-
          It stays inside its `data-grammar-family` scope. Timing appearing in an unrelated tree falsifies the scoping
      - id: case-3
        when: The application sets a duration on published anatomy
        observe: |-
          That reaches through an owner it does not have. The application decides when state changes, never how the renderer choreographs it
      - id: case-4
        when: A published timing value was quoted from source
        observe: |-
          It is measured in the selected family before it is believed, because the selected family may have replaced it
  - id: MOTION-4
    title: Motion evidence and falsifiers
    governs: Governs what closes a motion claim.
    cases:
      - id: case-1
        when: Any reachable motion is being closed
        observe: |-
          Normal, reduced, interrupted, reversed, backgrounded and resumed, zoomed, and responsive paths are all exercised
      - id: case-2
        when: The capture is taken
        observe: |-
          Owner, trigger, prior and final state, the alternative cue, computed duration, delay and easing, animation events, focus, the accessibility tree, and the settled result are recorded together
      - id: case-3
        when: Motion is interrupted partway
        observe: |-
          It settles to a valid state. A stale intermediate state, or lost focus, falsifies it
      - id: case-4
        when: Anything flashes
        observe: |-
          It stays at or below three flashes per second. A four-flash urgency cue falsifies safety outright
      - id: case-5
        when: A family or the application adds a delta
        observe: |-
          Each layer is attributed independently, and a smooth video with no preference or interruption evidence closes nothing
  - id: MOTION-5
    title: The motion verdict
    governs: |-
      Governs how selected observations are summarized in the current `.starciwork` node's evidence.
    cases:
      - id: case-1
        when: The lens runs
        observe: |-
          `MOTION-1` to `MOTION-4` are judged on the capture pair the coverage requires: one with the reduced-motion preference unset and one with it set to reduce
      - id: case-2
        when: The verdict is computed
        observe: |-
          The gating set is the whole set: `pass` requires every criterion to pass, because movement that loses meaning once has lost it
      - id: case-3
        when: One of the two captures is missing
        observe: |-
          The verdict is `blocked`; a lens run on the ordinary capture alone has not tested the preference at all
      - id: case-4
        when: A failure has been measured
        observe: |-
          Record measured duration/easing defects separately from choreography, lost outcomes and reflow. Identify the owning value or composition without executing another op.
    notes:
      - |-
        The scored set is `MOTION-1` to `MOTION-4`; this rule only summarizes and is not itself scored.
      - |-
        Store assertions, observations and artifact references in the selected node's evidence; there is
    remark: |-
      no separate receipt table or downstream verdict-copying rule. Missing evidence never earns a pass.
doesNotDecide: |-
  Which states exist and which carrier holds each is [State](../composition/state.yaml), and which
  action owns pending is [Action](../composition/action.yaml). Whether the resting cue is distinguishable
  without colour is [Accent](../composition/accent.yaml) and [Accessibility](accessibility.yaml). Whether
  focus survives an exit is [Focus](focus.yaml), and whether the movement implies a result nobody
  confirmed is [Render truth](render-truth.yaml).
