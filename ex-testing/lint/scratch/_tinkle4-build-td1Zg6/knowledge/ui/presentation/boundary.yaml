schema: starci/knowledge-source@1
id: ui.presentation.boundary
title: Boundary presentation
appliesTo:
  - ui
family: presentation
purpose: |-
  This file answers one question: given an edge the application owns, which separator or border draws
  it, and which edge in a repeating set drops it?
  The theme publishes two hairline tokens and they mean different things: `--separator` draws the line
  between things, and `--border` draws the outline of one thing. A boundary inside a Grammar component
  is that component's, never the application's, and no application edge may be drawn with a raw colour
  value.
ownerVocabulary:
  owners:
    - name: App
      meaning: The edge belongs to the application
      applicationWrites: The class
    - name: A component name
      meaning: Common already draws this edge inside that component
      applicationWrites: Nothing. Pass the prop
    - name: —
      meaning: Common exposes no public path for this edge
      applicationWrites: The class, recorded as a workaround
  notes: |-
    Each case names who owns the edge. The owner decides whether the application writes a class at all.

    Writing a class where a component is the owner is `APP_REIMPLEMENTATION`. Writing one where the owner
    is `—` stays linked to `COMMON_CAPABILITY_MISSING`. Adding an application line beside one a component
    already draws is `DOUBLE_OWNER`, and it renders as a visible double hairline.
componentOwnership:
  title: Boundaries Common already owns
  notes: |-
    Retained ownership reference, not proof of the current package/API. Verify actual installed source/props/tokens before use; correct outdated rows within selected maintenance scope using [source and maintenance](index.yaml#source-and-maintenance).
  rows:
    - component: ChatWorkspace
      element: composer
      rule: BOUNDARY-1
    - component: ChatWorkspace
      element: rail trigger boundary, hasRail, isCompactRail
      rule: BOUNDARY-1
    - component: Divider
      element: rule
      rule: BOUNDARY-5
    - component: MediaFrame
      element: root, treatment!="plain"
      rule: BOUNDARY-5
    - component: NavigationFeatureNav
      element: root
      rule: BOUNDARY-1
    - component: StaticStateRow
      element: root
      rule: BOUNDARY-3
    - component: Subnav
      element: root
      rule: BOUNDARY-1
    - component: SurfaceAccordionCard
      element: accordion row
      rule: BOUNDARY-3
    - component: SurfaceAccordionCard
      element: accordion shell, depth="nested"
      rule: BOUNDARY-5
    - component: SurfaceAccordionCard
      element: accordion shell, depth="top"
      rule: BOUNDARY-6
    - component: SurfaceCard
      element: card content, depth!="nested"
      rule: BOUNDARY-6
    - component: SurfaceCard
      element: card content, depth="nested"
      rule: BOUNDARY-5
    - component: WorkspaceShell
      element: compact navigation, hasCompactNavigation
      rule: BOUNDARY-1
    - component: WorkspaceShell
      element: leading rule, railPosition="leading"
      rule: BOUNDARY-4
topics:
