schema: starci/knowledge-source@1
id: be.imports
title: Imports
purpose: >-
  Given a backend file, what may it import, through which path, in which style, and in which order?


  Profile scope: these historical Academy forms apply where that existing profile is selected. The revised
  docs/backend-source-pattern.md and be.folder/function/typing rules take precedence for ownership and code
  shape. Counts are evidence, not requirements. Do not add obsolete forwarding classes, expose entities,
  centralize domain policy or mandate process overrides to reproduce an example. Migrate conflicting installed
  lint coherently under authority; never suppress it to claim conformance.
appliesTo:
  - backend
family: be
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - tsconfig.json (paths)
    - jest.config.ts (moduleNameMapper)
    - eslint.config.mjs
    - features/api/core/graphql/mutations/courses/add-to-cart/*
    - features/api/core/graphql/queries/courses/course/course.handler.ts
    - modules/platform/exceptions/errors/ai/ai-quota-exhausted.ts
    - modules/platform/exceptions/filters/abstract-exception-http.filter.ts
  limitations: Historical reference-source observations preserved at the extraction commit; not a fresh audit of
    current repository conformance. Counts and file totals cited in rationale or cases are provenance from
    that extraction, not claims about today. Inspect the selected repository's actual types/APIs, aliases and
    lint/test setup; verify reference conformance within approved .starciwork scope. Target legacy code does
    not override the reference. Current business requirements and architecture belong to .starciwork; code
    patterns do not approve them.
rules:
  - id: BE-IMPORTS-1
    title: Aliases
    kind: mandatory
    requirement: Use the selected project aliases or workspace package exports across owners, and explicit public
      entries rather than private deep imports. Within one owner use relative imports. Existing Academy
      aliases/relative examples are compatibility forms; deep paths in old examples do not authorize new
      public-API bypasses.
    rationale: ""
    cases:
      - id: case-1
        when: A capability
        write: import { ICQRSHandler } from "@modules/platform/cqrs/icqrs-handler"
      - id: case-2
        when: A door
        write: "@features/<door>/… (used from apps/ and tests)"
      - id: case-3
        when: Test helpers
        write: import { makeEntityManagerMock } from "@tests/mocks/entity-manager.mock"
      - id: case-4
        when: Inside one unit
        write: ./add-to-cart.command, ./graphql-types/request, ./add-to-cart.service
      - id: case-5
        when: Up the same door
        write: import { ExecuteParams } from "../../../../types/execute" — 290 files under features use this relative
          path at extraction; 0 use @features/api/core/types/execute (lint no-self-module-alias)
      - id: case-6
        when: Inside the exceptions tree
        write: import { AbstractException } from "../abstract"
    verification:
      automated:
        - no-self-module-alias
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-IMPORTS-2
    title: Brace style
    kind: mandatory
    requirement: Named braced imports are multi-line, one complete binding per line, with a trailing comma
      for nonempty bindings. Side-effect, default-only and namespace imports use their valid TypeScript
      forms without invented braces or invalid trailing commas. Prefer import type for type-only bindings;
      the selected type-import lint rule checks usage separately from layout.
    rationale: 'Lint object-curly-newline with ImportDeclaration: "always" enforces it. 1388 of 4463 files use
      import type at extraction.'
    cases:
      - id: case-1
        when: One binding
        write: |-
          import {
              Injectable,
          } from "@nestjs/common"
      - id: case-2
        when: Several
        write: |-
          import {
              CommandHandler,
              ICommandHandler,
          } from "@nestjs/cqrs"
      - id: case-3
        when: Type only
        write: |-
          import type {
              EntityManager,
          } from "typeorm"; import type {
              AbstractExceptionMetadata,
          } from "../abstract"
    verification:
      automated:
        - NEST_IMPORT_FORMAT
        - '@typescript-eslint/consistent-type-imports'
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-3
    title: Order
    kind: residual
    requirement: Import order is not lint-enforced. The dominant first import in GraphQL unit files is the Nest
      framework, then capabilities, then relative paths. Deviations exist and are recorded.
    rationale: Dominant first import in 303 of 398 sampled GraphQL files at extraction is @nestjs/*; 46 start at
      @modules; 41 at ../../../../types/execute; 7 at ./…
    cases:
      - id: case-1
        when: Framework first
        write: "@nestjs/graphql, @nestjs/common, @nestjs/cqrs"
      - id: case-2
        when: Then capabilities
        write: "@modules/api/…, @modules/integrations/…, @modules/platform/…, @modules/databases/…"
      - id: case-3
        when: Then relative
        write: ../../../../types/execute, then ./… last
      - id: case-4
        when: Deviation
        write: add-to-cart.handler.ts opens with @modules/platform/cqrs/icqrs-handler and interleaves @nestjs/common
          after several @modules imports; the order above is dominant, not universal
    verification:
      automated: []
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-4
    title: Layering direction
    kind: mandatory
    requirement: Dependencies follow apps to features to modules. Cross-owner imports use explicit public entries
      and required Nest module registrations; global registration is reserved for intentionally app-wide
      shared identity. Named connections, tenant/provider instances and request scopes remain explicit. An
      export-star barrel and a deep import into private internals are both API boundary violations. Existing
      Academy must-deep-module-import/no-folder-reexport/no-non-global-module-import rules need a coherent
      reviewed migration when adopting this profile.
    rationale: ""
    cases:
      - id: case-1
        when: Across a capability boundary
        write: Import the explicit public entry and the module that exports the required provider; do not register
          that provider a second time.
      - id: case-2
        when: Inside one owner
        write: Use local relative paths without importing the owner public barrel back into its own implementation.
    verification:
      automated:
        - BE_MODULE_IMPORTS_FEATURE
        - BE_MODULE_IMPORTS_APP
        - BE_FEATURE_IMPORTS_APP
        - ARCH_PACKAGE_EXPORT_BYPASS
      manual:
        - Review same-source public API use, exports and actual DI identity; package checks do not establish
          all local ownership boundaries.
    relatedExamples:
      - graphql-command
      - transactional-service
  - id: BE-IMPORTS-5
    title: What a GraphQL unit imports
    kind: mandatory
    requirement: Imports follow the selected execution form. A direct use case consumes plain application
      contracts and capability public APIs. A selected bus handler additionally imports its message and
      framework handler interface. A resolver imports transport DTOs plus the public use-case API. Do not copy
      the historical fixed import set, expose ORM entities or create forwarding services to satisfy an
      example.
    rationale: ""
    cases: []
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
  - id: BE-IMPORTS-6
    title: Forbidden
    kind: mandatory
    requirement: Source exports are named; a default-export exception must be a declared source-bound actual
      Jest globalSetup/globalTeardown entry. Raw environment access belongs to exact declared parser files;
      other source consumes the typed configuration API. Raw cache tokens stay inside their declared cache
      owner and aliases retain the same identity. Bind these owners in the target package's Nest boundary
      contract; the runtime script verifies them using canonical TypeScript projects. No console.* or Nest
      Logger in application source; use the selected logging owner.
    rationale: 188 files log through WinstonService at extraction; 12 residual console. sites recorded as debt.
    cases:
      - id: case-1
        when: Default export
        write: named exports; the actual normalized Jest configuration proves a lifecycle exception, not its filename
      - id: case-2
        when: process.env
        write: Academy's parser path is src/modules/platform/env/utils/parse-env.ts; other projects declare their actual parser path and typed config API
      - id: case-3
        when: console.*
        write: lint error in src/**; residual console. sites are debt, not a pattern
      - id: case-4
        when: Nest Logger
        write: not used (lint no-nest-logger, no-framework-logger)
      - id: case-5
        when: Raw cache tokens outside the cache module
        write: declare the cache owner and its exported raw tokens; the script follows renamed imports, re-exports and constant aliases
    verification:
      automated:
        - NEST_NAMED_EXPORTS
        - NEST_ENV_ACCESS
        - NEST_CACHE_TOKEN_BOUNDARY
        - no-nest-logger
        - no-framework-logger
      manual: []
    relatedExamples: []
  - id: BE-IMPORTS-7
    title: Jest sees the same aliases
    kind: mandatory
    requirement: Jest moduleNameMapper mirrors tsconfig path aliases; specs mock module paths through those aliases.
    rationale: ""
    cases:
      - id: case-1
        when: jest.config.ts
        write: 'moduleNameMapper: { "^@modules/(.*)$": "<rootDir>/src/modules/$1", "^@features/(.*)$":
          "<rootDir>/src/features/$1", "^@tests/(.*)$": "<rootDir>/src/tests/$1" }'
      - id: case-2
        when: Spec mocking a module path
        write: 'jest.mock("@modules/platform/env/config", () => ({ envConfig: () => ({ … }) }))'
    verification:
      automated: []
      manual: []
    relatedExamples:
      - graphql-command
      - transactional-service
