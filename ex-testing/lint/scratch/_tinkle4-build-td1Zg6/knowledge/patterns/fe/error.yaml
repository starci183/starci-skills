schema: starci/knowledge-source@1
id: fe.error
title: Error
purpose: |
  Given a failure in the frontend, how is it represented and where does it go?
appliesTo:
  - frontend
family: fe
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - src/components/blocks/**/component.tsx
    - blocks/commerce/CartBlock/index.spec.tsx
    - src/modules/toast/api.ts
    - src/modules/api/graphql/types.ts
    - src/hooks/swr/*
    - packages/grammar/src/common/conformance.ts
  limitations: |
    Historical reference-source observations at skill commit
    edf72554425f918e80c9205e9c6db10596e722f0; not a fresh audit. Old counts cannot claim a fresh scan.
rules:
  - id: FE-ERROR-1
    title: Failure is resolved before presentation
    kind: mandatory
    requirement: |
      A data/world owner maps transport failure into an explicit renderable state, resolves failure
      copy, and exposes only valid recovery actions. When the unit has a Base split, those values cross
      its resolved contract; otherwise the same owner/presentation boundary remains explicit in the
      one unit. Tests assert the mapping and retry eligibility.
    rationale: |
      Treating failure as renderable state keeps transport details out of presentation and makes
      recovery conditions explicit without requiring a Base twin.
    cases:
      - id: case-1
        when: "The generic case"
        write: >
          "failed" is a member of the block state union in 219 component.tsx files; the connected half
          maps SWR error to it and the pure half draws it
      - id: case-2
        when: "Several failure origins"
        write: >
          "sessionsFailed" | "historyFailed" | "streamFailed" | "quotaRejected" in StarCiAiChatState;
          const stateNeedsRetry = (state) => state === "sessionsFailed" || state === "historyFailed"
          || state === "streamFailed" || state === "quotaRejected"
      - id: case-3
        when: "Failure copy"
        write: >
          resolved by the connected half into labels.states[props.state] and drawn as an assistant
          turn: { id: `state-${props.state}`, role: "assistant", body: labels.states[props.state] }
      - id: case-4
        when: "Retry"
        write: >
          an action on on: <Button variant="primary" size="sm" onPress={props.on?.retry}>{labels.retry}</Button>
      - id: case-5
        when: "Connected spec"
        write: "asserts the mapping: mocks.cart.isLoading = true … expect(mocks.input?.blockState).toBe(\"pending\")"
    verification:
      automated:
        - FE_ERROR_WORLD_STATE_MAPPING
        - FE_WORLD_OWNER_RENDER_BOUNDARY
      manual:
        - Confirm failure copy and recovery eligibility match business policy.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-2
    title: The selected transport envelope
    kind: mandatory
    requirement: |
      When an application selects an envelope transport, it declares the envelope discriminator,
      data and failure fields and the readers that unwrap it. A reader handles transport failure
      before returning data. Valid empty data may remain null; required missing data is rejected.
      Normal business dispositions such as pending or refused remain typed data. A transport may
      instead use a throwing client; GraphQL is not required.
    rationale: |
      The selected transport policy keeps failure distinct from valid empty data without imposing
      one protocol or turning every negative business outcome into an exception.
    cases:
      - id: case-1
        when: "The selected reference GraphQL transport"
        write: >
          { success, message, error, data } selected in each document (query Course … { success message
          error data { … } }) and typed GraphQLResponse<T> in modules/api/graphql/types.ts
      - id: case-2
        when: "A read allows empty data"
        write: "handle the envelope failure first; returning result.data ?? null is then valid"
      - id: case-3
        when: "A selected write with feedback"
        write: >
          runGraphQLWithToast(action, options): Promise<boolean> — "Execute one GraphQL write and
          surface both transport and typed-envelope failures"
      - id: case-4
        when: "Localised default copy"
        write: >
          const DEFAULT_MESSAGES: ToastMessages = { successTitle: "Success", errorTitle: "Error",
          unauthorizedTitle: "Unauthorized", … } overridable per call through messages
    verification:
      automated:
        - FE_ERROR_ENVELOPE_POLICY
        - FE_WRITE_FEEDBACK_OWNER
      manual:
        - Verify business dispositions, retry eligibility, failure copy and redaction.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-3
    title: throw new Error where silence would be wrong
    kind: mandatory
    requirement: |
      throw new Error(…) marks transport failures and results the code cannot continue without.
      It does not replace typed normal business dispositions. A custom Error subclass is residual,
      not a mandatory pattern.
    rationale: |
      Hard stops prevent silent null continuation when a required payload or owner context is missing.
    cases:
      - id: case-1
        when: "Empty payload on a required read"
        write: "if (value === undefined) throw new Error(\"Course Community returned no data\")"
      - id: case-2
        when: "Mutation returned nothing"
        write: "if (result === null) throw new Error(\"Flashcard review completion returned no result\")"
      - id: case-3
        when: "Slot used outside its owner"
        write: >
          if (value === undefined) throw new Error("CourseFoundationCategoryBlock slots must be
          rendered inside CourseFoundationCategoryBlockBase")
      - id: case-4
        when: "Offline"
        write: "throw new Error(\"offline\") inside a fetcher so SWR records error"
      - id: case-5
        kind: residual
        when: "Custom class"
        write: >
          one exists: class PersonalProjectEnrollmentDeniedError extends Error in
          useQueryPersonalProjectTaskWorkspaceSwr.ts; not a pattern
    verification:
      automated:
        - FE_REQUIRED_VALUE_FAILURE
      manual:
        - Select domain-required bindings and confirm which absence modes must stop continuation.
    relatedExamples: []

  - id: FE-ERROR-4
    title: Propagation and ownership
    kind: mandatory
    requirement: |
      A selected data owner maps fetch failure to explicit UI state or propagates it through the
      installed data client contract. Writes that require feedback name one feedback owner and every
      bound use site; other writes may own local state without a toast. Uncaught render failures go
      to explicitly selected Next segment/global boundaries whose props follow the installed Next
      contract. Telemetry lives under config/instrumentation files.
    rationale: |
      Propagation stays at the layer that already owns user-visible state or process boundaries.
    cases:
      - id: case-1
        when: "Inside a hook"
        write: >
          not caught; SWR stores it and the connected half reads query.error (catch ( appears in 3
          files across src/)
      - id: case-2
        when: "Inside the reference application's selected feedback write"
        write: "runGraphQLWithToast returns false and toasts; the caller flips a local state (payment.hasFailed)"
      - id: case-3
        when: "Render crash"
        write: "src/app/global-error.tsx"
      - id: case-4
        when: "Telemetry"
        write: "src/config/sentry.ts, src/instrumentation.ts, instrumentation-client.ts"
    verification:
      automated:
        - FE_NEXT_ERROR_BOUNDARY_LOCATION
      manual:
        - Verify feedback applicability, recovery safety, copy, redaction and telemetry behavior.
    relatedExamples:
      - connected-block

  - id: FE-ERROR-5
    title: Grammar package
    kind: mandatory
    requirement: |
      Grammar throws TypeError for invalid conformance definitions at module init and for invalid
      vocabulary values in assertPresentationState.
    rationale: |
      Package-level TypeError fails fast on invalid family definitions before product composition.
    cases:
      - id: case-1
        when: "Invalid definition at module init"
        write: >
          throw new TypeError(`Invalid ${definition.familyId} Grammar conformance: missing=[…],
          unknown=[…]`) in defineGrammarRuleConformance
      - id: case-2
        when: "Invalid vocabulary value"
        write: "assertPresentationState(\"unknown\") throws TypeError (common/index.test.mjs)"
    verification:
      automated: []
      manual:
        - Verify conformance helpers against installed @starci/grammar/common exports.
    relatedExamples: []
openQuestions:
  - id: typed-error-class-for-no-data
    kind: proposal
    summary: |
      Whether a typed error class should replace throw new Error("…") for the "no data" cases: one
      custom class against 52 plain throws, so the plain form is what the code does today.
