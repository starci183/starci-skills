schema: starci/knowledge-source@1
id: coding-reference
title: Enforced coding conventions
purpose: All StarCi projects use Next.js frontend and NestJS backend with the owner Academy code patterns.
  Read architecture-rules.json before the concrete patterns. Monorepo and single-source mappings specialize
  this fixed stack; they do not permit framework substitution. Every applicable mechanical code pattern must
  be checked by executable scripts with complete rule/file coverage. Design choices and edge cases are
  reviewed by agents against the Markdown guidance and actual behavior evidence. Reference debt is corrected
  explicitly, not copied as law.
appliesTo:
  - backend
  - frontend
family: cross-cutting
provenance:
  extractionCommit: edf72554425f918e80c9205e9c6db10596e722f0
  sources:
    - starci-academy-backend
    - starci-academy-fe
  limitations: |
    Historical file counts do not prove current conformance. Reopen the extraction source when
    a case is missing, contradictory or stale, then repair that knowledge; do not answer such a
    gap with a generic consult-the-reference instruction.
  reviewedAt: 2026-09-16
rules:
  - id: REF-SCOPE-1
    title: Specification, architecture and reference evidence
    kind: mandatory
    requirement: Current accepted Business/SRS and Architecture/SDS define product behavior and target boundaries.
      The adopted portable pattern defines responsibility/dependency constraints; framework topics define
      concrete code forms. Academy observations and primary framework documentation inform those decisions but
      do not override them or invent product requirements.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
  - id: REF-SCOPE-2
    title: Select the smallest applicable pattern
    kind: mandatory
    requirement: Before implementation select the actual framework profile and installed APIs, map its
      roots/owners, and apply relevant pattern rules. Do not instantiate CQRS, saga, outbox, fencing, a
      dynamic module or a DTO layer merely because it appears in an example. Add a mechanism only for a real
      boundary/invariant and its verification obligation.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
  - id: REF-SCOPE-3
    title: Review boundaries before writing
    kind: mandatory
    requirement: Before the first production unit identify its owner, public contract, dependencies,
      data/transaction identity and applicable code form in the existing brief/result. Recheck after
      refactoring. A renamed facade or empty wrapper does not establish a useful boundary. Do not create
      another Plan or checklist solely for this review.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
  - id: REF-SCOPE-4
    title: No accidental waivers or inherited boilerplate
    kind: mandatory
    requirement: Applicable adopted rules must hold before acceptance. Legacy source and passing tests do not
      waive them. Historical examples cannot override a revised rule or force obsolete boilerplate. A real
      incompatibility requires an explicit scoped design/lint correction under current authority; do not
      silently suppress the rule or rewrite unrelated product design.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
  - id: REF-BE-1
    title: Named persistence and transaction identity
    kind: mandatory
    requirement: In the Academy TypeORM profile, database-owning code uses the correct named EntityManager
      decorator. Every operation in a transaction uses its transaction-scoped manager. Other explicitly
      selected persistence profiles must preserve connection, tenant and atomicity semantics. A real
      persistence port may isolate a boundary; a public Store.manager escape hatch does not. Existing profile
      lint requiring named managers must be migrated coherently before changing its source pattern.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
    relatedExamples:
      - graphql-command
      - transactional-service
    verification:
      automated: []
      manual:
        - Verify named connection/provider token, transaction callback use and applicable installed lint.
  - id: REF-BE-2
    title: One use case behind protocol adapters
    kind: mandatory
    requirement: "Follow docs/backend-source-pattern.md: protocol DTO/controller/resolver at transport, plain
      contract/use case at application, reusable capabilities in modules. Direct use cases are the default;
      bus handlers are selected for actual dispatch semantics. Forwarding services, ICQRSHandler and
      configurable module-definition files are not mandatory for every feature. Existing typed public APIs
      remain intact until an authorized migration."
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
    relatedExamples:
      - graphql-command
    verification:
      automated: []
      manual:
        - Review contract boundaries and boot actual DI/bus registration when selected.
  - id: REF-VERIFY-1
    title: Lint integrity and uncovered conventions
    kind: mandatory
    requirement: Run executable checks for every applicable code-pattern rule and every selected production file.
      Missing checkers, unavailable tooling, ignored files, disabled required rules or unsupported required
      syntax block code-pattern conformance; an agent review cannot replace that check. Semantic design
      patterns and edge cases are agent-reviewed using the applicable Markdown guide and real behavior
      evidence. Record code coverage, design findings and limitations separately without a new ceremonial
      checklist.
    rationale: |
      Lint success is integrity of reported results, not full structural or semantic conformance.
    verification:
      automated:
        - scripts/checks/check-scoped-lint.mjs
      manual:
        - Audit disabled rules, unused directives, TypeScript directives and structural omissions.
  - id: REF-VERIFY-2
    title: No conformance by bypass
    kind: mandatory
    requirement: |
      Never obtain conformance by adding lint/TypeScript suppressions, lowering required rule
      severity, expanding ignores, relocating source into test/generated lanes, replacing types
      with any/casts, aliasing forbidden dependencies or renaming a forbidden facade. Verify the
      exact changed production files were included in the real checks. Existing suppressions and
      tool blind spots are not permission to bypass a rule. A legitimate tool defect requires a
      narrow reviewed correction with regression coverage; it is not a clean product result until
      the underlying convention is independently verified.
    rationale: |
      Bypass techniques manufacture a pass without satisfying the convention.
  - id: REF-FE-1
    title: Frontend visual and data ownership
    kind: mandatory
    requirement: Frontend follows the owner Academy composition/code patterns and adopted Next.js responsibility
      graph using verified installed Grammar exports. The current referenced public entry is
      @starci/grammar/common. Never invent component APIs or substitute another design-system pattern to
      bypass a code rule. Check mechanical obligations by scripts and review design/edge cases separately.
    rationale: Explicit responsibility and a verified framework profile prevent both inconsistent architecture and
      needless generated layers.
    relatedExamples:
      - connected-block
    verification:
      manual:
        - Verify installed Grammar exports before using component names or props.
  - id: REF-LANG-1
    title: English knowledge; separate behavior proof
    kind: mandatory
    requirement: |
      Maintain knowledge in English only. User-facing communication may use the configured
      language. Verify behavior and coding-reference conformance separately.
    rationale: |
      Knowledge mirrors and mixed proof channels obscure the mandatory English rule set and
      conflate product behavior with convention checks.
