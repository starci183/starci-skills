gaps:
  - components:
      - "SurfaceCard"
      - "SurfaceListCard"
      - "SurfaceAccordionCard"
    missing: |
      no typed heading level and no labelled-by-external-heading capability, so a surface whose
      correct level is not 3 has no owner
    evidence:
      - "packages/grammar/src/core/primitive/Label/index.tsx"
      - "packages/grammar/src/core/branch/SurfaceCard/index.tsx"
  - components:
      - "Common overlay owner"
    missing: |
      Common publishes no general overlay or elevation prop
    evidence:
      - "packages/grammar/src/core/branch/Tooltip/index.tsx"
      - "packages/grammar/src/common/styles.css"
  - components:
      - "Badge"
    missing: |
      `Badge` accepts absent `children` and renders a non-breaking space, so a glyph-only chip is
      representable and word presence is not enforced by the type
    evidence:
      - "packages/grammar/src/core/primitive/Badge/index.tsx"
  - components:
      - "Tabs"
    missing: |
      `leading` is an optional `ReactNode`, not a typed `Icon`, so nothing forces a glyph or its
      `usage` on each peer
    evidence:
      - "packages/grammar/src/core/branch/Tabs/index.tsx"
  - components:
      - "Button"
      - "TextAction"
    missing: |
      neither action publishes a motion anchor or attribute for its adornment, so a family has nothing
      to animate beyond `data-component`
    evidence:
      - "packages/grammar/src/core/primitive/Button/index.tsx"
      - "packages/grammar/src/core/primitive/TextAction/index.tsx"
  - components:
      - "Icon"
    missing: |
      `Icon` has no direction-aware mirroring contract; the app's registry chooses the literal glyph
    evidence:
      - "packages/grammar/src/core/primitive/Icon/index.tsx"
  - components:
      - "IconButton"
    missing: |
      `isActive` emits `data-active="true"` only, with no `aria-pressed`, so an active utility is
      visual-only
    evidence:
      - "packages/grammar/src/core/primitive/IconButton/index.tsx"
  - components:
      - "Tooltip"
    missing: |
      `aria-describedby` is placed on the tooltip's wrapper `span`, not on the focusable control, so
      the description is not programmatically attached to the button
    evidence:
      - "packages/grammar/src/core/branch/Tooltip/index.tsx"
  - components:
      - "Icon"
    missing: |
      `Icon` accepts only `source`; there is no fallback or error contract, so a missing registry
      mapping must be resolved by the app before render
    evidence:
      - "packages/grammar/src/core/primitive/Icon/index.tsx"
  - components:
      - "MediaFrame"
    missing: |
      no `object-position` or focal prop, and `className` reaches the figure rather than the viewport
      child, so a required off-centre crop has no owner
    evidence:
      - "packages/grammar/src/core/primitive/MediaFrame/index.tsx"
      - "packages/grammar/src/common/styles.css"
  - components:
      - "MediaFrame"
    missing: |
      `MediaFrame` publishes no loading or error prop and renders no state
    evidence:
      - "packages/grammar/src/core/primitive/MediaFrame/index.tsx"
  - components:
      - "OtpInput"
    missing: |
      `OtpInput` publishes `disabled` and `invalid` (not the `isDisabled`/`isError` names) and no
      skeleton input, so its unresolved state has no owner
    evidence:
      - "packages/grammar/src/core/OtpInput.tsx"
  - components:
      - "OtpInput"
    missing: |
      `OtpInput` publishes no `label`, `hint`, or `errorMessage` slot; only `describedBy` links
      outside text, so its visible identity has no Common owner
    evidence:
      - "packages/grammar/src/core/OtpInput.tsx"
