$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/execution-receipt.schema.json
title: StarCi workflow execution receipt
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, status, operations]
properties:
  apiVersion: {const: starci.execution/v1}
  kind: {const: WorkflowReceipt}
  metadata:
    type: object
    additionalProperties: false
    required: [workflowId, project]
    properties:
      workflowId: {type: string, minLength: 1}
      project: {type: string, minLength: 1}
  status: {enum: [pending, running, completed, failed, blocked]}
  operations:
    type: array
    items: {$ref: "#/$defs/operationReceipt"}
$defs:
  nullableModel:
    type: [string, "null"]
    minLength: 1
  operationReceipt:
    type: object
    additionalProperties: false
    required: [operationId, operation, status, environment, profile, requestedModel, observedModel, observations]
    properties:
      operationId: {type: string, minLength: 1}
      operation: {type: string, minLength: 1}
      status: {enum: [pending, selected, unavailable, completed, failed, blocked]}
      environment: {type: [string, "null"], minLength: 1}
      profile: {type: [string, "null"], minLength: 1}
      requestedModel: {$ref: "#/$defs/nullableModel"}
      observedModel: {$ref: "#/$defs/nullableModel"}
      observations:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [environment, profile, status, requestedModel, observedModel]
          properties:
            environment: {type: string, minLength: 1}
            profile: {type: string, minLength: 1}
            status: {enum: [ready, unavailable, failed]}
            requestedModel: {$ref: "#/$defs/nullableModel"}
            observedModel: {$ref: "#/$defs/nullableModel"}
