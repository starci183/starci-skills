$schema: https://json-schema.org/draft/2020-12/schema
title: Work workflow goal
type: object
required:
  - schema
  - id
  - workflow
  - requestId
  - originalRequest
  - finalOutcome
  - scope
  - criteria
  - businessChanges
  - impacts
  - resourceEffects
  - cells
  - workTargets
properties:
  schema:
    const: starci/goal@1
  id:
    type: string
    minLength: 1
  workflow:
    type: string
    minLength: 1
  requestId:
    type: string
    minLength: 1
  originalRequest:
    type: string
    minLength: 1
  finalOutcome:
    type: string
    minLength: 1
  scope:
    type: object
    required:
      - business
      - paths
      - resources
      - exclusions
    properties:
      business:
        type: array
        items:
          type: string
      paths:
        type: array
        items:
          type: string
      resources:
        type: array
        items:
          type: string
      exclusions:
        type: array
        items:
          type: string
  criteria:
    type: array
    minItems: 1
    items:
      type: string
  businessChanges:
    type: array
    minItems: 1
    items:
      type: string
  impacts:
    type: array
    items:
      type: object
      required:
        - repository
        - service
        - path
        - status
        - startLine
        - endLine
        - change
        - businessReason
      properties:
        repository:
          type: string
        service:
          type: string
        path:
          type: string
        status:
          enum:
            - new
            - existing
        startLine:
          type:
            - integer
            - "null"
        endLine:
          type:
            - integer
            - "null"
        anchor:
          type: string
        sourceHash:
          type: string
        change:
          type: string
        businessReason:
          type: string
  resourceEffects:
    type: array
    items:
      type: object
      required:
        - target
        - operation
        - postcondition
  cells:
    type: array
    minItems: 1
    maxItems: 9
    items:
      type: object
      required:
        - id
        - op
        - purpose
        - finalOutput
        - criteria
        - inputs
        - outputSchema
  workTargets:
    type: array
    items:
      type: string
  inputs:
    type: object
