schema: starci/layout@3
entry: SKILL.md
build:
  command: node scripts/ensure-build.mjs
  output: .dist
  format: json
  onMissingOrStale: build-immediately
  onFailure: stop
folders:
  init: Host AGENTS.md and CLAUDE.md bootstrap templates; never routed-source scaffolding
  skills: Companion skills a host discovers beside the entry (workflow chat, Orca stubs); routing stays in SKILL.md
  ops: Operator JSON and authority
  workflows: Matrices, contracts and runtime gates
  model: Declared data the runtime runs on - record kinds, operation kinds, lanes, routes, hosts, runtimes, the operator registry and the provider profiles; no code
  kernel: The workflow control loop, one file per concern - the graph, the record catalog, the goal, the intake, the reconciliation, the owner loop, the ledger and its sync, contracts, scheduling, guards, terminals and the status view
  hosts: The host model as data and the adapters the kernel launches operations through, behind one call surface
  models: The model functions the runtime calls with a typed form - assess, critique, plan, decide and validate - and their headless providers
  upgrades: What an operator of an installed runtime must know and run after each version, one note per version
  providers: Provider capabilities, full API inventories, adapters, recipes and fail-closed validation
  knowledge: Lazy-loaded JSON guidance
  contracts: Validation code
  core: Work validation runtime
  schemas: JSON schemas (workflow-state.schema.yaml documents the durable engine record; ledger-db.schema.yaml documents the runtime.sqlite/machine.sqlite table catalog of docs/ledger-db.md)
  specifications: Business and architecture contracts
  cli: Inspection commands
  scripts: Build tooling; scripts/checks/ owns verification and scripts/route/ owns selection
  tests: Regression checks
  docs: Generated V3 JSON documentation
  sites: V3 sites generated from catalogs
limits:
  rows: 3
  parallel: 3
  secondaryPerCaller: 3
counts:
  skills: 1
  publicWorkflows: 16
  operators: 21
gates: workflows/gates.json
work:
  format: yaml-1.2
  schema: schemas/work.schema.json
  node: index.yaml
  approval: goal-before-effects-and-result-before-done
  checklist: <business>/<item>/**/index.yaml
  evidence: <business>/<item>/evidence/<id>/manifest.yaml
  workflowState: <backend>/.starciwork/_local/plans/<plan-id>/{index.yaml,goal/index.yaml,approval/index.yaml,run/index.yaml}
  layout: schemas/work-layout.json
executionModes:
  default: planned
  explicitFlash: workflows/flash.json
  providerCatalog: providers/catalog.json
