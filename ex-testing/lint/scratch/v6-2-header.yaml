observations:
  - id: common-supplies-no-colour
    observation: |
      The Common layer assigns 12 custom properties: the five `--grammar-*` rhythm values on
      `.grammar-common-root` and seven derived structural properties (band geometry, the workspace
      tracks, the highlight angle, the verdict edge). It assigns no colour. `src/common/styles.spec.ts`
      enforces that by asserting the sheet does not contain `--starci-core-accent: #7547ff`, so this is
      owned direction, not an oversight of this version.
  - id: the-rhythm-does-not-meet-the-anatomy
    observation: |
      `src/common/styles.css` reads no `--grammar-*` name anywhere. Its rules read the
      `--starci-core-*` namespace with literal fallbacks (`var(--starci-core-region-gap, 1.5rem)`), and
      the aliasing that lets the published scale reach anatomy is done by a family sheet
      (`src/core/styles.css:34` assigns `--starci-core-inline-gap: var(--grammar-inline-gap)`). A page
      that imports `@starci/grammar/common/styles.css` alone therefore sets `--grammar-region-gap` on
      its root and changes no rendered gap.
  - id: card-surface-canon
    observation: |
      Of the three `*Card` renderers, the classes that name a card surface itself — this is what
      `checks/render.mjs` `cardClassesOf` keeps (a `starci-core-*` name ending in `-surface` or
      `-surface-card` after the `--modifier` is stripped) — are `starci-core-surface`,
      `starci-core-surface-card`, `starci-core-frameless-surface` and `starci-core-form-surface`. The
      last is applied beside `starci-core-surface-card` on the same element (`measure: form`), so it
      marks a card, never a region inside one. `SurfaceListCard` contributes only
      `starci-core-surface`; `starci-core-surface-content`, `-label`, `-fact` and `-footer` are regions
      inside a card and are listed beside their component without being card hooks.
  - id: family-selection-is-a-string
    observation: |
      `COMMON_GRAMMAR_COMPONENTS` is a frozen map of the same 42 components the barrel exports, and
      `defineGrammarFamily` merges a family's `replacements` and `extensions` over it — rejecting an
      extension that collides with a Common name and a replacement for an unknown name. What it cannot
      reject is a root that carries no family attribute at all, which is the shape a consumer page is in
      when it imports Common's sheet and stops there.
  - id: vendor-anatomy-underneath
    observation: |
      Each renderer builds on a HeroUI part (`Card.Header`, `Drawer.Trigger`, `Accordion.Heading`,
      `Typography` for Heading) and the vendor's own class names appear on the same elements as the
      grammar's. Where a grammar rule must win over the vendor's `components` layer, the Common sheet
      re-states the box in its own `@layer` with `!important` rather than relying on a consumer's
      Tailwind scan — the debt `src/shipped-geometry.spec.ts` and `src/common/styles.spec.ts` refuse.
  - id: two-class-hooks-carry-no-rule
    observation: |
      133 of the 135 grammar classes the renderers emit have at least one selector in a shipped sheet.
      The two that do not are `starci-core-rank-artwork`, which no sheet mentions, and
      `starci-core-surface-card--fill`, whose fill form is drawn instead by
      `.starci-core-surface-card[data-grammar-surface-height="fill"]` — the component writes both the
      class and that attribute, so only one of the two is a paint hook.
guidance:
  - id: common-is-not-a-family
    requirement: |
      Do not read this snapshot as a visual family's palette. A brand bound to `identity.family: common`
      is bound to the semantic entry; the colour it must supply comes from the family sheet it installs
      on the Common root, or from the host's own tokens.
    rationale: |
      Common's own sheet assigns no colour, so a colour claim checked only against this table would pass
      while the page stayed unpainted.
  - id: read-the-line
    requirement: |
      Treat `source`/`uses`/`value` as pointers to re-open, not as a substitute for opening. A row whose
      line no longer carries that name is evidence the snapshot is stale, not evidence about the package.
    rationale: |
      Every row was measured at one commit; the package moves faster than the canon.
  - id: gaps-are-findings
    requirement: |
      A recorded gap is a finding at the captured commit, not a live inventory and not authority to edit
      the library. Extending the package needs separately authorized scope and operation.
    rationale: |
      Knowledge snapshots describe; they do not license a change to the thing they describe.
