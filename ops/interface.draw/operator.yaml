id: interface.draw
goal:
  en: Produce and inspect one business-grounded visual direction by default; create multiple
    alternatives only when the user explicitly requests a comparison or choice.
nodeKinds:
  - ui
completionProfile: ui
sideEffects:
  - requested local/generated design assets
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap: report it and propose a separately selected scope op; do not
        create a target or invent its acceptance/graph here."
  - id: business
    path: .starciwork/<business>/business/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
        inputs in the selected .starciwork graph. Intent governs expected behavior; source is not a
        replacement. Do not invent a mandatory BA predecessor for a scope that does not require one;
        a needed missing input is a reported graph/scope gap, not a new dependency silently added
        here.
  - id: design
    path: N/index.yaml + N/assets/*
    purpose:
      en: Read exact brand/source assets, surface anatomy, current design system, imagery
        rights/provenance and accepted references; consult available image/design skill when used.
  - id: workflow
    path: selected workflow request + workflows/contracts.json + this op authority.json
    purpose:
      en: When selected inside the named workflow, read the exact request, strict response contract and
        primary/secondary authority JSON. Standalone op execution does not invent a workflow
        request.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: architecture
    path: .starciwork/<business>/architecture/**/index.yaml
    purpose:
      en: Read data ownership, operations/API/events, boundaries, code-scope and rationale declared by the
        selected .starciwork graph; distinguish proposed paths from observed files. No universal
        architecture-first op chain is implied; report genuinely missing required scope before
        proceeding.
  - id: knowledge
    path: knowledge/INDEX.json + applicable UI composition/presentation and actual installed family
      topics
    purpose:
      en: "Before drawing, read applicable composition, presentation and family knowledge together with
        the resolved package described by the grammar input. Neither knowledge snapshots nor npm
        source alone is sufficient for a Grammar-bound design: knowledge explains
        composition/ownership; the actual package and active family determine available anatomy and
        styling. Accepted appearance cannot invent API behavior, bypass security or contradict
        business."
  - id: grammar
    path: consuming app manifest/lockfile + resolved component package exports/types/renderers/CSS + app
      family root/style imports
    purpose:
      en: Resolve the UI package from the actual consuming app/importer, honoring workspace aliases and
        bundler resolution; do not assume a monorepo-root node_modules copy is the same version.
        Record package identity, version, resolved path and inspected file hashes/anchors. Inspect
        public exports, prop types, renderer anatomy and shipped CSS, then the app's active family
        root, imported styles and overrides. Trace each used semantic token to the
        selector/variable/fallback the renderer actually consumes; a similarly named family variable
        is not proof it is wired. Common component imports do not imply the Core palette or family.
        No install, upgrade or package edit is authorized by inspection. For a genuinely unbound
        greenfield design, record not applicable/proposed; unavailable required package or family
        remains an explicit gap, never a fabricated npm match.
  - id: matrix
    path: selected complete-job matrix request + workflows/jobs.json
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: profiles/registry.json + selected runtime execution profile + actual host tools/model
    purpose:
      en: Select the actual host runtime codex or claude and this operator role from the V2-derived active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority. Do not revive V2 dispatch chains, retired profiles
        or extra-agent permissions.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - "ui: {status,intent,surfaces,states,accessibility,responsive,assets,observations,gaps}"
      - assets:[{path}]
      - assertions
    content:
      en: "Write the selected UI direction to one or more approved UI scope nodes at module/ui/index.yaml
        or recursively below ui/, following schemas/work-layout.json. Each node may cover multiple
        screens, states, steps and viewports; split only when useful. Record a compact
        region-to-component map in existing ui.observations or namespaced extensions:
        screen/state/region, exported component and props, label/body/band anatomy, geometry/paint
        owner, effective tokens/fallbacks, applicable knowledge rules, source references and
        unresolved gaps. App-owned regions remain explicit; do not wrap every region in a card. All
        design files belong under their owning node assets/** and every ui.assets path is also
        declared in top-level assets for byte binding."
  - id: evidence
    path: E/manifest.yaml + E/direction.png or actual requested format + E/prompt.txt +
      E/visual-review.md
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: Retain actual generated/drawn image and tool provenance, the full prompt including mapped
        component anatomy and effective family constraints, inspected fidelity findings and separate
        asset identities. Review against the region-to-component map, not generic attractiveness
        alone. Distinguish a generated preview from a screenshot of actual components; a generated
        drawing proves neither exact CSS/token fidelity nor product behavior.
  - id: handoff
    path: E/response.yaml
    fields:
      - schema
      - requestId
      - requestDigest
      - op
      - step
      - slot
      - runId
      - workflow
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for the selected named workflow, emit the response defined by workflows/contracts.json.
        Return outputs.draws as the full reviewed image array with artifact IDs and
        screen/state/viewport mapping. A failed/blocked response preserves evidence with
        outputs:null.
  - id: designSource
    path: N/assets/**/<asset>
    fields:
      - ui.assets:[{path,role,provenance}]
      - assets:[{path}]
    content:
      en: Store any number of generated or accepted design files under each selected UI node assets/** in
        their actual formats. Names and grouping follow the represented experience, not fixed
        desktop.png/mobile.png slots. Describe each file role/provenance and its
        screen/state/viewport coverage in index.yaml. Asset folders need no index.yaml. Keep one
        shared owner instead of duplicate copies; consumer nodes use refs to that owner. Do not
        place design files under frontend implementation or UAT; those own running-page captures.
  - id: draws
    path: E/draws.yaml
    fields:
      - draws
    content:
      en: Emit the reviewed draw mapping as readable YAML beside the UI node; image bytes remain in
        N/assets.
  - id: matrixHandoff
    path: E/job-result.yaml
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - target
      - business
      - design
      - repo
      - architecture
      - knowledge
      - grammar
      - profile
    writes:
      - node
    action:
      en: "Freeze the selected brief and content/region mapping, labelling placeholder/example copy.
        Choose a code-native/vector or raster medium matching the request; do not force ImageGen
        where not appropriate. Map the canonical accepted journeys and required
        screens/states/viewports to the complete planned draws array. Ground existing components in
        source; greenfield surfaces remain proposed. Check architecture service/API boundaries
        before representing actions. Own the screen/content plan inside this draw job: specify
        shell, responsive states, truthful landing-page claims, region and asset ownership,
        motion/accessibility constraints and transitions before producing images. Resolve the
        execution profile and actual tool availability before selecting instruments; this does not
        switch the model/runtime or spawn workers. Identify reusable and missing visual assets in
        the direction. Codex working profiles may use an actually available image generator. Claude
        may render code-native layouts and reserve blank decorative artwork slots with briefs for
        later drawing; never claim missing raster artwork was generated. Actual reviewed layout
        images are still required by the draw output contract."
  - reads:
      - business
      - design
      - target
      - grammar
    writes:
      - evidence
      - designSource
    action:
      en: Create one recommended visual direction by default, not an unsolicited A/B/C set. Only an
        explicit user request for alternatives, comparison or choice permits multiple directions;
        honor the requested count (for example two or three), and clarify the count before
        generation if unspecified. A generic design/improvement request or approval of an
        assistant-invented alternatives plan does not by itself request extra directions. Required
        screens, states and desktop/mobile views of the same direction are coverage, not competing
        alternatives; produce only the images needed for that coverage. Freeze the
        region-to-component map before image production and carry its actual anatomy, geometry,
        typography, state and family constraints into the drawing prompt or code-native preview. Do
        not draw a generic concept first and leave FE to retrofit Grammar afterward. Use the
        available appropriate tool/skill and retain actual output and provenance. When exact
        component fidelity is requested, render the actual installed components in an authorized
        isolated preview; if unavailable, report the limitation instead of certifying a generated
        approximation. Missing tool means blocked output, never a claimed generated image.
  - reads:
      - target
      - design
      - business
      - knowledge
      - grammar
    writes:
      - node
      - evidence
      - designSource
    action:
      en: "Open and inspect actual output for business contradictions, hierarchy, component ownership,
        legibility, responsive feasibility and each independent asset. Compare each mapped region
        against the resolved renderer: label inside/outside the body as actually styled, joined
        bands versus inset content, separators versus outlines/shadows, typography, status treatment
        and active family tokens. Distinguish subjective judgement from measured geometry. Review
        every image against applicable knowledge and mapped journey states; record actual coverage
        and unresolved conflicts. A material Grammar mismatch must be revised or reported as a gap,
        not passed as an implementation detail for FE to fix. A user's visual acceptance does not
        prove npm/CSS conformance or permit package overrides to match the image. Never pass a
        mandatory state using an unrelated representative image."
  - reads:
      - target
      - design
      - workflow
      - matrix
    writes:
      - node
      - evidence
      - handoff
      - draws
      - matrixHandoff
    action:
      en: Present the single recommended direction and its rationale by default; do not add an
        alternatives vote or generate extra options for the user to eliminate. Reuse an accepted
        choice. Ask for selection only when the user explicitly requested multiple alternatives and
        selection remains open; ordinary goal/result acceptance still applies. Stop without frontend
        code. For workflow execution, return outputs.draws as the full reviewed image array with
        artifact IDs and screen/state/viewport mapping. Submit the exact response to the coordinator
        gate; never self-advance. Write E/draws.yaml as declared by this operator's writes and
        authority for FE delivery in standalone and workflow modes; include every required reviewed
        image and retain its real artifact bytes in the owning Work assets. When selected in a job
        matrix, produce E/job-result.yaml bound to the exact request, its output schema and every
        required criterion. These readable YAML artifacts do not change the named workflow's
        response object or its local session serializer; use that workflow's existing wire contract,
        not a second invented canonical JSON copy.
proofs:
  - id: binding
    requirement:
      en: Run workspace validation; every cited ID/path exists or is explicitly proposed, required
        assertions are covered, input bindings are current, and an honest not-run/fail cannot earn
        done.
  - id: visual
    requirement:
      en: Actual visual bytes opened and reviewed against the brief; dimensions/tool provenance recorded;
        no UI/UAT pass assigned from the drawing.
  - id: draws-knowledge-coverage
    requirement:
      en: Every required journey screen/state has a reviewed image and applicable knowledge review. For a
        Grammar-bound design, retain the app-resolved package/family evidence, region-to-component
        map and explicit image comparison against it; package name/version alone or a generic visual
        pass is insufficient. Unresolved mandatory conflicts block handoff. Generated previews
        remain previews, not measured component conformance.
blockers:
  - code: DESIGN_INPUT_UNKNOWN
    condition:
      en: Required business content, identity asset rights or material direction choice is missing.
  - code: VISUAL_TOOL_UNAVAILABLE
    condition:
      en: Requested visual output cannot be produced with available permitted tools.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
