schema: starci/specification-policy@1
storage: .starciwork
payload: business/overview/index.yaml plus recursive business/srs/**/index.yaml leaves carrying
  extensions.work3.srs section payloads; parent indexes carry only srs-aggregate metadata.
sourceTruth: Current accepted Business/SRS in .starciwork and actual authorized intent define the
  target; all code is legacy observation, never requirement authority.
requiredSections:
  - functional-requirements
  - non-functional-requirements
  - business-rules
  - policy-decisions
  - data
  - customer-journeys
qualityExecutionOwner:
  - interface.implement
  - backend.implement
maxSecondaryDefinitions: 3
secondaryCalls: []
completion: Current overview/SRS use completion.review in the owning index.yaml, following
  docs/source-of-trust.md and current Work validation. No evidence directory or duplicate
  specification; never implementation, Sonar or UAT pass. Workflow authorization and result
  acceptance remain required.
handoff: Architecture consumes accepted SRS leaf IDs, requirements, flows and acceptance unchanged,
  including inherited scope. No code/service design or implementation checks belong in Business.
op: business.decide
impactMaturity: business-outcomes-only
steps:
  - reads:
      - target
      - intent
      - repo
    writes:
      - node
    action:
      en: Resolve the canonical .starciwork workspace and current accepted business scope before
        authoring. Read docs/source-of-trust.md and research authorized intent and domain documents
        first. Existing code, including newly tested code, is legacy observation rather than
        requirement authority; consult it only when relevant to an explicitly requested
        implementation-gap observation. Classify citations as accepted intent, observed source,
        proposal or unknown. Never infer the intended product or constrain its flows from existing
        FE/BE behavior.
  - reads:
      - intent
      - target
      - repo
    writes:
      - node
    action:
      en: Write purpose, scope/exclusions, glossary, assumptions, actors with
        responsibilities/rights/restrictions, FR/BR and observable NFRs. Specify business data
        attributes, validation, sensitivity, states/transitions and external inputs/outputs/errors.
        State why a data or external-interface inventory is empty. Source observations and supplied
        technical constraints are not approved business policy; unknown numeric targets retain a
        decision owner.
  - reads:
      - intent
      - repo
    writes:
      - node
    action:
      en: "Trace each FR through a complete user journey, not a title alone: trigger, primary/supporting
        actors, inputs, preconditions, numbered actor/request/system-response steps, guards,
        effects, failures, repeat behavior and success/failure postconditions. Distinguish product
        users from external parties served on their behalf, initiators from recipients, and receipt
        of a request from completed work. Alternative and exception branches identify their starting
        step, condition, ordered steps, resume/end and acceptance. Proactively challenge
        denied/invalid input, cancellation, duplicate/retry, concurrency, partial failure, lost
        outcomes and recovery where relevant; explain absent branch classes without fabricating
        cases. Analysis is not perfect foresight: a gap found during review, coding, testing or
        later customer feedback enters the same authorized canonical SRS/SDS repair loop even after
        done."
  - reads:
      - target
      - intent
      - repo
    writes:
      - node
    action:
      en: Review observable outcomes against accepted intent and observed behavior. Business states what
        users and the system must do, not class inheritance, repositories, service placement,
        Saga/CQRS, Kubernetes or backup tooling. Preserve genuinely supplied technical constraints
        as sourced external constraints; hand implementation questions to Architecture instead of
        encoding an invented design in requirements.
  - reads:
      - intent
      - repo
    writes:
      - node
    action:
      en: Specify actor-action-resource permissions, tenant/owner boundaries, sensitive-data handling and
        abuse cases. Give each security requirement an observable denial/no-side-effect acceptance
        scenario; do not mistake a disabled UI control for server enforcement.
  - reads:
      - intent
      - target
    writes:
      - node
    action:
      en: Author business/overview/index.yaml with businessOverview for readable purpose, customer
        understanding, outcome, scope and open questions. Author the sole detailed SRS in
        typed extensions.work3.srs leaves under functional-requirements,
        non-functional-requirements, business-rules, policy-decisions, data and
        customer-journeys. Every item owns a folder/index.yaml; every intermediate index carries
        only starci/srs-aggregate@1 metadata. Keep each FR's flows, branch review,
        postconditions and acceptance cohesive. Link stable semantic IDs to exact owning Work refs.
  - reads:
      - target
      - repo
      - intent
    writes:
      - review
    action:
      en: Validate detailed requirement/flow/branch/acceptance coverage and the recursive Work graph.
        Apply the state-identity and NFR-target review in docs/business-srs.md; enum order cannot
        define transitions and configuration prerequisites cannot replace mandatory guarantees. Walk
        the complete scope as a user and downstream designer before first done; check shared
        boundaries, contradictory rules, observable results and significant missing cases. Resolve
        authorized elaboration yourself and ask the actual decision maker only for genuinely
        undecided business policy or scope. Repair an identified gap in its canonical owner and
        review affected consumers, not merely report it. A complete branch rolls up only from
        current reviewed required leaves; draft placeholders, green code tests and schema validity
        cannot earn done. Output reviewed business outcomes and observable security/quality
        acceptance for Architecture; no implementation or deployed-proof claim.
payloadSchema: starci/srs-sections@1
payloadField: extensions.work3.srs
aggregateSchema: starci/srs-aggregate@1
sectionSchemas:
  - starci/srs-functional-requirement@1
  - starci/srs-non-functional-requirement@1
  - starci/srs-business-rule@1
  - starci/srs-policy-decision@1
  - starci/srs-data-definition@1
  - starci/srs-customer-journey@1
compatibilitySchemas:
  - starci/specification@2
  - starci/srs@3
layout: business/index.yaml aggregates overview/index.yaml and srs/index.yaml. SRS has real
  functional-requirements, non-functional-requirements, business-rules, data and customer-journeys
  categories; every item has its own folder/index.yaml. Branches have no payload or author state.
  Legacy specification@2 and srs@3 remain readable under their original checks for recovery or an
  explicitly authorized migration, but neither is a new-authoring format.
