    steps:
      - reads:
          - target
          - business
          - repo
          - design
          - profile
        writes:
          - node
        action:
          en: Select only the requested screen/state matrix and acceptance assertions. Read actual
            implementation ownership and accepted design; do not substitute a generated concept for
            the target. Resolve the execution profile and actual tool availability before selecting
            instruments; this does not switch the model/runtime or spawn workers.
      - reads:
          - environment
          - identity
          - repo
          - target
        writes:
          - evidence
        action:
          en: Apply common browser provenance and isolation protocol. Verify actual rendered product
            login/state and served build, not just URL/HTTP 200. Anonymous paths explicitly omit
            authenticated identity.
      - reads:
          - design
          - target
          - environment
        writes:
          - evidence
        action:
          en: Reach each selected state using observed controls, capture actual viewport/theme and retain
            local hashed images. Inspect the images for hierarchy, density, text/content, overflow,
            responsive arrangement and reference fidelity.
      - reads:
          - design
          - target
          - business
        writes:
          - evidence
        action:
          en: Measure applicable contrast, computed layout, focus/keyboard behavior and motion/reduced-motion
