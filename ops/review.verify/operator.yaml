      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
