          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: "Capture real image bytes, viewport/theme/route/state and actual DOM/computed measurements.
            Provenance includes environment, actor or anonymous, servedVersions, tool, capturedAt,
            servedVersionEvidence assertion. Images must be opened and inspected. Operator-specific
            observed result in E/result.md: Bind environment, actor or anonymous and all served
