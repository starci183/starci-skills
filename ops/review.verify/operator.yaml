  api:
    id: review.verify
    goal:
      en: Verify a selected API contract against the real served target with isolated authorized effects.
    nodeKinds:
      - uat.ux
    completionProfile: uat.ux
    sideEffects:
      - declared API test writes within owned namespace; no provisioning, deploy or broad cleanup
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: done
      dispatch: never
    reads:
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
            and validator freshness. This consumer op requires its target node to exist. An absent
            target is a scope/graph gap: report it and propose a separately selected scope op; do
            not create a target or invent its acceptance/graph here."
      - id: business
        path: .starciwork/<business>/business/**/index.yaml
        purpose:
          en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
            inputs in the selected .starciwork graph. Intent governs expected behavior; source is
            not a replacement. Do not invent a mandatory BA predecessor for a scope that does not
            require one; a needed missing input is a reported graph/scope gap, not a new dependency
            silently added here.
      - id: repo
        path: repository:<repo-id>/<bound-paths>
        purpose:
          en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
            state; read applicable instructions, manifests, owning code, callers and relevant tests.
            Greenfield/spec-only work records source not-yet-created and grounds intent in the user
            request; no invented repository or fact citation. Source implementation still needs an
            actual selected writable repository.
      - id: environment
        path: .starciwork/_resources/environments/<environment>/resource.yaml
        purpose:
          en: Read exact target/origins, owner, configuration revision, declared probes and allowed effects;
            validate live observations without inferring identity from hostname alone.
      - id: identity
        path: .starciwork/_resources/identities/<identity>/resource.yaml
        purpose:
          en: For authenticated/identity-changing scope, read actor alias, provider subject, roles/membership
            refs, environment and sealed custody reference; never print/copy credentials. Explicit
            anonymous scope records anonymous instead, without inventing an account resource.
      - id: fixture
        path: .starciwork/_resources/fixtures/<fixture>/resource.yaml
        purpose:
          en: When fixture inputs are needed, read their revision, owned namespace/IDs, expected precondition,
            creation method, cleanup owner and exact allowed deletion set; never preseed tested
            outcomes. Explicit no-fixture scope records why no mutable prerequisite/cleanup applies,
            without a fabricated fixture.
      - id: suite
        path: actual repository API test suite + selected architecture contract
        purpose:
          en: Read real suite command/cases, API schema/auth/error/transaction expectations and selected
            required assertions. Missing suite is a source-owner gap, not fabricated passing cases.
      - id: matrix
        path: selected complete-job matrix request + workflows/jobs.json
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
            input bindings, requested output JSON shapes and required criteria. Standalone execution
            needs no fabricated matrix request. A template is not authority for extra effects.
      - id: profile
        path: profiles/registry.json + selected runtime execution profile + actual host tools/model
        purpose:
          en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
            profiles. Use current host model configuration; historical model names are not
            availability proof. Capabilities are the intersection of actual tools, selected profile
            policy, op permissions and existing task authority. Do not revive V2 dispatch chains,
            retired profiles or extra-agent permissions.
    writes:
      - id: node
        path: N/index.yaml
        fields:
          - state
          - blocker
          - completion.inputDigest
          - completion.evidence
        content:
          en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
            only state/blocker/completion here; actual observations, findings, commit mappings and
            remaining cleanup belong to the evidence result, not semantic node prose. Missing
            refs/dependencies/acceptance require a reported gap or separately selected scope update;
            never add/remove them to obtain pass.
      - id: evidence
        path: E/manifest.yaml + E/api-result.json + E/api-output.txt + E/readback.json + E/runtime.json +
          E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: "Store actual suite cases and result output, status/error/schema checks, read-back and lifecycle
            observations, namespace effects and runtime provenance. API proof is not UI proof.
            Operator-specific observed result in E/result.md: Bind actor/environment/repositories,
            preserve selected API expectations and name untested or failed cases."
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - target
          - business
          - suite
          - repo
          - profile
        writes: []
        action:
          en: Bind required assertions to actual suite cases and verify test/runner revision. Identify
            undeclared effects before running, without rewriting product cases here. Resolve the
            execution profile and actual tool availability before selecting instruments; this does
            not switch the model/runtime or spawn workers.
      - reads:
          - environment
          - identity
          - fixture
          - repo
        writes:
          - evidence
        action:
          en: Verify target physical/runtime version, authorization and owned fixture preconditions;
            distinguish anonymous cases from authenticated actors. Do not seed tested outcomes.
      - reads:
          - suite
          - environment
          - identity
          - fixture
        writes:
          - evidence
        action:
          en: Execute the actual declared API client suite with isolated inputs and preserve redacted
            request/result diagnostics. Copy only cases the runner reported; missing output is
            not-run or inconclusive.
      - reads:
          - business
          - suite
          - fixture
        writes:
          - evidence
        action:
          en: Check response contract, persistent read-back and lifecycle/authorization independently,
            including replay/idempotency or denial where promised. Observe owned effects and cleanup
