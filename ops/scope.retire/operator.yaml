id: scope.retire
goal:
  en: Retire exactly the selected business/resource scope while preserving required evidence and live
    consumers.
nodeKinds:
  - operations
completionProfile: operations
sideEffects:
  - explicit retirement metadata and separately authorized exact destructive actions only
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        For an explicitly new target, absence is expected: inspect the nearest existing
        ancestor/workspace, then create only that selected scope. Preserve unaffected accepted
        content."
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: inventory
    path: selected nodes/resources + incoming refs + actual Git worktree inventory
    purpose:
      en: Read selected retirement request, stable IDs, live incoming references, retention/custody
        requirements, tracked/dirty/untracked artifacts and exact worktree registrations. A folder
        called .worktrees is not evidence of disposable content.
  - id: authority
    path: explicit retirement/deletion scope + durable storage policy
    purpose:
      en: Read exact selected removals and recovery constraints; default retirement is a scoped metadata
        decision, not recursive deletion.
  - id: matrix
    path: selected complete-job matrix request + workflows/jobs.json
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: profiles/registry.json + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority. Do not revive V2 dispatch chains, retired profiles
        or extra-agent permissions.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - state
      - blocker
      - completion.inputDigest
      - completion.evidence
      - dependsOn
      - refs
      - assertions
      - required
    content:
      en: "Write only the explicitly authorized retirement decision/scope before review; preserve stable
        IDs and obligations. Actual removal/retention observations belong in evidence. Graph edits
        apply only to the explicitly selected approved scope: declare real prerequisite node IDs in
        dependsOn and semantic input node/resource IDs in refs. No catalogue-wide chain or new
        unrelated scope; finish all graph/spec changes before review proof."
  - id: evidence
    path: E/manifest.yaml + E/retirement-inventory.json + E/retention-check.json + E/removal.json only
      when selected + E/result.md
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: "Record exact artifacts, ownership, safe destinations, verified hashes/readability and selected
        removal outcomes/recovery limitations; never copy secret plaintext. Operator-specific
        observed result in E/result.md: Record retired scope, actual decision authority, replacement
        IDs where applicable, consumer dispositions and retention/access policy. Preserve stable
        identities and do not relabel unfinished required work na without a real scope decision."
  - id: matrixHandoff
    path: E/job-result.json
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - inventory
      - authority
      - repo
      - target
      - profile
    writes:
      - evidence
    action:
      en: Inventory exact selected nodes/resources, Git state, image/evidence/account custody references
        and all live consumers. Distinguish custom durable .worktrees artifacts from Git-managed
        checkouts. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - inventory
      - authority
    writes:
      - node
    action:
      en: Resolve consumer preserve/replace/defer/retire dispositions and retention/recovery obligations.
        Missing decision or custody blocks deletion, not the read-only inventory.
  - reads:
      - inventory
      - authority
      - repo
    writes:
      - evidence
    action:
      en: Verify required durable artifacts are retained and retrievable at approved destinations before
        any explicitly selected deletion. Resolve absolute targets, symlink/junction boundaries and
        worktree registration; never broad recursive delete a workspace/root.
  - reads:
      - inventory
      - authority
      - repo
    writes:
      - evidence
    action:
      en: Execute only separately authorized exact retirement effects, preferring reversible operations
        and appropriate Git worktree lifecycle. Preserve uncommitted/untracked user work; uncertain
        ownership stops removal.
  - reads:
      - target
      - inventory
      - authority
      - matrix
    writes:
      - node
      - evidence
      - matrixHandoff
    action:
      en: Validate surviving references/readability and report what was retired, actually removed,
        retained and recoverable. Stop; no opportunistic cleanup of adjacent work. When selected in
        a job matrix, produce E/job-result.json bound to the exact request, its output schema and
        every required criterion. This handoff is conditional and does not change standalone or
        named frontend response contracts.
proofs:
  - id: binding
    requirement:
      en: Run workspace validation; every cited ID/path exists or is explicitly proposed, required
        assertions are covered, input bindings are current, and an honest not-run/fail cannot earn
        done.
  - id: retention
    requirement:
      en: No required live consumer or sole evidence/custody copy is lost; exact selected effects and
        recovery status are observed.
blockers:
  - code: RETIREMENT_UNSAFE
    condition:
      en: Exact target, user ownership, consumer disposition or durable retention is unresolved.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
