schema: starci/operator-registry@1
ops:
  - architecture.decide
  - backend.implement
  - business.decide
  - content.generate
  - e2e.verify
  - interface.draw
  - interface.implement
  - knowledge.repair
  - release.deliver
  - review.verify
  - runtime.operate
  - scope.retire
  - task.execute
  - uat.verify
  - workspace.manage
consolidation:
  schema: starci/op-consolidation@1
  principle: One operator owns one complete selected job, including preparation and proof.
  basic:
    - business.decide
    - architecture.decide
    - interface.draw
    - interface.implement
    - backend.implement
    - uat.verify
  supporting:
    - e2e.verify
    - workspace.manage
    - runtime.operate
    - release.deliver
    - review.verify
    - content.generate
    - knowledge.repair
    - scope.retire
    - task.execute
  mappings:
    - from: backend.plan
      to:
        - architecture.decide
        - backend.implement
      kind: internal-step
      responsibility: Partition and implement backend work inside its owning job.
    - from: interface.plan
      to:
        - architecture.decide
        - interface.draw
        - interface.implement
      kind: internal-step
      responsibility: Plan surfaces, states and code scope inside design or implementation.
    - from: uat.plan
      to:
        - uat.verify
      kind: internal-step
      responsibility: Prepare cases, setup and cleanup inside the sequential UAT job.
    - from: landing.compose
      to:
        - interface.draw
        - interface.implement
      kind: internal-step
      responsibility: Plan the surface in draw; ship the selected landing in frontend implementation.
    - from: library.update
      to:
        - interface.implement
        - backend.implement
      kind: internal-step
      responsibility: Change the actual owner package and prove affected consumers inside implementation.
    - from: goal.setup
      to:
        - workspace.manage
      kind: selected-mode
      responsibility: Deliver a usable canonical Work scope and real bindings.
      mode: prepare
    - from: workspace.bind
      to:
        - workspace.manage
      kind: selected-mode
      responsibility: Deliver a usable canonical Work scope and real bindings.
      mode: prepare
    - from: environment.preflight
      to:
        - runtime.operate
      mode: inspect
      kind: selected-mode
      responsibility: Collect readiness and blockers for exactly the selected development/test effects,
        repairing nothing.
    - from: runtime.serve
      to:
        - runtime.operate
      mode: serve
      kind: selected-mode
      responsibility: Bring one selected development runtime to the authorized state and prove the actual
        served build.
    - from: service.operate
      to:
        - runtime.operate
      mode: service
      kind: selected-mode
      responsibility: Inspect or change one declared auxiliary service and verify its requested state.
    - from: git.publish
      to:
        - release.deliver
      mode: publish
      kind: selected-mode
      responsibility: Publish only the explicitly selected verified Git commit/ref boundary and read it back.
    - from: release.deploy
      to:
        - release.deliver
      mode: deploy
      kind: selected-mode
      responsibility: Deploy one authorized immutable artifact to one target and verify actual steady
        state or explicit rollback outcome.
    - from: migration.release
      to:
        - release.deliver
      mode: migrate
      kind: selected-mode
      responsibility: Apply the explicitly selected source-owned migration set to one verified target and
        prove its journal/data outcome.
    - from: quality.verify
      to:
        - review.verify
      mode: delivery
      kind: selected-mode
      responsibility: Review implementation quality evidence bound to the exact delivered revision without
        rerunning or repairing its gates.
    - from: business.reconcile
      to:
        - review.verify
      mode: business
      kind: selected-mode
      responsibility: Compare the accepted business tree with delivered source and real acceptance
        evidence without rewriting requirements.
    - from: workflow.verify
      to:
        - review.verify
      mode: workflow
      kind: selected-mode
      responsibility: Inspect selected peer/piece outcomes against one task purpose without running or
        changing their work.
    - from: interface.audit
      to:
        - review.verify
      mode: visual
      kind: selected-mode
      responsibility: Inspect actual rendered selected screens and record truthful visual acceptance
        independently of implementation.
    - from: api.verify
      to:
        - review.verify
      mode: api
      kind: selected-mode
      responsibility: Verify a selected API contract against the real served target with isolated
        authorized effects.
    - from: workspace.migrate
      to:
        - workspace.manage
      mode: import
      kind: selected-mode
      responsibility: Create canonical Work from existing source and old worktrees with recoverable
        preservation and unapproved intent.
  unchanged:
    - content.generate
    - knowledge.repair
    - scope.retire
  execution: Modes are internal contracts, not extra operators or matrix cells. Existing named
    frontend runtime remains separately gated.
  added:
    - task.execute
    - e2e.verify
