schema: starci/specification-policy@1
storage: .starciwork
payload: architecture/overview/index.yaml carrying starci/sds-overview@1 plus recursive
  architecture/sds/**/index.yaml leaves carrying extensions.work3.sds code-map sections; parent
  indexes carry only sds-aggregate metadata.
sourceTruth: Canonical Work intent and design decisions define the target. A concise relevant
  source/configuration/installed-API survey informs feasibility and migration; the overview then
  independently records retain, extend, correct, replace or add decisions with rationale and impact.
  Actual source observations and revisions remain Implementation or UAT proof, never SDS authority.
requiredSections:
  - flows
  - code-map
  - contracts
  - data
  - quality
  - deployment
  - decisions
  - verification
qualityExecutionOwner:
  - interface.implement
  - backend.implement
maxSecondaryDefinitions: 3
secondaryCalls: []
completion: Current SDS uses completion.review in the owning index.yaml, following
  docs/source-of-trust.md; never source implementation or executed recovery. No evidence directory
  or duplicate design. Workflow authorization and result acceptance remain required; legacy records
  remain readable, not fabricated.
handoff: Reference canonical SRS and SDS items with exact typed refs. SDS owns the target
  repository/file/symbol/call/state/test-location map; Implementation realizes it and owns actual
  revision/build test results.
op: architecture.decide
impactMaturity: logical-design
scopeSufficiency: Proactively anticipate realistic main, alternative, failure and edge cases plus
  relevant constraints for the selected slice. Foreseeable material behavior, boundaries, contracts,
  data, authority, assumptions and decisions must not be omitted. Comprehensive reasoning does not
  require theoretical perfection before coding; implementation and tests empirically refine the
  owning SRS/SDS through affected-scope repair and fresh review.
steps:
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: "Resolve current accepted SRS scope, drivers, actors and platform constraints from canonical
        .starciwork. Read specifications/sds-map.json, docs/architecture-sds.md and
        docs/source-of-trust.md. Prescribe target repository roles, paths and symbols without
        existing/planned status, revisions or source evidence. Code and green tests do not authorize
        the target design; actual conformance belongs to Implementation and UAT."
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: Write logical components with responsibilities, exclusions and dependency directions. Contracts
        have one owner, caller/receiver, sync/async/in-process mode, inputs, outcomes/errors,
        authority, timeout, retry, idempotency and compatibility. Import shared views by stable
        Work/view IDs; never copy or redefine another owner contract.
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: Design runtime scenarios referencing canonical SRS flow IDs. Every step names its component,
        contracts, data, commit point, failure outcome and recovery. Cover significant architectural
        differences, including response loss, concurrency, duplicates, ordering, partial success and
        cancellation where relevant.
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: Specify authoritative versus rebuildable data, storage, isolation, consistency, lifecycle,
        placement, connections and credential custody. For durable customer state, specify the
        selected backup/restore form, capture consistency, authoritative and derived state, complete
        retained stores/objects/runtime state/config/Secrets/keys, custody outside the relevant
        failure domain, destination, compatibility, restore order, reconciliation, old-writer
        fencing, verification and safe resumption. Volume bytes, a generic supports-restore promise, recreated
        configuration or module reinstall does not explain data recovery. Select failure domains and
        HA/recovery depth from actual scope, not a mandatory cluster-loss checklist for every
        project.
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: Challenge one coherent proposal with a materially simpler alternative, rationale, cost,
        downsides and revisit conditions. Patterns are optional; specify actual mechanisms rather
        than names. Use applicable StarCi knowledge, verified installed APIs and primary technical references with an applicability
        argument. Do not invent business targets or product policy; make technical choices within
        approved requirements.
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: Write relevant quality/threat/failure scenarios with trigger, impact, response, owner and
        planned design checks linked to SRS acceptance. Keep residual risk and limitations explicit.
        Never claim source implementation, security audit, HA verification or a recovery drill ran
        from a design document.
  - reads:
      - target
      - business
      - constraints
    writes:
      - node
    action:
      en: "Validate recursive layout and exact canonical SRS/shared-design references, then walk complete
        significant journeys as an implementer: each component, connection, state owner,
        success/partial/uncertain outcome and next permitted action must be unambiguous. Review full
        requirement/flow/acceptance coverage, shared consumer consistency and simpler alternatives
        across the owning scope. Resolve known material design blockers before pass and record
        concrete findings and resolutions; this does not require perfect foresight of all future
        cases. Gaps found during review, coding, testing, operation or later customer feedback
        require scoped SRS/SDS repair within authority and current reviewed done before dependent
        effects. Do not reopen unrelated design or rewrite requirements to justify legacy code.
        Apply the call/signature/owner joins and admission-to-worker crash review in
        docs/architecture-sds.md; copied happy-path calls cannot implement cancellation or recovery.
        Schema validity alone is not review. SDS owns the target code map and planned verification;
        Implementation owns code effects and actual execution evidence. Done is never an edit lock."
references:
  - topic: Architecture views and decisions
    url: https://arc42.org/overview/
  - topic: Context and component diagrams
    url: https://c4model.com/diagrams
payloadSchema: starci/sds-map@1
payloadField: extensions.work3.sds
aggregateSchema: starci/sds-aggregate@1
sectionSchemas:
  - starci/sds-overview@1
  - starci/sds-flow@1
  - starci/sds-code-unit@1
  - starci/sds-contract@1
  - starci/sds-data-model@1
  - starci/sds-quality@1
  - starci/sds-deployment@1
  - starci/sds-decision@1
  - starci/sds-verification@1
compatibilitySchemas:
  - starci/specification@3
  - starci/sds@4
analysisPolicy: context-driven
