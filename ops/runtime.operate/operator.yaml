            retired profiles or extra-agent permissions.
    writes:
      - id: node
        path: N/index.yaml
        fields:
          - state
          - blocker
          - completion.inputDigest
          - completion.evidence
        content:
          en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
