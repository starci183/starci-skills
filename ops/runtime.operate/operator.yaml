id: runtime.operate
goal:
  en: Deliver the requested runtime or service state with readiness, owned effects and real
    postcondition proof.
nodeKinds:
  - operations
completionProfile: operations
sideEffects:
  - Only the selected operation contract permits effects; no union of mode permissions.
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        For an explicitly new target, absence is expected: inspect the nearest existing
        ancestor/workspace, then create only that selected scope. Preserve unaffected accepted
        content."
  - id: selection
    path: selected request operation + exact mode contract in this operator JSON
    purpose:
      en: Select exactly one named operation, its target, scope and criteria before any effect. No mode
        default or automatic chain.
  - id: matrix
    path: selected complete-job matrix request + workflows/jobs.json
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: profiles/registry.json + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority. Do not revive V2 dispatch chains, retired profiles
        or extra-agent permissions.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - completion.inputDigest
      - completion.evidence
    content:
      en: Bind only the selected mode completion profile and its actual evidence.
  - id: evidence
    path: E/manifest.yaml + E/result.json
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: Record operation, exact scope, criteria, output artifact references, observed effects and
        unresolved findings.
  - id: matrixHandoff
    path: E/job-result.json
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - target
      - selection
      - profile
    writes: []
    action:
      en: Resolve the exact named operation and load only its contract. Its reads/writes, effect ceiling
        and completion profile replace this selector envelope; the union of modes never grants
        authority. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - target
      - selection
      - matrix
    writes:
      - node
      - evidence
      - matrixHandoff
    action:
      en: Execute the selected mode procedure through its actual postconditions. Return operation, scope,
        per-criterion results and real output refs; no other mode, source repair or successor is
        implied. When selected in a job matrix, produce E/job-result.json bound to the exact
        request, its output schema and every required criterion. This handoff is conditional and
        does not change standalone or named frontend response contracts.
proofs:
  - id: mode-result
    requirement:
      en: Exactly the selected mode contract and all requested criteria pass with real evidence before
        delivery.
blockers:
  - code: OPERATION_REQUIRED
    condition:
      en: Missing, unknown or multiple operations; select a single mode under existing task authority.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
modePolicy:
  selection: required-exactly-one
  implicitChain: false
  permissionUnion: false
  completion: selected-mode-profile
executionModes:
  inspect:
    id: runtime.operate
    goal:
      en: Collect readiness and blockers for exactly the selected development/test effects, repairing
        nothing.
    nodeKinds:
      - operations
    completionProfile: operations
    sideEffects:
      - read-only probes; no infrastructure/account changes
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: done
      dispatch: never
    reads:
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
            and validator freshness. This consumer op requires its target node to exist. An absent
            target is a scope/graph gap: report it and propose a separately selected scope op; do
            not create a target or invent its acceptance/graph here."
      - id: repo
        path: repository:<repo-id>/<bound-paths>
        purpose:
          en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
            state; read applicable instructions, manifests, owning code, callers and relevant tests.
            Greenfield/spec-only work records source not-yet-created and grounds intent in the user
            request; no invented repository or fact citation. Source implementation still needs an
            actual selected writable repository.
      - id: environment
        path: .starciwork/_resources/environments/<environment>/resource.yaml
        purpose:
          en: Read exact target/origins, owner, configuration revision, declared probes and allowed effects;
            validate live observations without inferring identity from hostname alone.
      - id: capabilities
        path: available tools/runtime + selected identity/fixture/service declarations
        purpose:
          en: Inspect actual browser/Playwright availability when needed, declared commands, custody handles
            by name and target service probes. Do not open unrelated secrets.
      - id: matrix
        path: selected complete-job matrix request + workflows/jobs.json
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
            input bindings, requested output JSON shapes and required criteria. Standalone execution
            needs no fabricated matrix request. A template is not authority for extra effects.
      - id: profile
        path: profiles/registry.json + selected runtime execution profile + actual host tools/model
        purpose:
          en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
            profiles. Use current host model configuration; historical model names are not
            availability proof. Capabilities are the intersection of actual tools, selected profile
            policy, op permissions and existing task authority. Do not revive V2 dispatch chains,
            retired profiles or extra-agent permissions.
    writes:
      - id: node
        path: N/index.yaml
        fields:
          - state
          - blocker
          - completion.inputDigest
          - completion.evidence
        content:
          en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
            only state/blocker/completion here; actual observations, findings, commit mappings and
            remaining cleanup belong to the evidence result, not semantic node prose. Missing
            refs/dependencies/acceptance require a reported gap or separately selected scope update;
            never add/remove them to obtain pass.
      - id: evidence
        path: E/manifest.yaml + E/readiness.json + E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: "Collect all safely inspectable checks, with observed timestamp and source/config/environment
            revision; dependent checks unavailable due to earlier blocker remain not-run.
            Operator-specific observed result in E/result.md: One row per scoped prerequisite:
            needed capability, declaration, actual observation, ready/blocked/not-needed, owner and
            exact remedy. Readiness is time-bound evidence, not lasting global green."
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - target
          - repo
          - environment
          - capabilities
          - profile
        writes:
          - node
        action:
          en: Derive prerequisite list from the selected op/effect set, not the whole development cycle.
            Inspect target identity and read permissions first. Resolve the execution profile and
            actual tool availability before selecting instruments; this does not switch the
            model/runtime or spawn workers.
      - reads:
          - repo
          - capabilities
        writes:
          - evidence
        action:
          en: Inspect actual checkout, dependencies and command/browser capability without installing or
            repairing. Report unrelated dirt without deleting it.
      - reads:
          - environment
          - capabilities
        writes:
          - evidence
        action:
          en: Probe declared endpoints/build identity, credential custody availability by name, fixture
            ownership and permitted effect scope. Sign-in mutation is not assumed if task only
            authorizes passive diagnostics.
      - reads:
          - target
          - repo
          - environment
          - capabilities
          - matrix
        writes:
          - node
          - evidence
          - matrixHandoff
        action:
          en: Record the complete blocker set and skipped dependent checks without stopping at the first
            issue. Validate and finish read-only; no automatic runtime/account/fixture op. When
            selected in a job matrix, produce E/job-result.json bound to the exact request, its
            output schema and every required criterion. This handoff is conditional and does not
            change standalone or named frontend response contracts.
    proofs:
      - id: binding
        requirement:
          en: Run workspace validation; every cited ID/path exists or is explicitly proposed, required
            assertions are covered, input bindings are current, and an honest not-run/fail cannot
            earn done.
      - id: readiness
        requirement:
          en: Every needed prerequisite has a recent actual observation; absent capability stays
            blocked/not-run, not guessed ready.
    blockers:
      - code: ENVIRONMENT_NOT_READY
        condition:
          en: A required scoped capability or target cannot be verified.
      - code: DECLARED_DEPENDENCY_UNMET
        condition:
          en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
            Report node/resource IDs and propose a separately selected graph update when needed;
            never run predecessors or weaken dependsOn/refs/required to proceed.
    placeholders:
      business: Selected business slug
      repo-id: Resolved repository resource ID
      bound-paths: Inspected source read set
      write-ceiling: Explicit owned source paths
      environment: Resolved environment resource slug
      identity: Selected actor resource slug
      fixture: Selected fixture resource slug
      resource: Selected owned resource slug
      asset: Actual selected source asset filename/format
      piece: Stable selected piece slug
      flow: Selected UAT journey slug
      screen: Selected surface/state slug
  serve:
    id: runtime.operate
    goal:
      en: Bring one selected development runtime to the authorized state and prove the actual served
        build.
    nodeKinds:
      - operations
    completionProfile: operations
    sideEffects:
      - only authorized start/stop/restart/build or integration action on owned runtime
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: done
      dispatch: never
    reads:
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
