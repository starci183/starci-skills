            refs/dependencies/acceptance require a reported gap or separately selected scope update;
            never add/remove them to obtain pass.
      - id: resource
        path: .starciwork/_resources/runtimes/<resource>/resource.yaml
        fields:
          - id
          - kind
          - owner
          - revision
          - details.environment
          - details.commandRef
          - details.sourceRef
          - details.endpoints
          - details.probeRefs
          - details.custodyRefs
          - details.observationRef
        content:
          en: Update only declared owned runtime refs and observed-state pointer. Record local PID/session
            handles in ignored local state or bounded evidence, not durable identity.
      - id: evidence
        path: E/manifest.yaml + E/runtime.json + E/probes.json + E/effects.json + E/build-output.txt when
          built + E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: "Record before/after generation, target/process ownership, actual build command/output, full
            source refs, immutable served artifact, endpoint probes and effect status.
            Operator-specific observed result in E/result.md: Keep code/build/served identity
            distinct and no UAT/release readiness claim from a healthy process."
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - target
          - runtime
          - environment
          - repo
          - profile
        writes:
          - evidence
        action:
          en: Inspect current process/container holder, source/build revision, ports and health. Reuse an
            already matching healthy runtime without restart. Preflight the exact selected target,
            capabilities, configuration/custody and permitted effects inside this job. Check
            declared API/health postconditions on the resulting target; account or fixture setup for
            UAT remains owned by UAT. Do not modify product source or run implementation lint/Sonar.
            Resolve the execution profile and actual tool availability before selecting instruments;
            this does not switch the model/runtime or spawn workers.
      - reads:
          - runtime
          - environment
          - target
        writes: []
        action:
          en: Check selected desired action and allowed effects. A foreign process/port is not permission to
            kill it or silently choose another port/origin.
      - reads:
          - runtime
          - repo
          - environment
        writes:
          - resource
          - evidence
        action:
          en: Perform only the exact authorized runtime change and bounded recovery. If integration is
            explicitly included, inspect ownership and conflict scope, preserve actual resulting
            commit and rerun affected gates; otherwise do not merge.
      - reads:
          - runtime
          - environment
          - repo
        writes:
          - evidence
        action:
          en: Probe actual served source/build identity, endpoints and stability using declared checks. A
            started PID or build success alone does not prove the target is serving the selected
            code.
      - reads:
          - target
          - runtime
          - matrix
        writes:
          - node
          - resource
          - evidence
          - matrixHandoff
        action:
          en: Record actual state, partial effects and source-versus-served mapping, then stop. No
            account/fixture/deploy action is automatically performed. When selected in a job matrix,
            produce E/job-result.json bound to the exact request, its output schema and every
            required criterion. This handoff is conditional and does not change standalone or named
            frontend response contracts.
    proofs:
      - id: binding
        requirement:
          en: Run workspace validation; every cited ID/path exists or is explicitly proposed, required
            assertions are covered, input bindings are current, and an honest not-run/fail cannot
            earn done.
      - id: runtime
        requirement:
          en: Declared health and served-version evidence are observed on the actual target with correct owned
            generation.
    blockers:
      - code: RUNTIME_OWNER_CONFLICT
        condition:
          en: Target/process/port is foreign, ambiguous or changed concurrently.
      - code: RUNTIME_EFFECT_UNAUTHORIZED
        condition:
          en: Required start/reset/merge/configuration change exceeds selected action.
      - code: DECLARED_DEPENDENCY_UNMET
        condition:
          en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
