      - id: runtime
        path: .starciwork/_resources/runtimes/<resource>/resource.yaml + selected source command/config
        purpose:
          en: Read exact runtime owner, command, checkout/build, endpoints, process/container identity,
            declared desired action and health/version probes. Integration merge is not implied by
            serving.
      - id: matrix
        path: selected complete-job matrix request + workflows/jobs.json
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
