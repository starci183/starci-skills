schema: starci/model-capability-policy@1
purpose: >-
  Model names and registry membership are availability facts, not proof of capability. A model job is eligible
  only through a measurable qualification record or a narrowly scoped probation with strict machine gates and
  independent review. Provider budget ranks eligible candidates and never lowers a workload quality floor.
qualificationSchema: starci/model-qualification@1
requiredEvidence:
  - provider and exact model/version
  - evaluation suite and measured date
  - covered workloads, domains, tools, context and risk
  - case count, pass rate and declared threshold
  - evidence provenance independent of model self-report
  - verified evaluator receipt bound to an artifact hash
probation:
  allowedMaxRisk: medium
  forbiddenQualityFloors: [high, critical]
  requires: [strictMachineGates, independentReview, noExternalEffects, boundedAttempts, declaredScope]
review:
  requiresDistinctAttempt: true
  requiresFreshContext: true
  forbidsAuthorHiddenConversation: true
  differentProviderAloneIsInsufficient: true
budget:
  appliesAfterEligibility: true
  mayLowerQualityFloor: false
tooling:
  design-tool:
    requiredInvocation: image_gen.imagegen
    provenance: >-
      Record the actual built-in tool invocation, exact prompt asset and accepted input references. Tool model
      selection is not exposed, so a model name must not be inferred, promised or used as proof.
    truthBoundary: >-
      An ImageGen direction is a visual design input. Exact Grammar component/render behavior and API behavior
      require implementation evidence; browser UAT remains separately required.
