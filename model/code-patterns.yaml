schema: starci/code-pattern-profile@1
profiles:
  nest:
    title: StarCi NestJS code pattern
    canon:
      package: '@starci/eslint-canon-be'
      version: 1.2.1
      contentDigest:
        algorithm: sha256
        include: ['**/*.mjs', '**/*.json', '**/*.md', '**/*.ts']
        exclude: ['**/*.test.mjs']
        framing: sorted-posix-relative-path-null-raw-bytes-null
        value: b4c64b4614b11504954576d6c36198e377cbe194270998d903ee8f2431fca1e3
        files: 18
    sourceRuleRoots:
      - knowledge/patterns/be
    expectedSourceRuleIds:
      - BE-ARCHITECTURE-1
      - BE-ARCHITECTURE-2
      - BE-ARCHITECTURE-3
      - BE-ARCHITECTURE-4
      - BE-COMMENT-1
      - BE-COMMENT-2
      - BE-COMMENT-3
      - BE-COMMENT-4
      - BE-COMMENT-5
      - BE-COMMENT-6
      - BE-COMMENT-7
      - BE-ERROR-1
      - BE-ERROR-2
      - BE-ERROR-3
      - BE-ERROR-4
      - BE-ERROR-5
      - BE-ERROR-6
      - BE-ERROR-7
      - BE-FOLDER-1
      - BE-FOLDER-2
      - BE-FOLDER-3
      - BE-FOLDER-4
      - BE-FOLDER-5
      - BE-FOLDER-6
      - BE-FOLDER-7
      - BE-FUNCTION-1
      - BE-FUNCTION-2
      - BE-FUNCTION-3
      - BE-FUNCTION-4
      - BE-FUNCTION-5
      - BE-FUNCTION-6
      - BE-FUNCTION-7
      - BE-FUNCTION-8
      - BE-IMPORTS-1
      - BE-IMPORTS-2
      - BE-IMPORTS-3
      - BE-IMPORTS-4
      - BE-IMPORTS-5
      - BE-IMPORTS-6
      - BE-IMPORTS-7
      - BE-NAMING-1
      - BE-NAMING-2
      - BE-NAMING-3
      - BE-NAMING-4
      - BE-NAMING-5
      - BE-NAMING-6
      - BE-NAMING-7
      - BE-NAMING-8
      - BE-TEST-1
      - BE-TEST-2
      - BE-TEST-3
      - BE-TEST-4
      - BE-TEST-5
      - BE-TEST-6
      - BE-TEST-7
      - BE-TYPING-1
      - BE-TYPING-2
      - BE-TYPING-3
      - BE-TYPING-4
      - BE-TYPING-5
      - BE-TYPING-6
      - BE-TYPING-7
    sourceGlobs:
      - src/**/*.ts
      - apps/**/*.ts
      - libs/**/*.ts
      - test/**/*.ts
      - tests/**/*.ts
    inputGlobs:
      - jest*.ts
      - tsconfig*.json
      - package.json
    obligations:
      - id: NEST-DEPENDENCY-DIRECTION
        sourceRuleIds: [BE-ARCHITECTURE-1, BE-FOLDER-1, BE-IMPORTS-4]
        applicability: { include: ['**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts', '**/__tests__/**', 'test/**', 'tests/**'] }
        mechanical:
          requirement: Resolve aliases, relative imports, literals, re-exports and packages before enforcing app to feature to module direction.
          check:
            kind: architecture
            ruleIds: [BE_MODULE_IMPORTS_FEATURE, BE_MODULE_IMPORTS_APP, BE_FEATURE_IMPORTS_APP, ARCH_PACKAGE_IMPORTS_APP, ARCH_PACKAGE_EXPORT_BYPASS, ARCH_INTERNAL_IMPORT_UNRESOLVED, ARCH_DYNAMIC_DEPENDENCY_UNPROVEN]
            externalResult: { schema: 'starci/architecture-check@1', command: 'starci architecture check' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm that a declared module owns a cohesive capability instead of hiding feature orchestration.
        status: implemented
      - id: NEST-APP-COMPOSITION
        sourceRuleIds: [BE-ARCHITECTURE-2, BE-FOLDER-1]
        applicability: { include: ['apps/**/src/**/*.ts', 'src/main.ts', 'src/app.module.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Keep app roots to entry, root-module and narrowly named bootstrap/config roles.
          check:
            kind: architecture
            ruleIds: [BE_APP_COMPOSITION_ONLY, BE_APP_BUSINESS_ROLE]
            externalResult: { schema: 'starci/architecture-check@1', command: 'starci architecture check' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Inspect callbacks with neutral names for hidden product behavior.
        status: implemented
      - id: NEST-APPLICATION-TRANSPORT-BOUNDARY
        sourceRuleIds: [BE-ARCHITECTURE-4, BE-FOLDER-2, BE-FUNCTION-2, BE-FUNCTION-4, BE-TYPING-7]
        applicability: { include: ['src/features/**/application/**/*.ts', 'apps/*/src/features/**/application/**/*.ts', 'libs/*/src/features/**/application/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Application use cases and contracts cannot import transport DTOs or protocol-framework surfaces.
          check:
            kind: architecture
            ruleIds: [BE_APPLICATION_IMPORTS_TRANSPORT, BE_APPLICATION_TRANSPORT_FRAMEWORK]
            externalResult: { schema: 'starci/architecture-check@1', command: 'starci architecture check' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Verify semantic validation and DTO/result projection at the actual transport boundary.
        status: implemented
      - id: NEST-DOCUMENTED-EXPORTS
        sourceRuleIds: [BE-COMMENT-1, BE-COMMENT-2, BE-COMMENT-4, BE-COMMENT-7]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Require export and enum-member docs, reject restated-name docs and inline suppression/non-ASCII violations under the canon profile.
          check:
            kind: eslint
            ruleIds: [starci-be/require-export-jsdoc, starci-be/require-enum-member-jsdoc, starci-be/no-restated-name-jsdoc, starci-be/no-non-ascii-source, starci-be/require-vn-ok-reason, starci-be/no-line-suppression]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/comment.yaml
          review: Confirm prose explains responsibility or consequence rather than satisfying presence by paraphrase.
        status: implemented
      - id: NEST-EXCEPTION-IDENTITY
        sourceRuleIds: [BE-ERROR-1, BE-ERROR-2, BE-ERROR-3, BE-NAMING-3]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: Academy-profile thrown failures use named AbstractException identities, typed metadata and one object argument.
          check:
            kind: eslint
            ruleIds: [starci-be/exception-name-ends-in-exception, starci-be/exception-code-matches-class-name, starci-be/exception-metadata-type-named-for-class, starci-be/exception-extends-abstract, starci-be/exception-in-errors-folder, starci-be/require-exception-object-arg, starci-be/throw-abstract-exception, starci-be/no-handler-encoded-failure]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Keep typed business dispositions as outcomes and map private causes without leaking them.
        status: implemented
      - id: NEST-OBSERVABILITY
        sourceRuleIds: [BE-ERROR-7, BE-IMPORTS-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: Production source does not use console or framework logger and uses stable structured log identity.
          check:
            kind: eslint
            ruleIds: [no-console, starci-be/no-framework-logger, starci-be/no-interpolated-log-message, starci-be/no-error-wording-as-log-identity]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify redaction and correlation fields against the real logging adapter.
        status: implemented
      - id: NEST-PERSISTENCE-SHAPE
        sourceRuleIds: [BE-FOLDER-6, BE-FUNCTION-3, BE-FUNCTION-5, BE-TYPING-7]
        applicability: { include: ['src/**/*.ts', 'apps/*/src/**/*.ts', 'libs/*/src/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Preserve named EntityManager injection, transaction callback identity, entity table names and non-eager relations.
          check:
            kind: eslint
            ruleIds: [starci-be/must-inject-entity-manager, starci-be/no-injected-repository, starci-be/no-outer-manager-in-transaction, starci-be/require-entity-table-name, starci-be/no-eager-relation]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Boot the named connection and test atomicity; AST shape cannot prove the token or database effect.
        status: implemented
      - id: NEST-CONDITIONAL-CQRS-SHAPE
        sourceRuleIds: [BE-FUNCTION-1, BE-FUNCTION-2, BE-NAMING-6]
        applicability: { include: ['src/**/*.handler.ts', 'src/**/*.command.ts', 'src/**/*.query.ts', 'apps/*/src/**/*.handler.ts', 'apps/*/src/**/*.command.ts', 'apps/*/src/**/*.query.ts', 'libs/*/src/**/*.handler.ts', 'libs/*/src/**/*.command.ts', 'libs/*/src/**/*.query.ts'] }
        mechanical:
          requirement: When the Academy ICQRS compatibility profile is present, handlers and messages retain its executable contract.
          check:
            kind: eslint
            ruleIds: [starci-be/handler-overrides-process, starci-be/message-carries-params-only]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: A bus must own real dispatch/pipeline semantics; this check does not require CQRS for direct use cases.
        status: implemented
      - id: NEST-AUTHORIZATION-DOOR
        sourceRuleIds: [BE-FUNCTION-4, BE-FUNCTION-6]
        applicability: { include: ['src/features/**/*.ts', 'apps/*/src/features/**/*.ts', 'libs/*/src/features/**/*.ts'] }
        mechanical:
          requirement: Protected entry operations carry a recognized guard and transport doors remain in features.
          check:
            kind: eslint
            ruleIds: [starci-be/identity-needs-guard, starci-be/door-lives-in-features, starci-be/rest-door-needs-a-reason]
            expected: { severity: error }
        semantic:
          guidance: docs/architecture-rules.md
          review: Exercise denied and cross-scope actions; decorator presence does not prove resource authorization.
        status: implemented
      - id: NEST-DELIVERY-CONTRACT-SHAPE
        sourceRuleIds: [BE-FUNCTION-6, BE-TEST-5]
        applicability: { include: ['src/**/*.ts', 'apps/*/src/**/*.ts', 'libs/*/src/**/*.ts'] }
        mechanical:
          requirement: Selected projection and bridge implementations use the Academy delivery lifecycle shapes.
          check:
            kind: eslint
            ruleIds: [starci-be/projection-listener-contract, starci-be/no-dynamic-projection-group-id, starci-be/projection-recompute-must-upsert, starci-be/nats-bridge-delivery-contract, starci-be/no-call-site-transport-override]
            expected: { severity: error }
        semantic:
          guidance: docs/architecture-rules.md
          review: Verify durable acknowledgement, deduplication, fencing and unknown-effect recovery separately.
        status: implemented
      - id: NEST-TEST-STATIC-CONTRACT
        sourceRuleIds: [BE-FOLDER-7, BE-TEST-1, BE-TEST-5, BE-TEST-7]
        applicability: { include: ['**/*.spec.ts', 'src/tests/**/*.ts', 'apps/*/test/**/*.ts'] }
        mechanical:
          requirement: Tests are colocated/discovered as applicable and avoid call-only, sleep, provider-model, branch and mock-transport false proof.
          check:
            kind: eslint
            ruleIds: [starci-be/unit-test-colocated, starci-be/no-call-only-spec, starci-be/e2e-uses-production-transport, starci-be/e2e-asserts-persisted-state, starci-be/no-sleep-in-flow, starci-be/no-model-call-in-e2e, starci-be/harness-calls-provider-directly, starci-be/no-branch-in-flow-step, starci-be/no-wiring-in-flow-spec, starci-be/no-api-shaped-e2e-filename, starci-be/no-marker-model-stub]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Confirm assertions establish the named behavior and actual effect boundary.
        status: implemented
      - id: NEST-TYPE-SAFETY
        sourceRuleIds: [BE-TYPING-2, BE-TYPING-3, BE-TYPING-4, BE-TYPING-5]
        applicability: { include: ['**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: Reject any, double/unguarded casts, inline object contracts and const enums; use the adopted generic array form.
          check:
            kind: eslint
            ruleIds: ['@typescript-eslint/no-explicit-any', '@typescript-eslint/array-type', starci-be/no-double-cast, starci-be/no-inline-param-type, starci-be/no-inline-object-type, starci-be/no-const-enum, starci-be/no-unguarded-unknown-cast]
            expected:
              severity: error
              optionsByRule:
                '@typescript-eslint/array-type': [{ default: generic, readonly: generic }]
        semantic:
          guidance: knowledge/patterns/be/typing.yaml
          review: Verify runtime parsing and contract ownership; TypeScript shape is not validation.
        status: implemented
      - id: NEST-NAMED-CODE-SHAPE
        sourceRuleIds: [BE-NAMING-5, BE-NAMING-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Reject versioned identifiers, bare exported verbs and vendor-shaped factories on owned modules.
          check:
            kind: eslint
            ruleIds: [starci-be/no-version-in-name, starci-be/no-bare-verb-export, starci-be/no-vendor-module-factory-name]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/naming.yaml
          review: Confirm names describe the actual responsibility rather than merely satisfying suffix syntax.
        status: implemented
      - id: NEST-OWNER-PUBLIC-ENTRY
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-4, BE-IMPORTS-1, BE-IMPORTS-4]
        applicability: { include: ['src/features/**/*.ts', 'src/modules/**/*.ts', 'apps/*/src/features/**/*.ts', 'apps/*/src/modules/**/*.ts', 'libs/*/src/features/**/*.ts', 'libs/*/src/modules/**/*.ts'], exclude: ['**/*.spec.ts', '**/__tests__/**'] }
        mechanical:
          requirement: Cross-owner imports resolve through an explicit named public entry and public entries do not export-star.
          check:
            kind: architecture
            ruleIds: [ARCH_OWNER_EXPORT_BYPASS, ARCH_OWNER_EXPORT_STAR]
            externalResult: { schema: 'starci/architecture-check@1', command: 'starci architecture check' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm the exported surface is a stable capability API.
        status: implemented
      - id: NEST-MODULE-REGISTRATION
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-3, BE-FUNCTION-8]
        applicability: { include: ['src/**/*.module.ts', 'apps/**/src/app.module.ts'] }
        mechanical:
          requirement: Detect direct re-registration of another module's exported provider and validate selected handler/module registration shape.
          check: { kind: architecture, ruleIds: [BE_MODULE_PROVIDER_REREGISTRATION, BE_MODULE_HANDLER_REGISTRATION] }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Boot-test token, scope, configuration and lifetime; named instances cannot be inferred from syntax alone.
        status: missing
      - id: NEST-COMMENT-MEMBER-SHAPE
        sourceRuleIds: [BE-COMMENT-3, BE-COMMENT-5, BE-COMMENT-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: Enforce required member-doc presence and the adopted line/block comment placement and sentence form.
          check: { kind: script, ruleIds: [NEST_MEMBER_DOCUMENTATION, NEST_COMMENT_FORM] }
        semantic:
          guidance: knowledge/patterns/be/comment.yaml
          review: Confirm comments explain consequence and corrected reasoning.
        status: implemented
      - id: NEST-FEATURE-FILE-SHAPE
        sourceRuleIds: [BE-FOLDER-2, BE-FOLDER-5, BE-FOLDER-6, BE-NAMING-1, BE-NAMING-2, BE-NAMING-4, BE-NAMING-7, BE-NAMING-8]
        applicability: { include: ['src/features/**/*.ts', 'src/modules/**/*.ts'] }
        mechanical:
          requirement: Enforce adopted feature/application/transport placement and filename, class, enum, type and GraphQL surface syntax.
          check: { kind: architecture, ruleIds: [BE_FEATURE_LAYOUT_INVALID, BE_SOURCE_NAME_INVALID] }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Select direct use case versus bus and domain versus persistence ownership before judging placement.
        status: missing
      - id: NEST-TRANSPORT-ERROR-MAPPING
        sourceRuleIds: [BE-ERROR-4, BE-ERROR-5, BE-ERROR-6]
        applicability: { include: ['src/features/**/transport/**/*.ts', 'src/modules/platform/**/*.ts'] }
        mechanical:
          requirement: Check the adopted HTTP/GraphQL exception mapping and preservation of a foreign originalError where wrapped.
          check: { kind: eslint, ruleIds: [starci-be/foreign-error-keeps-cause, starci-be/transport-error-mapping] }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify public redaction and expected versus unknown outcome behavior.
        status: missing
      - id: NEST-ENV-CACHE-BOUNDARY
        sourceRuleIds: [BE-IMPORTS-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.spec.ts', 'src/tests/**'] }
        mechanical:
          requirement: Restrict process.env to the declared parser, raw cache tokens to their owner and default exports to sanctioned Jest entries.
          check: { kind: eslint, ruleIds: [starci-be/must-use-cache-service, starci-be/no-default-export, no-restricted-syntax] }
        semantic:
          guidance: knowledge/patterns/be/imports.yaml
          review: None; these are code-shape obligations.
        status: conflict
        conflict: The first two IDs exist only in the Academy repository's private plugin, not the pinned canon package; no-restricted-syntax options are repository-local.
      - id: NEST-IMPORT-FORMAT
        sourceRuleIds: [BE-IMPORTS-2]
        applicability: { include: ['**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: Enforce multiline braced imports with one binding per line and a trailing comma; side-effect, default and namespace imports retain their valid forms.
          check: { kind: script, ruleIds: [NEST_IMPORT_FORMAT] }
        semantic:
          guidance: knowledge/patterns/be/imports.yaml
          review: None; import order is intentionally not part of this obligation.
        status: implemented
      - id: NEST-TYPE-IMPORT-FORM
        sourceRuleIds: [BE-IMPORTS-2]
        applicability: { include: ['**/*.ts'] }
        mechanical:
          requirement: Use type-only imports when the resolved binding is used only as a type.
          check:
            kind: eslint
            ruleIds: ['@typescript-eslint/consistent-type-imports']
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/imports.yaml
          review: None; the TypeScript-aware lint rule resolves type-only use.
        status: implemented
      - id: NEST-JEST-ALIAS-PARITY
        sourceRuleIds: [BE-IMPORTS-7, BE-TEST-1]
        applicability: { include: ['jest*.ts', 'tsconfig*.json', 'package.json'] }
        mechanical:
          requirement: Compare Jest discovery and moduleNameMapper with the declared TypeScript projects and aliases.
          check: { kind: script, ruleIds: [NEST_JEST_ALIAS_PARITY, NEST_TEST_DISCOVERY] }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Record which real service, database and external boundaries ran.
        status: missing
      - id: NEST-TEST-CODE-FORM
        sourceRuleIds: [BE-TEST-2, BE-TEST-3, BE-TEST-4, BE-TEST-6]
        applicability: { include: ['**/*.spec.ts'] }
        mechanical:
          requirement: Enforce selected subject construction, execute entry, describe/it naming and formatting forms.
          check: { kind: eslint, ruleIds: [starci-be/spec-subject-shape, starci-be/spec-name-shape] }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Verify assertions prove effects and ordering rather than calls alone.
        status: missing
      - id: NEST-CONTRACT-TYPE-FORM
        sourceRuleIds: [BE-TYPING-1, BE-TYPING-2, BE-TYPING-3, BE-TYPING-4, BE-NAMING-7]
        applicability: { include: ['src/**/*.ts', 'apps/*/src/**/*.ts', 'libs/*/src/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Enforce explicit named public inputs/results, readonly dependency/message fields and adopted serialized enum/type-name forms.
          check: { kind: eslint, ruleIds: [starci-be/public-contract-shape, starci-be/readonly-boundary, starci-be/public-enum-shape] }
        semantic:
          guidance: knowledge/patterns/be/typing.yaml
          review: Decide whether a value is public, extensible or transport-owned before selecting its type form.
        status: missing
      - id: NEST-LEGACY-BARREL-GUARD
        sourceRuleIds: [BE-FOLDER-4, BE-IMPORTS-1, BE-IMPORTS-4]
        applicability: { include: ['src/**/*.ts', 'apps/*/src/**/*.ts', 'libs/*/src/**/*.ts'] }
        mechanical:
          requirement: Keep legacy private-file and no-public-entry heuristics explicitly disabled while the owner public-entry architecture check enforces the adopted boundary.
          check:
            kind: eslint
            ruleIds: [starci-be/must-deep-module-import, starci-be/no-folder-reexport]
            expected: { severity: off }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm the replacement NEST-OWNER-PUBLIC-ENTRY architecture obligation is configured for every applicable owner.
        status: implemented
      - id: NEST-HANDLER-TWIN-COUNT-GUARD
        sourceRuleIds: [BE-FOLDER-7, BE-TEST-1]
        applicability: { include: ['src/**/*.handler.ts', 'apps/*/src/**/*.handler.ts', 'libs/*/src/**/*.handler.ts'] }
        mechanical:
          requirement: Keep the filename-count twin heuristic explicitly disabled; test selection follows actual behavior and risk.
          check:
            kind: eslint
            ruleIds: [starci-be/handler-has-twin-spec]
            expected: { severity: off }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Select meaningful handler/use-case proof from effects.
        status: implemented
    semanticOnly:
      - id: NEST-COHESIVE-ORCHESTRATION
        sourceRuleIds: [BE-FUNCTION-3, BE-FUNCTION-7, BE-TYPING-6]
        rationale: Whether a wrapper, helper, port or generic owns a meaningful responsibility depends on scenario and lifecycle meaning.
        guidance: docs/backend-source-pattern.md
      - id: NEST-CONCURRENCY-DESIGN
        sourceRuleIds: [BE-FUNCTION-6]
        rationale: Atomicity, idempotency and unknown-effect recovery require store/provider design and executable competing/crash tests.
        guidance: docs/architecture-rules.md
      - id: NEST-IMPORT-ORDER-OBSERVATION
        sourceRuleIds: [BE-IMPORTS-3, BE-IMPORTS-5]
        rationale: Import order is explicitly observational; selected execution form and ownership decide imports.
        guidance: knowledge/patterns/be/imports.yaml

  next:
    title: StarCi Next.js code pattern
    canon:
      package: '@starci/eslint-canon-fe'
      version: 3.0.2
      contentDigest:
        algorithm: sha256
        include: ['**/*.mjs', '**/*.json', '**/*.md', '**/*.ts']
        exclude: ['**/*.test.mjs']
        framing: sorted-posix-relative-path-null-raw-bytes-null
        value: 310c504a76e369a67d15a91c217db0034c792ab0d16f0b12c76b98125f4f80ca
        files: 21
    sourceRuleRoots:
      - knowledge/patterns/fe
    expectedSourceRuleIds:
