          check:
            kind: architecture
            ruleIds: [FE_TIER_IMPORTS_UPWARD, FE_COMPONENT_IMPORTS_TRANSPORT, FE_COMPONENT_DEEP_HOOK_IMPORT, FE_FETCH_OUTSIDE_TRANSPORT, ARCH_PACKAGE_IMPORTS_APP, ARCH_PACKAGE_EXPORT_BYPASS, ARCH_INTERNAL_IMPORT_UNRESOLVED, ARCH_DYNAMIC_DEPENDENCY_UNPROVEN]
