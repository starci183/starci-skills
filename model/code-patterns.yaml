            ruleIds: [starci-fe/prefer-arrow-export, starci-fe/public-component-signature, starci-fe/no-inline-parameter-type, starci-fe/export-matches-folder, starci-fe/no-runtime-namespace, starci-fe/class-names-in-colocated-file, starci-fe/no-inline-class-name, starci-fe/no-helper-folder-in-components, starci-fe/source-tier-marker-matches-folder, starci-fe/route-tree-holds-routes-only, starci-fe/monorepo-tier-belongs-to-its-side]
            expected: { severity: error }
        semantic:
