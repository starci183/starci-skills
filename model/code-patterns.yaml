      - id: NEXT-TEST-COLLOCATION
        sourceRuleIds: [FE-TEST-1]
        applicability: { include: ['**/*.{ts,tsx}'] }
        mechanical:
          requirement: Behavior specs are colocated with their subject under the selected source layout.
