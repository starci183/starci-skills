            ruleIds: [starci-fe/handler-on-prefix, starci-fe/no-placeholder-prop, starci-fe/no-per-part-classname-prop, starci-fe/no-public-classname-prop, starci-fe/no-public-frame-css-props, starci-fe/no-css-door-type-laundering]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/fe/function.yaml
          review: Name/group props for the real render contract; no fixed state/props/on triple is required.
        status: implemented
      - id: NEXT-VENDOR-AND-GRAMMAR-USAGE
        sourceRuleIds: [FE-FOLDER-5, FE-IMPORTS-5, FE-IMPORTS-7]
