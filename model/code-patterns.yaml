        sourceRuleIds: [FE-ARCHITECTURE-3, FE-FOLDER-2, FE-FUNCTION-4, FE-NAMING-1, FE-TEST-1]
        applicability: { include: ['**/*.tsx'], exclude: ['**/*.spec.tsx'] }
