schema: starci/runtimes@1
purpose: |-
  Every runtime is a role/model pool with real parallel slots and a cooldown. The workflow-bound profile applies
  adaptive capacity from config.json: role, tier, tools, qualification, independent review, fresh provider quota,
  shared admitted load and recent observed service filter and score provider families before one runtime is handed
  to the typed launcher. Several models never duplicate their family's quota. The preference/tier lists below are
  within-family suitability and a compatibility policy for direct low-level consumers; they are not a provider
  fallback chain in a workflow. A runtime that fails is classified and parked for the cooldown of that failure
  kind, doubling per repeat.
maxParallelOps: 10
allocation:
  # workflowRuntimeProfile replaces this compatibility default with adaptive-capacity from validated config.json
  policy: prefer-then-overflow
  # A tier may order its runtimes per role. The coding roles keep the tier they always had; decide and plan -
  # the roles Fable and Astra carry - name the reasoning runtimes first and their downgrade after them, so a
  # hard decide or plan operation is no longer "outside the hard tier" and never lands on the cheap pool.
  tiers:
    hard:
      default: [gpt-5.6-sol, claude-opus]
      decide: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
      plan: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
    medium:
      default: [gpt-5.6-sol, claude-opus, qwen3.8-flash]
      decide: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
      plan: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
    easy: [qwen3.8-flash, claude-opus, gpt-5.6-sol]
  preference:
    implement: [gpt-5.6-sol, claude-opus, qwen3.8-flash]
    verify: [gpt-5.6-sol, claude-fable-5.1, gpt-6-astra, claude-opus, qwen3.8-flash]
    # Fable overflows to Opus, Astra to Sol: the reasoning roles end on the coding runtimes instead of stalling.
    decide: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
    plan: [claude-fable-5.1, gpt-6-astra, claude-opus, gpt-5.6-sol]
    write: [gpt-5.6-sol, claude-opus, qwen3.8-flash]
  # Heavy work fans out: a big node is cut into children with disjoint write scopes, the seam every other child
  # would touch is built first and alone, then the rest run at once - bounded here so one parent never takes
  # every slot of the pool and leaves the rest of the tree waiting behind it.
  fanOut: {seamFirst: true, maxPerGroup: 9}
  verifyAvoidsImplementRuntime: true
  onLaunchFailure: next-available-runtime
  tieBreak: round-robin
  cooldownMs: {rate-limited: 600000, quota: 3600000, auth: 86400000, other: 300000}
  backoffFactor: 2
  maxCooldownMs: 3600000
runtimes:
  # No pool declares a budget: the probed provider window is the whole of it.
  gpt-5.6-sol:
    target: gpt-5.6-sol
    provider: codex
    # The last tier of the reasoning roles as well: when Fable, Astra and Opus are all out, Sol decides and plans.
    roles: [implement, verify, write, decide, plan]
    maxParallel: 5
  claude-opus:
    target: claude-opus
    provider: claude
    # Opus is Fable's downgrade, so it carries decide beside the plan role it always had.
    roles: [implement, verify, write, plan, decide]
    maxParallel: 3
  claude-fable-5.1:
    target: claude-fable-5.1
    provider: claude
    # Fable has a weekly window of its own on top of the Claude session and week.
    budgetWindow: fableWeekly
    roles: [verify, decide, plan, write]
    maxParallel: 2
  gpt-6-astra:
    target: gpt-6-astra
    provider: codex
    roles: [decide, verify, plan]
    maxParallel: 1
  qwen3.8-flash:
    target: qwen3.8-flash
    provider: qwen
    roles: [implement, verify, write]
    maxParallel: 2
roleOfKind:
  backend.implement: implement
  frontend.implement: implement
  interface.implement: implement
  grammar.update: implement
  architecture.revise: decide
  business.revise: decide
  content.generate: write
  release.deliver: implement
  runtime.operate: implement
  review.verify: verify
  e2e.verify: verify
  integration.verify: verify
  uat.verify: verify
  architecture.decide: decide
  business.decide: decide
  decision.prepare: decide
  provision.ask: decide
  brand.decide: write
  interface.draw: write
  interface.asset: write
  work.author: plan
  implementation.plan: plan
  task.execute: implement
