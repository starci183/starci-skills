schema: starci/runtimes@1
purpose: |-
  Every runtime is a provider-window pool with real parallel slots and a cooldown: the pool boundary IS the
  quota-window boundary, so one pool never spans two independently metered windows and one window never splits
  into two pools. The workflow-bound profile applies adaptive capacity from config.json: role, tier, tools,
  qualification, independent review, fresh provider quota, shared admitted load and recent observed service
  filter and score provider families before one runtime is handed to the typed launcher. The preference/tier
  lists below are within-family suitability and a compatibility policy for direct low-level consumers; they are
  not a provider fallback chain in a workflow. A runtime that fails is classified and parked for the cooldown of
  that failure kind, doubling per repeat.

  Models are pinned inside the pool per role (`models`) and attested at launch - never inferred from the pool
  name. A pool's `roles` is exactly the key set of its `models` map; both are declared so the allocator reads
  eligibility from `roles` and the role's model from `models`.
maxParallelOps: 20
allocation:
  # workflowRuntimeProfile replaces this compatibility default with adaptive-capacity from validated config.json
  policy: prefer-then-overflow
  # A tier may order its runtimes per role. The coding roles keep the tier they always had; decide and plan -
  # the roles Fable and the Codex reasoning model carry - name the reasoning pools first and their downgrade
  # after them, so a hard decide or plan operation is never "outside the hard tier" and never lands on the
  # cheap pool.
  tiers:
    hard:
      # Heavy implementation and refactor work (the scope measure names it hard even when the record does not):
      # Opus first, the SWE agent when its slots were explicitly assigned, Sol only as the last heavy fallback -
      # never the first answer for a six-file rewrite. Reasoning roles keep Fable first; hard verification goes
      # to the independent verifier model before it shares the implement pool.
      default: [claude-agent, devin-agent, codex-agent]
      implement: [claude-agent, devin-agent, codex-agent]
      write: [claude-agent, devin-agent, codex-agent]
      verify: [claude-fable, claude-agent, codex-agent, devin-agent]
      decide: [claude-fable, codex-agent, claude-agent]
      plan: [claude-fable, codex-agent, claude-agent]
    medium:
      default: [codex-agent, claude-agent, qwen-agent, devin-agent]
      decide: [claude-fable, codex-agent, claude-agent]
      plan: [claude-fable, codex-agent, claude-agent]
    easy: [qwen-agent, devin-agent, codex-agent, claude-agent]
  preference:
    implement: [codex-agent, claude-agent, qwen-agent, devin-agent]
    verify: [codex-agent, claude-fable, claude-agent, qwen-agent, devin-agent]
    # Fable overflows to the Claude pool, the Codex reasoning model to its own pool's working model: the
    # reasoning roles end on the coding pools instead of stalling.
    decide: [claude-fable, codex-agent, claude-agent]
    plan: [claude-fable, codex-agent, claude-agent]
    write: [codex-agent, claude-agent, qwen-agent, devin-agent]
  # Heavy work fans out: a big node is cut into children with disjoint write scopes, the seam every other child
  # would touch is built first and alone, then the rest run at once - bounded here so one parent never takes
  # every slot of the pool and leaves the rest of the tree waiting behind it.
  fanOut: {seamFirst: true, maxPerGroup: 9}
  verifyAvoidsImplementRuntime: true
  onLaunchFailure: next-available-runtime
  tieBreak: round-robin
  cooldownMs: {rate-limited: 600000, quota: 3600000, auth: 86400000, other: 300000}
  backoffFactor: 2
  maxCooldownMs: 3600000
runtimes:
  # One Codex account window carries the whole family: the working model covers implement/verify/write and the
  # reasoning model covers decide/plan. Role/tier/tool/quality gates still apply; an owner allocation changes
  # capacity, never qualification or effect authority.
  codex-agent:
    target: codex-agent
    provider: codex
    roles: [implement, verify, write, decide, plan]
    maxParallel: 10
    models:
      implement: gpt-5.6-luna
      verify: gpt-5.6-sol
      write: gpt-5.6-luna
      decide: gpt-6-astra
      plan: gpt-6-astra
  # One Claude session/week window, all five roles on the same pinned model.
  claude-agent:
    target: claude-agent
    provider: claude
    roles: [implement, verify, write, decide, plan]
    maxParallel: 6
    models:
      implement: claude-opus-5
      verify: claude-opus-5
      write: claude-opus-5
      decide: claude-opus-5
      plan: claude-opus-5
  # Fable has a weekly window of its own on top of the Claude session and week, so it is a pool of its own.
  claude-fable:
    target: claude-fable
    provider: claude
    budgetWindow: fableWeekly
    roles: [verify, decide, plan, write]
    maxParallel: 2
    models:
      verify: claude-fable-5-1
      decide: claude-fable-5-1
      plan: claude-fable-5-1
      write: claude-fable-5-1
  qwen-agent:
    target: qwen-agent
    provider: qwen
    roles: [implement, verify, write]
    maxParallel: 4
    models:
      implement: qwen3.8-flash
      verify: qwen3.8-flash
      write: qwen3.8-flash
  # Devin has no machine-readable account headroom equivalent to Orca's provider windows. It therefore starts
  # closed and is admitted only when the workflow owner explicitly assigns slots (`devin-agent=N`). The CLI's
  # auth/readiness and observed launch/refusal status are then the live capacity signal.
  devin-agent:
    target: devin-agent
    provider: devin
    roles: [implement, verify, write]
    maxParallel: 0
    capacityAuthority: explicit-workflow-quota
    quotaTelemetry: launch-status
    models:
      implement: swe-2-max
      verify: swe-2-max
      write: swe-2-max
roleOfKind:
  request.analyze: plan
  backend.implement: implement
  frontend.implement: implement
  scope.define: decide
  code.refactor: implement
  test.author: implement
  grammar.update: implement
  architecture.revise: decide
  business.revise: decide
  content.generate: write
  docs.author: write
  knowledge.repair: write
  release.deliver: implement
  scope.retire: implement
  runtime.operate: implement
  review.verify: verify
  e2e.verify: verify
  integration.verify: verify
  security.verify: verify
  perf.verify: verify
  uat.verify: verify
  goal.validate: verify
  architecture.decide: decide
  business.decide: decide
  goal.revise: decide
  decision.prepare: decide
  provision.ask: decide
  brand.decide: write
  interface.draw: write
  interface.asset: write
  work.author: plan
  implementation.plan: plan
  workspace.manage: plan

