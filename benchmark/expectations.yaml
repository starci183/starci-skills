# benchmark/expectations.yaml — what the runtime EXPECTS of each model pool, as its routing contract assumes it.
#
# This is the "expected" half of the benchmark: every claim is derived from the routing contract and cites the
# file it came from. The "actual" half is benchmark/snapshots/*.json (measured) and benchmark/findings/*.md
# (the analysis comparing the two). Nothing here is measured, and nothing here is a public benchmark figure
# unless `publicBenchmarks` cites it.
#
# publicBenchmarks rule: every value is null until a public source is cited for it. A filled value names
# {value, url, date (the source's publication date), retrieved (the date it was read)} in `sources`.
# Never invent, estimate or carry a number from memory.
#
# Update rule: this file follows the contract. When modules/models/runtimes.yaml, registry.yaml, a profile
# under modules/models/profiles/ or config.example.yaml allocation.shares changes a pool's role, order or
# share, the same change (or the next one) updates the matching entry and `asOf`. Snapshots are never edited.
schema: starci/benchmark-expectations@1
asOf:
  date: 2026-09-25
  commit: f17e62112            # the runtime main this file was derived from, plus contract change routing-review-hands (lane routing-review-hands)
  derivedFrom:
    - modules/models/runtimes.yaml          # runtimes.<pool>.roles/models/maxParallel, allocation.tiers/preference/balanced/overflowByOrder/frontier/hands, roleOfKind
    - modules/models/registry.yaml          # targets, operators.<op>.chain, costPolicy
    - modules/models/profiles/*.yaml        # business.whenNeeded / whenNot / failureModes
    - modules/models/agents/*.yaml          # capabilities.hostTools
    - config.example.yaml                   # allocation.policy balanced, allocation.shares, allocation.grants

# An owner-approved routing change that has not landed yet. None is pending.
approvedChange: null

# Landed routing changes, oldest first. Each names its evidence and the contract change that carries it.
history:
  - id: routing-by-evidence
    date: 2026-09-25
    decidedBy: owner ('ok')
    evidence: [benchmark/snapshots/2026-09-25-72h.json, benchmark/findings/2026-09-25.md]
    landed: {commit: f17e62112, contractChange: routing-by-evidence}
    shares: {devin-agent: 35, qwen-agent: 35, claude-agent: 20, codex-agent: 10}   # was qwen 40 / claude 20 / codex 20 / devin 20
    routing:
      implement: devin-agent first, qwen-agent second (medium/hard); qwen-agent first at easy
      scaffoldAndSmallWork: qwen-agent first (scaffold, docs, content, grammar.update, every hands-on cut slice)
      decideAndReview: [claude-agent, codex-agent]   # qwen-agent removed from think work and its decide/plan roles
      draw: codex-agent
      interfaceAudit: devin-agent removed
      balanced: first-under-share (the order ranks, the share caps), least-over when every pool is at its share
  - id: routing-review-hands
    date: 2026-09-25
    decidedBy: owner ("chia bớt cho devin qwen cái này, codex/claude chỉ là quyết định thôi (tức là đưa ra chiến lược), review thì phải cho tay chân làm là ok nhất! cứ thử mảng cho devin/qwen, ghi benchmark sai sửa sau")
    amends: routing-by-evidence
    kind: experiment                              # decided before measuring; re-measured by a 48h snapshot
    evidence: [benchmark/findings/2026-09-25-review-hands.md]
    landed: {contractChange: routing-review-hands}
    shares: unchanged
    routing:
      strategy: [claude-agent, codex-agent]       # request.analyze, scope.define, *.decide, *.revise, brand.decide, decision.prepare, provision.ask, implementation.plan, workspace.manage, task.execute, knowledge.repair, kernel functions
      review: [devin-agent, qwen-agent, claude-agent, codex-agent]   # every verify kind + work.author (role plan -> write); claude/codex overflow only
      crossFamily: reviewer's provider differs from the implementer's (allocation.frontier + allocation.hands); qwen reviews devin, devin reviews qwen
      interfaceAudit: review order; browser-dom holders are devin and codex, so a Devin-implemented UI is audited by codex (overflow)
      draw: codex-agent (unchanged)
    followUp: node scripts/agent/benchmark-snapshot.mjs --since-hours 48

pools:
  claude-agent:
    model: claude-opus-5-5                   # Claude Opus 5.5, pinned at every difficulty (runtimes.yaml runtimes.claude-agent.models)
    provider: claude
    roles: [implement, verify, write, decide, plan]
    maxParallel: 6
    share: 20                                # config.example.yaml allocation.shares
    frontier: true                           # runtimes.yaml allocation.frontier
    expected:
      role: >-
        The strategy seat. First in every think/decide/plan tier order and the [Kernel] seat. Review only as
        overflow, when Devin and Qwen are both unavailable (runtimes.yaml allocation.overflowByOrder.review); hands-on
        work only as overflow below insane (allocation.balanced.overflowOnly).
      strengths:
        - strategy kinds: request.analyze, scope.define, business.decide, architecture.decide, brand.decide, decision.prepare, implementation.plan, workspace.manage
        - business/architecture.decide at 72-73% pass over the 72h snapshot (benchmark/findings/2026-09-25.md)
      notExpectedFor:
        - first pick for any review or verify kind, or work.author (review order, overflow only)
        - host-tool routes: interface.draw, interface.asset (image_gen) and interface.audit (browser-dom) — agents/claude.yaml hostTools is empty
        - first pick for hands-on work (last in every hands-on order)
      cites: [modules/models/profiles/claude-agent.yaml, modules/models/runtimes.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []

  codex-agent:
    model:                                   # one Codex window, two models pinned per difficulty (runtimes.yaml runtimes.codex-agent.models)
      easy: gpt-6-luna
      medium: gpt-6-luna
      hard: gpt-6-sol                        # every think kind routes at a hard floor, so strategy runs on GPT-6 Sol
      insane: gpt-6-sol
    provider: codex
    roles: [implement, verify, write, decide, plan]
    maxParallel: 10
    share: 10
    frontier: true
    expected:
      role: >-
        Sol is the second strategy seat after Opus. Codex is the fleet's ONLY image generator, so interface.draw and
        interface.asset route nowhere else. Review is overflow only; the exception is the interface.audit of a
        Devin-implemented UI, which Codex takes because Qwen and Claude lack browser-dom. Hands-on work is overflow
        after Devin and Qwen.
      strengths:
        - interface.draw / interface.asset (sole route; image_gen.imagegen host tool)
        - strategy kinds on Sol, second after claude-agent in every hard/insane think order
        - browser-dom host tool (interface.audit, with devin-agent)
      notExpectedFor:
        - first pick for any review or verify kind other than that interface.audit case
        - first pick for hands-on work
        - spending its shared Luna/Sol quota on easy fan-out (profile failureModes, inferred)
      cites: [modules/models/profiles/codex-agent.yaml, modules/models/profiles/gpt-6-sol.yaml, modules/models/profiles/gpt-6-luna.yaml, modules/models/agents/codex.yaml]
    publicBenchmarks:
      gpt-6-sol:
        sweBenchVerified: null
        sweBenchPro: null
        terminalBench: null
        sources: []
      gpt-6-luna:
        sweBenchVerified: null
        sweBenchPro: null
        terminalBench: null
        sources: []

  devin-agent:
    model: swe-2-max                         # SWE-2 Max, medium and hard only; no easy or insane pin
    provider: devin
    roles: [implement, verify, write]        # no decide, no plan
    maxParallel: 10
    capacityAuthority: explicit-workflow-quota   # config.example.yaml allocation.grants devin-agent=10@implement+verify+write
    share: 35
    frontier: false
    hands: true                              # runtimes.yaml allocation.hands — an audit family since routing-review-hands
    expected:
      role: >-
        The owner-granted executor. First in the medium and hard implement/write/verify orders and second on the
        scaffold order. First on the review order at medium and hard (every verify kind, work.author), and the
        reviewer of what Qwen implemented (cross-family). An experiment since 2026-09-25.
      strengths:
        - backend.implement 70% and interface.implement 68% pass over the 72h snapshot
        - review of Qwen's work (routing-review-hands, unmeasured: benchmark/findings/2026-09-25-review-hands.md)
        - browser-dom host tool (interface.audit)
      notExpectedFor:
        - strategy: decide/plan and every think kind outside the review order (roles gate)
        - reviewing its own work (cross-family rule)
        - easy and insane work (no model pin)
        - anything outside an Orca workflow worktree or beyond the granted slots
      watch:
        - interface.audit 11% pass / 83% fail over the 72h snapshot (18 jobs) - now routed to it again as an experiment
      cites: [modules/models/profiles/devin-agent.yaml, modules/models/runtimes.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []

  qwen-agent:
    model: deepseek-v4.1-flash               # DeepSeek V4.1 Flash on the QwenCloud Token Plan, every difficulty
    modelSince: 2026-09-24                   # replaced qwen3.8-flash (owner 2026-09-24); earlier ledger rows ran qwen3.8-flash
    provider: qwen
    roles: [implement, verify, write]        # no decide, no plan since routing-by-evidence
    maxParallel: 10
    share: 35
    frontier: false
    hands: true                              # runtimes.yaml allocation.hands — an audit family since routing-review-hands
    expected:
      role: >-
        The cheap hands-on pool. First on scaffold, docs, content, grammar.update and every hands-on cut slice, and
        second behind Devin on implementation (first at easy). On the review order beside Devin, first at easy and
        insane, and the reviewer of what Devin implemented (cross-family). An experiment since 2026-09-25. Blocked
        only while its Token Plan quota circuit is open.
      strengths:
        - backend.scaffold 92% pass over the 72h snapshot (36 jobs)
        - cheap bounded execution and fan-out
        - review of Devin's work (routing-review-hands, unmeasured: benchmark/findings/2026-09-25-review-hands.md)
      notExpectedFor:
        - strategy: decide/plan and every think kind outside the review order (no think evidence)
        - host-tool routes, interface.audit included (agents/qwen.yaml hostTools is empty)
        - nested/sub agents (the agent tool is excluded)
        - kernel-function model calls (not in allocation.frontier)
      cites: [modules/models/profiles/qwen-agent.yaml, modules/models/runtimes.yaml, config.example.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []

# Installed targets that no automatic chain reaches (registry.yaml costPolicy). They run only on an explicit
# owner selection or a benchmark, so no routing expectation applies and no ledger row is expected for them.
excludedTargets:
  deepseek-v4-pro:
    model: deepseek-v4-pro
    provider: qwen
    automaticChains: excluded
    expected:
      role: explicit/owner-approved exception or benchmark only; deep independent review when the owner chooses it
    cites: [modules/models/profiles/deepseek-v4-pro.yaml, modules/models/registry.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []
  qwen3.8-max:
    model: qwen3.8-max
    provider: qwen
    automaticChains: excluded
    expected:
      role: explicit/owner-approved exception or benchmark only; never a silent upgrade after a failed flash attempt
    cites: [modules/models/profiles/qwen3.8-max.yaml, modules/models/registry.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []
