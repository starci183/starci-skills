# benchmark/expectations.yaml — what the runtime EXPECTS of each model pool, as its routing contract assumes it.
#
# This is the "expected" half of the benchmark: every claim is derived from the routing contract and cites the
# file it came from. The "actual" half is benchmark/snapshots/*.json (measured). Nothing here is measured, and nothing here is a public benchmark figure
# unless `publicBenchmarks` cites it.
#
# publicBenchmarks rule: every value is null until a public source is cited for it. A filled value names
# {value, url, date (the source's publication date), retrieved (the date it was read)} in `sources`.
# Never invent, estimate or carry a number from memory.
#
# Update rule: this file follows the contract. When modules/models/runtimes.yaml, registry.yaml, a profile
# under modules/models/profiles/ or modules/models/tiers.yaml changes a pool's role, tier or member order,
# the same change (or the next one) updates the matching entry and `asOf`. Snapshots are never edited.
schema: starci/benchmark-expectations@1
asOf:
  date: 2026-10-07
  commit: null                 # filled when the tiered-model-selection contract change lands on main
  derivedFrom:
    - modules/models/tiers.yaml             # tiers, seats, kindSeats, difficulty, kindTiers, balance, usage
    - modules/models/runtimes.yaml          # roleOfKind
    - modules/models/registry.yaml          # pools.<pool>.provider/roles/defaultModel/maxParallel, targets, costPolicy
    - modules/models/profiles/*.yaml        # business.whenNeeded / whenNot / failureModes
    - modules/models/agents/*.yaml          # capabilities.hostTools
    - config.example.yaml                   # allocation.grants, models

# An owner-approved routing change that has not landed yet. None is pending.
approvedChange: null

# Landed routing changes, oldest first. Each names its evidence and the contract change that carries it.
history:
  - id: routing-by-evidence
    date: 2026-09-25
    decidedBy: owner ('ok')
    evidence: [benchmark/snapshots/2026-09-25-72h.json]
    landed: {commit: f17e62112, contractChange: routing-by-evidence}
    shares: {devin-agent: 35, qwen-agent: 35, claude-agent: 20, codex-agent: 10}   # was qwen 40 / claude 20 / codex 20 / devin 20
    routing:
      implement: devin-agent first, qwen-agent second (medium/hard); qwen-agent first at easy
      scaffoldAndSmallWork: qwen-agent first (scaffold, docs, content, grammar.update, every hands-on cut slice)
      decideAndReview: [claude-agent, codex-agent]   # qwen-agent removed from think work and its decide/plan roles
      draw: codex-agent
      interfaceAudit: devin-agent removed
      balanced: first-under-share (the order ranks, the share caps), least-over when every pool is at its share   # replaced by tiered-model-selection
  - id: routing-review-hands
    date: 2026-09-25
    decidedBy: owner ("chia bớt cho devin qwen cái này, codex/claude chỉ là quyết định thôi (tức là đưa ra chiến lược), review thì phải cho tay chân làm là ok nhất! cứ thử mảng cho devin/qwen, ghi benchmark sai sửa sau")
    amends: routing-by-evidence
    kind: experiment                              # decided before measuring; re-measured by a 48h snapshot
    landed: {contractChange: routing-review-hands}
    shares: unchanged
    routing:
      strategy: [claude-agent, codex-agent]       # request.analyze, scope.define, *.decide, *.revise, brand.decide, decision.prepare, provision.ask, implementation.plan, workspace.manage, task.execute, knowledge.repair, kernel functions
      review: [devin-agent, qwen-agent, claude-agent, codex-agent]   # every verify kind + work.author (role plan -> write); claude/codex overflow only
      crossFamily: reviewer's provider differs from the implementer's (allocation.frontier + allocation.hands); qwen reviews devin, devin reviews qwen
      interfaceAudit: review order; browser-dom holders are devin and codex, so a Devin-implemented UI is audited by codex (overflow)
      draw: codex-agent (unchanged)
    followUp: starci runtime benchmark-snapshot --since-hours 48
  - id: provider-qwen-removed
    date: 2026-09-29
    decidedBy: owner ("xóa qwen đi quá lỏ!! không mua nữa đâu, devin codex claude đủ r")
    amends: routing-review-hands
    landed: {contractChange: provider-qwen-removed}
    shares: {devin-agent: 35, claude-agent: 20, codex-agent: 10}
    routing:
      hands: [devin-agent]                        # allocation.hands
      implement: devin-agent, codex-agent, claude-agent   # scaffold too; codex-agent first at easy (Devin pins no easy model)
      review: [devin-agent, claude-agent, codex-agent]    # claude/codex overflow only; a review of Devin's work goes to claude/codex (cross-family)
  - id: tiered-model-selection
    date: 2026-10-07
    decidedBy: owner (MODEL-SELECTION-PROPOSAL.md sections 6 and 7, approved)
    amends: provider-qwen-removed
    landed: {contractChange: tiered-model-selection}
    shares: removed                               # the 35/20/10 provider shares are gone; models.balance (maxStreak 3, maxSharePercent 70) replaces them
    routing:
      tiers:
        frontier: [claude-opus-5-5, gpt-6.1-sol]  # Supervisor, planner, validator, kernel manager; op difficulty insane
        high: [claude-sonnet-5-5, gpt-6.1-sol]    # Kernel, worker; op difficulty hard
        medium: [swe-2-max, gpt-6.1-sol]          # op difficulty medium
        low: [swe-2-max, gpt-6-luna]              # op difficulty easy
        imagegen: [gpt-6.1-sol]                   # a call tier: the headless image call of interface.draw, interface.asset, brand.decide; no seat or op
      precedence: hard filter > owner bias > a live seat keeps its member > balance > chain order by tokens
      tokens: automatic picks skip a member at 90 percent of its quota; an owner bias naming it keeps it usable up to 95 percent

pools:
  claude-agent:
    model:                                   # two Claude models by tier (tiers.yaml)
      high: claude-sonnet-5-5
      frontier: claude-opus-5-5
    provider: claude
    roles: [implement, verify, write, decide, plan]
    maxParallel: 6
    expected:
      role: >-
        The first member of the frontier tier (Opus 5.5: Supervisor, planner, validator, kernel manager, insane ops)
        and of the high tier (Sonnet 5.5: the Kernel, workers, hard ops). It is in no medium or low tier.
      strengths:
        - strategy kinds: request.analyze, scope.define, business.decide, architecture.decide, brand.decide, decision.prepare, implementation.plan, workspace.manage
        - business/architecture.decide at 72-73% pass over the 72h snapshot
      notExpectedFor:
        - "browser-dom routes (interface.draw capture, interface.audit): agents/claude.yaml hostTools is empty, so the hard filter drops it"
        - easy and medium work (the medium and low tiers hold no Claude member)
      cites: [modules/models/profiles/claude-agent.yaml, modules/models/runtimes.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []

  codex-agent:
    model:                                   # one Codex window, two models by tier (tiers.yaml)
      frontier: gpt-6.1-sol
      high: gpt-6.1-sol
      medium: gpt-6.1-sol
      low: gpt-6-luna
      imagegen: gpt-6.1-sol
    provider: codex
    roles: [implement, verify, write, decide, plan]
    maxParallel: 10
    expected:
      role: >-
        Sol is the second member of the frontier, high and medium tiers and the only member of the imagegen call tier;
        Luna is the second member of the low tier. Codex is the fleet's ONLY image generator: every image a drawing op
        needs is made by the headless starci work imagegen call on it, whichever agent the op runs on. The interface.draw
        and interface.audit of any UI go to it because Claude lacks browser-dom.
      strengths:
        - the headless imagegen call of interface.draw / interface.asset / brand.decide (sole route; image_gen.imagegen built-in tool)
        - interface.draw (browser-dom host tool; Claude lacks it)
        - second after claude-agent in the frontier and high tiers
        - browser-dom host tool (interface.audit, with devin-agent)
      notExpectedFor:
        - first pick for easy or medium hands-on work (Devin leads those tiers)
        - spending its shared Luna/Sol quota on easy fan-out (profile failureModes, inferred)
      cites: [modules/models/profiles/codex-agent.yaml, modules/models/profiles/gpt-6.1-sol.yaml, modules/models/profiles/gpt-6-luna.yaml, modules/models/agents/codex.yaml]
    publicBenchmarks:
      gpt-6.1-sol:
        sweBenchVerified: null
        sweBenchPro: null
        terminalBench: null
        sources: []
      gpt-6-luna:
        sweBenchVerified: null
        sweBenchPro: null
        terminalBench: null
        sources: []

  devin-agent:
    model: swe-2-max                         # SWE-2 Max, first member of the medium and low tiers; in no high or frontier tier
    provider: devin
    roles: [implement, verify, write]        # no decide, no plan
    maxParallel: 10
    capacityAuthority: explicit-workflow-quota   # config.example.yaml allocation.grants devin-agent=10@implement+verify+write
    expected:
      role: >-
        The owner-granted executor. First member of the medium tier (Sol behind it) and of the low tier (Luna behind it):
        hands-on implementation, scaffold and verification at easy and medium difficulty.
      strengths:
        - backend.implement 70% and interface.implement 68% pass over the 72h snapshot
        - review (routing-review-hands, unmeasured)
        - browser-dom host tool (interface.audit)
      notExpectedFor:
        - strategy: decide/plan and every think kind (roles gate; the high and frontier tiers hold no Devin member)
        - hard and insane work
        - anything outside an Orca workflow worktree or beyond the granted slots
      watch:
        - interface.audit 11% pass / 83% fail over the 72h snapshot (18 jobs) - now routed to it again as an experiment
      cites: [modules/models/profiles/devin-agent.yaml, modules/models/runtimes.yaml]
    publicBenchmarks:
      sweBenchVerified: null
      sweBenchPro: null
      terminalBench: null
      sources: []

# Installed targets that no automatic chain reaches (registry.yaml costPolicy). They run only on an explicit
# owner selection or a benchmark, so no routing expectation applies and no ledger row is expected for them.
excludedTargets: {}
