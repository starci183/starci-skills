schema: starci/orca-provider@1
provider: orca
executable: orca
files:
  capabilities: capabilities.json
  api: api.json
  calls: calls.json
  recipes: recipes.json
  validation: validation.json
  adapters:
    codex: adapters/codex.json
    claude: adapters/claude.json
    qwen: adapters/qwen.json
purpose: |-
  Canonical Orca API call templates for StarCi orchestrated execution. These calls are the
  only supported construction path; prompts may fill placeholders but may not invent a
  different hierarchy, launch sequence, display role or lifecycle shortcut.
environmentBinding:
  currentRuntime: omit---on
  namedRuntime: '--on <observed-environment-id>'
  namedRuntimeAuthority: live-runtime-inventory-only
  forbidden:
    - literal-windows-environment
    - guessed-environment-name
ui:
  activitySubtitle: last-tool-activity-not-agent-identity
  identitySource:
    - native-agent-icon
    - terminal-title
    - supervised-worker-receipt
  note: 'A sidebar subtitle such as "Bash: orca orchestration check" means the native agent is currently using Bash; it does not mean the terminal is a shell-only worker.'
names:
  planCoordinator: "[Coordinator] <Plan>"
  workflowWorktree: "[Workflow] <Workflow>"
  workflowMonitor: "[Monitor] <Workflow>"
  operationAgent: "[Op] <operation> - <scope>"
planCoordinator:
  role: persistent-native-agent
  calls:
    createTask:
      api: orchestration.task-create
      cli: 'orca orchestration task-create --run <run-id> --spec "<plan-coordinator-contract>" --json'
    startAgent:
      api: orchestration.worker-start
      cli: 'orca orchestration worker-start --task <task-id> --worktree current --agent codex --json'
    nameAgent:
      api: terminal.rename
      cli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Coordinator] <Plan>" --json'
    waitBoundary:
      api: orchestration.check
      cli: 'orca orchestration check --wait --types worker_done,worker_failed,escalation,question --timeout-ms 900000 --json'
workflowMonitor:
  role: persistent-native-agent-in-isolated-child-worktree
  calls:
    createTask:
      api: orchestration.task-create
      cli: 'orca orchestration task-create --run <run-id> --spec "<workflow-coordinator-contract>" --json'
    startChildAgent:
      api: orchestration.worker-start
      cli: 'orca orchestration worker-start --task <task-id> --worktree new-child --repo <exact-repo-selector> --name <workflow-slug> --agent codex --setup run --json'
    bindParent:
      api: worktree.set
      cli: 'orca worktree set --worktree <worker.worktree_id> --parent-worktree <exact-main-worktree-selector> --json'
    attestParent:
      api: worktree.show
      cli: 'orca worktree show --worktree <worker.worktree_id> --json'
      acceptOnlyWhen: 'result.worktree.parentWorktreeId equals the exact main Coordinator worktree id'
      onMismatch: stop-before-operation-task-creation
    nameWorktree:
      api: worktree.set
      cli: 'orca worktree set --worktree <worker.worktree_id> --display-name "[Workflow] <Workflow>" --json'
    nameAgent:
      api: terminal.rename
      cli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Monitor] <Workflow>" --json'
    waitOperationBoundary:
      api: orchestration.check
      cli: 'orca orchestration check --wait --types worker_done,worker_failed,escalation,question --timeout-ms 900000 --json'
    reportParentBoundary:
      api: orchestration.send
      cli: 'orca orchestration send --type <worker_done|worker_failed|escalation|question> --subject "<normalized-subject>" --body "<normalized-workflow-envelope>" --task-id <workflow-task-id> --dispatch-id <workflow-dispatch-id> --json'
operationAgent:
  role: one-supervised-native-agent-per-operation-attempt
  canonicalLauncher:
    module: execution/orca-supervised-launch.mjs
    command: start-op
    authority: exclusive-effectful-construction-path
    calls: calls.json
    runner: execution/orca-calls.mjs
    companions:
      start-monitor: Plan Coordinator starts one Workflow Monitor from the supervisor chain.
      replace-monitor: Plan Coordinator settles a dead Monitor and relaunches it with --retry-of.
      settle: Any supervisor stops, releases and verifies one Dispatch; returns a typed settlement.
      verify: Read-only live agent-context check of every declared call before the first effect.
    input: [nested-workflow-run, workflow-task, from, worktree, operation, scope, spec-file]
    guarantees:
      - verifies-declared-calls-against-live-agent-context-before-effects
      - attests-from-is-nested-run-coordinator-handle
      - creates-canonical-operation-task-once-per-invocation
      - walks-the-whole-resolved-operator-chain-in-order
      - starts-fresh-native-agent-in-exact-workflow-worktree
      - omits-model-for-native-qwen-code
      - proves-prompt-delivery-before-attestation
      - attests-effective-agent-model-and-worktree
      - canonicalizes-and-verifies-terminal-title
      - fences-settles-and-proves-no-effects-before-next-candidate
      - stops-with-typed-reconciliation-on-partial-or-unknown-effects
      - returns-exhausted-chain-as-typed-result-never-thrown-string
      - replays-unknown-mutations-once-with-retry-request
  admission:
    expectedOperation: active-dag-node
    providerSelection: profiles-registry-resolver-output
    beforeTaskCreate:
      - assert-exact-operation
      - assert-operation-contract
      - assert-resolved-target
    afterWorkerStart:
      api: orchestration.worker-show
      cli: 'orca orchestration worker-show --dispatch <operation-dispatch-id> --json'
      attest:
        - dispatch.task_id equals operation-task-id
        - observation.exactWorker equals true
        - worker.startOptions.launch.effective.agent equals resolved Orca agent
        - worker.startOptions.launch.effective.model equals resolved model
        - worker.agent_terminal_handle is present
      beforeEffectAcceptance: required
      mismatch: fence-reconcile-release-and-retry-resolved-target
      canonicalizeTitle:
        renameApi: terminal.rename
        renameCli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Op] <operation> - <scope>" --json'
        verifyApi: orchestration.worker-show
        verifyCli: 'orca orchestration worker-show --dispatch <operation-dispatch-id> --json'
        acceptOnlyWhen: 'terminal.title equals [Op] <operation> - <scope>'
      runtimeTitleDrift:
        classification: mutable-native-ui-metadata
        whenImmutableIdentityRemainsExact: recanonicalize-without-fencing
        effectDecision: never-reject-solely-for-title-drift
    architectureSidearm:
      onlyTrigger: active implementation secondary_request
      exactReason: sds-technical-gap
      exactSecondaryOp: architecture.decide
      requires: explicit-bounded-sds-allowlist
      neverFrom: [review-finding, review-suggestion, open-question, inferred-gap]
  createTask:
    api: orchestration.task-create
    cli: 'orca orchestration task-create --run <run-id> --task-title "<concise-operation-title>" --display-name "[Op] <operation> - <scope>" --spec "<one-operation-contract>" --json'
  qwen38Flash:
    agent: qwen-code
    model: qwen3.8-flash
    modelAuthority: verified-qwen-runtime-configuration
    launch: direct-native-worker-start
    nestedAgents: forbidden
    calls:
      startAgent:
        api: orchestration.worker-start
        cli: 'orca orchestration worker-start --task <operation-task-id> --worktree current --agent qwen-code --json'
      restoreName:
        api: terminal.rename
        cli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Op] <operation> - <scope>" --json'
  managedFallback:
    calls:
      startAgent:
        api: orchestration.worker-start
        cli: 'orca orchestration worker-start --task <operation-task-id> --worktree current --agent <resolved-native-agent-id> --model <resolved-model-id> --effort <resolved-effort> --json'
      nameAgent:
        api: terminal.rename
        cli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Op] <operation> - <scope>" --json'
  settle:
    restoreName:
      api: terminal.rename
      cli: 'orca terminal rename --terminal <worker.agent_terminal_handle> --title "[Op] <operation> - <scope>" --json'
      failureEffect: record-ui-defect-without-rejecting-valid-operation-effects
    report:
      api: orchestration.send
      cli: 'orca orchestration send --type worker_done --subject "<status>" --body "<three-sentence-summary>" --task-id <operation-task-id> --dispatch-id <operation-dispatch-id> --outcome <succeeded|failed> --files-modified "<paths>" --json'
    release:
      api: orchestration.worker-release
      cli: 'orca orchestration worker-release --dispatch <operation-dispatch-id> --json'
    acknowledge:
      api: orchestration.check
      cli: 'orca orchestration check --ack <delivery-id> --json'
routing:
  coordinatorToWorkflow:
    api: orchestration.send
    cli: 'orca orchestration send --to dispatch:<workflow-dispatch-id> --type escalation --subject "<decision>" --body "<normalized-decision-envelope>" --json'
    forbiddenType: status
    reason: Workflow Monitors block on escalation but do not subscribe to status.
  coordinatorToOperation: forbidden
  operationToParentCoordinator: forbidden
forbiddenCalls:
  - raw-operation-task-create-or-worker-start-outside-canonical-launcher
  - orchestration.dispatch-inject-for-operation
  - orchestration.dispatch-return-preamble-for-operation
  - orchestration.dispatch-to-existing-terminal-for-operation
  - terminal-send-operation-prompt
  - terminal-create-shell-only-coordinator
  - operation-agent-tool-agent
  - orchestration-send-status-for-coordinator-instruction
  - parent-coordinator-direct-operation-control
  - task-create-for-non-dag-operation
  - operation-effect-without-provider-attestation
  - architecture-sidearm-inferred-from-review
  - literal-or-guessed-worker-start-environment
