schema: starci/orca-recipes@1
api: api.json
recipes:
  bootstrap-plan-coordinator:
    mode: orchestrated
    actor: external-bootstrap-chat
    sequence:
      - orchestration.run-create
      - orchestration.task-create
      - orchestration.worker-start
      - terminal.rename
      - orchestration.run-use
    terminalName: "[Coordinator] <Plan>"
    environmentBinding: current-runtime-by-omitting---on
    then: external-bootstrap-leaves-control-loop
  start-workflow-coordinator:
    mode: orchestrated
    actor: plan-coordinator
    sequence:
      - orchestration.task-create
      - orchestration.worker-start-new-child
      - worktree.set-parent-to-exact-main-coordinator
      - worktree.show-and-attest-parent-lineage
      - worktree.set-display-name
      - terminal.rename
    worktreeName: "[Workflow] <Workflow>"
    terminalName: "[Coordinator] <Workflow>"
    environmentBinding: current-runtime-by-omitting---on
    beforeOperationTaskCreate: parent-lineage-attested
  start-qwen-operation:
    mode: orchestrated
    actor: workflow-coordinator
    sequence:
      - assert-expected-active-dag-operation
      - resolve-operation-provider-chain
      - orchestration.task-create
      - assert-canonical-task-display-name
      - orchestration.worker-start-current-worktree-agent-qwen-code
      - terminal.rename
      - assert-canonical-terminal-title
      - orchestration.worker-show
      - attest-exact-effective-provider
    terminalName: "[Op] <operation> - <scope>"
    taskCardinality: one
    dispatchCardinality: one
    agentCardinality: one
    environmentBinding: current-runtime-by-omitting---on
  start-managed-operation:
    mode: orchestrated
    actor: workflow-coordinator
    sequence:
      - assert-expected-active-dag-operation
      - resolve-operation-provider-chain
      - orchestration.task-create
      - assert-canonical-task-display-name
      - orchestration.worker-start-current-worktree-with-resolved-model
      - terminal.rename
      - assert-canonical-terminal-title
      - orchestration.worker-show
      - attest-exact-effective-provider
    terminalName: "[Op] <operation> - <scope>"
  coordinator-instruction:
    actor: plan-coordinator
    recipient: workflow-coordinator
    sequence:
      - orchestration.send-type-escalation
      - workflow-coordinator-blocking-check-wakes
      - workflow-coordinator-routes-to-operation-when-needed
    forbiddenType: status
  operation-boundary:
    actor: operation-agent
    sequence:
      - orchestration.send-worker-result
      - idle
  accept-operation:
    actor: workflow-coordinator
    sequence:
      - validate-normalized-operation-output
      - orchestration.worker-release
      - orchestration.check-ack
      - schedule-ready-operation-or-report-workflow-boundary
  wait-workflow:
    actor: workflow-coordinator
    sequence:
      - orchestration.check-wait
    timeoutAction: rearm-only
  wait-plan:
    actor: plan-coordinator
    sequence:
      - orchestration.check-wait
    timeoutAction: rearm-only
forbiddenSequences:
  - external-chat-runs-plan-loop
  - plan-coordinator-calls-operation
  - workflow-coordinator-implements-op
  - qwen-op-uses-agent-tool
  - terminal-send-operation-prompt
  - dispatch-to-existing-terminal-operation
  - dispatch-inject-operation
  - unsupervised-operation-retain-as-success
  - infer-architecture-sidearm-from-review
  - create-task-before-dag-operation-admission
  - accept-operation-effect-before-provider-attestation
  - worker-start-with-literal-or-guessed-environment
  - workflow-child-with-null-or-wrong-parent-lineage
