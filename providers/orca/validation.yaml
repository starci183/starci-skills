schema: starci/orca-provider-validation@1
liveDiscovery:
  call: orca agent-context --json
  expectedSchemaVersion: 1
  compare:
    - command-count
    - command-name
    - usage
    - flags
    - positional-arguments
  onMismatch: stop-before-effects-and-request-runtime-contract-upgrade
preflight:
  - orca status --json
  - orca agent-context --json
  - orca skills get orca-cli --json
  - orca skills get orchestration --json
receipts:
  required:
    - run-id
    - task-id
    - dispatch-id
    - agent-terminal-handle
    - worktree-id
  qwenAdditional:
    - direct-native-worker-start-agent-qwen-code
    - no-terminal-create-qwen-command
    - supervised-worker-state-after-start
    - effective-qwen3.8-flash-model
  providerAttestation:
    source: orchestration.worker-show
    required:
      - exact-worker
      - active-task-id
      - effective-agent
      - effective-model
      - agent-terminal-handle
      - canonical-task-display-name
      - canonical-terminal-title
    onMismatch: fence-reconcile-release-and-retry-before-effect-acceptance
dispatchAssertions:
  - Operation equals the expected active DAG node before Task creation.
  - architecture.decide is admitted only by an active implementation secondary_request with reason sds-technical-gap and an explicit bounded SDS allowlist.
  - Review findings, suggestions and open questions never create architecture.decide.
  - Provider selection is resolved before launch and attested from worker-show before any effect is accepted.
  - Task display_name and terminal title both equal [Op] <operation> - <scope>; worker-task_<id> is never accepted as operation identity.
  - An operation is never dispatched to an existing terminal; only worker-start creates its supervised native agent.
uiAssertions:
  - Main terminal title equals [Coordinator] <Plan>.
  - Workflow child display name equals [Workflow] <Workflow>.
  - Workflow coordinator title equals [Coordinator] <Workflow>.
  - Operation title equals [Op] <operation> - <scope>.
  - Bash in the subtitle is accepted only as activity metadata beneath a native agent identity.
messageAssertions:
  - Coordinator-to-Workflow control instructions use type escalation.
  - Status messages are informational only and never carry a control instruction.
