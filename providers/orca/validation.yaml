schema: starci/orca-provider-validation@1
liveDiscovery:
  call: orca agent-context --json
  expectedSchemaVersion: 1
  compare:
    - command-count
    - command-name
    - usage
    - flags
    - positional-arguments
  onMismatch: stop-before-effects-and-request-runtime-contract-upgrade
preflight:
  - orca status --json
  - orca agent-context --json
  - node .dist/execution/orca-supervised-launch.mjs verify
  - orca skills get orca-cli --json
  - orca skills get orchestration --json
callContract:
  file: calls.json
  runner: execution/orca-calls.mjs
  envelope: starci/orca-call-result@1
  rules:
    - Every argv StarCi issues is built from calls.json; prose templates in index.json are documentation of the same calls, never a second construction path.
    - An Orca exit code 1 is a classified result with outcome and effectState; only a contract violation throws.
    - A mutation whose result is unknown is replayed once with --retry-request; a still-unknown result blocks fallback until a read-only reconciliation proves state.
    - Fallback to the next candidate requires effectState none, proven by settlement (worker-stop, worker-release released or already_released) when the failed attempt created a Dispatch.
receipts:
  required:
    - run-id
    - task-id
    - dispatch-id
    - agent-terminal-handle
    - worktree-id
    - parent-worktree-id
  qwenAdditional:
    - direct-native-worker-start-agent-qwen-code
    - no-terminal-create-qwen-command
    - supervised-worker-state-after-start
    - effective-qwen3.8-flash-model
  providerAttestation:
    source: orchestration.worker-show
    required:
      - exact-worker
      - active-task-id
      - effective-agent
      - effective-model
      - agent-terminal-handle
      - canonical-task-display-name
    onMismatch: fence-reconcile-release-and-retry-before-effect-acceptance
  titleCanonicalization:
    afterProviderAttestation:
      - terminal-rename-to-canonical-op-name
      - worker-show-verifies-canonical-title
    duringRuntime:
      classification: mutable-native-ui-metadata
      onDriftWithExactImmutableIdentity: recanonicalize-without-fencing
      effectDecision: never-reject-solely-for-runtime-title-drift
    beforeRelease:
      - terminal-rename-to-canonical-op-name
      - record-ui-defect-if-terminal-is-no-longer-writable
dispatchAssertions:
  - Workflow Monitors invoke execution/orca-supervised-launch.mjs start-op; they never compose task-create, worker-start, provider fallback or terminal naming calls themselves.
  - The launcher walks the resolved chain inside one invocation; a Monitor never re-invokes start-op for the same operation attempt to obtain a fallback.
  - A dead Workflow Monitor is replaced only through replace-monitor, which proves the old Dispatch is settled before starting the linked --retry-of attempt.
  - A workflow child is explicitly bound with worktree set --parent-worktree to the exact main Coordinator worktree and worktree show attests that parentWorktreeId before any operation Task is created.
  - A null, stale or wrong workflow-child parentWorktreeId stops dispatch; orchestration Task membership alone never substitutes for Orca worktree lineage.
  - Operation equals the expected active DAG node before Task creation.
  - architecture.decide is admitted only by an active implementation secondary_request with reason sds-technical-gap and an explicit bounded SDS allowlist.
  - Review findings, suggestions and open questions never create architecture.decide.
  - Provider selection is resolved before launch and attested from worker-show before any effect is accepted.
  - Task display_name equals [Op] <operation> - <scope> and is the immutable operation name; worker-task_<id> is never accepted as operation identity.
  - After provider attestation, terminal title is renamed and verified as [Op] <operation> - <scope> before effects are admitted.
  - A native activity-title drift during execution is mutable UI metadata; with exact Task, Dispatch, worker, agent and model identity it is recanonicalized rather than used to reject valid effects.
  - An operation is never dispatched to an existing terminal; only worker-start creates its supervised native agent.
  - Current-runtime worker-start omits --on; a named --on value is used only after live runtime inventory returns that exact environment id.
  - Literal or guessed environment labels such as windows are rejected before worker-start.
uiAssertions:
  - Main terminal title equals [Coordinator] <Plan>.
  - Workflow child display name equals [Workflow] <Workflow>.
  - Workflow Monitor title equals [Monitor] <Workflow>.
  - Operation title is canonicalized to [Op] <operation> - <scope> after native readiness and again before release.
  - Bash in the subtitle is accepted only as activity metadata beneath a native agent identity.
messageAssertions:
  - Coordinator-to-Workflow control instructions use type escalation.
  - Status messages are informational only and never carry a control instruction.
