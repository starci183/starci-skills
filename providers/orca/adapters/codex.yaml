schema: starci/orca-agent-adapter@1
agent: codex
kind: native-managed-agent
start:
  api: orchestration.worker-start
  agentArgument: codex
readiness: worker-start-receipt
roles:
  - plan-coordinator
  - workflow-coordinator
  - operation-fallback
name:
  api: terminal.rename
release:
  api: orchestration.worker-release
terminalFallback:
  when: orchestration.worker-start is unavailable or a plain-command lane is wanted
  command: codex
  bypassFlag: '--full-auto (or --ask-for-approval never --sandbox danger-full-access for full yolo)'
  bypassReason: Unattended lanes stall on per-tool permission menus; same rule as qwen --yolo / devin bypass mode.
  headless: 'codex exec "<prompt>" runs non-interactively.'
  note: 'codex self-update can leave the binary broken (observed 2026-09-20: TUI missing dist files → reinstall fixed). Probe `codex --version` before relying on it.'
verifiedAt: 2026-09-20
verifiedAgainst: 'codex v0.155.1'
forbidden:
  - shell-only-role
  - unsupervised-dispatch-inject-as-success
