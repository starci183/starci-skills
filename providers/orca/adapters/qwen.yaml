schema: starci/orca-agent-adapter@1
agent: qwen
kind: command-terminal-agent
model: qwen3.8-flash
modelAuthority: rendered-terminal-footer
why: |-
  Orca 1.4.188's native qwen-code adapter cannot deliver a Task prompt to Qwen Code 0.23.3
  (agent_prompt_stalled, agent_readiness timeout). A terminal created with the declared qwen command
  renders an input prompt within seconds, accepts the Task preamble through terminal send, and
  reports worker_done through the Dispatch context created by dispatch --return-preamble.
credentialRefresh:
  envKey: BAILIAN_TOKEN_PLAN_API_KEY
  reason: A running Orca process keeps the environment it started with; a stale copy of the key overrides the current value in the Qwen env file and yields HTTP 401. The terminal command unsets only that variable name so Qwen reads its own env file. No value is ever placed in a command, receipt or log.
  win32: 'Remove-Item Env:BAILIAN_TOKEN_PLAN_API_KEY -ErrorAction SilentlyContinue; '
  posix: 'unset BAILIAN_TOKEN_PLAN_API_KEY; '
readiness:
  screenPattern: 'Type your message'
  timeoutMs: 120000
  intervalMs: 5000
delivery:
  mode: file-reference-above-inline-limit
  maxInlineChars: 3000
  fileDirectory: .starciwork/_local/runtime
  fileName: orca-dispatch-<dispatch>.md
  prompt: '@<file> This file is your dispatched Task preamble and operation contract. Read it completely and follow every instruction in it exactly; report worker_done exactly once as it says.'
  reason: Qwen Code 0.23.3 crashes (V8 native stack) when a multi-kilobyte preamble is pasted through terminal send; a short @file reference delivers the same text through Qwen's own file reader.
submission:
  stagedPattern: 'Pasted Content'
  activityPattern: 'Thinking|esc to cancel|tokens'
  settleMs: 3000
  timeoutMs: 45000
  maxEnter: 2
modelMarker: qwen3.8-flash
approvalMode:
  working: yolo
  reasoning: yolo
  reason: |-
    Every Qwen operation runs unattended in an isolated child worktree under a contract allowlist, so both roles use
    yolo. Plan mode was rejected live (4.2): it asks for confirmation on every shell command, including the heartbeat
    send, so a review parked at "Allow execution of: 'orca'?" while its heartbeat stayed fresh. Auto mode was rejected
    earlier (OBS-27) for the same reason with a remote classifier. Write authority for a review is enforced by the
    contract allowlist and the Monitor's report validation, not by the provider's approval mode.
start:
  - api: terminal.create
    binding: declared-target-command-with-credential-refresh
  - api: terminal.read
    phase: readiness
  - api: orchestration.dispatch
    binding: return-preamble
  - api: terminal.send
    phase: submit
  - api: terminal.read
    phase: submission
  - api: orchestration.dispatch-show
    phase: assignee-attestation
release:
  api: orchestration.worker-stop
  then: terminal.close
forbidden:
  - qwen-agent-tool
  - provider-native-subagent
  - worker-start-agent-qwen-code
  - dispatch-inject
  - reuse-existing-terminal
  - unsupervised-retain-as-success
