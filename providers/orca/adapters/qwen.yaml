schema: starci/orca-agent-adapter@1
agent: qwen-code
kind: prewarmed-native-managed-agent
modelAuthority: qwen-runtime-configuration
requiredModel: qwen3.8-flash
launchCommand: qwen --exclude-tools agent
start:
  - api: terminal.create
  - api: terminal.wait
    condition: tui-idle
  - api: orchestration.worker-start
    binding: exact-terminal-handle
  - api: terminal.rename
readiness:
  - qwen-tui-idle
  - supervised-worker-receipt
release:
  api: orchestration.worker-release
forbidden:
  - qwen-agent-tool
  - provider-native-subagent
  - manual-prompt-send
  - dispatch-inject
  - return-preamble
  - unsupervised-retain-as-success
