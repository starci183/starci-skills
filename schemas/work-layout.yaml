schema: starci/work-layout@4
format: YAML 1.2
node: index.yaml
example: examples/todo-app/.starciwork
identity: >-
  The id is the identity. Every ref, dependsOn, proves, appliesTo and evidence pointer names an id and
  never a path, so a directory may be renamed without breaking a single edge. The directory nevertheless
  mirrors the id, and a disagreement between the two is a finding rather than a tolerated alias: two names
  for one thing is where a tree drifts apart silently, one rename at a time, with nothing to say which name
  was meant.

root: <bound-source-repository>/.starciwork

tree: |
  .starciwork/
    workspace.yaml                         the project and its repositories
    index.yaml                             the product catalog, one entry per feature
    brand/index.yaml                       at most one, the whole product's brand
    features/<feature>/index.yaml          the feature, aggregate only
        br/<name...>/index.yaml            + ac/<name>/index.yaml
                                           + evidence/<id>/manifest.yaml
        fr/<name...>/index.yaml
        nfr/<name...>/index.yaml
        data/<name...>/index.yaml
        journey/<name...>/index.yaml
        decision/<name...>/index.yaml
        sds/<name...>/index.yaml
        ui/<name...>/index.yaml
        impl/<repository>/<name...>/index.yaml
        uat/<name...>/index.yaml           + accounts.yaml
    shared/<family>/<name...>/             the same record shape, for a record no single feature owns
    ledger-anchor.json                     tracked, not hashed into Work
    runtime.sqlite, runtime.sqlite-wal, runtime.sqlite-shm       runtime custody, untracked
    kernel-evidence/ kernel-strays/ kernel-headless/ kernel-approvals/   runtime custody, untracked
    .gitignore                             names the untracked custody, so the split is readable

families:
  - {name: br, of: business rule, idPrefix: br}
  - {name: fr, of: functional requirement, idPrefix: fr}
  - {name: nfr, of: non-functional requirement, idPrefix: nfr}
  - {name: data, of: data definition, idPrefix: data}
  - {name: journey, of: customer journey, idPrefix: journey}
  - {name: decision, of: open policy decision, idPrefix: decision}
  - {name: sds, of: design component, idPrefix: sds}
  - {name: ui, of: screen, idPrefix: ui}
  - {name: impl, of: implementation, idPrefix: impl}
  - {name: uat, of: acceptance flow, idPrefix: uat}

shape:
  workspace: workspace.yaml
  catalog: index.yaml
  brand: brand/index.yaml
  brandAssets: brand/assets/**/<file-in-original-format>
  feature: features/<feature>/index.yaml
  record: features/<feature>/<family>/<name...>/index.yaml
  sharedRecord: shared/<family>/<name...>/index.yaml
  acceptanceCriterion: features/<feature>/br/<name...>/ac/<criterion>/index.yaml
  evidence: <record>/evidence/<id>/manifest.yaml
  uatAccounts: features/<feature>/uat/<name...>/accounts.yaml
  assets: <record>/assets/**/<file-in-original-format>
  ledgerAnchor: ledger-anchor.json
  runtimeLedger: runtime.sqlite plus its -wal and -shm siblings
  kernelCustody: kernel-evidence/ kernel-strays/ kernel-headless/ kernel-approvals/
  retiredLocal: _local/ - retired, untracked, read only as an import source by ledger-migrate

ids:
  record: <family>.<feature>.<name...>          # br.task.title.required at features/task/br/title/required
  sharedRecord: <family>.shared.<name...>       # br.shared.audit.trail at shared/br/audit/trail
  implementation: impl.<feature>.<repository>.<name...>   # impl.task.todo-app.list
  acceptanceCriterion: ac.<feature>.<rule-name...>.<criterion>   # ac.task.title.required.refuses-empty
  evidence: <directory name>                    # local to its record; the record names it by that name
  feature: <directory name>
  case: lowercase; a segment is a hyphenated word, never an underscore or a capital
  reserved: >-
    shared is not a feature name. shared/<family>/ occupies the same slot in an id that
    features/<feature>/ does, so a feature called shared would collide with every shared record.

rules:
  - >-
      One project owns one canonical .starciwork, in the repository its backend owns. A frontend, a service
      or an individual feature never opens a second one. The project name lives in workspace.yaml, never in
      a wrapper directory: .starciwork/<project>/ and .starciwork/business/ are not layouts, they are drift.

  - >-
      The directory is the record. Every record is one directory holding index.yaml, and everything that
      belongs only to that record lives inside it - its acceptance criteria, its evidence, its accounts, its
      assets. Nothing about a record is stored in a sibling index, a registry or a manifest elsewhere, so
      deleting the directory deletes the record and nothing else, and reading the directory reads all of it.

  - >-
      A directory between a family and a record is a grouping segment and carries no index.yaml. br/complete/
      exists because br.task.complete.once needed a place to be; it is a name, not a node, and it authors
      nothing. A leaf directory with no index.yaml is not a grouping segment, it is a record that lost its
      node.

  - >-
      Parents aggregate and author no state. The catalog, a feature index and any record that has records
      below it derive their progress from their descendants; they never carry state, proven, evidence or
      completion of their own. A parent that authors state is a second opinion about work it does not do.

  - >-
      Ten families, no eleventh. A feature directory holds its index.yaml and family directories from the
      fixed set; a new kind of record is a change to this layout, discussed once, not a directory someone
      creates on a Tuesday. A family directory with no record in it is scaffolding and is removed.

  - >-
      shared/ exists only for a record more than one feature is accountable for. One accountable feature
      means the record belongs under that feature and the others reference its id. Shared is not a shortcut
      for "I could not decide whose it is"; an unowned record has no one to fix it when it is wrong.

  - >-
      Acceptance criteria hang off business rules alone. ac/ is meaningful under br/ because a rule is the
      thing with a given/when/then; under any other family it is an unknown entry. Its id drops the family
      segment - ac.task.title.required.refuses-empty - because a criterion is named after its rule, and the
      rule is already a br.

  - >-
      Evidence is written by whoever ran the thing, and never by hand. <record>/evidence/<id>/manifest.yaml
      names the record it proves, the outcome, the assertions observed and the provenance: actor, tool,
      environment, the served versions and when. Its id is its directory name and the record names it.

  - >-
      Assets are payload, not nodes. An assets/ directory holds images, video, diagrams and sample documents
      in their original formats, at any nesting; nothing inside it is read as a record, a manifest, an
      account file or an instruction. An index.yaml under assets/ is a node hidden in the payload and is
      refused. Shared bytes have one owning record and are referenced by its id, never copied.

  - >-
      The root distinguishes three custodies, and a reader who knows nothing about the runtime can tell them
      apart. Canonical Work (workspace.yaml, index.yaml, brand/, features/, shared/) is tracked and hashed.
      The counter-record (ledger-anchor.json) is tracked and not hashed: it is the head a restored or
      rolled-back ledger is refused against. Runtime custody (runtime.sqlite and its -wal/-shm siblings, and
      the kernel-* directories) is untracked, never hashed and excluded from validation. .gitignore names
      the untracked half so the split survives a reader who only has the checkout. A root entry that is none
      of these is drift, and a runtime custody name anywhere below the root is runtime state smuggled into
      canonical Work.

  - >-
      Structured records are YAML. The one exception at the root is ledger-anchor.json, which is written and
      read by the runtime rather than by a person. Underscore-prefixed directories are not canonical Work.

  - >-
      Specification is upstream of code. br, fr, nfr, data, journey and decision say what must be true; sds
      says how it is designed; ui, impl and uat are where it is shown to work. Current code proves a record
      or exposes a gap, and never quietly becomes the record.

  - >-
      Agreed and demonstrated are separate facts in separate fields. state: done says a record is agreed and
      implementable; proven names the nodes that demonstrated it and when. An empty proven on a done record
      is honest. Collapsing the two into one word makes an agreed record indistinguishable from a proven
      one, and every claim in the tree then rests on a distinction nobody can check.

  - >-
      ui, impl and uat keep their own state. They are proof of a specification and assets with a lifetime of
      their own: an upgrade, a patch or a refactor is work on them while every specification stays correct.

  - >-
      All canonical content is English - prose, keys, ids, enum literals, field names and symbols. The
      language of the conversation never translates a specification.
