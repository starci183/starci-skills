schema: starci/work-layout@3
format: YAML 1.2
node: index.yaml
identity: stable metadata id; folder path is not identity
shape:
  workspace: workspace.yaml
  brand: brand/index.yaml
  brandAssets: brand/assets/**/<file-in-original-format>
  families: [br, ac, fr, nfr, data, journey, decision, sds, ui, impl, uat, contract, integration, gap, event]
  familiesNote: "The array above is the executable form of this shape block: every record lives in a flat
    family folder directly under its feature - features/<feature>/<family>/<name>/index.yaml - with no
    business/, architecture/, business/srs/ or architecture/sds/ segment anywhere. This replaced an earlier
    generation of this schema that documented a business/{overview,srs} plus architecture/{overview,sds}
    nesting; the real example tree and the gate that checks it (scripts/checks/check-example-work.mjs's own
    FAMILIES set) never used that nesting, and this file now states the shape both of them actually use.
    scripts/checks/check-example-work.mjs reads shape.families from this file at gate time and refuses
    (FAMILIES_DRIFT) the moment its own FAMILIES set and this list disagree, so the two cannot drift apart
    silently a second time."
  br: features/<feature>/br/<name>/index.yaml, schema work/business-rule. May carry appliesTo, module
    (a string or list of module-root directory paths - never individual files, see the owners note under
    implementation below) and blockedBy.
  ac: "features/<feature>/br/<rule>/ac/<name>/index.yaml, schema work/acceptance-criterion. Nested one
    level under the br it accepts rather than living in its own sibling family folder - an acceptance
    criterion has no identity apart from the rule it accepts. Authors rule (the owning br's id), given,
    when, then and carries no lifecycle state of its own (see rules, below, on which nodes author state)."
  fr: features/<feature>/fr/<name>/index.yaml, schema work/functional-requirement
  nfr: features/<feature>/nfr/<name>/index.yaml, schema work/non-functional-requirement
  data: features/<feature>/data/<name>/index.yaml, schema work/data
  journey: features/<feature>/journey/<name>/index.yaml, schema work/customer-journey
  decision: features/<feature>/decision/<name>/index.yaml, schema work/policy-decision
  sds: "features/<feature>/sds/<name>/index.yaml, schema work/sds-component - a logical component of the
    architecture map, tracing SRS paths through entry points, contracts, data, quality controls,
    deployment and verification. A done sds-component must carry owners: [{role, path}] naming at least
    one module-root directory that exists on disk (the read-scope boundary a design component describes
    is a module boundary, not a prose claim); a todo one without owners is warned, not refused, since the
    module a design targets may not exist yet."
  ui: "features/<feature>/ui/<name>/index.yaml plus <name>/assets/**, schema work/ui-screen. Per
    docs/kinds.md's lane order, drawing precedes implementing: a done work/implementation that names a
    ui-screen in its own proves, or whose repository is the workspace's frontend repository, is refused
    (IMPL_BEFORE_DIRECTION) unless every relevant ui-screen - the ones it proves, or, when it proves none
    by id, every ui-screen its own feature owns - is itself done."
  impl: "features/<feature>/impl/<repository>/<name>/index.yaml, schema work/implementation, one flat
    family folder per feature split by the repository the code lives in (<repository> is the exact value
    the record's own `repository` field names, e.g. impl/todo-app-backend/<name> beside
    impl/todo-app-frontend/<name> in a two-repository product) - never an `implementation/` singular
    parent with `frontend/`/`backend/` children, which no example tree or gate ever used. `owners: [{role,
    path}]` names one or more module-root directories, never individual files: `path` (and
    `work/business-rule.module`, and `work/sds-component.owners[].path` above) is the directory a reader
    would call the module's root - `src/modules/domain/task`, not
    `src/modules/domain/task/ownership.guard.ts` - so a file inside it moving during a refactor is not, by
    itself, a broken reference. A done implementation's every owner directory must exist on disk
    (OWNER_PATH_MISSING otherwise refuses it); a todo one is warned, not refused. A done implementation
    whose `proves` names a record that is not itself `state: done` is refused (PROVES_TARGET_NOT_DONE) -
    proof cannot outrun what it proves."
  uat: features/<feature>/uat/<name>/{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql,
    assets/,runs/<runId>/**} - see uatFlow/uatRun below for the exact shape.
  contract: features/<feature>/contract/<name>/index.yaml, schema work/contract - a synchronous
    request/response surface between a provider feature and a consumer feature; provenBy.provider/consumer
    each name the implementation(s) that proved their half.
  integration: features/<feature>/integration/<name>/index.yaml, schema work/integration - the one node a
    declared extensions.work3.integrations edge owes, proven only against the real external provider.
  gap: "features/<feature>/gap/<name>/index.yaml, schema work/gap. closedBy is a list of record ids (a
    bare string is accepted and normalised to a one-element list, for the many gaps that only ever needed
    one) - a gap reaches done only once every id in closedBy is itself done, because a gap whose statement
    named two missing things is not honestly closed by building one of them."
  event: features/<feature>/event/<name>/index.yaml, schema work/event
  assets: <node>/assets/**/<file-in-original-format> - payload organization beside a record's own
    index.yaml, never a Work node in its own right and never given an index.yaml.
  runs: <uat-node>/runs/<runId>/** - append-only UAT evidence; see uatRun below for the exact file set.
  derived: "_derived/{index.yaml,frontier.md} at the .starciwork root - GENERATED by
    scripts/example/example-derive.mjs, never authored by hand. Excluded from every record walk (it is not itself
    a record, has no id) and refused (scripts/checks/check-example-derived.mjs) the moment it goes stale against
    what is actually on disk, or the moment any real record authors a top-level usedBy/effectiveState/
    frontier field of its own."
  nodeAssets: <node>/assets/**/<file-in-original-format>
  uatFlow: "features/<feature>/uat/<flow>/{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql,assets/}.
    The flow's index.yaml declares entry, actor, an ordered steps[] (each an action, its expected
    business outcome and the observed-feedback checks that apply to it), fixtures, effects and
    cleanup, in uat.verify's own shape. accounts.yaml keeps its work/disposable-accounts schema and
    stays local/synthetic, but each entry now names {role, identity} (an _resources identity id)
    instead of a literal password; the literal-secret shape retired with this change."
  uatRun: "features/<feature>/uat/<flow>/runs/<runId>/{manifest.yaml,run-ledger.json,flows.json,
    ux-checks.json,walk.json,screens/*.png,videos/*,readback.json,cleanup.json,result.md} - the
    exact evidence file set uat.verify's writes.evidence names. Runs are append-only - a re-run adds
    a new runId, never edits a settled one. The flow's own evidence.yaml, beside its index.yaml,
    points at the run it settled on (a run field naming runs/<runId>). A uat-flow record reaches
    done only when that run has at least one file under screens/, at least one under videos/ and a
    result.md whose outcome is pass; until then the record stays todo and cites a
    gap.<feature>.live-proof record in blockedBy."
  designReview: Current br/fr/nfr/data/journey/decision/sds records use completion.review inside their
    owning index.yaml, without an evidence folder.
  evidence: Profiles using execution proof may retain <node>/evidence/<id>/manifest.yaml; this is not
    a required folder for every layer.
  workflowRunState: one SQLite file, .starciwork/runtime.sqlite (plus its -wal and -shm siblings),
    holding state, events, jobs, leases, goals, reports, contracts, checks, inbox, signals and owner inputs.
    Untracked. See ledger-db.md; .starciwork/_local is retired and is only an import source for ledger-migrate.
  workflowAnchor: .starciwork/ledger-anchor.json - TRACKED, the head of every live workflow, so a restored or
    rolled-back ledger is refused instead of resumed
  kernelCustody: .starciwork/{kernel-evidence,kernel-strays,kernel-headless,kernel-approvals}/** - kernel-owned
    working state with a real lifetime, untracked, excluded from Work validation, never canonical Work
  uiDirectionAsset: "features/<feature>/ui/<screen>/assets/<name>.png with a sibling
    <name>.prompt.txt under the same assets/. interface.draw writes both - the record's ui block
    (intent, surfaces, states, coverage {scale, representativeScreens, map}, accessibility,
    responsive, artworkSlots, observations, gaps) and, in assets/ui.assets, one entry per
    representative direction with role direction and a generation object (tool image_gen.imagegen,
    promptPath, inputRefs) beside the prompt file's own entry with role prompt and no generation. A
    model name is recorded only when the tool itself exposes one; it is never authored, and it is
    never the host that ran the tool (an Orca-hosted run is the host, not a field). A ui record
    reaches done only with at least one asset carrying generation and a coverage map that names
    every state the record's states list names. Until interface.draw has run, the record stays todo
    and cites a gap.<feature>.direction-not-drawn record in blockedBy - the image is a designed op
    output, not something an agent types into place."
  frontendCaptures: "features/<feature>/impl/<repository>/<name>/assets/<running-page-screenshot>,
    with a matching markup reference kept beside each capture. These assets never carry a
    generation record - that is what tells a capture and a direction apart regardless of prose
    provenance (see scripts/checks/render.mjs's capture-identity rule) - and a generation-bearing asset
    never sits outside a work/ui-screen record's own assets/."
  featureCatalog: features/index.yaml
  feature: features/<feature>/index.yaml
  resources: ".starciwork/_resources/{environments,identities,fixtures}/<name>/resource.yaml, schema
    work/resource (plain - see the op-vocabulary mapping below for why the op text says
    work/resource@1). uat.verify's reads.environment/reads.accounts/reads.fixtures and
    writes.resources resolve here: an environment resource names target/origins, owner,
    configuration revision, probes and allowedEffects; an identity resource names its provider,
    disposability and a custody ref into the repository's sealed secrets (never a secret value
    itself); a fixture resource names its schema/seed files, preconditions and run-owned namespace.
    A uat-flow's environment and fixtures[] fields, and its accounts.yaml's accounts[].identity
    field, are edges into this family and must resolve to a resource.yaml of the matching kind."
rules:
  - SRS and SDS are the upstream source of truth for every feature and are independent of source
    code. SRS owns required behavior and SDS owns target technical design. UI, implementation and
    UAT trace to them through stable IDs; current code may prove conformance or expose a gap, but
    never supplies or silently redefines either root.
  - "A business or architecture record carries two claims, and they are separate fields because they are
    separate facts. `state: done` says the record is agreed and implementable. `proven` - written by the
    kernel, naming the implementation, ui and uat nodes that demonstrated it, with the digest of the slice
    they demonstrated - says it has been shown to work. An empty `proven` on a done record is honest and
    expected: the specification is a skeleton that implementation completes. What is refused is the two
    collapsing into one word, because then a record that was agreed is indistinguishable from a record that
    was demonstrated, and the whole tree's credibility rests on telling those apart."
  - "Implementation, ui and uat keep their own state. They are evidence of a specification AND assets with a
    lifetime of their own: a dependency upgrade, a security patch or a refactor is work on them while every
    specification stays correct. Collapsing them into pure evidence of a record would leave nowhere to
    schedule that work except by suspending a specification that is not wrong."
  - "`proven` is counted, not merely stored: the ledger summary reports agreed and proven separately per kind,
    so the gap between a specification corpus and its demonstration is a number an owner reads rather than an
    inference. An unmeasured gap becomes the comfortable default."
  - "A product's brand is one record: brand/index.yaml at the tree root, a sibling of features/, with
    kind brand and its masters in brand/assets/**. At most one brand node exists per tree; a second
    one, or a brand node anywhere else, is refused. It is a decision kind, done only through a
    collocated completion.review that names the rev it settled, and its brand: key is the only place
    colour tokens, typography, mascot, logo, iconography, imagery, voice, motion and the product-wide
    don'ts are authored. Every design operation reads it instead of restating it, and the record names
    the real frontend token or component files its machine checks compare against."
  - "Frontend-facing nodes bind the brand implicitly: a ui node, an implementation or uat node with a
    frontend layout, and any node that names the brand in refs or dependsOn fold the brand's spec
    digest into their own inputDigest. A rev bump or a changed colour therefore suspends their
    completions; no authored edge per screen is required, and backend-only work is untouched."
  - One project owns one canonical .starciwork in its bound source repository. Its product catalog
    is features/index.yaml; every actual feature owns
    features/<feature>/{business,architecture,ui,implementation,uat}/ as applicable.
  - The project or repository name belongs in workspace metadata, not a wrapper directory. Do not
    author .starciwork/<project>/, .starciwork/business/ or .starciwork/features/business/.
    Individual features, FE, BE and services do not create another project workspace.
  - A shared rule, data definition, NFR or cross-feature journey has one accountable feature owner.
    Other features reference its stable ID rather than copy it or create a second product-level
    business tree. Parent indexes link to actual children and empty layers are not scaffolded.
  - Retained AI interface.draw images and real running-product screenshots both live under the bound
    backend .starciwork in their owning node assets/**. Identify generated design versus real
    capture and the actual capture environment; external/temp/chat-only media are not stored Work
    deliverables. Keep one owner and reference it across UI/implementation/UAT rather than copying
    bytes.
  - Each semantic scope folder has one index.yaml node and may contain further scope folders and
    optional assets/. The same recursive convention applies to Business, Architecture, UI,
    implementation/backend, implementation/frontend and UAT. Asset subfolders are payload
    organization, not Work nodes, and need no index.yaml. Keep small scopes flat; do not create
    empty template folders.
  - Split by independently owned questions and acceptance boundaries, not workflow stages. Names and
    depth stay flexible.
  - "Canonical index.yaml uses work/node@2 metadata. New Business has a readable businessOverview
    and a filesystem-split SRS under functional-requirements, non-functional-requirements,
    business-rules, data and customer-journeys. Detailed leaves carry extensions.work3.srs with a
    starci/srs-* section schema. Legacy cohesive starci/specification@2 remains readable; it is not a
    second copy of the split SRS."
  - Business/index.yaml aggregates overview/index.yaml and srs/index.yaml. Each FR leaf owns its actors,
    trigger, main/alternative/exception flows, postconditions, refs and acceptance in the same file.
    NFR, rule, data, decision and journey leaves remain separate addressable owners and link through
    stable semantic IDs. Parent indexes aggregate; they never repeat descendant detail.
  - Create a detailed child only for an actual FR, NFR, rule, decision, data definition or journey.
    Further folders may group large scopes, but each parent still owns only aggregate metadata.
  - "Only leaves author state: uninvestigate, todo or done. todo is confirmed incomplete work and requires no
    investigation receipt. done is the only state that requires bound proof. activity is auxiliary: idle,
    investigating, implementing or verifying. blockers[] explains impediments without becoming lifecycle
    state. Parents author no state or completion and derive progress from required descendants."
  - "Authored state is a claim; effective state is the runtime's computation, and they are deliberately not the
    same field. A node whose bound input changed keeps `state: done` with its completion, its evidence and its
    history intact, and the validator derives `effectiveState: suspended` with a reason. Historical proof is
    never rewritten to say the work was not done - it was; what changed is the input it was proved against."
  - "Authored `suspended` is a different word for a different thing - imported or unapproved scope, which
    carries a suspensionReason and never satisfies a prerequisite. The two meanings must not be merged: a
    re-verification of proven work and an unapproved import are opposite situations, and one word for both
    would schedule each as the other."
  - "A derived state still needs a lane. A node with `effectiveState: suspended` is currently skipped by every
    scheduling filter, because they admit `state === 'todo'` alone - so an input-changed node keeps its proof
    and is never re-verified. The lane admits the derived signal, tagged as re-verification against the changed
    input, and the work it schedules is never re-authoring."
  - When investigation occurs, investigation.contextDigest binds semantic context, excluding child
    rollup and auxiliary activity, blockers and history. A semantic parent change makes every
    affected descendant effectively uninvestigate while preserving stored done, completion, history
    and evidence.
  - "dependsOn uses stable node IDs; refs bind semantic inputs without implying execution order. An edge
    records the digest of the slice it bound, so a change invalidates exactly the dependents that bound the
    changed slice - one hop, at the edge. Invalidation is not transitive: a dependent whose own bound slice
    did not change stays as it is, and a root edit therefore cannot suspend a subtree that never read the
    part that moved. Where a dependent is genuinely affected it becomes suspended, keeping its proof."
  - Done is a current status, never an edit lock. Authorized revisions may edit the node and its
    owned assets. Re-evaluate changed inputs and affected dependents; never copy stale completion
    onto changed content. Preserve unrelated work and useful media. New required work prevents
    parent done; unrelated completed branches remain intact.
  - "Freshness reports keep three conditions distinct: source drift means current implementation no
    longer matches an implementation completion's sourceIdentity; evidence invalidation means a
    canonical semantic digest or required proof changed; unavailable input means a required
    repository, revision, asset, tool or proof cannot be resolved. Unavailability blocks an
    observation without rewriting state or guessing drift. Current code never becomes SRS/SDS truth."
  - "Impact follows declared semantic edges and the canonical digest model: ancestor specifications,
    child aggregation, refs, dependsOn, typed SRS/SDS links, resources and implicit frontend brand
    binding. A shared aggregate constraint can legitimately affect several branches; directory
    proximity or an unrelated SRS sibling edit cannot create a global invalidation on its own.
    Reports name the owner, edge and cause and never alter hash policy."
  - Declare semantic design/source files using node.assets with paths under own assets/. Their exact
    bytes contribute to semantic context; conservative hashing does not ignore presumed typo-only
    edits.
  - "Record output screenshots/videos in evidence assets with scope: node and paths under the
    primary owner assets/. Output evidence is not also declared as a semantic input, avoiding
    self-invalidating proof."
  - Source code remains in bound repositories; code/index.yaml tracks requirements, exact source
    references and completion.
  - All structured Work records and results use YAML. JSON and underscore-prefixed directories are
    rejected in canonical records, except workspace-root _local for excluded execution state and
    workspace-root _resources for typed resource.yaml custody plus declared opaque or encrypted payloads;
    central schemas stay in .claude.
  - Repository and environment provenance is written directly in sourceRefs or the owning module
    record. refs and dependsOn remain stable technical node IDs for digest propagation.
  - "UAT accounts.yaml uses schema work/disposable-accounts (the example tree's own convention; the
    legacy work/disposable-accounts@1 shape in work.schema.yaml embedded a literal username/password
    pair per entry, which is refused now that _resources/identities/** exists). Each entry is
    {role, identity: <_resources identity resource id>} - a sealed ref, never a synthetic password
    written into the flow's own tree. Images and video remain original binary assets."
  - "Direction, capture and run are three different outputs and never share a shape. interface.draw's
    generated direction is a ui-owned {path, role: direction, generation: {tool: image_gen.imagegen,
    promptPath, inputRefs}} asset with its exact prompt kept as a sibling {role: prompt} asset; a
    model name is recorded only when the tool exposes one, never authored, and never the host (an
    Orca-run image step is the host, not a generation field). frontend.implement's implementation
    capture is a real running-page screenshot under implementation/frontend/assets/ with a matching
    markup reference and never a generation record. uat.verify's run is the append-only
    uat/<flow>/runs/<runId>/ evidence file set the op's writes.evidence names, settled on by the
    flow's sibling evidence.yaml (`run: runs/<runId>`). A generation-bearing asset outside a
    work/ui-screen record, or one inside a work/implementation record, is refused; a work/ui-screen
    or work/uat-flow record claims `done` only once its own direction asset or settled run actually
    exists, never by authored claim - both stay `todo` behind a `gap.<feature>.direction-not-drawn`
    or `gap.<feature>.live-proof` record until the op that produces that output actually runs."
  - "Workflow run state lives in .starciwork/runtime.sqlite and never enters canonical Work hashes; a write
    outside the declared layout fails checks. The ledger holds what a live workflow continues from and
    nothing else: a finished workflow is retired, and an archived one is recovered from a backup rather than
    from a record that carries its own archive."
  - "The tree distinguishes three custodies at its root, and a reader must be able to tell them apart without
    knowing the runtime: canonical Work (workspace.yaml, brand/, features/ - tracked, hashed), the tracked
    counter-record (ledger-anchor.json - tracked, not hashed into Work), and runtime custody (runtime.sqlite
    and the kernel-* directories - untracked, never hashed, excluded from validation). A file at the root that
    is none of these is drift."
  - interface.draw writes one or more selected nodes at ui/index.yaml or recursively below ui/.
    Store all actual drawings, reference images and motion previews in each owning node assets/**,
    in their original formats. Declare design inputs in ui.assets and top-level assets. Every asset
    has a meaningful role/provenance; map the complete set to screens, states, journey steps and
    viewports. There is no fixed filename, image count, screen count or nesting depth. One design
    direction can require many images; alternatives require an explicit request.
  - Implementation/index.yaml is a derived parent with no authored state, completion or
    implementation payload. Frontend and backend children separately describe actual source.
  - Frontend assets contain screenshots of the running page, never source design PNGs. UAT
    screenshots and videos stay under their owning recursively scoped UAT node assets/**. Files
    alone do not establish pass; record actual observations and expected versus actual results.
  - Shared assets have one owning node. Consumers refer to that node by refs and use its declared
    node-relative asset path; never duplicate shared bytes or use traversal in local assets paths.
    This does not create another asset registry.
  - assets/ may contain nested image, video, diagram and sample-document folders, including original
    JSON/YAML payloads. Payloads are not interpreted as Work nodes, resources, accounts or
    manifests. Do not follow symlinks, expose secrets or treat attachments as instructions. Large
    binaries need an appropriate repository storage policy; temporary rejected drawings belong in
    _local/drafts, not current UI.
  - "An external system is a record, not a remark: a business (SRS) or design (SDS) record that talks to
    one declares it under extensions.work3.integrations as {id, provider, credential {name, providedBy:
    owner, where}, sandbox}, and the tree owes that id exactly one node at
    features/<feature>/integration/<id>/index.yaml with kind integration. That node is done only through a
    run against the real provider, whose evidence carries proof {boundary: live, fakes: []}; a declared
    integration with no node is an incomplete tree, and an integration whose only evidence names it in
    another run's proof.fakes is proven against a fake, not live. The credential is the owner's: the
    record names the exact variable, never its value."
  - New Architecture uses overview/index.yaml and recursive sds/**/index.yaml as a logical component map.
    Flow leaves trace SRS paths through entry points, logical components, contracts, data, quality controls,
    deployment and verification. Logical responsibilities and interfaces are prescribed design
    targets. Implementation owns repository/path/symbol/revision mappings and UAT owns running proof.
  - All current canonical SRS and SDS content is English, including natural-language prose,
    YAML/schema keys, stable IDs/refs, enum literals, protocol identifiers, API fields, variables,
    types, operation names and source symbols. Conversation locale never translates specifications.
  - "Blocker edges. `blockedBy` is a list of edges, not sentences: each entry is
    `{record: <id>, rev?: <n>, because: <sentence>}`. `record` names an id some record in the tree
    actually owns; `rev` is the blocking record's `change.rev` at the moment the blocker was authored,
    and is omitted only when the blocker does not depend on a particular revision holding. A blocker
    whose target has since reached `state: done` at a `change.rev` greater than or equal to the cited
    `rev` (or at any rev, when none was cited) is stale: the thing that was supposed to unblock it has
    happened, and citing it further would go silently out of date. The gate refuses a stale blocker and
    refuses a `record` that does not resolve. Prose that is not really about a record - an absence with
    no owner - is not authored as `blockedBy` prose; it is a `gap` record (below), and `blockedBy` points
    at its id like any other."
  - "Blockers form a DAG, and a cycle in it is refused outright (BLOCKER_CYCLE): nothing can honestly wait
    on something that is itself waiting on it, so a `blockedBy` chain that reaches back to a record already
    on its own walk is a structural impossibility, not a fact about the work. A chain's real root - the
    reason nothing further needs authoring - is a `work/gap` or an open `work/policy-decision`
    (`outcome: open`); a chain that dead-ends at an ordinary record instead (neither cyclic nor gap/open-
    decision rooted) is warned rather than refused (BLOCKER_UNROOTED), because forcing a gap to be authored
    for every such dead end in one pass would be a larger sweep than any single change should make - the
    warning names the actual unrooted target so the fact stays visible until a gap is written for it."
  - "Known absences are records, not restated prose. `work/gap` lives at
    `features/<feature>/gap/<name>/index.yaml`, id `gap.<feature>.<name>`, and carries `state: todo|done`
    and a plain `statement` of the fact that is missing - an event nobody emits yet, a field no data
    record declares, a module that has not been written under the stack the project is moving to. An
    optional `closedBy: <record id>` names the record whose completion actually closes the gap, so a
    reader can tell an open absence from one already scheduled to close. `blockedBy` and `conflictsWith`
    point at a gap's id exactly as they would at any other record, so the same absence is named once and
    every dependent points at that one name instead of restating it."
  - "Pairwise conflicts, and the sibling for sets. `conflictsWith` stays a list of
    `{record: <id>, rev?: <n>, because: <sentence>}` for two records that currently cannot both be true.
    The gate resolves `record` and, when `rev` is cited, refuses a mismatch against the target's current
    `change.rev`. Three or more records that are each individually true and jointly unsatisfiable are not
    a chain of pairwise conflicts; they are a set only the settling decision can resolve, so `tension:
    {records: [<id>, <id>, ...], statement: <sentence>}` is authored on the `work/policy-decision` record
    that owns settling them, and refused anywhere else. The gate requires every id in `records` to resolve
    and at least two of them."
  - "A decision's vocabulary is closed. `work/policy-decision` authors `outcome: open | decided`,
    `options: [{id, consequence, summary?}]`, `chosen?: <option id>` (required exactly when
    `outcome: decided`, and refused unless it names an id present in `options`), and an optional
    `blocks: [<record id>]` naming what the decision's settling unblocks. A decision does not invent its
    own outcome vocabulary by writing the chosen option's id (or any other free-form word) directly into
    `outcome`, and it does not carry a `targetModule` or similar ad hoc pointer to where the decision will
    eventually be implemented - that belongs to the `implementation` record that later proves it, not the
    decision."
  - "Change is authored, staleness is derived, and neither is folklore. `change: {rev, kind:
    initial|editorial|clarifying|breaking, at, withdraws?: [<exact statement>], retains?: [<exact
    statement>], reason?}` records one authored edit; `withdraws` names statements this rev removes
    verbatim and `retains` names statements an editorial pass keeps verbatim, so a change that removes
    half a sentence is not forced to withdraw the whole thing to be honest about what moved. On
    `work/evidence`, `stale?: true`, `staleSince?: {record: <id>, rev?: <n>}` and `staleReason?` say a
    passed run no longer speaks for the record beside it. The digest that decides this is the kernel's
    own: sha256 of the record's `index.yaml` file bytes, exactly as `kernel/reconciliation.mjs`'s
    `recordDigests`/`nodeFileOf` compute it for reconciliation. An `evidence.yaml` whose `recordDigest`
    does not equal that digest, computed now, must carry `stale: true`; the gate refuses one that does
    not. Staleness is never cleared by editing `recordDigest` to match - only a fresh run, which is a
    kernel act, retires it."
  - "`work/evidence`'s `provenance.actor` names who ran the assertions, and the value is a claim that must
    be true, not a label of convenience. `starci-kernel` means a live kernel workflow's own
    `ctx.work.api.markDone` write settled the record, re-running the checks itself. `example-evidence`
    means `scripts/example/example-evidence.mjs` produced the file by actually running the given commands outside
    any kernel workflow, against one of the example trees - a real run, with a real recordDigest, just not
    one a kernel operation performed. Neither actor authors `state` on the record beside it; only a
    person or a kernel operation does that."
  - "Done means proven or says so. A record with `state: done` needs a sibling `evidence.yaml`, or an
    authored `verificationSource: authored-claim` with a `because:` sentence saying why no run proves it.
    `work/data`, `work/brand` and `work/policy-decision` are authored claims by nature - a data shape, a
    brand token or a settled decision is true because it was written down and agreed, not because a test
    ran - so the gate treats every `done` record of those three schemas as satisfying this rule without
    the declaration being repeated on each one. Every other schema needs the evidence file or the explicit
    declaration; the gate refuses a `done` record of any other schema that has neither."
  - "A rule may constrain a record it does not own. `work/business-rule` and `work/sds-component` may
    carry `appliesTo: [<record id>]`, an outbound edge naming a record - owned by any feature - that the
    rule's or component's requirement reaches even though the rule does not own it and does not edit it.
    The gate only resolves the ids; it does not require the target to acknowledge the edge back. The
    derived consequence is one sentence: a `done` record that acquires an `appliesTo` edge newer than its
    proof reads as `effectiveState: suspended` until it is re-proven against the new constraint, the same
    way a changed input suspends a record that read it. `appliesTo` is refused on any other schema -
    `work/data` in particular does not carry it, because a data record's relationship to the rules it
    embodies is `refs`, an inbound reading, not an outbound constraint on a record it does not own."
  - "Events are a family; data may extend data; time may trigger. `work/event` lives at
    `features/<feature>/event/<name>/index.yaml`, id `event.<feature>.<name>`, and authors `producer: <record
    id>` (the record whose flow raises it), `payload: [{name, type, note?}]` and `delivery: {guarantee:
    at-least-once|at-most-once|exactly-once, ordering: none|per-key|total}`. A consumer declares
    `subscribes: [<event id>]`, each id resolving to a `work/event` record; `work/contract` remains for a
    synchronous request/response surface and is not overloaded to describe a fire-and-forget signal. On
    `work/data`, `extends?: <data id>` names a base data record this one specializes, with `adds: [<field
    definition>, ...]` listing only the fields the base does not already declare - the shared fields are
    inherited, not repeated as a fresh disagreement about the base's shape. On `stateMachine.transitions[]`,
    `on` may be the plain string it always was, or `{timer: <duration or plain-language description>}` when
    what actually fires the transition is a clock, not an event - a digest window closing, a scheduled
    tick - and the gate accepts either shape."
  - "Implementation names owners, plural. `work/implementation` authors `owners: [{role, path}]` - each
    entry the path of one real or intended artifact and the role it plays (`module`, `route`, `entry`,
    `block`, or another short word naming the kind of unit) - because one screen or one flow can span more
    than one owned artifact (a route adapter, a feature entry, a connected block and its pure twin) and a
    single `directory`/`files` pair cannot name more than one shape at a time. `work/business-rule.module`
    may be a plain string, for the ordinary one-module case, or a list of strings when the rule's module
    genuinely spans more than one path. The gate refuses `directory`/`files` on `work/implementation`; that
    shape is retired in favor of `owners`, and the gate refuses an `owners` entry missing either `role` or
    `path`."
  - "Two topologies host the same record tree. In a multi-repository product, `.starciwork` lives in the
    bound backend repository and `.workspaces/projects/<project>/{be,fe}.json` at the host routes each side
    to its repository and its `architecture.json` roots (`examples/todo-app-backend` paired with
    `examples/todo-app-frontend` demonstrates this shape). In a monorepo, `.starciwork` lives at the
    repository root and `architecture.json` names `apps/*`/`packages/*` as its roots instead of a second
    repository. Both host the identical `features/<feature>/{business,architecture,ui,implementation,uat}`
    tree; only where `.starciwork` sits and how its roots are declared differ, and a project does not run
    both shapes for the same product at once."
opVocabularyMigration:
  schema: starci/op-vocabulary-migration@1
  statement: "The layout above is the current one; a real subset of ops/*/operator.yaml still reads and
    writes the vocabulary an earlier layout generation used. This section states the migration contract -
    what an op's old path/field means in the current layout - as a fact a future session can act on. It
    does not touch anything under ops/, ops/*/secondary.yaml or ops/registry.yaml: retargeting an
    operator's reads/writes is the kernel-refactor lane's decision, not this one's, and editing operator
    text out from under it would race that work."
  method: "Grep-verified against this checkout's ops/*/operator.yaml, 2026-09-18: an op counts as affected
    when it names the literal path `.starciwork/<business>/business/**` or
    `.starciwork/<business>/architecture/**`, or writes the node@2 completion fields
    `completion.inputDigest` and `completion.evidence` together. 24 of this checkout's 30 registered ops
    (ops/registry.yaml) match at least one condition; the owner's own estimate was 21 of 38, which this
    session could not reproduce from ops/registry.yaml's actual 30 entries - the gap between 21/38 and
    24/30 is reported rather than silently reconciled."
  affectedOps:
    - architecture.decide
    - backend.implement
    - brand.decide
    - business.decide
    - code.refactor
    - content.generate
    - e2e.verify
    - integration.verify
    - interface.draw
    - interface.implement
    - perf.verify
    - release.deliver
    - review.verify
    - security.verify
    - test.author
    - uat.verify
    - docs.author
    - goal.revise
    - grammar.update
    - knowledge.repair
    - runtime.operate
    - scope.define
    - scope.retire
    - workspace.manage
  pathMappings:
    - opPattern: .starciwork/<business>/business/**/index.yaml
      layoutPath: features/<feature>/business/{overview/index.yaml,srs/**/index.yaml}
      note: The op text names one flat business tree per <business> slug; the current layout splits it
        per feature into an overview and a filesystem-split SRS (functional-requirements,
        non-functional-requirements, business-rules, data, customer-journeys). An op reading the old
        pattern must instead read every features/<feature>/business/** the request's scope selects.
    - opPattern: .starciwork/<business>/architecture/**/index.yaml
      layoutPath: features/<feature>/architecture/{overview/index.yaml,sds/**/index.yaml}
      note: Same split, on the architecture side - one SDS overview plus recursive sds/**/index.yaml
        components per feature, instead of one flat architecture tree per business slug.
  fieldMappings:
    - node2Field: state
      layoutField: state (leaf only)
      note: node@2 allowed {uninvestigate, todo, doing, blocked, done, na, suspended} authored directly.
        The current layout narrows authored leaf state to {uninvestigate, todo, done}; doing/blocked
        become the operational `activity`/`blockers[]` fields, na is dropped (an inapplicable node is
        not created rather than marked na), and suspended is now `effectiveState`, a value the runtime
        derives, never one an op authors onto the node.
    - node2Field: blocker
      layoutField: blockedBy[] or blockers[]
      note: node@2's single free-text `blocker` string collapsed a structural dependency and a
        transient operational impediment into one field. The layout splits them - `blockedBy` is a
        list of {record, rev?, because} edges at another record the gate resolves and checks for
        staleness; `blockers[]` stays a plain operational string list for a non-structural impediment
        (an unavailable tool, a pending owner answer) with no target record to point at.
    - node2Field: completion.inputDigest
      layoutField: (none authored) - the kernel computes it
      note: "node@2 authored an inputDigest binding onto the node itself. The current layout computes
        this from a record's own index.yaml bytes at read time (sha256, the same digest
        kernel/reconciliation.mjs's recordDigests/nodeFileOf takes) and compares it against
        evidence.yaml's authored recordDigest; a mismatch requires stale: true on the evidence
        rather than a fresh inputDigest authored back onto the node."
    - node2Field: completion.evidence
      layoutField: sibling evidence.yaml, or verificationSource + because
      note: "node@2 nested evidence under the node's own completion key. The current layout keeps
        evidence as a sibling file (features/<feature>/<family>/<name>/evidence.yaml, schema
        work/evidence) beside the record's index.yaml, or, for work/data, work/brand,
        work/policy-decision and any record whose done is genuinely an authored claim,
        verificationSource: authored-claim plus a because: sentence instead of a run."
  uatSpecificMappings:
    - opField: "uat.verify writes.resources: work/resource@1"
      layoutField: work/resource (no @N)
      note: The op text's own written content names schema work/resource@1 for
        .starciwork/_resources/{identities,fixtures}/<name>/resource.yaml. This layout's `resources`
        shape entry (above) authors plain work/resource instead - the owner has forbidden the @N
        suffix on this family specifically. The op text is not edited to match; this row is the
        record of the discrepancy until the kernel-refactor lane resolves which side moves.
