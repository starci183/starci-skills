$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/workflow-amendment.schema.json
title: Authorized same-workflow amendment
description: >-
  Binds a real owner grant and a separate coordinator application decision to an existing frozen workflow
  identity. It supplements the approved goal without rewriting its approval digest, history, evidence or effects.
type: object
additionalProperties: false
required: [schema, workflowId, baseGoalIdentity, authority, coordinator, changes]
properties:
  schema: {const: starci/workflow-amendment@1}
  workflowId: {type: string, minLength: 1}
  baseGoalIdentity: {type: string, minLength: 1}
  authority:
    type: object
    additionalProperties: false
    required: [actor, source, statement]
    properties:
      actor: {const: owner}
      source: {$ref: '#/$defs/source'}
      statement: {type: string, minLength: 1}
  coordinator:
    type: object
    additionalProperties: false
    required: [actor, source, decision, rationale]
    properties:
      actor: {const: coordinator}
      source: {$ref: '#/$defs/source'}
      decision: {const: apply-same-id}
      rationale: {type: string, minLength: 1}
  changes:
    type: object
    additionalProperties: false
    required: [clarifications, effectCeiling]
    properties:
      clarifications: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      addScope: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      scopeBindings:
        type: object
        additionalProperties: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      addDefinitionOfDone: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      supersedeDefinitionOfDone:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, minLength: 1}
            to: {type: string, minLength: 1}
      operationFindings:
        type: object
        additionalProperties: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      operationEffects:
        type: object
        additionalProperties: {$ref: '#/$defs/effectCeiling'}
      addOperations:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/operation'}
      operationDependencies:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
      supersedeOperationChecks:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          items: {$ref: '#/$defs/checkReplacement'}
      effectCeiling:
        $ref: '#/$defs/effectCeiling'
$defs:
  operation:
    type: object
    additionalProperties: false
    required: [id, kind, goal, ledgerIds, allowlist, references, checks, acceptance, dependsOn]
    properties:
      id: {type: string, minLength: 1}
      kind:
        enum: [provision.ask, e2e.verify, frontend.implement, backend.implement, runtime.operate, uat.verify, integration.verify, review.verify]
      operation: {enum: [stales, lint]}
      goal: {type: string, minLength: 1}
      ledgerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      allowlist: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      references: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      checks:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, command]
          properties:
            name: {type: string, minLength: 1}
            command: {type: string, minLength: 1}
      acceptance: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      dependsOn: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    allOf:
      - if:
          properties:
            operation: {}
          required: [operation]
        then:
          properties:
            kind: {const: review.verify}
  checkReplacement:
    type: object
    additionalProperties: false
    required: [from, to, reason]
    properties:
      from: {$ref: '#/$defs/check'}
      to: {$ref: '#/$defs/check'}
      reason: {type: string, minLength: 1}
  check:
    type: object
    additionalProperties: false
    required: [name, command]
    properties:
      name: {type: string, minLength: 1}
      command: {type: string, minLength: 1}
  effectCeiling:
    type: object
    additionalProperties: false
    required: [paths, resources, external]
    properties:
      paths: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      resources: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      external: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
  source:
    type: object
    additionalProperties: false
    required: [threadId, messageId, messageIdAvailability, quote, assurance, at]
    properties:
      threadId: {type: string, minLength: 1}
      messageId: {type: [string, 'null']}
      messageIdAvailability: {enum: [available, not-exposed]}
      quote: {type: string, minLength: 1}
      assurance: {const: conversation-context-not-authenticated}
      at:
        description: Native event time, or null when that timestamp is not exposed; appliedAt records runtime application separately.
        type: [string, 'null']
        format: date-time
