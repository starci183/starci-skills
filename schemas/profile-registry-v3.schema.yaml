$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/profile-registry-v3.schema.json
title: StarCi profile registry v3
type: object
required: [schema, runtimes, aliases, executionModes, defaults, targets, skills, operators, fallback]
properties:
  schema: {const: starci/profile-registry@3}
  runtimes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  aliases:
    type: object
    additionalProperties: {type: string, minLength: 1}
  executionModes:
    type: object
    additionalProperties: false
    required: [solo, orchestrated]
    properties:
      solo:
        type: object
        additionalProperties: false
        required: [hosts, workers, worktree, scheduling]
        properties:
          hosts:
            const: [codex, claude]
          workers: {const: 1}
          worktree: {const: isolated-single}
          scheduling: {const: sequential}
      orchestrated:
        type: object
        additionalProperties: false
        required: [controlPlane, workers, worktree, scheduling]
        properties:
          controlPlane: {const: orca}
          workers:
            const: [codex, claude, qwen]
          worktree: {const: isolated-per-worker}
          scheduling: {const: dependency-dag}
  defaults: {type: object}
  targets:
    type: object
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/target"}
  skills: {type: object}
  operators:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [skill, chain, environments]
      properties:
        skill: {type: string, minLength: 1}
        chain:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        environments:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [environment, profiles]
            properties:
              environment: {type: string, minLength: 1}
              profiles:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
  fallback:
    type: object
    additionalProperties: false
    required: [allowedReasons, requiredEffectState, blockedReasons]
    properties:
      allowedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      requiredEffectState: {const: none}
      blockedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
$defs:
  model:
    type: [string, "null"]
    minLength: 1
  target:
    type: object
    additionalProperties: false
    required: [runtime, profile, requestedModel, orcaLaunch]
    properties:
      runtime: {type: string, minLength: 1}
      profile: {type: string, minLength: 1}
      requestedModel: {$ref: "#/$defs/model"}
      orcaLaunch:
        oneOf:
          - type: object
            additionalProperties: false
            required: [kind, agent]
            properties:
              kind: {const: managed-agent}
              agent: {type: string, minLength: 1}
          - type: object
            additionalProperties: false
            required: [kind, command, dispatch]
            properties:
              kind: {const: command-terminal}
              command: {type: string, minLength: 1}
              dispatch: {const: return-preamble-and-send}
