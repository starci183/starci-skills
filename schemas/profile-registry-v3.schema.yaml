$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/profile-registry-v3.schema.json
title: StarCi profile registry v3
type: object
required: [schema, runtimes, aliases, executionModes, agentArchitecture, defaults, targets, skills, operators, fallback]
properties:
  schema: {const: starci/profile-registry@3}
  runtimes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  aliases:
    type: object
    additionalProperties: {type: string, minLength: 1}
  executionModes:
    type: object
    additionalProperties: false
    required: [solo, orchestrated]
    properties:
      solo:
        type: object
        additionalProperties: false
        required: [hosts, controlPlane, operationAgent, maxConcurrentOperationAgents, isolation, worktree, scheduling, fanOutWithinOperation]
        properties:
          hosts:
            const: [codex, claude, orca]
          controlPlane: {const: current-chat-session}
          operationAgent: {const: isolated-background-agent}
          maxConcurrentOperationAgents: {const: 3}
          isolation: {const: isolated-per-operation}
          worktree: {const: current-session-worktree}
          scheduling: {const: dependency-dag}
          fanOutWithinOperation: {const: forbidden}
      orchestrated:
        type: object
        additionalProperties: false
        required: [controlPlane, bootstrapHosts, bootstrapRole, coordinatorAgent, coordinatorAuthority, workers, workflowWrapperAgent, workflowManagerAuthority, workflowManagerReportsTo, workflowManagerExecutionPolicy, higherLayerSubstitution, operationAgent, maxConcurrentOperationAgents, isolation, worktree, scheduling, fanOutWithinOperation]
        properties:
          controlPlane: {const: orca}
          bootstrapHosts: {const: [codex, claude, orca]}
          bootstrapRole: {const: create-native-coordinator-and-handoff}
          coordinatorAgent: {const: persistent-native-agent-in-main-worktree}
          coordinatorAuthority: {const: owns-plan-run-and-dag}
          workers:
            const: [codex, claude, qwen]
          workflowWrapperAgent: {const: persistent-native-manager-agent-in-child-worktree}
          workflowManagerAuthority: {const: owns-operation-dag-and-boundary-loop}
          workflowManagerReportsTo: {const: parent-coordinator}
          workflowManagerExecutionPolicy: {const: decision-dispatch-wait-only}
          higherLayerSubstitution: {const: forbidden}
          operationAgent: {const: supervised-native-agent-in-workflow-worktree}
          maxConcurrentOperationAgents: {const: 3}
          isolation: {const: isolated-per-operation}
          worktree: {const: isolated-child-per-workflow-attempt}
          scheduling: {const: dependency-dag}
          fanOutWithinOperation: {const: forbidden}
  agentArchitecture:
    type: object
    additionalProperties: false
    required: [levels, flexibleLayers, isolationBoundary, wrapperResponsibilities, operationMapping, concreteAgentBinding]
    properties:
      levels:
        const: [plan, coordinator, workflow-wrapper, operation-wrapper-agent, concrete-operation-agent]
      flexibleLayers:
        const: [plan, coordinator, workflow-wrapper]
      isolationBoundary: {const: operation}
      wrapperResponsibilities:
        const: [resolve-dependencies, normalize-input, resolve-agent-chain, validate-output, route-output, retry-no-effect]
      operationMapping: {const: one-operation-instance-one-agent}
      concreteAgentBinding: {const: provider-profile-model}
  defaults: {type: object}
  targets:
    type: object
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/target"}
  skills: {type: object}
  targetAliases:
    type: object
    additionalProperties: {type: string, minLength: 1}
  operators:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [skill, chain, environments]
      properties:
        skill: {type: string, minLength: 1}
        chain:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        environments:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [environment, profiles]
            properties:
              environment: {type: string, minLength: 1}
              profiles:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
  fallback:
    type: object
    additionalProperties: false
    required: [allowedReasons, requiredEffectState, blockedReasons]
    properties:
      allowedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      requiredEffectState: {const: none}
      blockedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
$defs:
  model:
    type: [string, "null"]
    minLength: 1
  target:
    type: object
    additionalProperties: false
    required: [runtime, profiles, requestedModel, orcaLaunch]
    properties:
      runtime: {type: string, minLength: 1}
      profiles:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          working: {type: string, minLength: 1}
          reasoning: {type: string, minLength: 1}
      requestedModel: {$ref: "#/$defs/model"}
      orcaLaunch:
        oneOf:
          - type: object
            additionalProperties: false
            required: [kind, agent]
            properties:
              kind: {const: managed-agent}
              agent: {type: string, minLength: 1}
              startup:
                enum: [direct-native-worker-start]
              modelAuthority:
                enum: [verified-qwen-runtime-configuration]
              supervision:
                enum: [worker-start-agent]
          - type: object
            additionalProperties: false
            required: [kind, command, dispatch]
            properties:
              kind: {const: command-terminal}
              command: {type: string, minLength: 1}
              reasoningCommand: {type: string, minLength: 1}
              dispatch: {const: return-preamble-and-send}
