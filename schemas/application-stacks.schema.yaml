schema: starci/schema@1
id: starci/application-stacks@1
title: Application stack declaration
description: >-
  Static, repository-owned inventory for reproducible Compose environments. It declares
  intended topology and verification commands; it is not evidence that a stack ran.
type: object
additionalProperties: false
required: [schema, components, environments, k8s]
properties:
  schema: {const: starci/application-stacks@1}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, repositoryRole, rootRef, revision]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        repositoryRole: {enum: [backend, frontend, shared]}
        rootRef: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
        revision: {type: string, pattern: '^[a-f0-9]{7,64}$'}
  components:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, role]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        role: {enum: [frontend, backend, worker, bootstrap, stateful, gateway]}
        purpose: {type: string}
        required: {type: boolean}
  environments:
    type: object
    required: [dev, vps]
    additionalProperties: false
    properties:
      dev: {$ref: '#/$defs/environment'}
      vps: {$ref: '#/$defs/environment'}
  k8s:
    type: object
    additionalProperties: false
    required: [status, reason]
    properties:
      status: {const: deferred}
      reason: {type: string, minLength: 1}
$defs:
  environment:
    type: object
    additionalProperties: false
    required: [status, runtime, composeFiles, components, runbook, secrets]
    properties:
      status: {const: supported}
      runtime: {enum: [docker-compose, docker-swarm]}
      composeFiles: {type: array, minItems: 1, items: {type: string}}
      components:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required: [ownership]
          properties:
            ownership: {enum: [managed, external, excluded]}
            service: {type: string}
            owner: {type: string}
            failureDomain: {type: string, minLength: 1}
            endpointRef: {type: string}
            reason: {type: string}
      profiles:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/$defs/profile'
      runbook:
        type: object
        additionalProperties: false
        required: [prepare, doctor, up, status, logs, down, verification]
        properties:
          prepare: {type: string, minLength: 1}
          doctor: {type: string, minLength: 1}
          up: {type: string, minLength: 1}
          status: {type: string, minLength: 1}
          logs: {type: string, minLength: 1}
          down: {type: string, minLength: 1}
          update: {type: string, minLength: 1}
          rollback: {type: string, minLength: 1}
          backup: {type: string, minLength: 1}
          restore: {type: string, minLength: 1}
          verification:
            type: object
            additionalProperties: false
            required: [coldStart, restart, persistence]
            properties:
              coldStart: {type: string, minLength: 1}
              restart: {type: string, minLength: 1}
              persistence: {type: string, minLength: 1}
      platform:
        type: object
        additionalProperties: false
        properties:
          ubuntu: {type: string, minLength: 1}
          architectures: {type: array, minItems: 1, items: {enum: [amd64, arm64]}}
      secrets:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, source, encryptedRef, recipientPolicy, keyCustody]
          properties:
            name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
            source: {enum: [generated, provider-issued]}
            sourceOwner: {type: string}
            generationAlgorithm: {type: string}
            formatPolicy: {type: string}
            encryptedRef: {type: string}
            materializedPath: {type: string}
            runtimeName: {type: string}
            version: {type: string}
            recipientPolicy: {type: string, minLength: 1}
            keyCustody: {type: string, minLength: 1}
  profile:
    type: object
    additionalProperties: false
    required: [exclusiveGroup, components]
    properties:
      exclusiveGroup: {type: string, minLength: 1}
      components:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/$defs/profileComponent'
  profileComponent:
    type: object
    additionalProperties: false
    required: [mode]
    properties:
      mode: {enum: [docker-service, host-process, external, excluded]}
      service: {type: string}
      source: {type: string}
      sourceRoot: {type: string}
      command: {type: string}
      envFile: {type: string}
      readiness:
        type: object
        additionalProperties: false
        required: [scheme, host, port, path]
        properties:
          scheme: {enum: [http, https, tcp]}
          host: {type: string, minLength: 1}
          port: {type: number}
          path: {type: string}
      build:
        type: object
        additionalProperties: false
        required: [context, dockerfile, inputs]
        properties:
          context: {type: string, minLength: 1}
          dockerfile: {type: string, minLength: 1}
          inputs: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      image: {type: string}
      ports:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, host]
          properties:
            name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
            host: {type: number}
            container: {type: number}
      connections:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [component, variable, host, port]
          properties:
            component: {type: string}
            variable: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
            host: {type: string, minLength: 1}
            port: {type: number}
      storage:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [volume, custody, backupRef]
          properties:
            volume: {type: string, minLength: 1}
            custody: {type: string, minLength: 1}
            backupRef: {type: string, minLength: 1}
      owner: {type: string}
      failureDomain: {type: string}
      endpointRef: {type: string}
      reason: {type: string}
