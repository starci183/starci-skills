schema: starci/source-layout@1
purpose: Enforce one explicit StarCi host, one backend-owned product workspace, and clean routed product sources without duplicate runtime or route-registry identities.
roles:
  host:
    required:
      - path: .git
        type: git-marker
      - path: AGENTS.md
        type: file
      - path: CLAUDE.md
        type: file
      - path: .claude/SKILL.md
        type: file
      - path: .workspaces/projects
        type: directory
    requiredAny: []
    forbidden:
      - .claude-v3
      - .claude_legacy
      - .claude-vip
      - .claude-starci-ultimate
    forbiddenIdentities: []
    content:
      - path: AGENTS.md
        includes: .claude/SKILL.md
      - path: CLAUDE.md
        includes: .claude/SKILL.md
  be:
    required:
      - path: .git
        type: git-marker
      - path: .starciwork/workspace.yaml
        type: file
      - path: .starciwork/features/index.yaml
        type: file
      - path: package.json
        type: json-file
      - path: pnpm-workspace.yaml
        type: file
      - path: tsconfig.json
        type: file
      - path: src
        type: directory
    requiredAny:
      - id: backend-source-roots
        paths:
          - apps
          - features
          - packages
          - src
        minimum: 1
    forbidden:
      - .claude-v3
      - .claude_legacy
      - .claude-vip
      - .claude-starci-ultimate
      - .work
      - .starci
      - .starcitemp
    forbiddenIdentities:
      - id: starci-runtime
        paths:
          - .claude/SKILL.md
        minimum: 1
      - id: workspace-route-registry
        paths:
          - .workspaces/projects
          - .workspaces/local/routes
        minimum: 1
    content: []
  fe:
    required:
      - path: .git
        type: git-marker
      - path: package.json
        type: json-file
      - path: pnpm-workspace.yaml
        type: file
    requiredAny:
      - id: frontend-source-roots
        paths:
          - apps
          - packages
          - src
        minimum: 1
    forbidden:
      - .claude-v3
      - .claude_legacy
      - .claude-vip
      - .claude-starci-ultimate
      - .starciwork
      - .work
      - .starci
      - .starcitemp
    forbiddenIdentities:
      - id: starci-runtime
        paths:
          - .claude/SKILL.md
        minimum: 1
      - id: workspace-route-registry
        paths:
          - .workspaces/projects
          - .workspaces/local/routes
        minimum: 1
    content: []
pairRules:
  - Host, backend and frontend are explicit real directories; backend and frontend are distinct. Host may equal backend only when both roles explicitly resolve to the same real directory.
  - Host owns the only .claude/SKILL.md runtime identity and .workspaces project/route registry. Backend owns the project's only .starciwork.
  - Routed backend and frontend sources contain no duplicate StarCi runtime or route-registry identity and no product workspace outside the backend-owned .starciwork.
  - A project-owned .claude or .workspaces directory without those identity markers is not rejected by name alone; .stacks may hold legitimate repository deployment knowledge.
  - The bound Work root is exactly <backend>/.starciwork and contains features/index.yaml.
  - Required path checks do not prove application behavior, build success, source completeness or production readiness.
