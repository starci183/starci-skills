$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:workflow-state:1
title: Workflow state — durable engine record
description: >
  Documentation schema for `state.engine` inside `starci/workflow-state@1` (kernel/store.mjs).
  It does not schema the whole workflow state (`state.ops[]`, `state.ledger[]`, ... are runtime
  shapes documented in docs/workflow-kernel.md); it fixes only the one sub-record every stream of
  runtime 1.0.4 must agree on: how an enrolled workflow names the durable store it runs against.
  Runtime 1.0.4: the ledger DB is the record (see ledger-db.schema.yaml), so `engine.ledgerFile`
  replaces `engine.journalFile`. `journalFile` is deprecated-but-allowed only while a state has no
  `ledgerFile` yet — that is exactly the shape `predatesEngineSchema`/continuation read as
  `ledger-unmigrated` and refuse until `ledger-migrate` runs; a state may never carry neither.
type: object
required:
  - schema
  - version
  - generation
properties:
  schema:
    const: starci/engine@1
  version:
    type: string
    minLength: 1
    description: The sealed runtime build version this engine record was enrolled under.
  generation:
    type: integer
    minimum: 1
    description: Bumped on every re-enrollment; the durable store binds one generation at a time.
  ledgerFile:
    type: string
    minLength: 1
    description: >
      Absolute path to `<ledger repo>/.starciwork/runtime.sqlite`, opened with `kernel/ledger-db.mjs`'s
      `openLedger`. Present on every state written by a 1.0.4 kernel.
  machineFile:
    type: string
    minLength: 1
    description: >
      Absolute path to the machine arbiter DB (`%LOCALAPPDATA%/StarCi/runtime/machine.sqlite`,
      `machineFileFor`), used only for `ai/*` provider quota and cross-ledger machine budgets.
  journalFile:
    type: string
    minLength: 1
    deprecated: true
    description: >
      1.0.3 and earlier: the operational journal (`journal.sqlite`) this engine bound. Allowed on a
      1.0.4 state only when `ledgerFile` is absent — that combination is `ledger-unmigrated` and the
      continuation boundary refuses it until `starci ledger-migrate` runs. A state must never carry
      `journalFile` alone with no path forward, and never carries neither field.
  assurance:
    const: detection-only
  coordination:
    type: string
    minLength: 1
  runtimePin:
    type:
      - object
      - "null"
  candidateRoot:
    type: string
  enrolledAt:
    type: integer
# A migrated (1.0.4) or unmigrated (pre-1.0.4) engine record must name at least one durable store;
# a state naming neither is not an engine record this schema recognizes.
anyOf:
  - required: [ledgerFile]
    properties:
      ledgerFile: true
  - required: [journalFile]
    properties:
      journalFile: true
