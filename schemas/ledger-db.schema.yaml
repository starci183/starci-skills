$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:ledger-db:1
title: Ledger DB — table catalog (documentation schema)
description: >
  Documentation schema for the tables of `<ledger repo>/.starciwork/runtime.sqlite` (schema
  `starci/ledger-db@1`, `LEDGER_VERSION=1`) and the machine arbiter `machine.sqlite`, as
  `kernel/ledger-db.mjs` creates them. This file names the columns for the record's own readers
  (an operator inspection, `ledger-verify`) and is not itself run against the DB; the executable
  contract is the `CREATE TABLE` statements in docs/ledger-db.md §4/§5, which this schema mirrors
  and must never drift from silently — a mismatch is a documentation bug, filed against whichever
  changed last.
type: object
required:
  - schema
  - ledgerVersion
  - ledgerTables
  - machineTables
properties:
  schema:
    const: starci/ledger-db-catalog@1
  ledgerVersion:
    const: 1
  ledgerTables:
    type: object
    description: Tables of the ledger DB (`runtime.sqlite`), keyed by table name.
    required:
      - workflows
      - goals
      - state_snapshots
      - events
      - jobs
      - resources
      - leases
      - budgets
      - budget_reservations
      - incidents
      - reports
      - contracts
      - checks
      - inbox
      - signals
      - runtime_loads
      - migrations
    properties:
      workflows:
        $ref: "#/$defs/table"
        description: One row per workflow the ledger owns; `generation` is the bound engine generation.
      goals:
        $ref: "#/$defs/table"
        description: >
          Append-only: one row per `store.setGoal` call, `UNIQUE(workflow_id,revision)`. `revision`
          increments on every write (a draft splice counts); `goal_identity` is recomputed from the
          json record each time. `amendment_json` carries the `goal.revise`/`workflow-amend` body
          that produced the row, when the row was written by a revision rather than the first goal.
      events:
        $ref: "#/$defs/table"
        description: >
          One hash-chained table for both workflow audit lines and custody events
          (`entity_type='workflow'` is the audit trail `readEvents`/`appendEvent` use).
      signals:
        $ref: "#/$defs/table"
        description: >
          `PRIMARY KEY(scope,key)`. Known keys: `kernel-lock`, `supervisor-lock`, `stop`,
          `inputs-lock`, `launch`, `final-report`. `scope` is a workflow id, or `*` ledger-wide.
      state_snapshots: {$ref: "#/$defs/table"}
      jobs: {$ref: "#/$defs/table"}
      resources: {$ref: "#/$defs/table"}
      leases: {$ref: "#/$defs/table"}
      budgets: {$ref: "#/$defs/table"}
      budget_reservations: {$ref: "#/$defs/table"}
      incidents: {$ref: "#/$defs/table"}
      reports: {$ref: "#/$defs/table"}
      contracts: {$ref: "#/$defs/table"}
      checks: {$ref: "#/$defs/table"}
      inbox: {$ref: "#/$defs/table"}
      runtime_loads: {$ref: "#/$defs/table"}
      migrations: {$ref: "#/$defs/table"}
    additionalProperties:
      $ref: "#/$defs/table"
  machineTables:
    type: object
    description: Tables of the machine arbiter DB (`machine.sqlite`), keyed by table name.
    required:
      - ledgers
      - resources
      - leases
      - budgets
      - budget_reservations
    properties:
      ledgers: {$ref: "#/$defs/table"}
      resources: {$ref: "#/$defs/table"}
      leases: {$ref: "#/$defs/table"}
      budgets: {$ref: "#/$defs/table"}
      budget_reservations: {$ref: "#/$defs/table"}
    additionalProperties:
      $ref: "#/$defs/table"
$defs:
  table:
    type: object
    required:
      - columns
    properties:
      columns:
        type: array
        minItems: 1
        items:
          type: string
      indexes:
        type: array
        items:
          type: string
      description:
        type: string
