  semantics:
    layout: New Business uses business/index.yaml as an aggregate, business/overview/index.yaml as the
      readable overview and business/srs/**/index.yaml as a recursive SRS scope tree. Branches
      aggregate; every authored leaf owns one cohesive SRS with full flows, not a title-only FR. A
      new folder is discovered without a second registry.
    migration: Version 1 remains readable under its original checks; never rewrite legacy evidence or
      mark it reviewed under version 2. Migrating a completed leaf into a branch requires an
      explicit scoped migration, new leaf evidence and preserved historical proof.
    business: Version 2 Business has no codeImpacts, serviceImpacts, serviceCalls, patternDecisions or
      implementationChecks. Sources and explicit external constraints remain separately attributed;
      functional/business/NFR requirements are observable outcomes, not invented design choices.
    architecture: Architecture preserves accepted Business requirements and flows, owns implementation
      impacts and adds a context-bound review. Named patterns are optional; justify relevant
      decisions, never mandate Saga/CQRS/HA/DR for every scope.
    coverage: Every FR maps to a flow and acceptance. Main and branch steps, outcomes, entry/resume
      points, actors and BR references must resolve. Empty alternative/exception sets need an
      explicit applicability reason.
    assurance: Structural checks validate joins and declared decisions, not source truth, exhaustive
      scenario discovery or actual production behavior. Proposed tests are not executed proof.
currentArchitecturePayloadSchema: starci/specification@3
architectureV3:
  schema: specifications/sds.schema.json
  layout: architecture/{overview,sds/**}/index.yaml
  business: Reference canonical SRS IDs without duplicating requirements/flows/acceptance.
  source: No source paths, symbols, revisions or code impact mapping. Implementation owns those.
  legacy: Specification@1/@2 remain readable under their original checks. Migration never reuses stale
    completion.
