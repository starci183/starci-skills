semantics:
  sourceBinding: For work/node@2, each observed source binds to the owning node's direct sourceRefs by
    exact repository, normalized relative path and full revision. Another path, ancestor/sibling
    citation or repository resource cannot substitute for the owning citation. Conflicting revisions
    for the same repository/path fail. Legacy work/node@1 retains its referenced repository
    resource/revision binding. No source file or Git object is read by this metadata check; the
    operator verifies source truth. Accepted-intent and proposal citations are not observed code and
    do not require a sourceRefs duplicate.
  scope: Impact inventory is not a grant to edit every listed file. Only accepted change rows may
    become implementation ceilings; preserve/review rows remain protected/read-only.
  truth: Observed source is not approved intent. Proposed checks are not executed evidence.
  quality: Lint/typecheck/tests/coverage/build/Sonar are owned and run by interface.implement or
    backend.implement.
  limits: This validator checks shape, IDs, join coverage and declared readiness, not source truth,
    authorization correctness or actual runtime security.
  journeys: Business authors the canonical executable user journeys; architecture preserves accepted
    journeys. These objects are copied directly into frontend workflow input.journeys. Internal
    service-call flow steps remain in flows/serviceCalls and never become browser actions by
    inference.
