$schema: https://json-schema.org/draft/2020-12/schema
$id: starci/sds@4
title: starci/sds@4
type: object
additionalProperties: false
required:
  - schema
  - op
  - status
  - id
  - nodeType
  - name
  - summary
  - refs
  - content
properties:
  schema:
    const: starci/sds@4
  op:
    const: architecture.decide
  status:
    enum:
      - draft
      - blocked
      - pass
  id:
    $ref: "#/$defs/id"
  nodeType:
    enum:
      - overview
      - flow
      - code-unit
      - contract
      - data
      - quality
      - deployment
      - decision
      - verification
  name:
    $ref: "#/$defs/text"
  summary:
    $ref: "#/$defs/text"
  refs:
    type: array
    items:
      $ref: "#/$defs/ref"
  content:
    type: object
allOf:
  - if:
      properties:
        nodeType:
          const: overview
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-overview"
  - if:
      properties:
        nodeType:
          const: flow
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-flow"
  - if:
      properties:
        nodeType:
          const: code-unit
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-code-unit"
  - if:
      properties:
        nodeType:
          const: contract
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-contract"
  - if:
      properties:
        nodeType:
          const: data
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-data"
  - if:
      properties:
        nodeType:
          const: quality
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-quality"
  - if:
      properties:
        nodeType:
          const: deployment
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-deployment"
  - if:
      properties:
        nodeType:
          const: decision
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-decision"
  - if:
      properties:
        nodeType:
          const: verification
      required:
        - nodeType
    then:
      properties:
        content:
          $ref: "#/$defs/content-verification"
$defs:
  text:
    type: string
    minLength: 1
  id:
    type: string
    minLength: 1
    pattern: ^[^#]+$
  ref:
    type: object
    additionalProperties: false
    required:
      - type
      - nodeId
      - itemId
    properties:
      type:
        enum:
          - functional-requirement
          - non-functional-requirement
          - business-rule
          - business-data
          - customer-journey
          - acceptance
          - branch
          - srs-flow
          - overview
          - flow
          - code-unit
          - contract
          - data
          - quality
          - deployment
          - decision
          - verification
          - legacy-code-unit
          - legacy-contract
          - legacy-data
      nodeId:
        $ref: "#/$defs/id"
      itemId:
        $ref: "#/$defs/id"
  content-overview:
    type: object
    additionalProperties: false
    required:
      - designGoals
      - scope
      - actors
      - externalSystems
      - constraints
      - businessRefs
      - strategy
      - selectedTopologyRef
      - mapGuide
      - diagram
    properties:
      designGoals:
        type: array
      scope:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/text"
      actors:
        type: array
      externalSystems:
        type: array
      constraints:
        type: array
      businessRefs:
        type: array
      strategy:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/text"
      selectedTopologyRef:
        $ref: "#/$defs/text"
      mapGuide:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/text"
      diagram:
        $ref: "#/$defs/text"
  content-flow:
    type: object
    additionalProperties: false
    required:
      - goal
      - businessRefs
      - entryPoint
      - preconditions
      - inputs
      - participants
      - mainSequence
      - alternativeSequences
      - exceptionSequences
      - recovery
      - postconditions
      - resultMapping
      - topologyRefs
      - verificationRefs
    properties:
      goal:
        $ref: "#/$defs/text"
      businessRefs:
        type: array
      entryPoint:
        type:
          - object
          - "null"
      preconditions:
        type: array
      inputs:
        type: array
      participants:
        type: array
      mainSequence:
        type: array
      alternativeSequences:
        type: array
      exceptionSequences:
        type: array
      recovery:
        type: array
      postconditions:
        type: array
      resultMapping:
        type: array
      topologyRefs:
        type: array
      verificationRefs:
        type: array
  content-code-unit:
    type: object
    additionalProperties: false
    required:
      - layer
      - responsibility
      - boundaries
      - owner
      - repository
      - file
      - symbol
      - signature
      - inputs
      - outputs
      - existence
      - currentObservation
      - sourceObservation
      - plannedChanges
      - callers
      - callees
      - dependencies
      - providedInterfaces
      - consumedInterfaces
      - enforcement
      - contractRefs
      - dataRefs
      - flowRefs
      - qualityRefs
      - testRefs
    properties:
      layer:
        $ref: "#/$defs/text"
      responsibility:
        $ref: "#/$defs/text"
      boundaries:
        $ref: "#/$defs/text"
      owner:
        $ref: "#/$defs/text"
      repository:
        $ref: "#/$defs/text"
      file:
        $ref: "#/$defs/text"
      symbol:
        $ref: "#/$defs/text"
      signature:
        $ref: "#/$defs/text"
      inputs:
        type: array
      outputs:
        type: array
      existence:
        $ref: "#/$defs/text"
      currentObservation:
        $ref: "#/$defs/text"
      sourceObservation:
        type:
          - object
          - "null"
      plannedChanges:
        type: array
      callers:
        type: array
      callees:
        type: array
      dependencies:
        type: array
      providedInterfaces:
        type: array
      consumedInterfaces:
        type: array
      enforcement:
        type:
          - object
          - "null"
      contractRefs:
        type: array
      dataRefs:
        type: array
      flowRefs:
        type: array
      qualityRefs:
        type: array
      testRefs:
        type: array
  content-contract:
    type: object
    additionalProperties: false
    required:
      - owner
      - callerRef
      - receiverRef
      - interaction
      - endpoint
      - requestSchema
      - responseSchema
      - validation
      - errors
      - errorMapping
      - authentication
      - authorization
      - resourceScope
      - correlation
      - idempotency
      - ordering
      - timeout
      - retry
      - cancellation
      - outcomeLookup
      - version
      - compatibility
    properties:
      owner:
        $ref: "#/$defs/text"
      callerRef:
        $ref: "#/$defs/text"
      receiverRef:
        $ref: "#/$defs/text"
      interaction:
        $ref: "#/$defs/text"
      endpoint:
        $ref: "#/$defs/text"
      requestSchema:
        $ref: "#/$defs/text"
      responseSchema:
        $ref: "#/$defs/text"
      validation:
        $ref: "#/$defs/text"
      errors:
        type: array
      errorMapping:
        $ref: "#/$defs/text"
      authentication:
        $ref: "#/$defs/text"
      authorization:
        $ref: "#/$defs/text"
      resourceScope:
        $ref: "#/$defs/text"
      correlation:
        $ref: "#/$defs/text"
      idempotency:
        $ref: "#/$defs/text"
      ordering:
        $ref: "#/$defs/text"
      timeout:
        $ref: "#/$defs/text"
      retry:
        $ref: "#/$defs/text"
      cancellation:
        $ref: "#/$defs/text"
      outcomeLookup:
        $ref: "#/$defs/text"
      version:
        $ref: "#/$defs/text"
      compatibility:
        $ref: "#/$defs/text"
  content-data:
    type: object
    additionalProperties: false
    required:
      - businessDataRefs
      - storage
      - modelCodeRefs
      - fields
      - relationships
      - constraints
      - indexes
      - migration
      - authority
      - writeOwnerRef
      - readerRefs
      - repositoryRefs
      - transaction
      - consistency
      - concurrency
      - isolation
      - classification
      - lifecycle
      - recovery
    properties:
      businessDataRefs:
        type: array
        items:
          $ref: "#/$defs/text"
      storage:
        $ref: "#/$defs/text"
      modelCodeRefs:
        type: array
      fields:
        type: array
      relationships:
        type: array
      constraints:
        type: array
      indexes:
        type: array
      migration:
        $ref: "#/$defs/text"
      authority:
        $ref: "#/$defs/text"
      writeOwnerRef:
        $ref: "#/$defs/text"
      readerRefs:
        type: array
      repositoryRefs:
        type: array
      transaction:
        $ref: "#/$defs/text"
      consistency:
        $ref: "#/$defs/text"
      concurrency:
        $ref: "#/$defs/text"
      isolation:
        $ref: "#/$defs/text"
      classification:
        $ref: "#/$defs/text"
      lifecycle:
        $ref: "#/$defs/text"
      recovery:
        $ref: "#/$defs/text"
  content-quality:
    type: object
    additionalProperties: false
    required:
      - category
      - nfrRefs
      - mechanism
      - codeRefs
      - flowRefs
      - conditions
      - expectedResult
      - measurement
      - target
      - tradeoffs
      - limitations
    properties:
      category:
        $ref: "#/$defs/text"
      nfrRefs:
        type: array
      mechanism:
        $ref: "#/$defs/text"
      codeRefs:
        type: array
      flowRefs:
        type: array
      conditions:
        $ref: "#/$defs/text"
      expectedResult:
        $ref: "#/$defs/text"
      measurement:
        $ref: "#/$defs/text"
      target:
        type: object
        additionalProperties: false
        required:
          - status
          - value
          - decisionOwner
          - missingDecision
        properties:
          status:
            enum:
              - decided
              - undecided
          value:
            type: string
          decisionOwner:
            type: string
          missingDecision:
            type: string
        allOf:
          - if:
              properties:
                status:
                  const: decided
              required:
                - status
            then:
              properties:
                value:
                  $ref: "#/$defs/text"
          - if:
              properties:
                status:
                  const: undecided
              required:
                - status
            then:
              properties:
                decisionOwner:
                  $ref: "#/$defs/text"
                missingDecision:
                  $ref: "#/$defs/text"
      tradeoffs:
        $ref: "#/$defs/text"
      limitations:
        $ref: "#/$defs/text"
  content-deployment:
    type: object
    additionalProperties: false
    required:
      - topology
      - selected
      - placements
      - connections
      - dataOwnership
      - backgroundWork
      - failureDomains
      - correlation
      - configuration
      - rollout
      - rollback
    properties:
      topology:
        $ref: "#/$defs/text"
      selected:
        type: boolean
      placements:
        type: array
      connections:
        type: array
      dataOwnership:
        $ref: "#/$defs/text"
      backgroundWork:
        $ref: "#/$defs/text"
      failureDomains:
        type: array
      correlation:
        $ref: "#/$defs/text"
      configuration:
        $ref: "#/$defs/text"
      rollout:
        $ref: "#/$defs/text"
      rollback:
        $ref: "#/$defs/text"
  content-decision:
    type: object
    additionalProperties: false
    required:
      - problem
      - drivers
      - options
      - choice
      - rationale
      - tradeoffs
      - status
      - decisionOwner
      - revisitWhen
      - affectedRefs
    properties:
      problem:
        $ref: "#/$defs/text"
      drivers:
        type: array
      options:
        type: array
      choice:
        $ref: "#/$defs/text"
      rationale:
        $ref: "#/$defs/text"
      tradeoffs:
        $ref: "#/$defs/text"
      status:
        $ref: "#/$defs/text"
      decisionOwner:
        $ref: "#/$defs/text"
      revisitWhen:
        $ref: "#/$defs/text"
      affectedRefs:
        type: array
  content-verification:
    type: object
    additionalProperties: false
    required:
      - businessRefs
      - flowRefs
      - branchRefs
      - codeUnitRefs
      - nfrRefs
      - tests
      - fixtures
      - actorAuthority
      - preconditions
      - actions
      - faults
      - expectedData
      - expectedEffects
      - expectedResponse
      - expectedAppState
      - forbiddenChanges
      - measurements
      - executionEvidence
    properties:
      businessRefs:
        type: array
      flowRefs:
        type: array
      branchRefs:
        type: array
      codeUnitRefs:
        type: array
      nfrRefs:
        type: array
      tests:
        type: array
      fixtures:
        type: array
      actorAuthority:
        $ref: "#/$defs/text"
      preconditions:
        type: array
      actions:
        type: array
      faults:
        type: array
      expectedData:
        type: array
      expectedEffects:
        type: array
      expectedResponse:
        type: array
      expectedAppState:
        type: array
      forbiddenChanges:
        type: array
      measurements:
        type: array
      executionEvidence:
        type: "null"
