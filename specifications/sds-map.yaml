schema: starci/sds-map@1
purpose: A source-independent architecture map that traces accepted business flows through logical components, contracts, data, quality mechanisms, deployment and verification.
payload: extensions.work3.sds
aggregateSchema: starci/sds-aggregate@1
overview:
  type: overview
  schema: starci/sds-overview@1
  required: [id, title, status, businessRefs, designGoals, scope, actors, systemContext, qualityStrategy, decisions, constraints, topologyRefs, implementationHandoff]
sections:
  flows:
    type: flow
    schema: starci/sds-flow@1
    required: [id, title, businessRefs, entryPoint, preconditions, inputs, participants, mainSequence, alternativeSequences, exceptionSequences, recovery, postconditions, resultMapping, topologyRefs, verificationRefs]
  components:
    type: component
    schema: starci/sds-component@1
    required: [id, title, kind, responsibility, interfaceRefs, dataRefs, qualityRefs, verificationRefs]
  contracts:
    type: contract
    schema: starci/sds-contract@1
    required: [id, title, kind, callerComponentRef, receiverComponentRef, mode, transport, operation, request, response, errors, authorization, timeout, retry, idempotency, compatibility]
  data:
    type: data-model
    schema: starci/sds-data-model@1
    required: [id, title, ownerComponentRef, store, authoritative, classification, fields, states, transactions, consistency, retention, recovery]
  quality:
    type: quality
    schema: starci/sds-quality@1
    required: [id, title, qualityKind, businessRefs, scopeRefs, mechanism, scenarios, measurement, optimization, tradeoffs, verificationRefs]
  deployment:
    type: deployment
    schema: starci/sds-deployment@1
    required: [id, title, topology, placements, connections, configuration, credentials, scaling, failureDomains, rollout, rollback, recovery]
  decisions:
    type: decision
    schema: starci/sds-decision@1
    required: [id, title, problem, options, decision, status, rationale, tradeoffs, affectedRefs, revisitWhen]
  verification:
    type: verification
    schema: starci/sds-verification@1
    required: [id, title, businessAcceptanceRefs, scopeRefs, level, setup, steps, expected, securityChecks, performanceChecks, failureChecks]
rules:
  - Architecture overview is one structured starci/sds-overview@1 payload at architecture/overview/index.yaml. It summarizes accepted SRS scope, context and independently selected target-design dispositions; prose alone cannot complete it.
  - Inspect only relevant current source, configuration and installed APIs to establish feasibility and migration impact. Record retain, extend, correct, replace or add decisions with rationale; observations never override SRS or become implementation proof.
  - SDS is a source-of-truth design contract derived from SRS and design decisions, never from current source code. Source observations, revisions and implementation proof are forbidden.
  - SDS verification nodes specify scenarios and expected results only. Evidence fields and executed proof belong to excluded local run state, never SDS.
  - Flow is the primary route. Every main, alternative and exception sequence references logical components and ends in an observable application or receiver result.
  - Components own logical responsibilities and interfaces only. Repository roles, paths, symbols, signatures, call graphs and all other code mappings belong to Implementation.
  - Contracts state direction, sync or async mode, request, response, errors, authorization, timeout, retry, idempotency and compatibility.
  - Data identifies its writer, store, transaction boundaries, consistency, lifecycle and recovery.
  - Security, performance and reliability record applicable scenarios, mechanisms, measurement, optimizations, tradeoffs and verification.
  - Monolith and microservice topology are explicit deployment choices; flow behavior remains traceable in either topology.
  - SDS readiness means the logical design is implementable without guessing. SDS never contains code references or claims source observation; Implementation maps code to SDS and UAT proves running behavior.
