schema: starci/push-scan-allow@1
purpose: |-
  Owner-approved exemptions for the push secret scan (scripts/supervisor/push-mains.mjs). Each entry exempts
  ONE file of ONE repository from ONE pattern; nothing else is exempted, and a forbidden-file finding (an env
  file, a key, anything under .secrets/) is never exempt. An entry is added only on the owner's ruling, after
  the flagged values were checked against the repository's real env and secret files without printing them.
