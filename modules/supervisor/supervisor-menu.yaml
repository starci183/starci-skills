schema: starci/module-supervisor-menu@1
id: supervisor.menu

# The Supervisor's menu: the judgment points of the machine it may answer now, built by scripts/supervisor/supervisor-menu.mjs from the
# Decision Items waiting on the Supervisor in machine.sqlite (sup_decision_items). `starci supervisor status --json` prints them as
# `menu[]`; `starci supervisor decide --item <id> --choice <choice> --reason <text> [--text <input>]` validates the choice against the
# current menu, records the decision, executes the option's steps and closes the item. A step is one `starci <group> <verb>` call with
# typed arguments: `$name` takes the value of the item's subject, a value that is not known drops the flag, `$text` takes the caller's
# --text. Mechanical work never appears here: the controllers do it. Changing .claude is never an option.

about:
  en: >-
    A point of judgment that only the Supervisor can settle: a ruling on a gate, a conflict between workflows, the division of a shared
    resource, or a runtime defect to record for Debug.

# Every menu carries this typed escape: it records the decision and hands the item to the owner as an owner-class Decision Item.
escape:
  choice: none-fits
  effect: "records the reason and hands this item to the owner as an owner-class Decision Item"

# Which Decision Item belongs to which kind. A gate item is a runtime-defect DI whose refs name a gateIncident; a Kernel item escalated to the
# Supervisor carries the key prefix `escalated:`. A Decision Item that no route names is a runtime-defect.
routes:
  - {kind: gate-ruling, when: gateIncident}
  - {kind: workflow-conflict, diKinds: [cross-workflow, deadlock]}
  - {kind: resource-division, diKinds: [cap-starved, quota-exhausted]}
  - {kind: retry-cap, diKinds: [retry-decision]}
  - {kind: undispatched, diKinds: [ready-undispatched]}
  - {kind: orphaned, diKinds: [orphaned-frontier]}
  - {kind: kernel-escape, diKinds: [menu-escape], keyPrefix: 'escalated:'}
  - {kind: runtime-defect, default: true}

# The OWED classes of modules/supervisor/supervise.yaml mission.classes and how each reaches this menu: `direct` = the Decision Item kind a controller
# opens for the Supervisor; `ladder` = the Kernel's Decision Item kind that climbs to the Supervisor when the Kernel leaves it past its bound (it
# arrives as `escalated:` and takes the route of its kind, else kernel-escape); `gate` = it is answered as the supervisor-gate it belongs to. Every class
# of supervise.yaml has a row here (tests/supervisor/supervisor-owed-menu.spec.mjs), so a class added there without a menu path is red.
owedClasses:
  progress-stall: {reaches: direct, diKind: progress-stall}
  kernel-proposal: {reaches: direct, diKind: kernel-proposal}
  runtime-defect: {reaches: direct, diKind: runtime-defect}
  fixed-defect: {reaches: gate, diKind: runtime-defect}
  retry-cap: {reaches: direct, diKind: retry-decision}
  stale-gate: {reaches: ladder, diKind: stale-gate}
  owner-gate-no-ask: {reaches: gate, diKind: runtime-defect}
  owner-ask: {reaches: ladder, diKind: worker-question}
  peer-wait: {reaches: ladder, diKind: stale-peer-wait}
  unread-peer: {reaches: ladder, diKind: unread-peer}
  undispatched: {reaches: direct, diKind: ready-undispatched}
  dead-worker: {reaches: ladder, diKind: retry-decision}
  dead-kernel: {reaches: direct, diKind: seat-unrecoverable}
  orphaned: {reaches: direct, diKind: orphaned-frontier}
  stalled: {reaches: direct, diKind: progress-stall}
  contract-stale: {reaches: ladder, diKind: rev-ack}
  experiment-revert: {reaches: direct, diKind: experiment-revert}
  push-refused: {reaches: direct, diKind: push-refused}

# Dispatch of the weight a prioritised workflow receives.
priority:
  weight: 2
  reserve: 1

kinds:
  - id: gate-ruling
    source: "a supervisor-gate a Kernel raised (Decision Item with refs.gateIncident)"
    question: "{summary}"
    options:
      - {choice: fixed, text: commit, steps: [{run: kernel incident, args: {repo: $repo, workflow: $workflow, resolve: $incident, by: supervisor, resolution: fixed, commit: $text, detail: $reason}}], effect: "a runtime fix is on the live runtime: --text is its commit; the gate resolves once the live runtime contains it and wakes the Kernel"}
      - {choice: workaround, text: route, steps: [{run: kernel incident, args: {repo: $repo, workflow: $workflow, resolve: $incident, by: supervisor, resolution: workaround, route: $text, detail: $reason}}], effect: "the gate resolves and the Kernel dispatches the held job with the pool in --text"}
      - {choice: not-runtime-fault, steps: [{run: kernel incident, args: {repo: $repo, workflow: $workflow, resolve: $incident, by: supervisor, resolution: not-runtime-fault, detail: $reason}}], effect: "the gate resolves back to the Kernel, which must act on the cause; --reason is the evidence"}
      - {choice: record-defect, text: cause, keepsOpen: true, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime defect (--text is a short cause slug) in the defect queue for Debug; the gate stays open for its ruling"}

  - id: workflow-conflict
    source: "Decision Items cross-workflow and deadlock"
    question: "{summary}"
    options:
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling"}
      - {choice: prioritize, text: workflow, steps: [{run: supervisor ram-cap, args: {_: prioritize, workflow: $text, weight: $weight, reserve: $reserve}}], effect: "gives the workflow in --text the priority weight and reserve of this table"}

  - id: resource-division
    source: "Decision Items cap-starved and quota-exhausted"
    question: "{summary}"
    options:
      - {choice: prioritize, steps: [{run: supervisor ram-cap, args: {_: prioritize, workflow: $workflow, weight: $weight, reserve: $reserve}}], effect: "gives {workflow} the priority weight and reserve of this table"}
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling on the shared resource"}

  - id: kernel-escape
    source: "a Kernel item escalated to the Supervisor, and the Decision Item menu-escape: no option of a Kernel's menu fit"
    question: "{summary}"
    options:
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling"}
      - {choice: record-defect, text: cause, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime defect (--text is a short cause slug) in the defect queue for Debug"}

  - id: retry-cap
    source: "Decision Item retry-decision: a retry loop or retry cap that stands past its critical bound (stuck retry-cap), or the Kernel's own retry-decision left past its bound"
    question: "{summary}"
    options:
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling: retry with the failure fed back, switch agent, or re-cut the leg; never the same shape again"}
      - {choice: record-defect, text: cause, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime cause (--text is a short cause slug) in the defect queue for Debug and closes the item"}

  - id: undispatched
    source: "Decision Item ready-undispatched: ready work stands queued past its critical bound although the Kernel's seat is alive"
    question: "{summary}"
    options:
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling: dispatch the ready work now or name why it waits"}
      - {choice: record-defect, text: cause, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime defect (the runtime dispatches ready work; the same item after a delivered wake is one) for Debug and closes the item"}

  - id: orphaned
    source: "Decision Item orphaned-frontier: a frontier with nothing open and no next step stands past the Supervisor grace"
    question: "{summary}"
    options:
      - {choice: rule, text: ruling, steps: [{run: supervisor notify, args: {repo: $repo, workflow: $workflow, text: $text, item: $key}}], effect: "sends --text to the workflow's Kernel as a durable Supervisor ruling: name the next leg, or revise the plan"}
      - {choice: record-defect, text: cause, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime defect (an orphan that stays orphaned) for Debug and closes the item"}

  - id: runtime-defect
    source: "every other Decision Item decided by the Supervisor: a defect of the runtime, a seat or a push"
    question: "{summary}"
    options:
      - {choice: record-defect, text: cause, steps: [{run: supervisor actions, args: {_: record, item: "runtime-defect:$text", action: recorded, reason: $reason, workflow: $workflow, refs: $refs}}], effect: "records the runtime defect (--text is a short cause slug) in the defect queue for Debug and closes the item"}
