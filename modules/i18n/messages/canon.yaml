schema: starci/i18n-catalog@1
area: canon
scope: runtime
purpose: Owner-visible Vietnamese of the lint canons' "why" maps (packages/eslint/fe/lib/why.mjs and packages/stylelint/lib/why.mjs), keyed from their English source (scripts/lib/i18n.mjs). <file>/<what>/<line>/<n>/<m>/<tag>/<unit>/<text>/<slot>/<method> markers are filled by the reader, not by the translator.
messages:
  # packages/eslint/fe/lib/why.mjs - headlines (en field)
  - en: "`<file>` reads an environment variable. Only `modules/config` may read env."
    vi: "`<file>` đọc biến môi trường. Chỉ `modules/config` được đọc env."
  - en: "`<file>` carries a hardcoded fallback for an address or a secret (`?? \"http://localhost…\"`). A variable missing in production must throw at config load, not silently point at a dev machine."
    vi: "`<file>` có giá trị dự phòng cứng cho địa chỉ hoặc bí mật (`?? \"http://localhost…\"`). Thiếu biến ở production phải ném lỗi khi nạp cấu hình, không được lặng lẽ trỏ về máy dev."
  - en: "`fetch` (or `Request`, `EventSource`, `sendBeacon`, another HTTP library) in `<file>` sits outside the one client (`modules/api/client.ts`, or `src/client.ts` of the shared api package). A repo has exactly one transport."
    vi: "`fetch` (hoặc `Request`, `EventSource`, `sendBeacon`, thư viện HTTP khác) ở `<file>` nằm ngoài client duy nhất (`modules/api/client.ts`, hoặc `src/client.ts` của gói api dùng chung). Mỗi repo chỉ có đúng một đường truyền."
  - en: "`fetch` in `<file>` has no `signal`. The client must carry a timeout and an `AbortSignal`."
    vi: "`fetch` ở `<file>` không có `signal`. Client bắt buộc có timeout và `AbortSignal`."
  - en: "`<file>` holds shared state as `let`/`var` in the API layer. Token and locale must not sit in a singleton."
    vi: "`<file>` giữ trạng thái dùng chung dạng `let`/`var` trong tầng API. Token và locale không được nằm trong singleton."
  - en: "The client in `<file>` has no branch comparing `response.status` with 401 and 403 and returning `{ kind: \"refused\" }`, so the \"sign-in required\" state is never reached."
    vi: "Client ở `<file>` không có nhánh so sánh `response.status` với 401 và 403 rồi trả `{ kind: \"refused\" }`, nên trạng thái \"cần đăng nhập\" không bao giờ đạt được."
  - en: "`<file>` merges every failure (an error HTTP response or a failed `Outcome`) into one branch or one empty value, so the reason is lost."
    vi: "`<file>` gộp mọi thất bại (phản hồi HTTP lỗi hoặc `Outcome` thất bại) thành một nhánh hoặc một giá trị rỗng, nên lý do bị mất."
  - en: "`<file>` hand-types a wire type or casts a response. Use the types generated from `be/contracts/`."
    vi: "`<file>` tự gõ kiểu wire hoặc ép kiểu phản hồi. Dùng kiểu sinh từ `be/contracts/`."
  - en: "`\"use client\"` in `<file>` (`<slot>` may not be a client component)."
    vi: "`\"use client\"` ở `<file>` (`<slot>` không được là client component)."
  - en: "`<file>` inside `hooks/` is not a React hook. A server reader goes to `modules/api`, a helper to `<domain>.shared.ts`."
    vi: "`<file>` trong `hooks/` không phải React hook. Reader server về `modules/api`, helper về `<domain>.shared.ts`."
  - en: "`<file>` uses the name `middleware`. From Next 16 the request gate is `proxy.ts` exporting `proxy`."
    vi: "`<file>` dùng tên `middleware`. Từ Next 16 bộ chặn request là `proxy.ts` và xuất `proxy`."
  - en: "File `<file>` sits under a locale segment that is not `[locale]`. There is one pattern: `next-intl`, `[locale]`, default `vi`."
    vi: "Tệp `<file>` nằm dưới segment ngôn ngữ không phải `[locale]`. Chỉ có một mẫu: `next-intl`, `[locale]`, mặc định `vi`."
  - en: "`<file>` imports a second i18n library. The app uses only `next-intl` through `modules/i18n`."
    vi: "`<file>` nhập một thư viện i18n thứ hai. App chỉ dùng `next-intl` qua `modules/i18n`."
  - en: "`<html lang>` in `<file>` is a hardcoded string. The `lang` attribute must come from the `[locale]` segment."
    vi: "`<html lang>` ở `<file>` là chữ cứng. Thuộc tính `lang` phải lấy từ segment `[locale]`."
  - en: "The text `\"<text>\"` in `<file>:<line>` does not go through `t()`."
    vi: "Chữ `\"<text>\"` ở `<file>:<line>` không đi qua `t()`."
  - en: "`<file>` uses a raw colour/length value (`<what>`). Colour and spacing come only from grammar tokens; brand colour lives only in `brand.css`."
    vi: "`<file>` dùng giá trị màu/độ dài thô (`<what>`). Màu và khoảng cách chỉ đến từ token grammar; màu thương hiệu chỉ ở `brand.css`."
  - en: "`<file>` paints text or an icon with a solid status tone (`<what>`, e.g. `text-success`). A solid tone is a background colour; used as a text colour it reads below 4.5:1 on the page background."
    vi: "`<file>` tô chữ hoặc icon bằng tông trạng thái đặc (`<what>`, ví dụ `text-success`). Tông đặc là màu nền; dùng làm màu chữ nó đọc dưới 4.5:1 trên nền trang."
  - en: "Raw `<tag>` in `<file>`. Use the grammar renderer."
    vi: "`<tag>` thô ở `<file>`. Dùng renderer của grammar."
  - en: "`<file>` is `<n>` lines long, over the 300-line budget of a component."
    vi: "`<file>` dài `<n>` dòng, vượt ngưỡng 300 dòng của một component."
  - en: "`<unit>` has `<n>` data hooks / `<m>` useState, over the budget of 6."
    vi: "`<unit>` có `<n>` hook dữ liệu / `<m>` useState, vượt ngưỡng 6."
  - en: "`<unit>` hand-writes a poll loop (`setInterval` or a self-rescheduling `setTimeout`)."
    vi: "`<unit>` tự viết vòng poll (`setInterval` hoặc `setTimeout` tự gọi lại)."
  - en: "A comment disabling a rule sits at `<file>:<line>`. HFS does not allow in-place suppression - fix the code, or propose a rule change."
    vi: "Có chú thích tắt luật ở `<file>:<line>`. HFS không cho tắt tại chỗ — sửa code, hoặc đề xuất đổi luật."
  - en: "`<file>` casts through `unknown` (`as unknown as T`): the compiler forgets everything it knows right where the data enters."
    vi: "`<file>` ép kiểu qua `unknown` (`as unknown as T`): trình biên dịch quên mọi thứ nó biết ngay tại chỗ dữ liệu đi vào."
  - en: "`<file>` uses `as T` or `<T>x`: an assertion the compiler cannot check. If it is wrong, the error lands in the user's browser."
    vi: "`<file>` dùng `as T` hoặc `<T>x`: một lời khẳng định trình biên dịch không kiểm được. Sai thì lỗi rơi vào trình duyệt của người dùng."
  - en: "`<file>` uses `x!`: asserting a value is present without proving it."
    vi: "`<file>` dùng `x!`: khẳng định giá trị có mặt mà không chứng minh."
  - en: "`<file>` uses `any`: it switches off type checking for that value and for everything inferred from it."
    vi: "`<file>` dùng `any`: tắt kiểm kiểu cho giá trị đó và mọi thứ suy ra từ nó."
  - en: "An element returned from `.map` in `<file>` has no `key`, so React identifies the row by position and the row loses state on delete or reorder."
    vi: "Phần tử trả từ `.map` ở `<file>` không có `key`, nên React nhận diện hàng theo vị trí và hàng bị đổi state khi xoá hoặc sắp xếp lại."
  - en: "A `key` in `<file>` comes from the `.map` index or a randomly generated value; an index is a position, not an identity."
    vi: "`key` ở `<file>` lấy từ chỉ số của `.map` hoặc giá trị sinh ngẫu nhiên; chỉ số là vị trí, không phải danh tính."
  - en: "A component in a `.map` in `<file>` receives an object or array literal as a prop: every row gets a new value every render, so memo never hits."
    vi: "Component trong `.map` ở `<file>` nhận object hoặc array literal làm prop: mỗi hàng mỗi lần render một giá trị mới, memo không bao giờ trúng."
  - en: "`<what>` in `<file>` (timer, frame, listener, observer, socket or subscription) is started by an effect or `subscribe` but the returned cleanup does not release that same handle/target/listener."
    vi: "`<what>` ở `<file>` (timer, frame, listener, observer, socket hoặc subscription) được effect hoặc `subscribe` khởi động nhưng cleanup trả về không giải phóng đúng handle/target/listener đó."
  - en: "`useEffect` in `<file>` starts a promise (`await`, `fetch`, `.then`, `void load()`, `mutate()`/`refresh()` called directly): no cache, no request merging, no loading/error state, no abort. Freshness of data comes from the SWR key, not from an effect."
    vi: "`useEffect` ở `<file>` khởi động một promise (`await`, `fetch`, `.then`, `void load()`, `mutate()`/`refresh()` gọi thẳng): không cache, không gộp request, không trạng thái loading/lỗi, không huỷ. Độ tươi của dữ liệu đến từ key của SWR, không đến từ effect."
  - en: "A `catch` or `.catch` in `<file>` does nothing: the error vanishes, no notice, no trace."
    vi: "`catch` hoặc `.catch` ở `<file>` không làm gì: lỗi biến mất, không thông báo, không dấu vết."
  - en: "`console.<method>` in `<file>`: it reaches no log pipeline and leaks internal detail to the user."
    vi: "`console.<method>` ở `<file>`: không vào pipeline log nào và lộ chi tiết nội bộ cho người dùng."
  - en: "`<file>` is `page.tsx` but exports no `metadata` or `generateMetadata`; every page in the branch carries the same title."
    vi: "`<file>` là `page.tsx` nhưng không export `metadata` hoặc `generateMetadata`; mọi trang trong nhánh mang cùng một tiêu đề."
  - en: "`<Suspense>` in `<file>` has an empty `fallback`: the user sees a blank instead of a loading state."
    vi: "`<Suspense>` ở `<file>` có `fallback` rỗng: người dùng thấy khoảng trống thay vì trạng thái đang tải."
  - en: "`<file>` imports `Link`, `useRouter`, `usePathname` or `redirect` from Next, which does not know the locale: the path loses the `[locale]` prefix."
    vi: "`<file>` nhập `Link`, `useRouter`, `usePathname` hoặc `redirect` từ Next, không biết locale: đường dẫn mất tiền tố `[locale]`."
  - en: "`<a>` in `<file>` points at an internal route (reloads the whole page, loses the locale, loses prefetch) or opens a new tab without `rel`."
    vi: "`<a>` ở `<file>` trỏ route nội bộ (tải lại cả trang, mất locale, mất prefetch) hoặc mở tab mới mà không có `rel`."
  - en: "`<file>` formats a number, money or a date with `toLocale*String`, `new Intl.*`, `toFixed`, a currency sign pasted into a template or a date library, instead of the next-intl formatter."
    vi: "`<file>` định dạng số, tiền hoặc ngày bằng `toLocale*String`, `new Intl.*`, `toFixed`, ký hiệu tiền dán vào template hoặc thư viện ngày, thay vì formatter của next-intl."
  - en: "`<file>` writes a route path inline at the call site; when the route moves, the copy points at a 404."
    vi: "`<file>` viết thẳng đường dẫn route ở nơi gọi; route đổi chỗ thì bản sao trỏ vào 404."
  - en: "A client component in `<file>` imports code that exists only on the server (`server-only`, `next/headers`, a Node module, a server reader)."
    vi: "Client component ở `<file>` nhập mã chỉ tồn tại ở server (`server-only`, `next/headers`, module Node, server reader)."
  - en: "Module `<file>` imports a server-only API (`next/headers`, `next/server`, `next-intl/server`, a Node module or an already server-only module) but does not open with `import \"server-only\"`."
    vi: "Module `<file>` nhập API chỉ có ở server (`next/headers`, `next/server`, `next-intl/server`, module Node hoặc module đã là server-only) nhưng không mở đầu bằng `import \"server-only\"`."
  - en: "`<file>` uses `localStorage`/`sessionStorage` outside `modules/`; storage does not exist on the server and throws when over quota."
    vi: "`<file>` dùng `localStorage`/`sessionStorage` ngoài `modules/`; storage không có ở server và ném lỗi khi đầy hạn mức."
  - en: "`dangerouslySetInnerHTML` on `<tag>` in `<file>`: any string becomes runnable HTML."
    vi: "`dangerouslySetInnerHTML` trên `<tag>` ở `<file>`: chuỗi bất kỳ trở thành HTML chạy được."
  - en: "`<file>` writes a cookie through the Next response cookie without stating fixed `httpOnly`, missing `secure` or a `sameSite` that is not `lax`/`strict`."
    vi: "`<file>` ghi cookie qua cookie phản hồi của Next mà không nêu `httpOnly` cố định, thiếu `secure` hoặc `sameSite` không phải `lax`/`strict`."
  - en: "A props type of a component in `<file>` has a field or collection that is not `readonly`, so the component could write into what it is passed."
    vi: "Kiểu props của component ở `<file>` có field hoặc collection không `readonly`, nên component có thể ghi vào thứ nó được truyền."
  - en: "Raw `<img>` in `<file>`: it loads the original image and holds no space, so the page jumps when the image arrives."
    vi: "`<img>` thô ở `<file>`: tải ảnh gốc, không giữ chỗ nên trang nhảy khi ảnh tải xong."
  - en: "`Image` in `<file>` lacks `width` and `height` (or has `fill` without `sizes`): the browser cannot hold the space."
    vi: "`Image` ở `<file>` thiếu `width` và `height` (hoặc `fill` mà thiếu `sizes`): trình duyệt không giữ chỗ được."
  - en: "A `switch` on `kind` in `<file>` has an `ok` branch but misses one of refused, invalid, not-found, unavailable."
    vi: "`switch` trên `kind` ở `<file>` có nhánh `ok` nhưng thiếu một trong refused, invalid, not-found, unavailable."
  - en: "`<file>` declares another result union (`ok` or `kind`) outside `outcome.ts`. A repo has only one `Outcome<T>`."
    vi: "`<file>` khai báo thêm một union kết quả (`ok` hoặc `kind`) ngoài `outcome.ts`. Repo chỉ có một `Outcome<T>`."
  - en: "`<file>` builds a layer of the next-intl stack itself (`defineRouting`, `createNavigation`, `getRequestConfig`, `createMiddleware`). The stack is written once for the whole repo."
    vi: "`<file>` tự dựng một tầng của stack next-intl (`defineRouting`, `createNavigation`, `getRequestConfig`, `createMiddleware`). Stack chỉ được viết một lần cho cả repo."
  - en: "Raw `<tag>` in `<file>`. Page structure and text are composed from grammar components, not hand-written HTML."
    vi: "`<tag>` thô ở `<file>`. Cấu trúc trang và chữ được ghép từ component của grammar, không viết HTML thô."
  - en: "`<file>` exceeds the line budget: a new file already too long, or an existing file longer than at the parent commit. Every file must be small enough for one person to read through and one test to cover."
    vi: "`<file>` vượt ngân sách dòng: file mới đã dài quá mức, hoặc file cũ dài hơn bản ở commit cha. Mỗi file phải nhỏ để một người đọc hết và một bài test phủ hết."
  # packages/eslint/fe/lib/why.mjs - next steps (fix field)
  - en: "Read the value from a typed export of `modules/config` instead of `process.env`."
    vi: "Đọc giá trị từ export có kiểu của `modules/config` thay vì `process.env`."
  - en: "Delete the fallback; let `modules/config` throw when a variable is missing in production."
    vi: "Xóa giá trị dự phòng; để `modules/config` ném lỗi khi thiếu biến ở production."
  - en: "Call the repo's client and receive `Outcome<T>`; do not call `fetch` yourself."
    vi: "Gọi client của repo và nhận `Outcome<T>`; không tự gọi `fetch`."
  - en: "Pass `signal` (`AbortSignal.timeout(...)` combined with the caller's signal)."
    vi: "Truyền `signal` (`AbortSignal.timeout(...)` kết hợp với tín hiệu của người gọi)."
  - en: "Pass credential and locale as parameters or through context."
    vi: "Truyền credential và locale bằng tham số hoặc context."
  - en: "Add a `response.status === 401 || response.status === 403` branch returning `{ ok: false, kind: \"refused\" }` right inside the client."
    vi: "Thêm nhánh `response.status === 401 || response.status === 403` trả `{ ok: false, kind: \"refused\" }` ngay trong client."
  - en: "Keep the reason: for an `Outcome` branch on the reason code; for an HTTP response turn the status code into an `Outcome` (`refused` for 401/403, `not-found`, `invalid`, `unavailable`). Do not use the server's raw error as the reason."
    vi: "Giữ lý do: với `Outcome` thì rẽ nhánh theo mã lý do; với phản hồi HTTP thì đổi mã trạng thái thành `Outcome` (`refused` cho 401/403, `not-found`, `invalid`, `unavailable`). Không dùng nguyên văn lỗi của server làm lý do."
  - en: "Run codegen from the be contract snapshot (`be/contracts/`) and import the generated types; put GraphQL documents in `.graphql` files."
    vi: "Chạy codegen từ ảnh chụp hợp đồng của be (`be/contracts/`) và nhập kiểu sinh ra; đưa tài liệu GraphQL vào tệp `.graphql`."
  - en: "Put `\"use client\"` on the `index.tsx` of an interactive block, a leaf, or `error.tsx`/`global-error.tsx`; keep layout and page as server components."
    vi: "Đặt `\"use client\"` ở `index.tsx` của block có tương tác, leaf, hoặc `error.tsx`/`global-error.tsx`; giữ layout và page là server component."
  - en: "One hook per `use*.ts` file; a shared helper goes in `<domain>.shared.ts`; a server reader goes in `modules/api/<domain>/read-*.ts`."
    vi: "Mỗi tệp `use*.ts` một hook; helper dùng chung vào `<domain>.shared.ts`; reader server vào `modules/api/<domain>/read-*.ts`."
  - en: "Rename the file to `proxy.ts` and rename the export to `proxy`."
    vi: "Đổi tên tệp thành `proxy.ts` và đổi export thành `proxy`."
  - en: "Rename the segment directory to `[locale]`."
    vi: "Đổi tên thư mục segment thành `[locale]`."
  - en: "Switch to `next-intl`; delete the other library."
    vi: "Chuyển sang `next-intl`; xóa thư viện còn lại."
  - en: "Use `lang={locale}` from the parameter of the `[locale]` layout."
    vi: "Dùng `lang={locale}` từ tham số của layout `[locale]`."
  - en: "Move the sentence into `modules/i18n/messages/<locale>.json` and read it with `t(\"key\")`; no exceptions."
    vi: "Chuyển câu vào `modules/i18n/messages/<locale>.json` và đọc bằng `t(\"khóa\")`; không có ngoại lệ."
  - en: "Use a grammar token class or variable; a colour value is declared only in `modules/brand/brand.css`."
    vi: "Dùng lớp hoặc biến token của grammar; giá trị màu chỉ khai trong `modules/brand/brand.css`."
  - en: "Switch to the soft pair: `text-<tone>-soft-foreground` (with `bg-<tone>-soft` when it sits on a light surface); a solid tone is used only with `bg-<tone>` and `text-<tone>-foreground`."
    vi: "Đổi thành cặp mềm: `text-<tông>-soft-foreground` (kèm `bg-<tông>-soft` nếu nằm trên nền nhạt); tông đặc chỉ dùng với `bg-<tông>` và `text-<tông>-foreground`."
  - en: "Replace it with the grammar component; if none exists yet, add it to grammar instead of drawing it in place."
    vi: "Thay bằng thành phần của grammar; nếu chưa có, thêm vào grammar thay vì vẽ tại chỗ."
  - en: "Split the drawing part from the data part and each area into its own unit."
    vi: "Tách phần vẽ khỏi phần dữ liệu và tách từng khu vực thành đơn vị riêng."
  - en: "Fold state that changes together into a reducer or a dedicated hook; split each data area into its own connection block."
    vi: "Gom trạng thái đổi cùng nhau vào reducer hoặc hook riêng; tách mỗi vùng dữ liệu thành block kết nối riêng."
  - en: "Refresh through a data hook (`refreshInterval`) or a socket, one mechanism per resource."
    vi: "Làm tươi qua hook dữ liệu (`refreshInterval`) hoặc socket, mỗi resource đúng một cơ chế."
  - en: "Remove `eslint-disable`, `@ts-ignore` or `@ts-expect-error` and fix the cause."
    vi: "Xóa `eslint-disable`, `@ts-ignore` hoặc `@ts-expect-error` và sửa nguyên nhân."
  - en: "Narrow from `unknown` with a type guard or a parser; do not cast."
    vi: "Thu hẹp từ `unknown` bằng type guard hoặc parser; không ép kiểu."
  - en: "Narrow with a type guard, `in`, a discriminant or a parser where the data enters; use `satisfies` when you only mean to check a literal."
    vi: "Thu hẹp bằng type guard, `in`, discriminant hoặc parser tại nơi dữ liệu đi vào; dùng `satisfies` nếu chỉ muốn kiểm một literal."
  - en: "Handle the absent branch (`if`, `??`, an early return) or fix the type so the value cannot be absent."
    vi: "Xử lý nhánh vắng mặt (`if`, `??`, return sớm) hoặc sửa kiểu để giá trị không thể vắng."
  - en: "Use a real type, a generic, or `unknown` narrowed at the use site."
    vi: "Dùng kiểu thật, generic, hoặc `unknown` rồi thu hẹp tại chỗ dùng."
  - en: "Add a `key` taken from the data's id; for a fragment use `<Fragment key={...}>`."
    vi: "Thêm `key` lấy từ id của dữ liệu; với fragment dùng `<Fragment key={...}>`."
  - en: "Use the id the data carries (`key={row.id}`); never the index, `Math.random`, `Date.now`."
    vi: "Dùng id mà dữ liệu mang (`key={row.id}`); không dùng index, `Math.random`, `Date.now`."
  - en: "Hoist the constant outside the component or build it once before `.map`."
    vi: "Nâng hằng số ra ngoài component hoặc dựng một lần trước `.map`."
  - en: "Keep the handle and return a cleanup calling `clearTimeout(id)`, `cancelAnimationFrame(id)`, `removeEventListener` with the same type and listener, `.disconnect()`, `.close()` or `.unsubscribe()` on the right object."
    vi: "Giữ handle và trả cleanup gọi `clearTimeout(id)`, `cancelAnimationFrame(id)`, `removeEventListener` cùng type và listener, `.disconnect()`, `.close()` hoặc `.unsubscribe()` trên đúng đối tượng."
  - en: "Read on the client with SWR calling the app's client (`hooks/`) keyed by what changes; call `mutate()` from the event that changes the data (handler, socket message); on the route use the server reader `modules/api/<domain>/read-*.ts`."
    vi: "Đọc phía client bằng SWR gọi client của app (`hooks/`) với key theo thứ thay đổi; gọi `mutate()` từ sự kiện làm dữ liệu đổi (handler, message socket); phía route dùng server reader `modules/api/<domain>/read-*.ts`."
  - en: "Return a typed outcome carrying the cause, show an error state, or rethrow."
    vi: "Trả một outcome có kiểu mang nguyên nhân, hiển thị trạng thái lỗi, hoặc ném lại."
  - en: "Return a typed outcome, show an error state, or let the error reach `error.tsx`."
    vi: "Trả outcome có kiểu, hiển thị trạng thái lỗi, hoặc để lỗi tới `error.tsx`."
  - en: "Export `metadata` (or `generateMetadata` when the title comes from data) with a title and description taken from the message catalog."
    vi: "Export `metadata` (hoặc `generateMetadata` khi tiêu đề lấy từ dữ liệu) với tiêu đề và mô tả lấy từ catalog thông điệp."
  - en: "Pass the skeleton (loading state) of the very thing loading as the `fallback`."
    vi: "Truyền skeleton (trạng thái loading) của đúng thứ đang tải làm `fallback`."
  - en: "Import from `modules/i18n/navigation`, built by next-intl from `routing.ts`."
    vi: "Nhập từ `modules/i18n/navigation`, được next-intl dựng từ `routing.ts`."
  - en: "Use `Link` from `modules/i18n/navigation` with an href built by `modules/routes`; a `_blank` link adds `rel=\"noopener noreferrer\"`."
    vi: "Dùng `Link` từ `modules/i18n/navigation` với href dựng bởi `modules/routes`; liên kết `_blank` thêm `rel=\"noopener noreferrer\"`."
  - en: "Use `useFormatter()` (or `getFormatter()` on the server): `number(...)`, `dateTime(...)`, `relativeTime(...)`."
    vi: "Dùng `useFormatter()` (hoặc `getFormatter()` ở server): `number(...)`, `dateTime(...)`, `relativeTime(...)`."
  - en: "Build the href with a function of `modules/routes` and use that same function everywhere."
    vi: "Dựng href bằng hàm của `modules/routes` và dùng đúng hàm đó ở mọi nơi."
  - en: "Read the data in a server component or a server reader and pass it down as props; or use SWR calling the app's client."
    vi: "Đọc dữ liệu ở server component hoặc server reader rồi truyền xuống bằng props; hoặc dùng SWR gọi client của app."
  - en: "Make `import \"server-only\"` the file's first statement; route files (`page`, `layout`, `route`, `proxy`) are server components already and need none."
    vi: "Đặt `import \"server-only\"` làm câu lệnh đầu tiên của tệp; tệp route (`page`, `layout`, `route`, `proxy`) là server component sẵn nên không cần."
  - en: "Put the read/write behind a hook or a module in `modules/` with a guard (`typeof window`, try/catch) and call it from the block."
    vi: "Đặt đọc/ghi sau một hook hoặc module trong `modules/` có bảo vệ (`typeof window`, try/catch) rồi gọi từ block."
  - en: "Render content as elements; only a `<script>` carrying JSON-LD or theme code from an app constant may use it."
    vi: "Render nội dung thành phần tử; chỉ `<script>` mang JSON-LD hoặc mã theme từ hằng số của app mới được dùng."
  - en: "Pass one `as const` options constant of the module owning the cookie: `httpOnly: true` (`false` only for a cookie an optional script must read), `secure` from `modules/config`, `sameSite: \"lax\"` or `\"strict\"`."
    vi: "Truyền một hằng số options `as const` của module sở hữu cookie: `httpOnly: true` (chỉ `false` cho cookie tùy chọn script cần đọc), `secure` từ `modules/config`, `sameSite: \"lax\"` hoặc `\"strict\"`."
  - en: "Mark every field and index signature `readonly`, and write collections as `readonly T[]`, `readonly [A, B]` or `ReadonlyArray<T>`."
    vi: "Đánh dấu `readonly` cho mọi field và index signature, viết collection là `readonly T[]`, `readonly [A, B]` hoặc `ReadonlyArray<T>`."
  - en: "Use `Image` of `next/image` with `width` and `height` (or `fill` and `sizes`) and an `alt` from the catalog."
    vi: "Dùng `Image` của `next/image` với `width` và `height` (hoặc `fill` và `sizes`) và `alt` từ catalog."
  - en: "Give both `width` and `height`, or `fill` inside a sized frame with `sizes`."
    vi: "Cho đủ `width` và `height`, hoặc `fill` trong khung có kích thước kèm `sizes`."
  - en: "Write all five branches of `Outcome<T>`, one screen each; do not lean on `default`."
    vi: "Viết đủ năm nhánh của `Outcome<T>`, mỗi nhánh một màn; không dựa vào `default`."
  - en: "Use `Outcome<T>` of `modules/api/outcome.ts` (or the shared api package); add business detail through the second parameter instead of declaring a new union."
    vi: "Dùng `Outcome<T>` của `modules/api/outcome.ts` (hoặc gói api dùng chung); thêm chi tiết nghiệp vụ qua tham số thứ hai thay vì khai báo union mới."
  - en: "Call the `createAppI18n` factory of the shared i18n package inside `modules/i18n/index.ts` and import the result; a single-app repo writes the stack only in that app's `modules/i18n`."
    vi: "Gọi factory `createAppI18n` của gói i18n dùng chung trong `modules/i18n/index.ts` và nhập kết quả; repo một app thì chỉ viết stack trong `modules/i18n` của app đó."
  - en: "Replace it with the matching grammar component (`Heading`, `Text`, `SurfaceCard`, ...); if grammar lacks it, add it to grammar or the ui package instead of drawing it in place."
    vi: "Thay bằng component grammar tương ứng (`Heading`, `Text`, `SurfaceCard`, ...); nếu grammar chưa có, thêm vào grammar hoặc gói ui thay vì vẽ tại chỗ."
  - en: "Split the new part into its own file by responsibility; a file already over budget may only stay or shrink."
    vi: "Tách phần mới sang file riêng theo trách nhiệm; một file đã vượt ngân sách chỉ được giữ nguyên hoặc ngắn lại."
  # packages/stylelint/lib/why.mjs - headlines (en field)
  - en: "CSS in `<file>` uses `<what>`, which is not a grammar token. Colour, spacing, radius and type come only from grammar tokens; a private variable name is a second design system."
    vi: "CSS ở `<file>` dùng `<what>` không phải token của grammar. Màu, khoảng cách, bo góc và chữ chỉ đến từ token grammar; một tên biến riêng là một hệ thiết kế thứ hai."
  - en: "CSS in `<file>` writes a raw colour/length value (`<what>`: hex, rgb, hsl, oklch or px). Raw values may live only in `modules/brand/brand.css`, with both a light and a dark value."
    vi: "CSS ở `<file>` viết giá trị màu/độ dài thô (`<what>`: hex, rgb, hsl, oklch hoặc px). Giá trị thô chỉ được nằm trong `modules/brand/brand.css`, có cả giá trị sáng và tối."
  - en: "`@apply <what>` in `<file>` applies an arbitrary value or a raw value. An arbitrary value is a raw value renamed, slipping past the grammar scale."
    vi: "`@apply <what>` ở `<file>` áp một giá trị tùy ý hoặc giá trị thô. Giá trị tùy ý là giá trị thô đổi tên, lách qua thang của grammar."
  - en: "`!important` in `<file>` (`<what>`). It wins the priority fight by making the next one unwinnable, and lets a grammar override survive a rebrand."
    vi: "`!important` ở `<file>` (`<what>`). Nó thắng cuộc tranh độ ưu tiên bằng cách làm lần sau không thể thắng, và làm bản ghi đè của grammar sống sót qua đợt đổi thương hiệu."
  - en: "`globals.css` (`<file>`) contains `<what>`. The global stylesheet holds only `@import`, `@source` and token declaration blocks."
    vi: "`globals.css` (`<file>`) chứa `<what>`. File CSS toàn cục chỉ có `@import`, `@source` và khối khai token."
  - en: "`<file>` redeclares a grammar token (`<what>`). A grammar token may be assigned only in `modules/brand/brand.css`; a CSS module or `globals.css` redeclaring one makes a component leave the family and unrebrandable."
    vi: "`<file>` khai lại token của grammar (`<what>`). Token của grammar chỉ được đặt giá trị ở `modules/brand/brand.css`; CSS module hay `globals.css` khai lại làm component khác family và không đổi thương hiệu được."
  - en: "`brand.css` (`<file>`) has the wrong shape (`<what>`). The brand layer declares only grammar tokens, in one light block and one dark block, each token carrying both values."
    vi: "`brand.css` (`<file>`) sai hình dạng (`<what>`). Lớp thương hiệu chỉ khai token của grammar, trong một khối sáng và một khối tối, mỗi token có đủ hai giá trị."
  - en: "`brand.css` (`<file>`) has a status colour failing the HeroUI soft-pair standard (`<what>`). Each status tone (success, warning, danger, info) has `--<tone>-soft` (light background) and `--<tone>-soft-foreground` (text, icon, dot colour) in both light and dark; soft text on a light surface and on the page must reach at least 3:1, body `--foreground` on `--background` at least 4.5:1, and a solid tone may not be a text colour when under 4.5:1."
    vi: "`brand.css` (`<file>`) có màu trạng thái không đạt chuẩn cặp mềm HeroUI (`<what>`). Mỗi tông trạng thái (success, warning, danger, info) có `--<tông>-soft` (nền nhạt) và `--<tông>-soft-foreground` (màu chữ, icon, chấm) ở cả sáng và tối; chữ mềm trên nền nhạt và trên nền trang phải đạt ≥ 3:1, chữ thân `--foreground` trên `--background` ≥ 4.5:1, và tông đặc không được dùng làm màu chữ khi dưới 4.5:1."
  - en: "`<file>` is a CSS module. HFS forbids `*.module.css`: a private stylesheet per component is where a second design system begins."
    vi: "`<file>` là CSS module. HFS cấm `*.module.css`: một stylesheet riêng cho từng component là nơi hệ thiết kế thứ hai bắt đầu."
  - en: "CSS in `<file>` has a class selector (`<what>`). App CSS does not define components; styling flows through grammar components and tokens."
    vi: "CSS ở `<file>` có selector class (`<what>`). CSS của app không định nghĩa component; kiểu đi qua component và token của grammar."
  - en: "A `@media` in `<file>` uses breakpoint `<what>` outside the grammar scale, so the layout changes at a width different from the other components."
    vi: "`@media` ở `<file>` dùng breakpoint `<what>` ngoài thang của grammar, nên bố cục đổi ở độ rộng khác các component khác."
  - en: "`@source` in `<file>` points at a path that does not exist (`<what>`). Tailwind scans no file and silently drops the utilities the components use."
    vi: "`@source` ở `<file>` trỏ tới đường dẫn không tồn tại (`<what>`). Tailwind không quét file nào và lặng lẽ làm mất các utility mà component dùng."
  - en: "`globals.css` (`<file>`) imports in the wrong order or imports outside the standard list (`<what>`). The standard order: tailwindcss, @heroui/styles/css, the grammar family stylesheet, modules/brand/brand.css, then `@source`."
    vi: "`globals.css` (`<file>`) import sai thứ tự hoặc import ngoài danh sách chuẩn (`<what>`). Thứ tự chuẩn: tailwindcss, @heroui/styles/css, stylesheet family của grammar, modules/brand/brand.css, rồi `@source`."
  # packages/stylelint/lib/why.mjs - next steps (fix field)
  - en: "Replace it with a grammar `var(--...)` (`--grammar-*`, a family token, a semantic token) or a neutral keyword."
    vi: "Thay bằng `var(--...)` của grammar (`--grammar-*`, token của family, token ngữ nghĩa) hoặc từ khóa trung tính."
  - en: "Use a grammar token; for a brand colour declare it in `modules/brand/brand.css` for both light and dark."
    vi: "Dùng token grammar; nếu là màu thương hiệu thì khai ở `modules/brand/brand.css` cho cả sáng và tối."
  - en: "Use a utility from the scale, or a token reference of the form `[var(--...)]`."
    vi: "Dùng utility có trong thang, hoặc tham chiếu token dạng `[var(--...)]`."
  - en: "Drop `!important`; fix the cascade order (grammar's layers already decide who wins)."
    vi: "Bỏ `!important`; sửa thứ tự cascade (layer của grammar đã quyết ai thắng)."
  - en: "Move the styling into grammar utilities; inside `globals.css` keep only `@import`/`@source` and tokens that alias `var(--...)`."
    vi: "Chuyển phần tạo kiểu vào utility của grammar; trong `globals.css` chỉ giữ `@import`/`@source` và token là bí danh `var(--...)`."
  - en: "Delete the declaration; to change the value, change it in `modules/brand/brand.css`, for both light and dark."
    vi: "Xóa khai báo; nếu cần đổi giá trị thì đổi ở `modules/brand/brand.css`, cho cả sáng và tối."
  - en: "Keep only token declarations in `:root` and `.dark` (or `@media (prefers-color-scheme: dark)`); add the value the other mode is missing."
    vi: "Chỉ giữ khai báo token trong `:root` và `.dark` (hoặc `@media (prefers-color-scheme: dark)`); thêm giá trị còn thiếu cho chế độ kia."
  - en: "Declare the full soft pair for both light and dark (the shared block `:root, .light, .dark` counts for both); blend `--<tone>-soft-foreground` toward `--foreground` until the threshold is met; a value that cannot be resolved is rewritten as a readable colour (hex, rgb, hsl, oklab, oklch, color-mix)."
    vi: "Khai đủ cặp mềm cho cả sáng và tối (khối chung `:root, .light, .dark` tính cho cả hai); trộn `--<tông>-soft-foreground` về phía `--foreground` cho tới khi đạt ngưỡng; giá trị không phân giải được thì sửa thành màu đọc được (hex, rgb, hsl, oklab, oklch, color-mix)."
  - en: "Remove `stylelint-disable` and fix the cause."
    vi: "Xóa `stylelint-disable` và sửa nguyên nhân."
  - en: "Delete the file; style with grammar components and tokens, and extend grammar where it falls short."
    vi: "Xóa file; tạo kiểu bằng component và token của grammar, phần grammar còn thiếu thì bổ sung vào grammar."
  - en: "Remove the rule; use a grammar component or token instead of a private class."
    vi: "Xóa rule; dùng component grammar hoặc token thay cho class riêng."
  - en: "Use a breakpoint of the grammar scale (30rem, 40rem, 48rem, 70rem), or the px equivalent at 16px/rem."
    vi: "Dùng một breakpoint của thang grammar (30rem, 40rem, 48rem, 70rem), hoặc px tương đương ở 16px/rem."
  - en: "Fix the `@source` path so it points at a real directory, resolved from the CSS file itself."
    vi: "Sửa đường dẫn `@source` để trỏ tới thư mục có thật, tính từ chính file CSS."
  - en: "Reorder `@import` to the standard order and drop imports outside the list; `@source` comes last."
    vi: "Sắp lại `@import` theo thứ tự chuẩn và bỏ import ngoài danh sách; `@source` đặt sau cùng."
