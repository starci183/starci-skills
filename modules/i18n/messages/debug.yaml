schema: starci/i18n-catalog@1
area: debug
scope: runtime
purpose: Owner-visible Vietnamese of the lines of `starci debug digest` (scripts/reconciler/debug-digest-text.mjs), keyed from their English source (scripts/lib/i18n.mjs).
messages:
  - en: "Controllers {names} are off although the config asks for them; nothing they own is being done."
    vi: "Các controller {names} đang tắt dù cấu hình yêu cầu chạy; không có việc nào của chúng được làm."
  - en: "The reconciler has no leader row; no controller runs."
    vi: "Reconciler không có dòng leader; không controller nào chạy."
  - en: "The reconciler leader (pid {pid}) has not beaten for {min} min."
    vi: "Leader của reconciler (pid {pid}) đã {min} phút không có nhịp."
  - en: "The reconciler runs code {have} while the live runtime is {live}; restart it to pick the change up."
    vi: "Reconciler đang chạy mã {have} trong khi runtime đang dùng là {live}; cần khởi động lại để nhận thay đổi."
  - en: "Controllers in safe mode: {names}."
    vi: "Các controller đang ở chế độ an toàn: {names}."
  - en: "{n} queue item(s) of the {controller} controller keep failing."
    vi: "{n} mục hàng đợi của controller {controller} liên tục thất bại."
  - en: "The Supervisor seat is {state}."
    vi: "Seat Supervisor đang ở trạng thái {state}."
  - en: "The Supervisor terminal is not live ({reason})."
    vi: "Terminal của Supervisor không còn sống ({reason})."
  - en: "The Supervisor terminal does not take its inputs."
    vi: "Terminal của Supervisor không nhận được đầu vào."
  - en: "Stale gate {kind} ({decider}) is {min} min past due: {summary}"
    vi: "Cổng cũ {kind} ({decider}) đã quá hạn {min} phút: {summary}"
  - en: "Decision Item {kind} ({decider}) is {min} min past due: {summary}"
    vi: "Decision Item {kind} ({decider}) đã quá hạn {min} phút: {summary}"
  - en: "The Kernel of {name} is not alive (job {job}, probe {probe})."
    vi: "Kernel của {name} không còn sống (job {job}, kiểm tra {probe})."
  - en: "The Kernel of {name} acked runtime {acked} while {current} is current ({files} file(s) behind)."
    vi: "Kernel của {name} xác nhận runtime {acked} trong khi bản hiện hành là {current} (chậm {files} tệp)."
  - en: "The Kernel of {name} is idle with {ready} unit(s) of ready work, last woken {min} min ago."
    vi: "Kernel của {name} đang rảnh trong khi có {ready} việc sẵn sàng, lần đánh thức cuối {min} phút trước."
  - en: "{op} ({jobId}) is held by {hold} {min} min past its deadline; handler {handler}; the bound is spent and {next} must take over."
    vi: "{op} ({jobId}) bị giữ bởi {hold}, quá hạn {min} phút; bên xử lý {handler}; hạn mức đã hết và {next} phải tiếp quản."
  - en: "{op} ({jobId}) is held by {hold}, which the hold policy table does not list."
    vi: "{op} ({jobId}) bị giữ bởi {hold}, mà bảng chính sách giữ việc không liệt kê."
  - en: "{op} is {status} and no cause is recorded for the stop."
    vi: "{op} ở trạng thái {status} và không có nguyên nhân nào được ghi cho lần dừng này."
  - en: "{op} is {status} waiting on the owner, but no owner ask is open."
    vi: "{op} ở trạng thái {status} chờ owner, nhưng không có câu hỏi owner nào đang mở."
  - en: "{op} is {status} for {min} min and neither a retry, a Decision Item nor an incident follows it. {cause}"
    vi: "{op} ở trạng thái {status} đã {min} phút mà không có lần thử lại, Decision Item hay sự cố nào theo sau. {cause}"
  - en: "{op} ({jobId}) runs {min} min past its job deadline."
    vi: "{op} ({jobId}) đang chạy quá hạn job {min} phút."
  - en: "The status of {name} could not be read: {error}"
    vi: "Không đọc được trạng thái của {name}: {error}"
  - en: "The {provider} reservation {id} ({state}) is live for {owner}, which is not running; held {min} min."
    vi: "Chỗ giữ {provider} {id} ({state}) còn hiệu lực cho {owner}, nhưng việc này không chạy; đã giữ {min} phút."
  - en: "StarCi debug digest at {time}"
    vi: "Bản tóm tắt gỡ lỗi StarCi lúc {time}"
  - en: "No problem found."
    vi: "Không thấy vấn đề nào."
  - en: "The machine store is not readable ({reason}); nothing to report."
    vi: "Không đọc được kho máy ({reason}); không có gì để báo."
  - en: "No workflow is running."
    vi: "Không có workflow nào đang chạy."
  - en: "ALARM: {text}"
    vi: "BÁO ĐỘNG: {text}"
  - en: "Reconciler: {leader}; controllers {controllers}"
    vi: "Reconciler: {leader}; controller {controllers}"
  - en: "leader pid {pid} beat {sec}s ago, code {rev}"
    vi: "leader pid {pid} có nhịp {sec} giây trước, mã {rev}"
  - en: "no leader"
    vi: "không có leader"
  - en: "Supervisor: seat {state}, terminal {terminal}, last seen {seen}, last woken {woken}; {open} open Decision Item(s), {due} past due"
    vi: "Supervisor: seat {state}, terminal {terminal}, thấy lần cuối {seen}, đánh thức lần cuối {woken}; {open} Decision Item đang mở, {due} quá hạn"
  - en: "Workflow {name} ({ledger}) phase {phase}"
    vi: "Workflow {name} ({ledger}) giai đoạn {phase}"
  - en: "  Kernel: {alive}, last woken {woken}, acked runtime {acked} of {current}, frontier {state}, {ready} unit(s) of ready work"
    vi: "  Kernel: {alive}, đánh thức lần cuối {woken}, đã xác nhận runtime {acked} trên {current}, frontier {state}, {ready} việc sẵn sàng"
  - en: "alive"
    vi: "còn sống"
  - en: "NOT alive"
    vi: "KHÔNG còn sống"
  - en: "  Running: {items}"
    vi: "  Đang chạy: {items}"
  - en: "  Held: {op} by {hold}; handler {handler}; {step}; deadline {deadline}"
    vi: "  Đang giữ: {op} bởi {hold}; bên xử lý {handler}; {step}; hạn {deadline}"
  - en: "  Stopped: {op} {status} - {cause}; handler {handler}; next step {taken}; {verdict}"
    vi: "  Đã dừng: {op} {status} - {cause}; bên xử lý {handler}; bước tiếp theo {taken}; {verdict}"
  - en: "taken ({by})"
    vi: "đã làm ({by})"
  - en: "still inside its bound"
    vi: "vẫn trong hạn mức"
  - en: "bound spent: {next} takes over"
    vi: "hạn mức đã hết: {next} tiếp quản"
  - en: "retry {id} ({detail})"
    vi: "thử lại {id} ({detail})"
  - en: "Decision Item {id} ({detail})"
    vi: "Decision Item {id} ({detail})"
  - en: "incident {id} ({detail})"
    vi: "sự cố {id} ({detail})"
  - en: "waits on op {id} ({detail})"
    vi: "chờ op {id} ({detail})"
  - en: "not taken"
    vi: "chưa làm"
  - en: "reasonable"
    vi: "hợp lý"
  - en: "NOT reasonable"
    vi: "KHÔNG hợp lý"
  - en: "  Tokens: {items}"
    vi: "  Token: {items}"
  - en: "Admission: {live} live reservation(s), {leaked} not backed by a running job"
    vi: "Cấp phép: {live} chỗ giữ còn hiệu lực, {leaked} không có job đang chạy đứng sau"
  - en: "Problems, ordered by the work each blocks:"
    vi: "Vấn đề, xếp theo lượng việc bị chặn:"
  - en: "  {n}. [blocks {blocks}] {text}"
    vi: "  {n}. [chặn {blocks}] {text}"
  - en: "never"
    vi: "chưa bao giờ"
  - en: "in {min} min"
    vi: "sau {min} phút"
  - en: "{min} min over"
    vi: "quá {min} phút"
  - en: "{min} min ago"
    vi: "{min} phút trước"
