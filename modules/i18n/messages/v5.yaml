schema: starci/i18n-catalog@1
area: v5
purpose: Owner-readable Vietnamese for the UI op catalog (ui/api/op-catalog.mjs), keyed from the English source.
messages:
  - en: "Reads the owner's request, picks the matching workflow and writes a scope summary — nothing real is done yet."
    vi: "Đọc yêu cầu của chủ dự án, chọn luồng công việc phù hợp và viết bản tóm tắt phạm vi — chưa làm gì thật."
  - en: "Analyzes a request and picks an evidence-based workflow, with no side effects."
    vi: "Phân tích một yêu cầu và chọn luồng công việc dựa trên bằng chứng, không tạo tác động nào."
  - en: "Turns the request into a bounded scope: what may be touched, dependencies and exclusions. Analysis only; nothing written beyond records."
    vi: "Biến yêu cầu thành phạm vi có giới hạn: các mục được phép đụng tới, phụ thuộc và phần loại trừ. Chỉ phân tích, không ghi gì ngoài hồ sơ."
  - en: "Closes out a scope (end of lifecycle), keeps the needed evidence and does not break what is in use."
    vi: "Kết thúc gọn một phạm vi (cuối vòng đời), giữ lại bằng chứng cần thiết và không phá thứ đang được dùng."
  - en: "Settles the business behaviour of the work: enough to build and for an independent party to accept, then refined from feedback."
    vi: "Chốt hành vi nghiệp vụ của phần việc: đủ để làm và để bên độc lập nghiệm thu, rồi tinh chỉnh theo phản hồi."
  - en: "Designs the minimal architecture still enough to build the work safely, then adjusted from evidence during implementation."
    vi: "Thiết kế kiến trúc tối thiểu nhưng đủ để xây an toàn cho phần việc, rồi điều chỉnh theo bằng chứng khi triển khai."
  - en: "Settles the product's visual identity: colours, type, logo, icons, voice and frame layout."
    vi: "Chốt nhận diện hình ảnh của sản phẩm: màu, chữ, logo, biểu tượng, giọng điệu và bố cục khung."
  - en: "Draws the interface direction with real components before coding: picks the main screens and builds each state."
    vi: "Vẽ hướng giao diện bằng thành phần thật trước khi code: chọn các màn hình chính và dựng từng trạng thái."
  - en: "Creates the artwork the approved interface needs, stored as real files in the repo."
    vi: "Tạo các hình minh hoạ mà giao diện đã duyệt cần, lưu thành tệp thật trong repo."
  - en: "Scaffolds the new interface code and proves it runs (green build, first screenshot)."
    vi: "Dựng khung mã giao diện mới và chứng minh nó chạy được (build xanh, có ảnh chụp đầu tiên)."
  - en: "Builds the chosen interface per the drawings, business rules and architecture, then verifies the real rendering."
    vi: "Làm phần giao diện đã chọn theo bản vẽ, nghiệp vụ và kiến trúc, rồi kiểm tra kết quả hiển thị thật."
  - en: "Checks the real interface against the owner-approved drawings and produces a reproducible defect list."
    vi: "Kiểm tra giao diện thật so với bản vẽ chủ dự án đã duyệt, ra danh sách lỗi có thể tái hiện."
  - en: "Asks the owner for exactly the one thing only they can give: an access key, account, data, decision or permission."
    vi: "Hỏi chủ dự án đúng một thứ chỉ họ có thể đưa: khoá truy cập, tài khoản, dữ liệu, quyết định hoặc cho phép."
  - en: "Writes the Work record for one part: the write scope, proof requirements and a check command per requirement."
    vi: "Viết hồ sơ công việc (Work) cho một phần: phạm vi ghi, yêu cầu chứng minh và lệnh kiểm tra cho từng yêu cầu."
  - en: "Builds one chosen backend result and proves its contract with real code."
    vi: "Làm một kết quả backend đã chọn và chứng minh hợp đồng của nó bằng mã thật."
  - en: "Scaffolds new backend code in the repo and proves its build tooling runs."
    vi: "Dựng khung mã backend mới trong repo và chứng minh công cụ build của nó chạy được."
  - en: "Scaffolds a new package/library and proves the consumer can import it."
    vi: "Dựng một package/thư viện mới và chứng minh nơi dùng import được."
  - en: "Verifies an external integration against the real provider (a test environment), keeping the exchange as evidence."
    vi: "Kiểm chứng một tích hợp bên ngoài với nhà cung cấp thật (môi trường thử), giữ lại bằng chứng trao đổi."
  - en: "Runs the user flows in order with real screenshots/video, then cleans up."
    vi: "Chạy các luồng người dùng theo thứ tự, có ảnh/video thật và dọn dẹp sau đó."
  - en: "Prepares an assisted UAT run with steps needing a real person, frozen so it cannot be edited later."
    vi: "Chuẩn bị phiên duyệt UAT có bước cần người thật, đóng băng để không bị sửa lén."
  - en: "Re-checks an assisted UAT run from its receipt: evidence, data, cleanup — \"the person clicked through\" is not acceptance."
    vi: "Kiểm lại phiên UAT có người hỗ trợ từ biên nhận: bằng chứng, dữ liệu, dọn dẹp — không coi \"người bấm xong\" là nghiệm thu."
  - en: "Proves the delivered part through the public API on the real system (manual only, when the owner asks)."
    vi: "Chứng minh phần đã giao qua API công khai trên hệ thống thật (chỉ chạy tay, khi chủ dự án yêu cầu)."
  - en: "Measures real performance on the running product and keeps the numbers as evidence; the product is not changed."
    vi: "Đo hiệu năng thật trên sản phẩm đang chạy và giữ số đo làm bằng chứng, không sửa sản phẩm."
  - en: "Audits code and configuration security (read-only), records evidence-backed findings, never self-fixes."
    vi: "Rà soát bảo mật mã và cấu hình (chỉ đọc), ghi lại phát hiện có bằng chứng, không tự sửa."
  - en: "Independently checks the delivered result (business logic, interface, API…) without fixing it for the builders."
    vi: "Kiểm tra độc lập kết quả đã giao (nghiệp vụ, giao diện, API…) mà không sửa thay bên làm."
  - en: "Hands over to the owner: what was done, how it was tested, what is missing, what risks — then asks for approval."
    vi: "Bàn giao cho chủ dự án: đã làm gì, chạy thử thế nào, thiếu gì, rủi ro nào — rồi xin duyệt."
  - en: "Restructures one part of the code while keeping its behaviour, proven by the same test before and after."
    vi: "Tái cấu trúc một phần mã nhưng giữ nguyên hành vi, chứng minh bằng cùng một bài kiểm tra trước và sau."
  - en: "Writes the test files for one part and proves a real test runner accepts them."
    vi: "Viết các tệp kiểm thử cho một phần và chứng minh chúng được test runner thật thu nhận."
  - en: "Writes documentation for the chosen scope from the settled records and the real code."
    vi: "Viết tài liệu cho phạm vi đã chọn từ hồ sơ đã chốt và mã thật."
  - en: "Creates or fixes one content unit, with grounded claims and media/code checks."
    vi: "Tạo hoặc sửa một đơn vị nội dung, các nhận định có căn cứ và có kiểm tra media/mã."
  - en: "Prepares a draft decision: the question, the options, a recommendation — the owner may overturn it."
    vi: "Chuẩn bị một quyết định tạm: câu hỏi, các phương án, khuyến nghị — chủ dự án có thể lật lại."
  - en: "Creates a new goal revision from the old goal and the requested change, with a clear diff and no self-granted scope."
    vi: "Tạo bản goal mới từ goal cũ và thay đổi được yêu cầu, có diff rõ ràng, không tự mở rộng quyền."
  - en: "Releases, deploys or runs the chosen database migration, then verifies the result remotely."
    vi: "Phát hành, triển khai hoặc di chuyển CSDL đã chọn và kiểm tra kết quả từ xa."
  - en: "Brings a running service/environment to the required state, with evidence afterwards."
    vi: "Đưa dịch vụ/môi trường chạy về trạng thái yêu cầu, có bằng chứng sau khi làm."
  - en: "Creates or rebuilds a .starciwork workspace with verified links and preserved provenance."
    vi: "Tạo hoặc dựng lại không gian .starciwork với liên kết đã kiểm và nguồn gốc được giữ."
  - en: "Fixes an incorrectly prepared rule/guideline and its related references from applied evidence."
    vi: "Sửa một quy tắc/hướng dẫn chuẩn bị sai và các tham chiếu liên quan từ bằng chứng áp dụng."
  - en: "Adds a unit to the design component system when the product needs one it lacks."
    vi: "Bổ sung một đơn vị vào hệ thành phần thiết kế khi sản phẩm cần mà chưa có."
