schema: starci/i18n-catalog@1
area: kernel
scope: runtime
purpose: Owner-visible messages from kernel verbs, ask forms, automatic operation, why reasons and derived log rows, keyed from their English source.
messages:
  - en: "Owner decision"
    vi: "Quyết định của thầy"
  - en: "Artifacts under review"
    vi: "Hình để so sánh"
  - en: "Choose"
    vi: "Chọn"
  - en: "Credentials"
    vi: "Thông tin bí mật"
  - en: "Note to the workflow (optional)"
    vi: "Ghi chú cho workflow (không bắt buộc)"
  - en: "Submit answer"
    vi: "Gửi câu trả lời"
  - en: "This ask is already answered — view only."
    vi: "Câu hỏi này đã được trả lời, chỉ xem."
  - en: "Answer received"
    vi: "Đã nhận câu trả lời"
  - en: "Secret values land in encrypted stack custody and are exposed through *_FILE pointers — never in the ledger, the chat, or any log. Submitting wakes the workflow kernel."
    vi: "Giá trị bí mật được lưu mã hoá trong stack custody và chỉ lộ qua con trỏ *_FILE, không bao giờ vào ledger, chat hay log. Gửi xong sẽ đánh thức kernel của workflow."
  - en: "Submitting wakes the workflow kernel."
    vi: "Gửi xong sẽ đánh thức kernel của workflow."
  - en: "Note on this image (for a redraw)"
    vi: "Ghi chú cho hình này (nếu cần vẽ lại)"
  - en: "Accept and make it the golden reference for this page archetype"
    vi: "Chấp nhận và đặt làm hình chuẩn (golden) cho loại trang này"
  - en: "self-accepted provisional"
    vi: "tự nhận tạm"
  - en: "Supply credentials - the one owner step before the deferred live proofs (UAT/e2e) resume automatically:"
    vi: "Bổ sung credential - bước duy nhất thầy cần làm trước khi các bước kiểm chứng trực tiếp (UAT/e2e) chạy lại tự động:"
  - en: "Also waiting on the owner (re-opened at the same time, one question each):"
    vi: "Cũng chờ thầy quyết (được mở lại cùng lúc, mỗi mục một câu hỏi):"
  - en: "Values go into this form only and are sealed into custody; they never appear in chat, logs or documents."
    vi: "Giá trị chỉ nhập vào biểu mẫu này, được lưu mã hoá; không hiện trong chat, log hay tài liệu."
  - en: "the owner review ledger"
    vi: "sổ chờ thầy xem lại"
  - en: "deferred to the final review"
    vi: "hoãn tới buổi duyệt cuối"
  - en: "the op did not write the structured log rows it owed ({missing})"
    vi: "op không ghi đủ nhật ký có cấu trúc ({missing})"
  - en: "the op's scratch directory (starci-job-scratch) is deleted when the op files its report, so the path no longer exists when the runtime re-runs it"
    vi: "thư mục tạm của op (starci-job-scratch) đã bị xóa khi op nộp report, nên lúc runtime chạy lại đường dẫn đó không còn"
  - en: "try {n} of {budget}"
    vi: "lần {n}/{budget}"
  - en: "try {n}"
    vi: "lần {n}"
  - en: "Kernel will re-dispatch the op ({next}{route})."
    vi: "Kernel sẽ giao lại op ({next}{route})."
  - en: ", route {route} {firing}/{limit}"
    vi: ", tuyến {route} {firing}/{limit}"
  - en: "Kernel dispatches a root-cause repair op first, then re-runs this op (route {route}{jobs})."
    vi: "Kernel giao op sửa gốc lỗi trước rồi chạy lại op này (tuyến {route}{jobs})."
  - en: "Waiting on the owner to decide: {reason}"
    vi: "Chờ owner quyết định: {reason}"
  - en: "Waiting on the Supervisor to handle incident {id}: {reason}"
    vi: "Chờ Supervisor xử lý sự cố {id}: {reason}"
  - en: "The root cause is elsewhere{root}; this op spends no try and waits for that side to fix it."
    vi: "Gốc lỗi nằm ở nơi khác{root}; op này không tốn lượt thử, chờ bên đó sửa."
  - en: "Deferred to the final review: {reason}"
    vi: "Hoãn tới buổi duyệt cuối: {reason}"
  - en: "No automatic next step: {reason}"
    vi: "Không có bước tiếp tự động: {reason}"
  - en: "All {budget} tries of this work are used up; waiting on the owner or the Supervisor to decide."
    vi: "Đã dùng hết {budget} lần thử của việc này; chờ owner hoặc Supervisor quyết định."
  - en: "Kernel will decide the next step."
    vi: "Kernel sẽ quyết định bước tiếp theo."
  - en: "The op could not be launched{step}; the runtime refused at dispatch time."
    vi: "Không khởi chạy được op{step}; runtime từ chối lúc giao việc."
  - en: " (step {step}{signal})"
    vi: " (bước {step}{signal})"
  - en: "no detail"
    vi: "không có chi tiết"
  - en: "The worker may have run partway: reconcile verifies the state before re-dispatching; not counted against the tries."
    vi: "Có thể worker đã chạy được một phần: reconcile kiểm chứng trạng thái trước khi giao lại; không tính vào số lần thử."
  - en: "Not counted against the tries; the work returns to the queue and Kernel re-dispatches it."
    vi: "Không tính vào số lần thử; việc quay về hàng chờ và Kernel giao lại."
  - en: "The op worker died mid-run and could not file its result."
    vi: "Worker của op chết giữa chừng, không nộp được kết quả."
  - en: "The worker terminal or process vanished before the op filed its report."
    vi: "Terminal hoặc tiến trình của worker biến mất trước khi op nộp report."
  - en: "Reconcile clears the lease and re-dispatches the op; Kernel will re-run it."
    vi: "Reconcile dọn lease và giao lại op; Kernel sẽ chạy lại."
  - en: "This run was cancelled and put back in the queue, with no verdict yet."
    vi: "Lần chạy này bị hủy và xếp lại hàng chờ, chưa có phán quyết."
  - en: "the runtime requeued the work after the worker was gone"
    vi: "runtime xếp lại việc sau khi worker không còn"
  - en: "The work returns to the queue; Kernel re-dispatches it, not counted against the tries."
    vi: "Việc quay về hàng chờ; Kernel giao lại, không tính vào số lần thử."
  - en: "This run was cancelled."
    vi: "Lần chạy này đã bị hủy."
  - en: "the workflow was archived or the work dropped"
    vi: "workflow bị lưu trữ hoặc việc bị bỏ"
  - en: "There is no next step for this run."
    vi: "Không có bước tiếp theo cho lần chạy này."
  - en: "The op paused to ask the owner{q}"
    vi: "Op dừng lại để hỏi owner{q}"
  - en: "The op needs a decision or information only the owner has; this is a wait, not a failure."
    vi: "Op cần một quyết định hoặc thông tin mà chỉ owner có; đây là chờ, không phải lỗi."
  - en: "Waiting for the owner to answer. Once answered, Kernel re-dispatches the op; this question does not count against the tries."
    vi: "Chờ owner trả lời. Trả lời xong Kernel giao lại op; lần hỏi này không tính vào số lần thử."
  - en: "The op reported blocked{kind}: {detail}"
    vi: "Op báo bị chặn{kind}: {detail}"
  - en: "Related codes: {codes}."
    vi: "Mã liên quan: {codes}."
  - en: "The op declared it cannot continue."
    vi: "Op khai báo không thể tiếp tục."
  - en: "The op ended without filing a report, so the runtime scored it failed."
    vi: "Op kết thúc mà không nộp report, nên runtime chấm thất bại."
  - en: "The worker stopped or exited before filing its report."
    vi: "Worker dừng hoặc thoát trước khi nộp báo cáo."
  - en: "The op reported done but its own check {name} was declared exit {declared} (red){rerun}{detail}."
    vi: "Op báo xong nhưng chính check {name} nó khai đã thoát {declared} (đỏ){rerun}{detail}."
  - en: "; the runtime re-ran it and it also exited {exit}"
    vi: "; runtime chạy lại cũng thoát {exit}"
  - en: "The op declared check {name} exited 0 (green) in its own working directory; the runtime re-ran it after the report was filed and it exited {exit}{detail}."
    vi: "Op khai check {name} thoát 0 (xanh) khi chạy trong thư mục làm việc của nó; runtime chạy lại sau khi report được nộp thì thoát {exit}{detail}."
  - en: "The op reported done but the runtime {verb} check {name} and it is red{tag}."
    vi: "Op báo xong nhưng runtime {verb} check {name} thì đỏ{tag}."
  - en: "re-ran"
    vi: "chạy lại"
  - en: "re-read"
    vi: "đọc lại"
  - en: "The runtime's independent check did not pass."
    vi: "Check độc lập của runtime không đạt."
  - en: "A check went red because of changes by another workflow, not a fault of this op."
    vi: "Check đỏ vì thay đổi của workflow khác, không phải lỗi của op này."
  - en: "The red checks ({checks}) come from changes by {peers}."
    vi: "Các check đỏ ({checks}) do thay đổi của {peers}."
  - en: "a peer"
    vi: "một peer"
  - en: "Wait for that side to fix it; this run spends no try."
    vi: "Chờ bên kia sửa; lần này không tốn lượt thử."
  - en: "The op reported itself failed"
    vi: "Op tự báo thất bại"
  - en: "The op only completed a part"
    vi: "Op chỉ làm được một phần"
  - en: "The runtime scored it failed (the op reported {outcome})"
    vi: "Runtime chấm thất bại (op báo {outcome})"
  - en: "unknown"
    vi: "không rõ"
  - en: "; check {name} is red{tag}"
    vi: "; check {name} đỏ{tag}"
  - en: "Class: {class} — {reason}"
    vi: "Phân loại: {class} — {reason}"
  - en: "The runtime found no passing check for this run."
    vi: "Runtime không tìm thấy check nào đạt cho lần chạy này."
  - en: "The op filed its report and is waiting for the runtime or Kernel verdict."
    vi: "Op đã nộp report và đang chờ runtime hoặc Kernel phán quyết."
  - en: "The report ({outcome}) is recorded; the independent checks are not final yet."
    vi: "Report ({outcome}) đã được ghi; các check độc lập chưa chốt."
  - en: "unclear"
    vi: "chưa rõ"
  - en: "The runtime settles automatically; if a Kernel decision is needed, Kernel handles it on the next pass."
    vi: "Runtime settle tự động; nếu cần quyết định của Kernel, Kernel sẽ xử lý ở lượt kế."
  - en: "Dispatch {op}{try} to {model}{modelId}"
    vi: "Giao {op}{try} cho {model}{modelId}"
  - en: " (try {n})"
    vi: " (lần {n})"
  - en: "Dispatch of {op} failed at step {step}{err}"
    vi: "Giao {op} thất bại ở bước {step}{err}"
  - en: "The op filed its report: {outcome}"
    vi: "Op nộp báo cáo: {outcome}"
  - en: "Pass: {name}"
    vi: "Đạt: {name}"
  - en: "Fail: {name}"
    vi: "Trượt: {name}"
  - en: "Ran {name} (exit {exit})"
    vi: "Chạy {name} (exit {exit})"
  - en: "Failed {name} (exit {exit})"
    vi: "Lỗi {name} (exit {exit})"
  - en: "Added"
    vi: "Thêm"
  - en: "Deleted"
    vi: "Xoá"
  - en: "Renamed"
    vi: "Đổi tên"
  - en: "Modified"
    vi: "Sửa"
  - en: "Image"
    vi: "Ảnh"
  - en: "Video"
    vi: "Video"
  - en: "Trace"
    vi: "Trace"
  - en: "Kernel settled the verdict {verdict}{ev}"
    vi: "Kernel chốt verdict {verdict}{ev}"
  - en: " · {passed}/{observed} checks passed"
    vi: " · {passed}/{observed} check đạt"
  - en: "Landed {head}{repo}"
    vi: "Đã land {head}{repo}"
  - en: " into {repo}"
    vi: " vào {repo}"
  - en: "Incident{kind}: {detail}"
    vi: "Sự cố{kind}: {detail}"
  - en: "Incident cleared{kind}: {detail}"
    vi: "Gỡ sự cố{kind}: {detail}"
  - en: "The op stopped without filing a report ({liveness})"
    vi: "Op dừng mà không nộp báo cáo ({liveness})"
  - en: "Job dropped: {reason}"
    vi: "Bỏ job: {reason}"
  - en: "The contract of op {op} changed after dispatch ({from} → {to})"
    vi: "Hợp đồng op {op} đổi sau khi giao ({from} → {to})"
  - en: "Foundation {name} landed {version}"
    vi: "Nền móng {name} đã land {version}"
  - en: "Run now: starci kernel dispatch-ready --workflow {wf} (running {running}/{allowed}, {ready} ready)."
    vi: "Chạy ngay: starci kernel dispatch-ready --workflow {wf} (running {running}/{allowed}, {ready} ready)."
  - en: "Action #{rank} [{tier}] {title}. Log: starci kernel decide --workflow {wf} --hypothesis \"...\" --action-key {key} --metric \"units/h\". Run: {command}"
    vi: "Hành động #{rank} [{tier}] {title}. Log: starci kernel decide --workflow {wf} --hypothesis \"...\" --action-key {key} --metric \"units/h\". Run: {command}"
  - en: "Vietnamese: the drawing (interface.draw) of {ui} is not settled yet, so code must not be written; dispatch implement only once it is drawn and accepted"
    vi: "Tiếng Việt: bản vẽ (interface.draw) của {ui} chưa được chốt nên chưa được viết code; vẽ xong và được chấp nhận rồi mới dispatch implement"
  - en: "Run unit tests"
    vi: "Chạy unit test"
