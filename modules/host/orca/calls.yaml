schema: starci/orca-calls@1
provider: orca
api: api.yaml
runner: scripts/api/orca/lib.mjs
purpose: |-
  The executable call surface: one typed entry per Orca call StarCi may issue, naming the command,
  its flags, the receipt paths that prove it, and the outcome/effectState classification its caller
  must apply. scripts/api/orca/lib.mjs loads this file once per process and orcaCall(verb, params)
  builds argv from command + flags, refuses a param this file does not declare, requires every
  `required` flag, applies `timeoutMs` and classifies the receipt, so an Orca failure comes back as
  a typed envelope rather than an untyped exception. The wrappers in scripts/api/orca/ — one .mjs
  file per verb — only name a verb and shape its receipt; tests/provider-orca.spec.mjs refuses a
  wrapper whose verb this file does not declare.
envelope:
  schema: starci/orca-call-result@1
  outcomes: [ok, failed, unknown]
  effectStates: [committed, none, partial, unknown]
  rules:
    - outcome ok means the call completed and its receipt satisfied every required path.
    - outcome failed with effectState none means the caller may retry the same candidate or fall through to the next candidate without reconciliation.
    - effectState partial names live residual resources; the caller must settle them (worker-stop, worker-release) and prove none before fallback.
    - outcome unknown or effectState unknown blocks fallback until a read-only reconciliation proves the actual state.
    - A call without a classify block is classified by exit code alone - 0 is ok/committed, non-zero is failed/none.
    - classify rules are evaluated in the order written and the first match wins, so each block ends with an unconditional rule.
defaults:
  timeoutMs: 30000
  spawnGraceMs: 15000
  jsonFlag: json
liveSchema:
  source: agent-context
  compare: [command, flags]
  before: first-call-of-kind-mutation
  cache: once-per-process
  onMismatch: refuse-before-effects
  refusal: 'outcome failed, effectState none, reason host-contract-drift, naming the verb and the missing command or flags'
  unreadableListing: refuse-before-effects
  envOverride: STARCI_ORCA_SKIP_LIVE_CHECK=1 skips the comparison; it exists for specs and stubbed binaries only.
  enforcedBy: scripts/api/orca/lib.mjs orcaCall; scripts/checks/providers.mjs --live compares every entry at once.
idempotency:
  flag: retry-request
  rule: |-
    A mutation whose process timed out or returned non-JSON is re-issued once with the same
    arguments plus --retry-request <deterministic id>; Orca returns the original result when it
    exists. If the replay is still unknown, the runner returns outcome unknown and the caller
    reconciles by reading worker-show for the deterministic display name.
calls:
  account-list:
    command: account list
    kind: read
    flags: [json]
    receipt: [result.rateLimits]
  agent-context:
    command: agent-context
    kind: read
    timeoutMs: 15000
    flags: []
    receipt: [commands, commandCount, schemaVersion]
  status:
    command: status
    kind: read
    timeoutMs: 15000
    flags: []
    receipt: [result.runtime.state]
  run-create:
    command: orchestration run-create
    kind: mutation
    flags: [objective, from]
    required: [objective]
    receipt: [result.run.id]
    creates: run
  task-create:
    command: orchestration task-create
    kind: mutation
    flags: [spec, task-title, display-name, deps, parent, run, from]
    required: [spec, run]
    receipt: [result.task.id, result.task.display_name]
    creates: task
    values: {parent: task-id, deps: task-id-list, run: run-id, from: terminal-handle}
  run-show:
    command: orchestration run-show
    kind: read
    flags: [id]
    required: [id]
    receipt: [result.run.id, result.run.coordinator_handle]
    note: >-
      The Run's coordinator_handle is the terminal Orca accepts task-create/task-update from. After a
      Kernel restart it still names the replaced terminal; scripts/kernel/orca-runs.mjs reads it and
      re-binds the Run before the next Task (run_not_found: create a new Run).
  run-use:
    command: orchestration run-use
    kind: mutation
    flags: [id, from]
    required: [id, from]
    receipt: [result.run.id]
    note: >-
      Binds the Run to the --from terminal as its coordinator. Issued only when run-show proves the
      coordinator is not the workflow's current Kernel terminal (one re-bind per Kernel replacement:
      a repeated run-use invalidates live Dispatches). Callers: api dispatch (ensureWorkflowRun) and
      api reconcile --orca-tasks.
  run-list:
    command: orchestration run-list
    kind: read
    flags: []
    receipt: [result.runs]
  task-list:
    command: orchestration task-list
    kind: read
    flags: [run, status, brief]
    required: [run]
    receipt: [result.tasks]
    note: A Run-scoped listing needs no sender terminal; without --run Orca refuses no_active_sender_terminal.
  task-update:
    command: orchestration task-update
    kind: mutation
    flags: [id, status, result, run, from]
    required: [id, status]
    allowedValues:
      status: [pending, ready, dispatched, completed, failed, blocked]
    receipt: [result.task.id]
    note: >-
      How an operation Task is closed. scripts/kernel/api.mjs settles a job by writing the verdict, closing the
      worker and then marking its Task done; api finish marks whatever Task the Run still holds open. A Task
      left open is what kept settled operations visible at the Orca sidebar root.
  worker-start:
    command: orchestration worker-start
    kind: mutation
    timeoutMs: 150000
    flags: [task, worktree, agent, model, effort, name, repo, base-branch, display-name, setup, retry-of, timeout-ms, run, from]
    required: [task, worktree, agent, run]
    forbidden: [terminal, on]
    forbiddenValues:
      on: [windows, macos, linux]
    receipt: [result.dispatchId]
    creates: dispatch
    note: "--from is resolved by Orca from the calling terminal when omitted; the canonical launcher always passes the exact Monitor or Coordinator handle. Receipts are flat (result.runId, result.taskId, result.dispatchId, result.state, result.stage, result.failedStage, result.lastError, result.setup, result.launch.effective, result.effects, result.residualResources) on both success and failure; a failed start still exits 1. For a fresh worker in an existing worktree, creation labels do not set the terminal title: after dispatch-show resolves the exact assignee, use terminal-rename to apply the semantic [Op] title."
    classify:
      - when: {exitCode: 0, path: result.state, in: [ready]}
        outcome: ok
        effectState: committed
      - when: {exitCode: 0, path: result.worker.state, in: [ready]}
        outcome: ok
        effectState: committed
      - when: {exitCode: 0}
        outcome: unknown
        effectState: unknown
        reason: worker-start exited 0 without a ready worker
      - when: {path: result.state, in: [outcome_unknown, unknown]}
        outcome: unknown
        effectState: unknown
      - when: {path: result.worker.state, in: [outcome_unknown, unknown]}
        outcome: unknown
        effectState: unknown
      - when: {path: result.residualResources, nonEmpty: true}
        outcome: failed
        effectState: partial
      - when: {path: result.worker.residualResources, nonEmpty: true}
        outcome: failed
        effectState: partial
      - when: {path: result.failedStage, exists: true}
        outcome: failed
        effectState: none
      - when: {path: result.stage, exists: true}
        outcome: failed
        effectState: none
      - when: {path: error.code, exists: true}
        outcome: failed
        effectState: none
      - when: {}
        outcome: unknown
        effectState: unknown
        reason: worker-start exited non-zero without a classifiable receipt
    recovery:
      failed: worker-start-retry-of
      partial: settle-dispatch
      unknown: reconcile-then-stop
  worker-show:
    command: orchestration worker-show
    kind: read
    flags: [dispatch]
    required: [dispatch]
    receipt: [result.dispatch.id, result.worker.state]
  worker-stop:
    command: orchestration worker-stop
    kind: mutation
    timeoutMs: 60000
    flags: [dispatch]
    required: [dispatch]
    receipt: [result.dispatchId, result.state]
    note: Receipt carries result.state (worker state after the stop), result.alreadySettled, result.processAction and result.mutation.requestId.
    classify:
      - when: {path: result.state, in: [stop_unknown, unverifiable, outcome_unknown]}
        outcome: unknown
        effectState: unknown
      - when: {path: error.code, in: [dispatch_inactive]}
        outcome: unknown
        effectState: unknown
        reason: Orca refuses to stop a Dispatch that is already stop_unknown; reconcile with worker-show and close the attempt's own terminal
      - when: {exitCode: 0, path: result.state, exists: true}
        outcome: ok
        effectState: committed
      - when: {exitCode: 0}
        outcome: unknown
        effectState: unknown
        reason: worker-stop exited 0 without a state receipt
      - when: {}
        outcome: failed
        effectState: none
  worker-release:
    command: orchestration worker-release
    kind: mutation
    timeoutMs: 60000
    flags: [dispatch]
    required: [dispatch]
    receipt: [result.dispatchId, result.state]
    note: Receipt carries result.state (released, already_released, retained, release_pending, release_unknown), result.reason and result.processAction.
    classify:
      - when: {exitCode: 0, path: result.state, in: [released, already_released]}
        outcome: ok
        effectState: committed
      - when: {path: result.state, in: [retained, release_pending]}
        outcome: failed
        effectState: partial
      - when: {path: result.state, in: [release_unknown]}
        outcome: unknown
        effectState: unknown
      - when: {exitCode: 0}
        outcome: unknown
        effectState: unknown
        reason: worker-release exited 0 without a classifiable state
      - when: {}
        outcome: failed
        effectState: none
  check:
    command: orchestration check
    kind: read
    timeoutMs: 960000
    flags: [terminal, run, ack, unread, peek, all, types, wait, timeout-ms]
    receipt: [result]
    note: --ack acknowledges the prior Delivery; a wait timeout is outcome ok with an empty batch. scripts/api/orca/ has no wrapper for it, so StarCi does not issue it. A check is fenced to the caller's bound Run (consumer_fenced), which is why worker questions are read through `inbox` instead.
  inbox:
    command: orchestration inbox
    kind: read
    flags: [limit, terminal, full]
    receipt: [result.messages]
    note: >-
      Non-consuming read across recipients, newest first: no Delivery is acknowledged and no message is
      marked read, and unlike `check` it is not fenced to the caller's bound Run. scripts/kernel/api.mjs
      reads worker `question` messages of the workflow's Runs through scripts/api/orca/orch-inbox.mjs, so a
      worker that used `orca orchestration ask` is never stranded behind a Kernel that may not call Orca
      (inc-b944cbaef24b, inc-20449a260df8). Rows carry {id, run_id, from_handle (dispatch:<id> or a
      terminal handle), type, subject, body, thread_id, payload JSON text {taskId, dispatchId, question,
      options}, created_at}; a reply is a later row whose thread_id is the question's id. The listing of a
      run with many workers is megabytes (a nivo inbox of 1000 rows was 1.4 MB), so scripts/api/orca/lib.mjs
      gives every read call a 64 MB spawnSync buffer instead of the 1 MB default that failed `api questions`
      with ENOBUFS (inc-13ab4be5059f), and the wrapper drops heartbeat and progress rows before any caller
      bridges the rest (status rows stay: Orca threads replies as status messages).
  reply:
    command: orchestration reply
    kind: mutation
    replay: none
    flags: [id, body, run, from]
    required: [id, body]
    receipt: [result]
    note: >-
      Answers one worker `question` message; the worker's blocking ask returns with the body. Issued only by
      `api reply` (scripts/api/orca/orch-reply.mjs) from the Kernel's own terminal, so Orca resolves --from to
      the Run's coordinator. No retry-request replay: a duplicate reply is a second message, so an unknown
      result is re-read with `inbox` (a row whose thread_id is the question id) before any retry.
  send:
    command: orchestration send
    kind: mutation
    flags: [subject, to, run, from, body, type, priority, thread-id, payload, task-id, dispatch-id, outcome, files-modified, report-path, phase, dispatch-capability]
    required: [subject]
    receipt: [result]
    note: scripts/api/orca/ has no wrapper for it, so StarCi does not issue it; an op reports through `api report`.
  worktree-create:
    command: worktree create
    kind: mutation
    replay: none
    timeoutMs: 180000
    note: |-
      The lane of one workflow: a git worktree of the named repository on a branch Orca creates, as a top-level
      row (--no-parent) so the workflow is its own row instead of a child of whoever created it. --setup skip
      keeps the creation a git operation only. result.worktree carries the Orca id (<repo-id>::<path>), the path
      and the branch ref the lane actually got, which is what the kernel records - it never guesses either.
    flags: [repo, name, base-branch, setup, no-parent, parent-worktree]
    required: [repo, name]
    receipt: [result.worktree]
  worktree-rm:
    command: worktree rm
    kind: mutation
    replay: none
    timeoutMs: 60000
    note: Removes the worktree from Orca and from git and preserves its branch (result.preservedBranch); the kernel closes a lane only after that lane is merged.
    flags: [worktree, force]
    required: [worktree]
    receipt: [result]
  worktree-set:
    command: worktree set
    kind: mutation
    replay: none
    note: Metadata write without retry-request support; it is naturally idempotent, so an unknown result is re-read with worktree-show.
    flags: [worktree, parent-worktree, display-name, workspace-status, no-parent]
    required: [worktree]
    receipt: [result]
  worktree-show:
    command: worktree show
    kind: read
    flags: [worktree]
    required: [worktree]
    receipt: [result.worktree]
  worktree-current:
    command: worktree current
    kind: read
    flags: []
    receipt: [result.worktree]
  tab-create:
    command: tab create
    kind: mutation
    replay: none
    flags: [url, worktree]
    required: [url, worktree]
    receipt: [result.browserPageId]
    note: Kernel-owned workflow credential page. Unknown effects are reconciled by tab-list with the exact session URL before any replacement.
  tab-list:
    command: tab list
    kind: read
    flags: [worktree]
    required: [worktree]
    receipt: [result.tabs]
  tab-show:
    command: tab show
    kind: read
    flags: [page, worktree]
    required: [page, worktree]
    receipt: [result.tab]
  tab-goto:
    command: goto
    kind: mutation
    replay: none
    flags: [url, page, worktree]
    required: [url, page, worktree]
    receipt: [result]
    note: Rebind only the workflow's persisted input page after helper restart. Never navigate an unrelated owner tab.
  terminal-create:
    command: terminal create
    kind: mutation
    replay: none
    flags: [worktree, title, command]
    required: [title, command]
    receipt: [result.terminal.handle]
    note: Command-terminal launch only; the command is the declared target command prefixed with the credential refresh. Never used to attach a shell to a managed agent. Orca's CLI sends a command whose first word is codex or claude down the renderer-backed tab path (10s handle wait, "Timed out waiting for terminal handle after creation", tab spawns later), so those cards carry hostLaunchPrefix; any handle-less create whose effect is unknown is reconciled with terminal-list --include-visual-layouts by its tab title (scripts/agent/lib.mjs recoverCreatedTerminal).
  terminal-list:
    command: terminal list
    kind: read
    flags: ["worktree", "include-visual-layouts"]
    receipt: [result.terminals]
  terminal-show:
    command: terminal show
    kind: read
    flags: [terminal]
    required: [terminal]
    receipt: [result.terminal]
    note: Health probe — connected/writable/exitCause is how dispatch and restart decide a terminal is live.
  terminal-read:
    command: terminal read
    kind: read
    flags: [terminal, cursor, limit, screen]
    required: [terminal]
    receipt: [result.terminal]
  terminal-send:
    command: terminal send
    kind: mutation
    replay: none
    flags: [terminal, text, enter, interrupt]
    required: [terminal]
    receipt: [result]
    note: |-
      Canonical launcher only: submits a dispatch --return-preamble Task to the terminal the same attempt created, and
      carries Coordinator -> Monitor notices (launcher `notify`). Orca fences a terminal to the one Run it consumes
      (consumer_fenced), so parent-Run mail never reaches a Monitor bound to its nested Run; typed input does. A busy
      agent queues the text and Orca answers agent_prompt_stalled, so delivery is proven from the screen, not this receipt.
      agent_prompt_blocked means Orca typed the text into an idle agent prompt but refused the Enter sent with it;
      scripts/api/orca/terminal-send.mjs follows it with one Enter-only send (receipt enterRetry).
  terminal-send-prompt:
    command: terminal send
    kind: mutation
    replay: none
    flags: [terminal, text, enter, wait-submit, retry-request]
    required: [terminal, text, enter, wait-submit]
    receipt: [result.send.prompt]
    note: |-
      A text+Enter agent prompt on a host with durable prompt receipts (Orca 1.4.209): result.send.prompt is
      {requestId, stages, provider, observation, processIncarnation}; turn_started in stages proves the submit,
      observed for up to --wait-submit seconds and never resent. A host without them refuses before any input
      (the flags absent from agent-context, or incompatible_runtime): terminal-send.mjs sends through
      terminal-send instead. An ambiguous failure names orchestrationRequestId: the exact command is re-issued
      once with --retry-request <id>.
  dispatch:
    command: orchestration dispatch
    kind: mutation
    flags: [task, to, from, run, return-preamble]
    required: [task, to, return-preamble]
    forbidden: [inject, dry-run]
    receipt: [result.dispatch.id, result.preamble]
    creates: dispatch
  dispatch-show:
    command: orchestration dispatch-show
    kind: read
    flags: [task, preamble, from]
    required: [task]
    receipt: [result.dispatch.id, result.dispatch.assignee_handle]
  terminal-close:
    command: terminal close
    kind: mutation
    replay: none
    flags: [terminal, tab]
    required: [terminal]
    receipt: [result]
    note: Containment only. The launcher closes the exact residual agent terminal that a fenced attempt itself created when worker-stop cannot confirm the stop; it never closes a Monitor, Coordinator, setup or user terminal. A runtime-owned background terminal has no renderer tab, so Orca stops its PTY and still answers runtime_error tab_not_found; scripts/api/orca/terminal-close.mjs counts that close only after terminal-show reports the exact terminal disconnected.
  terminal-rename:
    command: terminal rename
    kind: mutation
    replay: none
    note: Title write without retry-request support; naturally idempotent and verified by worker-show.
    flags: [terminal, title]
    required: [terminal, title]
    receipt: [result]
forbiddenCalls:
  - orchestration coordinator-start
  - orchestration coordinator-stop
  - orchestration reset
  - terminal stop
recoveries:
  worker-start-retry-of: Start a replacement attempt with --retry-of <dispatch> after the failed Dispatch is proven settled; placement and agent are repeated explicitly.
  settle-dispatch: worker-stop then worker-release the exact Dispatch; effectState becomes none only when release reports released or already_released, or when the worker process is proven gone and only an identity_unproven terminal remains. When stop stays unknown after bounded reconciliation, the exact residual agent terminal created by the fenced attempt is closed with terminal-close, then worker-stop and worker-release are repeated.
  reconcile-then-stop: Read worker-show; ready keeps the attempt, failed or stopped allows retry-of, outcome_unknown requires worker-stop and a second read before the attempt may be called settled.
