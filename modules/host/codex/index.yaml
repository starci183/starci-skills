schema: starci/codex-provider@1
provider: codex
purpose: >-
  What a Codex chat is to StarCi. A chat submits a goal through the entry skills and then monitors
  the workflow it spawned (skills/workflow-chat/); it relays the kernel's questions verbatim and
  answers for the owner only on the owner's word. It is not an execution host: it creates no
  operation agent and holds no control plane above the kernel.
agentCard: ../../models/agents/codex.yaml
executionHost: false
executionAuthority: >-
  Operation and kernel agents are Orca-hosted. The host contract is modules/host/orca/, the spawn
  facts are modules/models/agents/codex.yaml, and `node scripts/kernel/api.mjs dispatch --spawn` is
  the only path that creates one.
concurrency: modules/models/runtimes.yaml runtimes.codex-agent.maxParallel
validatedBy: scripts/checks/providers.mjs
