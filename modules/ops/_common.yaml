# The shared operator policy document the ops registry names as
# origin.commonDocument. The underscore prefix keeps this file out of the op
# catalog scan: scripts/route/build-ops-registry.mjs and scripts/route/route-op.mjs
# both skip modules/ops/*.yaml files whose names start with "_" - a "common.yaml"
# here would be misread as an op without a route: block.

schema: starci/document@1
sections:
  - title: Language - code English, logs in owner_language
    blocks:
      - "Owner rule: code is English and logs follow config.yaml language, which the packet carries as
        owner_language. English: source code, comments, identifiers, commands, api verbs and flags,
        file and path names, schema keys, enum values, canonical Work record content (unless the
        brief names owner_language for a field) and commit messages."
      - "owner_language: everything a person reads as a log - terminal narration and progress lines,
        orchestration message subjects and bodies (worker_done, status, ask), report summary and
        notes, incident details, owner asks and the handover package."
  - title: Product UI copy follows the shell record's productLocale (default - the brand record's voice.locales default), not owner_language
    blocks:
      - "Product UI copy - every label, heading, button, message, empty state and sample datum a product
        user reads, in a drawing prompt, a generated direction, a message file or a rendered screen - is
        written in the product locale: the layout tree's productLocale.default (.starciwork/shell/index.yaml,
        work/layout-tree@1), else the brand record's voice.locales default. The packet carries it as
        product_locale. owner_language is who reads the logs, not who uses the product, and it never
        decides UI copy; canonical records stay English either way."
      - "Product UI follows the Next.js App Router layout architecture, and the frontend's app/ directory
        is its source of truth. The shell record is the layout tree scanned from it (scripts/work/layout-tree.mjs):
        one node per segment - layouts, route groups, @slots, (.)intercepts, loading/error/not-found - each
        visible layout captured per breakpoint and theme with its page slot measured, its navigation labels
        read out of the i18n catalogs, and the demo personas by role. Every ui record declares its `route`,
        its `surface` (layout, page, modal, drawer, loading, error or not-found; an overlay may differ per
        breakpoint), a drawer's `direction` (left, right, top or bottom, per breakpoint allowed - no sheet),
        and for a modal or drawer `routed` and `host`; a popover, dropdown, toast or tooltip is a state of its
        page's ui.flow, not a surface."
      - "Chrome is composited, never drawn per page: layouts are captured or, when planned, drawn by
        their surface-layout ui record first - by interface.draw itself, which starts from a todo shell
        (owner ruling 2026-09-29) and settles the shell and every layout above its screens before drawing them; a
        page or overlay is drawn on top of settled layouts, scripts/work/draw-render.mjs token-renders only the slot content or overlay panel, and scripts/work/compose-direction.mjs
        places it into the real layout capture or over the dimmed host. The shell is one foundation shared by the
        workflows of a project: one workflow draws it, the others wait (foundation-wait). A worker that cannot
        settle a layout for want of an INPUT (brand record, journey, persona seed) reports APP_SHELL_UNSETTLED or
        LAYOUT_ANCESTOR_UNSETTLED as a brand-gap; it does not invent one, because parallel workers inventing
        independently is how one product ends up with three logos."
      - "Every drawing set covers desktop AND mobile in the light theme - each drawn state has its part at
        both, a drawer anchored per breakpoint as its record declares. Dark is optional: never demanded of a
        layout capture or a draw, kept when a tree already has it. Layouts are captured at the same
        required matrix."
      - "The owner reviews shapes only - one per XBase#state of the record's ui.shapes - as the drawn PART,
        never the composite: a page shows its page slot content (<shape>--page--<bp>--<theme>.content.png,
        role direction-content); a modal or drawer shows the panel alone, not dimmed over its host; a
        planned layout shows its own drawing and a repository layout its own capture. A retired
        data-status image is never shown. The composite
        (<state>--<presentation>--<bp>--<theme>.png) stays evidence and the reference interface.implement
        builds and interface.audit compares against. Every owner ask, handover package and drawing notice
        lists parts; scripts/work/direction-part.mjs swaps a composite an older record still names for its
        part."
  - title: Expandable business tree and local workflow tracking
    blocks:
      - Each record folder has one index.yaml record; index is the record, not an extra directory
        listing. Records live in flat family folders under their feature.
      - Keep the feature's record set lean. The requirement layer uses `br`/`ac`/`fr`/`nfr`/`data`/
        `journey`/`decision` records when each is independently investigable or acceptable; the
        design layer uses `sds`/`contract`/`integration` records only as needed. Do not create
        mandatory scaffolding or collapse independently checkable existing records.
      - "Only leaves author state: uninvestigate, todo or done. todo is confirmed incomplete work
        and requires no investigation receipt. activity is idle, investigating, implementing or
        verifying; blockers[] is auxiliary context. A parent keeps scope and derives progress from
        required children, never authored state/completion."
      - Extend existing nodes and preserve stable IDs, history, assets and evidence. Semantic parent
        changes invalidate descendants and dependency changes invalidate affected consumers
        transitively, while stored proof remains intact.
      - Several workflows may target the same work nodes; no duplicated business tree per run. Local
        workflow tracking is ignored by validation/digests and Git.
      - Declare semantic design/source files using node.assets with paths under own assets/. Their
        exact bytes contribute to semantic context; hashing is conservative and does not ignore
        presumed typo-only edits.
      - "Record output screenshots/videos in evidence assets with scope: node and paths under the
        primary owner assets/. Output evidence is not also declared as a semantic input, avoiding
        self-invalidating proof."
      - Source code remains in bound repositories; `impl` records track the requirements they prove,
        exact source ownership and completion.
      - node.yaml and Markdown node files remain readable; exactly one node file
        per work folder. New and edited canonical nodes use index.yaml. Do not automatically migrate
        unrelated user Work.
  - title: Mandatory lifecycle gates
    blocks:
      - "The owner gates are the entry skills' exact `ok` approvals and the settle-time evidence
        verdicts (modules/models/registry.yaml approvalMode: entry-skill-owner-ok); there is no
        separate approvals engine or policy file. Before the first workflow effect the entry skill
        presents one complete brief — goal, scope, repositories, worktree topology, operators,
        allowed action/effect ceilings, exclusions and completion criteria — and binds the owner's
        acceptance to its digest. Inside that accepted envelope the kernel proceeds without
        procedural confirmations and raises no repetitive command, worktree, retry, integration or
        technical-review questions; a changed goal, widened scope/authority, missing credential,
        unresolved business alternative, safety block, reserved checkpoint or partial/unknown
        effect returns to the owner as an api incident or an owner ask. While the packet carries
        owner_delegation, an answer receipt whose answeredBy is that delegate, inside its window and
        outside its excluded classes, is the owner's answer and binds like one; the receipt carries
        the delegate's reason. The handover approval is never delegated: a workflow is done only
        when the owner approves its handover.review ask, and a delegate may answer that ask with
        feedback or a question, never with the approval. An ask whose options include a
        recommendation sets question.recommended (the recommended option's 0-based index in
        question.options) and question.recommendedReason (why); with config.yaml
        asks.autoAcceptRecommended on, the runtime answers it with that option instead of serving
        it, and a receipt whose answeredBy is auto-recommended binds like the owner's answer for
        that business choice until a later owner answer supersedes it. Credential, excluded-kind
        and handover asks are never auto-accepted. A draw-review ask (`draw-review.mjs question --ui
        <dir> --job <id>`) is never auto-accepted either - every drawing is the owner's to accept
        (owner ruling 2026-09-27, draw-content-owner-gate); drawOwnerRulingOf still reads from ledger
        lineage whether the owner asked for it. Every operation reaches the owner the same one way: it files its
        report with outcome ask and the question (api report) and ends its turn; the kernel serves
        it through serve-ask and re-enqueues the operation with the answer bound. No operation asks
        through an Orca orchestration message, a terminal prompt or a chat, or waits in-turn for a
        reply - nothing answers those channels and nothing records what they say."
      - Every selected workflow finishes through the kernel's gate/finish contract
        (modules/kernel/api.yaml `finish`), and that gate requires the owner's approval of the
        workflow's handover (modules/ops/ops/handover.review.yaml), the last leg of every chain. Missing .starciwork routes to
        workspace-bootstrap; invalid .starciwork is not overwritten. Preserve the original request
        and resume the same target workflow. After validation and before a goal or effect, inspect
        stale nodes with the read-only Work traversal; validation still enforces freshness when
        traversal was omitted. Distinguish stale prior investigation/proof from work that was never
        investigated.
      - Before effects, present a concrete goal with final business outcome, exact source/service
        impacts, real existing lines/anchors/hashes or explicit proposed new paths, resource
        effects, operation purpose, input/output contracts and acceptance criteria. Wait for the
        actual user to approve the goal digest.
      - Typed request/response mapping can adapt field names and shape using exact accepted producer
        values, but cannot enlarge scope or change expected business behavior. Changed goal requires
        renewed user approval.
      - Technical pass is not done until every accepted completion criterion is verified. When the
        accepted brief delegates technical acceptance, the kernel records that bounded technical
        acceptance at `api settle`, updates only selected Work nodes, validates their completion
        proof and reports the result without another formal question. A reserved exit checkpoint,
        changed envelope or undeclared external effect still requires the user. Parent completion
        is derived.
  - title: Read the source tree
    blocks:
      - The runtime reads this tree directly. Contracts load from the authored YAML under
        modules/schemas/, modules/kernel/, modules/models/ and modules/ops/. Read only selected
        artifacts.
  - title: Workflow selection and authority
    blocks:
      - The single [StarCi skill](../CONTEXT.md) selects one workflow from the op catalog
        [modules/ops/registry.yaml](registry.yaml). Read this policy and the selected op
        contract completely. No preset skill layer or automatic successor exists. A question may
        remain read-only. Unmatched/ad hoc jobs use direct-task → task.execute; unknown explicit
        workflow names are not silently substituted.
      - In Orca, keep that workflow common to the resolved workspace and modules. Each enqueued
        operation binds one ordered external-agent chain from modules/models/registry.yaml. The
        operator chain is explicit and overrides the owning skill default; otherwise it inherits
        that default. Select the first observed ready candidate. Fall through only for an allowed
        failure after verified no effects; never duplicate partial or unknown effects across
        providers.
      - One operation is one complete request-bound job carried by one ephemeral op agent. Select
        exact scope, actual inputs, permitted effects and required criteria; no catalog text grants
        new authority. Reuse existing authorization. For missing material intent or uncertain
        remote effects inspect/reconcile first and request only the essential missing decision.
      - "The kernel launches only what its dispatch plan proves parallel-safe: parallel jobs
        require disjoint mutable ownership and no unsatisfied dependency between them, and the
        live slot count per runtime pool is modules/models/runtimes.yaml
        runtimes.<pool>.maxParallel. An operation is never split among several agents and never
        fanned out. Ordinary tool steps and bounded repair stay inside the same operation and never
        hide unrelated successor jobs."
      - "backend.implement and interface.implement report an accepted SDS as technically missing or
        contradictory when an observed implementation/test fact proves it; the code worker waits
        and never edits SDS. The kernel enqueues a separate architecture.decide operation in its own
        worktree, and a fresh implementation attempt reruns affected checks. This is automatic
        procedure inside an accepted brief; a business/SRS change or wider owner/scope returns
        needUser."
      - Before transitions, preserve exact accepted output → input bindings and require every
        request/response criterion and real evidence to pass. The frontend has a local runtime gate;
        every other transition advances only on the kernel's settled verdict. Missing or failed
        proof does not advance.
  - title: Dependency graph and scope ownership
    blocks:
      - The actual dependency graph belongs in `.starciwork`, not in an operator's next-step list.
        The directory tree is containment/completion; `dependsOn:[nodeId]` declares prerequisite
        work and requires effective `done`. `na` is not a completed account, chat module or other
        prerequisite. `refs:[nodeOrResourceId]` binds semantic inputs and freshness but does not
        require completion or imply execution order. Resource `files` bind actual local source
        artifacts. Neither a prose dependency nor an operator name implicitly creates a graph edge.
      - For example, one approved scope can declare art direction → UI design → frontend → UAT;
        another can declare module work dependent on account and chat pieces; another business →
        architecture → implementation → UAT. These are example data relationships, not universal
        chains to insert into every task. Store each prerequisite's stable node ID in its consumer's
        `dependsOn`, and source/requirement/resource IDs in `refs` where their changes affect the
        consumer. Unrelated pieces stay unrelated.
      - Only an explicitly selected goal/scope/planning or finish op changes the selected scope
        graph. Other ops read their node's own and inherited graph and perform the selected job
        only. They cannot silently add/drop dependencies, refs, required flags or acceptance scope
        to run or earn pass. When a required declared prerequisite is missing/not done, report the
        exact IDs and stop the affected piece. If the graph itself is incomplete/wrong, propose a
        separately selected scope update; do not dispatch a prerequisite op or repair the graph as
        an implementation/UAT convenience. A source artifact producer may update its owned
        resource/files within the existing graph, but may not attach new consumers.
      - "The work graph (domains, slices, nodes and edges; modules/schemas/work-graph.schema.yaml) changes
        only through an op whose brief sets graphPolicy.workGraph: write the whole candidate to
        evidence/work-graph.json and record it with `node scripts/work/work-graph.mjs propose --repo <target-repo>
        --job <job-id> --file evidence/work-graph.json --reason <why>` (a cut adds `--slice <slice-id>`). A refusal
        lists the validator findings to fix; the report names the recorded version. An op without the
        permission reports a graph change it needs as a finding, never edits the graph."
  - title: Path and field contract
    blocks:
      - "STARCI_JOB_SCRATCH names this job attempt's private OS-temp directory outside every repository;
        your prompt gives its absolute path (it is not an environment variable). Put raw command stdout/stderr, full checker JSON, patches, browser traces,
        videos, DOM snapshots and other operational outputs there. File the transient report JSON
        from that directory with `api report --report <scratch/report.json> --attach <absolute-scratch-file>`
        for each raw file the job needs retained. The API stores the report in the ledger and the
        attachments as content-addressed blobs, then removes scratch. `report.files` names authored
        owned paths, not scratch attachments. Never put operational output in `.starciwork`."
      - "`evidence/` in an op brief is the attempt's evidence folder INSIDE STARCI_JOB_SCRATCH (`<scratch>/evidence/`), never a
        folder in `.starciwork` (ARCHITECTURE-DB §5.1: evidence/ is agent data). Write the proof manifest and its assets
        there and file them with `api report --attach <scratch>/evidence` (a directory attaches every file under it); each
        becomes the artifact `attachments/evidence/<path>` of this attempt (blob + job_artifacts). The same holds for a
        UAT run (`<scratch>/runs/<runId>/**`, artifacts role uat-run with the run id), app and render captures
        (`<scratch>/captures/**`, role capture/dom) and an interface.audit verdict (`<scratch>/interface-audit.json`,
        the ledger's interface_audits row). The record's sibling evidence.yaml cites each file by sha256 (and its
        artifact name) - `{artifact?, sha256, role?, label?}` - never by a path; api report returns every artifact
        {id, name, sha256}, and the settle binds the citations (work_citations). A read of another op's `evidence/<file>`
        reads that attempt's artifact `attachments/evidence/<file>` (`api artifacts --workflow <wf> --job <job>`)."
      - Paths below are templates, not discovered locations. Resolve `<feature>`, `<family>`,
        `<name>`, resource slugs and repository IDs from the selected workspace. Never persist
        literal angle-bracket placeholders or guess a path by similar name. `N` means the selected
        record directory, `evidence` means `N/evidence/<unique-evidence-id>`, `R` means
        `.starciwork/_resources/<category>/<slug>`. Resolve symlinks and keep writes within the
        authorized roots.
      - Work metadata uses YAML 1.2 in workspace.yaml, index.yaml, resource.yaml and
        evidence/manifest.yaml. Canonical index.yaml carries the schema const of its own family
        (`work/<family>@1` under `features/`, `work/catalog@1`/`work/feature@1`/`work/brand@1` at
        their declared positions) and a readable description field. Domain JSON required by operator contracts remains in
        extensions. YAML schema consts are defined by the catalog under modules/schemas/ — nothing
        is exported into the work tree.
      - "| Destination | Fields or content | Writer / invariant |"
      - "| --- | --- | --- |"
      - "| `.starciwork/workspace.yaml` | `schema: work/workspace@1`, stable `id`; declared
        workspace extensions if needed | Initialize only if this workspace is new; do not replace an
        existing identity. |"
      - "| `.starciwork/index.yaml` | `schema: work/catalog@1`, `id`, `features[]` | One entry per
        feature; the catalog is the product map, not a work record. |"
      - "| `features/<feature>/index.yaml` | `schema: work/feature@1`, `id`, `title`, `description` |
        The feature's readable overview; a parent carries no state. |"
      - "| `features/<feature>/<family>/<name>/index.yaml` | `schema: work/<family>@1`, stable `id`,
        `title`, `state`, family fields per modules/schemas/work-*.schema.yaml; `dependsOn`,
        `refs`, `blockedBy`, `evidence`, `change` as applicable | Scope/graph fields belong to the
        selected scope/planning change. Consumer ops read them unchanged; `refs` contains resolvable
        record/resource IDs, not a copied document. |"
      - "| record description/title | Specific purpose, scope/exclusions, authority citations,
        observable done-when; the operator's domain tables | Current readable specification, not a
        transcript. IDs survive renames. |"
      - "| record lifecycle | `state` is `todo` or `done` on authored records; `blockedBy` names
        the open question or gap a wait is rooted in | `provenBy` is kernel-derived and never
        agent-authored. A record reaches done only when its declared proof demands are bound. |"
      - "| `N/index.yaml` `extensions.work3` | Domain-specific structured data explicitly described
        in the selected op; version/domain must be named if another consumer depends on it | Not a
        second progress ledger. Extension data is retained, but not automatically semantically
        certified by core. |"
      - "| `R/resource.yaml` | `schema: work/resource@1`, stable `id`, `kind`, `owner`, `revision`,
        `details`; optional `files:[{path}]` | One canonical shared resource. Files are normalized
        local paths relative to the resource directory; the core hashes actual bytes. No authored
        `sha256` field inside `files`. Update only owned source fields; runtime observations belong
        in evidence. |"
      - "| `evidence/manifest.yaml` | `schema: work/evidence@1`, `id`, `nodeId`, `inputDigest`, `outcome`,
        `assertions:[{id,outcome,observation}]`, `assets:[{path,sha256}]`; applicable `provenance`,
        `codeRefs`, `extensions` | Write actual outcomes `pass`, `fail`, `not-run`, `inconclusive`.
        Every required assertion needs an actual observation. Assets use paths inside evidence/ and hash
        actual final bytes. |"
      - "| `evidence/*` | Indispensable Work-record proof and cited assets required by work-layout.yaml |
        Keep the proof needed by the selected record, not raw operation output. Send full logs and
        machine output through STARCI_JOB_SCRATCH and api report --attach. Do not overwrite a sealed
        Work-proof bundle. Keep failures needed to explain current defects.
        |"
      - "| Product repository paths | The selected op's actual discovered/planned source write
        ceiling | Source changes stay in source; `.starciwork` links repo and revision. Do not copy
        product source into the completion tree. |"
      - The flat families `br`, `ac`, `fr`, `nfr`, `data`, `journey`, `decision`, `sds`, `ui`,
        `impl`, `uat`, `contract`, `integration`, `gap` and `event` are the closed set of record
        folders under a feature - no `business/`/`architecture/` wrapper ever appears inside
        `features/`. No record directory sits at the `.starciwork` root besides `features/`,
        `brand/` and `_resources/` - a workflow's bounded scope lives on its owning feature record
        under `extensions.work3.scope`, and workspace.manage's setup record lives on the catalog
        under `extensions.work3.setup.<workflow>.<mode>` (work-layout.yaml shape.setup). A
        root-level `.starciwork/<name>/index.yaml` record is refused. A work/node@N record anywhere is
        refused too (HFS_WORK_NODE_RETIRED) and must be restated as flat family records. Add a new domain as a new family or resource
        kind plus its explicit contract, never as an invented folder.
      - 'Accepted art direction/design assets are source inputs: store them in the selected design
        resource directory and declare `files:[{"path":"assets/direction.png"}]` using the real
        filename. Consuming UI design/frontend nodes reference that resource explicitly. Captured
        output screenshots remain evidence assets under an evidence bundle; replacing a screenshot
        alone does not change approved design authority or imply a redesign. Promoting an observed
        screenshot to a new design source requires an explicit scope/design decision and source
        resource binding, never silent reuse as intent.'
      - Validation detects semantic changes in a node, its ancestors, declared resources and
        stable-ID dependsOn graph, then transitively reports affected investigated/completed nodes
        as stale. Child rollup plus activity, blockers and history are excluded from investigation
        context. Old investigation, completion, commits and evidence remain intact; a stored done
        becomes effectively uninvestigate when stale. Fresh todo needs no investigation receipt. A
        source-generated unconfirmed leaf is not-yet-investigated rather than stale. Unlinked source
        resources do not affect unrelated work. Do not rewrite an old digest to clear staleness or
        auto-rerun consumers. Report impact and run only the next separately selected eligible op.
        Changes in unbound external source/runtime state still require actual inspection and
        resource revision updates; this is not a background watcher.
  - title: Canonical layout ownership
    blocks:
      - ".claude owns the layout of .starciwork and .starcistacks: directory structure, file names and
        the `schema:` const of every record class are defined in the catalog, never chosen by the
        agent. An operation writes each artifact only at its declared path and name. A wrong path,
        wrong file name, missing `schema:` const or wrong const fails the run; the layout is never
        adapted to fit an observed file."
      - "Every structured artifact an op writes carries its declared `schema:` const as a record
        key: family records `work/<family>@1`, the catalog `work/catalog@1`, the feature overview
        `work/feature@1`, the brand `work/brand@1`, the workspace `work/workspace@1`, resources
        `work/resource@1`, evidence manifests `work/evidence@1` (emitted by the kernel from the
        op's manifest fields), the workflow goal `starci/goal@1`, intake records
        `starci/workflow-intake@1`, .starcistacks compose `starci/application-stacks@1`. Staged handoffs
        carry the request-frozen contract the kernel stores as `starci/staged-job-result@1` /
        `starci/staged-op-response@1`. Repository-side artifacts (source, tests, documents)
        carry no YAML const of their own but land exactly at the declared ceiling path."
      - "Every operation's checks include the record-class validator `starci validate` for the
        .starciwork artifacts it writes, and `starci validate --strict <record-dir>` on every record
        directory it writes: strict mode compiles each record against the JSON schema its `schema:`
        const names (closed objects, slug/timestamp patterns) and refuses every violation. Strict is
        scoped to what the op wrote because live trees still carry older records the schemas now
        refuse; a strict refusal inside the op's own records is its failure, one outside them is
        not its to repair. Operations that materialize or verify .starcistacks deployments
        also run `starci-stacks-check`. An op that authors `extensions.work3.checks` on a node
        includes the validator there. Layout, name and schema violations are operator failures,
        not content to repair silently."
      - "Delivery and quality services are declared, never inferred (owner ruling 2026-09-24): the
        repository's stack declaration (.starcistacks/application-stacks.yaml, or the
        backend declaration whose sources list the repository; the runtime source host's for a shared
        server) states in its `services` block each of sonar, container-registry, analytics
        and error-tracking the code or CI uses - provider, mode local|hosted|disabled, host, the stack
        that runs it, project keys, credentials as custody references with the variable the tool reads,
        how GitHub CI gets them (ci.wiring) and ownerAction. Before an operation names, asks for or
        wires any credential, host or CI secret/variable it runs `starci-starcistacks-check <repo>`
        (scripts/checks/check-starcistacks.mjs) and uses what the block declares. A service declared
        `ownerAction: none` with its custody present is never asked of the owner - api report
        refuses such an ask (ask-declared-in-stack); a custody or server gap is repaired in the stack
        and CI wiring marked optional-follow-up is a Kernel's follow-up, not an owner provision. A
        repository whose declaration lacks the block gets suspects and the planned follow-up
        (workspace.manage mode stacks, examples/starcistacks-services/<repository>.services.yaml),
        never a hold on running work."
      - "The layout covers the whole .starciwork tree. Workflow run state is the runtime.sqlite
        ledger — goals/jobs/inbox/reports/contracts/checks ROWS transacted through `api` verbs.
        An operation never opens, queries or copies that file: it reads its contract with `api
        op-contract` and files `api report` for its own job, and the api refuses every kernel verb
        from an op terminal (modules/kernel/api.yaml conventions.callerBoundary, inc-360891316369).
        Messages between workflows (`api peers`, `notify`, `inbox`) are kernel verbs too: work
        that belongs to another workflow is named in the op's report, and the kernel routes it.
        An operation's produced
        records (intake.json, a goal revision) travel as report evidence under its declared write
        ceiling; it never emits checks, contracts, inbox commands or report rows directly —
        those are kernel/api outputs, not op output."
      - "`features/<feature>/` record trees follow the declared flat shape: `.starciwork/index.yaml`
        the catalog (`work/catalog@1`), `features/<feature>/index.yaml` the feature overview
        (`work/feature@1`), and one `index.yaml` per record inside its flat family folder -
        `br`/`ac`/`fr`/`nfr`/`data`/`journey`/`decision` for the requirement layer,
        `sds`/`contract`/`integration` for the design layer, `ui/<name>/` nodes with their
        `assets/`, `impl/<repository>/<name>/` implementation nodes, `uat/<flow>/` folders
        `{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql,assets/,runs/}`,
        `gap` and `event` records - each carrying its own `work/<family>@1` const. The root
        `brand/index.yaml` with `brand/assets/**`, and `_resources/<category>/<slug>/resource.yaml`
        complete the tree. Every record class carries its schema const and is covered by
        `starci validate`; writing outside the declared layout fails checks."
  - title: Evidence, completion and commits
    blocks:
      - "Before executing, establish the selected node's current `inputDigest` using the read-only
        validator. Finish semantic edits before collecting evidence: changed body, requirements,
        dependency or resource revisions change the input being proved. Never hand-invent a digest.
        Do not mark an implementation `done` because a plan completed. Do not mark a verification
        leaf `done` when its required assertions failed even though the checking operation itself
        returned a useful finished report."
      - Treat the node description and semantic metadata as specification inputs. A consumer op does
        not rewrite the selected scope/graph even before verification. After freezing the
        investigation/verification digest, write observations, current defects, commit mapping,
        untested assertions and cleanup results into `evidence/result.md` and operator evidence, never back
        into semantic node prose. Post-proof operational writes are limited to state, activity,
        blockers, investigation, completion and history. A changed expected outcome is a separately
        selected specification update requiring new verification. Planning/specification ops finish
        semantic description and graph first, then collect review proof against the final digest.
      - "Source/resource-producing ops use two distinct moments: inspect approved expected intent
        before effects, then finalize actual source/resource facts within scope and compute the
        final verification digest before checking the resulting postconditions. Update selected
        canonical identity/version/resource metadata before this final proof; never change expected
        rules to fit those facts. A resource evidence pointer, if needed, uses a preallocated stable
        evidence ID finalized before the digest, with no claim of passing until proof exists; prefer
        node completion for current evidence selection. Never embed a resource's own
        evidence-content hash or update its semantic observation pointer after freezing proof. If
        relevant source, resource or spec changes during checks, rerun affected verification against
        the new actual inputs; never just replace a digest to clear a stale result."
      - "Choose tests from the changed behavior and affected dependencies.
        Edits, retries and polling use relevant partial tests and applicable static/build checks, not a
        full repository run each time. The whole unit suite is never a code-writing op's run (owner 2026-09-29):
        it belongs to unit.verify, dispatched only when the goal or the owner asks for the full unit run, and to the
        owner's /push-git flow before a main is pushed; e2e runs only on request, and e2e.verify then runs the full e2e suite. Reuse a passing run only with verified unchanged covered inputs, its original
        tested revision and explicit limits; check documentation-only deltas separately. Installing the
        same artifact uses relevant installation/build/import smoke checks unless changed inputs or a
        failure justify broader testing. Preserve required CI gates and never claim a partial run is full."
      - Completion writes `completion.inputDigest`, `completion.evidence` (evidence IDs) and
        `completion.codeRefs:[{repository,commit}]` for implementation/release profiles, with
        repository resource IDs and full actual Git SHAs. Every selected evidence bundle also
        carries matching `codeRefs`, and those repository IDs are included in node `refs`. A release
        may reuse actual inspected source commits; it does not need a new source commit just to
        deploy. Run validation after binding. Evidence integrity checks show that bytes and
        references agree; they cannot prove an agent genuinely observed what it wrote. Actual
        tool-derived artifacts plus explicit inspection/review are still necessary. Never claim that
        this system eliminates hallucinations.
      - "For a pure local artifact/content task with no repository or source-code acceptance, use an
        `operations` leaf instead of pretending to satisfy the `implementation` profile. Record the
        actual artifact/proof and the absence of a product commit. This does not exempt real code
        delivery from its implementation profile. Refresh applicable repository/environment resource
        revisions from actual inspected source/build state before validating: the core does not
        watch Git HEAD or live deployment drift."
      - "Every changed code piece has a scoped local commit when the user's task includes committing.
        Stage exact files, inspect staged diff, run applicable checks and record the real SHA; no
        blanket `git add .`, amend, force or unrelated changes. A branch other workflows and ops
        commit on (main of a product repo) is append-only: never `git reset`, rebase, amend, drop or
        force it - a Collab op ran `git reset HEAD~1` on nivo-backend main and silently removed its
        own filed-report commit while three peer workflows were committing there. A wrong commit is
        undone with a new revert commit. The checkout is shared too: never stash, `clean -f`, switch
        branches, or checkout/restore a path you do not own; stage and commit only your owned paths by
        name (`git add -- <owned paths>`, `git commit -m <msg> -- <owned paths>`, a long list through
        `--pathspec-from-file=<list>` whose every line is an owned path; `git diff --cached
        --name-only` lists only yours - unstage a file a hook re-staged, never commit it); never `npm ci`
        or delete node_modules while other workflows run (the repository dependency lock serializes
        `npm install`). Never delete `.git/index.lock` or another git lock: your git recovers a stale
        index lock itself (no git process on the repository, older than the runtime window) and says
        so on stderr; while it says a git process may still hold it, retry the git command shortly,
        and report blocked environment only if it persists. Never create a git worktree, a junction, a symlink or a hard link, anywhere:
        work in the checkout you were dispatched to, with its own node_modules. A worker's private
        worktree beside nivo-fe with node_modules junctions into the live checkout was removed with
        `git worktree remove --force`, which followed the junctions and deleted 674 live files
        (inc-c8fbf76aa499); a need for another revision, a clean build tree or a linked dependency is
        reported (blocked environment), never made. Never kill processes by image name or pattern
        (`taskkill /IM` or `/FI`, `pkill`, `killall`, `Stop-Process -Name`, `wmic process where name=...`): the
        machine is shared with Orca and every other agent, and a lane's `taskkill` of node.exe restarted Orca
        (2026-10-01). End only a PID you started yourself (`taskkill /PID <pid>`, `kill <pid>`,
        `Stop-Process -Id <pid>`); a process you did not start is reported, never killed. The command guard
        refuses a kill by name (PROCESS_KILL_BY_NAME). Never run `git worktree add` or `remove` (WORKTREE_NOT_OPS):
        a worktree is made and removed only by the runtime worktree API (scripts/lib/worktrees.mjs, safeRemoveWorktree,
        the op worktree lifecycle). Never delete a tree recursively (`rm -r`/`-rf`, `rmdir /s`, `rd /s`, `del /s`,
        `robocopy /MIR` or `/PURGE`, `Remove-Item -Recurse` and its aliases; RECURSIVE_DELETE): a recursive delete
        follows a junction into the live tree; a tree goes only through the runtime's safeRemoveTree
        (scripts/lib/safe-remove.mjs), one junction is removed with `cmd /c rmdir <path>` (no /s), one file with
        `rm <file>`. Never start an agent or a terminal outside Orca's supervision: no `orca terminal create`
        (RAW_TERMINAL_CREATE) and no headless agent CLI (`codex exec`, `claude -p`/`--print`, `cursor-agent -p`,
        `devin -p`, `gemini -p`, `opencode run`; AGENT_HEADLESS_LAUNCH); every agent and worker starts through
        `orca orchestration worker-start --agent <provider>` and is supervised with worker-show / worker-read /
        worker-stop / worker-release. The command guard sees through cmd, PowerShell and bash wrappers and chains,
        and lets text that only mentions these commands (echo, commit message, heredoc) pass. The runtime enforces this: an op's git and npm are the guard
        (modules/kernel/api.yaml conventions.sharedCheckout) and refuse with exit 3; report the need,
        never work around it. A logical piece can require multiple
        commits or repositories; record them all rather than inventing one universal SHA. When
        committing is not authorized, report an uncommitted source delivery and do not forge code
        completion. An unchanged implementation can bind an existing inspected commit and prove it
        without an empty commit. Documentation/evidence commits belong to the canonical
        `.starciwork` repository, not imaginary product commits."
      - "Keep origin commit, integration/cherry-pick commit, tested commit and deployed immutable
        artifact distinct. `completion.codeRefs` binds the delivered code; detailed mapping belongs
        in `evidence/lineage.json` or `evidence/result.md`, with evidence-level `extensions.work3.lineage`
        references when useful. Verify mapping with actual Git diff/ancestry and changed-path tests;
        ancestry alone does not prove later changes preserved behavior. A commit cannot contain its
        own SHA in its own bytes: commit the implementation, then update `.starciwork` metadata in a
        separate evidence/documentation commit if tracked in the same repository."
      - Git is edit history. `.starciwork` keeps current specifications and indispensable evidence,
        not duplicate request/response histories. Deleting a task or temporary Git worktree must not
        remove the only images, evidence or account references. External artifact stores need an
        existing durable object identity and integrity reference; a URI that nobody can retrieve is
        unverified, not a passing local asset.
  - title: Browser and UAT protocol
    blocks:
      - Inspect the available browser capability before choosing a driver. Use the applicable
        installed browser skill and its allowed tools, or a real installed Playwright/Chromium
        workflow when permitted. Read that skill fully when used. Do not assume a binary, browser
        session, bridge or screenshot capability exists. A missing browser blocks browser evidence;
        generated mockups, static fixtures and an API-only script are not substitute browser UAT.
      - Bind environment resource revision, expected origin, actual physical target where relevant,
        observed served FE/BE versions, configuration generation, actor resource or explicit
        anonymous access, and fixture namespace. Exact UAT provenance is `{environment, actor,
        servedVersions, tool, capturedAt, servedVersionEvidence}`, replacing actor with
        `anonymous:true` for anonymous access. `environment` resolves to resource kind
        `environment`, actor to `identity`, and each `servedVersions` entry is
        `{repository,commit,artifact}` with resource kind `repository`, full actual commit and
        observed immutable image/build identity. `servedVersionEvidence` is the ID of a passing
        assertion describing the actual runtime-version check. Include all
        environment/actor/repository resources in consuming node `refs`; include other input
        resources such as fixtures/design explicitly because links inside `details` are not
        transitive core dependencies. Store additional observations in `evidence/runtime.json` / evidence
        extensions, not unknown root fields. HEAD in a source checkout is not proof that the browser
        loaded that build. Check declared health/version evidence and actual page/network behavior;
        a successful redirect to a 404 or sign-in screen is not successful product login.
      - One actual run can support several leaves without copying images. Store its bundle once, for
        example under the flow's `evidence/<id>/`. Preserve primary `nodeId,inputDigest`; additional
        consumers use manifest `bindings:[{nodeId,inputDigest}]`. Each consumer explicitly
        references this evidence ID and covers its own assertions/current digest. No unstated
        consumer may reuse it; failure or corruption of a shared bundle affects all its consumers. A
        UI leaf still needs actual image assets; a UX leaf still needs at least one passing
        assertion with `kind:"behavior"`. Binding and byte integrity are not proof of the
        observation's truth.
      - "Keep three claims separate: appearance (actual image inspected at named viewport/theme),
        interaction (controls/actions and feedback observed), persistence/authorization (read-back,
        reload/resume and applicable negative checks). Drive actual rendered controls for UI
        journeys. Discover locators from observed DOM/accessibility state; never invent selectors or
        hide failed steps. API/DB probes may corroborate persistence but must not perform the action
        being claimed as a successful UI action. Explicit setup and cleanup scripts owned by the
        selected op may mutate scoped prerequisites and remove run-owned resources; these effects
        are recorded separately from UI journey proof."
      - Each browser context/session is isolated for parallel actors and flows. Mutable data
        namespaces must also be disjoint; separate tabs alone do not isolate cookies or data. Shared
        accounts may be read-only where safe. A selected op that explicitly owns authorized account
        setup may reuse/create scoped test accounts; other operations do not gain that authority.
        Credentials resolve through approved custody at use time. Store account aliases/provider
        subject/roles/member refs, not plaintext credentials, tokens, cookies, raw storage state or
        secret-bearing traces. Inspect/redact evidence before tracking it; keep masking provenance
        and hash the delivered masked bytes.
      - "Test credentials are never literals and never pushed as plaintext (owner ruling
        push-scan-test-secrets-encrypted, 2026-09-28: they work exactly like .starcistacks). A capture,
        e2e, UAT, seed or probe script generates a disposable account's password per run (node:crypto
        randomBytes); a credential that must stay stable across runs lives at
        `.starcistacks/<stack>/secrets/test/<name>` in the product repo - the plaintext git-ignored, stored
        with the repo's own stack-secret set command (npm run secret:set -- <stack>/secrets/test/<name>) so only the sops
        `.enc` twin is committed - and is read with testSecret(<name>, {repo}) (scripts/lib/test-secrets.mjs:
        the local plaintext when present, else sops-decrypted with the shared age identity). The push secret
        scan refuses a plaintext test password in any file."
  - title: Bounded finish and blockers
    blocks:
      - "A missing credential never stops building (owner ruling 2026-09-23: \"if there are no creds,
        keep coding, put in a dumb string, just skip uat\" - asking for a credential does not mean
        not doing the work). Code reads the value from its declared env var or custody key exactly
        as it will in production; where the build, unit tests or a local run need a value, the op
        writes an obviously fake placeholder (`placeholder-<VAR_NAME>`, never a plausible-looking
        key) into the example/local env file it owns, and lists every such variable in its report
        as `credentialPending: [VAR_NAME, ...]`. Only the live proof against the real provider
        (integration.verify, e2e.verify, uat.verify, uat.assisted.*) waits for the real value and
        reports `blocked` `environment` naming the variable; a build op never reports
        `blocked` `environment` for a credential it can stand in with a placeholder."
      - "Quality-service credentials are the runtime's, never the owner's (owner ruling 2026-09-24):
        Sonar runs through scripts/checks/sonar-local.mjs against the local SonarQube the stack
        declaration names, which resolves or mints the project and its token from the source stack
        custody. No op asks the owner for a SONAR_TOKEN, a Sonar host or
        a GitHub secret/variable; the CI secret wiring is an optional follow-up recorded as such."
      - "Open items are unfinished work, never notes about the environment or another leg
        (inc-00026c808d40). `partial` is a retry: the kernel settles it fail and dispatches this op
        again, so `open[]` names only work inside this op's own grant that another attempt of this
        op can finish. These are never open items and never turn `done` into `partial` once every
        check this op's brief requires ran green; they are recorded as checks with their evidence
        and named in the summary: (a) a gate whose tool answers `unavailable` for a reason outside
        the grant while this op's own gate run over its changed files passed - a whole-repository hfs lint
        that cannot run beside a gate.json with exit 0 (its preexisting count is debt already there at
        the base that code.refactor owes); (b) a proof the dispatch
        contract or this op's brief assigns to another leg - UAT to uat.verify, journey E2E to
        e2e.verify, live-provider proof to integration.verify - cited with the owning op; (c) Sonar:
        scripts/checks/sonar-local.mjs runs against the local SonarQube, and a 401 means run it
        again, never an owner token and never an open item; (d) an app-wide gate (the whole unit
        suite, typecheck, lint over the whole tree) red only on files this op did not change while its own
        gate.mjs run passes - an op on the shared tree (modules/kernel/product-land.yaml isolation exceptions) shares
        its checkout with other ops: record that check with `failing`
        naming each failing file and the source file it points at (`path[:line]`), never a
        shared-change blocker and never a repair outside owned paths; the Kernel's api check
        attributes it to the peer whose change it is. A proof this op's own brief requires
        (backend.implement's scoped unit gate for its selected operations - backend E2E is e2e.verify's, run manually - its
        commit) is never another leg's. A required gate that no run inside the grant can execute is
        `blocked` `environment` with its evidence, never `partial`."
      - Reuse matching current resources; inspect before changing uncertain state. Stop after
        repeated identical failure when no new diagnosis or authorized alternative remains. An
        uncertain external mutation is reconciled read-only before any retry. Do not weaken expected
        outcomes, skip failed checks, or change `required` to obtain a green parent.
      - Record a blocker with the actual missing fact, affected node, last relevant observation and
        required owner decision/action. Continue other selected independent pieces only if safe and
        within remaining limits. Failure never authorizes an out-of-scope repair, deployment or new
        chain. Each op agent finishes with result, changed node IDs/files, real commits,
        tested/untested extent, evidence and the precise remaining gap, writes that one report and
        dies; it never dispatches another op. The kernel settles that verdict and picks the next
        leg, and finishes the workflow when the selected result is reached or a required decision
        blocks progress. Unselected next ops are suggestions for a later plan only.
  - title: Verification scope - the specs of the change, never the whole suite
    blocks:
      - "Owner policy 2026-09-29: an op that writes or changes code also writes or updates the unit specs of that code and
        runs ONLY those - the specs of the changed or added source plus the specs that import it - through the op gate
        (scripts/checks/gate.mjs --tests, beside hfs lint --changed, codegen and tsc). It never runs the app's whole unit suite:
        unit.verify runs it (npm test at the app root), dispatched only when the goal or the owner explicitly asks for the full
        unit run, and the owner's /push-git flow runs it before a main is pushed. e2e runs only when the goal or the
        owner asks (config.yaml specs.e2e, default off); e2e.verify then runs the FULL e2e suite. The .claude runtime
        itself follows config.yaml specs.harness (default false = touching-only): changed harness code gets its own
        spec, the land gate runs only the specs touching the landed files (--specs touching) and never the whole suite."
  - title: Owner testing switches - config.yaml specs.unit and specs.e2e
    blocks:
      - "Owner rule 2026-09-28 (\"speed up development; test later when asked\"): the owner config.yaml root
        `specs: {unit, e2e}` switches product testing per class; unit is on unless set false, e2e is off unless set true (defaults 2026-09-29).
        unit covers the back end's unit tests (*.service.spec.ts; jest and its per-file coverage threshold; the front end
        has no tests and Sonar takes no coverage); e2e covers product e2e tests (e2e.verify, backend e2e, Playwright and *.e2e-spec.* files).
        UAT is neither: uat.verify keeps its own owner deferral until credentials."
      - "What an op does when a class is off is its brief's policy.specsToggle (scripts/kernel/spec-deferral.mjs):
        defer-leg - the leg is never dispatched; the kernel settles it deferred with no attempt spent and the
        legs behind it proceed. skip - the op runs without writing or running that class of test and demands
        no coverage of it; Sonar still runs, so bugs, smells and security findings still
        gate. not-counted - a review or handover gate does not count an absent test or coverage of that class
        (api coverage drops that requiresProof kind from must-haves). The dispatch prompt prints a `specs:`
        line naming the classes that are off; it overrides every test, coverage and e2e step, proof and
        blocker of the brief, and a skipped gate is recorded as a check named specs.unit or specs.e2e with
        exitCode 0 - never partial, blocked or a test-gap."
      - "Every deferral is a tests-deferred event and a row of api status testsDeferred; `api run-deferred-tests
        --workflow <id> [--kind unit|e2e|integration]` re-queues them on their same attempt, and they then run their whole
        brief even while the switch is still off."
