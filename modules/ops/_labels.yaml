# _labels.yaml — the human name of every operation, one shared map.
# The underscore prefix keeps this file out of the op catalog scan, like
# _common.yaml: scripts/route/build-ops-registry.mjs and route-op.mjs skip
# modules/ops/*.yaml files whose names start with "_".
#
# Owner request 2026-09-27: kernels, workflows and op workers carry names a person understands. The
# op id (interface.draw) stays the key everywhere — the ledger, the api, job ids, contracts; this map
# only says what a human reads for it. Every reader goes through scripts/lib/display-names.mjs
# (opLabel): Orca [Op] worker titles, api status legs/nextActions `label`, the supervisor digest and
# progress report, Telegram notices and the harness UI (ui/server.mjs sends the map in the snapshot
# as `opLabels`, so the UI shows exactly these words). tests/display-names.spec.mjs keeps one entry per
# modules/ops/ops/*.yaml. `vi` is what the owner reads; `en` is the UI's English rendering of it.
schema: starci/op-labels@1

labels:
