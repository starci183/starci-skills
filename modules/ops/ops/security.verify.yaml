schema: starci/op@1
id: security.verify
goal:
  en: Inspect one selected slice of code and configuration for vulnerabilities read-only and leave
    typed findings with evidence - repairing nothing it finds.
nodeKinds: [implementation]
completionProfile: implementation
sideEffects: [execution of exactly the declared read-only scan/analysis commands in the declared sandbox]
graphPolicy:
  mode: read-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: shared
    purpose:
      en: shared
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,data,journey,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, denials, data classifications and authority boundaries declared as
        relevant inputs in the selected .starciwork graph. The records say what a vulnerability is
        for this slice - a denied action the code permits is a finding; a needed missing input is a
        reported graph/scope gap.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: Read the declared security boundaries - authentication, authorization, tenancy, secrets custody,
        external calls and data ownership - the inspection is held to.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read the delivered slice
        - entry points, authz checks, queries, serialization, configuration and dependency
        manifests. The inspection binds the exact inspected tree; configuration includes declared
        deployment files inside the read set.
  - id: rules
    path: knowledge/architecture-rules.yaml + knowledge/hfs/rules.yaml + knowledge/op-gate.yaml (securityCodes, securityRules) +
      docs/code-pattern-enforcement.md
    purpose:
      en: Read the declared responsibility boundaries and enforcement rules the inspection measures
        against - secret/public value separation, denial handling, ownership boundaries.
  - id: machines
    path: scripts/gates/gate.mjs
    purpose:
      en: When the selected inspection includes boundary or enforcement checks, read the sealed machines'
        supported arguments, report schema, exit codes and coverage limits and run them read-only
        verbatim. Machine output is retained as evidence; the inspected code remains the finding's
        proof, and this read grants no fix-flag or repair authority.
  - id: checks
    path: selected request checks[] + <app>/<manifest-paths>
    purpose:
      en: Read the exact scan/analysis commands the request lists and the manifest scripts that define
        them. These commands are run verbatim - read-only by declaration - and nothing else is
        added, narrowed or substituted.
  - id: effects
    path: current request authorization + declared sandbox effects
    purpose:
      en: Bind the read-only scan commands to the selected assertions. No scan may write to the product
        tree, touch a shared or production target, or exfiltrate code or secrets; an inspection that
        cannot stay read-only is outside this op.
  - id: profile
    path: shared
    purpose:
      en: shared
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; findings and scan output belong to the evidence result,
        not semantic node prose. Missing refs/dependencies/acceptance require a reported gap or
        separately selected scope update; never add/remove them to obtain pass.
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, findings.json, result.md]
    content:
      en: "Keep every finding typed - id, severity, rule, the exact file and line or configuration key,
        the evidence excerpt and the reachable-from analysis - bound to the inspected tree and
        commit. Record each declared check with command, cwd, exit code and sanitized output, and
        each surface not inspected with its reason. Redact secrets and personal data before assets
        are hashed; a finding never contains a usable credential. Operator-specific observed result
        in evidence/result.md: findings first, then inspected surface and not-run items - no verdict the
        evidence does not carry."
  - id: lint
    path: STARCI_JOB_SCRATCH/lint.json
    schema: starci/lint@1
    content:
      en: "The starci app lint report of the inspected slice (starci app lint --changed <the slice's files> --format json at the app root): every finding with its engine, rule, code, path and line, and the errors of a lint that could not run."
      vi: "Báo cáo starci app lint của slice được kiểm tra (starci app lint --changed <các tệp của slice> --format json ở gốc app): từng lỗi kèm engine, luật, mã, đường dẫn và dòng, cùng errors khi lint không chạy được."
  - id: security-findings
    path: STARCI_JOB_SCRATCH/security-findings.json
    schema: starci/security-findings@1
    content:
      en: "The typed findings by rule: {schema: starci/security-findings@1, findings: [{rule, code, path, line, severity, reachability}]} - every canon finding of the security codes the lint reported plus every finding the inspection found beyond it; empty when there is none."
      vi: "Các phát hiện có kiểu theo luật: {schema: starci/security-findings@1, findings: [{rule, code, path, line, severity, reachability}]} - mọi lỗi canon thuộc các mã bảo mật mà lint báo cùng mọi phát hiện kiểm tra tìm thêm; rỗng khi không có."
steps:
  - reads:
      - target
      - business
      - architecture
      - repo
      - rules
      - profile
    writes: [evidence]
    action:
      en: Bind the inspection scope - the exact files, entry points, configuration and dependency
        manifests inside the read set - and restate each required assertion as the vulnerability
        question it asks. Map the declared security boundaries and enforcement rules onto the actual
        code surface. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers. Where the design is
        silent about a boundary the slice must hold, report the gap instead of guessing one.
        Findings are measured against declared rules and the graph's security requirements, never
        against invented policy; a rule absent here is a gap to report, not a finding to fabricate.
  - reads:
      - repo
      - checks
      - machines
      - effects
    writes: [evidence]
    action:
      en: Run exactly the declared read-only scan commands verbatim - including the declared
        architecture/code-pattern machines where the inspection covers boundaries - and read the
        flagged code itself, since a scanner's line is a lead, the inspected code and its callers
        are the evidence. Trace injection, authz, deserialization, secret-handling and configuration
        exposure paths the declared boundaries require; a finding without a reachable path is
        recorded as a finding with its reachability stated, not inflated. A listed command that does
        not exist is a reported blocker, never a locally invented equivalent.
  - reads:
      - repo
      - architecture
      - business
      - rules
    writes: [evidence]
    action:
      en: Classify each finding by severity against the declared boundaries and rules, and record what was
        NOT inspected and why. Preserve failing evidence honestly; repair nothing, pin no
        dependency, weaken no check, and change no configuration - every finding is for a separate
        repair operation.
  - reads:
      - target
      - repo
      - checks
    writes: [node, evidence]
    action:
      en: Report done once with the findings bound to the inspected tree and commit; report failed when a
        required surface could not be inspected and the evidence says so. A scanner crash, an unrun
        required check or a skipped surface stays not-run - never a clean report. Never
        self-advance.
  - reads: [repo, rules, machines]
    writes: [lint, security-findings, evidence]
    action:
      en: "Run the authentication and security canon through starci app lint at the app root over the inspected slice: starci app lint --changed <the slice's be/ and fe/ files> --format json > $STARCI_JOB_SCRATCH/lint.json. Read the report and classify every finding of the security canon - op-gate.yaml securityCodes and securityRules: the auth door's strict rate tier (R42 auth-door-strict-rate-tier), HttpClient called only in an integrations owner (R90 http-client-only-in-integrations), no secret in a log or an error (R71 no-secret-in-error, no-secret-in-log), the timing-safe secret compare and default deny (R41 secret-compare-timing-safe, public-needs-reason), no secret default (R44), the FE environment owner (R49) and the FE response cookie attributes (R107 response-cookie-attributes). Write every one of them, plus every finding the inspection found beyond the lint, into $STARCI_JOB_SCRATCH/security-findings.json grouped by rule with path, line, severity and reachability, and report the findings by rule in evidence/result.md. A lint that could not run (errors in its report) is a not-run surface, never a clean one. REPORT with lint.json and security-findings.json attached."
      vi: "Chạy canon xác thực và bảo mật qua starci app lint ở gốc app trên slice được kiểm tra: starci app lint --changed <các tệp be/ và fe/ của slice> --format json > $STARCI_JOB_SCRATCH/lint.json. Đọc báo cáo và phân loại mọi lỗi của canon bảo mật - securityCodes và securityRules của op-gate.yaml: bậc giới hạn tốc độ nghiêm của cửa xác thực (R42 auth-door-strict-rate-tier), HttpClient chỉ được gọi trong một chủ sở hữu integrations (R90 http-client-only-in-integrations), không có bí mật trong log hay lỗi (R71 no-secret-in-error, no-secret-in-log), so sánh bí mật an toàn thời gian và mặc định từ chối (R41 secret-compare-timing-safe, public-needs-reason), không có giá trị mặc định cho bí mật (R44), chủ sở hữu môi trường FE (R49) và thuộc tính cookie phản hồi của FE (R107 response-cookie-attributes). Ghi tất cả, cùng mọi phát hiện kiểm tra tìm thêm ngoài lint, vào $STARCI_JOB_SCRATCH/security-findings.json theo luật kèm đường dẫn, dòng, mức độ và khả năng chạm tới, và báo phát hiện theo luật trong evidence/result.md. Lint không chạy được (có errors trong báo cáo) là bề mặt chưa chạy, không bao giờ là sạch. BÁO CÁO kèm lint.json và security-findings.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci runtime validate` and, on every record directory it writes, `starci runtime validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: coverage
    requirement:
      en: Every declared inspection surface - entry points, authz checks, queries, serialization, secrets
        handling, configuration and dependency manifests - was actually read or scanned, and each
        required assertion has an evidence-bound answer. An uninspected surface is named with its
        reason, not absorbed into a pass.
  - id: typed-findings
    requirement:
      en: Every finding carries severity, rule, exact file/line or configuration key, evidence excerpt and
        reachability, bound to the inspected commit. A finding with no evidence is a not-run
        observation, and no finding contains a usable secret.
  - id: read-only
    requirement:
      en: The inspection changed nothing - repository status shows the inspected tree untouched, the scan
        commands stayed read-only, and no finding was repaired, hidden or re-classified to look
        cleaner.
  - id: security-lint
    requirement:
      en: "starci kernel settle re-reads the attached lint.json and security-findings.json (runtime check op-proof, proof security-lint): a done without the lint (op-lint-proof-missing), with a lint that could not run (op-lint-tool-failed), without typed findings (op-security-findings-missing) or with a security canon finding of the lint that the findings drop (op-security-finding-unreported) is refused. A done may carry findings; it may never drop one."
      vi: "starci kernel settle tự đọc lại lint.json và security-findings.json đính kèm (check op-proof, proof security-lint): done thiếu lint (op-lint-proof-missing), có lint không chạy được (op-lint-tool-failed), thiếu danh sách phát hiện có kiểu (op-security-findings-missing) hoặc bỏ sót một lỗi canon bảo mật của lint (op-security-finding-unreported) đều bị từ chối. Done có thể kèm phát hiện; không bao giờ được bỏ sót."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: INSPECTION_SURFACE_MISSING
    condition:
      en: The selected slice, its entry points or its declared security boundaries cannot be resolved from
        records and source; report the exact missing surface.
  - code: SCANNER_UNAVAILABLE
    condition:
      en: A declared read-only check or its runner cannot execute in this environment and the cause is
        provably unfixable from the allowlist - report blocked with blocker kind environment naming
        the exact missing tool or command.
  - code: OUTSIDE_ALLOWLIST
    condition:
      en: Completing a required inspection needs a path, target or effect outside the selected read set -
        report the exact need as blocker kind shared-change rather than widening it.
  - code: AUTHORITY_REQUIRED
    condition:
      en: An inspection step needs an authority the goal does not grant, such as touching a shared target
        - report blocked with blocker kind authority, an owner decision.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  app: shared
  bound-paths: shared
  manifest-paths: Manifest and script files defining the listed scan commands
layoutPolicy:
  checks: [starci-validate]
policy:
  securityPolicy:
    surface: code-and-config
    effects: read-only-inspection
    findings: typed-with-evidence-by-rule
    canon: hfs-lint-security-codes
    repair: never
    secretsInFindings: never
route:
  nodeKinds: [implementation]
  phase: [verify, post-implementation]
  intent: [security, verify, scan]
  prerequisites: [a delivered slice]
