schema: starci/op@1
id: unit.verify
goal:
  en: Run the product repository's FULL unit suite (npm test) against the delivered source and report the observed
    result - never a subset presented as the whole suite, never a repaired product. Dispatched only when the goal or the owner
    explicitly asks for the full unit run.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then gate.mjs the op loop runs before it stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml)."
      vi: "Số vòng SỬA rồi chạy lại gate.mjs của vòng lặp op trước khi dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml)."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - the repository's declared full unit run, in a job-private scratch and coverage directory
  - run-owned temporary files, disposed by the same run
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap: report it and propose a separately selected scope op; do not
        create a target or invent its acceptance/graph here."
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read package.json scripts (the
        unit command is the app's managed `test` script, the be unit project as opposed to e2e), the unit runner configuration and the
        delivered source. The evidence binds the exact tested tree, so a run without a resolved repository is
        not a unit result.
  - id: request
    path: request goal text + owner instruction
    purpose:
      en: The explicit ask for the full unit run ("full unit", "run all unit tests", "the Vietnamese phrase for run the whole unit suite"); a
        code-writing op's own scoped specs are a different thing.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof.
  - id: op-loop
    path: knowledge/op-gate.yaml
    purpose:
      en: "The op loop's data: the file-kind to pattern-file map, the example app per side and the gate and digest schemas that read-digest.mjs and gate.mjs apply."
      vi: "Dữ liệu của vòng lặp op: bảng loại tệp sang tệp pattern, app ví dụ cho từng phía, và schema của cổng và bản tóm tắt đọc mà read-digest.mjs và gate.mjs dùng."
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Write only state/blocker/completion here; the observed counts and failures belong to the evidence
        result, not node prose. Never add/remove refs/dependencies/acceptance to obtain pass.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, unit-run.json, result.md]
    content:
      en: "Record the exact command (npm test), cwd/repo, source commit/tree, environment, exit code, and the
        observed totals - suites, tests, passed, failed, skipped - with the sanitized raw output attached from
        STARCI_JOB_SCRATCH through api report. Every failure is listed grouped by spec file with its test name and
        message, so a repair can be routed per file. The run is the repository's whole unit suite: a filtered run,
        a single project or a path selection is recorded as partial, never as this proof."
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest: the touched files, their slot map from hfs explain, and every pattern and example file read with its sha256."
      vi: "Bản tóm tắt ĐỌC: các tệp sẽ sửa, bản đồ slot của chúng từ hfs explain, và mọi tệp pattern và ví dụ đã đọc kèm sha256."
  - id: gate-proof
    path: STARCI_JOB_SCRATCH/gate.json
    schema: starci/gate@1
    content:
      en: "The last round's gate report: exit, base, head, changed files, new and preexisting counts and every new finding."
      vi: "Báo cáo cổng của vòng cuối: exit, commit gốc, head, các tệp đã đổi, số lỗi mới và lỗi có sẵn, và từng lỗi mới."
steps:
  - reads: [op-loop]
    writes: [read-digest]
    action:
      en: "READ before coding (op loop, knowledge/op-gate.yaml): run node scripts/checks/read-digest.mjs --root <app> --touch <every file the slice will create or change> --out $STARCI_JOB_SCRATCH/read-digest.json and read exactly what it lists, nothing wider - the knowledge/patterns/{be|fe}/*.yaml of each touched file kind, the matching example files of examples/<app>/{fe,be} and the slot map hfs explain prints per path (slot, tier, allowed imports, rules). Code only after this read; a file the slice comes to touch later is added with --touch and read the same way."
      vi: "ĐỌC trước khi viết code (vòng lặp op, knowledge/op-gate.yaml): chạy node scripts/checks/read-digest.mjs --root <app> --touch <mọi tệp slice sẽ tạo hoặc sửa> --out $STARCI_JOB_SCRATCH/read-digest.json và đọc đúng những gì nó liệt kê, không rộng hơn - các tệp knowledge/patterns/{be|fe}/*.yaml của từng loại tệp sẽ sửa, các tệp ví dụ cùng slot trong examples/<app>/{fe,be} và bản đồ slot mà hfs explain in cho từng đường dẫn (slot, tầng, import được phép, luật). Chỉ viết code sau bước đọc này; tệp phát sinh về sau được thêm bằng --touch và đọc theo cùng cách."
  - reads:
      - target
      - request
      - repo
      - profile
    writes: [evidence]
    action:
      en: Confirm the request asks for the full unit run and resolve the repository's unit command from its
        package.json (the managed `test` script); a repository without one is a blocker, never an invented runner. Resolve the
        execution profile and actual tool availability; this does not switch the model/runtime or spawn workers.
  - reads:
      - repo
    writes: [evidence]
    action:
      en: Run the full unit command unfiltered, with coverage output (when the runner writes one) and scratch in a
        job-private directory outside the checkout, and capture stdout, stderr, exit code and duration. Never run
        e2e, never edit source or specs, never retry to turn a red run green; a flake is re-run once inside the
        record and both runs are kept.
  - reads:
      - target
      - repo
    writes: [node, evidence]
    action:
      en: Read the result back - totals and failures grouped by spec file - and report done when the whole suite ran
        and passed, failed (class product, with the failing files named) when a spec failed, blocked when the suite
        could not run. Never self-advance and never repair the failing source here.
  - reads: [op-loop]
    writes: [gate-proof]
    action:
      en: "FORCE THE CHECKS after coding: run node scripts/checks/gate.mjs --root <app> --changed <the files the slice changed> [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the new findings (lint per file and rule, tsc per message, failing specs - a finding the base already has never counts); exit 2 means a tool could not run and is never green. Still red after the last round: report blocked with the exact findings of that gate.json. Never report done while the gate is red or could not run. REPORT with gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA sau khi viết code: chạy node scripts/checks/gate.mjs --root <app> --changed <các tệp slice đã đổi> [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi mới (lint theo tệp và luật, tsc theo thông điệp, spec thất bại - lỗi đã có trên commit gốc không bao giờ bị tính); exit 2 là một công cụ không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi trong gate.json đó. Không bao giờ báo done khi cổng đỏ hoặc không chạy được. BÁO CÁO kèm gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, and an honest fail/not-run cannot earn done.
  - id: whole-suite
    requirement:
      en: The command run is the repository's full unit command unfiltered, its exit code, totals and failures are
        observed this run against the bound tree, and a partial selection is recorded as partial.
  - id: scope
    requirement:
      en: The run changed no product source and no spec, ran no e2e, and left no run-owned file behind.
  - id: op-gate
    requirement:
      en: "api settle re-reads the attached gate.json (exit 0 over the slice's changed files) and read-digest.json (a pattern file named for every touched file kind) and records the runtime check op-gate; a done without them, with a tool that could not run or with a new finding is refused, and the Kernel re-runs the same gate on the branch at landing."
      vi: "api settle tự đọc lại gate.json đính kèm (exit 0 trên các tệp slice đã đổi) và read-digest.json (có tệp pattern cho mọi loại tệp đã sửa) rồi ghi check op-gate; done thiếu chúng, có công cụ không chạy được hoặc có lỗi mới đều bị từ chối, và Kernel chạy lại đúng cổng đó trên nhánh khi land."
blockers:
  - code: UNIT_RUNNER_MISSING
    condition:
      en: The repository declares no managed test script or the runner cannot start here and the cause is provably
        unfixable from the allowlist - report blocked with blocker kind environment naming the missing piece.
  - code: UNIT_RUN_NOT_REQUESTED
    condition:
      en: Neither the goal nor an owner instruction asks for the full unit run - report the exact gap instead of running
        the suite by default.
  - code: AUTHORITY_REQUIRED
    condition:
      en: The run needs an authority the goal does not grant - report blocked with blocker kind authority, an owner decision.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  app: The bound app checkout (its root); every path written <app>/<path> is app-relative - be/..., fe/..., .starciwork/... or a path of the app root
  bound-paths: Inspected source read set
layoutPolicy:
  checks: [starci-validate]
policy:
  unitPolicy:
    surface: delivered-source
    command: test
    suite: whole-unit-suite-only
    e2e: never
    productCode: unchanged
    dispatch: only-when-the-goal-or-the-owner-asks
  specsToggle: {unit: defer-leg}
route:
  nodeKinds: [implementation]
  phase: [verify, post-implementation]
  intent: [unit, unit-suite, full-unit, verify]
  prerequisites: [implementation done]
