schema: starci/op@1
id: workspace.manage
goal:
  en: Create or reconstruct one canonical .starciwork workspace from a new purpose or selected
    existing source and old worktrees, with verified bindings, preserved provenance and validated
    scope, and declare its .starcistacks application stacks from the settled design.
params:
  mode:
    type: enum
    enum: [select, prepare, import, stacks]
    default: select
    setBy: kernel
    doc:
      en: The execution mode this dispatch runs. The kernel sets it from the approved leg that names a
        mode (workspace.manage#stacks is stacks); select leaves the choice between prepare and import
        to the first step.
nodeKinds: [operations]
completionProfile: operations
sideEffects:
  - Only the selected operation contract permits effects; no union of mode permissions.
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: .starciwork/index.yaml extensions.work3.setup.<workflow>.<mode>
    purpose:
      en: Read the catalog and this workflow's setup entry for the selected mode - refs, assertions,
        declared targets and review - and validator freshness. Preserve unaffected accepted content.
  - id: selection
    path: selected request operation + exact mode contract in this operator JSON
    purpose:
      en: Select exactly one named operation, its target, scope and criteria before any effect. No mode
        default or automatic chain.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: .starciwork/index.yaml extensions.work3.setup.<workflow>.<mode>
    fields: [extensions.work3.setup.<workflow>.<mode>]
    content:
      en: "N, the completion target of every mode, is the root catalog .starciwork/index.yaml
        (work/catalog@1), and the mode's record is its entry extensions.work3.setup.<workflow>.<mode>,
        typed by modules/schemas/work-catalog.schema.yaml $defs.setup; E is
        .starciwork/evidence/<workflow>.<mode>/ beside it (work-layout.yaml shape.setup). The catalog
        carries it because a prepare, import or stacks scope spans the whole product rather than one
        feature, the catalog is the product-wide index work-layout.yaml declares at the tree root, and the layout has no
        operations family - a root-level .starciwork/<scope>/index.yaml record is outside the layout and
        is never authored. A catalog carries no state, so the entry carries none: the mode's completion
        is the kernel's settled verdict on its job, and the entry's review records that outcome and the
        checks it rests on. An existing root-level work/node record from an earlier import is read-only
        input that workspace.canonicalization retires; this op never edits or deletes it."
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, result.yaml]
    content:
      en: Record operation, exact scope, criteria, output artifact references, observed effects and
        unresolved findings.
steps:
  - reads:
      - target
      - selection
      - profile
    writes: []
    action:
      en: "Run the mode params.mode names. When it is select, choose prepare for a new or explicitly
        revised Work purpose, or import for an existing source/worktree pilot; stacks runs only when
        named. Resolve one canonical destination, then load exactly that operation
        contract. Repository binding, inventory, preservation and validation are internal steps, not
        separate operators. Mode permissions never combine. Resolve the execution profile and actual
        tool availability before selecting instruments; this does not switch the model/runtime or
        spawn workers. For an explicitly new target, absence is expected: inspect the existing
        workspace/catalog, then create only that selected scope."
  - reads:
      - target
      - selection
    writes: [node, evidence]
    action:
      en: Complete the selected Work creation/reconstruction job and return canonical Work references,
        actual repository/source bindings, evidence and unresolved intent. Import never approves
        inferred business or executes product work. No deletion or unrelated docs/site removal is
        implied.
proofs:
  - id: mode-result
    requirement:
      en: Exactly the selected mode contract and all requested criteria pass with real evidence before
        delivery.
blockers:
  - code: OPERATION_REQUIRED
    condition:
      en: Missing, unknown or multiple operations; select a single mode under existing task authority.
placeholders:
  feature: Selected feature slug
  workflow: The running workflow id the setup entry is keyed by
  mode: The selected execution mode (prepare, import or stacks)
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate, starci-stacks-check]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  cutSetAuthority:
    scope: workspace-manage-prepare-import
    appliesWhen: The dispatch packet carries context.cut {id, ordinal, total} with total >= 2 for the
      prepare or import mode, every cut job uses this same approved workspace.manage leg, mode and
      goal binding, and the complete pairwise-disjoint path union (the root catalog .starciwork/index.yaml
      in exactly one ordinal) was preflighted before the first slice launched.
    permits: "The unchanged full `starci validate` over .starciwork may remain nonzero after a
      NON-FINAL ordinal only for findings whose paths belong exclusively to not-yet-passed sibling
      ordinals of the same cut set - typically CATALOG_DIRTY on the root catalog an unsettled later
      ordinal owns. The current slice must pass an exact-slice validation of its own owned records
      (`starci validate` scoped to them), the full command and its finding inventory stay unchanged
      except for sibling-owned paths, and a finding a passed ordinal resolved may not reappear. The
      raw nonzero full result is recorded as integration evidence, not as the slice's red verdict.
      The Kernel records `cut-slice-postcondition` and `cut-regression-inventory` green for a
      non-final pass; the FINAL ordinal must additionally record `full-regression-final` green from
      the unchanged full validation before the leg advances."
    forbids:
      - declaring a non-final slice done without an exact-slice validation of its own records
      - accepting a full-validation finding on a path this slice or a passed ordinal owns
      - advancing the leg before the final ordinal records full-regression-final green
  modePolicy:
    selection: required-exactly-one
    implicitChain: false
    permissionUnion: false
    completion: selected-mode-profile
    ownershipDerivation:
      rule: narrowest-concrete-selected-prefixes
      normalize: workspace-relative with stable repository prefix when applicable, slash-normalized, no
        root/absolute/parent-traversal/globs
      broadRootsForbiddenWhenDerivable:
        - repository root
        - .starciwork
        - .starcistacks
      importSlices:
        - .starciwork/index.yaml (the catalog and its import setup entry), the exact
          .starciwork/evidence/<workflow>.import/ migration evidence bundle and the exact selected
          .starciwork/features/<feature>/ migration record paths
        - .starciwork/workspace.yaml repositories[] when a selected repository is bound, the exact
          selected import resource paths and retained asset paths
        - exact selected .starcistacks migration/deployment declaration paths when stack material is
          in scope
        - exact cleanup target only when cleanup is explicitly authorized
      concurrency: Read-only source inventory grants no product-source write ownership. Keep product
        application paths out of import owned_paths unless an explicit selected effect writes them.
        A product workflow such as a landing-app slice may run concurrently with canonicalization
        when its normalized owned_paths do not intersect these migration slices; sharing the
        project, repository binding or canonical ledger is not a conflict.
  executionModes:
    prepare:
      id: workspace.manage
      goal:
        en: Create or revise one canonical .starciwork purpose and verified repository bindings, ready for
          business specification.
      nodeKinds: [business]
      completionProfile: business
      sideEffects: [native current-task goal creation/reuse only when explicitly requested and supported]
      graphPolicy:
        mode: selected-scope-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: intent
          path: current user request + existing .starciwork/workspace.yaml
          purpose:
            en: Read the actual requested outcome, agreed scope and existing workspace identity; do not turn
              examples or future ideas into obligations.
        - id: target
          path: .starciwork/index.yaml extensions.work3.setup.<workflow>.prepare
          purpose:
            en: Read the catalog and this workflow's prepare setup entry, its refs, declared targets,
              assertions and validator freshness; on a new project both are absent. Preserve unaffected
              accepted content.
        - id: declaration
          path: current explicit repository scope + .starciwork/workspace.yaml repositories[] + the
            selected project binding .workspaces/projects/<project>/work.json
          purpose:
            en: Read explicit task location/repository selection, the portable repository identities
              workspace.yaml repositories[] already lists ({role, name}), and the project binding
              (starci/workspace-binding@1, modules/schemas/workspace-routing.yaml bindingShape) that
              maps each role to its checkout (pathFromSource) and declared remote (gitRepository).
              These two are the one source of repository identity; a directory name, cwd or similar
              remote is only a hint when identity is unresolved.
      writes:
        - id: workspace
          path: .starciwork/workspace.yaml
          fields: [schema, id, project, description, repositories]
          content:
            en: "Initialize only an explicitly new canonical workspace (schema work/workspace@1: id,
              project, description and repositories[]); reuse an existing workspace unchanged except
              to append a selected verified repository its repositories[] does not list yet.
              repositories[] is the tree's repository binding: one {role, name} per selected
              repository, role as the project binding keys it (be, fe) and name as the repository's
              directory name, the name implementation records, `repository:<name>/` paths and
              evidence servedVersions resolve against. The Work owner repository is always listed,
              so a source-free purpose lists only it. No _resources repository record exists
              (work-layout.yaml shape.resources admits environments, identities and fixtures only);
              remote, HEAD, default ref and dirty state are observations for
              E/repository-observation.yaml. Never invent repository/environment resources merely
              to satisfy setup."
        - id: node
          path: .starciwork/index.yaml (catalog + extensions.work3.setup.<workflow>.prepare) +
            .starciwork/features/<feature>/index.yaml +
            .starciwork/features/<feature>/<family>/<name>/index.yaml
          fields:
            - schema
            - id
            - title
            - description
            - state
            - dependsOn
            - refs
            - blockedBy
            - "extensions.work3.setup.<workflow>.prepare: request, description, refs, assertions, nodes,
              deps, exclusions, openQuestions, review"
            - "extensions.work3.setup.<workflow>.prepare.nativeGoal: actual returned current-task goal
              reference only"
          content:
            en: "Every authored index.yaml carries the schema const its path declares. Capture the
              customer-language product catalog in .starciwork/index.yaml (work/catalog@1, one entry
              per feature) and each feature's readable overview in features/<feature>/index.yaml
              (work/feature@1: id, title, description, no state); these do not approve inferred
              module requirements. N is the catalog's setup entry
              extensions.work3.setup.<workflow>.prepare (the op-level writes.node says why), carrying
              the scope-review assertions, the declared targets as nodes/deps and the exclusions.
              Seeded product records live in flat family folders
              (fr/nfr/br/data/journey/decision/sds/ui/impl/uat/contract/integration) and remain
              todo. Source-generated scope awaiting confirmation stays todo with blockers[];
              non-applicable scope stays outside the declared records. Scope decisions distinguish
              implement, defer and not applicable. Store requirement ids once. Repository binding is
              an internal part of this complete preparation job, not a separate prerequisite record.
              Declare only genuinely selected downstream targets as todo records; do not invent
              accepted intent. Graph edits apply only to the explicitly selected approved scope:
              declare real prerequisite record ids in dependsOn and semantic input record/resource
              ids in refs. No catalogue-wide chain or new unrelated scope; finish all graph/spec
              changes before review proof. For a bounded revision of existing imported consumer
              scope, inspect eligibility and accepted inputs before freezing the next effectful
              goal; reuse workspace identity and bindings. The setup entry alone is the preparation
              completion target. Explicitly bound child paths/resources are preparation
              write scope: correct only selected incomplete semantics and set confirmed records todo
              without implementation completion. Do not introduce preparation for already-ready
              scope or require product-wide scaffolding."
        - id: evidence
          path: E/manifest.yaml + E/scope-review.md + E/repository-observation.yaml
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: Retain source-intent citations and actual scope/coverage review in the setup entry's own
              bundle E only. The entry's review reaches pass only after real review evidence and
              validation; initial scaffolding has no review. No code/UAT pass.
      steps:
        - reads:
            - intent
            - target
          writes: [workspace, node]
          action:
            en: Resolve the existing canonical workspace, or initialize only the explicitly new workspace
              identity; establish one purpose, actors/outcomes stated so far, inclusions and
              exclusions. Mark unspecified behavior unknown.
        - reads:
            - target
            - declaration
          writes: [workspace, evidence]
          action:
            en: Inspect exact Git root/common-dir, remote identity, full HEAD, worktree registration, links and
              dirty paths with read-only commands, and verify each actual remote against the project
              binding's gitRepository. Bind only selected verified repositories, by listing them in
              workspace.yaml repositories[] of the existing canonical .starciwork root. Do not
              reset, clean, stash, switch or create another canonical tree. Retain sanitized
              repository-observation.yaml (remote, full HEAD, default ref, dirty state per
              repository); source-free setup explicitly records no source repository yet.
        - reads:
            - intent
            - target
          writes: [node]
          action:
            en: Map the purpose into the smallest useful completion tree. A task may cover three UAT flows, but
              each flow has separate UI and UX assertion leaves; do not pre-expand irrelevant
              lifecycle branches.
        - reads:
            - intent
            - target
          writes: [node]
          action:
            en: Record applicability and dependencies by stable IDs. A defer decision needs
              rationale/owner/revisit trigger and stays visible; it is not done or na. Reuse
              explicit approval, asking only unresolved material scope choices.
        - reads:
            - intent
            - target
          writes: [node]
          action:
            en: When the user explicitly requests a native goal for this current chat/task and an actual
              supported goal tool exists, inspect/create/reuse that goal according to the tool
              contract; retain only its returned reference in the setup entry's nativeGoal. Otherwise
              keep purpose in .starciwork and the current chat. Never invent a platform goal ID or
              create a separate task/agent goal automatically.
        - reads:
            - target
          writes: [evidence]
          action:
            en: Review tree coverage against the original purpose, validate references and report selected
              eligible ops as suggestions only. Stop without dispatch or cooking child pieces. This
              handoff is conditional and does not change standalone or named frontend response
              contracts.
      proofs:
        - id: binding
          requirement:
            en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly
              proposed, required assertions are covered, input bindings are current, and an honest
              not-run/fail cannot earn done.
        - id: scope
          requirement:
            en: Every declared outcome is mapped to a required leaf, explicit deferred decision or justified
              non-applicability; setup completion never rolls implementation forward.
        - id: identity
          requirement:
            en: Selected repositories have verified identities, each listed once in workspace.yaml
              repositories[] under the role and name the project binding resolves, and one canonical
              Work root; an explicitly source-free purpose lists only the Work owner repository.
      blockers:
        - code: PURPOSE_AMBIGUOUS
          condition:
            en: Multiple materially different purposes or repository identities remain unresolved.
        - code: DECLARED_DEPENDENCY_UNMET
          condition:
            en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
              Report node/resource IDs and propose a separately selected graph update when needed;
              never run predecessors or weaken dependsOn/refs/required to proceed.
      placeholders:
        feature: Selected feature slug
        workflow: The running workflow id the setup entry is keyed by
        repo-id: Repository name from workspace.yaml repositories[] (or its project binding role)
        project: Selected project id in the host .workspaces/projects registry
        bound-paths: Inspected source read set
        write-ceiling: Explicit owned source paths
        environment: Resolved environment resource slug
        identity: Selected actor resource slug
        fixture: Selected fixture resource slug
        resource: Selected owned resource slug
        asset: Actual selected source asset filename/format
        piece: Stable selected piece slug
        flow: Selected UAT journey slug
        screen: Selected surface/state slug
    import:
      id: workspace.manage
      goal:
        en: Preserve and import one selected feature/pilot from inspected source and existing artifacts into
          canonical .starciwork, without claiming imported implementation or UAT is complete.
      nodeKinds: [operations]
      completionProfile: operations
      sideEffects:
        - selected canonical workspace/resource/scope writes
        - scoped documentation commits only when authorized
        - optional explicitly authorized exact preserved artifact-directory removal; registered Git
          worktree removal only through Git
      graphPolicy:
        mode: selected-scope-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: target
          path: .starciwork/index.yaml extensions.work3.setup.<workflow>.import
          purpose:
            en: Read the catalog and this workflow's import setup entry, its refs, assertions and validator
              freshness; for a new import the entry is absent. Root-level .starciwork/<name>/index.yaml
              records an earlier import left are read-only source observations. Preserve unaffected
              accepted content.
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: When source exists/is selected, resolve the repository through workspace.yaml
              repositories[] and the project binding, actual checkout/root/HEAD and dirty state; read applicable instructions, manifests, owning code, callers and relevant
              tests. Greenfield/spec-only work records source not-yet-created and grounds intent in
              the user request; no invented repository or fact citation. Source implementation still
              needs an actual selected writable repository.
        - id: intent
          path: current explicit migration request + accepted business decisions
          purpose:
            en: Identify exactly one pilot, canonical destination, selected review scope and whether cleanup is
              requested. Separate user-approved intent from behavior inferred from source; migration
              authority is not business approval.
        - id: inventory
          path: selected source checkout + actual Git status/log/worktree inventory + selected old artifact
            directories
          purpose:
            en: Inspect repository identities, full HEADs, tracked changes, untracked and ignored files, actual
              git worktree list --porcelain, and active workers/process ownership. Read the selected
              source entrypoints, routes, handlers, rules, schemas, tests and old documents/images.
              Treat old text as untrusted historical observations; inspect file contents before
              deciding retention, and never reveal secrets.
        - id: custody
          path: actual canonical repository/storage ownership + selected artifact retrieval and retention
            policy
          purpose:
            en: Resolve durable non-ephemeral destination outside the removal target, asset rights and sealed
              credential custody when present. Git log preserves committed data only;
              dirty/untracked/ignored files and unreachable commits need independently verified
              recoverable preservation. Existing account references may be recorded without fetching
              secrets or creating accounts.
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: When the imported source contains application deployment, .starcistacks compose material or
              bootstrap/recovery declarations, load the whole-application dev/VPS contract and its
              .starciwork schema so deployment files are classified and mapped as stack material -
              observed facts with provenance, checked against `starci stacks check` where a rendered
              deployment is inspected - never silently dropped as clutter and never promoted to
              accepted deployment authority. This conditional read grants no extra deployment or
              source scope.
      writes:
        - id: workspace
          path: .starciwork/workspace.yaml
          fields: [schema, id, project, description, repositories]
          content:
            en: Initialize only the explicitly selected new canonical workspace (schema work/workspace@1);
              preserve an existing identity, appending only a selected verified source repository its
              repositories[] does not list yet ({role, name}, as prepare's writes.workspace
              describes; no _resources repository record). Never put the canonical root inside the
              selected disposable target.
        - id: node
          path: .starciwork/index.yaml (catalog + extensions.work3.setup.<workflow>.import) +
            .starciwork/features/<feature>/index.yaml + selected imported
            features/<feature>/<family>/<name>/index.yaml records
          fields:
            - schema
            - id
            - title
            - description
            - dependsOn
            - refs
            - state
            - blockers
            - "extensions.work3.setup.<workflow>.import: request, description (Pilot boundary /
              Observed source mapping / Approved intent / Candidate scope / Unknowns), refs,
              assertions, nodes, deps, exclusions, openQuestions, migration, review"
          content:
            en: Every authored index.yaml carries the schema const its path declares. N is the catalog's
              migration-review setup entry extensions.work3.setup.<workflow>.import (the op-level
              writes.node says why), with inventory/preservation/import assertions and
              migration.pilot. Capture the product catalog in
              .starciwork/index.yaml (work/catalog@1) and each feature's overview in
              features/<feature>/index.yaml (work/feature@1, no state) before importing product
              records. Every newly imported flat family record (br/fr/nfr/data/journey/decision/sds/
              ui/impl/uat/contract/integration) starts todo with no completion, even if old notes
              say done. Assign stable ids, observed source citations versus candidate requirements,
              and only approved graph scope. Do not overwrite existing accepted records. For an
              explicitly selected preset, declare its review targets before consumers run; their
              expected assertions remain bounded to intent review and imported graph integrity,
              never product completion. If optional cleanup is in scope, the entry's migration names
              cleanupTarget and the exact cleanupAssertions, and migration.cleanup stays blocked
              until they pass; no separate cleanup record is authored.
        - id: resources
          path: .starciwork/_resources/imports/<resource>/resource.yaml +
            .starciwork/_resources/imports/<resource>/assets/<asset>
          fields:
            - schema
            - id
            - kind
            - owner
            - revision
            - details
            - files:[{path}]
          content:
            en: Record source mappings in details on the import work/resource@1 record, naming the source
              repository by its workspace.yaml repositories[] name; inspected repository
              root/identity/full commits stay in E/inventory.yaml. Keep observed versus inferred
              facts explicit. Preserve
              selected nonsecret source/design documents and images in imports assets with files
              relative paths. A source image is not product screenshot evidence. Preserve original
              artifact names, actual hashes and origin in the inventory report; register only
              retrievable existing account custody refs without secrets. Bind stable resource IDs in
              selected imported node refs before computing review digest. Do not copy whole source
              repositories or credentials into .starciwork.
        - id: evidence
          path: E/manifest.yaml + E/inventory.yaml + E/source-map.md + E/preservation.yaml +
            E/import-review.md + E/cleanup.yaml
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Inventory each selected path: origin repository/commit, tracked/dirty/untracked/ignored status,
              actual byte hash, classification, retention decision, durable destination and verified
              retrieval hash or explicit unresolved status. Source rows cite actual
              path/symbol/commit, observed behavior, candidate business interpretation,
              confidence/unknown and separate intent authority. Preserve historical UAT as
              historical files, never a fresh pass manifest. Record migration assertions only, final
              .starciwork validation output, cleanup target/authority/worker checks and actual
              action or blocked/not-requested. Imported child product assertions must have no
              fabricated evidence."
        - id: source
          path: repository:<repo-id>/<removal-target>
          fields:
            - optional exact old artifact-directory removal only; no product implementation edits
          content:
            en: "Only if cleanup was explicitly selected and authorized: remove the one resolved old directory
              after all preservation/retrieval hashes, committed history reachability, recoverable
              dirty/untracked/ignored data, ownership and inactive-worker checks pass. The target
              cannot be a repository root, canonical .starciwork root, broad parent or symlink; use
              actual registered worktree inventory, not its folder name. Registered Git worktrees
              require git worktree remove for the exact target without force; custom artifact
              directories use a recoverable same-shell move/removal at the exact verified target. If
              the target is outside the bound selected repository ceiling or any check is uncertain,
              do not delete; leave blocked cleanup. No accounts, deployments, broad cleanup, force
              or raw recursive deletion of Git worktrees."
      steps:
        - reads:
            - intent
            - target
            - repo
            - inventory
            - custody
          writes: [workspace, evidence]
          action:
            en: Confirm one pilot and exact canonical destination. Inspect existing target and ancestors;
              absence is expected only for selected new scope. Inventory actual Git
              roots/HEAD/status/worktrees and selected historical artifacts before any writes or
              cleanup. Stop if ownership or pilot boundary is ambiguous.
        - reads:
            - repo
            - inventory
            - intent
            - application-stacks
          writes: [evidence]
          action:
            en: Read the bounded source and tests; map routes/actions/data/rules to source facts at actual
              commits, and map .starcistacks compose/bootstrap material against the declared stack
              contract where it is present. Report contradictions and missing behavior. Label
              inferred business as candidate, never approved intent; old checkmarks and test file
              existence prove no current execution.
        - reads:
            - inventory
            - custody
            - repo
          writes: [resources, evidence]
          action:
            en: Classify and preserve only selected durable nonsecret artifacts; hash original bytes and
              retrieve/re-hash destination bytes outside the cleanup target. Verify committed
              history remains reachable and separately preserve dirty/untracked/ignored material
              with owned safe custody. A missing or secret-containing artifact blocks its cleanup,
              not permission to copy secrets or drop data.
        - reads:
            - intent
            - target
            - inventory
            - repo
            - custody
          writes: [node, resources]
          action:
            en: Author the selected candidate tree and canonical source resources. Imported leaves remain
              uninvestigate with activity:idle and no completion; import itself never confirms their
              expected scope. Before a consumer workflow can dispatch, inspect eligibility and
              either use its permitted design investigation path or explicitly select a bounded
              prepare scope revision to confirm/correct the leaf to todo. Keep setup review
              completion distinct from future product completion; do not route uninvestigate
              directly into implementation or UAT. Preserve approved existing nodes. Declare only
              actual selected graph edges and preset review targets when explicitly requested;
              unresolved edges are recorded as unknown rather than invented IDs.
        - reads:
            - target
            - intent
            - inventory
            - custody
            - repo
          writes: [source, evidence]
          action:
            en: If and only if exact cleanup is selected, re-inspect worktree registration, source/dirty
              inventory and active-worker ownership immediately before removal. Require explicit
              deletion authority, verified durable bytes and recoverable commits/uncommitted data.
              Remove a registered worktree with Git without force, or remove a verified custom
              artifact directory recoverably. If any check fails, leave original untouched and
              record the cleanup blocked in evidence. Do not run a successor op.
        - reads:
            - target
            - intent
            - inventory
            - repo
            - custody
          writes: [node, evidence]
          action:
            en: Finalize semantic scope/resources first, obtain the real inputDigest, then verify imported
              IDs/refs/assertions, preservation hashes and all uninvestigate states. Write only
              observed migration evidence, then the setup entry's review and migration.cleanup after
              verification. Keep
              product children uninvestigate and cleanup truth explicit; commit only selected
              documentation when authorized, record actual commit separately in evidence, then stop.
      proofs:
        - id: source
          requirement:
            en: Every claimed source behavior has inspected path/symbol/full commit and is distinguished from
              approved business intent; unknowns remain visible.
        - id: preservation
          requirement:
            en: Every selected retained artifact has independently re-read identical hashes at a durable
              destination; dirty/untracked/ignored data and history remain recoverable before any
              deletion.
        - id: investigation-state
          requirement:
            en: Imported product leaves are stored uninvestigate with activity:idle and without completion; they
              cannot satisfy done-only dependencies or receive migration evidence as product
              acceptance.
        - id: cleanup
          requirement:
            en: Cleanup is not-requested, proven exact safe removal, or separately blocked with original data
              retained. Migration success never hides required unresolved cleanup.
      blockers:
        - code: PILOT_SCOPE_UNKNOWN
          condition:
            en: One business boundary, actual source ownership or canonical destination cannot be resolved.
        - code: PRESERVATION_UNPROVEN
          condition:
            en: Selected bytes/history/uncommitted data cannot be retrieved identically and recoverably outside
              the removal target; retain originals.
        - code: REMOVAL_UNSAFE
          condition:
            en: Deletion authority, exact target ownership, inactive worker status or worktree registration is
              missing/uncertain; do not delete or force.
      placeholders:
        feature: Selected feature slug
        workflow: The running workflow id the setup entry is keyed by
        repo-id: Repository name from workspace.yaml repositories[] (or its project binding role)
        project: Selected project id in the host .workspaces/projects registry
        bound-paths: Inspected source read set
        write-ceiling: Explicit owned source paths
        environment: Resolved environment resource slug
        identity: Selected actor resource slug
        fixture: Selected fixture resource slug
        resource: Selected owned resource slug
        asset: Actual selected source asset filename/format
        piece: Stable selected piece slug
        flow: Selected UAT journey slug
        screen: Selected surface/state slug
        removal-target: Exact inventoried old directory relative to the bound repository, verified within
          the selected ceiling
      migrationPolicy:
        scope: one-selected-feature
        importState: uninvestigate
        initialActivity: idle
        importCompletion: forbidden
        intentAuthority: approved-intent-not-inferred-source
        cleanup: explicit-exact-preserved-inactive-only
        registeredWorktreeRemoval: git-without-force
    stacks:
      id: workspace.manage
      goal:
        en: Declare the whole application's .starcistacks tree for the owner repository from the settled
          SDS component inventory and prove it statically conformant.
      nodeKinds: [operations]
      completionProfile: operations
      sideEffects:
        - .starcistacks declaration, environment directories, compose files, runbooks and encrypted
          secret pairs inside the owner repository
        - scoped documentation commits only when authorized
        - no container start, deployment, remote host, DNS or credential-provider effect
      graphPolicy:
        mode: selected-scope-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: target
          path: .starciwork/index.yaml extensions.work3.setup.<workflow>.stacks
          purpose:
            en: This workflow's stacks setup entry on the catalog, its refs to the settled design and its
              assertions. For an explicitly new target, absence is expected.
        - id: architecture
          path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
          purpose:
            en: The settled component inventory, deployment and integration records — frontend, APIs,
              workers, init/migration jobs, stateful services, ingress and external dependencies —
              that the declaration lists.
        - id: layout
          path: modules/schemas/stacks-layout.yaml
          purpose:
            en: The .starcistacks tree contract — declaration, environment directories, compose files,
              runbooks, secret pairs and the refused shapes.
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: The whole-application dev and VPS contract and the declaration's field schema.
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: The owner repository checkout, HEAD, dirty state and any existing .starcistacks tree to
              reconcile.
      writes:
        - id: declaration
          path: .starcistacks/application-stacks.yaml
          fields: [schema, sources, components, environments, k8s]
          content:
            en: The one declaration per repository, against modules/schemas/application-stacks.schema.yaml.
        - id: environments
          path: .starcistacks/<environment>/**
          fields: [composeFiles, runbook, secrets, runtime, seeds, infra]
          content:
            en: One directory per declared environment in the stacks-layout.yaml shape — declared compose
              files, README.md runbook, <name>/<name>.enc secret pairs with the plaintext member
              gitignored, runtime config/env/files, seeds and infra.
        - id: node
          path: .starciwork/index.yaml extensions.work3.setup.<workflow>.stacks
          fields: ["extensions.work3.setup.<workflow>.stacks: request, refs, assertions, review"]
          content:
            en: N is the catalog's stacks setup entry (the op-level writes.node says why); its review names
              the stacks check run per environment and its outcome.
        - id: evidence
          path: E/manifest.yaml
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: The rendered deployment models, the exact stacks check commands and outputs, and every
              component's source record.
      steps:
        - reads:
            - target
            - architecture
            - application-stacks
          writes: []
          action:
            en: Resolve the component inventory from the settled design records. Every component, environment
              binding and external dependency traces to a settled record or an explicit justified
              exclusion; an unsettled component is a named gap, not a choice. The owner's production
              environment is the declaration's vps environment.
        - reads:
            - repo
            - layout
            - application-stacks
          writes: [declaration, environments]
          action:
            en: Write .starcistacks/application-stacks.yaml, then exactly one directory per declared
              environment in the stacks-layout.yaml shape. Reconcile an existing tree instead of
              creating a parallel one; generate declared local secrets once and store only encrypted
              members as tracked files.
        - reads:
            - repo
            - layout
          writes: [node, evidence]
          action:
            en: Render each environment's deployment model with docker compose config or docker stack
              config, run the stacks check on it per environment, and record the commands, outputs,
              limitations and unrun cases. Stop without starting any stack.
      proofs:
        - id: stacks-conformant
          check: scripts/checks/stacks.mjs
          requirement:
            en: "`node bin/starci.mjs stacks check <repo-root> --environment <env> --deployment-model
              <rendered>` passed for every declared environment on the rendered models, and its output
              is recorded — static conformance only, never a claim the stack ran."
        - id: inventory-traced
          requirement:
            en: Every declared component names the settled design record it realises or its justified
              exclusion.
      blockers:
        - code: SDS_UNSETTLED
          condition:
            en: No settled design names the components, environments or external dependencies to declare.
        - code: SECRET_CUSTODY_MISSING
          condition:
            en: A declared secret cannot be encrypted with an available custody key; plaintext is never
              written as a tracked file.
      placeholders:
        workflow: The running workflow id the setup entry is keyed by
        feature: Feature folder holding the settled design records
        environment: An environment the declaration admits
        repo-id: Owner repository name from workspace.yaml repositories[] (or its project binding role)
        bound-paths: Inspected source read set
route:
  nodeKinds: [operations]
  phase: [scope, pre-implementation]
  intent: [workspace, manage, bootstrap, import, bind]
  riskHints: [work-tree-writes]
