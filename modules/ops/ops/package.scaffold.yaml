# modules/ops/ops/package.scaffold.yaml — new reusable package/module creation.
# Creates a NEW package/library source tree inside a bound repository (or a fresh
# repo the binding already names): manifest, exports map, toolchain, harness —
# proven by pack/build + a real smoke consumer, not just written.

id: package.scaffold
goal:
  en: Create one new package or library module at the declared path and prove its public
    contract surface — the package builds and a real consumer import resolves.
nodeKinds:
  - implementation
completionProfile: implementation
sideEffects:
  - owned source edits
  - new package tree creation inside the bound repository at the declared path
  - scoped local commits when authorized
  - toolchain install/build in the declared sandbox
  - no registry publication, no external release
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the selected implementation node this package realises: declared path, package
        identity (name/scope), public surface refs, assertions. No selected node is a scope gap."
  - id: architecture
    path: .starciwork/<business>/architecture/**/index.yaml
    purpose:
      en: "REQUIRED. Package boundaries — name, exports shape, dependency policy, consumer contract —
        are settled architecture. Undecided boundaries report sds-gap; the scaffold never invents
        a public API."
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: Resolve the actual checkout and read sibling packages/manifests for house conventions —
        a new package in an existing repo inherits that repo's toolchain wiring, not a parallel one.
  - id: conventions
    path: knowledge/patterns/be/* + knowledge/code-pattern-enforcement.yaml
    purpose:
      en: Read the kit contracts the package must satisfy (eslint kits, grammar packaging,
        exports-map policy) before writing the manifest.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve the request-bound profile; capabilities are the intersection of actual tools and
        profile policy.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - state
      - activity
      - codeRefs
      - evidence
    content:
      en: Record the realised package root, its manifest identity and evidence.
  - id: source
    path: repository:<repo-id>/<declared-package-root>/**
    fields:
      - manifest
      - exports
      - toolchainConfig
      - layout
      - harness
    content:
      en: "The new package tree only: package.json with declared name/scope/exports, toolchain
        configs inheriting house kits, declared layout, minimal public surface and its harness."
  - id: evidence
    path: E/result.json + E/effects.json + E/verification.json + E/artifacts
    fields:
      - request
      - scope
      - criteria
      - status
      - outputs
      - observations
      - effects
      - evidenceRefs
      - codeRefs
      - remaining
      - recovery
steps:
  - reads: [target, architecture]
    writes: [evidence]
    action:
      en: Resolve package identity, public surface and dependency policy from settled records.
        Every export the manifest declares traces to a record.
  - reads: [repo, conventions]
    writes: [evidence]
    action:
      en: Resolve the checkout, confirm the declared package root is empty-or-absent, read sibling
        package manifests and the kit contracts this package inherits.
  - reads: [architecture, conventions]
    writes: [source]
    action:
      en: Write the manifest (name/scope/exports per the settled boundary), toolchain configs wired
        to house kits, declared layout, minimal public surface and harness.
  - reads: [repo]
    writes: [source, evidence]
    action:
      en: Install, build, lint and test for real; prove the public contract with a real consumer
        smoke — pack or workspace-import the package and resolve its declared export from an actual
        consumer file.
  - reads: [target]
    writes: [node, evidence]
    action:
      en: Record the package root and codeRefs on the node; return the evidence bundle including
        the consumer-smoke output.
proofs:
  - id: package-builds
    requirement:
      en: The declared toolchain ran green against the new package and real output is recorded.
  - id: contract-resolves
    requirement:
      en: A real consumer resolved the declared export — pack or workspace import executed, not
        asserted.
  - id: conventions-inherited
    requirement:
      en: The package uses the house kits/toolchain wiring of its repo — no parallel toolchain.
  - id: scope
    requirement:
      en: Every created file lives under the declared package root.
blockers:
  - code: SDS_MISSING
    condition:
      en: No settled architecture names the package identity, boundary or public surface.
  - code: REPO_UNBOUND
    condition:
      en: No bound repository checkout exists to receive the package.
  - code: CONVENTION_CONFLICT
    condition:
      en: The declared boundary contradicts the repo's kit contracts (exports policy, lint kits).
  - code: TOOLCHAIN_UNAVAILABLE
    condition:
      en: The declared toolchain cannot install or run in the available environment.
  - code: OUTSIDE_SCOPE
    condition:
      en: The required tree would write outside the declared package root.
placeholders:
  repo-id: Observed selected repository identity
  bound-paths: Inspected relevant source read set
  declared-package-root: The exact path the node/design declares for the new package
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

business:
  question: >-
    "For a new package/module: what exact boundary does the settled design declare,
    and does a real consumer resolve its public surface?"
  whenNeeded:
    - A workflow needs a new reusable package/module inside a bound repo (packages/* shape)
      or a fresh bound repo.
    - The public contract must be proven before consumers are built on it.
  whenNot:
    - Not for editing an existing package's internals — code.refactor / the owning implement op.
    - Not for publishing — release.deliver owns release effects.
  consumes:
    - The selected implementation node; settled architecture boundary; the bound repository and
      its existing package conventions; house kits.
  produces:
    - A buildable package under the declared root whose declared export a real consumer resolves,
      plus its evidence bundle.
  failureModes:
    - SDS_MISSING, REPO_UNBOUND, CONVENTION_CONFLICT, TOOLCHAIN_UNAVAILABLE, OUTSIDE_SCOPE.

route:
  nodeKinds: [implementation]
  phase: [implement]
  intent: [scaffold, greenfield, new-source, package, library, module, bootstrap, init]
  prerequisites: ["architecture.decide settled pass (reviewed SDS seed; Work leaves remain todo)", "repository bound"]
  riskHints: [source-edits, new-tree]
