schema: starci/op@1
id: knowledge.repair
goal:
  en: Repair one challenged canonical instruction/rule and affected references from concrete
    applicability evidence.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then the document gate (starci gate run --scope docs) before the op stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml docChecks)."
      vi: "Số vòng SỬA rồi chạy lại cổng tài liệu (starci gate run --scope docs) trước khi op dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml docChecks)."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects: [exact authorized knowledge source/reference edits, scoped local commits when authorized]
graphPolicy:
  mode: read-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: shared
    purpose:
      en: shared
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: shared
  - id: rule
    path: selected canonical knowledge file + affected references + applicable owner maintenance policy
      + original challenge evidence
    purpose:
      en: Read the actual rule identifier/case and its owner/callers, observed counterexamples and
        existing enforcement. Read relevant skill instructions fully if editing a skill.
  - id: profile
    path: shared
    purpose:
      en: shared
  - id: standard
    path: docs/architecture.md + docs/code-pattern-enforcement.md + knowledge/op-gate.yaml + knowledge/hfs/rules.yaml
    purpose:
      en: shared
      vi: "Chuẩn mà quyết định và bản ghi của op dẫn ra: knowledge/op-gate.yaml (proofs.read-knowledge), các tệp knowledge liệt kê ở bước ĐỌC và bản đồ slot hfs của mọi bản ghi op viết (starci app explain ở gốc app). Các tệp được đọc tại chỗ và ghi kèm sha256 vào bản tóm tắt ĐỌC; không chép lại vào bản ghi."
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic node prose. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: <app>/<write-ceiling>
    content:
      en: shared
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, rule-review.md, validation.json, lineage.json, result.md]
    content:
      en: "Keep applicability findings, exact before/after authority paths, actual
        validator/citation/reference checks and origin-context retest when included.
        Operator-specific observed result in evidence/result.md: Record evidence-backed reason and
        canonical owner, preserving stable rule IDs and existing valid scope. A one-off preference
        is not universal law."
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest (read-digest.mjs --knowledge): every knowledge file the decision cites and the hfs slot of every record written, each with its sha256."
      vi: "Bản tóm tắt ĐỌC (read-digest.mjs --knowledge): mọi tệp knowledge mà quyết định dẫn ra và slot hfs của mọi bản ghi đã viết, kèm sha256 của từng tệp."
  - id: doc-gate
    path: shared
    content:
      en: shared
      vi: "Cổng tài liệu của vòng cuối (starci gate run --scope docs): kết quả từng docChecks - doc-language, check-work-surfaces, check-work-deep, check-example-work, check-contract-cites, check-json-exceptions - exit và từng lỗi."
steps:
  - reads: [standard, rule]
    writes: [read-digest]
    action:
      en: "READ the standard before deciding (knowledge/op-gate.yaml proofs.read-knowledge): run starci gate read --root <app> --touch <every record this op will write> --knowledge <the challenged knowledge file> knowledge/hfs/rules.yaml knowledge/op-gate.yaml <and every knowledge file that cites the repaired rule> --out $STARCI_JOB_SCRATCH/read-digest.json, and read what it records - the knowledge files in place and the hfs slot map of each record (slot, tier, rules). The repair keeps one source per rule: a rule the canon (knowledge/hfs/rules.yaml) or a pattern file already states is cited, never copied, and every reference the repair moves is followed to the files that cite it. A record the op comes to write later is added with --touch and read the same way; REPORT with read-digest.json attached."
      vi: "ĐỌC chuẩn trước khi quyết định (knowledge/op-gate.yaml proofs.read-knowledge): chạy starci gate read --root <app> --touch <mọi bản ghi op sẽ viết> --knowledge <tệp knowledge bị phản biện> knowledge/hfs/rules.yaml knowledge/op-gate.yaml <và mọi tệp knowledge dẫn tới luật được sửa> --out $STARCI_JOB_SCRATCH/read-digest.json, rồi đọc những gì nó ghi - các tệp knowledge tại chỗ và bản đồ slot hfs của từng bản ghi (slot, tầng, luật). Bản sửa giữ một nguồn cho mỗi luật: luật mà canon (knowledge/hfs/rules.yaml) hoặc tệp pattern đã nêu thì được dẫn, không chép lại, và mọi tham chiếu bản sửa dời đi đều được lần tới các tệp dẫn nó. Bản ghi phát sinh về sau được thêm bằng --touch và đọc theo cùng cách; BÁO CÁO kèm read-digest.json."
  - reads:
      - target
      - rule
      - repo
      - profile
    writes: []
    action:
      en: Check whether the issue is existing enforcement failure, missing concept, wrong existing rule or
        duplicate concept using the actual maintenance policy of the selected owner. Choose one
        canonical owner before edits. Resolve the execution profile and actual tool availability
        before selecting instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - rule
      - repo
    writes: [source]
    action:
      en: Make smallest scoped rule/gate/step repair with stable IDs, same-commit affected reference
        updates and no product-specific law. Update genuine callers/contracts together; do not patch
        consumers as hidden workaround.
  - reads:
      - rule
      - repo
    writes: [evidence]
    action:
      en: Run actual relevant validation/citation/parity and behavioral regression checks. Generated
        documents use their owned generators; inspect changes rather than claiming textual shape
        proves sound guidance.
  - reads:
      - target
      - rule
      - repo
    writes: [node, evidence]
    action:
      en: Commit owned change when authorized and report exact originating context needing re-evaluation.
        Do not automatically rerun its operation or claim visual correctness. This handoff is
        conditional and does not change standalone or named frontend response contracts.
  - reads: [standard, rule]
    writes: [doc-gate]
    action:
      en: "FORCE THE DOCUMENT CHECKS after writing: run starci gate run --scope docs --out $STARCI_JOB_SCRATCH/doc-gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the findings per check (a document that is not English, a Work record with a dead surface or a stale proof, a cite of a file that does not exist, a JSON exception out of place); exit 2 means a check could not run and is never green. Still red after the last round: report blocked with the exact findings. Never report done while the document gate is red or could not run. REPORT with doc-gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA TÀI LIỆU sau khi viết: chạy starci gate run --scope docs --out $STARCI_JOB_SCRATCH/doc-gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi theo từng bộ kiểm tra (tài liệu không phải tiếng Anh, bản ghi Work có bề mặt chết hoặc bằng chứng lỗi thời, trích dẫn tới tệp không tồn tại, ngoại lệ JSON sai chỗ); exit 2 là một bộ kiểm tra không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi. Không bao giờ báo done khi cổng tài liệu đỏ hoặc không chạy được. BÁO CÁO kèm doc-gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci runtime validate` and, on every record directory it writes, `starci runtime validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository, and
        separately retain integration/tested mappings. Report uncommitted or no-change honestly.
  - id: knowledge
    requirement:
      en: Repair follows canonical ownership and actual rule-applicability evidence; affected references
        and applicable regressions validate.
  - id: read-knowledge
    requirement:
      en: "starci kernel settle re-reads the attached read-digest.json (runtime check op-proof, proof read-knowledge): a done whose digest is missing (op-read-digest-missing), names no knowledge file or leaves a written record without its hfs slot (op-read-digest-no-knowledge) is refused."
      vi: "starci kernel settle tự đọc lại read-digest.json đính kèm (check op-proof, proof read-knowledge): done thiếu bản tóm tắt (op-read-digest-missing), không nêu tệp knowledge nào hoặc có bản ghi đã viết thiếu slot hfs (op-read-digest-no-knowledge) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
  - id: doc-gate
    requirement:
      en: "starci kernel settle re-reads the attached doc-gate.json (runtime check op-proof, proof doc-gate): a done without it (op-doc-gate-missing), with a check that could not run (op-doc-gate-tool-failed) or with a finding (op-doc-gate-red) is refused."
      vi: "starci kernel settle tự đọc lại doc-gate.json đính kèm (check op-proof, proof doc-gate): done thiếu nó (op-doc-gate-missing), có bộ kiểm tra không chạy được (op-doc-gate-tool-failed) hoặc có lỗi (op-doc-gate-red) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
judge:
  - by: machine
    measures: [declared-checks, op-proof:doc-gate, op-proof:read-knowledge]
    proofs: [binding, doc-gate, read-knowledge]
    why: "the settler re-runs the validator over the references it names, the document gate is re-run natively and the READ of the standard is re-read from the digest"
blockers:
  - code: RULE_OWNER_UNKNOWN
    condition:
      en: Challenge cannot be grounded in a canonical owner/applicable case or needs wider authority.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  app: shared
  bound-paths: shared
  write-ceiling: shared
layoutPolicy:
  checks: [starci-validate]
route:
  nodeKinds: [implementation]
  phase: [implement, cross-cutting]
  intent: [knowledge, repair, rules, maintenance]
  prerequisites: [evidence challenging a rule]
  riskHints: [runtime-self-edit]
