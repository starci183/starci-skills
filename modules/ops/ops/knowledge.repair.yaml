# modules/ops/ops/knowledge.repair.yaml
# The operator contract is the authority; the trailing 'business:' block is analysis,
# inference marked where the contract does not state it literally.

id: knowledge.repair
goal:
  en: Repair one challenged canonical instruction/rule and affected references from concrete
    applicability evidence.
nodeKinds:
  - implementation
completionProfile: implementation
sideEffects:
  - exact authorized knowledge source/reference edits
  - scoped local commits when authorized
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap: report it and propose a separately selected scope op; do not
        create a target or invent its acceptance/graph here."
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: rule
    path: selected canonical knowledge file + affected references + applicable owner maintenance policy
      + original challenge evidence
    purpose:
      en: Read the actual rule identifier/case and its owner/callers, observed counterexamples and
        existing enforcement. Read relevant skill instructions fully if editing a skill.
  - id: matrix
    path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - state
      - blocker
      - completion.inputDigest
      - completion.evidence
      - completion.codeRefs
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic node prose. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: repository:<repo-id>/<write-ceiling>
    fields:
      - source files
      - tests
      - migration/assets/config only when selected
    content:
      en: Only exact owned paths in the approved code-scope, with smallest required caller/integration
        changes; record actual diff and commit mapping, not proposed changes as delivered.
  - id: evidence
    path: E/manifest.yaml + E/rule-review.md + E/validation.json + E/lineage.json + E/result.md
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: "Keep applicability findings, exact before/after authority paths, actual
        validator/citation/reference checks and origin-context retest when included.
        Operator-specific observed result in E/result.md: Record evidence-backed reason and
        canonical owner, preserving stable rule IDs and existing valid scope. A one-off preference
        is not universal law."
  - id: matrixHandoff
    path: E/job-result.json
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - target
      - rule
      - repo
      - profile
    writes: []
    action:
      en: Check whether the issue is existing enforcement failure, missing concept, wrong existing rule or
        duplicate concept using the actual maintenance policy of the selected owner. Choose one
        canonical owner before edits. Resolve the execution profile and actual tool availability
        before selecting instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - rule
      - repo
    writes:
      - source
    action:
      en: Make smallest scoped rule/gate/step repair with stable IDs, same-commit affected reference
        updates and no product-specific law. Update genuine callers/contracts together; do not patch
        consumers as hidden workaround.
  - reads:
      - rule
      - repo
    writes:
      - evidence
    action:
      en: Run actual relevant validation/citation/parity and behavioral regression checks. Generated
        documents use their owned generators; inspect changes rather than claiming textual shape
        proves sound guidance.
  - reads:
      - target
      - rule
      - repo
      - matrix
    writes:
      - node
      - evidence
      - matrixHandoff
    action:
      en: Commit owned change when authorized and report exact originating context needing re-evaluation.
        Do not automatically rerun its operation or claim visual correctness. When selected in a job
        matrix, produce E/job-result.json bound to the exact request, its output schema and every
        required criterion. This handoff is conditional and does not change standalone or named
        frontend response contracts.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly proposed, required
        assertions are covered, input bindings are current, and an honest not-run/fail cannot earn
        done.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository, and
        separately retain integration/tested mappings. Report uncommitted or no-change honestly.
  - id: knowledge
    requirement:
      en: Repair follows canonical ownership and actual rule-applicability evidence; affected references
        and applicable regressions validate.
blockers:
  - code: RULE_OWNER_UNKNOWN
    condition:
      en: Challenge cannot be grounded in a canonical owner/applicable case or needs wider authority.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# Business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "What is the smallest canonical repair to a challenged instruction or rule -
    and its affected references - grounded in applicability evidence?"
  whenNeeded:
    - When concrete evidence challenges a canonical knowledge file/rule or a skill instruction.
    - When a rule's references (indexes, dependents) must be kept consistent with the repaired text.
  whenNot:
    - Not for product behavior fixes - product defects route to their owning workflow.
    - A one-off preference is not universal law; a challenge without a canonical owner or applicable case is RULE_OWNER_UNKNOWN, not a rewrite.
  consumes:
    - Target; the challenged rule + its references + owner maintenance policy + original evidence; repo observations.
  produces:
    - Smallest scoped rule/reference edits; validation/citation/regression evidence; scoped commit when authorized.
  failureModes:
    - RULE_OWNER_UNKNOWN, DECLARED_DEPENDENCY_UNMET (declared blockers).
# ---------------------------------------------------------------------------
# route: resolver index.
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [implementation]
  phase: [implement, cross-cutting]
  intent: [knowledge, repair, rules, maintenance]
  prerequisites: ["evidence challenging a rule"]
  riskHints: [runtime-self-edit]
