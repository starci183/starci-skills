schema: starci/op@1
id: backend.scaffold
goal:
  en: Create one new backend source tree in the bound repository and prove its declared toolchain
    contract on the actual scaffold.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then gate.mjs the op loop runs before it stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml)."
      vi: "Số vòng SỬA rồi chạy lại gate.mjs của vòng lặp op trước khi dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml)."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits
  - new source tree creation inside the bound repository at the declared path
  - no commits of its own - the runtime commits a green settle as the workflow's checkpoint
  - toolchain install/build in the declared sandbox
  - no production deployment, no package publication, no external service registration
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    purpose:
      en: "The selected implementation record this scaffold realises: declared owners paths, refs into
        the settled design, proof demands and validator freshness. On a greenfield scaffold the
        record is absent — no workflow authors it before the first source tree exists."
  - id: baseline
    path: CONTEXT.md (fixed stack) + packages/hfs/templates (the files `hfs sync` generates) + packages/ (the shared presets)
    purpose:
      en: The NestJS stack every project uses and the toolchain the back end (`be/`) of a new app carries from its
        first commit (`hfs scaffold app` writes the root, `be/` and `fe/` at once) — configs that are thin calls into the @starci presets (tsconfig, prettier, jest, canon lint),
        and the files that cannot extend, which `hfs sync` generates from hfs.json - husky, the ci and e2e
        workflows, .gitignore, sonar-project.properties and .starciwork/.gitignore.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,data}/**/index.yaml
    purpose:
      en: The settled design for business-specific layout and the dependencies it owns (database, cache,
        vector store, auth) beyond the baseline health surface. A baseline-only scaffold reads none.
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr}/**/index.yaml
    purpose:
      en: Intent governs what the skeleton proves.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve the actual repository resource, checkout root, HEAD and dirty state. The target path may
        be empty or absent — that is the greenfield case.
  - id: conventions
    path: knowledge/patterns/be/* + knowledge/architecture-rules.yaml +
      knowledge/hfs/rules.yaml
    purpose:
      en: A scaffold that violates day-one rules creates refactor debt.
  - id: stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md +
      modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the new service is declared in .starcistacks, reconcile component identity, compose files
        and runbook location before writing the tree.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound profile. Capabilities are the intersection of actual
        tools, selected profile policy and op permissions.
  - id: op-loop
    path: knowledge/op-gate.yaml
    purpose:
      en: "The op loop's data: the file-kind to pattern-file map, the example app per side and the gate and digest schemas that read-digest.mjs and gate.mjs apply."
      vi: "Dữ liệu của vòng lặp op: bảng loại tệp sang tệp pattern, app ví dụ cho từng phía, và schema của cổng và bản tóm tắt đọc mà read-digest.mjs và gate.mjs dùng."
writes:
  - id: node
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    fields: [state, owners, evidence, blockedBy]
    content:
      en: The selected implementation scope record — created with its schema const when absent on a
        greenfield scaffold — carrying the realised source root, exact scaffolded paths and the
        evidence the checks produced. It is one leaf at impl/<repository>/<name>/ (id
        impl.<feature>.<repository>.<name>); no implementation record sits at impl/ or impl/<repository>/
        (starci validate suspects PLACE_TOO_SHALLOW, --strict refuses the id). Its proves names the
        br/fr/nfr records of its feature it realises; a baseline-only feature with none proves that
        feature's toolchain nfr record, which business.decide writes before the scaffold
        settles - never a parent implementation record standing in for a requirement.
  - id: source
    path: <app>/<declared-source-root>/**
    fields: [manifest, toolchainConfig, layout, skeleton, harness]
    content:
      en: "The new tree only: package manifest, toolchain configs (lint/typecheck/test/build), the
        declared directory layout, the minimal runnable skeleton (entrypoint + health surface) and
        its harness. Nothing outside the declared source root."
  - id: evidence
    path: evidence/**
    fields:
      - request
      - scope
      - criteria
      - status
      - outputs
      - observations
      - effects
      - evidenceRefs
      - codeRefs
      - remaining
      - recovery
    artifacts: [result.json, effects.json, verification.json, artifacts]
    content:
      en: The scaffold result, the effects it had, the verification it ran and the artifacts it produced
        for the selected backend scope.
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest: the touched files, their slot map from hfs explain, and every pattern and example file read with its sha256."
      vi: "Bản tóm tắt ĐỌC: các tệp sẽ sửa, bản đồ slot của chúng từ hfs explain, và mọi tệp pattern và ví dụ đã đọc kèm sha256."
  - id: gate-proof
    path: STARCI_JOB_SCRATCH/gate.json
    schema: starci/gate@1
    content:
      en: "The last round's gate report: exit, base, head, changed files, new and preexisting counts and every new finding."
      vi: "Báo cáo cổng của vòng cuối: exit, commit gốc, head, các tệp đã đổi, số lỗi mới và lỗi có sẵn, và từng lỗi mới."
steps:
  - reads: [op-loop]
    writes: [read-digest]
    action:
      en: "READ before coding (op loop, knowledge/op-gate.yaml): run node scripts/gates/read-digest.mjs --root <app> --touch <every file the slice will create or change> --out $STARCI_JOB_SCRATCH/read-digest.json and read exactly what it lists, nothing wider - the knowledge/patterns/{be|fe}/*.yaml of each touched file kind, the matching example files of examples/<app>/{fe,be} and the slot map hfs explain prints per path (slot, tier, allowed imports, rules). Code only after this read; a file the slice comes to touch later is added with --touch and read the same way."
      vi: "ĐỌC trước khi viết code (vòng lặp op, knowledge/op-gate.yaml): chạy node scripts/gates/read-digest.mjs --root <app> --touch <mọi tệp slice sẽ tạo hoặc sửa> --out $STARCI_JOB_SCRATCH/read-digest.json và đọc đúng những gì nó liệt kê, không rộng hơn - các tệp knowledge/patterns/{be|fe}/*.yaml của từng loại tệp sẽ sửa, các tệp ví dụ cùng slot trong examples/<app>/{fe,be} và bản đồ slot mà hfs explain in cho từng đường dẫn (slot, tầng, import được phép, luật). Chỉ viết code sau bước đọc này; tệp phát sinh về sau được thêm bằng --touch và đọc theo cùng cách."
  - reads:
      - target
      - baseline
      - architecture
      - business
    writes: [evidence]
    action:
      en: Resolve what the new source must be. The stack comes from CONTEXT.md and the toolchain from the
        repository baseline, so a baseline-only scaffold needs no design record. Business-specific
        layout, naming, ports, module boundaries and every wired dependency beyond the baseline health
        surface come from the settled flat design records, never from the scaffold agent; an undecided
        one is a named gap, not a choice. Read accepted requirements the new service must satisfy at
        skeleton level (entry points, health surface, declared acceptance ids).
  - reads:
      - repo
      - conventions
      - stacks
    writes: [evidence]
    action:
      en: Resolve the real checkout, confirm the declared source root is empty-or-absent, read the house
        lint/layout contracts the tree must satisfy, and reconcile any .starcistacks component that
        names this service. An unbound or unexpected-dirty repository is reported, never worked
        around. Read the house rules the new tree must conform to from its first commit — lint kits,
        layout contract, naming.
  - reads: [baseline, architecture, conventions]
    writes: [source]
    action:
      en: "Scaffold through hfs, never by hand. A new app comes from hfs scaffold app <name> --into <parent> (the published @starci/hfs at its canon pin): the app root - one package.json for both sides with every dependency at its canon pin (knowledge/hfs/canon-pins.yaml), the lockfile npm resolves, hfs.json of kind app, README, CI, .husky, scripts/, .starcistacks/ and .starciwork/ - and the be/ side with its managed configuration and first source tree. An existing app gains or refreshes its managed files only through hfs sync --write at the app root, and hfs check must report no managed-file finding; a generated file is never hand-written or edited, a dependency is never added to a side's own package.json (the app root holds the one manifest), and a value or a skeleton file hfs does not write is a named gap in the scaffold evidence, never an improvised choice. The first be/ source tree is the scaffold's own: per api app the entrypoint that reads the environment once, AppModule.register(options) and its one error filter; platform/config (the only reader of the environment), platform/clock, platform/composition, platform/cqrs, platform/logging and platform/errors; the domain/liveness capability with its service and the service's unit spec; and the system-health feature answering GET /health/live, plus any health the settled records add. No behaviour beyond what the skeleton proves."
      vi: "Dựng qua hfs, không bao giờ bằng tay. App mới đến từ hfs scaffold app <name> --into <thư mục cha> (@starci/hfs đã publish theo canon pin): gốc app - một package.json cho cả hai phía với mọi phụ thuộc theo canon pin (knowledge/hfs/canon-pins.yaml), lockfile do npm phân giải, hfs.json loại app, README, CI, .husky, scripts/, .starcistacks/ và .starciwork/ - cùng phía be/ với cấu hình được quản lý và cây mã đầu tiên. App đã có chỉ thêm hoặc làm mới các tệp được quản lý qua hfs sync --write ở gốc app, và hfs check không được báo lỗi tệp quản lý nào; tệp sinh ra không bao giờ được viết hay sửa tay, không bao giờ thêm phụ thuộc vào package.json riêng của một phía (gốc app giữ manifest duy nhất), và giá trị hay tệp khung mà hfs không viết là khoảng trống được nêu trong bằng chứng scaffold, không bao giờ là lựa chọn tự chế. Cây mã be/ đầu tiên là của chính scaffold: với mỗi app api là entrypoint đọc môi trường một lần, AppModule.register(options) và một error filter; platform/config (nơi duy nhất đọc môi trường), platform/clock, platform/composition, platform/cqrs, platform/logging và platform/errors; capability domain/liveness với service và unit spec của service; và feature system-health trả lời GET /health/live, cùng mọi health mà các bản ghi đã chốt thêm vào. Không có hành vi nào ngoài những gì khung chứng minh."
  - reads:
      - repo
    writes: [source, evidence]
    action:
      en: Install, build, lint and test for real in the declared sandbox. The scaffold's own checks
        (the op loop's gate.mjs over the new tree) run before evidence is written.
  - reads:
      - target
    writes: [node, evidence]
    action:
      en: Record the realised source root and owned paths on the record, then return the evidence bundle —
        exact files created, commands run, observed outputs, remaining gaps. For a greenfield target,
        absence of the record is expected; inspect the nearest existing ancestor/workspace, then
        create only that selected implementation scope record and nothing beyond it.
  - reads: [op-loop]
    writes: [gate-proof]
    action:
      en: "FORCE THE CHECKS after coding: run node scripts/gates/gate.mjs --root <app> --changed <the files the slice changed> [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the new findings (lint per file and rule, tsc per message, failing specs - a finding the base already has never counts); exit 2 means a tool could not run and is never green. Still red after the last round: report blocked with the exact findings of that gate.json. Never report done while the gate is red or could not run. REPORT with gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA sau khi viết code: chạy node scripts/gates/gate.mjs --root <app> --changed <các tệp slice đã đổi> [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi mới (lint theo tệp và luật, tsc theo thông điệp, spec thất bại - lỗi đã có trên commit gốc không bao giờ bị tính); exit 2 là một công cụ không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi trong gate.json đó. Không bao giờ báo done khi cổng đỏ hoặc không chạy được. BÁO CÁO kèm gate.json và read-digest.json."
proofs:
  - id: scaffold-runs
    requirement:
      en: The declared toolchain commands (install/build/test) were executed against the new tree and
        their real output is recorded — a written tree that was never run is not a scaffold.
  - id: layout-conforms
    requirement:
      en: The new tree passes the house checks that apply to it — hfs lint and tsc through gate.mjs — from
        its first commit.
  - id: baseline-runs
    requirement:
      en: The repository baseline for the nest profile is present and executes — a staged change makes the
        pre-commit hook run eslint and prettier on the staged files, the pre-push hook runs typecheck and affected tests, and
        .github/workflows/ci.yml parses and names the lint, typecheck, test and build gates. The
        observed hook and CI output is recorded.
  - id: services-declared
    requirement:
      en: "The ci.yml and sonar-project.properties the baseline writes take the Sonar project key and host and the CI secret/variable names from the services block of the app's stack declaration (.starcistacks at the app root), and node scripts/gates/starcistacks.mjs <app> --new reports no refusal. When that declaration is outside this op's owned paths, the check runs without --new and its STACKS_SERVICES_MISSING / STACKS_DECLARATION_MISSING suspects are reported with the follow-up it names (workspace.manage mode stacks) - never an owner ask."
      vi: "ci.yml và sonar-project.properties mà baseline viết lấy khóa dự án và host Sonar cùng tên secret/biến của CI từ khối services của khai báo stack của app (.starcistacks ở gốc app), và node scripts/gates/starcistacks.mjs <app> --new không báo từ chối nào. Khi khai báo đó nằm ngoài các đường dẫn op sở hữu, lệnh kiểm tra chạy không có --new và các nghi vấn STACKS_SERVICES_MISSING / STACKS_DECLARATION_MISSING của nó được báo kèm việc tiếp theo nó nêu (workspace.manage chế độ stacks) - không bao giờ hỏi chủ sở hữu."
    check: scripts/gates/starcistacks.mjs
  - id: scope
    requirement:
      en: Every created file lives under the declared source root; nothing outside it was written.
  - id: op-gate
    requirement:
      en: "api settle re-reads the attached gate.json (exit 0 over the slice's changed files) and read-digest.json (a pattern file named for every touched file kind) and records the runtime check op-gate; a done without them, with a tool that could not run or with a new finding is refused, and the Kernel re-runs the same gate on the branch at landing."
      vi: "api settle tự đọc lại gate.json đính kèm (exit 0 trên các tệp slice đã đổi) và read-digest.json (có tệp pattern cho mọi loại tệp đã sửa) rồi ghi check op-gate; done thiếu chúng, có công cụ không chạy được hoặc có lỗi mới đều bị từ chối, và Kernel chạy lại đúng cổng đó trên nhánh khi land."
blockers:
  - code: SDS_MISSING
    condition:
      en: The scaffold is asked to wire SDS-owned dependencies (database, cache, vector store, auth) or
        business-specific layout beyond the baseline health surface, and no settled architecture
        names them.
  - code: REPO_UNBOUND
    condition:
      en: No bound repository checkout exists to receive the new tree.
  - code: TOOLCHAIN_UNAVAILABLE
    condition:
      en: The declared toolchain cannot install or run in the available environment.
  - code: OUTSIDE_SCOPE
    condition:
      en: The required tree would write outside the declared source root or conflict with retained work.
placeholders:
  feature: Feature folder of the intake or migration, inside the operation allowlist
  repository: Implementation repository segment under impl/
  name: Implementation record folder
  app: The bound app checkout (its root); every path written <app>/<path> is app-relative - be/..., fe/..., .starciwork/... or a path of the app root
  bound-paths: Inspected relevant source read set
  declared-source-root: The exact path the record/design declares for the new tree
layoutPolicy:
  checks: [starci-validate, starci-starcistacks-check]
policy:
  cutSetAuthority:
    scope: backend.scaffold-cut-sets
    appliesWhen: The dispatch packet carries context.cut {id, ordinal, total} with total >= 2, every cut
      job uses this same approved backend.scaffold leg and goal binding, and the complete pairwise-disjoint path
      union (shared root config - package.json, lockfile, tsconfig, eslint config, hfs.json -
      in exactly one ordinal, normally the seam) was preflighted before the first slice launched.
    permits: "A repository-wide gate (install, typecheck, lint:check, hfs lint, test, build)
      may remain nonzero after a NON-FINAL ordinal only for findings whose paths belong exclusively to
      not-yet-passed sibling ordinals of the same cut set. The current slice must pass the same gates
      scoped to its own owned paths, recorded as check cut-slice-postcondition; the full gate commands
      and their finding inventory stay unchanged except for sibling-owned paths, recorded as
      cut-regression-inventory; a finding a passed ordinal resolved may not reappear. The raw nonzero
      full result is integration evidence, not the slice's red verdict. The pass that CLOSES the set -
      the last ordinal to settle, whichever it is, not the highest (inc-751dd1ac4492) - must record
      full-regression-final green from the unchanged full gates over the whole set before the leg advances."
    forbids:
      - declaring a non-final slice done without the scoped gates on its own paths
      - accepting a full-gate finding on a path this slice or a passed ordinal owns
      - advancing the leg before the pass that closes the set records full-regression-final green
route:
  nodeKinds: [implementation]
  phase: [implement]
  intent: [scaffold, greenfield, new-source, backend, bootstrap, init]
  prerequisites:
    - repository bound
    - a settled SDS only when wiring SDS-owned dependencies or business layout beyond the baseline health surface
  riskHints: [source-edits, new-tree]
