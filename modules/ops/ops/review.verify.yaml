      - reads: [request, scanner, subjects]
        writes: [evidence]
        action:
          en: Run starci check-stales --work WORK --repo ID=ROOT with the actual canonical Work root, explicit repository bindings and optional --target IDs for the selected closure. Capture stdout JSON and exit code. Do not replace execution with a model-written report, auto-refresh a baseline, translate unavailable input into clean, or rewrite completion hashes. Nonzero means findings or a scanner/input failure, not permission to repair. Bind every proposed repair to its actual owner and an existing effect grant; never auto-dispatch it. After a separately authorized repair an independent review operation runs the same script against current inputs and verifies the implementation's required tests. Script cleanliness alone does not complete product behavior or semantic review.
    proofs:
      - id: executed-scanner
        requirement:
          en: The report comes from an actual script execution on the stated roots and immutable baseline, with original JSON and exit code retained; all requested targets and unavailable coverage are accounted for.
      - id: acceptance-boundary
        requirement:
          en: Completing an audit means findings were measured and reported. A workflow freshness gate passes only when the script's exit code is zero and its required coverage is complete; unresolved findings block affected delivery.
    blockers:
      - code: SCANNER_UNAVAILABLE
        condition:
          en: The declared script or runtime cannot execute; report unavailable instead of claiming clean.
      - code: INPUT_UNVERIFIABLE
        condition:
          en: A required repository, baseline, source identity, Work link or evidence artifact cannot be verified.
      - code: SOURCE_CHANGED
        condition:
          en: Inputs change during the scan; retain the failed observation and rerun at a stable checkpoint.
