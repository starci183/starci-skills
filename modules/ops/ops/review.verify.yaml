        purpose:
          en: Read the applicable FE/BE responsibility boundaries and static-check limits for mono or separate repositories, accepted Work ownership and selected Docker/native stack declarations.
      - id: inputs
        path: actual repository tsconfig and package exports + canonical Work + selected rendered stack model
        purpose:
          en: Resolve actual projects and TypeScript, declared aliases, source bindings and stack model. No missing project, compiler, root, profile or artifact may silently produce a green report.
    writes:
      - id: evidence
        path: E/lint-reports.json + E/lint-commands.json
        fields: [commands, exitCodes, runtimeDigest, inputBindings, reports, coverage, limitations]
        content:
          en: Store the actual selected checker outputs and identities in the attempt bundle, preserving violations and unknown coverage without editing inspected inputs.
    steps:
      - reads: [request, policy, inputs]
        writes: [evidence]
        action:
          en: Execute starci code-patterns check --profile nest or next --root ROOT --all for every selected FE/BE source repository with the actual project bindings. This aggregate runs required architecture and adopted code-pattern machines with exact rule/file coverage; a repository's package lint cannot substitute for it. Execute starci validate for selected canonical Work and starci stacks check for selected materialized stack profiles. Inspect each repository's real package scripts and run its additional required non-mutating lint/typecheck commands; a script that auto-fixes source is not a checking command. Use --architecture-config with the documented explicit layout configuration when inference is insufficient. Capture each original report and exit code. Do not run fix flags, hide files, lower rules or replace machine output with prose. An unavailable required checker or unresolved target fails the gate. Route measured findings to separately authorized owners; static pass never proves runtime dependency injection, live startup, browser UAT or business correctness.
    proofs:
      - id: executed-checks
        requirement:
          en: Every requested static check actually executes with declared coverage. A read-only lint measurement may complete with typed violations retained as findings; a delivery/static-conformance gate passes only when every required exit code is zero. Missing, malformed or unavailable inputs fail the audit and never become findings or clean coverage.
      - id: bounded-meaning
        requirement:
          en: The result explicitly separates static architecture/metadata conformance from runtime, behavioral and deployment proof. It grants no source repair or product completion authority.
    blockers:
      - code: CHECK_UNAVAILABLE
        condition:
          en: Required compiler, script, project config, Work binding or rendered model is absent or invalid.
      - code: STATIC_VIOLATION
        condition:
          en: A required checker reports a violation; retain its file, location and rule identifier for the owning repair.
      - code: SOURCE_CHANGED
        condition:
          en: Selected inputs changed during measurement and results no longer bind one coherent checkpoint.
    placeholders: {}
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# Business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "Does the selected delivered/business/workflow/visual/API/static-check
    result independently hold up - reviewed against its own evidence, without
    repairing its producer?"
  whenNeeded:
    - Independent review after delivery - exactly one mode per run: delivery (gate evidence), business (AC reconciliation), workflow (peer portfolio), visual (rendered screens), api (served contract), stales (freshness scan), lint (static checks).
    - When acceptance needs a reviewer who is not the producer.
  whenNot:
    - A union of modes never grants extra checks - one mode per run.
    - Never reruns the producer's gates as a substitute for reviewing their evidence (delivery mode).
    - Never repairs findings - findings route to their owning op; a static pass is not runtime or behavior proof.
  consumes:
    - The mode selection; target; evidence bundles; repo; per-mode environment/identity/fixture/design resources.
  produces:
    - Per-mode evidence: gates / reconciliation / portfolio-review / screenshots+measurements / api-result / stales-report / lint-reports; findings routed to owners; node completion.
  failureModes:
    - OPERATION_REQUIRED plus per-mode blockers: GATE_UNAVAILABLE/SOURCE_CHANGED, DELIVERY_UNPROVEN, PEER_PROOF_MISSING, CAPTURE_UNAVAILABLE/IDENTITY_UNPROVEN, SUITE_MISSING/NAMESPACE_CONFLICT, SCANNER_UNAVAILABLE/INPUT_UNVERIFIABLE, CHECK_UNAVAILABLE/STATIC_VIOLATION; DECLARED_DEPENDENCY_UNMET.
# ---------------------------------------------------------------------------
# route: resolver index.
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [operations]
  phase: [verify, post-implementation]
  intent: [review, verify, audit, delivery]
  prerequisites: ["a delivery to inspect"]
