# modules/ops/ops/review.verify.yaml
# The operator contract is the authority; the trailing 'business:' block is analysis,
# inference marked where the contract does not state it literally.

id: review.verify
goal:
  en: Independently verify a selected delivery, business, workflow, rendered visual or API result
    without repairing its producer.
nodeKinds:
  - operations
completionProfile: operations
sideEffects:
  - Only the selected operation contract permits effects; no union of mode permissions.
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: application-stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md + docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
        load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
        credential custody, lifecycle commands and existing consumers. Run the static stacks
        check when validating a materialized stack; bind its exact inputs and limitations.
        Acceptance additionally requires the selected real startup, persistence, recovery and
        application checks. This conditional read grants no extra deployment or source scope.
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        For an explicitly new target, absence is expected: inspect the nearest existing
        ancestor/workspace, then create only that selected scope. Preserve unaffected accepted
        content."
  - id: selection
    path: selected request operation + exact mode contract in this operator JSON
    purpose:
      en: Select exactly one named operation, its target, scope and criteria before any effect. No mode
        default or automatic chain.
  - id: matrix
    path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields:
      - completion.inputDigest
      - completion.evidence
    content:
      en: Bind only the selected mode completion profile and its actual evidence.
  - id: evidence
    path: E/manifest.yaml + E/result.json
    fields:
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
      - provenance
      - codeRefs
      - extensions
    content:
      en: Record operation, exact scope, criteria, output artifact references, observed effects and
        unresolved findings.
  - id: matrixHandoff
    path: E/job-result.json
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - application-stacks
      - target
      - selection
      - profile
    writes: []
    action:
      en: Resolve the exact named operation and load only its contract. Its reads/writes, effect ceiling
        and completion profile replace this selector envelope; the union of modes never grants
        authority. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - target
      - selection
      - matrix
    writes:
      - node
      - evidence
      - matrixHandoff
    action:
      en: Execute the selected mode procedure through its actual postconditions. Return operation, scope,
        per-criterion results and real output refs; no other mode, source repair or successor is
        implied. When selected in a job matrix, produce E/job-result.json bound to the exact
        request, its output schema and every required criterion. This handoff is conditional and
        does not change standalone or named frontend response contracts.
proofs:
  - id: mode-result
    requirement:
      en: Exactly the selected mode contract and all requested criteria pass with real evidence before
        delivery.
blockers:
  - code: OPERATION_REQUIRED
    condition:
      en: Missing, unknown or multiple operations; select a single mode under existing task authority.
placeholders:
  feature: Selected feature slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
  gate: Declared repository gate ID
modePolicy:
  selection: required-exactly-one
  implicitChain: false
  permissionUnion: false
  completion: selected-mode-profile
executionModes:
  delivery:
    id: review.verify
    goal:
      en: Review implementation quality evidence bound to the exact delivered revision without rerunning
        or repairing its gates.
    nodeKinds:
      - operations
    completionProfile: operations
    sideEffects: []
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: done
      dispatch: never
    reads:
      - id: application-stacks
        path: knowledge/application-stacks.yaml + docs/application-stacks.md + docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
        purpose:
          en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
            load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
            credential custody, lifecycle commands and existing consumers. Run the static stacks
            check when validating a materialized stack; bind its exact inputs and limitations.
            Acceptance additionally requires the selected real startup, persistence, recovery and
            application checks. This conditional read grants no extra deployment or source scope.
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
            and validator freshness. This consumer op requires its target node to exist. An absent
            target is a scope/graph gap: report it and propose a separately selected scope op; do
            not create a target or invent its acceptance/graph here."
      - id: repo
        path: repository:<repo-id>/<bound-paths>
        purpose:
          en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
            state; read applicable instructions, manifests, owning code, callers and relevant tests.
            Greenfield/spec-only work records source not-yet-created and grounds intent in the user
            request; no invented repository or fact citation. Source implementation still needs an
            actual selected writable repository.
      - id: gates
        path: actual repository scripts/config + selected gate criteria
        purpose:
          en: Read actual commands, thresholds, test scopes and applicable product-change proof. Explicit task
            scope may authorize normal tests; do not impose a new blanket E2E approval. Shared
            destructive tests still need scoped authority.
      - id: matrix
        path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
            input bindings, requested output JSON shapes and required criteria. Standalone execution
            needs no fabricated matrix request. A template is not authority for extra effects.
      - id: profile
        path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
        purpose:
          en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
            profiles. Use current host model configuration; historical model names are not
            availability proof. Capabilities are the intersection of actual tools, selected profile
            policy, op permissions and existing task authority.
    writes:
      - id: node
        path: N/index.yaml
        fields:
          - state
          - blocker
          - completion.inputDigest
          - completion.evidence
        content:
          en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
            only state/blocker/completion here; actual observations, findings, commit mappings and
            remaining cleanup belong to the evidence result, not semantic node prose. Missing
            refs/dependencies/acceptance require a reported gap or separately selected scope update;
            never add/remove them to obtain pass.
      - id: evidence
        path: E/manifest.yaml + E/gates/<gate>.json + E/logs/<gate>.txt + E/coverage.json + E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: Record review findings and references to the actual implementation-produced gate evidence. No
            new runner execution is claimed.
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - application-stacks
          - target
          - repo
          - gates
          - matrix
          - profile
        writes:
          - node
          - evidence
          - matrixHandoff
        action:
          en: Read the exact delivered source/build and producer evidence for lint, typecheck, tests/coverage,
            build and processed Sonar quality gate. Check command identity, real logs, required
            case/threshold coverage, full commit binding and freshness; verify evidence hashes and
            actual accessible results. Do not execute gates, repair code or accept scanner
            submission as Sonar pass. Missing, stale, skipped or failing proof returns a finding to
            the owning implement op. Record per-required-criterion pass/fail/not-run and evidence
            references; do not weaken acceptance or complete implementation for its owner. When
            selected in a job matrix, produce E/job-result.json bound to the exact request, its
            output schema and every required criterion. This handoff is conditional and does not
            change standalone or named frontend response contracts. Resolve the execution profile
            and actual tool availability before selecting instruments; this does not switch the
            model/runtime or spawn workers.
    proofs:
      - id: review-binding
        requirement:
          en: Every required gate observation belongs to the exact delivered revision; missing producer
            evidence prevents a passing review.
    blockers:
      - code: GATE_UNAVAILABLE
        condition:
          en: Required command/config/runtime cannot run as declared.
      - code: SOURCE_CHANGED
        condition:
          en: Source or configuration changed during measurements, making results incoherent.
      - code: DECLARED_DEPENDENCY_UNMET
        condition:
          en: A declared input is neither a current reviewed todo SRS/SDS seed nor an effectively done
            evidenced delivery node, or a required scope is missing. Report node/resource IDs and propose
            a separately selected graph update when needed; never weaken dependsOn/refs/required to proceed.
    placeholders:
      feature: Selected feature slug
      repo-id: Resolved repository resource ID
      bound-paths: Inspected source read set
      write-ceiling: Explicit owned source paths
      environment: Resolved environment resource slug
      identity: Selected actor resource slug
      fixture: Selected fixture resource slug
      resource: Selected owned resource slug
      asset: Actual selected source asset filename/format
      piece: Stable selected piece slug
      flow: Selected UAT journey slug
      screen: Selected surface/state slug
      gate: Declared repository gate ID
  business:
    id: review.verify
    goal:
      en: Reconcile the current SRS and SDS with delivered source, test/E2E and UAT evidence at one
        delivery revision without rewriting their semantic content.
    nodeKinds:
      - operations
    completionProfile: operations
    sideEffects: []
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: todo
      dispatch: never
    reads:
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
            and validator freshness. This consumer op requires its target node to exist. An absent
            target is a scope/graph gap: report it and propose a separately selected scope op; do
            not create a target or invent its acceptance/graph here."
      - id: business
        path: .starciwork/features/<feature>/{fr,nfr,br,decision,data,journey}/**/index.yaml
        purpose:
          en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
            inputs in the selected .starciwork graph. Intent governs expected behavior; source is
            not a replacement. Do not invent a mandatory BA predecessor for a scope that does not
            require one; a needed missing input is a reported graph/scope gap, not a new dependency
            silently added here.
      - id: architecture
        path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
        purpose:
          en: Read the current reviewed SDS seed and exact SRS mappings for the selected delivery slice.
            Architecture remains todo until this reconciliation proves the same current source and runtime
            revision; source cannot silently replace its logical contracts.
      - id: repo
        path: repository:<repo-id>/<bound-paths>
        purpose:
          en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
            state; read applicable instructions, manifests, owning code, callers and relevant tests.
            Greenfield/spec-only work records source not-yet-created and grounds intent in the user
            request; no invented repository or fact citation. Source implementation still needs an
            actual selected writable repository.
      - id: proofs
        path: selected SRS/SDS/implementation/test/E2E/UAT nodes and original evidence bundles
        purpose:
          en: Read original assets, assertion observations, input digests, source identity/commit lineage,
            test and E2E results, served runtime revision and UAT captures. Every required layer must bind
            the same current delivery revision; chat summaries are navigation hints, not acceptance proof.
      - id: matrix
        path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
            input bindings, requested output JSON shapes and required criteria. Standalone execution
            needs no fabricated matrix request. A template is not authority for extra effects.
      - id: profile
        path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
        purpose:
          en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
            profiles. Use current host model configuration; historical model names are not
            availability proof. Capabilities are the intersection of actual tools, selected profile
            policy, op permissions and existing task authority.
    writes:
      - id: node
        path: selected requirement/design/implementation/test/E2E/UAT index.yaml records
        fields:
          - state
          - evidence
          - blockedBy
        content:
          en: Read semantic content unchanged and write only state/evidence/blockedBy. Author
            state done only on the selected required records after one current reconciliation manifest binds
            every requirement, design, implementation, test/E2E and UAT proof demand to the same delivery revision.
            Otherwise keep affected records todo, record blockedBy where applicable and return partial or
            blocked. Findings, commit mappings and remaining cleanup belong to evidence, never rewritten
            record prose.
      - id: evidence
        path: E/manifest.yaml + E/reconciliation.json + E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - bindings:[nodeId,inputDigest]
          - outcome
          - assertions
          - assets
          - provenance
          - sourceIdentity
          - codeRefs
          - extensions
        content:
          en: "Record requirement IDs, source/evidence refs, actual verification and discrepancy list;
            preserve deferred and untested work explicitly. Operator-specific observed result in
            E/result.md: For each AC list expected, enforcing source, proving evidence, actual,
            freshness and gap owner; no business done/implemented flag is copied over an incomplete
            tree. The manifest's primary nodeId/inputDigest plus bindings[] cover every selected leaf,
            and sourceIdentity binds the exact tested commits/build represented by the reconciliation."
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - target
          - business
          - architecture
          - proofs
          - repo
          - profile
        writes: []
        action:
          en: Resolve original requirement/evidence versions and delivered repository commits; reject
            stale/missing refs before claiming enforcement. Resolve the execution profile and actual
            tool availability before selecting instruments; this does not switch the model/runtime
            or spawn workers.
      - reads:
          - business
          - architecture
          - repo
          - proofs
        writes:
          - evidence
        action:
          en: Compare each required business dimension and mapped design contract to delivered code and
            independent observations, including denial and persistence where required. Existing tests
            proving another behavior do not close this AC. Reject mixed input digests, commits, served
            builds or revisions even when each isolated result is green.
      - reads:
          - business
          - architecture
          - proofs
          - target
        writes:
          - node
          - evidence
        action:
          en: Record pass, discrepancy, stale and unproven rows plus named owners. Keep each layer's
            evidence distinct while binding the shared reconciliation revision. Never edit expected to
            match actual or waive missing scope without a real decision.
      - reads:
          - target
          - proofs
          - matrix
        writes:
          - node
          - evidence
          - matrixHandoff
        action:
          en: Validate all refs and the complete SRS-to-UAT evidence chain. Author done only when every
            required selected leaf is current and bound to the same revision; otherwise keep todo and
            report partial or blocked with the missing/stale layer named. Stop; proposing a next repair
            does not execute it. When selected in a job matrix, produce
            E/job-result.json bound to the exact request, its output schema and every required
            criterion. This handoff is conditional and does not change standalone or named frontend
            response contracts.
    proofs:
      - id: binding
        requirement:
          en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly proposed, required
            assertions are covered, input bindings are current, and an honest not-run/fail cannot
            earn done.
      - id: reconciliation
        requirement:
          en: Every selected required AC and SDS mapping is genuinely supported by current implementation,
            test/E2E and UAT evidence at the same delivery revision. Unresolved, stale, skipped or
            cross-revision rows remain visible, keep the leaves todo and cannot certify the parent complete.
    blockers:
      - code: DELIVERY_UNPROVEN
        condition:
          en: A required claim has no coherent code/evidence revision or contradicts observed behavior.
      - code: DELIVERY_CHAIN_INCOMPLETE
        condition:
          en: Any required SRS, SDS, implementation, test/E2E or UAT link is missing, stale, skipped,
            failing or bound to a different delivery revision; return partial or blocked and never done.
      - code: DECLARED_DEPENDENCY_UNMET
        condition:
          en: A declared input is neither a current reviewed todo SRS/SDS seed nor an effectively done
            evidenced delivery node, or a required scope is missing. Report node/resource IDs and propose
            a separately selected graph update when needed; never weaken dependsOn/refs/required to proceed.
    placeholders:
      feature: Selected feature slug
      repo-id: Resolved repository resource ID
      bound-paths: Inspected source read set
      write-ceiling: Explicit owned source paths
      environment: Resolved environment resource slug
      identity: Selected actor resource slug
      fixture: Selected fixture resource slug
      resource: Selected owned resource slug
      asset: Actual selected source asset filename/format
      piece: Stable selected piece slug
      flow: Selected UAT journey slug
      screen: Selected surface/state slug
  workflow:
    id: review.verify
    goal:
      en: Inspect selected peer/piece outcomes against one task purpose without running or changing their
        work.
    nodeKinds:
      - operations
    completionProfile: operations
    sideEffects: []
    graphPolicy:
      mode: read-only
      location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
      prerequisiteState: done
      dispatch: never
    reads:
      - id: target
        path: N/index.yaml
        purpose:
          en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
            and validator freshness. This consumer op requires its target node to exist. An absent
            target is a scope/graph gap: report it and propose a separately selected scope op; do
            not create a target or invent its acceptance/graph here."
      - id: assignments
        path: actual selected task/piece assignments + original node IDs
        purpose:
          en: Read the explicitly selected peer set, exact goals, owned write scopes and delivered result
            locations. Do not infer another task identity from a title or send a self-message as
            peer delivery.
      - id: repo
        path: repository:<repo-id>/<bound-paths>
        purpose:
          en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
            state; read applicable instructions, manifests, owning code, callers and relevant tests.
            Greenfield/spec-only work records source not-yet-created and grounds intent in the user
            request; no invented repository or fact citation. Source implementation still needs an
            actual selected writable repository.
      - id: proofs
        path: selected peers original .starciwork nodes and evidence
        purpose:
          en: Read original current requirement/code/evidence, not a summarized pass. Task messages may locate
            proof but cannot replace it.
      - id: deliveryChain
        path: selected final SRS/SDS/code/test-E2E/UAT reconciliation evidence
        purpose:
          en: For a product-delivery workflow, read the final reconciliation manifest and verify every
            required layer binds the same current delivery revision. A collection of individually green
            peer reports is not a complete delivery chain.
      - id: matrix
        path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
        purpose:
          en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
            input bindings, requested output JSON shapes and required criteria. Standalone execution
            needs no fabricated matrix request. A template is not authority for extra effects.
      - id: profile
        path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
        purpose:
          en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
            profiles. Use current host model configuration; historical model names are not
            availability proof. Capabilities are the intersection of actual tools, selected profile
            policy, op permissions and existing task authority.
    writes:
      - id: node
        path: N/index.yaml
        fields:
          - state
          - blocker
          - completion.inputDigest
          - completion.evidence
        content:
          en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
            only state/blocker/completion here; actual observations, findings, commit mappings and
            remaining cleanup belong to the evidence result, not semantic node prose. Missing
            refs/dependencies/acceptance require a reported gap or separately selected scope update;
            never add/remove them to obtain pass.
      - id: evidence
        path: E/manifest.yaml + E/portfolio-review.json + E/result.md
        fields:
          - id
          - nodeId
          - inputDigest
          - outcome
          - assertions
          - assets
          - provenance
          - codeRefs
          - extensions
        content:
          en: "Retain source/evidence identity checks and task-to-piece coverage; no invented delivery receipt
            or automatic follow-up message. Operator-specific observed result in E/result.md: Map
            task done-when to selected peer node IDs and actual repository delivery. Record missing
            peer proof, conflicting ownership and integration gaps without modifying their states."
      - id: matrixHandoff
        path: E/job-result.json
        fields:
          - requestId
          - requestDigest
          - op
          - operation when selected
          - status
          - criteria
          - outputs
          - artifacts
        content:
          en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
            cell output with actual canonical Work/source/runtime references or produced JSON
            artifacts from this job; retain real artifact bytes and hashes. Do not rename/regenerate
            upstream expectations. Missing required output/evidence remains blocked or failed and
            cannot advance. The selected request freezes output field schemas before execution.
    steps:
      - reads:
          - assignments
          - target
          - profile
        writes:
          - node
        action:
          en: Freeze the selected purpose/peer set for this review and resolve exact node and repository
            identities. A missing peer locator is unknown, not permission to search unrelated tasks.
            Resolve the execution profile and actual tool availability before selecting instruments;
            this does not switch the model/runtime or spawn workers.
      - reads:
          - proofs
          - deliveryChain
          - repo
          - assignments
        writes:
          - evidence
        action:
          en: Read each original outcome and actual delivered bytes/commit; compare every assigned goal line
            and required assertion with its proof. Verify integration lineage and current versions
            separately.
      - reads:
          - target
          - assignments
          - proofs
          - deliveryChain
          - matrix
        writes:
          - node
          - evidence
          - matrixHandoff
        action:
          en: Report aggregate scope coverage, absent/failed/stale evidence and cross-piece conflicts.
            A product-delivery workflow may pass only when its final reconciliation proves current SRS,
            SDS, code, test/E2E and UAT at one revision; otherwise report partial or blocked even if every
            scheduled peer job settled. Preserve peer states, source, runtimes and messages; finish without
            dispatching another op. When selected in a job matrix, produce E/job-result.json bound to the exact request,
            its output schema and every required criterion. This handoff is conditional and does not
            change standalone or named frontend response contracts.
    proofs:
      - id: binding
        requirement:
          en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly proposed, required
            assertions are covered, input bindings are current, and an honest not-run/fail cannot
            earn done.
      - id: portfolio
        requirement:
          en: Every claimed peer contribution has direct inspectable proof and purpose mapping; a green
            summary alone is rejected. Product-delivery completion additionally requires the current
            same-revision SRS/SDS/code/test-E2E/UAT reconciliation manifest.
    blockers:
      - code: PEER_PROOF_MISSING
        condition:
          en: Selected peer identity, original evidence or actual delivery revision cannot be resolved.
      - code: DELIVERY_CHAIN_INCOMPLETE
        condition:
          en: Final reconciliation is absent or any required SRS, SDS, code, test/E2E or UAT evidence is
            missing, stale, failing or bound to another revision.
      - code: DECLARED_DEPENDENCY_UNMET
        condition:
          en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
            Report node/resource IDs and propose a separately selected graph update when needed;
            never run predecessors or weaken dependsOn/refs/required to proceed.
    placeholders:
      feature: Selected feature slug
      repo-id: Resolved repository resource ID
      bound-paths: Inspected source read set
      write-ceiling: Explicit owned source paths
      environment: Resolved environment resource slug
      identity: Selected actor resource slug
      fixture: Selected fixture resource slug
