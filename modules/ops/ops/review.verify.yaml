      - id: scanner
        path: scripts/checks/check-stales.mjs + docs/source-staleness.md
        purpose:
          en: Read the installed script's supported arguments, report schema, exit codes and coverage limits. Use the same sealed runtime before and after a later authorized repair.
      - id: subjects
        path: bound canonical Work + repository source identities + declared stack and evidence bindings
        purpose:
          en: Read actual bytes, stable semantic links, covered source paths and source revisions. A stored done, changed commit, fresh hash or model assertion alone cannot establish current behavioral correctness.
    writes:
      - id: evidence
        path: E/stales-report.json + E/stales-command.json
        fields: [command, exitCode, runtimeDigest, inputBindings, report, coverage, limitations]
        content:
          en: Retain exact machine output, command arguments excluding credentials, exit code and runtime/input identities in the selected attempt bundle. No canonical completion, baseline or source write is authorized.
