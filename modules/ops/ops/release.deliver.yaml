schema: starci/op@1
id: release.deliver
goal:
  en: Deliver one explicitly selected publication, deployment or database migration and verify its
    exact remote outcome.
params:
  mode:
    type: enum
    enum: [select, publish, deploy, migrate]
    default: select
    setBy: kernel
    doc:
      en: The execution mode this dispatch runs; api dispatch binds that mode's reads into the input
        digests. select leaves the choice to the request.
nodeKinds: [operations]
completionProfile: operations
sideEffects:
  - Only the selected operation contract permits effects; no union of mode permissions.
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: application-stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md +
      docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
        load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
        credential custody, lifecycle commands and existing consumers. Run the static stacks check
        when validating a materialized stack; bind its exact inputs and limitations. Acceptance
        additionally requires the selected real startup, persistence, recovery and application
        checks. This conditional read grants no extra deployment or source scope.
  - id: target
    path: N/index.yaml
    purpose:
      en: Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        Preserve unaffected accepted content.
  - id: selection
    path: params.mode + the exact mode contract in this operator JSON
    purpose:
      en: params.mode names the one execution mode; select means the request names it. Select exactly one
        operation, its target, scope and criteria before any effect. No automatic chain.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields: [completion.inputDigest, completion.evidence]
    content:
      en: Bind only the selected mode completion profile and its actual evidence.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, result.json]
    content:
      en: Record operation, exact scope, criteria, output artifact references, observed effects and
        unresolved findings.
steps:
  - reads:
      - application-stacks
      - target
      - selection
      - profile
    writes: []
    action:
      en: "Resolve the exact named operation and load only its contract. Its reads/writes, effect ceiling
        and completion profile replace this selector envelope; the union of modes never grants
        authority. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers. For an explicitly new
        target, absence is expected: inspect the nearest existing ancestor/workspace, then create
        only that selected scope."
  - reads:
      - target
      - selection
    writes: [node, evidence]
    action:
      en: Execute the selected mode procedure through its actual postconditions. Return operation, scope,
        per-criterion results and real output refs; no other mode, source repair or successor is
        implied. This handoff is conditional and does not change standalone or named frontend
        response contracts.
proofs:
  - id: mode-result
    requirement:
      en: Exactly the selected mode contract and all requested criteria pass with real evidence before
        delivery.
blockers:
  - code: OPERATION_REQUIRED
    condition:
      en: Missing, unknown or multiple operations; select a single mode under existing task authority.
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  environment: Resolved environment label
  resource: Selected owned asset name
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  modePolicy:
    selection: required-exactly-one
    implicitChain: false
    permissionUnion: false
    completion: selected-mode-profile
  executionModes:
    publish:
      id: release.deliver
      goal:
        en: Publish only the explicitly selected verified Git commit/ref boundary and read it back.
      nodeKinds: [release]
      completionProfile: release
      sideEffects: [explicitly authorized local integration and/or non-force remote publication]
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: target
          path: N/index.yaml
          purpose:
            en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
              and validator freshness. This consumer op requires its target node to exist. An absent
              target is a scope/graph gap: report it and propose a separately selected scope op; do
              not create a target or invent its acceptance/graph here."
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
              state; read applicable instructions, manifests, owning code, callers and relevant
              tests. Greenfield/spec-only work records source not-yet-created and grounds intent in
              the user request; no invented repository or fact citation. Source implementation still
              needs an actual selected writable repository.
        - id: publication
          path: actual Git remote/ref policy + selected commits/evidence + explicit publish request
          purpose:
            en: Read target remote/ref, exact delivered full SHAs, changed-file scope, hooks and required
              checks. A local commit request is not push, tag, PR, merge or cleanup permission.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
              only state/blocker/completion here; actual observations, findings, commit mappings and
              remaining cleanup belong to the evidence result, not semantic node prose. Missing
              refs/dependencies/acceptance require a reported gap or separately selected scope
              update; never add/remove them to obtain pass.
        - id: evidence
          path: E/manifest.yaml + E/git-publication.json + E/hook-output.txt + E/lineage.json + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Record observed local/remote refs before/after, exact command/exit, verified diff/ancestry and
              checks at the actual integrated head. Operator-specific observed result in
              E/result.md: Record original, integrated and published full SHAs separately, target
              ref and actual publication result; no worktree cleanup implied."
      steps:
        - reads:
            - repo
            - publication
            - target
          writes: [node]
          action:
            en: Verify explicit selected remote/ref/action and full source commits; inspect dirty changes and
              staged scope without absorbing unrelated work. Verify implementation-produced quality
              evidence and the exact immutable revision/artifact before the selected release effect.
              Missing required gates block release; do not run or repair implementation checks here.
              Read back uncertain effects before retry and record partial outcomes and rollback
              status.
        - reads:
            - repo
            - publication
          writes: [evidence]
          action:
            en: Inspect current remote and local refs, branch policy and required checks/hooks. If integration
              is included, review exact diff/conflicts and retest the actual result; no
              amend/rebase/squash or force as a workaround.
        - reads:
            - publication
            - repo
          writes: [evidence]
          action:
            en: Perform only explicitly requested integration/publication action, non-force and with hooks
              preserved. Tag/PR actions occur only when named; rejected or uncertain effects require
              read-back before retry.
        - reads:
            - publication
            - repo
            - target
          writes: [node, evidence]
          action:
            en: Read target ref back and compare exact expected SHA, record true lineage and limits, then stop
              without deleting branch/worktree/evidence or stopping runtime.
      proofs:
        - id: binding
          requirement:
            en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
              proposed, required assertions are covered, input bindings are current, and an honest
              not-run/fail cannot earn done.
        - id: published-ref
          requirement:
            en: Actual remote/ref equals selected verified publication; failed hook/push or unresolved remote
              read-back is not success.
      blockers:
        - code: PUBLISH_NOT_AUTHORIZED
          condition:
            en: Requested scope does not authorize this remote/ref/tag/integration effect.
        - code: GIT_DIVERGED
          condition:
            en: Unexpected divergence, hook failure or dirty overlap prevents safe selected publication.
        - code: DECLARED_DEPENDENCY_UNMET
          condition:
            en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
              Report node/resource IDs and propose a separately selected graph update when needed;
              never run predecessors or weaken dependsOn/refs/required to proceed.
      placeholders:
        feature: Feature folder of the selected records, inside the operation allowlist
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        environment: Resolved environment resource slug
        resource: Selected owned resource slug
    deploy:
      id: release.deliver
      goal:
        en: Deploy one authorized immutable artifact to one target and verify actual steady state or
          explicit rollback outcome.
      nodeKinds: [release]
      completionProfile: release
      sideEffects: [exact selected deployment and explicitly bounded recovery/rollback]
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: Reconcile component ownership, encrypted credential custody, lifecycle commands and existing
              consumers. This conditional read grants no extra deployment or source scope.
        - id: target
          path: N/index.yaml
          purpose:
            en: This consumer op requires its target node to exist.
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: Source implementation still needs an actual selected writable repository.
        - id: environment
          path: .starciwork/_resources/environments/<environment>/resource.yaml
          purpose:
            en: Read exact target/origins, owner, configuration revision, declared probes and allowed effects;
              validate live observations without inferring identity from hostname alone.
        - id: release
          path: .starciwork/_resources/releases/<resource>/resource.yaml + selected quality/UAT/migration
            evidence
          purpose:
            en: Read immutable artifact digest, source mapping, configuration/schema compatibility, intended
              target/revision, required gates, deployment authority, previous safe digest and
              recovery limits. Quality pass is not deploy permission.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged.
        - id: resource
          path: .starciwork/_resources/releases/<resource>/resource.yaml
          fields:
            - schema
            - id
            - kind
            - owner
            - revision
            - details.artifact
            - details.sourceRefs
            - details.configurationRef
            - details.target
            - details.deploymentEvidence
          content:
            en: Keep immutable artifact identity and actual deployment evidence on the work/resource@1 record;
              do not retag/rebuild and call it the same release.
        - id: evidence
          path: E/manifest.yaml + E/deployment.json + E/probes.json + E/recovery.json + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Retain actual target generation/digest before/after, requested command/tool outcome, probe
              observations over declared stability interval and bounded recovery/rollback effects.
              Operator-specific observed result in E/result.md: Name actual deployed/restored
              identity and unresolved acceptance; rollback success is not delivery of the rejected
              release."
      steps:
        - reads:
            - application-stacks
            - target
            - release
            - environment
            - repo
          writes: [node]
          action:
            en: Verify explicit deploy authority, exact immutable artifact/source mapping and required current
              quality/UAT/schema admissions. Record approved deferrals without turning them into
              passes.
        - reads:
            - release
            - environment
          writes: [evidence]
          action:
            en: Inspect actual active release/target/config revisions, artifact availability and rollback
              viability; compare again immediately before mutation.
        - reads:
            - release
            - environment
          writes: [resource, evidence]
          action:
            en: Deploy exact artifact through available authorized provider mechanism. Do not modify
              DNS/host/credentials/schema unless those exact effects are included.
        - reads:
            - release
            - environment
          writes: [evidence]
          action:
            en: Observe declared useful health/readiness probes and active digest through a bounded stability
              interval. Detect concurrent target changes before any recovery; only authorized
              bounded same-release recovery/rollback can run.
        - reads:
            - release
            - target
          writes: [node, resource, evidence]
          action:
            en: Report deployed, failed, uncertain or restored identity accurately, keep partial effects and
              unmet probes, validate and stop. No source fixes, wider provisioning or release chain.
      proofs:
        - id: deployment
          requirement:
            en: Actual target runs intended immutable artifact and required probes hold for the declared window;
              a single green probe is not steady-state proof.
      blockers:
        - code: RELEASE_AUTHORITY_MISSING
          condition:
            en: Artifact/target/effect is not covered by explicit authority.
        - code: CONCURRENT_RELEASE
          condition:
            en: A foreign generation appeared during execution; do not roll it back.
        - code: STEADY_STATE_UNPROVEN
          condition:
            en: Required probes or exact served digest cannot be proved within the bounded window.
      placeholders:
        feature: Feature folder of the selected records, inside the operation allowlist
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        environment: Resolved environment resource slug
        resource: Selected owned resource slug
    migrate:
      id: release.deliver
      goal:
        en: Apply the explicitly selected source-owned migration set to one verified target and prove its
          migration-history/data outcome.
      nodeKinds: [release]
      completionProfile: release
      sideEffects:
        - exact authorized schema/data migration only; no automatic down/restore/deploy
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: Reconcile component ownership, encrypted credential custody, lifecycle commands and existing
              consumers. This conditional read grants no extra deployment or source scope.
        - id: target
          path: N/index.yaml
          purpose:
            en: This consumer op requires its target node to exist.
        - id: architecture
          path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
          purpose:
            en: Read data ownership, operations/API/events, boundaries, code-scope and rationale declared by the
              selected .starciwork graph; distinguish proposed paths from observed files. No
              universal architecture-first op chain is implied; report genuinely missing required
              scope before proceeding.
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: Source implementation still needs an actual selected writable repository.
        - id: migration
          path: selected source-owned migration files/runner/config + explicit target authority
          purpose:
            en: Read exact migration IDs/checksums, intended schema/data delta, source tests, backup/rollback
              constraints and migration-history inspection method. Creating/editing migration code
              is a separate implementation scope.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged.
        - id: evidence
          path: E/manifest.yaml + E/migrations-before.json + E/migrations-after.json + E/migration-output.txt
            + E/replay.json + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Keep migration checksums, actual runner/command, redacted output, before/after
              migration-history/data checks and safe no-op replay/inspect result; no credentials in
              logs. Operator-specific observed result in E/result.md: Pin exact target/schema/source
              migration identity and expected postconditions. Production mutation is allowed only by
              explicit scoped authority, never by completion of code tests."
      steps:
        - reads:
            - application-stacks
            - migration
            - architecture
            - repo
            - target
          writes: [node]
          action:
            en: Verify selected exact target/authority, source revision and migration set; inspect runner
              behavior and recovery constraints before any database effect.
        - reads:
            - migration
          writes: [evidence]
          action:
            en: Inspect current migration history/schema and backup/precondition evidence. Classify applied,
              safely pending, conflicting or partial/uncertain; never rerun a partial unknown effect
              blindly.
        - reads:
            - migration
            - repo
          writes: [evidence]
          action:
            en: Run only approved pending set through the actual reviewed source runner, or record inspected
              no-op. Preserve original migration-history rows and actual error output; no ad hoc SQL
              repair or automatic down migration.
        - reads:
            - migration
            - target
          writes: [node, evidence]
          action:
            en: Verify declared schema/data invariants and migration history after execution; perform safe
              supported no-op replay or inspect to prove no pending changes. Report
              irreversible/partial effects and stop without deploying.
      proofs:
        - id: migration
          requirement:
            en: Exact selected set applied/no-op with migration-history integrity and declared data invariants
              proved; successful process exit alone is insufficient.
      blockers:
        - code: MIGRATION_TARGET_UNKNOWN
          condition:
            en: Exact environment/schema/runner revision or mutation authority is missing.
        - code: MIGRATION_PARTIAL
          condition:
            en: Current migration-history/data or prior effect is partial, conflicting or uncertain; require
              owner recovery decision.
      dataCorrectionPolicy:
        scope: exact-authorized-records-or-source-owned-migration
        schemaInspection: required-before-mutation
        preMutationReadback: required
        postMutationReadback: required
        recovery: transaction-or-explicit-reviewed-recovery-plan
        arbitraryCode: false
        adHocSql: false
        unknownOrPartial: blocked
      placeholders:
        feature: Feature folder of the selected records, inside the operation allowlist
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        environment: Resolved environment resource slug
        resource: Selected owned resource slug
route:
  nodeKinds: [operations]
  phase: [release, post-implementation]
  intent: [release, publish, deploy, migrate]
  prerequisites: [implementation + verification evidence]
  riskHints: [external-effects, terminal, high-kind]
