schema: starci/op@1
id: scope.finish
goal:
  en: Finish exactly the selected business/resource scope - end-of-life - while preserving required
    evidence and live consumers.
nodeKinds: [operations]
completionProfile: operations
sideEffects: [explicit end-of-life metadata and separately authorized exact destructive actions only]
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        Preserve unaffected accepted content.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: inventory
    path: selected nodes/resources + incoming refs + actual Git worktree inventory
    purpose:
      en: Read selected end-of-life request, stable IDs, live incoming references, retention/custody
        requirements, tracked/dirty/untracked artifacts and exact worktree registrations. A folder
        called .worktrees is not evidence of disposable content.
  - id: authority
    path: explicit end-of-life/deletion scope + durable storage policy
    purpose:
      en: Read exact selected removals and recovery constraints; default finish is a scoped metadata
        decision, not recursive deletion.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
  - id: standard
    path: knowledge/op-gate.yaml + knowledge/** + <app>/hfs.json
    purpose:
      en: "The standard this op's decisions and records cite: knowledge/op-gate.yaml (proofs.read-knowledge), the knowledge files listed in its READ step and the hfs slot map of every record it writes (hfs explain at the app root). The files are read in place and recorded with their sha256 in the READ digest; nothing here is restated into a record."
      vi: "Chuẩn mà quyết định và bản ghi của op dẫn ra: knowledge/op-gate.yaml (proofs.read-knowledge), các tệp knowledge liệt kê ở bước ĐỌC và bản đồ slot hfs của mọi bản ghi op viết (hfs explain ở gốc app). Các tệp được đọc tại chỗ và ghi kèm sha256 vào bản tóm tắt ĐỌC; không chép lại vào bản ghi."
writes:
  - id: node
    path: N/index.yaml
    fields:
      - schema
      - state
      - blocker
      - completion.inputDigest
      - completion.evidence
      - dependsOn
      - refs
      - assertions
    content:
      en: "Write only the explicitly authorized end-of-life decision/scope on the selected record N
        before review - the scope entry that bounds it, a feature record's extensions.work3.scope or a
        catalog extensions.work3.setup entry (work-layout.yaml shape.setup); a root-level
        .starciwork/<name>/index.yaml record is outside the layout, never N.
        Preserve stable IDs and obligations. Actual removal/retention observations
        belong in evidence. Graph edits apply only to the explicitly selected approved scope:
        declare real prerequisite node IDs in dependsOn and semantic input node/resource IDs in
        refs. No catalogue-wide chain or new unrelated scope; finish all graph/spec changes before
        review proof."
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts:
      - manifest.yaml
      - finish-inventory.json
      - retention-check.json
      - removal.json only when selected
      - result.md
    content:
      en: "Record exact artifacts, ownership, safe destinations, verified hashes/readability and selected
        removal outcomes/recovery limitations; never copy secret plaintext. Operator-specific
        observed result in evidence/result.md: Record finished scope, actual decision authority,
        replacement IDs where applicable, consumer dispositions and retention/access policy.
        Preserve stable identities and do not relabel unfinished required work na without a real
        scope decision."
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest (read-digest.mjs --knowledge): every knowledge file the decision cites and the hfs slot of every record written, each with its sha256."
      vi: "Bản tóm tắt ĐỌC (read-digest.mjs --knowledge): mọi tệp knowledge mà quyết định dẫn ra và slot hfs của mọi bản ghi đã viết, kèm sha256 của từng tệp."
steps:
  - reads: [standard, target]
    writes: [read-digest]
    action:
      en: "READ the standard before deciding (knowledge/op-gate.yaml proofs.read-knowledge): run node scripts/gates/read-digest.mjs --root <app> --touch <every record this op will write> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/patterns/repo/folder.yaml knowledge/patterns/repo/starcistacks.yaml knowledge/hfs/slots.yaml --out $STARCI_JOB_SCRATCH/read-digest.json, and read what it records - the knowledge files in place and the hfs slot map of each record (slot, tier, rules). What the finish retires or retains is decided against the standard: the records that must stay as evidence (knowledge/patterns/repo/starciwork.yaml), the slots that own each resource and the stack declaration at the app root; a git worktree the inventory shows is never removed here - the runtime's scripts/machine/worktrees.mjs owns that lifecycle. A record the op comes to write later is added with --touch and read the same way; REPORT with read-digest.json attached."
      vi: "ĐỌC chuẩn trước khi quyết định (knowledge/op-gate.yaml proofs.read-knowledge): chạy node scripts/gates/read-digest.mjs --root <app> --touch <mọi bản ghi op sẽ viết> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/patterns/repo/folder.yaml knowledge/patterns/repo/starcistacks.yaml knowledge/hfs/slots.yaml --out $STARCI_JOB_SCRATCH/read-digest.json, rồi đọc những gì nó ghi - các tệp knowledge tại chỗ và bản đồ slot hfs của từng bản ghi (slot, tầng, luật). Những gì việc kết thúc gỡ bỏ hay giữ lại được quyết theo chuẩn: các bản ghi phải giữ làm bằng chứng (knowledge/patterns/repo/starciwork.yaml), slot sở hữu từng tài nguyên và khai báo stack ở gốc app; git worktree xuất hiện trong danh sách không bao giờ bị xóa ở đây - vòng đời đó thuộc scripts/machine/worktrees.mjs của runtime. Bản ghi phát sinh về sau được thêm bằng --touch và đọc theo cùng cách; BÁO CÁO kèm read-digest.json."
  - reads:
      - inventory
      - authority
      - repo
      - target
      - profile
    writes: [evidence]
    action:
      en: "Inventory exact selected nodes/resources, Git state, image/evidence/account custody references
        and all live consumers. Distinguish custom durable .worktrees artifacts from Git-managed
        checkouts. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers. For an explicitly new
        target, absence is expected: inspect the nearest existing ancestor/workspace, then create
        only that selected scope."
  - reads:
      - inventory
      - authority
    writes: [node]
    action:
      en: Resolve consumer preserve/replace/defer/finish dispositions and retention/recovery obligations.
        Missing decision or custody blocks deletion, not the read-only inventory.
  - reads:
      - inventory
      - authority
      - repo
    writes: [evidence]
    action:
      en: Verify required durable artifacts are retained and retrievable at approved destinations before
        any explicitly selected deletion. Resolve absolute targets, symlink/junction boundaries and
        worktree registration; never broad recursive delete a workspace/root.
  - reads:
      - inventory
      - authority
      - repo
    writes: [evidence]
    action:
      en: Execute only separately authorized exact end-of-life effects, preferring reversible operations;
        a worktree is retired only through scripts/machine/worktrees.mjs (removeWorktree or the GC), never git
        worktree remove or a recursive delete. Preserve uncommitted/untracked user work; uncertain
        ownership stops removal.
  - reads:
      - target
      - inventory
      - authority
    writes: [node, evidence]
    action:
      en: Validate surviving references/readability and report what was finished, actually removed,
        retained and recoverable. Stop; no opportunistic cleanup of adjacent work. This handoff is
        conditional and does not change standalone or named frontend response contracts.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: retention
    requirement:
      en: No required live consumer or sole evidence/custody copy is lost; exact selected effects and
        recovery status are observed.
  - id: read-knowledge
    requirement:
      en: "api settle re-reads the attached read-digest.json (runtime check op-proof, proof read-knowledge): a done whose digest is missing (op-read-digest-missing), names no knowledge file or leaves a written record without its hfs slot (op-read-digest-no-knowledge) is refused."
      vi: "api settle tự đọc lại read-digest.json đính kèm (check op-proof, proof read-knowledge): done thiếu bản tóm tắt (op-read-digest-missing), không nêu tệp knowledge nào hoặc có bản ghi đã viết thiếu slot hfs (op-read-digest-no-knowledge) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: FINISH_UNSAFE
    condition:
      en: Exact target, user ownership, consumer disposition or durable retention is unresolved.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  app: The bound app checkout (its root); every path written <app>/<path> is app-relative - be/..., fe/..., .starciwork/... or a path of the app root
  bound-paths: Inspected source read set
layoutPolicy:
  checks: [starci-validate]
route:
  nodeKinds: [operations]
  phase: [operate, post-implementation]
  intent: [finish, remove, scope, end-of-life]
  prerequisites: [the scope exists]
  riskHints: [destructive-gate]
