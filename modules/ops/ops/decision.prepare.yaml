schema: starci/op@1
id: decision.prepare
goal:
  en: "Prepare one decision the runtime takes provisionally - the question, why it matters, the
    options analysed per side, one recommendation - or answer the question from the records the
    product already decided. The runtime never decides for the owner: it carries the recommendation
    into the work and the owner overturns it later with workflow-answer. A provision (a credential,
    an account, a dataset, an authority) is not prepared here; that is provision.ask, the one
    operation that waits for the owner."
nodeKinds: [business]
completionProfile: business
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: question
    path: the operation goal (section 'Question for the owner') and the operation that asked it
    purpose:
      en: Read the question exactly as it was raised - by which operation, of which kind (business,
        design, authority, credential), what it blocks - before anything is written.
  - id: decided
    path: .starciwork/features/<feature>/**/index.yaml (done)
    purpose:
      en: Read every decided flat Work record the question touches - rules, requirements, data, decisions,
        design, contracts, integrations. A decided record that already settles the question is the
        answer, named by id; the owner is not asked twice.
  - id: environment
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: For a credential or configuration question, read where the code reads the value - the exact
        variable name - and which identity custody of this tree
        (.starciwork/_resources/identity/<slug>/) holds it.
writes:
  - id: decision
    path: .starciwork/features/<feature>/decision/<slug>/index.yaml
    fields:
      - schema
      - id
      - title
      - state
      - outcome
      - tension
      - question
      - options
      - recommendation
      - recommendationReason
      - change
    content:
      en: One work/policy-decision@1 record draft (id decision.<feature>.<slug>, state todo, outcome open,
        the shape of the existing policy decisions of the tree), carrying in order the question;
        tension, naming by id the decided records the question strains between and the statement of
        that strain; the options, each with an id, a summary and its consequence for the design, the
        rules, the security and authority, and what it costs; and exactly one recommendation with
        its reason. Real product-shaped content, no placeholder, no secret value. The options array
        contains at least two distinct concrete mutually exclusive policy outcomes in the exact
        presentation order before owner presentation. Questions beginning with Whether are agenda
        topics, not yes/no decisions. Repair an unprepared options array in this operation before
        requesting an answer.
steps:
  - reads:
      - question
      - decided
    writes: []
    action:
      en: "Try the decided records first. When one settles the question, report done with the first line
        of the summary exactly \"answered-from: <record id>\" followed by the answer in one
        paragraph, and write nothing. A question of business, design, authority, security, money or
        customer data is the owner's to answer; only a mechanical one is not."
  - reads:
      - question
      - decided
      - environment
    writes: [decision]
    action:
      en: Otherwise write the one policy-decision record draft with the question, the decided records it
        strains between named in tension.records, the numbered options analysed per side and one
        recommendation. A provision is not prepared here; that is provision.ask. Never the value
        itself.
  - reads:
      - question
    writes: []
    action:
      en: Print the question and its numbered options in this terminal and say that the owner may answer
        here with the number, or later with workflow-answer; do not wait - a decision is taken
        provisionally on the recommendation and the owner overturns it later.
  - reads:
      - question
    writes: []
    action:
      en: 'Run `starci validate` and report done exactly once: first line "decision: <record id>", then
        "recommended: <n>", then the options numbered as the owner will answer them. If the owner
        happened to answer here already, the first line is "answered-by-owner: <n>" instead.'
proofs:
  - id: decided-first
    requirement:
      en: A question a decided record settles is answered from that record, by id, and no record is
        written.
  - id: one-record
    requirement:
      en: Otherwise exactly one policy-decision record draft exists with the question, the tension records
        by id, the numbered options analysed per side and one recommendation, and the workspace
        validates. The explicit options array contains concrete selectable outcomes, not an agenda
        of topics.
  - id: asked-in-the-terminal
    requirement:
      en: The question and its numbered options were printed in this operation's own terminal, with both
        ways to answer them, before any report was sent.
  - id: no-secret
    requirement:
      en: No value of any credential or secret appears in the record, the report, the terminal or anywhere
        else; a credential is put into the tree's encrypted identity custody by the owner's own
        command and this operation verifies only that it is present.
blockers:
  - code: QUESTION_UNCLEAR
    condition:
      en: The question names no decidable choice and no record it touches; the operation that asked it is
        sent back to state it.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: The feature the question belongs to has no records to draft the decision under.
placeholders:
  feature: Selected feature slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  slug: Stable decision slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
route:
  nodeKinds: [business]
  phase: [decide, cross-cutting]
  intent: [decision, prepare, owner-question]
  prerequisites: [a decidable question raised by another op]
