schema: starci/op@1
id: business.decide
goal:
  en: Specify the selected business slice with the minimum complete observable behavior needed to
    implement and independently accept it, then refine that contract from authoritative feedback.
params:
  readingsStated:
    type: integer
    default: 3
    min: 2
    max: 5
    setBy: kernel
    doc:
      en: How many candidate readings a repair enumerates before choosing one.
nodeKinds: [business, business-overview]
completionProfile: business
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs and collocated assets
  prerequisiteState: done
  dispatch: never
  workGraph: revise
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: Read the current feature record and its flat spec records, refs, dependencies, proof demands and
        validator freshness. Preserve unaffected accepted content.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: intent
    path: current accepted user intent + supplied domain documents
    purpose:
      en: Classify each statement as intent, observed fact, example, proposal, unknown or contradiction,
        with source citation/revision. Existing behavior does not authorize a new rule.
  - id: specification
    path: modules/ops/ops/business.decide.yaml + modules/schemas/work-layout.yaml +
      modules/schemas/work-*.schema.yaml
    purpose:
      en: Read the record family contracts and this operator procedure before authoring the .starciwork
        payload.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
  - id: standard
    path: knowledge/op-gate.yaml + knowledge/** + <app>/hfs.json
    purpose:
      en: "The standard this op's decisions and records cite: knowledge/op-gate.yaml (proofs.read-knowledge), the knowledge files listed in its READ step and the hfs slot map of every record it writes (hfs explain at the app root). The files are read in place and recorded with their sha256 in the READ digest; nothing here is restated into a record."
      vi: "Chuẩn mà quyết định và bản ghi của op dẫn ra: knowledge/op-gate.yaml (proofs.read-knowledge), các tệp knowledge liệt kê ở bước ĐỌC và bản đồ slot hfs của mọi bản ghi op viết (hfs explain ở gốc app). Các tệp được đọc tại chỗ và ghi kèm sha256 vào bản tóm tắt ĐỌC; không chép lại vào bản ghi."
writes:
  - id: node
    path: .starciwork/features/<feature>/{index.yaml,fr/**/index.yaml,nfr/**/index.yaml,br/**/index.yaml,decision/**/index.yaml,data/**/index.yaml,journey/**/index.yaml}
    fields:
      - schema
      - id
      - title
      - state
      - blockedBy
      - refs
      - dependsOn
      - change
      - extensions.work3.decisionLog
      - extensions.work3.integrations
      - family payload
    content:
      en: Every authored index.yaml is a flat work/*@1 record at its family path under
        features/<feature>/, where <family> is one of fr, nfr, br, decision, data or journey. The
        feature's readable overview is features/<feature>/index.yaml (work/feature@1) carrying
        purpose, customer understanding, outcome, scope and open questions in title/description.
        Rewriting that overview keeps extensions.work3.scope exactly as scope.define wrote it, since the
        bounded scope belongs to scope.define, and this op reads it, never re-authors it.
        Author each requirement as work/functional-requirement@1 under fr/<name>/ (actors, trigger,
        mainFlow, exceptionFlows, postconditions, composes, requiresProof), each quality as
        work/non-functional-requirement@1 under nfr/<name>/, each rule as work/business-rule@1 under
        br/<name>/ with its acceptance criteria inline or under br/<rule>/ac/<name>/, each policy
        question as work/policy-decision@1 under decision/<name>/, each data definition as
        work/data@1 under data/<name>/ and each customer journey as work/customer-journey@1 under
        journey/<name>/. Keep each FR's main, alternative and exception flows, branch review,
        postconditions and acceptance together in its own record. For a not-yet-implemented slice,
        author the smallest decision-complete contract covering actor goal, observable outcome, material
        invariants and permissions, relevant branches, acceptance and consequential open decisions.
        Do not pre-author hypothetical future capabilities or source-local mechanics merely to make
        the document look comprehensive. Keep the selected spec records at state todo while
        implementation, test/E2E or UAT evidence is still open; never invent another lifecycle
        state. A passing business.decide job means the current requirement seed is reviewed and
        usable downstream, not that the record or feature is done. Write all canonical spec content
        in English, including natural-language prose, YAML/schema keys, stable IDs/refs, enum
        literals, protocol identifiers, API fields, variables, types, operation names and source
        symbols. Stable semantic refs resolve through exact owning Work refs without copying.
  - id: work-graph
    path: evidence/work-graph.json
    schema: starci/work-graph@1
    fields: [domains, nodes, edges]
    content:
      en: The workflow's next work-graph version - FRs attached to slices and slices added, removed or merged.
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest (read-digest.mjs --knowledge): every knowledge file the decision cites and the hfs slot of every record written, each with its sha256."
      vi: "Bản tóm tắt ĐỌC (read-digest.mjs --knowledge): mọi tệp knowledge mà quyết định dẫn ra và slot hfs của mọi bản ghi đã viết, kèm sha256 của từng tệp."
steps:
  - reads: [standard, target]
    writes: [read-digest]
    action:
      en: "READ the standard before deciding (knowledge/op-gate.yaml proofs.read-knowledge): run node scripts/checks/read-digest.mjs --root <app> --touch <every record this op will write> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/hfs/rules.yaml knowledge/design-patterns.yaml <and the pattern files of the kinds a rule constrains, e.g. knowledge/patterns/be/api-auth.yaml for a denial, knowledge/patterns/be/idempotency.yaml for a replay> --out $STARCI_JOB_SCRATCH/read-digest.json, and read what it records - the knowledge files in place and the hfs slot map of each record (slot, tier, rules). The requirement records follow the record standard (knowledge/patterns/repo/starciwork.yaml); a business rule that a canon rule already decides (default deny R41, bounded input R42, ...) cites that rule instead of restating it, and one that contradicts it is an owner question. A record the op comes to write later is added with --touch and read the same way; REPORT with read-digest.json attached."
      vi: "ĐỌC chuẩn trước khi quyết định (knowledge/op-gate.yaml proofs.read-knowledge): chạy node scripts/checks/read-digest.mjs --root <app> --touch <mọi bản ghi op sẽ viết> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/hfs/rules.yaml knowledge/design-patterns.yaml <và các tệp pattern của loại mà luật nghiệp vụ ràng buộc, vd knowledge/patterns/be/api-auth.yaml cho một từ chối, knowledge/patterns/be/idempotency.yaml cho một lần gửi lại> --out $STARCI_JOB_SCRATCH/read-digest.json, rồi đọc những gì nó ghi - các tệp knowledge tại chỗ và bản đồ slot hfs của từng bản ghi (slot, tầng, luật). Bản ghi yêu cầu theo chuẩn bản ghi (knowledge/patterns/repo/starciwork.yaml); luật nghiệp vụ mà canon đã quyết (mặc định từ chối R41, giới hạn đầu vào R42, ...) dẫn mã luật đó thay vì viết lại, còn luật mâu thuẫn với canon là câu hỏi cho chủ sở hữu. Bản ghi phát sinh về sau được thêm bằng --touch và đọc theo cùng cách; BÁO CÁO kèm read-digest.json."
  - reads:
      - target
      - intent
      - repo
      - specification
      - profile
    writes: [node]
    action:
      en: "Resolve the canonical .starciwork workspace and selected business leaf. Research accepted
        intent and supplied domain documents. Classify every citation as accepted intent, observed
        source, proposal or unknown; source behavior never approves policy. Bound authoring to the
        next selected implementation slice. Separate what must be decided now from later product
        possibilities and source-local implementation choices; record only consequential unknowns.
        Resolve the execution profile and actual tool availability before selecting instruments;
        this does not switch the model/runtime or spawn workers. A work/node@N record is retired and
        refused (HFS_WORK_NODE_RETIRED): it is never read, edited or extended, and the job is not done
        until the selected slice exists as flat records. A requirement a revision must change is
        revised in its flat fr, nfr, br, decision, data or journey record; when no flat record
        holds it yet, this op writes one. For an explicitly new target,
        absence is expected: inspect the nearest existing ancestor/workspace, then create only that
        selected scope."
  - reads:
      - intent
      - target
      - repo
    writes: [node]
    action:
      en: Write purpose, scope/exclusions, glossary, assumptions, actors with
        responsibilities/rights/restrictions, FR/BR and observable NFRs. Specify business data
        attributes, validation, sensitivity, states/transitions and external inputs/outputs/errors.
        State why a data or external-interface inventory is empty. Source observations and supplied
        technical constraints are not approved business policy; unknown numeric targets retain a
        decision owner.
  - reads:
      - intent
      - repo
    writes: [node]
    action:
      en: "Every selected FR resolves to an implementation-ready flow, not a title alone: trigger,
        primary/supporting actors, inputs, preconditions, numbered actor/request/system-response
        steps, guards, effects, failures, repeat behavior and success/failure postconditions.
        Alternative and exception branches identify their starting step, condition, ordered steps,
        resume/end and acceptance. Review denied/invalid input, cancellation, duplicate/retry,
        concurrency and recovery where they can materially change the observable result of this
        slice; explain absent branch classes without fabricating cases. Do not expand generic
        edge-case inventories that have no plausible actor, state or acceptance consequence in the
        selected slice."
  - reads:
      - target
      - intent
      - repo
    writes: [node]
    action:
      en: Review observable outcomes against accepted intent and observed behavior. Business states what
        users and the system must do, not class inheritance, repositories, service placement,
        Saga/CQRS, Kubernetes or backup tooling. Preserve genuinely supplied technical constraints
        as sourced external constraints; hand implementation questions to Architecture instead of
        encoding an invented design in requirements.
  - reads:
      - intent
      - repo
    writes: [node]
    action:
      en: Specify actor-action-resource permissions, tenant/owner boundaries, sensitive-data handling and
        abuse cases. Give each security requirement an observable denial/no-side-effect acceptance
        scenario; do not mistake a disabled UI control for server enforcement.
  - reads:
      - intent
      - target
    writes: [node]
    action:
      en: Author the feature's readable overview at features/<feature>/index.yaml (keeping its
        extensions.work3.scope unchanged) and typed flat work/*@1
        records under fr/, nfr/, br/, decision/, data/ and journey/ as the selected slice requires.
        Every item owns a folder/index.yaml carrying its own family schema const; deeper name
        segments may group related records but every index.yaml is a complete record. Keep each FR's
        flows, branch review, postconditions and acceptance cohesive. Connect semantic IDs to exact
        owning Work refs.
  - reads:
      - target
      - intent
      - repo
    writes: [node]
    action:
      en: "Repair mode (the `business.revise` kind this operator also carries) is not a second decision: a
        requirement that is silent, ambiguous or settled twice in two ways is revised here, never
        escalated and never left for a builder to read a meaning into. Read the reported gap, state
        every reading the recorded requirement actually admits, up to `params.readingsStated`, and
        choose the most reasonable one from the accepted records of this feature, the decided
        records of the other features and the product's own conventions. Write that reading into the
        flat requirement, rule or journey record with the acceptance an implementer derives code
        from, bump its change.rev, and append EXACTLY ONE extensions.work3.decisionLog entry {rev, at,
        gap, chosen, why, alternatives}, never rewriting or deleting an earlier one. One exception:
        when the readings differ in an observable outcome about money, authority or customer data,
        do not choose silently - report ask with question.kind decision, one numbered option per
        reading with what each costs and who it affects, and one recommendation; the kernel writes
        that decision record for the owner and carries the work on the recommendation until they
        answer. Never ask for anything else. Treat implementation feedback as evidence about
        feasibility or a missing observable case, not as business authority: revise only when it
        exposes an actual requirement gap or accepted owner feedback. File names, private helper
        choices and other reversible source-local details remain in Implementation and do not
        trigger a spec revision. Preserve valid unrelated content and invalidate only downstream
        proof affected by the accepted delta."
  - reads: [target, repo]
    writes: [work-graph]
    action:
      en: When the workflow has a work graph, revise it to the decided requirements - every FR attached
        to exactly one slice, and a slice added, removed or merged wherever a journey or FR now runs end to
        end differently - and record the revision; an unchanged graph records nothing.
  - reads:
      - target
      - repo
      - intent
    writes: [node]
    action:
      en: Validate detailed requirement/flow/branch/acceptance coverage and the Work tree. Review
        contradictions, scope and unresolved decisions with the user. Leave the selected spec
        records state todo after the review. Open material issues stay in blockedBy and produce
        partial or blocked; they are never hidden by schema validity. Output reviewed business
        outcomes and observable security/quality acceptance for Architecture; no implementation or
        deployed-proof claim. The op job may settle done because this bounded authoring job
        completed, but record state done is reserved for final reconciliation of current
        requirements, design, code, test/E2E and UAT evidence at one revision. Return the selected
        matrix's request-bound typed outputs when applicable.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: coverage
    requirement:
      en: Each item needed by the selected implementation slice has acceptance IDs and source intent;
        later product possibilities are not manufactured as current requirements, and no vague
        fast/secure/user-friendly NFR is accepted as measurable. Consequential open decisions remain
        explicit. Implementation/UAT status is untouched.
  - id: impact-security-coverage
    requirement:
      en: Every FR has a detailed actor flow and acceptance, every alternative/exception has ordered steps
        and postconditions, and security has observable negative acceptance. Validate flat family
        placement and every authored work/*@1 record's own schema contract; no code/service
        inventory is required in Business.
  - id: revision-decision-log
    requirement:
      en: "Every revision of an already-decided record leaves three things together or it is a defect: the
        flat record changed, its change.rev higher than it was, and exactly one new
        extensions.work3.decisionLog entry naming the gap, the chosen reading, why it is the most
        reasonable one by the records it was read from, and the alternatives that were not taken. A
        changed record with no entry is a defect, and so is any work/node record (retired, HFS_WORK_NODE_RETIRED). A
        reading that changes an observable outcome about money, authority or customer data and was
        taken without a decision record with numbered options and one recommendation is a defect,
        whatever else the revision gets right."
  - id: landed
    requirement:
      en: Every Work record file this operation wrote under its owned paths is committed with exact
        pathspecs in the checkout that holds it, and the report `head` names that commit. Settle
        refuses not-landed while one of them is untracked or dirty; authored Work never settles
        outside the repository history.
  - id: read-knowledge
    requirement:
      en: "api settle re-reads the attached read-digest.json (runtime check op-proof, proof read-knowledge): a done whose digest is missing (op-read-digest-missing), names no knowledge file or leaves a written record without its hfs slot (op-read-digest-no-knowledge) is refused."
      vi: "api settle tự đọc lại read-digest.json đính kèm (check op-proof, proof read-knowledge): done thiếu bản tóm tắt (op-read-digest-missing), không nêu tệp knowledge nào hoặc có bản ghi đã viết thiếu slot hfs (op-read-digest-no-knowledge) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: BUSINESS_UNKNOWN
    condition:
      en: A required rule, actor permission, numeric target or acceptance result has no authoritative
        decision.
  - code: BUSINESS_CONTRADICTION
    condition:
      en: Accepted sources conflict on an observable outcome about money, authority or customer data;
        preserve both citations and put the numbered options with one recommendation to the actual
        owner, never average them. A conflict that changes no such outcome is not this blocker - it
        is revised to the most reasonable reading with the reason in the decision log.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs to proceed.
placeholders:
  feature: Selected feature slug
  app: The bound app checkout (its root); every path written <app>/<path> is app-relative - be/..., fe/..., .starciwork/... or a path of the app root
  bound-paths: Inspected source read set
layoutPolicy:
  checks: [starci-validate]
policy:
  commitPolicy:
    mode: scoped-local-commit
    ownership: exact-selected-paths
    verify: git-readback-full-sha-and-diff
    push: false
    noChange: return-existing-verified-commit-no-empty-commit
route:
  nodeKinds: [business, business-overview]
  phase: [decide, pre-implementation]
  intent: [business, srs, requirements, decide]
  prerequisites: [scope defined]
