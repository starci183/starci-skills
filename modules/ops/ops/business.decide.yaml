# modules/ops/ops/business.decide.yaml
# The operator contract is the authority; the trailing 'business:' block is analysis,
# inference marked where the contract does not state it literally.

id: business.decide
goal:
  en: Specify the selected business slice with the minimum complete observable behavior needed to
    implement and independently accept it, then refine that contract from authoritative feedback.
nodeKinds:
  - business
  - business-overview
completionProfile: business
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        For an explicitly new target, absence is expected: inspect the nearest existing
        ancestor/workspace, then create only that selected scope. Preserve unaffected accepted
        content."
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: intent
    path: current accepted user intent + supplied domain documents
    purpose:
      en: Classify each statement as intent, observed fact, example, proposal, unknown or contradiction,
        with source citation/revision. Existing behavior does not authorize a new rule.
  - id: specification
    path: modules/ops/ops/business.decide.yaml + modules/schemas/spec/contract.schema.yaml
    purpose:
      en: Read the JSON field contract and this operator procedure before authoring the .starciwork
        payload.
  - id: matrix
    path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
    purpose:
      en: Only when explicitly selected in a job matrix, read the exact cell ID, operation, immutable
        input bindings, requested output JSON shapes and required criteria. Standalone execution
        needs no fabricated matrix request. A template is not authority for extra effects.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and active
        profiles. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority.
writes:
  - id: node
    path: .starciwork/<business>/business/**/index.yaml
    fields:
      - schema
      - state
      - activity
      - blockers
      - investigation.contextDigest
      - businessOverview
      - extensions.work3.srs
      - refs
      - assertions
      - dependsOn
      - required
    content:
      en: Every authored index.yaml is a work/node@2 record at its catalog-declared path under
        features/<feature>/business/. Author
        business/overview/index.yaml with businessOverview for readable purpose, customer
        understanding, outcome, scope and open questions. Author typed extensions.work3.srs leaves
        under functional-requirements, non-functional-requirements, business-rules,
        policy-decisions, data and customer-journeys - each leaf payload carrying its declared
        starci/srs-*@1 section const. Every item owns a folder/index.yaml; every
        intermediate index carries only starci/srs-aggregate@1 metadata. Keep each FR's main,
        alternative and exception flows, branch review, postconditions and acceptance together.
        For a not-yet-implemented slice, author the smallest decision-complete contract covering actor goal,
        observable outcome, material invariants and permissions, relevant branches, acceptance and
        consequential open decisions. Do not pre-author hypothetical future capabilities or source-local
        mechanics merely to make the document look comprehensive. Keep the selected SRS leaves at
        state todo while implementation, test/E2E or UAT evidence is still open; activity records
        investigating, implementing or verifying without inventing another lifecycle state. A passing
        business.decide job means the current SRS seed is reviewed and usable downstream, not that the
        Work leaf or feature is done.
        Write all canonical SRS content in English, including natural-language prose, YAML/schema
        keys, stable IDs/refs, enum literals, protocol identifiers, API fields, variables, types,
        operation names and source symbols. Stable semantic refs resolve
        through exact owning Work refs without copying.
  - id: matrixHandoff
    path: E/job-result.yaml
    fields:
      - requestId
      - requestDigest
      - op
      - operation when selected
      - status
      - criteria
      - outputs
      - artifacts
    content:
      en: Only for a selected job matrix, return the exact request-bound result. Populate every declared
        cell output with actual canonical Work/source/runtime references or produced JSON artifacts
        from this job; retain real artifact bytes and hashes. Do not rename/regenerate upstream
        expectations. Missing required output/evidence remains blocked or failed and cannot advance.
        The selected request freezes output field schemas before execution.
steps:
  - reads:
      - target
      - intent
      - repo
      - specification
      - profile
    writes:
      - node
    action:
      en: Resolve the canonical .starciwork workspace and selected business leaf. Research accepted
        intent and supplied domain documents. Classify every citation as accepted intent, observed
        source, proposal or unknown; source behavior never
        approves policy. Bound authoring to the next selected implementation slice. Separate what must
        be decided now from later product possibilities and source-local implementation choices; record
        only consequential unknowns. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - intent
      - target
      - repo
    writes:
      - node
    action:
      en: Write purpose, scope/exclusions, glossary, assumptions, actors with
        responsibilities/rights/restrictions, FR/BR and observable NFRs. Specify business data
        attributes, validation, sensitivity, states/transitions and external inputs/outputs/errors.
        State why a data or external-interface inventory is empty. Source observations and supplied
        technical constraints are not approved business policy; unknown numeric targets retain a
        decision owner.
  - reads:
      - intent
      - repo
    writes:
      - node
    action:
      en: "Every selected FR resolves to an implementation-ready flow, not a title alone: trigger, primary/supporting actors,
        inputs, preconditions, numbered actor/request/system-response steps, guards, effects,
        failures, repeat behavior and success/failure postconditions. Alternative and exception
        branches identify their starting step, condition, ordered steps, resume/end and acceptance.
        Review denied/invalid input, cancellation, duplicate/retry, concurrency and recovery where
        they can materially change the observable result of this slice; explain absent branch classes
        without fabricating cases. Do not expand generic edge-case inventories that have no plausible
        actor, state or acceptance consequence in the selected slice."
  - reads:
      - target
      - intent
      - repo
    writes:
      - node
    action:
      en: Review observable outcomes against accepted intent and observed behavior. Business states what
        users and the system must do, not class inheritance, repositories, service placement,
        Saga/CQRS, Kubernetes or backup tooling. Preserve genuinely supplied technical constraints
        as sourced external constraints; hand implementation questions to Architecture instead of
        encoding an invented design in requirements.
  - reads:
      - intent
      - repo
    writes:
      - node
    action:
      en: Specify actor-action-resource permissions, tenant/owner boundaries, sensitive-data handling and
        abuse cases. Give each security requirement an observable denial/no-side-effect acceptance
        scenario; do not mistake a disabled UI control for server enforcement.
  - reads:
      - intent
      - target
    writes:
      - node
    action:
      en: Author business/overview/index.yaml for readable intent and typed extensions.work3.srs
        leaves under functional-requirements, non-functional-requirements, business-rules,
        policy-decisions, data and customer-journeys. Every item owns a folder/index.yaml;
        intermediate indexes carry only starci/srs-aggregate@1 metadata. Keep each FR's flows,
        branch review, postconditions and acceptance cohesive. Write all canonical SRS content in
        English, including natural-language prose, YAML/schema keys, stable IDs/refs, enum literals,
        protocol identifiers, API fields, variables, types, operation names and source symbols.
        Connect semantic IDs to exact owning Work refs.
  - reads:
      - target
      - intent
      - repo
    writes:
      - node
    action:
      en: "Repair mode (the `business.revise` kind this operator also carries) is not a second decision: a
        requirement that is silent, ambiguous or settled twice in two ways is revised here, never escalated
        and never left for a builder to read a meaning into. Read the reported gap, state the two or three
        readings the recorded requirement actually admits, and choose the most reasonable one from the
        accepted records of this feature, the decided records of the other features and the product's own
        conventions. Write that reading into the requirement, rule or journey with the acceptance an
        implementer derives code from, bump the record's rev, and append EXACTLY ONE
        extensions.work3.decisionLog entry {rev, at, gap, chosen, why, alternatives}, never rewriting or
        deleting an earlier one. One exception: when the readings differ in an observable outcome about
        money, authority or customer data, do not choose silently - report ask with question.kind decision,
        one numbered option per reading with what each costs and who it affects, and one recommendation; the
        kernel writes that decision record for the owner and carries the work on the recommendation until
        they answer. Never ask for anything else. Treat implementation feedback as evidence about feasibility
        or a missing observable case, not as business authority: revise only when it exposes an actual
        requirement gap or accepted owner feedback. File names, private helper choices and other reversible
        source-local details remain in Implementation and do not trigger an SRS revision. Preserve valid
        unrelated content and invalidate only downstream proof affected by the accepted delta."
  - reads:
      - target
      - repo
      - intent
      - matrix
    writes:
      - node
      - matrixHandoff
    action:
      en: Validate detailed requirement/flow/branch/acceptance coverage and the recursive Work graph.
        Review contradictions, scope and unresolved decisions with the user. Bind the reviewed current
        semantic context in investigation.contextDigest, leave selected SRS leaves state todo, and return
        activity to idle after the review. Open material issues stay in blockers[] and produce partial or
        blocked; they are never hidden by schema validity. Output reviewed business outcomes and observable
        security/quality acceptance for Architecture; no implementation or deployed-proof claim. The op job
        may settle done because this bounded authoring job completed, but Work state done is reserved for
        final reconciliation of current SRS, SDS, code, test/E2E and UAT evidence at one revision. Return the
        selected matrix's request-bound typed outputs when applicable.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly proposed, required
        assertions are covered, input bindings are current, and an honest not-run/fail cannot earn
        done.
  - id: coverage
    requirement:
      en: Each item needed by the selected implementation slice has acceptance IDs and source intent;
        later product possibilities are not manufactured as current requirements, and no vague
        fast/secure/user-friendly NFR is accepted as measurable. Consequential open decisions remain
        explicit. Implementation/UAT status is untouched.
  - id: impact-security-coverage
    requirement:
      en: Every FR has a detailed actor flow and acceptance, every alternative/exception has ordered steps
        and postconditions, and security has observable negative acceptance. Validate nested
        ownership and every split SRS section contract; no code/service inventory is required in
        Business. Existing specification@2 and srs@3 records are readable inputs, never new output.
  - id: revision-decision-log
    requirement:
      en: "Every revision of an already-decided record leaves three things together or it is a defect: the
        record changed, its rev higher than it was, and exactly one new extensions.work3.decisionLog entry
        naming the gap, the chosen reading, why it is the most reasonable one by the records it was read from,
        and the alternatives that were not taken. A changed record with no entry is a defect. A reading that
        changes an observable outcome about money, authority or customer data and was taken without a decision
        record with numbered options and one recommendation is a defect, whatever else the revision gets right."
blockers:
  - code: BUSINESS_UNKNOWN
    condition:
      en: A required rule, actor permission, numeric target or acceptance result has no authoritative
        decision.
  - code: BUSINESS_CONTRADICTION
    condition:
      en: Accepted sources conflict on an observable outcome about money, authority or customer data;
        preserve both citations and put the numbered options with one recommendation to the actual owner,
        never average them. A conflict that changes no such outcome is not this blocker - it is revised to
        the most reasonable reading with the reason in the decision log.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# Business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "What must the product observably do - actors, flows, rules, policy
    decisions, data, customer journeys, acceptance - stated so an implementer
    and an acceptor need no guesses?"
  whenNeeded:
    - When a selected scope needs a minimum decision-complete SRS seed: only the typed leaves required by the next implementation slice, plus its readable overview context.
    - Repair mode (business.revise secondary request): when implementation evidence or accepted feedback proves an observable requirement silent, ambiguous or contradictory.
  whenNot:
    - Not for technical design - that is architecture.decide; this op does not design components or pick frameworks.
    - Not for code/service inventories - repo reads ground the SRS, they are not the deliverable.
    - Not for speculative completeness across unselected future capabilities or reversible source-local choices; those do not block the selected slice.
    - Never turns observed source behavior into approved policy; money/authority/customer-data conflicts go to the owner via ask, never averaged silently.
  consumes:
    - Target business node; accepted user intent, domain documents and prior decided records.
    - Repo observation for grounding (existing behavior is a candidate fact, not authority).
    - modules/schemas/spec/contract.schema.yaml section contract (loaded by spec/validate.mjs for this op).
  produces:
    - business/overview + typed SRS leaf records (starci/srs-*@1 schemas per specification.yaml).
    - Current investigation.contextDigest on reviewed todo leaves; decisionLog entries on every revision; E/ matrix job-result when selected.
    - Downstream: the reviewed SRS seed + journeys that architecture.decide, scope.define and verification ops consume; later evidence may refine them through a new reviewed revision. This op does not author Work state done.
  failureModes:
    - BUSINESS_UNKNOWN, BUSINESS_CONTRADICTION, DECLARED_DEPENDENCY_UNMET (declared blockers).
    - A changed record without a decisionLog entry is a defect; unreviewed contradiction cannot be hidden in prose.
# ---------------------------------------------------------------------------
# route: resolver index.
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [business, business-overview]
  phase: [decide, pre-implementation]
  intent: [business, srs, requirements, decide]
  prerequisites: ["scope defined"]
