schema: starci/op@1
id: e2e.verify
goal:
  en: Prove one selected delivered slice through its public API on a real stack the suite starts
    itself, with one scenario per assertion and the listed checks run verbatim. E2E runs MANUALLY only
    (owner ruling 2026-09-29) - this leg exists only when the goal explicitly asked for e2e, and no hook,
    default typecheck, coverage run or automatic CI job ever runs it.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then gate.mjs the op loop runs before it stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml)."
      vi: "Số vòng SỬA rồi chạy lại gate.mjs của vòng lặp op trước khi dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml)."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - end-to-end scenario spec authoring inside the selected allowlist
  - start and disposal of the run-owned ephemeral stack the suite brings up
  - scenario-owned data inside that run-owned stack only
  - execution of exactly the declared check commands
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap; report it and propose a separately selected scope op.
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,data,journey,decision}/**/index.yaml
    purpose:
      en: Read the accepted requirements, rules, denials and acceptance IDs declared as relevant inputs in
        the selected .starciwork graph. Intent governs the expected observable effect; current
        source behavior is not a replacement for it. A needed missing input is a reported
        graph/scope gap, not a silently added dependency.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: Read the declared operations, contracts, data ownership, authorization and error identity,
        transaction and idempotency boundaries and eventual-consistency expectations of the slice
        under proof. Where the design is silent about the observable effect, report the gap instead
        of inventing an expectation.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve the repository resource, actual checkout/root/HEAD and dirty state; read the delivered
        slice, its public entry points and its existing scenario coverage. The proof binds the exact
        tested tree, so a spec-only claim without a resolved writable repository is not a proof.
  - id: suite
    path: <app>/be/src/tests/world/** + <app>/be/src/tests/e2e/** + <app>/be/jest.config.js
    purpose:
      en: "The app's test world: be/src/tests/world/test-world.config.ts (export const { useTestWorld, useSandbox } = defineTestWorld({ stack: '.starcistacks/<env>', stacks, fakes, apps, migrate, identity, modules }) - the stack declaration at the app root names the services that run REAL, and third-party SaaS alone is faked at the network edge), use-test-world.ts (the spec entry), global-setup.ts and global-teardown.ts, the repo-specific fakes under fakes/<provider>/, be/jest.config.js (@starci/jest-preset starciJestConfig(): the world projects run on the preset's world runner, up to min(--maxWorkers, slots) files at once, each in a fresh process on its own data slot) and packages/test-world/README.md (the frozen spec-facing API and its hard rule). Then the existing e2e specs of the slice: their naming (be/src/tests/e2e/<feature>/<name>.e2e-spec.ts), the operations registry the apps declare and the assertions they already own."
      vi: "Test world của app: be/src/tests/world/test-world.config.ts (export const { useTestWorld, useSandbox } = defineTestWorld({ stack: '.starcistacks/<env>', stacks, fakes, apps, migrate, identity, modules }) - khai báo stack ở gốc app nêu các dịch vụ chạy THẬT, chỉ SaaS bên thứ ba được giả ở rìa mạng), use-test-world.ts (lối vào của spec), global-setup.ts và global-teardown.ts, các fake riêng của repo dưới fakes/<provider>/, be/jest.config.js (@starci/jest-preset starciJestConfig(): các dự án world chạy trên world runner của preset, tối đa min(--maxWorkers, số slot) tệp cùng lúc, mỗi tệp trong một tiến trình mới trên slot dữ liệu riêng) và packages/test-world/README.md (API cố định cho spec và luật cứng của nó). Sau đó là các spec e2e hiện có của slice: cách đặt tên (be/src/tests/e2e/<feature>/<name>.e2e-spec.ts), registry operation mà các app khai báo và các khẳng định chúng đã sở hữu."
  - id: stack
    path: <app>/.starcistacks/<environment>/** + .starciwork/_resources/environments/<environment>/resource.yaml
    purpose:
      en: "The stack the test world runs for real: the services and image versions of the app-root .starcistacks/<environment> the declaration names (Postgres, Redis, Keycloak with its realm, ...) and the environment record that owns them. The test world attaches the one warm stack (starci-test-stack) and isolates this checkout by its namespace; no other target is a proof surface."
      vi: "Stack mà test world chạy thật: các dịch vụ và phiên bản image của .starcistacks/<environment> ở gốc app mà khai báo nêu (Postgres, Redis, Keycloak với realm của nó, ...) và bản ghi môi trường sở hữu chúng. Test world gắn vào một stack ấm duy nhất (starci-test-stack) và cô lập checkout này theo namespace; không đích nào khác là bề mặt chứng minh."
  - id: checks
    path: selected request checks[] + <app>/<manifest-paths>
    purpose:
      en: Read the exact check commands the request lists and the manifest scripts that define them. These
        commands are run verbatim and nothing else is added, narrowed or substituted.
  - id: effects
    path: current request authorization + selected stack resource declared allowed effects
    purpose:
      en: "Bind the scenario-owned data inside the test world's per-checkout namespace (reset by the world when a file boots) and any explicitly authorized external call to the selected assertions. Unauthorized effects, shared-target mutation and unbounded retry are outside this op; discover an unknown external outcome by read-only correlation before repeating an attempt."
      vi: "Gắn dữ liệu riêng của kịch bản trong namespace theo checkout của test world (world đặt lại khi một tệp khởi động) và mọi lệnh gọi ngoài được phép rõ ràng vào các khẳng định đã chọn. Hiệu ứng không được phép, sửa đích dùng chung và thử lại không giới hạn nằm ngoài op này; kết quả ngoài chưa biết được tìm bằng đối chiếu chỉ đọc trước khi thử lại."
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
  - id: workflow
    path: selected workflow request + modules/kernel/verdict-contract.yaml + this op authority.json
    purpose:
      en: When selected inside the named workflow, read the exact request, strict response contract and
        primary/secondary authority JSON. Standalone op execution does not invent a workflow
        request.
  - id: op-loop
    path: knowledge/op-gate.yaml
    purpose:
      en: "The op loop's data: the file-kind to pattern-file map, the example app per side and the gate and digest schemas that read-digest.mjs and gate.mjs apply."
      vi: "Dữ liệu của vòng lặp op: bảng loại tệp sang tệp pattern, app ví dụ cho từng phía, và schema của cổng và bản tóm tắt đọc mà read-digest.mjs và gate.mjs dùng."
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; actual observations, red scenarios, findings and commit
        mapping belong to the evidence result, not semantic node prose. Missing
        refs/dependencies/assertions require a reported gap or a separately selected scope update;
        never add or remove them to obtain pass.
  - id: source
    path: <app>/<write-ceiling>
    fields:
      - end-to-end scenario specs
      - scenario fixtures and helpers
      - suite configuration only when explicitly selected
    content:
      en: Add or change scenario spec files inside the explicit allowlist and nothing else. Product code,
        schema, configuration and declared expectations stay untouched - a behavior that is wrong is
        a finding reported from here, never repaired here. No mock, stub, fake or spy of the unit
        under proof, no in-process shortcut around its public entry point, no assertion weakened or
        scenario skipped to reach green, and no generated record of a run that did not happen.
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, scenarios.json, stack.json, readback.json, result.md, screens/*.png]
    content:
      en: Keep the original assertion IDs and map each one to its scenario, the request it sends, the
        expected observable effect and the observed response. Record the exact commands, cwd, tested
        tree/commit, container services with their observed identity, exit codes, counts and
        sanitized output, including every attempt when a scenario was retried. Operator-specific
        observed result in evidence/result.md - report per assertion pass, fail with the observed response,
        or not-run with the reason. An unrun, skipped or partial scenario stays not-run outside the
        pass column, a green run whose stack never started is recorded as a spec defect, and
        credentials or personal data are redacted before the assets are hashed. Test credentials a script, fixture or driver needs are generated per run (node:crypto randomBytes) or, only when they must stay stable across runs, kept the way the repo keeps every credential - .starcistacks/<stack>/secrets/test/<name>, stored with the repo's own stack-secret set command (npm run secret:set) so only the sops .enc twin is committed, read with testSecret(<name>, {repo}) (scripts/lib/test-secrets.mjs; owner:push-scan-test-secrets-encrypted) - never written as a literal; the push secret scan refuses a plaintext test password.
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest: the touched files, their slot map from hfs explain, and every pattern and example file read with its sha256."
      vi: "Bản tóm tắt ĐỌC: các tệp sẽ sửa, bản đồ slot của chúng từ hfs explain, và mọi tệp pattern và ví dụ đã đọc kèm sha256."
  - id: gate-proof
    path: STARCI_JOB_SCRATCH/gate.json
    schema: starci/gate@1
    content:
      en: "The last round's gate report: exit, base, head, changed files, new and preexisting counts and every new finding."
      vi: "Báo cáo cổng của vòng cuối: exit, commit gốc, head, các tệp đã đổi, số lỗi mới và lỗi có sẵn, và từng lỗi mới."
  - id: test-world-run
    path: STARCI_JOB_SCRATCH/test-world-run.json
    schema: starci/test-world-run@1
    content:
      en: "The test-world run summary of the e2e project (scripts/gates/test-world-run.mjs): the harness (preset, world runner, declaration), every selected spec with its world form, outage calls and forbidden infrastructure, and the run's exit, totals, failures and skips."
      vi: "Tóm tắt lần chạy test-world của dự án e2e (scripts/gates/test-world-run.mjs): bộ khung (preset, world runner, khai báo), từng spec đã chọn với dạng world, số lần gọi outage và hạ tầng bị cấm, cùng exit, tổng số, lỗi và số test bị bỏ qua của lần chạy."
steps:
  - reads: [op-loop]
    writes: [read-digest]
    action:
      en: "READ before coding (op loop, knowledge/op-gate.yaml): run node scripts/gates/read-digest.mjs --root <app> --touch <every file the slice will create or change> --out $STARCI_JOB_SCRATCH/read-digest.json and read exactly what it lists, nothing wider - the knowledge/patterns/{be|fe}/*.yaml of each touched file kind, the matching example files of examples/<app>/{fe,be} and the slot map hfs explain prints per path (slot, tier, allowed imports, rules). Code only after this read; a file the slice comes to touch later is added with --touch and read the same way."
      vi: "ĐỌC trước khi viết code (vòng lặp op, knowledge/op-gate.yaml): chạy node scripts/gates/read-digest.mjs --root <app> --touch <mọi tệp slice sẽ tạo hoặc sửa> --out $STARCI_JOB_SCRATCH/read-digest.json và đọc đúng những gì nó liệt kê, không rộng hơn - các tệp knowledge/patterns/{be|fe}/*.yaml của từng loại tệp sẽ sửa, các tệp ví dụ cùng slot trong examples/<app>/{fe,be} và bản đồ slot mà hfs explain in cho từng đường dẫn (slot, tầng, import được phép, luật). Chỉ viết code sau bước đọc này; tệp phát sinh về sau được thêm bằng --touch và đọc theo cùng cách."
  - reads:
      - stack
    writes: [evidence]
    action:
      en: "Environment pre-step, before any setup or walk. api dispatch already ran node
        scripts/uat/env-health.mjs check --restart on the environments this flow's records reference and
        put the result in the packet (context.environment). Re-run it yourself - node
        scripts/uat/env-health.mjs check --repo <ledger repo> --paths <owned paths as JSON> --json - and
        record it in report.checks as name env-health with its exit code (0 ready, 3 not ready). A service
        that is down is started ONLY through node scripts/uat/env-health.mjs serve --repo <ledger repo>
        --env <id> --service <name> --cwd <checkout> --url <probe> -- <start command>, which registers it so
        the next pre-step restarts it itself; never kill a process env-health reports as port-conflict. A
        probe-drift row means the declared probe path is stale while the service is up: walk, and name the
        discovered endpoint in the report for workspace.manage. When the stack is still not ready, file
        outcome blocked with blocker kind environment (never failed): a walk on a dead stack proves nothing
        about the product and must not be charged to it."
  - reads:
      - target
      - business
      - architecture
      - repo
      - profile
    writes: [evidence]
    action:
      en: Freeze the assertion set before any effect and restate every assertion as a client request plus
        the observable effect the stack must show - status and error identity, response body,
        authorization denial and the persisted or emitted consequence. One assertion is one
        scenario; no assertion is merged, dropped or re-worded, and no expectation is inferred from
        how the code currently behaves. Where the requirement or the design is silent about the
        observable effect, record the gap and report it rather than guessing. Resolve the execution
        profile and actual tool availability before selecting instruments; this does not switch the
        model/runtime or spawn workers. Do not create a target or invent its assertions here, and
        never rewrite an assertion so an existing scenario can pass. These define, per assertion,
        the request a client sends and the effect the stack must show.
  - reads: [suite, repo, stack, checks]
    writes: [evidence]
    action:
      en: "Inspect the test world before writing anything: the declaration (its stack, stacks, fakes, apps and identity doors), the spec entry, the preset jest config and the existing e2e specs of the slice, and the exact listed check commands with the manifest scripts behind them (npm run test:e2e). An app without a defineTestWorld declaration or a be/jest.config.js that is not starciJestConfig() is the reported blocker, never a reason to start containers, open a DataSource or read process.env from a spec: the library is the only place allowed to do infrastructure. Never stand up a second harness and never point a scenario at a shared or production service. A listed command that does not exist is a reported blocker, never a locally invented equivalent."
      vi: "Xem test world trước khi viết bất cứ gì: khai báo (stack, stacks, fakes, apps và các cửa identity), lối vào của spec, cấu hình jest của preset và các spec e2e hiện có của slice, cùng đúng các lệnh kiểm tra được liệt kê với script manifest phía sau (npm run test:e2e). App không có khai báo defineTestWorld hoặc be/jest.config.js không phải starciJestConfig() là blocker được báo, không bao giờ là lý do để spec tự khởi động container, mở DataSource hay đọc process.env: thư viện là nơi duy nhất được làm hạ tầng. Không dựng bộ khung thứ hai và không trỏ kịch bản vào dịch vụ dùng chung hay production. Lệnh được liệt kê mà không tồn tại là blocker được báo, không bao giờ là lệnh tự chế tương đương."
  - reads: [architecture, repo, suite, target]
    writes: [source, evidence]
    action:
      en: "Write or extend one scenario per assertion at the allowlisted spec paths (be/src/tests/e2e/<feature>/<name>.e2e-spec.ts; for a todo target work.author wrote in planned mode, exactly the spec paths its checks name). Each file takes its world from the library - const world = useTestWorld({ apps: [...] }) through the repository's use-test-world entry - and drives the slice only through its public API, world.apps.<name>.api (graphql, get/post, as/bearing, signIn), with people from world.signedInPerson/registerPerson. Cover the positive path, the declared denial, invalid input and the applicable concurrency or replay case, and read the persisted effect back through the same public surface. A failure path of our own stack goes through the outage API - world.infra.<svc>.cut() then restore(), during(fn) or latency(ms) - and a third-party refusal through the edge fake (world.fake.<name>.failNext); state is awaited with world.waitFor, never a sleep. Seed only through the declaration's seeds and the suite's builders, never pre-create the outcome under proof. No mock, stub, fake or spy of the unit under proof, no in-process shortcut around its entry point, no docker, DataSource or process.env in a spec. Product code and declared expectations stay unchanged here."
      vi: "Viết hoặc mở rộng một kịch bản cho mỗi khẳng định tại các đường dẫn spec được phép (be/src/tests/e2e/<feature>/<name>.e2e-spec.ts; với đích todo mà work.author viết ở chế độ planned, đúng các đường dẫn spec mà lệnh kiểm tra của nó nêu). Mỗi tệp lấy world từ thư viện - const world = useTestWorld({ apps: [...] }) qua lối vào use-test-world của repo - và chỉ đi qua API công khai của slice, world.apps.<name>.api (graphql, get/post, as/bearing, signIn), với người dùng từ world.signedInPerson/registerPerson. Phủ đường chính, lần từ chối đã khai báo, đầu vào sai và trường hợp đồng thời hoặc gửi lại khi áp dụng, rồi đọc lại hiệu ứng đã lưu qua cùng bề mặt công khai. Đường lỗi của stack của chính ta đi qua API outage - world.infra.<svc>.cut() rồi restore(), during(fn) hoặc latency(ms) - còn lần từ chối của bên thứ ba qua fake ở rìa (world.fake.<name>.failNext); trạng thái được chờ bằng world.waitFor, không bao giờ sleep. Chỉ gieo dữ liệu qua seeds của khai báo và builder của bộ test, không bao giờ tạo sẵn kết quả cần chứng minh. Không mock, stub, fake hay spy đơn vị cần chứng minh, không đường tắt trong tiến trình vòng qua lối vào của nó, không docker, DataSource hay process.env trong spec. Mã sản phẩm và kỳ vọng đã khai báo giữ nguyên ở đây."
  - reads: [checks, stack, effects, suite]
    writes: [evidence, test-world-run]
    action:
      en: "Run the e2e project through the runtime's test-world runner: node scripts/gates/test-world-run.mjs --root <app> --project e2e [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/test-world-run.json. It runs the listed npm run test:e2e verbatim on the preset's world runner (up to min(--maxWorkers, slots) files at once, each in a fresh process on its own data slot, the test world attaching the warm stack and resetting the slot's data per file) and records the harness, every spec's world form, the outage calls and the totals. Add no command, narrow no selection and skip no scenario; keep the command, cwd, tested tree/commit, exit code, counts and sanitized output, and every attempt when something was retried. A scenario that stays green with its dependencies cut is a defect of the spec, and deleting or skipping a scenario is never a route to a green run."
      vi: "Chạy dự án e2e qua bộ chạy test-world của runtime: node scripts/gates/test-world-run.mjs --root <app> --project e2e [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/test-world-run.json. Nó chạy đúng lệnh npm run test:e2e được liệt kê trên world runner của preset (tối đa min(--maxWorkers, số slot) tệp cùng lúc, mỗi tệp trong tiến trình mới trên slot dữ liệu riêng, test world gắn stack ấm và đặt lại dữ liệu của slot theo từng tệp) và ghi bộ khung, dạng world của từng spec, các lần gọi outage và tổng số. Không thêm lệnh, không thu hẹp phạm vi, không bỏ kịch bản nào; giữ lệnh, cwd, cây/commit đã test, exit code, số đếm và đầu ra đã làm sạch, và mọi lần thử lại. Kịch bản vẫn xanh khi phụ thuộc bị cắt là lỗi của spec, và xóa hay bỏ qua kịch bản không bao giờ là đường tới lần chạy xanh."
  - reads: [stack, effects, suite, target]
    writes: [evidence]
    action:
      en: "Read the observed responses back against the frozen expectations, assertion by assertion, and keep every red scenario with the request it sent and the response it got. Then confirm every outage the run injected was restored (the world restores what it cut when it stops), that no shared or production target was touched and that no authorized external effect is left open. The warm stack stays up by design and the run's data is reset by the next file's boot; a leftover resource outside the world's namespace is recorded with its exact identity and a resumable disposal command."
      vi: "Đọc lại các phản hồi quan sát được theo các kỳ vọng đã chốt, từng khẳng định một, và giữ mọi kịch bản đỏ kèm yêu cầu đã gửi và phản hồi nhận được. Sau đó xác nhận mọi outage lần chạy đã gây ra đều được khôi phục (world khôi phục những gì nó cắt khi dừng), không đích dùng chung hay production nào bị chạm và không hiệu ứng ngoài được phép nào còn mở. Stack ấm cố ý vẫn chạy và dữ liệu của lần chạy được đặt lại khi tệp kế tiếp khởi động; tài nguyên sót lại ngoài namespace của world được ghi kèm danh tính chính xác và lệnh dọn có thể chạy lại."
  - reads:
      - target
      - checks
      - repo
      - workflow
    writes: [node, evidence]
    action:
      en: Report done exactly once, and only with a green run - every assertion covered by a scenario that
        ran on the real stack, the verbatim check commands with their exit codes, the run output, the
        spec paths and the evidence/screens images of the run (a browser run adds its video and trace, recorded
        through uat-slots.mjs run --record-dir), all named in report.files, bound to the exact tested tree. A red scenario is failed, naming the
        assertion and the observed response; a stack that cannot start is failed with the exact
        reason; blocked with reason environment only when the cause is provably unfixable from the
        allowlist. Never report done on an unrun, skipped or partial spec, and never claim a proof
        from an earlier run. Validate bound evidence, keep the repair of any defect found here as a
        separate operation, and stop; never self-advance.
  - reads: [op-loop]
    writes: [gate-proof]
    action:
      en: "FORCE THE CHECKS after coding: run node scripts/gates/gate.mjs --root <app> --changed <the files the slice changed> [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the new findings (lint per file and rule, tsc per message, failing specs - a finding the base already has never counts); exit 2 means a tool could not run and is never green. Still red after the last round: report blocked with the exact findings of that gate.json. Never report done while the gate is red or could not run. REPORT with gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA sau khi viết code: chạy node scripts/gates/gate.mjs --root <app> --changed <các tệp slice đã đổi> [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi mới (lint theo tệp và luật, tsc theo thông điệp, spec thất bại - lỗi đã có trên commit gốc không bao giờ bị tính); exit 2 là một công cụ không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi trong gate.json đó. Không bao giờ báo done khi cổng đỏ hoặc không chạy được. BÁO CÁO kèm gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: "`starci validate` ran, and `starci validate --strict` ran on every record directory it
        writes; every cited ID and path exists or is explicitly proposed, the input
        bindings are current, and an honest not-run or fail cannot earn done."
  - id: coverage
    requirement:
      en: Every required assertion maps to exactly one scenario that ran, with its original ID, its client
        request and its expected observable effect recorded before execution. A merged, re-worded,
        skipped or absent scenario leaves its assertion not-run.
  - id: api
    requirement:
      en: Every scenario drives the slice only through its public API - the transport contract a client
        calls - with no mock, stub, fake or spy of the unit under proof and no in-process shortcut
        around its entry point. A user interface is not a proof surface for this op, and an image is
        never a response assertion.
  - id: stack
    requirement:
      en: "The dependencies the slice needs ran for real in this run - the services of the declaration's .starcistacks/<env>, attached by the test world - and only third-party SaaS was faked at the network edge; the test-world summary shows the preset world runner, the defineTestWorld declaration and specs that hand-roll no infrastructure. A shared or production target is never an accepted substitute."
      vi: "Các phụ thuộc slice cần đã chạy thật trong lần chạy này - các dịch vụ của .starcistacks/<env> trong khai báo, do test world gắn vào - và chỉ SaaS bên thứ ba được giả ở rìa mạng; tóm tắt test-world cho thấy world runner của preset, khai báo defineTestWorld và các spec không tự dựng hạ tầng. Đích dùng chung hay production không bao giờ là thay thế được chấp nhận."
  - id: run
    requirement:
      en: Exactly the listed check commands ran verbatim, with recorded exit codes, counts and retained
        sanitized output and every retry visible. A claimed pass without its output is not a run,
        and a stack that did not start is failed with the exact reason.
  - id: scope
    requirement:
      en: Only allowlisted scenario spec paths changed, proven by the actual repository status against the
        tested tree. No product file, schema or declared expectation was touched, and any defect
        found is reported as a finding for a separate repair.
  - id: proof-media
    requirement:
      en: The report names at least one image of the run and, when a browser ran, its video; settle
        refuses a pass without them (PROOF_MEDIA_MISSING).
    check: scripts/kernel/job-artifacts.mjs
  - id: teardown
    requirement:
      en: "Every outage the run injected is restored, no shared state outside the world's namespace was mutated, and any remaining ephemeral resource is recorded with its identity and a resumable disposal command."
      vi: "Mọi outage lần chạy gây ra đều được khôi phục, không trạng thái dùng chung nào ngoài namespace của world bị sửa, và mọi tài nguyên tạm còn lại được ghi kèm danh tính và lệnh dọn có thể chạy lại."
  - id: op-gate
    requirement:
      en: "api settle re-reads the attached gate.json (exit 0 over the slice's changed files) and read-digest.json (a pattern file named for every touched file kind) and records the runtime check op-gate; a done without them, with a tool that could not run or with a new finding is refused, and the Kernel re-runs the same gate on the branch at landing."
      vi: "api settle tự đọc lại gate.json đính kèm (exit 0 trên các tệp slice đã đổi) và read-digest.json (có tệp pattern cho mọi loại tệp đã sửa) rồi ghi check op-gate; done thiếu chúng, có công cụ không chạy được hoặc có lỗi mới đều bị từ chối, và Kernel chạy lại đúng cổng đó trên nhánh khi land."
  - id: test-world
    requirement:
      en: "api settle re-reads the attached test-world run summary (runtime check op-proof, proof test-world, project e2e): a done without it (op-test-world-proof-missing), with a hand-rolled world - no preset world runner, no defineTestWorld declaration, a spec outside the layer's form, docker, testcontainers, a DataSource, process.env or a sleep in a spec (op-test-world-hand-rolled) - or with a run that is not green, ran no test or skipped one (op-test-world-run-red) is refused."
      vi: "api settle tự đọc lại tóm tắt lần chạy test-world đính kèm (check op-proof, proof test-world, dự án e2e): done thiếu nó (op-test-world-proof-missing), có world tự dựng - không có world runner của preset, không có khai báo defineTestWorld, spec sai dạng của tầng, docker, testcontainers, DataSource, process.env hoặc sleep trong spec (op-test-world-hand-rolled) - hoặc lần chạy không xanh, không chạy test nào hay bỏ qua test (op-test-world-run-red) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: ENVIRONMENT_NOT_READY
    condition:
      en: The env-health pre-step still reports a declared service down, hung, restart-failed or held by a
        foreign process after the permitted bring-up. File blocked with blocker kind environment and the
        env-health result; the walk is not run and nothing is charged to the product.
  - code: PRODUCT_DEFECT_OWNER
    condition:
      en: "The walk ran on a ready stack and a step is red. File failed with failureClass product and a
        rootCause naming the owner of the fix - node: the Work record (impl.<feature>.<repo>.<name>) or
        op whose output is wrong, op: the build op that repairs it (backend.implement,
        interface.implement), files: the source paths it touches, plus claim, evidence, counterCheck,
        expectedFix and recheck. The kernel routes a repair leg to that owner and runs this op again
        behind it; it never re-runs the same walk at an unchanged HEAD. Use failureClass transient only
        for a genuine flake a plain re-run may clear, with the evidence for it."
  - code: ASSERTION_REQUEST_INCOMPLETE
    condition:
      en: The node assertions, the requirement/design material or the listed check commands are missing or
        ambiguous, so the client request and the observable effect cannot be stated per assertion.
  - code: PROOF_SURFACE_UNAVAILABLE
    condition:
      en: The slice exposes no public API a scenario can exercise, or proving the assertion would require
        driving a user interface or mocking the unit under proof.
  - code: STACK_UNAVAILABLE
    condition:
      en: "The test world cannot attach or start its warm stack in this environment - no container runtime, an unavailable image, a refused host, an exhausted resource or TEST_WORLD_NAMESPACE_BUSY from a second run of this checkout - and the cause is provably unfixable from the allowlist."
      vi: "Test world không gắn hay khởi động được stack ấm trong môi trường này - không có container runtime, image không có, host từ chối, cạn tài nguyên hoặc TEST_WORLD_NAMESPACE_BUSY do một lần chạy khác của checkout này - và nguyên nhân chắc chắn không sửa được trong phạm vi cho phép."
  - code: CHECK_UNRUNNABLE
    condition:
      en: A listed check command does not exist or cannot execute as written; report it instead of
        substituting a different command or a narrowed selection.
  - code: SCOPE_OUTSIDE_ALLOWLIST
    condition:
      en: Proving an assertion would require changing product code, schema, configuration or a declared
        expectation outside the allowlisted spec paths; report the finding and never widen the
        ceiling.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
  - code: TEST_WORLD_MISSING
    condition:
      en: "The app has no @starci/test-world declaration (be/src/tests/world/test-world.config.ts calling defineTestWorld) or its be/jest.config.js is not @starci/jest-preset starciJestConfig(): report the exact gap for the owning build op; a spec never hand-rolls the world instead."
      vi: "App không có khai báo @starci/test-world (be/src/tests/world/test-world.config.ts gọi defineTestWorld) hoặc be/jest.config.js không phải starciJestConfig() của @starci/jest-preset: báo đúng khoảng trống cho op build sở hữu; spec không bao giờ tự dựng world thay vào."
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  app: The bound app checkout (its root); every path written <app>/<path> is app-relative - be/..., fe/..., .starciwork/... or a path of the app root
  bound-paths: Inspected source read set
  manifest-paths: Manifest and script files defining the listed check commands
  write-ceiling: Explicit owned scenario spec paths under be/src/tests/e2e/
  environment: Resolved end-to-end runtime label
layoutPolicy:
  checks: [starci-validate]
policy:
  # specsToggle: what this op does when the owner's config.yaml specs.<class> is false (scripts/route/spec-deferral.mjs):
  # defer-leg = never dispatched, settled deferred; skip = runs without that class of test or coverage; not-counted = the gate does not demand it.
  specsToggle: {e2e: defer-leg}
  proofMedia: {images: 1, video: when-browser}
  e2ePolicy:
    proofSurface: public-api-only
    interfaceDriving: false
    stack: test-world-warm-stack-real-own-services
    world: useTestWorld-apps
    outage: world-infra-cut-restore
    mocks: none-for-the-unit-under-proof
    scenarios: one-per-assertion
    checks: listed-commands-verbatim
    productCode: unchanged
    environmentBlocker: provably-unfixable-only
    teardown: outages-restored-namespace-reset-by-the-world
route:
  nodeKinds: [implementation]
  phase: [verify, post-implementation]
  intent: [e2e, api, verify, test]
  prerequisites: [implementation done]
  riskHints: [served-target]
