schema: starci/op@1
id: interface.asset
goal:
  en: Generate every artwork the approved interface candidate embeds as a real repository asset at the
    size, format and brand references the design record declares, and bind each produced file back
    to its slot.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then starci app lint over the files the op produced before it stops: a lint still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml proofs.produced-lint)."
      vi: "Số vòng SỬA rồi chạy lại starci app lint trên các tệp op đã tạo trước khi dừng: hết vòng cuối mà lint vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml proofs.produced-lint)."
nodeKinds: [ui]
completionProfile: ui
sideEffects: [generated artwork files inside the owned asset paths of the bound repository]
graphPolicy:
  mode: read-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the interface design record this operation serves: its screens, their enumerated states,
        the blueprint regions and - the input this operation exists for - the declared artwork
        slots, each with its region, purpose, brief, size, format, brand references and the crop of
        the chosen candidate it was taken from. The record governs. A slot the record does not
        declare is not generated here, and a record that declares no slot at all leaves this
        operation nothing to do; neither is a licence to decide what the screen should contain.
        The slots this operation owes are the drawing's placeholders (owner ruling 2026-09-27): each
        data-asset-slot=\"<id>\" in a render source under N/assets/** with its entry in the
        asset-request.md beside it, listed by `starci work asset-slot list N` and by starci kernel status
        assetSlotsOwed[]; a slot is owed until its data-asset-sha256 names the bytes of its src."
  - id: design
    path: N/assets/*
    purpose:
      en: Open the actual chosen candidate image beside the record and the crop each slot names inside it,
        so the artwork that is produced is the artwork that was approved rather than a fresh
        interpretation of its brief.
  - id: brand
    path: .starciwork/brand/index.yaml + brand/assets/**
    purpose:
      en: Read the product brand record the kernel attaches - its colour tokens, its mascot and logo
        masters with the placements each one allows and forbids, and its imagery prompt rules
        (brand.imagery.style, forbidden and promptRules - every prompt is written inside them) - and
        read the actual master files a slot references.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve the bound repository, its checkout and its owned asset paths, and read whatever already
        exists at the slot's destination, so this slot's own earlier generation is reused or replaced
        deliberately instead of duplicated under a second name.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: "Resolve how this operation gets images: its own agent runs no image model, it calls
        `starci work imagegen`, which takes the imagegen call tier of modules/models/tiers.yaml (calls.imagegen)
        headlessly and returns image files with a receipt. Historical model names are not availability
        proof; a refused call (quota, capacity, unavailable) is reported as the limitation instead of
        substituting a hand-authored, scripted or placeholder image for a generated one."
writes:
  - id: source
    path: <app>/<asset-path>
    fields: [generated artwork files only]
    content:
      en: "Write each slot's artwork at the owned asset path the allowlist names, in the declared format
        and at the declared pixel size, one file per slot and nothing else. No source file, no
        stylesheet, no component and no configuration is edited here: wiring the file into a
        component is the build's step, and an asset written outside the allowlisted asset paths is a
        reported scope blocker rather than a wider write."
  - id: node
    path: N/index.yaml
    fields:
      - schema
      - ui.artworkSlots[].file
      - ui.artworkSlots[].sha256
      - ui.artworkSlots[].status
      - ui.artworkSlots[].provenance
      - assets:[{path}]
    content:
      en: "Record the produced artwork on the ui-screen record against the slots it already declares: per
        slot the repository path of the file, its sha256, its status and the tool provenance of the
        generation, and bind each path in the record's asset list so the bytes are covered. Add no
        slot, remove no slot and rewrite no brief, region, size or crop: those are the drawing's,
        and a slot that turned out wrong is a reported gap, not an edit of what was approved. A slot
        with no file is left explicitly unproduced with its reason. The produced file replaces the
        drawing's placeholder: in every render source that shows the slot, the data-asset-slot
        element's src becomes the produced file (relative to the source) and data-asset-sha256 its
        sha256 - nothing else in the source changes - so the settle records asset-slot-filled and
        starci kernel status stops listing it in assetSlotsOwed."
  - id: placeholder
    path: N/assets/**/*.html
    fields: [data-asset-slot element src, data-asset-sha256]
    content:
      en: "The drawing's placeholder for a slot, filled: in each render source that shows the slot, only the
        data-asset-slot element's src (the produced file, relative to the source) and its data-asset-sha256
        (that file's sha256) and data-asset-prompt (its prompt.txt) change. Nothing else in the render source
        is edited - its composition is the drawing's."
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, extensions]
    artifacts: [manifest.yaml, artwork-slots.yaml, prompt.txt]
    content:
      en: Retain the slot-to-file table as readable YAML, the full prompt and reference list used per slot
        (including the candidate crop and each brand master passed as a reference), the real tool
        provenance, and the inspection of every produced file against its brief and the brand rules.
        Record an honest unproduced or failed slot; a slot reported as produced without opened bytes
        is a failure, not a draft.
  - id: lint
    path: STARCI_JOB_SCRATCH/lint.json
    schema: starci/lint@1
    content:
      en: "The starci app lint report of the produced asset files (starci app lint --changed <those files> --format json at the app root): the FE canon, stylelint and the brand grammar's checks, every finding with its engine, rule, code, path and line, and the errors of a lint that could not run."
      vi: "Báo cáo starci app lint của các tệp tài sản đã tạo (starci app lint --changed <các tệp đó> --format json ở gốc app): canon FE, stylelint và các kiểm tra của ngữ pháp thương hiệu, từng lỗi kèm engine, luật, mã, đường dẫn và dòng, cùng errors khi lint không chạy được."
steps:
  - reads:
      - target
      - design
      - brand
      - profile
    writes: [evidence]
    action:
      en: "Read the declared artwork slots of the design record and freeze the work before generating
        anything: per slot its id, screen, state, blueprint region, purpose, brief, pixel size and
        viewport, format, brand references and the crop of the chosen candidate it came from. Open
        the candidate and locate every crop. The image model is reached only through
        `starci work imagegen`; its first refusal settles which slots cannot be produced.
        Compare each brief against the brand rules and the placements its referenced masters allow,
        and settle which slots are producible before the first image is requested; an embedded
        artwork visible in the candidate that the record never declared is reported rather than
        invented into a slot here. A slot whose crop cannot be located in the candidate is a
        reported gap, never a free redraw. These rules bound every prompt and every result; a brief
        that cannot be honoured inside them is reported, not quietly widened, and an asset is never
        produced from a master the record forbids in that placement."
  - reads:
      - design
      - brand
      - repo
    writes: [source]
    action:
      en: "Generate each producible slot with `starci work imagegen --prompt <the slot's prompt.txt> --out
        <the owned asset path> --name <slot> --reference <crop> --reference <master>... --json`, the candidate crop
        and the brand mascot or logo masters the slot references as actual input references, so the result
        is the approved artwork rather than a new one matching the same words. The verb runs the image
        model headlessly and writes <slot>-<n>.png, <slot>-<n>.prompt.txt and generation-receipts.yaml
        beside it; the size passed is a request and the receipt records the real pixel size. Write every prompt from the
        slot's asset-request.md entry inside the brand record's imagery.style, imagery.forbidden and
        imagery.promptRules, retained verbatim in prompt.txt and beside the file as <file>.prompt.txt.
        Every product slot is a NEW generation (owner ruling 2026-09-27) - a new pose and composition
        for this surface in the brand style, the masters passed as style references only; bytes
        identical to a brand master never fill a slot, even when a master was the drawing's
        placeholder. Produce exactly the declared pixel size and format, one file per slot, at the
        owned asset path the allowlist names, reusing only this slot's own verified earlier generation
        instead of writing a second copy of it under another name. Do not drift the brief, do not restyle the candidate, do not add or remove
        content the region does not carry, and do not touch product code. Reading the surrounding
        code is for placing the file only; this operation changes no product code."
  - reads:
      - target
      - repo
    writes: [node, placeholder, evidence]
    action:
      en: Open every produced file and inspect it as bytes and as an image against its slot - the crop it
        must reproduce, its declared size and format, and the brand rules and placement its
        references allow. Then record each slot's file path, sha256, status and provenance (generation.tool
        image_gen.imagegen with the receipt's toolOutputBasename and model) back into the design record and bind the path in its asset list. A file that differs from the approved
        crop, misses its declared size or breaks a brand rule is regenerated or reported; it is
        never recorded as the slot's asset. Then fill the drawing's placeholder - set the data-asset-slot element's src to
        the produced file and data-asset-sha256 to its sha256 in every render source that shows the slot, so
        `starci work asset-slot list N` reads it filled and the settle records asset-slot-filled.
  - reads:
      - target
      - design
      - brand
    writes: [node, evidence]
    action:
      en: Report once with the complete slot-to-file table, naming every declared slot and the file that
        now carries it. A slot whose brief cannot be honoured inside the brand rules is blocked as a
        brand gap with the exact rule and the exact brief that conflict. Artwork the candidate
        embeds that the record never declared is blocked as an interface gap naming the screen,
        state and region, so the drawing declares it instead of this operation guessing at it. An
        asset path outside the allowlist is blocked with the exact paths. Stop without wiring
        anything into a component and without advancing the workflow.
  - reads: [repo, brand]
    writes: [lint, evidence]
    action:
      en: "FORCE THE FE CANON over what the op produced: starci app lint --changed <every asset and binding file the op wrote> --format json > $STARCI_JOB_SCRATCH/lint.json at the app root - the FE canon, stylelint and the brand grammar's checks (an asset off the brand palette or the declared format is a finding). FIX the produced files and run it again, at most params.gateRounds rounds. Still red after the last round: report blocked with the exact findings. Never report done while the lint has a finding or could not run. REPORT with lint.json attached."
      vi: "ÉP CHẠY CANON FE trên những gì op tạo ra: starci app lint --changed <mọi tài sản và tệp gắn kết mà op đã viết> --format json > $STARCI_JOB_SCRATCH/lint.json ở gốc app - canon FE, stylelint và các kiểm tra của ngữ pháp thương hiệu (tài sản lệch bảng màu thương hiệu hoặc định dạng đã khai báo là một lỗi). SỬA các tệp đã tạo rồi chạy lại, tối đa params.gateRounds vòng. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi. Không bao giờ báo done khi lint còn lỗi hoặc không chạy được. BÁO CÁO kèm lint.json."
proofs:
  - id: slot-coverage
    requirement:
      en: Every artwork slot the design record declares is accounted for - produced with a file and
        sha256, or explicitly unproduced with a named blocker. A partial table reported as complete,
        or a slot silently dropped, is a failure.
  - id: candidate-fidelity
    requirement:
      en: Each produced file was opened and compared against the candidate crop its slot names, at the
        declared pixel size and format. A generated image that reinterprets the approved artwork
        instead of reproducing it does not satisfy its slot, and a similar-looking result is not
        proof of the same artwork.
  - id: brand-conformance
    requirement:
      en: "Every prompt and every result stayed inside the brand record: the referenced masters were
        passed as real references, the placement each master allows was respected, and no colour,
        mark or imagery rule the record forbids was produced. A visual acceptance does not
        substitute for the record's own rules."
  - id: binding
    requirement:
      en: Every recorded path exists in the bound repository with the recorded sha256, every path is
        inside the allowlisted asset scope, the declared slot briefs, regions, sizes and crops are
        byte-identical to what the drawing authored, and no product code changed. An honest not-run
        cannot earn done.
  - id: produced-lint
    requirement:
      en: "starci kernel settle re-reads the attached lint.json (runtime check op-proof, proof produced-lint): a done without it (op-lint-proof-missing), with a lint that could not run (op-lint-tool-failed) or with any finding over the produced files (op-lint-findings) is refused."
      vi: "starci kernel settle tự đọc lại lint.json đính kèm (check op-proof, proof produced-lint): done thiếu nó (op-lint-proof-missing), có lint không chạy được (op-lint-tool-failed) hoặc có bất kỳ lỗi nào trên các tệp đã tạo (op-lint-findings) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: BRAND_RULE_UNSATISFIABLE
    condition:
      en: A slot's brief cannot be honoured inside the brand record - the placement its master requires is
        forbidden, the imagery rules contradict the brief, or the record names no master the brief
        depends on - so any asset produced would be outside the brand. Report the rule and the
        brief; never widen the rules.
  - code: ARTWORK_SLOT_UNDECLARED
    condition:
      en: The chosen candidate embeds artwork the design record does not declare as a slot, or a declared
        slot names a crop, region or state the candidate and the record do not contain, so the brief
        would have to be authored here. Report the screen, state and region for the drawing to
        declare.
  - code: IMAGE_MODEL_UNAVAILABLE
    condition:
      en: "`starci work imagegen` refused (IMAGEGEN_QUOTA, IMAGEGEN_CAPACITY, IMAGEGEN_UNAVAILABLE,
        IMAGEGEN_RUNNER_FAILED, IMAGEGEN_TIMEOUT or IMAGEGEN_NO_OUTPUT), so no slot can be produced.
        Report the code and detail; a scripted, hand-drawn or placeholder file is never a generated
        asset."
  - code: SCOPE_OUTSIDE_ALLOWLIST
    condition:
      en: A slot's destination lies outside the owned asset paths this operation may write. Report the
        exact paths and wait; never widen the write ceiling to place a file.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: The design record, the chosen candidate or the brand record this operation depends on is missing
        or not effectively done. Report the node/resource IDs; never author the missing record, draw
        the missing candidate or run a predecessor here.
placeholders:
  app: shared
  bound-paths: shared
  asset-path: Owned asset destination declared by the allowlist
layoutPolicy:
  checks: [starci-validate]
route:
  nodeKinds: [ui]
  phase: [implement, implementation]
  intent: [asset, image, artwork, imagegen]
  prerequisites:
    - interface.draw done (artworkSlots declared)
  riskHints: [generates-assets]
