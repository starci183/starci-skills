# modules/ops/ops/provision.ask.yaml - TINKLE-1 pure-yaml port of .claude/ops/provision.ask/operator.yaml
# The operator contract below is verbatim; the trailing 'business:' block is the added
# analysis (inference marked where the contract does not state it literally).

id: provision.ask
goal:
  en: >-
    Ask the owner for the one thing only they can give - a credential, an account on an outside system, a
    dataset, a legal authority, or the go-ahead for an irreversible effect - exactly named, in this operation's
    own workflow, and wait for it. Credential input belongs to the kernel's Orca GUI after official-documentation
    preparation; no model agent asks for a value.
    This operation verifies only that the provision is present.
nodeKinds:
  - business
completionProfile: business
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: question
    path: "the operation goal (section 'Question for the owner') and the operation that asked it"
    purpose:
      en: Read what is asked for exactly as it was raised - which operation, what it blocks, which kind of
        provision (credential, account, dataset, authority, irreversible) - before anything is printed.
  - id: environment
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: For a credential, read where the code reads the value - the exact variable name - and which identity
        custody of this tree (.starciwork/_resources/identity/<slug>/) will hold it. Never the value itself.
writes:
  - id: report
    path: E/manifest.yaml
    fields:
      - summary
    content:
      en: The report of the attempt itself - the fact that the provision is present, and nothing else; never a value, never a record in the tree.
steps:
  - reads:
      - question
      - environment
    writes: []
    action:
      en: >-
        Name the provision exactly: a credential names the variable the code reads, the outside system it belongs
        to and the custody it will live in (identity:<slug>); an account, a dataset or an authority names what
        and for which system. Never invent, stub, default or skip it.
  - reads:
      - question
    writes: []
    action:
      en: >-
        For a credential, return the exact declared requirement to the kernel; do not open an input terminal,
        ask the owner to compose a command, or wait for a "set" reply. The workflow owns the researched form
        in Orca and resumes its satisfied requesters automatically.
        For anything else, ask in this terminal and wait for the owner
        to reply "provided" once it exists. Wait as long as the contract lets you.
  - reads:
      - question
      - environment
    writes:
      - report
    action:
      en: >-
        For a credential the kernel verifies encrypted-custody presence through the canonical verifier and
        settles the waiting ask itself; this operation runs no credential probe and reports no credential
        success. Stored presence does not establish provider validity. For anything else, when the owner
        replies verify PRESENCE alone and report done with "provided: <what the owner provided, in a few words>". If the wait
        ends with no answer, report blocked with blocker kind authority naming the provision; the kernel keeps it
        on the owner's list and nothing else waits for it.
proofs:
  - id: named-exactly
    requirement:
      en: The provision is named exactly - the variable, the system, the custody - and nothing was invented,
        stubbed, defaulted or skipped in its place.
  - id: asked-in-the-workflow
    requirement:
      en: The workflow provided a researched credential form in Orca, or
        asked for the non-credential provision in this operation's terminal before any report.
  - id: no-secret
    requirement:
      en: No value of any credential or secret appears in the report, the terminal or anywhere else; a
        credential is put into the tree's encrypted identity custody by the workflow's input service and this
        operation verifies only that it is present.
blockers:
  - code: QUESTION_UNCLEAR
    condition:
      en: The question names no provision and no system; the operation that asked it is sent back to state it.
placeholders:
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  slug: Stable identity custody slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# TINKLE-1 business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "What is the one thing only the owner can give - credential, account,
    dataset, authority, irreversible go-ahead - and is it now present?"
  whenNeeded:
    - When an operation needs an owner-only provision; this is the only op that actually waits for the owner.
    - When presence must be checked (e.g., a sealed credential variable exists in custody) before an effect is attempted.
  whenNot:
    - Not for decisions - decision.prepare prepares those provisionally without waiting.
    - Never asks for a credential value in a terminal or model context - the kernel's Orca GUI owns secret entry.
    - Presence is not provider validity - a present-but-expired credential is still a failure downstream.
  consumes:
    - The question as raised; environment facts (variable name + custody - never the value).
  produces:
    - E/manifest.yaml report of presence only; the provision itself enters through owner channels, never through this file.
  failureModes:
    - QUESTION_UNCLEAR (declared blocker); no answer inside the wait window = blocked authority, not an assumed grant.
# ---------------------------------------------------------------------------
# route: resolver index (added by tinkle-6 per tinkle/_common.md amendment).
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [business]
  phase: [decide, cross-cutting]
  intent: [provision, ask, owner-input, credential]
  prerequisites: ["an owner-only input is needed"]
  riskHints: [waits-on-owner]
