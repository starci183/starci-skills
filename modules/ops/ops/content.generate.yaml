schema: starci/op@1
id: content.generate
goal:
  en: Create or revise one selected content unit with grounded claims and actual requested media/code
    checks.
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - selected local content/assets/code edits
  - scoped commits when authorized; no publication implied
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. This consumer op requires its target node to exist. An absent
        target is a scope/graph gap: report it and propose a separately selected scope op; do not
        create a target or invent its acceptance/graph here."
  - id: business
    path: .starciwork/features/<feature>/{br,ac,fr,nfr,data,journey,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
        inputs in the selected .starciwork graph. Intent governs expected behavior; source is not a
        replacement. Do not invent a mandatory BA predecessor for a scope that does not require one;
        a needed missing input is a reported graph/scope gap, not a new dependency silently added
        here.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: brief
    path: selected curriculum/content brief + actual source material/style/rights
    purpose:
      en: Read audience, learning/use outcome, factual sources, language, format, approved claims and
        requested assets/examples. Unprovided facts/testimonials/results are not creative license.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic node prose. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: repository:<repo-id>/<write-ceiling>
    fields: [source files, tests, migration/assets/config only when selected]
    content:
      en: Only exact owned paths in the approved code-scope, with smallest required caller/integration
        changes; record actual diff and commit mapping, not proposed changes as delivered.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts:
      - manifest.yaml
      - content-review.md
      - source-map.json
      - example-tests.json when executable
      - media-review.md when generated
      - result.md
    content:
      en: "Record factual source checks, edition completeness and actual requested build/example
        execution. Keep generated media actual tool provenance and inspected visual quality.
        Operator-specific observed result in E/result.md: Link actual authored content paths and
        source/rights provenance; content-complete is not learning outcomes observed in production
        or publication."
steps:
  - reads:
      - target
      - business
      - brief
      - repo
      - profile
    writes: [node]
    action:
      en: Resolve requested audience/outcomes, edition/locale, factual constraints and source-owned paths.
        A new content-only workspace can use explicitly selected deliverable paths, not a fabricated
        product repository. Resolve the execution profile and actual tool availability before
        selecting instruments; this does not switch the model/runtime or spawn workers.
  - reads:
      - brief
      - business
      - repo
    writes: [source]
    action:
      en: Write or revise only selected content and examples, preserving correct existing material and
        linking nontrivial factual claims to actual sources. Label illustrative examples.
  - reads:
      - brief
      - repo
    writes: [source, evidence]
    action:
      en: Generate requested assets with available appropriate skill/tools and inspect them; run
        executable examples and declared builds when selected, retain actual outputs. Unrequested
        media/language variants are not mandatory.
  - reads:
      - target
      - brief
      - business
    writes: [evidence]
    action:
      en: Review outcome coverage, clarity, factuality, source rights and locale consistency. Independent
        review requires actual authorized reviewer; self-review is labelled honestly.
  - reads:
      - target
      - repo
      - brief
    writes: [node, evidence]
    action:
      en: Commit selected tracked content when authorized or report local deliverables/uncommitted result
        accurately. Stop without publishing or changing curriculum outside scope. This handoff is
        conditional and does not change standalone or named frontend response contracts.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository, and
        separately retain integration/tested mappings. Report uncommitted or no-change honestly.
  - id: content
    requirement:
      en: Declared outcomes/claims are covered and supported; executable claims have actual executed
        proof, generated images are inspected, and unrun examples stay unverified.
blockers:
  - code: CONTENT_AUTHORITY_MISSING
    condition:
      en: Required source, factual claim, rights or intended audience/outcome is unresolved.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [content, copy, write]
  prerequisites: [decided records/behavior exist]
