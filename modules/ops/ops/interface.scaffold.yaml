schema: starci/op@1
id: interface.scaffold
goal:
  en: Create one new interface source tree in the bound repository and prove it renders — build green
    plus a captured first shell.
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits
  - new source tree creation inside the bound repository at the declared path
  - scoped local commits when authorized
  - toolchain install/build and a local render probe in the declared sandbox
  - no deployment, no publication, no design decisions
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "The selected implementation node this scaffold realises: declared source path,
        framework/design refs, assertions. On a greenfield scaffold the node is absent — no workflow
        authors it before the first source tree exists."
  - id: baseline
    path: CONTEXT.md (fixed stack) + knowledge/repository-baseline.yaml (shapes common and next)
    purpose:
      en: The Next.js stack every project uses and the toolchain a new frontend repository carries from
        its first commit — manifest and engines, strict TypeScript, canon lint, vitest with coverage
        thresholds, git hooks, CI gates, Codecov and Sonar configuration, ignore rules and line endings.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: The settled design for routing beyond the first shell, data boundaries and the dependencies it
        owns beyond the baseline health surface. A baseline-only scaffold reads none.
  - id: grammar
    path: knowledge/grammars/* + grammar package (repository:<repo-id> binding)
    purpose:
      en: REQUIRED. The markup is written in the installed grammar, not in ad-hoc JSX/HTML. Resolve the
        bound grammar package and its version before writing any component; a missing or unbound
        grammar reports grammar-gap.
  - id: brand
    path: .starciwork/brand/index.yaml (settled tokens inside)
    purpose:
      en: Read settled brand tokens the scaffold wires into the theme layer. Absent brand decisions report
        brand-gap rather than shipping placeholder styling as settled.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: Resolve the actual checkout, HEAD and dirty state; the declared app path may be empty — that is
        the greenfield case.
  - id: conventions
    path: knowledge/patterns/fe/* + knowledge/ui/* + knowledge/code-pattern-enforcement.yaml
    purpose:
      en: House FE rules the new tree conforms to from its first commit — lint kits, source layout,
        naming, boundary contracts.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve the request-bound profile; capabilities are the intersection of actual tools and profile
        policy.
writes:
  - id: node
    path: N/index.yaml
    fields: [state, activity, codeRefs, evidence]
    content:
      en: The selected implementation scope node — created with its schema const when absent on a
        greenfield scaffold — carrying the realised source root, scaffolded paths and evidence the
        checks produced.
  - id: source
    path: repository:<repo-id>/<declared-source-root>/**
    fields: [manifest, toolchainConfig, layout, themeWiring, firstShell, harness]
    content:
      en: "The new tree only: manifest, framework/toolchain configs, declared layout, grammar-based
        theme/token wiring, the minimal first shell (root route renders), and its test/build
        harness."
  - id: evidence
    path: E/**
    fields:
      - request
      - scope
      - criteria
      - status
      - outputs
      - observations
      - effects
      - evidenceRefs
      - codeRefs
      - remaining
      - recovery
    artifacts: [result.json, effects.json, verification.json, artifacts/**]
    content:
      en: The scaffold result, the effects it had, the verification it ran and the artifacts it produced.
  - id: firstRender
    path: <node>/assets/first-shell-render.png
    content:
      en: The captured first-shell render, in image bytes, under the node's evidence assets.
steps:
  - reads:
      - target
      - baseline
      - architecture
      - grammar
      - brand
    writes: [evidence, firstRender]
    action:
      en: Resolve what the new app must be — shell shape, grammar version, token source. The framework
        comes from CONTEXT.md and the toolchain from the repository baseline, so a baseline-only
        scaffold needs no design record; routing beyond the root, data boundaries and SDS-owned
        dependencies come from the settled SDS — never guessed. Undecided inputs are named gaps, never
        improvised.
  - reads:
      - repo
      - conventions
    writes: [evidence, firstRender]
    action:
      en: Resolve the real checkout, confirm the declared app path is empty-or-absent, read the house FE
        layout and lint contracts.
  - reads:
      - baseline
      - architecture
      - grammar
      - brand
    writes: [source]
    action:
      en: Write the manifest and toolchain first, exactly as knowledge/repository-baseline.yaml shapes
        common and next carry them (package.json with engines and scripts, strict tsconfig, canon
        eslint config, vitest with coverage thresholds, husky pre-commit with lint-staged and
        pre-push, .github/workflows/ci.yml, codecov.yml, sonar-project.properties, .gitignore,
        .editorconfig, .gitattributes) - the manifest composed and every config and skeleton file copied
        byte for byte from the profile shape, with only its declared parameters and common-key
        placeholders filled - then the declared layout, then grammar-based theme wiring,
        then the minimal first shell with the baseline liveness route. No screens or behaviour beyond
        what the shell proves.
  - reads:
      - repo
    writes: [source, evidence, firstRender]
    action:
      en: Install, build, lint and run the harness for real; serve the shell locally and capture the first
        render. The capture is evidence, recorded under the node's assets.
  - reads:
      - target
    writes: [node, evidence, firstRender]
    action:
      en: Record the realised source root and codeRefs on the node; return the evidence bundle with the
        capture. For a greenfield target, absence of the node is expected; inspect the nearest
        existing ancestor/workspace, then create only that selected implementation scope node and
        nothing beyond it.
proofs:
  - id: scaffold-runs
    requirement:
      en: The declared toolchain commands ran against the new tree and real output is recorded.
  - id: renders
    requirement:
      en: The first shell rendered and the capture bytes exist in evidence — build-green alone does not
        prove an interface scaffold.
  - id: grammar-conforms
    requirement:
      en: Written markup uses the installed grammar's units; no ad-hoc markup bypassed it.
  - id: baseline-runs
    requirement:
      en: The repository baseline for the next profile is present and executes — a staged change makes the
        pre-commit hook run lint-staged, the pre-push hook runs typecheck and affected tests, and
        .github/workflows/ci.yml parses and names the lint, typecheck, test and build gates. The
        observed hook and CI output is recorded.
  - id: scope
    requirement:
      en: Every created file lives under the declared source root.
blockers:
  - code: SDS_MISSING
    condition:
      en: The scaffold is asked to wire routing beyond the first shell, data boundaries or SDS-owned
        dependencies, and no settled architecture names them.
  - code: GRAMMAR_UNBOUND
    condition:
      en: No bound grammar package resolves — markup cannot be written without it.
  - code: BRAND_MISSING
    condition:
      en: Theme wiring is required but no settled brand tokens exist.
  - code: TOOLCHAIN_UNAVAILABLE
    condition:
      en: The declared toolchain cannot install, build or render in the available environment.
  - code: OUTSIDE_SCOPE
    condition:
      en: The required tree would write outside the declared source root.
placeholders:
  repo-id: Observed selected repository identity
  bound-paths: Inspected relevant source read set
  declared-source-root: The exact path the node/design declares for the new app tree
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  cutSetAuthority:
    scope: interface.scaffold-cut-sets
    appliesWhen: The dispatch packet carries context.cut {id, ordinal, total} with total >= 2, every cut
      job uses this same approved interface.scaffold leg and goal binding, and the complete pairwise-disjoint path
      union (shared root config - package.json, lockfile, tsconfig, eslint config, architecture.json -
      in exactly one ordinal, normally the seam) was preflighted before the first slice launched.
    permits: "A repository-wide gate (install, typecheck, lint:check, check-scoped-lint, test, build)
      may remain nonzero after a NON-FINAL ordinal only for findings whose paths belong exclusively to
      not-yet-passed sibling ordinals of the same cut set. The current slice must pass the same gates
      scoped to its own owned paths, recorded as check cut-slice-postcondition; the full gate commands
      and their finding inventory stay unchanged except for sibling-owned paths, recorded as
      cut-regression-inventory; a finding a passed ordinal resolved may not reappear. The raw nonzero
      full result is integration evidence, not the slice's red verdict. The pass that CLOSES the set -
      the last ordinal to settle, whichever it is, not the highest (inc-751dd1ac4492) - must record
      full-regression-final green from the unchanged full gates over the whole set before the leg advances."
    forbids:
      - declaring a non-final slice done without the scoped gates on its own paths
      - accepting a full-gate finding on a path this slice or a passed ordinal owns
      - advancing the leg before the pass that closes the set records full-regression-final green
route:
  nodeKinds: [implementation]
  phase: [implement]
  intent: [scaffold, greenfield, new-source, frontend, interface, bootstrap, init]
  prerequisites:
    - grammar bound
    - repository bound
    - a settled SDS only when wiring SDS-owned dependencies or routing beyond the first shell
  riskHints: [source-edits, new-tree]
