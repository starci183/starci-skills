schema: starci/op@1
id: docs.author
goal:
  en: Author or update the documentation one selected scope needs, derived from the decided records
    and the actual code - a reader's document, never a restated transcript.
nodeKinds: [operations]
completionProfile: operations
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness - which document this node owns, its audience and its declared
        coverage. This consumer op requires its target node to exist. An absent target is a
        scope/graph gap: report it and propose a separately selected scope op; do not create a
        target or invent its acceptance/graph here."
  - id: records
    path: .starciwork/features/<feature>/**/index.yaml
    purpose:
      en: Read the decided requirement, design, decision and goal records the document describes - the
        settled intent.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read the code,
        manifests, public entry points and existing docs the document describes. Every behavior,
        command, path and symbol the document names is read in the source - a documented fact that
        was not observed is a defect, not a draft.
  - id: conventions
    path: existing documentation files and docs conventions in the bound tree and repository
    purpose:
      en: Read the documentation that already exists - its structure, voice, format and audience - so an
        update extends it instead of forking it. A missing convention is reported, not replaced by a
        private style.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields: [schema, state, blockedBy, evidence, description, extensions.work3.docs]
    content:
      en: Write the document's own declaration on the selected record (its existing schema preserved) -
        which documents it owns under extensions.work3.docs - plus state/blockedBy/evidence. The
        document content itself belongs to the docs write and observations to evidence; do not widen
        refs/dependsOn/acceptance to obtain pass.
  - id: docs
    path: .starciwork/<docs-dir>/<doc>.md
    fields: [document title, audience and purpose, body, source references]
    content:
      en: Author or update the selected document in place at the catalog-declared docs path and name
        (prose carries no schema const) - real prose grounded in the records and code actually read,
        with every command, path, symbol and behavior named as observed and every source cited.
        Documentation that must live beside product code is proposed as separately selected scope,
        never written into the repository from this op. Preserve stable document identity, existing
        correct sections and declared exclusions; record open questions honestly instead of filling
        them.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, extensions]
    artifacts: [manifest.yaml, docs-map.json, result.md]
    content:
      en: "Map every documented claim to the record id or source path/line it was read from, list the
        documents authored or updated with their before/after, and record what stayed undocumented
        with its reason. Operator-specific observed result in E/result.md: coverage of the declared
        documentation scope and the open questions that remain."
steps:
  - reads:
      - target
      - records
      - conventions
      - profile
    writes: [evidence]
    action:
      en: Bind the documentation scope - the documents this node owns, their audience and the coverage the
        assertions declare. Read the decided records first so the document restates settled intent.
        Resolve the execution profile and actual tool availability before selecting instruments;
        this does not switch the model/runtime or spawn workers. Documentation restates what records
        decided; it never decides anything itself, and an undecided question stays a documented open
        item, not a filled blank.
  - reads:
      - records
      - repo
      - conventions
    writes: [docs, evidence]
    action:
      en: Author or update the selected documents inside the existing conventions - each section grounded
        in a record id or an inspected source path, each command and symbol as observed. Preserve
        stable identity and correct existing material; where a fact is undecided or unverifiable,
        write the open question, never a guess.
  - reads:
      - repo
      - records
    writes: [evidence]
    action:
      en: Read the authored documents back against the source and records - every named command, path,
        symbol and behavior verified where it was claimed, every stale statement corrected or
        removed. A claim that cannot be traced is cut, not kept.
  - reads:
      - target
      - records
    writes: [node, docs, evidence]
    action:
      en: Declare the authored documents on the node, run the record-class validator `starci validate`
        over the edited tree and report done once with the docs map and open questions. Never
        dispatch a successor.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: grounded
    requirement:
      en: Every documented claim traces to a decided record id or an inspected source path - the docs-map
        lists the citation per claim, and an untraceable statement is absent, not present.
  - id: coverage
    requirement:
      en: The declared documentation scope is covered - every owned document authored or updated, every
        required section present - and whatever stayed undocumented is named with its reason.
  - id: records-preserved
    requirement:
      en: The operation authored documents only - no decided record was restated into something else, no
        repository source was written, and no scope, dependency or acceptance was touched to obtain
        pass.
blockers:
  - code: RECORD_UNSETTLED
    condition:
      en: The records the document must describe are missing, not decided or self-contradictory - report
        the exact record ids as the applicable record gap; documentation cannot settle a question
        the records left open.
  - code: SOURCE_OF_TRUTH_MISSING
    condition:
      en: The code or existing documentation the document must describe cannot be resolved, so grounding
        is impossible; report the exact missing input.
  - code: AUTHORITY_REQUIRED
    condition:
      en: Covering the declared scope needs an authority the goal does not grant, such as publishing or
        writing beside product code - report blocked with blocker kind authority, an owner decision.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Selected feature slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  docs-dir: Tree directory that owns the selected documents
  doc: Stable document slug inside that directory
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  docsPolicy:
    sourceOfTruth: records-and-inspected-code
    repoWrite: never
    untraceableClaim: cut-not-kept
    openQuestions: recorded-honestly
route:
  nodeKinds: [operations]
  phase: [implement, implementation]
  intent: [docs, documentation, write]
  prerequisites: [decided records/behavior exist]
