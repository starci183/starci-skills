schema: starci/op@1
id: docs.author
goal:
  en: Author or update the documentation one selected scope needs, derived from the decided records
    and the actual code - a reader's document, never a restated transcript.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then the document gate (starci gate run --scope docs) before the op stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml docChecks)."
      vi: "Số vòng SỬA rồi chạy lại cổng tài liệu (starci gate run --scope docs) trước khi op dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml docChecks)."
nodeKinds: [operations]
completionProfile: operations
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: N/index.yaml
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness - which document this node owns, its audience and its declared
        coverage. This consumer op requires its target node to exist. An absent target is a
        scope/graph gap: report it and propose a separately selected scope op; do not create a
        target or invent its acceptance/graph here."
  - id: records
    path: .starciwork/features/<feature>/**/index.yaml
    purpose:
      en: Read the decided requirement, design, decision and goal records the document describes - the
        settled intent.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read the code,
        manifests, public entry points and existing docs the document describes. Every behavior,
        command, path and symbol the document names is read in the source - a documented fact that
        was not observed is a defect, not a draft.
  - id: conventions
    path: existing documentation files and docs conventions in the bound tree and repository
    purpose:
      en: Read the documentation that already exists - its structure, voice, format and audience - so an
        update extends it instead of forking it. A missing convention is reported, not replaced by a
        private style.
  - id: profile
    path: shared
    purpose:
      en: shared
  - id: standard
    path: docs/architecture.md + docs/code-pattern-enforcement.md + examples/index.yaml + knowledge/op-gate.yaml + knowledge/patterns/repo/starciwork.yaml + knowledge/patterns/repo/folder.yaml
    purpose:
      en: shared
      vi: "Chuẩn mà quyết định và bản ghi của op dẫn ra: knowledge/op-gate.yaml (proofs.read-knowledge), các tệp knowledge liệt kê ở bước ĐỌC và bản đồ slot hfs của mọi bản ghi op viết (starci app explain ở gốc app). Các tệp được đọc tại chỗ và ghi kèm sha256 vào bản tóm tắt ĐỌC; không chép lại vào bản ghi."
writes:
  - id: node
    path: N/index.yaml
    fields: [schema, state, blockedBy, evidence, description, extensions.work3.docs]
    content:
      en: Write the document's own declaration on the selected record (its existing schema preserved) -
        which documents it owns under extensions.work3.docs - plus state/blockedBy/evidence. The
        document content itself belongs to the docs write and observations to evidence; do not widen
        refs/dependsOn/acceptance to obtain pass.
  - id: docs
    path: .starciwork/<docs-dir>/<doc>.md
    fields: [document title, audience and purpose, body, source references]
    content:
      en: Author or update the selected document in place at the catalog-declared docs path and name
        (prose carries no schema const) - real prose grounded in the records and code actually read,
        with every command, path, symbol and behavior named as observed and every source cited.
        Documentation that must live beside product code is proposed as separately selected scope,
        never written into the repository from this op. Preserve stable document identity, existing
        correct sections and declared exclusions; record open questions honestly instead of filling
        them.
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, extensions]
    artifacts: [manifest.yaml, docs-map.json, result.md]
    content:
      en: "Map every documented claim to the record id or source path/line it was read from, list the
        documents authored or updated with their before/after, and record what stayed undocumented
        with its reason. Operator-specific observed result in evidence/result.md: coverage of the declared
        documentation scope and the open questions that remain."
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest (read-digest.mjs --knowledge): every knowledge file the decision cites and the hfs slot of every record written, each with its sha256."
      vi: "Bản tóm tắt ĐỌC (read-digest.mjs --knowledge): mọi tệp knowledge mà quyết định dẫn ra và slot hfs của mọi bản ghi đã viết, kèm sha256 của từng tệp."
  - id: doc-gate
    path: shared
    content:
      en: shared
      vi: "Cổng tài liệu của vòng cuối (starci gate run --scope docs): kết quả từng docChecks - doc-language, check-work-surfaces, check-work-deep, check-example-work, check-contract-cites, check-json-exceptions - exit và từng lỗi."
steps:
  - reads: [standard, target]
    writes: [read-digest]
    action:
      en: "READ the standard before deciding (knowledge/op-gate.yaml proofs.read-knowledge): run starci gate read --root <app> --touch <every record this op will write> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/patterns/repo/folder.yaml <and the knowledge/patterns/{be,fe} files of the code kinds the document describes> --out $STARCI_JOB_SCRATCH/read-digest.json, and read what it records - the knowledge files in place and the hfs slot map of each record (slot, tier, rules). A document that describes code names its parts the way the standard does (slot, layer, pattern id), so the reader can follow it to the source; it is written in English (R96), like every document the app keeps. A record the op comes to write later is added with --touch and read the same way; REPORT with read-digest.json attached."
      vi: "ĐỌC chuẩn trước khi quyết định (knowledge/op-gate.yaml proofs.read-knowledge): chạy starci gate read --root <app> --touch <mọi bản ghi op sẽ viết> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/patterns/repo/folder.yaml <và các tệp knowledge/patterns/{be,fe} của loại mã mà tài liệu mô tả> --out $STARCI_JOB_SCRATCH/read-digest.json, rồi đọc những gì nó ghi - các tệp knowledge tại chỗ và bản đồ slot hfs của từng bản ghi (slot, tầng, luật). Tài liệu mô tả mã gọi tên các phần theo cách chuẩn gọi (slot, tầng, mã pattern), để người đọc lần tới nguồn; tài liệu viết bằng tiếng Anh (R96), như mọi tài liệu app giữ. Bản ghi phát sinh về sau được thêm bằng --touch và đọc theo cùng cách; BÁO CÁO kèm read-digest.json."
  - reads:
      - target
      - records
      - conventions
      - profile
    writes: [evidence]
    action:
      en: Bind the documentation scope - the documents this node owns, their audience and the coverage the
        assertions declare. Read the decided records first so the document restates settled intent.
        Resolve the execution profile and actual tool availability before selecting instruments;
        this does not switch the model/runtime or spawn workers. Documentation restates what records
        decided; it never decides anything itself, and an undecided question stays a documented open
        item, not a filled blank.
  - reads:
      - records
      - repo
      - conventions
    writes: [docs, evidence]
    action:
      en: Author or update the selected documents inside the existing conventions - each section grounded
        in a record id or an inspected source path, each command and symbol as observed. Preserve
        stable identity and correct existing material; where a fact is undecided or unverifiable,
        write the open question, never a guess.
  - reads:
      - repo
      - records
    writes: [evidence]
    action:
      en: Read the authored documents back against the source and records - every named command, path,
        symbol and behavior verified where it was claimed, every stale statement corrected or
        removed. A claim that cannot be traced is cut, not kept.
  - reads:
      - target
      - records
    writes: [node, docs, evidence]
    action:
      en: Declare the authored documents on the node, run the record-class validator `starci runtime validate`
        over the edited tree and report done once with the docs map and open questions. Never
        dispatch a successor.
  - reads: [standard, records]
    writes: [doc-gate]
    action:
      en: "FORCE THE DOCUMENT CHECKS after writing: run starci gate run --scope docs --tree <app>/.starciwork --out $STARCI_JOB_SCRATCH/doc-gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the findings per check (a document that is not English, a Work record with a dead surface or a stale proof, a cite of a file that does not exist, a JSON exception out of place); exit 2 means a check could not run and is never green. Still red after the last round: report blocked with the exact findings. Never report done while the document gate is red or could not run. REPORT with doc-gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA TÀI LIỆU sau khi viết: chạy starci gate run --scope docs --tree <app>/.starciwork --out $STARCI_JOB_SCRATCH/doc-gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi theo từng bộ kiểm tra (tài liệu không phải tiếng Anh, bản ghi Work có bề mặt chết hoặc bằng chứng lỗi thời, trích dẫn tới tệp không tồn tại, ngoại lệ JSON sai chỗ); exit 2 là một bộ kiểm tra không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi. Không bao giờ báo done khi cổng tài liệu đỏ hoặc không chạy được. BÁO CÁO kèm doc-gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci runtime validate` and, on every record directory it writes, `starci runtime validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: grounded
    requirement:
      en: Every documented claim traces to a decided record id or an inspected source path - the docs-map
        lists the citation per claim, and an untraceable statement is absent, not present.
  - id: coverage
    requirement:
      en: The declared documentation scope is covered - every owned document authored or updated, every
        required section present - and whatever stayed undocumented is named with its reason.
  - id: records-preserved
    requirement:
      en: The operation authored documents only - no decided record was restated into something else, no
        repository source was written, and no scope, dependency or acceptance was touched to obtain
        pass.
  - id: read-knowledge
    requirement:
      en: "starci kernel settle re-reads the attached read-digest.json (runtime check op-proof, proof read-knowledge): a done whose digest is missing (op-read-digest-missing), names no knowledge file or leaves a written record without its hfs slot (op-read-digest-no-knowledge) is refused."
      vi: "starci kernel settle tự đọc lại read-digest.json đính kèm (check op-proof, proof read-knowledge): done thiếu bản tóm tắt (op-read-digest-missing), không nêu tệp knowledge nào hoặc có bản ghi đã viết thiếu slot hfs (op-read-digest-no-knowledge) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
  - id: doc-gate
    requirement:
      en: "starci kernel settle re-reads the attached doc-gate.json (runtime check op-proof, proof doc-gate): a done without it (op-doc-gate-missing), with a check that could not run (op-doc-gate-tool-failed) or with a finding (op-doc-gate-red) is refused."
      vi: "starci kernel settle tự đọc lại doc-gate.json đính kèm (check op-proof, proof doc-gate): done thiếu nó (op-doc-gate-missing), có bộ kiểm tra không chạy được (op-doc-gate-tool-failed) hoặc có lỗi (op-doc-gate-red) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
judge:
  - by: machine
    measures: [declared-checks, work-hygiene, op-proof:doc-gate, op-proof:read-knowledge]
    proofs: [binding, doc-gate, read-knowledge]
    why: "the settler re-runs the record validator over the records written, the Work files are checked for hygiene, the document gate (language, work surfaces, contract cites) is re-run natively and the READ of the standard is re-read from the digest"
blockers:
  - code: RECORD_UNSETTLED
    condition:
      en: The records the document must describe are missing, not decided or self-contradictory - report
        the exact record ids as the applicable record gap; documentation cannot settle a question
        the records left open.
  - code: SOURCE_OF_TRUTH_MISSING
    condition:
      en: The code or existing documentation the document must describe cannot be resolved, so grounding
        is impossible; report the exact missing input.
  - code: AUTHORITY_REQUIRED
    condition:
      en: Covering the declared scope needs an authority the goal does not grant, such as publishing or
        writing beside product code - report blocked with blocker kind authority, an owner decision.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: shared
  app: shared
  bound-paths: shared
  docs-dir: Tree directory that owns the selected documents
  doc: Stable document slug inside that directory
layoutPolicy:
  checks: [starci-validate]
policy:
  docsPolicy:
    sourceOfTruth: records-and-inspected-code
    repoWrite: never
    untraceableClaim: cut-not-kept
    openQuestions: recorded-honestly
route:
  nodeKinds: [operations]
  phase: [implement, implementation]
  intent: [docs, documentation, write]
  prerequisites: [decided records/behavior exist]
