schema: starci/op@1
id: backend.implement
goal:
  en: Implement one selected backend outcome and prove its declared contract on actual code.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then gate.mjs the op loop runs before it stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml)."
      vi: "Số vòng SỬA rồi chạy lại gate.mjs của vòng lặp op trước khi dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml)."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits
  - no commits of its own - the runtime commits a green settle as the workflow's checkpoint
  - tests in declared sandbox
  - only selected owned development runtime setup and probes needed to verify this implementation;
    no production deployment
graphPolicy:
  mode: read-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: application-stacks
    path: shared
    purpose:
      en: shared
  - id: target
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    purpose:
      en: "The existing selected implementation record, its feature scope, declared
        refs/dependsOn/proof demands and validator freshness. Requirement and design Work leaves
        can still read `state: todo` after their decide jobs settle; the source artifacts from a
        declared dependency may already be present at HEAD (a learn-content leg
        observed exactly this)."
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance ids declared as relevant
        inputs in the selected flat Work graph. Intent governs expected behavior; source is not a
        replacement. Do not invent a mandatory BA predecessor for a scope that does not require one;
        a needed missing input is a reported graph/scope gap, not a new dependency silently added
        here.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,data,integration}/**/index.yaml
    purpose:
      en: Read data ownership, operations/API/events, boundaries, code-scope and rationale declared by the
        selected flat Work graph; distinguish proposed paths from observed files. No universal
        design-first op chain is implied; report genuinely missing required scope before proceeding.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: shared
  - id: profile
    path: shared
    purpose:
      en: shared
  - id: op-loop
    path: shared
    purpose:
      en: shared
      vi: "Dữ liệu của vòng lặp op: bảng loại tệp sang tệp pattern, app ví dụ cho từng phía, và schema của cổng và bản tóm tắt đọc mà read-digest.mjs và gate.mjs dùng."
writes:
  - id: node
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    fields: [state, evidence, blockedBy]
    content:
      en: Read the existing selected scope, expected proof demands and flat Work graph unchanged. Write
        only state/evidence/blockedBy here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic record prose. Missing
        refs/dependsOn/acceptance require a reported gap or separately selected scope update; never
        add/remove them to obtain pass.
  - id: source
    path: <app>/<write-ceiling>
    content:
      en: shared
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, lineage.json, result.md]
    content:
      en: "Store actual command, cwd/repo, source commit/tree, environment, exit code, counts and
        expected/actual per required proof, with raw sanitized output attached from STARCI_JOB_SCRATCH through starci kernel report. Operator-specific
        observed result in evidence/result.md: Map each AC/operation to delivered repo/path/symbol and
        actual commit. Preserve business and architecture authority; unknown rules are blockers, not
        implementation defaults. This implement op owns lint, typecheck, relevant tests/coverage,
        affected builds and Sonar. Resolve real repository scripts and CI thresholds; record
        command, source tree/commit, result and sanitized logs. The lint, typecheck and slice-spec proof is the
        op loop's gate.json (the gate step below): findings the base already has are repository debt owed to
        code.refactor and measured by review.verify's whole-repository starci app lint, never an open item of this slice. Unit coverage is the
        runner's: `starci gate unit --root <app>` runs the unit project with coverage and fails below its per-file 100
        threshold on every measured file of the coverage scope (the `ruleParams.be.logicRoles` roles of the `coverage: required`
        slots, R204); Sonar judges the same files: `sonar-local.mjs scan` first runs the
        unit specs related to every measured file this slice touched with coverage into be/coverage/lcov.info, and the
        slice fails when one of them is below 100 (not while specs.unit is off). The app's full
        unit suite (`npm test`) is never an attempt's run (owner 2026-09-29): this op writes or updates the unit specs of the spec-required subjects it adds or changes and the specs that cover the measured files it touches, and runs only those and the specs that import them; the whole unit suite is unit.verify's or /starci release's
        (CONTEXT.md useful verification). Run Sonar only through
        `node <Source>/.claude/scripts/gates/sonar-local.mjs scan --cwd <absolute repository root>
        --wait --isolate --base <source commit recorded before
        this slice's first edit> --paths <owned paths, comma-separated> --out <STARCI_JOB_SCRATCH>/checks/sonar.json --log
        <STARCI_JOB_SCRATCH>/checks/sonar.txt` in this same attempt; attach both files at starci kernel report (--isolate analyses only the
        slice in a throwaway project: minutes, where a whole repository analysis took 17-40
        minutes for a 1-5 file slice): it scans against the local SonarQube the
        stack declaration names (default the source host's dev stack), takes the project key, host
        and token from that declaration and its custody, creates the project and its analysis
        token when missing, and records the analysis/revision, the slice verdict, issue counts and
        dashboard URL; never run a bare scanner or supply a token by hand. The Sonar proof is this
        slice's own: outcome pass means no open blocker or critical issue and no to-review security hotspot on a line
        the slice changed, its duplicated share of the changed lines within the duplication
        threshold - the numbers are
        knowledge/sonar-gate.yaml's alone. The gate is enforced at settle: the runtime re-reads the
        attached sonar.json and refuses a done without outcome pass (sonar-gate-red, sonar-scan-refused,
        sonar-proof-missing); a scan that could not run (outcome blocked, unavailable true: server
        down, custody missing) is reported blocked, never done - the runtime records the explicit
        sonar-unavailable why and tells the Supervisor. The
        whole-project quality gate and debt outside the slice are recorded as projectGate, a note,
        never a block and never an open item. Scanner
        submission alone is not pass. Fix scoped failures and rerun affected checks. A
        helper outcome blocked (server down, custody missing), a missing runner or coverage target
        is blocked/not-run, never pass and never an owner credential ask; do not move this
        responsibility to architecture, business or UAT. Reuse existing authorization and keep
        secrets outside evidence. Test credentials a script, fixture or driver needs are generated per run (node:crypto randomBytes) or, only when they must stay stable across runs, kept the way the repo keeps every credential - .starcistacks/<stack>/secrets/test/<name>, stored with the repo's own stack-secret set command (npm run secret:set) so only the sops .enc twin is committed, read with testSecret(<name>, {repo}) (scripts/uat/test-secret.mjs; owner:push-scan-test-secrets-encrypted) - never written as a literal; the push secret scan refuses a plaintext test password. A repository-wide gate (typecheck, lint or tests over the whole
        tree) red only on files this slice did not change and that import nothing it changed,
        while the slice's own scoped runs pass, is another op's defect (modules/ops/_common.yaml
        Bounded finish and blockers (d)): record that check with its real exit code and `failing`
        naming each failing file `path[:line]`, and a rootCause {self:false, node:<the owning op
        or workflow when you can tell>, category: shared-change, evidence, expectedFix}; it is
        never an open item, never partial and never a blocker, and it never turns an otherwise
        green done into anything else - starci kernel record-checks attributes it to the peer whose commit left it
        (peerBlocked) and the Kernel routes it there. Legs that filed partial for exactly this
        were re-run for hours on files they may not touch."
  - id: apiDelivery
    path: evidence/**
    fields: [operations, request, response, errors, authorization, codeRefs, servedVersions, endpoint, probeEvidence]
    artifacts: [api-contract.json, runtime.json]
    content:
      en: When the selected consumer needs a runnable backend, deliver the implemented API
        request/response/error/authorization contract and actual served build references. Reuse or
        start only the authorized owned development target and record its identity and probes. No
        production deploy, API success or runtime readiness is inferred merely from a source commit.
        Standalone source-only work records runtime not requested instead of claiming readiness.
  - id: read-digest
    path: shared
    content:
      en: shared
      vi: "Bản tóm tắt ĐỌC: các tệp sẽ sửa, bản đồ slot của chúng từ starci app explain, và mọi tệp pattern và ví dụ đã đọc kèm sha256."
  - id: gate-proof
    path: shared
    content:
      en: shared
      vi: "Báo cáo cổng của vòng cuối: exit, commit gốc, head, các tệp đã đổi, số lỗi mới và lỗi có sẵn, và từng lỗi mới."
steps:
  - reads: [op-loop]
    writes: [read-digest]
    action:
      en: "READ before coding (op loop, knowledge/op-gate.yaml): run starci gate read --root <app> --touch <every file the slice will create or change> --out $STARCI_JOB_SCRATCH/read-digest.json and read exactly what it lists, nothing wider - the knowledge/patterns/{be|fe}/*.yaml of each touched file kind, the matching example files of examples/<app>/{fe,be} and the slot map starci app explain prints per path (slot, tier, allowed imports, rules). Code only after this read; a file the slice comes to touch later is added with --touch and read the same way."
      vi: "ĐỌC trước khi viết code (vòng lặp op, knowledge/op-gate.yaml): chạy starci gate read --root <app> --touch <mọi tệp slice sẽ tạo hoặc sửa> --out $STARCI_JOB_SCRATCH/read-digest.json và đọc đúng những gì nó liệt kê, không rộng hơn - các tệp knowledge/patterns/{be|fe}/*.yaml của từng loại tệp sẽ sửa, các tệp ví dụ cùng slot trong examples/<app>/{fe,be} và bản đồ slot mà starci app explain in cho từng đường dẫn (slot, tầng, import được phép, luật). Chỉ viết code sau bước đọc này; tệp phát sinh về sau được thêm bằng --touch và đọc theo cùng cách."
  - reads:
      - application-stacks
      - repo
    writes: [source]
    action:
      en: "CUT SEAM CONTRACT-FIRST (only when the packet carries context.cut; scripts/kernel/seam-policy.mjs,
        modules/kernel/driver-loop.yaml enqueue.cutExecution seamContractFirst). As ordinal 1 of a cut of
        more than one you are the seam: before anything else author its interface - types,
        DTOs, ports/contracts and a stub implementation inside your owned paths - then publish it with
        `starci kernel cut-seam --publish-interface --job <your job> --files <interface files>` so every
        sibling ordinal starts on it at once; then finish the seam and keep the published signatures
        stable (a change after publishing owes the siblings a reconcile). As a sibling (ordinal > 1)
        whose packet carries context.cut.seamStub the seam has not landed: never wait for it and never
        edit its paths - build against its published interface, or when none is published write the
        minimal stub of what you need from it inside your own owned paths, named so the real seam
        replaces it, and list every such assumption in the report's seamAssumptions
        [{symbol, assumption, file?}]. When the seam lands the Kernel re-verifies your slice against it
        (cut-seam-reconcile): a light re-check, never a redo."
  - reads:
      - application-stacks
      - target
      - business
      - architecture
      - repo
      - profile
    writes: []
    action:
      en: "Require the selected target record to exist; if absent, report the scope/graph gap for a
        separately selected scope op, without creating its acceptance or graph here. Treat reviewed
        requirement/design Work leaves still marked todo as semantic refs after their decide jobs
        settle, not as missing prerequisites. For a declared implementation or contract dependency,
        report DECLARED_DEPENDENCY_UNMET only when an artifact this slice needs is absent at HEAD;
        name the artifact, where you looked and its dependency id. Bind the exact operation/AC set
        and inspect existing code plus sibling conventions, including
        DI/module registration and every relevant caller. Reuse already conforming behavior. Own
        preparation through delivery: inspect readiness and reproduce the requested defect when
        applicable, partition the selected work into cohesive changes and check callers before
        editing. Resolve repository-local dependencies and bounded development runtime needs under
        the existing scope. Shared library changes belong to the actual FE or BE package owner:
        include owner tests, packaging/export compatibility and selected consumer integration proof
        in this same implementation; never publish a package implicitly. Keep shared paths exclusive
        and report a missing required external authority rather than inventing a helper. Resolve the
        execution profile and actual tool availability before selecting instruments; this does not
        switch the model/runtime or spawn workers. Classify implementation feedback before stopping:
        repository paths, private helper names, library calls and other reversible source-local
        choices are owned here and do not require spec expansion. A changed observable outcome,
        actor permission, money or customer-data rule is an srs-gap; a missing logical owner,
        contract, authority boundary, durable state/effect, compatibility, material failure/recovery
        or quality mechanism is an sds-gap. Report a spec-affecting finding with the exact observed
        fact, affected semantic ids and smallest proposed delta; never edit requirement or design
        records in this op. CALL POINT (discovery, implementation or verification): when an observed
        source/test fact proves the accepted design technically missing or contradictory while
        requirements stay unchanged, report outcome blocked with blocker kind `sds-gap` carrying
        that fact, the affected sds ids and the smallest proposed delta. The kernel routes it by
        modules/models/kinds.yaml route `sds-gap-revises-the-design` to `architecture.revise`
        (operator architecture.decide) and reopens this op behind it; the backend worker never
        edits design records and never calls another op. When reopened, start a fresh backend
        attempt from the revised design revision and rerun every affected check. If requirements,
        owner or accepted scope must change, report `srs-gap` or `authority` instead of
        `sds-gap`."
  - reads:
      - business
      - architecture
      - repo
    writes: [source]
    action:
      en: Implement transport, validation, permission checks, use-case logic and persistence inside the
        declared ownership. Enforce denials before unauthorized side effects; do not invent fallback
        behavior.
  - reads:
      - business
      - architecture
      - repo
    writes: [source]
    action:
      en: Implement declared transaction, retry/idempotency, concurrency, error identity and read-time
        revalidation. Migrations are source only; applying them remotely is not included.
  - reads:
      - repo
      - target
    writes: [source, evidence]
    action:
      en: Add or repair scoped unit tests - for a todo target work.author wrote in planned mode, create
        exactly the owner paths and test paths its owners and checks name - then execute only those
        specs (the specs of the changed or added source and the specs that import it, never the whole
        repository suite) and retain
        command, exit code, counts and sanitized output. Positive, denial, invalid-input and applicable
        race/reload cases must map to the selected operations in the unit specs. E2E runs MANUALLY
        only (owner ruling 2026-09-29) - this operator does not run the e2e suite, typecheck:e2e or any
        be/src/tests/e2e/ code; backend E2E proof belongs to a separately selected e2e.verify leg that the
        goal explicitly asked for. After the unit gate passes, run the routine gates - typecheck, lint,
        canon, build - plus required coverage (unit runs only) and Sonar against the same source
        revision; an unavailable runner or not-run required gate is blocked/not-run rather than pass. Preserve failures, repair only within the
        approved goal, rerun affected gates, and never delegate this responsibility to frontend or
        UAT.
  - reads:
      - repo
      - target
    writes: [node, evidence, apiDelivery]
    action:
      en: Review the diff and verify no unrelated changes. A passing backend delivery requires scoped unit
        evidence, every applicable routine quality gate, the exact tested source tree, API
        contract, authorization/error behavior, and runtime identity when the consumer requires a
        runnable API. Never commit - the runtime commits your green settle as the workflow's checkpoint;
        prove the tested tree is the working tree you report (its changed paths), or report no-change honestly.
        A frontend support response must return codeRefs, changedPaths, apiContract, runtime,
        qualityEvidence and testedCommit bound to the caller request. Missing or not-run unit or
        routine-gate proof, a tested-tree mismatch, or unavailable required served runtime blocks the handoff, so
        frontend cannot consume it as verified backend. Never commit, stage, bypass hooks, push or
        invent proof.
  - reads: [op-loop]
    writes: [gate-proof]
    action:
      en: "FORCE THE CHECKS after coding: run starci gate run --root <app> --changed <the files the slice changed> [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the new findings (lint per file and rule, tsc per message, failing specs - a finding the base already has never counts); exit 2 means a tool could not run and is never green. Still red after the last round: report blocked with the exact findings of that gate.json. Never report done while the gate is red or could not run. REPORT with gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA sau khi viết code: chạy starci gate run --root <app> --changed <các tệp slice đã đổi> [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi mới (lint theo tệp và luật, tsc theo thông điệp, spec thất bại - lỗi đã có trên commit gốc không bao giờ bị tính); exit 2 là một công cụ không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi trong gate.json đó. Không bao giờ báo done khi cổng đỏ hoặc không chạy được. BÁO CÁO kèm gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci runtime validate` and, on every record directory it writes, `starci runtime validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: commit
    requirement:
      en: Never commit or stage. Inspect the exact working-tree diff and actual tests, report the changed paths and the
        tested tree per repository, and separately retain integration/tested mappings; the runtime commits a green
        settle as this op's checkpoint on wf-<workflowId>. Report no-change honestly.
  - id: behavior
    requirement:
      en: Scoped unit tests pass for each declared operation facet, including negative authorization and
        persistent state when promised. Compile-only, missing-runner or not-run output cannot certify
        backend behavior. Backend E2E (real boundary, persistence, authorization) is proven only by an
        explicitly selected e2e.verify leg, run manually; it is never a routine gate of this operator.
  - id: implementation-quality
    requirement:
      en: This operator owns the routine gates - scoped unit, typecheck, lint, canon, affected builds -
        plus coverage from unit runs only and Sonar. Evidence records command, environment, tested
        source tree/full commit, exit and counts for each gate. No e2e suite, e2e typecheck or e2e
        coverage runs here (E2E is manual only, e2e.verify). Sonar passes only as the sonar-local.mjs
        attached sonar.json summary with scope slice and outcome pass for the tested commit; the whole-project gate is a note, never a
        block. Scanner submission
        without the processed server result, a missing runner/dependency, or any not-run required
        gate is blocked rather than pass.
  - id: op-gate
    requirement:
      en: "starci kernel settle re-reads the attached gate.json (exit 0 over the slice's changed files) and read-digest.json (a pattern file named for every touched file kind) and records the runtime check op-gate; a done without them, with a tool that could not run or with a new finding is refused, and the Kernel re-runs the same gate on the branch at landing."
      vi: "starci kernel settle tự đọc lại gate.json đính kèm (exit 0 trên các tệp slice đã đổi) và read-digest.json (có tệp pattern cho mọi loại tệp đã sửa) rồi ghi check op-gate; done thiếu chúng, có công cụ không chạy được hoặc có lỗi mới đều bị từ chối, và Kernel chạy lại đúng cổng đó trên nhánh khi land."
blockers:
  - code: BUSINESS_UNKNOWN
    condition:
      en: Implementation reaches a rule not decided by the accepted requirement records.
  - code: SCOPE_WIDENING
    condition:
      en: Required operation, owner or protected path lies outside selected code-scope.
  - code: PROOF_UNAVAILABLE
    condition:
      en: A required check cannot execute or does not prove the declared behavior.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: An artifact this slice needs from a declared prerequisite (an exported symbol, module, table,
        contract file or route) is absent at HEAD, or a required declared input/scope is missing. A
        dependency whose Work record reads `state todo` is not unmet by that alone (reads.target).
        Report node/resource IDs with the missing artifact and propose a separately selected graph
        update when needed; never run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the intake or migration, inside the operation allowlist
  repository: shared
  name: shared
  app: shared
  bound-paths: shared
  write-ceiling: shared
layoutPolicy:
  checks: [starci-validate]
policy:
  # specsToggle: what this op does when the owner's config.yaml specs.<class> is false (scripts/route/spec-deferral.mjs):
  # defer-leg = never dispatched, settled deferred; skip = runs without that class of test or coverage; not-counted = the gate does not demand it.
  specsToggle: {unit: skip, e2e: skip}
  qualityPolicy:
    owner: backend.implement
    checks: [lint, typecheck, unit, canon, coverage, build, sonar]
    requiredResult: pass
    unitGate: scoped-unit-pass-for-tested-revision
    backendE2EGate: manual-only-e2e-verify-leg-when-goal-asks
    handoffBinding: api-contract-runtime-quality-evidence-and-tested-commit
    sonarGate: slice-new-code-pass-for-tested-revision
    sonarProjectGate: note-never-block
    sonarEnforcement: settle-refuses-done-without-pass-unavailable-is-explicit
    sonarAnalysis: isolated-slice
    fullSuite: cut-set-closing-pass-or-release-checkpoint
    repoWideRedOutsideSlice: record-failing-with-rootCause-never-partial
    missingRunner: blocked
    canDelegateResponsibility: false
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [implement, backend, code, api, build]
  prerequisites:
    - business.decide settled pass (reviewed requirement seed; Work leaves remain todo)
    - architecture.decide settled pass (reviewed design seed; Work leaves remain todo)
  riskHints: [source-edits]
