schema: starci/op@1
id: backend.implement
goal:
  en: Implement one selected backend outcome and prove its declared contract on actual code.
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits
  - scoped local commits when authorized
  - tests in declared sandbox
  - only selected owned development runtime setup and probes needed to verify this implementation;
    no production deployment
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: application-stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md +
      docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
        load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
        credential custody, lifecycle commands and existing consumers. Run the static stacks check
        when validating a materialized stack; bind its exact inputs and limitations. Acceptance
        additionally requires the selected real startup, persistence, recovery and application
        checks. This conditional read grants no extra deployment or source scope.
  - id: target
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    purpose:
      en: "Read the existing selected implementation record, its feature scope, declared
        refs/dependsOn/proof demands and validator freshness. This consumer op requires its target
        record to exist. An absent target is a scope/graph gap: report it and propose a separately
        selected scope op; do not create a target or invent its acceptance/graph here. Current
        reviewed todo requirement/design inputs are semantic refs; the settled-pass decide jobs are
        the execution prerequisites. Do not require those specification refs to be Work state done
        before implementation."
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance ids declared as relevant
        inputs in the selected flat Work graph. Intent governs expected behavior; source is not a
        replacement. Do not invent a mandatory BA predecessor for a scope that does not require one;
        a needed missing input is a reported graph/scope gap, not a new dependency silently added
        here.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,data,integration}/**/index.yaml
    purpose:
      en: Read data ownership, operations/API/events, boundaries, code-scope and rationale declared by the
        selected flat Work graph; distinguish proposed paths from observed files. No universal
        design-first op chain is implied; report genuinely missing required scope before proceeding.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
        state; read applicable instructions, manifests, owning code, callers and relevant tests.
        Greenfield/spec-only work records source not-yet-created and grounds intent in the user
        request; no invented repository or fact citation. Source implementation still needs an
        actual selected writable repository.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    fields: [state, evidence, blockedBy]
    content:
      en: Read the existing selected scope, expected proof demands and flat Work graph unchanged. Write
        only state/evidence/blockedBy here; actual observations, findings, commit mappings and
        remaining cleanup belong to the evidence result, not semantic record prose. Missing
        refs/dependsOn/acceptance require a reported gap or separately selected scope update; never
        add/remove them to obtain pass.
  - id: source
    path: repository:<repo-id>/<write-ceiling>
    fields: [source files, tests, migration/assets/config only when selected]
    content:
      en: Only exact owned paths in the approved code-scope, with smallest required caller/integration
        changes; record actual diff and commit mapping, not proposed changes as delivered.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, tests.json, test-output.txt, lineage.json, result.md]
    content:
      en: "Store actual command, cwd/repo, source commit/tree, environment, exit code, counts and
        expected/actual per required proof, with sanitized original output. Operator-specific
        observed result in E/result.md: Map each AC/operation to delivered repo/path/symbol and
        actual commit. Preserve business and architecture authority; unknown rules are blockers, not
        implementation defaults. This implement op owns lint, typecheck, relevant tests/coverage,
        affected builds and Sonar. Resolve real repository scripts and CI thresholds; record
        command, source tree/commit, result and sanitized logs. Run Sonar only through
        `node <Source>/.claude/scripts/checks/sonar-local.mjs scan --cwd <repo-id> --wait --base
        <source commit recorded before this slice's first edit> --paths <owned paths,
        comma-separated> --out E/sonar.json --log E/sonar.txt` right after a fresh coverage run
        (the repository's test:ci) in this same attempt: it scans against the local SonarQube the
        stack declaration names (default the source host's dev stack), takes the project key, host
        and token from that declaration and its custody, creates the project and its analysis
        token when missing, and records the analysis/revision, the slice verdict, issue counts and
        dashboard URL; never run a bare scanner or supply a token by hand. The Sonar proof is this
        slice's own: outcome pass means no open issue and no to-review security hotspot on a line
        the slice changed and its changed lines meet the gate's new_coverage threshold. The
        whole-project quality gate and debt outside the slice are recorded as projectGate, a note,
        never a block and never an open item. A stale or missing lcov (older than the head commit
        or a slice file) is refused before the scan: run test:ci again and rescan. Scanner
        submission alone is not pass. Fix scoped failures and rerun affected checks. A
        helper outcome blocked (server down, custody missing), a missing runner or coverage target
        is blocked/not-run, never pass and never an owner credential ask; do not move this
        responsibility to architecture, business or UAT. Reuse existing authorization and keep
        secrets outside evidence."
  - id: apiDelivery
    path: E/**
    fields: [operations, request, response, errors, authorization, codeRefs, servedVersions, endpoint, probeEvidence]
    artifacts: [api-contract.json, runtime.json]
    content:
      en: When the selected consumer needs a runnable backend, deliver the implemented API
        request/response/error/authorization contract and actual served build references. Reuse or
        start only the authorized owned development target and record its identity and probes. No
        production deploy, API success or runtime readiness is inferred merely from a source commit.
        Standalone source-only work records runtime not requested instead of claiming readiness.
steps:
  - reads:
      - application-stacks
      - target
      - business
      - architecture
      - repo
      - profile
    writes: []
    action:
      en: "Bind the exact operation/AC set and inspect existing code plus sibling conventions, including
        DI/module registration and every relevant caller. Reuse already conforming behavior. Own
        preparation through delivery: inspect readiness and reproduce the requested defect when
        applicable, partition the selected work into cohesive changes and check callers before
        editing. Resolve repository-local dependencies and bounded development runtime needs under
        the existing scope. Shared library changes belong to the actual FE or BE package owner:
        include owner tests, packaging/export compatibility and selected consumer integration proof
        in this same implementation; never publish a package implicitly. Keep shared paths exclusive
        and report a missing required external authority rather than inventing a helper. Resolve the
        execution profile and actual tool availability before selecting instruments; this does not
        switch the model/runtime or spawn workers. Classify implementation feedback before stopping:
        repository paths, private helper names, library calls and other reversible source-local
        choices are owned here and do not require spec expansion. A changed observable outcome,
        actor permission, money or customer-data rule is an srs-gap; a missing logical owner,
        contract, authority boundary, durable state/effect, compatibility, material failure/recovery
        or quality mechanism is an sds-gap. Report a spec-affecting finding with the exact observed
        fact, affected semantic ids and smallest proposed delta; never edit requirement or design
        records in this op. CALL POINT (discovery, implementation or verification): when an observed
        source/test fact proves the accepted design technically missing or contradictory while
        requirements stay unchanged, report outcome blocked with blocker kind `sds-gap` carrying
        that fact, the affected sds ids and the smallest proposed delta. The kernel routes it by
        modules/models/kinds.yaml route `sds-gap-revises-the-design` to `architecture.revise`
        (operator architecture.decide) and reopens this op behind it; the backend worker never
        edits design records and never calls another op. When reopened, start a fresh backend
        attempt from the revised design revision and rerun every affected check. If requirements,
        owner or accepted scope must change, report `srs-gap` or `authority` instead of
        `sds-gap`."
  - reads:
      - business
      - architecture
      - repo
    writes: [source]
    action:
      en: Implement transport, validation, permission checks, use-case logic and persistence inside the
        declared ownership. Enforce denials before unauthorized side effects; do not invent fallback
        behavior.
  - reads:
      - business
      - architecture
      - repo
    writes: [source]
    action:
      en: Implement declared transaction, retry/idempotency, concurrency, error identity and read-time
        revalidation. Migrations are source only; applying them remotely is not included.
  - reads:
      - repo
      - target
    writes: [source, evidence]
    action:
      en: Add or repair scoped unit tests - for a todo target work.author wrote in planned mode, create
        exactly the owner paths and test paths its owners and checks name - then execute the
        repository's backend unit gate and retain
        command, exit code, counts and sanitized output. Next execute the relevant backend E2E gate
        against the actual backend contract, persistence and authorization boundary;
        browser/frontend UAT is not backend E2E. Positive, denial, invalid-input and applicable
        race/reload cases must map to the selected operations. Unit success cannot substitute for
        E2E, and an unavailable runner, dependency, environment or required case is blocked/not-run
        rather than pass. After both gates pass, run required lint, typecheck, coverage, build and
        Sonar checks against the same source revision. Preserve failures, repair only within the
        approved goal, rerun affected gates, and never delegate this responsibility to frontend or
        UAT.
  - reads:
      - repo
      - target
    writes: [node, evidence, apiDelivery]
    action:
      en: Review the diff and verify no unrelated changes. A passing backend delivery requires scoped unit
        and backend E2E evidence, every applicable quality gate, the exact tested source tree, API
        contract, authorization/error behavior, and runtime identity when the consumer requires a
        runnable API. Commit only when authorized, then read back the full SHA/diff and prove the
        tested tree corresponds to that commit; otherwise report uncommitted or no-change honestly.
        A frontend support response must return codeRefs, changedPaths, apiContract, runtime,
        qualityEvidence and testedCommit bound to the caller request. Missing or not-run unit/E2E
        proof, commit mismatch, or unavailable required served runtime blocks the handoff, so
        frontend cannot consume it as verified backend. Never bypass hooks, push, stage unrelated
        files or invent proof.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository, and
        separately retain integration/tested mappings. Report uncommitted or no-change honestly.
  - id: behavior
    requirement:
      en: Scoped unit tests and backend E2E tests both pass for each declared operation facet, including
        negative authorization and persistent state when promised. Compile-only, mocked-unit-only,
        frontend browser UAT, missing-runner or not-run output cannot certify backend behavior.
  - id: implementation-quality
    requirement:
      en: This operator owns separate scoped unit and backend E2E gates plus lint, typecheck, coverage,
        affected builds and Sonar. Evidence records command, environment, tested source tree/full
        commit, exit and counts for each gate. Backend E2E must exercise the actual backend boundary
        and cannot be replaced by frontend browser UAT. Sonar passes only as the sonar-local.mjs
        E/sonar.json summary with scope slice and outcome pass for the tested commit, scanned after
        a fresh coverage run of the same attempt; the whole-project gate is a note, never a
        block. Scanner submission
        without the processed server result, a missing runner/dependency, or any not-run required
        gate is blocked rather than pass.
blockers:
  - code: BUSINESS_UNKNOWN
    condition:
      en: Implementation reaches a rule not decided by the accepted requirement records.
  - code: SCOPE_WIDENING
    condition:
      en: Required operation, owner or protected path lies outside selected code-scope.
  - code: PROOF_UNAVAILABLE
    condition:
      en: A required check cannot execute or does not prove the declared behavior.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the intake or migration, inside the operation allowlist
  repository: Implementation repository segment under impl/
  name: Implementation record folder
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  commitPolicy:
    mode: scoped-local-commit
    ownership: exact-selected-paths
    verify: git-readback-full-sha-and-diff
    push: false
    reuseAuthorization: true
    noChange: return-existing-verified-commit-no-empty-commit
  qualityPolicy:
    owner: backend.implement
    checks: [lint, typecheck, unit, backend-e2e, coverage, build, sonar]
    requiredResult: pass
    unitGate: scoped-unit-pass-for-tested-revision
    backendE2EGate: scoped-backend-e2e-pass-for-tested-revision
    handoffBinding: api-contract-runtime-quality-evidence-and-tested-commit
    sonarGate: slice-new-code-pass-for-tested-revision
    sonarProjectGate: note-never-block
    coverageFreshness: lcov-from-this-attempt-newer-than-head
    missingRunner: blocked
    canDelegateResponsibility: false
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [implement, backend, code, api, build]
  prerequisites:
    - business.decide settled pass (reviewed requirement seed; Work leaves remain todo)
    - architecture.decide settled pass (reviewed design seed; Work leaves remain todo)
  riskHints: [source-edits]
