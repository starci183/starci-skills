schema: starci/op@1
id: goal.revise
goal:
  en: Produce goal v(n+1) from the frozen goal v(n) and the requested change - explicit diff, rev
    bumped by exactly one - while never silently widening authority; a scope or authority change is
    an owner decision, not an edit.
nodeKinds: [operations]
completionProfile: operations
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: shared
  prerequisiteState: done
  dispatch: never
reads:
  - id: goal
    path: the dispatch contract's context (starci kernel op-contract) — the kernel binds the approved goals row
    purpose:
      en: Read the frozen goal exactly as approved - its rev, done metrics, scope, allocations and the
        digest every derivation binds.
  - id: revision
    path: the requested change - critique outcome, owner instruction or typed revision request
    purpose:
      en: Read what is being asked to change and why, exactly as raised. A request that changes scope,
        authority or the done metrics is classified before it is applied; the reason travels with
        the revision into the diff.
  - id: derivations
    path: .starciwork/**/index.yaml + records and reports bound to the current goalRev
    purpose:
      en: Read the records, assertions, op bindings and reports that were derived from the goal being
        revised, so the diff can name every section each derivation depended on. Stale marking
        belongs to the kernel's invalidation machinery; this op names the changed sections, it does
        not rewrite the derivations.
  - id: profile
    path: shared
    purpose:
      en: shared
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence]
    content:
      en: Write only state/blocker/completion on this operation's own node; the revision belongs to the
        goal files and the diff to the evidence result.
  - id: goal
    path: <write-ceiling>/goal.{json,md}
    schema: starci/goal@1
    fields: [schema, rev, sections, done, derivedFrom]
    artifacts: [goal.json, goal.md]
    content:
      en: Write goal v(n+1) whole - goal.json carries schema starci/goal@1, goal.md its human rendering -
        these are the only runtime artifacts this op writes and they travel as report evidence; the
        kernel persists the revision as the goals row (runtime.sqlite goals/jobs/inbox/
        reports/events rows are never op output) - rev bumped by exactly one, derivedFrom naming the
        previous rev and its digest, done still a checkable metrics block. Every changed section is
        carried at its new value; sections the revision did not touch are carried byte-identical. A
        direct edit that leaves no diff, a rev jump other than +1, or a done block the kernel cannot
        evaluate is not a revision.
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, extensions]
    artifacts: [manifest.yaml, goal-diff.json, result.md]
    content:
      en: "Record the explicit diff - per section: unchanged, changed with old and new value, added,
        removed - the reason for each change, the derivations each changed section affects, and the
        authority classification of every edit. Operator-specific observed result in evidence/result.md:
        the rev transition, the section-level diff summary and the invalidation surface the kernel
        applies."
steps:
  - reads:
      - goal
      - revision
      - derivations
      - profile
    writes: [evidence]
    action:
      en: "Bind the frozen goal, its rev and the requested change. Classify every requested edit before
        applying anything: content inside the approved envelope versus a scope, authority,
        allocation or done-metric change. Resolve the execution profile and actual tool availability
        before selecting instruments; this does not switch the model/runtime or spawn workers. The
        frozen goal is the base the diff applies to; a goal that was never approved is not revised
        here."
  - reads:
      - goal
      - revision
    writes: []
    action:
      en: A requested change that widens authority - new scope, new permitted effects, a relaxed metric, a
        new allocation the approval did not grant - is not applied. Report blocked with blocker kind
        authority naming the exact widening, or report ask with the typed options and one
        recommendation; the goal is never silently widened by an edit.
  - reads:
      - goal
      - revision
      - derivations
    writes: [goal, evidence]
    action:
      en: Apply the in-envelope edits and write goal v(n+1) - rev+1, derivedFrom the previous rev and
        digest, the explicit section diff recorded, the done block still checkable. Name every
        derivation each changed section affects so the kernel's invalidation machinery marks them
        stale; derivations themselves are never edited here.
  - reads:
      - goal
      - derivations
    writes: [node, evidence]
    action:
      en: Validate the new goal - `starci runtime validate` over the node and evidence layout, goal.json carrying
        schema starci/goal@1, ids stable, done metrics still evaluable, rev exactly +1, diff
        complete - and report done once with the rev transition and the invalidation surface.
        Reports settled on the predecessor rev stay bound to it and never count toward the new one.
proofs:
  - id: rev-and-diff
    requirement:
      en: The new goal bumps rev by exactly one, names its predecessor and digest, and the recorded diff
        accounts for every changed, added and removed section - a goal that differs without a diff,
        or a diff that does not match the files, is a failure not a revision.
  - id: authority-preserved
    requirement:
      en: No edit widened scope, permitted effects, allocation or relaxed a done metric; every such change
        was classified and escalated to an owner decision instead of applied. The new goal's
        authority is a subset of the approved one unless the owner answered otherwise.
  - id: still-checkable
    requirement:
      en: The revised goal still carries a done block of checkable metrics and stable ids - a goal the
        kernel cannot evaluate is not a valid v(n+1) and is reported blocked, not written.
  - id: derivations-honest
    requirement:
      en: Every derivation a changed section affects is named for invalidation, and no derivation, report
        or evidence settled on rev n was rewritten or counted toward rev n+1.
judge:
  - by: machine
    measures: [declared-checks]
    why: "the settler re-runs every check of the report it can run itself; whether the new goal still carries checkable metrics is read by the Kernel when it evaluates the goal"
  - by: owner
    why: "a change of scope or authority is escalated as an owner decision and never applied as an edit (policy.goalPolicy.authorityWidening)"
blockers:
  - code: GOAL_CONTRACT_VIOLATION
    condition:
      en: The requested revision would leave the goal without a checkable done block, with unstable ids or
        with an inconsistent rev chain; report the exact violation instead of writing it.
  - code: AUTHORITY_WIDENING
    condition:
      en: The revision changes scope, permitted effects, allocation or relaxes a done metric - report
        blocked with blocker kind authority naming the widening, or ask with typed options; never
        apply it silently.
  - code: GOAL_UNRESOLVED
    condition:
      en: The frozen goal or the requested change cannot be resolved - no approved goal to revise, or the
        change is not stated enough to diff; report the exact missing input.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders: {}
layoutPolicy:
  checks: [starci-validate]
policy:
  goalPolicy:
    revBump: exactly-plus-one
    diff: explicit-required
    derivedFrom: previous-rev-and-digest
    authorityWidening: owner-decision-only
    silentWidening: never
    doneBlock: checkable-metrics-required
route:
  nodeKinds: [operations]
  phase: [decide, cross-cutting]
  intent: [goal, revise, amendment]
  prerequisites: [an approved goal exists]
