schema: starci/op@1
id: code.refactor
goal:
  en: Restructure one selected slice of code under a proven behavior invariant - the same regression
    check run before and after the change - never a behavior edit disguised as a refactor.
params:
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then gate.mjs the op loop runs before it stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml)."
      vi: "Số vòng SỬA rồi chạy lại gate.mjs của vòng lặp op trước khi dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml)."
  canonFamilies:
    type: string
    default: ''
    setBy: owner
    doc:
      en: "Comma-separated canon-scan families (a canon law such as shape-slot, architecture, or a lint
        plugin prefix) this slice drives to zero inside its owned paths; `all` names every family
        canon-scan reports and an empty value means the slice is no canon-conformance slice."
  canonWire:
    type: boolean
    default: false
    setBy: kernel
    doc:
      en: "True on the ONE serial canon-wire leg per wave of a canon cut (scripts/kernel/seam-policy.mjs
        canonCutPlanOf): it owns the shared root config (package.json, lockfile, tsconfig, eslint config, hfs.json;
        policy.canonConformance.sharedRoots is empty, owners are derived from slots), the consumers the slices listed as owedToWire and
        the contested relocations, and runs after every slice of its wave."
  resumeFrom:
    type: string
    default: ''
    setBy: kernel
    doc:
      en: "The preserved work a redone slice continues from: refs/heads/preserved/<workflow>/<job>, the
        snapshot the runtime kept of its blocked or failed attempt's owned paths at settle (ops never
        commit; scripts/kernel/seam-policy.mjs preservedRefOf, canonRedispatchOf). Empty starts from the
        checkout as it is."
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits that restructure without changing observable behavior
  - no commits of its own - the runtime commits a green settle as the workflow's checkpoint
  - the declared regression and architecture checks run before and after in their declared sandbox
graphPolicy:
  mode: read-only
  location: shared
  prerequisiteState: done-or-exact-workspace-canonicalization-proposal-with-regression
  dispatch: never
reads:
  - id: target
    path: N/index.yaml OR packet context.records -> exact bound scope.define
      record/extensions.work3.scope
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. Normally this consumer op requires its target node to exist. The
        one exception is proposalAuthority for workspace canonicalization: resolve the exact
        selected proposed id from the one explicitly bound scope.define record, confirm packet
        context.workflow binds the approved goal identity/revision, confirm this code.refactor leg
        follows the passed test.author leg in that revision, and confirm the declared regression
        file and source paths match the selected proposal. Do not scan .starciwork for alternatives.
        When any binding is absent or ambiguous, report DECLARED_DEPENDENCY_UNMET."
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,data,journey,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
        inputs in the selected .starciwork graph.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: A refactor that needs a different contract or boundary is a design change, not a refactor -
        report the gap instead of stretching this op.
  - id: repo
    path: <app>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read applicable
        instructions, manifests, the owning code, every caller and the existing tests. The
        restructure binds the exact inspected tree; a proposed change to a file that was not opened
        is not a refactor plan.
  - id: coverage
    path: <app>/<manifest-paths> + the slice's existing regression suite and its real
      runner
    purpose:
      en: Establish before any edit which declared check actually exercises the slice's observable
        behavior and that it can run in this environment.
  - id: conventions
    path: knowledge/coding-reference.yaml + knowledge/patterns/fe/index.yaml +
      knowledge/patterns/be/index.yaml
    purpose:
      en: The adopted naming, error-identity, structure and typing conventions, and the FE or BE pattern
        topics for the selected repository.
  - id: machines
    path: scripts/gates/gate.mjs + scripts/hfs/architecture/*.mjs + modules/models/code-patterns.yaml +
      docs/architecture-check.md
    purpose:
      en: When the slice lives in a checked app (`be/` or `fe/`), read the sealed architecture and
        code-pattern machines' supported arguments, report schema, exit codes and coverage limits.
        The same machine set runs verbatim BEFORE and AFTER the restructure; an architecture or
        pattern regression introduced by a pure refactor is a failure, not a refactor outcome. This
        read grants no fix-flag or repair authority.
  - id: canon
    path: scripts/gates/canon-scan.mjs + modules/models/canon-conformance.yaml + examples/shape-slot +
      packages/eslint/fe/README.md + packages/eslint/be/README.md
    purpose:
      en: For a canon-conformance slice, the finding inventory of the owned paths measured with the
        repository's own lint config against this runtime's canon source plus the architecture check,
        the reference tree each family converges to and the law that publishes each rule.
  - id: profile
    path: shared
    purpose:
      en: shared
  - id: op-loop
    path: shared
    purpose:
      en: shared
      vi: "Dữ liệu của vòng lặp op: bảng loại tệp sang tệp pattern, app ví dụ cho từng phía, và schema của cổng và bản tóm tắt đọc mà read-digest.mjs và gate.mjs dùng."
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here when N exists; actual observations, findings, commit
        mappings and remaining cleanup belong to the evidence result, not semantic node prose. When
        proposalAuthority is in use because N does not exist, omit this write entirely and leave the
        bound scope proposal byte-unchanged for workspace.manage to materialize later. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: <app>/<write-ceiling>
    fields: [restructured source files only]
    content:
      en: Only exact owned paths in the approved code-scope, restructured without observable behavior
        change - moves, renames, extractions, deletions of dead code and equivalent rewrites. No
        feature, fix, contract, schema or configuration change rides inside a refactor; a needed
        behavior change is a separate selected operation, never an edit hidden in this one.
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts:
      - manifest.yaml
      - regression-before.json
      - regression-after.json
      - architecture-before.json
      - architecture-after.json
      - canon-before.json
      - canon-after.json
      - typecheck-before.json
      - typecheck-after.json
      - diff-map.json
      - result.md
    content:
      en: "Store the exact regression command, cwd/repo, source commit/tree, exit code, counts and
        sanitized output for the before run and for the after run - the same command on both sides
        of the change. Store the same machine-check reports before and after where the slice lives
        in a checked repository. Map every moved or renamed symbol to its destination and record the
        full diff summary. Operator-specific observed result in evidence/result.md: the before/after parity
        statement with the observed outputs, and any behavior difference found - which is a failure,
        not a refactor outcome."
  - id: read-digest
    path: shared
    content:
      en: shared
      vi: "Bản tóm tắt ĐỌC: các tệp sẽ sửa, bản đồ slot của chúng từ hfs explain, và mọi tệp pattern và ví dụ đã đọc kèm sha256."
  - id: gate-proof
    path: shared
    content:
      en: shared
      vi: "Báo cáo cổng của vòng cuối: exit, commit gốc, head, các tệp đã đổi, số lỗi mới và lỗi có sẵn, và từng lỗi mới."
steps:
  - reads: [op-loop]
    writes: [read-digest]
    action:
      en: "READ before coding (op loop, knowledge/op-gate.yaml): run node scripts/gates/read-digest.mjs --root <app> --touch <every file the slice will create or change> --out $STARCI_JOB_SCRATCH/read-digest.json and read exactly what it lists, nothing wider - the knowledge/patterns/{be|fe}/*.yaml of each touched file kind, the matching example files of examples/<app>/{fe,be} and the slot map hfs explain prints per path (slot, tier, allowed imports, rules). Code only after this read; a file the slice comes to touch later is added with --touch and read the same way."
      vi: "ĐỌC trước khi viết code (vòng lặp op, knowledge/op-gate.yaml): chạy node scripts/gates/read-digest.mjs --root <app> --touch <mọi tệp slice sẽ tạo hoặc sửa> --out $STARCI_JOB_SCRATCH/read-digest.json và đọc đúng những gì nó liệt kê, không rộng hơn - các tệp knowledge/patterns/{be|fe}/*.yaml của từng loại tệp sẽ sửa, các tệp ví dụ cùng slot trong examples/<app>/{fe,be} và bản đồ slot mà hfs explain in cho từng đường dẫn (slot, tầng, import được phép, luật). Chỉ viết code sau bước đọc này; tệp phát sinh về sau được thêm bằng --touch và đọc theo cùng cách."
  - reads:
      - target
      - business
      - architecture
      - repo
      - coverage
      - conventions
      - machines
      - canon
      - profile
    writes: [evidence]
    action:
      en: "Bind the exact restructure request and inspect the slice plus every caller. A canon slice
        (params.canonFamilies set) IS its request: params.canonFamilies, its owned paths and
        context.cut.manifest bind it completely - it needs no scope.define record, target
        N/index.yaml or selected Work node, and proposalAuthority, migrationAuthority and their
        DECLARED_DEPENDENCY_UNMET record bindings never apply to it. Select the one
        declared regression check that exercises the slice's observable behavior and run it BEFORE
        the first edit, verbatim, keeping command, tree/commit, exit code, counts and sanitized
        output. Where the slice lives in a checked app side and context.cut is present,
        record the slice's admission commit (git rev-parse HEAD) before editing (with
        params.resumeFrom set, first apply that preserved work to your owned paths - git diff
        <resumeFrom>^ <resumeFrom> -- <owned paths> | git apply - and continue from the findings it
        left, never redoing it) and run node scripts/gates/gate.mjs
        --root ROOT --base <slice admission commit> --changed <owned paths>
        BEFORE the first edit. It gates only the slice's new findings. Without context.cut,
        run the whole-repository hfs lint --format json at ROOT
        BEFORE the first edit. Keep the machine report, exact command and exit code in either mode.
        For a cut slice in a TypeScript repository, the gate's tsc step (node scripts/gates/gate.mjs
        --root ROOT --base <slice admission commit> --changed <owned files>) is the typecheck: one program per
        tsconfig that owns a changed file, its base read from the admission commit's blobs, so other in-flight
        files are identical on both sides of the measurement. A repository-wide typecheck may be recorded as context, but
        its pre-existing errors outside the slice do not block this ordinal.
        When params.canonFamilies is set, run node scripts/gates/canon-scan.mjs
        --root ROOT --paths <owned paths> --families <params.canonFamilies> --json BEFORE the first
        edit as well: its findings are the slice's scope, the exact list this refactor removes. A green baseline is normally the invariant's left side. The sole
        exception is migrationAuthority: preserve the complete red baseline, map every failure to
        the bound workspace-canonicalization proposal, and proceed only when no unrelated failure
        exists. For context.cut, also bind the stable cut id/ordinal/total, complete path-union
        manifest and passed-ordinal state before editing: dispatch binds them in the packet as
        context.cut.manifest (ordinals[{ordinal, jobId, status, paths}], pathUnion, passed, open,
        absent, disjoint, wires), read from the ledger's cut set - bind that, never block for it or
        search the checkout for another manifest; an ordinal with no job yet is an open ordinal, not
        ambiguity. Only a manifest whose paths overlap your owned paths (disjoint false naming your
        ordinal) blocks. When a code-pattern or architecture machine answers unavailable (exit 2/3,
        SCRIPT_INPUT_UNAVAILABLE, an unresolved import or a repository obligation on a file outside
        your owned paths), that is a tool error, never the slice's blocker: record the raw result as
        a check with `toolError: true`, keep the same command for the after run, prove the slice
        with the machines that did run (canon-scan's lint families, the gate's new and preexisting counts,
        the gate's tsc step) and continue. No existing, covering, runnable check is reported `blocked` with blocker kind
        `test-gap` and this op stops; it never authors the missing tests itself, and it runs only the specs of the code it moved or changed and the specs that import it - never the whole repository suite (owner 2026-09-29). Resolve the
        execution profile and actual tool availability before selecting instruments; this does not
        switch the model/runtime or spawn workers. Never create the target or invent its
        acceptance/graph here. Intent governs the behavior that must be preserved; a needed missing
        input is a reported graph/scope gap, not a silently added dependency. Read the declared
        boundaries, contracts, data ownership and rationale the restructure must stay inside. The
        check must exist, cover the changed surface and run verbatim. Normally its baseline must be
        green. Under the exact workspace-canonicalization migrationAuthority, it may be red only
        where every failed assertion is the bound proposal's selected migration delta. Without
        context.cut it must become green after the edits. With cutSetAuthority, a non-final slice
        instead proves its exact-slice postcondition plus an unchanged, monotonic full-regression
        inventory whose remaining failures map only to unsettled sibling ordinals; the pass that
        closes the set (the last ordinal to settle, whichever it is) must make the unchanged full
        regression green. A missing, non-covering or unrunnable suite
        is reported `blocked` with blocker kind `test-gap`, which routes to test.author; it is never
        a reason to skip the proof or author coverage inside this op. Read the adopted naming,
        error-identity, structure and typing conventions the restructure must preserve or improve
        toward - a refactor that degrades declared pattern conformance is a regression, not a
        cleanup. Load the applicable FE or BE topic files for the selected repository only;
        conventions never authorize behavior changes."
  - reads:
      - architecture
      - conventions
      - canon
      - repo
    writes: [source]
    action:
      en: Restructure inside the declared write ceiling in the smallest behavior-preserving steps - move,
        rename, extract, inline, delete dead code - updating every inspected caller in the same
        change so the tree stays consistent and the adopted code conventions hold. A canon slice
        first applies the same canon-scan command with --fix, then restructures each remaining
        finding by hand toward examples/shape-slot and the owning law; a disable comment, a rule
        level change or a config ignore is never a fix. Public contracts,
        persisted shapes, wire protocols, error identities and observable side effects stay
        identical; when the requested restructure cannot hold them, stop at the boundary and report
        the gap instead of editing behavior.
  - reads:
      - coverage
      - machines
      - canon
      - repo
    writes: [evidence]
    action:
      en: Run the SAME regression check AFTER the change, verbatim, on the restructured tree and record it
        beside the before run; where the machines ran before, run the SAME gate.mjs
        command AFTER the change with the same --base for context.cut, its --changed naming the owned
        paths as they are now (moved destinations and files created under owned directories included),
        or the same whole-repository hfs lint for an uncut refactor. The gate measures a moved file
        against its old base path, so carried findings stay preexisting and only new findings gate;
        retain its report beside the before report.
        For a cut TypeScript slice, the gate.json's tsc findings are gating whether they appear in an owned
        file or an untouched importer; its preexisting count is advisory. A gate that could not run tsc
        (exit 2) is not a pass.
        The ordinal whose pass closes the cut set runs
        the whole-repository hfs lint --format json at ROOT ONCE
        after its gate run and records the whole-repository report and exit code with
        `full-regression-final`; non-final ordinals do not run this repo-wide lint check. Where
        canon-scan ran before, run it again without --fix on the same paths and families; it must
        report status ok. Parity
        normally means the same commands, same owned scope (including renamed destinations),
        same counts and the same green results. Under
        migrationAuthority without a cut it means the identical command/assertion inventory moves
        from only the declared migration failures to fully green. Under cutSetAuthority, a non-final
        ordinal runs the unchanged full command and may retain only failures mapped to unsettled
        sibling ordinals, while an independent exact-slice check is green and the failure inventory
        is monotonic; the pass that closes the set makes the full command green. Unrelated observable behavior
        remains unchanged. A different command, narrowed selection, rewritten assertion, post-edit
        failure or new architecture/pattern violation is failed with the diff between the two
        outputs. Nothing is re-worded or skipped to make the after run look green.
  - reads:
      - target
      - repo
      - coverage
    writes: [node, evidence]
    action:
      en: Review the actual diff and verify no unrelated or behavior-changing edit slipped in - the
        mapping of moved symbols to destinations must account for the whole change. Never commit - the
        runtime commits your green settle as the workflow's checkpoint; prove the tested tree is the
        working tree you report. Sonar gates every refactor - after the AFTER
        regression run, run Sonar only
        through `node <Source>/.claude/scripts/gates/sonar-local.mjs scan --cwd <absolute repository
        root> --wait --isolate --base <source commit recorded before
        this slice's first edit> --paths <owned paths, comma-separated> --out
        <STARCI_JOB_SCRATCH>/checks/sonar.json --log <STARCI_JOB_SCRATCH>/checks/sonar.txt` and attach both files
        at api report. The verdict is the slice's own - outcome pass means no open blocker or critical issue and
        no to-review security hotspot on a changed line, duplication within the
        numbers of knowledge/sonar-gate.yaml (a pure move or rename changes no line, so nothing new is
        held). The runtime re-reads that sonar.json at settle and refuses a done without outcome pass; a
        scan that could not run (outcome blocked, unavailable true) is reported blocked, never done - the
        runtime records the explicit sonar-unavailable why and tells the Supervisor. Report done exactly once with both regression
        runs bound; never report a refactor that kept only a before run or only an after run.
  - reads: [op-loop]
    writes: [gate-proof]
    action:
      en: "FORCE THE CHECKS after coding: run node scripts/gates/gate.mjs --root <app> --changed <the files the slice changed> [--tests <the slice spec pattern>] --out $STARCI_JOB_SCRATCH/gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the new findings (lint per file and rule, tsc per message, failing specs - a finding the base already has never counts); exit 2 means a tool could not run and is never green. Still red after the last round: report blocked with the exact findings of that gate.json. Never report done while the gate is red or could not run. REPORT with gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA sau khi viết code: chạy node scripts/gates/gate.mjs --root <app> --changed <các tệp slice đã đổi> [--tests <mẫu spec của slice>] --out $STARCI_JOB_SCRATCH/gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi mới (lint theo tệp và luật, tsc theo thông điệp, spec thất bại - lỗi đã có trên commit gốc không bao giờ bị tính); exit 2 là một công cụ không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi trong gate.json đó. Không bao giờ báo done khi cổng đỏ hoặc không chạy được. BÁO CÁO kèm gate.json và read-digest.json."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: proposal-binding
    requirement:
      en: When N does not yet exist in workspace canonicalization, the evidence names the one bound
        scope.define record, packet-bound workflow/goal identity and revision, selected proposed id,
        preceding passed test.author leg and exact authored regression file. The proposal remains
        byte-unchanged for workspace.manage, and no repository scan or alternate proposal satisfies
        this proof.
  - id: regression-parity
    requirement:
      en: "The same declared regression check ran verbatim before AND after the change, on the exact
        before tree and the exact after tree, with both exit codes, counts and outputs recorded; the
        after result matches the before result, except that the exact workspace-canonicalization
        migrationAuthority requires the bound declared migration failures before and a fully green
        result after with the assertion inventory unchanged, except for the explicit cutSetAuthority
        intermediate rule: non-final ordinals require green `cut-slice-postcondition` and
        `cut-regression-inventory`, while the pass that closes the set (the last ordinal to settle,
        whichever it is) requires green `full-regression-final`.
        Where the slice lives in a checked app side, the same gate.mjs check ran
        verbatim on both sides with its reports retained. For context.cut this is the
        --base <slice admission commit> --changed <owned paths> command: its after run follows
        renamed destinations from the base diff and gates only new findings.
        A cut TypeScript slice's gate.json (same admission base, owned files) carries no new tsc finding
        anywhere in its checked projects; its preexisting count does not change this verdict, including
        when repository-wide typecheck is red on untouched debt.
        The closing ordinal records one whole-repository hfs lint measurement with
        `full-regression-final`; an uncut refactor uses it on both sides. A new architecture or
        pattern violation after the change is a failure. A missing, different or narrowed check on
        either side is a failure, and no coverage at all is the `test-gap` blocker, never a silent pass."
  - id: canon-conformance
    requirement:
      en: When params.canonFamilies is set, evidence/canon-before.json and evidence/canon-after.json hold the same
        canon-scan command over the owned paths; the after report has status ok (every machine ran,
        zero findings of the selected families) except for findings the report lists as owedToWire,
        each naming the exact shared-root or consumer path outside the slice it waits on; the canon-wire
        leg's own after report over the wave's slice paths has status ok with none owed. The diff adds
        no lint directive, rule-level change or ignore entry.
  - id: behavior-invariant
    requirement:
      en: The diff is explainable as pure restructuring - every changed symbol maps to a move, rename,
        extraction or equivalent rewrite, no public contract, persisted shape, error identity or
        observable side effect changed, and no feature or fix rode inside the change. The exact
        migrationAuthority additionally permits only the selected canonical root/path-consumer
        binding delta while preserving all other behavior and custody invariants.
  - id: commit
    requirement:
      en: Never commit or stage. Inspect the exact working-tree diff and actual tests, report the changed paths and the
        tested tree per repository, and separately retain integration/tested mappings; the runtime commits a green
        settle as this op's checkpoint on wf-<workflowId>. Report no-change honestly.
  - id: op-gate
    requirement:
      en: "api settle re-reads the attached gate.json (exit 0 over the slice's changed files) and read-digest.json (a pattern file named for every touched file kind) and records the runtime check op-gate; a done without them, with a tool that could not run or with a new finding is refused, and the Kernel re-runs the same gate on the branch at landing."
      vi: "api settle tự đọc lại gate.json đính kèm (exit 0 trên các tệp slice đã đổi) và read-digest.json (có tệp pattern cho mọi loại tệp đã sửa) rồi ghi check op-gate; done thiếu chúng, có công cụ không chạy được hoặc có lỗi mới đều bị từ chối, và Kernel chạy lại đúng cổng đó trên nhánh khi land."
blockers:
  - code: TEST_COVERAGE_ABSENT
    condition:
      en: No existing regression check covers the slice's observable behavior or the covering check cannot
        run in this environment. Report blocked with blocker kind `test-gap`; the graph routes it to
        test.author and this op never writes the missing coverage itself.
  - code: SCOPE_WIDENING
    condition:
      en: The requested restructure needs a path outside the selected write ceiling; report the exact
        paths as blocker kind shared-change rather than widening the allowlist. A canon slice
        (params.canonFamilies set, params.canonWire false) whose remaining finding needs only a
        shared root config (package.json, lockfile, tsconfig, eslint config, hfs.json), a config file, a public entry
        (index.*) or parent folder outside its owned paths, or a consumer outside its owned paths is
        not blocked - it moves what it owns (its relocation grants are in its owned paths), commits,
        and reports done listing each such finding as owedToWire [{path, finding}]; the wave's
        canon-wire leg lands it. A canon slice that still settles blocked is followed up by settle
        itself (scripts/kernel/seam-policy.mjs canonSettleFollowUpOf) - a continuation from its commit
        (params.resumeFrom) owning the destinations its report names, and the shared, config and
        public-entry paths go to the canon-wire leg.
  - code: REQUIREMENT_UNSETTLED
    condition:
      en: The observable behavior, actor permission or business effect to preserve is not settled by the
        accepted requirement - report blocked with blocker kind srs-gap and the smallest affected
        semantic IDs; never pick a business reading in code. A source-local refactoring choice is
        not an SRS gap.
  - code: DESIGN_GAP
    condition:
      en: The design record is silent or contradictory about a material logical owner, public contract,
        authority boundary, durable state/effect, compatibility or recovery rule the restructure
        must preserve - report blocked with blocker kind sds-gap and the smallest affected semantic
        IDs. File layout, extraction shape and private helper choices are owned by this refactor and
        are not SDS gaps.
  - code: ENVIRONMENT_UNAVAILABLE
    condition:
      en: The declared regression runner, a declared architecture/code-pattern machine, a dependency or
        the sandbox cannot start here and the cause is provably unfixable from the allowlist -
        report blocked with blocker kind environment naming the exact missing piece. A machine that
        started and answered unavailable is not this blocker - it is a tool error recorded with its
        raw result (toolError true) while the slice proceeds on the machines that ran.
  - code: AUTHORITY_REQUIRED
    condition:
      en: Completing the request needs an authority the goal does not grant - report blocked with blocker
        kind authority, an owner decision, never a silent widening.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        For proposal-authorized workspace canonicalization this includes an absent explicit
        context.records binding, a scope record outside the packet-bound approved goal revision, an
        unpassed preceding test.author leg, zero/multiple matching proposed ids, or a
        missing/non-green declared regression. Report exact ids; never search for a substitute, run
        predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  app: shared
  bound-paths: shared
  manifest-paths: Manifest and script files defining the declared regression check
  write-ceiling: shared
layoutPolicy:
  checks: [starci-validate]
policy:
  # specsToggle: what this op does when the owner's config.yaml specs.<class> is false (scripts/route/spec-deferral.mjs):
  # defer-leg = never dispatched, settled deferred; skip = runs without that class of test or coverage; not-counted = the gate does not demand it.
  specsToggle: {unit: skip}
  proposalAuthority:
    scope: workspace-canonicalization-only
    permits: When the selected N/index.yaml does not exist yet, consume the exact proposed
      implementation target from the one scope.define record explicitly bound in packet
      context.records, but only for a workspace-canonicalization goal whose packet-bound revision
      contains this code.refactor leg after a passed test.author leg. The proposed id must equal the
      selected target id, its declared test dependency must be satisfied by the authored regression
      file, and the same covering regression command must run under the applicable refactor or
      migration proof below.
    forbids:
      - repository-wide discovery of a substitute scope record or proposed target
      - choosing another nodes[] entry because it appears compatible
      - materializing or editing the proposed Work node; workspace.manage owns later reconstruction
      - using a proposal without the packet-bound approved goal identity/revision and preceding
        passed test.author leg
      - treating the existence of a test path as proof; the declared regression must actually run
        before edits
  migrationAuthority:
    scope: workspace-canonicalization-only
    permits: Under proposalAuthority, the exact authored migration regression may be red before source
      edits and must be green after them. Every red baseline assertion must map to the selected
      proposal's declared canonical-root/path-consumer delta; any unrelated failure blocks before
      edits. This exception changes only the selected path/root bindings and their exact consumers.
      All other observable behavior, bytes, ids, refs, secrets, live effects and concurrent workflow
      state remain invariant.
    forbids:
      - accepting a collection-only check as the migration regression
      - editing when the red baseline contains an assertion not declared by the bound proposal
      - weakening, deleting or rewriting an assertion to obtain green
      - treating a post-edit red result as partial success
      - applying red-before/green-after semantics outside workspace canonicalization
  cutSetAuthority:
    scope: workspace-canonicalization-only
    appliesWhen: The dispatch packet carries context.cut {id, ordinal, total} with total >= 2, every cut
      job uses this same approved code.refactor semantic leg and exact goal/record binding, and the
      complete pairwise-disjoint path union was preflighted before the first slice launched.
    permits: "The unchanged full migration regression may remain red after a NON-FINAL cut only for
      assertions whose unresolved paths belong exclusively to not-yet-passed sibling ordinals in the
      same cut set. The current slice must pass an independently reproducible exact-slice
      postcondition, the full regression command and assertion inventory must remain byte-for-byte
      unchanged, the full failure set must not gain an unrelated assertion, and a failure already
      resolved by a passed ordinal may not reappear. Record the raw nonzero full-regression result
      as integration evidence, not as the slice's red verdict. The Kernel records two green checks
      for a non-final pass: `cut-slice-postcondition` and `cut-regression-inventory`. The pass that
      CLOSES the set - the last ordinal to settle, whichever it is, not the highest
      (inc-751dd1ac4492) - must additionally record `full-regression-final` green from the unchanged
      command; only then may the semantic leg advance."
    forbids:
      - declaring a non-final slice done from file edits alone or without an exact-slice executable
        check
      - accepting any new/unmapped failure, assertion inventory change, widened path or reappearing
        resolved failure
      - relabeling the raw full-regression exit code as green; the green inventory check proves only
        that its allowed residuals are exactly the unsettled sibling closure
      - advancing workspace.manage or the semantic code.refactor leg before every ordinal passes and
        the final full regression is green
      - using cut-set intermediate semantics when context.cut is absent, inconsistent or the
        complete closure partition is not durably known
  canonConformance:
    appliesWhen: params.canonFamilies is non-empty
    binding: params.canonFamilies + owned paths + context.cut.manifest are the whole request; no scope.define record, target node or context.records binding is required, and the workspace-canonicalization authorities (proposalAuthority, migrationAuthority, cutSetAuthority) do not apply
    partition: the cut is canon-scan's slices over the whole repository - one job per slice with its paths as owned paths and the same params.canonFamilies, the foundation wave settled before the shared wave and the shared wave before the surfaces wave
    excluded: paths another running workflow owns go to canon-scan --exclude and stay unsliced until it finishes
    lintSource: canon-scan resolves the repository's canon package import to this runtime's packages/eslint source, so the slice needs no published canon
    # scripts/kernel/seam-policy.mjs canonCutPlanOf reads these: the relocation a finding needs (the file
    # that moves - the finding's own file or its related import target - lands in <src>/<into>/<Owner>; the
    # role is the folder under src) is GRANTED to the slice at enqueue unless a sibling holds it.
    # sharedRoots is empty: HFS has no shared registration file (owners are derived from slots);
    # config files and contested relocations belong to the wave's ONE canon-wire leg, never to a slice.
    relocations:
      FE_SOURCE_LAYOUT_INVALID:
        moves: file
        into:
          features: [features/pages, features/layouts, features/overlays]
          components: [components/blocks, components/composites, components/branches, components/leaves, features/pages, features/layouts, features/overlays]
    sharedRoots: []
  qualityPolicy:
    owner: code.refactor
    checks: [sonar]
    requiredResult: pass
    sonarGate: slice-new-code-pass-for-tested-revision
    sonarProjectGate: note-never-block
    sonarAnalysis: isolated-slice
    sonarEnforcement: settle-refuses-done-without-pass-unavailable-is-explicit
  refactorPolicy:
    behaviorInvariant: required
    regressionCheck: same-check-verbatim-before-and-after
    workspaceCanonicalizationMigration: exact-declared-red-before-green-after-or-cut-monotonic-until-final-green
    architectureCheck: gate-same-machines-before-and-after
    baselineRed: failed-not-refactored
    coverageAbsent: blocked-test-gap
    productBehavior: unchanged
    scopeEdits: owned-paths-only
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [refactor, cleanup, maintenance, canon-conformance]
  prerequisites: [delivered code + existing regression coverage]
  riskHints: [source-edits]
