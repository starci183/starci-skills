schema: starci/op@1
id: code.refactor
goal:
  en: Restructure one selected slice of code under a proven behavior invariant - the same regression
    check run before and after the change - never a behavior edit disguised as a refactor.
nodeKinds: [implementation]
completionProfile: implementation
sideEffects:
  - owned source edits that restructure without changing observable behavior
  - scoped local commits when authorized
  - the declared regression and architecture checks run before and after in their declared sandbox
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done-or-exact-workspace-canonicalization-proposal-with-regression
  dispatch: never
reads:
  - id: target
    path: N/index.yaml OR packet context.records -> exact bound scope.define
      record/extensions.work3.scope
    purpose:
      en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
        and validator freshness. Normally this consumer op requires its target node to exist. The
        one exception is proposalAuthority for workspace canonicalization: resolve the exact
        selected proposed id from the one explicitly bound scope.define record, confirm packet
        context.workflow binds the approved goal identity/revision, confirm this code.refactor leg
        follows the passed test.author leg in that revision, and confirm the declared regression
        file and source paths match the selected proposal. Do not scan .starciwork for alternatives.
        When any binding is absent or ambiguous, report DECLARED_DEPENDENCY_UNMET."
  - id: business
    path: .starciwork/features/<feature>/{br,fr,nfr,data,journey,decision}/**/index.yaml
    purpose:
      en: Read accepted requirements, decisions, constraints and acceptance IDs declared as relevant
        inputs in the selected .starciwork graph.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: A refactor that needs a different contract or boundary is a design change, not a refactor -
        report the gap instead of stretching this op.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: Resolve repository resource, actual checkout/root/HEAD and dirty state; read applicable
        instructions, manifests, the owning code, every caller and the existing tests. The
        restructure binds the exact inspected tree; a proposed change to a file that was not opened
        is not a refactor plan.
  - id: coverage
    path: repository:<repo-id>/<manifest-paths> + the slice's existing regression suite and its real
      runner
    purpose:
      en: Establish before any edit which declared check actually exercises the slice's observable
        behavior and that it can run in this environment.
  - id: conventions
    path: knowledge/coding-reference.yaml + knowledge/patterns/fe/index.yaml +
      knowledge/patterns/be/index.yaml
    purpose:
      en: The adopted naming, error-identity, structure and typing conventions, and the FE or BE pattern
        topics for the selected repository.
  - id: machines
    path: scripts/checks/check-scoped-lint.mjs + scripts/checks/code-patterns/*.mjs +
      scripts/checks/architecture/*.mjs + modules/models/code-patterns.yaml +
      docs/architecture-check.md
    purpose:
      en: When the slice lives in a checked FE/BE repository, read the sealed architecture and
        code-pattern machines' supported arguments, report schema, exit codes and coverage limits.
        The same machine set runs verbatim BEFORE and AFTER the restructure; an architecture or
        pattern regression introduced by a pure refactor is a failure, not a refactor outcome. This
        read grants no fix-flag or repair authority.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields: [state, blocker, completion.inputDigest, completion.evidence, completion.codeRefs]
    content:
      en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
        only state/blocker/completion here when N exists; actual observations, findings, commit
        mappings and remaining cleanup belong to the evidence result, not semantic node prose. When
        proposalAuthority is in use because N does not exist, omit this write entirely and leave the
        bound scope proposal byte-unchanged for workspace.manage to materialize later. Missing
        refs/dependencies/acceptance require a reported gap or separately selected scope update;
        never add/remove them to obtain pass.
  - id: source
    path: repository:<repo-id>/<write-ceiling>
    fields: [restructured source files only]
    content:
      en: Only exact owned paths in the approved code-scope, restructured without observable behavior
        change - moves, renames, extractions, deletions of dead code and equivalent rewrites. No
        feature, fix, contract, schema or configuration change rides inside a refactor; a needed
        behavior change is a separate selected operation, never an edit hidden in this one.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts:
      - manifest.yaml
      - regression-before.json
      - regression-after.json
      - architecture-before.json
      - architecture-after.json
      - diff-map.json
      - result.md
    content:
      en: "Store the exact regression command, cwd/repo, source commit/tree, exit code, counts and
        sanitized output for the before run and for the after run - the same command on both sides
        of the change. Store the same machine-check reports before and after where the slice lives
        in a checked repository. Map every moved or renamed symbol to its destination and record the
        full diff summary. Operator-specific observed result in E/result.md: the before/after parity
        statement with the observed outputs, and any behavior difference found - which is a failure,
        not a refactor outcome."
steps:
  - reads:
      - target
      - business
      - architecture
      - repo
      - coverage
      - conventions
      - machines
      - profile
    writes: [evidence]
    action:
      en: "Bind the exact restructure request and inspect the slice plus every caller. Select the one
        declared regression check that exercises the slice's observable behavior and run it BEFORE
        the first edit, verbatim, keeping command, tree/commit, exit code, counts and sanitized
        output. Where the slice lives in a checked FE/BE repository, run node scripts/checks/check-scoped-lint.mjs
        --profile <nest|next> --root ROOT --all BEFORE the first edit too and keep the machine
        report and exit code. A green baseline is normally the invariant's left side. The sole
        exception is migrationAuthority: preserve the complete red baseline, map every failure to
        the bound workspace-canonicalization proposal, and proceed only when no unrelated failure
        exists. For context.cut, also bind the stable cut id/ordinal/total, complete path-union
        manifest and passed-ordinal state before editing; ambiguity or a missing sibling mapping
        blocks. No existing, covering, runnable check is reported `blocked` with blocker kind
        `test-gap` and this op stops; it never authors the missing tests itself. Resolve the
        execution profile and actual tool availability before selecting instruments; this does not
        switch the model/runtime or spawn workers. Never create the target or invent its
        acceptance/graph here. Intent governs the behavior that must be preserved; a needed missing
        input is a reported graph/scope gap, not a silently added dependency. Read the declared
        boundaries, contracts, data ownership and rationale the restructure must stay inside. The
        check must exist, cover the changed surface and run verbatim. Normally its baseline must be
        green. Under the exact workspace-canonicalization migrationAuthority, it may be red only
        where every failed assertion is the bound proposal's selected migration delta. Without
        context.cut it must become green after the edits. With cutSetAuthority, a non-final slice
        instead proves its exact-slice postcondition plus an unchanged, monotonic full-regression
        inventory whose remaining failures map only to unsettled sibling ordinals; the pass that
        closes the set (the last ordinal to settle, whichever it is) must make the unchanged full
        regression green. A missing, non-covering or unrunnable suite
        is reported `blocked` with blocker kind `test-gap`, which routes to test.author; it is never
        a reason to skip the proof or author coverage inside this op. Read the adopted naming,
        error-identity, structure and typing conventions the restructure must preserve or improve
        toward - a refactor that degrades declared pattern conformance is a regression, not a
        cleanup. Load the applicable FE or BE topic files for the selected repository only;
        conventions never authorize behavior changes."
  - reads:
      - architecture
      - conventions
      - repo
    writes: [source]
    action:
      en: Restructure inside the declared write ceiling in the smallest behavior-preserving steps - move,
        rename, extract, inline, delete dead code - updating every inspected caller in the same
        change so the tree stays consistent and the adopted code conventions hold. Public contracts,
        persisted shapes, wire protocols, error identities and observable side effects stay
        identical; when the requested restructure cannot hold them, stop at the boundary and report
        the gap instead of editing behavior.
  - reads:
      - coverage
      - machines
      - repo
    writes: [evidence]
    action:
      en: Run the SAME regression check AFTER the change, verbatim, on the restructured tree and record it
        beside the before run; where the machines ran before, run the SAME check-scoped-lint.mjs
        check AFTER the change on the same roots and record it beside the before report. Parity
        normally means the same commands, same scope, same counts and the same green results. Under
        migrationAuthority without a cut it means the identical command/assertion inventory moves
        from only the declared migration failures to fully green. Under cutSetAuthority, a non-final
        ordinal runs the unchanged full command and may retain only failures mapped to unsettled
        sibling ordinals, while an independent exact-slice check is green and the failure inventory
        is monotonic; the pass that closes the set makes the full command green. Unrelated observable behavior
        remains unchanged. A different command, narrowed selection, rewritten assertion, post-edit
        failure or new architecture/pattern violation is failed with the diff between the two
        outputs. Nothing is re-worded or skipped to make the after run look green.
  - reads:
      - target
      - repo
      - coverage
    writes: [node, evidence]
    action:
      en: Review the actual diff and verify no unrelated or behavior-changing edit slipped in - the
        mapping of moved symbols to destinations must account for the whole change. Commit only when
        authorized, read back the full SHA/diff and prove the tested tree corresponds to that
        commit; otherwise report uncommitted honestly. Report done exactly once with both regression
        runs bound; never report a refactor that kept only a before run or only an after run.
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: proposal-binding
    requirement:
      en: When N does not yet exist in workspace canonicalization, the evidence names the one bound
        scope.define record, packet-bound workflow/goal identity and revision, selected proposed id,
        preceding passed test.author leg and exact authored regression file. The proposal remains
        byte-unchanged for workspace.manage, and no repository scan or alternate proposal satisfies
        this proof.
  - id: regression-parity
    requirement:
      en: "The same declared regression check ran verbatim before AND after the change, on the exact
        before tree and the exact after tree, with both exit codes, counts and outputs recorded; the
        after result matches the before result, except that the exact workspace-canonicalization
        migrationAuthority requires the bound declared migration failures before and a fully green
        result after with the assertion inventory unchanged, except for the explicit cutSetAuthority
        intermediate rule: non-final ordinals require green `cut-slice-postcondition` and
        `cut-regression-inventory`, while the pass that closes the set (the last ordinal to settle,
        whichever it is) requires green `full-regression-final`.
        Where the slice lives in a checked FE/BE repository, the same check-scoped-lint.mjs check ran
        verbatim on both sides with its reports retained; a new architecture or pattern violation
        after the change is a failure. A missing, different or narrowed check on either side is a
        failure, and no coverage at all is the `test-gap` blocker, never a silent pass."
  - id: behavior-invariant
    requirement:
      en: The diff is explainable as pure restructuring - every changed symbol maps to a move, rename,
        extraction or equivalent rewrite, no public contract, persisted shape, error identity or
        observable side effect changed, and no feature or fix rode inside the change. The exact
        migrationAuthority additionally permits only the selected canonical root/path-consumer
        binding delta while preserving all other behavior and custody invariants.
  - id: commit
    requirement:
      en: Inspect exact staged diff and actual tests; bind full real source commit(s), per repository, and
        separately retain integration/tested mappings. Report uncommitted or no-change honestly.
blockers:
  - code: TEST_COVERAGE_ABSENT
    condition:
      en: No existing regression check covers the slice's observable behavior or the covering check cannot
        run in this environment. Report blocked with blocker kind `test-gap`; the graph routes it to
        test.author and this op never writes the missing coverage itself.
  - code: SCOPE_WIDENING
    condition:
      en: The requested restructure needs a path outside the selected write ceiling; report the exact
        paths as blocker kind shared-change rather than widening the allowlist.
  - code: REQUIREMENT_UNSETTLED
    condition:
      en: The observable behavior, actor permission or business effect to preserve is not settled by the
        accepted requirement - report blocked with blocker kind srs-gap and the smallest affected
        semantic IDs; never pick a business reading in code. A source-local refactoring choice is
        not an SRS gap.
  - code: DESIGN_GAP
    condition:
      en: The design record is silent or contradictory about a material logical owner, public contract,
        authority boundary, durable state/effect, compatibility or recovery rule the restructure
        must preserve - report blocked with blocker kind sds-gap and the smallest affected semantic
        IDs. File layout, extraction shape and private helper choices are owned by this refactor and
        are not SDS gaps.
  - code: ENVIRONMENT_UNAVAILABLE
    condition:
      en: The declared regression runner, a declared architecture/code-pattern machine, a dependency or
        the sandbox cannot start here and the cause is provably unfixable from the allowlist -
        report blocked with blocker kind environment naming the exact missing piece.
  - code: AUTHORITY_REQUIRED
    condition:
      en: Completing the request needs an authority the goal does not grant - report blocked with blocker
        kind authority, an owner decision, never a silent widening.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        For proposal-authorized workspace canonicalization this includes an absent explicit
        context.records binding, a scope record outside the packet-bound approved goal revision, an
        unpassed preceding test.author leg, zero/multiple matching proposed ids, or a
        missing/non-green declared regression. Report exact ids; never search for a substitute, run
        predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  feature: Feature folder of the selected records, inside the operation allowlist
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  manifest-paths: Manifest and script files defining the declared regression check
  write-ceiling: Explicit owned source paths
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  proposalAuthority:
    scope: workspace-canonicalization-only
    permits: When the selected N/index.yaml does not exist yet, consume the exact proposed
      implementation target from the one scope.define record explicitly bound in packet
      context.records, but only for a workspace-canonicalization goal whose packet-bound revision
      contains this code.refactor leg after a passed test.author leg. The proposed id must equal the
      selected target id, its declared test dependency must be satisfied by the authored regression
      file, and the same covering regression command must run under the applicable refactor or
      migration proof below.
    forbids:
      - repository-wide discovery of a substitute scope record or proposed target
      - choosing another nodes[] entry because it appears compatible
      - materializing or editing the proposed Work node; workspace.manage owns later reconstruction
      - using a proposal without the packet-bound approved goal identity/revision and preceding
        passed test.author leg
      - treating the existence of a test path as proof; the declared regression must actually run
        before edits
  migrationAuthority:
    scope: workspace-canonicalization-only
    permits: Under proposalAuthority, the exact authored migration regression may be red before source
      edits and must be green after them. Every red baseline assertion must map to the selected
      proposal's declared canonical-root/path-consumer delta; any unrelated failure blocks before
      edits. This exception changes only the selected path/root bindings and their exact consumers.
      All other observable behavior, bytes, ids, refs, secrets, live effects and concurrent workflow
      state remain invariant.
    forbids:
      - accepting a collection-only check as the migration regression
      - editing when the red baseline contains an assertion not declared by the bound proposal
      - weakening, deleting or rewriting an assertion to obtain green
      - treating a post-edit red result as partial success
      - applying red-before/green-after semantics outside workspace canonicalization
  cutSetAuthority:
    scope: workspace-canonicalization-only
    appliesWhen: The dispatch packet carries context.cut {id, ordinal, total} with total >= 2, every cut
      job uses this same approved code.refactor semantic leg and exact goal/record binding, and the
      complete pairwise-disjoint path union was preflighted before the first slice launched.
    permits: "The unchanged full migration regression may remain red after a NON-FINAL cut only for
      assertions whose unresolved paths belong exclusively to not-yet-passed sibling ordinals in the
      same cut set. The current slice must pass an independently reproducible exact-slice
      postcondition, the full regression command and assertion inventory must remain byte-for-byte
      unchanged, the full failure set must not gain an unrelated assertion, and a failure already
      resolved by a passed ordinal may not reappear. Record the raw nonzero full-regression result
      as integration evidence, not as the slice's red verdict. The Kernel records two green checks
      for a non-final pass: `cut-slice-postcondition` and `cut-regression-inventory`. The pass that
      CLOSES the set - the last ordinal to settle, whichever it is, not the highest
      (inc-751dd1ac4492) - must additionally record `full-regression-final` green from the unchanged
      command; only then may the semantic leg advance."
    forbids:
      - declaring a non-final slice done from file edits alone or without an exact-slice executable
        check
      - accepting any new/unmapped failure, assertion inventory change, widened path or reappearing
        resolved failure
      - relabeling the raw full-regression exit code as green; the green inventory check proves only
        that its allowed residuals are exactly the unsettled sibling closure
      - advancing workspace.manage or the semantic code.refactor leg before every ordinal passes and
        the final full regression is green
      - using cut-set intermediate semantics when context.cut is absent, inconsistent or the
        complete closure partition is not durably known
  commitPolicy:
    mode: scoped-local-commit
    ownership: exact-selected-paths
    verify: git-readback-full-sha-and-diff
    push: false
    reuseAuthorization: true
    noChange: return-existing-verified-commit-no-empty-commit
  refactorPolicy:
    behaviorInvariant: required
    regressionCheck: same-check-verbatim-before-and-after
    workspaceCanonicalizationMigration: exact-declared-red-before-green-after-or-cut-monotonic-until-final-green
    architectureCheck: starci-code-patterns-check-same-machines-before-and-after
    baselineRed: failed-not-refactored
    coverageAbsent: blocked-test-gap
    productBehavior: unchanged
    scopeEdits: owned-paths-only
route:
  nodeKinds: [implementation]
  phase: [implement, implementation]
  intent: [refactor, cleanup, maintenance]
  prerequisites: [delivered code + existing regression coverage]
  riskHints: [source-edits]
