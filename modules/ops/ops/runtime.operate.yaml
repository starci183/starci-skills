schema: starci/op@1
id: runtime.operate
goal:
  en: Deliver the requested runtime or service state with readiness, owned effects and real
    postcondition proof.
nodeKinds: [operations]
completionProfile: operations
sideEffects:
  - Only the selected operation contract permits effects; no union of mode permissions.
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: application-stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md +
      docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
        load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
        credential custody, lifecycle commands and existing consumers. Run `starci stacks check`
        when validating a materialized stack; bind its exact inputs and limitations. Acceptance
        additionally requires the selected real startup, persistence, recovery and application
        checks. This conditional read grants no extra deployment or source scope.
  - id: target
    path: N/index.yaml
    purpose:
      en: Read current target, ancestor scope, refs, dependencies, assertions and validator freshness.
        Preserve unaffected accepted content.
  - id: selection
    path: selected request operation + exact mode contract in this operator JSON
    purpose:
      en: Select exactly one named operation, its target, scope and criteria before any effect. No mode
        default or automatic chain.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
writes:
  - id: node
    path: N/index.yaml
    fields: [completion.inputDigest, completion.evidence]
    content:
      en: Bind only the selected mode completion profile and its actual evidence.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, result.json]
    content:
      en: Record operation, exact scope, criteria, output artifact references, observed effects and
        unresolved findings.
steps:
  - reads:
      - application-stacks
      - target
      - selection
      - profile
    writes: []
    action:
      en: "Resolve the exact named operation and load only its contract. Its reads/writes, effect ceiling
        and completion profile replace this selector envelope; the union of modes never grants
        authority. Resolve the execution profile and actual tool availability before selecting
        instruments; this does not switch the model/runtime or spawn workers. For an explicitly new
        target, absence is expected: inspect the nearest existing ancestor/workspace, then create
        only that selected scope."
  - reads:
      - target
      - selection
    writes: [node, evidence]
    action:
      en: Execute the selected mode procedure through its actual postconditions. Return operation, scope,
        per-criterion results and real output refs; no other mode, source repair or successor is
        implied. This handoff is conditional and does not change standalone or named frontend
        response contracts.
proofs:
  - id: mode-result
    requirement:
      en: Exactly the selected mode contract and all requested criteria pass with real evidence before
        delivery.
blockers:
  - code: OPERATION_REQUIRED
    condition:
      en: Missing, unknown or multiple operations; select a single mode under existing task authority.
placeholders:
  business: Selected business slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate, starci-stacks-check]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  modePolicy:
    selection: required-exactly-one
    implicitChain: false
    permissionUnion: false
    completion: selected-mode-profile
  executionModes:
    inspect:
      id: runtime.operate
      goal:
        en: Collect readiness and blockers for exactly the selected development/test effects, repairing
          nothing.
      nodeKinds: [operations]
      completionProfile: operations
      sideEffects:
        - read-only probes; no infrastructure/account changes
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: Reconcile component ownership, encrypted credential custody, lifecycle commands and existing
              consumers. This conditional read grants no extra deployment or source scope.
        - id: target
          path: N/index.yaml
          purpose:
            en: "Read the existing selected N/index.yaml, ancestor scope, declared refs/dependencies/assertions
              and validator freshness. This consumer op requires its target node to exist. An absent
              target is a scope/graph gap: report it and propose a separately selected scope op; do
              not create a target or invent its acceptance/graph here."
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: When source exists/is selected, resolve repository resource, actual checkout/root/HEAD and dirty
              state; read applicable instructions, manifests, owning code, callers and relevant
              tests. Greenfield/spec-only work records source not-yet-created and grounds intent in
              the user request; no invented repository or fact citation. Source implementation still
              needs an actual selected writable repository.
        - id: environment
          path: .starciwork/_resources/environments/<environment>/resource.yaml
          purpose:
            en: Read exact target/origins, owner, configuration revision, declared probes and allowed effects;
              validate live observations without inferring identity from hostname alone.
        - id: capabilities
          path: available tools/runtime + selected identity/fixture/service declarations
          purpose:
            en: Inspect actual browser/Playwright availability when needed, declared commands, custody handles
              by name and target service probes. Do not open unrelated secrets.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged. Write
              only state/blocker/completion here; actual observations, findings, commit mappings and
              remaining cleanup belong to the evidence result, not semantic node prose. Missing
              refs/dependencies/acceptance require a reported gap or separately selected scope
              update; never add/remove them to obtain pass.
        - id: evidence
          path: E/manifest.yaml + E/readiness.json + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Collect all safely inspectable checks, with observed timestamp and source/config/environment
              revision; dependent checks unavailable due to earlier blocker remain not-run.
              Operator-specific observed result in E/result.md: One row per scoped prerequisite:
              needed capability, declaration, actual observation, ready/blocked/not-needed, owner
              and exact remedy. Readiness is time-bound evidence, not lasting global green."
      steps:
        - reads:
            - application-stacks
            - target
            - repo
            - environment
            - capabilities
          writes: [node]
          action:
            en: Derive prerequisite list from the selected op/effect set, not the whole development cycle.
              Inspect target identity and read permissions first.
        - reads:
            - repo
            - capabilities
          writes: [evidence]
          action:
            en: Inspect actual checkout, dependencies and command/browser capability without installing or
              repairing. Report unrelated dirt without deleting it.
        - reads:
            - environment
            - capabilities
          writes: [evidence]
          action:
            en: Probe declared endpoints/build identity, credential custody availability by name, fixture
              ownership and permitted effect scope. Sign-in mutation is not assumed if task only
              authorizes passive diagnostics.
        - reads:
            - target
            - repo
            - environment
            - capabilities
          writes: [node, evidence]
          action:
            en: Record the complete blocker set and skipped dependent checks without stopping at the first
              issue. Validate and finish read-only; no automatic runtime/account/fixture op.
      proofs:
        - id: binding
          requirement:
            en: Run the record-class validator `starci validate`; every cited ID/path exists or is explicitly
              proposed, required assertions are covered, input bindings are current, and an honest
              not-run/fail cannot earn done.
        - id: readiness
          requirement:
            en: Every needed prerequisite has a recent actual observation; absent capability stays
              blocked/not-run, not guessed ready.
      blockers:
        - code: ENVIRONMENT_NOT_READY
          condition:
            en: A required scoped capability or target cannot be verified.
        - code: DECLARED_DEPENDENCY_UNMET
          condition:
            en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
              Report node/resource IDs and propose a separately selected graph update when needed;
              never run predecessors or weaken dependsOn/refs/required to proceed.
      placeholders:
        business: Selected business slug
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        write-ceiling: Explicit owned source paths
        environment: Resolved environment resource slug
        identity: Selected actor resource slug
        fixture: Selected fixture resource slug
        resource: Selected owned resource slug
        asset: Actual selected source asset filename/format
        piece: Stable selected piece slug
        flow: Selected UAT journey slug
        screen: Selected surface/state slug
    serve:
      id: runtime.operate
      goal:
        en: Bring one selected development runtime to the authorized state and prove the actual served
          build.
      nodeKinds: [operations]
      completionProfile: operations
      sideEffects: [only authorized start/stop/restart/build or integration action on owned runtime]
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: Reconcile component ownership, encrypted credential custody, lifecycle commands and existing
              consumers. This conditional read grants no extra deployment or source scope.
        - id: target
          path: N/index.yaml
          purpose:
            en: This consumer op requires its target node to exist.
        - id: repo
          path: repository:<repo-id>/<bound-paths>
          purpose:
            en: Source implementation still needs an actual selected writable repository.
        - id: runtime
          path: .starciwork/_resources/runtimes/<resource>/resource.yaml + selected source command/config
          purpose:
            en: Read exact runtime owner, command, checkout/build, endpoints, process/container identity,
              declared desired action and health/version probes. Integration merge is not implied by
              serving.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged.
        - id: resource
          path: .starciwork/_resources/runtimes/<resource>/resource.yaml
          fields:
            - schema
            - id
            - kind
            - owner
            - revision
            - details.environment
            - details.commandRef
            - details.sourceRef
            - details.endpoints
            - details.probeRefs
            - details.custodyRefs
            - details.observationRef
          content:
            en: Update only declared owned runtime refs and observed-state pointer on the work/resource@1
              record. Record local PID/session handles in ignored local state or bounded evidence,
              not durable identity.
        - id: evidence
          path: E/manifest.yaml + E/runtime.json + E/probes.json + E/effects.json + E/build-output.txt when
            built + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Record before/after generation, target/process ownership, actual build command/output, full
              source refs, immutable served artifact, endpoint probes and effect status.
              Operator-specific observed result in E/result.md: Keep code/build/served identity
              distinct and no UAT/release readiness claim from a healthy process."
      steps:
        - reads:
            - application-stacks
            - target
            - runtime
            - repo
          writes: [evidence]
          action:
            en: Inspect current process/container holder, source/build revision, ports and health. Reuse an
              already matching healthy runtime without restart. Preflight the exact selected target,
              capabilities, configuration/custody and permitted effects inside this job. Check
              declared API/health postconditions on the resulting target; account or fixture setup
              for UAT remains owned by UAT. Do not modify product source or run implementation
              lint/Sonar.
        - reads:
            - runtime
            - target
          writes: []
          action:
            en: Check selected desired action and allowed effects. A foreign process/port is not permission to
              kill it or silently choose another port/origin.
        - reads:
            - runtime
            - repo
          writes: [resource, evidence]
          action:
            en: Perform only the exact authorized runtime change and bounded recovery. If integration is
              explicitly included, inspect ownership and conflict scope, preserve actual resulting
              commit and rerun affected gates; otherwise do not merge.
        - reads:
            - runtime
            - repo
          writes: [evidence]
          action:
            en: Probe actual served source/build identity, endpoints and stability using declared checks. A
              started PID or build success alone does not prove the target is serving the selected
              code.
        - reads:
            - target
            - runtime
          writes: [node, resource, evidence]
          action:
            en: Record actual state, partial effects and source-versus-served mapping, then stop. No
              account/fixture/deploy action is automatically performed.
      proofs:
        - id: runtime
          requirement:
            en: Declared health and served-version evidence are observed on the actual target with correct owned
              generation.
      blockers:
        - code: RUNTIME_OWNER_CONFLICT
          condition:
            en: Target/process/port is foreign, ambiguous or changed concurrently.
        - code: RUNTIME_EFFECT_UNAUTHORIZED
          condition:
            en: Required start/reset/merge/configuration change exceeds selected action.
      placeholders:
        business: Selected business slug
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        write-ceiling: Explicit owned source paths
        environment: Resolved environment resource slug
        identity: Selected actor resource slug
        fixture: Selected fixture resource slug
        resource: Selected owned resource slug
        asset: Actual selected source asset filename/format
        piece: Stable selected piece slug
        flow: Selected UAT journey slug
        screen: Selected surface/state slug
    service:
      id: runtime.operate
      goal:
        en: Inspect or change one declared auxiliary service and verify its requested state.
      nodeKinds: [operations]
      completionProfile: operations
      sideEffects: [explicit owned auxiliary-service lifecycle action only]
      graphPolicy:
        mode: read-only
        location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
        prerequisiteState: done
        dispatch: never
      reads:
        - id: application-stacks
          path: knowledge/application-stacks.yaml + docs/application-stacks.md +
            docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
          purpose:
            en: Reconcile component ownership, encrypted credential custody, lifecycle commands and existing
              consumers. This conditional read grants no extra deployment or source scope.
        - id: target
          path: N/index.yaml
          purpose:
            en: This consumer op requires its target node to exist.
        - id: service
          path: .starciwork/_resources/services/<resource>/resource.yaml
          purpose:
            en: Read exact declared service, owner, desired state, command/config refs, target identity, probes
              and allowed recovery; never infer service ownership from a listening port.
      writes:
        - id: node
          path: N/index.yaml
          fields: [state, blocker, completion.inputDigest, completion.evidence]
          content:
            en: Read the existing selected scope, expected assertions and .starciwork graph unchanged.
        - id: resource
          path: .starciwork/_resources/services/<resource>/resource.yaml
          fields:
            - schema
            - id
            - kind
            - owner
            - revision
            - details.environment
            - details.commandRef
            - details.probeRefs
            - details.observationRef
          content:
            en: Update only service-owned observation/declaration fields on the work/resource@1 record included
              in scope; do not grant new authority by editing allowed effects.
        - id: evidence
          path: E/manifest.yaml + E/service-probes.json + E/effects.json + E/result.md
          fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
          content:
            en: "Retain actual holder and before/after health/stop evidence with selected command outcome and
              bounded recovery. Operator-specific observed result in E/result.md: Record one service
              outcome and partial effects; no product runtime or quality acceptance inferred."
      steps:
        - reads:
            - application-stacks
            - service
            - target
          writes: [evidence]
          action:
            en: Inspect target ownership, process/container identity and probe before action; reuse already
              matching state without restart. Do not modify product source or run implementation
              lint/Sonar.
        - reads:
            - service
          writes: []
          action:
            en: Confirm selected inspect/up/down/restart action and authority. Do not touch product runtime
              servers, foreign holders or unlisted dependencies.
        - reads:
            - service
          writes: [resource, evidence]
          action:
            en: Run only the declared authorized command if needed, preserve uncertain effects and avoid blind
              retries; no port stealing or undeclared install.
        - reads:
            - service
            - target
          writes: [node, resource, evidence]
          action:
            en: Verify requested state using actual service probe and holder identity, report limits and stop
              without gates or product operations.
      proofs:
        - id: service
          requirement:
            en: Up is supported by the declared useful health probe; down is supported by owned
              process/container and endpoint observations, not an ungrounded absence.
      blockers:
        - code: SERVICE_OWNERSHIP_UNKNOWN
          condition:
            en: Service target or effect is outside verified ownership/scope.
      placeholders:
        business: Selected business slug
        repo-id: Resolved repository resource ID
        bound-paths: Inspected source read set
        write-ceiling: Explicit owned source paths
        environment: Resolved environment resource slug
        identity: Selected actor resource slug
        fixture: Selected fixture resource slug
        resource: Selected owned resource slug
        asset: Actual selected source asset filename/format
        piece: Stable selected piece slug
        flow: Selected UAT journey slug
        screen: Selected surface/state slug
route:
  nodeKinds: [operations]
  phase: [operate, cross-cutting]
  intent: [runtime, serve, inspect, environment, service]
  prerequisites: [a declared stack/environment]
  riskHints: [runtime-effects]
