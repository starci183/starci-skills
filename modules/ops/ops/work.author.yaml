schema: starci/op@1
id: work.author
goal:
  en: Author the canonical Work records one slice needs before it can be launched - in record mode
    each record's own write scope, testable proof demands and one runnable check per demand; in cut
    mode the child records a scope too big for one operation is split into, seam first - without
    anyone inventing a scope.
params:
  maxFiles:
    type: integer
    default: 12
    min: 1
    setBy: kernel
    doc:
      en: The write-scope size above which the kernel treats a record as too big for one operation.
  maxProofDemands:
    type: integer
    default: 8
    min: 1
    setBy: kernel
    doc:
      en: The number of proof demands above which the kernel treats a record as too big for one operation.
  componentsTriggeringCut:
    type: integer
    default: 3
    min: 2
    setBy: kernel
    doc:
      en: How many components the referenced design may name before the record is cut.
  gateRounds:
    type: integer
    default: 5
    min: 1
    max: 10
    setBy: owner
    doc:
      en: "Rounds of FIX then the document gate (starci gate run --scope docs) before the op stops: a gate still red after the last round is reported blocked with the exact findings of that round (knowledge/op-gate.yaml docChecks)."
      vi: "Số vòng SỬA rồi chạy lại cổng tài liệu (starci gate run --scope docs) trước khi op dừng: hết vòng cuối mà cổng vẫn đỏ thì báo blocked kèm đúng các lỗi của vòng đó (knowledge/op-gate.yaml docChecks)."
nodeKinds: [implementation, uat, ui, operations]
completionProfile: operations
sideEffects: []
graphPolicy:
  mode: selected-scope-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
  workGraph: cut
reads:
  - id: application-stacks
    path: knowledge/application-stacks.yaml + docs/application-stacks.md +
      docs/application-stacks-vps.md + modules/schemas/application-stacks.schema.yaml
    purpose:
      en: When the selected scope touches application deployment, .starcistacks, bootstrap or recovery,
        load the whole-application dev/VPS contract. Reconcile component ownership, encrypted
        credential custody, lifecycle commands and existing consumers. Run the static stacks check
        when validating a materialized stack; bind its exact inputs and limitations. Acceptance
        additionally requires the selected real startup, persistence, recovery and application
        checks. This conditional read grants no extra deployment or source scope.
  - id: target
    path: .starciwork/features/<feature>/{impl,uat,integration}/**/index.yaml
    purpose:
      en: "Read the selected record exactly as authored: its title, refs, dependencies, proof demands,
        state and whatever write scope or checks it already declares."
  - id: neighbours
    path: sibling record index.yaml files of the selected feature scope
    purpose:
      en: Read the feature scope and the sibling records so the completed scope neither duplicates nor
        contradicts work another record already owns. An overlap belongs to the owning record, not
        to this one.
  - id: specification
    path: accepted requirement and design records the target declares in refs or dependsOn
    purpose:
      en: Read the accepted requirement and design records the target references, so every proof demand
        restates an accepted outcome. A behaviour the accepted records do not state is a reported
        gap, not an invention.
  - id: source
    path: selected repositories and the modules the referenced design names
    purpose:
      en: Inspect the actual code an implementation of this node would change, or confirm that the owning
        path is absent, so the declared write scope is in the shape the design prescribes.
  - id: scripts
    path: repository package manifests, task runners, test framework configs and existing check commands
    purpose:
      en: Read the commands, test runners and runner configs this repository already exposes, so every
        declared check is a command that can be run verbatim against the assertion it claims.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles. Use current host model configuration; historical model names are not
        availability proof. Capabilities are the intersection of actual tools, selected profile
        policy, op permissions and existing task authority.
  - id: standard
    path: knowledge/op-gate.yaml + knowledge/** + <app>/hfs.json
    purpose:
      en: "The standard this op's decisions and records cite: knowledge/op-gate.yaml (proofs.read-knowledge), the knowledge files listed in its READ step and the hfs slot map of every record it writes (hfs explain at the app root). The files are read in place and recorded with their sha256 in the READ digest; nothing here is restated into a record."
      vi: "Chuẩn mà quyết định và bản ghi của op dẫn ra: knowledge/op-gate.yaml (proofs.read-knowledge), các tệp knowledge liệt kê ở bước ĐỌC và bản đồ slot hfs của mọi bản ghi op viết (hfs explain ở gốc app). Các tệp được đọc tại chỗ và ghi kèm sha256 vào bản tóm tắt ĐỌC; không chép lại vào bản ghi."
writes:
  - id: node
    path: .starciwork/features/<feature>/{impl/<repository>,uat}/<name>/index.yaml
    fields:
      - schema
      - id
      - title
      - state
      - repository
      - owners
      - proves
      - requiresProof
      - verification
      - verificationSource
      - accounts
      - steps
      - blockedBy
    content:
      en: "Author only the fields that make the flat work/implementation@1 or work/uat-flow@1 record
        launchable: its proves edges to the accepted records it proves, the write scope as inspected
        owners or, in planned mode, design-traced owners, one requiresProof demand per observable
        outcome with a verbatim runnable command, and the exclusive runtime resources those checks
        need. The authored proof demands include the record-class validator `starci validate` so wrong
        path, name or schema fails the record's own checks. Preserve every other authored line, including the record's
        title, refs, dependsOn and state. Never write completion, never write the kernel's own
        extension block, never write anything under the record's evidence folder, and never edit
        another record."
  - id: integration
    path: .starciwork/features/<feature>/integration/<integration-id>/index.yaml
    fields: [schema, id, title, state, provider, boundary, endpoints, credential, sandbox, refs, requiresProof]
    content:
      en: One todo work/integration@1 record per integration the feature declares (state todo), naming the
        outside system, its provider/boundary/endpoints/sandbox and the credential by variable name
        only; the record the tree owes for the declaration, whose live proof is another operation's.
        Never a credential value.
  - id: accounts
    path: .starciwork/features/<feature>/uat/<name>/accounts.yaml
    fields: [schema, disposable, accounts]
    content:
      en: The work/disposable-accounts@1 file beside a uat-flow record, one {role, identity} entry per
        actor role the flow's steps name, each identity an _resources identity id. Never a password.
  - id: identity
    path: .starciwork/_resources/identities/<identity>/resource.yaml
    fields: [schema, id, kind, owner, revision, disposable, custody, roles, blockers]
    content:
      en: A planned identity slot as a work/resource@1 of kind identity, disposable, naming the roles the
        accepted design needs, its sealed custody file by path and a blockers entry naming the
        implementing op that seeds it. Never a credential value.
  - id: environment
    path: .starciwork/_resources/environments/<environment>/resource.yaml
    fields: [schema, id, kind, owner, revision, blockers]
    content:
      en: A planned environment slot as a work/resource@1 of kind environment, naming the served build
        the flow walks and a blockers entry naming the implementing op that brings it up. Only when no
        environment resource the flow can use exists yet.
  - id: fixture
    path: .starciwork/_resources/fixtures/<fixture>/resource.yaml
    fields: [schema, id, kind, owner, revision, blockers]
    content:
      en: A planned fixture slot as a work/resource@1 of kind fixture, naming the data the flow needs
        seeded and a blockers entry naming the implementing op that seeds it.
  - id: parts
    path: .starciwork/features/<feature>/impl/<repository>/<part>/index.yaml
    fields: [schema, id, title, state, repository, owners, proves, requiresProof, dependsOn]
    content:
      en: "Cut mode only. One child record per observable behaviour, written as work/implementation@1,
        state todo: its title, its proves edges, its write scope of at most twelve inspected files
        disjoint from every sibling and from the seam, and one runnable proof demand per outcome
        plus the record-class validator `starci validate` so wrong path, name or schema fails the
        child's own checks. Exactly one child is the seam - the one that owns the module wiring,
        dependency registration, migrations, shared contracts and shared types every other child
        would otherwise touch - and every other child names the seam in dependsOn, so it is built
        first and alone and the rest fan out behind it. Never author a child outside the feature's
        own impl/<repository>/ folder and never write product code."
  - id: evidence
    path: evidence/**
    fields: [id, nodeId, inputDigest, outcome, assertions, provenance, extensions]
    artifacts: [manifest.yaml, result.json]
    content:
      en: Record the mode of each record, which records and which source modules were inspected, the
        design record each planned path traces to, the assertion-to-check mapping that was authored,
        and every scope question that stayed open. Record an honest not-run or failed validator
        result.
  - id: work-graph
    path: evidence/work-graph.json
    schema: starci/work-graph@1
    fields: [domains, nodes, edges]
    content:
      en: The cut of one oversized slice into child task nodes of that slice.
  - id: read-digest
    path: STARCI_JOB_SCRATCH/read-digest.json
    schema: starci/read-digest@1
    content:
      en: "The READ digest (read-digest.mjs --knowledge): every knowledge file the decision cites and the hfs slot of every record written, each with its sha256."
      vi: "Bản tóm tắt ĐỌC (read-digest.mjs --knowledge): mọi tệp knowledge mà quyết định dẫn ra và slot hfs của mọi bản ghi đã viết, kèm sha256 của từng tệp."
  - id: doc-gate
    path: STARCI_JOB_SCRATCH/doc-gate.json
    schema: starci/gate@1
    content:
      en: "The last round's document gate (starci gate run --scope docs): every docChecks result - doc-language, check-work-surfaces, check-work-deep, check-example-work, check-contract-cites, check-json-exceptions - its exit and every finding."
      vi: "Cổng tài liệu của vòng cuối (starci gate run --scope docs): kết quả từng docChecks - doc-language, check-work-surfaces, check-work-deep, check-example-work, check-contract-cites, check-json-exceptions - exit và từng lỗi."
steps:
  - reads: [standard, application-stacks, target]
    writes: [read-digest]
    action:
      en: "READ the standard before deciding (knowledge/op-gate.yaml proofs.read-knowledge): run node scripts/gates/read-digest.mjs --root <app> --touch <every record this op will write> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/hfs/slots.yaml knowledge/patterns/be/test.yaml knowledge/op-gate.yaml --out $STARCI_JOB_SCRATCH/read-digest.json, and read what it records - the knowledge files in place and the hfs slot map of each record (slot, tier, rules). Each record's write scope is app-relative paths in the slots that admit them (be/..., fe/..., .starciwork/..., .starcistacks/... at the app root); each proof demand names its test layer and the check that runs it - unit: <name>.service.spec.ts beside the service (npm test); integration: be/src/tests/integration/**/*.integration-spec.ts with useTestWorld({ modules }) (npm run test:integration); e2e: be/src/tests/e2e/**/*.e2e-spec.ts with useTestWorld({ apps }) (npm run test:e2e); contract: be/src/tests/contract/**/*.contract-spec.ts with useSandbox (npm run test:contract). A record the op comes to write later is added with --touch and read the same way; REPORT with read-digest.json attached."
      vi: "ĐỌC chuẩn trước khi quyết định (knowledge/op-gate.yaml proofs.read-knowledge): chạy node scripts/gates/read-digest.mjs --root <app> --touch <mọi bản ghi op sẽ viết> --knowledge knowledge/patterns/repo/starciwork.yaml knowledge/hfs/slots.yaml knowledge/patterns/be/test.yaml knowledge/op-gate.yaml --out $STARCI_JOB_SCRATCH/read-digest.json, rồi đọc những gì nó ghi - các tệp knowledge tại chỗ và bản đồ slot hfs của từng bản ghi (slot, tầng, luật). Phạm vi ghi của mỗi bản ghi là đường dẫn tương đối theo app nằm trong slot nhận chúng (be/..., fe/..., .starciwork/..., .starcistacks/... ở gốc app); mỗi yêu cầu chứng minh nêu tầng test và lệnh chạy nó - unit: <name>.service.spec.ts cạnh service (npm test); integration: be/src/tests/integration/**/*.integration-spec.ts với useTestWorld({ modules }) (npm run test:integration); e2e: be/src/tests/e2e/**/*.e2e-spec.ts với useTestWorld({ apps }) (npm run test:e2e); contract: be/src/tests/contract/**/*.contract-spec.ts với useSandbox (npm run test:contract). Bản ghi phát sinh về sau được thêm bằng --touch và đọc theo cùng cách; BÁO CÁO kèm read-digest.json."
  - reads:
      - application-stacks
      - target
      - neighbours
      - specification
      - profile
    writes: [evidence]
    action:
      en: Read the selected record, its feature scope and sibling records and the accepted requirement and
        design records it references. Restate what this record must deliver and where its boundary
        against its siblings runs. Do not restate the record's purpose as a new requirement and do
        not widen its scope. The authored intent governs; an absent field is the gap to complete,
        never a licence to restate the record's purpose.
  - reads:
      - target
      - specification
      - source
    writes: [node]
    action:
      en: "Resolve the owners/write scope in one of two modes. Existing mode applies when the owning source
        path exists: inspect the actual modules the referenced design names and record the exact paths
        an implementation of this record would change, every one a file or directory that was opened.
        Planned mode applies only when the owning source path does not exist yet and the approved
        chain still runs its implementing op (backend.implement, interface.implement, e2e.verify or
        uat.verify) after this one: the owners are the paths the accepted design prescribes - its
        sds-component owners and the architecture module layout - each traced to that design record
        by id, and the record stays todo. In both modes a path neither the design nor the source
        resolves is an open question, never a guess. Every owner path is written app-relative - be/<path>,
        fe/<path> or a directory of the app root - never side-relative and never with a repository:<id>/ prefix
        (OWNER_PATH_NOT_APP_RELATIVE)."
  - reads:
      - target
      - specification
    writes: [node]
    action:
      en: Write the record's proof demands as testable claims, one per observable outcome the accepted
        records state. A demand nobody can run is not a demand; a claim the accepted records do not
        support is removed rather than softened.
  - reads:
      - scripts
      - source
    writes: [node]
    action:
      en: Write one runnable check per proof demand, each naming the exclusive runtime resources it needs
        and each on a runner this repository already exposes - an existing script, or a test
        framework with its config. In existing mode the check is a command that already exercises the
        demand. In planned mode the check is that runner's command plus the test path the implementing
        op must create, and the implementing op creates exactly that test. A runner the repository
        does not have at all is a reported blocker in both modes; never invent a runner or a script
        name.
  - reads:
      - target
      - specification
    writes: [accounts, identity, environment, fixture]
    action:
      en: For a uat-flow record, name every actor role its steps need in accounts.yaml. A test identity,
        environment or fixture the accepted design needs that no resource holds yet is declared as a
        planned slot under .starciwork/_resources/{identities,environments,fixtures}/<slug>/, which the
        implementing op seeds or brings up before the flow runs; the flow stays todo. The kernel's
        owned_paths for such a dispatch include exactly those slot directories, so a slot outside the
        grant is a scope request to the kernel, never a reason to leave the flow unresolved. A credential
        for a real outside system is never a planned slot and stays an owner provision.
  - reads:
      - target
      - scripts
    writes: [node, evidence]
    action:
      en: Run the record-class validator `starci validate` over the edited tree and confirm the record
        still validates and now declares both a write scope and proof demands; a planned record's
        missing owner path is a warning there, never a refusal. Record the demand-to-check mapping
        and any open question. Build nothing and change no product source;
        the kernel launches the record's own work afterwards.
  - reads:
      - target
    writes: [integration]
    action:
      en: "Intake and migrate modes. For every integration the feature declares at
        extensions.work3.integrations, author one todo work/integration@1 record at
        features/<feature>/integration/<integration-id>/index.yaml when none exists: state todo, a
        title naming the outside system, its provider/boundary/endpoints/sandbox, the credential by
        variable name, and one requiresProof.live demand for the run a live proof must show. Never a
        value."
  - reads:
      - target
      - specification
      - source
    writes: [parts]
    action:
      en: "Cut mode. When the kernel selected this record's scope as too big for one operation - its write
        scope names more files than `params.maxFiles`, it states more proof demands than
        `params.maxProofDemands`, or the design it references names `params.componentsTriggeringCut`
        or more components - read the record, its demands and the referenced design, open the code
        its write scope names, and NAME THE SEAM FIRST: the one child record that owns the module
        wiring, dependency registration, migrations, shared contracts and shared types every other
        child would otherwise touch. Then cut the rest by acceptance, one observable behaviour each,
        every child disjoint from every sibling and from the seam, every child demand traced to the
        same requirement and design ids the parent traced to, and every non-seam child naming the
        seam in dependsOn. A scope that really is one observable behaviour is not split: report done
        with cut: none and the reason."
  - reads: [target, neighbours]
    writes: [work-graph]
    action:
      en: When the selected slice of the work graph is over its `api estimate` bound, cut it into child
        task nodes of that slice, seam first - each with its own owned paths, reads, rollbackTo and size -
        and record the cut for that slice alone; the Work records this op authors stay one per child.
  - reads:
      - target
      - scripts
    writes: [node, evidence]
    action:
      en: "Cut mode. Turn the cut record into the seam record: it keeps its id and owns the module wiring,
        shared contracts and shared types every sibling would otherwise touch, and every sibling
        names it in dependsOn. Then run the record-class validator `starci validate` over the edited
        tree and confirm every child is launchable on its own. Record the seam, the children and the
        write scope of each. Build nothing and change no product source; the kernel launches the
        seam first, fans the rest out behind it and proves the whole group once."
  - reads: [standard, target]
    writes: [doc-gate]
    action:
      en: "FORCE THE DOCUMENT CHECKS after writing: run starci gate run --scope docs --tree <app>/.starciwork --out $STARCI_JOB_SCRATCH/doc-gate.json. FIX what it reports and run it again, at most params.gateRounds rounds: exit 0 is green; exit 1 lists the findings per check (a document that is not English, a Work record with a dead surface or a stale proof, a cite of a file that does not exist, a JSON exception out of place); exit 2 means a check could not run and is never green. Still red after the last round: report blocked with the exact findings. Never report done while the document gate is red or could not run. REPORT with doc-gate.json and read-digest.json attached."
      vi: "ÉP CHẠY KIỂM TRA TÀI LIỆU sau khi viết: chạy starci gate run --scope docs --tree <app>/.starciwork --out $STARCI_JOB_SCRATCH/doc-gate.json. SỬA những gì nó báo rồi chạy lại, tối đa params.gateRounds vòng: exit 0 là xanh; exit 1 liệt kê lỗi theo từng bộ kiểm tra (tài liệu không phải tiếng Anh, bản ghi Work có bề mặt chết hoặc bằng chứng lỗi thời, trích dẫn tới tệp không tồn tại, ngoại lệ JSON sai chỗ); exit 2 là một bộ kiểm tra không chạy được và không bao giờ là xanh. Hết vòng cuối mà vẫn đỏ: báo blocked kèm đúng các lỗi. Không bao giờ báo done khi cổng tài liệu đỏ hoặc không chạy được. BÁO CÁO kèm doc-gate.json và read-digest.json."
proofs:
  - id: launchable
    requirement:
      en: The record declares a non-empty write scope and at least one proof demand, every authored demand
        is named by a check that proves it, and the workspace validator passes over the edited tree.
        An honest not-run or failing validator cannot earn done.
  - id: inspected-scope
    requirement:
      en: In existing mode every path in the write scope was inspected in the actual source and is
        consistent with the referenced design, and every check command exists in the repository and was
        run or explicitly reported as unrunnable. In planned mode the record is todo, the implementing
        op still follows in the approved chain, every write-scope path and planned test path traces to
        an accepted design record by id, and every check names a runner and config that exist in the
        repository. A fabricated path, runner or command is a failure, not a draft.
  - id: preserved-record
    requirement:
      en: In record mode the record's title, refs, dependsOn and state are byte-identical to what was
        authored. In cut mode the record keeps its id, title and refs and becomes the seam, owning
        the shared wiring every sibling would otherwise touch. In both modes no completion or kernel
        extension block was written, nothing under the evidence folder of the record was edited, and
        no record outside the feature's own scope changed.
  - id: seam-first-disjoint-parts
    requirement:
      en: "Cut mode: exactly one child is named the seam, every other child names it in dependsOn, and no
        two children share a path - each write scope is at most twelve inspected files and is
        disjoint from every sibling and from the seam. Every child is one observable behaviour with
        one runnable check per proof demand and every demand traced to the same requirement and
        design ids the parent traced to, and the seam record keeps its id and owns the shared
        wiring. A scope reported as cut: none left the tree byte-identical. Overlapping children are
        a failure, not a draft: two operations that write the same file are one merge conflict with
        two authors, never parallel work."
  - id: checkpointed
    requirement:
      en: Every Work record file this operation wrote under its owned paths is committed by the runtime
        as its workflow's checkpoint when the operation settles green (scripts/kernel/workflow-checkpoint.mjs
        checkpointOp). The operation never commits and changes nothing outside its owned paths; settle
        refuses workflow-foreign-commit or workflow-foreign-change otherwise.
  - id: read-knowledge
    requirement:
      en: "api settle re-reads the attached read-digest.json (runtime check op-proof, proof read-knowledge): a done whose digest is missing (op-read-digest-missing), names no knowledge file or leaves a written record without its hfs slot (op-read-digest-no-knowledge) is refused."
      vi: "api settle tự đọc lại read-digest.json đính kèm (check op-proof, proof read-knowledge): done thiếu bản tóm tắt (op-read-digest-missing), không nêu tệp knowledge nào hoặc có bản ghi đã viết thiếu slot hfs (op-read-digest-no-knowledge) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
  - id: doc-gate
    requirement:
      en: "api settle re-reads the attached doc-gate.json (runtime check op-proof, proof doc-gate): a done without it (op-doc-gate-missing), with a check that could not run (op-doc-gate-tool-failed) or with a finding (op-doc-gate-red) is refused."
      vi: "api settle tự đọc lại doc-gate.json đính kèm (check op-proof, proof doc-gate): done thiếu nó (op-doc-gate-missing), có bộ kiểm tra không chạy được (op-doc-gate-tool-failed) hoặc có lỗi (op-doc-gate-red) đều bị từ chối."
    check: scripts/kernel/gate-settle.mjs
blockers:
  - code: SCOPE_UNDETERMINED
    condition:
      en: The accepted requirement and design records and the actual source do not determine which files
        this record would change, so any write scope would be invented. Report the exact question
        instead.
  - code: CHECK_RUNNER_MISSING
    condition:
      en: A proof demand has no runner in this repository that could prove it - no existing script and no
        test framework or config - so declaring a check would declare a command that does not run.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A referenced requirement or design record is missing or not effectively done, so the demands
        would rest on material that was never accepted. Report the node/resource IDs; never weaken
        refs or dependsOn and never author the missing record here.
  - code: SEAM_UNDETERMINED
    condition:
      en: "Cut mode: the accepted records and the actual source do not determine which shared ground the
        children would contend for, so either the seam or the boundary between two children would be
        invented. Report the exact question - which module wiring, which contract, which migration
        is shared - never a cut that leaves two children writing the same file."
placeholders:
  feature: Feature folder of the intake or migration, inside the operation allowlist
  repository: The bound repository the implementation record names
  integration-id: Stable id of one declared integration, the folder its record is named after
  name: Stable slug of the impl/uat record
  identity: Stable slug of one planned identity slot under _resources/identities/
  part: Stable slug of one child record under impl/<repository>/
layoutPolicy:
  checks: [starci-validate]
route:
  nodeKinds: [implementation, uat, ui, operations]
  phase: [scope, pre-implementation]
  intent: [work, author, nodes, launchable, decompose]
  prerequisites: [scope defined]
