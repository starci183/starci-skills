schema: starci/op@1
id: brand.decide
goal:
  en: Settle one product's visual identity in the single brand record - colour tokens traced to the
    real source files, typography, mascot, logo, iconography, imagery rules, voice and motion - and
    capture the product's app shell in the single shell record - layout, top bar and brand lockup, nav
    registry, product locale, demo persona, rendered captures - so every later drawing and build reads
    an identity and a chrome instead of inventing them.
nodeKinds: [brand]
completionProfile: brand
sideEffects:
  - generated placeholder mascot/logo asset bytes under the brand record's own assets
  - a local render of the real frontend shell and brand lockup, captured under the shell record's own assets
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
params:
  ownerRulings:
    type: string
    default: ''
    setBy: kernel
    doc:
      en: The owner's identity rulings, verbatim, each with where it was recorded (an owner-gate
        incident answer, a serve-ask answer). A StarCi Next brand op read only the empty bound
        frontend repository and reported no ruling while the owner's answer sat in an incident the
        worker cannot open.
  referenceSources:
    type: string
    default: ''
    setBy: kernel
    doc:
      en: Comma-separated read-only paths the owner's ruling names as the identity to follow, for
        example another product's global CSS and the dashboard and subscription pages it styles.
        Values traced to a declaration in these files are traced to a real file.
reads:
  - id: target
    path: .starciwork/brand/index.yaml
    purpose:
      en: "Read the existing product brand record, its declared refs, its current `rev` and validator
        freshness. There is exactly one brand record per product: this op revises that record rather
        than adding a second identity. When the product has no brand record yet, this path is absent
        and this op creates it at rev 1 as the record's first owner, not a second one."
  - id: owner
    path: .starciwork/features/*/{br,fr,decision}/**/index.yaml + the selected request and the owner's
      recorded rulings + params.ownerRulings
    purpose:
      en: Inferring identity from a competitor, a template or a screenshot is not a ruling.
  - id: grammar
    path: consuming app manifest/lockfile + resolved component package exports/types/renderers/CSS + app
      family root/style imports; before the app is scaffolded, the grammar package and family the
      owner's ruling names
    purpose:
      en: Resolve the installed design grammar from the actual consuming app, honoring workspace aliases
        and bundler resolution, and record package identity, version, resolved path and inspected
        file hashes. A similarly named family variable is not proof it is wired. A frontend that is not
        scaffolded yet has no manifest; then the family the owner ruled is read from the grammar
        package itself and recorded as the family the scaffold installs.
  - id: sources
    path: repository:<repo-id>/<bound-paths> + params.referenceSources
    purpose:
      en: Read the real token and style files of the frontend repository - the app's global CSS, the
        family root, the theme and token files the owner named or that this repository actually
        contains - and record each file path with the exact declaration every token value comes
        from.
  - id: assets
    path: .starciwork/brand/assets/* + repository:<repo-id>/<bound-paths>
    purpose:
      en: Read the mascot, logo and icon-set assets that already exist - beside the record and in the
        frontend repository - with their formats, dimensions and provenance. Reuse an existing
        verified asset before producing any new one; an asset whose rights or origin are unknown is
        reported, not adopted.
  - id: shell
    path: .starciwork/shell/index.yaml
    purpose:
      en: "The product's existing shell record (work/app-shell@1) with its rev, origin, recorded source
        digests and shell/assets/** captures. Absent until the chrome is first captured; this op then
        writes it at rev 1."
  - id: shellSource
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: "The frontend's real persistent chrome: the layout component that wraps signed-in routes, the top
        bar and its controls, the brand lockup component, the navigation component and its destination
        registry, the locale routing config and the message files the nav labels are read from, and the
        seed or fixture data a demo tenant is taken from. Absent when no frontend layout exists yet."
  - id: settledDesign
    path: .starciwork/features/*/{journey,sds}/**/index.yaml
    purpose:
      en: The accepted journeys and frontend design records a planned shell takes its destinations and demo
        tenant from when the frontend has no layout yet.
  - id: knowledge
    path: knowledge/index.yaml + applicable UI presentation/composition and installed family topics
    purpose:
      en: Read the applicable presentation, composition and family topics before mapping a decision onto a
        token name, a contrast floor or an icon rule. Knowledge explains ownership and composition;
        the installed package and the real source files determine what a value may actually be.
  - id: profile
    path: modules/models/registry.yaml + selected runtime execution profile + actual host tools/model
    purpose:
      en: Resolve this operator's request-bound external-agent chain from the selected StarCi skill and
        active profiles, and establish whether an image generator is actually available to this
        runtime. Use current host model configuration; historical model names are not availability
        proof. Capabilities are the intersection of actual tools, selected profile policy, op
        permissions and existing task authority.
writes:
  - id: node
    path: .starciwork/brand/index.yaml
    fields:
      - schema
      - id
      - state
      - rev
      - colour
      - typography
      - mascot
      - logo
      - iconography
      - imagery
      - voice
      - motion
      - donts
      - review
      - extensions
    content:
      en: "Write the whole identity into the one brand record (schema work/brand@1, id brand): colour
        tokens as name -> value with role and the policy that governs them (whether danger may match
        primary, the contrast floor - stated in `donts` concretely enough to check), typography,
        mascot, logo, iconography, imagery, voice, motion, the `donts` list every later surface is
        judged against, and `review` naming who settled this revision and on what authority - a
        brand reaches done only through that review. `sources`-style traces to the real files each
        value was read from live in the record's extension fields; every asset byte lives under the
        brand record's own `assets/` with its sha256. Bump `rev` once per accepted revision and
        state what changed. No product code, no second brand owner and no identity claim the owner
        did not rule."
  - id: brandAssets
    path: .starciwork/brand/assets/<asset>
    fields: [asset bytes with sha256 provenance]
    content:
      en: "Store reused or newly generated identity bytes under the brand record's own assets in their
        actual formats, each with its sha256 and its provenance recorded beside them. A mascot the
        product does not yet have may be produced once as an explicit placeholder from the owner's
        description with the available image generator; it is recorded as a placeholder, never as
        the final mascot and never as a capture of a shipped surface. When no generator is actually
        available, record a concrete deferred brief instead and leave the slot empty: a missing file
        is never described as generated."
  - id: shellNode
    path: .starciwork/shell/index.yaml
    schema: work/app-shell@1
    fields:
      - schema
      - id
      - kind
      - state
      - rev
      - origin
      - app
      - source
      - topBar
      - nav
      - productLocale
      - persona
      - assets
      - review
      - change
    content:
      en: "The one shell record (schema work/app-shell@1, id shell): origin repository with `source` naming
        the layout component and every chrome file with its sha256 at the read revision, or origin planned
        when no frontend layout exists; the top bar component, its slots in order and the controls it has
        not (`absent`); the lockup component with the path of its capture; the nav registry in source order
        with key, route, i18n key and the label in every locale copied from the message files;
        productLocale {default, fallback, locales} from the locale routing (the brand voice default when
        the app declares none); the persona {workspace, user, currency, dateFormat} from the seed or fixture
        data the app demos with; and every capture under `assets` with role, sha256, route, viewport, theme
        and locale. A sibling evidence.yaml binds the capture run. Bump `rev` whenever any of it changes."
  - id: shellAssets
    path: .starciwork/shell/assets/<asset>
    fields: [capture bytes with sha256 provenance]
    content:
      en: Real browser renders of the running frontend - the shell at each declared breakpoint and theme in
        the productLocale default, and the brand lockup cropped from the same render - never a generated
        image. A planned shell carries the lockup rendered from the brand masters.
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, extensions]
    artifacts: [manifest.yaml, brand-check.txt, token-trace.md, shell-conformance.txt]
    content:
      en: Retain the actual output of the brand checks with their exit status, the token-to-source trace
        (token name, value, file and declaration it was read from), the resolved package/family
        evidence and the provenance of every asset. An honest not-run or failing check cannot earn
        done.
steps:
  - reads:
      - target
      - owner
      - grammar
      - profile
    writes: [node]
    action:
      en: "Freeze the brief before writing anything: the product name, the actually installed grammar
        family, and each identity decision the owner has ruled - primary hue, whether danger may
        match primary, the mascot and where it may never appear, typography, voice. Record the
        decisions as closed options with the ruling that selected them; an unruled taste decision is
        a question with the options, never a preference this op supplies. Resolve the execution
        profile and whether an image generator is actually available before planning any asset work;
        this selects no model and spawns no worker. An absent brand record is not a gap: this op writes
        the product's first one at .starciwork/brand/index.yaml. A brand record that exists anywhere
        else, or a second one, is the scope/graph gap to report; never create a second brand owner. Read the
        accepted requirement and decision records plus the owner's actual rulings about identity -
        the name, the primary hue, whether danger may match primary, the mascot and what it may
        never appear in, the voice. A taste decision belongs to the owner: an unanswered one is a
        question with the closed options, never a choice this op makes on the owner's behalf. The
        family's own token names are the vocabulary this record may use: a colour is declared as the
        grammar token the renderer actually consumes, never as a free-floating hex value with an
        invented name."
  - reads:
      - sources
      - grammar
      - knowledge
    writes: [node]
    action:
      en: "Derive every colour token from the real source files and nothing else: open the app's global
        CSS, family root and theme/token files, and for each value record the token name the
        renderer consumes, the value, and the exact file and declaration it came from. Map the
        owner's decisions onto those grammar token names rather than inventing a parallel palette. A
        value you cannot trace to a declaration in a real file is not written: it is a question
        naming the token and the file it should live in. Declare `sources` as that exact file list.
        These files are the source of truth for a value: this op copies them, it never proposes a
        palette the product does not already serve. A source file the record names and that does not
        exist is an environment blocker, never a value filled in from memory."
  - reads:
      - sources
      - knowledge
      - owner
    writes: [node]
    action:
      en: Give every token its role (primary, danger and the rest) and write the policy that governs the
        set - whether danger may match primary, and the minimum contrast every text-on-surface pair
        must hold. Check the pairs the record itself declares against that floor and against the
        policy, and record the measured ratios. A token set that cannot satisfy the owner's ruling
        and the floor at the same time is reported with both numbers, never quietly adjusted to
        pass.
  - reads:
      - assets
      - owner
      - profile
    writes: [brandAssets, node]
    action:
      en: Settle the mascot, the logo and the icon set. Reuse the assets the repository already has, with
        their real paths and provenance. Only when the product has no mascot asset at all, generate
        one explicit placeholder from the owner's description with the available image generator,
        store it under the record's own assets with its sha256, and record it as a placeholder
        pending the owner's acceptance; if the runtime has no generator, write a concrete deferred
        brief instead and never claim a file exists. Write `mayAppearIn`, `neverIn` and the usage
        rules for each, and name the single icon set the product may use so no later screen
        introduces a second one.
  - reads:
      - target
      - knowledge
      - owner
    writes: [node]
    action:
      en: "Write the rules that make every later surface derive from this record rather than from taste:
        imagery style with its explicit forbidden list and prompt rules that require every later
        image prompt to state this brand by name, family, palette and mascot policy; the
        artwork-slot conventions a drawing fills; voice; motion; and the `donts` list the record is
        judged against. A rule nobody could check from the record is rewritten until it can be."
  - reads:
      - shell
      - shellSource
      - settledDesign
      - assets
      - profile
    writes: [shellNode, shellAssets, evidence]
    action:
      en: "Capture the app shell into the shell record. When the frontend has a persistent layout, read it
        from source: the layout component that wraps signed-in routes, the top bar with its slots in
        order and the controls it does not carry, the lockup component, the navigation registry in source
        order with each destination's key, route and message key, and the label for every locale copied
        from the message files; the locale set, default and fallback from the locale routing; the demo
        workspace, user, currency and date format from the seed or fixture the app demos with. Digest every
        file read. Serve the app locally and render the shell in a real browser at each declared breakpoint
        and theme in the default locale, and the lockup from the same render; store the captures with their
        sha256, route, viewport, theme and locale. When no frontend layout exists yet, write origin planned:
        destinations and persona from the accepted journeys and frontend design records, the locale from
        the brand voice default, and the lockup rendered from the brand masters - never a chrome the
        records do not name. A destination with no label in the default locale, or a tenant no seed or
        record names, is a question with the candidate values, never an invented one. Bump the shell rev
        whenever the chrome, labels, locale or persona changed."
  - reads:
      - target
      - sources
    writes: [node, evidence]
    action:
      en: "Run the brand checks against the real frontend repository and keep their output: token values
        match their declared sources, every declared text pair holds the contrast floor, primary and
        danger are distinct unless the policy permits otherwise, every declared mascot asset exists
        with its recorded hash, and the icon set is the only one named; run `node
        scripts/checks/shell-conformance.mjs .starciwork/shell/index.yaml` and keep its output as
        shell-conformance.txt. Bump `rev` and record what
        changed. Report `done` exactly once with the new `rev`, the checks and the token-to-source
        trace; a failing check is `failed` with its output; a value that cannot be traced to a
        source is `ask` naming the token and the file; a source file the record needs and that does
        not exist is `blocked` with `environment` and the exact path. Never report done on unrun
        checks."
proofs:
  - id: binding
    requirement:
      en: Run the record-class validator `starci validate` and, on every record directory it writes, `starci validate --strict`; every cited ID/path exists or is explicitly
        proposed, required assertions are covered, input bindings are current, and an honest
        not-run/fail cannot earn done.
  - id: token-traceability
    requirement:
      en: Every colour token in the record names the grammar token the renderer consumes and the exact
        source file and declaration its value was read from, and `sources` lists those files. A
        value with no traceable source is a question, never a record entry; a resolved package name
        and version alone is not a trace.
  - id: brand-checks
    requirement:
      en: "The machine checks ran against the actual frontend repository and their real output is retained
        with its exit status: source match, contrast floor, primary/danger distinctness under the
        declared policy, mascot assets present with their recorded hashes, and a single icon set. A
        green summary without retained output is not proof."
  - id: asset-provenance
    requirement:
      en: Every identity asset the record declares exists under the record's own assets with its sha256
        and its provenance, and a generated placeholder is recorded as a placeholder. A deferred
        asset carries a concrete brief and an empty slot; no missing file is described as generated
        or accepted.
  - id: shell-capture
    requirement:
      en: "`node scripts/checks/shell-conformance.mjs .starciwork/shell/index.yaml` exits 0 on the written shell record:
        it is done, its captures exist with their recorded hashes and include the brand lockup (and, for
        origin repository, a real shell render), every nav item carries a label in the productLocale
        default, and every recorded source file still hashes as recorded. `starci validate --strict`
        compiles it against work/app-shell@1."
    check: scripts/checks/shell-conformance.mjs
blockers:
  - code: SHELL_RENDER_UNAVAILABLE
    condition:
      en: The frontend has a persistent layout but it cannot be served or rendered in a browser on this host,
        so no real shell capture can be taken. Report `blocked` with `environment` and the exact command
        that failed; never substitute a generated image or a description for the capture.
  - code: BRAND_SOURCE_MISSING
    condition:
      en: A token/style source file this record must read does not exist in the selected repository, or
        the repository itself is not resolvable. Report `blocked` with `environment` and the exact
        path; never substitute a remembered value for an unreadable file.
  - code: BRAND_TOKEN_UNTRACEABLE
    condition:
      en: A required token value cannot be traced to a declaration in a real source file, or two sources
        disagree about it. Report `ask` naming the token, the candidate values and the files; never
        write the value you would have chosen.
  - code: BRAND_DECISION_UNRULED
    condition:
      en: An identity decision the record needs - primary hue, whether danger may match primary, the
        mascot and its forbidden placements - has no owner ruling, or the ruling contradicts the
        contrast floor. Report `ask` with the closed options and what each one costs.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite is not effectively done, or a required declared input/scope is missing.
        Report node/resource IDs and propose a separately selected graph update when needed; never
        run predecessors or weaken dependsOn/refs/required to proceed.
placeholders:
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Actual selected source asset filename/format
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
route:
  nodeKinds: [brand]
  phase: [decide, pre-implementation]
  intent: [brand, identity, tokens, decide, shell, chrome]
  prerequisites: [scope defined]
  riskHints: [generates-assets]
