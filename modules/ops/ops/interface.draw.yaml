schema: starci/op@1
id: interface.draw
goal:
  en: Establish the interface direction before frontend implementation by token-render. Select the
    smallest useful representative set of critical screens, draw each of their shapes (one per
    `XBase#state`) as real HTML/CSS in the installed Grammar's tokens, or the real `XBase` with
    fixtures, captured by Playwright, from accepted business/SDS, brand, resolved UI knowledge and
    Grammar geometry; retain each brief, render source and self-check, classify every visible region
    as a reusable raster asset or code-native DOM/CSS/SVG realization, and map every remaining
    screen/shape/component explicitly.
params:
  candidatesPerScreen:
    type: integer
    default: 1
    min: 1
    max: 3
    setBy: owner
    doc:
      en: How many alternative directions to draw for one screen. Above the default the owner is asked
        to pick. At the default a drawing another leg waits on still files its draw-review ask (steps and
        proof owner-review); the runtime accepts it unless the owner asked for that drawing.
  representativeScreensMax:
    type: integer
    default: 5
    min: 1
    max: 12
    setBy: kernel
    doc:
      en: The ceiling on the representative screen set; every remaining screen is accounted for by the
        coverage map.
nodeKinds: [ui]
completionProfile: ui
grammarContext: required
sideEffects: ['rendered shape parts with their exact brief and render source, raster-region images with their exact prompts, and the direction images composited from the parts into the real layout captures, under the owning UI node assets']
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
  workGraph: revise
reads:
  - id: target
    path: .starciwork/features/<feature>/ui/<name>/index.yaml
    purpose:
      en: "The selected ui record: its feature's scope, proof demands, refs/dependencies, its `ui.shapes`
        (one per `XBase#state`) and `ui.dataStatus`, existing directions and freshness. For an explicitly
        new target the record is absent, and the nearest existing ancestor/workspace carries the
        surrounding scope."
  - id: business
    path: .starciwork/features/<feature>/{fr,nfr,br,decision,data,journey}/**/index.yaml
    purpose:
      en: The accepted requirements, decisions, actors, journeys, states, content and acceptance IDs in
        scope.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: The accepted design flows, component boundaries, data/API contracts, security and failure
        behavior relevant to the interface.
  - id: brand
    path: .starciwork/brand/index.yaml with its declared brand/assets/** masters
    directionArchetype: true
    purpose:
      en: "The current brand record and its actual masters: tokens, typography, logo/mascot placement,
        imagery rules, rights, rev and forbidden treatments; and its brand.direction (brand.decide's direction
        mode): the archetype block of the record's ui.archetype (scripts/work/ui-archetype.mjs derives it when
        absent) and the rubric (brand.direction.rubric.checks) the draw loop's critic judges beauty and hierarchy
        by. Dispatch refuses prerequisite-unmet (direction-unaccepted) until the owner accepted that archetype
        (scripts/checks/brand.mjs checkDirection evidence.ready; runtimes.yaml
        allocation.drawLoop.directionPrerequisite switches it)."
  - id: shell
    path: .starciwork/shell/index.yaml
    mustExist: true
    layoutChain: true
    purpose:
      en: "The product's layout tree (work/layout-tree@1) with its shell/assets/** captures: one node per
        app/ segment - route groups, parallel slots @x, intercepting routes (.)x, loading/error/not-found
        files - each layout with its chrome (visible or passthrough), rev, navigation with labels per
        locale out of the i18n catalogs, and real captures per breakpoint and theme with the page slot
        rectangle measured (desktop and mobile in the light theme are required; dark is optional); the
        breakpoints and themes; productLocale; the demo personas by role; the brand lockups; its origin
        (repository scanned from app/, or planned)."
  - id: knowledge
    path: knowledge/index.yaml with the applicable UI composition, presentation, proof and family topics
    purpose:
      en: "The applicable UI rules and references for hierarchy, density, states, accessibility,
        responsive behavior and visual review. When a Grammar family is resolved for the consuming
        app, composition law comes from two tiers: the installed package's shipped `concepts.yaml` —
        its authored normative vocabulary, selection map, composition rule ids and anti-patterns,
        resolved via `node_modules/<pkg>/concepts.yaml`, then a project-vendored
        `.starciwork/_resources/grammar-concepts.yaml`, then a source checkout — and the family's
        cataloged reusableStyle (idioms) and productComposition (playbook) under
        knowledge/grammars/<family>/ as observed-evidence supplement."
  - id: grammar
    path: consuming manifest/lockfile with the resolved Grammar exports/types/renderers/CSS and actual
      anatomy/reference captures
    purpose:
      en: "The Grammar resolved from the consuming application, including aliases and lockfile: package
        identity, version, resolved path, inspected hashes/anchors, real public exports, prop types,
        component anatomy, state contracts, CSS/tokens and relevant reference imagery. When the
        resolved package ships a `captures/` directory — per-story rendered component PNGs with an
        index.json, produced by the package's storybook capture harness — those are the package's
        own ground-truth renders. Resolution order: the consuming app's installed
        `node_modules/<grammar-pkg>/captures/`, then a project-vendored
        `.starciwork/_resources/grammar-captures/` (a verbatim copy of the package's captures dir),
        then a source checkout of the Grammar repo. Captures carry the family they were rendered
        under."
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: The existing source's manifests, active family/root and selected current UI context. Greenfield
        work records source not-yet-created honestly.
  - id: profile
    path: modules/models/registry.yaml with modules/models/runtimes.yaml, the selected runtime and the
      actual host tools
    purpose:
      en: Whether this host runs the Playwright capture of `scripts/work/draw-render.mjs` and exposes
        built-in `image_gen.imagegen` for raster regions, and which tool was actually invoked.
        Image-model selection is not exposed by the image tool, so no model name is available from it.
  - id: generatedDirection
    path: N/assets/**/<asset>
    purpose:
      en: The part, brief, render source and prompt bytes created earlier in this same operation,
        reopened for visual review, coverage binding and final hash verification.
  - id: workflow
    path: the selected workflow request with modules/kernel/verdict-contract.yaml and this op's
      authority.json
    purpose:
      en: The exact request, outputs and authority when this operation belongs to a named workflow.
writes:
  - id: node
    path: .starciwork/features/<feature>/ui/<name>/index.yaml
    schema: work/ui-screen@1
    fields:
      - schema
      - id
      - title
      - state
      - brand
      - shell
      - route
      - routeParent
      - surface
      - direction
      - routed
      - host
      - persona
      - refs
      - "ui:
        {status,archetype,intent,surfaces,states,coverage,flow,accessibility,responsive,assets,artworkSlots,o\
        bservations,gaps}"
      - assets:[{path}]
      - blockedBy
    content:
      en: "The selected direction in the approved ui record. `ui.coverage` holds scale,
        representativeScreens and a map of screen/shape/viewport to actual Grammar components,
        derivation and optional directionAsset. `ui.flow` holds the durable interaction-flow map
        derived from accepted journeys/SDS: every transition with its trigger and landing shape, and
        the explicitly named edge cases — refresh mid-flow, external redirect return, double-submit,
        tab close, failure/retry and dead-end paths. Its shape is the work/ui-screen@1 `ui.flow` block: route or routes,
        optional scope and states, `transitions` of {from, trigger, to} with optional id, guard,
        rule and effect, and `edgeCases` as sentences or {name, handling}; the map lives in the
        record itself, never only in an asset file. Accessibility, responsive rules, copy, interactions and artwork slots
        are described alongside them, and every part, brief, render source and raster prompt appears in both ui.assets
        and the node assets list. The record states where it sits in the App Router: `route` (the layout
        tree node id, /[locale]/(console)/agentos/[id]/accounting; a route the tree does not hold yet
        names its nearest existing `routeParent`), `surface` (layout, page, modal, drawer, or one of the
        data-status route files loading, error and not-found; an overlay may vary per breakpoint, {desktop: drawer, mobile: modal}), `direction`
        for a drawer (left, right, top or bottom, per breakpoint allowed - a bottom sheet is a drawer from
        the bottom), and for a modal or drawer `routed` (true - an intercepting @modal/(.)x route plus the
        full page x/page.tsx; false - component state with no URL) and `host` (the ui record or route it
        opens over). A popover, dropdown, toast or tooltip is a state in ui.flow, never a record. The
        top-level `shell` binds the tree as {ref: shell, rev, layouts: [{node, rev}] for every visible
        layout above the route, activeNav: <nav key>}, or {chromeless: true, because}."
  - id: designSource
    path: N/assets/**/<asset>
    fields:
      - ui.assets:[{path,role,provenance,generation?,composite?,breakpoint,theme}]
      - assets:[{path}]
    content:
      en: "Under the owning UI node's assets/directions/: each drawn SHAPE is the XBase content only - the
        block or page body region the XBase renders, never the page with its layout chrome (sidebar, header,
        tabs belong to the Layout and are never redrawn; owner ruling 2026-09-27) - captured by
        scripts/work/draw-render.mjs --state <state> as <XBase>#<state>--<breakpoint>--<theme>.png (an older
        <shape>--<presentation>--<breakpoint>--<theme>.content.png part stays readable) with its exact sibling
        brief (.prompt.txt), render source (.html), its ui-proof score (.score.json, the output of
        ui-proof-brief.mjs --score on that html) and draw-render capture record, role direction-content,
        `generation.tool: draw-render` and promptPath; an overlay draws its panel alone; a surface-layout
        record draws the layout's own chrome. Each raster region the part embeds carries its exact sibling
        prompt and `generation.tool: image_gen.imagegen`. A full-page composite is never bound as a drawing
        (DRAW_SCOPE_FULL_PAGE); scripts/work/compose-direction.mjs may still place a part into the layout
        chain as unbound evidence for interface.implement and interface.audit. Every drawn shape has its part
        at desktop AND mobile in the light theme; dark is optional. The part is what the owner reviews -
        shapes only, one per XBase#state of ui.shapes, never a retired data-status image. Reference inputs
        stay under their existing owner and are cited rather than copied."
  - id: evidence
    path: E/**
    fields: [id, nodeId, inputDigest, outcome, assertions, assets, provenance, codeRefs, extensions]
    artifacts: [manifest.yaml, direction.png, prompt.txt, visual-review.md, symbol-review.json, realization-map.json]
    content:
      en: "The evidence bundle: `manifest.yaml`, the rendered `direction.png` bytes, the exact brief
        `prompt.txt` bytes, `visual-review.md` (the cited self-check), `symbol-review.json` and
        `realization-map.json`, with the actual render and ImageGen tool provenance and all accepted
        input refs. `symbol-review.json`
        records, for every prominent symbol family, its exact product concept, likely alternate
        reading without labels, audience maturity, metaphor specificity, sibling distinction, family
        coherence, reduced-scale legibility and why raster-asset or code-native is the truthful
        medium. `realization-map.json` classifies each visible region as `raster-asset` or
        `code-native` with its rationale, responsive/state behavior, asset/artwork-slot binding when
        raster, and Grammar component plus CSS/SVG/DOM anatomy when code-native."
  - id: draws
    path: E/draws.yaml
    fields: [draws, coverage]
    content:
      en: "The readable mapping of representative directions, prompt artifacts and complete remaining
        coverage. Each draw is one shape at one breakpoint and theme - desktop and mobile, light, for
        every drawn shape - and binds `part` {path, sha256} (the drawn part the owner reviews), `composite`
        {path, sha256} (the part placed into the layout chain - evidence for implement and audit only),
        its brief, screen/shape/breakpoint/viewport/theme and `provenance.tool: draw-render`. The UI
        node owns the image, brief and source bytes; this file indexes them.
        scripts/kernel/serve-ask.mjs and scripts/connectors/telegram-media.mjs read it and show the owner
        each draw's part (then `content`, then `image` on an older draws.yaml), never the composite."
  - id: work-graph
    path: E/work-graph.json
    schema: starci/work-graph@1
    fields: [domains, nodes, edges]
    content:
      en: The workflow's next work-graph version - each shape this op drew attached to its slice.
steps:
  - reads:
      - target
      - business
      - architecture
      - brand
      - shell
      - knowledge
      - grammar
      - repo
      - profile
    writes: [node]
    action:
      en: "Place the record in the layout tree before anything else. Read the tree and write `route`,
        `surface` (per breakpoint where an overlay changes form), `direction` for a drawer, and `routed`
        and `host` for a modal or drawer; a popover, dropdown, toast or tooltip is a flow state of its
        page, not a surface. Layouts are drawn first: a `surface: layout` record draws a planned layout -
        its chrome with the page slot left as one flat #FF00FF rectangle - and pages or overlays under it
        wait until it is accepted; a repository layout is never drawn, it is captured by brand.decide. The
        layout record's id is exactly the planned node's layout.design, the name brand.decide gave it
        (ui.<feature>.<layout>-layout, so it lives at features/<feature>/ui/<layout>-layout/), with
        `surface: layout` and `route` the layout node id; never rename it or pick another feature. A
        planned visible layout with no layout.design is brand.decide's to name: report `blocked` with
        blocker `brand-gap` naming the node.
        Every layout above the route must be settled (`node scripts/checks/shell-conformance.mjs
        <ui-record-dir>` names any that is not) and is bound by its rev in shell.layouts; an unsettled
        ancestor is LAYOUT_ANCESTOR_UNSETTLED, never a chrome of the worker's own. The chrome, navigation,
        UI language and demo personas come from the tree and nowhere else. Freeze complete coverage before drawing.
        Draw only shapes: the record's `ui.shapes`, one per `XBase#state` at the viewports it names
        (`examples/shape-slot/README.md`, knowledge/code-examples/frontend/connected-block); a record
        without `ui.shapes` draws the states of its ui.flow less every data status. A data status -
        loading, empty, error, forbidden, skeleton, 401/403/404, a slot retrying, pending, uncertain,
        stale or last-known, unverified or limited, a no-<thing> state, and a loading, error or not-found
        surface - is never drawn, nor is a variant that only adds a status banner or badge to the same
        layout, unless its shape carries nonDerivable: the SlotView formula, the
        default shape's skeleton or `notFound()` renders it, and the coverage map names which. A record
        rendered by recipe (scripts/checks/ui-shapes.mjs recipeRenderedOf: a loading, error or not-found
        surface, or every state it names a data status) has nothing to draw: write it done with no
        drawing and no owner review.
        Enumerate every required screen, shape and responsive band from accepted journeys/SDS; map each
        combination to actual inspected Grammar components. Enumerate the interaction flow with the same
        rigor: every transition's trigger and landing shape, and every reachable edge case. Write that
        flow map into the ui record. Classify the scope as bounded or large; for a large task choose the
        representative set of critical screens covering the highest-risk layouts, interactions,
        brand moments and component anatomy, never exceeding `params.representativeScreensMax`, and
        derive every remaining screen in the coverage map rather than drawing it.
        Every representative shape is drawn at desktop AND mobile in the light theme - a drawer's
        direction per breakpoint as the record declares it; dark is optional and never demanded.
        Draw `params.candidatesPerScreen` directions per screen; when that is more than one,
        park an owner ask so the owner picks - its question.assets list each candidate's PARTS, desktop
        and mobile, never a composite - keep every candidate as direction and retain the
        unchosen ones as evidence. Whatever candidatesPerScreen says, a record another leg waits on - a
        `surface: layout` record drawing a planned layout (its pages and, on a greenfield product, the brand
        lockup wait on it), or a record another record dependsOn - owes the owner ONE review of its drawn
        parts before it is done: `node scripts/work/draw-review.mjs status --ui <ui-record-dir>` says whether
        it is owed. A record already drawn at its current inputs is not redrawn for it: the attempt only
        files the review. Before drawing, classify every visible region by realization:
        use `raster-asset` for authored imagery whose identity depends on rich texture,
        illustration, photography or a declared mascot/media master; use `code-native` for layout,
        spacing, responsive structure, panels, cards, controls, text, system icons, borders,
        shadows, glows and simple geometric decoration representable by semantic DOM plus installed
        Grammar/CSS/SVG. A rendered part of code-native UI is direction only and never
        authorizes shipping that UI as a flattened image. A missing product decision, SDS behavior,
        Grammar capability or flow edge is a typed blocker, never filled with visual invention."
  - reads:
      - business
      - architecture
      - brand
      - shell
      - knowledge
      - grammar
      - target
      - profile
    writes: [node, designSource, evidence]
    action:
      en: "Write one exact brief per representative shape and breakpoint from accepted business/SDS,
        brand rules/masters and the resolved Grammar. It carries verbatim, and no number it does not
        carry is invented - a full-width control takes the fill-variant geometry the block gives, never
        the hug control's: the geometry block `node scripts/checks/grammar-geometry.mjs --prompt --repo
        <repo>` prints; the applicable proof cases and knowledge/ui values resolved to numbers with their
        rule ids that `node scripts/checks/ui-proof-brief.mjs --surface <ui-record-dir> --repo <repo>`
        prints; the grammar sources the dispatch attaches (packet context.grammar); and the brand block
        `node scripts/checks/brand-palette.mjs --prompt .starciwork` prints - each chromatic token by role
        with its hex and the rule that primary buttons, links, selected rows, focus rings, active tabs and
        every call to action are the primary hex. It states screen purpose, component regions, shape,
        viewport, accessibility and forbidden treatments, carries the line `Product locale: <default>`,
        writes every UI string in that product locale (never owner_language), and shows the data of one
        persona role the tree records. Every visible datum is concrete plausible data derived from the
        accepted business record — numbers, currency amounts, dates, names, statuses and copy — never
        lorem text, blurred stand-ins, skeleton or shimmer. A status line sits alone at the top of its
        card or as a neutral grey band, never beside a field label.
        Render the part from the brief at @2x with `node scripts/work/draw-render.mjs`: real HTML/CSS
        styled only with the Grammar tokens (--html <file> --out <dir> --viewports <w>x<h>
        [--full-page]), or the real `XBase` with fixtures (--component <module> --export <XBase> --props
        <fixture.json>); a red capture is fixed and re-rendered, and its .json record is kept beside the
        part. The viewport is the page slot rectangle
        the innermost visible layout's capture records for that breakpoint; for a modal or drawer the
        panel; for a layout its own chrome with its slot a flat #FF00FF rectangle. The part draws no
        sidebar, top bar, logo or navigation, because the real one surrounds it. ImageGen never draws chrome
        or UI: built-in `image_gen.imagegen` paints only raster regions (mascots, illustrations), each
        from its exact retained prompt, embedded in the render as an image. A part painted in a colour the
        brand does not declare is refused (PALETTE_OFF_BRAND, naming the colour, its area share and the
        nearest brand token; PRIMARY_ABSENT when it stands in for the primary) and is re-rendered from the
        tokens, never recoloured by hand. Render each shape once per required breakpoint - desktop and
        mobile, light theme - at that breakpoint's slot size (or panel shape), never one image stretched to
        both.
        DNA ONLY (owner ruling 2026-09-27): compose only the Grammar's DNA components
        (knowledge/grammars/<family>/DNA.yaml renderers) with HeroUI/Grammar defaults first; every visible element
        of the render source carries data-grammar-component=\"<DNA name>\" (with data-grammar-part for its anatomy
        part and data-<prop> for a closed value) or data-grammar-proposal=\"<name>\"; a notice is DNA Alert with a
        tone and its alert-actions, a ratio is one DNA Meter (role=meter, aria-valuenow/max). Anything DNA lacks is a
        grammar proposal - grammar-proposal.md or .yaml beside the source or in its loop directory, each entry with
        its name, the gap in DNA, anatomy, tokens, the knowledge rules it claims and an isolated render
        (scripts/work/grammar-proposal.mjs check) - never invented inline; the owner decides it through the
        draw-review ask. THE DRAW LOOP (owner ruling 2026-09-27): render and judge every shape only through
        `node scripts/work/draw-loop.mjs round --ui <ui-record-dir> --html <source.html> --base <XBase> --state
        <state> --viewports <desktop WxH>,<mobile WxH> --repo <repo>`: each round draw-renders the source,
        runs EVERY machine metric (the capture, the DNA gate, the taste metrics DRAW_ACCENT_BUDGET /
        DRAW_TOO_MANY_BANDS / DRAW_TOO_MANY_BADGES, copy, badges, actions, the brand palette, the Grammar
        geometry and the ui-proof score) and then an independent critic - a fresh codex session with no drawing
        context, only the PNGs, the HTML and the product's brand.direction rubric - scores every rubric check
        and the beauty 1-10, recorded in <out>/round-<n>/{source.html, parts, metrics.json, critique.json}. Fix
        the source against metrics.json and critique.json and run round again until the loop stops: every metric
        passes and beauty is at least allocation.drawLoop.beautyMin, or maxRounds rounds, or stallRounds rounds
        in a row without progress. Then `node scripts/work/draw-loop.mjs finish --out <loop dir>` selects the
        BEST round, installs its parts beside the source and prints the ui.assets entries (generation.loop) to
        record verbatim, and name <loop dir>/loop.json in report.files (every round and critique is indexed as
        job evidence); outcome blocked means report `blocked` naming its remaining failures and the best
        round, never pass. Never hand-edit a part after finish, never self-score beauty, never skip the
        critic. Save the capture as assets/directions/<shape>--<presentation>--<breakpoint>--<theme>.content.png
        beside its exact brief (.prompt.txt) and render source (.content.html), and declare that .html in
        ui.assets and the node assets list so shell-conformance measures its geometry - this part is
        what the owner reviews - then composite it: `node scripts/work/compose-direction.mjs --ui <ui-record-dir>
        --content <png> --breakpoint <bp> --theme <theme> --state <shape> --tool draw-render
        [--presentation page|overlay]` places it into the real layout capture - for a layout with
        destinations, the render with the destination the record's route makes active (a bound
        shell.layouts[].destination overrides it, shell.activeNav decides when no route matches; `node
        scripts/work/layout-tree.mjs destinations --work .starciwork --route <route>` shows the pick) - (or, for an overlay, over
        the host's page composite at the same breakpoint and theme, dimmed, the panel centred for a
        modal or anchored to the drawer's direction edge) and prints the two asset entries to record
        verbatim. A routed overlay is composed in both presentations - over its dimmed host and as its
        full page inside its layout chain; a non-routed overlay only over its host. Open every composite,
        review it, and record the actual tool provenance, naming an image model only when the tool
        itself exposed one."
  - reads:
      - target
      - generatedDirection
      - brand
      - knowledge
      - grammar
    writes: [node, evidence]
    action:
      en: "Review each direction against business truth, brand, relevant UI rules and the inspected
        Grammar anatomy. Self-check every part in visual-review.md: cite a rule id from the brief for
        every inset, gap, radius and type size it uses, and mark each applicable proof case satisfied,
        not satisfied or not observable; a value without a rule id or a case not satisfied fails the
        part. Before accepting any prominent icon, illustration or symbolic family,
        self-question it explicitly: what exact product concept does it encode; what would a viewer
        infer if the label disappeared; is the metaphor generic or brand-specific; does its maturity
        fit the audience/category; is it distinct from siblings; do camera, base, material, light,
        scale and density form one family; does it remain legible at the smallest required viewport;
        and could installed Grammar or repository-native SVG communicate it more truthfully than
        raster artwork. Reject childlike clip-art, generic stock metaphor, semantic ambiguity and
        mixed visual families unless accepted intent explicitly requires them. Reject any direction
        that breaks a rule of the brief step — including a direction that draws titled cards inside
        cards, per-band cards, gapped bands or floating actions where the resolved Grammar concepts
        call for one joined surface with an external label row and hairline-separated bands, and slot
        content that draws a sidebar, top bar, logo, navigation, tenant or UI language of its own inside
        the real chrome — and correct the source and re-render within the bounded
        representative set. Declare every
        embedded illustration/mascot/decorative/media region classified `raster-asset` as an
        artworkSlots entry for `interface.asset`. Record every `code-native` region with its
        semantic structure, Grammar primitive or family anatomy, responsive/state behavior and
        allowed CSS/SVG decoration; never send cards, panels, controls, typography or page
        composition to ImageGen as production assets. Update the coverage map so every non-drawn
        screen/shape says which representative direction it derives from, which actual Grammar
        components implement it and how its shape differs."
  - reads:
      - target
      - generatedDirection
      - workflow
    writes: [node, evidence, draws]
    action:
      en: "Validate Work and every artifact hash, run `node scripts/checks/shell-conformance.mjs` on every
        ui record directory written, then report the representative parts, briefs,
        actual tool provenance and complete coverage map. Everything shown to the owner - an ask's
        question.assets and picks, the report summary's images, the drawing notice - names the drawn
        parts (desktop and mobile), never a composite; the composites go in files and evidence for
        interface.implement and interface.audit. When `draw-review.mjs status` says the owner review is owed, report outcome `ask`
        with `question` exactly what `node scripts/work/draw-review.mjs question --ui <ui-record-dir> --job
        <id> [--lang <owner_language>]` prints - one ask per record, kind draw-review, its question.assets the
        desktop and mobile light shape parts and question.review the record and the part digests the owner is
        shown. Rule: a drawing the owner did not ask for is accepted without the owner - api serve-ask
        answers it with the accept option (answeredBy auto-recommended, ask-auto-accepted); a drawing the owner
        asked for (drawOwnerRulingOf reads it from the job's ledger lineage) reaches the owner on demand through
        the Telegram Generate URL flow. api report refuses a `done` report that
        leaves one unreviewed (draw-review-owed). When the packet's context.owner_answers holds the answer
        to that ask, run `node scripts/work/draw-review.mjs apply --ui <ui-record-dir> --receipt <its
        receipt> --write`: accept writes the record done (verificationSource authored-claim) with
        ui.review.owner naming the receipt and the part digests accepted (by the owner or auto-accepted), which lets
        layout-tree.mjs settle the planned layout and crop the lockup; commit it and report done. A redraw
        answer writes nothing and prints the owner's note - that note is the brief of this attempt's
        redraw, after which the new parts are asked again. Never write a record done, or ui.review.owner,
        by hand. State the truth boundary: the rendered
        direction is a design input, not exact component/render/API evidence. `interface.implement`
        produces the actual Grammar implementation captures and code checks, and `uat.verify`
        independently exercises the running product in a browser. Stop without frontend code and
        never self-advance."
  - reads: [target]
    writes: [work-graph]
    action:
      en: When the workflow has a work graph, attach every XBase#state shape this op drew to exactly one
        slice - the slice whose journey or FR the ui record serves - and record the revision; an unchanged
        graph records nothing.
proofs:
  - id: render-provenance
    requirement:
      en: Every representative part has its exact retained brief, carrying the grammar-geometry,
        ui-proof-brief and brand-palette blocks, and its render source, and records an actual draw-render
        capture; every raster region records an actual `image_gen.imagegen` invocation with its exact
        prompt. A claimed or guessed model name is not proof. The pass is judged over EVERY asset it binds -
        written, adopted, inherited or already there - and every live drawing of each ui record they belong
        to (scripts/checks/draw-acceptance.mjs, run by api settle) - an image with no draw-render receipt or
        with image-gen provenance (DRAW_ASSET_NOT_TOKEN_RENDERED), a drawn data status (DATA_STATUS_DRAWN),
        a whole-screen drawing or record rather than ui.shapes per XBase#state (DRAW_NOT_SHAPES), or a pass
        that only adopts or reuses prior evidence (DRAW_NOT_REDRAWN) is refused draw-not-accepted. A prior
        drawing is adopted only when it meets this contract itself; an image-gen drawing a redraw replaces
        is marked retired (reason image-gen) and kept, never deleted.
  - id: self-check
    requirement:
      en: visual-review.md cites a rule id for every inset, gap, radius and type size of every part and
        marks every applicable proof case satisfied, not satisfied or not observable.
  - id: coverage
    requirement:
      en: The representative set stays within its ceiling and the explicit coverage/component/shape map
        accounts for every remaining required screen, shape and responsive band using actual
        inspected Grammar anatomy, and names the formula that renders each data status. The `ui.flow` map accounts for every accepted transition and
        reachable edge case; an unaccounted flow edge is reported as a typed blocker, not silently
        resolved.
  - id: content-truth
    requirement:
      en: Every drawn shape renders concrete values from the business record; a part showing a skeleton,
        shimmer, grey placeholder block or other data status fails, and `starci validate` refuses a shape or
        drawing of a data status as DATA_STATUS_DRAWN (scripts/checks/ui-shapes.mjs).
  - id: truth-boundary
    requirement:
      en: The result is labelled proposed visual direction, never a working-product screenshot or exact
        component, render or API proof. Later implementation captures and browser UAT remain
        required and distinct.
  - id: realization-map
    requirement:
      en: Every visible direction region has exactly one justified realization mode. Rich authored imagery
        binds to a retained raster asset/artwork slot; layout, content, controls, system icons and
        representable visual effects bind to semantic DOM plus installed Grammar/CSS/SVG. Flattened
        UI screenshots cannot satisfy code-native regions, and a CSS approximation cannot silently
        replace a required brand/media asset.
  - id: symbolic-integrity
    requirement:
      en: Every prominent symbol has an explicit concept-to-form argument, alternate-reading check,
        audience-maturity check, non-generic rationale, sibling distinction, coherent family
        grammar, reduced-scale legibility proof and justified raster-asset or code-native
        realization. A readable but childish, clichéd or semantically interchangeable symbol does
        not pass merely because its label explains it.
  - id: shell-conformance
    requirement:
      en: "`node scripts/checks/shell-conformance.mjs <ui-record-dir>` exits 0 for every ui record directory
        written: its route is a node of the layout tree (or declared new under an existing routeParent);
        surface, direction, routed and host agree per breakpoint; every layout above the route is settled
        and bound at its current rev; every direction is a composite whose recorded layout capture (or
        host composite) is exactly the current one for its breakpoint and theme and whose pixels re-derive
        from its recorded inputs; a routed overlay has both presentations; every drawn state has composites
        at desktop and mobile in the light theme (DRAW_MATRIX_INCOMPLETE; dark is optional); every part's
        declared .html render source keeps the product grammar's geometry (GEOMETRY_OFF_GRAMMAR,
        scripts/checks/grammar-geometry.mjs); and every
        content prompt states `Product locale: <default>`. Its output is retained in evidence."
    check: scripts/checks/shell-conformance.mjs
  - id: brand-palette
    requirement:
      en: "Every drawn part and composite the record declares is painted in the brand record's colours:
        `node scripts/checks/shell-conformance.mjs <ui-record-dir>` reads their pixels
        (scripts/checks/brand-palette.mjs) and refuses PALETTE_OFF_BRAND for any colour the brand does not
        declare - a default blue primary, a purple icon - naming the colour, its share of the coloured area
        and of the image, and the nearest brand token; PRIMARY_ABSENT when the brand primary appears nowhere
        while such a colour does. Tints and shades of a token, navy/grey ink and the declared status colours
        (a green success dot, an amber warning) pass. The prompt carried the brand-palette --prompt block."
    check: scripts/checks/shell-conformance.mjs
  - id: owner-sees-parts
    requirement:
      en: "What the owner reviews for a drawing is the drawn part of each shape only - the page slot content,
        the overlay panel alone (not dimmed over its host), the layout's own drawing - at desktop and mobile;
        a retired data-status image is never shown. Every
        owner-facing list (ask question.assets and picks, draws.yaml `part`) names parts; a composite is
        evidence and the implement/audit reference. scripts/work/direction-part.mjs is the selection
        serve-ask and telegram-media apply, so an older record naming a composite still shows its part."
  - id: owner-review
    requirement:
      en: "Every drawing is done only on the owner's accept answer to its one draw-review ask, whatever
        candidatesPerScreen says (owner ruling 2026-09-27, contract change draw-content-owner-gate): a draw
        never turns green on checks alone. `scripts/work/draw-review.mjs question --job <id>` is the ask
        (desktop and mobile light shape parts, their digests in question.review, which the answer receipt
        keeps), and `draw-review.mjs apply` writes the record done with ui.review.owner {dispatchId, receipt,
        receiptSha256, answeredBy, at, parts}. A draw-review ask is never answered automatically, and a
        delegate never accepts. A part redrawn after the acceptance leaves the drawing unaccepted until it is
        reviewed again (direction-part.mjs drawingAcceptance). api report refuses draw-review-owed and api
        settle refuses DRAW_NOT_OWNER_ACCEPTED."
    check: scripts/work/draw-review.mjs
  - id: draw-quality
    requirement:
      en: "Correct tokens are not a pass (scripts/checks/draw-quality.mjs, run by api settle through
        draw-acceptance.mjs). Two drawn states of one XBase that differ only in a status band are one shape
        and a data status (SHAPE_DUPLICATE); a state a person leaves by a command renders a control for each
        command of the surface's FR (DRAW_ACTION_MISSING); the visible copy carries no internal ids or
        jargon - no source labels, no installation-1 or kebab ids, no uuids (DRAW_COPY_INTERNAL); every
        badge binds a tone token and a success word binds the success tone (DRAW_BADGE_UNTONED); every part
        has a current ui-proof score with no failed case, each failure being critique addressed before the
        pass (DRAW_SCORE_BELOW)."
    check: scripts/checks/draw-quality.mjs
  - id: grammar-dna
    requirement:
      en: "Every drawing composes only the Grammar's DNA (owner ruling 2026-09-27; scripts/checks/draw-dna.mjs, run
        by draw-quality.mjs at settle): every visible element of every part's render source carries
        data-grammar-component naming a DNA component, data-grammar-part naming an anatomy part of an enclosing
        component, or data-grammar-proposal naming a complete grammar-proposal entry; a closed prop value stays
        inside its DNA values (DRAW_OFF_GRAMMAR_COMPONENT). A notice is DNA Alert with a PresentationState tone -
        a container posing as one (role alert/status, notice/callout vocabulary, a toned surface, an outcome-toned
        IconTile beside an action) is DRAW_NOTICE_NOT_ALERT; a ratio is one DNA Meter with role=meter and its
        value - a hand-made bar, a Progress beside an n/m ratio or a segmented Meter without its Meter.segments
        proposal is DRAW_RATIO_NOT_METER."
    check: scripts/checks/draw-dna.mjs
  - id: taste
    requirement:
      en: "The taste a machine can measure (scripts/checks/draw-taste.mjs, thresholds in runtimes.yaml
        allocation.drawLoop): the accent colour fills at most accentBudget of each part, the brand art band
        excluded (DRAW_ACCENT_BUDGET); a card splits into at most bandsPerCardMax bands (DRAW_TOO_MANY_BANDS); an
        entity carries at most badgesPerEntityMax badges (DRAW_TOO_MANY_BADGES)."
    check: scripts/checks/draw-taste.mjs
  - id: draw-loop
    requirement:
      en: "Every live part came out of the draw loop (scripts/work/draw-loop.mjs): its ui.assets entry carries
        generation.loop {path, round} naming the loop record whose finish installed exactly its bytes
        (DRAW_LOOP_MISSING); every round keeps its source, parts, metrics.json and critique.json (the critic's
        model, exact prompt and verdict) as indexed job artifacts. At settle the runtime re-renders every live
        part and re-runs every machine metric itself (scripts/work/draw-loop-settle.mjs): a failure is
        DRAW_METRICS_FAILED, a metric it could not run DRAW_METRICS_UNVERIFIED - api settle refuses
        draw-metrics-failed and the draw reports blocked with the remaining failures and its best round, never
        pass. The critic's beauty is the loop's stop condition; the owner's draw-review accept stays the final
        acceptance."
    check: scripts/work/draw-loop.mjs
  - id: grammar-proposals
    requirement:
      en: "Every gap in DNA the drawing met is a complete grammar proposal (scripts/work/grammar-proposal.mjs:
        name, gap, anatomy, tokens, claims, isolated render), listed in the draw-review ask
        (question.grammarProposals) for the owner - never accepted by the worker or the runtime - and recorded at
        settle as a grammar-proposal-filed ledger event that api status lists as grammarProposals[] until a
        grammar lane resolves it."
    check: scripts/work/grammar-proposal.mjs
  - id: binding
    requirement:
      en: "`starci validate` passes, and `starci validate --strict` passes on the ui record directory
        it writes (the record, ui.flow included, compiles against work/ui-screen@1); every cited
        ID/path and asset byte exists, required assertions are
        covered, input bindings are current, and an honest not-run/fail cannot earn done."
    check: bin/starci.mjs
  - id: landed
    requirement:
      en: Every Work record file this operation wrote under its owned paths is committed with exact
        pathspecs in the checkout that holds it, and the report `head` names that commit. Settle
        refuses not-landed while one of them is untracked or dirty; authored Work never settles
        outside the repository history.
blockers:
  - code: APP_SHELL_UNSETTLED
    condition:
      en: The layout tree is absent, still a work/app-shell@1 record, has no brand lockup or persona, or no
        longer matches the frontend's app/ (LAYOUT_TREE_STALE). Report `blocked` with blocker `brand-gap`
        naming the record path and the failing check; brand.decide scans, converts or re-captures it.
        Never draw, describe or invent chrome to proceed. One exception - the drawing of a planned visible
        layout (surface layout, route the planned node, the id its layout.design names) does not wait for
        a lockup - on a greenfield product nothing renders one yet, and brand.decide crops it from this
        drawing once it is accepted (shell-conformance reports SHELL_LOCKUP_DEFERRED, info). Its binding is
        shell {ref shell, rev, layouts []} with the layouts list present and empty (no visible layout above it, so the lockup crop's tree rev
        bump never stales it). The prompt draws the wordmark from the brand record's logo, never an
        invented mark.
  - code: LAYOUT_ANCESTOR_UNSETTLED
    condition:
      en: A layout above the record's route is not settled - chrome undecided, a breakpoint or theme not
        captured, no measured slot, or a planned layout whose surface-layout ui record is not accepted.
        Report `blocked` with blocker `brand-gap` naming the layout node; brand.decide captures a
        repository layout, and the planned layout's own draw comes first.
  - code: RENDER_TOOL_UNAVAILABLE
    condition:
      en: The draw-render Playwright capture cannot run on this host. Report host-unsupported; do not
        substitute ImageGen, hand-painted boxes or a prose description.
  - code: IMAGEGEN_TOOL_UNAVAILABLE
    condition:
      en: A raster region is required and built-in `image_gen.imagegen` is not exposed on this host.
        Report host-unsupported; do not substitute another renderer for the raster region.
  - code: DRAW_LOOP_UNPASSED
    condition:
      en: The draw loop stopped (max rounds, or rounds without progress) and `draw-loop.mjs finish` says outcome
        blocked - a machine metric still fails in the best round, or the critic's beauty stays under
        allocation.drawLoop.beautyMin. Report `blocked` naming the remaining failures and the best round (its
        loop.json and round directory in report.files) - blocker `grammar-gap` when every remaining failure is a
        DNA gap waiting on a grammar proposal, else `authority` (the owner rules on the best round). Never report
        done or pass it, never loosen a threshold, never hand-edit the installed parts.
  - code: DESIGN_INPUT_UNKNOWN
    condition:
      en: Required business content, SDS behavior, brand rights or a material owner direction is missing.
  - code: GRAMMAR_ANATOMY_UNPROVEN
    condition:
      en: The actual consuming Grammar package/export/anatomy, its geometry block or a knowledge/ui value
        the brief needs cannot be resolved. Name the missing source; do not invent a component or a
        number.
  - code: SYMBOL_INTENT_UNRESOLVED
    condition:
      en: A prominent symbol has ambiguous product meaning, mismatched audience maturity, generic stock
        metaphor or an incoherent family and accepted intent cannot resolve it.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite or required scope is missing or not effectively done; do not weaken the
        graph.
placeholders:
  feature: Selected feature slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  name: Selected ui record slug
  asset: Rendered part, brief, render source or raster prompt filename under the owning UI node
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks: [starci-validate]
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run
policy:
  commitPolicy:
    mode: scoped-local-commit
    ownership: exact-selected-paths
    verify: git-readback-full-sha-and-diff
    push: false
    noChange: return-existing-verified-commit-no-empty-commit
route:
  nodeKinds: [ui]
  phase: [direct, pre-implementation]
  intent: [direction, draw, render, ui-design]
  prerequisites:
    - business.decide settled pass (reviewed SRS seed; Work leaves remain todo)
    - architecture.decide settled pass (reviewed SDS seed; Work leaves remain todo)
    - brand.decide done
    - layout tree present (.starciwork/shell/index.yaml, work/layout-tree@1) and every layout above the record's route settled (dispatch refuses layout-unsettled)
