# modules/ops/ops/interface.draw.yaml
# The operator contract is the authority; the trailing 'business:' block is analysis,
# inference marked where the contract does not state it literally.

id: interface.draw
goal:
  en: >-
    Establish an image-first interface direction before frontend implementation. Select the smallest useful
    representative set of critical screens, generate those directions with built-in ImageGen from accepted
    business/SDS, brand, relevant UI knowledge and actual installed Grammar anatomy/reference inputs, retain
    prompts and actual tool provenance, classify every visible region as a reusable raster asset or code-native
    DOM/CSS/SVG realization, and map every remaining screen/state/component explicitly.
nodeKinds: [ui]
completionProfile: ui
sideEffects:
  - generated representative direction images and exact prompt files under the owning UI node assets
graphPolicy:
  mode: read-only
  location: .starciwork node dependsOn/refs with direct sourceRefs and collocated assets
  prerequisiteState: done
  dispatch: never
reads:
  - id: target
    path: .starciwork/features/<feature>/ui/<name>/index.yaml
    purpose:
      en: >-
        Read the selected ui record, its feature's scope, proof demands, refs/dependencies, existing directions and
        freshness. For an explicitly new target, absence is expected: inspect the nearest existing
        ancestor/workspace, then create only that selected scope. This operation neither creates scope
        beyond the selected target nor weakens its graph; preserve unaffected accepted content.
  - id: business
    path: .starciwork/features/<feature>/{fr,nfr,br,decision,data,journey}/**/index.yaml
    purpose:
      en: >-
        Read the accepted requirements, decisions, actors, journeys, states, content and acceptance IDs in
        scope. A plausible picture cannot invent product behavior or permission.
  - id: architecture
    path: .starciwork/features/<feature>/{sds,contract,integration}/**/index.yaml
    purpose:
      en: >-
        Read the accepted design flows, component boundaries, data/API contracts, security and failure behavior
        relevant to the interface. The direction may communicate those outcomes but cannot prove an API.
  - id: brand
    path: .starciwork/brand/index.yaml + declared brand/assets/** masters
    purpose:
      en: >-
        Read the current brand record and actual masters: tokens, typography, logo/mascot placement, imagery
        rules, rights, rev and forbidden treatments. Supply these as prompt/reference inputs; never infer a
        brand value from an older generated picture.
  - id: knowledge
    path: knowledge/index.yaml + applicable UI composition, presentation, proof and family topics
    purpose:
      en: >-
        Read only the relevant UI rules and references. Use them to constrain hierarchy, density, states,
        accessibility, responsive behavior and visual review; knowledge never supplies missing product facts.
        When a Grammar family is resolved for the consuming app, composition law comes from two tiers:
        (1) the installed package's shipped `concepts.yaml` — the authored normative vocabulary,
        selection map, composition rules (SURFACE-UNIT-1, LABEL-EXTERNAL-1, JOIN-FLUSH-1,
        SEP-HAIRLINE-1, ACTION-BOTTOM-1, ART-BAND-1, DEPTH-1, TONE-TRUTH-1, BAND-ORDER-1) and
        anti-patterns — resolved via `node_modules/<pkg>/concepts.yaml`, then a project-vendored
        `.starciwork/_resources/grammar-concepts.yaml`, then a source checkout; and
        (2) the family's cataloged reusableStyle (idioms) and productComposition (playbook) under
        knowledge/grammars/<family>/ as observed-evidence supplement. The evidence record cites
        which concept rule ids each surface applies. A direction that draws titled cards inside
        cards, per-band cards, gapped bands, or floating actions where the concepts call for one
        joined surface with an external label row and hairline-separated bands is non-conformant
        even if the palette and assets are right.
  - id: grammar
    path: consuming manifest/lockfile + resolved Grammar exports/types/renderers/CSS + actual anatomy/reference captures
    purpose:
      en: >-
        Resolve Grammar from the consuming application, including aliases and lockfile. Record package identity,
        version, resolved path and inspected hashes/anchors. Inspect real public exports, prop types, component
        anatomy, state contracts, CSS/tokens and relevant reference imagery, then provide that anatomy as ImageGen
        input. When the resolved Grammar package ships a `captures/` directory (per-story rendered component PNGs
        with an index.json, produced by the package's storybook capture harness), prefer those rendered captures as
        ImageGen input images over inferring appearance from type/CSS text alone — they are the package's own
        ground-truth renders. Resolution order: the consuming app's installed `node_modules/<grammar-pkg>/captures/`,
        then a project-vendored `.starciwork/_resources/grammar-captures/` (a verbatim copy of the package's
        captures dir), then a source checkout of the Grammar repo. Captures carry the family they were rendered
        under — if the consuming app declares its own Grammar family/theme, cite captures as anatomy reference and
        bind palette/tokens to the accepted brand record, never to the capture's own colors. The direction may be
        inspired by it but is not proof that an exact export, prop or render works.
  - id: repo
    path: repository:<repo-id>/<bound-paths>
    purpose:
      en: >-
        When source exists, read its manifests, active family/root and selected current UI context without editing
        product code. Greenfield work records source not-yet-created honestly.
  - id: profile
    path: modules/models/registry.yaml + modules/models/runtimes.yaml + selected runtime + actual host tools
    purpose:
      en: >-
        Prove this host exposes built-in `image_gen.imagegen` before planning effects. Record the tool actually
        invoked. Image-model selection is not exposed by the tool, so do not promise, infer or encode a model name.
  - id: generatedDirection
    path: N/assets/**/<asset>
    purpose:
      en: >-
        Re-open the image and prompt bytes created earlier in this same operation for visual review, coverage
        binding and final hash verification. These bytes remain direction, not implementation render evidence.
  - id: workflow
    path: selected workflow request + modules/kernel/verdict-contract.yaml + this op authority.json
    purpose:
      en: Read the exact request, outputs and authority when this operation belongs to a named workflow.
  - id: matrix
    path: selected complete-job matrix request + .starciwork/runtime.sqlite jobs rows
    purpose:
      en: Read the request-bound cell only when a job matrix selected it; do not fabricate a matrix handoff.
writes:
  - id: node
    path: .starciwork/features/<feature>/ui/<name>/index.yaml
    fields:
      - schema
      - id
      - title
      - state
      - brand
      - refs
      - "ui: {status,intent,surfaces,states,coverage,flow,accessibility,responsive,assets,artworkSlots,observations,gaps}"
      - assets:[{path}]
      - blockedBy
    content:
      en: >-
        Write the selected image-first direction in the approved ui record (work/ui-screen@1). Keep every required screen and reachable
        state, then add `ui.coverage`: scale, representativeScreens and a map of screen/state/viewport to actual
        Grammar components, derivation and optional directionAsset. Add `ui.flow`: the durable interaction-flow
        map — a screen × state × transition matrix derived from accepted journeys/SDS, plus explicitly named edge
        cases (refresh mid-flow, external redirect return, double-submit, tab close, failure/retry/dead-end paths).
        Every transition names its trigger and landing state; every screen lists its loading/empty/error/success
        states when reachable. A hole in the flow map is a typed blocker — never filled by visual invention.
        For a large frontend task select a deliberately
        small critical-screen set covering the highest-risk anatomy and journeys; derive the rest in the map.
        Describe accessibility, responsive rules, copy, interactions and artwork slots. Every generated image and
        prompt is declared in both ui.assets and the node assets list.
  - id: designSource
    path: N/assets/**/<asset>
    fields:
      - ui.assets:[{path,role,provenance,generation?}]
      - assets:[{path}]
    content:
      en: >-
        Store each representative generated image and its exact sibling prompt under the owning UI node. Image
        metadata records `generation.tool: image_gen.imagegen`, promptPath and accepted inputRefs; record an
        observed model only if the tool itself exposed it. Keep reference inputs under their existing owner and
        cite them rather than copying them. Implementation captures and UAT media never go here.
  - id: evidence
    path: E/manifest.yaml + E/direction.png + E/prompt.txt + E/visual-review.md + E/symbol-review.json + E/realization-map.json
    fields: [id,nodeId,inputDigest,outcome,assertions,assets,provenance,codeRefs,extensions]
    content:
      en: >-
        Retain the generated bytes, exact prompt bytes, actual ImageGen tool provenance, all accepted input refs,
        the visual review, symbol review, coverage/component/state map identity and a region-level realization map.
        `symbol-review.json` records, for every prominent symbol family, its exact product concept, likely alternate
        reading without labels, audience maturity, metaphor specificity, sibling distinction, family coherence,
        reduced-scale legibility and why raster-asset or code-native is the truthful medium. Each visible
        region is classified as `raster-asset` or `code-native`; the entry records rationale, responsive/state
        behavior, asset/artwork-slot binding when raster, and Grammar component plus CSS/SVG/DOM anatomy when
        code-native. State explicitly that the direction is not exact Grammar component/render/API proof and not a
        screenshot of a running product.
  - id: handoff
    path: E/response.yaml
    fields: [schema,requestId,requestDigest,op,step,slot,runId,workflow,status,criteria,outputs,artifacts]
    content:
      en: >-
        For the selected named workflow return outputs.draws as the reviewed representative image array and
        outputs.coverage as the complete map. Each draw binds its image artifact, prompt artifact, screen/state/
        viewport and `provenance.tool: image_gen.imagegen`. Failed or blocked output stays null.
  - id: draws
    path: E/draws.yaml
    fields: [draws,coverage]
    content:
      en: >-
        Emit a readable mapping of representative directions, prompt artifacts and complete remaining coverage.
        The UI node owns the image/prompt bytes; this file does not replace the workflow wire contract.
  - id: matrixHandoff
    path: E/job-result.yaml
    fields: [requestId,requestDigest,op,operation when selected,status,criteria,outputs,artifacts]
    content:
      en: Return only the exact request-bound matrix result, preserving real artifact bytes and hashes.
steps:
  - reads: [target,business,architecture,brand,knowledge,grammar,repo,profile]
    writes: [node]
    action:
      en: >-
        Freeze complete coverage before generation. Enumerate every required screen, reachable state and responsive
        band from accepted journeys/SDS; map each combination to actual inspected Grammar components and state
        contracts. Enumerate the interaction flow with the same rigor: every transition's trigger and landing
        state, and every reachable edge case (refresh mid-flow, external redirect return, double-submit, tab
        close, failure/retry, dead ends). The durable `ui.flow` matrix is written into the ui record; a hole there
        is a typed blocker. Classify the scope as bounded or large. For a large task choose the smallest representative set
        of critical screens that covers the highest-risk layouts, interactions, brand moments and component anatomy;
        do not generate one image for every state. When a screen's direction is genuinely owner-level taste —
        a novel surface, a brand moment, or materially different layout architectures that all satisfy the
        accepted requirements. The default is one candidate per screen: alternative candidates are generated
        only when the owner explicitly asked for options (in the goal, a directive, or a prior review note);
        when alternatives do exist the parked owner ask lets the owner pick, candidates remain direction, and
        the unchosen ones stay evidence.
        Before generation, classify every visible region by realization:
        use `raster-asset` for authored imagery whose identity depends on rich texture, illustration, photography or
        a declared mascot/media master; use `code-native` for layout, spacing, responsive structure, panels, cards,
        controls, text, system icons, borders, shadows, glows and simple geometric decoration representable by
        semantic DOM plus installed Grammar/CSS/SVG. A raster screenshot of code-native UI is direction only and
        never authorizes shipping that UI as a flattened image. A missing product decision, SDS behavior or Grammar
        capability is a typed blocker, never filled with visual invention.
  - reads: [business,architecture,brand,knowledge,grammar,target,profile]
    writes: [node,designSource,evidence]
    action:
      en: >-
        Build one exact prompt per representative direction from accepted business/SDS, brand rules/masters,
        relevant UI knowledge and actual Grammar anatomy/reference inputs. Include real product-shaped content:
        every visible datum renders as concrete plausible data — actual numbers, currency amounts, dates, names,
        statuses and copy derived from the accepted business record — never skeleton bars, gray placeholder
        blocks, lorem text or blurred stand-ins. A skeleton/shimmer treatment is drawn only when the state being
        directed IS the loading state; an accepted-content screen with placeholder bars is non-conformant.
        Include real product-shaped content,
        screen purpose, component regions, state, viewport, accessibility and forbidden treatments. Each direction
        renders the COMPLETE PAGE IN SITU — the consuming app's real persistent chrome (sidebar, navbar, subnav,
        page container, rail layout per its actual layout components) surrounds the content region being directed,
        so the owner reviews the page as it will exist, not a content fragment floating on a blank canvas. A
        pre-auth or chromeless route says so explicitly rather than inventing chrome. Invoke built-in
        `image_gen.imagegen`; a browser capture, hand-painted boxes, mockup export or prose-only substitute does not
        satisfy this operation. Save the returned image and exact prompt, open the image, review it, and record the
        actual tool provenance. Do not claim an image-model name the tool did not expose.
  - reads: [target,generatedDirection,brand,knowledge,grammar]
    writes: [node,evidence]
    action:
      en: >-
        Review each direction against business truth, brand, relevant UI rules and the inspected Grammar anatomy.
        Before accepting any prominent icon, illustration or symbolic family, self-question it explicitly: what
        exact product concept does it encode; what would a viewer infer if the label disappeared; is the metaphor
        generic or brand-specific; does its maturity fit the audience/category; is it distinct from siblings; do
        camera, base, material, light, scale and density form one family; does it remain legible at the smallest
        required viewport; and could installed Grammar or repository-native SVG communicate it more truthfully than
        raster artwork. Reject childlike clip-art, generic stock metaphor, semantic ambiguity and mixed visual
        families unless accepted intent explicitly requires them. Reject an accepted-content screen whose data
        renders as skeleton bars or gray placeholder blocks — regenerate it with concrete values from the
        business record; placeholder treatment belongs only to a deliberately directed loading state.
        Correct the prompt and regenerate within the
        bounded representative set when it fails. Declare every embedded
        illustration/mascot/decorative/media region classified `raster-asset` as an artworkSlots entry for
        `interface.asset`. Record every `code-native` region with its semantic structure, Grammar primitive or family
        anatomy, responsive/state behavior and allowed CSS/SVG decoration; never send cards, panels, controls,
        typography or page composition to ImageGen as production assets. Update the complete coverage map so every
        non-generated screen/state says which representative direction it derives from, which actual Grammar
        components implement it and how its state differs.
  - reads: [target,generatedDirection,workflow,matrix]
    writes: [node,evidence,handoff,draws,matrixHandoff]
    action:
      en: >-
        Validate Work and every artifact hash, then report the representative images, prompt artifacts, actual tool
        provenance and complete coverage map. State the truth boundary: the generated direction is a design input,
        not exact component/render/API evidence. `interface.implement` must produce actual Grammar implementation
        captures and code checks; `uat.verify` must independently exercise the running product in a browser. Stop
        without frontend code and never self-advance.
proofs:
  - id: imagegen-provenance
    requirement:
      en: >-
        Every representative image has an exact retained prompt and records an actual `image_gen.imagegen` invocation
        plus accepted business/SDS, brand, UI knowledge and Grammar inputs. A claimed or guessed model name is not proof.
  - id: coverage
    requirement:
      en: >-
        The representative set is deliberately small for a large scope and the explicit coverage/component/state map
        accounts for every remaining required screen, state and responsive band using actual inspected Grammar anatomy.
        The `ui.flow` matrix accounts for every accepted transition and reachable edge case; a missing or
        unaccounted flow edge is reported as a typed blocker, not silently resolved.
  - id: truth-boundary
    requirement:
      en: >-
        The result is labelled proposed visual direction, never a working-product screenshot or exact component,
        render or API proof. Later implementation captures and browser UAT remain required and distinct.
  - id: realization-map
    requirement:
      en: >-
        Every visible direction region has exactly one justified realization mode. Rich authored imagery binds to a
        retained raster asset/artwork slot; layout, content, controls, system icons and representable visual effects
        bind to semantic DOM plus installed Grammar/CSS/SVG. Flattened UI screenshots cannot satisfy code-native
        regions, and a CSS approximation cannot silently replace a required brand/media asset.
  - id: symbolic-integrity
    requirement:
      en: >-
        Every prominent symbol has an explicit concept-to-form argument, alternate-reading check, audience-maturity
        check, non-generic rationale, sibling distinction, coherent family grammar, reduced-scale legibility proof
        and justified raster-asset or code-native realization. A readable but childish, clichéd or semantically
        interchangeable symbol does not pass merely because its label explains it.
  - id: binding
    requirement:
      en: >-
        `starci validate` passes; every cited ID/path and asset byte exists, required assertions are covered,
        input bindings are current, and an honest not-run/fail cannot earn done.
blockers:
  - code: IMAGEGEN_TOOL_UNAVAILABLE
    condition:
      en: Built-in `image_gen.imagegen` is not exposed on this host. Report host-unsupported; do not substitute another renderer.
  - code: DESIGN_INPUT_UNKNOWN
    condition:
      en: Required business content, SDS behavior, brand rights or a material owner direction is missing.
  - code: GRAMMAR_ANATOMY_UNPROVEN
    condition:
      en: The actual consuming Grammar package/export/anatomy cannot be resolved. Name the missing source; do not invent a component.
  - code: SYMBOL_INTENT_UNRESOLVED
    condition:
      en: A prominent symbol has ambiguous product meaning, mismatched audience maturity, generic stock metaphor or an incoherent family and accepted intent cannot resolve it.
  - code: DECLARED_DEPENDENCY_UNMET
    condition:
      en: A declared prerequisite or required scope is missing or not effectively done; do not weaken the graph.
placeholders:
  feature: Selected feature slug
  repo-id: Resolved direct repository name or path
  bound-paths: Inspected source read set
  write-ceiling: Explicit owned source paths
  environment: Resolved environment label
  identity: Selected actor label
  fixture: Selected fixture path
  resource: Selected owned asset name
  asset: Generated image or prompt filename under the owning UI node
  piece: Stable selected piece slug
  flow: Selected UAT journey slug
  screen: Selected surface/state slug
layoutPolicy:
  layout: defined-by-.claude-catalog-never-agent-chosen
  artifacts: every-structured-write-carries-its-declared-schema-const
  checks:
    - starci-validate
  wrongLayout: wrong-path-name-or-schema-const-fails-the-run

# ---------------------------------------------------------------------------
# Business analysis (not part of the source contract; inference marked).
business:
  question: >-
    "What is the image-first interface direction - the smallest representative
    set of critical screens generated with ImageGen plus an explicit coverage
    map for everything else?"
  whenNeeded:
    - Before frontend implementation, when a new visual direction is required - after accepted business/SDS and brand exist.
    - When the owner must pick between visual candidates before code is committed to a direction.
  whenNot:
    - Not proof of component/render/API correctness - the declared truth boundary keeps draws as direction, not acceptance.
    - Not one image per state - a small representative set plus a coverage map is the contract.
    - When the host lacks image_gen.imagegen the op is host-unsupported (IMAGEGEN_TOOL_UNAVAILABLE), not degraded to text mockups.
    - Never a substitute for UAT captures.
  consumes:
    - UI node, business journeys, architecture contracts; brand record + masters; UI composition/presentation knowledge; resolved Grammar anatomy; repo context; execution profile.
  produces:
    - Direction images + exact prompts under the UI node's assets; ui.coverage map; symbol-fit review; region-level raster-asset versus code-native realization map; artworkSlots declarations; E/draws.yaml; workflow handoff consumed by interface.implement.
  failureModes:
    - IMAGEGEN_TOOL_UNAVAILABLE, DESIGN_INPUT_UNKNOWN, GRAMMAR_ANATOMY_UNPROVEN, SYMBOL_INTENT_UNRESOLVED, DECLARED_DEPENDENCY_UNMET (declared blockers).
# ---------------------------------------------------------------------------
# route: resolver index.
# Keys derive from this op's nodeKinds + modules/ops/registry.yaml
# lifecyclePosition/kindInferred. scripts/route/route-op.mjs matches on this
# block alone — an agent never reads the whole contract to route.
route:
  nodeKinds: [ui]
  phase: [direct, pre-implementation]
  intent: [direction, draw, imagegen, ui-design]
  prerequisites: ["business.decide settled pass (reviewed SRS seed; Work leaves remain todo)", "architecture.decide settled pass (reviewed SDS seed; Work leaves remain todo)", "brand.decide done"]
  riskHints: [host-tool-required:image_gen.imagegen]
