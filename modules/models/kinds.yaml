schema: starci/kinds@1
purpose: |-
  The process is data, not a judgement call. This catalog is the complete, closed list of operation kinds a
  workflow may run, the mandatory lane (an ordered template) every ledger node walks, and the bounded routes
  that an outcome may take. A model fills the content of one operation and picks among the closed options an
  operation offers; it never decides which step comes next, which kind repairs what, or how many rounds a
  repair may take. The kernel agent's legality graph reads only this
  file: changing the process means editing this profile, never prompting harder.

  Input and output are explicit. Every kind declares `reads` and `writes` over the record catalog of
  `modules/models/records.yaml` - the single record vocabulary both fields share - so the
  contract, the validator and the kernel are held to one declaration instead of each keeping a set of its
  own. `validateGraph` refuses a kind that writes a record it is blind to, a lane whose prove step cannot
  read what its build step wrote, and a route to a kind that writes nothing its requesters read.
vocabularies:
  # What an operation is for. `design` settles intent, `build` changes the product, `prove` only inspects it,
  # `repair` puts an authored record back in agreement with what was found.
  families: [design, build, prove, repair]
  # The allocator role of modules/models/runtimes.yaml; `roleOfKind` there must agree with `role` here.
  roles: [decide, plan, implement, verify, write]
  # What a kind may read and what it may produce are both record kinds of `modules/models/records.yaml`, which is the
  # vocabulary for `reads` and `writes` and is not restated here: one catalog, one place to change it.
  # `readOnly: true` means `writes` is empty, and a kind that is not read-only writes at least one record.
  # Why an operation exists, as the kernel records it on the op.
  # `architecture` is a gap in the DESIGN record sending the work back to the design; `business` is the same
  # move one layer earlier - a gap in the REQUIREMENT record. They are two origins rather than one because the
  # origin says WHY an operation exists, and a requirement repair labelled `architecture` would say the wrong
  # thing in every log, every status view and every budget decision the kernel makes from it.
  origins: [ledger, shared, repair, gate, verify, architecture, business]
  # The report outcomes of modules/kernel/verdict-contract.yaml.
  outcomes: [done, partial, failed, ask, blocked]
  # What a host may offer beyond a worktree and a runtime. A kind lists what it `needs` from this vocabulary and
  # runs only on a host that declares it: the Orca IDE declares `design-tool` (the drawing tooling behind
  # `interface.draw`), a plain chat host driving the kernel through its session -
  # declares nothing. A kind without `needs` runs on every host. Keep this list in step with the
  # capabilities declared in `modules/models/agents/*.yaml` and the plain-chat monitor `skills/workflow-chat/`.
  capabilities: [design-tool]
  # What an operation is handed beside its records, declared per kind as `knowledge`, `checks` and `stacks`
  # ref lists and resolved by the kernel to concrete paths and digests - never a repo dump. `knowledge`
  # names entries of the `knowledge/` tree by extensionless name or directory glob (`patterns/fe/*`,
  # `architecture-rules`, `design-patterns`, `code-pattern-enforcement`, `grammars/<name>`, `ui/*`,
  # `application-stacks`); `checks` names executable check scripts (`scripts/checks/check-scoped-lint.mjs`,
  # `scripts/checks/code-patterns/*.mjs`, `scripts/checks/architecture/*.mjs`, `scripts/checks/acceptance.mjs`); `stacks` names the
  # bound repository's `.stacks` compose manifests and the `.claude`-owned layout and schema definitions an
  # op's artifacts obey - `modules/schemas/work-layout.yaml` for `.starciwork` paths and filenames,
  # `modules/schemas/workspace-routing.yaml` for bound-source routing, and the `modules/schemas/*.schema.yaml` shape each
  # `carries` const validates against. A kind that declares an empty list is handed nothing from that
  # domain - an explicit none, not a missing field.
  inputs: [knowledge, checks, stacks]
  # The schema consts a written `.starciwork`/`.stacks` artifact must carry in its `schema:` field. A kind
  # names the exact consts of the artifacts it writes as `carries`; an op that writes none of those
  # artifacts declares `carries: []`. The definitions are `.claude`-owned under `modules/schemas/` and enter the op
  # as `stacks` inputs - the const is what the output claims, the file is what the op reads to get there.
  # `modules/models/records.yaml` names the const and the validator of each record class, and the declared layout
  # covers the whole `.starciwork` tree - the `runtime.sqlite` ledger state (goals, jobs, verdicts,
  # inbox) and the `features/<feature>/` record trees - so a write outside it fails checks. Layout
  # definitions (`work-layout`, `workspace-routing`) and kernel transport records are never artifact
  # consts, so they are absent here.
  schemas: [work/workspace@1, work/catalog@1, work/feature@1, work/brand@1, work/business-rule@1, work/acceptance-criterion@1, work/functional-requirement@1, work/non-functional-requirement@1, work/data@1, work/customer-journey@1, work/policy-decision@1, work/sds-component@1, work/ui-screen@1, work/implementation@1, work/uat-flow@1, work/contract@1, work/integration@1, work/gap@1, work/event@1, work/node@1, work/resource@1, work/evidence@1, work/disposable-accounts@1, starci/source-identity@1, starci/design-review@1, starci/evidence-packet@1, starci/goal@1, starci/application-stacks@1, starci/knowledge-rule@1, starci/knowledge-source@1]
  # The blocker kinds a report may carry. `interface-gap` is this graph's addition: a frontend build or a UAT
  # walk that finds the interface design silent is not an SDS gap and must not be routed as one. `brand-gap` is
  # that same distinction one layer earlier: a drawing with no settled identity to draw inside - no colour token,
  # no typography, no mascot rule - is missing the brand record, not a screen and not a design decision; artwork
  # the brand record does not permit is the same gap seen from the asset side, and no operation may close it by
  # inventing an image. `grammar-gap` is the third gap and the deepest one: the accepted requirement needs a shape
  # the installed grammar cannot render and that no composition of existing contracts covers, so the language itself
  # is short a word - grown once in the grammar package, never invented beside it in a page.
  # `srs-gap` is the deepest of the record gaps: the REQUIREMENT the
  # work is derived from does not settle the case, or settles it twice in two ways. It is not an `sds-gap` -
  # revising the design would invent the product rule it is supposed to realise - and it is not an
  # `authority` block either when ordinary technical ambiguity has one safe reversible reading: the runtime may
  # revise that record towards its most reasonable reading, say why and bump the rev. A reading that changes an
  # observable product policy about money, authority or customer data remains an unresolved owner dependency.
  # The runtime prepares distinct typed outcomes and one recommendation, but cannot infer or provisionally take it.
  # `test-gap` is the coverage gap a behaviour-invariant change reports: the slice has no regression check to
  # pin its behaviour against, so restructuring it would be an unverifiable edit. The gap is closed by authoring
  # the tests first - the work waits for them rather than guessing at safety - which is why the route goes to
  # `test.author` and not to the user.
  # The one authority for blocker kinds: scripts/kernel/report-envelope.mjs loads this list as
  # BLOCKER_KINDS and modules/kernel/verdict-contract.yaml cites it.
  blockers: [shared-change, srs-gap, sds-gap, interface-gap, brand-gap, grammar-gap, test-gap, environment, authority]
  # Verdicts the kernel computes about a report (never the reporter's own claim) and routes on.
  verdicts: [pass, findings, rejected, gate-failed]
  # What happens to the operation that produced the report:
  #   retry    - no new operation; the same op runs again
  #   reopen   - the op returns to queued and depends on the routed op
  #   pause    - the op is parked until the routed op is done
  #   settle   - the op is finished; only the routed op carries the work forward
  #   needUser - nothing is routed automatically; the workflow stops for the user
  then: [retry, reopen, pause, settle, needUser]
predicates:
  node.hasInterfaceDesign: |-
    The interface design record the node reads - the `ui` node of its feature: itself when it is one, else the
    ui node it references, else the one beside it under `features/<feature>/ui` - names its surfaces and the
    candidate images that drew them, so drawing it again would produce nothing.
  node.hasNoArtworkSlots: |-
    That design record is drawn and declares no artwork slot, or every slot it declares already names the file
    generated for it: the approved candidate embeds no illustration, no brand mascot, no decorative image and no
    chart placeholder that is still missing, so there is no asset left for an asset operation to generate. A
    record that was never drawn has declared nothing, and the step stays.
  # The `goal.` predicates are read out of the workflow's frozen goal, not out of a node record: the `done`
  # metrics block is where a requirement is declared, and a metric the goal never declares is a proof the lane
  # does not run - the step they gate exists only for a goal that asks for it.
  goal.requiresSecurity: |-
    The workflow goal's `done` metrics block is where a security requirement is declared. The kernel reads the
    frozen goal, never a judgement: the step this predicate gates runs only for a goal whose metrics declare
    the requirement, and a goal silent on security - or a metrics block that names none - skips the proof.
  goal.requiresPerf: |-
    The workflow goal's `done` metrics block is where a performance budget or requirement is declared. The
    step this predicate gates runs only for a goal whose metrics declare it; a goal silent on performance
    skips the measurement.
kinds:
  # KINDS ARE NOT OPS ONE-TO-ONE. A kind whose `operator` names a different op id is a routing
  # label carried by that operator's op file - business.revise and architecture.revise are the
  # repair kinds a gap blocker routes to, goal.validate is the kernel's own read of the goal
  # against review.verify's contract, implementation.plan is the kernel-planned cut carried by
  # work.author. None of them needs an op file of its own; every `operator` value must resolve to
  # a file in modules/ops/ops/. (This catalogue is keyed by KIND; the
  # operator catalog modules/ops/registry.yaml is keyed by OP.)
  #
  # The runtime never decides for the owner; it prepares the decision. This op writes the owner's decision
  # draft: the question, why it matters, the options with what each means for architecture, user stories,
  # security and business, and exactly one recommendation.
  #
  # What happens to the op that asked depends on the question. Something only the owner can provide (a
  # credential, an account on an outside system, a real dataset, a legal authority) and an effect nobody can
  # undo (a message to real customers, a payment, a deletion of real data, a publish) PAUSE it: there is
  # nothing honest to do until the owner acts. A decisive product-policy choice about money, authority or customer
  # data also remains non-actionable until an exact owner answer/receipt selects one prepared outcome. Ordinary
  # reversible technical ambiguity may continue on a recorded recommendation; it cannot stand in for that receipt.
  decision.prepare:
    family: design
    role: decide
    operator: decision.prepare
    readOnly: false
    # It reads what the question touches and writes the one thing the owner owns: the decision record.
    reads: [srs, sds, decision]
    writes: [decision]
    knowledge: [design-patterns, architecture-rules]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/policy-decision@1]
    purpose: Prepare one canonical decision question with distinct typed outcomes, analysis and one recommendation, or answer it from already-decided records. Ordinary reversible technical ambiguity may use a recorded recommendation. Decisive product policy about money, authority or customer data waits for an exact owner answer/receipt and is never inferred from the recommendation.
    reports:
      outcomes: [done, failed]
  provision.ask:
    family: design
    role: decide
    operator: provision.ask
    readOnly: true
    # It reads what the question touches and the integration it belongs to; it writes nothing - the owner puts a
    # credential into custody with their own command, and this operation only confirms that it is there.
    reads: [srs, sds, integration]
    writes: []
    knowledge: [application-stacks]
    checks: []
    stacks: []
    carries: []
    purpose: Ask the owner for what only they can give - a credential, an account, a dataset, an authority, the go-ahead for an irreversible effect - exactly named, in its own terminal, and wait; verify presence, never a value.
    reports:
      outcomes: [done, blocked, failed]
  business.decide:
    family: design
    role: decide
    operator: business.decide
    readOnly: false
    # A requirement is settled from what the owner already decided, never from what the code happens to do.
    reads: [srs, decision]
    writes: [srs, decision]
    knowledge: []
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/business-rule@1, work/acceptance-criterion@1, work/functional-requirement@1, work/non-functional-requirement@1, work/data@1, work/customer-journey@1, work/policy-decision@1]
    purpose: Settle what the product must do, in the business record, before anything is designed against it.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # The requirement repair, and the mirror of `architecture.revise` one layer earlier. Like it, it belongs to no
  # lane: nothing schedules it, a reported `srs-gap` creates it, and it edits the record a builder could not
  # derive its behaviour from. It reads the same records the decision did and it may not write a new `decision`
  # of its own - except the one exception both revise sequences state, where the readings differ in an
  # observable outcome about money, authority or customer data: then it does not choose silently, it reports
  # `ask` with `question.kind: decision`, distinct numbered outcomes and one recommendation. `decision.prepare`
  # writes the draft; the requester remains non-actionable until the exact owner answer/receipt settles it.
  business.revise:
    family: repair
    role: decide
    operator: business.decide
    readOnly: false
    reads: [srs, decision]
    writes: [srs]
    knowledge: []
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/business-rule@1, work/acceptance-criterion@1, work/functional-requirement@1, work/non-functional-requirement@1, work/data@1, work/customer-journey@1, work/policy-decision@1]
    purpose: Repair a requirement record a builder found silent, confusing or self-contradictory - edit the requirement, rule or journey itself and bump its rev.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  architecture.decide:
    family: design
    role: decide
    operator: architecture.decide
    readOnly: false
    # A design is derived from the requirement it realises and the decisions around it - never from source.
    reads: [srs, sds, decision]
    writes: [sds, decision]
    knowledge: [architecture-rules, design-patterns, code-pattern-enforcement]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/sds-component@1, work/contract@1, work/integration@1, work/policy-decision@1]
    purpose: Settle how the product realises a requirement, as a new design decision in the design record.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [srs-gap, shared-change, authority]
  architecture.revise:
    family: repair
    role: decide
    operator: architecture.decide
    readOnly: false
    # The repair reads the same three records the decision did; it may not open a new decision for the owner.
    reads: [srs, sds, decision]
    writes: [sds]
    knowledge: [architecture-rules, design-patterns, code-pattern-enforcement]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/sds-component@1, work/contract@1, work/integration@1, work/policy-decision@1]
    purpose: Repair a design record that a builder found silent or wrong - edit the text and bump its rev.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [srs-gap, shared-change, authority]
  # The identity every drawing and every build reads: one record, one spec, done with a `rev`. It is a decision
  # kind and not a build one - it settles what the product looks like, it never renders a product screen - and it
  # is the only kind that writes the `brand` record, because that record IS its decision.
  brand.decide:
    family: design
    role: write  # it generates the placeholder mascot with the image model, so it runs where image generation is: the Codex working profile
    operator: brand.decide
    readOnly: false
    # Every token is read out of the real style and token files of the interface and out of the installed
    # grammar that names them; an untraceable value is a question for the owner, never an invented entry.
    reads: [code, grammar]
    writes: [brand, asset]
    knowledge: [grammars/*, ui/*]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/brand@1]
    purpose: Settle the product's visual identity - colour tokens, typography, mascot, logo, imagery rules - in the one brand record every drawing and build reads.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [environment, authority]
  interface.draw:
    # Image-first direction generation requires the host's built-in ImageGen tool. The generated visual is a
    # design reference only; exact Grammar render and browser UAT proof belong to later lane operations.
    needs: [design-tool]
    family: design
    role: write
    operator: interface.draw
    readOnly: false
    # It supplies accepted requirement/design/brand/knowledge and actual Grammar anatomy as ImageGen inputs,
    # and reads the design record it is extending so a second drawing does not restate the first.
    reads: [srs, sds, brand, grammar, design, asset]
    # The representative direction PNGs and their exact prompts live in the ui node's `assets/`, so `asset`
    # belongs here or `IO_DRIFT` refuses the shipped operator catalog.
    writes: [design, asset]
    knowledge: [grammars/*, patterns/fe/*, ui/*]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/ui-screen@1]
    purpose: Generate a small representative image-first direction and map every remaining screen/state/component before interface code exists.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [srs-gap, sds-gap, brand-gap, grammar-gap, shared-change, authority]
  interface.asset:
    # The artwork the drawing declared is generated by an image model, which only the Orca host carries.
    needs: [design-tool]
    family: design
    role: write
    operator: interface.asset
    readOnly: false
    reads: [design, brand]
    # The generated artwork lands in the
    # bound source repository at the path the design record declares, and a bound repository is `code` in the
    # record catalog. The files are asset bytes and they are product source at the same time.
    writes: [asset, design, code]
    knowledge: [grammars/*, ui/*]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/ui-screen@1]
    purpose: Generate the artwork the approved candidate embeds as real repository assets, at the size and format the design record declares.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [brand-gap, interface-gap, shared-change, authority]
  interface.implement:
    family: build
    role: implement
    operator: interface.implement
    readOnly: false
    # The whole design side is an input: the drawing and its generated artwork, the identity they sit inside,
    # the grammar the markup is written in, and the source it is being added to. `srs` is required because
    # of the blocker: an operation may only report `srs-gap` about a requirement it actually had in
    # front of it, and a build that never reads the requirement cannot say the requirement is unsettled.
    reads: [srs, sds, design, asset, brand, grammar, code]
    # A frontend build also owns the browser capture and markup evidence kept under its implementation
    # node's `assets/`. The operation's exact allowlist confines these asset records to that node; design
    # directions and generated artwork remain owned by the separate `ui` lane.
    writes: [code, asset]
    knowledge: [patterns/fe/*, ui/*, grammars/*, architecture-rules, code-pattern-enforcement]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Build the interface the drawing settled, against that drawing and nothing invented beside it.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, sds-gap, interface-gap, brand-gap, grammar-gap, environment, authority]
  interface.audit:
    family: prove
    role: verify
    operator: interface.audit
    readOnly: false
    # Audit is product-read-only. `readOnly:false` here means it may author its own evidence record;
    # product source, design, Grammar, assets and captures remain immutable under the op contract.
    reads: [srs, sds, design, asset, brand, grammar, code, evidence]
    writes: [evidence]
    knowledge: [patterns/fe/*, ui/*, grammars/*]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Inspect fresh implementation-produced renders against intent, installed Grammar, brand and UI proof rules, then report a bounded repair route or no-actionable-drift without repairing anything.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, sds-gap, interface-gap, brand-gap, grammar-gap, environment, authority]
  backend.implement:
    family: build
    role: implement
    operator: backend.implement
    readOnly: false
    reads: [srs, sds, decision, code]
    writes: [code]
    knowledge: [patterns/be/*, architecture-rules, code-pattern-enforcement, application-stacks]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Build one slice of behind-the-interface behaviour under the node's own allowlist.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, sds-gap, environment, authority]
  backend.scaffold:
    family: build
    role: implement
    operator: backend.scaffold
    readOnly: false
    # Greenfield: there is no owning code to read. The stack is fixed and the toolchain comes from
    # repository-baseline; settled design is read only for layout and dependencies beyond it.
    reads: [srs, sds, decision]
    writes: [code]
    knowledge: [patterns/be/*, architecture-rules, code-pattern-enforcement, application-stacks, repository-baseline]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Create one new backend source tree - toolchain, house layout, runnable skeleton - proven green.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [sds-gap, environment, authority]
  interface.scaffold:
    family: build
    role: implement
    operator: interface.scaffold
    readOnly: false
    # Greenfield interface: grammar and brand are required inputs because the first markup is
    # written in the installed grammar with settled tokens - a scaffold cannot invent either. The
    # toolchain comes from repository-baseline.
    reads: [srs, sds, design, brand, grammar]
    writes: [code, asset]
    knowledge: [patterns/fe/*, ui/*, grammars/*, architecture-rules, code-pattern-enforcement, repository-baseline]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Create one new interface source tree - grammar-written shell with tokens wired - proven by build plus captured first render.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [sds-gap, brand-gap, grammar-gap, environment, authority]
  package.scaffold:
    family: build
    role: implement
    operator: package.scaffold
    readOnly: false
    # A new package reads the host repo's existing conventions (sibling manifests, kits) but no
    # owning code exists yet - `code` here means the host repo, not the package's own source.
    reads: [sds, decision, code]
    writes: [code]
    knowledge: [patterns/be/*, architecture-rules, code-pattern-enforcement]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Create one new package/module tree - manifest, exports, harness - proven by build plus a real consumer import.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [sds-gap, environment, authority]
  runtime.operate:
    family: build
    role: implement
    operator: runtime.operate
    readOnly: false
    reads: [sds, code, runtime]
    writes: [runtime, code]
    knowledge: [application-stacks]
    checks: []
    stacks: [.stacks/**, modules/schemas/application-stacks.schema.yaml, modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/resource@1, starci/application-stacks@1]
    purpose: Operate the runtime the product needs - migrations, environment, deployment, infrastructure.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, sds-gap, environment, authority]
  # The language itself, grown by one word. Like `architecture.revise` it belongs to no lane: nothing schedules it,
  # a reported `grammar-gap` creates it, and it changes a repository of its own - the grammar package, its stories
  # and tests, its published version and the canon that names its units - never a product page.
  grammar.update:
    family: build
    role: implement
    operator: grammar.update
    readOnly: false
    # It reads the drawing that found the word missing, the grammar it is growing and the identity the new
    # unit must render inside; it writes the grammar package and the consumer bump, which is product code.
    reads: [design, grammar, brand]
    writes: [grammar, code]
    knowledge: [grammars/*, ui/*, code-pattern-enforcement]
    checks: [scripts/checks/code-patterns/*.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/*]
    purpose: "Grow the installed grammar by one semantic unit the product needs and no composition of existing contracts renders: implement it in the grammar package with its stories and tests, publish it, bump the consumer, and record it in the canon."
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
  uat.verify:
    family: prove
    role: verify
    operator: uat.verify
    readOnly: false
    # `kindsReadingBrand()` decides brand reads from this catalog: a walk that judges the rendered
    # surface is given the brand
    # payload exactly like the drawing and the build are.
    reads: [srs, design, asset, brand, code]
    # The walk authors its scenario and its
    # scripts inside the bound repository, which is `code`.
    writes: [evidence, code]
    knowledge: [patterns/fe/*, ui/*, grammars/*]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Walk one end-to-end scenario on the running product and leave the scenario and its evidence.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, interface-gap, environment, authority]
  uat.assisted.prepare:
    family: prove
    role: write
    operator: uat.assisted.prepare
    readOnly: false
    # Preparation writes the controlled Playwright package and evidence only; it never executes the
    # journey, changes product source or writes canonical Work state.
    reads: [srs, design, asset, brand, code, evidence]
    writes: [evidence, code]
    knowledge: [patterns/fe/*, ui/*, grammars/*]
    checks: [scripts/uat/assisted-runner.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml, modules/schemas/assisted-uat-request.schema.yaml, modules/schemas/assisted-uat-session-manifest.schema.yaml, modules/schemas/assisted-uat-receipt.schema.yaml, modules/schemas/assisted-uat-cleanup.schema.yaml, modules/schemas/assisted-uat-redaction.schema.yaml]
    carries: [work/uat-flow@1, work/evidence@1, starci/assisted-uat-request@1, starci/assisted-uat-session-manifest@1, starci/assisted-uat-receipt@1, starci/assisted-uat-cleanup@1, starci/assisted-uat-redaction@1]
    purpose: Freeze genuine human-gated UAT into deterministic, digest-bound scripts and policies without executing it or claiming acceptance.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, interface-gap, environment, authority]
  uat.assisted.verify:
    family: prove
    role: verify
    operator: uat.assisted.verify
    readOnly: false
    # Verification replays no product action. It may write independent verification evidence while
    # the immutable runner receipt and canonical Work remain unchanged.
    reads: [srs, design, asset, brand, code, evidence]
    writes: [evidence]
    knowledge: [patterns/fe/*, ui/*, grammars/*]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml, modules/schemas/assisted-uat-request.schema.yaml, modules/schemas/assisted-uat-session-manifest.schema.yaml, modules/schemas/assisted-uat-receipt.schema.yaml, modules/schemas/assisted-uat-verification.schema.yaml]
    carries: [work/uat-flow@1, work/evidence@1, starci/assisted-uat-receipt@1, starci/assisted-uat-verification@1, starci/evidence-packet@1]
    purpose: Derive acceptance from one exact immutable assisted-run receipt using current bindings, machine postconditions, evidence integrity, redaction and cleanup; human ok is completion only.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, interface-gap, environment, authority]
  e2e.verify:
    family: prove
    role: verify
    operator: e2e.verify
    readOnly: false
    reads: [srs, sds, code]
    # The proof authors one scenario
    # spec per assertion inside the bound repository, which is `code`. What it may never write is product
    # code - that ceiling is the operator's allowlist, not the record catalog.
    writes: [evidence, code]
    knowledge: [patterns/be/*, application-stacks]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Prove one delivered slice through its public API on the real stack, never a screen, and leave the scenario spec and its run output.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, srs-gap, sds-gap, environment, authority]
  # An external system is proven live or it is not proven. A faked provider inside this scenario is a defect,
  # and a credential the environment lacks is reported `blocked` `environment` with the exact variable name -
  # which is the owner's question, never an invented key. Its evidence carries `proof: {boundary: live}`,
  # which is what tells a status view that a chatbot delivery was proven against the real channel.
  integration.verify:
    family: prove
    role: verify
    operator: integration.verify
    readOnly: false
    reads: [integration, sds, code]
    writes: [evidence]
    knowledge: [application-stacks]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [.stacks/**, modules/schemas/application-stacks.schema.yaml, modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Prove one declared external integration against the real provider with the credential the owner supplies, and leave the live run as evidence.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [environment, authority, shared-change]
  review.verify:
    family: prove
    role: verify
    operator: review.verify
    readOnly: true
    # The operations lane proves `runtime.operate` with this kind, and a prover that cannot read the
    # runtime record its build wrote is `lane-proof-blind`.
    reads: [srs, sds, code, evidence, runtime]
    writes: []
    knowledge: [patterns/be/*, patterns/fe/*, architecture-rules, design-patterns, code-pattern-enforcement]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs, scripts/checks/acceptance.mjs]
    stacks: []
    carries: []
    purpose: Read the delivered slice against its acceptance and report findings, repairing nothing.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # The one kind that runs BEFORE a lane rather than inside one, in three modes. A node whose record declares no
  # write scope or no check cannot be launched, and completing that record is work, not a question for the user;
  # an intake authors a whole feature the tree does not hold; a cut splits a node too big for one operation into
  # children with disjoint write scopes, the seam first, so the rest fan out and are proven once as a group. It
  # is the only kind allowed to write its own node's `index.yaml`, and the kernel creates it itself - once per
  # node per mode - so no route and no lane names it.
  work.author:
    family: design
    role: plan
    operator: work.author
    readOnly: false
    # An intake reads the decided records of the whole product before it authors anything, which is what
    # makes the three reconciliation cases checkable against ids rather than against wording.
    reads: [srs, sds, decision, code, record]
    # An intake or an import also authors the todo integration node every declared integration owes.
    writes: [record, srs, sds, decision, integration]
    knowledge: [application-stacks]
    checks: []
    stacks: [.stacks/**, modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/*, work/disposable-accounts@1]
    purpose: Complete the authored fields of one Work node - its write scope and its checks - so the kernel can launch it; an intake authors a feature's records and reconciles them against the decided ones as three typed cases (reference, conflict, new), editing no record of another feature and reporting no gap against one; a cut splits a node too big for one operation into child nodes with disjoint write scopes, the seam first, and leaves the node a derived parent whose assertions become the group's acceptance.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [srs-gap, sds-gap, shared-change, authority]
  # Heavy work runs in parallel, and this is the operation that makes it possible. A node too big to be one
  # operation - a write scope past twelve files, more than eight assertions, or a design of three or more
  # components - is not built as one long slice: this kind cuts it into child nodes with disjoint write scopes,
  # names the SEAM every other child would otherwise touch (module wiring, DI registration, migrations, shared
  # contracts and types; on the frontend the app shell and routing, the theme and grammar version, the shared
  # store and the API client) and makes the node a derived parent whose assertions become the group's acceptance.
  # It carries the `work.author` operator contract under its `work.cut` sequence, so no second operator exists;
  # it writes records only, and it builds nothing - the children are ordinary `backend.implement` /
  # `interface.implement` work with small allowlists, and the group is proven once at the parent. Like
  # `work.author` it belongs to no lane and to no route: the kernel plans it itself, once per node.
  implementation.plan:
    family: design
    role: plan
    operator: work.author
    readOnly: false
    reads: [srs, sds, code, record]
    writes: [record]
    knowledge: [architecture-rules, design-patterns]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/*]
    purpose: Cut one Work record that is too big for a single operation into child records with disjoint write scopes - the seam first, then one observable behaviour per child - and leave the record a derived parent whose assertions are the group's acceptance.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [sds-gap, authority]
  # The first link of the chain and the one kind that never runs inside the workflow: the intake is the chat
  # app's to run, and it hands the kernel a finished scope statement rather than an operation to dispatch.
  # `external` is the catalog's way of saying that - the kernel reads the entry for the contract, the role and
  # the records it may cite, and no lane, route or scheduler may name it.
  request.analyze:
    external: true
    family: design
    role: plan
    operator: request.analyze
    readOnly: false
    # The request and its context arrive from the chat; the existing tree is read so the scope statement never
    # re-scopes work that is already authored. The selection and the statement are authored content, so the
    # kind writes `record` even though nothing it produces lands in the tree directly.
    reads: [record]
    writes: [record]
    knowledge: []
    checks: []
    stacks: []
    carries: []
    purpose: Read one request and its context into a workflow selection and a scope statement - run in the calling chat app, never dispatched in-workflow.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # The direct-task sibling of request.analyze: an unmatched or ad-hoc request is analysed into
  # exactly one named workflow selection - never executed here ('execute' is the analysis task
  # itself). It belongs to no lane and no route: a request no preset workflow matched selects it
  # (modules/ops/registry.yaml; modules/goal/legality.yaml producesVocabulary 'task: executed'),
  # and it never dispatches the workflow it names (its own graphPolicy.dispatch: never).
  task.execute:
    family: design
    role: plan
    operator: task.execute
    readOnly: false
    # It reads the request as it stands, the bound repository and the actual target system it would
    # touch, plus the existing Work records when present; it writes only its own evidence bundle -
    # the selection is a finding, not a product record.
    reads: [record, code, runtime]
    writes: [evidence]
    knowledge: []
    checks: []
    stacks: []
    carries: []
    purpose: Analyse one unmatched or ad-hoc request into a bounded, evidence-grounded workflow selection - the named workflow, its operator and mode, typed inputs, effect ceiling and completion criteria - without performing any of the effects it selects.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [environment, authority]
  scope.define:
    family: design
    role: decide
    operator: scope.define
    readOnly: false
    # The scope is bounded by the intake statement and by the exclusions the owner already decided.
    reads: [record, decision]
    writes: [record]
    knowledge: [architecture-rules, design-patterns, application-stacks]
    checks: []
    stacks: [modules/schemas/work-feature.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/feature@1, work/catalog@1]
    purpose: Bound the request into a scope - the nodes the workflow walks, their dependencies, and the exclusions the owner approved.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # Restructuring with the behaviour pinned: the same regression check runs before the edit and after it, so a
  # slice with no coverage to check against is never refactored on a guess - it reports `test-gap` and the
  # route authors the missing tests first.
  code.refactor:
    family: build
    role: implement
    operator: code.refactor
    readOnly: false
    reads: [sds, code]
    writes: [code]
    knowledge: [patterns/be/*, patterns/fe/*, architecture-rules, code-pattern-enforcement]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Restructure the selected code with its behaviour invariant - the existing regression check is run before and after the edit, and a slice with no coverage to pin it reports `test-gap` instead of proceeding.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, sds-gap, test-gap, environment, authority]
  test.author:
    family: build
    role: implement
    operator: test.author
    readOnly: false
    # Tests are code records, authored inside the bound repository's test allowlist from the design and the
    # code they pin. This kind writes them; judging them stays the prove kinds' work.
    reads: [sds, code]
    writes: [code]
    knowledge: [patterns/be/*, patterns/fe/*, code-pattern-enforcement]
    checks: [scripts/checks/check-scoped-lint.mjs, scripts/checks/code-patterns/*.mjs, scripts/checks/architecture/*.mjs]
    stacks: [modules/schemas/workspace-routing.yaml]
    carries: []
    purpose: Author the test files a slice is missing - tests are code records and this kind writes them, never judges them.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, sds-gap, environment, authority]
  # The two goal-gated proofs. Both sit on the implementation lanes behind `optionalWhen` predicates that read
  # the goal's metrics block, and both read `asset` as well as `code` for one reason: the frontend lane's build
  # writes both, and a prove step blind to what its lane's build produced is `lane-proof-blind`.
  security.verify:
    family: prove
    role: verify
    operator: security.verify
    readOnly: false
    reads: [code, asset]
    writes: [evidence]
    knowledge: [code-pattern-enforcement]
    checks: [scripts/checks/code-patterns/*.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Inspect the delivered code, configuration and shipped assets for vulnerabilities and leave the findings as evidence, repairing nothing.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
  perf.verify:
    family: prove
    role: verify
    operator: perf.verify
    readOnly: false
    reads: [code, asset]
    writes: [evidence]
    knowledge: [application-stacks]
    checks: [scripts/checks/acceptance.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/evidence@1, starci/evidence-packet@1]
    purpose: Measure the running product against the performance budget the goal declared and leave the measured numbers as evidence.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
  docs.author:
    family: design
    role: write
    operator: docs.author
    readOnly: false
    # Documentation is derived from what was decided and built - the records and the code as they are - and is
    # itself kept as a record, so a doc restates sources rather than inventing them.
    reads: [record, code]
    writes: [record]
    knowledge: [architecture-rules, design-patterns]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/*]
    purpose: Author or update the product's documentation from the settled records and the delivered code.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, authority]
  # The goal is dynamic through this kind alone: it produces goal v(n+1) with an explicit diff and bumps the
  # rev, and it may never widen scope or authority silently - a change that does waits on the owner's decision.
  goal.revise:
    family: design
    role: decide
    operator: goal.revise
    readOnly: false
    reads: [record]
    writes: [record]
    knowledge: []
    checks: []
    stacks: [modules/goal/define-goal.yaml]
    carries: [starci/goal@1]
    purpose: Revise the workflow's own goal - produce the next revision with an explicit diff and a bumped rev, holding authority unchanged unless the owner decides it.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # The read-only side of the goal contract: it carries the `review.verify` operator contract, the same way
  # `implementation.plan` carries `work.author`'s - the kernel reads the goal against it, no second operator.
  goal.validate:
    family: prove
    role: verify
    operator: review.verify
    readOnly: true
    reads: [record]
    writes: []
    knowledge: []
    checks: []
    stacks: [modules/goal/define-goal.yaml]
    carries: []
    purpose: Read the workflow goal against its contract - a checkable `done` metrics block, stable ids, a frozen rev - and report what it finds, repairing nothing.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [authority]
  # The three operators the registry already carried, wired into the catalog: like the revise kinds and the
  # record authors they belong to no lane - nothing schedules them, a request or a report creates them.
  knowledge.repair:
    family: repair
    role: write
    operator: knowledge.repair
    readOnly: false
    # The challenged rule is read where it canonically lives - in the bound repository, and in the grammar
    # canon when the rule is a language rule - together with the node whose evidence raised the challenge.
    reads: [record, code, grammar]
    writes: [code]
    knowledge: [patterns/be/*, patterns/fe/*, code-pattern-enforcement]
    checks: [scripts/checks/code-patterns/*.mjs]
    stacks: [modules/schemas/knowledge-source.schema.yaml, modules/schemas/knowledge-rule.schema.yaml]
    carries: [starci/knowledge-source@1]
    purpose: Repair one challenged canonical instruction or rule and the references it affects, from concrete applicability evidence - fixed in its canonical home, never patched around.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, authority]
  scope.finish:
    family: build
    role: implement
    operator: scope.finish
    readOnly: false
    # The finish op reads the nodes and repository it removes, the live consumers it must preserve and the
    # owner decision that authorises it; it writes the removed scope's own record - removal runs only where
    # separately authorised, and evidence is preserved rather than rewritten.
    reads: [record, code, decision]
    writes: [record]
    knowledge: []
    checks: [scripts/checks/check-scoped-lint.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/node@1]
    purpose: Retire exactly the selected scope - a scoped metadata decision that preserves live consumers and required evidence, with destructive effects only where separately authorised.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
  workspace.manage:
    family: design
    role: plan
    operator: workspace.manage
    readOnly: false
    # A workspace is prepared or imported from the request, the existing tree and the owner's accepted
    # decisions; the repositories it binds are read, never created by guesswork.
    reads: [record, code, decision]
    writes: [record]
    knowledge: [application-stacks]
    checks: []
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/workspace@1, work/catalog@1, work/feature@1, work/resource@1, work/node@1, starci/source-identity@1]
    purpose: Create or reconstruct one canonical workspace from a purpose or a selected existing source - verified bindings, preserved provenance, validated scope.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [environment, authority]
  # The last two registry operators wired into the catalog: content production and delivery. Neither belongs
  # to a lane - a request selects the content unit, a proven build selects delivery.
  content.generate:
    family: build
    role: write
    operator: content.generate
    readOnly: false
    # The brief and the settled records govern the unit; the source repository grounds the claims it may
    # carry. Facts and testimonials the brief does not supply are not creative license.
    reads: [record, srs, sds, design, brand, grammar, code]
    writes: [record, asset, code]
    knowledge: [coding-reference]
    checks: [scripts/checks/check-scoped-lint.mjs]
    stacks: [modules/schemas/work.schema.yaml, modules/schemas/work-layout.yaml]
    carries: [work/*]
    purpose: Author or revise one selected content unit from its brief, grounded in the settled records and the selected source.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
  release.deliver:
    family: build
    role: implement
    operator: release.deliver
    readOnly: false
    # Delivery reads the proven build, the evidence that proved it and the stack it lands on; what it writes
    # is the verified remote outcome - publication without proof is not delivery.
    reads: [code, evidence, runtime]
    writes: [record]
    knowledge: [application-stacks]
    checks: [scripts/checks/stacks.mjs, scripts/checks/proof.mjs]
    stacks: [modules/schemas/application-stacks.schema.yaml]
    carries: [starci/evidence-packet@1]
    purpose: Deliver the proven build to the selected environment - deploy, publish or migrate as authorised - and leave the verified remote outcome as evidence.
    reports:
      outcomes: [done, partial, failed, ask, blocked]
      blockers: [shared-change, environment, authority]
# The mandatory sequence per ledger node. `match` is the node shape (`kind`, and `role` for the
# backend/frontend side a node is delivered on, from its layout or its repository); the first lane whose
# match fits wins, so the list runs from the most specific to the least. A step is mandatory unless it
# carries `optionalWhen`, and `optionalWhen` names a predicate the kernel evaluates - never a judgement.
lanes:
  - id: design/ui
    match:
      - {kind: ui}
    purpose: |-
      A `ui` node is the interface design record itself: it is drawn as image-model candidates inside the grammar
      and the brand, then the artwork those candidates embed is generated as real assets. It builds nothing; the
      implementation nodes of its feature are built and walked against it.
    steps:
      - kind: interface.draw
      - kind: interface.asset
        optionalWhen: node.hasNoArtworkSlots
  - id: implementation/frontend
    match:
      - {kind: implementation, role: frontend}
    purpose: |-
      Interface code is built against the drawing of its feature - the kernel holds the build until that `ui`
      node is done and asks the user when the feature has none - and it is walked end to end before it is believed.
      The security and performance proofs exist only for a goal that declares them in its `done` metrics.
    steps:
      - kind: interface.implement
      - kind: interface.audit
      - kind: uat.verify
      - kind: security.verify
        optionalWhen: goal.requiresSecurity
      - kind: perf.verify
        optionalWhen: goal.requiresPerf
  - id: implementation/backend
    match:
      - {kind: implementation, role: backend}
      - {kind: implementation}
    purpose: A node that names no frontend side is behind-the-interface work, built, proven through its API on the real stack, security- and performance-proven when the goal declares it, then independently read - the review reads the evidence the optional proofs left.
    steps:
      - kind: backend.implement
      - kind: e2e.verify
      - kind: security.verify
        optionalWhen: goal.requiresSecurity
      - kind: perf.verify
        optionalWhen: goal.requiresPerf
      - kind: review.verify
  - id: uat/frontend
    match:
      - {kind: uat, role: frontend}
    purpose: A frontend UAT node is the walk itself; there is nothing to build first.
    steps:
      - kind: uat.verify
  - id: e2e
    match:
      - {kind: e2e}
    purpose: An API scenario node is proven through the public API on the real stack; there is nothing to build first.
    steps:
      - kind: e2e.verify
  - id: uat
    match:
      - {kind: uat}
    purpose: A backend scenario node is proven through the API on the real stack; there is nothing to build first.
    steps:
      - kind: e2e.verify
  - id: operations
    match:
      - {kind: operations}
    purpose: Runtime work is operated, then read back by someone who did not operate it.
    steps:
      - kind: runtime.operate
      - kind: review.verify
  - id: architecture
    match:
      - {kind: architecture}
    purpose: A design node is settled once; builders depend on it, they do not re-decide it.
    steps:
      - kind: architecture.decide
  - id: business
    match:
      - {kind: business}
      - {kind: business-overview}
    purpose: A business node is settled once, before any design is drawn against it.
    steps:
      - kind: business.decide
  - id: integration
    match:
      - {kind: integration}
    purpose: |-
      One declared external system, one node, one live proof. There is nothing to build first: the product
      code that calls the provider is built by the feature's implementation node, and this node exists to
      show that the call reaches the real provider with the owner's own credential.
    steps:
      - kind: integration.verify
  - id: brand
    match:
      - {kind: brand}
    purpose: The product's identity is settled once, in one record; a drawing reads it instead of inventing a colour.
    steps:
      - kind: brand.decide
# Bounded outcome routing. `on` is the report shape the kernel observed, `from` the kind that produced it
# (`any` for every kind), `to` the operation the graph creates - `same` is the reporter's own kind and
# `lane.build` the build step of the reporter's lane, so a frontend repair is never a backend op. `limit`
# bounds how many times one route may fire for the same node group; past it the workflow asks the user.
# Ordered: the first matching route wins, and a route with an explicit `from` stands before the `any` one.
routes:
  - id: interface-audit-local-drift-repairs-the-interface
    on: {outcome: failed}
    from: interface.audit
    to: {kind: interface.implement, origin: repair}
    limit: 5
    then: reopen
    purpose: A bounded drift against explicit intent and Grammar returns to implementation; that repair must capture the full selected matrix before audit runs again.
  - id: interface-audit-systemic-drift-redraws-direction
    on: {blocker: interface-gap}
    from: interface.audit
    to: {kind: interface.draw, origin: architecture}
    limit: 5
    then: reopen
    purpose: Missing, contradictory, generic or creatively inadequate direction returns to a more explicit draw, then implementation and fresh-capture audit; the audit never redraws.
  - id: assisted-uat-red-repairs-the-build
    on: {outcome: failed}
    from: uat.assisted.verify
    to: {kind: interface.implement, origin: repair}
    limit: 3
    then: reopen
    purpose: A current immutable assisted run whose independently reproduced product postcondition is red returns to the frontend build; receipt, runner and verifier never patch the product.
  - id: uat-red-repairs-the-build
    on: {outcome: failed}
    from: uat.verify
    to: {kind: lane.build, origin: repair}
    limit: 3
    then: reopen
    purpose: A red end-to-end scenario is a defect in the build it walked, not in the walk.
  - id: e2e-red-repairs-the-build
    on: {outcome: failed}
    from: e2e.verify
    to: {kind: lane.build, origin: repair}
    limit: 3
    then: reopen
    purpose: A red API scenario is a defect in the slice it exercised, not in the scenario.
  - id: perf-red-repairs-the-build
    on: {outcome: failed}
    from: perf.verify
    to: {kind: lane.build, origin: repair}
    limit: 3
    then: reopen
    purpose: A product that misses the performance budget its goal declared is a defect in the build it measured, not in the measurement.
  - id: review-findings-repair-the-build
    on: {verdict: findings}
    from: review.verify
    to: {kind: lane.build, origin: repair}
    limit: 3
    then: settle
    purpose: A read-only review never repairs; its findings become one repair of the kind that built the slice.
  - id: rejected-report-retries
    on: {verdict: rejected}
    from: any
    to: {kind: same}
    limit: 2
    then: retry
    purpose: A report the kernel could not reproduce is the same operation again, with what it got told back.
  - id: red-gate-repairs-the-build
    on: {verdict: gate-failed}
    from: any
    to: {kind: lane.build, origin: gate}
    limit: 3
    then: settle
    purpose: A failing workflow gate is one repair operation, never a relaxed gate.
  - id: srs-gap-revises-the-requirement
    on: {blocker: srs-gap}
    from: any
    to: {kind: business.revise, origin: business}
    limit: 2
    then: reopen
    purpose: |-
      A requirement the SRS does not settle, or settles twice in two ways, is a gap in the requirement record and
      nowhere else: the design may not invent the product rule it is supposed to realise, and the build may not
      pick a reading in code. The record is revised once - the most reasonable reading by the accepted records,
      the other feature's decided records and the product's own conventions, written into the requirement with
      its acceptance, the reason stated in the decision log and the `rev` bumped - and the requester reads it
      again behind it. Past two rounds for one node the workflow asks the user.
  - id: sds-gap-revises-the-design
    on: {blocker: sds-gap}
    from: any
    to: {kind: architecture.revise, origin: architecture}
    limit: 2
    then: reopen
    purpose: A builder that found the design silent waits for the design to be revised, then reads it again.
  - id: interface-gap-redraws-the-interface
    on: {blocker: interface-gap}
    from: any
    to: {kind: interface.draw, origin: architecture}
    limit: 2
    then: reopen
    purpose: A missing screen, state or contract is drawn first; it is never improvised in the build.
  - id: brand-gap-settles-the-brand
    on: {blocker: brand-gap}
    from: any
    to: {kind: brand.decide, origin: architecture}
    limit: 2
    then: reopen
    purpose: |-
      An operation with no settled identity to work inside waits for the brand record and then reads it. A
      colour token, a typeface or a mascot rule is settled once, in one place; it is never invented by the
      operation that happened to need it first.
  - id: grammar-gap-grows-the-grammar
    on: {blocker: grammar-gap}
    from: any
    to: {kind: grammar.update, origin: architecture}
    limit: 2
    then: reopen
    purpose: |-
      A shape the grammar cannot render is grown into the grammar once, as a semantic unit, never invented
      beside it in a page. The operation that found the word missing waits for the published version and reads
      the canon again; past two rounds for one node the workflow asks the user.
  - id: test-gap-authors-the-tests
    on: {blocker: test-gap}
    from: any
    to: {kind: test.author, origin: gate}
    limit: 2
    then: reopen
    purpose: |-
      A behaviour-invariant change with no regression coverage to pin it waits for the tests to be authored,
      then runs them before and after its edit. The coverage is authored - never assumed, and never the
      user's to supply; past two rounds for one node the workflow asks the user.
  - id: shared-change-from-an-api-proof-is-a-backend-build
    on: {blocker: shared-change}
    from: e2e.verify
    to: {kind: backend.implement, origin: shared}
    limit: 3
    then: pause
    purpose: |-
      A proof that needs a path outside its allowlist needs code, not another proof: the change it found missing
      is one scoped backend build, and the proof waits for it, then runs again against what was built.
  - id: shared-change-from-a-walk-is-a-frontend-build
    on: {blocker: shared-change}
    from: uat.verify
    to: {kind: interface.implement, origin: shared}
    limit: 3
    then: pause
    purpose: A walk that needs a path outside its allowlist needs a scoped frontend build, never a second walk.
  - id: shared-change-is-a-scoped-build
    on: {blocker: shared-change}
    from: any
    to: {kind: same, origin: shared}
    limit: 3
    then: pause
    purpose: A path outside the allowlist becomes one scoped operation of the same kind; the requester waits.
  - id: environment-needs-the-user
    on: {blocker: environment}
    from: any
    to: {needUser: true}
    limit: 1
    then: needUser
    purpose: A runtime that cannot start is not an operation's to fix; the workflow says so and stops.
  - id: authority-needs-the-user
    on: {blocker: authority}
    from: any
    to: {needUser: true}
    limit: 1
    then: needUser
    purpose: A decision the goal does not authorise belongs to the user, not to a model.
  - id: question-needs-the-user
    on: {outcome: ask}
    from: any
    to: {needUser: true}
    limit: 1
    then: needUser
    purpose: |-
      A question the kernel cannot answer from the operation's own closed options reaches the user. The
      kernel may answer it in place once, from those options; it never invents an answer it was not offered.
  - id: partial-resumes-the-same-op
    on: {outcome: partial}
    from: any
    to: {kind: same}
    limit: 5
    then: retry
    purpose: Unfinished work is the same operation once more, carrying its own open items forward.
  - id: failed-retries-the-same-op
    on: {outcome: failed}
    from: any
    to: {kind: same}
    limit: 3
    then: retry
    purpose: A failing check is retried with the failure named; past the limit the workflow asks the user.
