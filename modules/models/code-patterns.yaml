      - id: NEST-OWNER-PUBLIC-ENTRY
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-4, BE-IMPORTS-1, BE-IMPORTS-4]
        applicability: { include: ['src/features/**/*.ts', 'src/modules/**/*.ts', 'apps/*/src/features/**/*.ts', 'apps/*/src/modules/**/*.ts', 'libs/*/src/features/**/*.ts', 'libs/*/src/modules/**/*.ts'], exclude: ['**/*.spec.ts', '**/*-spec.ts', '**/*.test.ts', '**/*-test.ts', '**/__tests__/**'] }
