schema: starci/code-pattern-profile@1
profiles:
  nest:
    title: StarCi NestJS code pattern
    canon:
      package: '@starci/eslint-canon-be'
      version: 3.0.9
      contentDigest:
        algorithm: sha256
        include: ['**/*.mjs', '**/*.json', '**/*.md', '**/*.ts', '**/*.yaml']
        exclude: ['**/*.spec.mjs']
        framing: sorted-posix-relative-path-null-raw-bytes-null
        value: 418d7f398eb6408d798af72e4c0e58042ed9a5f55ba12bbc0ec7dff1eba9b3e3
        files: 160
    sourceRuleRoots:
      - knowledge/patterns/be
    expectedSourceRuleIds:
      - BE-ARCHITECTURE-1
      - BE-ARCHITECTURE-2
      - BE-ARCHITECTURE-3
      - BE-ARCHITECTURE-4
      - BE-COMMENT-1
      - BE-COMMENT-2
      - BE-COMMENT-3
      - BE-COMMENT-4
      - BE-COMMENT-5
      - BE-COMMENT-6
      - BE-COMMENT-7
      - BE-ERROR-1
      - BE-ERROR-2
      - BE-ERROR-3
      - BE-ERROR-4
      - BE-ERROR-5
      - BE-ERROR-6
      - BE-ERROR-7
      - BE-EVENT-BUS-1
      - BE-EVENT-BUS-2
      - BE-EVENT-BUS-3
      - BE-EVENT-BUS-4
      - BE-EVENT-BUS-5
      - BE-FOLDER-1
      - BE-FOLDER-2
      - BE-FOLDER-3
      - BE-FOLDER-4
      - BE-FOLDER-5
      - BE-FOLDER-6
      - BE-FOLDER-7
      - BE-FUNCTION-1
      - BE-FUNCTION-2
      - BE-FUNCTION-3
      - BE-FUNCTION-4
      - BE-FUNCTION-5
      - BE-FUNCTION-6
      - BE-FUNCTION-7
      - BE-FUNCTION-8
      - BE-IDEMPOTENCY-1
      - BE-IDEMPOTENCY-2
      - BE-IMPORTS-1
      - BE-IMPORTS-2
      - BE-IMPORTS-3
      - BE-IMPORTS-4
      - BE-IMPORTS-5
      - BE-IMPORTS-6
      - BE-IMPORTS-7
      - BE-MESSAGES-1
      - BE-MESSAGES-2
      - BE-JOBS-1
      - BE-JOBS-2
      - BE-JOBS-3
      - BE-JOBS-4
      - BE-JOBS-5
      - BE-NAMING-1
      - BE-NAMING-2
      - BE-NAMING-3
      - BE-NAMING-4
      - BE-NAMING-5
      - BE-NAMING-6
      - BE-NAMING-7
      - BE-NAMING-8
      - BE-PERSISTENCE-6
      - BE-PERSISTENCE-7
      - BE-QUEUES-1
      - BE-QUEUES-2
      - BE-QUEUES-3
      - BE-PROJECTIONS-1
      - BE-PROJECTIONS-2
      - BE-PROJECTIONS-3
      - BE-PROJECTIONS-4
      - BE-QUEUES-1
      - BE-QUEUES-2
      - BE-QUEUES-3
      - BE-QUEUES-4
      - BE-REACTORS-1
      - BE-REACTORS-2
      - BE-REACTORS-3
      - BE-REACTORS-4
      - BE-REALTIME-1
      - BE-REALTIME-2
      - BE-REALTIME-3
      - BE-REALTIME-4
      - BE-RESILIENCE-1
      - BE-SAGA-1
      - BE-SAGA-2
      - BE-SAGA-3
      - BE-SAGA-4
      - BE-SERVICES-1
      - BE-SERVICES-2
      - BE-SERVICES-3
      - BE-SERVICES-4
      - BE-TEMPORAL-1
      - BE-TEST-1
      - BE-TEST-2
      - BE-TEST-3
      - BE-TEST-4
      - BE-TEST-5
      - BE-TEST-6
      - BE-TEST-7
      - BE-TYPING-1
      - BE-TYPING-2
      - BE-TYPING-3
      - BE-TYPING-4
      - BE-TYPING-5
      - BE-TYPING-6
      - BE-TYPING-7
      - BE-WEBHOOK-1
      - BE-WEBHOOK-2
      - BE-WEBHOOK-3
      - BE-WEBHOOK-4
    sourceGlobs:
      - src/**/*.{ts,mts,cts,tsx}
      - apps/*/src/**/*.{ts,mts,cts,tsx}
      - libs/*/src/**/*.{ts,mts,cts,tsx}
      - test/**/*.{ts,mts,cts,tsx}
      - tests/**/*.{ts,mts,cts,tsx}
    inputGlobs:
      - jest*.{js,mjs,cjs,ts,json}
      - apps/*/jest*.{js,mjs,cjs,ts,json}
      - libs/*/jest*.{js,mjs,cjs,ts,json}
      - packages/*/jest*.{js,mjs,cjs,ts,json}
      - tsconfig*.json
      - apps/*/tsconfig*.json
      - libs/*/tsconfig*.json
      - packages/*/tsconfig*.json
      - package.json
      - package-lock.json
    obligations:
      - id: NEST-DEPENDENCY-DIRECTION
        sourceRuleIds: [BE-ARCHITECTURE-1, BE-FOLDER-1, BE-IMPORTS-4]
        applicability: { include: ['**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts', '**/*-spec.ts', '**/*.test.ts', '**/*-test.ts', '**/__tests__/**', 'test/**', 'tests/**'] }
        mechanical:
          requirement: Resolve aliases, relative imports, literals, re-exports and packages before enforcing app to feature to module direction.
          check:
            kind: architecture
            ruleIds: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, ARCH_PACKAGE_IMPORTS_APP, ARCH_PACKAGE_EXPORT_BYPASS, ARCH_INTERNAL_IMPORT_UNRESOLVED, ARCH_DYNAMIC_DEPENDENCY_UNPROVEN]
            externalResult: { schema: 'starci/architecture-check@1', command: 'node scripts/hfs/architecture.mjs <repo-root>' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm that a declared module owns a cohesive capability instead of hiding feature orchestration.
        status: implemented
      - id: NEST-APP-COMPOSITION
        sourceRuleIds: [BE-ARCHITECTURE-2, BE-FOLDER-1]
        applicability: { include: ['apps/**/src/**/*.ts', 'src/main.ts', 'src/app.module.ts'], exclude: ['**/*.spec.ts', '**/*-spec.ts', '**/*.test.ts', '**/*-test.ts', '**/__tests__/**'] }
        mechanical:
          requirement: Keep app roots to entry, root-module and narrowly named bootstrap/config roles.
          check:
            kind: architecture
            ruleIds: [BE_APP_COMPOSITION_ONLY, BE_APP_BUSINESS_ROLE]
            externalResult: { schema: 'starci/architecture-check@1', command: 'node scripts/hfs/architecture.mjs <repo-root>' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Inspect callbacks with neutral names for hidden product behavior.
        status: implemented
      - id: NEST-APPLICATION-TRANSPORT-BOUNDARY
        sourceRuleIds: [BE-ARCHITECTURE-4, BE-FOLDER-2, BE-FUNCTION-2, BE-FUNCTION-4, BE-TYPING-7]
        applicability: { include: ['src/features/**/application/**/*.ts', 'apps/*/src/features/**/application/**/*.ts', 'libs/*/src/features/**/application/**/*.ts'], exclude: ['**/*.spec.ts', '**/*-spec.ts', '**/*.test.ts', '**/*-test.ts', '**/__tests__/**'] }
        mechanical:
          requirement: Application messages, handlers and contracts cannot import transport DTOs or protocol-framework surfaces.
          check:
            kind: architecture
            ruleIds: [BE_APPLICATION_IMPORTS_TRANSPORT, BE_APPLICATION_TRANSPORT_FRAMEWORK]
            externalResult: { schema: 'starci/architecture-check@1', command: 'node scripts/hfs/architecture.mjs <repo-root>' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Verify semantic validation and DTO/result projection at the actual transport boundary.
        status: implemented
      - id: NEST-DOCUMENTED-EXPORTS
        sourceRuleIds: [BE-COMMENT-1, BE-COMMENT-2, BE-COMMENT-4, BE-COMMENT-7]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Require export and enum-member docs, reject restated-name docs and non-ASCII source under the canon profile; inline suppression is its own obligation.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/require-export-jsdoc, starci-be/require-enum-member-jsdoc, starci-be/no-restated-name-jsdoc, starci-be/no-non-ascii-source]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/comment.yaml
          review: Confirm prose explains responsibility or consequence rather than satisfying presence by paraphrase.
        status: implemented
      - id: NEST-EXCEPTION-IDENTITY
        sourceRuleIds: [BE-ERROR-1, BE-ERROR-2, BE-ERROR-3, BE-NAMING-3]
        applicability: { include: ['**/*.{ts,mts,cts,tsx}'], exclude: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/*.{spec,test}.{ts,mts,cts,tsx}', '**/*-{spec,test}.{ts,mts,cts,tsx}', '**/__tests__/**', '**/tests/**', '**/test/**'] }
        mechanical:
          requirement: Every thrown value derives from the platform DomainError, each capability declares its one error family in errors/<capability>.error.ts, and error codes are unique across the repository.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/throw-domain-error, starci-be/error-family-shape, starci-be/error-code-unique]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Select the error family and genuine protocol health exceptions explicitly; preserve typed normal business dispositions and test transport redaction separately.
        status: implemented
      - id: NEST-HFS-ERROR-HANDLING
        sourceRuleIds: [BE-ERROR-1, BE-ERROR-5]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: Every catch rethrows, logs through a logger port or returns an outcome carrying its cause; an error class lives in its capability errors folder and extends DomainError, and no bare or framework error escapes.
          check:
            kind: eslint
            sourceOnly: false
            ruleIds: [starci-be/catch-must-account, starci-be/error-home]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify that a returned outcome is a typed union the caller handles, and that translated errors keep the original as cause.
        status: implemented
      - id: NEST-HFS-SCHEMA-AUTHORITY
        sourceRuleIds: [BE-FOLDER-6, BE-TYPING-7]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: The schema changes by migration only; SQL is a `SqlText` constant in a persistence `<name>.sql.ts` and there is no query builder; no ORM entity appears in a contract, DTO, resolver or controller type.
          check:
            kind: eslint
            sourceOnly: false
            ruleIds: [starci-be/no-runtime-schema, starci-be/sql-text-only, starci-be/no-query-builder, starci-be/no-entity-in-contract]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Verify the baseline migration against the live schema, and that each projection carries what its consumer needs.
        status: implemented
      - id: NEST-HFS-DEFAULT-DENY-CONFIG
        sourceRuleIds: [BE-IMPORTS-6, BE-ERROR-5]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: Bodies and arguments are typed and no GraphQLJSON tunnel exists; an open door carries a reason; only platform config reads the environment; no secret or URL default in source; secrets compare with timingSafeEqual.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/no-untyped-body, starci-be/public-needs-reason, starci-be/auth-door-strict-rate-tier, starci-be/no-direct-env-read, starci-be/config-parsed-in-main, starci-be/no-secret-default, starci-be/secret-compare-timing-safe]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify the app registers the identity guard as APP_GUARD and that each public reason is true.
        status: implemented
      - id: NEST-HFS-MODULE-SHAPE
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-3]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: A module is never global from inside (`@Global()` appears nowhere, `isGlobal` is set to true only in an app root `app.module.ts`), never imports another owner's module, names its options type, has only a static register factory, is one per file, is never built with new, and no module keeps mutable module-level state.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/no-global-decorator, starci-be/is-global-only-in-app, starci-be/no-cross-owner-module-import, starci-be/capability-module-shape, starci-be/typed-module-definition, starci-be/static-module-register, starci-be/no-new-injectable, starci-be/no-module-let, starci-be/one-module-per-file]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Verify that each capability exposes one application module and one module per transport.
        status: implemented
      - id: NEST-OWNER-ENTRY-LINT
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-4, BE-IMPORTS-1, BE-IMPORTS-4]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: Another owner is imported through its explicit index entry, never through a path into it; an owner has one index that lists a bounded set of named exports with no export star, and a same-owner import never goes through it.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/import-owner-entry, starci-be/no-folder-reexport]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm the exported surface is a stable capability API.
        status: implemented
      - id: NEST-HFS-NO-SUPPRESSION
        sourceRuleIds: [BE-COMMENT-4]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: No eslint-disable, ts-ignore, ts-expect-error, ts-nocheck or language marker comment exists.
          check:
            kind: eslint
            sourceOnly: false
            ruleIds: [starci-be/no-inline-suppression]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/comment.yaml
          review: A missing rule is proposed in the canon, never suppressed in the repository.
        status: implemented
      - id: NEST-HFS-FILE-SIZE
        sourceRuleIds: [BE-FUNCTION-3]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: A source file over its line budget is neither new nor longer than its recorded size at the parent commit; the soft budget is reported as an advisory.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/file-size-growth]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Split by responsibility, not by line count.
        status: implemented
      - id: NEST-HFS-SPEC-QUALITY
        sourceRuleIds: [BE-TEST-1]
        applicability: { include: ['src/**/*.spec.ts', 'apps/**/*.spec.ts', 'libs/**/*.spec.ts', 'src/tests/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: A spec does not read repository source with fs and builds doubles with a typed mock instead of a cast.
          check:
            kind: eslint
            sourceOnly: false
            ruleIds: [starci-be/spec-no-source-read, starci-be/spec-typed-doubles]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Verify the double models the real dependency contract.
        status: implemented
      - id: NEST-OBSERVABILITY
        sourceRuleIds: [BE-ERROR-7, BE-IMPORTS-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: Production source does not use console or framework logger and uses stable structured log identity.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [no-console, starci-be/no-framework-logger, starci-be/no-interpolated-log-message, starci-be/no-error-wording-as-log-identity]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify redaction and correlation fields against the real logging adapter.
        status: implemented
      - id: NEST-HFS-RUNTIME-SAFETY
        sourceRuleIds: [BE-ERROR-5, BE-ERROR-7, BE-TYPING-2]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: SQL text has no runtime substitution, a read states its bound and never runs once per loop element; an outbound HTTP call has a timeout and outside JSON is parsed inside a guard; a log call names no secret or personal identifier; no cast to never or non-null assertion; an async function awaits; handlers declare a return type; a migration reverses; every input property has a validator.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/no-interpolated-sql, starci-be/query-needs-limit, starci-be/no-query-in-loop, starci-be/http-needs-timeout, starci-be/json-parse-needs-guard, starci-be/no-secret-in-log, starci-be/no-secret-in-error, starci-be/no-never-cast, starci-be/no-non-null-assertion, starci-be/async-needs-await, starci-be/explicit-handler-return-type, starci-be/migration-down-reversible, starci-be/dto-needs-validator]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/persistence.yaml
          review: Verify a chosen bound cannot silently truncate a result the caller treats as complete, and that a masked log value cannot be reversed.
        status: implemented
      - id: NEST-USER-COPY-CATALOG
        sourceRuleIds: [BE-MESSAGES-1]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: A literal exception message, notification text or transport response copy comes from the per-capability or per-feature messages catalog through the MessageCatalog port, not from source.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/user-copy-through-catalog]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/messages.yaml
          review: Confirm the resolved locale follows the decided RequestLocale rule (stored preference, then Accept-Language, then vi; a recipient's own preference outside a request) rather than a call-site guess.
        status: implemented
      - id: NEST-RESILIENT-DELIVERY
        sourceRuleIds: [BE-TEMPORAL-1, BE-IDEMPOTENCY-1, BE-RESILIENCE-1, BE-PERSISTENCE-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts', 'src/tests/**', 'libs/*/src/tests/**'] }
        mechanical:
          requirement: The ambient clock is read only inside platform/clock; a webhook or outbox/queue consumer, detected by filename or by decorator/class-name shape, claims the event through the shared inbox before it acts; a loop that catches and waits goes through platform/retry; no transaction spans an external call.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/no-ambient-clock, starci-be/inbox-dedupe-required, starci-be/no-hand-rolled-retry, starci-be/no-external-call-in-transaction]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/idempotency.yaml
          review: Trace that an inbox claim actually runs before the side effect on every path, that a retried operation is safe to run more than once, and that the commit-then-call vs. outbox choice matches whether the effect must be exactly-once with the write.
        status: implemented
      - id: NEST-PERSISTENCE-SHAPE
        sourceRuleIds: [BE-FOLDER-6, BE-FUNCTION-3, BE-FUNCTION-5, BE-TYPING-7, BE-PERSISTENCE-7]
        applicability: { include: ['src/**/*.ts', 'apps/*/src/**/*.ts', 'libs/*/src/**/*.ts'], exclude: ['**/*.spec.ts'] }
        mechanical:
          requirement: Preserve named shared EntityManager injection (never bare, never getRepository, never an injected DataSource), transaction callback identity, entity table names and non-eager relations.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/must-inject-entity-manager, starci-be/no-injected-repository, starci-be/no-outer-manager-in-transaction, starci-be/require-entity-table-name, starci-be/no-eager-relation, starci-be/named-entity-manager-only, starci-be/no-repository-class]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Boot the named connection and test atomicity; AST shape cannot prove the token or database effect.
        status: implemented
      - id: NEST-CONDITIONAL-CQRS-SHAPE
        sourceRuleIds: [BE-FUNCTION-1, BE-FUNCTION-2, BE-NAMING-6]
        applicability: { include: ['src/**/*.handler.ts', 'src/**/*.command.ts', 'src/**/*.query.ts', 'apps/*/src/**/*.handler.ts', 'apps/*/src/**/*.command.ts', 'apps/*/src/**/*.query.ts', 'libs/*/src/**/*.handler.ts', 'libs/*/src/**/*.command.ts', 'libs/*/src/**/*.query.ts'] }
        mechanical:
          requirement: The application layer is CQRS, so handlers extend ICQRSHandler and override process, and messages carry one params field.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/handler-overrides-process, starci-be/message-carries-params-only]
            expected: { severity: error }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Judge whether each handler owns one operation; this check does not judge handler logic.
        status: implemented
      - id: NEST-AUTHORIZATION-DOOR
        sourceRuleIds: [BE-FUNCTION-4, BE-FUNCTION-6]
        applicability: { include: ['src/features/**/*.ts', 'apps/*/src/features/**/*.ts', 'libs/*/src/features/**/*.ts'] }
        mechanical:
          requirement: No door picks its own guard (authentication is the global APP_GUARD chain) and transport doors remain in features.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/no-auth-use-guards, starci-be/door-lives-in-features, starci-be/rest-door-needs-a-reason]
            expected: { severity: error }
        semantic:
          guidance: docs/architecture-rules.md
          review: Exercise denied and cross-scope actions; decorator presence does not prove resource authorization.
        status: implemented
      - id: NEST-TEST-STATIC-CONTRACT
        sourceRuleIds: [BE-FOLDER-7, BE-TEST-1, BE-TEST-5, BE-TEST-7]
        applicability: { include: ['**/*.spec.ts', 'src/tests/**/*.ts', 'apps/*/test/**/*.ts'] }
        mechanical:
          requirement: Tests are colocated/discovered as applicable and avoid call-only, sleep, provider-model, branch and mock-transport false proof.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/unit-test-colocated, starci-be/no-call-only-spec, starci-be/e2e-uses-production-transport, starci-be/e2e-asserts-persisted-state, starci-be/no-sleep-in-flow, starci-be/no-model-call-in-e2e, starci-be/harness-calls-provider-directly, starci-be/no-branch-in-flow-step, starci-be/no-wiring-in-flow-spec, starci-be/no-api-shaped-e2e-filename, starci-be/no-marker-model-stub]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/test.yaml
          review: Confirm assertions establish the named behavior and actual effect boundary.
        status: implemented
      - id: NEST-TYPE-SAFETY
        sourceRuleIds: [BE-TYPING-2, BE-TYPING-3, BE-TYPING-4, BE-TYPING-5]
        applicability: { include: ['**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: Reject any, double/unguarded casts, inline object contracts and const enums; use the adopted generic array form.
          check:
            kind: eslint
            sourceOnly: true
