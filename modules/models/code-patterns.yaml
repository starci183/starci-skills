        semantic:
          guidance: knowledge/patterns/be/typing.yaml
          review: Decide whether a value is public, extensible or transport-owned before selecting its type form.
        status: implemented
    semanticOnly:
      - id: NEST-COHESIVE-ORCHESTRATION
        sourceRuleIds: [BE-FUNCTION-3, BE-FUNCTION-7, BE-TYPING-6]
        rationale: Whether a wrapper, helper, port or generic owns a meaningful responsibility depends on scenario and lifecycle meaning.
        guidance: docs/backend-source-pattern.md
      - id: NEST-CONCURRENCY-DESIGN
        sourceRuleIds: [BE-FUNCTION-6]
        rationale: Atomicity, idempotency and unknown-effect recovery require store/provider design and executable competing/crash tests.
        guidance: docs/architecture-rules.md
      - id: NEST-IMPORT-ORDER-OBSERVATION
        sourceRuleIds: [BE-IMPORTS-3, BE-IMPORTS-5]
        rationale: Import order is explicitly observational; selected execution form and ownership decide imports.
        guidance: knowledge/patterns/be/imports.yaml
      - id: NEST-LOCALE-RESOLUTION
        sourceRuleIds: [BE-MESSAGES-2]
        rationale: No lint rule can see which stored field is a locale preference, whether an Accept-Language parse fell back correctly, or whether a job resolved the recipient's own preference instead of the operator's; this is reviewed against the accepted SRS and a real request or job run.
        guidance: knowledge/patterns/be/messages.yaml
      - id: NEST-INBOX-CLAIM-STORAGE
        sourceRuleIds: [BE-IDEMPOTENCY-2]
        rationale: A lint rule cannot see a migration's column types, whether the unique constraint actually exists on (source, event_id), or whether an adapter claims by insert-and-catch rather than a racy check-then-insert; this is reviewed against the actual migration and adapter.
        guidance: knowledge/patterns/be/idempotency.yaml

