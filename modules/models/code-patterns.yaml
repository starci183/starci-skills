            ruleIds: [ARCH_OWNER_EXPORT_BYPASS, ARCH_OWNER_EXPORT_STAR]
            externalResult: { schema: 'starci/architecture-check@1', command: 'node scripts/hfs/architecture.mjs <repo-root>' }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Confirm the exported surface is a stable capability API.
        status: implemented
      - id: NEST-MODULE-REGISTRATION
        sourceRuleIds: [BE-ARCHITECTURE-3, BE-FOLDER-3, BE-FUNCTION-8]
        applicability: { include: ['src/**/*.module.ts', 'apps/**/src/app.module.ts'] }
        mechanical:
          requirement: Detect direct re-registration of another module's exported provider and validate selected handler/module registration shape.
          check: { kind: architecture, ruleIds: [BE_MODULE_PROVIDER_REREGISTRATION, BE_MODULE_HANDLER_REGISTRATION] }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Boot-test token, scope, configuration and lifetime; named instances cannot be inferred from syntax alone.
        status: implemented
      - id: NEST-COMMENT-MEMBER-SHAPE
        sourceRuleIds: [BE-COMMENT-3, BE-COMMENT-5, BE-COMMENT-6]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts', 'libs/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: Every public member of an exported class, interface or object type in product source opens with a doc block. Comment placement and sentence form remain review.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/require-public-member-jsdoc]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/comment.yaml
          review: Confirm comments explain consequence and corrected reasoning.
        status: implemented
      - id: NEST-FEATURE-FILE-SHAPE
        sourceRuleIds: [BE-FOLDER-2, BE-FOLDER-5, BE-FOLDER-6, BE-NAMING-1, BE-NAMING-2, BE-NAMING-4, BE-NAMING-7, BE-NAMING-8]
        applicability: { include: ['src/features/**/*.{ts,mts,cts,tsx}', 'src/modules/**/*.{ts,mts,cts,tsx}'], exclude: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/*.{spec,test}.{ts,mts,cts,tsx}', '**/*-{spec,test}.{ts,mts,cts,tsx}', '**/__tests__/**'] }
        mechanical:
          requirement: Enforce adopted feature/application/transport placement and filename, class, enum, type and GraphQL surface syntax.
          check: { kind: architecture, ruleIds: [BE_FEATURE_LAYOUT_INVALID, BE_SOURCE_FORM] }
        semantic:
          guidance: docs/backend-source-pattern.md
          review: Select domain versus persistence ownership before judging placement.
        status: implemented
      - id: NEST-TRANSPORT-ERROR-MAPPING
        sourceRuleIds: [BE-ERROR-4, BE-ERROR-5, BE-ERROR-6]
        applicability: { include: ['src/**/*.{ts,mts,cts,tsx}', 'apps/*/src/**/*.{ts,mts,cts,tsx}', 'libs/*/src/**/*.{ts,mts,cts,tsx}', 'packages/*/src/**/*.{ts,mts,cts,tsx}'], exclude: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/*.spec.{ts,mts,cts,tsx}', '**/*-spec.{ts,mts,cts,tsx}', '**/*.test.{ts,mts,cts,tsx}', '**/*-test.{ts,mts,cts,tsx}', '**/__tests__/**'] }
        mechanical:
          requirement: A throw that escapes a catch rethrows the caught value or carries it as the cause of the replacement, and each API app registers exactly the one platform/errors filter and GraphQL formatError.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/replacement-throw-carries-cause, starci-be/error-masked]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/error.yaml
          review: Verify public redaction, retry policy and expected versus unknown outcome behavior with real transport tests.
        status: implemented
      - id: NEST-ENV-CACHE-BOUNDARY
        sourceRuleIds: [BE-IMPORTS-6]
        applicability: { include: ['src/**/*.{ts,mts,cts,tsx}', 'apps/**/*.{ts,mts,cts,tsx}', 'libs/**/*.{ts,mts,cts,tsx}'], exclude: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/*.spec.{ts,mts,cts,tsx}', '**/*-spec.{ts,mts,cts,tsx}', '**/*.test.{ts,mts,cts,tsx}', '**/*-test.{ts,mts,cts,tsx}', 'src/tests/**'] }
        mechanical:
          requirement: Raw cache and other infrastructure libraries are imported only by their one owning capability and reached through injectors, and production exports are named (the Jest global-setup default export is the one exception).
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/infra-import-owner, starci-be/injector-only, starci-be/no-default-export]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/imports.yaml
          review: None; these are code-shape obligations.
        status: implemented
      - id: NEST-TYPE-IMPORT-FORM
        sourceRuleIds: [BE-IMPORTS-2]
        applicability: { include: ['**/*.ts'] }
        mechanical:
          requirement: Use type-only imports when the resolved binding is used only as a type.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: ['@typescript-eslint/consistent-type-imports']
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/imports.yaml
          review: None; the TypeScript-aware lint rule resolves type-only use.
        status: implemented
      - id: NEST-CONTRACT-TYPE-FORM
        sourceRuleIds: [BE-TYPING-1, BE-TYPING-2, BE-TYPING-3, BE-TYPING-4, BE-NAMING-7]
        applicability: { include: ['**/*.{ts,mts,cts,tsx}'], exclude: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/*.spec.{ts,mts,cts,tsx}', '**/*-spec.{ts,mts,cts,tsx}', '**/*.test.{ts,mts,cts,tsx}', '**/*-test.{ts,mts,cts,tsx}', '**/__tests__/**', 'test/**', 'tests/**'] }
        mechanical:
          requirement: Enforce explicit named public inputs/results, readonly dependency/message fields and adopted serialized enum/type-name forms.
          check:
            kind: architecture
            ruleIds: [BE_PUBLIC_CONTRACT_FORM, BE_READONLY_BOUNDARY, BE_SOURCE_FORM]
            externalResult: { schema: 'starci/architecture-check@1', command: 'node scripts/hfs/architecture.mjs <repo-root>' }
        semantic:
          guidance: knowledge/patterns/be/typing.yaml
          review: Decide whether a value is public, extensible or transport-owned before selecting its type form.
        status: implemented
    semanticOnly:
      - id: NEST-COHESIVE-ORCHESTRATION
        sourceRuleIds: [BE-FUNCTION-3, BE-FUNCTION-7, BE-TYPING-6]
        rationale: Whether a wrapper, helper, port or generic owns a meaningful responsibility depends on scenario and lifecycle meaning.
        guidance: docs/backend-source-pattern.md
      - id: NEST-CONCURRENCY-DESIGN
        sourceRuleIds: [BE-FUNCTION-6]
        rationale: Atomicity, idempotency and unknown-effect recovery require store/provider design and executable competing/crash tests.
        guidance: docs/architecture-rules.md
      - id: NEST-IMPORT-ORDER-OBSERVATION
        sourceRuleIds: [BE-IMPORTS-3, BE-IMPORTS-5]
        rationale: Import order is explicitly observational; selected execution form and ownership decide imports.
        guidance: knowledge/patterns/be/imports.yaml
      - id: NEST-LOCALE-RESOLUTION
        sourceRuleIds: [BE-MESSAGES-2]
        rationale: No lint rule can see which stored field is a locale preference, whether an Accept-Language parse fell back correctly, or whether a job resolved the recipient's own preference instead of the operator's; this is reviewed against the accepted SRS and a real request or job run.
        guidance: knowledge/patterns/be/messages.yaml
      - id: NEST-INBOX-CLAIM-STORAGE
        sourceRuleIds: [BE-IDEMPOTENCY-2]
        rationale: A lint rule cannot see a migration's column types, whether the unique constraint actually exists on (source, event_id), or whether an adapter claims by insert-and-catch rather than a racy check-then-insert; this is reviewed against the actual migration and adapter.
        guidance: knowledge/patterns/be/idempotency.yaml
      - id: NEST-SERVICE-ISOLATION
        sourceRuleIds: [BE-SERVICES-1]
        applicability: { include: ['apps/**/*.ts'], exclude: ['**/*.d.ts', '**/*.spec.ts'] }
        mechanical:
          requirement: A service app (`apps/<service>/`) imports no file of a sibling service app; services share only the `src` libraries.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/service-isolation]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/services.yaml
          review: Confirm shared code a service needs lives in `src` and that a call to a sibling goes through its API client or its vendored contract, not through a copied file.
        status: implemented
      - id: NEST-SAGA-OBSERVATION
        sourceRuleIds: [BE-SAGA-1, BE-SAGA-2, BE-SAGA-3, BE-SAGA-4]
        rationale: These are tree checks of `hfs check` (BE_SAGA_STEP_COMPENSATION, BE_SAGA_STATE_VERSIONED, BE_SAGA_EVENT_CONTRACT, BE_SAGA_CONSUMER_DEDUPE, BE_SAGA_E2E_MISSING) over a folder tree, event names and e2e spec files, not lint rules; whether a compensation really undoes its step, a step is idempotent and an injected fault is the right one is reviewed against the accepted design.
        guidance: knowledge/patterns/be/saga.yaml
      - id: NEST-SERVICE-STACK-AND-CONTRACT-OBSERVATION
        sourceRuleIds: [BE-SERVICES-2, BE-SERVICES-3, BE-SERVICES-4]
        rationale: These are tree checks of `hfs check` (HFS_IMAGE_UNPINNED, HFS_EVENT_CONTRACT, BE_ASYNC_SPEC_MISSING), not lint rules; whether a spec asserts the right behaviour, whether a version bump is compatible and whether a saga compensates every failure is reviewed against the accepted design.
        guidance: knowledge/patterns/be/services.yaml

      - id: NEST-EVENT-BUS-OUTBOX-AND-CONSUMER
        sourceRuleIds: [BE-EVENT-BUS-3, BE-EVENT-BUS-4, BE-QUEUES-1]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: The outbox is written only by a domain service with the manager of its own transaction, a message consumer is a transport door named after its event that forwards the event id, and a queue producer passes its own tx.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/outbox-write-tx, starci-be/event-consumer-shape, starci-be/queue-producer-shape]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/event-bus.yaml
          review: Confirm each published event crosses a context or starts asynchronous work, and that each consumer's retry budget fits its side effects.
        status: implemented
      - id: NEST-EVENT-BUS-OBSERVATION
        sourceRuleIds: [BE-EVENT-BUS-1, BE-EVENT-BUS-2, BE-EVENT-BUS-5, BE-QUEUES-2, BE-QUEUES-3, BE-QUEUES-4]
        rationale: These are tree checks of hfs check (BE_EVENT_CLASS_CONTRACT, BE_PATTERN_SPEC_MISSING) and the infra-owner table (kafkajs, bullmq, no cron); whether a fact really crosses a context, whether a payload change is additive and whether a scenario proves the right behaviour is reviewed against the accepted design and a real broker run.
        guidance: knowledge/patterns/be/event-bus.yaml

      - id: NEST-EVENT-BUS-OUTBOX-AND-CONSUMER
        sourceRuleIds: [BE-EVENT-BUS-3, BE-EVENT-BUS-4, BE-QUEUES-1]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: The outbox is written only by a domain service with the manager of its own transaction, a message consumer is a transport door named after its event that forwards the event id, and a queue producer passes its own tx.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/outbox-write-tx, starci-be/event-consumer-shape, starci-be/queue-producer-shape]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/event-bus.yaml
          review: Confirm each published event crosses a context or starts asynchronous work, and that each consumer's retry budget fits its side effects.
        status: implemented
      - id: NEST-EVENT-BUS-OBSERVATION
        sourceRuleIds: [BE-EVENT-BUS-1, BE-EVENT-BUS-2, BE-EVENT-BUS-5, BE-QUEUES-2, BE-QUEUES-3, BE-QUEUES-4]
        rationale: These are tree checks of hfs check (BE_EVENT_CLASS_CONTRACT, BE_PATTERN_SPEC_MISSING) and the infra-owner table (kafkajs, bullmq, no cron); whether a fact really crosses a context, whether a payload change is additive and whether a scenario proves the right behaviour is reviewed against the accepted design and a real broker run.
        guidance: knowledge/patterns/be/event-bus.yaml
      - id: NEST-WEBHOOK-DOOR
        sourceRuleIds: [BE-WEBHOOK-2]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: A provider webhook door is one signed controller that proves the delivery with the WebhookSignatureService as its first statement, injects only that service and domain services, and makes exactly one domain intake call.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/webhook-shape, starci-be/webhook-verify-first]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/webhooks.yaml
          review: Review that the raw body, not a re-serialized one, is verified and that the replay window matches the provider's tolerance.
        status: implemented
      - id: NEST-WEBHOOK-OBSERVATION
        sourceRuleIds: [BE-WEBHOOK-1, BE-WEBHOOK-3, BE-WEBHOOK-4]
        rationale: These are tree checks of hfs check (the slot of the kind, the required files, BE_PATTERN_SPEC_MISSING) and the delivery rule of the inbox; whether each provider event maps to exactly one published event and whether a scenario proves the right behaviour is reviewed against the provider contract and a real run of the fake.
        guidance: knowledge/patterns/be/webhooks.yaml
      - id: NEST-REALTIME-DOOR
        sourceRuleIds: [BE-REALTIME-1, BE-REALTIME-2, BE-REALTIME-3]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: A realtime file is one gateway or subscription door that injects only the RealtimeHub and subscribes the client to a topic built from its principal.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/realtime-shape, starci-be/realtime-read-only, starci-be/realtime-topic-scope]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/realtime.yaml
          review: Confirm the frame type carries only what the principal may see and the reactor and the door share one topic builder.
        status: implemented
      - id: NEST-REALTIME-OBSERVATION
        sourceRuleIds: [BE-REALTIME-4]
        rationale: The three realtime scenarios are a tree check of hfs check (BE_PATTERN_SPEC_MISSING); whether a real client proves delivery, isolation and cleanup is reviewed against a real run.
        guidance: knowledge/patterns/be/realtime.yaml

      - id: NEST-FENCED-JOB-AND-PROJECTION
        sourceRuleIds: [BE-JOBS-1, BE-JOBS-2, BE-JOBS-3, BE-JOBS-4, BE-PROJECTIONS-1, BE-PROJECTIONS-2]
        applicability: { include: ['src/**/*.ts', 'apps/**/*.ts'], exclude: ['**/*.d.ts'] }
        mechanical:
          requirement: The job row is written only by platform/jobs, a guarded write requires the fencing token in its type, an external effect of a step carries the run key, a processor extends the fenced base, and a read-model table is written only by its projection which speaks recompute and get.
          check:
            kind: eslint
            sourceOnly: true
            ruleIds: [starci-be/job-write-owner, starci-be/job-fence-required, starci-be/job-run-key, starci-be/job-shape, starci-be/projection-write-owner, starci-be/projection-shape]
            expected: { severity: error }
        semantic:
          guidance: knowledge/patterns/be/jobs.yaml
          review: Confirm each step is safe to repeat under the same run key, the provider honours it, and each recompute is idempotent.
        status: implemented
      - id: NEST-JOB-PROJECTION-REACTOR-OBSERVATION
        sourceRuleIds: [BE-JOBS-5, BE-PROJECTIONS-3, BE-PROJECTIONS-4, BE-REACTORS-1, BE-REACTORS-2, BE-REACTORS-3, BE-REACTORS-4]
        rationale: The scenarios are checked by hfs check (BE_PATTERN_SPEC_MISSING) and the kind boundary by the architecture machine (BE_KIND_ISOLATION); whether a zombie is really refused, a replay rebuilds the same rows and a reactor copy is complete is reviewed against the test-world runs.
        guidance: knowledge/patterns/be/jobs.yaml

