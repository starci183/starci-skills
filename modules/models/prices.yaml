schema: starci/model-prices@1
purpose: >-
  The per-model price table that turns measured token counts (llm_usage, scripts/lib/llm-usage.mjs) into cost_usd.
  The runtime never guesses a price: a model absent here, or with a null rate, leaves cost_usd NULL. Nothing reads a
  provider price feed; the owner declares the rates below from the provider's own price page and dates the edit.
currency: USD
unit: per-million-tokens
asOf: '2026-09-29'
source: >-
  Official list prices read 2026-09-29 (WebFetch): claude-* from https://claude.com/pricing (5-minute cache write TTL);
  gpt-6-* from https://developers.openai.com/api/docs/pricing, Standard processing tier, short context (long context is
  double, batch/flex half, fast mode double: not applied - the CLI reports no tier). swe-2-max (Devin) has
  no official per-token price page read, so its rates stay null and cost_usd stays NULL for it. A subscription seat
  (Claude Max, Codex Pro, Devin plan) bills a flat fee, so cost_usd is the API-equivalent list price.
matching: >-
  scripts/lib/llm-usage.mjs priceOf(model): the exact id first, then the longest entry that is a prefix of the id
  (a dated snapshot id `claude-opus-5-5-20260901` prices as `claude-opus-5-5`). The four rates are USD per 1M tokens:
  input = fresh (non-cached) input, cacheRead = cached input read, cacheWrite = cache creation, output = generated
  tokens including reasoning. A model whose used rate is null gets cost_usd NULL (a partial sum is never written).
models:
  claude-opus-5-5:   {provider: claude, input: 4,    output: 20,  cacheRead: 0.2,  cacheWrite: 5,     source: official}
  claude-sonnet-5-5: {provider: claude, input: 2,    output: 10,  cacheRead: 0.2,  cacheWrite: 2.5,   source: official}
  gpt-6-sol:         {provider: codex,  input: 2,    output: 10,  cacheRead: 0.2,  cacheWrite: 2.5,   source: official}
  gpt-6-luna:        {provider: codex,  input: 0.1,  output: 0.5, cacheRead: 0.01, cacheWrite: 0.125, source: official}
  swe-2-max:         {provider: devin,  input: null, output: null, cacheRead: null, cacheWrite: null, source: unset}
