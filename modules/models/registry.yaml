schema: starci/profile-registry@1
runtimes:
  - codex
  - claude
  - qwen
  - devin
aliases:
  openai: codex
  anthropic: claude
  qwencloud: qwen
  alibaba: qwen
  deepseek: qwen
  cognition: devin
executionModel:
  # Two agent levels, one host. A chat submits the goal and then monitors; it is
  # never an agent layer above the kernel.
  levels: [workflow-kernel, operation-agent]
  host: orca
  chat: trigger-and-monitor-only
  workflowKernel: one-long-lived-agent-per-workflow
  kernelAuthority: sole-workflow-state-writer-through-scripts/kernel/api.mjs
  operationAgent: one-ephemeral-agent-per-job
  operationMapping: one-operation-instance-one-agent
  isolationBoundary: operation
  worktree: isolated-child-per-job
  scheduling: dependency-dag
  fanOutWithinOperation: forbidden
  concreteAgentBinding: provider-profile-model
  # Concurrency is one number per pool and it lives in one file.
  concurrency: modules/models/runtimes.yaml runtimes.<pool>.maxParallel
orchestration:
  runtime: orca
  owner: source-host
  defaultOperationTarget: qwen-agent
  workspaceRouting: .workspaces/projects/<project>/work.json
  # Owner ruling: the only owner gates are the entry skills' exact-`ok`
  # (define-goal, start-kernel) plus settle-time evidence verdicts — there is no
  # separate approvals engine or policy file.
  approvalMode: entry-skill-owner-ok
  dispatch: An entry skill claims a queued goal and spawns that workflow's one long-lived kernel agent
    (scripts/kernel/start-workflow.mjs). The kernel is the sole workflow-state writer; `api dispatch --spawn`
    launches one isolated agent per ready operation in its own worktree, using the first eligible target in
    that operation's chain. The kernel never implements, repairs or tests on behalf of an operation agent.
defaults:
  codex:
    working: gpt-6-luna
    reasoning: gpt-6-sol
  claude:
    working: opus
    reasoning: opus-reviewer
  qwen:
    working: qwen3.8-flash-worker
    reasoning: qwen3.8-flash-reviewer
  devin:
    working: devin-worker
    reasoning: devin-reviewer
targets:
  # Pool targets are named by the provider-window pool of modules/models/runtimes.yaml; `requestedModel` stays the
  # implement-role model of the pool's models map for compatibility with consumers that read one model.
  codex-agent:
    runtime: codex
    requestedModel: gpt-6-luna
    profiles:
      working: gpt-6-luna
      reasoning: gpt-6-sol
    orcaLaunch:
      kind: command-terminal
      adapter: codex
      dispatch: return-preamble-and-send
      composition: card-terminal-fallback   # modules/models/agents/codex.yaml terminalFallback command + routed model/effort + bypassArgs
  # Launch-only targets: an explicit `--model gpt-6-sol` or `--model gpt-6-luna` request reaches that one model
  # on the Codex provider window. They are off every automatic chain; allocation routes the codex-agent pool.
  gpt-6-sol:
    runtime: codex
    requestedModel: gpt-6-sol
    profiles:
      working: gpt-6-sol
      reasoning: gpt-6-sol
    orcaLaunch:
      kind: command-terminal
      adapter: codex
      dispatch: return-preamble-and-send
      composition: card-terminal-fallback   # modules/models/agents/codex.yaml terminalFallback command + routed model/effort + bypassArgs
  gpt-6-luna:
    runtime: codex
    requestedModel: gpt-6-luna
    profiles:
      working: gpt-6-luna
      reasoning: gpt-6-luna
    orcaLaunch:
      kind: command-terminal
      adapter: codex
      dispatch: return-preamble-and-send
      composition: card-terminal-fallback   # modules/models/agents/codex.yaml terminalFallback command + routed model/effort + bypassArgs
  claude-agent:
    runtime: claude
    requestedModel: claude-opus-5-5
    profiles:
      working: opus
      reasoning: opus-reviewer
    orcaLaunch:
      kind: managed-agent
      agent: claude
  qwen-agent:
    runtime: qwen
    requestedModel: qwen3.8-flash
    profiles:
      working: qwen3.8-flash-worker
      reasoning: qwen3.8-flash-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-flash --yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      reasoningCommand: qwen --model qwen3.8-flash --yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
      adapter: qwen
      nestedAgents: forbidden
  qwen3.8-max:
    runtime: qwen
    requestedModel: qwen3.8-max
    profiles:
      working: qwen3.8-max-worker
      reasoning: qwen3.8-max-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
      adapter: qwen
      nestedAgents: forbidden
  deepseek-v4-pro:
    runtime: qwen
    requestedModel: deepseek-v4-pro
    profiles:
      working: deepseek-v4-pro-worker
      reasoning: deepseek-v4-pro-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model deepseek-v4-pro --yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
      adapter: qwen
      nestedAgents: forbidden
  devin-agent:
    runtime: devin
    requestedModel: swe-2-max
    executionHosts: [orca]
    profiles:
      working: devin-worker
      reasoning: devin-reviewer
    orcaLaunch:
      kind: command-terminal
      command: devin --model swe-2-max --permission-mode dangerous --respect-workspace-trust false
      reasoningCommand: devin --model swe-2-max --permission-mode dangerous --respect-workspace-trust false
      dispatch: return-preamble-and-send
      adapter: devin
      nestedAgents: forbidden
      capacityGate: explicit-workflow-quota
targetAliases:
  qwen-qwen3.8-flash-worker: qwen-agent
  qwen-qwen3.8-flash-reviewer: qwen-agent
  codex-gpt-6-sol: codex-agent
  codex-gpt-6-luna: codex-agent
  qwen-qwen3.8-max-worker: qwen3.8-max
  qwen-qwen3.8-max-reviewer: qwen3.8-max
  qwen-deepseek-v4-pro-worker: deepseek-v4-pro
  qwen-deepseek-v4-pro-reviewer: deepseek-v4-pro
  devin-devin-worker: devin-agent
  devin-devin-reviewer: devin-agent
  # Bare model ids that are not targets resolve to the provider-window pool that carries them, so workflow
  # quota entries land on the right window. gpt-6-sol and gpt-6-luna are targets; their `runtime: codex`
  # names the window.
  claude-opus: claude-agent
  claude-opus-5-5: claude-agent
  qwen3.8-flash: qwen-agent
skills:
  starci:
    chains:
      working:
        - qwen-agent
        - devin-agent
        - codex-agent
        - claude-agent
      reasoning:
        - claude-agent
        - codex-agent
# An operator whose kind runtimes.yaml roleOfKind marks think work carries the think order of
# runtimes.yaml allocation.preference.think and nothing else; scripts/route/route-model.mjs refuses any
# other pool for it.
operators:
  architecture.decide:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  backend.implement:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  brand.decide:
    skill: starci
    # A decide operation that also produces bytes: when the product has no mascot, the Codex runtime, the only
    # one carrying the image model ($imagegen), generates one placeholder; Claude decides the identity and
    # defers that artwork with a brief.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  decision.prepare:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  docs.author:
    skill: starci
    # Authoring reference docs is write-role work over the record tree: the full writing chain.
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  provision.ask:
    skill: starci
    # Asking for a provision is naming it exactly and waiting; the same reasoning runtimes, the same order,
    # the same downgrade.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  business.decide:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  content.generate:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  code.refactor:
    skill: starci
    # Restructuring code under a behaviour invariant is implementation work: the full coding chain.
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  e2e.verify:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  integration.verify:
    skill: starci
    # A live call to a real provider is the same kind of work as the API proof: run code, read the response
    # back, keep the output. Its hard floor starts the chain at Devin.
    chain: [devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  grammar.update:
    skill: starci
    # Growing the installed grammar is code, stories, tests, a published version and a canon entry: hands-on
    # work at a hard floor, so the chain starts at Devin.
    chain: [devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  goal.revise:
    skill: starci
    # Revising a live goal is a decision about the work, not work on it: the reasoning chain.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  interface.asset:
    skill: starci
    # Generating the artwork a candidate embeds needs the same image model the drawing used, so the chain is
    # the same single Codex link: a runtime that cannot render an image cannot carry this operation at all.
    chain: [codex-agent]
    environments:
      - {environment: codex, profiles: [codex-agent]}
  interface.draw:
    skill: starci
    # Drawing invokes built-in ImageGen, so it uses the one operation runtime whose host tool contract exposes
    # that invocation. The tool does not expose model selection; this chain is agent routing, not an image-model claim.
    chain: [codex-agent]
    environments:
      - {environment: codex, profiles: [codex-agent]}
  interface.implement:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  interface.audit:
    skill: starci
    # Visual/Grammar conformance is an independent verdict about quality: think work. Its browser-dom host
    # tool (route.riskHints) admits only a pool whose agent card lists it (capabilities.hostTools).
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  knowledge.repair:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  perf.verify:
    skill: starci
    # Measuring a performance budget runs the product and reads numbers back: the hands-on verify chain.
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  release.deliver:
    skill: starci
    chain: [devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  request.analyze:
    skill: starci
    # Turning a raw request into a scoped, checkable goal is planning work: the reasoning chain, the cheap pool never.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  review.verify:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  handover.review:
    skill: starci
    # Writing the owner's handover is judging what was delivered and what was not proven: think work, the
    # same reasoning runtimes in the same order.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  runtime.operate:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  scope.finish:
    skill: starci
    chain: [devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  scope.define:
    skill: starci
    # Cutting a goal into bounded nodes is a decision about the work: the reasoning chain.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  security.verify:
    skill: starci
    # Auditing code against the security baseline is a verdict about quality: think work.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  task.execute:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  test.author:
    skill: starci
    # Authoring the regression check a behaviour-invariant change is measured against is implementation work:
    # the full coding chain.
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  uat.verify:
    skill: starci
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  uat.assisted.prepare:
    skill: starci
    # Preparation authors deterministic scripts/evidence but performs no product journey.
    chain: [qwen-agent, devin-agent, codex-agent, claude-agent]
    environments:
      - {environment: qwen, profiles: [qwen-agent]}
      - {environment: devin, profiles: [devin-agent]}
      - {environment: codex, profiles: [codex-agent]}
      - {environment: claude, profiles: [claude-agent]}
  uat.assisted.verify:
    skill: starci
    # Receipt acceptance is an elevated verdict over evidence: think work.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  work.author:
    skill: starci
    # Authoring the Work records - a node's scope and checks, a whole feature's drafts - is the work that every
    # later operation is measured against: think work.
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
  workspace.manage:
    skill: starci
    chain: [claude-agent, codex-agent]
    environments:
      - {environment: claude, profiles: [claude-agent]}
      - {environment: codex, profiles: [codex-agent]}
fallback:
  allowedReasons:
    - unavailable
    - quota-exhausted
    - rate-limited
    - startup-failure
    - unsupported
  requiredEffectState: none
  blockedReasons:
    - permission-denied
    - user-checkpoint
    - business-ambiguity
    - safety-block
    - partial-or-unknown-effects
selection: |-
  Orca supplies the observed external-agent inventory. Resolve the selected skill and
  operator chain from top to bottom, choosing the first ready runtime/profile. Fall through only
  after an allowed failure with verified no-effect state. This policy never installs an agent,
  authenticates a provider, grants tools or expands the workflow authority. The Claude and Codex pools use
  managed-agent launch (worker-start). The Qwen pool uses the command-terminal launch declared on
  its target: the canonical launcher creates one terminal per attempt running the declared `qwen`
  command, waits for the rendered input prompt, obtains the Task preamble with `dispatch
  --return-preamble`, submits it with `terminal send` and verifies the submission, then attests the
  Dispatch assignee and the rendered model; Orca 1.4.188's native qwen-code adapter cannot deliver a
  prompt to Qwen Code 0.23.3. Qwen 3.8 Max and DeepSeek command terminals stay out of automatic
  chains; every command excludes the Qwen `agent` tool.
costPolicy: |-
  Runtime pools are provider quota windows: the Codex pool carries gpt-6-luna for easy and medium work and
  gpt-6-sol for hard and insane work, the Claude pool carries claude-opus-5-5 for every role, the Qwen pool
  carries qwen3.8-flash, and Devin stays closed until an owner grants slots. modules/models/runtimes.yaml
  roleOfKind splits the kinds: think work (canonical records and quality verdicts) runs the Claude pool, then
  the Codex pool on Sol; hands-on work runs the Qwen and Devin pools first and the Codex and Claude pools as
  overflow. brand.decide is think work that also generates a placeholder mascot when the product has none;
  the Claude pool decides the identity and defers that artwork with a concrete brief, and the Codex pool, the
  only one with an image generator, generates it when it takes the launch.
  interface.draw invokes built-in ImageGen for a small representative set and therefore carries the single
  Codex route whose host contract exposes that tool. This route names the operation agent, not an
  image-model version: tool model selection is not exposed. interface.asset re-renders the artwork that drawing
  approved and therefore carries the same single image-capable route, with no deferral fallback - a deferred
  slot is exactly what this operation exists to close. grammar.update is the opposite case: it grows the
  installed grammar as code - a typed unit with its stories, its tests, its published version and its canon
  entry - so it carries the execution `implement` role at a hard floor; nothing in it is drawn, and a publish
  is irreversible, so the chain is limited to declared coding runtimes. knowledge.repair rewrites a canonical
  rule of this runtime and is think work. Every automatic chain contains only managed-agent or return-preamble
  command-terminal candidates and
  advances only after a verified no-effect failure. DeepSeek V4 Pro and Qwen 3.8 Max remain installed
  explicit or user-approved exception targets but are excluded from automatic chains; Orca
  worker-start cannot carry a Qwen model override, so a Qwen candidate always inherits the verified
  runtime configuration. Command-terminal agents disable nested agents and have explicit turn,
  wall-time and tool-call ceilings; a ceiling stop is a failed attempt and never proof of completion.
  Never infer price or quality superiority from a subscription label; benchmark bounded
  representative operations before proposing another routing change. A native worker is released
  after its exact worker_done result is accepted; the workflow child remains until integration is
  complete. The chain does not decide who runs an operation - `modules/models/runtimes.yaml`
  does, by role preference - so every operator's `environments` must declare every runtime that carries
  that operation's role and owns a profile for it, and the chain lists exactly those targets so
  `candidateFor` can answer with a launch shape for whichever runtime the allocator picked. A pool
  whose roles do not cover an operation's role (Qwen and Devin carry no `decide`, so they cannot take an
  `architecture.decide`) stays out of that operator and is excluded from allocation by the roles gate
  (scripts/agent/models.mjs poolRejectionReasons).
assetFallback: When image generation is unavailable, reuse verified assets first; Claude may leave
  decorative image slots blank with a concrete deferred brief. Never mark missing artwork generated
  or satisfy a functional criterion with a blank slot.
examples:
  codexFrontend:
    runtime: codex
    profile: gpt-6-sol
    model: gpt-6-sol
    imageGenerationAvailable: true
  claudeFrontend:
    runtime: claude
    profile: opus
    model: claude-opus-5-5
    imageGenerationAvailable: false
  orcaInterfaceImplementation:
    skill: starci
    op: interface.implement
    availableRuntimes:
      - codex
      - claude
      - qwen
examplesNote: Examples of frontend context.execution only. Set availability from observed host
  tools, never copy true as proof. Declared exact models still require effective runtime attestation.
  Orca resolves ordered skill/operator candidates from observed readiness instead.
