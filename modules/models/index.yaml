# index.yaml — modules/models coverage manifest.
# Business frame: one page answering "what model targets exist, which file
# describes each, and which the fleet actually routes automatically."
# Coverage contract for the coherence sweep: every key of
# modules/models/runtimes.yaml runtimes AND every key of
# modules/models/registry.yaml targets has a profile here.
#
# Canonical model data:
#   capabilities.yaml  — starci/model-capability-policy@1 (contract)
#   qualifications.yaml — empty measured-qualification store seed
#   runtimes.yaml      — agent quota-window runtime pools + allocation + roleOfKind
#   registry.yaml      — starci/profile-registry@1 (aliases, targets, operators, supervisors)
#   kinds.yaml         — starci/kinds@1 operation catalog (kernel-agent legality graph, modules/goal/legality.yaml)
#   records.yaml       — starci/records@1 record catalog (contract data, read directly)
#   agents/            — starci/agent-card@1 agent cards
#   profiles/          — per-runtime launch facts
#   code-patterns.yaml — starci/code-pattern-profile@1 (scripts/checks/check-scoped-lint.mjs)

schema: starci/module-models-index@1

# Canonical naming. Keep these roles distinct in contracts and receipts:
# - launcher: the human chat surface that invokes entry skills
#   (codex-chat | claude-chat | devin-chat)
# - host: Orca, which owns terminals, worktrees and managed operation workers
# - agent: the execution adapter / Orca agent id (codex | claude | devin | qwen)
# - provider: the credential/billing/quota family used by allocation
# - model: a concrete model id such as gpt-6-sol
# - profile: a StarCi routing/capability target such as codex-agent
# - runtimePool: one quota/capacity window from runtimes.yaml
# An agent and provider may currently carry the same string, but the fields are
# not interchangeable: `agent` names the execution adapter while model-routing
# `provider` remains quota authority.
glossary:
  launcher: human chat surface invoking entry skills
  host: Orca execution environment
  agent: execution adapter or Orca agent id
  provider: credential billing and quota family
  model: concrete model id
  profile: StarCi routing and capability target
  runtimePool: quota and capacity window

pools:
  # runtimes.yaml runtimes.* — quota/capacity pools the allocator serves;
  # `provider` names quota authority, distinct from the execution adapter even
  # where both ids currently match.
  - {target: claude-agent,  profile: profiles/claude-agent.yaml,  provider: claude, roles: [implement, verify, write, decide, plan], automaticChains: true}
  - {target: codex-agent,   profile: profiles/codex-agent.yaml,   provider: codex,  roles: [implement, verify, write, decide, plan], automaticChains: true, note: "sole image-generation route"}
  - {target: qwen-agent,    profile: profiles/qwen-agent.yaml,    provider: qwen,   roles: [implement, verify, write, decide, plan], automaticChains: true, note: "the base pool: orchestration default operation target, every kind and difficulty"}
  - {target: devin-agent,   profile: profiles/devin-agent.yaml,   provider: devin,  roles: [implement, verify, write],                automaticChains: true, note: "Orca-only; capacityAuthority explicit-workflow-quota — slots come from the owner, see runtimes.yaml"}

exceptionTargets:
  # registry.yaml targets not present in runtimes.yaml — installed but off all
  # automatic chains; explicit benchmark/user-approved selection only
  - {target: gpt-6-sol,       profile: profiles/gpt-6-sol.yaml,       provider: codex, automaticChains: false, note: "explicit GPT-6 Sol route on the codex-agent window"}
  - {target: gpt-6-luna,      profile: profiles/gpt-6-luna.yaml,      provider: codex, automaticChains: false, note: "explicit GPT-6 Luna route on the codex-agent window"}
  - {target: qwen3.8-max,     profile: profiles/qwen3.8-max.yaml,     provider: qwen,  automaticChains: false, note: "benchmark/user-approved exception only"}
  - {target: deepseek-v4-pro, profile: profiles/deepseek-v4-pro.yaml, provider: qwen,  automaticChains: false, note: "benchmark/user-approved exception only"}

notTargets:
  # things an agent might mistake for operation targets — they are not
  - {name: "nonOperation model functions (assessGoal, planOp, decide, validateOp, critiqueGoal, ...)", source: "modules/models/selection.yaml closedSets.kernelFunctionKinds", note: "separately typed config.yaml models.pools; never consume operation probation budget"}

selection: selection.yaml   # the eligibility/probation/ordering rules —
                          # start here for "may this model take this job"
