# index.yaml — modules/models coverage manifest.
# Business frame: one page answering "what model targets exist, which file
# describes each, and which the fleet actually routes automatically."
# Coverage contract for the coherence sweep: every key of
# .dist/model/runtimes.json runtimes AND every key of
# .dist/model/registry.json targets has a profile here.

schema: starci/module-models-index@1

pools:
  # runtimes.json runtimes.* — provider-window pools the allocator serves
  - {target: claude-agent,  profile: profiles/claude-agent.yaml,  provider: claude, roles: [implement, verify, write, decide, plan], automaticChains: true}
  - {target: claude-fable,  profile: profiles/claude-fable.yaml,  provider: claude, roles: [verify, decide, plan, write],             automaticChains: true, budgetWindow: fableWeekly}
  - {target: codex-agent,   profile: profiles/codex-agent.yaml,   provider: codex,  roles: [implement, verify, write, decide, plan], automaticChains: true, note: "sole image-generation route"}
  - {target: qwen-agent,    profile: profiles/qwen-agent.yaml,    provider: qwen,   roles: [implement, verify, write],                automaticChains: true, note: "orchestration default operation target"}
  - {target: devin-agent,   profile: profiles/devin-agent.yaml,   provider: devin,  roles: [implement, verify, write],                automaticChains: true, note: "closed at rest — maxParallel 0 until explicit workflow quota; Orca-only"}

exceptionTargets:
  # registry.json targets not present in runtimes.json — installed but off all
  # automatic chains; explicit benchmark/user-approved selection only
  - {target: gpt-5.6-luna,    profile: profiles/gpt-5.6-luna.yaml,    provider: codex, automaticChains: false, note: "bounded-allocation Codex route; easy/medium only; bare name also aliases to codex-agent"}
  - {target: qwen3.8-max,     profile: profiles/qwen3.8-max.yaml,     provider: qwen,  automaticChains: false, note: "benchmark/user-approved exception only"}
  - {target: deepseek-v4-pro, profile: profiles/deepseek-v4-pro.yaml, provider: qwen,  automaticChains: false, note: "benchmark/user-approved exception only"}

notTargets:
  # things an agent might mistake for operation targets — they are not
  - {name: "supervisor chains (planCoordinator, workflowMonitor)", source: registry.json supervisors, note: "persistent coordinator seats, not operation pools"}
  - {name: "nonOperation model functions (assessGoal, planOp, decide, validateOp, critiqueGoal, ...)", source: "model-functions.md + model-policy.mjs MODEL_KINDS", note: "separately typed Fable/Astra + Opus/Sol pools; never consume operation probation budget"}
  - {name: "HEADLESS_PROVIDERS entries", source: model-functions.md, note: "headless command identities for model functions; a missing entry is a failed launch, never a substitute model"}

selection: selection.yaml   # the eligibility/probation/ordering rules —
                          # start here for "may this model take this job"
