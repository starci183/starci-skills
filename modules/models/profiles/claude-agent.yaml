# Profile: claude-agent — the Anthropic managed-agent pool.
# Business frame: the thinking seat. First choice for every think kind and for
# the [Kernel]; overflow for hands-on work.
# Every claim below traces to a cited source; inferred analysis is marked.

target: claude-agent            # registry.yaml: targets.claude-agent
provider: claude                # runtimes.yaml: runtimes.claude-agent.provider
runtime: claude                 # registry.yaml: targets.claude-agent.runtime
schema: starci/module-model-profile@1  # module-local document kind; no upstream schema

identity:
  requestedModel: claude-opus-5-5   # registry.yaml targets.claude-agent.requestedModel; runtimes.yaml pins it at every difficulty
  profiles:                     # registry.yaml targets.claude-agent.profiles
    working: opus
    reasoning: opus-reviewer
  note: >-
    Claude Opus 5.5 (`claude-opus-5-5`): 1M-token context, 128K output tokens,
    adaptive thinking always on. The API's default effort is `medium`; StarCi
    passes the effort its own routing decides (config.yaml `effort`/`kernel.effort`,
    agents/claude.yaml effortArgs), so the API default applies only when no effort
    is sent. The stable `claude-opus` alias names this exact model; an
    unversioned host default is not proof of it — the dispatch's model
    attestation is (modules/models/registry.yaml examplesNote, selection.yaml
    pool-name-as-model).

capacity:
  maxParallel: 6                # cached from runtimes.yaml; route-model.mjs reports drift
  roles: [implement, verify, write, decide, plan]   # runtimes.yaml — all five

launch:
  orca: {kind: managed-agent, agent: claude}   # registry.yaml orcaLaunch — worker-start path

position: modules/models/runtimes.yaml allocation.tiers and roleOfKind; modules/models/registry.yaml operators.<op>.chain

business:
  question: >-
    "Which pool thinks?" — claude-agent leads every think kind and the kernel seat.
  whenNeeded:
    - Strategy (runtimes.yaml roleOfKind work think on the think/decide/plan orders) — decide, plan, scope, brand and the cut lead here at every tier.
    - Review overflow only - the review order (every verify kind, work.author) takes it when Devin and Qwen are both unavailable or the cross-family rule excludes the one left (owner decision 2026-09-25 review-hands; runtimes.yaml allocation.overflowByOrder).
    - The [Kernel] seat — config.example.yaml pins `kernel.model: claude-opus-5-5`.
    - Hands-on overflow when the Devin, Qwen and Codex pools cannot take the work (prefer-then-overflow, runtimes.yaml allocation.policy).
  whenNot:
    - "Host-tool routes: the agent card lists no host tool, so interface.draw/interface.asset (image_gen.imagegen) and interface.audit (browser-dom) pass it for codex-agent (route.riskHints host-tool-required, modules/models/agents/claude.yaml capabilities.hostTools)."
    - "Hands-on work as first pick: every hands-on order puts it last, keeping Opus for thinking."
  pickedBy: >-
    The kernel allocator via role preference + tier + qualification (selection.yaml);
    humans only via the declared chains in registry.yaml operators.
  failureModes:
    - "Treating the alias `claude-opus` as proof of model: attestation must show claude-opus-5-5 (modules/models/registry.yaml)."
    - Burning the strongest pool on easy fan-out — an availability/cost mistake, not an eligibility error.
