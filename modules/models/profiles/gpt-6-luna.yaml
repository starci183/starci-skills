# Profile: gpt-6-luna — a named Codex operation target (not a pool).
# Business frame: GPT-6 Luna is the Codex window's easy and medium model. The
# codex-agent pool launches it for every easy or medium operation; this target
# is the explicit route an owner names with `--model gpt-6-luna`.
# Registry facts (provider, runtime, launch agent, the launch model itself) live
# in modules/models/registry.yaml — targets.gpt-6-luna.defaultModel.

target: gpt-6-luna            # registry.yaml targets — a TARGET, distinct from the codex-agent pool entry
schema: starci/module-model-profile@1

identity:
  sharedQuota: >-
    Luna consumes the same observed Codex provider capacity as Sol — naming
    this target adds no headroom to the codex-agent window.

business:
  question: >-
    "Which Codex model carries bounded easy and medium work?" — Luna.
  whenNeeded:
    - Easy and medium operations routed to codex-agent — registry.yaml pins Luna there.
    - An owner-named explicit route to Luna for bounded implement/verify/write work.
  whenNot:
    - Hard or insane work — the pool pins Sol there; Luna's reasoning levels stop at `max` (no `ultra`).
    - ImageGen and draw routes — interface.asset and the interface.draw fallback run on the codex-agent pool at hard (Sol), never on this target.
    - "Never as a way to buy qualification: naming a target changes capacity, never qualification or effect authority (registry.yaml pools.codex-agent)."
  pickedBy: >-
    The allocator through the codex-agent pool's difficulty pin, or an owner who
    names this target explicitly.
  failureModes:
    - Assuming this target is a second Codex window — provider-level quota failure parks the pool and this target together.
