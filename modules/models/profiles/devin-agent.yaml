# Profile: devin-agent — the Cognition Devin command-terminal pool.
# Business frame: the owner-gated executor. Owner-assigned capacity: 10 parallel
# lanes under explicit-workflow-quota authority.

target: devin-agent           # registry.yaml + runtimes.yaml
provider: devin               # runtimes.yaml — provider cognition-devin (registry.yaml targets)
runtime: devin                # registry.yaml
schema: starci/module-model-profile@1

identity:
  requestedModel: swe-2-max   # registry.yaml
  profiles:
    working: devin-worker     # registry.yaml targets — one bounded task in the workflow worktree via Devin CLI
    reasoning: devin-reviewer # registry.yaml targets — verify one bounded change, never expand scope
  logicalIdentity: >-
    modules/models/registry.yaml: the logical model identity is `devin-agent`; the local
    CLI may use an account-selected underlying model and StarCi does not rename or
    infer it. modelPolicy: "pin-swe-2-max-and-attest-the-devin-cli-runtime-before-dispatch".

capacity:
  maxParallel: 10             # cached from runtimes.yaml — owner-assigned capacity
  capacityAuthority: explicit-workflow-quota   # only a granted workflow quota opens slots; config.yaml allocation.grants is the owner's default grant for every workflow
  quotaTelemetry: launch-status                # quota is observed through launch status
  roles: [implement, verify, write]            # NO decide, NO plan

launch:
  orca:
    kind: command-terminal
    command: "devin --model swe-2-max --permission-mode dangerous --respect-workspace-trust false"
    reasoningCommand: same command shape
    dispatch: return-preamble-and-send
    adapter: devin
    nestedAgents: forbidden   # forbids Devin subagents / cloud handoff (modules/models/registry.yaml)
    capacityGate: explicit-workflow-quota
  adapterPreflight: >-
    modules/models/registry.yaml: the adapter runs read-only `devin models list --format json`
    BEFORE the interactive CLI, because `auth status` exits zero even while logged
    out. dangerous is the unattended operation mode: authority remains bounded
    by the approved operation contract, owned-path leases and Kernel settlement;
    the workspace-trust dialog is disabled because Orca already selected the
    workflow worktree.

position: modules/models/runtimes.yaml allocation.tiers and roleOfKind; modules/models/registry.yaml operators.<op>.chain

business:
  question: >-
    "Which pool do I open when the owner explicitly grants Devin CLI capacity to
    a workflow?" — devin-agent, and only then.
  whenNeeded:
    - Bounded implement/verify/write inside an Orca workflow worktree after explicit slot grant.
    - Medium and hard hands-on work, first in those tier orders beside qwen-agent and codex-agent (balanced allocation spreads by share); slots are owner-granted, so quota grants, not position, decide availability.
  whenNot:
    - Anywhere outside Orca — the pool launches only as an Orca command-terminal inside the workflow worktree.
    - decide/plan/manager/planner/validator/ImageGen roles — none exist (modules/models/registry.yaml lists these exclusions verbatim).
    - Beyond its owner-assigned cap: absence of granted quota, not the pool itself, is the gate.
  pickedBy: >-
    Allocator by role + tier + quota; the explicit-workflow-quota gate sits before
    eligibility — capacity is an owner decision, not a scheduler guess.
  failureModes:
    - "Reading an early chain position as unbounded capacity: the quota gate still bounds admission."
    - Trusting `auth status` for login state — the adapter checks `devin models list` because auth status can pass while logged out.
    - "INFERRED: expecting cloud handoff/subagent behavior — both are forbidden; the op's boundary is the worktree."
