# Profile: qwen-agent — the Qwen Code command-terminal pool, running DeepSeek V4.1 Flash on the owner's
# QwenCloud Token Plan (owner 2026-09-24; it replaced qwen3.8-flash).
# Business frame: the cheap hands-on pool. Owner decision 2026-09-25 (amending the 2026-09-24 base-pool ruling,
# from the 72h scripts/agent/model-scorecard.mjs evidence): first on scaffold, docs, content, grammar and fan-out
# slices (backend.scaffold 92% pass), second behind Devin on implementation, no think work (no evidence); a 35%
# default share beside Devin. Unmetered, blocked only while its quota circuit is open (agents/qwen.yaml quotaExhausted).

target: qwen-agent            # registry.yaml + runtimes.yaml
provider: qwen                # runtimes.yaml — provider family qwencloud-token-plan (registry.yaml targets)
runtime: qwen                 # registry.yaml targets.qwen-agent.runtime
schema: starci/module-model-profile@1

identity:
  requestedModel: deepseek-v4.1-flash   # registry.yaml
  profiles:
    working: deepseek-v4.1-flash-worker     # registry.yaml targets — bounded implementation/content/repair
    reasoning: deepseek-v4.1-flash-reviewer # registry.yaml targets — bounded hands-on verification (never think work)
  modelPolicy: use-profile-model-and-verify-observed-runtime-before-dispatch  # registry.yaml targets
  # Qwen Code resolves the id through ~/.qwen/settings.json modelProviders.openai (the entry named
  # "deepseek-v4.1-flash (Token Plan Singapore)", base URL token-plan.ap-southeast-1.maas.aliyuncs.com,
  # envKey BAILIAN_TOKEN_PLAN_API_KEY) and renders that name in its footer, which the card attests.

capacity:
  maxParallel: 10             # cached from runtimes.yaml; route-model.mjs reports drift
  roles: [implement, verify, write]   # NO decide, NO plan (owner decision 2026-09-25)

launch:
  orca:                       # registry.yaml orcaLaunch — command-terminal, NOT managed-agent
    kind: command-terminal
    # --yolo, never --approval-mode yolo: Qwen Code 0.24.2 refuses to start when both are given ("Cannot use
    # both --yolo (-y) and --approval-mode together"), and the agent card appends --yolo when it is missing.
    command: "qwen --model deepseek-v4.1-flash --yolo --exclude-tools agent --max-wall-time 90m --max-tool-calls 600 --chat-recording false"
    reasoningCommand: same command shape             # registry.yaml reasoningCommand
    dispatch: return-preamble-and-send               # launcher: dispatch --return-preamble, terminal send, verify submission
    adapter: qwen
    nestedAgents: forbidden                          # every Qwen command excludes the `agent` tool
  whyCommandTerminal: >-
    registry.yaml selection: "Orca 1.4.188's native qwen-code adapter cannot
    deliver a prompt to Qwen Code 0.23.3" — so the canonical launcher creates one
    terminal per attempt, waits for the rendered prompt, sends via terminal, and
    attests assignee + rendered model.
  ceilings: >-
    max-wall-time 90m, max-tool-calls 600 (no --max-session-turns: a turn cap ends a worker mid-job and
    overrides the host setting). A ceiling stop
    is a FAILED attempt, never proof of completion (costPolicy).

position: modules/models/runtimes.yaml allocation.tiers and roleOfKind; modules/models/registry.yaml operators.<op>.chain

business:
  question: >-
    "Which pool takes the cheapest shot at bounded execution so expensive
    pools only see what survives escalation?" — qwen-agent.
  whenNeeded:
    - Scaffold, docs, content and grammar work and every hands-on cut slice first (runtimes.yaml allocation.tiers/preference scaffold, roleOfKind order scaffold); hands-on implementation second behind Devin, first at easy where Devin pins no model.
    - Fan-out slices (runtimes.yaml allocation.fanOut) — cheap parallelism.
    - The default operation target (registry.yaml orchestration.defaultOperationTarget).
  whenNot:
    - While its quota circuit is open (a launch or worker screen showed the Token Plan quota exhausted) - until its 1-token recovery probe passes or the plan resets.
    - Think work — canonical records and quality verdicts run on Opus then Sol only (no Qwen think evidence).
    - Host-tool routes — the qwen agent card lists no host tool (modules/models/agents/qwen.yaml capabilities.hostTools).
    - Any work needing nested/sub agents — the `agent` tool is excluded and nestedAgents is forbidden.
  pickedBy: >-
    Allocator by kind order + tier; chains place it first for scaffold-order kinds, second for implementation, and the
    orchestration profile names it the default operation target.
  failureModes:
    - A ceiling stop (turns/wall/tool-calls) is failure, not completion — do not read a cut-off terminal as a finished op.
    - Command-terminal launch means prompt delivery is verified via terminal send + Dispatch attestation; a silent terminal is a failed attempt, not a slow one (selection text).
    - A Token Plan quota exhausted mid-window answers 429 (Throttling.AllocationQuota / insufficient_quota) for every lane at once — the quota circuit parks the pool until the recovery probe passes (scripts/kernel/api.mjs provider-health --quota-probe).
