# Profile: qwen-agent — the Qwen command-terminal pool.
# Business frame: the cost-first executor. Default operation target of the
# orchestration profile and first seat in nearly every implement/write chain —
# bounded, ceiling-guarded work it can fail cheaply and hand upward.

target: qwen-agent            # registry.json + runtimes.json
provider: qwen                # runtimes.json — provider family qwencloud-token-plan (qwen.json)
runtime: qwen                 # registry.json targets.qwen-agent.runtime
schema: starci/module-model-profile@1

identity:
  requestedModel: qwen3.8-flash   # registry.json
  profiles:
    working: qwen3.8-flash-worker     # qwen.json — fast bounded implementation/content/repair
    reasoning: qwen3.8-flash-reviewer # qwen.json — "lower-cost reasoning fallback when the Max reviewer is unavailable"
  modelPolicy: use-profile-model-and-verify-observed-runtime-before-dispatch  # qwen.json

capacity:
  maxParallel: 4              # runtimes.json
  roles: [implement, verify, write]   # NO decide, NO plan
  models:
    implement: qwen3.8-flash
    verify: qwen3.8-flash
    write: qwen3.8-flash

launch:
  orca:                       # registry.json orcaLaunch — command-terminal, NOT managed-agent
    kind: command-terminal
    command: "qwen --model qwen3.8-flash --approval-mode yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false"
    reasoningCommand: same command shape             # registry.json reasoningCommand
    dispatch: return-preamble-and-send               # launcher: dispatch --return-preamble, terminal send, verify submission
    adapter: qwen
    nestedAgents: forbidden                          # every Qwen command excludes the `agent` tool
  headless: qwen --approval-mode yolo --output-format json   # model-functions.md; answers read through Qwen's event list
  whyCommandTerminal: >-
    registry.json selection: "Orca 1.4.188's native qwen-code adapter cannot
    deliver a prompt to Qwen Code 0.23.3" — so the canonical launcher creates one
    terminal per attempt, waits for the rendered prompt, sends via terminal, and
    attests assignee + rendered model.
  ceilings: >-
    max-session-turns 240, max-wall-time 90m, max-tool-calls 600. A ceiling stop
    is a FAILED attempt, never proof of completion (costPolicy).

position:
  easyTier: first             # runtimes.json allocation.tiers.easy
  mediumTier: third in default
  hardTier: absent — not listed in any hard-tier order
  chainLeads: [backend.implement, interface.implement, docs.author, content.generate, code.refactor, test.author, release.deliver, runtime.operate, scope.retire, task.execute, uat.verify, workspace.manage, review.verify]
  orchestrationDefault: qwen-agent   # registry.json orchestration.defaultOperationTarget

business:
  question: >-
    "Which pool takes the first, cheapest shot at bounded execution so expensive
    pools only see what survives escalation?" — qwen-agent.
  whenNeeded:
    - Routine bounded implement/write/test/content work — the established Qwen→Devin→Claude→Codex cost order spends its capacity first.
    - review.verify — it LEADS the independent-review chain (registry.json), the cost-aware front seat for judging.
    - Easy-tier fan-out (allocation.fanOut seamFirst, maxPerGroup 9) — cheap parallelism.
    - Default operation dispatch in orchestrated mode.
  whenNot:
    - decide/plan work — the pool has no such roles; business/architecture decisions never route here.
    - Hard-tier lists exclude it entirely — high-risk or high-floor workloads get Claude/Devin/Codex orders instead.
    - Image routes — no imageGeneration on any profile.
    - Any work needing nested/sub agents — the `agent` tool is excluded and nestedAgents is forbidden.
  pickedBy: >-
    Allocator by role + tier; chains place it first for execution kinds and the
    orchestration profile names it the default operation target.
  failureModes:
    - A ceiling stop (turns/wall/tool-calls) is failure, not completion — do not read a cut-off terminal as a finished op.
    - Command-terminal launch means prompt delivery is verified via terminal send + Dispatch attestation; a silent terminal is a failed attempt, not a slow one (selection text).
    - "INFERRED: sending it hard-tier work anyway (it is absent from hard lists) means paying retries for capability the tiering already priced out."
