# Profile: codex-agent — the OpenAI Codex pool (unattended command terminals).
# Business frame: the generalist workhorse with the widest role coverage, the
# Sol fallback for think work when Claude is unavailable, AND the fleet's only
# image generator. Owns the entire interface.draw/interface.asset route.

target: codex-agent           # registry.yaml + runtimes.yaml
provider: codex               # runtimes.yaml
runtime: codex                # registry.yaml targets.codex-agent.runtime
schema: starci/module-model-profile@1

identity:
  requestedModel: gpt-6-luna  # registry.yaml targets.codex-agent.requestedModel; the launch pin per difficulty is runtimes.yaml runtimes.codex-agent.models
  profiles:
    working: gpt-6-luna       # registry.yaml targets — bounded implementation inside frozen goal/write boundaries
    reasoning: gpt-6-sol      # registry.yaml targets — plan strategy, analyze complex evidence, decide

capacity:
  maxParallel: 10             # cached from runtimes.yaml; the largest pool
  roles: [implement, verify, write, decide, plan]   # all five
  sharedQuota: >-
    Sol and Luna consume the SAME observed Codex provider capacity — the
    launch-only gpt-6-sol/gpt-6-luna targets do not multiply provider headroom
    (modules/models/registry.yaml). One quota cooldown on the provider parks both.

launch:
  orca:
    kind: command-terminal
    adapter: codex
    dispatch: return-preamble-and-send
    composition: card-terminal-fallback   # no static command: modules/models/agents/codex.yaml terminalFallback command + modelArgs/effortArgs (routed model + effort) + bypassArgs
    unattended: card-bypassArgs   # --ask-for-approval never --sandbox danger-full-access, exactly as the Kernel terminal boots
  whyCommandTerminal: >-
    Unattended Codex ops launch with the card bypassArgs. Orca's worker-start has no approval or
    sandbox flag, so a managed Codex worker ran on Orca's default approval policy and every tool
    call became an owner "Allow Codex to make changes" notification. A command terminal carries the
    card command (model + effort + bypassArgs) and joins the Run through orchestration dispatch
    --return-preamble, like the Qwen and Devin pools. image_gen and browser use are Codex CLI
    built-ins (codex features: image_generation, browser_use), not Orca features, so the
    command terminal keeps both host tools.
  hostTools: >-
    modules/models/agents/codex.yaml capabilities.hostTools — image_gen.imagegen and browser-dom. It is
    the only image-capable pool: interface.draw and interface.asset route nowhere else, and asset
    generation has NO deferral fallback.

position: modules/models/runtimes.yaml allocation.tiers and roleOfKind; modules/models/registry.yaml operators.<op>.chain

business:
  question: >-
    "Which pool thinks when Claude is out, overflows hands-on work, and can draw?" —
    codex-agent, on gpt-6-sol for every think kind and the sole visual-design route.
  whenNeeded:
    - Think work (runtimes.yaml roleOfKind work think) when claude-agent is unavailable — its hard floor pins gpt-6-sol.
    - interface.draw / interface.asset — the ONLY route; no other pool can produce the representative ImageGen candidates.
    - Hands-on overflow after the Devin and Qwen pools.
  whenNot:
    - As first pick for hands-on work — the declared order spends Qwen/Devin capacity first.
    - For anything where image output is needed but the observed host tools lack it — availability is observed, never assumed (registry.yaml examplesNote).
  pickedBy: >-
    Allocator work/role order + tier lists; the image routes are where it
    structurally dominates.
  failureModes:
    - "Confusing requestedModel (luna) with the hard-tier model (sol): the pool pins per-difficulty models; attestation reads the difficulty's model, not the target's request."
    - Provider-level quota exhaustion disables Luna and Sol at once — the interface.draw route then has no fallback; a failed image op is parked, not rerouted to a non-image pool.
    - "INFERRED: using its 10-slot pool to parallelize easy implementation burns the shared quota the think and image lanes depend on."
