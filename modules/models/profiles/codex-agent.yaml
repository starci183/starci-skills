# Profile: codex-agent — the OpenAI Codex pool (unattended command terminals).
# Business frame: the generalist workhorse with the widest role coverage, the
# Sol fallback for think work when Claude is unavailable, AND the workers' only
# image generator. Owns the interface.asset route and is the interface.draw fallback behind Devin
# (owner ruling 2026-09-27); it is also the draw loop's independent critic (runtimes.yaml drawLoop.critic).
# Registry facts (provider, runtime, model pins, capacity, launch agent) live in
# modules/models/registry.yaml — pools.codex-agent and targets.codex-agent.

target: codex-agent           # registry.yaml: pools.codex-agent + targets.codex-agent
schema: starci/module-model-profile@1

identity:
  sharedQuota: >-
    Sol and Luna consume the SAME observed Codex provider capacity — the
    launch-only gpt-6-sol/gpt-6-luna targets do not multiply provider headroom
    (modules/models/registry.yaml). One quota cooldown on the provider parks both.

launch:
  hostTools: >-
    modules/models/agents/codex.yaml capabilities.hostTools — image_gen.imagegen and browser-dom (Codex CLI
    built-ins, present in a worker-start Codex worker too). It is the only image-capable pool: interface.asset
    routes nowhere else and has NO deferral fallback; interface.draw walks Devin first and this pool second (it
    draws token-render, never ImageGen).

position: modules/models/runtimes.yaml allocation.tiers and roleOfKind; modules/models/registry.yaml operators.<op>.chain

business:
  question: >-
    "Which pool thinks when Claude is out, overflows hands-on work, and can draw?" —
    codex-agent, on gpt-6-sol for every think kind, the sole image route and the draw fallback.
  whenNeeded:
    - Strategy (the think/decide/plan orders) when claude-agent is unavailable — its hard floor pins gpt-6-sol.
    - Review overflow only (owner decision 2026-09-25 review-hands; runtimes.yaml allocation.overflowByOrder) - and interface.audit of what Devin implemented, since Claude lacks its browser-dom tool.
    - "interface.asset — the ONLY route (image_gen.imagegen); interface.draw when the Devin pool cannot draw (owner ruling 2026-09-27: Devin draws, Codex critiques)."
    - Hands-on overflow after the Devin pool.
  whenNot:
    - As first pick for hands-on work — the declared order spends Devin capacity first.
    - For anything where image output is needed but the observed host tools lack it — availability is observed, never assumed (registry.yaml examplesNote).
  pickedBy: >-
    Allocator work/role order + tier lists; the image routes are where it
    structurally dominates.
  failureModes:
    - "Confusing the pool default (Luna) with the hard-tier pin (Sol): the pool pins per-difficulty models; attestation reads the difficulty's model, not the pool's defaultModel (modules/models/registry.yaml pools.codex-agent)."
    - Provider-level quota exhaustion disables Luna and Sol at once — the interface.asset route then has no fallback; a failed image op is parked, not rerouted to a non-image pool.
    - "INFERRED: using its 10-slot pool to parallelize easy implementation burns the shared quota the think and image lanes depend on."
