# Profile: codex-agent — the OpenAI Codex pool (unattended command terminals).
# Business frame: the generalist workhorse with the widest role coverage, the
# Sol fallback for think work when Claude is unavailable, AND the workers' only
# image generator. Owns the interface.asset route and is the interface.draw fallback behind Claude (the draw declares no host tool)
# (owner ruling 2026-09-27); it is also a member of the Critic tier (tiers.yaml seats.critic), the draw loop's independent critic whenever the drawer is another provider.
# Registry facts (provider, runtime, model pins, capacity, launch agent) live in
# modules/models/registry.yaml — pools.codex-agent and targets.codex-agent.

target: codex-agent           # registry.yaml: pools.codex-agent + targets.codex-agent
schema: starci/module-model-profile@1

identity:
  sharedQuota: >-
    Sol and Luna consume the SAME observed Codex provider capacity — the
    launch-only gpt-6.1-sol/gpt-6-luna targets do not multiply provider headroom
    (modules/models/registry.yaml). One quota cooldown on the provider parks both.

launch:
  hostTools: >-
    modules/models/agents/codex.yaml capabilities.hostTools — image_gen.imagegen and browser-dom (Codex CLI
    built-ins, present in a worker-start Codex worker too). It is the only image-capable pool: the headless
    `starci work imagegen` call runs Codex non-interactively on it (tiers.yaml calls.imagegen), whichever agent the drawing op
    runs on; a refused call has NO fallback to another pool.

position: modules/models/tiers.yaml tiers, seats and difficulty; modules/models/runtimes.yaml roleOfKind; modules/models/registry.yaml pools

business:
  question: >-
    "Which pool is the second member of every Claude tier, the image call tier, and the low-tier second?" —
    codex-agent, on gpt-6.1-sol in the frontier, high, medium and imagegen tiers and gpt-6-luna in the low tier.
  whenNeeded:
    - Any tier whose first member is out of tokens or filtered: Sol is the second member of frontier, high and medium.
    - interface.audit of what Devin implemented and any op needing browser-dom, since Claude lacks the tool (the hard filter drops Claude by name).
    - "Every image a drawing op (interface.draw, interface.asset, brand.decide) needs — the ONLY member of the imagegen call tier (tiers.yaml tierUse, calls; the headless starci work imagegen)"
    - Easy hands-on work after Devin, on Luna (the low tier).
  whenNot:
    - As first pick for hands-on work — the medium and low tiers spend Devin capacity first.
    - For anything where image output is needed but the observed host tools lack it — availability is observed, never assumed (registry.yaml examplesNote).
  pickedBy: >-
    The common picker over the tier chains (hard filter, bias, balance, tokens); the image routes are where it
    structurally dominates.
  failureModes:
    - "Confusing the pool default (Luna) with a tier member: the tier names the model and effort per member (modules/models/tiers.yaml); attestation reads the member's model, not the pool's defaultModel (modules/models/registry.yaml pools.codex-agent)."
    - Provider-level quota exhaustion disables Luna and Sol at once — the imagegen call tier has one member, so an image call is then refused (IMAGEGEN_QUOTA) until the reset; it is never rerouted to a non-image pool.
    - "INFERRED: using its 10-slot pool to parallelize easy implementation burns the shared quota the think and image lanes depend on."
