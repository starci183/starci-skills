# Profile: codex-agent — the OpenAI managed-agent pool.
# Business frame: the generalist workhorse with the widest role coverage, the
# first seat for decide/plan reasoning, AND the fleet's only image generator.
# Leads every verify and reasoning chain and owns the entire
# interface.draw/interface.asset route; last on cost for plain implement.

target: codex-agent           # registry.yaml + runtimes.yaml
provider: codex               # runtimes.yaml
runtime: codex                # registry.yaml targets.codex-agent.runtime
schema: starci/module-model-profile@1

identity:
  requestedModel: gpt-6-luna  # registry.yaml targets.codex-agent.requestedModel; the launch pin per difficulty is runtimes.yaml runtimes.codex-agent.models
  profiles:
    working: gpt-6-luna       # registry.yaml targets — bounded implementation inside frozen goal/write boundaries
    reasoning: gpt-6-sol      # registry.yaml targets — plan strategy, analyze complex evidence, decide

capacity:
  maxParallel: 10             # cached from runtimes.yaml; the largest pool
  roles: [implement, verify, write, decide, plan]   # all five
  sharedQuota: >-
    Sol and Luna consume the SAME observed Codex provider capacity — the
    launch-only gpt-6-sol/gpt-6-luna targets do not multiply provider headroom
    (modules/models/registry.yaml). One quota cooldown on the provider parks both.

launch:
  orca: {kind: managed-agent, agent: codex}
  imageGeneration: >-
    The pool provides imagegen (runtimes.yaml provides, kindRequires) — the ONLY
    image-capable pool in the fleet. interface.draw and interface.asset carry
    single-target chains that are exactly this route; asset generation has NO
    deferral fallback. profiles/gpt-6-sol.yaml carries the model-level flag.

position:
  # Sources: modules/models/runtimes.yaml allocation.tiers, registry.yaml operators.<op>.chain.
  hardTier: first in decide/plan; second in verify; third in default/implement/write
  insaneTier: first in decide/plan; second in default/implement/write/verify
  mediumTier: first in default and in decide/plan
  easyTier: third
  chainLeads: [architecture.decide, brand.decide, business.decide, decision.prepare, e2e.verify, goal.revise, integration.verify, interface.asset, interface.audit, interface.draw, perf.verify, provision.ask, request.analyze, scope.define, security.verify, uat.assisted.prepare, uat.assisted.verify, work.author]
  chainLast: [backend.implement, code.refactor, content.generate, docs.author, interface.implement, release.deliver, runtime.operate, scope.finish, task.execute, test.author, uat.verify, workspace.manage]
  rationale: >-
    Two opposite positions, both deliberate (registry.yaml costPolicy): it leads
    verify and reasoning because independent judgment is the product there, and
    it trails implement/write because the established cost order is
    Qwen→Devin→Claude→Codex. It leads brand.decide/interface.* because it owns
    the image tool.

business:
  question: >-
    "Which pool judges the work others did, decides, and can draw?" —
    codex-agent is the primary verifier and reasoning seat and the sole
    visual-design route.
  whenNeeded:
    - verify-role operations — first in every verify chain (e2e, integration, security, perf, interface.audit, uat.assisted.verify).
    - decide/plan operations — first in every reasoning chain; hard and insane work runs on gpt-6-sol.
    - interface.draw / interface.asset — the ONLY route; no other pool can produce the representative ImageGen candidates.
    - Medium-tier general work as first default.
  whenNot:
    - As first pick for routine implement/write — the declared cost order deliberately spends Qwen/Devin/Claude capacity first.
    - For anything where image output is needed but the observed host tools lack it — availability is observed, never assumed (registry.yaml examplesNote).
  pickedBy: >-
    Allocator role preference + tier lists; verify, decide/plan and the image
    routes are where it structurally dominates.
  failureModes:
    - "Confusing requestedModel (luna) with the hard-tier model (sol): the pool pins per-difficulty models; attestation reads the difficulty's model, not the target's request."
    - Provider-level quota exhaustion disables Luna and Sol at once — the interface.draw route then has no fallback; a failed image op is parked, not rerouted to a non-image pool.
    - "INFERRED: using its 10-slot pool to parallelize easy implementation burns the shared quota the verify and reasoning lanes depend on."
