schema: starci/runtimes@1
purpose: |-
  Every runtime is a provider-window pool with real parallel slots and a cooldown: the pool boundary IS the
  quota-window boundary, so one pool never spans two independently metered windows and one window never splits
  into two pools. The workflow-bound profile applies adaptive capacity from config.yaml: role, tier, tools,
  qualification, independent review, fresh provider quota, shared admitted load and recent observed service
  filter and score provider families before one runtime is handed to the typed launcher. The preference/tier
  lists below are within-family suitability and a compatibility policy for direct low-level consumers; they are
  not a provider fallback chain in a workflow. A runtime that fails is classified and parked for the cooldown of
  that failure kind, doubling per repeat. Auth health is provider-wide rather than pool-wide: a confirmed
  launch, worker-start or attestation auth rejection parks every runtime sharing that provider credential. A
  stale-token preflight may make one real refresh attempt; a typed no-effect rejection falls through on the
  same logical operation attempt, while partial or unknown effects require reconciliation before fallback.

  Models are pinned inside the pool per DIFFICULTY (`models`) and attested at launch - never inferred from the
  pool name. `roles` is the role-coverage gate; `models` is the difficulty-coverage gate. A pool is eligible
  for a (role, difficulty) launch only when the role is in `roles` AND `models` names that difficulty - a pool
  that declares no model for a difficulty is ineligible there, never silently rerouted to another model.
  `effort` pins the per-difficulty effort where the provider exposes one. The canonical difficulty vocabulary
  is easy|medium|hard|insane; resolvers accept the S|M|L|XL spellings (and 'high' for 'hard').
# CONCURRENCY LIVES HERE AND NOWHERE ELSE. `runtimes.<pool>.maxParallel` below is the enforced slot
# count: scripts/kernel/api.mjs (route capacity), scripts/agent/models.mjs (selectPool) and
# scripts/route/route-model.mjs read it, and route-model reports any model profile whose cached
# `capacity.maxParallel` has drifted from it. `maxParallelOps` is the fleet-wide ceiling the kernel
# reasons against (modules/kernel/driver-loop.yaml); no code enforces it. Every other contract cites
# this file instead of restating a number.
maxParallelOps: 20
allocation:
  # The workflow-bound profile applies adaptive capacity from validated config.yaml; this is the default it overrides.
  policy: prefer-then-overflow
  # A tier may order its runtimes per role. The coding roles keep the tier they always had; decide and plan -
  # the roles Fable and the Codex reasoning model carry - name the reasoning pools first and their downgrade
  # after them, so a hard decide or plan operation is never "outside the hard tier" and never lands on the
  # cheap pool.
  tiers:
    hard:
      # Heavy implementation and refactor work (the scope measure names it hard even when the record does not):
      # Opus first, the SWE agent when its slots were explicitly assigned, Sol only as the last heavy fallback -
      # never the first answer for a six-file rewrite. Reasoning roles keep Fable first; hard verification goes
      # to the independent verifier model before it shares the implement pool.
      default: [claude-agent, devin-agent, codex-agent]
      implement: [claude-agent, devin-agent, codex-agent]
      write: [claude-agent, devin-agent, codex-agent]
      verify: [claude-fable, claude-agent, codex-agent, devin-agent]
      decide: [claude-fable, codex-agent, claude-agent]
      plan: [claude-fable, codex-agent, claude-agent]
    medium:
      default: [codex-agent, claude-agent, qwen-agent, devin-agent]
      decide: [claude-fable, codex-agent, claude-agent]
      plan: [claude-fable, codex-agent, claude-agent]
    easy: [qwen-agent, devin-agent, codex-agent, claude-agent]
    # Insane tops the ladder: only pools that declare an insane model can serve it. Fable leads the
    # reasoning roles and verification exactly as on hard; Devin and Qwen carry no insane pin and are
    # ineligible here by the models gate, so they are absent rather than listed-and-rejected.
    insane:
      default: [claude-agent, codex-agent]
      implement: [claude-agent, codex-agent]
      write: [claude-agent, codex-agent]
      verify: [claude-fable, claude-agent, codex-agent]
      decide: [claude-fable, codex-agent, claude-agent]
      plan: [claude-fable, codex-agent, claude-agent]
  preference:
    implement: [codex-agent, claude-agent, qwen-agent, devin-agent]
    verify: [codex-agent, claude-fable, claude-agent, qwen-agent, devin-agent]
    # Fable overflows to the Claude pool, the Codex reasoning model to its own pool's working model: the
    # reasoning roles end on the coding pools instead of stalling.
    decide: [claude-fable, codex-agent, claude-agent]
    plan: [claude-fable, codex-agent, claude-agent]
    write: [codex-agent, claude-agent, qwen-agent, devin-agent]
  # Heavy work fans out: a big node is cut into children with disjoint write scopes, the seam every other child
  # would touch is built first and alone, then the rest run at once - bounded here so one parent never takes
  # every slot of the pool and leaves the rest of the tree waiting behind it.
  fanOut: {seamFirst: true, maxPerGroup: 10}
  # Deterministic same-op slicing — the kernel measures the write scope and calls `api estimate`;
  # it never guesses a slice count. W = sum(weight * count) in agent-minutes; the returned slice
  # count is clamp(ceil(W / targetMinutes[1]), 1, maxSlices) so each slice lands inside
  # targetMinutes. The static bounds in kinds.yaml (12 files / 8 assertions / 3 components) are a
  # coarse screen over the same measure — the estimate is the authority. When N > 1 slices are
  # admitted together the kernel rotates --prefer across the difficulty tier's pool order so the
  # fleet spreads over devin/codex/claude/qwen lanes instead of piling onto the first pool.
  slicing:
    weights: {file: 4, assertion: 3, component: 12, record: 2}
    targetMinutes: [15, 30]
    maxSlices: 15
  verifyAvoidsImplementRuntime: true
  onLaunchFailure: next-available-runtime
  tieBreak: round-robin
  cooldownMs: {rate-limited: 600000, quota: 3600000, auth: 86400000, other: 300000}
  backoffFactor: 2
  maxCooldownMs: 3600000
runtimes:
  # One Codex account window carries the whole family: Luna is the easy/medium workhorse, Sol the hard model,
  # Astra the insane reasoning model. Role/tier/tool/quality gates still apply on top of the difficulty pin;
  # an owner allocation changes capacity, never qualification or effect authority.
  codex-agent:
    target: codex-agent
    provider: codex
    provides: [imagegen]
    roles: [implement, verify, write, decide, plan]
    maxParallel: 10
    models:
      easy: gpt-5.6-luna
      medium: gpt-5.6-luna
      hard: gpt-5.6-sol
      insane: gpt-6-astra
    effort:
      easy: low
      medium: medium
      hard: high
      insane: max
  # One Claude session/week window, all five roles on the same pinned model at every difficulty.
  claude-agent:
    target: claude-agent
    provider: claude
    roles: [implement, verify, write, decide, plan]
    maxParallel: 6
    models:
      easy: claude-opus-5
      medium: claude-opus-5
      hard: claude-opus-5
      insane: claude-opus-5
  # Fable has a weekly window of its own on top of the Claude session and week, so it is a pool of its own.
  # It is the deep-reasoning/verifier model: pinned for medium and up (never easy), with the roles gate kept.
  claude-fable:
    target: claude-fable
    provider: claude
    budgetWindow: fableWeekly
    roles: [verify, decide, plan, write]
    maxParallel: 2
    models:
      medium: claude-fable-5-1
      hard: claude-fable-5-1
      insane: claude-fable-5-1
  # The Qwen flash pool serves cheap work only: easy and medium. No hard/insane pin - it is ineligible there.
  qwen-agent:
    target: qwen-agent
    provider: qwen
    roles: [implement, verify, write]
    maxParallel: 10
    models:
      easy: qwen3.8-flash
      medium: qwen3.8-flash
  # Devin has no machine-readable account headroom equivalent to Orca's provider windows. Owner-assigned
  # capacity: 10 parallel lanes. The CLI's auth/readiness and observed launch/refusal status are the live
  # capacity signal on top of this cap. swe-2-max is a medium+ agent: no easy pin, so easy work never lands
  # on Devin even though the easy tier names the pool.
  devin-agent:
    target: devin-agent
    provider: devin
    roles: [implement, verify, write]
    maxParallel: 10
    capacityAuthority: explicit-workflow-quota
    quotaTelemetry: launch-status
    models:
      medium: swe-2-max
      hard: swe-2-max
roleOfKind:
  request.analyze: plan
  task.execute: plan
  backend.implement: implement
  backend.scaffold: implement
  interface.implement: implement
  interface.audit: verify
  interface.scaffold: implement
  package.scaffold: implement
  scope.define: decide
  code.refactor: implement
  test.author: implement
  grammar.update: implement
  architecture.revise: decide
  business.revise: decide
  content.generate: write
  docs.author: write
  knowledge.repair: write
  release.deliver: implement
  scope.finish: implement
  runtime.operate: implement
  review.verify: verify
  e2e.verify: verify
  integration.verify: verify
  security.verify: verify
  perf.verify: verify
  uat.verify: verify
  uat.assisted.prepare: write
  uat.assisted.verify: verify
  goal.validate: verify
  architecture.decide: decide
  business.decide: decide
  goal.revise: decide
  decision.prepare: decide
  provision.ask: decide
  brand.decide: write
  interface.draw: write
  interface.asset: write
  work.author: plan
  implementation.plan: plan
  workspace.manage: plan
# Hard capability gates per kind, checked inside poolRejectionReasons before a
# pool can be selected — a declared `provides` entry on the pool is the only
# proof; tier chain membership and owner prefer-bias can never hoist a pool
# past a capability it does not provide.
kindRequires:
  interface.draw: [imagegen]
  interface.asset: [imagegen]
