schema: starci/agent-card@1
agent: qwen
kind: command-terminal-agent
model: deepseek-v4.1-flash
modelAuthority: rendered-terminal-footer
commandRequirements:
  - '--exclude-tools agent'
  - '--yolo'
commandRequirementsReason: |-
  --yolo is mandatory for terminal-spawned qwen, not optional: without it the TUI asks command approval
  per tool kind (Read, grep, Bash...) and answering "allow always" only whitelists that one kind — the
  next kind re-prompts and the agent stalls forever. A command must spell it --yolo and never add
  --approval-mode: Qwen Code 0.24.2 exits at startup with "Cannot use both --yolo (-y) and --approval-mode
  together" (seen 2026-09-24 with the old profile command, which therefore never reached a prompt).
why: |-
  Orca 1.4.188's native qwen-code adapter cannot deliver a Task prompt to Qwen Code 0.23.3
  (agent_prompt_stalled, agent_readiness timeout). A terminal created with the declared qwen command
  renders an input prompt within seconds, accepts the Task preamble through terminal send, and
  reports worker_done through the Dispatch context created by dispatch --return-preamble.
  Re-verified 2026-09-24 on Orca 1.4.188 + Qwen Code 0.24.2 with deepseek-v4.1-flash: an Orca terminal created
  with the composed declared command rendered the input prompt and the footer model, accepted a terminal
  send and answered; a PTY launch with the @file delivery prompt showed the "esc to cancel" spinner, ran a
  shell tool under --yolo and answered. The native qwen-code worker-start adapter was not retried; it stays
  forbidden below because dispatch never uses it.
  Host prerequisite: ~/.qwen/settings.json model.maxSessionTurns must be -1 (unlimited). Qwen Code has no CLI
  flag for it, and the old value 240 ended a nivo backend.implement worker mid-job on 2026-09-24 with "The
  session has reached the maximum number of turns: 240" - a capped session cannot be nudged back to work.
credentialRefresh:
  envKey: BAILIAN_TOKEN_PLAN_API_KEY
  secretsFile: .secrets/models.env
  secretName: QWENCLOUD_API_KEY
  # Where Qwen reads envKey itself when the secrets file has no secretName line (the step unsets the variable).
  providerEnvFile: '<home>/.qwen/.env'
  reason: |-
    A running Orca process keeps the environment it started with, and Qwen Code gives an inherited variable
    precedence over its ~/.qwen/.env file, so a stale copy of the key yields HTTP 401 (seen 2026-09-24 after the
    key rotation). The terminal command therefore sets BAILIAN_TOKEN_PLAN_API_KEY inside the terminal's own shell
    from QWENCLOUD_API_KEY in the gitignored runtime secrets file (scripts/agent/lib.mjs credentialRefreshCommand
    fills <secrets-file>); when that file has no such line it unsets the variable so Qwen reads its own env file.
    Only the file path enters the command; no value is ever placed in a command, receipt or log.
  win32: '$starciQwenKey=$null; if (Test-Path -LiteralPath ''<secrets-file>'') { $starciQwenKey=Get-Content -LiteralPath ''<secrets-file>'' | Where-Object { $_ -match ''^\s*QWENCLOUD_API_KEY\s*='' } | Select-Object -First 1 }; if ($starciQwenKey) { $env:BAILIAN_TOKEN_PLAN_API_KEY=($starciQwenKey -replace ''^\s*QWENCLOUD_API_KEY\s*=\s*'','''').Trim().Trim([char]34,[char]39) } else { Remove-Item Env:BAILIAN_TOKEN_PLAN_API_KEY -ErrorAction SilentlyContinue }; Remove-Variable starciQwenKey -ErrorAction SilentlyContinue; '
  posix: 'starci_qk=; if [ -f ''<secrets-file>'' ]; then starci_qk=$(sed -n ''s/^[[:space:]]*QWENCLOUD_API_KEY[[:space:]]*=[[:space:]]*//p'' ''<secrets-file>'' | head -n 1 | tr -d ''\r"''); fi; if [ -n "$starci_qk" ]; then export BAILIAN_TOKEN_PLAN_API_KEY="$starci_qk"; else unset BAILIAN_TOKEN_PLAN_API_KEY; fi; unset starci_qk; '
  stillNeeded: |-
    Re-checked 2026-09-24 on Orca 1.4.209 after the User variable was rotated and Orca restarted at 02:38: a bare
    `qwen` in a fresh Orca terminal still answered HTTP 401 "invalid API-key". Orca terminals are spawned by its
    long-lived terminal daemon, which kept the old environment across the app restart, so the in-terminal refresh
    stays until that daemon itself restarts with the new key.
credentialProbe:
  kind: openai-models
  settingsFile: '<home>/.qwen/settings.json'
  reason: |-
    `api provider-health --provider qwen --recover --probe` proves the credential before it clears an auth circuit:
    GET <baseUrl>/models with the key credentialRefresh resolves (scripts/agent/credential-probe.mjs), where
    baseUrl is the settingsFile modelProviders entry whose id is this card's model. It costs no tokens. Checked
    2026-09-24 on the Token Plan Singapore endpoint: the current key answers 200, an invalid key 401 InvalidApiKey.
hostIdentity:
  env:
    CLI_TITLE: '<label> - qwen-code'
  reason: |-
    Orca 1.4.209 names a tab's agent from its agent hooks, its foreground process or its pane title. Qwen Code has
    no Orca hook, and its process is `node ...\@qwen-code\qwen-code\cli-entry.js`, which Orca does not map to
    qwen-code (only `qwen` itself, or a Cursor/Pi/Prime package path, is recognised). Qwen Code writes its pane
    title from CLI_TITLE (default "Qwen - <folder>"), prefixed with a half-circle spinner while it responds, and
    Orca reads a title ending in " - qwen-code" as an anchored qwen-code owner. The tab then shows the Qwen
    logo and the working spinner. Verified 2026-09-24 on Orca 1.4.209 + Qwen Code 0.24.4: without it the pane
    had no agentIdentity; with it `terminal list` reported agentIdentity qwen-code, title "◐ ... - qwen-code"
    while a shell tool ran and "... - qwen-code" at rest. `<label>` is the op job id (lib.mjs hostIdentityEnv).
    The idle state is shown only as "no spinner": the title carries no idle word Orca would read.
readiness:
  screenPattern: 'Type your message'
  identityPattern: 'deepseek-v4\.1-flash'
  timeoutMs: 120000
  intervalMs: 5000
delivery:
  mode: file-reference-above-inline-limit
  maxInlineChars: 4096
  fileName: orca-dispatch-<dispatch>.md
  prompt: '@<file> This file is your dispatched Task preamble and operation contract. Read it completely and follow every instruction in it exactly; report worker_done exactly once as it says.'
  reason: Qwen Code 0.23.3 crashes (V8 native stack) when a multi-kilobyte preamble is pasted through terminal send; a short @file reference delivers the same text through Qwen's own file reader.
submission:
  stagedPattern: 'Pasted Content'
  activityPattern: 'Thinking|esc to cancel|tokens'
  settleMs: 3000
  timeoutMs: 45000
  maxEnter: 2
# The footer renders the ~/.qwen/settings.json modelProviders entry name,
# "deepseek-v4.1-flash (Token Plan Singapore)"; the id is a delimited token inside it.
modelMarker: deepseek-v4.1-flash
approvalMode:
  working: yolo
  reasoning: yolo
  reason: |-
    Every Qwen operation runs unattended in an isolated child worktree under a contract allowlist, so both roles use
    yolo. Plan mode asks for confirmation on every shell command, including the heartbeat
    send, so a review would park at "Allow execution of: 'orca'?" while its heartbeat stayed fresh; auto mode stalls
    the same way behind a remote classifier. Write authority for a review is enforced by the
    contract allowlist and the Monitor's report validation, not by the provider's approval mode.
start:
  - api: terminal.create
    binding: declared-target-command-with-credential-refresh
  - api: terminal.read
    phase: readiness
  - api: orchestration.dispatch
    binding: return-preamble
  - api: terminal.send
    phase: submit
  - api: terminal.read
    phase: submission
  - api: orchestration.dispatch-show
    phase: assignee-attestation
release:
  api: orchestration.worker-stop
  then: terminal.close
knownFailures:
  - signal: 'Permission menu reappears for each new command kind (Read, grep, Bash, ...)'
    meaning: Lane was spawned without --yolo; per-kind allows do not generalize.
    action: Kill and respawn with --yolo in the command; do not keep answering menus.
    seenAt: 2026-09-20
  - signal: 'Cannot use both --yolo \(-y\) and --approval-mode together'
    meaning: The launch command carried --approval-mode beside the --yolo this card requires; Qwen Code 0.24.2 prints its help and exits, so the terminal never renders a prompt and dispatch fails with a readiness timeout.
    action: Spell the approval mode --yolo only in the profile command (modules/models/profiles/qwen-agent.yaml).
    seenAt: 2026-09-24
  - signal: 'Multi-kilobyte prompt pasted via terminal send → V8 native crash'
    meaning: Inline paste overflow.
    action: 'Deliver the brief via @<file> reference (see delivery.fileDirectory) — already encoded.'
    seenAt: established
verifiedAt: 2026-09-24
verifiedAgainst: 'Qwen Code 0.24.4, deepseek-v4.1-flash on the QwenCloud Token Plan, Orca 1.4.209'
forbidden:
  - qwen-agent-tool
  - provider-native-subagent
  - worker-start-agent-qwen-code
  - dispatch-inject
  - reuse-existing-terminal
  - unsupervised-retain-as-success
capabilities:
  # Evidence, nivo ledger 2026-09-23: qwen-agent never ran interface.draw or interface.audit, so neither
  # image_gen.imagegen nor browser-dom is proven; a tool is listed here after a settled pass shows it.
  hostTools: []
quota:
  probe: env:qwen-key
  window: none
