schema: starci/agent-card@1
agent: codex
kind: native-managed-agent
start:
  api: orchestration.worker-start
  agentArgument: codex
readiness: worker-start-receipt
roles:
  - workflow-kernel
  - operation-agent
name:
  api: terminal.rename
release:
  api: orchestration.worker-release
hostLaunchPrefix:
  win32: '&'
  posix: 'command'
  reason: >-
    Orca's CLI sends a terminal-create command whose first word is `codex` down its renderer-backed tab path, which
    waits at most 10s for the UI to publish a handle and otherwise fails with "Timed out waiting for terminal handle after
    creation" while the tab still spawns later, untracked (starci-next op-workspace.manage-55001e2623, 2026-09-23). A
    leading shell call operator runs the same binary on the runtime-owned PTY path qwen and devin already use; reproduced
    against Orca: bare `codex` timed out at 10.4s, `& codex` returned its handle in 0.5s.
terminalFallback:
  when: every unattended Codex launch — the Kernel terminal and every operation agent (the codex profiles are command-terminal, card-composed); worker-start carries no approval/sandbox flag
  command: codex
  modelArgs: ['--model', '<model>']
  effortArgs: ['-c', 'model_reasoning_effort="<effort>"']
  bypassArgs: ['--ask-for-approval', 'never', '--sandbox', 'danger-full-access']
  bypassReason: An unattended agent stalls on per-tool permission menus; use the current explicit approval and sandbox flags declared by bypassArgs.
  note: 'codex self-update can leave the binary broken (TUI missing dist files; a reinstall fixes it). Probe `codex --version` before relying on it.'
verifiedAt: 2026-09-20
verifiedAgainst: 'codex v0.155.1'
forbidden:
  - shell-only-role
  - unsupervised-dispatch-inject-as-success
capabilities:
  schema: starci/codex-capabilities@1
  # Evidence, nivo ledger 2026-09-23: image_gen.imagegen — interface.draw settled pass with ImageGen
  # provenance on codex (AUTH a2 gpt-5.6-sol; WSPV a2 luna, a3/a10-a14 sol; public-web a3 luna).
  # browser-dom — public-web uat.verify a5 (luna) settled pass driving the served build in a browser
  # (33 screenshots, 7 WebM, per-route H1 and overflow DOM checks). WSPV interface.audit a6 blocked
  # CAPTURE_OR_MEASUREMENT_UNAVAILABLE on a PNG-only handoff without trying to serve, not on a missing tool.
  hostTools: [image_gen.imagegen, browser-dom]
  orca:
    nativeManagedAgent: supported
    agentId: codex
    roles:
      - workflow-kernel
      - operation-agent
quota:
  probe: orca-account
  window: weekly
