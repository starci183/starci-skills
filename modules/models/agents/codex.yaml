schema: starci/agent-card@1
agent: codex
kind: native-managed-agent
start:
  api: orchestration.worker-start
  agentArgument: codex
readiness: worker-start-receipt
roles:
  - plan-coordinator
  - workflow-coordinator
  - operation-fallback
name:
  api: terminal.rename
release:
  api: orchestration.worker-release
terminalFallback:
  when: orchestration.worker-start is unavailable or a plain-command lane is wanted
  command: codex
  modelArgs: ['--model', '<model>']
  effortArgs: ['-c', 'model_reasoning_effort="<effort>"']
  bypassArgs: ['--ask-for-approval', 'never', '--sandbox', 'danger-full-access']
  bypassReason: Unattended lanes stall on per-tool permission menus; use the current explicit approval and sandbox flags declared by bypassArgs.
  note: 'codex self-update can leave the binary broken (TUI missing dist files; a reinstall fixes it). Probe `codex --version` before relying on it.'
verifiedAt: 2026-09-20
verifiedAgainst: 'codex v0.155.1'
forbidden:
  - shell-only-role
  - unsupervised-dispatch-inject-as-success
capabilities:
  schema: starci/codex-capabilities@1
  hostModes:
    solo: supported
    orchestrated: bootstrap-only-to-orca
  solo:
    controlPlane: current-chat
    operationIsolation: collaboration-subagent
    maximumConcurrentOperationAgents: 3
    childWorktrees: forbidden
  orca:
    nativeManagedAgent: supported
    agentId: codex
    roles:
      - plan-coordinator
      - workflow-coordinator
      - operation-fallback
quota:
  probe: orca-account
  window: weekly
