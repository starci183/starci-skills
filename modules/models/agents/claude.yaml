schema: starci/agent-card@1
agent: claude
kind: native-managed-agent
start:
  api: orchestration.worker-start
  agentArgument: claude
readiness: worker-start-receipt
roles:
  - workflow-kernel
  - operation-agent
name:
  api: terminal.rename
release:
  api: orchestration.worker-release
launchEnv:
  DISABLE_AUTOUPDATER: '1'
launchEnvReason: >-
  Every runtime-launched Claude seat (Kernel, Supervisor seat, op and Supervisor workers) runs the one npm-global
  claude.exe, so Claude Code's own auto-update can never replace it while seats run (update_apply_exe_locked) and
  every seat showed "✘ Auto-update failed: claude.exe in use". The runtime therefore turns the updater off: Orca's
  orchestration worker-start composes every worker's command itself, so scripts/agent/trust.mjs asserts the key under
  env in the launch worktree's .claude/settings.local.json (project scope, never a user-global settings file) before every Claude launch - only when the key is missing, an owner-set value is kept. Updates are applied deliberately while no seat runs (docs/supervisor.md "Claude Code
  updates"): stop the seats, `npm i -g @anthropic-ai/claude-code`, then /start.
launchTrust: >-
  Owner instruction 2026-09-23: the runtime, never the owner, approves launch prompts. Before every launch
  scripts/agent/trust.mjs sets ~/.claude.json projects[<cwd>].hasTrustDialogAccepted (keys `D:/…` and `D:\…`) and
  asserts settings.json skipDangerousModePermissionPrompt; a gate below that still appears is answered once, else refused.
gateAutoAnswer:
  # Claude refuses keys for a moment after a dialog opens; the answer waits delayMs, then walks the cursor to
  # `select` (arrow keys) and presses Enter. A gate still on screen settleMs later is refused.
  delayMs: 1500
  settleMs: 6000
  gates:
    claude-workspace-trust:
      select: 'Yes, I trust this folder'
    claude-bypass-permissions-consent:
      select: 'Yes, I accept'
liveness:
  busyPatterns:
    - '\((?:running \S+ hook · )?(?:\d+h\s)?(?:\d+m\s)?\d+s\s·\s[↓↑]\s[\d.]+k?\s+tokens'
  chromePatterns:
    - '^\s*\S\s+(?:low|medium|high|xhigh|max)\s+·\s+/effort\b'
    - '^\s*(?:[✘✗×✔✓√⚠]\s+)?(?:Auto-update failed\b|Auto-updating…|Update installed · Restart to (?:apply|update)\b|Update failed and .+ could not be restored\b|Update available! Run:|Claude Code can''t auto-update\b|globalVersion: \S+ · latestVersion:)'
    - '\s·\s+(?:rename it back to|reinstall with|[Rr]un|Try)\s+(?:`?claude doctor\b|npm i -g @anthropic-ai/claude-code\b)'
    - '^\s*(?:[✘✗×⚠]\s+)?(?:IDE extension install failed\b|(?:IDE|VS Code|Visual Studio Code|Cursor|Windsurf|JetBrains|IntelliJ IDEA|PyCharm|WebStorm|GoLand|Rider|PhpStorm|RubyMine|CLion|Android Studio|Zed)\s+disconnected\s*$)'
    - '^\s*⧉\s+(?:In\s+\S|\d+\s+lines?\s+(?:selected|from)\b)'
    - '^\s*(?:[✘✗×⚠]\s+)?(?:MCP (?:\d+ )?servers? blocked by enterprise policy:|one or more of your MCP server choices could not be saved\b|your MCP server choices apply to this session only\b|skipping \.mcp\.json server approval\b)'
    - '^\s*(?:\d+% until auto-compact|\d+% context used|Context low \(\d+% remaining\))(?:\s·\s.*)?\s*$'
verifiedAt: 2026-09-23
verifiedAgainst: 'claude CLI 2.1.280'
forbidden:
  - shell-only-role
  - unsupervised-dispatch-inject-as-success
capabilities:
  schema: starci/claude-capabilities@1
  # Evidence, nivo ledger 2026-09-23: claude-agent never ran interface.draw or interface.audit, so neither
  # image_gen.imagegen nor browser-dom is proven; a tool is listed here after a settled pass shows it.
  hostTools: []
  orca:
    nativeManagedAgent: supported
    agentId: claude
    roles:
      - workflow-kernel
      - operation-agent
quota:
  probe: orca-account
  window: weekly
