schema: starci/agent-card@1
agent: claude
kind: native-managed-agent
start:
  api: orchestration.worker-start
  agentArgument: claude
readiness: worker-start-receipt
roles:
  - workflow-kernel
  - operation-agent
name:
  api: terminal.rename
release:
  api: orchestration.worker-release
hostLaunchPrefix:
  win32: '&'
  posix: 'command'
  reason: >-
    Orca's CLI sends a terminal-create command whose first word is `claude` down its renderer-backed tab path, which
    waits at most 10s for the UI to publish a handle and otherwise fails with "Timed out waiting for terminal handle after
    creation" while the tab still spawns later, untracked (starci-next op-workspace.manage-55001e2623, 2026-09-23). A
    leading shell call operator runs the same binary on the runtime-owned PTY path qwen and devin already use; reproduced
    against Orca: bare `claude` timed out at 10.4s, `& claude` returned its handle in 0.5s.
terminalFallback:
  when: orchestration.worker-start is unavailable or a plain command terminal is wanted
  command: claude
  modelArgs: ['--model', '<model>']
  effortArgs: ['--effort', '<effort>']
  bypassArgs: ['--dangerously-skip-permissions']
  bypassReason: An unattended agent stalls on per-tool permission menus; same rule as qwen --yolo / devin bypass mode.
launchTrust: >-
  Owner instruction 2026-09-23: the runtime, never the owner, approves launch prompts. Before every launch
  scripts/agent/trust.mjs sets ~/.claude.json projects[<cwd>].hasTrustDialogAccepted (keys `D:/…` and `D:\…`) and
  asserts settings.json skipDangerousModePermissionPrompt; a gate below that still appears is answered once, else refused.
gateAutoAnswer:
  # Claude refuses keys for a moment after a dialog opens; the answer waits delayMs, then walks the cursor to
  # `select` (arrow keys) and presses Enter. A gate still on screen settleMs later is refused.
  delayMs: 1500
  settleMs: 6000
  gates:
    claude-workspace-trust:
      select: 'Yes, I trust this folder'
    claude-bypass-permissions-consent:
      select: 'Yes, I accept'
modelAttestation:
  reason: >-
    Claude Code renders the model display name in its banner ("Opus 5.5 with high effort"), not the
    model id, so screen attestation matches the display name declared per id here.
  displayNames:
    claude-opus-5-5: Opus 5.5
# Frame shapes for scripts/kernel/terminal-liveness.mjs (cardLivenessPatterns). The spinner row itself
# ("✽ Garnishing… (15m 29s · ↓ 5.1k tokens)", "* Galloping… (8s · ↓ 288 tokens)") is also read by the
# classifier's built-in markers; its timer-and-tokens tail is declared here as the busy row it is.
# chromePatterns: the effort indicator Claude Code draws between its spinner and the ❯ input box
# ("◐ medium · /effort"); it read as a finished answer, so a working op read turn-idle and
# nudge-ready (mia op-handover.review-a12ce7ea00, inc-fcd1c1c10d8a).
liveness:
  busyPatterns:
    - '\((?:running \S+ hook · )?(?:\d+h\s)?(?:\d+m\s)?\d+s\s·\s[↓↑]\s[\d.]+k?\s+tokens'
  chromePatterns:
    - '^\s*\S\s+(?:low|medium|high|xhigh|max)\s+·\s+/effort\b'
verifiedAt: 2026-09-23
verifiedAgainst: 'claude CLI 2.1.280'
forbidden:
  - shell-only-role
  - unsupervised-dispatch-inject-as-success
capabilities:
  schema: starci/claude-capabilities@1
  # Evidence, nivo ledger 2026-09-23: claude-agent never ran interface.draw or interface.audit, so neither
  # image_gen.imagegen nor browser-dom is proven; a tool is listed here after a settled pass shows it.
  hostTools: []
  orca:
    nativeManagedAgent: supported
    agentId: claude
    roles:
      - workflow-kernel
      - operation-agent
quota:
  probe: orca-account
  window: weekly
