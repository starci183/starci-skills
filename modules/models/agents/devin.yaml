schema: starci/agent-card@1
agent: devin
kind: command-terminal-agent
model: devin-agent
modelAuthority: configured-logical-runtime
why: |-
  Orca has no native Devin worker adapter. The official local Devin CLI can run in the exact workflow
  worktree, so Orca owns a fresh terminal and Dispatch for each attempt and observes the same report boundary
  as every other operation agent. The underlying account-selected model is deliberately not inferred.
commandPrefix:
  win32: '$devinExe=(Get-Command devin -ErrorAction SilentlyContinue).Source; if (-not $devinExe) { $devinExe=Join-Path $env:LOCALAPPDATA ''devin\cli\bin\devin.exe'' }; if (-not (Test-Path -LiteralPath $devinExe)) { Write-Error ''Devin CLI is not installed''; exit 127 }; Remove-Item Env:ACP_BACKEND -ErrorAction SilentlyContinue; & $devinExe models list --format json *> $null; if ($LASTEXITCODE -ne 0) { Write-Error ''Devin CLI is not authenticated''; exit $LASTEXITCODE }; $starciDevinArgs=@(); $starciDevinCfgSrc=Join-Path $env:APPDATA ''devin\config.json''; if (Test-Path -LiteralPath $starciDevinCfgSrc) { $starciDevinCfgText=[IO.File]::ReadAllText($starciDevinCfgSrc); if ($starciDevinCfgText -match ''agent-hooks\\\\devin-hook\.cmd'') { $starciDevinCfg=Join-Path $env:TEMP (''starci-devin-config-'' + $PID + ''.json''); [IO.File]::WriteAllText($starciDevinCfg, [regex]::Replace($starciDevinCfgText, ''(?<="command"\s*:\s*")[^"]*?agent-hooks\\\\devin-hook\.cmd(?=")'', { param($m) $m.Value.Replace(''\\'', ''/'') })); $starciDevinArgs=@(''--config'', $starciDevinCfg) } }; Remove-Variable starciDevinCfgText, starciDevinCfgSrc -ErrorAction SilentlyContinue; function devin { & $devinExe @starciDevinArgs @args }; '
  posix: 'command -v devin >/dev/null 2>&1 && env -u ACP_BACKEND devin models list --format json >/dev/null && '
  reason: Fail before Task delivery when the official CLI is absent or the owner is not authenticated; auth status alone exits zero while logged out, so the read-only model inventory is the probe. No token is copied into commands or receipts.
  statusHookReason: |-
    Orca shows Devin's working/idle state only from its devin-hook (the pane is recognised as Devin by its devin.exe
    foreground process, but that gives no status). Orca 1.4.209 installs the hook into %APPDATA%\devin\config.json
    as the bare Windows path C:\Users\<you>\.orca\agent-hooks\devin-hook.cmd, while Devin CLI 3000.10.27 runs a
    hook `command` through Git Bash on Windows. Bash eats the unquoted backslashes and every hook exits 127
    ("Effects evaluator failed for hook None: Command exited with code 127" in %APPDATA%\devin\cli\logs), so the
    tab sat at Idle while Devin worked. The win32 prefix therefore launches Devin with --config pointing at a
    per-terminal copy (%TEMP%\starci-devin-config-<pid>.json) of the owner's config in which only those hook
    commands are rewritten to forward slashes; everything else is copied byte for byte and the owner's file, which
    Orca rewrites at every start, is never touched. The copy exists only when Orca's hook is installed; without it
    Devin starts on its default config as before. Settings Devin saves during the session land in the copy.
    Verified 2026-09-24: hooks ran with zero failures and Orca's status for the pane went working on
    UserPromptSubmit/PreToolUse and done on Stop, on the first turn and on the next.
environmentStrip:
  - name: ACP_BACKEND
    reason: |-
      A leaked ACP_BACKEND=windsurf in terminal environments makes the spawned
      devin agent child pick the wrong backend surface; interactive sessions then exit immediately
      with 'agent child exited: exit code: 0'. The strip must run inside the terminal command before
      devin starts — clearing it in the spawn host does not help a terminal that already inherited it.
commandRequirements:
  - '--permission-mode dangerous'
  - '--respect-workspace-trust false'
terminalFallback:
  command: devin
  modelArgs: ['--model', '<model>']
kernelPermissionReason: |-
  The long-lived kernel is not an implementation worker: its required loop repeatedly invokes the declared
  Node kernel API and Orca observation commands. Per-command menus deadlock an unattended kernel. Dangerous
  mode is scoped to this dedicated terminal; the kernel packet still forbids direct ledger writes, source
  implementation and self-spawned operation terminals. Operation agents also launch unattended, but remain
  bounded by their narrower operation contract and owned-path leases.
readiness:
  screenPattern: '(?:Ask Devin|Message Devin|Type your message|Enter a prompt|(^|\n)\s*[>❯❭]\s*$)'
  identityPattern: 'Devin'
modelAttestation:
  mode: launch-flag
  reason: >-
    The Devin TUI does not render the model id on screen, so screen attestation can never pass.
    The launch command pins --model and the CLI exits with 'Unknown model' before the readiness
    prompt on an invalid id, so surviving to readiness is the attestation.
  timeoutMs: 120000
  intervalMs: 5000
delivery:
  mode: file-reference-above-inline-limit
  maxInlineChars: 16384
  fileName: orca-dispatch-<dispatch>.md
  prompt: 'Read <file> completely. It is your dispatched Task preamble and operation contract. Follow it exactly and report worker_done exactly once as specified.'
submission:
  stagedPattern: 'Pasted Content|\[Pasted text|<file>|orca-dispatch-'
  activityPattern: 'Thinking|Working|Running|esc to (?:cancel|interrupt)|tokens'
  settleMs: 3000
  timeoutMs: 45000
  maxEnter: 2
# Liveness overrides of runtimes.yaml allocation.liveness (scripts/kernel/api.mjs livenessMsOf).
# Devin redraws nothing while a long tool call runs: its "⠠⠤ Thinking · 32m 53s (esc twice to
# interrupt)" frame sat unchanged through a 20-minute e2e run, and the 10-minute activeStaleMs called
# live Devin workers stale-active turn-idle and nudge-ready (inc-3b9864f5f3f8, inc-07830ad93e97,
# inc-e24bf11bb76c, inc-4c84210fc979). Its timer covers the whole turn, not one phase.
liveness:
  activeStaleMs: 3600000
  # Rows that prove a running turn (scripts/kernel/terminal-liveness.mjs cardLivenessPatterns): above
  # the input row with only chrome between, the frame reads active whatever the input row shows.
  # Devin wraps a long spinner row by words, so the braille row may carry no digit and the last row
  # of the block may be its hint alone. Captured 2026-09-25 on nivo term_a51fe9e2 (op-interface.
  # implement-b2417393bd), alternating with the one-row "(esc twice to interrupt)" form:
  #   "⠀⠴ Writing .\.starciwork\features\collab\impl\nivo-"
  #   "  fe\evidence\surface-r2\tools\emit-evidence.mjs · 113m 0s · (1291c ·"
  #   "  ctrl+o for details · alt+t to toggle)"
  # (mia inc-1b82f657a6a8, nivo inc-266976b75b25). The "❭ Guide Devin while it works" placeholder
  # shows only while a turn runs ("❭ Ask Devin to build features..." at rest), but the rows above decide.
  busyPatterns:
    - '^\s*[⠀-⣿]{1,4}\s+\S'
    - '·\s(?:\d+h\s)?(?:\d+m\s)?\d+s\s(?:·\s\(|\(esc)'
    - 'ctrl\+o for details\s·\salt\+t\b'
approvalMode:
  working: dangerous
  reasoning: dangerous
  reason: >-
    Every dispatched operation already passed the owner goal gate, exact owned-path admission and durable
    lease fencing. The worker must therefore be non-interactive: per-command permission menus deadlock the
    workflow without adding authority. Dangerous mode removes the UI prompt; the operation contract,
    owned paths and Kernel settlement remain the actual boundary.
kernelApprovalMode:
  working: dangerous
  reasoning: dedicated-long-lived-kernel-must-not-stall-on-declared-api-commands
start:
  - {api: terminal.create, binding: declared-target-command-after-auth-status}
  - {api: terminal.read, phase: readiness}
  - {api: orchestration.dispatch, binding: return-preamble}
  - {api: terminal.send, phase: submit}
  - {api: terminal.read, phase: submission}
  - {api: orchestration.dispatch-show, phase: assignee-attestation}
release:
  api: orchestration.worker-stop
  then: terminal.close
bypassMode:
  launch: '--permission-mode dangerous — equivalent unattended/yolo mode, injected before Task delivery.'
  recovery: 'For a legacy already-running accept-edits terminal, send "5" + Enter once, then let the next attempt use the launch flag.'
knownFailures:
  - signal: 'Unknown model'
    meaning: The --model flag named an id the account cannot run; the CLI exits before the prompt.
    action: Fix the model pin in the route or config — do not retry the same id.
  - signal: 'Agent connection lost: agent child exited: exit code: 0'
    meaning: The spawned agent child process died; queued sends will not be processed.
    action: Close the terminal and spawn a fresh agent; do not keep sending into the dead TUI.
    seenAt: 2026-09-20
  - signal: 'TUI sits at a permission menu (1 Yes / 2-4 allow-variants / 5 bypass / 8 No)'
    meaning: Command approval is being asked per tool; the agent is stalled waiting for input.
    action: 'Send "5" + Enter once (session bypass) — do not answer individual allows, they re-prompt per command kind.'
    seenAt: 2026-09-20
  - signal: 'devin opens a login menu instead of a prompt'
    meaning: 'Missing credentials or ACP_BACKEND leak (see environmentStrip).'
    action: devin auth login, or strip the env var inside the terminal command.
    seenAt: 2026-09-20
  - signal: 'Spinner "Thinking" for >60 min with no output and no writes to disk'
    meaning: Wedged agent, not a slow task — output freshness is the health signal.
    action: Kill and respawn the agent; work is recovered by the next attempt surveying the tree.
    seenAt: 2026-09-20
verifiedAt: 2026-09-24
verifiedAgainst: 'devin CLI v3000.10.27, Orca 1.4.209'
forbidden:
  - provider-native-subagent
  - cloud-handoff
  - dispatch-inject
  - reuse-existing-terminal
  - unsupervised-retain-as-success
  - inferred-underlying-model
capabilities:
  # Evidence, nivo ledger 2026-09-23: browser-dom — WSPV interface.audit a8 served the production build and
  # drove all 12 cells with Playwright (runtime/DOM/a11y/computed-style evidence), a9 and a21 settled pass
  # on re-measured DOM. No image_gen.imagegen — AUTH interface.draw a1 blocked IMAGEGEN_TOOL_UNAVAILABLE.
  hostTools: [browser-dom]
quota:
  probe: cli:devin-auth
  window: none
