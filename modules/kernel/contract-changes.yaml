code). (3) Learning: a note is classified by structure (product-direction, grammar, knowledge, one-off; draw-feedback.mjs classify --by kernel|critic reclassifies, structure confirms); a product-direction note (and every brand-direction-review revise note) is appended to brand.direction.learned (work/brand@1, status proposed until the owner's next direction acceptance, which the question lists and the accept applies); every later draw of the product reads it. (4) Golden: the owner's own accept of a drawing whose archetype has no golden yet, or one marked golden, is promoted into brand.direction.golden (golden/<archetype>/ html+png+sha) through brand-direction.mjs promoteGolden, and the archetype is accepted with that draw-review receipt when the direction is accepted (brand.mjs judges a draw-review receipt against the golden digests); an automatic answer never promotes. (5) api status drawReviews [{record, recordPath, state, awaitingOwner, redrawOwed, rounds, shapes: [{shape, round, parts, openNotes, addressed, unaddressed, golden}]}] and knowledgeChangeRequests; an owner redraw no interface.draw leg took up since is a nextActions retry. The harness UI shows them as 'Cần thầy duyệt hình'."
