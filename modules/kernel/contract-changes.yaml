ytes of its src), api status lists assetSlotsOwed[] and nextActions proposes a dispatch of interface.asset for them; interface.asset fills the placeholder (new write `placeholder`: src + data-asset-sha256 + data-asset-prompt only) under the brand imagery.promptRules. The brand masters (the unicorn masters) are the LANDING's art and the style reference only: every product slot is owed a NEW generation (new pose/composition, same style) - a slot is filled only by bytes that are not byte-identical to any brand/assets/** master and carry their prompt (data-asset-prompt or <file>.prompt.txt); a master may be a placeholder only; a done work/ui-screen@1 with an owed slot is refused ASSET_SLOT_UNFILLED (scripts/checks/check-example-work.mjs); BRAND-2 case-1/case-3 reworded (a new generation in the masters' style, never their bytes on a product surface). (4) The Nivo seed records the owner's stated dashboard choices (layout r5 devin, overview band r5 claude, real HeroUI Alert, black brand ink #040d1c with red only for artwork/danger, --background canvas, neutral IconTile, segmented Meter proposal) as stated, still pending the brand-direction-review ask: work/brand@1 pendingRulings[].ownerStated (optional prose; the ruling stays open), and the review question text names it. Adds codes DRAW_ALERT_ANATOMY, DRAW_METER_TRACK, DRAW_ASSET_SLOT_UNDECLARED, ASSET_SLOT_UNFILLED - advisory for an interface.draw leg admitted earlier"
