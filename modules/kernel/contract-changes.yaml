  - id: work-debt-attribution-adoption
    effectiveAt: '2026-09-24T20:16:51+07:00'
    commit: '1796a1570'
    summary: "Work debt is attributed to the job that wrote each file - its report files, else its run window (dispatch to report) holding the file's mtime; anything else is unattributed and never batched, and kernel custody is never debt - instead of to the newest job whose owned directory holds it, so a batch never takes another job's files. A finished workflow's debt is adopted by a live workflow in the same repository: api enqueue --commit-only-work-debt --adopt-from <finished> takes only paths the adopting workflow's Work scope covers (its jobs' owned paths widened to their feature or .starciwork area directory), and --as-repo-owner also the paths no other live workflow's scope covers; reconcile --work-debt lists adoptions and unattributed files. The landed proof is unchanged. Adds no check or code"
    ops: [scope.define, business.decide, architecture.decide, work.author, brand.decide]
    paths:
      - scripts/kernel/api.mjs
      - modules/kernel/api.yaml
    reach: new-legs

  - id: sonar-slice-new-code
    effectiveAt: '2026-09-24T20:17:00+07:00'
    summary: "the Sonar proof is the slice's own, not the whole-project gate (nivo inc-f92febebbb64): the local project has no new-code baseline, so Sonar way judged the whole project as new code and no slice limited to its own paths could pass. scripts/checks/sonar-local.mjs scan (summary schema starci/sonar-local-scan@2) reads the slice's changed lines (--base, default HEAD, to the working tree inside --paths, plus untracked files) and passes when the processed analysis shows no open issue and no to-review hotspot on a changed line and the changed coverable lines meet the gate's new_coverage threshold (fewer than 20 are not held to it, like the server's ignoreSmallChanges); the whole-project gate is recorded as projectGate, a note and never a block (--project-gate restores it as the verdict). Coverage must come from a run of this attempt: a missing lcov, or one older than the head commit, a slice file or --fresh-since, is refused before the scan (COVERAGE_MISSING, COVERAGE_STALE), as are an analysis that imported no coverage (COVERAGE_NOT_IMPORTED), an empty slice (SLICE_EMPTY) and an unknown base (SLICE_BASE_UNKNOWN); refused exits 1. interface.implement and backend.implement pass --base and --paths after a fresh test:ci, and review.verify reads scope slice and outcome pass. Adds no api check or finding code; a running leg reports as it was admitted"
    ops: [interface.implement, backend.implement, review.verify]
    paths:
      - scripts/checks/sonar-local.mjs
      - modules/ops/ops/interface.implement.yaml
      - modules/ops/ops/backend.implement.yaml
      - modules/ops/ops/review.verify.yaml
      - knowledge/repository-baseline.yaml
    reach: new-legs

