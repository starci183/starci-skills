  - id: op-no-worktrees-no-links
    effectiveAt: '2026-09-25T07:40:00+07:00'
    summary: "SAFETY (nivo-fe inc-c8fbf76aa499, root cause): Devin op worker op-interface.implement-2a43f63c6c ran, through Git Bash, `git worktree add --detach D:/Repositories/nivo-fe-wt-r4 HEAD`, junctioned six node_modules of live nivo-fe into it (New-Item -ItemType Junction from a -File script after `cmd //c mklink /J` failed) and at 22:47:21Z (05:47 local) ran `git worktree remove --force` on it, which followed the junctions (and the @nivo/* workspace junctions inside the live node_modules) and deleted 674 live files. The shim logged nothing because it never saw a command: Git Bash (Git for Windows bin/bash.exe, and every login shell via /etc/profile) prepends /mingw64/bin and /usr/bin to the launch PATH, so the worker's git was the real git (the dispatch receipt shows the shim dir and the nivo-fe history hook were installed). Now: (1) the op git policy refuses `git worktree add|move|remove` (WORKTREE_NOT_OPS; remedy: work in the dispatched checkout, report a need); (2) every op launch sets BASH_ENV to runtime/guards/bin/bash-env.sh (scripts/guards/install.mjs), sourced by every non-interactive bash: it puts the shim dir first again and refuses `ln`, `cmd /c mklink`, PowerShell `New-Item -ItemType Junction|SymbolicLink|HardLink` inline or in a -File script (LINK_CREATE, exit 3, logged via shim.mjs refuse-link); (3) the reference-transaction history hook v3 refuses, for an op (STARCI_GUARD_FILE set), the first HEAD write of a NEW worktree - git writes it while the running checkout's own HEAD is unlocked - whatever git binary ran it (files ref format; owner override passes); (4) _common.yaml and the op packet say it: never create a git worktree, junction, symlink or hard link; (5) git's worktree removal cannot be hooked, so the kernel watchdog starts a detached, host-wide footprint scan (scripts/guards/footprint-scan.mjs, at most every 10 minutes) that flags NEW linked worktrees under the repositories root and NEW links whose target is in another top-level directory (runtime/guards/footprint.jsonl + supervisor event worker-footprint); it removes nothing"
    adds:
      codes:
        - WORKTREE_NOT_OPS
        - LINK_CREATE
    paths:
      - scripts/guards/git-policy.mjs
      - scripts/guards/shim.mjs
      - scripts/guards/install.mjs
      - scripts/guards/footprint-scan.mjs
      - scripts/kernel/watchdog.mjs
      - scripts/kernel/api.mjs
      - modules/ops/_common.yaml
      - tests/op-worktree-link-guard.spec.mjs
    safetyCritical: true
    reach: new-legs
  - id: input-draft-stale
    effectiveAt: '2026-09-25T08:15:00+07:00'
    summary: "Orca's input-box draft can be stale on its side: on the sn-foundation Kernel (term_da5f72b3, 2026-09-25) Orca reported the draft 'check status' that 8x Ctrl+U, Ctrl+E+Ctrl+U and Ctrl+C never changed while the box was empty on screen, so every wake was refused foreign-input / draft-stuck and the Kernel looked unreachable; a fresh send landed cleanly and the draft then read empty. The screen cannot tell (Orca blanks the input row of every screen read that carries a draft), so the box's answer to one Ctrl+U decides (scripts/kernel/clear-draft.mjs): a draft the FIRST Ctrl+U leaves unchanged (read twice) is draft-stale - recorded as draftNote 'draft-stale' + staleDraft on the wake result, the api nudge output and op-worker-nudged, and on quit-agent's result - never a refusal, and the text is typed as into an empty box (later frames ignore that same stale text; the delivery proof after the send stays the backstop). A draft that changes is real and keeps its protection: foreign text gets only that probe (probeDraft; the part cut from a one-row draft is typed back, draftProbe.restored; a row cut from a multi-row draft is reported as draftProbe.removed, never retyped) and refuses foreign-input; a runtime pile that shrinks but will not empty refuses draft-stuck. Used by wake-delivery (every Kernel and worker wake), the api nudge foreign-input check and quit-agent. For the owner (not filed): the likely cause is on Orca's side - its draft is the text after the cursor, so a Claude Code prompt suggestion drawn grey in an empty box reads as a draft (its placeholder filter covers only Codex's stock text); an Orca fix that leaves suggestion text out of `draft` would remove the probe's cost. Adds no check or finding code"
    paths:
      - scripts/kernel/clear-draft.mjs
      - scripts/kernel/wake-delivery.mjs
      - scripts/kernel/quit-agent.mjs
      - scripts/kernel/api.mjs
      - modules/kernel/api.yaml
      - tests/helpers/fake-orca.mjs
      - tests/input-draft.spec.mjs
    reach: new-legs
  - id: guard-app-router-literal-paths
    effectiveAt: '2026-09-25T08:45:00+07:00'
    summary: "the op git guard (scripts/guards/git-policy.mjs) cut every pathspec at its first `[` as a glob, so an op's OWN Next.js App Router paths (`apps/app/src/app/[locale]/(console)/route-pages.spec.tsx`, `.../[workspaceId]/...`, `.../[templateKey]/...`) were scoped to `src/app/` and refused PATH_NOT_OWNED on git add and commit, though owned-path admission grants them literally (nivo-fe wf-nivo-fe-debt-mug06w7h inc-21f76abb6d10, op-test.author-62f27a84ad). Now a segment engine/admission.mjs isAppRouterSegment reads as a route name (`[id]`, `[...slug]`, `[[...opt]]`, `(.)[id]`; `(group)` and `@slot` carry no glob character) is a literal directory to the guard, named verbatim in argv, in a --pathspec-from-file list (file or stdin) or as `:(literal)`. Git itself still reads a plain `[...slug]` as a character class (`src/app/[...slug]/page.tsx` also matched a peer's `src/app/l/page.tsx`; the history hook refused that commit COMMIT_FOREIGN_PATHS), so the shim hands git every such pathspec with `literal` magic (git-policy.mjs literalPathspec / literalAppRouterArgv: `:(literal)`, `:(top,literal)`, ...; a rewritten list goes to a private NUL-separated file for that one call); every other argument passes byte for byte. A pathspec that also carries a real glob (`src/app/[locale]/*.tsx`) or `:(glob)` magic keeps git's glob reading and is scoped from before its first `[`, as before. The guard only permits more and reaches running legs on their next git call; adds no check or finding code"
    paths:
      - scripts/guards/git-policy.mjs
      - scripts/guards/shim.mjs
      - tests/guard-app-router-paths.spec.mjs
      - tests/shared-checkout-guard.spec.mjs
    reach: new-legs
  - id: layout-tree-i18n-used-keys
