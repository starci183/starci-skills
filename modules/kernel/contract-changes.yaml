# contract-changes.yaml — the registry of contract changes and how far each one reaches.
#
# Owner, 2026-09-24: a contract change is never rolled onto running work. A running or already
# settled leg is judged and checked against the contract it was ADMITTED under (the contracts row
# api dispatch filed, with its recorded version: scripts/kernel/contract-version.mjs); new legs use
# the current contract. Each entry here is one change that ADDED checks or finding codes, or that
# must reach in-flight work:
#
#   id             stable slug, cited by api receipts (check advisory, contractFollowUps)
#   effectiveAt    ISO date-time the change landed on main; a leg admitted before it is "older"
#   commit         the runtime commit that landed it (provenance)
#   summary        one line: what changed
#   ops            the ops the change governs; empty or absent means every op
#   adds.checks    check names (api check `name`) the change introduced: red for an older leg is an
#                  advisory suspect, never a refusal
#   adds.codes     finding codes the change introduced (a check entry's `codes`, and
#                  shell-conformance --admitted-at): the same, per code
#   reach          new-legs (default): only legs admitted after effectiveAt carry it.
#                  follow-up: in-flight work must get it too - api status lists every older leg of
#                  followUp.ops as contractFollowUps and the Kernel enqueues followUp.op for each
#                  (api enqueue --contract-change <id> --follow-up-of <job> [--after <job>]); the
#                  running leg is never held
#   followUp       {op, ops, detail} for reach follow-up
#   safetyCritical true only when an older leg must meet the change too (a security or data-loss
#                  fix): the one case where it is not advisory
#
# The supervisor batches changes and registers each here in the same commit that lands it
# (modules/supervisor/supervise.yaml guardrails contract-rollout); it never tells a Kernel to hold
# running work for a change unless the change is safetyCritical.
schema: starci/contract-changes@1

