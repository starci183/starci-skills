schema: starci/module-kernel-gate-loosening@1
id: kernel.gate-loosening

# What "loosens a gate" means, mechanically (modules/kernel/roles.yaml rulings.loosening-always-red). scripts/lib/gate-loosening.mjs reads
# this table over the diff of one change (a land: base..head; the self-check: each commit since the last release against its parent).
# A change that loosens is always refused by the land gate and flagged by the `gate-loosening` self-check: there is no approval route
# (owner ruling loosening-always-red, 2026-10-22). An entry that only moves with a git rename of the paths it names is no loosening.

# Files whose lists and numbers are gates: a check, a rule, a protected path, a guard denial, a verdict condition.
gateFiles:
  - knowledge/hfs/runtime-slots.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/facts.yaml
  - modules/kernel/protected-zone.yaml
  - modules/kernel/command-policy.yaml
  - modules/kernel/verdict-contract.yaml
  - modules/kernel/op-incident-policy.yaml

# Files whose entries are exceptions: a list item added to one is a loosening.
allowlistFiles:
  - modules/kernel/allowlist.yaml

# A number of a gate file is a threshold when a word of its key (split on camelCase and - _ .) is listed: a lower value loosens a floor,
# a higher value loosens a ceiling.
thresholds:
  floors: [min, minimum, floor, required, threshold, score, coverage]
  ceilings: [max, maximum, limit, cap, tolerance, slack, allowed, budget]

# Product code: a deleted or weakened spec counts only together with a change to one of these.
productPrefixes: [scripts/, engine/, modules/, knowledge/, packages/, ui/, init/]

# Specs judged here: the scaffold e2e and the example apps' tests (the runtime has no specs of its own, owner ruling no-runtime-specs; the package
# specs were never judged here: an eslint RuleTester spec spells skip markers inside its code fixtures), and the markers that skip one.
specRoots: [e2e/, examples/]
skipMarkers: ['.skip(', 'skip: true', 'todo: true', '.todo(']
assertionMarkers: ['assert.', 'expect(']
