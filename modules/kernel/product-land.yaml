# Product worktrees and product-land (DESIGN §16.7, FMEA #20; owner rulings 2026-09-28: one worktree per workflow, one
# per op; worktrees at <product repo>/.starciwork/worktrees/<wf>/{_wf,<op>}; removed as soon as they are not needed).
# Read by scripts/kernel/product-worktree.mjs productSettings(), scripts/kernel/product-land.mjs, api product-land and
# scripts/kernel/api-status/imports.mjs. Every value has the same default in code.

# The isolation of an op whose brief sets no policy.isolation (owner 2026-09-28 "mỗi op 1 worktree": one model for
# every workflow). `worktree` applies to every op whose policy.commitPolicy COMMITS and whose owned paths land in one
# bound product repository (scripts/kernel/product-worktree.mjs isolationOf / planIsolation). Kept on the shared tree:
#   - Work-owner (ledger repo) only ops - scope.define, business.decide, brand.decide, architecture.decide,
#     decision.prepare, provision.ask, work.author, workspace.manage, test.author/backend.implement when their paths
#     are in the Work owner: the ledger and the Work records live in that checkout (reason work-owner-only);
#   - grammar.update and any op on the runtime repository (.claude): it changes only through its own land gate
#     (reason runtime-repo);
#   - ops that never commit (commitPolicy none): backend.scaffold, interface.scaffold, package.scaffold,
#     content.generate, docs.author, interface.asset, knowledge.repair, task.execute leave their product writes
#     uncommitted - a worktree is deleted right after the settle, so they would lose them; the verify/UAT/review walks
#     (uat.verify, uat.assisted.*, e2e.verify, integration.verify, perf.verify, security.verify, review.verify,
#     interface.audit, handover.review, release.deliver, runtime.operate, request.analyze, goal.revise, scope.finish)
#     write no product code and serve from the WORKFLOW worktree through the environment pre-step instead.
# An op brief can still set policy.isolation: shared (or worktree) itself.
defaultIsolation: worktree

worktrees:
  shortIdLength: 8              # <wf> and <op> directory / branch ids (Windows path length)
  opRemoveSlaMs: 60000          # an op worktree outliving its job's settle by more than this is an SLA miss (logged)
  archiveTtlMs: 604800000       # an archived op branch (refs/starci/archive/op/<op>) no continuation took, kept 7 days
  commandMs: 300000
  overlay:                      # the node_modules junction overlay of every worktree
    lockfiles: [package-lock.json, pnpm-lock.yaml, yarn.lock, npm-shrinkwrap.json]   # a change rebuilds the overlay
    maxDepth: 3                 # how deep workspace dirs holding a node_modules are looked for
  ports: {base: 43100, span: 800}   # the dev-server/UAT port of a workflow worktree: base + hash(path) % span

integrate:                      # an op's green settle into its workflow branch (per-workflow lock)
  lockWaitMs: 600000
  recheck: declared             # declared = re-run the op's re-runnable declared checks on the workflow branch; none
  recheckTimeoutMs: 300000
  importCheck: changed-files    # the op's changed files must import only existing paths after the merge
  depsFiles: [package.json, package-lock.json, pnpm-lock.yaml, yarn.lock, npm-shrinkwrap.json, pnpm-workspace.yaml]

land:                           # wf/<wf> -> the product's main (per-repository serial queue)
  lockWaitMs: 1800000
  checks: []                    # [{name, argv: [..]}] run in the land scratch (no shell); none by default
  importScan: true              # red when the merged result has more broken imports than main had
  push: false                   # push main after a land (api product-land --push asks for one land)
  syncWorkflowAfterLand: true   # fast-forward wf/<wf> to the new main
  maxMainRetries: 3

deps:                           # the workflow's serial deps unit (api product-deps; product-worktree.mjs applyDepsUnit)
  installTimeoutMs: 1200000
  install:                      # the first lockfile present at the _wf root picks the install (argv, no shell)
    package-lock.json: [npm, ci]
    pnpm-lock.yaml: [pnpm, install, --frozen-lockfile]
    yarn.lock: [yarn, install, --frozen-lockfile]

invariant:
  importsCacheMs: 300000        # api status importsBroken: one scan per tree state within this window
