# Workflow worktrees and the land (owner decision WFWT, final: ONE Orca-owned worktree per Kernel workflow; the per-op
# worktree and its node_modules junction overlay are gone). Read by scripts/lib/worktree-registry.mjs worktreeSettings(),
# and scripts/kernel/api-status/imports.mjs (invariant.importsCacheMs). Every value has the
# same default in code.

worktrees:
  capPerRepo: 10                # live runtime worktrees per repository; a workflow over it waits for its Kernel launch
  ownerGoneMs: 1800000          # the GC removes a tree whose owner has been gone this long (after preserving it)
  gcEveryMs: 300000             # the reconciler GC controller's worktree pass (key gc:worktrees, always active)
  commandMs: 300000

invariant:
  importsCacheMs: 300000        # api status importsBroken: one scan per tree state within this window
