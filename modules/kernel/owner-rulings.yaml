    ruling: >-
      Lite uses Supabase and has no self-hosted Postgres. A sidecar that needs a database uses SQLite
      on a declared persistent volume; a sidecar requiring Postgres, Redis or Mongo is refused.
    supersedes: []
    enforcedBy: [R276]

  - id: sealed-secret-custody
    date: '2026-10-14'
    topic: security.secret-custody
    status: live
    ownerRuling: 5
    source: A15-STANDARD section 0.1 item 5
    ruling: >-
      Product secrets exist only as sops/age sealed .starcistacks/<env>/secrets/*.enc members.
      Plaintext secret files are never tracked, placed in deploy/ or put in a workflow; the private age
      identity is held only as SOPS_AGE_KEY in the owner's untracked .claude/secret.env.
    supersedes: [platform-age-file-custody]
    enforcedBy: [R06, R253, R277]

  - id: typed-app-environment
    date: '2026-10-14'
    topic: code.be-environment
    status: live
    ownerRuling: 7
    source: A15-STANDARD section 0.1 item 7
    ruling: >-
      Every back-end app has apps/<app>/src/<app>.env.ts with an interface and read<App>Env(env: EnvSource).
      The app reads its environment through that boundary; main.ts delegates and holds no parsing of its own,
      and app.module.ts spreads composition groups instead of holding an inline module list.
    supersedes: [R245]
    amendmentScope: The optional inline parsing clause of R245; the other app-role restrictions remain in force.
    enforcedBy: [R248, R289]

  - id: fe-auth-only
    date: '2026-10-13'
    topic: security.fe-data-door
    status: live
    ownerRuling: 8
    source: A15-STANDARD section 0.1 item 8; knowledge/hfs/rules.yaml R212 cases.case-2
    ruling: >-
      The front end uses Supabase for Auth only and accesses application data through the back end.
      The front-end client boundary and the database grants, policies and realtime publication boundary
      enforce this decision; declared direct-access exceptions are explicit and listed.
    supersedes: []
    enforcedBy: [R217, R254]

  - id: graphql-default-door
    date: '2026-10-13'
    topic: code.be-transport
    status: live
    ownerRuling: 9
    source: A15-STANDARD section 0.1 item 9
    ruling: >-
      GraphQL is the default application door. REST is reserved for probes, auth handshakes, signed
      webhooks, byte streams and the public v1 table; the reason and route evidence apply in both editions.
    supersedes: []
    enforcedBy: [R278, R290]

  - id: owner-run-steps
    date: '2026-10-14'
    topic: deploy.owner-steps
    status: live
    ownerRuling: 10
    source: A15-STANDARD section 0.1 item 10
    ruling: >-
      DNS changes, provider URIs, docker swarm init and key rotation remain owner-run steps.
      The standard requires those steps and their evidence to be declared and never automates them.
    supersedes: []
    enforcedBy: [R266, R267]

  - id: lite-contract-specs
    date: '2026-10-14'
    topic: proof.lite-contract
    status: live
    source: A15-STANDARD section 2.2 decision 1
    ruling: >-
      Lite may have tests/contract and test:contract. The owner's HFS standard relaxes the older contract
      refusal in R212, be.tests.contract and edition.mjs; e2e, stack and browser runs remain full-only.
    supersedes:
      - {rule: R212, case: case-1}
    amendmentScope: The lite contract-world prohibition only; the full-only e2e boundary remains.
    enforcedBy: [R212]

  - id: lite-webhook-after-commit
    date: '2026-10-14'
    topic: code.be-webhook-handoff
    status: live
    source: A15-STANDARD section 2.2 decision 2
    ruling: >-
      Lite webhook intake records its receipt and typed outbox event in the transaction. A reactor or job
      processes the event after commit; processing never runs inside the intake transaction.
    supersedes: []
    enforcedBy: [R263]

  - id: locale-accept-language
    date: '2026-10-14'
    topic: code.fe-locale-header
    status: live
    source: A15-STANDARD section 2.2 decision 3
    ruling: >-
      The single front-end locale writer sends Accept-Language, and back-end localization reads that
      header; the previous custom locale header is retired in templates, lint and examples.
    supersedes: []
    enforcedBy: [R50]

  - id: lite-fe-app-cardinality
    date: '2026-10-14'
    topic: code.fe-app-cardinality
    status: live
    source: A15-STANDARD section 2.2 decision 4
    ruling: Lite may have more than one front-end app; the earlier single-app wording is removed.
    supersedes: []
    enforcedBy: [R212]

  - id: code-function-feature-budgets
    date: '2026-10-14'
    topic: code.size-budgets
    status: live
    source: A15-STANDARD section 2.2 decision 5
    ruling: A function is at most 80 lines in back-end and front-end code, and a feature holds at most 250 files.
    supersedes: []
    enforcedBy: [R291, R292]

  - id: observability-required-signals
    date: '2026-10-14'
    topic: observability.required
    status: live
    source: A15-STANDARD section 0.2 observability decisions
    ruling: The logger port, live and ready probes, and Docker HEALTHCHECK are mandatory in both editions.
    supersedes: []
    enforcedBy: [R40, R71, R189, R262]

  - id: observability-deferred-signals
    date: '2026-10-14'
    topic: observability.deferred
    status: live
    source: A15-STANDARD section 0.2 observability decisions; section 6
    ruling: >-
      Request-id correlation, metrics and tracing are outside alpha.15; their mandatory status remains
      pending an owner decision and creates no new alpha.15 failure code.
    supersedes: []
    enforcedBy: []
    gap: P2 owner decision pending; no mandatory request-id, metrics or tracing enforcer is scheduled.

  - id: fe-error-reporter-optional
    date: '2026-10-14'
    topic: observability.fe-reporter
    status: live
    source: A15-STANDARD section 0.2 observability decisions
    ruling: >-
      A front-end error reporter is documented optional and declared through hfs.json observe.reporter;
      FE_OBSERVE_MISSING is not introduced unless the owner makes the reporter mandatory.
    supersedes: []
    enforcedBy: []
    gap: Optional declaration only; no missing-reporter finding is authorized.

  - id: lite-work-brand-only
    date: '2026-10-14'
    topic: work.lite-boundary
    status: superseded
    source: knowledge/hfs/rules.yaml R212 cases.case-4 quote and amended ruling
    ruling: The initial restriction to brand records was clarified to permit .gitignore and optional workspace.yaml too.
    supersedes: []
    amendedBy: [R212/case-4]
    enforcedBy: [R212]

  - id: platform-age-file-custody
    date: '2026-10-14'
    topic: security.age-key-custody
    status: superseded
    source: knowledge/patterns/repo/secrets.yaml provenance.limitations and REPO-SECRETS-4; A15-STANDARD section 3 seeds
    ruling: >-
      The dated repository-secrets guidance retained the platform default age identity file outside Git.
      The standard replaces that custody guidance with SOPS_AGE_KEY in .claude/secret.env.
    supersedes: []
    amendedBy: [sealed-secret-custody]
    enforcedBy: [R253]

  # Earlier kernel and drawing decisions cited by the specs retain stable owner ids.
  - id: handover-owner-approval
    date: '2026-09-23'
    source: modules/ops/ops/handover.review.yaml proofs.owner-approval
    ruling: A workflow finishes only after the owner's approve receipt for its latest handover review; feedback and questions do not approve it.
    supersedes: []
    enforcedBy: [scripts/kernel/handover.mjs]

  - id: credential-build-placeholders
    date: '2026-09-23'
    source: modules/ops/_common.yaml Bounded finish and blockers; modules/kernel/driver-loop.yaml verdictTable[].provisionAsk
    ruling: Missing credentials do not stop build work; builds use declared placeholders and report credentialPending, while live proof waits for the required credentials.
    supersedes: []
    enforcedBy: [modules/kernel/driver-loop.yaml, scripts/kernel/report-envelope.mjs]

  - id: owner-language-logs
    date: '2026-09-23'
    source: modules/kernel/driver-loop.yaml boundary.language
    ruling: Code and identifiers are English; kernel and op logs and owner-facing narration use the language configured in config.yaml.
    supersedes: []
    enforcedBy: [modules/kernel/driver-loop.yaml]

  - id: drawing-owner-parts
    date: '2026-09-24'
    source: modules/ops/ops/interface.draw.yaml proofs.owner-sees-parts
    ruling: The owner reviews each drawn part; composites remain implementation and audit evidence, and owner-facing images select the part even when an older record names its composite.
    supersedes: []
    enforcedBy: [scripts/work/direction-part.mjs, scripts/kernel/ask-images.mjs, scripts/connectors/telegram-media.mjs]

  - id: drawing-light-device-matrix
    date: '2026-09-24'
    source: modules/ops/ops/interface.draw.yaml proofs.shell-conformance
    ruling: Every drawing set covers desktop and mobile in the light theme for each drawn state; dark-theme drawings are optional.
    supersedes: []
    enforcedBy: [scripts/work/ui/shell-conformance.mjs]
  - id: gate-loosening-05bab95ace66
    date: '2026-10-15'
    ruling: "Declared by main under the owner's delegation of 2026-10-14; owner to ratify. Nine authored JSON files are declared in modules/kernel/allowlist.yaml json-exceptions, each by its exact path with a reason: four English i18n message catalogs (examples/lite-app and three FE skeleton templates), the npm scripts fragment packages/hfs/templates/app/package-scripts/supabase.json that renders into package.json (a tool-mandated format), and four environment.json files (the lite example production descriptor and the skeleton and skeleton-lite templates), the canon-named value-free rendered descriptor of knowledge/hfs/slots.yaml:707. The six lite swarm recovery and release records were converted to YAML instead."
    supersedes: []
    enforcedBy: [scripts/checks/check-json-exceptions.mjs]

  - id: ambient-id-test-world-exemption
    date: '2026-10-16'
    source: knowledge/hfs/rulings.yaml ambient-id-test-world-exemption; packages/eslint/be/ambient-id.mjs
    ruling: The test world (slot be.tests.world) keeps its exemption from BE_AMBIENT_ID, like the clock rule, because it is the composition root of tests and names real resources; the catalog law of R142 is amended to say so. Owner words "Theo y tro" (alpha.18 single release, relayed by main, a17 PROPOSALS section D).
    supersedes: []
    enforcedBy: [packages/eslint/be/ambient-id.mjs]

  - id: module-definition-everywhere
    date: '2026-10-15'
    source: knowledge/hfs/rulings.yaml module-definition-everywhere; knowledge/patterns/be/folder.yaml BE-FOLDER-3
    ruling: Every NestJS module has a module definition (capability, sub-module, feature, transport module, cli group, integration), built with ConfigurableModuleBuilder and registered with XModule.register(...); the clause that forbade a module-definition in an api feature is superseded.
    supersedes: []
    enforcedBy: [packages/eslint/be/module-shape.mjs, scripts/hfs/architecture/module-per-transport.mjs]

  - id: graphql-13-advisory-accepted-until-a19
    date: '2026-10-16'
    source: knowledge/hfs/canon-pins.yaml '@nestjs/graphql' and '@nestjs/apollo'; packages/hfs/CHANGELOG.md Unreleased (a18 pins)
    ruling: 'npm audit (--omit=dev --audit-level=high) reports high advisories on @nestjs/graphql and the pinned @nestjs/apollo (and @graphql-tools/utils through them) whose fix is 14.0.3, a semver major. The canon keeps both packages on their current major for alpha.18 as a documented accepted advisory; the major upgrade is deferred to alpha.19. The advisories fixed by non-major bumps are taken in alpha.18: the next, axios and @nestjs/platform-express pins of knowledge/hfs/canon-pins.yaml. Owner words "Theo y tro" (delegation relayed by main, 2026-10-16).'
    supersedes: []
    enforcedBy: [scripts/checks/check-canon-pins.mjs]

  - id: credential-guarded-rest-door
    date: '2026-10-16'
    source: knowledge/hfs/rulings.yaml credential-guarded-rest-door; packages/eslint/be/operations.mjs
    ruling: A REST route that serves an external machine client (n8n, loyalty till, external API, agent tools) and is protected by a credential guard satisfies the evidence of BE_REST_DOOR_EVIDENCE and BE_REST_ROUTE_UNDECLARED through that guard, so its wire format is not forced into the defineOperations contract. The declaration is the route's or its controller's @Credential({ kind }) decorator from the domain identity capability, and the same capability declares a CredentialGuard implementing CanActivate, both resolved by TypeScript symbol. Anonymous public REST routes still need a closed PublicReason and an unguarded route still fails. Theo y tro (the owner delegated the decision to main, 2026-10-16).
    supersedes: []
    enforcedBy: [packages/eslint/be/operations.mjs]

  - id: auth-callback-email-link
    date: '2026-10-17'
    source: knowledge/hfs/rulings.yaml auth-callback-email-link; packages/eslint/fe/callback-shape.mjs
    ruling: A Supabase auth callback route owned by the auth module may perform exactly one exchangeAuthCode(code) and, for an email confirmation or recovery link, one awaited verifyOtp({ token_hash, type }) built from the query values token_hash and type. Nothing else is added to the callback. Owner words "Theo y tro" (the owner delegated the decision to main, 2026-10-17).
    supersedes: []
    enforcedBy: [packages/eslint/fe/callback-shape.mjs]

  - id: auth-callback-pure-helpers
    date: '2026-10-17'
    source: knowledge/hfs/rulings.yaml auth-callback-pure-helpers; packages/eslint/fe/callback-shape.mjs
    ruling: The auth callback may call pure helpers (synchronous, text-returning, no await and no I/O, found by symbol resolution) imported from the app's modules/routes or modules/auth to compute the redirect target and validate next, may use static route tables of modules/routes, and may branch on the exchange outcome's success or ok flag. A helper that does I/O, awaits or imports outside those owners is refused. Owner words "Theo y tro" (the owner delegated the decision to main, 2026-10-17).
    supersedes: []
    enforcedBy: [packages/eslint/fe/callback-shape.mjs]

  - id: oauth-redirect-not-webhook
    date: '2026-10-17'
    source: knowledge/hfs/rulings.yaml oauth-redirect-not-webhook; packages/eslint/be/webhooks.mjs
    ruling: 'A third-party OAuth redirect into the API, a GET route with @Public({ reason: PublicReason.AuthHandshake }) on a path that is not a webhook or events path, is not judged as a webhook door by BE_WEBHOOK_SCOPE. A POST, a webhook or events path, another reason and every SignedWebhook route stay judged. Owner words "Theo y tro" (the owner delegated the decision to main, 2026-10-17).'
    supersedes: []
    enforcedBy: [packages/eslint/be/webhooks.mjs]

  - id: webhook-receipt-port
    date: '2026-10-17'
    source: knowledge/hfs/rulings.yaml webhook-receipt-port; packages/eslint/be/lib/webhook-handoff-intake.mjs
    ruling: A call on a domain receipt port inside the receipt transaction of a webhook intake is the inbox record and not processing. A receipt port is a domain class with no base class whose constructor takes only platform ports and TypeORM, one of them the platform Inbox. A call on another domain service, a bus or a process callback inside the transaction is still processing, and BE_WEBHOOK_SCOPE now says so in its own finding. Owner words "Theo y tro" (the owner delegated the decision to main, 2026-10-17).
    supersedes: []
    enforcedBy: [packages/eslint/be/lib/webhook-handoff-intake.mjs]
  - id: no-runtime-specs
    date: '2026-10-17'
    source: "the owner (thay) in chat, relayed by the main coordinator to the a19 drop-runtime-specs lead"
    ruling: "The owner's words: \"Tests in packages/ and examples/ stay; the .claude runtime's own specs are removed entirely; delete codecov. Real tests (package clean-test + scaffold e2e) decide.\" Amended the same day: codecov stays for packages/ and examples/ (the example flags, the hfs template codecov.yml, the example uploads); only the runtime coverage goes (the runtime flag and the runtime lcov chain). Added the same day: no runtime tests in .claude contributions - a spec that exercises the runtime's own code (scripts/, modules/, the kernel, supervisor and work graph, checks, gates, CLI internals) outside packages/ and examples/ is refused; the scaffold e2e (e2e/) is the one exception. Recorded as: tests/ deleted; starci runtime verify, git land, runtime deploy, the release cut and release check prove a commit by the runtime check, the package clean-test and the scaffold e2e; a rule whose spec proof was a runtime spec carries specNa citing this ruling; RT_SPEC_PLACEMENT refuses a runtime test."
    supersedes: []
    enforcedBy: [scripts/hfs/runtime-rules/test-layout.mjs, scripts/reconciler/runtime-verify.mjs, scripts/gates/runtime-tests.mjs, scripts/gates/scaffold-e2e.mjs, scripts/checks/lib/coverage-rules.mjs, scripts/guards/release-definition.mjs]
  - id: gate-loosening-e0b604204f6a
    date: '2026-10-17'
    ruling: "The a19 gates commit removes from the protected zone test-policy the paths of the deleted runtime specs and their selection (scripts/lib/spec-deps.mjs, tests/guards/**, tests/machine/host-lock.spec.mjs, tests/setup/**) and protects the real tests instead (scripts/gates/runtime-tests.mjs, scripts/gates/scaffold-e2e.mjs, e2e/**), under the owner ruling no-runtime-specs; the owner approved it in chat to the main coordinator (\"tests in packages and examples stay; runtime specs removed; delete codecov; no runtime tests in contribution\"), relayed to the a19 lead with the instruction to record these approvals."
    enforcedBy: [modules/kernel/protected-zone.yaml]
  - id: gate-loosening-64f16c52431a
    date: '2026-10-17'
    ruling: "The a19 checks commit removes rule R226 and its spec-budget enforcer, the runtime.tests, runtime.tests-proof-settle and runtime.brand-sources-replay slots, the spec-budget and spec-cache-key self-checks, and every runtime-spec entry of the rule catalog's proves, exemplifiedBy and witness lists (the rows they proved carry specNa, exampleNa or an unreachable witness citing owner:no-runtime-specs), under the owner ruling no-runtime-specs; the owner approved it in chat to the main coordinator (\"tests in packages and examples stay; runtime specs removed; delete codecov; no runtime tests in contribution\"), relayed to the a19 lead with the instruction to record these approvals."
    enforcedBy: [knowledge/hfs/rules.yaml, knowledge/hfs/runtime-slots.yaml]

