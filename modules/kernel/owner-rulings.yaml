  - id: gate-loosening-e77ca91cded7
    date: '2026-10-16'
    ruling: >-
      The owner's words are "Theo y tro (chot alpha.18)", relayed by main for the single alpha.18 release (the a17 PROPOSALS approved as recommended, PROPOSALS.md section D, R155).
      R155 (BE_PATTERN_SPEC_MISSING) applies to both editions (tests/hfs/hfs-lite-proof-lane.spec.mjs). Its catalog row names the full-edition enforcer hfs:pattern-spec-missing
      (patternSpecFindings, which returns no findings for lite); the lite emitter is hfs:lite-proof-lane (liteProofLaneFindings), previously absent from the rule.
