# owner-rulings.yaml — the owner's standing rulings, by stable id, so evidence can cite them.
#
# A drawing's rationale.json (scripts/checks/draw-rationale.mjs) cites an owner ruling as `owner:<id>`; the id must
# resolve here, to a contract change id (modules/kernel/contract-changes.yaml), to a note of the ui record's
# ui.review.feedback, to a brand.direction.learned id, or to an answer receipt. An entry is what the owner ruled, in
# one sentence, with the date and where it is enforced; it is never a runtime opinion. Add an entry in the commit that
# lands the ruling.
schema: starci/owner-rulings@1

rulings:
  - id: draw-shapes-only
    date: '2026-09-27'
    ruling: interface.draw draws SHAPES only - one image per XBase#state; data statuses (loading, empty, error, forbidden, 401/403/404) render by recipe through SlotView and are never drawn.
    enforcedBy: [scripts/checks/ui-shapes.mjs, scripts/checks/draw-quality.mjs]
  - id: draw-content-region-only
    date: '2026-09-27'
    ruling: A drawing is the XBase content region only, never the full page with its layout chrome.
    enforcedBy: [scripts/checks/draw-quality.mjs]
  - id: draw-token-render
    date: '2026-09-27'
    ruling: Drawing is token-render HTML/CSS in the Grammar's tokens captured by Playwright; the brief loads all of knowledge/ui and the grammars with values resolved to numbers carrying rule ids.
    enforcedBy: [scripts/work/draw-render.mjs, scripts/checks/ui-proof-brief.mjs]
  - id: heroui-defaults-first
    date: '2026-09-27'
    ruling: HeroUI and Grammar defaults come first; the canvas stays the HeroUI grey and brand tweaks come later, by owner ruling only.
    enforcedBy: [knowledge/ui/examples/brand-direction.nivo.yaml]
  - id: draw-dna-only
    date: '2026-09-27'
    ruling: Compose only the Grammar's DNA components - a notice is Alert, a ratio is Meter; anything DNA lacks is a grammar proposal, never an inline invention.
    enforcedBy: [scripts/checks/draw-dna.mjs]
  - id: icon-tile-neutral
    date: '2026-09-27'
    ruling: Identity IconTiles are neutral, never accent-tinted.
    enforcedBy: [knowledge/ui/composition/accent.yaml]
  - id: alert-white-surface
    date: '2026-09-27'
    ruling: The Alert has a white surface with a small tone indicator beside a tone-coloured title - no tone-filled background, no IconTile inside; its action is the grammar's standard Button variant secondary.
    enforcedBy: [scripts/checks/draw-dna.mjs]
  - id: meter-segments-h1
    date: '2026-09-27'
    ruling: The segmented capability Meter is the grammar's Meter segments on a full-width h-1 (4px) track with N equal segments.
    enforcedBy: [knowledge/grammars/starci/DNA.yaml]
  - id: buttons-pill
    date: '2026-09-27'
    ruling: Buttons are pills (HeroUI rounded-3xl).
    enforcedBy: [knowledge/grammars/starci/DNA.yaml]
  - id: card-radius-bound
    date: '2026-09-27'
    ruling: A card's radius is what the HeroUI and Grammar CSS actually bind (1rem in the Nivo render).
    enforcedBy: [scripts/checks/grammar-geometry.mjs]
  - id: grammar-gaps-0.6.0
    date: '2026-09-27'
    ruling: "thêm hết - add every grammar gap the real-component prototype found: the ink artwork band with the orbit motif, the unlabelled Divider, the DescriptionList stat strip, the Alert action icon, asset-slot props on Image/MediaFrame, the SectionHeader count and source meta, the off TagGroup chip, the quiet (ghost) IconButton, the PinnedActionBar, and data-component on every grammar root (@starci/grammar 0.6.0)."
    enforcedBy: [packages/grammar/CHANGELOG.md, knowledge/grammars/starci/DNA.yaml, knowledge/ui/examples/brand-direction.nivo.yaml]
  - id: secondary-input-contrast-accepted
    date: '2026-09-27'
    ruling: The low contrast of a secondary input's fill is accepted (COLOR-3 case-6).
    enforcedBy: [knowledge/ui/proof/contrast.yaml]
  - id: nivo-main-colour-ink
    date: '2026-09-27'
    ruling: The Nivo main colour is ink black #040d1c, not red; red is for artwork and danger only.
    enforcedBy: [knowledge/ui/examples/brand-direction.nivo.yaml]
    confirmed: '2026-09-27 - owner answered "chốt" in the desktop chat; pendingRulings main-colour is ruled'
  - id: one-version-owner-review
    date: '2026-09-27'
    ruling: ONE careful version per shape reaches the owner, reviewed on Telegram; feedback redraws until golden.
    enforcedBy: [scripts/work/draw-review.mjs, scripts/work/draw-feedback.mjs]
  - id: draw-devin-brand-claude
    date: '2026-09-27'
    ruling: interface.draw is drawn by Devin (Codex the fallback) and brand.decide (brand and direction) is decided by Claude (Codex the fallback); the draw loop's independent critic is a different model from the drawer - Codex when Devin draws.
    enforcedBy: [modules/models/runtimes.yaml, modules/models/registry.yaml, scripts/work/draw-critic.mjs]
  - id: draw-rationale-evidence
    date: '2026-09-27'
    ruling: Every drawn shape ships evidence for every decision - rationale.json (element, layout, every gap, padding, type and radius with its rule id and FR/content reason) and an annotated redline render; the owner critiques from evidence, never taste.
    enforcedBy: [scripts/checks/draw-rationale.mjs, scripts/work/draw-render.mjs]
  - id: supervisor-mission
    date: '2026-09-28'
    ruling: "The [Supervisor] monitors, manages, messages and adjusts every workflow to the finish on autopilot ('giám sát, quản lý, gửi thư tới, điều chỉnh'): it acts on every stuck item itself (resolve --by supervisor, lane fixes, notices, re-plan dispositions, archive), and asks the owner nothing but the final credentials step and the handover; the owner gets only a periodic digest."
    enforcedBy: [modules/supervisor/supervise.yaml, modules/supervisor/supervisor-prompt.md, scripts/supervisor/actions.mjs, scripts/supervisor/tick.mjs]
  - id: supervisor-self-learning
    date: '2026-09-28'
    ruling: "The Supervisor upgrades .claude by trial and error and records everything in the self-learning ledger, owner feedback included as lessons weighted above its own. Routine fixes it lands itself (bug fixes in checkers/scripts/runtime, checker calibration with a wrongly-blocked example spec, grammar additions/fixes and their npm publish (auto-approved by the owner 2026-09-28), brief/prompt improvements, throughput tuning within owner caps); only IMPORTANT upgrades (owner rulings, brand direction, knowledge rule meaning, removing or weakening a gate class, op-graph/kernel-contract architecture, budget/cap increases, anything external or irreversible) go to the owner first as a concise proposal that blocks nothing else. Never relax a check without a wrongly-blocked example; revert on measured regression; a daily cap on autonomous landings; full audit."
    enforcedBy: [scripts/supervisor/lessons.mjs, modules/supervisor/supervise.yaml, modules/models/runtimes.yaml]
  - id: supervisor-machine-log
    date: '2026-09-28'
    ruling: "The Supervisor writes the machine's root log: every observation, decision, action, message and experiment as a typed log row in the supervisor ledger, served read-only to the ui."
    enforcedBy: [scripts/supervisor/sup-log.mjs, ui/supervisor.mjs, ui/CONTRACT.md]
  - id: ram-aware-concurrency
    date: '2026-09-28'
    ruling: 'Parallelism follows real RAM ("Trần song song theo RAM thật"): below 10% free RAM fewer ops run in parallel - no new heavy op below the top priority (resume above 15%), below 2.5% no new heavy op at all (resume above 5%), fit floor 2.5% (lowered 2026-09-28: "15→10, 10→2.5") - so the host never freezes and kills ops mid-run; maxParallelOps 20 stays the ceiling and running ops are never stopped.'
    enforcedBy: [scripts/lib/ram-throttle.mjs, scripts/kernel/api.mjs, scripts/supervisor/land.mjs, modules/models/runtimes.yaml]
  - id: fe-canon-first
    date: '2026-09-28'
    ruling: The FE refactor workflow (nivo wf-nivo-fe-canon-mujek980) runs up to 15 parallel code.refactor slices first; the other workflows ramp up in what is left, and their heavy ops are delayed before the prioritized workflow's under the RAM throttle.
    enforcedBy: [modules/models/runtimes.yaml, scripts/lib/ram-throttle.mjs, scripts/supervisor/ram-cap.mjs]
  - id: autopilot-run-to-finish
    date: '2026-09-28'
    ruling: "Run to the finish in one go; don't stop to ask the owner - not even UX/UI review. Machine-gated drawings and directions are accepted provisionally (by autopilot, never golden), runtime/process gates and retry caps go to the Supervisor, credentials/real money/shared external systems are deferred to handover on sandbox/stub paths with ONE end-of-flow credential checklist (\"hạn chế provision ask\"), and the owner reviews everything once at handover; ugly UX/UI is re-run in one batch."
    enforcedBy: [scripts/kernel/autopilot.mjs, modules/models/runtimes.yaml, scripts/kernel/api.mjs, scripts/work/draw-review.mjs, scripts/work/brand-direction.mjs, scripts/checks/brand.mjs]
  - id: grammar-publish-auto-approve
    date: '2026-09-28'
    ruling: "Publishing @starci/grammar to npm needs no owner approval (\"lần sau đừng xin duyệt nữa ... auto approve\"): after a grammar change lands, bump the semver (additive → minor, fix → patch), date the CHANGELOG entry, land, build and publish, then tell the owner in the digest. Credentials stay the owner's: publishing uses the npm login the owner already holds; never create, enter or rotate a token."
    enforcedBy: [packages/grammar/package.json, packages/grammar/CHANGELOG.md, scripts/supervisor/lessons.mjs]
