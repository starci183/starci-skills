      The owner's words are "truoc luc tat may thi xoa sach nhung test khong co y nghia nhu fake orca, chap nhan coverage thap hon; giu nhung specs dang giu, va phai giai thich vi sao";
      the delegation is "theo y tro di, thay cho phep khoi hoi". Under that delegation the lead's completed independent body and replacement review approves exactly the v4 narrowed prune on integration 8da72049bd3c0269c3c17d20aeea448ca2424b9a:
      71 original-hash-qualified tests (D1 call/stand-in relay, D2 proved replay duplicate, D3 source-text duplicate, D4 empty literal/cardinality proof), recorded in ../../starci-tmp/codex/alpha9-prune-final-v4-candidates.json relative to the lane root.
