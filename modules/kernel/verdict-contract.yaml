# ============================================================================
# TINKLE-9 / WAVE2-w1 — modules/kernel/verdict-contract.yaml
# Brief: ex-testing/briefs/tinkle/tinkle-9.md + ex-testing/briefs/wave2/w1.md.
#
# The output schema of an ephemeral [Op] agent: the verdict enum and its
# semantics, the evidence paths a verdict must stand on (and the byte-level
# checks that prove them), and the free-text suspicion channel that maps a
# mid-flight wrongness back to goal.revise. Then the other half: what the
# spine ACCEPTS and what it REJECTS — the kernel's side of the contract.
#
# Two layers, kept distinct everywhere below:
#   REPORT outcome — what the agent claims: done|partial|failed|ask|blocked
#                    (kernel/reports.mjs OUTCOMES; schema starci/op-report@1)
#   KERNEL verdict — what the kernel judges: pass (reproduced) / fail
#                    (couldn't reproduce, or red proof) / blocked (owner or
#                    boundary needed) — this is the `returns.verdict` of
#                    dispatch.yaml and the input to driver-loop.yaml's table.
#
# Sources (all under .claude/, relative to the skill root):
#   kernel/reports.mjs    — OP_REPORT/WORKFLOW_REPORT schemas, OUTCOMES,
#                           BLOCKER_KINDS, SIGNALS, buildReport, validateReport
#   kernel/verify.mjs     — changedFiles, attributedFiles, machineVerify,
#                           validateAccepted, recordVerdict, treeVerdictFor
#   kernel/engine.mjs     — settled(), settleStoppedOperation (last-words and
#                           stopped-attempt rules), incident budgets
#   kernel/terminals.mjs  — writeLastWordsReport ('done' never honoured),
#                           infrastructureCause
#   kernel/goal.mjs       — reviseGoal, validateGoalRevision,
#                           propagateInvalidation, adoptReportRev
#   model/kinds.yaml      — routes: (the outcome->route table)
#   scripts/checks/check-work-artifacts.mjs — ASSET_MISSING/EMPTY/MAGIC/
#                           STAMP/DIGEST, RUN_MEDIA_FAKE, RECEIPT_ORPHAN
#   scripts/checks/check-work-deep.mjs      — DEP_STALE / NORM_UNRECORDED
#   modules/goal/legality.yaml — backwardEdges.suspicionLevels, ambiguityRules
# ============================================================================

schema: starci/module-kernel-verdict@1

about:
  kind: verdict-contract
  businessQuestion: >-
    "When an ephemeral op agent finishes, what shape must its answer take for
    the kernel to believe it — and when the agent says 'something here is
    wrong', where does that doubt go?"
  businessAnswer: >-
    One typed report, file first and signal second, bound to the exact
    dispatch that produced it. The agent claims an outcome; the kernel
    re-proves it. Doubt is a first-class field, not a side-channel: suspicion
    text becomes a backward edge to the boundary that owns the wrongness.
  sources:
    - kernel/reports.mjs
    - kernel/verify.mjs
    - model/kinds.yaml

# ============================================================================
# 1 — THE AGENT'S OUTPUT. The packet's `returns` block, spelled out.
# ============================================================================
returns:
  verdict:
    enum: [pass, fail, blocked]
    semantics:
      pass: >-
        The agent claims the work complete — maps to report outcome `done`.
        Owes: at least one check that actually ran and exited 0, no open
        items, every claimed file inside the allowlist. The kernel still
        re-runs the checks itself; 'pass' is accepted only when the kernel
        could reproduce it (kernel/reports.mjs validateReport done-rules;
        kernel/kernel.mjs 'done is never taken on trust').
      fail: >-
        The work ran and is red — maps to outcome `failed` (a failing check
        or an honest summary required), or `partial` (unfinished, open items
        listed for the next attempt). Also the shape of a red proof leg:
        uat/e2e/perf red reports `failed` and routes to lane.build repair.
      blocked: >-
        Progress needs something outside the grant — maps to outcome
        `blocked` (typed blocker required, kind one of BLOCKER_KINDS:
        shared-change, srs-gap, sds-gap, interface-gap, brand-gap,
        grammar-gap, environment, authority) or `ask` (a question the kernel
        may answer only from offered options, else needUser).
    note: >-
      The packet's three-value enum is the agent-facing compression. On the
      wire it is the five-value OUTCOMES enum of starci/op-report@1; the
      driver collapses partial->fail(retry-with-open-items) and ask->blocked
      (needUser) in the verdict table (driver-loop.yaml verdictTable).

  evidence:
    meaning: >-
      The paths the verdict stands on — report.files plus the artifacts the
      op's brief declared (E/result.json, E/effects.json, E/manifest.yaml,
      captures, recordings, sonar exports — whatever the op's writes: block
      names, e.g. ops/task.execute/operator.yaml writes.evidence).
    mustPass: >-
      Artifact-BYTE checks, not existence-by-name:
      - declared bytes exist and are non-empty      -> ASSET_MISSING / ASSET_EMPTY
      - bytes carry the magic their extension claims -> ASSET_MAGIC (png/webm/mp4 signatures)
      - stamped digests are real sha256 and match    -> ASSET_STAMP / ASSET_DIGEST
      - recorded media is not a stub/fake            -> RUN_MEDIA_FAKE
      - every receipt names a real artifact          -> RECEIPT_ORPHAN
      (all: scripts/checks/check-work-artifacts.mjs; DEP_STALE /
      NORM_UNRECORDED baseline semantics: scripts/checks/check-work-deep.mjs).
    kernelSide: >-
      The file LIST is never taken from the report: the kernel computes
      changed files from git (kernel/verify.mjs changedFiles), attributes
      them (attributedFiles), freezes the candidate and compares bytes
      (engine.mjs freezeCandidate -> detection candidate seal). A claim of
      bytes that differ on disk is ASSET_DIGEST — rejected.

  suspicion:
    meaning: >-
      Optional free-text: the 'cấn cấn' signal — the agent's statement that
      something upstream is wrong (a spec contradicts the work, the scope
      doesn't cover reality, the goal looks wrong). Free text because doubt
      is not enumerable; routing it is the driver's job.
    driverMapsTo: >-
      goal.revise / the backward edges — three levels from
      modules/goal/legality.yaml backwardEdges.suspicionLevels:
      - spec-conflict-in-scope  -> owning revise route (srs-gap ->
        business.revise, sds-gap -> architecture.revise, interface-gap ->
        interface.draw, brand-gap -> brand.decide, grammar-gap ->
        grammar.update, test-gap -> test.author); goal-level -> goal.revise.
      - scope-expansion         -> re-run scope.define; provision.ask if the
        widening needs owner consent (AUTHORITY_WIDENING).
      - identity-wrong          -> provision.ask ALWAYS; the driver never
        self-decides (validateGoalRevision rejects identity change;
        amendments bind baseGoalIdentity — kernel/goal.mjs).
    neverQuietly: >-
      The suspicion is reported, not patched: the op's allowlist does not
      cover the record it doubts, so it cannot and may not edit it
      (legality.yaml backwardEdges.neverQuietly; CLAUDE.md work-correction
      policy — never relabel a wrong flow as debt).

# ============================================================================
# 2 — THE REPORT ENVELOPE. starci/op-report@1 (kernel/reports.mjs).
#    The file is the source of truth; the Orca message is the wake-up signal.
# ============================================================================
envelope:
  schema: starci/op-report@1        # workflow-level: starci/workflow-report@1
  required: [outcome, run, task, dispatch, from, summary]
  fields:
    outcome: "done|partial|failed|ask|blocked"
    summary: "one line, whitespace-collapsed, <=600 chars, secret-redacted"
    files: "paths the verdict claims, normalized; each must sit under the allowlist"
    checks: "[{name, command, exitCode, evidence<=400ch}] — executed, not intended"
    open: "unfinished items a `partial` carries to its next attempt"
    question: "ask only: {text, options[]}; typed record bound to the current goalRev"
    blocker: "blocked only: {kind <- BLOCKER_KINDS, detail}"
    branch/head: "workflow reports: required on done|partial"
    signal: "the Orca wake-up type must match the outcome (SIGNALS: done/partial->worker_done, failed->worker_done(failed), ask->question, blocked->escalation)"
  binding: >-
    Identity fields (run, task, dispatch, from) bind the report to the exact
    dispatch; UNIQUE(workflow_id, dispatch_id) on the reports table means one
    dispatch produces exactly one report (kernel/ledger-db.mjs reports DDL).

# ============================================================================
# 3 — WHAT THE SPINE ACCEPTS. Layers, in order; a report is judged at each.
# ============================================================================
accepts:
  - layer: schema-valid
    rule: "validateReport passes: known schema, known outcome, outcome's required payload present, signal matches outcome, files inside the allowlist"
    citation: "kernel/reports.mjs validateReport"
  - layer: identity-bound
    rule: >-
      The settle binds the exact durable job — workflowId, opId, attempt,
      generation AND leaseToken all match, else 'stale operation settlement
      fence' / 'does not bind the exact durable job' (kernel/engine.mjs
      settled). A duplicate terminal settle is recovered, not double-counted.
  - layer: kernel-reproduced
    rule: >-
      `done` is accepted only after the kernel re-runs the op's checks itself
      and computes the changed files from git; acceptance writes the verdict
      record (kernel/verify.mjs validateAccepted, recordVerdict,
      treeVerdictFor; machineVerify runs the declared check commands).
  - layer: boundary-correct
    rule: >-
      A blocked verdict is accepted only with a typed blocker in BLOCKER_KINDS
      — the kind IS the route key (model/kinds.yaml routes match on
      blocker/outcome/verdict). An environment blocker carrying a credential
      replacement request must name the failing check with observed evidence
      (validateReport credentialRequest rules).
  - layer: rev-consistent
    rule: >-
      A report belongs to the goalRev that produced it; adoption into a new
      rev happens only when the digests are identical (kernel/goal.mjs
      adoptReportRev). Evidence derived from a section that was revised is
      stale until re-proven (propagateInvalidation).

# ============================================================================
# 4 — WHAT THE SPINE REJECTS. Every rejection keeps the fence — a rejected
#    report is a routed verdict (usually retry), never silent loss.
# ============================================================================
rejects:
  - id: done-without-proof
    rule: "'done' with zero checks, a failing check, or open items -> invalid; report failed or partial instead"
    citation: "kernel/reports.mjs validateReport"
  - id: done-from-last-words
    rule: >-
      A dead worker's recovered last words are honoured for partial/failed/
      ask/blocked — never for done: 'done' owes checks no lost worker ran.
      Falls back to outcome failed so the ordinary acceptance path judges it
      (kernel/terminals.mjs writeLastWordsReport).
  - id: out-of-scope-files
    rule: "report.files outside the allowlist -> rejected, per-file named"
    citation: "kernel/reports.mjs validateReport allowlist check"
  - id: stale-lease-settle
    rule: >-
      A settlement whose leaseToken no longer matches the durable job is
      refused ('stale operation settlement fence'); a lease row that cannot
      match the job's identity cannot be written at all ('lease-identity-drift'
      trigger). An agent cannot graft evidence onto another job.
    citation: "kernel/engine.mjs settled; kernel/ledger-db.mjs leases_match_job; kernel/admission.mjs driftGuard"
  - id: unverifiable-evidence
    rule: >-
      Declared bytes missing/empty/wrong-magic/wrong-digest refuse the run
      (ASSET_* codes); a record whose dependency baseline moved refuses
      DEP_STALE — stale evidence is missing evidence.
    citation: "scripts/checks/check-work-artifacts.mjs; scripts/checks/check-work-deep.mjs"
  - id: unknown-effect-fallback
    rule: >-
      A missing output, unknown effect or guessed terminal identity never
      permits fallback or cleanup claims: only a typed, identity-bound
      `effectState: none` permits the fallback path; 'released'/'already_
      released' prove cleanup while identity_unproven/no_owned_resource is
      reported cleanup.complete:false (SKILL.md lifecycle correction;
      kernel/engine.mjs settleStoppedOperation requires the settlement to
      name THIS exact dispatch with effectState none).
  - id: invented-answer
    rule: >-
      An ask the kernel cannot answer from the offered options goes to the
      user — the kernel never invents an answer it was not offered
      (model/kinds.yaml question-needs-the-user).
  - id: quiet-fix
    rule: >-
      A report that silently absorbed a spec conflict instead of raising
      suspicion/blocker is a violation of the correction policy — the route
      reopens the owning boundary (legality.yaml backwardEdges.neverQuietly).

# ============================================================================
# 5 — ROUTING AFTER THE VERDICT. One line per landing zone; full table in
#    driver-loop.yaml verdictTable and model/kinds.yaml routes.
# ============================================================================
routingSummary:
  pass:     "settle -> mark produces: variables -> next leg (driver-loop.yaml tick.pick)"
  fail:     "retry inside route limits (failed->same x3, partial->same x5, rejected->same x2, repairs x3, gaps x2) -> then needUser"
  blocked:  "typed blocker -> owning route; environment/authority/ask -> needUser; owner-bound -> provision.ask"
  suspicion: "free text -> backward edge: revise route / scope.define+provision.ask / provision.ask-always (identity)"
  citation: "model/kinds.yaml routes; modules/goal/legality.yaml; kernel/reports.mjs"
