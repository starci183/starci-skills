# The contract of `api settle-tail` (scripts/kernel/api-verbs/settle-tail.mjs): the settle's async tail (owner ruling
# settle-runtime-service, 2026-09-28). One file per extension verb (scripts/kernel/api-extensions.mjs).
purpose: >-
  Run the heavy half of a settle for one settled job, off the settle's path: session retention, the Telegram media
  sender, the input re-baseline, blob artifact indexing and typed logs. api settle queues it under
  <ledger dir>/settle-tail/<jobId>.json and starts it detached; it can neither block nor fail the settle. A failed run
  is logged and retried by the runtime settler (scripts/reconcile/job-settle.mjs) until allocation.settler.tail.maxAttempts.
args: --job <id> [--json]
writes: [events settle-tail-done / settle-tail-failed, job_artifacts, jobs.payload_json sessionReleased, contracts.context_json inputs]
refusals:
  job-unknown: no such job (its queue file is dropped)
  job-not-settled: the job is not settled yet - the tail runs only after its settle
kernelOnly: true
exit: 0 done or already running, 1 failed (left queued for retry)
