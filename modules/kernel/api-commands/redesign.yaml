# The contract of `api redesign` (scripts/kernel/api-verbs/redesign.mjs): the heavy path.
purpose: >-
  When the RCA says the cut, the scope or the leg plan is wrong, dispatch the op that owns it - work.author
  (re-cut), scope.define (re-scope), goal.revise (leg plan) - with the RCA (progress, clusters, examples) as
  its brief in packet context.kernel_override.redesign. runtimes.yaml allocation.redesign routes it as
  routeAs (implementation.plan: Opus, then Sol) at >= minDifficulty whatever its usual order.
args: --workflow <id> --op work.author|scope.define|goal.revise --paths <csv> --decision <id> [--brief <text>] [--json]
writes: [through api enqueue, jobs payload.redesign/difficulty/kernelOverride of the new job, events kernel-redesign]
refusals:
  redesign-op-refused: only the ops of allocation.redesign.ops
kernelOnly: true
exit: 0 enqueued, 1 refused
