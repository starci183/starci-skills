foundation:
  args: >-
    --workflow <id> (--claim <name> [--kind <layout-tree|brand|grammar|module|contract|baseline|scaffold|other>]
    [--version <v>] | --declare-dependent <name> | --land <name> --proof <text> [--version <v>] [--refs <csv>]
    | --declare-none) [--detail <s>]
  reads: 'the foundation row, the workflow and its running peers, open peer-waits naming the foundation'
  writes: >-
    --claim: the row's owner is --workflow and its state claimed (a new version of a landed
    foundation re-opens it; the landing stays in history); a foundation another RUNNING
    workflow owns is refused, one whose owner stopped running passes to the claimant
    (transferredFrom). --declare-dependent: --workflow joins its dependents (the row is created
    unclaimed when nobody registered it). --land (owner only): state landed with {at, by,
    version, proof, refs}; every running dependent gets a peer heads-up 'foundation landed:
    <name>' (auto foundation-landed), every open peer-wait --until-foundation <name> in any
    workflow of the ledger is resolved (incident-resolved {foundation, by:'foundation-landed'}),
    and each released or notified Kernel is woken (transition foundation-landed). Landing the
    same version again changes nothing. --declare-none: the workflow owns and needs nothing.
    Each writes the declaration marker and appends 'foundation-claimed' /
    'foundation-dependent-declared' / 'foundation-landed' / 'foundation-none-declared' on
    --workflow
  returns: >-
    {ok:true, workflowId, action, name, state, kind, version, owner, dependents[], idempotent,
    transferredFrom?, reopened?, landed?, notified?:[{to, key}], released?:[{workflowId,
    incidentId, holds}], wakes?:[{workflowId, action}], next?: what a dependent does next}
  refuses:
    - workflow-unknown
    - workflow-not-running: 'only a running workflow owns or needs a foundation'
    - foundation-action-invalid: 'not exactly one of --claim | --declare-dependent | --land | --declare-none'
    - foundation-name-invalid: 'the name is not a lowercase slug of at most 80 characters'
    - foundation-kind-invalid
    - foundation-owned: 'another running workflow owns it: declare a dependency or agree a handoff (api notify --kind handoff)'
    - foundation-self-dependent: 'the owner declared itself a dependent'
    - foundation-unknown: '--land on a foundation nobody claimed'
    - foundation-not-owner: '--land by a workflow that does not own it (claim it first when its owner stopped running)'
    - foundation-proof-missing: '--land without --proof'
    - foundation-declared: '--declare-none by a workflow that already owns or needs a foundation'
  usedBy: 'Kernel only (conventions.callerBoundary): at goal definition / boot before feature legs, and when a foundation leg settles (driver-loop.yaml foundations)'
