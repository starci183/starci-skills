provider-health:
  args: '--provider <p>  |  --provider <p> --recover --reason <text> [--probe]  |  [--provider <p>] --quota-probe [--force] [--workflow <id>]'
  quotaCircuit: >-
    A provider whose agent card declares quotaExhausted is parked with
    failureKind quota when a dispatch rejection's signal/error carries its quota
    codes (e.g. insufficient_quota, quota-exhausted, HTTP 429 with a quota code) or its refused screen shows the quota row, or when
    api status / api observe read that row on a worker screen. It opens on the
    first observation and lasts allocation.cooldownMs.quota with the usual backoff. No [infra-provider]
    incident is raised for it
  quotaProbe: >-
    --quota-probe (no --provider = every provider whose card declares
    quotaExhausted.probe): for an OPEN quota circuit of this ledger, one probe
    when due - never probed, or probe.everyMs since the last one;
    --force ignores the throttle.
    scripts/agent/credential-probe.mjs probeProviderQuota runs the card's probe
    (orca-account: the Orca account's weekly window, no tokens spent). ok clears the circuit: the row becomes
    {status:'recovered', recoveredAt, reason:'quota probe passed', probe,
    recoveredBy:{quotaProbe:true, workflowId}, previous} expiring now and events
    provider-health-recovered lands on --workflow (else the circuit job's
    workflow). Any other answer keeps it: the row records quotaProbe {at, ok,
    state, status, code?, detail, why} and events provider-quota-probe-failed;
    the circuit keeps its own expiry. No Kernel proof is needed: the probe is the
    evidence. The kernel watchdog runs it every --repair tick
    (scripts/kernel/watchdog.mjs probeQuotaCircuits). Returns {ok:true, now,
    results:[{provider, probed, recovered?, probe?, reason?, nextAt?}]}.
    --recover --probe on a quota circuit uses the same quota probe
  reads: >-
    the signals row scope provider-health key <p> (a -agent suffix is dropped);
    the fingerprint of the credential a launch of <p> would present now
    (scripts/agent/credential-fingerprint.mjs: the Orca host account id for
    an orca-account card). No key value is read into
    any output, event or log
  returns: >-
    read: {ok:true, provider, open, row:{...value, at, expiresAt, expired}|null,
    credential:{fingerprint, source, resolved, recorded, rotated}}  |  --recover:
    {ok:true, provider, recovered:true, previous, probe, credential} or
    {ok:true, recovered:false, reason:'no-open-circuit'} when nothing is open
  recover: >-
    --recover clears an OPEN circuit before its expiry: the row becomes
    {status:'recovered', recoveredAt, reason, failures:0, trips:0, probe,
    recoveredBy:{kernelJob, workflowId, terminal}, previous} expiring now, and
    events 'provider-health-recovered' {provider, reason, probe, previous,
    credential, kernelJob} lands on the proving Kernel's workflow. --probe first
    proves the credential live (scripts/agent/credential-probe.mjs): a provider passes on its
    quota probe reading ok or limited. A failed probe refuses the clear
  writes: 'with --recover: the signals row above + events provider-health-recovered | provider-health-recover-refused; with --quota-probe: the quota row + events provider-health-recovered | provider-quota-probe-failed'
  refuses:
    - 'op-context-refused: an op caller (KERNEL_ONLY_VERBS), read or recover'
    - 'kernel-proof-required: --recover whose ORCA_TERMINAL_HANDLE is not the terminal (worker_id or hierarchy seat) of a running kernel job in this ledger'
    - 'probe-failed: --probe could not prove the credential; the circuit stays open and events provider-health-recover-refused {provider, reason, probe} is appended'
    # --recover without --reason, or --probe without --recover, is a usage error (exit 2)
  usedBy: >-
    the Kernel, after the owner or a supervisor fixed a credential that an auth
    circuit still holds (driver-loop.yaml providerCircuitRecovery). Route and
    dispatch refusals, api status queuedBecause circuit-open and the
    [infra-provider] incident text name this command

