# The contract of `api unit` (scripts/kernel/api-verbs/unit.mjs): the work units of a workflow and their try budgets.
purpose: >-
  Every op job is a try of exactly one work unit (scripts/kernel/units.mjs; DBTREE work_units): one op, one subject
  key (cut id#ordinal, params.subject, else the digest of its records or owned paths) and one goal revision. A unit
  has a try budget (default 5, Q13); api enqueue, graph-edit and the failure routes refuse a try past it
  (unit-try-budget-exhausted). This verb shows the units and lets the owner or the Supervisor raise one budget,
  always with who and why - never a Kernel.
args: --workflow <id> [--unit <id>] [--raise-budget <n> --by owner|supervisor --ref <decision item|incident>] [--json]
reads: work_units of the workflow
writes: 'with --raise-budget: work_units.try_budget, budget_raised_by, budget_raised_ref and one unit-budget-raised event (engine/ledger-db.mjs raiseTryBudget); nothing else'
returns: '{ok, workflowId, units:[{unitId, op, subjectKey, state, tries, budget, exhausted, currentJobId, reopen?}]} | {ok, workflowId, unitId, from, tryBudget, by, ref, tries}'
refusals:
  workflow-unknown: the workflow is not in this ledger
  unit-unknown: --unit names no work unit of the workflow
  unit-budget-raiser: --by is neither owner nor supervisor (Q13)
  unit-budget-unexplained: --ref is missing
  unit-budget-invalid: the new budget is not an integer above the current one
exit: 0 shown or raised, 1 refused
