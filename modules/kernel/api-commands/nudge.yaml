nudge:
  args: '--job <job_id>'
  reads: 'running operation job, exact report row, exact terminal show/read frame'
  writes: >-
    sends a fixed liveness wake to the same exact operation terminal and
    appends op-worker-nudged. It creates no job, contract, lease, retry,
    verdict or authority.
  returns: >-
    {ok:true,jobId,nudged:true|false,action?:wake|submit-staged-input|answer-gate,delivery?:delivered|queued,evidence?:wake-text|queued-marker|screen|receipt,sendErrorCode?,enterRetried?,splitRetried?,splitOutcome?:delivered-after-split|unstaged|unsubmitted,reason?,input?,worker,receipt?}
    — nudged:false with ok:true and exit 0 is a SKIP, not a refusal: reason
    'report-filed' (the durable answer already exists), 'worker-active'
    (the turn is running) or 'worker-starting' (a managed worker inside its
    launchGraceMs - worker-start returned before Orca injected the Task;
    nothing is typed). A worker whose liveness is `staged-input` (its
    paste never left the input row) gets ONE Enter-only send and no wake
    text, action submit-staged-input: typing a wake on top of the paste
    would bury it (inc-06aeecf432f1). A worker at a host dialog its agent
    card allowlists (liveness interactive-gate with worker.gateAutoAnswer;
    modules/models/agents/<agent>.yaml gateAutoAnswer.gates, e.g. Qwen Code's
    "A potential loop was detected" menu, gate qwen-loop-detection) gets the
    card's option picked with arrow keys and Enter, no wake text, action
    answer-gate {gate,select,answered,cleared,keystroke,answers,limit}, and one
    op-worker-gate-answered event (starci-next inc-af01e1cedbf4). Answered
    the gate's maxPerAttempt times on the same attempt, the dialog is a loop:
    the worker reads liveness gate-loop, listed in frontier.wedgedJobs, and
    nudge refuses it `worker-gate-loop` (one op-worker-gate-loop event,
    nothing typed). Every other nudge is action wake.
    Before a wake is typed the input row is read once more: non-empty input
    text that is neither the provider''s painted placeholder (its idle
    prompt hint) nor the runtime''s own (a card-declared paste marker, a
    verbatim piece of the dispatched contract, or this same wake left
    staged) is foreign input, and the nudge refuses `foreign-input` typing
    nothing - the wake never appends to words this job did not write
    (Supervisor ruling, inc-f1d014518dc3). A ghost suggestion the worker's
    card declares (modules/models/agents/<agent>.yaml liveness.ghostSuggestion:
    Qwen Code paints a model-written follow-up such as "* settle op-..." in
    its empty input row after a turn) is not typed input: the wake is typed
    over it.
    The input box's draft counts as its input row. Orca lifts the text of an
    agent's input box out of the frame and answers it as `draft`
    (scripts/api/orca/terminal-read.mjs); read without it, a send whose Enter
    was dropped sat invisible and each later send was appended to it (nivo
    collab Kernel, 2026-09-25). Liveness reads the draft in the input row
    (the contract left there is staged-input); a draft the runtime did not
    type gets one Ctrl+U probe (scripts/kernel/clear-draft.mjs probeDraft):
    text that changes is real - the part cut from a one-row draft is typed
    back - and refuses `foreign-input` (inputSource draft, draftProbe) with
    no wake typed; this same wake left there gets one Enter (evidence
    draft-submitted); runtime wakes piled up or cut short are emptied with
    bounded Ctrl+U before the wake is typed, and a box that shrinks but will
    not empty refuses `draft-stuck`. Orca blanks the input row of every
    screen read that carries a draft, so the screen cannot tell a real draft
    from a stale one; a draft the FIRST Ctrl+U leaves unchanged is stale on
    Orca's side (sn-foundation Kernel term_da5f72b3, 2026-09-25: 'check
    status' no key cleared while the box was empty) and is never refused:
    the wake is typed as into an empty box, the result and op-worker-nudged
    carry draftNote 'draft-stale' and staleDraft, and the delivery proof
    after the send stays the backstop.
    Delivery is proven from the screen (scripts/kernel/wake-delivery.mjs),
    not Orca's receipt alone: the frame is read before and after the send,
    and the wake text appearing (delivered) or a queued-message marker such
    as Claude's "Press up to edit queued messages" (queued) proves it, so
    agent_prompt_stalled / agent_prompt_blocked with the wake on screen is a
    nudge (op-worker-nudged carries delivery and sendErrorCode), never
    terminal-send-failed (inc-b87a42ec8690, inc-e4f69f9ef061, inc-13ab4be5059f)
    A frame that stays turn-idle with no wake text, no queued marker and no
    staged input is a dropped send whatever the receipt said (a Codex Kernel
    took ok:true text+Enter sends that never reached its screen, 2026-09-24):
    the wake is retried once split - the text with enter:false, proven staged
    in the input row, then Enter-only, proven again - and the result and
    event carry splitRetried:true with splitOutcome delivered-after-split, or
    unstaged/unsubmitted on a terminal-send-failed. A worker whose agent
    exited is never woken (scripts/kernel/terminal-liveness.mjs
    exitedAgentPromptRow: the frame ends in a bare shell prompt, or in a
    prompt row drawn under the agent's own input row/footer, as when
    PowerShell's prompt overwrites a dead Codex's footer without clearing
    it): the frame is re-read immediately before typing, whatever observe
    saw, and refuses with reason 'agent-exited' and nothing typed; an
    unreadable frame types nothing (delivery unreadable). A frame read
    after the send that shows a host shell got the text (the text after a
    shell prompt, a new shell error, or a bare prompt) is never delivered:
    reason 'agent-exited', delivery agent-exited, evidence
    shell-echo|shell-error|shell-prompt, typed:true, no retry, and one
    event 'op-worker-wake-to-shell' instead of op-worker-nudged (nivo
    term_8f9e0611, 2026-09-24 03:56: PowerShell ran a nudge and its echo
    read as delivered). Recover the job with reconcile --dead-worker.
  refuses:
    - 'agent-exited (field `reason`, exit 1): the worker''s agent exited - before the send (nothing typed) or under it (typed:true, a shell received the text); run api reconcile --job <id> --dead-worker'
    - job-unknown: 'no jobs row for --job'
    - job-not-operation: 'only an operation job has a worker terminal to wake'
    - job-not-running: 'only the current running attempt may be nudged'
    # the eight below exit 1 carrying the string in `reason`, not in `code`
    - worker-unavailable: 'exact terminal is disconnected/unwritable'
    - interactive-gate: 'permission/trust input the worker''s card does not allowlist is a typed environment problem, not a wake (liveness `failed` refuses under its own name the same way); an allowlisted host dialog is answered instead (action answer-gate)'
    - worker-state-unknown: 'liveness is neither turn-idle nor live-idle — weak observation never authorizes input'
    - worker-wedged: 'the worker''s turn ran past the wedge threshold on one command with no output; a wake would land behind a turn that never ends - run api reconcile --job <id> --dead-worker --settle-failed'
    - worker-gate-loop: 'the host dialog the runtime answered maxPerAttempt times on this attempt is back (liveness gate-loop); another answer is an endless continue - run api reconcile --job <id> --dead-worker --settle-failed (Esc closes the dialog before the agent is quit), and a repeat on the retry reads as a retry-loop finding'
    - foreign-input: 'the input row (or the input box draft Orca reports, inputSource draft) holds non-empty text that is neither a staged paste nor the runtime''s own delivered text; the wake was not typed (a draft got only a Ctrl+U probe that changed it - real text - and the cut typed back, draftProbe says restored), no event is appended. A draft the probe left unchanged is draft-stale, never this refusal'
    - draft-stuck: 'the input box holds piled-up runtime text that bounded Ctrl+U shrank but could not empty; the wake was not typed onto it, no event is appended'
    - terminal-send-failed: 'neither the receipt nor the screen shows the wake on the exact terminal (delivery failed, evidence names what the screen showed); no op-worker-nudged event is appended. An Orca refusal terminal_not_writable adds sendRefused:true and event op-worker-unwritable, which status reads as liveness disconnected'
  usedBy: 'drive.wait on the first turn-idle observation with no durable report'

