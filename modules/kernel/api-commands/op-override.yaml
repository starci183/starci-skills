# The contract of `api op-override` (scripts/kernel/api-verbs/op-override.mjs): a per-workflow local op variant.
purpose: >-
  Store an additive override of one op for THIS workflow (notes, commandTimeoutMs, difficulty, model, effort);
  api dispatch renders it into every later packet of that op (context.kernel_override). The shared manifest
  is never touched - a shared fix is a kernel-proposal.
args: --workflow <id> [--op <op>] [--set '<json>' | --clear] [--decision <id>] [--json]
refusals:
  override-key-refused: any key but notes, commandTimeoutMs, difficulty, model, effort (never checks, writes, steps, gates)
  override-weakens-gate: a note telling the op to skip, disable, relax or bypass a check
kernelOnly: true
exit: 0 stored or shown, 1 refused
