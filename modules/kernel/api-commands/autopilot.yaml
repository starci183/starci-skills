autopilot:
  args: >-
    --workflow <id> [--json] and at most one of: --sweep | --bundle | --checklist [--lang vi|en] | --set on|off
    --reason <s> | --defer-to-handover --op <asking op> --class credential|real-money|shared-system|owner-decision
    --detail <what is owed> [--fields <FILE_OR_VAR,...>] [--stub <sandbox/stub path>] [--job <id>] | --release
    <dispatchId|key> --reason <s> | --defer-leg <jobId> --reason <s> | --reopen <provisional dispatchId>
    --handover-answer <owner-answered handover dispatchId> [--note <s>] | --extend-budget
    attempts=<n>,tokens=<n>,wallMs=<n> --reason <s>; [--by supervisor|kernel|autopilot] (default supervisor)
  reads: >-
    modules/models/runtimes.yaml allocation.autopilot; the workflow's asks, incidents, jobs and autopilot-* events;
    the product records a gate reads (draw loop, rationale, brand.direction) - scripts/kernel/autopilot.mjs
  writes: >-
    Owner ruling 2026-09-28 autopilot-run-to-finish (modules/kernel/owner-rulings.yaml). Only autopilot-* events,
    autopilot answer receipts (starci/ask-answer@1, answeredBy autopilot - never owner) and supervisor-gate
    incidents. Without a mode it prints the status autopilot block. --sweep runs what every api status runs
    (autopilot.mjs autopilotSweep): each pending ask is answered provisionally (draw-review / brand-direction-review
    whose machine gates pass: autopilot-provisional + ask-answered with provisional:true and acceptance
    {provisional, by: autopilot, receipt: <gate evidence>}), answered redraw/revise with the gate findings
    (autopilot-redraw, at most redrawBudget per record; a stale ask spends none), taken on its recommendation
    (autopilot-recommended) or deferred to handover (autopilot-deferred-to-handover {deferClass, fields, stubPath,
    owed}: credential, real-money, shared-system, owner-decision - nothing is sent to the owner); every open
    owner-gate is re-routed to the Supervisor (autopilot-gate-rerouted, kind supervisor-gate); a supervisor-gate
    older than supervisorGateTimeoutMs defers what it holds (autopilot-deferred); a spent budget opens one
    supervisor-gate holding ['*']; the owner's handover credential checklist answer supersedes the credential
    asks it supplied (autopilot-credentials-supplied). --bundle prints the final review bundle
    (starci/autopilot-bundle@1, "backlog awaiting the owner's review"; also in api survey --deliveries .autopilot). --checklist
    prints the ONE end-of-flow credential question (provision.ask subject handover-credentials). --set records a
    per-workflow override (autopilot-configured). --defer-to-handover records an owner-only need without an ask.
    --release puts a deferred ask back in the owner's queue (end of flow). --defer-leg is the Supervisor deferring a
    leg to the final review. --reopen re-opens one provisional acceptance from the owner's handover answer: the
    handover ask must be answered by the owner (owner-claim.mjs ownerAnswerProof) and the owner's note is copied
    from that receipt (autopilot-provisional-reopened); nextActions then retries only that op. --extend-budget
    raises the caps (autopilot-budget-extended)
  returns: '{ok:true, workflowId, ...} - the projection, the sweep result, the bundle, the checklist question or the recorded event payload'
  refuses:
    - workflow-unknown
    - 'reason-missing: --set, --release, --defer-leg and --extend-budget need --reason'
    - 'class-invalid / defer-incomplete: --defer-to-handover needs --class, --op and --detail'
    - 'deferral-unknown: --release names no open deferred-to-handover item'
    - 'owner-claim-unproven: --reopen needs a handover ask the owner answered'
  usedBy: 'the Supervisor (fixes, decisions, budgets) and the Kernel (--checklist, --defer-to-handover); api status runs the sweep on every read'
