contract-release:
  args: '--family <op> [--workflow <id>] [--batch <name>] [--reason <text>] [--by supervisor|owner] [--dry-run] [--json]'
  reads: >-
    modules/kernel/contract-changes/ and modules/kernel/contract-freeze.yaml (scripts/machine/contract-version.mjs);
    every live workflows row (archived_at null, phase not finished) or --workflow; their contract-release events,
    jobs and contracts rows
  writes: >-
    Owner ruling 2026-09-28 ("Freeze the drawing rules"): the release point of a frozen op family. Per workflow whose
    family changes are still frozen (batched, landed after the workflow was created, never released there): one
    contract-release event {family, batch, changes[], by, reason, runtimeSha, owedBefore, owedAfter, restamped[],
    dropped[]} (entity contract/<family>). After it a new leg carries the released changes (dispatch withholds
    only still-frozen ones: contracts.context_json.contract.withheld) and a leg that does not carry them owes ONE
    follow-up for the whole set (status contractFollowUps, alsoCovers). Every queued leg of the
    family op is re-stamped payload.contractRelease {family, changes, at, event} - it is admitted under the
    released set at dispatch, so it is the redo; an older never-dispatched duplicate of it (same cut group and
    owned paths, no live job --after it) is cancelled {verdict: dropped, reason: superseded-by-contract-release}
    with a job-dropped event. Running legs keep their admission (status runningOpRevDrift; api nudge carries the
    notice). --dry-run writes nothing and reports the same numbers
  returns: '{ok:true, family, batch, dryRun, workflows:[{workflowId, changes[], alreadyReleased[], owedBefore, owedAfter, owed[], restamped[], dropped[], running[], released}]}'
  refuses:
    - 'contract-family-unknown: no registered change or freeze names --family'
    - workflow-unknown
    - 'op-context-refused: an operation terminal never releases contracts'
  usedBy: 'the Supervisor, when it decides a frozen family''s batch is ready (after the land gate''s gate-stability report), never a Kernel or an op'
