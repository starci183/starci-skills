run-deferred-tests:
  args: '--workflow <id> [--kind unit|e2e|integration] [--by <who>] [--dry-run]'
  reads: 'the workflow''s jobs whose result verdict is deferred (api status testsDeferred); the owner config.yaml specs switches'
  writes: >-
    The owner's "test later" (owner 2026-09-28 "speed up development; test later when asked"). The owner
    config.yaml root `specs: {unit?, e2e?}` switches product testing off per class; an op whose brief
    policy.specsToggle.<class> is defer-leg (test.author, e2e.verify) is then never dispatched: api enqueue,
    api route and api dispatch settle its queued job status succeeded with result {verdict: deferred,
    deferred: {kind, reason: specs.<class>=false, at, via}} and one tests-deferred event - no lease, no
    dispatch, no attempt spent - and the legs behind it proceed. This command re-queues every such job of the
    workflow (only --kind's class when given) in one transaction: status queued on its same attempt, result
    cleared, payload.specsForced {at, by, kind} (so it dispatches even while its class is still off, with its
    whole brief - packet context.specs_forced), and one tests-requeued event each. The Kernel then routes and
    dispatches them as usual. --dry-run lists what it would re-queue and writes nothing
  returns: '{ok:true, workflowId, kind, dryRun, deferred:[{jobId, op, attempt, kind, reason, at, via}], requeued:[...same], specs:{harness, unit, e2e}}'
  refuses:
    - workflow-unknown
    - 'deferred-tests-bad-kind: --kind is none of unit, e2e, integration'
    - 'workflow-finished: a finished or archived workflow takes no new work'
    - 'op-context-refused: an op terminal never re-queues legs'
  usedBy: 'the owner or supervisor running the tests the specs switches deferred (after flipping a switch back, or when asked)'
