messages:
  args: '--workflow <id>'
  reads: >-
    the drain of scripts/kernel/verbs/shared/messages.mjs: each Run of the workflow (payload orca/managed/hierarchy
    runId of its jobs) through scripts/api/orca/orch-check.mjs (calls.yaml `check`, Orca's consuming FIFO
    Delivery, --run <run> --terminal <Kernel terminal>; a consumer_fenced answer on the Kernel's own Run re-binds it
    once with run-use); then every bridged message of the workflow (the worker-question inbox rows and the
    orchestration-message events, oldest first) joined to the job whose dispatch or terminal sent it; the ids the
    Kernel already read (events orchestration-messages-read)
  writes: >-
    per Delivery, in one transaction committed before the Delivery is acknowledged (check --ack): an
    inbox row kind worker-question per new question or escalation {key: <message id>, payload {messageId, type,
    runId, jobId, opId, attempt, dispatchId, taskId, question, options[], subject, askedAt, from}} with event
    'worker-question-bridged'; an event 'orchestration-message' per other message (worker_done, status, handoff,
    ...; worker_done is settlement's hand-off, api-lib/messages.mjs workerDoneOf); heartbeats counted on the event
    'orchestration-delivery-bridged' {runId, deliveryId, count, types, heartbeats}; a replayed Delivery writes
    nothing twice (keyed by message id). Then a pending question whose job settled or reported, that got a reply
    threaded in Orca, or that matches no job is closed status done {reason}; one event 'orchestration-messages-read' {ids} naming the messages this read showed for the
    first time
  returns: '{ok, workflowId, runs[], count, new, heartbeats, messages:[{id, type, subject, body<=600, from, to, runId, threadId, createdAt, jobId, opId, attempt, jobStatus, new, handle}], error?}'
  refuses:
    - workflow-unknown
  why: >-
    Orca tells the Kernel terminal "You have N orchestration messages. Run orca orchestration check ..."
    for every message type, but the Kernel may not call Orca and `questions` bridges only `question`
    rows, so the notice pointed at messages no authorized verb could read (starci-next
    inc-81559e3a064b, mia inc-c55b52879387). `handle` says where each type is acted on: a question or
    an escalation through api reply, worker_done and status are information (the report and settle come
    through the ledger).
  usedBy: 'the Kernel, whenever its terminal shows the orchestration-message notice (modules/kernel/driver-loop.yaml)'
