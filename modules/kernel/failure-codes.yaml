  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_NOT_COMPOSED:
  title: "Feature or capability module not composed into any app"
  title_vi: "Feature hoặc module năng lực không được lắp vào ứng dụng nào"
  meaning_vi: "Một feature backend, hoặc một module domain, integrations hay platform, không có đường import chạy thật (không tính import chỉ-kiểu) từ tệp gốc của bất kỳ ứng dụng nào (app.module.ts hoặc main.ts), kể cả qua các module khác đã được lắp. Không tiến trình nào nạp nó nên code này không bao giờ được phục vụ."
  causes_vi:
    - "Quên thêm module của feature vào app.module.ts của ứng dụng"
    - "Chỉ import kiểu (import type) từ ứng dụng, nên feature không thật sự được lắp vào"
    - "Feature đã bị bỏ dở hoặc thay bằng feature khác nhưng thư mục cũ vẫn còn"
    - "Module năng lực được viết sẵn nhưng chưa feature nào import nó, hoặc feature từng dùng nó đã bị xoá"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để lắp module của feature vào ứng dụng phù hợp hoặc xoá feature không dùng; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_ENTRYPOINT_ONLY_IN_APPS:
  title: "Entrypoints only in `apps/*/src`"
  title_vi: "Entrypoint nằm ngoài apps"
  meaning_vi: "`<file>` là một entrypoint tiến trình nằm ngoài `apps/`."
  causes_vi:
    - "Vi phạm luật R33: Không `main.ts`/`bootstrap()`/top-level `void x()` ngoài `apps/*/src`; migrate là `apps/migrate`."
    - "NestFactory.create* hoặc lời gọi bootstrap() cấp cao nhất nằm ngoài apps/<app>/src/main.ts"
    - "Chỉ `src/tests/world/` (gốc ghép của test, slot be.tests.world) được gọi NestFactory ngoài main.ts; một spec (integration, contract, e2e) không được ghép: nó chỉ gọi useTestWorld(...)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_OWNER:
  title: "Entities and migrations live in the owning capability's `persistence/`"
  title_vi: "Entity hoặc migration sai chủ"
  meaning_vi: "Entity/migration `<file>` không nằm dưới `persistence/` của capability sở hữu (hoặc sai tên)."
  causes_vi:
    - "Vi phạm luật R35: Entity + migration nằm trong `<capability>/persistence/` của capability sở hữu bảng, có `connection.ts` khai báo hai mảng `<c>Entities` và `<c>Migrations` (không có `CONNECTION`); connection của capability là connection mà app đăng ký hai mảng đó vào `DatabaseModule.register`: đúng một connection khai trong `hfs.json` ở mọi app, và mọi `Inject<Conn>EntityManager` trong capability phải là connection ấy; tên migration `<epochMs13>-<kebab>.ts`, class `<Pascal><epochMs13>`, thuộc tính `name` bằng tên class; `index.ts` của owner export `<c>Entities` và `<c>Migrations`, app compose."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
