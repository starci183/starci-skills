  title_vi: "Cây làm việc mồ côi của runtime đã được giữ việc rồi gỡ"
  meaning_vi: "Orca còn một cây làm việc mang dấu sở hữu của runtime (starci:<kind>:<slot>) nhưng registry không có dòng nào cho nó, và chủ của nó (workflow hoặc job của critic) đã kết thúc hoặc không còn ai biết sau thời gian chờ. GC tạo dòng registry, giữ toàn bộ việc chưa commit và commit chưa land vào preserved/orphan/<id>, gỡ cây qua đường an toàn với liên kết rồi qua Orca, đóng dòng và ghi một sự cố (machine_logs kind worktree.orphan)."
  causes_vi:
    - "Tiến trình tạo cây dừng giữa lệnh tạo của Orca và bước đăng ký"
    - "Chỗ giữ cây đã được trả lại (slot-never-bound) trong khi Orca đã tạo cây"
  nextStep_vi: "Không mất gì: việc nằm ở nhánh preserved/orphan/<id>. Xem sự cố worktree.orphan trong machine_logs; nếu cần dùng lại việc đó, lấy từ nhánh preserved."
  owner: runtime-core
  kind: runtime-fault
