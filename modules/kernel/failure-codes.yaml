    - "Dữ liệu của Orca bị đặt lại"
  nextStep_vi: "Xem nội dung thư mục, giữ lại việc cần giữ, rồi gỡ nó qua API worktree của runtime (removeScratchWorktree hoặc safeRemoveWorktree); không bao giờ xoá tay."
