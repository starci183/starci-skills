  meaning_vi: "Orca còn một cây làm việc mang dấu sở hữu của runtime nhưng registry không có dòng nào cho nó, trong khi chủ của nó vẫn đang chạy hoặc Orca báo còn terminal trong cây. GC tạo dòng registry cho cây, nên lần tra cứu sau của chủ tìm thấy và dùng lại nó thay vì tạo cây mới."
  causes_vi:
    - "Tiến trình tạo cây dừng giữa lệnh tạo của Orca và bước đăng ký, còn workflow vẫn chạy"
  nextStep_vi: "Không cần làm gì: cây đã có dòng registry và được GC xử lý như mọi cây khác khi chủ kết thúc."
