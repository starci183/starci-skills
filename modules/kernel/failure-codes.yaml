  meaning_vi: "`<what>` ở `<file>` (timer, frame, listener, observer, socket hoặc subscription) do effect hoặc `subscribe` khởi động, nhưng cleanup trả về không giải phóng đúng handle, target và listener đó; nó chạy tiếp sau khi component đã gỡ và set state vào chỗ không còn."
  causes_vi:
    - "Vi phạm luật R65: mọi thứ effect hoặc `subscribe` khởi động được cleanup trả về giải phóng cùng handle, target và listener (`clearTimeout(id)`, `cancelAnimationFrame(id)`, `removeEventListener` cùng type và listener, `.disconnect()`, `.close()`, `.unsubscribe()`)."
