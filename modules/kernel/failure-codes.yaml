  causes_vi:
    - "Tệp route hoặc helper được chép từ app này sang app khác thay vì đưa vào gói dùng chung"
    - "Mỗi app tự giữ một bản `error.tsx`, `not-found.tsx`, `i18n/request.ts` hay helper kiểm thử giống hệt nhau"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển mã vào một gói `packages/<pkg>` và để mỗi app chỉ re-export ký hiệu của gói theo lời nhắn; không thêm ngoại lệ."
