  kind: check-finding

HFS_UNUSED_FILE:
  title: "Production file that nothing reaches"
  title_vi: "Tệp mã sản xuất không ai chạm tới"
  meaning_vi: "Một tệp mã sản xuất không được nối tới từ bất kỳ gốc nào: không phải main.ts hay app.module.ts của một ứng dụng, không phải tệp route, không phải cửa vào của một gói, và không tệp sản xuất nào import nó (kể cả import chỉ kiểu). Tệp kiểm thử không được tính; tệp chỉ có spec dùng vẫn là chết. Không tiến trình nào chạy tệp này."
  causes_vi:
    - "Nơi từng import tệp đã bị xoá hoặc chuyển đi, còn tệp bị bỏ sót"
    - "Tệp được thêm nhưng chưa nối vào module hay cửa vào nào"
    - "Tệp chỉ được spec dùng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để xoá tệp, hoặc nối nó vào nơi thật sự dùng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

ARCH_OWNER_CYCLE:
  title: "Owner import cycle"
  title_vi: "Vòng import giữa các đơn vị sở hữu"
  meaning_vi: "Các đơn vị sở hữu (feature, module domain, platform, gói...) import lẫn nhau thành vòng khép kín, kể cả bằng import chỉ kiểu. Vòng làm hai đơn vị không thể hiểu, kiểm thử hay thay thế riêng lẻ; bộ kiểm tra báo kèm đường đi của vòng."
  causes_vi:
    - "Hai module domain dùng chung một kiểu và import kiểu của nhau"
    - "Một module gọi ngược lại module đã gọi nó thay vì nhận qua tham số hoặc sự kiện"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để cắt vòng: chuyển phần chung sang một đơn vị thấp hơn hoặc đảo phụ thuộc; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_ALIAS_REEXPORT:
  title: "A declaration re-exported under a second name"
  title_vi: "Xuất lại một khai báo dưới tên thứ hai"
  meaning_vi: "Mã sản xuất dùng `export { X as Y }`, `export { default as Y }`, `export * as ns`, hoặc khai báo xuất `const Y = X`, `type Y = X`, `interface Y extends X {}` chỉ để đặt tên thứ hai cho một khai báo khác của repo: một khai báo có hai tên, nên người đọc và công cụ tìm kiếm phải đoán hai tên là một. Luật áp cho cả backend lẫn frontend."
  causes_vi:
    - "Cửa vào của owner đổi tên một khai báo để tránh trùng tên với khai báo cùng tên ở owner khác"
    - "Đổi tên tạm để giữ tên cũ cho nơi dùng cũ"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đổi tên chính khai báo cho đúng nghĩa, hoặc import và xuất nó bằng tên của nó; không giữ tên cũ song song."
  owner: op-retry
  kind: check-finding

BE_FEATURE_IMPORTS_FEATURE:
