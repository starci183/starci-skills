COMPOSITE_HOST_MISMATCH:
  title: "Overlay drawn over the wrong host"
  title_vi: "Lớp phủ vẽ trên nền sai"
  meaning_vi: "Lớp phủ như hộp thoại hoặc ngăn kéo được ghép lên ảnh nền không thuộc trang chủ hoặc nền đó đã đổi."
  causes_vi:
    - "Ảnh trang chủ đã đổi sau khi ghép"
    - "Khác kích thước hoặc giao diện sáng tối"
  nextStep_vi: "Từ chối hoặc nghi vấn tùy chế độ; ghép lại lớp phủ lên ảnh nền hiện tại."
  owner: other-op:interface.draw
  kind: check-finding

COMPOSITE_INCONSISTENT:
  title: "Composite contradicts the record"
  title_vi: "Bản ghép mâu thuẫn với hồ sơ"
  meaning_vi: "Thông tin trong bản ghép không khớp với hồ sơ, như tuyến, kích thước, loại bề mặt hay kiểu trình bày."
  causes_vi:
    - "Hồ sơ đổi mà bản ghép chưa cập nhật"
  nextStep_vi: "Kiểm tra vỏ giao diện từ chối; ghép lại cho khớp hồ sơ."
  owner: other-op:interface.draw
  kind: check-finding

COMPOSITE_LAYOUT_MISMATCH:
  title: "Composite uses an outdated layout"
  title_vi: "Bản ghép dùng bố cục lỗi thời"
  meaning_vi: "Trang được ghép vào bố cục không phải bố cục hiện tại bao quanh tuyến của nó."
  causes_vi:
    - "Bố cục đã đổi sau khi ghép"
    - "Ghép vào canvas trống"
  nextStep_vi: "Kiểm tra vỏ giao diện báo lỗi hoặc nghi vấn; ghép lại vào bố cục hiện tại."
  owner: other-op:interface.draw
  kind: check-finding

COMPOSITE_MISSING:
  title: "Drawing has no composite"
  title_vi: "Bản vẽ chưa được ghép"
  meaning_vi: "Một bản vẽ sinh ra chưa có khối composite nên mới chỉ là phần nội dung, chưa nằm vào trang."
  causes_vi:
    - "Chưa chạy bước ghép compose-direction"
  nextStep_vi: "Kiểm tra vỏ giao diện báo lỗi; chạy bước ghép để đặt bản vẽ vào trang."
  owner: other-op:interface.draw
  kind: check-finding

COMPOSITE_NOT_REPRODUCIBLE:
  title: "Composite cannot be reproduced"
  title_vi: "Không tái tạo được bản ghép"
  meaning_vi: "Ảnh ghép không giải mã được, không dựng lại được hoặc điểm ảnh khác với nội dung và nền đã ghi."
  causes_vi:
    - "Ảnh bị sửa tay sau khi ghép"
    - "Dữ liệu ghép sai"
  nextStep_vi: "Kiểm tra vỏ giao diện từ chối; ghép lại bằng công cụ để ảnh khớp bản ghi."
  owner: other-op:interface.draw
  kind: check-finding

DRAW_RENDER_RED:
  title: "Draw render capture came back red"
  title_vi: "Bản vẽ render bị lỗi khi chụp"
  meaning_vi: "Lúc chụp ảnh bản vẽ giao diện, trang bị lỗi như thiếu phông chữ, tràn ngang, lỗi trang hoặc request thất bại."
  causes_vi:
    - "Trang vẽ thiếu phông chữ hoặc tài nguyên tải không được"
    - "Nội dung tràn ngang khỏi khung hiển thị"
    - "Không có bản ghi render đi kèm ảnh"
  nextStep_vi: "Vòng vẽ báo lỗi này cho op vẽ; op interface.draw sửa file vẽ rồi render lại, không được chốt khi ảnh còn đỏ."
  owner: op-retry
  kind: check-finding

DRAW_SCOPE_FULL_PAGE:
  title: "Drawing binds a full-page composite"
  title_vi: "Bản vẽ gắn ảnh cả trang thay vì phần nội dung"
  meaning_vi: "Bản ghi giao diện đang dùng ảnh ghép cả trang (kèm khung bao quanh) làm bản vẽ, trong khi op vẽ chỉ được vẽ phần nội dung."
  causes_vi:
    - "Ảnh có tên dạng --page-- được gắn làm bản vẽ"
    - "Op vẽ chụp cả layout chứ không chỉ phần nội dung của màn hình"
  nextStep_vi: "Chỗ chốt của op vẽ từ chối; op interface.draw phải chỉ vẽ nội dung (ảnh <Màn>#<trạng thái>--<breakpoint>--<theme>.png) rồi chốt lại. Bản ghi kiểu layout thì được miễn."
  owner: op-retry
  kind: check-finding

DRAW_SCORE_BELOW:
  title: "Drawing has no passing ui-proof score"
  title_vi: "Bản vẽ chưa có điểm chấm đạt"
  meaning_vi: "Bản vẽ chưa có file điểm chấm đi kèm, điểm chấm là của phiên bản cũ, hoặc điểm chấm có tiêu chí bị trượt."
  causes_vi:
    - "Không có file .score.json cạnh nguồn render"
    - "Nguồn html đã đổi sau khi chấm điểm"
    - "Có tiêu chí chấm bị trượt chưa được xử lý"
  nextStep_vi: "Op interface.draw phải chạy vòng vẽ (hoặc chấm lại bằng ui-proof-brief), sửa các điểm bị phê bình rồi chốt lại; chưa đạt thì chốt vẫn bị từ chối."
  owner: op-retry
  kind: check-finding

DRAW_TOO_MANY_BADGES:
  title: "Too many badges on one entity"
  title_vi: "Một mục có quá nhiều huy hiệu"
  meaning_vi: "Một thẻ, một dòng trạng thái hoặc một dòng danh sách mang nhiều huy hiệu hơn mức cho phép, nhìn rối mắt."
  causes_vi:
    - "Biến cả các dữ kiện thường thành huy hiệu"
    - "Nhét nhiều trạng thái vào cùng một mục"
  nextStep_vi: "Op interface.draw giữ mỗi mục một huy hiệu trạng thái, các dữ kiện khác để chữ thường, rồi render và chốt lại."
  owner: op-retry
  kind: check-finding

DRAW_TOO_MANY_BANDS:
  title: "Card split into too many bands"
  title_vi: "Thẻ bị chia thành quá nhiều dải"
  meaning_vi: "Một thẻ được chia thành nhiều dải ngăn cách bằng đường kẻ hơn mức cho phép."
  causes_vi:
    - "Dùng quá nhiều đường kẻ hoặc dải phân cách trong cùng một thẻ"
    - "Tách riêng những phần lẽ ra gộp được"
  nextStep_vi: "Op interface.draw gộp lại dải (danh tính cùng trạng thái, khả năng, số liệu cùng hành động) rồi render và chốt lại."
  owner: op-retry
  kind: check-finding

DRAW_TYPECHECK_FAILED:
  title: "Draw source failed type check"
  title_vi: "File vẽ không qua kiểm tra kiểu TypeScript"
  meaning_vi: "File vẽ giao diện dùng thuộc tính hoặc biến thể mà bộ thành phần chung không có, hoặc không thể kiểm tra kiểu được."
  causes_vi:
    - "Dùng prop hoặc giá trị không nằm trong bộ thành phần chung"
    - "Thiếu prop bắt buộc"
    - "Sản phẩm chưa cài TypeScript hoặc kiểu của grammar"
  nextStep_vi: "Op interface.draw sửa file vẽ theo kiểu thật rồi chạy lại; nếu do thiếu TypeScript hoặc grammar thì cần nâng cấp sản phẩm trước."
  owner: op-retry
  kind: check-finding

DUPLICATE_KERNEL:
  title: "More than one live kernel terminal"
  title_vi: "Một workflow có nhiều hơn một terminal Kernel"
  meaning_vi: "Một workflow đang có hai terminal Kernel cùng chạy, hoặc dữ liệu ghi nhận trùng lặp."
  causes_vi:
    - "Kernel được mở lại mà terminal cũ chưa đóng"
    - "Sổ ghi nhận terminal bị lệch với thực tế"
  nextStep_vi: "Supervisor xem cây Orca, giữ đúng một terminal Kernel và đóng bản thừa."
  owner: supervisor
  kind: check-finding

DUPLICATE_KEY:
  title: "Duplicate key in YAML map"
  title_vi: "Trùng khóa trong tệp YAML"
  meaning_vi: "Tệp YAML có một khóa xuất hiện hai lần trong cùng một khối nên không đọc được."
  causes_vi:
    - "Dán thêm cùng một mục hai lần"
    - "Ghép hai đoạn YAML mà không gộp khóa"
  nextStep_vi: "Người viết tệp gộp hoặc xóa khóa trùng rồi lưu lại; trình đọc từ chối tệp cho đến khi sửa xong."
  owner: op-retry
  kind: input-invalid

DUPLICATE_NODE:
  title: "Node declared twice in work graph"
  title_vi: "Một nút được khai báo hai lần trong đồ thị công việc"
  meaning_vi: "Đồ thị công việc có hai nút cùng mã."
  causes_vi:
    - "Khai báo lặp lại một nút"
    - "Ghép hai phần đồ thị có nút chung"
  nextStep_vi: "Op sinh đồ thị sửa lại để mỗi nút chỉ khai báo một lần rồi nộp lại."
  owner: op-retry
  kind: check-finding

EFFECT_UNKNOWN_STUCK:
  title: "Job stuck in effect-unknown state"
  title_vi: "Công việc kẹt ở trạng thái chưa rõ kết quả"
  meaning_vi: "Một công việc đã tác động ra ngoài nhưng chưa biết kết quả và bị kẹt quá thời hạn cho phép."
  causes_vi:
    - "Tiến trình chết đúng lúc đang ghi hoặc đẩy thay đổi"
    - "Hệ thống bên ngoài không phản hồi nên chưa xác nhận được"
  nextStep_vi: "Runtime tự chạy đối soát (starci kernel reconcile) để xác định kết quả; nếu vẫn kẹt thì mở sự cố cho Supervisor xử lý."
  owner: supervisor
  kind: runtime-fault

PROVIDER_RESERVATION_HELD:
  title: "Provider slot held by a launch of unknown outcome"
  title_vi: "Chỗ provider bị giữ bởi một lần khởi động chưa rõ kết quả"
  meaning_vi: "Một biên nhận provider_reservations chưa có terminal hay tiến trình và chưa được chứng minh đã chết quá thời hạn cho phép, nên chỗ của provider vẫn bị tính là đang dùng."
  causes_vi:
    - "Lần khởi động worker bị cắt giữa chừng và máy chưa khởi động lại để chứng minh nó đã chết"
    - "Orca hoặc bảng tiến trình không đọc được nên reaper không có chứng cứ"
  nextStep_vi: "Reaper giải phóng biên nhận khi chứng minh được máy đã khởi động lại hoặc kết quả khởi động là không tác động; nếu vẫn kẹt, Supervisor đọc biên nhận trong provider_reservations và hòa giải tay."
  owner: supervisor
  kind: runtime-fault

host-restarted:
  title: "The host restarted after the launch began"
  title_vi: "Máy chủ đã khởi động lại sau khi lần khởi động bắt đầu"
  meaning_vi: "Lần khởi động worker của job đã bắt đầu trước lần khởi động lại của máy hoặc của Orca, và Orca đang chạy không còn biết Dispatch của nó, nên lần khởi động đó đã kết thúc."
  causes_vi:
    - "Máy tắt hoặc khởi động lại giữa lúc worker đang được dựng"
  nextStep_vi: "Job được đánh dấu thất bại và chỗ đường dẫn được trả; Supervisor đặt job mới nếu việc còn cần."
  owner: supervisor
  kind: runtime-fault

provider-login-expired:
  title: "Provider login expired"
  title_vi: "Đăng nhập provider đã hết hạn"
  meaning_vi: "Orca báo đăng nhập của provider đã hết hạn nên không có ứng viên nào của provider đó đủ điều kiện; thông báo nêu tên provider, lời của Orca và việc cần làm."
  causes_vi:
    - "Token OAuth của provider hết hạn và Orca chưa được đăng nhập lại"
  nextStep_vi: "Owner đăng nhập lại provider trong Orca (Settings > Accounts) rồi chạy lại lệnh; runtime thử thành viên đủ điều kiện kế tiếp trước."
  owner: owner
  kind: dispatch-refusal

process-gone-after-restart:
  title: "Recorded connector processes are gone after a restart"
  title_vi: "Các tiến trình đã ghi của connector không còn sau khi khởi động lại"
  meaning_vi: "Dòng connector còn nợ việc đóng manager hoặc tiến trình con, nhưng cả hai (đúng pid và thời điểm sinh) không còn trong bảng tiến trình đọc được; nợ được xóa bằng sự vắng mặt đó và dòng được ghi là đã dừng."
  causes_vi:
    - "Máy khởi động lại khi tunnel hoặc gateway đang chạy"
  nextStep_vi: "Không cần làm gì: lần start kế tiếp chạy bình thường."
  owner: runtime-core
  kind: check-status

ESLINT_UNAVAILABLE:
  title: "ESLint could not be loaded"
  title_vi: "Không nạp được ESLint của sản phẩm"
  meaning_vi: "Công cụ lint của sản phẩm không chạy được nên bước quét quy chuẩn bị bỏ qua."
  causes_vi:
    - "Sản phẩm chưa cài ESLint"
    - "Cấu hình ESLint bị lỗi khi nạp"
  nextStep_vi: "Bước quét ghi trạng thái ESLint là unavailable; cần cài hoặc sửa ESLint của sản phẩm rồi quét lại."
  owner: runtime-core
  kind: runtime-fault

EVENT_CLASS_ORPHAN:
  title: "Event class in code with no record"
  title_vi: "Lớp sự kiện trong mã nhưng không ai nhận"
  meaning_vi: "Trong mã có khai báo một lớp sự kiện nhưng không được phát ra và cũng không có bản ghi Work nào nhận."
  causes_vi:
    - "Sự kiện bỏ dở sau khi đổi thiết kế"
    - "Chưa viết bản ghi Work cho sự kiện"
  nextStep_vi: "Đây là cảnh báo nghi ngờ; op work.author thêm bản ghi cho sự kiện hoặc op backend xóa lớp thừa."
  owner: other-op:work.author
  kind: check-finding

EVENT_PRODUCER_IS_RULE:
  title: "Event producer is a business rule"
  title_vi: "Nguồn phát sự kiện được ghi là một quy tắc nghiệp vụ"
  meaning_vi: "Bản ghi sự kiện nêu quy tắc nghiệp vụ là nơi phát ra sự kiện, trong khi quy tắc không phát sự kiện."
  causes_vi:
    - "Ghi nhầm loại bản ghi ở trường nguồn phát"
    - "Chưa có bản ghi cho bộ xử lý thật"
  nextStep_vi: "Đây là cảnh báo; op work.author trỏ nguồn phát tới bộ xử lý hoặc phần cài đặt thật."
  owner: other-op:work.author
  kind: check-finding

EVENT_UNDECLARED:
  title: "Emitted event has no Work record"
  title_vi: "Sự kiện được phát ra nhưng chưa có bản ghi Work"
  meaning_vi: "Mã có phát một lớp sự kiện nhưng cây Work không có bản ghi nào gọi tên nó."
  causes_vi:
    - "Thêm sự kiện mới vào mã mà chưa cập nhật cây Work"
    - "Bản ghi sự kiện đặt sai tên lớp"
  nextStep_vi: "Đây là cảnh báo; op work.author thêm bản ghi work/event cho sự kiện này."
  owner: other-op:work.author
  kind: check-finding

EVENT_UNEMITTED:
  title: "Event record has no emitter in code"
  title_vi: "Bản ghi sự kiện không có mã phát ra"
  meaning_vi: "Bản ghi Work mô tả một sự kiện mà không có đoạn mã nào phát ra."
  causes_vi:
    - "Sự kiện chưa được cài đặt"
    - "Tên lớp trong bản ghi khác tên trong mã"
  nextStep_vi: "Nếu bản ghi đã đánh dấu xong thì bị từ chối; op backend phải cài phần phát sự kiện hoặc op work.author sửa bản ghi cho đúng."
  owner: other-op:work.author
  kind: check-finding

EVENT_UNPRODUCED:
  title: "Event class has no declaration in src"
  title_vi: "Sự kiện chưa có khai báo trong mã nguồn"
  meaning_vi: "Bản ghi sự kiện ánh xạ tới một lớp sự kiện không tìm thấy trong mã nguồn, có thể là sự kiện không ai phát."
  causes_vi:
    - "Sự kiện mới chưa được cài đặt"
    - "Đặt tên lớp không khớp với bản ghi"
  nextStep_vi: "Đây là cảnh báo; op work.author hoặc op backend sửa tên hay cài sự kiện cho khớp."
  owner: other-op:work.author
  kind: check-finding

EVIDENCE_ARTIFACT_GHOST:
  title: "Declared evidence input missing on disk"
  title_vi: "Tệp đầu vào của bằng chứng đã khai nhưng không có"
  meaning_vi: "Bản ghi khai một tệp đầu vào của bằng chứng nhưng cây Work không giữ tệp đó."
  causes_vi:
    - "Tệp bị xóa hoặc chưa được lưu vào cây Work"
    - "Đường dẫn khai sai"
  nextStep_vi: "Đây là cảnh báo; op tạo bằng chứng lưu tệp vào cây Work hoặc sửa đường dẫn khai báo."
  owner: op-retry
  kind: check-finding

EVIDENCE_ASSERTED_NOT_OBSERVED:
  title: "Done rests on an authored claim"
  title_vi: "Đánh dấu xong nhưng chỉ dựa vào lời khẳng định"
  meaning_vi: "Bản ghi đã xong nhưng chỉ do người viết tự khẳng định, chưa có lần chạy nào quan sát được."
  causes_vi:
    - "Chốt xong mà chưa chạy kiểm chứng"
    - "Nguồn xác minh là authored-claim ở loại bản ghi không được miễn"
  nextStep_vi: "Op chịu trách nhiệm phải chạy kiểm chứng để Kernel ghi nhận quan sát thật, hoặc đưa bản ghi về chưa xong."
  owner: op-retry
  kind: check-finding

EVIDENCE_CONTEXT_MISSING:
  title: "Evidence carries no source stamp"
  title_vi: "Bằng chứng thiếu dấu nguồn"
  meaning_vi: "Một số tệp bằng chứng không ghi thư mục, kho hay commit nên khi lỗi thời không biết đầu vào nào đã đổi."
  causes_vi:
    - "Bằng chứng ghi bằng công cụ cũ không gắn dấu nguồn"
    - "Quên điền cwd, repository hoặc commit"
  nextStep_vi: "Đây chỉ là thông tin; lần ghi bằng chứng sau nên kèm cwd, repository hoặc commit."
  owner: op-retry
  kind: check-finding

EVIDENCE_DELETED:
  title: "Expired evidence was deleted"
  title_vi: "Bằng chứng hết hạn bị xóa thay vì đánh dấu"
  meaning_vi: "Bản sửa đã xóa khối bằng chứng cũ; bằng chứng hết hạn chỉ được đánh dấu chứ không được xóa."
  causes_vi:
    - "Xóa bằng chứng để làm sạch bản ghi"
    - "Ghi lại bản ghi từ đầu và làm mất phần cũ"
  nextStep_vi: "Op sửa bản ghi khôi phục khối bằng chứng và đánh dấu stale kèm lý do."
  owner: op-retry
  kind: check-finding

EVIDENCE_DIGEST_MISMATCH:
