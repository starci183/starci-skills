  meaning_vi: "Một trường hướng dẫn trong modules/**/*.yaml, một prompt modules/**/*.md hoặc một skills/**/SKILL.md bảo agent chạy một lệnh mà command guard (scripts/guards/command-guard.mjs) từ chối: git worktree add hoặc remove, xóa đệ quy, dừng tiến trình theo tên, orca terminal create, CLI agent chạy headless, tạo liên kết hay một lệnh git bị chính sách chặn. Agent làm theo hướng dẫn sẽ bị guard chặn giữa chừng. Lệnh nằm trong một câu cấm (never, do not, không bao giờ) hoặc câu mô tả việc runtime tự làm hay sự cố đã xảy ra thì không tính."
  causes_vi:
