  kind: blocker
owner-gate-pending:
  title: "Owner gate awaiting the owner"
  title_vi: "Cổng chủ dự án đang chờ phản hồi"
  meaning_vi: "Cổng chủ dự án đã mở và đang chờ chủ dự án xem, các job liên quan vẫn bị giữ."
  causes_vi:
    - "Câu hỏi đã gửi chủ dự án nhưng chưa có trả lời"
  nextStep_vi: "Giống cổng chủ dự án: job bị giữ cho tới khi chủ dự án xử lý, Kernel không bị đánh thức vì nó."
