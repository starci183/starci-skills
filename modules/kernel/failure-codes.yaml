  nextStep_vi: "Bị từ chối, không tạo việc (khi giao việc thì việc vẫn ở hàng đợi). Kernel sửa đường dẫn về thư mục có thật, hoặc khai báo --new-module <thư mục module> nếu việc này chủ đích tạo module mới, rồi xếp việc lại."
