    - "Vi phạm luật L03: mọi `create table`/`create table as` trong schema exposed phải có enable (và force khi hfs.json `supabase.forceRls` khai báo) trong cùng migration; partition con và bảng temp được miễn."
  nextStep_vi: "Viết `alter table <schema>.<table> enable row level security;` ngay sau create trong cùng migration; không dùng vòng lặp dynamic SQL."
  owner: op-retry
  kind: check-finding

DB_DYNAMIC_DDL:
  title: "No dynamic SQL builds DDL - every statement a migration runs is visible to the parser"
  title_vi: "DDL động trong migration"
  meaning_vi: "`<path>` có `EXECUTE`/dynamic `FOR`/`OPEN` trong DO block hoặc function build create/alter/drop table|policy|function hay grant/revoke, hoặc một dynamic statement mà parser không đọc được."
  causes_vi:
    - "Vi phạm luật L04: DDL viết tường minh từng câu; dynamic DDL làm L03/L05/L06 không quyết định được bằng AST."
  nextStep_vi: "Viết thẳng các câu create/alter/drop/grant (codemod sinh nếu cần lặp); dynamic SQL chỉ còn DML thuần."
  owner: op-retry
  kind: check-finding

DB_POLICY_SHAPE:
  title: "Policies are named `<table>_<role>_<action>`, write/FOR ALL never uses (true), anon/public only on `for select` `*_public_read`, no grant to anon without that policy, never `service_role`"
  title_vi: "Policy sai hình dạng"
  meaning_vi: "`<path>` có policy vi phạm L05: write hoặc FOR ALL với using (true)/with check (true), `to anon`/`to public` ngoài FOR SELECT `*_public_read`, select using (true) không hậu tố `_public_read`, tên sai `<table>_<role>_<action>`, grant tới anon/public không có policy `_public_read` kèm, hoặc grant tới `service_role`."
  causes_vi:
    - "Vi phạm luật L05: service_role vượt RLS nên không bao giờ được grant; anon chỉ đọc qua policy `_public_read` được khai báo."
  nextStep_vi: "Đổi tên policy theo `<table>_<role>_<action>`, thay using (true) trên write bằng điều kiện thật, bỏ grant tới service_role/anon hoặc thêm policy `<table>_public_read` cho select."
  owner: op-retry
  kind: check-finding

DB_DEFINER_SAFE:
  title: "A `security definer` function pins `search_path`, lives outside exposed schemas (or is revoked from public in the same migration), declares a return type, and interpolates parameters only through `format('%I/%L')`"
  title_vi: "Function security definer không an toàn"
  meaning_vi: "`<path>` có function `security definer` thiếu `set search_path` (trên create hoặc `alter function` cùng migration - `from current` không tính), nằm trong schema exposed mà không `revoke execute ... from public`, không khai báo return type, hoặc build dynamic SQL qua tham số không qua `format('%I/%L')`."
  causes_vi:
    - "Vi phạm luật L06: search_path không pin là lỗ hổng leo quyền; `security invoker` được miễn."
  nextStep_vi: "Thêm `set search_path = ''` (hoặc danh sách schema cố định), chuyển function sang schema `private` hoặc `revoke execute on function ... from public, anon`, và chỉ interpolate qua `format('%I'/'%L')`."
  owner: op-retry
  kind: check-finding

DB_STORAGE_POLICY:
  title: "A bucket insert declares `public = false` (true only for an id ending `_public`), `file_size_limit`, `allowed_mime_types`, and a `storage.objects` policy naming its `bucket_id` in the same migration"
  title_vi: "Bucket storage thiếu khai báo hoặc policy"
  meaning_vi: "`<path>` insert vào `storage.buckets` thiếu `public`/`file_size_limit`/`allowed_mime_types`, đặt `public = true` cho id không kết thúc `_public`, hoặc không có policy trên `storage.objects` nhắc `bucket_id` của nó trong cùng migration."
  causes_vi:
    - "Vi phạm luật L07: bucket là private mặc định; giới hạn size/mime và policy objects đi cùng khai báo bucket."
  nextStep_vi: "Khai báo đủ `public = false`, `file_size_limit`, `allowed_mime_types` và viết `create policy ... on storage.objects ... (bucket_id = '<id>')` trong cùng migration."
  owner: op-retry
  kind: check-finding

DB_CONFIG_POLICY:
  title: "`supabase/config.toml` holds no literal credential (`env(NAME)` only), `auth.jwt_expiry <= 3600`, and signup/site_url/redirects equal the Supabase block of hfs.json"
  title_vi: "config.toml lệch policy"
  meaning_vi: "`<path>` (supabase/config.toml) chứa giá trị literal dưới key credential (secret|password|token|client_id|*_key trừ anon/publishable), `auth.jwt_expiry` quá 3600, hoặc `enable_signup`/`site_url`/`additional_redirect_urls` khác với block Supabase mà hfs.json khai báo."
  causes_vi:
    - "Vi phạm luật L08: secret trong config.toml viết `env(NAME)`; jwt_expiry tối đa 3600; posture auth là fact được check, không phải claim trong doc."
  nextStep_vi: "Đổi credential thành `env(TEN_BIEN)`, hạ `jwt_expiry` về <= 3600, và chỉnh block Supabase của hfs.json hoặc config.toml cho khớp nhau."
  owner: op-retry
  kind: check-finding

DB_TYPES_DRIFT:
  title: "`supabase/types/database.types.ts` is committed and equals what `contract:emit` regenerates from the migrations"
  title_vi: "database.types.ts lệch với migrations"
  meaning_vi: "`supabase/types/database.types.ts` chưa được commit, hoặc khác với text mà `contract:emit` sinh lại từ migrations hiện tại (hoặc emit thất bại). Pattern giống R23 HFS_CONTRACT_SNAPSHOT_DRIFT."
  causes_vi:
    - "Vi phạm luật L09: file types là artefact sinh; commit bản mới nhất, không sửa tay."
  nextStep_vi: "Chạy `starci app emit` và commit `supabase/types/database.types.ts` kết quả."
  owner: op-retry
  kind: check-finding

FE_SUPABASE_CLIENT_OWNER:
  title: "A front-end Supabase client, import or call is outside the db owner, or is not typed with `Database`"
  title_vi: "Supabase client phía front end sai chủ sở hữu hoặc thiếu kiểu Database"
  meaning_vi: "Import/call Supabase ở `<path>` không thuộc ô `fe.modules.db`/`fe.package.db`, hoặc client được tạo mà không mang kiểu `Database` đã sinh."
  causes_vi:
    - "Vi phạm L10: chỉ các ô db được import/call `@supabase/ssr` hay `@supabase/supabase-js`; mọi client là `SupabaseClient<Database>`/`create*Client<Database>`."
  nextStep_vi: "Chuyển factory và truy vấn vào ô db đúng của app/gói, import API công khai của ô đó, và thêm kiểu `Database`; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_SUPABASE_CLIENT_OWNER:
  title: "A back-end Supabase client, import or call is outside `be.integrations.supabase`, or is not typed with `Database`"
  title_vi: "Supabase client phía back end sai chủ sở hữu hoặc thiếu kiểu Database"
  meaning_vi: "Import/call Supabase ở `<path>` không thuộc `be.integrations.supabase`, hoặc client được tạo mà không mang kiểu `Database`."
  causes_vi:
    - "Vi phạm L10: back end dùng EntityManager cho dữ liệu; chỉ integration Supabase sở hữu Auth/Storage client và kiểu Database."
  nextStep_vi: "Chuyển Auth/Storage client vào `be.integrations.supabase`, dùng API công khai của integration và thêm kiểu `Database`; dữ liệu thường đi qua EntityManager."
  owner: op-retry
  kind: check-finding

FE_DB_RESULT_TYPED:
  title: "A Supabase result is cast, explicitly generic, or an unbounded list read"
  title_vi: "Kết quả Supabase bị ép kiểu hoặc truy vấn danh sách không giới hạn"
  meaning_vi: "Truy vấn ở `<path>` dùng generic trên `single/maybeSingle/returns`, ép kiểu/non-null assertion, hoặc đọc danh sách không có `limit` hay biên keyset."
  causes_vi:
    - "Vi phạm L11: kiểu hàng phải suy ra từ `Database`; mọi đọc nhiều dòng phải có giới hạn tĩnh."
  nextStep_vi: "Bỏ generic/cast/assertion, sửa type nguồn trong `database.types.ts`, và thêm `.limit()` hoặc biên keyset."
  owner: op-retry
  kind: check-finding

FE_DB_ERROR_HANDLED:
  title: "An awaited Supabase result drops `error` or collapses failure to empty data"
  title_vi: "Kết quả Supabase bỏ qua error hoặc gộp lỗi thành dữ liệu rỗng"
  meaning_vi: "Kết quả await ở `<path>` không đọc `error`, không được truyền nguyên vẹn vào `toOutcome`, hoặc dùng `data ?? []` nên `refused`/`unavailable` biến thành dữ liệu rỗng."
  causes_vi:
    - "Vi phạm L12: mọi `{data,error}` đi qua một Outcome có kiểu; không destructure chỉ data và không nuốt lỗi."
  nextStep_vi: "Đọc và ánh xạ `error`, hoặc truyền toàn bộ result vào `toOutcome(result)` rồi xử lý đủ các nhánh Outcome."
  owner: op-retry
  kind: check-finding

FE_SERVICE_ROLE_FORBIDDEN:
  title: "A service-role or credential-shaped environment value enters the front end"
  title_vi: "Service role hoặc biến môi trường bí mật đi vào front end"
  meaning_vi: "`<path>` chứa identifier/string service_role hoặc đọc biến `*_SECRET`, `*_PRIVATE`, `*_TOKEN`, `*_PASSWORD`; public config không được khai báo qua chủ `modules/config`."
  causes_vi:
    - "Vi phạm L13: front end chỉ giữ URL, anon/publishable key và public config; service role luôn ở back end."
  nextStep_vi: "Xóa credential khỏi fe/, chuyển thao tác đặc quyền qua use case back end, và khai báo public config tại `modules/config`."
  owner: op-retry
  kind: check-finding

FE_AUTH_SESSION_TRUST:
  title: "Server code trusts `getSession`, or a Server Action does not establish and refuse an anonymous principal"
  title_vi: "Mã server tin getSession hoặc Server Action không xác thực principal"
  meaning_vi: "`<path>` gọi `auth.getSession()` trên server, write action không bắt đầu bằng `await getPrincipal()`, không trả Outcome `refused` cho anonymous (trừ `fe.modules.db/auth/write-sign-in.ts` đang xác thực chính caller anonymous), hoặc mutation nhạy cảm không gọi `auth.getUser()`."
  causes_vi:
    - "Vi phạm L14: server dùng claims đã kiểm tra; write action xác thực principal trước mọi việc và mutation nhạy cảm kiểm tra user từ Auth server."
  nextStep_vi: "Dùng `getPrincipal()`/`getClaims()`, từ chối anonymous bằng Outcome có kiểu, và gọi `auth.getUser()` cho tiền, bảo mật tài khoản hay đổi role."
  owner: op-retry
  kind: check-finding

FE_DB_WRITE_SHAPE:
  title: "A Supabase Server Action uses input before schema parsing, or a write module exports no action"
  title_vi: "Server Action dùng input trước khi schema parse"
  meaning_vi: "Write module ở `<path>` không export Server Action, hoặc tham số được dùng trước lần gọi `schema.parse`/`schema.safeParse` đầu tiên."
  causes_vi:
    - "Vi phạm phần write-shape của L14: input không được tin trước validation."
  nextStep_vi: "Export action async trong `write-*.ts` và để lần dùng input đầu tiên là `schema.parse(input)` hoặc `schema.safeParse(input)`."
  owner: op-retry
  kind: check-finding

FE_ROUTE_HANDLER_FORBIDDEN:
  title: "A front-end route handler is not health/live or the Supabase auth callback slot"
  title_vi: "Route handler phía front end không thuộc hai cửa được phép"
  meaning_vi: "`<path>` là `route.ts` phía fe nhưng không phải `health/live` và không thuộc ô `fe.route.callback`."
  causes_vi:
    - "Vi phạm L15: webhook, cron, public API và callback bên thứ ba là feature của back end."
  nextStep_vi: "Chuyển handler sang feature back end; chỉ giữ health/live và callback PKCE trong ô `fe.route.callback`."
  owner: op-retry
  kind: check-finding

BE_SUPABASE_JWT_VERIFIED:
  title: "A Supabase principal is derived without pinned JWKS verification, or authorization claims come from the request body"
  title_vi: "JWT Supabase chưa được xác minh đầy đủ hoặc claim lấy từ request body"
  meaning_vi: "`<path>` decode JWT không verify, gọi `jwtVerify` ngoài integration/thiếu JWKS, issuer, audience `authenticated` hay algorithm pin, hoặc đọc role/membership từ body."
  causes_vi:
    - "Vi phạm L16: principal chỉ đến từ access token đã verify signature/iss/aud/exp/algorithm hoặc được đọc lại từ DB."
  nextStep_vi: "Dùng `createRemoteJWKSet` + `jwtVerify` trong `be.integrations.supabase`, pin issuer/audience/algorithms và bỏ mọi authorization claim từ body."
  owner: op-retry
  kind: check-finding

HFS_LITE_SECRET_CUSTODY:
  title: "Lite secret material or a forbidden custody path is present"
  title_vi: "Bí mật hoặc đường dẫn lưu bí mật bị cấm trong edition lite"
  meaning_vi: "`<path>` là root `.env*`, `secrets.env`, `.secrets/`, file `.enc` ngoài `.starcistacks/<env>/secrets`, hoặc fe/supabase chứa token Supabase/JWT hay connection string có mật khẩu."
  causes_vi:
    - "Vi phạm L17: lite có đúng một đường custody đã mã hóa và browser/Supabase tree không giữ secret literal."
  nextStep_vi: "Không đọc hay in giá trị. Gỡ secret khỏi cây, xoay secret nếu đã lộ, rồi niêm phong bằng sops tại `.starcistacks/<env>/secrets/<slug>.enc`."
  owner: owner
  kind: check-finding

kernel-caller-stale:
  title: "Kernel incarnation does not own this mutation"
  title_vi: "Phiên Kernel không còn sở hữu thao tác"
  meaning_vi: "Quyền hiện tại đã đổi trước khi ghi dữ liệu hoặc thực hiện tác động."
  causes_vi:
    - "Terminal, Dispatch, thế hệ, lượt khởi động hoặc singleton token đã bị thay thế."
  nextStep_vi: "Giữ nguyên quyền đang tranh chấp; Supervisor kiểm tra phiên hiện tại trước khi thử lại."
  owner: supervisor
  kind: verb-refusal

kernel-caller-unknown:
  title: "Managed caller custody is unavailable"
  title_vi: "Không xác minh được quyền của caller"
  meaning_vi: "Lịch sử hoặc binding của caller không đọc được hoặc mâu thuẫn; không suy ra quyền owner."
  causes_vi:
    - "Kho ledger hoặc machine không đọc được; binding sai, cũ hoặc thuộc workflow khác."
  nextStep_vi: "Khôi phục khả năng đọc và xác minh caller thực tế; không dùng biến môi trường để giả quyền."
  owner: supervisor
  kind: verb-refusal

kernel-caller-actor:
  title: "Actor claim contradicts native caller"
  title_vi: "Actor khai báo mâu thuẫn với caller"
  meaning_vi: "Giá trị --by không khớp với quyền caller mà owner hiện có xác minh."
  causes_vi:
    - "Caller dùng tên Kernel, Op hoặc Supervisor khác với phiên thực tế."
  nextStep_vi: "Bỏ khai báo giả và dùng đúng caller; chuỗi actor không cấp quyền."
  owner: supervisor
  kind: verb-refusal

kernel-read-unverified:
  title: "Current Kernel READ attestation is incomplete"
  title_vi: "READ của Kernel hiện tại chưa đầy đủ"
  meaning_vi: "Manifest READ không chứng minh toàn bộ bytes cần đọc cho phiên Kernel hiện tại."
  causes_vi:
    - "File thiếu, hash sai, bytes dirty, descriptor sai hoặc lượt Kernel đã thay đổi."
  nextStep_vi: "Lấy --plan, đọc đủ từng file và gửi manifest nguyên vẹn với --read-manifest từ Kernel hiện tại."
  owner: supervisor
  kind: verb-refusal

PATH_OUTSIDE_BASE:
  title: "Path outside its allowed directory"
  title_vi: "Đường dẫn nằm ngoài thư mục được phép"
  meaning_vi: "Một lệnh nhận đường dẫn từ người gọi nhưng đường dẫn đó, sau khi chuẩn hoá và theo liên kết, rơi ra ngoài thư mục mà lệnh được phép đọc."
  causes_vi:
    - "Đường dẫn có đoạn .. hoặc là đường dẫn tuyệt đối trỏ ra khỏi cây cho phép"
    - "Một liên kết (symlink, junction) bên trong cây dẫn ra ngoài"
  nextStep_vi: "Gọi lại lệnh với đường dẫn nằm trong cây của runtime, của repo đang chạy hoặc trong thư mục tạm của hệ điều hành; không cần ai can thiệp thêm."
  owner: op-retry
  kind: input-invalid

URL_TARGET_REFUSED:
  title: "Request target outside its allowed hosts"
  title_vi: "Đích yêu cầu nằm ngoài các máy chủ được phép"
  meaning_vi: "Một yêu cầu mạng bị từ chối trước khi gửi vì địa chỉ không thuộc chính sách của nơi gọi: giao thức không phải http hoặc https, địa chỉ có tài khoản đi kèm, cổng sai, hoặc máy chủ ngoài danh sách cho phép."
  causes_vi:
    - "Địa chỉ trỏ tới máy chủ khác máy này hoặc khác máy chủ API đã định"
    - "Nơi gọi chưa khai báo chính sách cho phép"
  nextStep_vi: "Dùng địa chỉ loopback của máy này hoặc máy chủ API đã định; sửa cấu hình trỏ sai thay vì mở rộng danh sách cho phép."
  owner: runtime-core
  kind: input-invalid
# Proof: scripts/kernel/workflow-launch-no-effect.mjs and scripts/kernel/workflow-startup.mjs (workflowSender).
workflow-sender-terminal-missing:
  title: "Workflow start has no sender terminal"
  title_vi: "Khởi động workflow không có cửa sổ gửi lệnh"
  meaning_vi: "Kernel là worker của một Run mà cửa sổ khởi động làm điều phối; ORCA_TERMINAL_HANDLE không được đặt nên Orca không biết cửa sổ gửi lệnh. Runtime từ chối trước mọi tác động, không tạo worktree hay Kernel."
  causes_vi:
    - "Lệnh start chạy từ một shell thường, không nằm trong cửa sổ Orca"
    - "Tiến trình nền (watchdog, reconciler) chạy không kế thừa ORCA_TERMINAL_HANDLE và không có cửa sổ nào của worktree runtime (hoặc Supervisor đang sống) để thay thế"
  nextStep_vi: "Mở một cửa sổ thường trong worktree của runtime (watchdog sẽ thử lại sau blockedRetryMs), hoặc chạy lại starci workflow start bên trong một cửa sổ Orca; không dùng cửa sổ của người khác làm điều phối."
  owner: owner
  kind: verb-refusal
kernel-launch-custody-incomplete:
  title: "Held Kernel launch has no proof of what it left"
  title_vi: "Lần khởi động Kernel đang giữ chưa có bằng chứng về hậu quả"
  meaning_vi: "Tín hiệu launch-unknown không có cửa sổ lẫn Dispatch để đóng, và không có bản ghi lỗi run-create kèm mã Orca từ chối trước tác động; runtime không tự giải phóng chỗ của nhà cung cấp."
  causes_vi:
    - "Lần khởi động chết giữa chừng hoặc mất biên nhận"
    - "Lỗi ghi nhận không phải mã Orca từ chối trước tác động"
  nextStep_vi: "Supervisor đối chiếu Run và worker trên Orca rồi xử lý sự cố; không sửa tay bảng tín hiệu."
  owner: supervisor
  kind: runtime-fault
kernel-launch-host-unavailable:
  title: "Orca did not answer for the held Kernel launch Dispatch"
  title_vi: "Orca không trả lời về Dispatch của lần khởi động Kernel đang giữ"
  meaning_vi: "Runtime không đọc được trạng thái Dispatch của lần khởi động bị giữ nên không giải phóng tín hiệu hay chỗ của nhà cung cấp."
  causes_vi:
    - "worker-show lỗi, không phản hồi hoặc Orca đang tắt"
  nextStep_vi: "Đợi Orca phản hồi rồi chạy lại lệnh start."
  owner: supervisor
  kind: runtime-fault
kernel-launch-dispatch-unsettled:
  title: "The held Kernel launch Dispatch is not settled"
  title_vi: "Dispatch của lần khởi động Kernel đang giữ chưa kết thúc"
  meaning_vi: "Orca không báo Dispatch ở trạng thái failed, stopped hoặc released nên runtime không đóng và không giải phóng tín hiệu."
  causes_vi:
    - "Dispatch vẫn đang chạy hoặc đang sẵn sàng"
  nextStep_vi: "Supervisor dừng đúng Dispatch đó rồi mới chạy lại lệnh start."
  owner: supervisor
  kind: runtime-fault
kernel-launch-terminal-unproven:
  title: "The terminal of the held Kernel launch is not proven gone"
  title_vi: "Chưa chứng minh được cửa sổ của lần khởi động Kernel đang giữ đã đóng"
  meaning_vi: "Cửa sổ Orca báo cho Dispatch khác với cửa sổ trong biên nhận admission, hoặc vẫn đang kết nối, hoặc Orca không trả lời về nó."
  causes_vi:
    - "Cửa sổ vẫn kết nối"
  nextStep_vi: "Đóng đúng cửa sổ đó rồi chạy lại lệnh start."
  owner: supervisor
  kind: runtime-fault
check-rerun-worktree-unresolved:
  title: "The workflow worktree of a check re-run could not be resolved"
  title_vi: "Không xác định được worktree của workflow để chạy lại check"
  meaning_vi: "Runtime chỉ chạy lại check của một job trong worktree đã đăng ký của workflow đó. Worktree không xác định được nên check không được chạy lại, và không bao giờ chạy thay trong main."
  causes_vi:
    - "Các nơi ghi worktree của lần chạy (attempt, contract, packet) không cùng chỉ một worktree đã đăng ký"
    - "Worktree của workflow đã bị gỡ hoặc chưa được đăng ký"
  nextStep_vi: "Chạy starci workflow status để xem worktree của workflow, khôi phục hoặc đăng ký lại worktree đó, rồi chạy lại starci kernel record-checks."
  owner: supervisor
  kind: runtime-fault
kernel-launch-runs-unreadable:
  title: "Orca Run list could not be read"
  title_vi: "Không đọc được danh sách Run của Orca"
  meaning_vi: "Runtime không đối chiếu được Run đã tạo kể từ lần khởi động bị giữ, nên không giải phóng tín hiệu."
  causes_vi:
    - "run-list lỗi hoặc không phản hồi"
    - "Quá nhiều Run mới hơn lần khởi động để đọc hết"
  nextStep_vi: "Đợi Orca phản hồi rồi chạy lại lệnh start."
  owner: supervisor
  kind: runtime-fault
kernel-launch-run-exists:
  title: "A Kernel Run of this workflow exists since the held launch"
  title_vi: "Đã có Run Kernel của workflow này kể từ lần khởi động bị giữ"
  meaning_vi: "Orca liệt kê một Run Kernel của workflow được tạo sau khi lần khởi động bị giữ bắt đầu, nên không thể coi là không có tác động."
  causes_vi:
    - "Run đã được tạo nhưng biên nhận bị mất"
  nextStep_vi: "Supervisor kiểm tra Run đó và worker của nó, đóng đúng định danh rồi mới khởi động lại."
  owner: supervisor
  kind: runtime-fault
# Proof: scripts/kernel/verbs/route.mjs refuseIneligibleOverride — a recorded op-override pin never falls through to another pool.
op-override-ineligible:
  title: "Op-override pinned pool is ineligible"
  title_vi: "Pool được ghim bởi op-override không đủ điều kiện"
  meaning_vi: "Kernel đã ghi một op-override ghim job vào một pool cụ thể, nhưng pool đó không thể nhận job này: nằm ngoài thứ tự của op ở độ khó hiện tại, bị lineage loại trừ sau hai lỗi do pool gây ra, circuit đang mở hoặc thiếu công cụ host bắt buộc. Route từ chối có kiểu thay vì lặng lẽ chọn pool khác; job vẫn chờ."
  causes_vi:
    - "Pool được ghim nằm ngoài thứ tự của op ở độ khó hiện tại"
    - "Pool bị lineage loại trừ, circuit mở hoặc thiếu công cụ host bắt buộc"
  nextStep_vi: "Kernel đổi mục tiêu hoặc xoá override bằng starci kernel op-override --workflow <wf> --op <op> rồi route lại; route không tự chọn pool khác khi có ghim."
  owner: supervisor
  kind: dispatch-refusal
# Proof: scripts/kernel/verbs/status.mjs — a status run that emitted nothing prints this refusal on stderr and exits 1.
status-render-empty:
  title: "Status run emitted nothing"
  title_vi: "Lệnh status kết thúc mà không in gì"
  meaning_vi: "Một lượt starci kernel status kết thúc mà không phát ra JSON nào — thường do module đầu vào được đọc giữa lúc runtime đang land nên chưa chạy tới phần render, hoặc đường render kết thúc trước khi emit. Lệnh in refusal có kiểu trên stderr và thoát 1; exit 0 luôn mang theo JSON."
  causes_vi:
    - "File đầu vào của status bị đọc giữa lúc land hoặc reload runtime"
    - "Đường render status kết thúc trước khi emit"
  nextStep_vi: "Chạy lại lệnh status: lỗi đọc giữa land tự hết ở lần đọc sau; nếu lặp lại thì là runtime-defect và Supervisor điều tra đường render."
  owner: supervisor
  kind: runtime-fault
# Proof: scripts/kernel/verbs/reconcile.mjs releaseAttemptReservations — a refused no-effect release aborts the reconcile rather than leak the slot.
provider-reservation-held:
  title: "Provider reservation refused the no-effect release"
  title_vi: "Biên nhận giữ chỗ provider từ chối giải phóng no-effect"
  meaning_vi: "Reconcile đã chứng minh lần khởi động không có tác động và trả job về ready, nhưng một biên nhận provider_reservations của attempt đó từ chối chứng cứ giải phóng nên chỗ vẫn bị giữ. Reconcile huỷ bỏ thay vì để rò chỗ; job giữ fence của nó."
  causes_vi:
    - "Chứng cứ reconciled-no-effect không khớp danh tính dispatch hay phạm vi attempt của biên nhận"
    - "Biên nhận không còn ở trạng thái reserved hay unknown"
  nextStep_vi: "Supervisor đọc biên nhận đang giữ trong provider_reservations, đối chiếu scope attempt với job rồi giải phóng hoặc hòa giải tay; không ép job chạy lại khi chỗ chưa rõ."
  owner: supervisor
  kind: runtime-fault

guard-command-unresolvable:
  title: "The command guard hook cannot run in the host's shell"
  title_vi: "Hook của command guard không chạy được trong shell của host"
  meaning_vi: "Trước khi khởi động một agent, runtime chạy đúng câu lệnh hook của command guard qua từng shell mà host dùng (bash trên Windows, cmd, hoặc sh trên POSIX) và có shell không tìm thấy launcher của starci; vì lỗi hook không chặn, agent đó sẽ chạy mọi lệnh mà không có guard, nên lần khởi động bị từ chối."
  causes_vi:
    - "Thư mục ~/.starci/bin thiếu launcher POSIX (starci) hoặc launcher Windows (starci.cmd), vì starci runtime install hoặc runtime link chưa chạy lại sau khi cập nhật runtime"
    - "launcher trỏ tới một node hoặc một runtime root không còn tồn tại"
  nextStep_vi: "Không có agent nào được khởi động và không tốn lượt thử; chạy lại starci runtime link (hoặc starci runtime install) để ghi cả hai launcher, rồi khởi động lại; hàng 'command guard resolvable' của starci reconciler up --check cho biết shell nào lỗi."
  owner: supervisor
  kind: dispatch-refusal
op-incident-agent-switch:
  title: "A job left an agent that kept refusing its launch"
  title_vi: "Job rời agent liên tục từ chối khởi chạy"
  meaning_vi: "Provider hoặc agent đã từ chối khởi chạy job này nhiều lần mà không tốn lượt thử; bảng chính sách op-incident-policy tính từng lần theo từng pool và route chuyển job sang thành viên đủ điều kiện kế tiếp."
  causes_vi:
    - "Quota, rate limit hoặc circuit của provider đang mở"
    - "Worker không xác nhận bắt đầu lượt hoặc admission không còn ứng viên cho pool đó"
  nextStep_vi: "Không cần ai can thiệp: route đưa job sang agent kế tiếp; khi mọi thành viên đã hết lượt thì chuyển lên Supervisor."
  owner: runtime-core
  kind: runtime-fault
op-incident-escalate-supervisor:
  title: "An op incident exhausted its bound and goes to the Supervisor"
  title_vi: "Sự cố op hết giới hạn và chuyển lên Supervisor"
  meaning_vi: "Mọi bước xử lý của hàng chính sách tương ứng đã dùng hết số lần cho phép nên việc được chuyển lên Supervisor cùng bằng chứng đã thử."
  causes_vi:
    - "Mọi agent đủ điều kiện của job đã bị loại hoặc cạn quota"
    - "Một điều kiện host hay lỗi runtime không đổi sau các lần thử"
  nextStep_vi: "Supervisor đọc bằng chứng, sửa nguyên nhân hoặc trả lời là đã sửa, có cách tránh, hoặc không phải lỗi runtime để trả về Kernel."
  owner: supervisor
  kind: runtime-fault
op-incident-escalate-owner:
  title: "An op incident exhausted every handler and goes to the owner"
  title_vi: "Sự cố op hết mọi bên xử lý và chuyển cho chủ dự án"
  meaning_vi: "Kernel và Supervisor đã dùng hết giới hạn của hàng chính sách; chỉ chủ dự án quyết được ý định, thông tin xác thực hoặc chi phí còn lại."
  causes_vi:
    - "Câu hỏi về ý định sản phẩm hoặc thông tin xác thực mà hồ sơ mục tiêu không trả lời được"
    - "Seat Kernel không phục hồi được sau số lần thay thế cho phép"
  nextStep_vi: "Chủ dự án trả lời câu hỏi hoặc quyết định tiếp; việc bị giữ chỉ là job bị ảnh hưởng."
  owner: owner
  kind: runtime-fault
pin-lineage-excluded:
  title: "A pinned agent was excluded for this job by its history"
  title_vi: "Agent được ghim đã bị loại cho job này theo lịch sử"
  meaning_vi: "Lệnh dispatch --model chỉ định một agent mà lịch sử khởi chạy và thử lại của chính job đã loại; chỉ quyết định op-override do Kernel ghi mới được phép vượt qua."
  causes_vi:
    - "Agent đó đã từ chối khởi chạy hoặc làm hỏng job này đến giới hạn loại trừ"
  nextStep_vi: "Bỏ --model để route chọn thành viên kế tiếp, hoặc ghi starci kernel op-override với quyết định rõ ràng."
  owner: op-retry
  kind: verb-refusal

ENGINE_CONFIG_UNREADABLE:
  title: "The engine cannot read config.yaml"
  title_vi: "Bộ điều phối không đọc được config.yaml"
  meaning_vi: "Mã của bộ điều phối đang chạy không đọc được config.yaml hiện tại; nó giữ nguyên chế độ các controller đang chạy thay vì tắt chúng."
  causes_vi:
    - "config.yaml đã được thay bằng bản mới hơn mã đang nằm trong bộ nhớ của bộ điều phối"
    - "config.yaml đang được ghi dở hoặc có khóa không hợp lệ"
  nextStep_vi: "Sửa config.yaml nếu nó sai, hoặc chạy starci reconciler restart để bộ điều phối chạy trên mã mới."
  owner: owner
  kind: runtime-fault
gate-cause-required:
  title: "A supervisor-gate raise names no known cause class"
  title_vi: "Lần dựng gate cho Supervisor không nêu nhóm nguyên nhân hợp lệ"
  meaning_vi: "Mỗi gate cho Supervisor phải nêu nhóm nguyên nhân trong bảng chính sách (gateCauses) để runtime biết cách tránh nào phải thử trước."
  causes_vi:
    - "Thiếu --cause hoặc --cause không nằm trong danh sách nhóm của bảng"
  nextStep_vi: "Chạy lại starci kernel incident với --cause là một nhóm trong bảng và cách tránh đã thử hoặc lý do không có cách tránh."
  owner: op-retry
  kind: verb-refusal
gate-workaround-required:
  title: "A supervisor-gate was raised before its workaround was tried"
  title_vi: "Gate cho Supervisor được dựng trước khi thử cách tránh"
  meaning_vi: "Nhóm nguyên nhân của gate có một cách tránh trong bảng chính sách; gate chỉ được dựng sau khi cách tránh đó được thử và ghi lại, hoặc kèm lý do không có cách tránh thuộc danh sách của nhóm."
  causes_vi:
    - "Thiếu --workaround và --no-workaround"
  nextStep_vi: "Thử cách tránh mà thông báo nêu rồi ghi lại bằng --workaround, hoặc nêu --no-workaround với một lý do trong danh sách của nhóm."
  owner: op-retry
  kind: verb-refusal
gate-no-workaround-invalid:
  title: "The reason there is no workaround is not one of the cause class's reasons"
  title_vi: "Lý do không có cách tránh không thuộc danh sách của nhóm nguyên nhân"
  meaning_vi: "--no-workaround phải là một lý do có kiểu trong bảng chính sách cho nhóm nguyên nhân đã nêu, không phải văn bản tự do."
  causes_vi:
    - "Giá trị --no-workaround không nằm trong danh sách noWorkaround của nhóm"
  nextStep_vi: "Chọn một lý do trong danh sách thông báo nêu, hoặc thử cách tránh của nhóm."
  owner: op-retry
  kind: verb-refusal
gate-workaround-available:
  title: "The job still has an agent to try, so the gate is premature"
  title_vi: "Job vẫn còn agent để thử nên gate chưa cần dựng"
  meaning_vi: "Quyết định route gần nhất của job còn thành viên chưa bị loại, nên khẳng định không có cách tránh bị runtime bác bỏ."
  causes_vi:
    - "Chuỗi route của job còn thành viên chưa thử và chưa bị loại"
  nextStep_vi: "Chạy starci kernel dispatch --model với thành viên mà thông báo nêu, hoặc ghi --workaround cho kết quả của lần thử."
  owner: op-retry
  kind: verb-refusal
gate-resolution-required:
  title: "A supervisor-gate was resolved by the Supervisor without a typed resolution"
  title_vi: "Gate cho Supervisor được Supervisor đóng mà không có kiểu giải quyết"
  meaning_vi: "Supervisor trả lời gate bằng một trong ba kiểu: đã sửa (kèm commit), có cách tránh (kèm route) hoặc không phải lỗi runtime (kèm lý do), để Kernel và vòng thang biết việc tiếp theo."
  causes_vi:
    - "Thiếu --resolution khi chạy starci kernel incident --resolve --by supervisor trên gate"
  nextStep_vi: "Chạy lại với --resolution fixed --commit, workaround --route hoặc not-runtime-fault --detail."
  owner: supervisor
  kind: verb-refusal
gate-resolution-incomplete:
  title: "The typed resolution of a supervisor-gate lacks its evidence"
  title_vi: "Kiểu giải quyết gate cho Supervisor thiếu bằng chứng đi kèm"
  meaning_vi: "Mỗi kiểu giải quyết cần dữ kiện của nó: fixed cần commit sửa, workaround cần route, not-runtime-fault cần lý do kèm bằng chứng."
  causes_vi:
    - "Thiếu --commit, --route hoặc --detail đủ dài tương ứng với --resolution"
  nextStep_vi: "Bổ sung cờ mà thông báo nêu rồi chạy lại."
  owner: supervisor
  kind: verb-refusal
gate-reraise-without-evidence:
  title: "A supervisor-gate was raised again for a cause the Supervisor ruled not the runtime's"
  title_vi: "Gate được dựng lại cho nguyên nhân Supervisor đã kết luận không phải lỗi runtime"
  meaning_vi: "Supervisor đã trả lời not-runtime-fault cho cùng nguyên nhân và phạm vi; Kernel phải tự xử lý, chỉ được dựng lại gate khi có bằng chứng mới."
  causes_vi:
    - "Dựng lại gate cùng nguyên nhân và phạm vi mà không có --evidence khác với bằng chứng của gate trước"
  nextStep_vi: "Xử lý nguyên nhân trong workflow (thử lại, lập kế hoạch lại hoặc quyết định), hoặc dựng lại với --evidence mới."
  owner: op-retry
  kind: verb-refusal

RT_SONAR_BASELINE_STALE:
  title: "A sonar-rules baseline entry outlived its finding"
  title_vi: "Một mục baseline của sonar-rules còn lại khi phát hiện đã hết"
  meaning_vi: "Section sonar-rules của modules/kernel/allowlist.yaml liệt kê một phát hiện Sonar (luật, tệp, dấu vân tay của nút bị gắn cờ) mà mã hiện tại không còn mắc. Baseline chỉ được thu nhỏ: commit sửa phát hiện phải xóa luôn mục của nó, nếu không kiểm tra sonar-rules đỏ."
  causes_vi:
    - "Commit sửa phát hiện nhưng không xóa mục tương ứng trong section sonar-rules"
    - "Mã được viết lại hoặc xóa nên phát hiện biến mất cùng nút bị gắn cờ"
  nextStep_vi: "Người sửa chạy starci runtime check --only sonar-rules -- --prune để xóa các mục đã hết phát hiện, rồi đưa thay đổi allowlist vào cùng commit."
  owner: supervisor
  kind: check-finding

RELEASE_VERSION_UNCHANGED:
  title: "Release commit keeps the version of the remote main"
  title_vi: "Commit phát hành giữ nguyên phiên bản của main trên remote"
  meaning_vi: "package.json của commit được đẩy có version trùng với version tại đầu main trên remote, nên đây không phải một bản phát hành mới; main của runtime chỉ di chuyển cùng một bản phát hành."
  causes_vi:
    - "Đẩy main để lấy kết quả CI hoặc SonarCloud giữa hai bản phát hành"
    - "Quên nâng version trong package.json trước khi cắt bản phát hành"
  nextStep_vi: "Không đẩy main giữa hai bản phát hành; khi owner chốt cột mốc, nâng version, chuyển mục CHANGELOG sang version mới, commit rồi chạy starci release cut --tag v<version>."
  owner: supervisor
  kind: verb-refusal

RELEASE_TAG_VERSION:
  title: "Release tag is not the version of the commit"
  title_vi: "Thẻ phát hành không phải version của commit"
  meaning_vi: "Tên thẻ được đẩy hoặc được yêu cầu cắt khác v<version> theo package.json của commit; thẻ phát hành luôn là v cộng với version của chính commit mà nó trỏ tới."
  causes_vi:
    - "Gọi release cut với tên thẻ không khớp package.json"
    - "Tạo thẻ v* tay trên một commit chưa nâng version"
  nextStep_vi: "Dùng đúng thẻ v<version> của commit, hoặc sửa version trong package.json rồi commit; không dời hay xóa thẻ đã có."
  owner: supervisor
  kind: verb-refusal

RELEASE_CHANGELOG_SECTION:
  title: "Release commit has no finished, dated CHANGELOG section"
  title_vi: "Commit phát hành chưa có mục CHANGELOG hoàn chỉnh và có ngày"
  meaning_vi: "CHANGELOG.md tại commit được đẩy không có tiêu đề ## [<version>] kèm ngày, hoặc mục đó còn TODO, PENDING, TBD hay dấu in preparation."
  causes_vi:
    - "Mục của bản phát hành vẫn đang ở trạng thái in preparation"
    - "Còn sót dấu chưa xong trong mục CHANGELOG"
  nextStep_vi: "Hoàn tất mục CHANGELOG của version, ghi ngày vào tiêu đề, commit rồi chạy starci release cut --tag v<version>."
  owner: supervisor
  kind: verb-refusal

RELEASE_TAG_MISSING:
  title: "No annotated release tag on the pushed commit"
  title_vi: "Commit được đẩy chưa có thẻ phát hành annotated"
  meaning_vi: "Không có thẻ annotated v<version> trỏ tới commit được đẩy; thẻ do release cut tạo với mục CHANGELOG làm thông điệp, nên một lần đẩy main không đi kèm thẻ đó không phải bản phát hành."
  causes_vi:
    - "Đẩy main bằng git push thay vì release cut"
    - "Thẻ là lightweight hoặc nằm trên commit khác"
  nextStep_vi: "Chạy starci release cut --tag v<version> (thêm --plan để xem trước); lệnh này tạo thẻ annotated rồi đẩy main và thẻ cùng nhau."
  owner: supervisor
  kind: verb-refusal

RELEASE_RECEIPT_MISSING:
  title: "No release record for exactly the pushed commit"
  title_vi: "Không có bản ghi phát hành cho đúng commit được đẩy"
  meaning_vi: "Thư mục git chung không có bản ghi starci-release của đúng commit này và thẻ này, nghĩa là suite đầy đủ và các suite của package chưa chạy xanh trên chính commit sẽ được đẩy."
  causes_vi:
    - "Bản ghi thuộc về một commit khác vì main đã di chuyển sau lần chạy suite"
    - "Đẩy main mà không đi qua release cut"
  nextStep_vi: "Chạy starci release cut --tag v<version> trên đúng commit sẽ phát hành; lệnh này chạy suite, ghi bản ghi theo sha rồi đẩy."
  owner: supervisor
  kind: verb-refusal

RELEASE_RECEIPT_INCOMPLETE:
  title: "Release record lacks a green row"
  title_vi: "Bản ghi phát hành thiếu một dòng xanh"
  meaning_vi: "Bản ghi của commit có tồn tại nhưng thiếu dòng xanh cho suite gốc, các suite của package hoặc các check mà định nghĩa bản phát hành yêu cầu."
  causes_vi:
    - "Bản ghi được ghi bởi một phiên bản release cut cũ chưa chạy suite của package"
    - "Một bước của L4 đỏ hoặc vắng mặt"
  nextStep_vi: "Chạy lại starci release cut --tag v<version> sau khi sửa phần đỏ; không sửa tay bản ghi."
  owner: supervisor
  kind: verb-refusal

RELEASE_REMOTE_HEAD_UNKNOWN:
  title: "Remote main head is not in this repository"
  title_vi: "Đầu main trên remote không có trong repository này"
  meaning_vi: "Commit mà remote main đang trỏ tới chưa được fetch về, nên không so được version của bản phát hành mới với bản đang có trên remote."
  causes_vi:
    - "Remote có commit mới mà clone này chưa fetch"
  nextStep_vi: "Fetch main từ remote rồi chạy lại release cut; không đẩy force."
  owner: supervisor
  kind: verb-refusal

RELEASE_VERSION_UNREADABLE:
  title: "package.json of the pushed commit has no readable version"
  title_vi: "package.json của commit được đẩy không có version đọc được"
  meaning_vi: "Không đọc được trường version từ package.json tại commit được đẩy, nên không xác định được bản phát hành."
  causes_vi:
    - "package.json bị xóa, hỏng JSON hoặc thiếu trường version"
  nextStep_vi: "Khôi phục package.json với trường version hợp lệ rồi commit."
  owner: supervisor
  kind: verb-refusal
RUNTIME_CHANGE_OWNED_BY_DEBUG:
  title: "The Supervisor tried to change the runtime"
  title_vi: "Supervisor cố thay đổi runtime"
  meaning_vi: "Thay đổi .claude (hợp đồng, prompt, chính sách, cổng kiểm, mã runtime) thuộc về Debug và các lane sửa do Debug mở trong giai đoạn ổn định, rồi thuộc về luồng phát hành của chủ sở hữu. Supervisor không chạy fix worker, không land lên kho runtime, không sửa tệp trong bản checkout runtime."
  causes_vi:
    - "Supervisor chạy starci supervisor land, lesson-actions hoặc workers create/stage/spawn"
    - "Supervisor ghi một tệp trong bản checkout runtime"
  nextStep_vi: "Supervisor ghi lỗi runtime bằng starci supervisor actions record --item runtime-defect:<nguyên nhân> kèm bằng chứng, cho Kernel một cách đi vòng; Debug sửa."
  owner: supervisor
  kind: blocker

CRITIC_NO_INDEPENDENT_MEMBER:
  title: "No independent critic available"
  title_vi: "Không có người chấm độc lập"
  meaning_vi: "Hạng Critic không có thành viên nào thuộc nhà cung cấp khác với bên làm ra sản phẩm, nên lượt chấm bị từ chối và nhà cung cấp của bên làm ra không bao giờ tự chấm."
  causes_vi:
    - "Hạng Critic chỉ còn thành viên của nhà cung cấp đã làm ra sản phẩm"
    - "Các thành viên khác nhà cung cấp bị gỡ khỏi hạng"
  nextStep_vi: "Op báo blocked kèm nguyên nhân; Kernel chờ hoặc nâng lên Supervisor để có thành viên khác nhà cung cấp trở lại hạng Critic (modules/models/tiers.yaml seats.critic)."
  owner: supervisor
  kind: blocker

CRITIC_UNAVAILABLE:
  title: "Independent critic unavailable"
  title_vi: "Người chấm độc lập chưa sẵn sàng"
  meaning_vi: "Người chấm độc lập không khởi động hoặc không trả lời được: đăng nhập, mạch nhà cung cấp, sức chứa, lần khởi chạy bị từ chối, báo lên hoặc quá thời hạn."
  causes_vi:
    - "Nhà cung cấp hết phiên đăng nhập hoặc mạch đang mở"
    - "Người chấm không trả lời trong thời hạn allocation.drawLoop.criticTimeoutMs"
    - "Người chấm báo lên vì không thể chấm"
  nextStep_vi: "Vòng vẽ chạy lại finish sau khi một thành viên độc lập quay lại; Kernel theo dõi báo cáo blocked của Op."
  owner: op-retry
  kind: blocker

CRITIC_QUOTA_OUT:
  title: "Every independent critic is out of tokens"
  title_vi: "Mọi người chấm độc lập đã hết hạn mức"
  meaning_vi: "Mọi thành viên độc lập của hạng Critic đều hết token, nên lượt chấm chờ đến khi hạn mức làm mới."
  causes_vi:
    - "Hạn mức tuần hoặc phiên của nhà cung cấp đã dùng hết"
  nextStep_vi: "Bộ chọn tự lấy thành viên độc lập tiếp theo; khi không còn, Op báo blocked và Kernel chờ hạn mức làm mới."
  owner: supervisor
  kind: blocker

CRITIC_AUTHOR_UNKNOWN:
  title: "The maker of the product is unknown"
  title_vi: "Không biết bên làm ra sản phẩm"
  meaning_vi: "Runtime không xác định được nhà cung cấp đã làm ra sản phẩm nên không thể chứng minh người chấm độc lập."
  causes_vi:
    - "Terminal của Op không gắn với một nhà cung cấp"
    - "Không truyền --drawer"
  nextStep_vi: "Chạy vòng vẽ từ terminal đã gắn Op hoặc truyền --drawer <nhà cung cấp>."
  owner: op-retry
  kind: check-finding

CRITIC_NO_VERDICT:
  title: "The critic reported done without a verdict"
  title_vi: "Người chấm báo xong nhưng không có phán quyết"
  meaning_vi: "Người chấm báo worker_done mà tệp verdict.json không có hoặc không đọc được; đây là lỗi của vai trò Critic, không phải điểm thấp."
  causes_vi:
    - "Người chấm không ghi verdict.json"
    - "verdict.json không phải JSON đúng dạng starci/draw-critique@1"
  nextStep_vi: "Runtime từ chối và ghi lại cho Debug; vòng vẽ không có điểm cho đến khi chấm lại."
  owner: runtime-core
  kind: runtime-fault

CRITIC_PRODUCT_MODIFIED:
  title: "The critic changed what it was handed"
  title_vi: "Người chấm đã sửa tệp được giao"
  meaning_vi: "Sau khi chạy, các byte sản phẩm hoặc thước chấm trong thư mục của người chấm khác với lúc giao, hoặc có tệp lạ; phán quyết bị từ chối."
  causes_vi:
    - "Người chấm sửa hoặc xóa tệp được giao"
    - "Người chấm tạo thêm tệp ngoài verdict.json"
  nextStep_vi: "Runtime từ chối phán quyết và ghi lại cho Debug sửa .claude."
  owner: runtime-core
  kind: runtime-fault

CRITIC_VERDICT_STALE:
  title: "The verdict judged other bytes than the product"
  title_vi: "Phán quyết chấm sai byte của sản phẩm"
  meaning_vi: "Các dấu vết sha256 trong phán quyết không gồm phần sản phẩm mà lượt làm của Op đang giữ, nên phán quyết bị từ chối."
  causes_vi:
    - "Phần vẽ được vẽ lại sau lần chấm"
    - "Phán quyết không nêu dấu vết sản phẩm"
  nextStep_vi: "Cổng draw từ chối; chấm lại đúng phần sản phẩm hiện tại bằng finish."
  owner: runtime-core
  kind: check-finding

CRITIC_UNGUARDED:
  title: "The critic terminal is not bound to its guard"
  title_vi: "Terminal người chấm chưa gắn vào guard"
  meaning_vi: "Terminal của người chấm không được gắn với guard vai trò critic sau khi khởi chạy, nên phán quyết của nó không được tin."
  causes_vi:
    - "Việc ghi guard hoặc gắn terminal thất bại"
  nextStep_vi: "Runtime từ chối lượt chấm và ghi lại cho Debug."
  owner: runtime-core
  kind: runtime-fault

RIGHTS_CRITIC_REACH:
  title: "Critic reach refused"
  title_vi: "Từ chối người chấm đọc hoặc ghi ngoài phạm vi"
  meaning_vi: "Người chấm chỉ đọc trong thư mục của mình và chỉ ghi tệp phán quyết; lệnh, đường dẫn hoặc công cụ khác bị từ chối."
  causes_vi:
    - "Người chấm chạy lệnh không chỉ đọc"
    - "Người chấm đọc hoặc ghi đường dẫn ngoài thư mục được giao"
  nextStep_vi: "Lệnh bị từ chối; chấm chỉ bằng các tệp trong thư mục của bạn, ghi verdict.json rồi báo worker_done."
  owner: op-retry
  kind: verb-refusal
placement-lost:
  title: "Attempt ended: its tree path was lost"
  title_vi: "Lượt chạy kết thúc: đường dẫn cây làm việc đã mất"
  meaning_vi: "Cây của workflow được tạo lại ở đường dẫn khác, worker của lượt này đã chết và báo cáo của nó chưa nộp hoặc thiếu tệp trong cây mới, nên runtime tự kết thúc lượt, không tính vào số lần thử của op."
  causes_vi:
    - "Máy khởi động lại và bộ dọn cây gỡ thư mục cũ của workflow"
    - "Báo cáo chưa được nộp, hoặc tệp nó nêu không còn trong cây mới"
  nextStep_vi: "Runtime tự xếp lại lượt kế tiếp bằng đường failed-no-step; không cần ai làm gì thêm."
  owner: op-retry
  kind: settle-reason
tree-reattached:
  title: "Placement rebound after the tree was re-attached"
  title_vi: "Vị trí làm việc được gắn lại sau khi cây được dựng lại"
  meaning_vi: "Cây của workflow được dựng lại ở đường dẫn khác; lượt chạy đã nộp báo cáo và mọi tệp của nó có trong cây mới, nên sự kiện placement-rebound chuyển đường dẫn cũ sang cây mới cho bước chốt và các kiểm tra."
  causes_vi:
    - "Máy khởi động lại và cây cũ bị gỡ"
  nextStep_vi: "Bộ chốt tự chốt lượt này trong cây mới; không cần ai làm gì thêm."
  owner: runtime-core
  kind: settle-reason
