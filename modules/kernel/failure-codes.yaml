    - "Trang chưa gắn layout riêng cho nút này"
  nextStep_vi: "Op dựng khung giao diện cần sửa activeNav hoặc gắn layout cho nút; kiểm tra chạy lại sau khi sửa."
  owner: other-op:interface.scaffold
  kind: check-finding

