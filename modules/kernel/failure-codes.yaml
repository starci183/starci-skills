  causes_vi:
    - "Template literal có ${biến} trong câu SQL"
    - "Ghép chuỗi SQL bằng dấu +"
    - "Thẻ sql nhận một phép thế không có kiểu SqlIdent (một chuỗi thường, một số)"
  nextStep_vi: "Truyền giá trị bằng tham số đánh số ($1, $2) ở mảng đối số; tên cột hoặc bảng động đi qua ident(tên, danhSáchChoPhép), phép thế duy nhất thẻ sql chấp nhận; câu lệnh là hằng SqlText trong persistence/<tên>.sql.ts chứ không ghép ở nơi gọi. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SQL_OUTSIDE_PERSISTENCE:
  title: "Raw SQL outside persistence/<name>.sql.ts"
  title_vi: "SQL thô ngoài persistence/<name>.sql.ts"
  meaning_vi: "Có câu SQL viết ngoài hằng `sql` trong tệp persistence/<name>.sql.ts của năng lực sở hữu, hoặc `.query()` nhận một chuỗi không phải SqlText, hoặc có createQueryBuilder. SQL rải trong service và handler không được kiểm tra bảng sở hữu và giới hạn đọc."
  causes_vi:
    - "manager.query(\"SELECT ...\") viết thẳng trong handler hoặc service"
    - "createQueryBuilder dùng cho truy vấn phức tạp"
    - "SQL còn nằm trong *.repository.ts kiểu cũ"
  nextStep_vi: "Chuyển câu SQL thành hằng `sql` trong src/modules/<tầng>/<năng lực>/persistence/<tên>.sql.ts, kiểu dòng trả về và hàm ánh xạ ở <tên>.rows.ts, rồi gọi entityManager.query(HẰNG, [tham số]); thay QueryBuilder bằng tùy chọn find hoặc hằng sql. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SQL_TABLE_OWNER:
  title: "SQL touches a table outside its capability or context, or reads unbounded"
  title_vi: "SQL ghi bảng ngoài năng lực, đọc bảng ngoài ngữ cảnh hoặc đọc không giới hạn"
  meaning_vi: "Bộ kiểm tra phân tích từng hằng SqlText: câu lệnh ghi (INSERT, UPDATE, DELETE) chỉ được chạm bảng của entity thuộc chính năng lực đó; câu đọc (FROM, JOIN, USING, truy vấn con) chỉ được chạm bảng của chính ngữ cảnh của nó (ngữ cảnh là kết nối mà mảng entity của năng lực được đăng ký), tức bảng của năng lực mình hoặc của năng lực cùng ngữ cảnh mà chủ sở hữu được phép import; một bảng của ngữ cảnh khác, kể cả khi JOIN, bị từ chối vì dữ liệu giữa các ngữ cảnh chỉ đi bằng sự kiện (bản sao cục bộ do reactor cập nhật hoặc projection). SELECT nhiều dòng phải có LIMIT trừ khi lọc theo khóa chính hoặc khóa duy nhất hoặc chỉ tính tổng."
  causes_vi:
    - "Service của năng lực A cập nhật bảng của năng lực B"
    - "JOIN hoặc truy vấn con sang bảng của ngữ cảnh khác (ví dụ order đọc bảng của identity)"
    - "Truy vấn danh sách quên LIMIT"
    - "Bảng chưa có entity khai báo ở năng lực sở hữu"
  nextStep_vi: "Chuyển câu ghi về năng lực sở hữu bảng và gọi qua API công khai của năng lực đó. Với dữ liệu của ngữ cảnh khác: giữ bản sao cục bộ trong ngữ cảnh của mình do reactor cập nhật từ sự kiện, hoặc đọc một projection, rồi JOIN trên bảng cục bộ đó. Thêm LIMIT theo PAGE_SIZE_MAX, LIST_ROWS_MAX hoặc BATCH_ROWS của platform/database. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_OWNER:
  title: "An app composes a context it does not own"
  title_vi: "Một app lắp ghép ngữ cảnh không thuộc về nó"
  meaning_vi: "Mỗi mục hfs.json connections là một ngữ cảnh giới hạn (bounded context) và có đúng một app chủ (owner). Bộ kiểm tra thấy một app api hoặc worker đăng ký kết nối của app khác trong module cơ sở dữ liệu, import năng lực thuộc ngữ cảnh của app khác, hoặc app migrate/cli không đăng ký đủ mọi kết nối (migration chỉ chạy qua cli migrate, mỗi kết nối một lần)."
  causes_vi:
    - "App order đăng ký thêm kết nối identity để đọc trực tiếp dữ liệu của identity"
    - "App order import năng lực domain/identity thay vì gọi API hoặc nghe sự kiện của identity"
    - "Thêm kết nối mới vào hfs.json nhưng app migrate/cli chưa đăng ký nó"
  nextStep_vi: "Chỉ đăng ký các kết nối mà app là owner; dữ liệu của ngữ cảnh khác lấy qua API công khai của app chủ hoặc qua sự kiện (bản sao cục bộ, projection). Với app migrate/cli, đăng ký đủ mọi kết nối đã khai báo. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_COUPLING:
  title: "Contexts are coupled by a relation, a foreign key or an import"
  title_vi: "Các ngữ cảnh bị ghép với nhau bằng quan hệ, khóa ngoại hoặc import"
  meaning_vi: "Các ngữ cảnh giới hạn chỉ liên lạc bằng sự kiện. Bộ kiểm tra thấy một quan hệ entity (OneToOne, OneToMany, ManyToOne, ManyToMany) trỏ sang entity của ngữ cảnh khác, một khóa ngoại (REFERENCES) trong migration trỏ sang bảng của ngữ cảnh khác, hoặc tệp của năng lực domain/projection import tệp của năng lực thuộc ngữ cảnh khác (entity, service hoặc SQL)."
  causes_vi:
    - "@ManyToOne(() => UserEntity) từ entity của order sang entity của identity"
    - "Migration tạo FOREIGN KEY ... REFERENCES users trên bảng của ngữ cảnh khác"
    - "Service của order import service của identity để lấy dữ liệu người dùng"
  nextStep_vi: "Giữ id của ngữ cảnh kia như một cột thường, không quan hệ và không khóa ngoại; dữ liệu cần dùng thì giữ bản sao cục bộ do reactor cập nhật từ sự kiện của ngữ cảnh đó, hoặc đọc một projection trong modules/projections/<tên>. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_TRANSACTION:
  title: "One transaction spans more than one context"
  title_vi: "Một giao dịch trải qua nhiều hơn một ngữ cảnh"
  meaning_vi: "Một giao dịch chỉ được chạm kết nối của một ngữ cảnh. Bên trong callback của transaction trên EntityManager của kết nối C, bộ kiểm tra thấy dùng EntityManager của kết nối khác (nhận ra qua injector Inject<Conn>EntityManager) hoặc gọi một service của năng lực thuộc ngữ cảnh khác (service đó ghi bằng kết nối riêng của nó nên không thể cùng một giao dịch)."
  causes_vi:
    - "Trong giao dịch của order gọi identityService.update(...)"
    - "Giao dịch trên kết nối order dùng this.billingManager để ghi bảng của billing"
  nextStep_vi: "Chia thành một giao dịch cho mỗi ngữ cảnh, nối với nhau bằng sự kiện qua event bus (saga có bù trừ cho từng bước); đừng cố gom nhiều ngữ cảnh vào một commit. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_PLATFORM_TABLES:
  title: "A per-connection platform capability has no tables on a connection that uses it"
  title_vi: "Năng lực nền tảng theo kết nối chưa có bảng trên kết nối đang dùng nó"
  meaning_vi: "Outbox/inbox của event bus và bảng job tồn tại trên mỗi kết nối dùng chúng (manifest liệt kê chúng trong perConnection của slot be.persistence). Bộ kiểm tra thấy một lời gọi truyền EntityManager của kết nối C vào năng lực đó, nhưng mảng entity và migration của năng lực chưa được đăng ký trên C, nên dòng ghi ra không có bảng trong cơ sở dữ liệu của ngữ cảnh đó."
  causes_vi:
    - "Thêm ngữ cảnh mới phát sự kiện nhưng quên đăng ký entity/migration của event-bus trên kết nối của nó"
    - "Handler gọi eventBus.publish(event, manager) với manager của kết nối chưa có bảng outbox"
  nextStep_vi: "Đăng ký entity và migration của năng lực nền tảng đó trên kết nối của ngữ cảnh (app chủ và cli migrate), để mỗi cơ sở dữ liệu có bảng riêng của nó trong cùng giao dịch với thay đổi nghiệp vụ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTRACT_BREAKING:
  title: "An event contract changed in a breaking way"
  title_vi: "Hợp đồng sự kiện bị đổi theo cách phá vỡ tương thích"
  meaning_vi: "Hợp đồng sự kiện be/contracts/<service>/events.json chỉ được phát triển theo hướng cộng thêm so với bản đã ghim events.pin.json (bản đã công bố trước đó). Bộ kiểm tra thấy một sự kiện bị xóa, đổi stream hoặc version, một trường payload bị xóa, đổi kiểu hoặc đổi tính tùy chọn, hoặc một trường mới ở dạng bắt buộc (sự kiện đang nằm trên đường truyền không mang trường đó)."
  causes_vi:
    - "Xóa hoặc đổi tên trường payload của order.placed"
    - "Đổi kiểu totalCents từ number sang string"
    - "Thêm trường bắt buộc mới vào sự kiện đã công bố"
  nextStep_vi: "Giữ nguyên sự kiện cũ và thêm sự kiện mới <tên>.v2 với hình dạng mới (consumer chuyển dần rồi mới bỏ bản cũ); chỉ thêm trường mới ở dạng tùy chọn (field?). Khi công bố hợp đồng mới, chép events.json đè lên events.pin.json. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_QUERY_UNBOUNDED:
  title: "Read without a row bound"
  title_vi: "Truy vấn đọc không có giới hạn số dòng"
  meaning_vi: "Một lệnh find, findBy hoặc findAndCount trên EntityManager có thể trả về mọi dòng khớp mà không nêu take trong đối tượng tùy chọn, nên một khách hàng lớn biến nó thành quét toàn bảng nằm trong bộ nhớ."
  causes_vi:
    - "manager.find(Entity, { where }) không có take"
    - "findBy không thể mang giới hạn"
    - "Tùy chọn find là biến, không viết take ngay tại chỗ gọi"
  nextStep_vi: "Viết take với hằng có tên ngay trong đối tượng tùy chọn (manager.find(Entity, { where, take: LIST_ROWS_MAX })), hoặc phân trang theo con trỏ; câu SELECT thô do máy kiểm tra R86 xét; việc cần đủ mọi dòng (batch, xuất) lặp theo trang keyset chứ không cắt cụt kết quả âm thầm. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_RAW_INJECT:
  title: "Infrastructure dependency injected without its Inject*() decorator"
  title_vi: "Phụ thuộc hạ tầng không được tiêm qua Inject*()"
  meaning_vi: "Mọi tham số constructor có kiểu thuộc hạ tầng (EntityManager, CommandBus, Clock, Logger, Cache, HttpClient, options của module, client SDK) phải mang một decorator Inject<Thing>() không tham số, export từ <owner>.decorators.ts và dựng bằng injector<T>(token) trên token unique symbol. Bộ kiểm tra thấy @Inject( thô ngoài *.decorators.ts, token chuỗi, forwardRef, ModuleRef, tiêm qua thuộc tính, injector sai hình hoặc kiểu T khác kiểu tham số. Token của Inject<Thing>() mà một service dùng cũng phải được export (từ <cap>.decorators.ts hoặc index.ts của năng lực) để spec có thể cung cấp nó."
  causes_vi:
    - "Token của Inject<Thing>() là const riêng tư, không export"
    - "@Inject(TOKEN) viết thẳng ở nơi dùng"
    - "Token là chuỗi thay vì unique symbol"
    - "Tiêm lớp hạ tầng (CacheService, AppLogger) không qua injector"
    - "Dùng ModuleRef.get hoặc forwardRef để né vòng phụ thuộc"
    - "constructor(private readonly timeoutMs: number) {} hoặc ReadonlyMap<string, X> không có Inject<Thing>() gắn token có tên"
  nextStep_vi: "Khai báo token `export const THING: unique symbol = Symbol(\"<owner>.<thing>\")` và `export const InjectThing = (): TypedParameterDecorator<Thing> => injector<Thing>(THING)` trong <owner>.decorators.ts rồi dùng @InjectThing() ở mọi nơi; vòng phụ thuộc là lỗi kiến trúc cần gỡ, không dùng forwardRef. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_HTTP_TIMEOUT:
  title: "Outbound HTTP call without a timeout"
  title_vi: "Gọi HTTP ra ngoài không có timeout"
  meaning_vi: "Một lời gọi fetch, axios hoặc HttpService không nêu timeout hay signal huỷ, nên một bên ngoài im lặng giữ yêu cầu, socket và một chỗ worker vô hạn."
  causes_vi:
    - "fetch(url) không có { signal }"
    - "axios.get hoặc post không có timeout"
    - "axios.create không có timeout"
  nextStep_vi: "Thêm signal: AbortSignal.timeout(<ms có tên>) cho fetch, hoặc timeout: <ms có tên> cho axios và HttpService. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_LOG_SECRET:
  title: "Secret or personal data in a log call"
  title_vi: "Bí mật hoặc dữ liệu cá nhân bị ghi vào log"
  meaning_vi: "Một lời gọi trên cổng Logger của platform/logging truyền vào một giá trị có kiểu Secret (platform/config) hoặc Pii (identity), hay đọc ra từ một giá trị như vậy; hoặc một đối số có tên là thông tin xác thực (password, secret, token, apiKey, authorization, cookie, otp) hay định danh cá nhân (email, phone, fullName, idCard, birthDate), nên giá trị đó tồn tại lâu hơn yêu cầu và bị sao chép sang bên thứ ba."
  causes_vi:
    - "Ghi một giá trị kiểu Secret hoặc Pii, dù đặt tên là gì"
    - "Ghi token hoặc mật khẩu vào log để gỡ lỗi"
    - "Ghi email hoặc số điện thoại vào thông điệp lỗi"
    - "Tạo một lỗi (lớp kế thừa Error, kể cả DomainError) mang giá trị kiểu Secret hoặc chuỗi có tên là thông tin xác thực (token, mật khẩu, authorization, clientSecret) trong thông điệp hay params"
  nextStep_vi: "Ghi id của chủ sở hữu, độ dài, cờ có hay không, hoặc dạng đã che qua mask(...), không ghi giá trị thật. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TYPE_ESCAPE:
  title: "Type escape: cast, non-null assertion, any, Function or eval"
  title_vi: "Thoát kiểu: ép kiểu, non-null, any, Function hoặc eval"
  meaning_vi: "Có x as T (kể cả as never, as unknown as T), <T>x, x!, any, kiểu Function hoặc eval trong bất kỳ tệp nào, kể cả spec, nên trình biên dịch ngừng kiểm tra một giá trị mà thực tế có thể sai kiểu hoặc vắng mặt. Ép kiểu, x! và any do các luật mượn của typescript-eslint mà nhà máy cấu hình bật; Function và eval do luật no-function-or-eval của canon chặn."
  causes_vi:
    - "as never hoặc as unknown as X để lọt kiểm tra tham số, trong mã sản phẩm hay trong spec"
    - "x! thay cho việc kiểm tra tồn tại"
    - "Kiểu Function, eval hoặc new Function thay cho chữ ký có kiểu"
  nextStep_vi: "Cho giá trị đúng kiểu tham số cần (mock<T>() cho double trong spec), thu hẹp bằng guard trả về hoặc ném lỗi có kiểu, hoặc sửa chữ ký để sự vắng mặt không thể xảy ra. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ASYNC_NO_AWAIT:
  title: "Async function that never awaits"
  title_vi: "Hàm async không có await"
  meaning_vi: "Một hàm async không chứa await nào, nên nó hứa việc bất đồng bộ mà không làm, biến lỗi ném ra thành promise bị từ chối vô ích và khiến người đọc tìm một điểm chờ không tồn tại."
  causes_vi:
    - "async method chỉ return giá trị đồng bộ"
    - "async arrow chỉ trả về promise của hàm khác"
  nextStep_vi: "Bỏ async và trả giá trị (hoặc promise thân hàm đã có); nếu chữ ký phải trả Promise thì trả Promise.resolve(giá trị). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MIGRATION_REVERSIBLE:
  title: "Migration that cannot be undone"
  title_vi: "Migration không có down đảo ngược được"
  meaning_vi: "Một migration có up() nhưng thiếu down(), down() rỗng hoặc chỉ ném lỗi, nên bản phát hành cần quay lui không có đường đi và bảng migration ghi đã hoàn tác trong khi lược đồ vẫn đổi."
  causes_vi:
    - "Không có phương thức down"
    - "down() rỗng"
    - "down() chỉ throw"
  nextStep_vi: "Viết down() là phép đảo ngược đúng của up(); khi up() xoá dữ liệu thì down() dựng lại cấu trúc và ghi rõ phần dữ liệu mất trong chú thích migration. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_RETURN_TYPE:
  title: "Handler or public method without a return type"
  title_vi: "Handler hoặc phương thức công khai thiếu kiểu trả về"
  meaning_vi: "Một handler (Query, Mutation, Get, Post...) hoặc phương thức công khai của Injectable, Resolver, Controller không khai báo kiểu trả về, nên hợp đồng ra ngoài là thứ thân hàm tình cờ trả về hôm nay."
  causes_vi:
    - "Resolver hoặc controller method không có : Promise<T>"
    - "Phương thức công khai của service để kiểu suy luận"
  nextStep_vi: "Khai báo kiểu trả về tường minh (Promise<Type>). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_JSON_PARSE_UNGUARDED:
  title: "JSON.parse outside a try"
  title_vi: "JSON.parse không nằm trong try"
  meaning_vi: "Một lời gọi JSON.parse không nằm trong try trong cùng hàm, nên văn bản hỏng từ cơ sở dữ liệu, webhook hoặc nhà cung cấp gây ngoại lệ không được che và trả về 500."
  causes_vi:
    - "JSON.parse cột văn bản đã lưu"
    - "JSON.parse thân webhook hay phản hồi nhà cung cấp"
  nextStep_vi: "Bọc trong try và trả outcome có kiểu (hoặc DomainError) nêu rõ đang phân tích cái gì. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_QUERY_IN_LOOP:
  title: "Query inside a loop (N+1)"
  title_vi: "Truy vấn chạy trong vòng lặp (N+1)"
  meaning_vi: "Một lệnh đọc trên EntityManager (find, findOne, count, exists...) chạy một lần cho mỗi phần tử của vòng lặp for hoặc của map, forEach, flatMap, nên số lượt gọi cơ sở dữ liệu tăng theo đầu vào và một yêu cầu lớn giữ kết nối rất lâu."
  causes_vi:
    - "for (const id of ids) { await manager.findOne(...) }"
    - "Promise.all(ids.map((id) => manager.findOneBy(Entity, { id })))"
  nextStep_vi: "Đọc một lần trước vòng lặp bằng find({ where: { khóa: In(danhSachKhoa) }, take }) hoặc WHERE khóa = ANY($1), dựng Map theo khóa rồi tra trong vòng lặp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_USER_COPY_LITERAL:
  title: "User-facing copy written in source"
  title_vi: "Chữ hiển thị cho người dùng viết thẳng trong mã nguồn"
  meaning_vi: "Một chuỗi chữ cố định xuất hiện ở nơi người dùng đọc được nó - tham số message của một *Error/*Exception, thuộc tính subject/title/body/text/message truyền vào notify/send/publish, hoặc thuộc tính message/description/title của một object trả về trong tầng transport - thay vì được tra theo khóa từ bộ danh mục messages theo từng capability qua cổng MessageCatalog kiểu platform/i18n."
  causes_vi:
    - "throw new PlanNotFoundError('Plan not found for this account')"
    - "this.notifier.send({ subject: 'Your plan has changed', templateId: 'plan-x' })"
    - "return { message: 'Plan updated successfully' }"
  nextStep_vi: "Thêm khóa vào catalog messages (vi và en) của capability hoặc feature liên quan, rồi gọi qua cổng MessageCatalog (messages.get('<khóa>', { ...tham số })) thay vì viết chuỗi tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_AMBIENT_CLOCK:
  title: "Ambient clock read directly"
  title_vi: "Đọc đồng hồ hệ thống trực tiếp"
  meaning_vi: "Một tệp (kể cả spec) ngoài platform/clock tham chiếu tới đồng hồ hệ thống: Date.now, new Date() không tham số, performance.now, process.hrtime hoặc Temporal.Now, dù gọi hay chỉ tham chiếu, nên không có cách nào thay đồng hồ trong một spec hoặc lái một job theo lịch tới một thời điểm chọn trước."
  causes_vi:
    - "const startedAt = Date.now()"
    - "const at = new Date()"
    - "const mark = performance.now()"
    - "const read = Date.now, hoặc const { now } = performance"
  nextStep_vi: "Tiêm cổng Clock (đọc thời gian qua clock.now()) thay vì đọc đồng hồ hệ thống trực tiếp; một spec lái thời gian bằng FakeClock của @starci/jest-preset. op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INBOX_DEDUPE_MISSING:
  title: "Webhook or consumer with no inbox dedupe"
  title_vi: "Thiếu chống trùng lặp qua inbox"
  meaning_vi: "Một handler của consumer (tệp *.consumer.ts trong transport/message) hoặc một handler mang @Public({ reason: PublicReason.SignedWebhook }) không bắt đầu bằng await inbox.claim(source, eventId) trên một receiver có kiểu Inbox của platform/inbox, hoặc có claim nhưng không return sớm khi claim trả false, nên khi bên gửi gửi lại (webhook không thấy phản hồi kịp, hàng đợi giao lại một thông điệp chưa được xác nhận) hành động sẽ chạy lại lần nữa thay vì là một no-op."
  causes_vi:
    - "@Public({ reason: PublicReason.SignedWebhook }) handle() { return this.service.charge() }"
    - "class PaymentCapturedConsumer { handle() { return this.service.capture() } }"
    - "await this.inbox.claim(source, id) rồi chạy tiếp mà không kiểm tra kết quả"
  nextStep_vi: "Gọi await this.inbox.claim(source, eventId) trước mọi await khác và return khi nó trả false (if (!(await this.inbox.claim(source, eventId))) return), để một lượt giao lại trở thành no-op; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INFRA_OWNER:
  title: "Infrastructure library used outside its owning capability"
  title_vi: "Thư viện hạ tầng dùng ngoài năng lực sở hữu"
  meaning_vi: "Mỗi thư viện hạ tầng thô có đúng một năng lực sở hữu: fetch/axios/got/undici/node:http chỉ ở platform/http; cache-manager/redis/ioredis chỉ ở integrations/cache hoặc integrations/redis; bullmq/kafkajs chỉ ở platform/messaging; setTimeout/setInterval/node:timers chỉ ở platform/{scheduling,retry,messaging,http}; winston chỉ ở platform/logging; dayjs/moment chỉ ở platform/{clock,primitives}; @nestjs/config, dotenv, @nestjs/event-emitter và @nestjs/schedule không được dùng."
  causes_vi:
    - "Gọi fetch thẳng trong client tích hợp"
    - "Hẹn giờ bằng setTimeout trong service"
    - "Dùng dayjs trong miền"
    - "Gọi cổng HttpClient của platform/http ngoài một năng lực integrations, ví dụ service miền gọi thẳng endpoint token hay admin của Keycloak hoặc API gửi thư"
  nextStep_vi: "Gọi qua cổng của năng lực sở hữu (HttpClient, Cache, MessagePublisher, Clock, Logger) được tiêm bằng Inject*(). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_HAND_ROLLED_RETRY:
  title: "Hand-rolled retry loop"
  title_vi: "Tự viết vòng lặp thử lại thay vì dùng bộ trợ giúp chung"
  meaning_vi: "Một vòng lặp bắt lỗi (catch hoặc .catch) rồi chờ trước khi thử lại được viết tay tại chỗ; chờ nghĩa là gọi setTimeout, hàm của node:timers/promises, hoặc một hàm khai báo ngoài platform/retry mà thân hàm chờ, dù tên hàm là gì. Vòng lặp như vậy không có giới hạn số lần thử mà bộ kiểm tra nhìn thấy được, không có jitter, và không có cách nào tôn trọng một abort signal."
  causes_vi:
    - "for (let i = 0; i < max; i++) { try { return await fn() } catch (e) { await sleep(backoffMs(i)) } }"
    - "while (true) { try { return await fn() } catch (e) { await new Promise((r) => setTimeout(r, delayMs)) } }"
  nextStep_vi: "Thử lại qua bộ trợ giúp chung platform/retry (giới hạn số lần thử, backoff theo cấp số nhân có jitter, nhận abort signal) thay vì viết vòng lặp tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TRANSACTION_EXTERNAL_CALL:
  title: "Transaction spans an external call"
  title_vi: "Giao dịch cơ sở dữ liệu bao trùm một lệnh gọi ra ngoài"
  meaning_vi: "Một lệnh gọi fetch, HTTP client hoặc SDK tích hợp chạy bên trong .transaction(async (tx) => ...), nên giao dịch giữ kết nối mở trong suốt thời gian lệnh gọi ra ngoài chạy; nếu lệnh gọi thất bại sau khi giao dịch đã ghi một phần, hoặc thành công nhưng giao dịch sau đó rollback, hai hệ thống lệch nhau và không có đường quay lại."
  causes_vi:
    - "this.manager.transaction(async (tx) => { await tx.save(Entity, row); await fetch(url) })"
    - "this.manager.transaction(async (tx) => { await this.paymentSdk.charge(id) })"
  nextStep_vi: "Commit giao dịch trước rồi mới gọi ra ngoài, hoặc ghi một thông điệp outbox bên trong giao dịch để một worker gửi đi sau khi commit; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TRANSPORT_SHAPE:
  title: "Transport does more than map and dispatch"
  title_vi: "Tầng giao tiếp làm nhiều hơn chuyển lệnh"
  meaning_vi: "Mỗi resolver, controller, gateway, consumer, job hoặc lệnh CLI chỉ ánh xạ đầu vào, gửi đúng một command hoặc query qua bus được tiêm và ánh xạ kết quả. Bộ kiểm tra thấy transport tiêm thứ khác ngoài InjectCommandBus/InjectQueryBus (và InjectRequestLocale cho REST), tiêm EntityManager, bọc phản hồi trong envelope, dùng GraphQLJSON hoặc cửa REST không có lý do."
  causes_vi:
    - "Resolver gọi service miền trực tiếp"
    - "Interceptor biến đổi phản hồi thành {success, message, data}"
    - "Đầu vào kiểu GraphQLJSON không kiểm tra"
  nextStep_vi: "Đưa logic vào handler của tính năng, để transport chỉ gọi commandBus.execute(new XCommand({ request, principal })) và trả kiểu kết quả; xóa envelope và thay GraphQLJSON bằng input có kiểu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_SHAPE:
  title: "A webhook door does more than prove and hand over"
  title_vi: "Cửa webhook làm nhiều hơn xác thực và chuyển giao"
  meaning_vi: "Webhook của nhà cung cấp là một cửa ký số: một `@Controller` có đúng một handler `@Post` khai báo `@Public({ reason: PublicReason.SignedWebhook })`, chỉ tiêm `WebhookSignatureService` của platform/http-security và service của modules/domain, không rẽ nhánh, không vòng lặp, không try, chỉ gọi `verify` rồi đúng một phương thức nhận của service miền, và không trả dữ liệu miền về cho nhà cung cấp."
  causes_vi:
    - "Webhook tiêm EntityManager, CommandBus hoặc hàng đợi và tự ghi dữ liệu hay tự phát sự kiện"
    - "Handler có if hoặc try để tự quyết định xử lý hay bỏ qua giao hàng"
    - "Handler gọi hai phương thức nhận, hoặc phân tích và ánh xạ payload ngay trong cửa"
    - "Cửa webhook không khai báo lý do SignedWebhook nên mở công khai mà không được tính vào bậc giới hạn nghiêm ngặt"
  nextStep_vi: "Đưa mọi quyết định và mọi lần ghi vào một phương thức nhận của service trong modules/domain (service tự ghi bản nhận và gọi eventBus.publish(event, tx) trong giao dịch của nó, dùng inbox để chống giao lại); để handler chỉ gọi verify rồi gọi đúng phương thức nhận đó, khai báo @Public({ reason: PublicReason.SignedWebhook }) và không trả gì. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/webhooks.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_UNVERIFIED:
  title: "A webhook handler runs code before proving the delivery"
  title_vi: "Handler webhook chạy mã trước khi xác thực giao hàng"
  meaning_vi: "Câu lệnh đầu tiên của handler webhook phải là lời gọi `verify` không điều kiện của `WebhookSignatureService` (chữ ký và cửa sổ chống phát lại). Giao hàng sai chữ ký hoặc quá hạn phải bị ném lỗi trước khi bất kỳ mã nào khác chạy, nhờ đó không có đường nào tới phương thức nhận khi chưa được chứng minh."
  causes_vi:
    - "Handler đọc hoặc gán biến trước khi gọi verify"
    - "verify nằm trong if nên có đường đi bỏ qua nó"
    - "Handler gọi verify của một lớp cùng tên nhưng không phải WebhookSignatureService của platform/http-security"
  nextStep_vi: "Đặt `this.<signature>.verify({ rawBody, signature, timestamp })` làm câu lệnh đầu tiên của handler, không điều kiện, dùng WebhookSignatureService của platform/http-security và thân yêu cầu thô (không phải bản đã serialize lại). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và BE-WEBHOOK trong knowledge/patterns/be/webhooks.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REALTIME_SHAPE:
  title: "A realtime file is not exactly one push door"
  title_vi: "Tệp realtime không phải đúng một cửa đẩy tin"
  meaning_vi: "Mỗi tệp realtime là đúng một cửa theo vai trò của tên tệp: `<kênh>.gateway.ts` có một lớp `@WebSocketGateway` với các handler `@SubscribeMessage`, còn `<x>.subscription.ts` có một lớp `@Resolver` với các thao tác `@Subscription`. Không có query, mutation, field resolver, route REST hoặc giao thức còn lại trong cùng tệp."
  causes_vi:
    - "Tệp có hai lớp cửa hoặc không có lớp cửa nào"
    - "Cửa không có handler @SubscribeMessage hoặc @Subscription nào"
    - "Resolver của subscription chứa thêm @Query hoặc @Mutation"
    - "Gateway và subscription bị trộn trong một tệp"
  nextStep_vi: "Tách thành đúng một cửa cho mỗi tệp và đặt tên theo vai trò (.gateway.ts cho socket, .subscription.ts cho GraphQL subscription); chuyển query, mutation hoặc route REST sang một feature api. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REALTIME_WRITES:
  title: "A realtime door can write"
  title_vi: "Cửa realtime có khả năng ghi dữ liệu"
  meaning_vi: "Cửa realtime chỉ đọc và đẩy tin: giá trị duy nhất được tiêm vào là `RealtimeHub` của platform/realtime. EntityManager, bus lệnh, hàng đợi, event bus hoặc service miền (có thể ghi) không bao giờ được tiêm vào cửa này; tin đẩy do một reactor gọi hub, không do cửa."
  causes_vi:
    - "Gateway tiêm EntityManager hoặc CommandBus để cập nhật dữ liệu khi nhận tin của client"
    - "Subscription tiêm service miền để đọc, nhưng service đó có phương thức ghi"
    - "Cửa tiêm một lớp giả danh RealtimeHub do owner khác khai báo"
  nextStep_vi: "Bỏ mọi thứ khác ngoài RealtimeHub khỏi cửa; việc ghi thuộc về một feature api, và nguồn dữ liệu đẩy đi do một reactor (transport/message) gọi RealtimeHub.publish sau khi sự kiện đến. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REALTIME_TOPIC_SCOPE:
  title: "A realtime topic is not scoped to the principal"
  title_vi: "Chủ đề realtime không gắn với chủ thể đăng nhập"
  meaning_vi: "Chủ đề mà handler realtime truyền cho `RealtimeHub.subscribe` phải được dựng từ tham số `@CurrentPrincipal()` của domain/identity, để một client chỉ nghe được kênh thuộc về chủ thể của nó. Chủ đề lấy hoàn toàn từ đầu vào client là lỗ hổng rò rỉ dữ liệu của người khác."
  causes_vi:
    - "Chủ đề là một chuỗi cố định dùng chung cho mọi client"
    - "Chủ đề chỉ ghép từ tham số do client gửi"
    - "Handler không nhận @CurrentPrincipal() hoặc dùng decorator trùng tên của owner khác"
  nextStep_vi: "Thêm tham số `@CurrentPrincipal() principal` vào handler và dựng chủ đề từ principal.id (cộng với mã đã kiểm tra quyền sở hữu nếu cần). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_FEATURE_THIN:
  title: "A feature file holds logic"
  title_vi: "Tệp feature chứa logic thay vì chỉ ủy quyền"
  meaning_vi: "Mọi tệp thuộc tầng feature có vai trò trong ruleParams.be.thinRoles (handler, resolver, controller, consumer, processor, step, saga, saga-step, compensation, webhook, gateway, subscription, cli, mapper, service của saga) chỉ ánh xạ tham số rồi thực hiện MỘT lệnh gọi ủy quyền vào modules/ (service, command bus, query bus, event bus hoặc queue producer): không if/switch/vòng lặp/toán tử ba ngôi/&&/||/??, không try/catch hay throw, không tính toán (so sánh, phép toán, chuỗi mẫu có biểu thức), không gọi hàm nào khác ngoài lệnh ủy quyền duy nhất, hàm ánh xạ thuần (*.mapper.ts) và logger. Logic nghiệp vụ nằm ở modules/** nơi được đo độ phủ 100% từng tệp; điều phối (thứ tự bước, bù trừ, claim, fencing, retry) nằm ở platform/*; tầng feature được kiểm chứng bằng integration và e2e, không bằng unit spec."
  causes_vi:
    - "Handler, consumer hoặc processor có if/switch/vòng lặp/try để quyết định nghiệp vụ thay vì để service quyết định"
    - "Step hoặc saga service gọi hai service liên tiếp (điều phối nằm sai chỗ, phải thuộc platform/*)"
    - "Mapper tính toán hoặc rẽ nhánh (giá trị mặc định bằng ||, so sánh, nối chuỗi) thay vì chỉ đổi tên và sao chép trường"
    - "Lệnh cli chứa vòng lặp, try/catch hoặc phép gán thay vì gọi một service của platform"
  nextStep_vi: "Chuyển phần logic vào service/policy/mapper thuộc modules/** (domain hoặc platform tùy loại), viết unit spec đạt 100% từng tệp ở đó, rồi để tệp feature chỉ gọi đúng một phương thức. Điều phối nhiều bước chuyển vào platform/* (saga, jobs, event-bus, queue). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/*.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

HFS_COVERAGE_SCOPE_DRIFT:
  title: "A file states a coverage scope the slot manifest does not derive"
  title_vi: "Tệp nêu phạm vi độ phủ khác với phạm vi suy ra từ slot manifest"
  meaning_vi: "Phạm vi độ phủ (những tệp nào bị đo 100% từng tệp) chỉ có một nguồn: trường `coverage: required|none` của từng slot be trong knowledge/hfs/slots.yaml cùng ruleParams.be.logicRoles, qua scripts/hfs/coverage-scope.mjs. Ba nơi dùng phạm vi đó đều do starci app sync sinh: be/jest.config.js (ngưỡng từng tệp), dòng sonar.coverage.exclusions của sonar-project.properties và codecov.yml (đường dẫn cùng các component theo từng service app và platform). `<detail>` nêu tệp đã lệch khỏi bản sinh; không ai được sửa tay phạm vi này."
  causes_vi:
    - "Sửa tay be/jest.config.js, codecov.yml hoặc dòng sonar.coverage.exclusions để đo ít tệp hơn hoặc thêm ngoại lệ"
    - "Đổi trường coverage của slot hoặc ruleParams.be.logicRoles nhưng chưa chạy lại starci app sync"
    - "Thêm service app hoặc capability mới nên các component của codecov.yml đã cũ"
  nextStep_vi: "Chạy `npx starci app sync --write` để sinh lại ba tệp từ slot manifest; muốn đổi phạm vi thì đổi trường `coverage` của slot (và ruleParams.be.logicRoles) trong .claude runtime, không sửa tệp sinh. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_UNNAMED_DATA_ACCESS:
  title: "Database reached without the named shared EntityManager"
  title_vi: "Truy cập cơ sở dữ liệu không qua EntityManager dùng chung có tên"
  meaning_vi: "Tham số hoặc thuộc tính kiểu EntityManager không mang bộ tiêm Inject<Kết nối>EntityManager của một kết nối đã khai báo trong hfs.json (tên na ná cũng không đạt), hoặc tiêm bằng thuộc tính, hoặc gọi .getRepository(...), hoặc dùng @InjectRepository / Repository<T> / TypeOrmModule.forFeature, hoặc tiêm DataSource / QueryRunner ngoài platform/database, cli (apps/cli, src/features/cli) và test world (kể cả viết kiểu DataSource làm kiểu trả về, giá trị await, token provide: hay lớp bọc trả ra kết nối); lớp nào ngoài handler ứng dụng, domain service và năng lực persistence của platform mà nhận, giữ hoặc trả EntityManager, Repository, DataSource hay QueryRunner đều là repository dù đặt tên gì (Store, Dao, Gateway, Persistence, hoặc module hàm export nhận EntityManager làm tham số đầu như authoring.statements.ts); ứng dụng đăng ký nhiều kết nối nên cách viết này trỏ vào kết nối mặc định hoặc gắn một handle vào đúng một entity, và giao dịch không đi qua được sang bảng thứ hai."
  causes_vi:
    - "constructor(@InjectFooEntityManager() private readonly manager: EntityManager) {} với Foo không phải kết nối khai báo"
    - "@InjectPrimaryEntityManager() private readonly manager: EntityManager (tiêm bằng thuộc tính)"
    - "this.dataSource.getRepository(CourseEntity).find()"
    - "constructor(private readonly dataSource: DataSource) {} ngoài module database của platform"
    - "constructor(@InjectRepository(CourseEntity) private readonly repo: Repository<CourseEntity>) {}"
    - "class AccountingLedgerRepository { appendPosting(manager: EntityManager, ...) {} } đặt ngoài handler và domain service (repository trá hình, kể cả khi tên không có hậu tố Repository)"
  nextStep_vi: "Nhận EntityManager dùng chung qua tham số constructor với bộ tiêm Inject<Kết nối>EntityManager() của kết nối khai báo trong hfs.json (ví dụ InjectPrimaryEntityManager()) rồi gọi trực tiếp manager.find(Entity, ...), manager.save(Entity, ...); DataSource chỉ do module database của platform dựng; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_DOC_NOT_ENGLISH:
  title: "Document is not English"
  title_vi: "Tài liệu không viết bằng tiếng Anh"
  meaning_vi: "Tệp Markdown hoặc YAML trong knowledge/, docs/, src/ hoặc apps/ có chữ cái tiếng Việt (kể cả trong khối mã của Markdown); tài liệu, mẫu và ví dụ phải viết bằng tiếng Anh."
  causes_vi:
    - "Viết hoặc dán đoạn tiếng Việt vào tài liệu, mẫu, ví dụ hay lời trích của chủ dự án"
    - "Đặt dữ liệu YAML có tiếng Việt ngoài slot danh mục thông điệp hoặc slot fixture i18n"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dịch dòng được nêu sang tiếng Anh. Chỉ dữ liệu YAML trong slot danh mục thông điệp hoặc slot fixture i18n được giữ tiếng khác; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_SLOT_FILE_ROLE:
  title: "A front-end file is owned by a slot and named by it"
  title_vi: "Tệp không đúng vai trò trong slot"
  meaning_vi: "Tệp `<f>` nằm trong slot `<s>` nhưng tên của nó không thuộc danh sách `allows` của slot (ví dụ `page.tsx` trong hooks, đoạn `[lang]` dưới `app/`, `*.test.tsx` cạnh component), hoặc là tệp đặt ở chỗ slot cần một thư mục."
  causes_vi:
    - "Vi phạm luật R94: mỗi slot thư mục của front end (route, feature, components, hooks, modules/api) chỉ chứa các tệp mà `allows` của nó gọi tên, và chứa chúng trong thư mục riêng; tệp không slot nào sở hữu là HFS_PATH_NO_SLOT."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi tên tệp về vai trò được phép hoặc chuyển nó về slot đúng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_OPERATION_CONTRACT:
  title: "A versioned operation has no typed contract"
  title_vi: "Thao tác có phiên bản không có hợp đồng kiểu"
  meaning_vi: "Mỗi thao tác `<tên>@<phiên bản>` của một app được khai báo đúng một lần trong bảng thao tác có kiểu `apps/<app>/src/operations.ts` (`OperationContract<Input, Output, RefusalCode>` đăng ký bằng `defineOperations`). Bộ kiểm tra thấy đầu vào hoặc đầu ra là `any`, `unknown`, `Record<string, unknown>`, kiểu generic chưa gán, hàm hoặc `Date`; mã từ chối không phải hợp các chuỗi literal đóng; hoặc route phục vụ bảng không nhận `OperationRequest<Table>` và trả `Promise<OperationReply<Table>>` của cùng một bảng."
  causes_vi:
    - "Đầu vào hoặc kết quả của thao tác khai báo là `unknown` nên client phải tự gõ kiểu tay"
    - "Mã từ chối khai báo là `string` thay vì hợp các literal như `\"DENIED\" | \"INVALID\"`"
    - "Route nhận `@Body() body: unknown` hoặc chỉ dùng một nửa `OperationRequest` / `OperationReply`"
  nextStep_vi: "Khai báo kiểu có tên, đóng cho đầu vào và đầu ra của từng thao tác, liệt kê mã từ chối bằng hợp literal, và cho route nhận `OperationRequest<typeof OPERATIONS>` và trả `Promise<OperationReply<typeof OPERATIONS>>`; chạy `starci app emit` để sinh `contracts/<app>/openapi.json`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục BE-OPERATIONS-1; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

FE_NO_TESTS:
  title: "Front end holds a test file, test tooling or a test dependency"
  title_vi: "Front end có tệp test, công cụ test hoặc thư viện test"
  meaning_vi: "Chuẩn của front end là không có test: repository có spec, e2e, cấu hình vitest, Playwright hay jest, script test, hoặc khai báo thư viện chạy test, dựng môi trường test, testing-library, axe trong package.json."
  causes_vi:
    - "Viết spec hoặc e2e cho component, hook hay trang"
    - "Thêm vitest, Playwright, jest, testing-library hoặc axe vào package.json"
    - "Thêm script test hoặc cấu hình test vào repository front end"
  nextStep_vi: "Xóa tệp, cấu hình, script và thư viện test đó; front end không có ngoại lệ, kể cả thư mục scripts/. Kiểm tra giao diện bằng lint, typecheck và starci app check."
  owner: op-retry
  kind: check-finding
BE_SPEC_PLACEMENT:
  title: "A back-end spec lives in one of the four test layers"
  title_vi: "Spec đặt ngoài bốn tầng test"
  meaning_vi: "Tệp spec hoặc test `<f>` nằm ngoài bốn tầng test của back end (kể cả trong `scripts/` hoặc `tools/`)."
  causes_vi:
    - "Vi phạm luật R102: spec đơn vị là `<name>.service.spec.ts` cạnh service của nó; spec tích hợp, e2e và contract nằm dưới `src/tests/{integration,e2e,contract}`. Mọi `*.spec.*`, `*.test.*`, `*-spec.*` khác là vi phạm; script vận hành và công cụ không mang spec."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển spec vào tầng đúng hoặc xóa nó; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

HFS_REPO_LOCAL_CHECK:
  title: "A repository keeps no check or lint rule of its own"
  title_vi: "Kho tự giữ bộ kiểm tra riêng"
  meaning_vi: "Kho có nguồn kiểm tra hoặc luật lint cục bộ ở `<f>`: tệp `check-*` trong `scripts/` hay `tools/`, tệp `eslint-local-rules*`, plugin eslint cục bộ, hoặc script npm chạy một tệp `check-*`."
  causes_vi:
    - "Vi phạm luật R103: mọi bộ kiểm tra sống trong runtime `.claude` (starci app check, các canon eslint); kho sản phẩm không giữ bộ kiểm tra hay luật riêng. `scripts/` chỉ chứa script vận hành."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp và script trỏ tới nó; nếu luật còn cần thì đề xuất vào canon trong runtime `.claude`, không giữ bản sao trong kho."
  owner: op-retry
  kind: check-finding

HFS_LINT_SUPPRESSION_FILE:
  title: "A repository keeps no lint-suppression file, script or option"
  title_vi: "Kho có tệp hoặc script ghi nhận bỏ qua lỗi lint"
  meaning_vi: "Kho có tệp, script hoặc tùy chọn ghi nhận lỗi lint để bỏ qua ở `<f>`: `eslint.suppressions*`, script `lint:suppressions`, cờ `--suppress-all`/`--suppressions-location`, hoặc cấu hình eslint có `suppressions`."
  causes_vi:
    - "Vi phạm luật R104: lỗi lint được sửa trong mã (hoặc luật được đổi trong canon); không ghi nhận để lỗi nằm lại trong tệp suppressions."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp, script hoặc cờ, và sửa các lỗi lint trong mã."
  owner: op-retry
  kind: check-finding

HFS_PEER_INTEGRATION_MISSING:
  title: "An app declares the runtime peer its driver integration needs"
  title_vi: "Thiếu gói peer mà tích hợp driver cần khi chạy"
  meaning_vi: "`package.json` ở gốc app phụ thuộc vào các gói của một cặp trong `knowledge/hfs/peer-integrations.yaml` (ví dụ `@nestjs/apollo` trên `@nestjs/platform-express` 11, tức Express 5) nhưng không khai báo gói `<requires>` trong dependencies, nên api không khởi động được."
  causes_vi:
    - "Vi phạm luật R111: npm không tự cài gói peer này, type-check và unit spec không nạp nó, nên lỗi chỉ lộ ra khi api khởi động (hai backend cũ thiếu `@as-integrations/express5` và api GraphQL không chạy được trên Express 5)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói `<requires>` vào dependencies của `package.json` ở gốc app; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_INTEGRATION_SPEC_MISSING:
  title: "Every integration has an integration spec that proves its client through the test world"
  title_vi: "Tích hợp thiếu spec integration chứng minh client qua test world"
  meaning_vi: "Thư mục `src/modules/integrations/<provider>/` (có `<provider>.config.ts`) không có `src/tests/integration/<provider>/*.integration-spec.ts` nào vừa gọi `useTestWorld({ modules })` với factory đăng ký module của chính tích hợp đó (`<Provider>Module.register`, import từ thư mục tích hợp), vừa tham chiếu enum ErrorCode của tích hợp, vừa gây một sự cố qua world (`world.infra.<service>`, `world.fake.<name>.failNext`, `world.apps.<peer>.during`, `world.interruptDatabase`)."
  causes_vi:
    - "Vi phạm luật R112: client của tích hợp chỉ được kiểm bằng unit spec với double, nên ánh xạ lỗi và đường sự cố của nhà cung cấp thật (hoặc fake ở biên mạng) chưa bao giờ chạy; lỗi phân loại timeout của FetchHttpClient chỉ lộ ra khi spec integration đầu tiên chạy."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm hoặc bổ sung spec integration của đúng thư mục provider cho phần còn thiếu (đăng ký module, enum ErrorCode, sự cố qua world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_GRAPHQL_CONTRACT:
  title: "A front-end GraphQL document is one its back end serves"
  title_vi: "Tài liệu GraphQL của front end không khớp hợp đồng của back end"
  meaning_vi: "Một thao tác trong tệp `.graphql` dưới `fe/` không khớp ảnh chụp hợp đồng `be/contracts/<service>/schema.graphql` của dịch vụ phục vụ trường gốc đầu tiên của nó: trường, đối số hoặc trường input không được khai báo, thiếu đối số bắt buộc, biến khác kiểu, chọn trường trên giá trị lá hoặc thiếu lựa chọn trên đối tượng, biến khai báo mà không dùng, hoặc không hợp đồng nào phục vụ trường gốc đó."
  causes_vi:
    - "Vi phạm luật R113: front end gửi một tài liệu viết theo hợp đồng cũ (ví dụ `(request: ...)` trong khi back end nhận `input`), nên lời gọi hỏng khi chạy mà type-check của front end không thấy."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa tài liệu `.graphql` cho khớp hợp đồng (hoặc chạy `starci app emit` nếu ảnh chụp đã cũ); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_SERVICE_PLACEMENT:
  title: "A back-end service lives only at be/apps/<service>"
  title_vi: "Dịch vụ back end nằm ngoài be/apps/<service>"
  meaning_vi: "Một thư mục có Dockerfile hoặc package.json riêng nằm ngoài `be/apps/<service>/` (và không phải Dockerfile của front end hay package workspace của `fe/packages`), nên nó trở thành một gốc dịch vụ thứ hai bên cạnh `be/` và `fe/`."
  causes_vi:
    - "Vi phạm luật R163: mỗi dịch vụ back end là một ứng dụng Nest tại `be/apps/<service>/` dùng chung thư viện `be/src` và một `package.json` duy nhất của app; image của nó được build từ `be/apps/<service>/Dockerfile`."
    - "Op đã tạo thư mục dịch vụ riêng (ví dụ `services/<name>/` hoặc `be/<name>/`) thay vì thêm ứng dụng dưới `be/apps/`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển dịch vụ vào `be/apps/<service>/` (main.ts, app.module.ts, Dockerfile) và xoá thư mục cũ; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_IMAGE_UNPINNED:
  title: "Every image of a multi-service stack is pinned"
  title_vi: "Image của stack nhiều dịch vụ chưa được ghim phiên bản"
  meaning_vi: "Trong `.starcistacks/application-stacks.yaml` của một sản phẩm có từ hai dịch vụ trở lên, một `components.<name>.image` không có tag, dùng `latest`, một từ nhánh hoặc tag chỉ gồm major/minor (ví dụ `postgres:16`), nên image trôi theo thời gian."
  causes_vi:
    - "Vi phạm luật R164: image được ghim bằng digest (`@sha256:...`) hoặc phiên bản chính xác `x.y.z`; image của dịch vụ trong repo là `<repo>/<service>:<x.y.z>`, dịch vụ bên thứ ba cũng là image đã ghim."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: ghi tag chính xác hoặc digest vào `image` của thành phần; không dùng tag trôi."
  owner: op-retry
  kind: check-finding

HFS_SERVICE_STACK_DECLARATION:
  title: "Each service app is a service component of the stack"
  title_vi: "Ứng dụng dịch vụ chưa được khai báo trong stack"
  meaning_vi: "Một ứng dụng api hoặc worker dưới `be/apps/<service>/` của sản phẩm nhiều dịch vụ không có thành phần `role: service` cùng tên trong `.starcistacks/application-stacks.yaml`."
  causes_vi:
    - "Vi phạm luật R165: mọi dịch vụ của sản phẩm nhiều dịch vụ là một thành phần `role: service` của stack (image riêng `<repo>/<service>:<x.y.z>`, build từ Dockerfile của app)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm thành phần cùng tên app (role service, image đã ghim, file compose và cổng của môi trường)."
  owner: op-retry
  kind: check-finding

HFS_EVENT_CONTRACT:
  title: "The async contract between services is vendored and consumers match it"
  title_vi: "Hợp đồng sự kiện giữa các dịch vụ không khớp"
  meaning_vi: "Ảnh chụp `be/contracts/<service>/events.json` thiếu, cũ so với bảng `apps/<service>/src/events.ts` của bên phát, một mục trong `apps/<app>/src/consumes.ts` của bên nhận trỏ tới sự kiện không có trong ảnh chụp hoặc có phiên bản khác, hoặc một hàng đợi consumer định nghĩa bằng `defineQueue` không được liệt kê trong bảng `consumes.ts` nào."
  causes_vi:
    - "Vi phạm luật R166: hợp đồng giữa các dịch vụ được vendor dưới `be/contracts/<service>/` và bên nhận chỉ đọc đúng sự kiện và phiên bản mà ảnh chụp khai báo."
    - "Bên phát đổi sự kiện nhưng chưa chạy `starci app emit`, hoặc bên nhận khai báo phiên bản cũ."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chạy `starci app emit` rồi cập nhật `consumes.ts` và cách xử lý của bên nhận cho khớp; không sửa tay ảnh chụp."
  owner: op-retry
  kind: check-finding

BE_SERVICE_ISOLATION:
  title: "A service app imports no sibling service app"
  title_vi: "Ứng dụng dịch vụ import trực tiếp ứng dụng dịch vụ anh em"
  meaning_vi: "Một tệp dưới `be/apps/<service>/` import (đường dẫn tương đối hoặc alias) một tệp dưới `be/apps/<other>/`, nên hai dịch vụ dính vào nhau thành một khối triển khai."
  causes_vi:
    - "Vi phạm luật R168: các dịch vụ chỉ dùng chung thư viện `be/src` và gặp nhau qua đường truyền (client API của dịch vụ kia, hoặc sự kiện theo hợp đồng đã vendor dưới `be/contracts/<service>/`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ import, đưa phần dùng chung vào `be/src` hoặc gọi dịch vụ kia qua client/sự kiện của hợp đồng."
  owner: op-retry
  kind: check-finding

BE_SAGA_STEP_COMPENSATION:
  title: "Every saga step has a compensation and the orchestrator lists them"
  title_vi: "Bước saga thiếu bù trừ hoặc orchestrator không liệt kê đủ"
  meaning_vi: "Một bước `saga/steps/<step>.step.ts` không có `saga/compensations/<step>.compensation.ts` (hoặc ngược lại), thư mục saga không có orchestrator `<saga>.saga.ts`, hoặc orchestrator không import đủ mọi bước và mọi bù trừ của thư mục."
  causes_vi:
    - "Vi phạm luật R169: mỗi bước tiến của saga có đúng một bù trừ cùng tên; orchestrator liệt kê tất cả, nên không có bước nào chạy mà không có đường lùi."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm bù trừ cho bước (một lệnh hoàn tác) và import nó trong orchestrator; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_SAGA_STATE_VERSIONED:
  title: "The persisted state of a saga run carries a version and goes through the fenced store"
  title_vi: "Trạng thái saga không có phiên bản hoặc không đi qua kho có rào"
  meaning_vi: "Orchestrator không có `<saga>.saga-state.ts`, kiểu trạng thái xuất ra không khai `status` và `version: number`, hoặc orchestrator không dùng kho có rào của `platform/saga`."
  causes_vi:
    - "Vi phạm luật R170: trạng thái một lần chạy saga được lưu cùng phiên bản (rào), mọi chuyển trạng thái nêu phiên bản đã đọc, nên một lần giao lại \"xác sống\" không thể chuyển hai lần."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai kiểu trạng thái có `status` và `version`, và chuyển trạng thái qua `SagaService` của `platform/saga`."
  owner: op-retry
  kind: check-finding

BE_SAGA_EVENT_CONTRACT:
  title: "Every event of a saga step and compensation is in a vendored contract"
  title_vi: "Sự kiện của bước saga không nằm trong hợp đồng hoặc bù trừ không khớp"
  meaning_vi: "Một bước hoặc bù trừ không khai `readonly event = \"<tên>\"`, sự kiện đó không có trong `be/contracts/<service>/events.json`, hoặc hợp đồng của sự kiện bù trừ không khai `compensates` đúng sự kiện của bước cùng tên."
  causes_vi:
    - "Vi phạm luật R171: mọi sự kiện của saga nằm trong hợp đồng đã vendor, và sự kiện thất bại của một bù trừ nói rõ nó hoàn tác sự kiện của bước nào."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai sự kiện trong `events.ts` của bên phát (có `compensates`), chạy `starci app emit`, và ghi tên sự kiện vào bước/bù trừ."
  owner: op-retry
  kind: check-finding

BE_SAGA_CONSUMER_DEDUPE:
  title: "A saga consumer passes the delivery id on"
  title_vi: "Consumer của saga không chuyển id lần giao đi tiếp"
  meaning_vi: "Một `transport/message/<event>.consumer.ts` của feature có saga không đọc `message.eventId` để đưa vào lệnh nó gửi."
  causes_vi:
    - "Vi phạm luật R172: saga nhận mọi sự kiện qua inbox (R80), nên consumer phải chuyển khoá chống trùng (id lần giao) cho lệnh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đưa `message.eventId` vào yêu cầu của lệnh để saga claim qua inbox."
  owner: op-retry
  kind: check-finding

BE_SAGA_E2E_MISSING:
  title: "Every compensation path has an e2e spec that injects a failure"
  title_vi: "Đường bù trừ của saga chưa có spec e2e chèn lỗi"
  meaning_vi: "Một bù trừ của saga không có spec e2e (qua `useTestWorld`) nêu tên sự kiện của nó, hoặc spec đó không chèn lỗi nào qua world (`during`, `cut`, `latency`, `failNext`, `interruptDatabase`)."
  causes_vi:
    - "Vi phạm luật R173: đường bù trừ được chứng minh dưới lỗi thật, không chỉ trên luồng thuận."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e cho đường bù trừ, cắt một hạ tầng (hoặc app) khi sự kiện thất bại tới, rồi đọc trạng thái đã bù trừ."
  owner: op-retry
  kind: check-finding

BE_ASYNC_SPEC_MISSING:
  title: "Every message consumer and saga has an e2e spec"
  title_vi: "Consumer hoặc saga chưa có spec e2e"
  meaning_vi: "Một sự kiện mà ứng dụng tiêu thụ (mục trong `consumes.ts`) không được spec e2e nào gọi `useTestWorld` nêu tên, hoặc (với bước saga, hợp đồng khai báo `compensates`) spec không nêu cả sự kiện được bù trừ."
  causes_vi:
    - "Vi phạm luật R167: luồng bất đồng bộ và luồng bù trừ (saga) được chứng minh qua world: phát sự kiện, đọc lại trạng thái đã lưu, thử giao lại; với bước saga, spec chạy cả luồng (bước đầu, lỗi, rồi trạng thái đã bù trừ)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e `be/src/tests/e2e/<area>/<tên>.e2e-spec.ts` khởi động world, phát sự kiện thật và đọc kết quả (với bước saga: nêu cả sự kiện được bù trừ và đọc trạng thái đã bù trừ)."
  owner: op-retry
  kind: check-finding

HFS_PROOF_COMMAND_FILE_MISSING:
  title: "A proof command names only files the repository holds"
  title_vi: "Lệnh chứng minh trỏ tới tệp không tồn tại"
  meaning_vi: "Lệnh `requiresProof.<kind>.command` của hồ sơ `.starciwork` `<f>` chạy tệp `<path>` mà kho không có, nên không thể chạy đúng như đã viết."
  causes_vi:
    - "Vi phạm luật R105: lệnh chứng minh phải chạy được nguyên văn; tệp spec, script hay cấu hình mà nó nêu tên phải có trong kho (script đã xóa thì kế hoạch chứng minh phải được viết lại)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tạo tệp được nêu hoặc viết lại kế hoạch chứng minh (ví dụ thành một spec e2e trên world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_I18N_KEYS:
  title: "Catalog keys and the source that reads them agree"
  title_vi: "Khóa catalog và mã nguồn đọc chúng không khớp"
  meaning_vi: "Mã nguồn đọc khóa `<key>` mà một locale không có, hoặc catalog `<f>` giữ khóa `<key>` mà không đoạn mã nào của app hay của package dùng chung đọc tới."
  causes_vi:
    - "Vi phạm luật R106: khóa đọc bằng literal qua `next-intl` (`t`, `t.rich`, `t.raw`, `t.markup`) phải có trong mọi locale; khóa của catalog mà không chuỗi nào trong mã nguồn có thể đang đọc thì phải xóa."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm khóa vào mọi catalog của app hoặc đọc khóa có thật; xóa khóa chết khỏi mọi catalog; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_COOKIE_ATTRIBUTES:
  title: "A written cookie leaves its attributes to the defaults"
  title_vi: "Cookie được ghi mà không nêu rõ thuộc tính"
  meaning_vi: "Một lời gọi `set` trên cookie phản hồi của Next (`response.cookies.set`, `cookies().set`) ở `<file>` không nêu `httpOnly` bằng một giá trị cố định, thiếu `secure`, hoặc có `sameSite` khác `lax`/`strict`; cookie phiên khi đó đọc được từ script của trang hoặc đi theo request chéo trang."
  causes_vi:
    - "Vi phạm luật R107: ghi cookie phiên bằng `set(name, value)` không có options, hoặc options thiếu `httpOnly: true`"
    - "`sameSite: \"none\"`, `secure: false` hoặc `httpOnly` lấy từ một biến boolean không cố định"
  nextStep_vi: "Khai báo một hằng số options `as const` trong module sở hữu cookie với `httpOnly: true` (chỉ `false` cho cookie tùy chọn mà script của trang cần đọc), `secure` lấy từ `modules/config` và `sameSite: \"lax\"` hoặc `\"strict\"`, rồi truyền nó vào mọi lần `set`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_COOKIE_ATTRIBUTES:
  title: "A cookie a door writes leaves its attributes to the defaults"
  title_vi: "Cookie do cửa backend ghi ra không nêu rõ thuộc tính"
  meaning_vi: "Một lời gọi `cookie` hoặc `setCookie` trên phản hồi của Express hay Fastify ở `<file>` không nêu `httpOnly: true`, `secure: true` hoặc `sameSite` là `lax`/`strict` bằng giá trị cố định, hoặc `Set-Cookie` được ghi tay thành header; cookie đó khi đó đọc được từ script của trang, đi qua HTTP thường hoặc đi theo request chéo trang."
  causes_vi:
    - "Vi phạm luật R141: gọi `res.cookie(name, value)` không có options, hoặc options thiếu một trong ba thuộc tính"
    - "`sameSite: \"none\"`, `secure: false` hoặc `httpOnly` lấy từ một biến boolean không cố định"
    - "Ghi header `Set-Cookie` bằng `setHeader`, `append` hoặc `header`"
  nextStep_vi: "Khai báo một hằng số options `as const` trong module sở hữu cookie với `httpOnly: true`, `secure: true` và `sameSite: \"lax\"` hoặc `\"strict\"`, rồi truyền nó vào mọi lần `res.cookie`; bỏ mọi header `Set-Cookie` viết tay. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_AMBIENT_ID:
  title: "An id is minted from the ambient random source"
  title_vi: "Mã định danh được sinh trực tiếp từ nguồn ngẫu nhiên"
  meaning_vi: "Mã ở `<file>` gọi `randomUUID` của Node crypto (import tên, import namespace hoặc `crypto` toàn cục), một bộ sinh `v1`, `v4`, `v6`, `v7` của `uuid`, hoặc `nanoid`/`ulid` thay vì lấy từ cổng `Ids`; spec khi đó không điều khiển được mã nào được sinh ra và một lần chạy lỗi không tái hiện được."
  causes_vi:
    - "Vi phạm luật R142: dịch vụ gọi `randomUUID()` trực tiếp để tạo khóa hoặc mã sự kiện"
    - "Spec tự sinh mã bằng `randomUUID` thay vì dùng `fakeIds()`"
  nextStep_vi: "Tiêm cổng bằng `@InjectIds() private readonly ids: Ids` và gọi `ids.next()`; trong spec cấp `fakeIds([...])` qua token của `platform/ids`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ERROR_CAUSE_DROPPED:
  title: "A catch replaces the failure without carrying it"
  title_vi: "Catch thay lỗi mà không giữ lỗi gốc"
  meaning_vi: "Một `throw` thoát ra khỏi `catch` (hoặc handler `.catch`) ở `<file>` ném một lỗi mới mà không ném lại giá trị đã bắt và không mang nó theo; lỗi gốc cùng stack của nó mất hẳn. Lỗi thay thế phải nhận đúng giá trị đã bắt làm `cause` (luật R108, BE-ERROR-4)."
  causes_vi:
    - "catch (error) { throw new PlanError({ code: PlanErrorCode.Failed }) } thiếu `cause: error`"
    - "Chỉ đọc `error.message` rồi dựng lỗi mới từ chuỗi đó"
    - "catch { throw new PlanError(...) } không đặt tên cho giá trị đã bắt"
  nextStep_vi: "Đặt tên cho giá trị bắt được (`catch (error)`) và truyền đúng nó làm `cause` của lỗi capability (`new <C>Error({ code, cause: error })`), hoặc ném lại chính nó. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MEMBER_DOC_MISSING:
  title: "A public member has no doc block"
  title_vi: "Thành viên công khai không có JSDoc"
  meaning_vi: "Một thành viên công khai (phương thức, accessor, field hoặc signature) của class, interface hoặc type object được export ở `<file>` không có khối JSDoc ngay phía trên; người gọi chạm tới thành viên chứ không đọc doc của kiểu (luật R109, BE-COMMENT-3)."
  causes_vi:
    - "Phương thức public của service hoặc handler không có /** ... */"
    - "Field của interface Request/Result được export không có doc"
    - "Comment dòng `//` thay cho khối JSDoc"
  nextStep_vi: "Thêm một khối JSDoc tiếng Anh ngay trên thành viên, nói nó dùng để làm gì hoặc gọi nó gây ra điều gì; private, protected, constructor và property gán hằng không cần. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

FE_PROPS_MUTABLE:
  title: "Component props can be written"
  title_vi: "Props của component có thể bị ghi"
  meaning_vi: "Kiểu props của một hàm render được export ở `<file>` có field hoặc index signature thiếu `readonly`, hoặc giữ một collection có thể thay đổi (`T[]`, `[A, B]`, `Array<T>`), trực tiếp hay trong object lồng nhau (luật R110, FE-TYPING-2)."
  causes_vi:
    - "interface XProps { title: string } thiếu `readonly`"
    - "readonly items: Item[] thay vì `readonly Item[]`"
    - "Field của kiểu phần tử khai báo cùng file thiếu `readonly`"
  nextStep_vi: "Đánh dấu `readonly` cho mọi field và index signature của props, viết collection là `readonly T[]`, `readonly [A, B]` hoặc `ReadonlyArray<T>`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

EXAMPLES_CI_WORKFLOW_MISSING:
  title: "The root examples workflow is missing"
  title_vi: "Thiếu workflow gốc chạy các ứng dụng ví dụ"
  meaning_vi: "Không có `.github/workflows/examples.yml`: GitHub chỉ chạy workflow ở gốc repository, nên không ứng dụng ví dụ nào được kiểm tra trong CI."
  causes_vi:
    - "Workflow gốc bị xoá hoặc đổi tên"
  nextStep_vi: "Khôi phục `.github/workflows/examples.yml` với job `apps` in ma trận bằng `starci runtime check --only examples-ci -- --matrix`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_WORKFLOW_INVALID:
  title: "The root examples workflow is not valid YAML"
  title_vi: "Workflow gốc của các ví dụ không phải YAML hợp lệ"
  meaning_vi: "Không đọc được `.github/workflows/examples.yml`: `<detail>`."
  causes_vi:
    - "Lỗi cú pháp YAML trong workflow"
  nextStep_vi: "Sửa cú pháp YAML của `.github/workflows/examples.yml` rồi chạy lại `starci check run --level L2`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_MATRIX_NOT_DERIVED:
  title: "The examples matrix is not derived"
  title_vi: "Ma trận ví dụ không được suy ra tự động"
  meaning_vi: "Ma trận của workflow ví dụ phải đúng là `app: ${{ fromJSON(needs.apps.outputs.apps) }}`, lấy từ job `apps` chạy `examples-ci.mjs --matrix`; một danh sách viết tay sẽ để một ví dụ mới lọt khỏi CI."
  causes_vi:
    - "Ma trận liệt kê tên ứng dụng bằng tay"
    - "Job `apps` không chạy lệnh suy ra ma trận hoặc không xuất outputs.apps"
    - "Job ma trận thiếu `needs: apps`"
  nextStep_vi: "Dùng job `apps` và biểu thức `fromJSON(needs.apps.outputs.apps)` làm ma trận duy nhất."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_HARDCODED:
  title: "The examples workflow names an example app directly"
  title_vi: "Workflow ví dụ ghi thẳng tên một ứng dụng"
  meaning_vi: "Workflow gốc nhắc tới `examples/<app>` trực tiếp; mọi ứng dụng chỉ được chạy qua ma trận suy ra."
  causes_vi:
    - "Một bước viết đường dẫn của một ví dụ cụ thể"
  nextStep_vi: "Thay đường dẫn cụ thể bằng `examples/${{ matrix.app }}`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_STACK_LAYER_AUTOMATIC:
  title: "Integration or e2e runs automatically"
  title_vi: "Integration hoặc e2e chạy tự động"
  meaning_vi: "Một bước chạy `test:integration`, `test:e2e` hoặc `test:contract` (khởi động stack docker) không được giới hạn ở `workflow_dispatch`; theo quyết định của chủ dự án, e2e chỉ chạy thủ công."
  causes_vi:
    - "Bước thiếu điều kiện `if: github.event_name == 'workflow_dispatch' ...`"
  nextStep_vi: "Thêm điều kiện `github.event_name == 'workflow_dispatch'` (và input `layers`) cho bước đó."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_NO_MANUAL_TRIGGER:
  title: "The examples workflow has no manual trigger"
  title_vi: "Workflow ví dụ thiếu trigger thủ công"
  meaning_vi: "Workflow ví dụ không có `workflow_dispatch`, nên các lớp integration và e2e không thể chạy thủ công."
  causes_vi:
    - "Khối `on` thiếu `workflow_dispatch` với input `layers`"
  nextStep_vi: "Thêm `workflow_dispatch` với input `layers` (integration, e2e hoặc cả hai) vào workflow."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_STRAY_WORKFLOW:
  title: "A root workflow runs an example app on its own"
  title_vi: "Một workflow gốc tự chạy riêng một ứng dụng ví dụ"
  meaning_vi: "Workflow `<file>` chạy `examples/<app>` ngoài workflow ví dụ chung; mỗi ứng dụng chỉ có một đường CI."
  causes_vi:
    - "Workflow riêng của một ví dụ chưa được gộp vào `examples.yml`"
  nextStep_vi: "Gộp các bước vào `.github/workflows/examples.yml` rồi xoá workflow riêng đó."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_CODECOV_MISSING:
  title: "The root codecov.yml is missing"
  title_vi: "Thiếu codecov.yml ở gốc"
  meaning_vi: "Codecov chỉ đọc một cấu hình gốc; không có `codecov.yml` thì không cờ nào của ứng dụng ví dụ được giữ ở mức 100."
  causes_vi:
    - "Tệp `codecov.yml` gốc bị xoá"
  nextStep_vi: "Chạy `starci runtime check --only examples-ci -- --write` để sinh lại tệp."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_CODECOV_DRIFT:
  title: "The root codecov.yml differs from its render"
  title_vi: "codecov.yml gốc lệch khỏi bản sinh"
  meaning_vi: "`codecov.yml` gốc phải có đúng một cờ cho mỗi ứng dụng ví dụ, với đường dẫn là phạm vi coverage của ứng dụng (chỉ các service), project và patch ở mức 100."
  causes_vi:
    - "Thêm một ứng dụng ví dụ mà chưa sinh lại tệp"
    - "Sửa tay tệp sinh ra"
  nextStep_vi: "Chạy `starci runtime check --only examples-ci -- --write` và commit tệp."
  owner: runtime-core
  kind: check-finding

HFS_MONO_WORKSPACES:
  title: "The app root is not the monorepo root"
  title_vi: "Gốc app không phải gốc monorepo"
  meaning_vi: "`package.json` ở gốc app phải khai báo `workspaces` đúng `[\"fe/apps/*\", \"fe/packages/*\"]`, `packageManager` là `npm@<phiên bản cụ thể>` và `turbo` trong devDependencies; gốc app giữ `turbo.json` do starci app sync sinh ra."
  causes_vi:
    - "Vi phạm luật R143: mọi sản phẩm luôn là monorepo, kể cả khi chỉ có một service, nên hình dạng hfs đồng nhất; thiếu workspaces hoặc turbo thì các app fe không được build qua turbo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `workspaces`, `packageManager` và devDependency `turbo` (đúng bản ghim) trong `package.json` ở gốc, rồi chạy `npx starci app sync --write` để sinh `turbo.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_FE_WORKSPACE:
  title: "An fe workspace manifest breaks the workspace shape"
  title_vi: "Manifest của một workspace fe sai hình dạng"
  meaning_vi: "Mỗi app fe `fe/apps/<app>` là workspace `@<project>/<app>`, private, có đúng các script build, dev, lint (`starci app lint --workspace .`), start và typecheck; mỗi gói `fe/packages/<pkg>` là private và có build, typecheck cùng script lint của workspace."
  causes_vi:
    - "Vi phạm luật R144: turbo chạy các task theo script của từng workspace; tên, script hoặc cờ private sai khiến build, lint hoặc typecheck của app bị bỏ qua hoặc chạy khác chuẩn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt tên `@<project>/<app>`, `\"private\": true` và đúng bộ script trong `package.json` của workspace đó."
  owner: op-retry
  kind: check-finding

HFS_MONO_NEST_PROJECTS:
  title: "be/nest-cli.json does not match the declared be apps"
  title_vi: "be/nest-cli.json không khớp các app be đã khai báo"
  meaning_vi: "`be/nest-cli.json` phải là `\"monorepo\": true`, project mặc định là một app api, và `projects` đúng bằng các app be mà `hfs.json` khai báo, mỗi project có `root` là `apps/<app>` và `sourceRoot` là `apps/<app>/src`."
  causes_vi:
    - "Vi phạm luật R145: back end luôn là monorepo Nest của `be/apps/<app>`, kể cả khi chỉ có một service; một project thừa hoặc thiếu nghĩa là app đó không được build hoặc chạy theo khai báo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa `be/nest-cli.json` cho khớp đúng các app be trong `hfs.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACE_DEP:
  title: "An fe workspace imports a package it does not declare"
  title_vi: "Một workspace fe import gói mà nó không khai báo"
  meaning_vi: "Mọi gói mà các tệp của một workspace fe import phải được khai báo trong `package.json` của chính workspace đó (gói workspace anh em ghi `\"*\"`); `package.json` ở gốc không bao giờ khai báo một gói workspace."
  causes_vi:
    - "Vi phạm luật R146: một app chỉ chạy được nhờ gói được hoist từ gốc sẽ hỏng khi build riêng bằng `starci docker build <app>` hoặc khi turbo không biết thứ tự phụ thuộc."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói vào dependencies của workspace đó (cùng một phiên bản trong cả workspace), hoặc bỏ gói workspace khỏi `package.json` ở gốc."
  owner: op-retry
  kind: check-finding

BE_CLI_REQUIRED:
  title: "The back end has no cli app, or no cli image"
  title_vi: "Back end thiếu app cli hoặc image của nó"
  meaning_vi: "Mọi hành động chạy một lần của back end (migrate, seed, sync, backup, lệnh vận hành) nằm trong MỘT app `be/apps/cli` (kind cli, tên cli) chạy trên nest-commander. Back end có connection (migration chạy bằng `cli migrate run`) hoặc có lệnh dưới `src/features/cli/` thì phải khai báo đúng app đó và có `be/apps/cli/Dockerfile`."
  causes_vi:
    - "Vi phạm luật R147: không có app cli thì migration và các hành động một lần không có chỗ chạy chuẩn; thiếu Dockerfile thì không có image `cli` để chạy `cli <group> <command>`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai báo { \"name\": \"cli\", \"kind\": \"cli\" } trong `sides.be.apps` của `hfs.json`, dựng `be/apps/cli` với `CommandFactory.run` và thêm `be/apps/cli/Dockerfile`; đổi tên app cli khác thành `cli`."
  owner: op-retry
  kind: check-finding

BE_CLI_BOOTSTRAP:
  title: "The cli app does not boot with CommandFactory.run, or serves"
  title_vi: "App cli không khởi động bằng CommandFactory.run hoặc lại chạy như server"
  meaning_vi: "`main.ts` của app cli khởi động bằng `CommandFactory.run(...)` của nest-commander và không bao giờ phục vụ HTTP hay microservice: `NestFactory.create*`, `.listen()`, adapter `@nestjs/platform-*` hay `@nestjs/microservices` trong app cli đều bị từ chối."
  causes_vi:
    - "Vi phạm luật R148: app cli chạy một lệnh rồi thoát; một server trong app cli là một app api đội lốt."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết `main.ts` của app cli là `CommandFactory.run(AppModule, logger)` và bỏ mọi phần tạo server khỏi app cli."
  owner: op-retry
  kind: check-finding

BE_CLI_COMMAND_SHAPE:
  title: "A cli command is misplaced or has no spec"
  title_vi: "Lệnh cli đặt sai chỗ hoặc thiếu spec"
  meaning_vi: "Lệnh nest-commander (`@Command` hoặc `@SubCommand`) chỉ được khai báo trong `src/features/cli/`: nhóm `@Command` ở `<group>/<group>.cli.ts`, `@SubCommand` kế thừa `CommandRunner` ở `<group>/subs/<name>.cli.ts`, mỗi tệp một lệnh, và mỗi lệnh con có unit spec `<name>.cli.spec.ts` bên cạnh."
  causes_vi:
    - "Vi phạm luật R149: lệnh cli là nơi chạy hành động (không phải transport mỏng), nên phải nằm đúng chỗ và được chứng minh bằng spec như một service."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển lệnh về `src/features/cli/<group>/subs/<name>.cli.ts` (nhóm về `<group>/<group>.cli.ts`), cho lệnh con kế thừa `CommandRunner` và viết `<name>.cli.spec.ts` bên cạnh."
  owner: op-retry
  kind: check-finding

BE_CLI_OWNER:
  title: "A command line outside the cli"
  title_vi: "Có dòng lệnh nằm ngoài cli"
  meaning_vi: "`nest-commander` chỉ được import trong app cli và gốc feature cli; không mã back end nào tự đọc `process.argv` hay import commander, yargs, minimist."
  causes_vi:
    - "Vi phạm luật R150: một cửa hành động một lần ở app khác (ví dụ cờ `migrate` trong api) lách khỏi app cli, image cli và spec của lệnh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết hành động thành một lệnh `src/features/cli/<group>/subs/<name>.cli.ts` do app cli chạy và bỏ việc đọc tham số dòng lệnh ở nơi khác."
  owner: op-retry
  kind: check-finding

BE_EVENT_CLASS_CONTRACT:
  title: "A typed event class and its vendored contract agree"
  title_vi: "Lớp sự kiện và hợp đồng sự kiện đã vendor không khớp"
  meaning_vi: "Một lớp sự kiện dưới `be/src/modules/events/<service>/` không khai báo đúng một lớp với `eventName` và `version` là literal, không đặt tên tệp theo sự kiện của nó, không có mục tương ứng (cùng tên và phiên bản) trong `be/contracts/<service>/events.json`, hoặc một mục của hợp đồng không có lớp."
  causes_vi:
    - "Vi phạm luật R151: sự kiện là hợp đồng giữa các context và dịch vụ; lớp có kiểu và tệp hợp đồng phải là cùng một sự thật, nếu không bên nhận đọc một sự kiện mà bên phát không còn phát (hoặc ngược lại)."
    - "Bên phát đổi tên hoặc phiên bản của lớp nhưng chưa chạy `starci app emit`, hoặc thêm mục hợp đồng bằng tay."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa lớp (một lớp, eventName và version là literal, tên tệp theo sự kiện) rồi chạy `starci app emit` để hợp đồng khớp; không sửa tay `events.json`."
  owner: op-retry
  kind: check-finding

BE_OUTBOX_WRITE_TX:
  title: "The outbox is written by a domain service inside its transaction"
  title_vi: "Outbox bị ghi ngoài domain hoặc không trong transaction"
  meaning_vi: "`eventBus.publish(event, tx)` hoặc `enqueueX(payload, tx)` của một queue được gọi ngoài `modules/domain`, hoặc đối số `tx` không phải manager của transaction đang chạy (manager dùng chung được inject, một bí danh, manager ở ngoài hoặc thiếu đối số)."
  causes_vi:
    - "Vi phạm luật R152: một sự kiện hoặc job là hệ quả của thay đổi miền; dòng outbox phải cùng commit hoặc cùng rollback với thay đổi đó, nên chỉ domain service ghi và chỉ trong transaction của nó."
    - "Handler, consumer, integration hoặc platform tự phát sự kiện, hoặc gọi `publish` bằng manager ngoài transaction làm sự kiện bị mất hoặc phát dù giao dịch đã rollback."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đưa việc phát sự kiện vào domain service, gọi trong `this.entityManager.transaction(async (manager) => { ... })` và truyền đúng `manager` đó; handler hay consumer chỉ gọi domain service."
  owner: op-retry
  kind: check-finding

BE_EVENT_CONSUMER_SHAPE:
  title: "A message consumer is a transport door named after its event"
  title_vi: "Consumer sự kiện sai chỗ, sai tên hoặc không chuyển eventId"
  meaning_vi: "Một lớp implements `EventConsumer` nằm ngoài tệp `.consumer.ts` của `transport/message`, tên tệp không theo `eventName` của lớp sự kiện, `handle` không đọc `delivery.eventId`, hoặc một tệp `.consumer.ts` chứa lớp không phải consumer sự kiện."
  causes_vi:
    - "Vi phạm luật R153: giao hàng ít nhất một lần nên mỗi lần nhận lại phải dedupe; consumer chuyển `eventId` vào command để domain service claim trong `platform/inbox` cùng transaction với tác dụng của nó."
    - "Consumer được đặt ở handler hoặc nơi khác, hoặc đặt tên theo ý riêng khiến bên phát và bên nhận không cùng một tên sự kiện."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt consumer tại `transport/message/<event>.consumer.ts` (tên theo eventName, dấu chấm thành gạch ngang), khai báo `readonly event = <Lớp>Event`, và truyền `delivery.eventId` vào command được dispatch."
  owner: op-retry
  kind: check-finding

BE_QUEUE_PRODUCER_SHAPE:
  title: "A queue producer writes the outbox with its own tx parameter"
  title_vi: "Producer của queue ghi outbox không bằng tham số tx của nó"
  meaning_vi: "Một hàm hoặc phương thức export trong `<queue>.queue.ts` ghi vào `QueueOutbox` mà không khai báo tham số `tx: EntityManager` hoặc không truyền chính tham số đó làm đối số đầu."
  causes_vi:
    - "Vi phạm luật R154: job được enqueue trong transaction của người gọi (`enqueueX(payload, tx)`), nếu không job có thể chạy dù giao dịch rollback hoặc mất khi commit thành công."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm tham số `tx: EntityManager` vào producer và gọi `outbox.write(tx, ...)`."
  owner: op-retry
  kind: check-finding

BE_PATTERN_SPEC_MISSING:
  title: "A declared pattern has its proof scenarios on the test world"
  title_vi: "Pattern đã khai báo thiếu kịch bản chứng minh trên test world"
  meaning_vi: "hfs.json khai báo một pattern (event-bus, queue, ...) nhưng không có spec e2e hoặc integration nào có test mang tiêu đề `<pattern>/<kịch bản>: ...` cho một kịch bản bắt buộc của pattern đó."
  causes_vi:
    - "Vi phạm luật R155: phân tích tĩnh chỉ chứng minh hình dạng; hành vi (giao lại rồi vào dead letter, fencing token từ chối worker cũ, outbox chỉ phát sau commit) chỉ được chứng minh bằng kịch bản chạy thật trên test world."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e hoặc integration có test tiêu đề `<pattern>/<kịch bản>: ...` chạy trên `useTestWorld` cho từng kịch bản còn thiếu."
  owner: op-retry
  kind: check-finding

BE_KIND_ISOLATION:
  title: "No feature kind imports another kind"
  title_vi: "Một loại feature import trực tiếp loại feature khác"
  meaning_vi: "Một feature thuộc một loại kích hoạt (api, webhooks, realtime, saga, reactors, jobs hoặc cli) import một feature thuộc loại khác (kể cả import chỉ-kiểu), nên hai loại dính vào nhau thay vì gặp nhau qua event bus."
  causes_vi:
    - "Vi phạm luật R156: mỗi loại feature chỉ import xuống `modules/*`, chỉ `be/apps/*` mới ghép các feature; mọi lời gọi giữa các loại (api sang saga hoặc jobs, saga sang jobs, jobs sang saga, cli sang jobs) đi qua event bus để vẫn bền khi một bên chết."
    - "Một handler hoặc step được gọi trực tiếp từ loại khác để tiện, thay vì phát sự kiện từ domain service rồi để loại kia consume."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ import giữa các loại; để domain service phát sự kiện bằng `eventBus.publish(event, tx)` trong transaction của nó, và loại kia consume sự kiện đó; phần dùng chung đưa xuống `modules/*`."
  owner: op-retry
  kind: check-finding

BE_JOB_WRITE_OUTSIDE_OWNER:
  title: "The job row is written only by platform/jobs"
  title_vi: "Dòng job bị ghi ngoài platform/jobs"
  meaning_vi: "Một lời gọi `update`, `increment`, `save`, `insert`, `delete` hoặc query builder ghi vào entity của job nằm ngoài `platform/jobs`."
  causes_vi:
    - "Vi phạm luật R157: fencing token và trạng thái của job chỉ đổi qua `JobClaims` (claim, advance, complete, fail), mỗi hàm đều bắt buộc `expectedFencingToken`; ghi thẳng cho phép một worker zombie ghi đè job mà worker mới đang sở hữu."
    - "Một handler, step hoặc domain service tự `manager.update(JobEntity, ...)` để tiện thay vì gọi cổng `JobClaims`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ lệnh ghi trực tiếp, gọi `JobClaims.advance`, `complete` hoặc `fail` với `expectedFencingToken` của lần claim; việc chỉ đọc thì không bị cấm."
  owner: op-retry
  kind: check-finding

BE_JOB_FENCE_REQUIRED:
  title: "Every write to a claimed job carries its required fencing token"
  title_vi: "Ghi vào job đã claim không bắt buộc fencing token"
  meaning_vi: "Một phương thức của `JobClaims` nhận job mà kiểu tham số không bắt buộc `expectedFencingToken: number`, một lời gọi dùng `as`, `!` hoặc type assertion để lách, hoặc một `catch` quanh lệnh ghi có guard nuốt lỗi `JobFencedOut`."
  causes_vi:
    - "Vi phạm luật R158: lease hết hạn chỉ cho phép claimant mới, không dừng được tiến trình cũ; chỉ token đơn điệu được kiểm tra nguyên tử tại nơi nhận lệnh ghi mới từ chối worker zombie, nên token phải là bắt buộc trong kiểu."
    - "Token để optional, ép kiểu `as number`, hoặc `catch` ghi log rồi tiếp tục làm worker cũ vẫn gây tác dụng sau khi bị fence."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai báo `expectedFencingToken: number` bắt buộc trong kiểu, truyền đúng token trả về từ claim không ép kiểu, và để `FencedProcessor` xử lý lỗi (không `catch` quanh lệnh ghi trong step hay processor)."
  owner: op-retry
  kind: check-finding

BE_JOB_RUN_KEY:
  title: "An external effect of a job step carries a run key with the fencing token"
  title_vi: "Tác dụng ngoài của step không mang run key chứa fencing token"
  meaning_vi: "Một lời gọi tới integration trong `steps/<step>.step.ts` không truyền đối số kiểu `RunKey`, hoặc `RunKey` được tạo bằng ép kiểu thay vì `JobClaims.runKey`."
  causes_vi:
    - "Vi phạm luật R159: một worker zombie có thể lặp lại tác dụng ngoài; nhà cung cấp chỉ chặn được lặp nếu khoá idempotency gồm `jobId`, bước và fencing token của lần claim."
    - "Step truyền chuỗi cố định, hoặc `as RunKey` để tránh lỗi kiểu."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tạo khoá bằng `this.claims.runKey(job, \"<step>\")` và truyền cho integration; việc đọc dữ liệu đưa về lớp application."
  owner: op-retry
  kind: check-finding

BE_JOB_SHAPE:
  title: "A job processor extends the fenced base and a step implements JobStep"
  title_vi: "Processor của job không kế thừa lớp fenced hoặc step đặt sai chỗ"
  meaning_vi: "Một tệp `.processor.ts` nằm ngoài thư mục job của nó, tên khác job, không extends `FencedProcessor`; hoặc một tệp `.step.ts` nằm ngoài `steps/` hay không implements `JobStep`."
  causes_vi:
    - "Vi phạm luật R160: lớp cơ sở `FencedProcessor` claim job với token được tăng và kết thúc job qua các lệnh ghi có guard; một processor không kế thừa nó không có fence."
    - "Processor hoặc step được đặt cạnh handler hay nơi khác, làm loại jobs không còn một chỗ duy nhất."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `<job>.processor.ts` trong `features/jobs/<job>/transport/queue/` với class extends `FencedProcessor`, và mỗi step trong `steps/<step>.step.ts` implements `JobStep`."
  owner: op-retry
  kind: check-finding

BE_PROJECTION_WRITE_OWNER:
  title: "A read-model table is written only by its own projection"
  title_vi: "Bảng read model bị ghi ngoài projection của nó"
  meaning_vi: "Một lệnh ghi vào entity của projection nằm ngoài tệp `<name>.projection.ts` cùng thư mục."
  causes_vi:
    - "Vi phạm luật R161: read model chỉ có một người ghi là `recompute*` của projection, idempotent và có thể replay từ sự kiện nguồn; ghi từ nơi khác làm bảng lệch khỏi nguồn mà replay không sửa được."
    - "Một domain service hoặc handler cập nhật thẳng bảng projection để nhanh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ lệnh ghi, để reactor hoặc job gọi `recompute*` của projection, và đọc qua `get*`."
  owner: op-retry
  kind: check-finding

BE_PROJECTION_SHAPE:
  title: "A projection speaks recompute and get, hides its entity, and the api only reads"
  title_vi: "Projection có phương thức ngoài recompute/get, lộ entity hoặc api gọi recompute"
  meaning_vi: "Một phương thức public của projection không phải `recompute*` hay `get*`, `index.ts` của projection export entity, hoặc một feature loại api gọi `recompute*`."
  causes_vi:
    - "Vi phạm luật R162: projection chỉ làm hai việc, tính lại bảng từ sự kiện nguồn hoặc đọc nó; entity không được lộ để nơi khác không phụ thuộc hình dạng bảng; api chỉ đọc, còn reactor hoặc job giữ bảng luôn mới."
    - "Thêm một phương thức `set` hay `update` vào projection, hoặc export entity qua index để tiện đọc."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi tên phương thức theo `recompute*`/`get*` (hoặc chuyển logic về domain service), bỏ export entity khỏi `index.ts`, và để reactor hoặc job gọi `recompute*`."
  owner: op-retry
  kind: check-finding

BE_KIND_DECLARATION:
  title: "The trigger kinds in use are declared, whole and never unused"
  title_vi: "Loại kích hoạt đang dùng chưa khai báo đủ trong hfs.json"
  meaning_vi: "`sides.be.kinds` của hfs.json không khớp với các loại feature đang có: thiếu một loại đang dùng, khai báo một loại không có feature nào, thiếu pattern mà loại đó cần, hoặc thiếu platform capability của pattern đó."
  causes_vi:
    - "Vi phạm luật R179: mỗi loại chỉ được sinh ra khi dùng đến (không có boilerplate rỗng), và loại nào đang dùng thì hạ tầng platform của nó phải có (jobs cần platform/jobs và platform/queue, reactors cần platform/event-bus)."
    - "Feature được tạo tay thay vì bằng `starci app add`, hoặc loại cuối cùng đã bị xoá mà khai báo vẫn còn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dùng `starci app add <loại> <tên>` để tạo thành viên đầu tiên cùng platform capability và khai báo, hoặc xoá khai báo của loại không còn dùng khỏi `sides.be.kinds`."
  owner: op-retry
  kind: check-finding

BE_KIND_EMPTY:
  title: "A kind folder has members and every member has code"
  title_vi: "Thư mục loại feature rỗng hoặc thành viên không có mã"
  meaning_vi: "Một tệp nằm trực tiếp trong `be/src/features/<loại>/` (ví dụ `.gitkeep` hay một feature trùng tên loại), hoặc một thư mục thành viên `<loại>/<tên>/` không có tệp TypeScript nào."
  causes_vi:
    - "Vi phạm luật R180: loại feature chỉ tồn tại khi có thành viên; thư mục loại rỗng là boilerplate mà `starci app add` không bao giờ sinh ra, và tên loại là tên dành riêng nên không dùng cho feature api."
    - "Tạo sẵn thư mục cho loại chưa dùng hoặc đổi tên feature api thành tên một loại."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xoá thư mục rỗng, đổi tên feature trùng tên loại, hoặc tạo thành viên bằng `starci app add`."
  owner: op-retry
  kind: check-finding

BE_SQL_RETURNING_SHAPE:
  title: "UPDATE or DELETE with RETURNING is not wrapped in a SELECT"
  title_vi: "UPDATE hoặc DELETE có RETURNING chưa được bọc trong SELECT"
  meaning_vi: "EntityManager.query của TypeORM trả về câu UPDATE hoặc DELETE có RETURNING dưới dạng [các dòng, số dòng bị ảnh hưởng] chứ không phải danh sách dòng, nên nơi gọi đọc kết quả như danh sách dòng sẽ đọc sai mà unit spec giả lập SQL không thấy được (saga kẹt, kho không được trả). Bộ kiểm tra đọc từng hằng SqlText trong .sql.ts và từ chối câu bắt đầu bằng UPDATE hoặc DELETE mà có RETURNING ở cấp ngoài cùng; INSERT ... RETURNING và RETURNING nằm trong CTE đã bọc thì hợp lệ."
  causes_vi:
    - "UPDATE stock SET ... WHERE ... RETURNING id, qty chạy thẳng bằng manager.query rồi đọc rows[0]"
    - "DELETE ... RETURNING id trả về [rows, count]"
  nextStep_vi: "Viết lại thành WITH changed AS (UPDATE ... RETURNING ...) SELECT ... FROM changed để kết quả luôn là danh sách dòng, và thêm một spec e2e chạy câu lệnh trên cơ sở dữ liệu thật. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BUILD_CONTEXT:
  title: "The Dockerfile does not build from the app root"
  title_vi: "Dockerfile không build từ gốc app"
  meaning_vi: "Dockerfile của app phải ghi trong comment đầu tệp lệnh `starci docker build <app>` đúng app của chính nó (context là gốc app, nơi có `package.json` và lockfile duy nhất), và mọi nguồn của COPY/ADD nằm trong context (không có `..`, không có đường dẫn tuyệt đối)."
  causes_vi:
    - "Vi phạm luật R187: context build là gốc app; lệnh build sai hoặc nguồn COPY vượt ra ngoài context khiến image build được trên máy này nhưng hỏng trên CI hoặc trộn lẫn dữ liệu của app khác."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt lệnh `starci docker build <app>` vào comment đầu Dockerfile và sửa các nguồn COPY/ADD về đường dẫn tương đối trong gốc app."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_STAGES:
  title: "The Dockerfile stages, user or install break the canon"
  title_vi: "Các stage, user hoặc lệnh cài của Dockerfile sai chuẩn"
  meaning_vi: "Dockerfile phải nhiều stage: một stage tên `build` (cài và build) và stage cuối tên `runtime` (thứ được chạy); runtime kết thúc bằng `USER node` và không chạy build; mọi lệnh cài đi qua `starci npm ci` (không dùng `starci npm install`); runtime của be chỉ cài dependency production và bỏ lifecycle scripts, runtime của fe không cài gì."
  causes_vi:
    - "Vi phạm luật R188: image chạy bằng root, mang theo công cụ build hoặc cài không theo lockfile thì vừa lớn vừa kém an toàn, và không tái lập được."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tách Dockerfile thành stage `build` và stage cuối `runtime`, thêm `USER node`, đổi `starci npm install` thành `starci npm ci`, và chuyển mọi lệnh build ra khỏi runtime."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_ENTRY:
  title: "The Dockerfile does not start the app's own entry or declare its port and health"
  title_vi: "Dockerfile không chạy đúng entry của app hoặc thiếu cổng và healthcheck"
  meaning_vi: "Stage `runtime` phải chạy entry đã build của chính app ở dạng exec (be: `node be/dist/apps/<app>/src/main.js`; fe: `node fe/apps/<app>/server.js`); app api hoặc Next đặt `ENV PORT`, EXPOSE đúng cổng đó và có HEALTHCHECK; worker có HEALTHCHECK theo tiến trình và không EXPOSE; cli/migrate ghi `HEALTHCHECK NONE` và không EXPOSE; app Next build bằng `turbo run build --filter=@<project>/<app>` và `next.config.ts` đặt `output: \"standalone\"`."
  causes_vi:
    - "Vi phạm luật R189: một image khởi động sai entry, không công bố cổng hoặc không có healthcheck thì nền tảng không thể điều phối hay phát hiện lỗi của nó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa CMD/ENTRYPOINT về entry của app, thêm `ENV PORT`, `EXPOSE`, `HEALTHCHECK` (hoặc `HEALTHCHECK NONE` cho cli), và đặt `output: \"standalone\"` trong `next.config.ts` của app Next."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BASE_PIN:
  title: "A Dockerfile base image is not pinned"
  title_vi: "Image nền của Dockerfile không được ghim"
  meaning_vi: "Mọi FROM của Dockerfile phải là một stage trước đó, image node duy nhất của chuẩn (phiên bản node và bản alpine cụ thể), hoặc image ghim bằng digest `@sha256`; không dùng tag trôi nổi (`latest`, `node:22`) và không để build argument chưa xác định."
  causes_vi:
    - "Vi phạm luật R190: tag trôi nổi làm image đổi nội dung mà không có thay đổi nào trong repo, nên build không tái lập và lỗ hổng mới lọt vào không dấu vết."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi FROM thành image node của chuẩn (xem `NODE_IMAGE` trong scripts/hfs/rules/docker.mjs) hoặc ghim image bằng digest `@sha256`."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_SECRETS:
  title: "A secret enters an image"
  title_vi: "Bí mật bị đưa vào image"
  meaning_vi: "Không được COPY/ADD tệp `.env*` (trừ `.env.example`) hay đường dẫn trong `.starcistacks`, `.secrets`, `.volume`, khóa, chứng chỉ, kubeconfig; không ADD một URL; không có ARG hoặc ENV mang tên một thông tin xác thực (PASSWORD, SECRET, TOKEN, KEY, CREDENTIAL, PRIVATE); riêng `NEXT_PUBLIC_*` được phép vì được công khai theo thiết kế."
  causes_vi:
    - "Vi phạm luật R191: mọi thứ trong layer hoặc lịch sử image đều lấy ra được; một bí mật trong image là bí mật đã lộ cho mọi nơi image được kéo về."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ COPY/ADD hoặc ARG/ENV đó, mount thông tin xác thực lúc chạy, và tải về bằng stage có kiểm checksum thay vì ADD URL."
  owner: op-retry
  kind: check-finding

CLI_ONLY_ENTRY:
  title: "A tracked file runs a runtime script directly"
  title_vi: "Một file được theo dõi chạy trực tiếp script của runtime"
  meaning_vi: "Một prompt, tài liệu, skill, file knowledge, cấu hình, CI, hook hoặc đăng ký tác vụ chạy node scripts/..., chạy trực tiếp ui/harness-verbs.mjs hoặc npm run bọc script runtime thay vì starci <group> <verb>."
  causes_vi:
    - "Vi phạm luật R201: mọi hành động phải đi qua starci <group> <verb>."
  nextStep_vi: "Đổi lời gọi thành lệnh starci mà bộ kiểm tra gợi ý; nếu script chưa có verb thì thêm file catalog hoặc khai báo nội bộ trong modules/cli/commands/_internal.yaml."
  owner: op-retry
  kind: check-finding

RT_CLI_CATALOG_DRIFT:
  title: "Generated CLI catalog outputs drifted"
  title_vi: "Các đầu ra catalog CLI sinh tự động bị lệch"
  meaning_vi: "Một đầu ra sinh từ catalog của modules/cli/commands (packages/cli/src/catalog.generated.mjs, docs/cli.md, packages/cli/completions/*) khác với nội dung mà scripts/cli/gen-catalog.mjs sinh ra: thiếu, cũ, hoặc đã sửa tay."
  causes_vi:
    - "Sửa một file catalog trong modules/cli/commands mà quên chạy gen-catalog --write"
    - "Sửa tay một đầu ra sinh tự động thay vì sửa catalog nguồn"
  nextStep_vi: "Người giám sát chạy starci runtime gen-catalog --write rồi commit cả catalog lẫn các đầu ra; không sửa tay tệp đã sinh."
  owner: supervisor
  kind: check-finding

RT_CLI_VERB_PARITY:
  title: "CLI catalog and implementation disagree"
  title_vi: "Catalog CLI và cài đặt không khớp nhau"
  meaning_vi: "Catalog của modules/cli/commands và code lệch nhau: một verb của catalog không có handler (impl.script thiếu, không có verbs/<verb>.mjs, không có case trong cli.mjs) hoặc không có tài liệu; một verb module của kernel hoặc một case của cli.mjs không có file catalog; một --flag trong usage:/required của module verb hay trong api-boolean-flags.txt không nằm trong flags của catalog."
  causes_vi:
    - "Thêm một verb module trong scripts/kernel/verbs mà quên file modules/cli/commands/kernel/<verb>.yaml"
    - "Đổi usage hoặc required của một verb mà không cập nhật flags của catalog"
  nextStep_vi: "Người giám sát đồng bộ hai phía: thêm file catalog cho verb mới, sửa flags của catalog theo usage/required, hoặc xóa verb khỏi catalog khi handler đã bị xóa."
  owner: supervisor
  kind: check-finding

RT_CLI_APP_ONLY_TEMPLATES:
  title: "Managed app template invokes the wrong CLI"
  title_vi: "Template ứng dụng gọi sai bề mặt CLI"
  meaning_vi: "Template do StarCi quản lý hoặc bản sao runtime đã sinh gọi lệnh hfs cũ, test-stack cũ, hoặc một nhóm starci không phải app; repository sản phẩm chỉ được gọi starci app <verb>."
  causes_vi:
    - "Vi phạm luật R200: mọi hành động sản phẩm trong template phải đi qua CLI thống nhất starci app."
  nextStep_vi: "Đổi lời gọi thành starci app <verb>, sinh lại các bản sao runtime và chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

catalog-invalid:
  title: "CLI catalog file is invalid"
  title_vi: "File catalog CLI không hợp lệ"
  meaning_vi: "scripts/cli/catalog.mjs từ chối một file trong modules/cli/commands: thiếu khóa bắt buộc, khóa không rõ, verb trùng, group rỗng, flag tên profile, hoặc --edition khác [full]."
  causes_vi:
    - "Sửa một file catalog sai schema (thiếu group/verb/impl/flags/exit/json/examples/editions/since/removed)"
    - "Đặt trùng tên verb trong hai file, hoặc khai báo flag cấm"
  nextStep_vi: "Người giám sát đọc danh sách lỗi của loadCatalog và sửa từng file catalog theo schema; chạy lại starci runtime check --only cli-parity."
  owner: supervisor
  kind: check-finding
RT_FACT_FALSE:
  title: "A machine-evaluated fact is false, or prose contradicts it"
  title_vi: "Một sự thật máy kiểm được là sai, hoặc văn bản mâu thuẫn với nó"
  meaning_vi: "Một sự thật trong knowledge/hfs/facts.yaml không đúng với knowledge/hfs/slots.yaml (nguồn duy nhất của hình dạng sản phẩm), hoặc một dòng trong knowledge, docs hay README nói điều ngược lại, ví dụ 'không có package.json' cho một ứng dụng fe vốn có package.json riêng. Văn bản chép lại điều khẳng định bằng lời khác sẽ lệch dần khỏi slots.yaml."
  causes_vi:
    - "Sửa slots.yaml mà không sửa sự thật hoặc câu văn tương ứng"
    - "Một tài liệu chép lại điều khẳng định của slot bằng lời riêng và lời đó cũ đi"
  nextStep_vi: "Người giám sát xóa câu văn mâu thuẫn và thay bằng mã sự thật hoặc mã slot; nếu sự thật sai thì sửa slots.yaml hoặc facts.yaml, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_RULE_ID_UNKNOWN:
  title: "A rule id that is not in the catalog"
  title_vi: "Mã luật không có trong danh mục"
  meaning_vi: "Một tệp được git theo dõi (tri thức, tài liệu, mã hoặc dữ liệu) nêu một mã luật R<số> mà knowledge/hfs/rules.yaml không có, hoặc một mã luật đã nghỉ hưu mà chỉ tệp lịch sử (CHANGELOG) mới được nêu. Mã luật ma làm người đọc và máy trỏ tới một luật không tồn tại."
  causes_vi:
    - "Một luật bị xóa hoặc đánh số lại mà các chỗ trích dẫn không được sửa theo"
    - "Gõ nhầm mã luật"
  nextStep_vi: "Người giám sát đổi trích dẫn sang luật hiện có của danh mục hoặc bỏ mã, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_RULE_UNCITED:
  title: "A catalog rule no pattern topic cites"
  title_vi: "Một luật của danh mục mà không chủ đề pattern nào trích dẫn"
  meaning_vi: "Một luật của knowledge/hfs/rules.yaml không được nêu trong hfsRules của bất kỳ chủ đề nào dưới knowledge/patterns/** và cũng không mang scope: runtime. Luật của sản phẩm tồn tại để được dạy; một luật không được trích dẫn là luật mà một lane không bao giờ đọc."
  causes_vi:
    - "Thêm một luật vào danh mục mà không trích dẫn nó từ chủ đề dạy nó"
    - "Một luật chỉ quản trị chính kho runtime mà thiếu scope: runtime"
  nextStep_vi: "Người giám sát thêm mã luật vào hfsRules của chủ đề knowledge/patterns dạy nó, hoặc đánh dấu luật scope: runtime khi nó chỉ quản trị kho runtime, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_GENERATED_BLOCK_STALE:
  title: "A generated README block or derived field differs from its source"
  title_vi: "Khối README sinh tự động khác nguồn của nó"
  meaning_vi: "Một khối giữa các dấu hfs:generated của knowledge/hfs/README.md (bản đồ ứng dụng, cây mã backend, ma trận tầng, cây mã frontend, danh mục luật) không bằng từng byte với bản dựng từ knowledge/hfs/slots.yaml và rules.yaml. Cùng cách đó, danh sách verification.automated của luật mẫu, slot của mục files: và mã code của mục why phải bằng đúng bản suy ra từ danh mục luật và slots.yaml. Sửa tay hoặc đổi nguồn mà không dựng lại làm văn bản nói khác nguồn."
  causes_vi:
    - "Sửa slots.yaml hoặc rules.yaml mà không chạy lại readme-blocks.mjs --write"
    - "Sửa tay nội dung bên trong một khối sinh tự động"
  nextStep_vi: "Người giám sát chạy starci runtime readme-blocks --write hoặc starci runtime derived-fields --write rồi commit, qua một lane đã land; không sửa tay bên trong khối."
  owner: supervisor
  kind: check-finding

RT_PROSE_PATH_NO_SLOT:
  title: "A path in prose that no slot owns"
  title_vi: "Đường dẫn trong văn bản không thuộc slot nào"
  meaning_vi: "Một đường dẫn sản phẩm (be/... hoặc fe/...) trong knowledge, docs hoặc README không được slot nào của knowledge/hfs/slots.yaml sở hữu và cũng không phải thư mục cha của một slot. Văn bản đã tự nghĩ ra một chỗ không có, hoặc giữ lại một chỗ mà slot không còn. Tên ứng dụng là tự do: tên ghi cứng phải là ứng dụng của ví dụ hoặc của starter, còn <tên> giữ chỗ thay cho mọi ứng dụng."
  causes_vi:
    - "Đổi hoặc xóa một slot mà văn bản vẫn nêu đường dẫn cũ"
    - "Ghi tên ứng dụng theo vai trò (api, web) thay vì giữ chỗ"
  nextStep_vi: "Người giám sát thay đường dẫn bằng mã slot, bằng <giữ chỗ> hoặc bằng tên ứng dụng của ví dụ, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_PROSE_RESTATES_SLOTS:
  title: "Prose restates the slots"
  title_vi: "Văn bản chép lại các slot"
  meaning_vi: "Một khối mã hoặc một dòng trong knowledge, docs hoặc README nêu từ ba đường dẫn sản phẩm mà slot sở hữu trở lên, hoặc một câu liệt kê từ ba tên tệp gốc hay tệp của phía mà các slot khai báo. Bản chép lại cũ đi so với slots.yaml; chỉ khối sinh tự động giữa các dấu hfs:generated mới được phép sao chép."
  causes_vi:
    - "Chép cây thư mục hoặc danh sách tệp của slots.yaml vào văn bản"
    - "Liệt kê các tệp cấu hình của gốc ứng dụng trong một câu"
  nextStep_vi: "Người giám sát thay bản chép bằng mã slot (slot app.format-config...) hoặc bằng một khối sinh tự động, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_PORT_RESTATED:
  title: "A port literal is spelled outside its owner"
  title_vi: "Một literal cổng được viết ngoài tệp chủ sở hữu"
  meaning_vi: "Một cổng của runtime chỉ được viết literal một lần, trong tệp chủ của nó: port và devPort của UI nằm trong modules/models/runtimes.yaml (statusApp) và đọc qua ui/ports.mjs, host SonarQube nội bộ trong DEFAULT_HOST của scripts/gates/sonar-local.mjs. Một literal cổng ở vị trí cổng (authority scheme://host:NNNN, host:NNNN, gán *port*/PORT, lời gọi listen(NNNN)) trong một tệp không phải chủ sở hữu — hoặc cùng một literal không chủ trong từ hai tệp nguồn runtime — là một bản chép lại. Spec, test, bản runtime sinh ra, lịch sử hợp đồng, CHANGELOG, .starciwork và khai báo stack của sản phẩm nằm ngoài luật."
  causes_vi:
    - "Hard-code một port của runtime trong script hay tài liệu thay vì import từ tệp chủ"
    - "Hai tệp nguồn cùng viết literal một port không chủ mà không khai báo hằng số chủ sở hữu"
  nextStep_vi: "Người giám sát thay literal bằng import từ tệp chủ (ui/ports.mjs, sonar-local DEFAULT_HOST) hoặc khai báo một hằng số chủ duy nhất rồi cho mọi nơi khác tham chiếu."
  owner: supervisor
  kind: check-finding

RT_SPEC_OVER_BUDGET:
  title: "A spec exceeds the land duration budget"
  title_vi: "Một tệp spec vượt quá ngân sách thời gian của lần land"
  meaning_vi: "Thời lượng đã ghi của một tệp spec còn tồn tại vượt quá giới hạn chung trong modules/kernel/spec-durations.yaml. Tệp chậm làm kéo dài lần land và phải giảm chi phí thiết lập mà vẫn giữ nguyên từng test, assertion và đường vào production."
  causes_vi:
    - "Mỗi test lặp lại việc cài đặt, khởi động tiến trình hoặc dựng fixture nặng"
    - "Test chờ đồng hồ thật thay vì dùng đồng hồ được tiêm vào"
  nextStep_vi: "Người giám sát làm theo speed.md: dùng fixture dùng chung trong một tiến trình spec, bỏ cài đặt hoặc khởi động theo từng test, tiêm đồng hồ và không tăng timeout; sau lần land cuối thì làm mới bản ghi thời lượng."
  owner: supervisor
  kind: check-finding

RT_SPEC_BUDGET_STALE:
  title: "A recorded spec duration names a missing file"
  title_vi: "Một thời lượng spec đã ghi trỏ tới tệp không còn tồn tại"
  meaning_vi: "Một hàng trong modules/kernel/spec-durations.yaml đặt tên tệp spec không còn tồn tại, nên bản ghi thời lượng của lần land đã cũ và không thể dùng làm ngân sách hiện hành."
  causes_vi:
    - "Tệp spec được đổi tên hoặc xóa sau lần làm mới bản ghi gần nhất"
    - "Bản ghi thời lượng được chép từ một revision khác"
  nextStep_vi: "Người giám sát làm mới bản ghi từ kết quả land của revision hiện tại để mỗi hàng trỏ tới một tệp spec đang tồn tại."
  owner: supervisor
  kind: check-finding

RT_CONFIG_DEFAULT_TWICE:
  title: "A documented default is restated outside its owner"
  title_vi: "Một giá trị mặc định được khai báo lại ngoài tệp chủ"
  meaning_vi: "Mỗi mặc định của cấu hình được viết một lần trong tệp chủ của nó: các leaf camelCase hay khóa lowercase của config.example.yaml, và các mặc định mà chủ sở hữu khai báo (DEFAULTS của scripts/machine/home.mjs cho supervisor và ngôn ngữ owner, engine/config.mjs cho connector/ask/UAT/spec/allocation, engine/orca-config.mjs cho độ sâu worker, scripts/reconciler/state.mjs cho mode của controller). Một literal fallback (??, ||, mặc định tham số, hay ternary kiểu language === 'en' ? 'en' : 'vi') ở tệp khác là bản chép lại; phía đọc gọi accessor của chủ (supervisorSettings(), configuredMode(), ownerLanguage()). Spec, test, runtime sinh ra, story và template HFS nằm ngoài luật."
  causes_vi:
    - "Viết ?? <literal> hay || <literal> cho một khóa đã có trong config.example.yaml thay vì gọi accessor"
    - "Khai báo tham số mặc định bằng literal giá trị mà chủ sở hữu đã định"
  nextStep_vi: "Người giám sát thay literal bằng accessor của chủ sở hữu (import DEFAULTS/supervisorSettings/ownerLanguage...) hoặc chuyển mặc định về tệp chủ rồi đọc qua nó."
  owner: supervisor
  kind: check-finding

RT_VERSION_RESTATED:
  title: "A pinned version is spelled outside canon-pins.yaml"
  title_vi: "Một phiên bản ghim được viết ngoài canon-pins.yaml"
  meaning_vi: "knowledge/hfs/canon-pins.yaml viết phiên bản của mọi gói @starci và mọi phụ thuộc được ghim đúng một lần; package.json là nơi cài đặt khai báo và lockfile là kết quả resolve. Một literal semver bằng pin — hay specifier name@x.y.z nhắc tới nó — ở bất cứ đâu khác là bản chép lại, trừ các khóa binding mà refresher sở hữu và ghi đè tại chỗ (canon.version của code-pattern bindings do check-canon-pins giữ; provenance.version và identity.version của grammar snapshot do grammar-knowledge.mjs ghi lại). Manifest, lockfile, changelog, lịch sử hợp đồng, spec, test, runtime sinh ra và .starciwork nằm ngoài luật."
  causes_vi:
    - "Viết số phiên bản của một pin trong prose hay YAML thay vì nhắc tới tên pin"
    - "Chép specifier name@x.y.z vào tài liệu hay mẫu scaffold"
  nextStep_vi: "Người giám sát viết lại theo tên pin (\"the pinned @starci/grammar\", \"knowledge/hfs/canon-pins.yaml\") hoặc để refresher ghi qua khóa binding đã khai báo — không bao giờ viết literal."
  owner: supervisor
  kind: check-finding

RT_SLOT_ID_SHAPE:
  title: "A slot id breaks the manifest's declared grammar"
  title_vi: "Một slot id vi phạm ngữ pháp mà manifest khai báo"
  meaning_vi: "Một slot id đi theo ngữ pháp mà chính manifest khai báo: các đoạn lowercase kebab ngăn bằng dấu chấm, đoạn đầu thuộc naming.prefixes của knowledge/hfs/slots.yaml (profiles của runtime-slots.yaml), <side>.app.<kind> chỉ một kind trong appKinds.<side>, và mọi id sâu hơn mở rộng một id đã khai báo — qua trường parent tường minh, hoặc một family mà ít nhất hai slot cùng dùng; một id sâu lẻ loi tự bịa ra family. Từ vựng suffix không chứa cặp đồng nghĩa: suffixes của một profile không trùng bannedSuffixes, không cặp nào trong naming.refusedPairs sống ở cả hai vế, và naming.sameConceptPairs (step + saga-step) là ngoại lệ duy nhất — sống ở cả hai vế hoặc bị bỏ."
  causes_vi:
    - "Đặt một slot id mới không bắt đầu bằng prefix khai báo hay không kebab-case"
    - "Tạo một id sâu không mở rộng slot nào đã khai báo và family chỉ có một thành viên"
    - "Thêm một suffix đồng nghĩa với một suffix đã có mà không khai báo cặp đó trong naming"
  nextStep_vi: "Người giám sát sửa id theo ngữ pháp (đổi tên, đặt parent, hay khai báo prefix/family trong naming của manifest) hoặc đưa từ trùng nghĩa về bannedSuffixes / khai báo cặp trong naming.sameConceptPairs/refusedPairs."
  owner: supervisor
  kind: check-finding

CI_UPLOAD_NOT_SILENT:
  title: "Coverage upload can skip or fail silently"
  title_vi: "Bước tải coverage có thể bị bỏ qua hoặc lỗi mà không báo"
  meaning_vi: "Một bước codecov/codecov-action trong workflow CI (gốc, ví dụ hoặc template của packages/hfs) không xác thực bằng OIDC (use_oidc: true cùng permissions id-token: write), không đặt fail_ci_if_error: true, có continue-on-error: true, hoặc bị chặn bởi điều kiện đọc một secret hay CODECOV_TOKEN. Khi đó thiếu secret hay tải lỗi chỉ làm bước bị bỏ qua và job vẫn xanh, coverage thôi được báo mà không ai hay."
  causes_vi:
    - "Dùng token trong repository secret và đặt điều kiện if theo secret đó"
    - "Để continue-on-error hoặc quên fail_ci_if_error cho bước tải"
  nextStep_vi: "Người giám sát đặt use_oidc: true và fail_ci_if_error: true cho bước, cấp permissions id-token: write cho job, bỏ continue-on-error và điều kiện theo secret, rồi render lại workflow bằng starci app sync --write."
  owner: supervisor
  kind: check-finding

CI_TRIGGERS_RELEASE_ONLY:
  title: "Workflow trigger other than a release tag, a person or the runtime's main"
  title_vi: "Workflow có trigger không phải tag phát hành, người chạy tay hay main của runtime"
  meaning_vi: "Một workflow CI (gốc, ví dụ hoặc template của packages/hfs) khai báo trigger ngoài các loại được phép: push của tag v*, workflow_dispatch và, chỉ ở workflow gốc của runtime, push của nhánh main (không kèm paths hay bộ lọc ignore). Push nhánh khác, push main trong ví dụ hoặc template, pull_request, schedule hay workflow_call làm CI chạy sai thời điểm, và mọi app scaffold từ template sẽ thừa hưởng lỗi đó."
  causes_vi:
    - "Giữ trigger push hoặc pull_request của mô hình CI cũ"
    - "Thêm bộ lọc branches khác [main], hoặc paths, vào push; hoặc thêm push main vào ví dụ hoặc template của app"
  nextStep_vi: "Người giám sát đặt on của workflow gốc thành push với tags: ['v*'] và/hoặc branches: [main] cùng workflow_dispatch; ví dụ và template trong packages/hfs/templates/app/ci-workflows chỉ giữ tags: ['v*'] và workflow_dispatch (render lại ví dụ bằng starci app sync --write); không thêm trigger khác (docs/git-governance.md)."
  owner: supervisor
  kind: check-finding

RELEASE_NOTES:
  title: "Release tag without finished release notes"
  title_vi: "Tag phát hành chưa có ghi chú phát hành hoàn chỉnh"
  meaning_vi: "HEAD mang tag phát hành v<phiên bản> nhưng CHANGELOG.md không có mục ## [<phiên bản>], hoặc mục đó còn TODO, PENDING, TBD hay dấu in preparation. Thông điệp của tag và GitHub Release chính là mục này nên không được cắt tag khi nó chưa xong."
  causes_vi:
    - "Tạo tag trước khi viết xong mục CHANGELOG"
    - "Còn sót dấu PENDING hoặc TBD của lane chưa land"
  nextStep_vi: "Người giám sát hoàn tất mục CHANGELOG của phiên bản (xóa mọi dấu TODO, PENDING, TBD), commit rồi mới tạo lại tag chú thích trên commit phát hành; không dời hay xóa tag đã đẩy."
  owner: supervisor
  kind: check-finding

EXAMPLES_CI_IMAGES_NOT_DERIVED:
  title: "The examples workflow does not build every image from a derived matrix"
  title_vi: "Workflow ví dụ không build mọi image từ ma trận được suy ra"
  meaning_vi: "Workflow gốc phải có job `images` build image của mọi ứng dụng trong từng ví dụ, ma trận lấy từ đầu ra của `starci runtime check --only examples-ci -- --images` (một mục cho mỗi app be và fe trong hfs.json), và không bao giờ đẩy image lên registry."
  causes_vi:
    - "Danh sách image viết tay trong workflow, hoặc thiếu job images"
    - "Một bước build có push: true hoặc docker push"
  nextStep_vi: "Dựng lại job `images` với include: fromJSON của đầu ra `--images` và bỏ mọi thao tác push."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_APP_QUALITY_DRIFT:
  title: "An example's codecov.yml or sonar-project.properties differs from its render"
  title_vi: "codecov.yml hoặc sonar-project.properties của ví dụ lệch khỏi bản sinh"
  meaning_vi: "Hai tệp chất lượng của mỗi ví dụ được sinh từ jest preset nguồn của repo này, cùng phạm vi coverage với cờ trong codecov.yml gốc; phạm vi loại trừ của Sonar là phần bù của nó."
  causes_vi:
    - "Preset nguồn đổi mà các tệp chưa được sinh lại"
    - "Sửa tay tệp sinh ra"
  nextStep_vi: "Chạy `starci runtime check --only examples-ci -- --write` và commit các tệp sinh ra."
  owner: runtime-core
  kind: check-finding

RT_EXAMPLE_COUPLING:
  title: "Runtime source names a concrete example tree"
  title_vi: "Mã nguồn runtime gọi tên một cây examples/ cụ thể"
  meaning_vi: "Một tệp nguồn runtime được theo dõi (scripts/, engine/, packages/ trừ bản sao runtime đã sinh, ui/src, ui/api, hay một template quản lý dưới packages/hfs/templates/) viết literal examples/<name> — trỏ tới một thư mục ví dụ cụ thể thay vì một khai báo chung. Canon của runtime ship vào mọi sản phẩm, nên một đường dẫn ví dụ cứng chỉ đúng trên một checkout. Spec, test, lịch sử CHANGELOG và các bản ghi .starciwork nằm ngoài phạm vi; một lượt đọc runtime thật sự cần được khai báo một lần trong scripts/lib/example-refs.mjs và mọi nơi dùng gọi tên hằng đó."
  causes_vi:
    - "Một script hay gate đọc ví dụ của riêng một sản phẩm (ví dụ một tệp declaration đặt theo tên repo) lúc chạy, thay vì một mẫu chung hay tệp của repo đang được kiểm"
    - "Comment, tài liệu hay chuỗi trong nguồn trích dẫn đường dẫn examples/<name> cụ thể thay vì nói examples/<app>"
  nextStep_vi: "Người giám sát khái quát hóa chỗ đó (ví dụ examples/<app>, một mẫu template.*, hay một hằng trong scripts/lib/example-refs.mjs khi runtime thật sự đọc cây đó) hoặc trỏ tới repo đang được kiểm tra, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_PRODUCT_NAME_IN_SOURCE:
  title: "A product name is written in runtime source"
  title_vi: "Tên một sản phẩm xuất hiện trong mã nguồn runtime"
  meaning_vi: "Một tệp nguồn runtime được theo dõi viết tên của một sản phẩm mà runtime từng ship kèm (danh sách đóng PRODUCT_NAMES trong scripts/lib/example-refs.mjs) hoặc một mã inc-<hash> có tiền tố là tên sản phẩm. Canon chạy trong mọi repo sản phẩm, nên một tên cứng trong source rò rỉ phán đoán của một sản phẩm sang mọi sản phẩm khác. Spec, test và lịch sử được giữ tên đó; mọi nơi khác phải nói chung chung hoặc qua hằng khai báo trong scripts/lib/example-refs.mjs."
  causes_vi:
    - "Một câu chuyện sự cố trong comment hay log viết thẳng tên sản phẩm (ví dụ workflow wf-<product>-… hay một ledger cụ thể) thay vì 'a product's …' hay <product>"
    - "Một ánh xạ, alias hay fixture đặt theo tên sản phẩm được để trong source thay vì trong tệp khai báo chung"
  nextStep_vi: "Người giám sát viết lại chỗ đó theo dạng chung (<product>, a product's …, acme cho một ví dụ) hoặc chuyển giá trị thật sự cần vào một hằng trong scripts/lib/example-refs.mjs, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_HOST_PATH_IN_TEMPLATE:
  title: "A host drive path is hard-coded in source"
  title_vi: "Một đường dẫn trên host bị viết cứng trong mã nguồn"
  meaning_vi: "Một tệp nguồn runtime hay một template quản lý viết cứng một đường dẫn của máy host — một ổ đĩa Windows kiểu chữ cái kèm dấu hai chấm, một thư mục người dùng kiểu Users hay home, hay một đường AppData đã bung. Source và template ship sang mọi máy và mọi sản phẩm, nên đường dẫn phải tương đối, đi qua runtime root, os.tmpdir() hay một giá trị cấu hình."
  causes_vi:
    - "Sao chép một đường dẫn tuyệt đối từ máy phát triển vào một script, template hay fixture"
    - "Một chuỗi gỡ lỗi hay ví dụ viết thẳng đường dẫn host thay vì biến môi trường hay đường tương đối"
  nextStep_vi: "Người giám sát thay đường đó bằng đường tương đối, runtime root, os.tmpdir() hay một cấu hình đã khai báo, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_DOC_NO_OWNER:
  title: "A document has no single ownership header"
  title_vi: "Một tài liệu không có đúng một dòng sở hữu"
  meaning_vi: "Một tệp docs/*.md không mở đầu bằng đúng một dòng sở hữu — \"Owner: <đường dẫn knowledge/ hoặc modules/ tồn tại>\" khi tài liệu giải thích một nguồn do máy sở hữu, hoặc \"Task: <một việc>\" với một tài liệu hướng dẫn — hoặc nó trùng một tài liệu khác: cùng một dòng Task, hoặc hai tiêu đề chung từ hai từ chủ đề trở lên trong khi ít nhất 30% câu của tài liệu ngắn hơn xuất hiện trong tài liệu kia. Một câu chuyện chỉ có một tài liệu; nguồn máy là luật và tài liệu chỉ đọc nó."
  causes_vi:
    - "Thêm một tài liệu mà quên dòng Owner:/Task: đầu tiên, hoặc Owner trỏ tới một đường dẫn không tồn tại hay ngoài knowledge/ và modules/"
    - "Tách một tài liệu thành hai mà không gộp nội dung trùng hoặc không đổi dòng Task của một trong hai"
  nextStep_vi: "Người giám sát thêm đúng một dòng sở hữu vào dòng đầu của tài liệu (một nguồn knowledge/ hoặc modules/ tồn tại, hoặc một Task duy nhất), hoặc gộp hai tài liệu trùng thành một rồi xóa tệp thừa, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_SYNTAX_INVALID:
  title: "Tracked JavaScript has invalid syntax"
  title_vi: "Tệp JavaScript được theo dõi có cú pháp không hợp lệ"
  meaning_vi: "Một tệp .mjs, .cjs hoặc .js được git theo dõi không thể được trình phân tích cú pháp JavaScript của TypeScript đọc. Luật áp dụng cả tests/ và nguồn packages/, trừ các gốc được sinh và cây đầu ra build của bên thứ ba. Một tệp không phân tích được không thể chạy tin cậy dù kiểm tra Node trong các thư mục runtime vẫn xanh."
  causes_vi:
    - "Biểu thức chính quy chứa xuống dòng thô, hoặc chuỗi hay template chưa đóng"
    - "Thiếu dấu ngoặc nhọn, ngoặc tròn hoặc ngoặc vuông đóng"
  nextStep_vi: "Người giám sát sửa cú pháp tại dòng được báo và chạy lại cổng runtime; không bỏ qua tệp hoặc thêm ngoại lệ."
  owner: supervisor
  kind: check-finding
RT_IDENTIFIER_UNDECLARED:
  title: "A runtime module reads a name nothing declares"
  title_vi: "Một module runtime đọc một tên mà không nơi nào khai báo"
  meaning_vi: "Một định danh trong module ES của runtime (scripts/, engine/ trừ gói yaml của bên thứ ba, ui/api/, packages/cli/bin và src) không khớp với khai báo, import, tham số hay biến toàn cục Node nào của các phạm vi bao quanh. Một re-export (export {x} from './y.mjs') không gắn x vào phạm vi cục bộ; require, module, exports và __dirname không phải biến toàn cục của module; biến toàn cục của trình duyệt chỉ hợp lệ trong hàm được truyền cho page.evaluate. Dòng đó sẽ ném ReferenceError khi chạy tới."
  causes_vi:
    - "Tách một hàm ra khỏi vòng lặp hay closure nhưng biến cũ không được truyền sang"
    - "Xóa import cùng với hàm dùng nó trong khi còn một chỗ khác đọc tên đó"
    - "Dùng tên đã re-export từ module khác như thể nó là tên cục bộ"
  nextStep_vi: "Người giám sát khai báo hoặc import tên đó, truyền nó qua tham số, hoặc xóa chỗ đọc; không thêm ngoại lệ hay che bằng typeof."
  owner: supervisor
  kind: check-finding
RT_REMOVED_VOCABULARY:
  title: "Instruction text spells a name the runtime refuses"
  title_vi: "Văn bản hướng dẫn viết một tên mà runtime từ chối"
  meaning_vi: "modules/kernel/removed-vocabulary.yaml là danh sách duy nhất các tên đã bị gỡ (khóa config, trường bias định tuyến, verb, cờ, mã, từ vựng), mỗi tên kèm thứ thay thế và bản phát hành đã gỡ nó. Một dòng trong skills/, docs/, README.md, CONTEXT.md, CONTRIBUTING.md, modules/ hoặc knowledge/ viết một tên trong danh sách mà không nằm trong CHANGELOG.md, không nằm trong chính danh sách và không mang dấu [removed-list] là dạy tác tử một cách viết mà runtime sẽ từ chối. Phát hiện nêu tệp:dòng, tên bị gỡ và cách viết thay thế."
  causes_vi:
    - "Một skill hay tài liệu còn dạy cách viết cũ sau khi runtime đổi"
    - "Gỡ hoặc đổi tên một khóa, cờ, verb, trường hay mã mà không thêm mục vào danh sách tên đã gỡ"
  nextStep_vi: "Người giám sát viết lại dòng theo cách thay thế mà phát hiện nêu; nếu dòng là danh sách các tên đã gỡ, đánh dấu [removed-list]; nếu tên mới bị gỡ, thêm mục vào modules/kernel/removed-vocabulary.yaml trong cùng commit."
  owner: supervisor
  kind: check-finding
RT_PROSE_COMMAND_UNKNOWN:
  title: "Instruction text shows a starci command the CLI catalog does not have"
  title_vi: "Văn bản hướng dẫn nêu một lệnh starci mà danh mục CLI không có"
  meaning_vi: "Một lệnh `starci <nhóm> <verb>` trong đoạn mã, khối mã hay ví dụ yaml của skills/, docs/, README.md, CONTEXT.md, CONTRIBUTING.md hoặc modules/ nêu một verb không có trong modules/cli/commands, hoặc một cờ --flag mà verb đó và các cờ chung không nhận. Tác tử làm theo sẽ nhận lời từ chối thay vì kết quả. Danh mục CLI là sự thật; phát hiện nêu tệp:dòng và lệnh sai."
  causes_vi:
    - "Verb hoặc cờ bị gỡ hay đổi tên nhưng văn bản hướng dẫn vẫn nêu cách viết cũ"
    - "Gõ sai tên verb hoặc cờ khi viết ví dụ"
  nextStep_vi: "Người giám sát viết lại lệnh theo danh mục CLI (starci <nhóm> <verb> --help); nếu lệnh đã bị gỡ, thêm mục vào modules/kernel/removed-vocabulary.yaml và sửa mọi chỗ còn dạy nó."
  owner: supervisor
  kind: check-finding
RT_DOCUMENTED_DEFAULT_DRIFT:
  title: "A documented default differs from the value the code reads"
  title_vi: "Một giá trị mặc định được ghi trong tài liệu khác với giá trị mà code đọc"
  meaning_vi: "Tài liệu nêu giá trị mặc định bằng cách dẫn khóa sở hữu nó (default <giá trị> = `<khóa>`); khóa là đường dẫn config.yaml (xác định qua hàm settings của bộ kiểm tra) hoặc <tệp yaml trong modules/>:<đường dẫn>. Giá trị ghi khác giá trị khóa đó thực sự cho, hoặc khóa không xác định được, là một phát hiện nêu tệp:dòng."
  causes_vi:
    - "Đổi mặc định trong code hoặc yaml mà không sửa số trong tài liệu"
    - "Gõ sai khóa dẫn hoặc dẫn tới khóa đã bị đổi tên"
  nextStep_vi: "Người giám sát sửa số trong tài liệu cho khớp giá trị của khóa, hoặc sửa khóa dẫn; không chép lại một số không dẫn khóa."
  owner: supervisor
  kind: check-finding
RT_ROLES_CONTRACT_DRIFT:
  title: "A role surface differs from the roles contract"
  title_vi: "Một bề mặt mô tả vai trò khác với hợp đồng vai trò"
  meaning_vi: "Hợp đồng vai trò (modules/kernel/roles.yaml) là nơi duy nhất mô tả một vai trò. Một bề mặt Markdown mang khối sinh từ hợp đồng, một bề mặt yaml hoặc script dẫn id của vai trò, và không bề mặt nào dạy điều mà danh sách contradicts của vai trò cấm."
  causes_vi:
    - "Sửa hợp đồng mà không sinh lại các khối"
    - "Viết lại một đoạn mô tả vai trò trong prompt hoặc tài liệu thay vì dẫn hợp đồng"
  nextStep_vi: "Người giám sát chạy starci runtime check --only roles-contract -- --write, hoặc sửa câu mâu thuẫn theo hợp đồng."
  owner: supervisor
  kind: check-finding
RT_EDGE_CASE_REGISTRY:
  title: "The edge-case registry is inconsistent"
  title_vi: "Sổ tình huống biên không nhất quán"
  meaning_vi: "Mỗi mục covered của modules/reconciler/edge-cases.yaml phải nêu một tệp spec và một quy tắc đều tồn tại; mỗi mục có họ, lần xảy ra thật và trạng thái hợp lệ."
  causes_vi:
    - "Mục covered thiếu spec hoặc quy tắc"
    - "Spec hoặc quy tắc được đổi tên mà sổ không đổi theo"
  nextStep_vi: "Người giám sát sửa mục cho đúng tệp, hoặc chuyển mục sang open kèm lý do."
  owner: supervisor
  kind: check-finding
OP_REPORTS_TO_KERNEL:
  title: "An Op addressed a role above its Kernel"
  title_vi: "Một Op gửi thẳng lên vai trò cao hơn Kernel của nó"
  meaning_vi: "Op chỉ báo cáo cho Kernel của mình. Lệnh nhắn Supervisor hoặc chủ sở hữu bị từ chối; báo cáo, câu hỏi và nguyên nhân bị chặn đều đi qua starci kernel report."
  causes_vi:
    - "Op chạy starci supervisor tell hoặc channel"
  nextStep_vi: "Op nộp báo cáo blocked hoặc ask bằng starci kernel report; Kernel trả lời hoặc nâng lên."
  owner: op-retry
  kind: blocker
DOCKER_PORT_POLICY:
  title: "Docker ownership or published-port policy was refused"
  title_vi: "Chính sách sở hữu Docker hoặc cổng công bố đã từ chối thao tác"
  meaning_vi: "Lệnh Docker đã nhắm tới container nivo-lite thuộc hệ thống khác, dùng tên dự án không hợp lệ, công bố cổng được bảo vệ, hoặc công bố cổng ngoài dải 41000-44999 dành cho dự án."
  causes_vi:
    - "Compose đặt container_name chứa nivo-lite hoặc công bố cổng 3000, 3100, 54320-54329, 55321-55327 hay một cổng ngoài dải dự án."
  nextStep_vi: "Đổi tên container sang tên thuộc dự án, lấy cổng trong dải 41000-44999 của dự án, rồi chạy lại lệnh starci docker; không sửa hay dừng container nivo-lite."
  owner: runtime-core
  kind: verb-refusal

admission-receipt-mismatch:
  title: "Admission receipt identity mismatch"
  title_vi: "Danh tính biên nhận admission không khớp"
  meaning_vi: "Biên nhận giữ chỗ không thuộc provider, model hoặc vai trò mà launcher đang tiêu thụ."
  causes_vi:
    - "Launcher truyền biên nhận của lần chọn hoặc vai trò khác."
  nextStep_vi: "Dừng khởi động và đối chiếu danh tính lần thử với biên nhận đã lưu."
  owner: "runtime-core"
  kind: "dispatch-refusal"

admitted-plan:
  title: "Eligible admission plan"
  title_vi: "Kế hoạch admission đủ điều kiện"
  meaning_vi: "Bộ chọn đã tìm được ứng viên hợp lệ theo chứng cứ hiện có; kế hoạch này chưa chứng minh giữ chỗ hoặc khởi động."
  causes_vi:
    - "Các điều kiện nhóm được phép, chất lượng, quota và độc lập đều thỏa mãn."
  nextStep_vi: "Tiếp tục giữ chỗ nguyên tử và kiểm tra lại khi launcher tiêu thụ biên nhận."
  owner: "runtime-core"
  kind: "check-status"

attempt-conflict:
  title: "Reservation attempt conflict"
  title_vi: "Lần thử giữ chỗ bị xung đột"
  meaning_vi: "Một mã lần thử đã có biên nhận với provider, account, model, vai trò hoặc phạm vi khác."
  causes_vi:
    - "Tái sử dụng mã lần thử nhưng thay đổi ý nghĩa của yêu cầu."
  nextStep_vi: "Giữ nguyên biên nhận cũ và sửa danh tính yêu cầu; không tạo lần thử khác để vượt chỗ đang giữ."
  owner: "runtime-core"
  kind: "dispatch-refusal"

exit-unproven:
  title: "Reservation exit is unproven"
  title_vi: "Chưa chứng minh lượt chạy đã kết thúc"
  meaning_vi: "Chứng cứ chưa xác nhận đúng tiến trình hoặc terminal của biên nhận đã kết thúc, hay yêu cầu khởi động chưa tạo hiệu ứng."
  causes_vi:
    - "Thiếu chứng cứ kết thúc hoặc chứng cứ thuộc danh tính khác."
  nextStep_vi: "Giữ chỗ và lấy chứng cứ đóng terminal cùng cây tiến trình, hoặc biên nhận host xác nhận không có hiệu ứng."
  owner: "supervisor"
  kind: "dispatch-refusal"

grant-ineligible:
  title: "Owner capacity grant is ineligible"
  title_vi: "Quyền cấp dung lượng không đủ điều kiện"
  meaning_vi: "Quyền cấp của owner không khớp vai trò và phạm vi hiện tại hoặc chưa được nguồn thẩm quyền xác nhận."
  causes_vi:
