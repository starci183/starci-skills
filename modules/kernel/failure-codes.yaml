  title: "Error declared outside its capability"
  title_vi: "Lỗi không nằm ở capability sở hữu"
  meaning_vi: "Một lớp lỗi nằm ngoài errors/<capability>.error.ts của capability sở hữu nó, kế thừa Error trần hay base đã bỏ thay vì DomainError, hoặc tệp errors/<capability>.error.ts không đúng hình dạng (một enum <C>ErrorCode, một bảng <C>_ERROR_KINDS kiểu Record<<C>ErrorCode, ErrorKind>, một lớp <C>Error rỗng); hoặc code ném giá trị không phải DomainError (new Error, exception của framework, chuỗi), hoặc domain ném lỗi của platform."
  causes_vi:
    - "Lớp lỗi đặt ở tệp service hay tệp khác thay vì <capability>/errors/<capability>.error.ts"
    - "Lớp lỗi kế thừa Error hoặc AbstractException thay vì DomainError"
    - "throw new Error(...), throw new NotFoundException(...) hoặc throw một chuỗi thoát ra khỏi capability"
    - "Giá trị enum không theo <CAPABILITY>_<WHAT>, bảng kind thiếu kiểu Record hoặc lớp lỗi có thân"
    - "Domain ném ConfigError hay lỗi khác của platform"
    - "Giá trị của enum <C>ErrorCode không phải chuỗi literal dạng <CAPABILITY>_<WHAT>, có hậu tố _ERROR hay _EXCEPTION, hoặc trùng với một mã ở nơi khác trong repo"
  nextStep_vi: "Chuyển lỗi về errors/<capability>.error.ts với đúng ba thành phần, kế thừa DomainError, dịch lỗi platform thành lỗi của capability; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_FEATURE_LAYOUT_INVALID:
  title: "Feature folder layout invalid"
  title_vi: "Bố cục thư mục feature sai"
  meaning_vi: "Tệp của feature đặt sai thư mục application hoặc transport so với vai trò của nó."
  causes_vi:
    - "Đặt vai trò giao vận trong application/ hoặc ngược lại"
    - "Thiếu tên giao thức dưới transport/"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_LOGGER_REQUIRED:
  title: "Catch swallows the failure"
  title_vi: "Catch nuốt lỗi"
  meaning_vi: "Một catch (hoặc .catch) rỗng, hoặc không ném lại, không gọi phương thức nào của Logger (từ platform/logging), cũng không trả outcome có kiểu mang cause, nên lỗi thật biến mất không để lại dấu vết; hoặc một lời gọi Logger đặt tên sự kiện bằng chuỗi dựng tại chỗ thay vì một thành viên enum trong <owner>.log-events.ts, hoặc dùng Logger của framework thay cho cổng Logger của platform/logging."
  causes_vi:
    - "catch {} rỗng"
    - "catch chỉ trả null, false hoặc undefined"
    - "catch chỉ gọi console hoặc một đối tượng không có kiểu Logger, vốn không phải logger port"
    - "logger.info(`Checkout ${id} failed`) thay vì logger.info(OrderLogEvent.CheckoutFailed, { id })"
    - "new Logger('X') của @nestjs/common"
  nextStep_vi: "Ném lại lỗi, ghi log bằng logger của platform/logging, hoặc trả outcome có kiểu mang cause; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MODULE_HANDLER_REGISTRATION:
  title: "Handler not registered exactly once"
  title_vi: "Handler chưa đăng ký đúng một lần"
  meaning_vi: "Một handler không được đăng ký trực tiếp đúng một lần trong module Nest."
  causes_vi:
    - "Quên đăng ký vào providers"
    - "Đăng ký ở nhiều module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_PROVIDER_REREGISTRATION:
  title: "Provider re-registered"
  title_vi: "Provider bị đăng ký lại"
  meaning_vi: "Một provider đã có nơi đăng ký lại bị đăng ký thêm ở module khác."
  causes_vi:
    - "Khai báo cùng provider ở hai module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_SHAPE:
  title: "Nest module shape invalid"
  title_vi: "Hình dạng module Nest sai"
  meaning_vi: "Một module vi phạm hình dạng chuẩn: @Global() ở bất kỳ đâu, isGlobal: true ngoài apps/<app>/src/app.module.ts, import module của owner khác vào @Module({ imports }), ConfigurableModuleBuilder không khai kiểu options, có forRoot, forFeature hay registerAsync thay vì chỉ static register, nhiều module trong một tệp, new một provider, hoặc biến let ở cấp module."
  causes_vi:
    - "@Global() trên bất kỳ module nào (kể cả trong spec)"
    - "isGlobal: true ở ngoài app.module.ts của app"
    - "Module của một capability khác bị import vào imports thay vì dùng qua Inject<Thing>()"
    - "new ConfigurableModuleBuilder() không có kiểu options"
    - "register không static, hoặc có forRoot, forFeature, registerAsync"
    - "new XService() hoặc let ở cấp module tạo trạng thái toàn cục"
    - "Feature có hai module trong một thư mục transport (một module cho mỗi thao tác), có module-definition, hoặc @Module ngoài `<f>.module.ts` và `<f>-<protocol>.module.ts`; app import module ứng dụng của feature hoặc module transport không thuộc loại app cho phép (api: graphql/http/websocket; worker: schedule/message; cli: cli)"
    - "Bộ máy đồ thị module: module đại diện của capability được đăng ký hai lần trong một app, thiếu isGlobal: true ở gốc app, hoặc bị module khác import"
    - "Module con có hơn một nơi import, hoặc vừa nằm ở gốc app vừa được module khác import"
    - "isGlobal: true xuất hiện ngoài gốc app apps/<app>/src/app.module.ts"
  nextStep_vi: "Bỏ @Global, để app đăng ký capability đúng một lần với isGlobal: true, dùng capability khác qua Inject<Thing>(), khai kiểu options, chỉ dùng static register, tách module, để container dựng provider; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_CONTRACT_FORM:
  title: "Public contract form invalid"
  title_vi: "Dạng hợp đồng công khai sai"
  meaning_vi: "Hợp đồng công khai của backend không được khai báo theo dạng được yêu cầu (ví dụ kiểu inline)."
  causes_vi:
    - "Viết kiểu ngay tại tham số thay vì khai báo tên riêng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_SURFACE:
  title: "Owner public surface violated"
  title_vi: "Bề mặt công khai của owner bị vi phạm"
  meaning_vi: "Một import chui vào tệp bên trong owner khác thay vì đi qua index.ts của owner, một import cùng owner lại đi vòng qua index.ts của chính nó, một index.ts lồng nhau (không nằm ở gốc owner), hoặc index.ts không chỉ gồm các dòng export { } / export type { } có tên (export *, khai báo, import, export default) hoặc export quá nhiều tên."
  causes_vi:
    - "Import theo đường dẫn sâu như @modules/domain/plan/plan.service"
    - "Import cùng owner theo ./index hoặc ../index thay vì tệp khai báo ký hiệu"
    - "index.ts nằm trong thư mục con của owner, ví dụ persistence/index.ts"
    - "index.ts dùng export * hoặc chứa khai báo, hoặc vượt số export cho phép"
  nextStep_vi: "Import owner khác qua index.ts của nó, import cùng owner bằng đường dẫn tương đối tới tệp khai báo, mỗi owner chỉ một index.ts ở gốc và liệt kê tường minh những gì owner cung cấp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_READONLY_BOUNDARY:
  title: "Readonly boundary violated"
  title_vi: "Vi phạm ranh giới chỉ-đọc"
  meaning_vi: "Thông điệp hoặc phụ thuộc được tiêm không được đánh dấu readonly hoặc có setter."
  causes_vi:
    - "Thiếu readonly trên trường"
    - "Có setter hay index signature"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_AUTHORITY:
  title: "Schema defined at runtime"
  title_vi: "Schema được định nghĩa lúc chạy"
  meaning_vi: "Một tệp để tiến trình đang chạy quyết định schema: một đối tượng tùy chọn của DataSource hoặc TypeORM không ghi literal synchronize: false, synchronize khác false, gọi dataSource.synchronize() hoặc dropDatabase(), có khóa migrationsRun (cấm dưới mọi dạng), gọi runMigrations() ngoài cli (lệnh migrate của apps/cli) và test world, dropSchema khác false, dựng schema bằng createSchemaBuilder()/build(), khóa synchronize trong tùy chọn của @Entity, hook onModuleInit/onApplicationBootstrap ghi dữ liệu qua EntityManager hoặc DataSource (seed chỉ chạy bằng một lệnh cli), chuỗi DDL (CREATE/ALTER/DROP TABLE, INDEX, TYPE, SCHEMA, EXTENSION, TRIGGER, FUNCTION, ADD/DROP CONSTRAINT...) ngoài persistence/migrations/, hoặc tìm entity và migration bằng glob. Schema chỉ đổi bằng migration do lệnh cli migrate chạy."
  causes_vi:
    - "new DataSource({ type: 'postgres' }) không ghi synchronize: false"
    - "synchronize: true, hoặc đọc từ biến môi trường"
    - "Chuỗi DDL trong .query ngoài migration"
    - "dropSchema: true, hoặc dataSource.createSchemaBuilder().build() lúc chạy"
    - "@Entity({ synchronize: false }): công tắc riêng cho từng entity"
    - "onModuleInit ghi dữ liệu bằng entityManager.save/insert/query INSERT: seed lúc khởi động ở mọi tiến trình"
    - "dataSource.runMigrations() gọi ngoài cli (lệnh migrate của apps/cli)"
    - "entities hoặc migrations khai bằng đường dẫn có ký tự *"
  nextStep_vi: "Viết một migration trong persistence/migrations/ của capability sở hữu bảng và liệt kê entity, migration tường minh; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SECRET_DEFAULT:
  title: "Literal default for a secret or URL"
  title_vi: "Giá trị mặc định cố định cho bí mật hoặc URL"
  meaning_vi: "Một giá trị kiểu Secret hoặc Url của platform/config có giá trị mặc định: đối số mặc định cho env.secret/url/host, toán tử ??, || hay ??= trên giá trị đó, hoặc chuỗi mặc định (\"\", localhost, 127.0.0.1, 0.0.0.0, http(s)://...) đưa vào hàm đọc trả về Secret hay Url. Thiếu biến thì app phải dừng khi boot, nêu tên khóa."
  causes_vi:
    - "env.secret(\"K\", \"dev\") hoặc env.url(\"K\", \"http://localhost\")"
    - "secret ?? new Secret(\"dev\") hoặc url || \"http://localhost:3000\""
    - "Hàm đọc trả về Secret hay Url được gọi với giá trị mặc định viết sẵn"
  nextStep_vi: "Bỏ giá trị mặc định, để phần kiểm tra cấu hình báo lỗi nêu tên khóa khi thiếu; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SOURCE_FORM:
  title: "Back-end source file breaks the naming or form canon"
  title_vi: "Tệp nguồn BE sai quy ước tên hoặc hình thức"
  meaning_vi: "Tên tệp phải là kebab-case với hậu tố vai trò trong danh sách đóng của slots.yaml; chỉ export có tên (không export default); mọi export và thành viên công khai có JSDoc tiếng Anh; không emoji, và không có chữ tiếng Việt trong định danh, chuỗi ký tự, chú thích hay tên test ngoài catalog messages/ và slot fixture i18n; mã production không khai báo lớp, hàm hay hằng export có từ Mock, Fake hoặc Stub trong tên (đồ giả nằm trong spec hoặc src/tests; driver ngoại tuyến là adapter điều khiển bằng options, đặt tên theo việc nó làm)."
  causes_vi:
    - "class MockExpertAgentService trong mã production thay vì adapter điều khiển bằng options"
    - "Tệp dùng hậu tố bị cấm (use-case, repository, store, util, helper, types, constants)"
    - "Lớp export không kết thúc bằng hậu tố vai trò của tệp và cũng không kết thúc bằng tên port (interface trong *.port.ts hoặc *.contracts.ts) mà nó implements"
    - "Interface trong tệp *.input.ts, *.request.ts, *.response.ts, *.type.ts, *.args.ts hoặc *.rows.ts không kết thúc bằng Input, Request, Response, Type, Args hoặc Row"
    - "@Args dùng tên khác \"input\""
    - "Export default"
    - "Thiếu JSDoc trên export"
    - "Chú thích tiếng Việt trong mã"
  nextStep_vi: "Đổi tên tệp theo vai trò trong danh sách đóng, chuyển kiểu vào <tên>.contracts.ts, thêm JSDoc tiếng Anh và bỏ export default. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SPEC_QUALITY:
  title: "Spec reads source, or an e2e breaks its flow shape"
  title_vi: "Spec đọc mã nguồn hoặc e2e phá dạng luồng"
  meaning_vi: "Một spec đọc mã nguồn của repo bằng fs để kiểm tra chữ, một spec chỉ khẳng định lời gọi thay vì kết quả, hoặc một e2e đi vòng qua transport, ngủ theo thời lượng, rẽ nhánh trong bước, tự dựng module, gọi nhà cung cấp mô hình hay không đọc lại trạng thái đã lưu. Ép kiểu (as, x!) trong spec do các luật mượn của typescript-eslint chặn, cùng mã BE_TYPE_ESCAPE. Một spec của bất kỳ tầng nào bỏ qua hoặc đánh dấu test (skip, skipIf, runIf, todo, only, xit, xdescribe, xtest) hay chọn runner theo điều kiện cũng bị chặn; việc bỏ qua duy nhất là của contract helper trong world khi thiếu cấu hình sandbox."
  causes_vi:
    - "readFileSync hay readdirSync trên mã nguồn hoặc __dirname trong spec"
    - "Spec chỉ có toHaveBeenCalled*, không khẳng định kết quả hay trạng thái"
    - "`it.skip`, `describe.skip`, `xit`, `it.todo`, `.skipIf`/`.runIf` hoặc `(cond ? describe : describe.skip)` trong spec; hãy viết test thật hoặc xóa nó, còn việc bỏ qua khi thiếu sandbox nằm trong contract helper của world (`sandbox.describe(...)`)"
    - "e2e gọi CommandBus, QueryBus hay handler trực tiếp; dùng sleep thay cho waitFor; tự gọi Test.createTestingModule; import SDK của nhà cung cấp mô hình; không đọc lại dòng đã lưu qua EntityManager"
    - "Spec đơn vị của service khẳng định `expect.any(String)`, `expect.any(Number)` hoặc `expect.any(Date)` cho giá trị service tự sinh; service nhận bộ sinh id và đồng hồ qua token, spec cấp `fakeIds()` và `new FakeClock(...)` từ @starci/jest-preset rồi khẳng định đúng giá trị"
    - "Spec đơn vị của service có providers khác với phụ thuộc constructor: thừa nhà cung cấp, thiếu nhà cung cấp, service không đứng đầu, token không suy ra được hoặc nhà cung cấp không phải lớp hay { provide, useValue }"
  nextStep_vi: "Chuyển luật kiến trúc sang lint hoặc bộ kiểm tra; khẳng định kết quả hoặc trạng thái; e2e vào bằng transport thật, chờ bằng waitFor và dựng thế giới ở src/tests/e2e/setup. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TEST_BUILDER_HOME:
  title: "A test data builder is outside the builders folder"
  title_vi: "Builder dữ liệu test nằm ngoài thư mục builders"
  meaning_vi: "Mọi hàm dựng dữ liệu test (hàm được export và tạo dòng trong cơ sở dữ liệu qua EntityManager, DataSource hoặc QueryRunner) chỉ được nằm trong src/tests/fixtures/builders/<khu>.builder.ts; SQL đi kèm nằm trong <khu>.sql.ts cạnh nó. Một mô-đun khác của cây test làm việc này là builder đặt sai chỗ, dù tên nó là gì."
  causes_vi:
    - "Mô-đun trong src/tests/world hoặc src/tests/fixtures (ngoài builders/) export hàm gọi save, insert hoặc upsert, hoặc chạy INSERT, qua EntityManager"
    - "Hàm seed hoặc anOrder viết ngay cạnh spec thay vì trong builders/"
    - "Tên tệp *.repository.ts, *.factory.ts hoặc *.fixture.ts trong src/tests (bị BE_SOURCE_FORM chặn cùng lúc)"
  nextStep_vi: "Chuyển hàm sang src/tests/fixtures/builders/<khu>.builder.ts, chuyển chuỗi SQL sang <khu>.sql.ts cạnh nó, sửa import trong spec. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_TEST_ROW_BY_BUILDER:
  title: "A spec hand-builds rows instead of using a builder"
  title_vi: "Spec tự dựng dòng dữ liệu thay vì dùng builder"
  meaning_vi: "Spec đơn vị, integration hoặc e2e không tự chèn hay ghi dòng: không có INSERT/UPDATE/DELETE thô, không gọi save, insert, upsert, update, delete, remove trên EntityManager, DataSource hoặc QueryRunner, và không dựng cùng một entity bằng object literal nhiều hơn một lần. Dòng dữ liệu đến từ builder của khu vực đó."
  causes_vi:
    - "em.query với chuỗi INSERT INTO ... hoặc chuỗi INSERT/UPDATE/DELETE được truyền vào query trong spec"
    - "em.save({...}), em.insert(...) hoặc upsert trong spec"
    - "Cùng một entity được viết thành object literal từ lần thứ hai trở đi trong một spec"
  nextStep_vi: "Thêm hoặc mở rộng builder của khu vực (orderRow(overrides) cho spec đơn vị, orderBuilder(db).pending().build(overrides) cho integration và e2e) rồi gọi nó trong spec. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TEST_CONSTRAINTS_ON:
  title: "A test switches database constraints off"
  title_vi: "Test tắt hoặc gỡ ràng buộc cơ sở dữ liệu"
