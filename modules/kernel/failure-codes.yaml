  meaning_vi: "Đây là loại câu hỏi thuộc quyền quyết định của chủ dự án."
  causes_vi:
    - "Thợ hỏi một lựa chọn hướng đi mà quy tắc không cho tự quyết"
  nextStep_vi: "Ở chế độ tự lái, câu hỏi này được để dành đến cuối luồng; chủ dự án trả lời thì việc mới đi tiếp."
