  causes_vi:
    - "Vi phạm luật R50: Đọc dữ liệu ở client bằng SWR gọi client của app (thư mục `hooks/`); đọc dữ liệu cho route bằng server reader `modules/api/<domain>/read-*.ts`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_OUTCOME_KIND_UNHANDLED:
