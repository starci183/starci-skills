ACTIVE_NAV_CONFLICT:
  title: "Active navigation contradicts route"
  title_vi: "Mục điều hướng đang chọn mâu thuẫn với đường dẫn"
  meaning_vi: "Trang khai báo mục điều hướng đang sáng khác với mục mà đường dẫn của nó thực sự làm sáng."
