  title_vi: "Feature hoặc module năng lực không được lắp vào ứng dụng nào"
  meaning_vi: "Một feature backend, hoặc một module domain, integrations hay platform, không có đường import chạy thật (không tính import chỉ-kiểu) từ tệp gốc của bất kỳ ứng dụng nào (app.module.ts hoặc main.ts), kể cả qua các module khác đã được lắp. Không tiến trình nào nạp nó nên code này không bao giờ được phục vụ."
