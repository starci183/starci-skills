  nextStep_vi: "Tạo migration mới bằng the Supabase CLI new-migration command, không sửa/đổi tên/xoá migration đã lên base; nếu cần đổi nội dung, viết migration mới."
  owner: op-retry
  kind: check-finding

DB_RLS_REQUIRED:
  title: "Every `create table` in an exposed schema is followed by `enable row level security` in the same migration"
  title_vi: "Bảng trong schema public thiếu RLS"
  meaning_vi: "`<path>` tạo bảng trong schema exposed (`public` và `[api] schemas` của config.toml) mà không có `alter table ... enable row level security` ngay trong cùng migration; bảng khai báo `forceRls` cần cả `force row level security`."
