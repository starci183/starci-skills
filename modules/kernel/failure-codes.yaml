FE_ERROR_BOUNDARY_MISSING:
  title: "Next app lacks a required error or loading boundary"
  title_vi: "Ứng dụng Next thiếu trang lỗi hoặc trang đang tải bắt buộc"
  meaning_vi: "Mỗi ứng dụng Next phải có global-error.tsx, error.tsx, not-found.tsx và loading.tsx trong src/app theo bảng kê HFS. Thiếu chúng thì khi trang gặp lỗi, không tìm thấy hoặc đang tải, người dùng sẽ thấy màn hình mặc định của khung phần mềm hoặc màn hình trắng thay vì giao diện của sản phẩm."
