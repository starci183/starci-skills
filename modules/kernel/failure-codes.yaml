  title_vi: "Entity ORM lộ ra hợp đồng"
  meaning_vi: "Một kiểu có khai báo @Entity của ORM với nguồn gốc từ typeorm nằm trong tầm với của một chữ ký transport, hàm execute của handler, hợp đồng (*.contracts.ts) hoặc thông điệp (*.command.ts, *.query.ts), trực tiếp hay qua tham số kiểu và thuộc tính, nên cấu trúc bảng bị lộ ra ngoài capability; hoặc một tệp entity nhập @nestjs/graphql hay class-validator."
