workflow-worktree-missing:
  title: "The op's workflow has no worktree"
  title_vi: "Workflow của op không có cây làm việc"
  meaning_vi: "Mọi workflow trong một kho git làm việc trong cây làm việc riêng do Orca tạo khi Kernel khởi động. Workflow này chưa có cây trong sổ đăng ký nên op không được giao: chạy trên kho chính thì không có gì chốt lại."
  causes_vi:
    - "Kernel khởi động trước khi có cây làm việc của workflow"
    - "Cây làm việc đã bị gỡ trong khi workflow còn chạy"
  nextStep_vi: "Job vẫn xếp hàng. Khởi động lại Kernel của workflow (start-workflow tạo cây qua Orca) rồi giao lại."
  owner: runtime-core
  kind: dispatch-refusal
worktree-add-failed:
  title: "Adding worktree failed"
  title_vi: "Tạo worktree thất bại"
  meaning_vi: "Lệnh git worktree add báo lỗi."
  causes_vi:
    - "Nhánh đang dùng ở nơi khác"
    - "Lỗi đĩa hoặc git"
  nextStep_vi: "Không có worktree; xem chi tiết lỗi git rồi thử lại."
  owner: runtime-core
  kind: runtime-fault
worktree-cap:
  title: "Repository is at its worktree cap"
  title_vi: "Repo đã đủ số cây làm việc cho phép"
  meaning_vi: "Repo sản phẩm đang có đủ số worktree sống theo giới hạn (worktrees.capPerRepo), nên op mới chưa được giao."
  causes_vi:
    - "Nhiều op của repo đang chạy cùng lúc"
    - "Worktree của op đã xong chưa được dọn"
  nextStep_vi: "Job vẫn xếp hàng, không tốn lượt thử. Khi một op chốt xong hoặc GC dọn worktree, lượt giao sau sẽ chạy."
  owner: runtime-core
  kind: dispatch-refusal
worktree-path-occupied:
  title: "Worktree path occupied"
  title_vi: "Thư mục worktree bị chiếm"
  meaning_vi: "Đường dẫn worktree đã có nội dung không phải worktree đã đăng ký."
  causes_vi:
    - "Thư mục còn sót file"
  nextStep_vi: "Việc tạo dừng; dọn thư mục thủ công rồi tạo lại."
  owner: runtime-core
  kind: runtime-fault
worktree-registry-unavailable:
  title: "Worktree registry unavailable"
  title_vi: "Không ghi được sổ đăng ký cây làm việc"
  meaning_vi: "Runtime không ghi được worktree vào machine.sqlite nên không tạo worktree cho op (không có sổ thì không đếm giới hạn và không dọn được)."
  causes_vi:
    - "machine.sqlite đang bận hoặc bị khoá"
  nextStep_vi: "Job vẫn xếp hàng chờ. Lượt giao sau thử lại; nếu lặp lại, kiểm tra machine.sqlite."
  owner: runtime-core
  kind: dispatch-refusal
zip-corrupt:
  title: "Zip archive corrupt"
  title_vi: "File zip bị hỏng"
  meaning_vi: "File zip không có bản ghi cuối danh mục nên không đọc được."
  causes_vi:
    - "File tải dở hoặc bị cắt"
  nextStep_vi: "Việc đọc dừng; cần nộp lại file zip hợp lệ."
  owner: op-retry
  kind: input-invalid
zip-name:
  title: "Zip entry name unsafe"
  title_vi: "Tên mục trong zip không an toàn"
  meaning_vi: "Một mục trong zip có tên rỗng, bắt đầu bằng / hoặc chứa .."
  causes_vi:
    - "Zip tạo từ nguồn không tin cậy"
  nextStep_vi: "Việc tạo hoặc đọc dừng; đổi tên mục cho an toàn."
  owner: op-retry
  kind: input-invalid
supervisor-ruling:
  title: "Supervisor ruling delivered to Kernel"
  title_vi: "Phán quyết của Supervisor gửi cho Kernel"
  meaning_vi: "Supervisor đã đưa ra một phán quyết cần Kernel của workflow đọc và làm theo."
  causes_vi:
    - "Supervisor xử lý một sự cố hoặc yêu cầu cầu nối giữa các workflow"
  nextStep_vi: "Kernel đọc phán quyết rồi thực hiện theo và đóng mục này."
  owner: op-retry
  kind: blocker
worker-wedged:
  title: "Worker wedged on one command"
  title_vi: "Worker kẹt ở một lệnh"
  meaning_vi: "Lượt làm việc của worker chạy quá ngưỡng trên một lệnh mà không in gì, nên lệnh nhắc bị từ chối."
  causes_vi:
    - "Lệnh treo không kết thúc"
    - "Agent bị đứng giữa lượt"
  nextStep_vi: "Không gõ gì vào terminal; xử lý như worker chết (đóng agent rồi khởi động lại worker)."
  owner: op-retry
  kind: verb-refusal
"blocker:shared-change":
  title: "Blocked: shared record must change"
  title_vi: "Bị chặn: cần đổi một bản ghi dùng chung"
  meaning_vi: "Op không thể tiếp tục vì việc cần một thay đổi ở bản ghi mà op khác hoặc tầng khác sở hữu."
  causes_vi:
    - "Bản ghi dùng chung (hợp đồng, phạm vi) nằm ngoài các đường dẫn op được phép ghi"
    - "Op khác đang giữ quyền ghi bản ghi đó"
  nextStep_vi: "Kernel giao thay đổi đó cho op sở hữu bản ghi rồi chạy lại op bị chặn."
