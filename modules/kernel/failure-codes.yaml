    - "Một bước hướng dẫn dọn dẹp bằng rm -rf hoặc Remove-Item -Recurse thay vì safeRemove"
    - "Một bước giao việc cho agent khác bằng codex exec, claude -p hoặc orca terminal create thay vì worker-start"
