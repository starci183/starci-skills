    - "Thêm schema work mới bằng cách sao chép nguyên một schema cũ"
  nextStep_vi: "Đưa khối vào $defs của modules/schemas/work-common.schema.yaml và thay mỗi bản lặp bằng {$ref: 'urn:work:common:1#/$defs/<tên>'}, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_OP_FIELD_NOT_COMMON:
