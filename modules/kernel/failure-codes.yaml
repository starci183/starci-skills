  kind: check-finding

FE_CLIENT_SERVER_IMPORT:
  title: "A client component imports nothing server-only"
  title_vi: "Client component nhập mã chỉ chạy ở server"
  meaning_vi: "Tệp `\"use client\"` ở `<file>` nhập `<what>` (`server-only`, `next/headers`, module Node hoặc server reader), thứ chỉ tồn tại ở server."
  causes_vi:
    - "Vi phạm luật R55: Client component không nhập `server-only`, `next/headers`, module Node hay `modules/api/**/read-*`; đọc dữ liệu ở server component rồi truyền xuống bằng props, hoặc gọi client của app qua SWR."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_SERVER_ONLY_MARK:
  title: "A module that uses the server starts with import server-only"
  title_vi: "Module dùng API server không có dấu server-only"
  meaning_vi: "Module `<file>` nhập `<what>` (`next/headers`, `next/server`, `next-intl/server`, module Node hoặc một module đã là server-only) nhưng không mở đầu bằng `import \"server-only\"`, nên không gì chặn client component nhập nó trực tiếp hoặc qua hook."
  causes_vi:
    - "Vi phạm luật R55: Module dùng API chỉ có ở server mở đầu bằng `import \"server-only\"` (tệp route `page`/`layout`/`route`/`proxy` là server component sẵn, không cần)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_STORAGE_OUTSIDE_MODULES:
  title: "Web storage only inside modules"
  title_vi: "Dùng localStorage/sessionStorage ngoài modules/"
  meaning_vi: "`<file>` đọc hoặc ghi `localStorage`/`sessionStorage` ngoài `modules/`. Storage không tồn tại ở server và ném lỗi khi đầy hạn mức, nên render server và hydrate lệch nhau."
  causes_vi:
    - "Vi phạm luật R55: Chỉ `modules/**` được chạm web storage, sau một hook hoặc module có bảo vệ (`typeof window`, try/catch); block gọi hook đó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_DANGEROUS_HTML:
  title: "dangerouslySetInnerHTML only on script"
  title_vi: "dangerouslySetInnerHTML trên phần tử hiển thị"
  meaning_vi: "`<tag>` ở `<file>` dùng `dangerouslySetInnerHTML`: chuỗi bất kỳ (của người dùng, nhà cung cấp, catalog) trở thành mã HTML chạy được."
  causes_vi:
    - "Vi phạm luật R55: Chỉ được `dangerouslySetInnerHTML` trên `<script>` mang JSON-LD hoặc mã khởi tạo theme từ hằng số do app viết; nội dung khác render thành phần tử."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_ROUTE_HARDCODED:
  title: "A route is built by modules/routes"
  title_vi: "Đường dẫn route viết tay"
  meaning_vi: "`<path>` ở `<file>` là route viết thẳng ở nơi gọi. Route đổi chỗ thì mọi bản sao trỏ vào 404 mà không kiểm tra kiểu nào bắt được."
  causes_vi:
    - "Vi phạm luật R57: Mọi href và lời gọi điều hướng (`router.push`, `redirect`) dùng hàm dựng href của `modules/routes`, không viết chuỗi đường dẫn ở nơi gọi."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
