  meaning_vi: "Spec của service không dựng đối tượng bằng Test.createTestingModule, tự new service, hoặc dùng jest.mock, overrideProvider, Date.now() hay process.env thay cho bộ đôi của @starci/jest-preset."
  causes_vi:
    - "Spec tự new service thay vì lấy từ testing module"
    - "Spec dùng jest.mock thay cho mock<T>() của bộ công cụ"
  nextStep_vi: "Việc chốt done bị từ chối; op chốt failed nêu các spec sai chuẩn để một test.author viết lại theo knowledge/patterns/be/test.yaml."
  owner: op-retry
  kind: settle-reason

op-lint-proof-missing:
  title: "No hfs lint report is attached"
  title_vi: "Chưa đính kèm báo cáo hfs lint"
  meaning_vi: "Op bảo mật hoặc giao diện không đính kèm lint.json (schema starci/lint@1) do hfs lint --format json in ra, nên runtime không chấm được các luật canon."
  causes_vi:
    - "Op chưa chạy hfs lint ở gốc app"
    - "Tệp lint.json không được đính kèm vào api report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy hfs lint --format json ở gốc app, lưu lint.json và đính kèm khi nộp."
  owner: op-retry
  kind: settle-reason

op-lint-tool-failed:
  title: "hfs lint could not run"
  title_vi: "hfs lint không chạy được"
  meaning_vi: "Báo cáo lint có errors: ESLint, stylelint hoặc kiểm tra app không chạy được, nên mã chưa được chấm. Không chạy được không bao giờ là đạt."
  causes_vi:
    - "Thiếu canon hoặc gói lint trong node_modules của app"
    - "hfs.json của app không đọc được"
  nextStep_vi: "Việc chốt bị từ chối; op sửa nguyên nhân môi trường rồi chạy lại hfs lint, hoặc chốt blocked với lỗi đó."
  owner: op-retry
  kind: settle-reason

op-lint-findings:
  title: "hfs lint reports findings under an interface verdict"
  title_vi: "hfs lint báo lỗi mà op giao diện vẫn chốt done"
  meaning_vi: "Báo cáo lint của interface.audit còn lỗi dưới fe/, hoặc báo cáo lint của interface.draw hay interface.asset còn lỗi trên các tệp op đã tạo (canon FE, stylelint, ngữ pháp thương hiệu, kiểm tra app); op không thể chốt done khi các lỗi đó còn."
  causes_vi:
    - "Mã giao diện vi phạm canon FE hoặc stylelint"
    - "Tệp vẽ hoặc tài sản mới sai ngữ pháp thương hiệu"
  nextStep_vi: "Việc chốt done bị từ chối; op sửa phần mình tạo ra rồi chạy lại lint, hoặc chốt failed nêu từng lỗi theo luật để op sở hữu sửa."
  owner: op-retry
  kind: settle-reason

op-security-findings-missing:
  title: "The security verdict carries no typed findings"
  title_vi: "Kết luận bảo mật không kèm danh sách lỗi có kiểu"
  meaning_vi: "security.verify đính kèm lint.json nhưng không đính kèm security-findings.json (schema starci/security-findings@1) liệt kê từng lỗi theo luật; danh sách rỗng khi không có lỗi."
  causes_vi:
    - "Op chỉ viết kết luận dạng văn bản"
    - "Tệp security-findings.json không được đính kèm vào api report"
  nextStep_vi: "Việc chốt bị từ chối; op ghi security-findings.json với từng lỗi (rule, code, path, line, severity, reachability) rồi nộp lại."
  owner: op-retry
  kind: settle-reason

op-security-finding-unreported:
  title: "The security verdict drops a canon finding"
  title_vi: "Kết luận bảo mật bỏ sót lỗi do canon báo"
  meaning_vi: "hfs lint báo lỗi thuộc luật bảo mật (R41, R42, R44, R49, R71, R90, R107) mà security-findings.json không mang theo đúng đường dẫn và luật; kết luận có thể kèm lỗi nhưng không được bỏ sót."
  causes_vi:
    - "Op lọc bớt lỗi canon khi viết kết luận"
    - "Op chạy lint trên phạm vi khác với phạm vi báo cáo"
  nextStep_vi: "Việc chốt bị từ chối; op thêm mọi lỗi bảo mật của lint.json vào security-findings.json theo luật rồi nộp lại."
  owner: op-retry
  kind: settle-reason

op-review-defects-missing:
  title: "The review classifies no defects"
  title_vi: "Bản review chưa phân loại lỗi"
  meaning_vi: "review.verify không đính kèm review-defects.json (schema starci/review-defects@1) liệt kê mọi lỗi tìm thấy kèm loại business hay non-business; danh sách rỗng khi không có lỗi."
  causes_vi:
    - "Op chỉ viết kết luận dạng văn bản"
    - "Tệp review-defects.json không được đính kèm vào api report"
  nextStep_vi: "Việc chốt bị từ chối; op ghi review-defects.json với từng lỗi, loại và check đã bắt được (hoặc missingCheck) rồi nộp lại."
  owner: op-retry
  kind: settle-reason

op-review-defect-unclassified:
  title: "A review defect is not classified"
  title_vi: "Có lỗi review chưa được phân loại"
  meaning_vi: "Ít nhất một lỗi trong review-defects.json không mang class business hoặc non-business."
  causes_vi:
    - "Op bỏ trống class của lỗi"
    - "Op dùng loại khác hai loại đã định"
  nextStep_vi: "Việc chốt bị từ chối; op phân loại từng lỗi là business hoặc non-business rồi nộp lại."
  owner: op-retry
  kind: settle-reason

op-review-missing-check-unrecorded:
  title: "An uncaught non-business defect records no missing check"
  title_vi: "Lỗi non-business không check nào bắt mà chưa ghi check còn thiếu"
  meaning_vi: "Theo luật của chủ sở hữu, lỗi non-business mà không check nào bắt được phải ghi missingCheck cho .claude (check lẽ ra phải bắt nó); review-defects.json có lỗi như vậy mà thiếu caughtBy lẫn missingCheck."
  causes_vi:
    - "Op ghi lỗi mà không xét check nào lẽ ra phải bắt"
  nextStep_vi: "Việc chốt bị từ chối; op ghi missingCheck.check (và luật hoặc chi tiết) cho từng lỗi đó rồi nộp lại, để .claude bổ sung check."
  owner: op-retry
  kind: settle-reason

op-release-proof-missing:
  title: "No release proof is attached"
  title_vi: "Chưa đính kèm bằng chứng phát hành"
  meaning_vi: "release.deliver publish hoặc deploy không đính kèm release-proof.json (schema starci/release-proof@1) do scripts/checks/release-proof.mjs in ra."
  causes_vi:
    - "Op phát hành mà không chạy release-proof.mjs"
    - "Tệp release-proof.json không được đính kèm vào api report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy node scripts/checks/release-proof.mjs --repo <repo> --base <đầu dải phát hành>^ --out release-proof.json và đính kèm khi nộp."
  owner: op-retry
  kind: settle-reason

op-release-step-skipped:
  title: "A release step was skipped"
  title_vi: "Một bước phát hành bị bỏ qua"
  meaning_vi: "Bằng chứng phát hành thiếu một bước bắt buộc (app-installs, canon-pins, merge-guard, check) hoặc có bước bị skip, như spec scaffold in SKIPPED vì không có bản cài đặt."
  causes_vi:
    - "Spec scaffold chạy mà không có bản cài từ npm registry"
    - "Op chỉnh tay release-proof.json bỏ bớt bước"
  nextStep_vi: "Việc chốt bị từ chối; op chạy lại release-proof.mjs đầy đủ; một bước không chạy được thì chốt blocked, không bao giờ done."
  owner: op-retry
  kind: settle-reason

op-release-step-red:
  title: "A release step is red"
  title_vi: "Một bước phát hành đang đỏ"
  meaning_vi: "Bằng chứng phát hành có bước không đạt: cài mới, lint, typecheck hay khởi động api thất bại, canon pins hoặc digest nội dung canon lệch, merge guard thấy merge làm mất thay đổi của main, hoặc npm run check đỏ."
  causes_vi:
    - "Gói đã publish không khớp canon pin"
    - "Một merge trong dải phát hành giữ bản của lane thay cho main"
  nextStep_vi: "Việc chốt bị từ chối; op chốt failed nêu bước đỏ để op sở hữu sửa; không phát hành khi bằng chứng còn đỏ."
  owner: op-retry
  kind: settle-reason

GATE_BASE_UNKNOWN:
  title: "The gate has no base to compare with"
  title_vi: "Cổng kiểm tra không có commit gốc để so sánh"
  meaning_vi: "gate.mjs không tìm được commit gốc: --base không phải commit, hoặc nhánh không có upstream, main hay master để lấy merge-base."
  causes_vi:
    - "Truyền --base sai hoặc commit đó chưa được fetch"
    - "Worktree không có nhánh main/master và không có upstream"
  nextStep_vi: "Op truyền --base <commit gốc của op> rồi chạy lại cổng; cổng thiếu gốc là exit 2, không bao giờ là đạt."
  owner: op-retry
  kind: check-finding

GATE_NOT_GIT:
  title: "The gate root is not a git checkout"
  title_vi: "Thư mục chạy cổng không phải kho git"
  meaning_vi: "gate.mjs chỉ so sánh được với commit gốc khi --root nằm trong một kho git; thư mục đã cho không phải."
  causes_vi:
    - "--root trỏ sai thư mục"
    - "Worktree của op đã bị xóa"
  nextStep_vi: "Op chạy lại cổng với --root là worktree của app."
  owner: op-retry
  kind: check-finding

GATE_MERGE_UNREADABLE:
  title: "The merge guard could not recompute a merge"
  title_vi: "Chốt chặn merge không tính lại được một commit merge"
  meaning_vi: "gate.mjs tính lại mỗi commit merge trên nhánh bằng git merge-tree để xem thay đổi của main có bị bỏ không; commit này không đọc được (thiếu merge-base hoặc git merge-tree lỗi), nên cổng là exit 2."
  causes_vi:
    - "Hai cha của commit merge không có merge-base chung"
    - "Bản git quá cũ, không có git merge-tree --write-tree"
  nextStep_vi: "Sửa môi trường git (git 2.38 trở lên) hoặc làm lại nhánh không có commit merge đó, rồi chạy lại cổng; cổng không đọc được merge không bao giờ là đạt."
  owner: op-retry
  kind: check-finding

GATE_TOOL_FAILED:
  title: "The lint gate could not run a tool"
  title_vi: "Cổng lint không chạy được một công cụ"
  meaning_vi: "Phần lint của gate.mjs (hfs lint --changed so với commit gốc) mà canon parity chạy cho một slice báo exit 2: một công cụ không chạy được, nên không đo được slice. Đây là lỗi công cụ, không phải lỗi đỏ của slice."
  causes_vi:
    - "hfs lint không in ra báo cáo starci/lint@1"
    - "Không đo được lint ở commit gốc"
  nextStep_vi: "Settler chuyển slice cho Kernel dưới dạng checker không dùng được; sửa môi trường công cụ rồi đo lại."
  owner: runtime-core
  kind: check-finding

STACKS_QUALITY_GATE_DRIFT:
  title: "Sonar quality gate name differs from the standard"
  title_vi: "Tên cổng chất lượng Sonar khác chuẩn chung"
  meaning_vi: "Khai báo services.sonar.qualityGate của repository không phải cổng chung starci-new-code (ngưỡng nằm ở knowledge/sonar-gate.yaml, không viết lại trong từng repository)."
  causes_vi:
    - "Khai báo Sonar chưa có dòng qualityGate"
    - "Repository tự đặt tên cổng riêng"
  nextStep_vi: "Từ chối nếu Sonar được khai báo trong chính repository, nghi ngờ nếu khai báo đi qua nguồn khác; ghi qualityGate: starci-new-code vào khối services.sonar."
  owner: other-op:workspace.manage
  kind: check-finding

BE_REQUIRED_MODULE_MISSING:
  title: "Required backend module, app or feature file is missing"
  title_vi: "Thiếu tệp hoặc thư mục bắt buộc của một phần backend"
  meaning_vi: "Bảng kê HFS bắt buộc mỗi ứng dụng, tính năng, module miền, tích hợp và module nền tảng (cấu hình, ghi nhật ký, lỗi, kiểu nguyên thuỷ) phải có một số tệp hoặc thư mục cố định, ví dụ index.ts, tệp .module.ts hay thư mục application/. Ở đây một mục như vậy không tồn tại, nên phần đó chưa đúng khuôn và các bộ kiểm tra khác không thể tin vào nó."
  causes_vi:
    - "Tạo module hoặc tính năng mới nhưng quên tệp cửa vào index.ts hoặc tệp .module.ts"
    - "Module nền tảng bắt buộc (config, logging, errors, primitives) chưa được tạo hoặc đặt tên khác"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tạo tệp hoặc thư mục còn thiếu đúng theo bảng kê; nếu tên hiện có là do thiết kế khác thì đó là việc đổi bảng kê, do người giám sát quyết định."
  owner: op-retry
  kind: check-finding

FE_HREF_RESOLVES:
  title: "Link points to a route that does not exist"
  title_vi: "Liên kết trỏ tới đường dẫn không tồn tại"
  meaning_vi: "Một liên kết viết thẳng trong code (href, redirect hoặc router.push) trỏ tới đường dẫn mà không tệp page.tsx hay route.ts nào của ứng dụng phục vụ. Người dùng bấm vào sẽ gặp trang 404."
  causes_vi:
    - "Gõ sai đường dẫn hoặc đổi tên route mà quên sửa liên kết"
    - "Route đã bị xoá hoặc chưa được tạo"
    - "Thiếu một tham số động trong đường dẫn so với cấu trúc thư mục route"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa liên kết cho khớp route thật hoặc tạo route còn thiếu; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_TIER_DIRECTION:
  title: "Frontend import against the tier direction"
  title_vi: "Frontend import ngược chiều tầng"
  meaning_vi: "Một tệp frontend import từ tầng mà bảng kê HFS không cho phép: route chỉ nhìn xuống feature, feature chỉ nhìn xuống components, hooks và modules, hai feature không bao giờ import nhau, và một lớp component chỉ import các lớp đứng sau nó (blocks, composites, branches, leaves)."
  causes_vi:
    - "Một feature import một feature khác thay vì đưa phần dùng chung xuống components, hooks hoặc modules"
    - "Một component import ngược lên lớp cao hơn hoặc lên feature"
    - "Một module import hooks hoặc components"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển phần dùng chung xuống tầng thấp hơn rồi cho cả hai bên import từ đó; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_REQUIRED_FILE_MISSING:
  title: "Required file, directory or minimum instance is missing"
  title_vi: "Thiếu tệp, thư mục hoặc số lượng tối thiểu bắt buộc theo bảng kê"
  meaning_vi: "Bảng kê HFS đòi một tệp hoặc thư mục phải có trong mỗi phần của kho (gói dùng chung, module frontend, api, i18n, tuyến, layout...), hoặc đòi kho có ít nhất một ứng dụng hay tính năng thuộc loại bắt buộc. Mục đó không tồn tại; khi là số lượng tối thiểu thì báo tại hfs.json. Thiếu nó thì phần liên quan chưa hoạt động đầy đủ hoặc kho chưa phải một sản phẩm hoàn chỉnh."
  causes_vi:
    - "Tạo thư mục mới nhưng chưa thêm tệp bắt buộc như index.ts, client.ts, outcome.ts hoặc package.json"
    - "Tệp có nhưng tên hoặc chỗ đặt khác với bảng kê"
    - "Kho chưa có tính năng hoặc ứng dụng nào của loại bắt buộc"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tạo tệp còn thiếu đúng chỗ bảng kê chỉ định; nếu cấu trúc hiện có là chủ ý thì đó là việc sửa bảng kê, do người giám sát làm, không phải kho tự đổi."
  owner: op-retry
  kind: check-finding

BE_SQL_INTERPOLATED:
  title: "SQL text built from a runtime value"
  title_vi: "Giá trị chạy lúc chạy bị ghép vào chuỗi SQL"
  meaning_vi: "Một phép thế trong thẻ sql không có kiểu SqlIdent, hoặc một lời gọi .query(...) có chuỗi SQL dựng bằng template hoặc phép cộng chuỗi, nên đầu vào có thể trở thành câu lệnh (SQL injection) và kế hoạch truy vấn không được dùng lại."
  causes_vi:
    - "Template literal có ${biến} trong câu SQL"
    - "Ghép chuỗi SQL bằng dấu +"
    - "Thẻ sql nhận một phép thế không có kiểu SqlIdent (một chuỗi thường, một số)"
  nextStep_vi: "Truyền giá trị bằng tham số đánh số ($1, $2) ở mảng đối số; tên cột hoặc bảng động đi qua ident(tên, danhSáchChoPhép), phép thế duy nhất thẻ sql chấp nhận; câu lệnh là hằng SqlText trong persistence/<tên>.sql.ts chứ không ghép ở nơi gọi. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SQL_OUTSIDE_PERSISTENCE:
  title: "Raw SQL outside persistence/<name>.sql.ts"
  title_vi: "SQL thô ngoài persistence/<name>.sql.ts"
  meaning_vi: "Có câu SQL viết ngoài hằng `sql` trong tệp persistence/<name>.sql.ts của năng lực sở hữu, hoặc `.query()` nhận một chuỗi không phải SqlText, hoặc có createQueryBuilder. SQL rải trong service và handler không được kiểm tra bảng sở hữu và giới hạn đọc."
  causes_vi:
    - "manager.query(\"SELECT ...\") viết thẳng trong handler hoặc service"
    - "createQueryBuilder dùng cho truy vấn phức tạp"
    - "SQL còn nằm trong *.repository.ts kiểu cũ"
  nextStep_vi: "Chuyển câu SQL thành hằng `sql` trong src/modules/<tầng>/<năng lực>/persistence/<tên>.sql.ts, kiểu dòng trả về và hàm ánh xạ ở <tên>.rows.ts, rồi gọi entityManager.query(HẰNG, [tham số]); thay QueryBuilder bằng tùy chọn find hoặc hằng sql. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SQL_TABLE_OWNER:
  title: "SQL touches another capability's table or reads unbounded"
  title_vi: "SQL ghi bảng của năng lực khác hoặc đọc không giới hạn"
  meaning_vi: "Bộ kiểm tra phân tích từng hằng SqlText: câu lệnh ghi (INSERT, UPDATE, DELETE) chỉ được chạm bảng của entity thuộc chính năng lực đó; câu đọc chỉ được chạm bảng của năng lực mà chủ sở hữu được phép import; SELECT nhiều dòng phải có LIMIT trừ khi lọc theo khóa chính hoặc khóa duy nhất hoặc chỉ tính tổng."
  causes_vi:
    - "Service của năng lực A cập nhật bảng của năng lực B"
    - "Truy vấn danh sách quên LIMIT"
    - "Bảng chưa có entity khai báo ở năng lực sở hữu"
  nextStep_vi: "Chuyển câu ghi về năng lực sở hữu bảng và gọi qua API công khai của năng lực đó; thêm LIMIT theo PAGE_SIZE_MAX, LIST_ROWS_MAX hoặc BATCH_ROWS của platform/database. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_QUERY_UNBOUNDED:
  title: "Read without a row bound"
  title_vi: "Truy vấn đọc không có giới hạn số dòng"
  meaning_vi: "Một lệnh find, findBy hoặc findAndCount trên EntityManager có thể trả về mọi dòng khớp mà không nêu take trong đối tượng tùy chọn, nên một khách hàng lớn biến nó thành quét toàn bảng nằm trong bộ nhớ."
  causes_vi:
    - "manager.find(Entity, { where }) không có take"
    - "findBy không thể mang giới hạn"
    - "Tùy chọn find là biến, không viết take ngay tại chỗ gọi"
  nextStep_vi: "Viết take với hằng có tên ngay trong đối tượng tùy chọn (manager.find(Entity, { where, take: LIST_ROWS_MAX })), hoặc phân trang theo con trỏ; câu SELECT thô do máy kiểm tra R86 xét; việc cần đủ mọi dòng (batch, xuất) lặp theo trang keyset chứ không cắt cụt kết quả âm thầm. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_RAW_INJECT:
  title: "Infrastructure dependency injected without its Inject*() decorator"
  title_vi: "Phụ thuộc hạ tầng không được tiêm qua Inject*()"
  meaning_vi: "Mọi tham số constructor có kiểu thuộc hạ tầng (EntityManager, CommandBus, Clock, Logger, Cache, HttpClient, options của module, client SDK) phải mang một decorator Inject<Thing>() không tham số, export từ <owner>.decorators.ts và dựng bằng injector<T>(token) trên token unique symbol. Bộ kiểm tra thấy @Inject( thô ngoài *.decorators.ts, token chuỗi, forwardRef, ModuleRef, tiêm qua thuộc tính, injector sai hình hoặc kiểu T khác kiểu tham số. Token của Inject<Thing>() mà một service dùng cũng phải được export (từ <cap>.decorators.ts hoặc index.ts của năng lực) để spec có thể cung cấp nó."
  causes_vi:
    - "Token của Inject<Thing>() là const riêng tư, không export"
    - "@Inject(TOKEN) viết thẳng ở nơi dùng"
    - "Token là chuỗi thay vì unique symbol"
    - "Tiêm lớp hạ tầng (CacheService, AppLogger) không qua injector"
    - "Dùng ModuleRef.get hoặc forwardRef để né vòng phụ thuộc"
    - "constructor(private readonly timeoutMs: number) {} hoặc ReadonlyMap<string, X> không có Inject<Thing>() gắn token có tên"
  nextStep_vi: "Khai báo token `export const THING: unique symbol = Symbol(\"<owner>.<thing>\")` và `export const InjectThing = (): TypedParameterDecorator<Thing> => injector<Thing>(THING)` trong <owner>.decorators.ts rồi dùng @InjectThing() ở mọi nơi; vòng phụ thuộc là lỗi kiến trúc cần gỡ, không dùng forwardRef. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_HTTP_TIMEOUT:
  title: "Outbound HTTP call without a timeout"
  title_vi: "Gọi HTTP ra ngoài không có timeout"
  meaning_vi: "Một lời gọi fetch, axios hoặc HttpService không nêu timeout hay signal huỷ, nên một bên ngoài im lặng giữ yêu cầu, socket và một chỗ worker vô hạn."
  causes_vi:
    - "fetch(url) không có { signal }"
    - "axios.get hoặc post không có timeout"
    - "axios.create không có timeout"
  nextStep_vi: "Thêm signal: AbortSignal.timeout(<ms có tên>) cho fetch, hoặc timeout: <ms có tên> cho axios và HttpService. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_LOG_SECRET:
  title: "Secret or personal data in a log call"
  title_vi: "Bí mật hoặc dữ liệu cá nhân bị ghi vào log"
  meaning_vi: "Một lời gọi trên cổng Logger của platform/logging truyền vào một giá trị có kiểu Secret (platform/config) hoặc Pii (identity), hay đọc ra từ một giá trị như vậy; hoặc một đối số có tên là thông tin xác thực (password, secret, token, apiKey, authorization, cookie, otp) hay định danh cá nhân (email, phone, fullName, idCard, birthDate), nên giá trị đó tồn tại lâu hơn yêu cầu và bị sao chép sang bên thứ ba."
  causes_vi:
    - "Ghi một giá trị kiểu Secret hoặc Pii, dù đặt tên là gì"
    - "Ghi token hoặc mật khẩu vào log để gỡ lỗi"
    - "Ghi email hoặc số điện thoại vào thông điệp lỗi"
    - "Tạo một lỗi (lớp kế thừa Error, kể cả DomainError) mang giá trị kiểu Secret hoặc chuỗi có tên là thông tin xác thực (token, mật khẩu, authorization, clientSecret) trong thông điệp hay params"
  nextStep_vi: "Ghi id của chủ sở hữu, độ dài, cờ có hay không, hoặc dạng đã che qua mask(...), không ghi giá trị thật. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TYPE_ESCAPE:
  title: "Type escape: cast, non-null assertion, any, Function or eval"
  title_vi: "Thoát kiểu: ép kiểu, non-null, any, Function hoặc eval"
  meaning_vi: "Có x as T (kể cả as never, as unknown as T), <T>x, x!, any, kiểu Function hoặc eval trong bất kỳ tệp nào, kể cả spec, nên trình biên dịch ngừng kiểm tra một giá trị mà thực tế có thể sai kiểu hoặc vắng mặt. Ép kiểu, x! và any do các luật mượn của typescript-eslint mà nhà máy cấu hình bật; Function và eval do luật no-function-or-eval của canon chặn."
  causes_vi:
    - "as never hoặc as unknown as X để lọt kiểm tra tham số, trong mã sản phẩm hay trong spec"
    - "x! thay cho việc kiểm tra tồn tại"
    - "Kiểu Function, eval hoặc new Function thay cho chữ ký có kiểu"
  nextStep_vi: "Cho giá trị đúng kiểu tham số cần (mock<T>() cho double trong spec), thu hẹp bằng guard trả về hoặc ném lỗi có kiểu, hoặc sửa chữ ký để sự vắng mặt không thể xảy ra. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ASYNC_NO_AWAIT:
  title: "Async function that never awaits"
  title_vi: "Hàm async không có await"
  meaning_vi: "Một hàm async không chứa await nào, nên nó hứa việc bất đồng bộ mà không làm, biến lỗi ném ra thành promise bị từ chối vô ích và khiến người đọc tìm một điểm chờ không tồn tại."
  causes_vi:
    - "async method chỉ return giá trị đồng bộ"
    - "async arrow chỉ trả về promise của hàm khác"
  nextStep_vi: "Bỏ async và trả giá trị (hoặc promise thân hàm đã có); nếu chữ ký phải trả Promise thì trả Promise.resolve(giá trị). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MIGRATION_REVERSIBLE:
  title: "Migration that cannot be undone"
  title_vi: "Migration không có down đảo ngược được"
  meaning_vi: "Một migration có up() nhưng thiếu down(), down() rỗng hoặc chỉ ném lỗi, nên bản phát hành cần quay lui không có đường đi và bảng migration ghi đã hoàn tác trong khi lược đồ vẫn đổi."
  causes_vi:
    - "Không có phương thức down"
    - "down() rỗng"
    - "down() chỉ throw"
  nextStep_vi: "Viết down() là phép đảo ngược đúng của up(); khi up() xoá dữ liệu thì down() dựng lại cấu trúc và ghi rõ phần dữ liệu mất trong chú thích migration. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_RETURN_TYPE:
  title: "Handler or public method without a return type"
  title_vi: "Handler hoặc phương thức công khai thiếu kiểu trả về"
  meaning_vi: "Một handler (Query, Mutation, Get, Post...) hoặc phương thức công khai của Injectable, Resolver, Controller không khai báo kiểu trả về, nên hợp đồng ra ngoài là thứ thân hàm tình cờ trả về hôm nay."
  causes_vi:
    - "Resolver hoặc controller method không có : Promise<T>"
    - "Phương thức công khai của service để kiểu suy luận"
  nextStep_vi: "Khai báo kiểu trả về tường minh (Promise<Type>). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_JSON_PARSE_UNGUARDED:
  title: "JSON.parse outside a try"
  title_vi: "JSON.parse không nằm trong try"
  meaning_vi: "Một lời gọi JSON.parse không nằm trong try trong cùng hàm, nên văn bản hỏng từ cơ sở dữ liệu, webhook hoặc nhà cung cấp gây ngoại lệ không được che và trả về 500."
  causes_vi:
    - "JSON.parse cột văn bản đã lưu"
    - "JSON.parse thân webhook hay phản hồi nhà cung cấp"
  nextStep_vi: "Bọc trong try và trả outcome có kiểu (hoặc DomainError) nêu rõ đang phân tích cái gì. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_QUERY_IN_LOOP:
  title: "Query inside a loop (N+1)"
  title_vi: "Truy vấn chạy trong vòng lặp (N+1)"
  meaning_vi: "Một lệnh đọc trên EntityManager (find, findOne, count, exists...) chạy một lần cho mỗi phần tử của vòng lặp for hoặc của map, forEach, flatMap, nên số lượt gọi cơ sở dữ liệu tăng theo đầu vào và một yêu cầu lớn giữ kết nối rất lâu."
  causes_vi:
    - "for (const id of ids) { await manager.findOne(...) }"
    - "Promise.all(ids.map((id) => manager.findOneBy(Entity, { id })))"
  nextStep_vi: "Đọc một lần trước vòng lặp bằng find({ where: { khóa: In(danhSachKhoa) }, take }) hoặc WHERE khóa = ANY($1), dựng Map theo khóa rồi tra trong vòng lặp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_USER_COPY_LITERAL:
  title: "User-facing copy written in source"
  title_vi: "Chữ hiển thị cho người dùng viết thẳng trong mã nguồn"
  meaning_vi: "Một chuỗi chữ cố định xuất hiện ở nơi người dùng đọc được nó - tham số message của một *Error/*Exception, thuộc tính subject/title/body/text/message truyền vào notify/send/publish, hoặc thuộc tính message/description/title của một object trả về trong tầng transport - thay vì được tra theo khóa từ bộ danh mục messages theo từng capability qua cổng MessageCatalog kiểu platform/i18n."
  causes_vi:
    - "throw new PlanNotFoundError('Plan not found for this account')"
    - "this.notifier.send({ subject: 'Your plan has changed', templateId: 'plan-x' })"
    - "return { message: 'Plan updated successfully' }"
  nextStep_vi: "Thêm khóa vào catalog messages (vi và en) của capability hoặc feature liên quan, rồi gọi qua cổng MessageCatalog (messages.get('<khóa>', { ...tham số })) thay vì viết chuỗi tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_AMBIENT_CLOCK:
  title: "Ambient clock read directly"
  title_vi: "Đọc đồng hồ hệ thống trực tiếp"
  meaning_vi: "Một tệp (kể cả spec) ngoài platform/clock tham chiếu tới đồng hồ hệ thống: Date.now, new Date() không tham số, performance.now, process.hrtime hoặc Temporal.Now, dù gọi hay chỉ tham chiếu, nên không có cách nào thay đồng hồ trong một spec hoặc lái một job theo lịch tới một thời điểm chọn trước."
  causes_vi:
    - "const startedAt = Date.now()"
    - "const at = new Date()"
    - "const mark = performance.now()"
    - "const read = Date.now, hoặc const { now } = performance"
  nextStep_vi: "Tiêm cổng Clock (đọc thời gian qua clock.now()) thay vì đọc đồng hồ hệ thống trực tiếp; một spec lái thời gian bằng FakeClock của @starci/jest-preset. op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INBOX_DEDUPE_MISSING:
  title: "Webhook or consumer with no inbox dedupe"
  title_vi: "Thiếu chống trùng lặp qua inbox"
  meaning_vi: "Một handler của consumer (tệp *.consumer.ts trong transport/message) hoặc một handler mang @Public({ reason: PublicReason.SignedWebhook }) không bắt đầu bằng await inbox.claim(source, eventId) trên một receiver có kiểu Inbox của platform/inbox, hoặc có claim nhưng không return sớm khi claim trả false, nên khi bên gửi gửi lại (webhook không thấy phản hồi kịp, hàng đợi giao lại một thông điệp chưa được xác nhận) hành động sẽ chạy lại lần nữa thay vì là một no-op."
  causes_vi:
    - "@Public({ reason: PublicReason.SignedWebhook }) handle() { return this.service.charge() }"
    - "class PaymentCapturedConsumer { handle() { return this.service.capture() } }"
    - "await this.inbox.claim(source, id) rồi chạy tiếp mà không kiểm tra kết quả"
  nextStep_vi: "Gọi await this.inbox.claim(source, eventId) trước mọi await khác và return khi nó trả false (if (!(await this.inbox.claim(source, eventId))) return), để một lượt giao lại trở thành no-op; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INFRA_OWNER:
  title: "Infrastructure library used outside its owning capability"
  title_vi: "Thư viện hạ tầng dùng ngoài năng lực sở hữu"
  meaning_vi: "Mỗi thư viện hạ tầng thô có đúng một năng lực sở hữu: fetch/axios/got/undici/node:http chỉ ở platform/http; cache-manager/redis/ioredis chỉ ở integrations/cache hoặc integrations/redis; bullmq/kafkajs chỉ ở platform/messaging; setTimeout/setInterval/node:timers chỉ ở platform/{scheduling,retry,messaging,http}; winston chỉ ở platform/logging; dayjs/moment chỉ ở platform/{clock,primitives}; @nestjs/config, dotenv, @nestjs/event-emitter và @nestjs/schedule không được dùng."
  causes_vi:
    - "Gọi fetch thẳng trong client tích hợp"
    - "Hẹn giờ bằng setTimeout trong service"
    - "Dùng dayjs trong miền"
    - "Gọi cổng HttpClient của platform/http ngoài một năng lực integrations, ví dụ service miền gọi thẳng endpoint token hay admin của Keycloak hoặc API gửi thư"
  nextStep_vi: "Gọi qua cổng của năng lực sở hữu (HttpClient, Cache, MessagePublisher, Clock, Logger) được tiêm bằng Inject*(). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_HAND_ROLLED_RETRY:
  title: "Hand-rolled retry loop"
  title_vi: "Tự viết vòng lặp thử lại thay vì dùng bộ trợ giúp chung"
  meaning_vi: "Một vòng lặp bắt lỗi (catch hoặc .catch) rồi chờ trước khi thử lại được viết tay tại chỗ; chờ nghĩa là gọi setTimeout, hàm của node:timers/promises, hoặc một hàm khai báo ngoài platform/retry mà thân hàm chờ, dù tên hàm là gì. Vòng lặp như vậy không có giới hạn số lần thử mà bộ kiểm tra nhìn thấy được, không có jitter, và không có cách nào tôn trọng một abort signal."
  causes_vi:
    - "for (let i = 0; i < max; i++) { try { return await fn() } catch (e) { await sleep(backoffMs(i)) } }"
    - "while (true) { try { return await fn() } catch (e) { await new Promise((r) => setTimeout(r, delayMs)) } }"
  nextStep_vi: "Thử lại qua bộ trợ giúp chung platform/retry (giới hạn số lần thử, backoff theo cấp số nhân có jitter, nhận abort signal) thay vì viết vòng lặp tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TRANSACTION_EXTERNAL_CALL:
  title: "Transaction spans an external call"
  title_vi: "Giao dịch cơ sở dữ liệu bao trùm một lệnh gọi ra ngoài"
  meaning_vi: "Một lệnh gọi fetch, HTTP client hoặc SDK tích hợp chạy bên trong .transaction(async (tx) => ...), nên giao dịch giữ kết nối mở trong suốt thời gian lệnh gọi ra ngoài chạy; nếu lệnh gọi thất bại sau khi giao dịch đã ghi một phần, hoặc thành công nhưng giao dịch sau đó rollback, hai hệ thống lệch nhau và không có đường quay lại."
  causes_vi:
    - "this.manager.transaction(async (tx) => { await tx.save(Entity, row); await fetch(url) })"
    - "this.manager.transaction(async (tx) => { await this.paymentSdk.charge(id) })"
  nextStep_vi: "Commit giao dịch trước rồi mới gọi ra ngoài, hoặc ghi một thông điệp outbox bên trong giao dịch để một worker gửi đi sau khi commit; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TRANSPORT_SHAPE:
  title: "Transport does more than map and dispatch"
  title_vi: "Tầng giao tiếp làm nhiều hơn chuyển lệnh"
  meaning_vi: "Mỗi resolver, controller, gateway, consumer, job hoặc lệnh CLI chỉ ánh xạ đầu vào, gửi đúng một command hoặc query qua bus được tiêm và ánh xạ kết quả. Bộ kiểm tra thấy transport tiêm thứ khác ngoài InjectCommandBus/InjectQueryBus (và InjectRequestLocale cho REST), tiêm EntityManager, bọc phản hồi trong envelope, dùng GraphQLJSON hoặc cửa REST không có lý do."
  causes_vi:
    - "Resolver gọi service miền trực tiếp"
    - "Interceptor biến đổi phản hồi thành {success, message, data}"
    - "Đầu vào kiểu GraphQLJSON không kiểm tra"
  nextStep_vi: "Đưa logic vào handler của tính năng, để transport chỉ gọi commandBus.execute(new XCommand({ request, principal })) và trả kiểu kết quả; xóa envelope và thay GraphQLJSON bằng input có kiểu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_UNNAMED_DATA_ACCESS:
  title: "Database reached without the named shared EntityManager"
  title_vi: "Truy cập cơ sở dữ liệu không qua EntityManager dùng chung có tên"
  meaning_vi: "Tham số hoặc thuộc tính kiểu EntityManager không mang bộ tiêm Inject<Kết nối>EntityManager của một kết nối đã khai báo trong hfs.json (tên na ná cũng không đạt), hoặc tiêm bằng thuộc tính, hoặc gọi .getRepository(...), hoặc dùng @InjectRepository / Repository<T> / TypeOrmModule.forFeature, hoặc tiêm DataSource / QueryRunner ngoài platform/database, apps/migrate và test world (kể cả viết kiểu DataSource làm kiểu trả về, giá trị await, token provide: hay lớp bọc trả ra kết nối); lớp nào ngoài handler ứng dụng, domain service và năng lực persistence của platform mà nhận, giữ hoặc trả EntityManager, Repository, DataSource hay QueryRunner đều là repository dù đặt tên gì (Store, Dao, Gateway, Persistence, hoặc module hàm export nhận EntityManager làm tham số đầu như authoring.statements.ts); ứng dụng đăng ký nhiều kết nối nên cách viết này trỏ vào kết nối mặc định hoặc gắn một handle vào đúng một entity, và giao dịch không đi qua được sang bảng thứ hai."
  causes_vi:
    - "constructor(@InjectFooEntityManager() private readonly manager: EntityManager) {} với Foo không phải kết nối khai báo"
    - "@InjectPrimaryEntityManager() private readonly manager: EntityManager (tiêm bằng thuộc tính)"
    - "this.dataSource.getRepository(CourseEntity).find()"
    - "constructor(private readonly dataSource: DataSource) {} ngoài module database của platform"
    - "constructor(@InjectRepository(CourseEntity) private readonly repo: Repository<CourseEntity>) {}"
    - "class AccountingLedgerRepository { appendPosting(manager: EntityManager, ...) {} } đặt ngoài handler và domain service (repository trá hình, kể cả khi tên không có hậu tố Repository)"
  nextStep_vi: "Nhận EntityManager dùng chung qua tham số constructor với bộ tiêm Inject<Kết nối>EntityManager() của kết nối khai báo trong hfs.json (ví dụ InjectPrimaryEntityManager()) rồi gọi trực tiếp manager.find(Entity, ...), manager.save(Entity, ...); DataSource chỉ do module database của platform dựng; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_DOC_NOT_ENGLISH:
  title: "Document is not English"
  title_vi: "Tài liệu không viết bằng tiếng Anh"
  meaning_vi: "Tệp Markdown hoặc YAML trong knowledge/, docs/, src/ hoặc apps/ có chữ cái tiếng Việt (kể cả trong khối mã của Markdown); tài liệu, mẫu và ví dụ phải viết bằng tiếng Anh."
  causes_vi:
    - "Viết hoặc dán đoạn tiếng Việt vào tài liệu, mẫu, ví dụ hay lời trích của chủ dự án"
    - "Đặt dữ liệu YAML có tiếng Việt ngoài slot danh mục thông điệp hoặc slot fixture i18n"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dịch dòng được nêu sang tiếng Anh. Chỉ dữ liệu YAML trong slot danh mục thông điệp hoặc slot fixture i18n được giữ tiếng khác; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_SLOT_FILE_ROLE:
  title: "A front-end file is owned by a slot and named by it"
  title_vi: "Tệp không đúng vai trò trong slot"
  meaning_vi: "Tệp `<f>` nằm trong slot `<s>` nhưng tên của nó không thuộc danh sách `allows` của slot (ví dụ `page.tsx` trong hooks, đoạn `[lang]` dưới `app/`, `*.test.tsx` cạnh component), hoặc là tệp đặt ở chỗ slot cần một thư mục."
  causes_vi:
    - "Vi phạm luật R94: mỗi slot thư mục của front end (route, feature, components, hooks, modules/api) chỉ chứa các tệp mà `allows` của nó gọi tên, và chứa chúng trong thư mục riêng; tệp không slot nào sở hữu là HFS_PATH_NO_SLOT."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi tên tệp về vai trò được phép hoặc chuyển nó về slot đúng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_OPERATION_CONTRACT:
  title: "A versioned operation has no typed contract"
  title_vi: "Thao tác có phiên bản không có hợp đồng kiểu"
  meaning_vi: "Mỗi thao tác `<tên>@<phiên bản>` của một app được khai báo đúng một lần trong bảng thao tác có kiểu `apps/<app>/src/operations.ts` (`OperationContract<Input, Output, RefusalCode>` đăng ký bằng `defineOperations`). Bộ kiểm tra thấy đầu vào hoặc đầu ra là `any`, `unknown`, `Record<string, unknown>`, kiểu generic chưa gán, hàm hoặc `Date`; mã từ chối không phải hợp các chuỗi literal đóng; hoặc route phục vụ bảng không nhận `OperationRequest<Table>` và trả `Promise<OperationReply<Table>>` của cùng một bảng."
  causes_vi:
    - "Đầu vào hoặc kết quả của thao tác khai báo là `unknown` nên client phải tự gõ kiểu tay"
    - "Mã từ chối khai báo là `string` thay vì hợp các literal như `\"DENIED\" | \"INVALID\"`"
    - "Route nhận `@Body() body: unknown` hoặc chỉ dùng một nửa `OperationRequest` / `OperationReply`"
  nextStep_vi: "Khai báo kiểu có tên, đóng cho đầu vào và đầu ra của từng thao tác, liệt kê mã từ chối bằng hợp literal, và cho route nhận `OperationRequest<typeof OPERATIONS>` và trả `Promise<OperationReply<typeof OPERATIONS>>`; chạy `npm run contract:emit` để sinh `contracts/<app>/openapi.json`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục BE-OPERATIONS-1; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

FE_NO_TESTS:
  title: "Front end holds a test file, test tooling or a test dependency"
  title_vi: "Front end có tệp test, công cụ test hoặc thư viện test"
  meaning_vi: "Chuẩn của front end là không có test: repository có spec, e2e, cấu hình vitest, Playwright hay jest, script test, hoặc khai báo thư viện chạy test, dựng môi trường test, testing-library, axe trong package.json."
  causes_vi:
    - "Viết spec hoặc e2e cho component, hook hay trang"
    - "Thêm vitest, Playwright, jest, testing-library hoặc axe vào package.json"
    - "Thêm script test hoặc cấu hình test vào repository front end"
  nextStep_vi: "Xóa tệp, cấu hình, script và thư viện test đó; front end không có ngoại lệ, kể cả thư mục scripts/. Kiểm tra giao diện bằng lint, typecheck và hfs check."
  owner: op-retry
  kind: check-finding
BE_SPEC_PLACEMENT:
  title: "A back-end spec lives in one of the four test layers"
  title_vi: "Spec đặt ngoài bốn tầng test"
  meaning_vi: "Tệp spec hoặc test `<f>` nằm ngoài bốn tầng test của back end (kể cả trong `scripts/` hoặc `tools/`)."
  causes_vi:
    - "Vi phạm luật R102: spec đơn vị là `<name>.service.spec.ts` cạnh service của nó; spec tích hợp, e2e và contract nằm dưới `src/tests/{integration,e2e,contract}`. Mọi `*.spec.*`, `*.test.*`, `*-spec.*` khác là vi phạm; script vận hành và công cụ không mang spec."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển spec vào tầng đúng hoặc xóa nó; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

HFS_REPO_LOCAL_CHECK:
  title: "A repository keeps no check or lint rule of its own"
  title_vi: "Kho tự giữ bộ kiểm tra riêng"
  meaning_vi: "Kho có nguồn kiểm tra hoặc luật lint cục bộ ở `<f>`: tệp `check-*` trong `scripts/` hay `tools/`, tệp `eslint-local-rules*`, plugin eslint cục bộ, hoặc script npm chạy một tệp `check-*`."
  causes_vi:
    - "Vi phạm luật R103: mọi bộ kiểm tra sống trong runtime `.claude` (hfs check, các canon eslint); kho sản phẩm không giữ bộ kiểm tra hay luật riêng. `scripts/` chỉ chứa script vận hành."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp và script trỏ tới nó; nếu luật còn cần thì đề xuất vào canon trong runtime `.claude`, không giữ bản sao trong kho."
  owner: op-retry
  kind: check-finding

HFS_LINT_SUPPRESSION_FILE:
  title: "A repository keeps no lint-suppression file, script or option"
  title_vi: "Kho có tệp hoặc script ghi nhận bỏ qua lỗi lint"
  meaning_vi: "Kho có tệp, script hoặc tùy chọn ghi nhận lỗi lint để bỏ qua ở `<f>`: `eslint.suppressions*`, script `lint:suppressions`, cờ `--suppress-all`/`--suppressions-location`, hoặc cấu hình eslint có `suppressions`."
  causes_vi:
    - "Vi phạm luật R104: lỗi lint được sửa trong mã (hoặc luật được đổi trong canon); không ghi nhận để lỗi nằm lại trong tệp suppressions."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp, script hoặc cờ, và sửa các lỗi lint trong mã."
  owner: op-retry
  kind: check-finding

HFS_PEER_INTEGRATION_MISSING:
  title: "An app declares the runtime peer its driver integration needs"
  title_vi: "Thiếu gói peer mà tích hợp driver cần khi chạy"
  meaning_vi: "`package.json` ở gốc app phụ thuộc vào các gói của một cặp trong `knowledge/hfs/peer-integrations.yaml` (ví dụ `@nestjs/apollo` trên `@nestjs/platform-express` 11, tức Express 5) nhưng không khai báo gói `<requires>` trong dependencies, nên api không khởi động được."
  causes_vi:
    - "Vi phạm luật R111: npm không tự cài gói peer này, type-check và unit spec không nạp nó, nên lỗi chỉ lộ ra khi api khởi động (hai backend cũ thiếu `@as-integrations/express5` và api GraphQL không chạy được trên Express 5)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói `<requires>` vào dependencies của `package.json` ở gốc app; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_INTEGRATION_SPEC_MISSING:
  title: "Every integration has an integration spec that proves its client through the test world"
  title_vi: "Tích hợp thiếu spec integration chứng minh client qua test world"
  meaning_vi: "Thư mục `src/modules/integrations/<provider>/` (có `<provider>.config.ts`) không có `src/tests/integration/<provider>/*.integration-spec.ts` nào vừa gọi `useTestWorld({ modules })` với factory đăng ký module của chính tích hợp đó (`<Provider>Module.register`, import từ thư mục tích hợp), vừa tham chiếu enum ErrorCode của tích hợp, vừa gây một sự cố qua world (`world.infra.<service>`, `world.fake.<name>.failNext`, `world.apps.<peer>.during`, `world.interruptDatabase`)."
  causes_vi:
    - "Vi phạm luật R112: client của tích hợp chỉ được kiểm bằng unit spec với double, nên ánh xạ lỗi và đường sự cố của nhà cung cấp thật (hoặc fake ở biên mạng) chưa bao giờ chạy; lỗi phân loại timeout của FetchHttpClient chỉ lộ ra khi spec integration đầu tiên chạy."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm hoặc bổ sung spec integration của đúng thư mục provider cho phần còn thiếu (đăng ký module, enum ErrorCode, sự cố qua world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_PROOF_COMMAND_FILE_MISSING:
  title: "A proof command names only files the repository holds"
  title_vi: "Lệnh chứng minh trỏ tới tệp không tồn tại"
  meaning_vi: "Lệnh `requiresProof.<kind>.command` của hồ sơ `.starciwork` `<f>` chạy tệp `<path>` mà kho không có, nên không thể chạy đúng như đã viết."
  causes_vi:
    - "Vi phạm luật R105: lệnh chứng minh phải chạy được nguyên văn; tệp spec, script hay cấu hình mà nó nêu tên phải có trong kho (script đã xóa thì kế hoạch chứng minh phải được viết lại)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tạo tệp được nêu hoặc viết lại kế hoạch chứng minh (ví dụ thành một spec e2e trên world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_I18N_KEYS:
  title: "Catalog keys and the source that reads them agree"
  title_vi: "Khóa catalog và mã nguồn đọc chúng không khớp"
  meaning_vi: "Mã nguồn đọc khóa `<key>` mà một locale không có, hoặc catalog `<f>` giữ khóa `<key>` mà không đoạn mã nào của app hay của package dùng chung đọc tới."
  causes_vi:
    - "Vi phạm luật R106: khóa đọc bằng literal qua `next-intl` (`t`, `t.rich`, `t.raw`, `t.markup`) phải có trong mọi locale; khóa của catalog mà không chuỗi nào trong mã nguồn có thể đang đọc thì phải xóa."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm khóa vào mọi catalog của app hoặc đọc khóa có thật; xóa khóa chết khỏi mọi catalog; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_COOKIE_ATTRIBUTES:
  title: "A written cookie leaves its attributes to the defaults"
  title_vi: "Cookie được ghi mà không nêu rõ thuộc tính"
  meaning_vi: "Một lời gọi `set` trên cookie phản hồi của Next (`response.cookies.set`, `cookies().set`) ở `<file>` không nêu `httpOnly` bằng một giá trị cố định, thiếu `secure`, hoặc có `sameSite` khác `lax`/`strict`; cookie phiên khi đó đọc được từ script của trang hoặc đi theo request chéo trang."
  causes_vi:
    - "Vi phạm luật R107: ghi cookie phiên bằng `set(name, value)` không có options, hoặc options thiếu `httpOnly: true`"
    - "`sameSite: \"none\"`, `secure: false` hoặc `httpOnly` lấy từ một biến boolean không cố định"
  nextStep_vi: "Khai báo một hằng số options `as const` trong module sở hữu cookie với `httpOnly: true` (chỉ `false` cho cookie tùy chọn mà script của trang cần đọc), `secure` lấy từ `modules/config` và `sameSite: \"lax\"` hoặc `\"strict\"`, rồi truyền nó vào mọi lần `set`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ERROR_CAUSE_DROPPED:
  title: "A catch replaces the failure without carrying it"
  title_vi: "Catch thay lỗi mà không giữ lỗi gốc"
  meaning_vi: "Một `throw` thoát ra khỏi `catch` (hoặc handler `.catch`) ở `<file>` ném một lỗi mới mà không ném lại giá trị đã bắt và không mang nó theo; lỗi gốc cùng stack của nó mất hẳn. Lỗi thay thế phải nhận đúng giá trị đã bắt làm `cause` (luật R108, BE-ERROR-4)."
  causes_vi:
    - "catch (error) { throw new PlanError({ code: PlanErrorCode.Failed }) } thiếu `cause: error`"
    - "Chỉ đọc `error.message` rồi dựng lỗi mới từ chuỗi đó"
    - "catch { throw new PlanError(...) } không đặt tên cho giá trị đã bắt"
  nextStep_vi: "Đặt tên cho giá trị bắt được (`catch (error)`) và truyền đúng nó làm `cause` của lỗi capability (`new <C>Error({ code, cause: error })`), hoặc ném lại chính nó. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MEMBER_DOC_MISSING:
  title: "A public member has no doc block"
  title_vi: "Thành viên công khai không có JSDoc"
  meaning_vi: "Một thành viên công khai (phương thức, accessor, field hoặc signature) của class, interface hoặc type object được export ở `<file>` không có khối JSDoc ngay phía trên; người gọi chạm tới thành viên chứ không đọc doc của kiểu (luật R109, BE-COMMENT-3)."
  causes_vi:
    - "Phương thức public của service hoặc handler không có /** ... */"
    - "Field của interface Request/Result được export không có doc"
    - "Comment dòng `//` thay cho khối JSDoc"
  nextStep_vi: "Thêm một khối JSDoc tiếng Anh ngay trên thành viên, nói nó dùng để làm gì hoặc gọi nó gây ra điều gì; private, protected, constructor và property gán hằng không cần. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

FE_PROPS_MUTABLE:
  title: "Component props can be written"
  title_vi: "Props của component có thể bị ghi"
  meaning_vi: "Kiểu props của một hàm render được export ở `<file>` có field hoặc index signature thiếu `readonly`, hoặc giữ một collection có thể thay đổi (`T[]`, `[A, B]`, `Array<T>`), trực tiếp hay trong object lồng nhau (luật R110, FE-TYPING-2)."
  causes_vi:
    - "interface XProps { title: string } thiếu `readonly`"
    - "readonly items: Item[] thay vì `readonly Item[]`"
    - "Field của kiểu phần tử khai báo cùng file thiếu `readonly`"
  nextStep_vi: "Đánh dấu `readonly` cho mọi field và index signature của props, viết collection là `readonly T[]`, `readonly [A, B]` hoặc `ReadonlyArray<T>`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

EXAMPLES_CI_WORKFLOW_MISSING:
  title: "The root examples workflow is missing"
  title_vi: "Thiếu workflow gốc chạy các ứng dụng ví dụ"
  meaning_vi: "Không có `.github/workflows/examples.yml`: GitHub chỉ chạy workflow ở gốc repository, nên không ứng dụng ví dụ nào được kiểm tra trong CI."
  causes_vi:
    - "Workflow gốc bị xoá hoặc đổi tên"
  nextStep_vi: "Khôi phục `.github/workflows/examples.yml` với job `apps` in ma trận bằng `node scripts/checks/examples-ci.mjs --matrix`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_WORKFLOW_INVALID:
  title: "The root examples workflow is not valid YAML"
  title_vi: "Workflow gốc của các ví dụ không phải YAML hợp lệ"
  meaning_vi: "Không đọc được `.github/workflows/examples.yml`: `<detail>`."
  causes_vi:
    - "Lỗi cú pháp YAML trong workflow"
  nextStep_vi: "Sửa cú pháp YAML của `.github/workflows/examples.yml` rồi chạy lại `npm run check`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_MATRIX_NOT_DERIVED:
  title: "The examples matrix is not derived"
  title_vi: "Ma trận ví dụ không được suy ra tự động"
  meaning_vi: "Ma trận của workflow ví dụ phải đúng là `app: ${{ fromJSON(needs.apps.outputs.apps) }}`, lấy từ job `apps` chạy `examples-ci.mjs --matrix`; một danh sách viết tay sẽ để một ví dụ mới lọt khỏi CI."
  causes_vi:
    - "Ma trận liệt kê tên ứng dụng bằng tay"
    - "Job `apps` không chạy lệnh suy ra ma trận hoặc không xuất outputs.apps"
    - "Job ma trận thiếu `needs: apps`"
  nextStep_vi: "Dùng job `apps` và biểu thức `fromJSON(needs.apps.outputs.apps)` làm ma trận duy nhất."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_HARDCODED:
  title: "The examples workflow names an example app directly"
  title_vi: "Workflow ví dụ ghi thẳng tên một ứng dụng"
  meaning_vi: "Workflow gốc nhắc tới `examples/<app>` trực tiếp; mọi ứng dụng chỉ được chạy qua ma trận suy ra."
  causes_vi:
    - "Một bước viết đường dẫn của một ví dụ cụ thể"
  nextStep_vi: "Thay đường dẫn cụ thể bằng `examples/${{ matrix.app }}`."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_STACK_LAYER_AUTOMATIC:
  title: "Integration or e2e runs automatically"
  title_vi: "Integration hoặc e2e chạy tự động"
  meaning_vi: "Một bước chạy `test:integration`, `test:e2e` hoặc `test:contract` (khởi động stack docker) không được giới hạn ở `workflow_dispatch`; theo quyết định của chủ dự án, e2e chỉ chạy thủ công."
  causes_vi:
    - "Bước thiếu điều kiện `if: github.event_name == 'workflow_dispatch' ...`"
  nextStep_vi: "Thêm điều kiện `github.event_name == 'workflow_dispatch'` (và input `layers`) cho bước đó."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_NO_MANUAL_TRIGGER:
  title: "The examples workflow has no manual trigger"
  title_vi: "Workflow ví dụ thiếu trigger thủ công"
  meaning_vi: "Workflow ví dụ không có `workflow_dispatch`, nên các lớp integration và e2e không thể chạy thủ công."
  causes_vi:
    - "Khối `on` thiếu `workflow_dispatch` với input `layers`"
  nextStep_vi: "Thêm `workflow_dispatch` với input `layers` (integration, e2e hoặc cả hai) vào workflow."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_STRAY_WORKFLOW:
  title: "A root workflow runs an example app on its own"
  title_vi: "Một workflow gốc tự chạy riêng một ứng dụng ví dụ"
  meaning_vi: "Workflow `<file>` chạy `examples/<app>` ngoài workflow ví dụ chung; mỗi ứng dụng chỉ có một đường CI."
  causes_vi:
    - "Workflow riêng của một ví dụ chưa được gộp vào `examples.yml`"
  nextStep_vi: "Gộp các bước vào `.github/workflows/examples.yml` rồi xoá workflow riêng đó."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_CODECOV_MISSING:
  title: "The root codecov.yml is missing"
  title_vi: "Thiếu codecov.yml ở gốc"
  meaning_vi: "Codecov chỉ đọc một cấu hình gốc; không có `codecov.yml` thì không cờ nào của ứng dụng ví dụ được giữ ở mức 100."
  causes_vi:
    - "Tệp `codecov.yml` gốc bị xoá"
  nextStep_vi: "Chạy `node scripts/checks/examples-ci.mjs --write` để sinh lại tệp."
  owner: runtime-core
  kind: check-finding

EXAMPLES_CI_CODECOV_DRIFT:
  title: "The root codecov.yml differs from its render"
  title_vi: "codecov.yml gốc lệch khỏi bản sinh"
  meaning_vi: "`codecov.yml` gốc phải có đúng một cờ cho mỗi ứng dụng ví dụ, với đường dẫn là phạm vi coverage của ứng dụng (chỉ các service), project và patch ở mức 100."
  causes_vi:
    - "Thêm một ứng dụng ví dụ mà chưa sinh lại tệp"
    - "Sửa tay tệp sinh ra"
  nextStep_vi: "Chạy `node scripts/checks/examples-ci.mjs --write` và commit tệp."
  owner: runtime-core
  kind: check-finding
