HFS_README_DESCRIPTION_INVALID:
  title: "README description line invalid"
  title_vi: "Dòng mô tả trong README chưa đúng"
  meaning_vi: "README thiếu một dòng mô tả ngắn ngay dưới tên kho."
  causes_vi:
    - "Không có dòng mô tả dưới tiêu đề"
    - "Mô tả dài nhiều dòng"
  nextStep_vi: "Op docs.author thêm một dòng mô tả ngắn ngay dưới tiêu đề."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_DEVELOPMENT_INCOMPLETE:
  title: "README Development section incomplete"
  title_vi: "Mục Development trong README chưa đủ lệnh"
  meaning_vi: "Mục Development chưa nêu đủ các lệnh cài đặt, typecheck, lint, build và test (các script do starci app sync quản lý; test chạy bằng npm test)."
  causes_vi:
    - "Quên một hoặc vài lệnh"
    - "Viết bằng lệnh của trình quản lý khác"
  nextStep_vi: "Op docs.author bổ sung đủ các lệnh npm còn thiếu."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_PRIVATE_URL:
  title: "README links a private host"
  title_vi: "README chứa địa chỉ nội bộ hoặc cục bộ"
  meaning_vi: "README có địa chỉ trỏ tới máy cục bộ hoặc mạng riêng."
  causes_vi:
    - "Để nguyên địa chỉ localhost hoặc IP riêng"
    - "Dán nhầm liên kết nội bộ"
  nextStep_vi: "Op docs.author xóa hoặc thay bằng địa chỉ công khai."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_SECTION_MISSING:
  title: "README lacks a standard section"
  title_vi: "README thiếu một mục chuẩn"
  meaning_vi: "README thiếu một trong các mục chuẩn: Overview, Stack, Repository layout, Development."
  causes_vi:
    - "Chưa viết mục đó"
    - "Đặt sai cấp tiêu đề (không phải ##)"
  nextStep_vi: "Op docs.author thêm mục còn thiếu bằng tiêu đề ## đúng tên."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_SECTION_ORDER:
  title: "README sections out of order"
  title_vi: "Các mục README sai thứ tự"
  meaning_vi: "Các mục chuẩn của README không theo đúng thứ tự quy định."
  causes_vi:
    - "Đặt mục sau trước mục trước"
    - "Chèn mục thêm làm xáo trộn thứ tự"
  nextStep_vi: "Op docs.author sắp lại các mục theo thứ tự chuẩn."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_TITLE_INVALID:
  title: "README title does not match repo name"
  title_vi: "Tiêu đề README không khớp tên kho"
  meaning_vi: "Dòng đầu README phải là # kèm tên kho nhưng đang khác."
  causes_vi:
    - "Tiêu đề đặt tên khác"
    - "Kho đổi tên mà README chưa đổi"
  nextStep_vi: "Op docs.author sửa dòng đầu thành # <tên kho>."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_WORK_POINTER_MISSING:
  title: "README lacks Work pointer"
  title_vi: "README thiếu chỉ dẫn tới cây Work"
  meaning_vi: "README chưa chỉ tới cây .starciwork của kho backend."
  causes_vi:
    - "Chưa viết dòng trỏ tới .starciwork"
    - "Chỉ dẫn viết sai nơi"
  nextStep_vi: "Op docs.author thêm chỉ dẫn tới cây .starciwork của backend."
  owner: other-op:docs.author
  kind: check-finding

HFS_REPO_UNREADABLE:
  title: "Repository is not a readable Git work tree"
  title_vi: "Không đọc được kho Git"
  meaning_vi: "Bộ kiểm tra HFS chỉ xét những gì Git theo dõi nên cần một cây làm việc Git đọc được; thư mục được chỉ định thì không."
  causes_vi:
    - "Đường dẫn --repo sai hoặc không phải kho Git"
    - "Git chưa cài hoặc kho bị hỏng"
  nextStep_vi: "Trỏ --repo vào gốc một kho Git hợp lệ rồi chạy lại."
  owner: op-retry
  kind: input-invalid

HFS_ROOT_ENTRY_FORBIDDEN:
  title: "Root entry not on HFS allowlist"
  title_vi: "Mục ở thư mục gốc không được phép"
  meaning_vi: "Ở thư mục gốc của repo có một tệp hoặc thư mục không nằm trong các gốc mà slot của repo khai báo (ví dụ contracts/ cho ảnh chụp hợp đồng)."
  causes_vi:
    - "Worker tạo thêm tệp hoặc thư mục ngay ở gốc repo"
    - "Tệp cũ chưa được dời vào đúng chỗ của nó"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op vừa tạo ra mục đó phải dời nó vào thư mục sở hữu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_ENTRY_MISSING:
  title: "Required root entry is missing"
  title_vi: "Thiếu mục bắt buộc ở thư mục gốc"
  meaning_vi: "Repo thiếu một tệp hoặc thư mục mà cấu trúc chuẩn bắt buộc phải có ở gốc, hoặc README.md không đọc được."
  causes_vi:
    - "Repo mới chưa được dựng khung đầy đủ"
    - "Tệp gốc bị xóa hoặc chưa được commit"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op đang làm việc phải tạo mục còn thiếu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_MARKDOWN_FORBIDDEN:
  title: "Markdown file at repository root"
  title_vi: "Tệp Markdown đặt ở thư mục gốc"
  meaning_vi: "Có một tệp Markdown nằm ngay ở gốc repo, trong khi tài liệu phải nằm trong thư mục docs hoặc hồ sơ Work của nó."
  causes_vi:
    - "Worker ghi ghi chú hoặc báo cáo thẳng ra gốc repo"
    - "Tài liệu cũ chưa được dời đi"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển tệp vào docs/ hoặc hồ sơ Work rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_ROOT_SRC_FORBIDDEN_FE:
  title: "Root src folder in the front end (fe/)"
  title_vi: "Repo giao diện có thư mục src ở gốc"
  meaning_vi: "Repo giao diện có thư mục src ngay ở gốc, trong khi mã nguồn chỉ được đặt trong apps/<tên app>/src."
  causes_vi:
    - "Dự án giao diện được dựng theo kiểu một app đơn"
    - "Worker tạo mã ngoài thư mục app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển toàn bộ src vào apps/<app>/src rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_SIZE_GROWTH:
  title: "Source file over the size budget grew"
  title_vi: "Tệp mã nguồn vượt hạn mức dòng vẫn tiếp tục dài thêm"
  meaning_vi: "Một tệp mã nguồn đã dài hơn hạn mức mềm của ruleParams.fileLines nhưng lại dài thêm so với phiên bản gốc của nhánh, hoặc một tệp mới tạo đã vượt hạn mức ngay từ đầu. Tệp quá dài khó đọc, khó sửa và là nơi lỗi dễ ẩn; quy tắc này cho phép tệp cũ đang quá dài được giữ nguyên hoặc thu nhỏ dần, nhưng không cho phép nó phình thêm."
  causes_vi:
    - "Op thêm mã mới vào một tệp vốn đã quá hạn mức thay vì tách phần mới sang tệp khác"
    - "Một tệp đang dưới hạn mức được thêm mã cho đến khi vượt hạn mức"
    - "Một tệp mới tạo dài hơn hạn mức, hoặc một tệp bị di chuyển sang đường dẫn mới nên bị coi là tệp mới"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tách phần mã mới (hoặc bớt phần cũ) sang tệp riêng đúng ô của nó, sao cho tệp không dài hơn phiên bản gốc và tệp mới nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_SIZE_SOFT_BACKLOG:
  title: "Source file above the soft size"
  title_vi: "Tệp mã vượt cỡ mềm (chỉ báo cáo)"
  meaning_vi: "Tệp mã nguồn dài hơn ngưỡng mềm của ruleParams.fileLines.soft. Đây là danh mục việc cần tách dần, chỉ báo cáo và không bao giờ làm bộ kiểm tra thất bại."
  causes_vi:
    - "Tệp tích tụ qua nhiều lần sửa mà chưa được tách"
  nextStep_vi: "Không cần hành động ngay; khi sửa tệp này, tách theo trách nhiệm để không tăng thêm. Quy tắc tăng trưởng HFS_SIZE_GROWTH mới là chỗ chặn tệp vượt ngưỡng lớn thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_AMBIGUOUS:
  title: "Path owned equally by two slots"
  title_vi: "Đường dẫn thuộc hai ô cùng mức cụ thể"
  meaning_vi: "Hai ô của bảng kê cùng khớp một đường dẫn với độ cụ thể bằng nhau nên không xác định được ô nào sở hữu. Đây là chỗ hở của bảng kê, không phải lỗi của kho."
  causes_vi:
    - "Hai mẫu đường dẫn trong bảng kê chồng lên nhau"
    - "Một ô mới thêm chưa loại phần trùng với ô cũ"
  nextStep_vi: "Người giám sát sửa bảng kê để mỗi đường dẫn chỉ có một ô sở hữu; kho không tự xử lý. Bộ kiểm tra chạy lại sau khi bảng kê được sửa."
  owner: op-retry
  kind: check-finding

HFS_SLOT_NOT_ENABLED:
  title: "Path in an opt-in slot the repository did not enable"
  title_vi: "Đường dẫn thuộc ô tuỳ chọn mà kho chưa bật"
  meaning_vi: "Tệp được theo dõi nằm trong một ô loại tuỳ chọn, nhưng hfs.json không liệt kê ô đó trong optionalSlots và không có ứng dụng nào thuộc loại tự bật ô đó."
  causes_vi:
    - "Kho dùng một loại nội dung tuỳ chọn (worker, websocket, tài liệu, gói dùng chung) mà chưa khai báo"
    - "Ứng dụng của loại tương ứng chưa được ghi vào apps của hfs.json"
  nextStep_vi: "Khai báo ô trong optionalSlots hoặc khai ứng dụng đúng loại ở hfs.json nếu nội dung này là thật; nếu không thì chuyển hoặc xoá tệp. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SRC_LAYOUT_INVALID:
  title: "Backend src holds unexpected folders"
  title_vi: "Thư mục src của backend có mục lạ"
  meaning_vi: "Trong src của repo backend có thư mục nằm ngoài ba nơi cho phép là features, modules và tests, hoặc trong src/tests có thư mục ngoài các slot be.tests.* (world, fixtures, integration, e2e, contract)."
  causes_vi:
    - "Worker tạo thư mục mới ngay dưới src"
    - "Mã cũ chưa được dời về đúng feature hoặc module"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục đó về nơi sở hữu nó rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_STACKS_IN_SIDE:
  title: "Stack declarations under a side (be/ or fe/) instead of the app root"
  title_vi: "Khai báo stack nằm trong một phía (be/ hoặc fe/) thay vì ở gốc app"
  meaning_vi: "Một phía của app (be/ hoặc fe/) đang chứa thư mục .starcistacks, trong khi .starcistacks chỉ được đặt ở gốc app, cạnh be/, fe/ và .starciwork."
  causes_vi:
    - "Còn giữ bố cục cũ be/.starcistacks từ trước khi chuyển về gốc app"
    - "Worker tạo stack trong một phía thay vì ở gốc app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục bằng git mv về .starcistacks ở gốc app và sửa mọi đường dẫn trỏ tới nó."
  owner: op-retry
  kind: check-finding

HFS_SYNC_DRIFT:
  title: "Generated file drifted from its template"
  title_vi: "Tệp do starci app sync sinh đã lệch khỏi mẫu"
  meaning_vi: "Một tệp mà starci app sync sinh (mọi tệp thuộc slot có managedBy trong slots.yaml, khối .gitignore, .starciwork/.gitignore) có nội dung khác bản sinh từ mẫu và hfs.json, hoặc bị xóa."
  causes_vi:
    - "Tệp được sửa tay thay vì sửa mẫu"
    - "hfs.json đổi (sides, apps) mà chưa chạy starci app sync --write"
    - "Preset jest đổi danh sách loại trừ độ phủ"
  nextStep_vi: "Chạy npx starci app sync --write để sinh lại tệp; nếu cần khác mẫu thì đổi mẫu trong .claude, không sửa tay. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SYNC_HFS_INVALID:
  title: "hfs.json unreadable for sync"
  title_vi: "hfs.json không đọc được cho starci app sync"
  meaning_vi: "starci app sync cần hfs.json hợp lệ ở gốc app (hfs bằng major của slots.yaml, kind app, project kebab-case, sides.be và sides.fe mỗi bên ít nhất một app có kind) nhưng tệp thiếu hoặc sai."
  causes_vi:
    - "Thiếu hfs.json ở gốc app"
    - "kind không phải app, hoặc thiếu sides.be / sides.fe"
    - "Danh sách apps của một bên rỗng hoặc trùng tên giữa hai bên"
  nextStep_vi: "Sửa hfs.json cho đúng khuôn rồi chạy lại starci app sync. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SYNC_PRESET_MISSING:
  title: "Coverage preset not installed"
  title_vi: "Chưa cài preset độ phủ"
  meaning_vi: "starci app sync lấy danh sách loại trừ độ phủ từ @starci/jest-preset của back end (front end không có test nên không có preset) nhưng repository chưa cài preset đó."
  causes_vi:
    - "Chưa khai báo preset độ phủ của back end trong package.json"
    - "node_modules chưa được cài sau khi khai báo"
  nextStep_vi: "Đặt @starci/jest-preset về đúng phiên bản chính xác trong knowledge/hfs/canon-pins.yaml, cài lại rồi chạy lại starci app sync. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding


HFS_SYNC_SONAR_KEY:
  title: "Ambiguous Sonar project key"
  title_vi: "Khóa dự án Sonar không rõ ràng"
  meaning_vi: "Khai báo stack của repository (services.sonar.projects) liệt kê nhiều hơn một khóa Sonar cho cùng một repository, nên starci app sync không biết dùng khóa nào."
  causes_vi:
    - "application-stacks.yaml khai hai project Sonar cho cùng repository"
  nextStep_vi: "Op quản lý workspace sửa khối services.sonar để mỗi repository chỉ có một khóa, rồi chạy lại starci app sync."
  owner: other-op:workspace.manage
  kind: check-finding

HFS_SYNC_TEMPLATE_VARIABLE:
  title: "Template names an unknown variable"
  title_vi: "Mẫu dùng biến starci app sync không cung cấp"
  meaning_vi: "Một mẫu trong templates của starci app sync nhắc tới biến mà starci app sync không sinh ra, nên không thể hiển thị tệp."
  causes_vi:
    - "Mẫu được sửa và gõ sai tên biến"
  nextStep_vi: "Người bảo trì runtime sửa mẫu hoặc thêm biến vào starci app sync; sự cố runtime, không phải lỗi của repository sản phẩm."
  owner: runtime-core
  kind: check-finding

HFS_SYNC_TEMPLATE_MISSING:
  title: "Managed slot file has no template"
  title_vi: "Tệp của slot managedBy chưa có mẫu"
  meaning_vi: "Một slot trong slots.yaml khai managedBy và liệt kê một tệp, nhưng templates/<profile hoặc common>/<managedBy> của starci app sync không có mẫu cho tệp đó."
  causes_vi:
    - "Thêm tệp vào slot managedBy mà quên thêm mẫu"
    - "Gõ sai tên thư mục managedBy"
  nextStep_vi: "Người bảo trì runtime thêm mẫu vào templates của gói @starci/hfs hoặc bỏ tệp khỏi slot; sự cố runtime, không phải lỗi của repository sản phẩm."
  owner: runtime-core
  kind: check-finding

HFS_SYNC_MANIFEST_MANAGED:
  title: "Managed slot path is not a list of literal files"
  title_vi: "Đường dẫn slot managedBy không phải danh sách tệp cụ thể"
  meaning_vi: "Một slot trong slots.yaml khai managedBy nhưng path của nó có ký tự đại diện hoặc là thư mục, nên starci app sync không biết cần sinh những tệp nào."
  causes_vi:
    - "Đặt managedBy cho slot có path dạng glob hoặc thư mục"
  nextStep_vi: "Người bảo trì runtime liệt kê từng tệp trong path của slot hoặc bỏ managedBy; sự cố runtime, không phải lỗi của repository sản phẩm."
  owner: runtime-core
  kind: check-finding

HFS_TRACKED_MUST_BE_IGNORED:
  title: "Tracked path that must be gitignored"
  title_vi: "Tệp bị theo dõi nhưng lẽ ra phải bị bỏ qua"
  meaning_vi: "Tệp nằm trong một ô loại ignored (kết quả build, tệp sinh tự động, phụ thuộc) nhưng đã được đưa vào Git."
  causes_vi:
    - "Thư mục dist, coverage, .next hoặc tệp sinh tự động bị git add"
    - ".gitignore thiếu dòng cho thư mục này"
  nextStep_vi: "Gỡ tệp khỏi Git bằng git rm --cached và thêm vào khối .gitignore chuẩn; không xoá thư mục trên đĩa. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_WORK_AGENT_DATA:
  title: "Agent output staged under .starciwork"
  title_vi: "Dữ liệu agent bị đưa vào .starciwork"
