    - "Import thẳng @heroicons trong component"
    - "Dùng kích thước biểu tượng ngoài thang"
    - "Primitive thư viện ngoài dùng trực tiếp ở nhiều nơi"
  nextStep_vi: "Dùng lá icon và chủ sở hữu primitive có sẵn; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
