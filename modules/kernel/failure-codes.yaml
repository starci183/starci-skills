  title_vi: "Cổng toàn nhánh không chạy được một công cụ"
  meaning_vi: "gate.mjs không chạy được một công cụ nên không có kết quả; không bao giờ đưa vào main khi cổng không chạy."
  causes_vi:
    - "starci app lint, tsc hoặc jest không chạy được"
    - "Thiếu node_modules sau npm ci"
  nextStep_vi: "Sửa môi trường công cụ rồi finish lại; main giữ nguyên."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-guard-unavailable:
  title: "The merge guard could not run"
  title_vi: "Chốt chặn merge không chạy được"
  meaning_vi: "Chốt chặn merge không tính lại được một commit merge trên nhánh workflow bằng git merge-tree."
  causes_vi:
    - "git merge-tree lỗi"
  nextStep_vi: "Sửa môi trường git rồi finish lại; main giữ nguyên."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-lock-busy:
  title: "Another land holds the repository lock"
  title_vi: "Một lần đưa vào main khác đang giữ khoá"
  meaning_vi: "Một workflow khác đang đưa vào main của cùng repository và giữ khoá quá thời gian chờ."
  causes_vi:
    - "Hai workflow finish cùng lúc trên một repository"
  nextStep_vi: "Chờ lần kia xong rồi finish lại."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-main-moved:
  title: "main moved during the finish"
  title_vi: "main đã di chuyển trong lúc finish"
  meaning_vi: "main thay đổi giữa bước rebase và bước fast-forward, nên compare-and-swap từ chối."
  causes_vi:
    - "Một workflow khác vừa vào main"
  nextStep_vi: "Gọi finish lại; lần sau sẽ rebase lên main mới."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-main-refused:
  title: "main could not be fast-forwarded at finish"
  title_vi: "Không fast-forward được main khi finish"
  meaning_vi: "Bản checkout chính không ở main hoặc đang có thay đổi chưa commit trên đúng các tệp mà workflow ghi."
  causes_vi:
    - "Bản checkout chính bẩn trên các tệp đó"
    - "Bản checkout chính không ở nhánh main"
  nextStep_vi: "Làm sạch bản checkout chính hoặc đưa nó về main rồi finish lại."
  owner: supervisor
  kind: verb-refusal
workflow-finish-merge-dropped-main:
  title: "A merge on the workflow branch dropped main changes"
  title_vi: "Một commit merge trên nhánh workflow làm mất thay đổi của main"
  meaning_vi: "Chốt chặn merge thấy có tệp main đã sửa mà bản merge lại giữ phía nhánh workflow. main không di chuyển."
  causes_vi:
    - "Xung đột được giải bằng cách giữ toàn bộ phía nhánh"
  nextStep_vi: "Làm lại merge, lấy thay đổi của main cho từng tệp, rồi finish lại."
  owner: op-retry
  kind: verb-refusal
workflow-finish-push-failed:
  title: "main advanced but its push failed"
  title_vi: "main đã tiến nhưng push lỗi"
  meaning_vi: "main đã được fast-forward nhưng git push lên origin thất bại."
  causes_vi:
    - "Mạng lỗi"
    - "origin từ chối push"
  nextStep_vi: "Gọi finish lại để push lại; main giữ nguyên ở commit mới."
  owner: supervisor
  kind: verb-refusal
workflow-finish-rebase-conflict:
  title: "The workflow branch conflicts with main at finish"
  title_vi: "Nhánh workflow xung đột với main khi finish"
  meaning_vi: "Khi finish, rebase nhánh của workflow lên main gặp xung đột; rebase đã được huỷ và main giữ nguyên."
  causes_vi:
    - "main đã sửa cùng tệp trong lúc workflow chạy"
  nextStep_vi: "Giao một op giải xung đột trên worktree của workflow rồi finish lại."
  owner: op-retry
  kind: verb-refusal
workflow-finish-rebase-failed:
  title: "The workflow branch could not be rebased at finish"
  title_vi: "Không rebase được nhánh workflow khi finish"
  meaning_vi: "Khi finish, rebase lỗi không do xung đột (worktree bẩn hoặc main không resolve được)."
  causes_vi:
    - "Worktree còn thay đổi"
    - "git rebase lỗi môi trường"
  nextStep_vi: "Sửa nguyên nhân rồi finish lại; main giữ nguyên."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-release-pending-failed:
  title: "The workflow worktree could not be marked release-pending"
  title_vi: "Không đánh dấu được worktree của workflow là chờ giải phóng"
  meaning_vi: "main đã được đưa vào và push, nhưng registry không ghi được trạng thái release-pending, nên GC của phần A không biết để gỡ worktree."
  causes_vi:
    - "machine.sqlite không ghi được"
    - "Registry không còn dòng của workflow"
  nextStep_vi: "main đã đúng; sửa registry rồi finish lại để đánh dấu release-pending."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-verify-missing:
  title: "No passing review.verify on what lands"
  title_vi: "Chưa có review.verify đạt trên phần sắp vào main"
  meaning_vi: "Op cuối cùng được chốt của workflow phải là một review.verify đạt; có op khác chốt sau nó hoặc chưa có review.verify."
  causes_vi:
    - "Chưa chạy review.verify"
    - "Có op sửa code chốt sau review.verify"
  nextStep_vi: "Chạy review.verify làm chặng cuối rồi finish lại."
  owner: runtime-core
  kind: verb-refusal
workflow-finish-verify-stale:
  title: "review.verify did not verify the head that lands"
  title_vi: "review.verify chưa kiểm đúng head sắp vào main"
  meaning_vi: "Head mà review.verify ghi trong báo cáo khác head sắp được đưa vào main, hoặc lần rebase khi finish đã dời head; main không di chuyển."
  causes_vi:
    - "main đã tiến nên rebase tạo head mới"
    - "review.verify chạy trên một head cũ hoặc không ghi head"
  nextStep_vi: "Chạy lại review.verify trên head hiện tại của nhánh workflow rồi finish lại."
  owner: runtime-core
  kind: verb-refusal
workflow-foreign-change:
  title: "A change in the workflow worktree is under no live op's leases"
  title_vi: "Worktree của workflow có thay đổi không thuộc lease của op nào"
  meaning_vi: "Op xanh chỉ được ghi checkpoint cho các đường dẫn nó sở hữu; có tệp thay đổi nằm ngoài lease của mọi op đang chạy trong workflow, nên việc chốt xanh bị từ chối."
  causes_vi:
    - "Op ghi ra ngoài owned_paths của nó"
    - "Có người sửa tay một tệp trong worktree của workflow"
  nextStep_vi: "Chốt op là fail hoặc blocked để runtime giữ thay đổi đó vào preserved/<workflowId>/<op> và đưa về checkpoint, hoặc mở rộng owned_paths rồi chạy lại op."
  owner: op-retry
  kind: settle-reason
workflow-foreign-commit:
  title: "A commit on the workflow branch was not made by the runtime"
  title_vi: "Nhánh workflow có commit không do runtime tạo"
  meaning_vi: "Chỉ runtime (checkpointOp) được commit trên nhánh của workflow; đầu nhánh phải đúng là checkpoint cuối. Có commit khác nằm sau checkpoint nên việc chốt xanh hoặc finish bị từ chối."
  causes_vi:
    - "Op tự chạy git commit trong worktree của workflow"
    - "Có người commit tay lên nhánh workflow"
  nextStep_vi: "Chốt op đó là fail hoặc blocked để runtime giữ commit vào preserved/<workflowId>/<op> và đưa nhánh về checkpoint, rồi chạy lại op mà không tự commit."
  owner: op-retry
  kind: settle-reason
workflow-gate-base-unknown:
  title: "The gate base of the workflow is unknown"
  title_vi: "Không xác định được mốc so sánh của cổng"
  meaning_vi: "Checkpoint ghi trong registry không phải commit của worktree, hoặc nhánh của workflow không có merge-base với main, nên cổng không biết so với đâu."
  causes_vi:
    - "Registry ghi một checkpoint đã mất"
    - "Nhánh workflow không xuất phát từ main"
  nextStep_vi: "Sửa checkpoint trong registry (hoặc tạo lại workflow) rồi chạy lại."
  owner: runtime-core
  kind: runtime-fault
workflow-preserve-failed:
  title: "The work of a failed op could not be preserved"
  title_vi: "Không giữ lại được phần việc của op thất bại"
  meaning_vi: "Runtime không ghi được ref preserved/<workflowId>/<op> cho phần việc của op thất bại hoặc bị chặn, nên không reset worktree."
  causes_vi:
    - "git update-ref thất bại"
  nextStep_vi: "Không có gì bị xoá; sửa lỗi git rồi chốt lại op."
  owner: runtime-core
  kind: settle-reason
