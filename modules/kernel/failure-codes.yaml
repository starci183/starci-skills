# --- HFS rule catalog (knowledge/hfs/rules.yaml): one code per rule, from R01 to R67 ---

HFS_SLOT_UNDECLARED:
  title: "Every tracked path matches exactly one slot"
  title_vi: "Đường dẫn không thuộc ô nào"
  meaning_vi: "Một tệp hoặc thư mục trong kho không thuộc ô nào trong bảng kê; mọi đường dẫn được theo dõi phải khớp đúng một ô. Bộ kiểm tra báo kèm ô gần nhất để biết tệp lẽ ra thuộc đâu."
  causes_vi:
    - "Vi phạm luật R01: mọi path được track phải khớp đúng một slot trong `knowledge/hfs/slots.yaml` (thay allowlist gốc)."
    - "Tệp đặt sai chỗ, ví dụ một tệp không phải *.e2e-spec.ts nằm trong thư mục kiểm thử e2e"
    - "Thư mục do kho tự đặt ở gốc hoặc trong src mà HFS không có ô cho nó"
    - "Tên tệp hoặc thư mục viết sai so với mẫu của ô gần nhất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển tệp vào ô gần nhất được báo hoặc xoá nó; nếu thực sự cần một loại nội dung mới thì đó là việc thêm ô vào bảng kê, do người giám sát làm, không phải kho tự thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_REQUIRED_MISSING:
  title: "A slot is missing a required file (feature `index.ts`, app `main.ts`, FE `global-error.tsx`)"
  title_vi: "Ô thiếu tệp bắt buộc"
  meaning_vi: "Một ô bắt buộc (hoặc một thực thể của ô, như một ứng dụng hay một tính năng) đòi có tệp hoặc thư mục này nhưng nó không nằm trong những gì Git theo dõi."
  causes_vi:
    - "Vi phạm luật R02: slot bắt buộc thiếu tệp `requires` (vd feature thiếu `index.ts`, app thiếu `main.ts`, FE thiếu `global-error.tsx`)."
    - "Ứng dụng thiếu main.ts hoặc app.module.ts"
    - "Kho thiếu tệp gốc bắt buộc như README.md, hfs.json, .starciwork, .starcistacks"
  nextStep_vi: "Tạo tệp hoặc thư mục theo mẫu của ô rồi commit; tệp chưa git add vẫn tính là thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_UNTRACKED_ROOT_ENTRY:
  title: "No untracked or ignored entry outside an `ignored` slot"
  title_vi: "Mục lạ ở gốc kho"
  meaning_vi: "Có mục chưa được git theo dõi, cũng không nằm trong `.gitignore` hay slot `ignored`, nên HFS không cho phép nó tồn tại trong cây làm việc. Theo dõi nó vào đúng slot, hoặc lưu trữ ra `D:/starci-archive/` rồi xóa."
  causes_vi:
    - "Vi phạm luật R03: Thư mục làm việc không được có mục untracked/ignored ngoài slot `ignored` (vd `nul`, `.qwen/`, `.worktrees/`, `design-plans/`, `express`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_EMPTY_DIR:
  title: "No empty directory outside an `ignored` slot"
  title_vi: "Thư mục rỗng còn sót lại"
  meaning_vi: "Có thư mục không có tệp nào bên dưới (kể cả các thư mục con cũng rỗng). Git không theo dõi thư mục rỗng nên nó chỉ là dấu vết của cấu trúc đã đổi tên hoặc đã xóa. Xóa thư mục."
  causes_vi:
    - "Vi phạm luật R03: cấu trúc bị đổi tên hoặc tệp bị xóa mà thư mục cũ không được dọn (vd `src/modules/business/*` còn trống bên cạnh `domain/*`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_GHOST_TREE:
  title: "No empty directory beside a near-identical sibling"
  title_vi: "Cây thư mục ma cạnh thư mục gần trùng tên"
  meaning_vi: "Có thư mục rỗng mà tên chỉ khác vài ký tự so với thư mục anh em cùng cấp (thông báo nêu cả hai), tức là bản đổi tên hoặc gõ sai của cùng một cấu trúc chưa được dọn. Giữ bản có tệp, xóa bản rỗng."
  causes_vi:
    - "Vi phạm luật R03: đổi tên cấu trúc để lại bản cũ hoặc bản gõ sai (vd `business` và `bussiness`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_GITIGNORE_BLOCK_DRIFT:
  title: "The managed `.gitignore` block equals its render"
  title_vi: "Khối .gitignore lệch bản render"
  meaning_vi: "Khối .gitignore chuẩn đã bị sửa tay hoặc thiếu dòng `<rule>`. Chạy `hfs sync`."
  causes_vi:
    - "Vi phạm luật R04: Khối `.gitignore` do `.claude` quản lý phải trùng bản render (never-tracked list, deny `.env*`, cache)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MANAGED_FILE_DRIFT:
  title: "A managed file equals its template render"
  title_vi: "Tệp do .claude quản lý bị lệch"
  meaning_vi: "`<file>` do `.claude` quản lý nhưng nội dung lệch bản render từ template. Chạy `hfs sync --write`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R05: Tệp trong slot có `managedBy` của slots.yaml (tsconfig, jest.config.js, .prettierrc, .prettierignore, husky, workflows, sonar, khối `scripts` của package.json) phải bằng bản render từ template; danh sách tệp nằm trong slots.yaml, không nằm trong mã."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_PLAINTEXT_SECRET:
  title: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`"
  title_vi: "Bí mật dạng rõ trong kho"
  meaning_vi: "Tìm thấy bí mật dạng rõ ở `<path>`. Bí mật chỉ được nằm ở `.starcistacks/<env>/secrets/<slug>.enc` (sops). Không đọc, không in giá trị."
  causes_vi:
    - "Vi phạm luật R06: Bí mật chỉ tồn tại ở `.starcistacks/<env>/secrets/<slug>.enc`. Mọi `.env*`, `.secrets/`, `*.key\\|*.pem` plaintext, `runtime/files/*` đều bị từ chối, kể cả khi ignore."
  nextStep_vi: "Không đọc và không in giá trị. Chủ kho mã hoá bí mật bằng sops vào .starcistacks/<môi-trường>/secrets/<slug>.enc, sau đó xoá tệp rõ; agent không tạo hay xoay khoá."
  owner: owner
  kind: check-finding

HFS_AGENT_DATA_TRACKED:
  title: "`.starciwork` holds product records only"
  title_vi: "Dữ liệu của agent bị track"
  meaning_vi: "`<path>` là dữ liệu của agent, không phải record sản phẩm. Nó thuộc blob store (trích bằng `{name, sha256}`)."
  causes_vi:
    - "Vi phạm luật R07: `.starciwork` chỉ chứa record sản phẩm; evidence, log, report, capture, run, sqlite, `_derived/` không được track."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_WORK_NODE_RETIRED:
  title: "Only flat family records, never `work/node`"
  title_vi: "Còn record work/node đã bỏ"
  meaning_vi: "Record `<id>` vẫn dùng dạng `work/node` đã bỏ. Chuyển sang family phẳng `<family>`."
  causes_vi:
    - "Vi phạm luật R08: Không còn record `work/node@*`; mọi record là record phẳng `features/<f>/<family>/<name>/index.yaml`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_IDENTITY_CUSTODY:
  title: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role"
  title_vi: "Bí mật của identity sai chỗ"
  meaning_vi: "Identity `<id>` trỏ bí mật tới `<path>`; chỉ `.starcistacks/<env>/secrets/identity-<slug>.enc` (đường dẫn tính từ gốc app) hợp lệ; dạng `be/.starcistacks/...` bị từ chối. UAT chọn tài khoản theo role."
  causes_vi:
    - "Vi phạm luật R09: Identity record (`_resources/identities/<slug>/resource.yaml`) trỏ `custody.sealed` tới `.starcistacks/<env>/secrets/identity-<slug>.enc` ở gốc app; UAT `accounts.yaml` chọn identity theo role, không theo flow."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_STACKS_SHAPE:
  title: "`.starcistacks` has the standard shape and the host Sonar owner"
  title_vi: "Hình dạng .starcistacks sai"
  meaning_vi: "`.starcistacks` có `<path>` ngoài hình dạng chuẩn (danh sách allows của slot app.starcistacks, gồm cả infra/metadata.json) (hoặc còn trỏ `.stacks`)."
  causes_vi:
    - "Vi phạm luật R10: `.starcistacks/<env>/` chỉ có `README.md`, `environment.json`, `infra/{compose,k8s,terraform}`, `runtime/{config,env}`, `secrets/`, `seeds/`; khối sonar là `owner: host` trỏ `.claude/ext/sonar`; không còn gốc `.stacks`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SONAR_CONFIG:
  title: "Sonar config is generated, with no host URL, importing the be lcov with the services as the only coverage scope"
  title_vi: "Cấu hình Sonar lệch"
  meaning_vi: "Cấu hình Sonar lệch: `<detail>`. Sonar phải đọc đúng cấu hình sinh ra và nhập báo cáo độ phủ lcov của be, chỉ tính các service."
  causes_vi:
    - "Vi phạm luật R11: `sonar-project.properties` do template sinh: không `sonar.host.url`, `sources`/`tests` không chồng, `sonar.exclusions` = đúng danh sách loại trừ của jest, nhập lcov của be (`sonar.javascript.lcov.reportPaths=be/coverage/lcov.info`) với `sonar.coverage.inclusions=be/src/**/*.service.ts` và không khóa độ phủ nào khác, không nhắc kiểu spec đã bỏ, và nhận báo cáo ESLint cùng tệp nhập lỗi HFS (`sonar.eslint.reportPaths`, `sonar.externalIssuesReportPaths`) để mọi lỗi canon hiện trong Sonar."
    - "Khối `services.sonar.qualityGate` của khai báo stack phải gọi đúng cổng chất lượng duy nhất của `knowledge/sonar-gate.yaml`; repo không tự ghi ngưỡng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CI_MISSING_CANON:
  title: "CI runs the pinned `hfs lint`; pre-push runs typecheck and lint"
  title_vi: "CI thiếu bước canon"
  meaning_vi: "Workflow/husky thiếu bước `<step>`. Cấu trúc chỉ được kiểm khi agent chạy — CI phải tự kiểm."
  causes_vi:
    - "Vi phạm luật R13: CI phải chạy `hfs lint` (`npm run lint` hoặc `npx @starci/hfs lint`, bản pin); pre-push phải có `typecheck` + `lint`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DEP_VERSION_SKEW:
  title: "One version per dependency in the workspace"
  title_vi: "Một gói nhiều phiên bản"
  meaning_vi: "`<pkg>` có `<n>` version trong workspace (`<list>`). Chỉ được một."
  causes_vi:
    - "Vi phạm luật R14: Mỗi dependency một version trong workspace; cấm bản sao lồng thứ hai (`apps/*/node_modules/@starci/grammar`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TOOL_CONFIG_LOCAL:
  title: "Configs only call the factories; no local rules"
  title_vi: "Kho tự đặt luật cục bộ"
  meaning_vi: "Repo có cấu hình công cụ cục bộ ở `<file>`: tệp cấu hình ngoài bộ được quản lý (`.eslintrc*`, `.eslintignore`, `eslint.config.*` hay `stylelint.config.*` thứ hai, cấu hình prettier/lint-staged khác), tệp tự định nghĩa luật ESLint hoặc plugin stylelint, khóa cấu hình công cụ trong `package.json` (`eslintConfig`, `stylelint`, `prettier`, `lint-staged`, `jest`), hoặc lệnh chạy eslint/stylelint/prettier với cờ đổi cấu hình (`--rule`, `--no-inline-config`, `--no-eslintrc`, `--config`, `--ignore-pattern`). Luật chung nằm trong `.claude`; đề xuất thay đổi ở đó."
  causes_vi:
    - "Vi phạm luật R16: Cấu hình của repo chỉ gọi factory của `.claude`; cấm tệp cấu hình công cụ khác, tệp luật cục bộ (vd một tệp eslint-local trong thư mục scripts) và cờ dòng lệnh đổi hoặc tắt cấu hình trong hook, workflow, script."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_RULE_OFF_WITHOUT_REPLACEMENT:
  title: "The ESLint configuration (and a front end's stylelint configuration) is the rendered one-liner, so no rule is off, warned or redefined in a repository"
  title_vi: "Cấu hình ESLint hoặc stylelint lệch bản render"
  meaning_vi: "`eslint.config.mjs` (hoặc `stylelint.config.mjs` của front end) khác bản render (một dòng gọi `starciBeConfig`, `starciFeConfig` hoặc `starciStylelintConfig`). Factory không nhận tham số ghi đè, nên một luật chỉ có thể bị tắt, hạ mức hoặc định nghĩa lại trong repo khi tệp này khác bản render. Chạy `hfs sync --write`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R17: `eslint.config.mjs` phải đúng bằng bản render; luật thay thế nằm trong plugin của `.claude`, không bao giờ tắt trong repo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_RULE_UNCATALOGUED:
  title: "Plugin rule that no catalog rule names"
  title_vi: "Luật của plugin không thuộc luật HFS nào"
  meaning_vi: "Một luật của @starci/eslint-canon-be hoặc @starci/eslint-canon-fe được phát hành nhưng không enforcer nào trong knowledge/hfs/rules.yaml nêu tên nó, hoặc bảng why của plugin gán nó vào một mã mà luật HFS sở hữu không liệt kê; một luật không có mã R thì không có lý do tiếng Việt và không có cổng."
  causes_vi:
    - "Thêm luật ESLint mới mà quên danh mục"
    - "Luật cũ còn trong plugin sau khi luật HFS đã bỏ"
  nextStep_vi: "Người giám sát thêm luật vào danh sách enforcers của luật R sở hữu, hoặc xóa luật khỏi plugin cùng mọi tham chiếu, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_UNTESTED:
  title: "Rule enforcer without a violating and a passing test"
  title_vi: "Bộ kiểm tra của luật chưa có test vi phạm và test hợp lệ"
  meaning_vi: "Mỗi enforcer đã có của một luật HFS phải có bằng chứng: luật ESLint có một lần chạy RuleTester với cả ca hợp lệ và ca vi phạm; kiểm tra của máy kiến trúc hoặc hfs có một tệp tests/*.spec.mjs nêu mã của luật trong ít nhất hai test (một cây vi phạm, một cây sạch). Thiếu bằng chứng thì độ phủ có thể lùi mà không ai biết."
  causes_vi:
    - "Thêm luật mới nhưng chưa viết ca kiểm thử"
    - "Test chỉ có ca hợp lệ hoặc chỉ có ca vi phạm"
    - "Đổi tên luật mà không đổi tên trong test"
  nextStep_vi: "Người giám sát bổ sung ca vi phạm và ca hợp lệ cho enforcer đó trong test của luật, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_CODE_UNOWNED:
  title: "Emitted finding code that no rule owns"
  title_vi: "Mã lỗi mà máy có thể báo nhưng không luật nào sở hữu"
  meaning_vi: "Máy kiến trúc hoặc hfs check có thể phát ra một mã lỗi mà không luật nào của knowledge/hfs/rules.yaml liệt kê trong failureCodes. Mã không thuộc luật nào thì không có số R, không có cổng chạy và không có bằng chứng test. Chỉ các mã từ chối vì không phán xét được (hạ tầng hỏng, cấu hình không đọc được) được miễn, và chủ của chúng xuất khẩu chúng thành một danh sách riêng."
  causes_vi:
    - "Thêm một mã mới vào máy kiến trúc hoặc hfs check nhưng chưa xếp nó dưới luật nào"
    - "Hai mã cùng nói một nghĩa vụ nên phải giữ một và xoá một"
    - "Mã chỉ là lỗi hạ tầng nhưng chưa vào danh sách từ chối của chủ nó"
  nextStep_vi: "Người giám sát xếp mã vào failureCodes của đúng một luật mà nó phục vụ (mở rộng luật gần nhất nếu chưa ai nêu nghĩa vụ đó), xoá mã trùng hoặc lỗi thời cùng mọi tham chiếu, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_FORMAT:
  title: "Prettier is the only formatter"
  title_vi: "Chưa format bằng Prettier"
  meaning_vi: "`<file>` chưa được format. Chạy `npm run format`."
  causes_vi:
    - "Vi phạm luật R19: Prettier (config `@starci/prettier-config`) là formatter duy nhất; ESLint không còn luật định dạng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT_TOOL_MISSING:
  title: "The repository's own prettier is not installed"
  title_vi: "Kho chưa cài prettier của chính nó"
  meaning_vi: "Kiểm tra định dạng (R19) chạy prettier của chính kho. Kho chưa cài prettier nên không thể xác nhận định dạng, và trạng thái đó không bao giờ được tính là đạt."
  causes_vi:
    - "Chưa chạy `npm ci` trong kho"
    - "prettier không nằm trong devDependencies của kho"
  nextStep_vi: "Cài đúng phiên bản prettier ghi trong canon-pins.yaml (`npm ci`) rồi chạy lại `hfs check`."
  owner: op-retry
