    - "Hàm hoặc hằng được export từ lúc viết nhưng chỉ dùng trong chính tệp"
    - "Nơi dùng đã bị xóa hoặc đã chuyển sang hàm khác mà phần export còn lại"
  nextStep_vi: "Người giám sát bỏ từ khóa export nếu tên chỉ dùng trong tệp, hoặc xóa luôn phần khai báo nếu tệp cũng không dùng, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_ENV_UNCATALOGUED:
  title: "Environment variable not catalogued"
  title_vi: "Biến môi trường chưa có trong danh mục"
  meaning_vi: "Mã nguồn production của runtime đọc một biến môi trường (process.env.X, env.X, process.env['X'], destructuring từ env) hoặc viết tên một biến STARCI_* mà modules/schemas/env.yaml không có; hoặc một mục của danh mục thiếu purpose hoặc kind hợp lệ."
  causes_vi:
    - "Thêm một biến môi trường mới mà không ghi vào danh mục"
    - "Gõ sai tên một biến đã có"
  nextStep_vi: "Người giám sát thêm biến vào modules/schemas/env.yaml với một câu purpose và kind (config, seam, handoff hoặc host), hoặc sửa tên gõ sai, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_ENV_READ_OUTSIDE_OWNER:
  title: "Environment variable read outside its owner"
  title_vi: "Đọc biến môi trường ngoài nơi sở hữu"
  meaning_vi: "Một tệp production đọc trực tiếp một biến theo tên từ process.env (kể cả tên tính lúc chạy) thay vì qua scripts/lib/env.mjs (readEnv) hoặc một tham số env được truyền vào. Truyền cả process.env cho tiến trình con hoặc làm giá trị mặc định thì không bị tính."
  causes_vi:
    - "Đọc process.env.TEN ngay trong logic nghiệp vụ"
    - "Đọc process.env[ten] với tên tính lúc chạy trong một hàm tiện ích"
  nextStep_vi: "Người giám sát đổi sang readEnv('TEN') của scripts/lib/env.mjs, hoặc nhận một tham số env và đọc từ đó, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_TEST_ENV_IN_PRODUCTION:
  title: "Production code branches on the test runner"
  title_vi: "Mã production rẽ nhánh theo trình chạy test"
  meaning_vi: "Một tệp production đọc NODE_TEST_CONTEXT để biết mình đang chạy trong spec. Chỉ scripts/lib/env.mjs được quan sát trình chạy test, qua một hàm isSpecRun duy nhất."
  causes_vi:
    - "Thêm một nhánh bỏ qua việc chạm trạng thái thật của máy khi chạy spec bằng cách đọc NODE_TEST_CONTEXT trực tiếp"
  nextStep_vi: "Người giám sát gọi isSpecRun(env) của scripts/lib/env.mjs thay vì đọc NODE_TEST_CONTEXT, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_ENV_STALE_ENTRY:
  title: "Catalogued environment variable nothing reads"
  title_vi: "Biến môi trường trong danh mục không ai dùng"
  meaning_vi: "modules/schemas/env.yaml có một biến mà không tệp production nào đọc hoặc nhắc tên nữa."
  causes_vi:
    - "Mã đọc biến đã bị xóa nhưng mục danh mục còn lại"
  nextStep_vi: "Người giám sát xóa mục khỏi modules/schemas/env.yaml, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_SPEC_ASSERTS_SOURCE_TEXT:
  title: "Spec asserts the text of the implementation"
  title_vi: "Spec kiểm tra chữ của mã triển khai"
  meaning_vi: "Một spec (tests/ hoặc packages/*) đọc nội dung một tệp mã production của runtime (.mjs, .js, .ts dưới scripts/, engine/, modules/, bin/, ext/ hoặc ui/ của repo này, qua import.meta hoặc một hằng gốc repo) rồi kiểm tra bằng regex. Spec phải gọi hàm được export và kiểm tra giá trị trả về hoặc thứ nó ghi; tệp fixture do spec tự ghi vào thư mục tạm không bị tính."
  causes_vi:
    - "Dùng assert.match trên chuỗi mã nguồn để chứng minh một lời gọi tồn tại"
    - "Không có đường để chạy hàm thật nên đọc mã thay vì chạy"
  nextStep_vi: "Người giám sát viết lại spec để chạy hàm được export với phụ thuộc giả và kiểm tra kết quả, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_SPEC_SKIP_UNEXPLAINED:
  title: "Skipped test carries no reason"
  title_vi: "Test bị bỏ qua không có lý do"
  meaning_vi: "Một test bị skip (t.skip(), it.skip, { skip: điều kiện }) mà lệnh skip không mang lý do: không có chuỗi hoặc template nào mà giá trị skip có thể trả về, và không có định nghĩa một bước trong tệp tạo ra lý do. Skip im lặng báo xanh mà không chạy."
  causes_vi:
    - "{ skip: process.platform !== 'win32' } không nói thiếu gì"
    - "t.skip() gọi không đối số"
  nextStep_vi: "Người giám sát cấp thứ test cần để test chạy thật, hoặc viết lý do nói rõ thiếu gì và cái gì cung cấp nó, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_CODE_UNCATALOGUED:
  title: "Emitted failure code has no catalog entry"
  title_vi: "Mã lỗi được phát ra nhưng chưa có trong danh mục"
  meaning_vi: "Mã nguồn trong scripts/, engine/ hoặc modules/ phát ra một mã lỗi (chuỗi UPPER_SNAKE hoặc kebab ở vị trí mã) mà modules/kernel/failure-codes.yaml chưa có mục. Mỗi mã phải được giải thích đúng ngày nó được thêm."
  causes_vi:
    - "Thêm một mã mới trong mã nguồn mà không ghi vào danh mục"
    - "Một chuỗi giống mã nhưng thật ra là tên biến môi trường hoặc khóa"
  nextStep_vi: "Người giám sát thêm mục (title, title_vi, meaning_vi, causes_vi, nextStep_vi, owner, kind) vào danh mục, hoặc đưa tên không phải mã vào failure-codes.not-codes, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_CODE_STALE:
  title: "Catalogued failure code nothing emits"
  title_vi: "Mã lỗi trong danh mục không còn ai phát ra"
  meaning_vi: "modules/kernel/failure-codes.yaml có một mục cho một mã mà không tệp nguồn nào còn viết ra; mã đã nghỉ hưu phải rời danh mục."
  causes_vi:
    - "Mã nguồn phát ra mã đã bị xóa hoặc đổi tên mà mục danh mục còn lại"
  nextStep_vi: "Người giám sát xóa mục khỏi danh mục, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_CODE_MALFORMED:
  title: "Failure code entry is malformed"
  title_vi: "Mục mã lỗi sai khuôn"
  meaning_vi: "Một mục của modules/kernel/failure-codes.yaml thiếu hoặc sai một trường (title, title_vi, meaning_vi, nextStep_vi, owner, kind, causes_vi), hoặc owner/kind nằm ngoài tập đóng, hoặc owner other-op: trỏ tới op không có tệp manifest."
  causes_vi:
    - "Thêm mục mà quên một trường tiếng Việt"
    - "Owner hoặc kind gõ sai"
  nextStep_vi: "Người giám sát điền hoặc sửa trường bị nêu, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_CODE_SOLE_EMITTER:
  title: "Failure code whose only source is the rule catalog"
  title_vi: "Mã lỗi chỉ có danh mục luật làm nguồn"
  meaning_vi: "Một mã chỉ xuất hiện dạng chữ trong knowledge/hfs/rules.yaml và luật chứa nó không có enforcer nào của eslint, stylelint hoặc Sonar đã xây: một dòng danh mục không phải là nơi phát ra mã, nên mã sẽ không bao giờ được báo."
  causes_vi:
    - "Luật liệt kê mã nhưng enforcer chưa được xây hoặc đã bị xóa"
    - "Mã được thêm vào failureCodes của luật mà không có check nào phát ra"
  nextStep_vi: "Người giám sát xây enforcer báo mã đó, hoặc viết mã ở nơi một check thật sự phát ra nó, hoặc xóa mã khỏi luật, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_EXTERNAL_OWNER:
  title: "External system reached outside its owner"
  title_vi: "Gọi hệ thống bên ngoài ngoài nơi sở hữu nó"
  meaning_vi: "Trong mã nguồn runtime, một tệp import một module bên ngoài (node:child_process, node:http, node:sqlite...), gọi một hàm toàn cục (fetch) hoặc khởi chạy một chương trình (git, npm, orca, powershell, node...) mà ruleParams.runtime.infraOwners của knowledge/hfs/runtime-slots.yaml không giao cho thư mục của tệp đó. Chỉ scripts/api/<hệ thống>/ (và engine/db cho SQLite) được gọi ra bên ngoài."
  causes_vi:
    - "Gọi spawnSync/execFile hay fetch trực tiếp trong tầng nghiệp vụ hoặc trong scripts/lib"
    - "Một tệp api của hệ thống này khởi chạy chương trình của hệ thống khác"
  nextStep_vi: "Người giám sát chuyển lời gọi vào một tệp lệnh của scripts/api/<hệ thống>/ rồi gọi hàm đó, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_TIER_DIRECTION:
  title: "Runtime import against the tier direction"
  title_vi: "Import ngược chiều tầng của runtime"
  meaning_vi: "Một import tương đối giữa hai chủ sở hữu trong runtime đi từ một tầng tới một tầng không nằm trong mayImport của tầng đó (tiers.runtime trong knowledge/hfs/runtime-slots.yaml), ví dụ kernel import supervisor hay scripts/lib import một miền nghiệp vụ."
  causes_vi:
    - "Một dịch vụ dùng chung nằm ở tầng cao hơn nơi dùng nó"
    - "Thư viện cơ sở import mã nghiệp vụ"
  nextStep_vi: "Người giám sát chuyển phần dùng chung xuống tầng được phép (machine, lib) hoặc đảo chiều phụ thuộc, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_BASE_IMPURE:
  title: "Base tier writes or reads the environment"
  title_vi: "Tầng cơ sở ghi tệp hoặc đọc biến môi trường"
  meaning_vi: "Một tệp của tầng cơ sở (engine nền tảng, scripts/lib) gọi một hàm ghi của node:fs (writeFileSync, rmSync, mkdirSync...) hoặc đọc process.env ngoài các điểm khai báo trong ruleParams.runtime.baseEnvSeams. Tầng cơ sở chỉ chứa hàm thuần."
  causes_vi:
    - "Một hàm tiện ích tự ghi tệp thay vì trả dữ liệu cho nơi gọi"
    - "Đọc cấu hình từ biến môi trường bên trong thư viện"
  nextStep_vi: "Người giám sát chuyển thao tác ghi vào chủ sở hữu của nó (scripts/api/fs, engine/db hoặc một module nghiệp vụ) và truyền giá trị môi trường vào dưới dạng tham số."
  owner: supervisor
  kind: check-finding

RT_API_SHAPE:
  title: "api folder breaks its shape"
  title_vi: "Thư mục api sai hình dạng"
  meaning_vi: "Một tệp lệnh trong scripts/api/<hệ thống>/ export nhiều hơn một hàm hoặc không export hàm mang tên của tệp, một tệp bên ngoài hệ thống import lib.mjs của hệ thống đó, một hệ thống api import hệ thống khác, hoặc một tệp lệnh không phải là id trong hợp đồng calls của hệ thống."
  causes_vi:
    - "Thêm hằng số hay hàm phụ vào một tệp lệnh"
    - "Gọi thẳng trình chạy lib.mjs thay vì tệp lệnh"
  nextStep_vi: "Người giám sát tách mỗi lệnh thành một tệp riêng mang tên lệnh, chuyển hằng dùng chung vào lib.mjs của hệ thống và để nơi gọi dùng tệp lệnh."
  owner: supervisor
  kind: check-finding

RT_SPEC_PLACEMENT:
  title: "Runtime spec out of place"
  title_vi: "Spec của runtime đặt sai chỗ"
  meaning_vi: "Một spec của runtime không nằm ở tests/<khu vực>/<module>[.<chủ đề>].spec.mjs, mã dùng chung cho spec không nằm ở tests/helpers/, hoặc một tệp trong packages dùng hậu tố .test. thay vì .spec."
  causes_vi:
    - "Spec để phẳng ngay trong tests/"
    - "Tệp dùng chung có tiền tố _ ở gốc tests/"
  nextStep_vi: "Người giám sát chuyển tệp vào đúng thư mục bằng script di chuyển (rh-move.mjs) để import được viết lại, qua lane của chunk C7."
  owner: supervisor
  kind: check-finding

RT_SOURCE_NAME:
  title: "Runtime source name breaks the convention"
  title_vi: "Tên tệp nguồn runtime sai quy ước"
  meaning_vi: "Một tệp nguồn của runtime không đặt tên kebab-case, mang tên dùng một lần (_*, tmp-*, fix-*, *-backfill, migrate-*, *.bak*), hoặc trùng tên với một tệp khác trong cùng tầng (trừ lib.mjs và index.mjs)."
  causes_vi:
    - "Để lại một script dùng một lần trong cây nguồn"
    - "Hai module ở hai thư mục cùng tầng mang cùng một tên"
  nextStep_vi: "Người giám sát đổi tên tệp (bằng script di chuyển để import được viết lại) hoặc xóa script dùng một lần."
  owner: supervisor
  kind: check-finding

RT_PUBLIC_DOCS_INPUT:
  title: "Runtime public-docs input unavailable"
  title_vi: "Không kiểm tra được đầu vào JSDoc của API runtime"
  meaning_vi: "Bộ kiểm tra không đọc hoặc phân tích được source, tooling hay binding API được khai báo, nên không thể xác nhận tài liệu."
  causes_vi:
    - "Tooling TypeScript của các bộ kiểm tra chưa có hoặc không chạy được"
    - "Binding CLI hoặc API không có định nghĩa source rõ ràng và đọc được"
  nextStep_vi: "Khôi phục tooling và sửa binding hoặc source bị lỗi; chạy lại runtime-public-docs trước khi chấp nhận."
  owner: runtime-core
  kind: input-invalid

RT_PUBLIC_JSDOC:
  title: "Runtime public callable lacks a JSDoc description"
  title_vi: "API công khai của runtime thiếu mô tả JSDoc"
  meaning_vi: "Định nghĩa callable được contract native hoặc catalog CLI chọn không có JSDoc mô tả sát trước định nghĩa."
  causes_vi:
    - "Thiếu JSDoc hoặc phần mô tả chỉ có khoảng trắng, dấu câu hay type tags"
    - "Comment thuộc header, định nghĩa khác hoặc một chuỗi ký tự"
  nextStep_vi: "Viết mô tả chính xác cho contract của callable tại định nghĩa owning; review ý nghĩa riêng rồi chạy lại runtime-public-docs."
  owner: runtime-core
  kind: check-finding

GENERATED_UNTRACKED:
  title: "Tracked path under a generated root"
  title_vi: "Đường dẫn được git theo dõi dưới một gốc sinh tự động"
  meaning_vi: "Một tệp được git theo dõi nằm dưới một gốc sinh tự động của ruleParams.runtime.generated (knowledge/hfs/runtime-slots.yaml). Một gốc như vậy chỉ chứa thứ generatedBy của nó ghi ra (scripts/hfs/sync-runtime.mjs cho các bản sao runtime/ của gói) và đã được gitignore, nên index không bao giờ được giữ một bản sao cũ."
  causes_vi:
    - "Commit các tệp runtime/ của gói như mã nguồn thay vì để sync-runtime.mjs tái tạo"
    - "git add -f qua một mục .gitignore"
  nextStep_vi: "Người giám sát chạy git rm -r --cached trên gốc sinh tự động đó và giữ mục .gitignore của nó; chỉ generatedBy ghi vào đó."
  owner: supervisor
  kind: check-finding

RT_GENERATED_DRIFT:
  title: "Generated copy drifted"
  title_vi: "Bản sao sinh tự động bị lệch"
  meaning_vi: "Một bản sao sinh tự động trong packages/hfs/runtime, packages/eslint/be/runtime hoặc packages/eslint/fe/runtime khác với nội dung mà scripts/hfs/sync-runtime.mjs ghi ra từ nguồn duy nhất: thiếu, cũ, hoặc thừa tệp."
  causes_vi:
    - "Sửa một tệp nguồn được đóng gói mà quên chạy sync-runtime"
    - "Sửa tay một tệp trong thư mục runtime/ của gói"
  nextStep_vi: "Người giám sát chạy bước sinh bản sao runtime của kiểm tra (sync-runtime); các bản sao là kết quả sinh tự động đã gitignore nên không commit, và không sửa tay thư mục runtime/ của gói."
  owner: supervisor
  kind: check-finding

RT_CITED_PATH_MISSING:
  title: "Cited runtime path does not exist"
  title_vi: "Đường dẫn được trích dẫn không tồn tại"
  meaning_vi: "Văn bản đang dùng (modules ngoài lịch sử hợp đồng, docs, skills, knowledge, CONTEXT.md, README.md, CONTRIBUTING.md, init, tài liệu ui) trích dẫn một đường dẫn runtime không tồn tại."
  causes_vi:
    - "Di chuyển hay xóa tệp mà không cập nhật tài liệu"
    - "Gõ sai đường dẫn trong tài liệu"
  nextStep_vi: "Người giám sát sửa trích dẫn thành đường dẫn hiện tại hoặc xóa câu đó."
  owner: supervisor
  kind: check-finding

RT_ALLOWLIST_SPRAWL:
  title: "A second allowlist or baseline file exists"
  title_vi: "Có thêm một tệp allowlist hay baseline thứ hai"
  meaning_vi: "Một tệp được git theo dõi trông giống một danh sách cho phép ngoài modules/kernel/allowlist.yaml — theo hậu tố tên (.pending, .entries, .not-codes) hoặc theo tên (exceptions, baseline, allowlist trong một tệp yaml/json/txt), hoặc một tệp danh sách trần trong scripts/checks mà một reader nạp. Mọi ngoại lệ của một kiểm tra runtime là một mục có lý do trong một section của allowlist duy nhất."
  causes_vi:
    - "Một lane tạo tệp danh sách riêng thay vì thêm mục vào section của modules/kernel/allowlist.yaml"
    - "Một tệp allowlist cũ chưa được xóa sau khi nội dung của nó chuyển vào allowlist chung"
  nextStep_vi: "Người giám sát chuyển các mục (kèm nguyên lý do) vào section tương ứng của modules/kernel/allowlist.yaml qua scripts/lib/allowlist.mjs rồi xóa tệp riêng đó trong cùng commit."
  owner: supervisor
  kind: check-finding

RT_NODE_MODULES_LINK:
  title: "node_modules linked instead of installed"
  title_vi: "node_modules được liên kết thay vì cài đặt"
  meaning_vi: "Mã runtime tạo một junction hoặc symlink tới một thư mục node_modules (qua fs.symlinkSync, fs.promises.symlink, một hàm bọc chúng, hoặc một lệnh mklink /J, New-Item -ItemType Junction, ln -s được khởi chạy). Mỗi bản checkout phải tự cài phụ thuộc bằng npm ci thật từ bộ nhớ đệm; một liên kết vào node_modules của checkout khác bị lệnh xóa đệ quy hoặc npm đi xuyên qua và làm trống cây thật."
  causes_vi:
    - "Dùng chung node_modules của checkout chính cho một worktree tạm để tiết kiệm thời gian cài đặt"
    - "Giữ lại đoạn mã cũ tạo junction cho land scratch hoặc staging"
  nextStep_vi: "Người giám sát thay liên kết bằng npm ci thật qua scripts/api/npm/ci.mjs; chỉ giữ mã gỡ hoặc phát hiện liên kết đã có."
  owner: supervisor
  kind: check-finding

RT_CONTROL_CHARACTER:
  title: "Raw control character in source"
  title_vi: "Ký tự điều khiển thô trong mã nguồn"
  meaning_vi: "Một tệp văn bản được git theo dõi (mjs, cjs, js, ts, tsx, yaml, md, json) chứa ký tự điều khiển thô (U+0000 đến U+001F trừ tab, LF, CR, và U+007F). NUL thô làm git và grep coi tệp là nhị phân; backspace thô trong biểu thức chính quy không còn nghĩa \\b như khi gõ."
  causes_vi:
    - "Một lần sửa bằng script ghi chuỗi \\b hoặc \\0 thành ký tự thật"
  nextStep_vi: "Người giám sát thay ký tự đó bằng dạng thoát của nó (\\0, \\b, \\u001b) để tệp giữ đúng nghĩa ban đầu."
  owner: supervisor
  kind: check-finding

RT_ABSOLUTE_PATH:
  title: "Hard-coded absolute host path"
  title_vi: "Đường dẫn tuyệt đối của máy bị ghi cứng"
  meaning_vi: "Một tệp được git theo dõi của runtime chứa đường dẫn tuyệt đối của máy chủ: đường dẫn có ổ đĩa (chữ cái ổ đĩa, dấu hai chấm và dấu gạch), đường dẫn hồ sơ người dùng (/Users/<tên>/, /home/<tên>/) hoặc đường dẫn AppData đã khai triển. Kho .claude dùng đường dẫn tương đối; đường dẫn ghi cứng chỉ chạy trên một máy và làm lộ tên người dùng."
  causes_vi:
    - "Một lane ghi đường dẫn máy của nó vào mã, tài liệu, tri thức, ví dụ hoặc dữ liệu thử"
    - "Một spec dựng fixture từ ổ đĩa ghi cứng thay vì thư mục tạm của nó"
  nextStep_vi: "Người giám sát đổi đường dẫn thành đường dẫn tương đối hoặc tên giữ chỗ (<runtime>/..., %LOCALAPPDATA% chưa khai triển), cho mã lấy đường dẫn từ gốc runtime, os.tmpdir(), cấu hình hoặc hàm gốc trạng thái, và cho spec dựng fixture từ thư mục tạm."
  owner: supervisor
  kind: check-finding

RT_PINNED_PATH_MOVED:
