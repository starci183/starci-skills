  causes_vi:
    - "Vi phạm luật R55: Client component không nhập `server-only`, `next/headers`, module Node hay `modules/api/**/read-*`; đọc dữ liệu ở server component rồi truyền xuống bằng props, hoặc gọi client của app qua SWR."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_SERVER_ONLY_MARK:
  title: "A module that uses the server starts with import server-only"
  title_vi: "Module dùng API server không có dấu server-only"
  meaning_vi: "Module `<file>` nhập `<what>` (`next/headers`, `next/server`, `next-intl/server`, module Node hoặc một module đã là server-only) nhưng không mở đầu bằng `import \"server-only\"`, nên không gì chặn client component nhập nó trực tiếp hoặc qua hook."
  causes_vi:
    - "Vi phạm luật R55: Module dùng API chỉ có ở server mở đầu bằng `import \"server-only\"` (tệp route `page`/`layout`/`route`/`proxy` là server component sẵn, không cần)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_STORAGE_OUTSIDE_MODULES:
  title: "Web storage only inside modules"
  title_vi: "Dùng localStorage/sessionStorage ngoài modules/"
  meaning_vi: "`<file>` đọc hoặc ghi `localStorage`/`sessionStorage` ngoài `modules/`. Storage không tồn tại ở server và ném lỗi khi đầy hạn mức, nên render server và hydrate lệch nhau."
  causes_vi:
    - "Vi phạm luật R55: Chỉ `modules/**` được chạm web storage, sau một hook hoặc module có bảo vệ (`typeof window`, try/catch); block gọi hook đó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_DANGEROUS_HTML:
  title: "dangerouslySetInnerHTML only on script"
  title_vi: "dangerouslySetInnerHTML trên phần tử hiển thị"
  meaning_vi: "`<tag>` ở `<file>` dùng `dangerouslySetInnerHTML`: chuỗi bất kỳ (của người dùng, nhà cung cấp, catalog) trở thành mã HTML chạy được."
  causes_vi:
    - "Vi phạm luật R55: Chỉ được `dangerouslySetInnerHTML` trên `<script>` mang JSON-LD hoặc mã khởi tạo theme từ hằng số do app viết; nội dung khác render thành phần tử."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_ROUTE_HARDCODED:
  title: "A route is built by modules/routes"
  title_vi: "Đường dẫn route viết tay"
  meaning_vi: "`<path>` ở `<file>` là route viết thẳng ở nơi gọi. Route đổi chỗ thì mọi bản sao trỏ vào 404 mà không kiểm tra kiểu nào bắt được."
  causes_vi:
    - "Vi phạm luật R57: Mọi href và lời gọi điều hướng (`router.push`, `redirect`) dùng hàm dựng href của `modules/routes`, không viết chuỗi đường dẫn ở nơi gọi."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_I18N_NAVIGATION:
  title: "Navigation from modules/i18n/navigation"
  title_vi: "Điều hướng không đi qua next-intl"
  meaning_vi: "`<file>` dùng `next/link`, `useRouter`, `usePathname`, `redirect` của Next hoặc thẻ `<a>` cho route nội bộ: mất tiền tố `[locale]`, mất prefetch, tải lại cả trang."
  causes_vi:
    - "Vi phạm luật R59: `Link`, `useRouter`, `usePathname`, `redirect` lấy từ `modules/i18n/navigation`; liên kết ngoài mở tab mới phải có `rel=\"noopener noreferrer\"`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_I18N_FORMATTER:
  title: "Numbers, money and dates through the next-intl formatter"
  title_vi: "Định dạng số, tiền, ngày ngoài formatter của next-intl"
  meaning_vi: "`<file>` định dạng bằng `<what>` (`toLocale*String`, `new Intl.*`, `toFixed` hiển thị, ký hiệu tiền dán vào template hoặc thư viện ngày) thay vì formatter của next-intl, nên locale và múi giờ lệch giữa server và trình duyệt."
  causes_vi:
    - "Vi phạm luật R59: Số, tiền, ngày dùng `useFormatter()` / `getFormatter()` của next-intl; định dạng dùng chung khai báo một lần trong `modules/i18n`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_NATIVE_IMAGE:
  title: "next/image with a reserved size"
  title_vi: "Ảnh thô hoặc next/image thiếu kích thước"
  meaning_vi: "`<file>` dùng `<img>` thô, hoặc `Image` không có `width` và `height` (hay `fill` mà không có `sizes`): trình duyệt không giữ chỗ nên trang nhảy khi ảnh tải xong."
  causes_vi:
    - "Vi phạm luật R62: Ảnh dùng `Image` của `next/image` với `width`+`height` hoặc `fill`+`sizes`; alt lấy từ catalog thông điệp."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_LIST_KEY:
  title: "List rows have a stable key and stable props"
  title_vi: "Danh sách thiếu key ổn định"
  meaning_vi: "`.map` ở `<file>` trả phần tử không có `key`, dùng chỉ số hoặc giá trị ngẫu nhiên làm `key`, hoặc truyền object/array literal cho component trong danh sách; hàng bị đổi state khi xoá hoặc sắp xếp lại, và memo không bao giờ trúng."
  causes_vi:
    - "Vi phạm luật R65: Phần tử trong `.map` có `key` lấy từ id của dữ liệu (không dùng index, `Math.random`, `Date.now`), và không truyền object/array literal cho component trong danh sách; hằng số được nâng ra ngoài."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_EFFECT_CLEANUP:
  title: "What an effect starts, its cleanup releases"
  title_vi: "Effect khởi động thứ không được dọn"
  meaning_vi: "`<what>` ở `<file>` (timer, frame, listener, observer, socket hoặc subscription) do effect hoặc `subscribe` khởi động, nhưng cleanup trả về không giải phóng đúng handle, target và listener đó; nó chạy tiếp sau khi component đã gỡ và set state vào chỗ không còn."
  causes_vi:
    - "Vi phạm luật R65: mọi thứ effect hoặc `subscribe` khởi động được cleanup trả về giải phóng cùng handle, target và listener (`clearTimeout(id)`, `cancelAnimationFrame(id)`, `removeEventListener` cùng type và listener, `.disconnect()`, `.close()`, `.unsubscribe()`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_SWALLOWED_ERROR:
  title: "No empty catch"
  title_vi: "catch rỗng nuốt lỗi"
  meaning_vi: "`catch` hoặc `.catch(() => {})` ở `<file>` không làm gì: lỗi biến mất, người dùng không thấy thông báo, đội không có dấu vết."
  causes_vi:
    - "Vi phạm luật R65: Mỗi `catch` trả một outcome có kiểu mang nguyên nhân, hiển thị trạng thái lỗi hoặc ném lại."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_CONSOLE_CALL:
  title: "No console in product source"
  title_vi: "console.* trong mã sản phẩm"
  meaning_vi: "`console.<method>` ở `<file>` không đi vào pipeline log nào, lộ chi tiết nội bộ trong devtools của người dùng và che mất việc xử lý thật."
  causes_vi:
    - "Vi phạm luật R65: Không `console.*` trong mã sản phẩm; trả outcome có kiểu, hiển thị trạng thái lỗi, hoặc để lỗi tới `error.tsx`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_NEXT_CONVENTIONS:
  title: "A Next convention of HFS is broken"
  title_vi: "Vi phạm quy ước Next của HFS"
  meaning_vi: "Một tệp dùng tên hoặc cách viết cũ của Next: middleware thay vì proxy.ts (từ Next 16), thiếu generateMetadata trên page, turbopack.root sai, hoặc dev và build dùng hai bundler khác nhau. Đây là kiểm tra con của R54 và R02."
  causes_vi:
    - "Đặt tên tệp middleware.ts trên Next 16 trở lên"
    - "Page không có generateMetadata"
    - "turbopack.root trỏ sai gốc workspace"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_RULES_INVALID:
  title: "HFS rule catalog is invalid"
  title_vi: "Danh mục luật HFS không hợp lệ"
  meaning_vi: "Tệp knowledge/hfs/rules.yaml không đúng schema hoặc vi phạm một quy tắc ngữ nghĩa (thứ tự R01 đến R67, một mã lỗi chỉ thuộc một luật, luật chạy ở cổng land, luật pre-commit cũng chạy ở pre-push, cổng sonar đi cùng enforcer sonar), nên không luật nào được nạp."
  causes_vi:
    - "Sửa tay rules.yaml và gõ sai một trường"
    - "Thêm luật mà không đủ enforcer, cổng hoặc mã lỗi"
    - "Major của rules.yaml khác major của slots.yaml"
  nextStep_vi: "Người giám sát sửa knowledge/hfs/rules.yaml theo modules/schemas/hfs-rules.schema.yaml qua một lane đã land; kho sản phẩm không sửa danh mục này."
  owner: supervisor
  kind: check-finding

HFS_RULE_NO_ENFORCER:
  title: "HFS rule has no enforcer"
  title_vi: "Luật HFS không có enforcer"
  meaning_vi: "Một luật trong danh mục không có enforcer nào, hoặc mang loại lint hoặc check mà không có enforcer thuộc họ đó; luật chỉ nằm trên giấy thì không ai chặn được vi phạm."
  causes_vi:
    - "Thêm luật mới mà chưa khai enforcer"
    - "Xoá enforcer cuối cùng của một luật"
  nextStep_vi: "Người giám sát khai ít nhất một enforcer cho luật (kể cả status: planned nếu còn nợ) qua một lane đã land; agent không thay thế bằng phê duyệt."
  owner: supervisor
  kind: check-finding

HFS_RULE_ENFORCER_MISSING:
  title: "Named enforcer does not exist"
  title_vi: "Enforcer được khai không tồn tại"
  meaning_vi: "Danh mục khai một enforcer là luật ESLint, tệp kiểm tra hoặc tệp phát mã lỗi, nhưng luật ESLint không có trong plugin, hoặc tệp không tồn tại hay không phát mã lỗi nào của luật."
  causes_vi:
    - "Đổi tên hoặc xoá luật ESLint trong plugin mà không sửa rules.yaml"
    - "Khai một enforcer chưa được viết mà quên status: planned"
    - "Tệp kiểm tra bị di chuyển"
  nextStep_vi: "Người giám sát sửa rules.yaml cho khớp với plugin và tệp thật, hoặc đánh dấu status: planned cho phần còn nợ, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_ENFORCER_PLANNED:
  title: "Rule enforcer still planned"
  title_vi: "Enforcer của luật vẫn còn nợ"
  meaning_vi: "Danh mục knowledge/hfs/rules.yaml còn một enforcer đánh dấu status: planned. Theo tiêu chí nghiệm thu của chủ dự án, mọi luật đều có bộ kiểm tra ở mức error ngay khi bộ chuẩn phát hành; một enforcer còn nợ là một lỗ hổng."
  causes_vi:
    - "Thêm luật mới vào danh mục trước khi viết bộ kiểm tra"
    - "Gỡ một bộ kiểm tra nhưng quên xóa mục enforcer"
  nextStep_vi: "Người giám sát viết enforcer (kèm ca vi phạm và ca hợp lệ) hoặc xóa mục đó khỏi danh mục, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_ENFORCER_STALE:
  title: "Planned enforcer already ships"
  title_vi: "Enforcer đánh dấu còn nợ đã có sẵn"
  meaning_vi: "Danh mục ghi một luật ESLint là status: planned, nhưng plugin đã có luật đó; danh sách nợ đang sai so với thực tế."
  causes_vi:
    - "Lane viết luật ESLint đã land mà không gỡ status: planned"
  nextStep_vi: "Người giám sát gỡ status: planned của enforcer đó trong knowledge/hfs/rules.yaml qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_LAW_DRIFT:
  title: "Rule table in the HFS README differs from the catalog"
  title_vi: "Bảng luật trong README lệch danh mục"
  meaning_vi: "Bảng luật ở mục 12 của knowledge/hfs/README.md phải có đúng mỗi luật của knowledge/hfs/rules.yaml với cùng mã và cùng câu luật, và không ghi một khoảng R01..Rnn khác danh mục; hai bản khác nhau thì người đọc và máy hiểu luật khác nhau."
  causes_vi:
    - "Sửa câu luật ở một nơi"
    - "Thêm luật mới vào danh mục mà không thêm dòng README"
    - "Ghi số lượng luật bằng tay"
  nextStep_vi: "Người giám sát chép câu luật từ rules.yaml vào dòng README (rules.yaml là nguồn), qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_CODE_UNCATALOGUED:
  title: "Rule failure code is not explained"
  title_vi: "Mã lỗi của luật chưa được giải thích"
  meaning_vi: "Một mã lỗi của luật không có mục trong modules/kernel/failure-codes.yaml, hoặc mục đó thiếu title_vi, meaning_vi hoặc nextStep_vi bằng tiếng Việt, nên agent không đọc được lý do và bước tiếp theo."
  causes_vi:
    - "Thêm mã lỗi vào rules.yaml mà quên thêm vào danh mục mã lỗi"
    - "Viết title_vi, meaning_vi hoặc nextStep_vi bằng tiếng Anh"
  nextStep_vi: "Người giám sát thêm hoặc sửa mục trong modules/kernel/failure-codes.yaml với đủ tiêu đề, ý nghĩa và bước tiếp theo bằng tiếng Việt, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_CODE_UNEMITTED:
  title: "Rule code that no enforcer emits"
  title_vi: "Mã lỗi của luật không có bộ kiểm tra nào phát ra"
  meaning_vi: "Danh mục knowledge/hfs/rules.yaml khẳng định mọi enforcer của luật đã có, nhưng không luật ESLint nào báo mã của luật và không tệp kiểm tra (máy kiến trúc, hfs, work-validate) nào viết mã đó; mã chỉ tồn tại trên giấy."
  causes_vi:
    - "Đổi tên mã trong bộ kiểm tra mà không đổi trong danh mục"
    - "Gỡ status: planned trước khi bộ kiểm tra phát ra mã"
  nextStep_vi: "Người giám sát sửa danh mục hoặc bộ kiểm tra để mã được phát ra đúng tên, hoặc đánh dấu enforcer còn nợ bằng status: planned, qua một lane đã land."
  owner: supervisor
  kind: check-finding

WORK_YAML_UNPARSEABLE:
  title: "Work YAML cannot be parsed"
  title_vi: "Tệp YAML của Work không đọc được"
  meaning_vi: "Runtime dùng một trình đọc YAML duy nhất và tệp trong .starciwork không qua được trình đọc đó, nên mọi op đọc bản ghi này sẽ hỏng."
  causes_vi:
    - "Dấu hai chấm kèm khoảng trắng nằm trong một giá trị chuỗi không đặt trong dấu nháy"
    - "Thụt lề sai hoặc thiếu dấu đóng ngoặc"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; đặt giá trị có dấu hai chấm vào dấu nháy hoặc sửa cú pháp tại dòng được nêu rồi làm lại."
  owner: op-retry
  kind: check-finding

WORK_VALIDATE_REFUSED:
  title: "Staged Work record fails its validation"
  title_vi: "Bản ghi Work vừa sửa không qua kiểm tra hợp lệ"
  meaning_vi: "Kiểm tra work-validate chạy ở chế độ strict trên thư mục bản ghi vừa sửa và có lỗi nằm ngay trong các tệp đó (sai schema, tham chiếu không tồn tại, thiếu trường bắt buộc)."
  causes_vi:
    - "Bản ghi sai schema hoặc thiếu trường bắt buộc"
    - "Tham chiếu tới bản ghi hoặc tài nguyên không tồn tại"
