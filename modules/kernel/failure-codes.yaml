  causes_vi:
    - "Cần quyết định, thông tin xác thực hoặc phê duyệt từ chủ dự án"
  nextStep_vi: "Job bị giữ không được coi là sẵn sàng và watchdog không đánh thức Kernel vì nó. Chủ dự án xử lý cổng thì việc mới chạy tiếp."
