  kind: check-finding

FE_TRANSPORT_OWNER:
  title: "One `fetch`, in the repository's one transport client, with timeout and abort"
  title_vi: "fetch ngoài client duy nhất"
  meaning_vi: "`fetch` ở `<file>` ngoài client truyền tải duy nhất của repository (gọi, gán lại hoặc truyền như giá trị), thư viện HTTP khác được import, reader `read-*.ts` không đi qua client, repository có nhiều hơn một client hoặc nhiều hơn một union `Outcome` (mỗi app giữ một bản, hoặc gói api cộng thêm một bản của app), hoặc state dùng chung dạng `let`."
  causes_vi:
    - "Vi phạm luật R50: Mỗi repository đúng một client `fetch`, có timeout + `AbortSignal`: `packages/<family>-api/src/client.ts` khi các app dùng chung, hoặc `modules/api/client.ts` của app duy nhất; không singleton `let` giữ token/locale; credential truyền bằng tham số/context."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_HTTP_STATUS_COLLAPSE:
  title: "One `Outcome<T>`; 401 and 403 become `refused`"
  title_vi: "Gộp mọi mã HTTP thành một nhánh"
