  title_vi: "Enforcer đánh dấu còn nợ đã có sẵn"
  meaning_vi: "Danh mục ghi một luật ESLint là status: planned, nhưng plugin đã có luật đó; danh sách nợ đang sai so với thực tế."
  causes_vi:
    - "Lane viết luật ESLint đã land mà không gỡ status: planned"
  nextStep_vi: "Người giám sát gỡ status: planned của enforcer đó trong knowledge/hfs/rules.yaml qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_CODE_UNCATALOGUED:
  title: "Rule failure code is not explained"
  title_vi: "Mã lỗi của luật chưa được giải thích"
  meaning_vi: "Một mã lỗi của luật không có mục trong modules/kernel/failure-codes.yaml, hoặc mục đó thiếu title_vi, meaning_vi hoặc nextStep_vi bằng tiếng Việt, nên agent không đọc được lý do và bước tiếp theo."
  causes_vi:
    - "Thêm mã lỗi vào rules.yaml mà quên thêm vào danh mục mã lỗi"
    - "Viết title_vi, meaning_vi hoặc nextStep_vi bằng tiếng Anh"
  nextStep_vi: "Người giám sát thêm hoặc sửa mục trong modules/kernel/failure-codes.yaml với đủ tiêu đề, ý nghĩa và bước tiếp theo bằng tiếng Việt, qua một lane đã land."
  owner: supervisor
  kind: check-finding

HFS_RULE_CODE_UNEMITTED:
  title: "Rule code that no enforcer emits"
  title_vi: "Mã lỗi của luật không có bộ kiểm tra nào phát ra"
  meaning_vi: "Danh mục knowledge/hfs/rules.yaml khẳng định mọi enforcer của luật đã có, nhưng không luật ESLint nào báo mã của luật và không tệp kiểm tra (máy kiến trúc, hfs, work-validate) nào viết mã đó; mã chỉ tồn tại trên giấy."
  causes_vi:
    - "Đổi tên mã trong bộ kiểm tra mà không đổi trong danh mục"
    - "Gỡ status: planned trước khi bộ kiểm tra phát ra mã"
  nextStep_vi: "Người giám sát sửa danh mục hoặc bộ kiểm tra để mã được phát ra đúng tên, hoặc đánh dấu enforcer còn nợ bằng status: planned, qua một lane đã land."
  owner: supervisor
  kind: check-finding

WORK_YAML_UNPARSEABLE:
  title: "Work YAML cannot be parsed"
  title_vi: "Tệp YAML của Work không đọc được"
  meaning_vi: "Runtime dùng một trình đọc YAML duy nhất và tệp trong .starciwork không qua được trình đọc đó, nên mọi op đọc bản ghi này sẽ hỏng."
  causes_vi:
    - "Dấu hai chấm kèm khoảng trắng nằm trong một giá trị chuỗi không đặt trong dấu nháy"
    - "Thụt lề sai hoặc thiếu dấu đóng ngoặc"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; đặt giá trị có dấu hai chấm vào dấu nháy hoặc sửa cú pháp tại dòng được nêu rồi làm lại."
  owner: op-retry
  kind: check-finding

WORK_VALIDATE_REFUSED:
  title: "Staged Work record fails its validation"
  title_vi: "Bản ghi Work vừa sửa không qua kiểm tra hợp lệ"
  meaning_vi: "Kiểm tra work-validate chạy ở chế độ strict trên thư mục bản ghi vừa sửa và có lỗi nằm ngay trong các tệp đó (sai schema, tham chiếu không tồn tại, thiếu trường bắt buộc)."
  causes_vi:
    - "Bản ghi sai schema hoặc thiếu trường bắt buộc"
    - "Tham chiếu tới bản ghi hoặc tài nguyên không tồn tại"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; sửa đúng các lỗi được liệt kê (chỉ tính lỗi thuộc tệp vừa sửa) rồi làm lại."
  owner: op-retry
  kind: check-finding

WORK_SECRET_FILE:
  title: "Secret file inside Work or stacks"
  title_vi: "Tệp bí mật nằm trong Work hoặc stacks"
  meaning_vi: "Đường dẫn của tệp đã là một bí mật (tệp .env, khóa riêng, thư mục secrets chưa mã hóa) và không được đưa vào git."
  causes_vi:
    - "Tệp .env hoặc khóa riêng bị add nhầm"
    - "Bản bí mật chưa mã hóa đặt trong .starcistacks/<stack>/secrets"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; bỏ tệp khỏi commit, giữ bản mã hóa .enc và để bản rõ ngoài git."
  owner: op-retry
  kind: check-finding

WORK_SECRET_PATTERN:
  title: "Token or private key inside Work or stacks"
  title_vi: "Token hoặc khóa riêng nằm trong Work hoặc stacks"
  meaning_vi: "Nội dung tệp khớp một dạng bí mật đã biết (khóa riêng PEM, token của nhà cung cấp, JWT, giá trị gán cho password/secret/apiKey) và tệp không phải .enc."
  causes_vi:
    - "Dán token hoặc khóa thật vào bản ghi hoặc ghi chú"
    - "Bằng chứng chụp lại chứa giá trị thật"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; xóa giá trị khỏi tệp, dùng tham chiếu tới kho bí mật mã hóa, và xoay khóa nếu nó đã lộ."
  owner: op-retry
  kind: check-finding

WORK_SECRET_LITERAL:
  title: "Literal credential in a credential-shaped field"
  title_vi: "Giá trị bí mật viết thẳng trong trường mật khẩu hoặc token"
  meaning_vi: "Một trường tên password, secret, token, apiKey hoặc credential mang giá trị thật thay vì tham chiếu; tệp nằm trong .starciwork hoặc .starcistacks và không phải .enc."
  causes_vi:
    - "Mật khẩu hoặc token viết thẳng vào bản ghi"
    - "Giá trị mẫu thật thay vì tham chiếu hay giá trị giả rõ ràng"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; chuyển giá trị vào kho mã hóa (.enc) và ghi tham chiếu, hoặc dùng giá trị giả có ghi rõ là mẫu."
  owner: op-retry
  kind: check-finding

WORK_ACCOUNT_LITERAL:
  title: "Literal login in an accounts record"
  title_vi: "Tên đăng nhập viết thẳng trong bản ghi tài khoản"
  meaning_vi: "Tệp accounts.yaml khai username, login hoặc email thật; tài khoản phải được gọi bằng tham chiếu identity, còn thông tin đăng nhập nằm trong kho mã hóa."
  causes_vi:
    - "Ghi thẳng tài khoản thử nghiệm vào bản ghi"
  nextStep_vi: "Commit hoặc chốt op bị từ chối; thay bằng identity tham chiếu và để thông tin đăng nhập trong kho mã hóa .enc."
  owner: op-retry
  kind: check-finding
work-hygiene-red:
  title: "Work files changed by the op fail parse, validation or secret scan"
  title_vi: "Tệp Work do op sửa không qua kiểm tra đọc, hợp lệ hoặc quét bí mật"
  meaning_vi: "Trước khi chốt, runtime chạy lại đúng kiểm tra mà hook pre-commit chạy (đọc YAML, validate strict theo tệp đã sửa, quét bí mật) trên các tệp trong .starciwork hoặc .starcistacks mà op đã sửa và có tệp đỏ."
  causes_vi:
    - "YAML không đọc được hoặc bản ghi sai schema"
    - "Mật khẩu, token hoặc tài khoản viết thẳng trong tệp không mã hóa"
  nextStep_vi: "Việc giữ nguyên, không chốt; op sửa các tệp được nêu, commit lại rồi chốt lại."
  owner: op-retry
  kind: settle-reason

sonar-gate-red:
  title: "Sonar quality gate is red on the change"
  title_vi: "Cổng chất lượng Sonar đỏ trên phần code vừa sửa"
  meaning_vi: "Phần code op vừa thay đổi không đạt cổng Sonar chung: có lỗi mức blocker hoặc critical, hotspot bảo mật chưa xem xét, trùng lặp vượt ngưỡng, hoặc độ phủ dòng mới thấp hơn ngưỡng (knowledge/sonar-gate.yaml)."
  causes_vi:
    - "Có issue blocker hoặc critical nằm trên dòng đã sửa"
    - "Có hotspot bảo mật ở trạng thái chờ xem xét trên dòng đã sửa"
    - "Tỷ lệ trùng lặp trên dòng mới vượt ngưỡng"
    - "Độ phủ kiểm thử của dòng mới thấp hơn ngưỡng"
  nextStep_vi: "Việc chốt bị từ chối; op sửa đúng các mục nêu trong summary sonar.json, thêm spec cho dòng mới, chạy lại sonar-local rồi nộp lại. Nợ cũ ngoài phần đã sửa không bị tính."
  owner: op-retry
  kind: settle-reason
sonar-unavailable:
  title: "Sonar is unavailable, so the change was not judged"
  title_vi: "Sonar không khả dụng nên chưa chấm được phần code vừa sửa"
  meaning_vi: "Máy chủ SonarQube cục bộ không chạy, thiếu khóa truy cập trong kho bảo quản hoặc khóa bị từ chối, nên cổng chất lượng không thể chấm. Runtime không cho op chốt xong khi chưa có kết quả Sonar, và đã báo cho Supervisor."
  causes_vi:
    - "Container starci-sonarqube chưa chạy hoặc Docker tắt"
    - "Khóa dự án Sonar thiếu hoặc bị máy chủ từ chối"
    - "Máy chủ đang khởi động hoặc trả lỗi"
  nextStep_vi: "Supervisor khởi động lại SonarQube hoặc sửa kho khóa (không hỏi owner); sau đó chạy lại quét sonar-local trên phần code này rồi chốt lại."
  owner: supervisor
  kind: settle-reason
sonar-scan-refused:
  title: "Sonar scan was refused before it ran"
  title_vi: "Lần quét Sonar bị từ chối trước khi chạy"
  meaning_vi: "sonar-local không quét vì đầu vào của lần này chưa hợp lệ (báo cáo độ phủ cũ hoặc thiếu, mốc nền không có thật), nên chưa có phán quyết cổng chất lượng."
  causes_vi:
    - "Báo cáo lcov cũ hơn commit đầu hoặc không tồn tại"
    - "Mốc --base không phải commit của repository"
  nextStep_vi: "Việc chốt bị từ chối; op chạy lại spec có độ phủ trong lần thử này và quét lại với --base đúng."
  owner: op-retry
  kind: settle-reason
sonar-proof-missing:
  title: "No Sonar result is attached"
  title_vi: "Chưa đính kèm kết quả Sonar"
  meaning_vi: "Op sửa code nhưng report không đính kèm sonar.json (bản tóm tắt quét slice) hợp lệ, hoặc bản đó không phải phán quyết của slice, nên runtime không có gì để chấm."
  causes_vi:
    - "Op chưa chạy sonar-local scan"
    - "Quét không dùng --wait nên chỉ mới gửi đi"
    - "Tệp sonar.json không được đính kèm vào starci kernel report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy sonar-local scan --wait trên phần code đã sửa và đính kèm sonar.json khi nộp report."
  owner: op-retry
  kind: settle-reason

op-gate-proof-missing:
  title: "No gate result is attached"
  title_vi: "Chưa đính kèm kết quả cổng kiểm tra"
  meaning_vi: "Op viết code nhưng report không đính kèm gate.json (schema starci/gate@1) do `starci gate run` in ra, nên runtime không có gì để chấm vòng kiểm tra bắt buộc."
  causes_vi:
    - "Op chưa chạy gate.mjs sau khi viết code"
    - "Tệp gate.json không được đính kèm vào starci kernel report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy starci gate run --root <app> --changed <tệp> --out gate.json và đính kèm gate.json khi nộp report."
  owner: op-retry
  kind: settle-reason

op-gate-tool-failed:
  title: "A gate tool could not run"
  title_vi: "Một công cụ của cổng kiểm tra không chạy được"
  meaning_vi: "gate.json báo exit 2: starci app lint, codegen, build gói, tsc hoặc jest không chạy được, nên phần code chưa được chấm. Công cụ không chạy được không bao giờ là đạt."
  causes_vi:
    - "Thiếu gói trong node_modules của app (eslint, typescript, prettier, jest)"
    - "Script codegen hoặc build của gói fe bị lỗi"
    - "Không xác định được commit gốc để so sánh"
  nextStep_vi: "Việc chốt bị từ chối; op sửa nguyên nhân môi trường được nêu trong errors của gate.json rồi chạy lại cổng, hoặc chốt blocked với lỗi đó. Không bao giờ chốt done khi thiếu cổng."
  owner: op-retry
  kind: settle-reason

op-gate-new-findings:
  title: "The gate reports new findings"
  title_vi: "Cổng kiểm tra báo lỗi mới"
  meaning_vi: "gate.json còn lỗi mà commit gốc không có: lỗi lint (theo tệp và luật), lỗi tsc (theo thông điệp đã chuẩn hóa) hoặc spec thất bại. Lỗi đã có sẵn trên commit gốc không bị tính."
  causes_vi:
    - "Code mới vi phạm luật lint của canon BE hoặc FE"
    - "Code mới gây lỗi kiểu TypeScript"
    - "Spec của slice thất bại"
  nextStep_vi: "Việc chốt bị từ chối; op sửa đúng các lỗi liệt kê rồi chạy lại cổng, tối đa params.gateRounds vòng. Hết số vòng mà vẫn đỏ thì chốt blocked kèm danh sách lỗi, không bao giờ done."
  owner: op-retry
  kind: settle-reason

op-read-digest-missing:
  title: "The op skipped READ"
  title_vi: "Op đã bỏ qua bước ĐỌC"
  meaning_vi: "Report không đính kèm bản tóm tắt ĐỌC (read-digest.json, schema starci/read-digest@1): không có bằng chứng op đã đọc tệp pattern, ví dụ và bản đồ slot trước khi viết code."
  causes_vi:
    - "Op viết code ngay mà không chạy scripts/gates/read-digest.mjs"
    - "Tệp read-digest.json không được đính kèm vào starci kernel report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy read-digest.mjs --touch <tệp> --out read-digest.json, đọc đúng các tệp nó liệt kê, kiểm lại code theo đó rồi nộp lại kèm read-digest.json."
  owner: op-retry
  kind: settle-reason

op-read-digest-no-pattern:
  title: "The READ digest names no pattern for a touched file kind"
  title_vi: "Bản tóm tắt ĐỌC thiếu tệp pattern cho loại tệp đã sửa"
  meaning_vi: "Với ít nhất một tệp op đã sửa, bản tóm tắt ĐỌC không nêu tệp pattern nào thuộc loại tệp đó (knowledge/op-gate.yaml kinds, theo slot mà starci app explain trả về)."
  causes_vi:
    - "Op sửa thêm tệp ngoài danh sách --touch lúc đọc"
    - "Bản tóm tắt được tạo cho slice khác"
  nextStep_vi: "Việc chốt bị từ chối; op chạy lại read-digest.mjs với mọi tệp đã sửa, đọc các tệp pattern còn thiếu, kiểm lại code rồi nộp lại."
  owner: op-retry
  kind: settle-reason

op-read-digest-no-knowledge:
  title: "The READ digest cites no standard"
  title_vi: "Bản tóm tắt ĐỌC không dẫn chuẩn nào"
  meaning_vi: "Op quyết định hoặc viết tài liệu nhưng bản tóm tắt ĐỌC không nêu tệp knowledge nào (knowledge/patterns hay tệp --knowledge) kèm sha256, hoặc có bản ghi đã viết không có mục slot của hfs; quyết định không dẫn được chuẩn."
  causes_vi:
    - "Op chạy read-digest.mjs mà không có --knowledge cho các tệp chuẩn nó dựa vào"
    - "Op viết thêm bản ghi ngoài danh sách --touch lúc đọc"
  nextStep_vi: "Việc chốt bị từ chối; op chạy lại read-digest.mjs với --knowledge <các tệp knowledge đã dựa vào> và --touch <mọi bản ghi đã viết>, đọc lại rồi nộp kèm read-digest.json."
  owner: op-retry
  kind: settle-reason

op-doc-gate-missing:
  title: "No document gate is attached"
  title_vi: "Chưa đính kèm cổng kiểm tra tài liệu"
  meaning_vi: "Op viết tài liệu, knowledge hoặc bản ghi Work nhưng report không đính kèm gate.json hồ sơ docs (gate.mjs --profile docs), nên runtime không chấm được tài liệu."
  causes_vi:
    - "Op chưa chạy gate.mjs --profile docs sau khi viết"
    - "Tệp doc-gate.json không được đính kèm vào starci kernel report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy starci gate run --scope docs [--tree <app>/.starciwork] --out doc-gate.json và đính kèm khi nộp report."
  owner: op-retry
  kind: settle-reason

op-doc-gate-tool-failed:
  title: "A document check could not run"
  title_vi: "Một bộ kiểm tra tài liệu không chạy được"
  meaning_vi: "Cổng tài liệu báo exit 2: một trong các bộ kiểm tra (doc-language, work-surfaces, work-deep, example-work, contract-cites, json-exceptions) bị lỗi khi chạy, nên tài liệu chưa được chấm. Không chạy được không bao giờ là đạt."
  causes_vi:
    - "Thiếu gói trong node_modules của runtime"
    - "Đường dẫn --tree không tồn tại"
  nextStep_vi: "Việc chốt bị từ chối; op sửa nguyên nhân được nêu trong errors của doc-gate.json rồi chạy lại, hoặc chốt blocked với lỗi đó."
  owner: op-retry
  kind: settle-reason

op-doc-gate-red:
  title: "The document gate reports findings"
  title_vi: "Cổng kiểm tra tài liệu báo lỗi"
  meaning_vi: "Cổng tài liệu còn lỗi: tài liệu không phải tiếng Anh, bản ghi Work sai bề mặt hay lỗi thời, trích dẫn tới tệp không tồn tại hoặc ngoại lệ JSON sai."
  causes_vi:
    - "Tài liệu mới viết có câu không phải tiếng Anh"
    - "Bản ghi Work nêu bề mặt hay tệp không tồn tại"
  nextStep_vi: "Việc chốt bị từ chối; op sửa đúng các lỗi liệt kê rồi chạy lại cổng, tối đa params.gateRounds vòng; hết vòng mà vẫn đỏ thì chốt blocked kèm danh sách lỗi."
  owner: op-retry
  kind: settle-reason

op-test-world-proof-missing:
  title: "No test-world run summary is attached"
  title_vi: "Chưa đính kèm tóm tắt lần chạy test-world"
  meaning_vi: "Op e2e hoặc integration không đính kèm test-world-run.json (schema starci/test-world-run@1), nên runtime không biết bộ test đã chạy trên test world thật hay chưa."
  causes_vi:
    - "Op chạy jest trực tiếp mà không qua scripts/gates/test-world-run.mjs"
    - "Tệp test-world-run.json không được đính kèm vào starci kernel report"
  nextStep_vi: "Việc chốt bị từ chối; op chạy starci gate test-world --root <app> --project e2e|integration --out test-world-run.json và đính kèm khi nộp."
  owner: op-retry
  kind: settle-reason

op-test-world-hand-rolled:
