  title: "Terminal bound to no live job"
  title_vi: "Terminal không gắn với công việc nào"
  meaning_vi: "Có terminal StarCi đang mở nhưng không gắn với công việc nào đang chạy hay đang đợi trả lời."
  causes_vi:
    - "Công việc đã kết thúc mà terminal chưa được đóng"
    - "Worker chết để lại terminal treo"
  nextStep_vi: "Bộ kiểm cây Orca báo phát hiện; cần dọn terminal thừa khỏi cây Orca."
  owner: runtime-core
  kind: check-finding

OUTSIDE_ROOT:
  title: "Delete target outside root"
  title_vi: "Mục xóa nằm ngoài thư mục cho phép"
  meaning_vi: "Việc xóa bị từ chối vì đường dẫn thật của thư mục nằm ngoài thư mục gốc cho phép xóa."
  causes_vi:
    - "Có liên kết trỏ ra ngoài gốc"
    - "Đường dẫn đích bị tính sai"
  nextStep_vi: "Không xóa gì cả để tránh mất dữ liệu; cần sửa đường dẫn hoặc gỡ liên kết rồi thử lại."
  owner: runtime-core
  kind: runtime-fault

OVERLAY_HOST_MISSING:
  title: "Overlay has no host"
  title_vi: "Lớp phủ chưa nêu nó mở trên cái gì"
  meaning_vi: "Một lớp phủ như hộp thoại hay ngăn kéo chưa khai báo nó mở đè lên bản ghi hoặc route nào."
  causes_vi:
    - "Quên điền trường host"
    - "Trường host để trống"
  nextStep_vi: "Bộ kiểm tra khung ứng dụng từ chối; op vẽ hoặc dựng giao diện phải điền host cho lớp phủ."
  owner: op-retry
  kind: check-finding

OVERLAY_HOST_UNRESOLVED:
  title: "Overlay host not found"
  title_vi: "Không tìm thấy nơi lớp phủ mở lên"
  meaning_vi: "Host của lớp phủ không phải là bản ghi giao diện hay route nào có trong cây layout."
  causes_vi:
    - "Gõ sai mã bản ghi hoặc route"
    - "Bản ghi được trỏ tới đã bị xóa"
  nextStep_vi: "Bộ kiểm tra khung ứng dụng từ chối; op vẽ hoặc dựng giao diện phải sửa host cho đúng."
  owner: op-retry
  kind: check-finding

OVERLAY_PAGE_FORBIDDEN:
  title: "Non-routed overlay drawn as a page"
  title_vi: "Lớp phủ không có đường dẫn lại vẽ như trang"
  meaning_vi: "Một cửa sổ nổi không có địa chỉ riêng lại được vẽ như một trang đầy đủ, điều này không hợp lệ."
  causes_vi:
    - "Bản vẽ ghi routed: false nhưng lại có phần trình bày dạng trang"
    - "Người vẽ nhầm giữa cửa sổ nổi và trang riêng"
  nextStep_vi: "Bộ kiểm tra từ chối; op vẽ phải bỏ phần trang hoặc đổi cửa sổ nổi thành có đường dẫn rồi chạy lại."
  owner: other-op:interface.draw
  kind: check-finding

OVERLAY_ROUTED_MISSING:
  title: "Overlay does not say routed true or false"
  title_vi: "Lớp phủ chưa khai báo có đường dẫn hay không"
  meaning_vi: "Một cửa sổ nổi chưa nói rõ nó có địa chỉ riêng (routed: true) hay chỉ là trạng thái trong trang (routed: false)."
  causes_vi:
    - "Bản ghi giao diện thiếu trường routed"
    - "Trường routed không phải giá trị đúng/sai"
  nextStep_vi: "Bộ kiểm tra từ chối; op tạo bản ghi giao diện phải khai báo routed rồi chạy lại."
  owner: other-op:interface.scaffold
  kind: check-finding

OWNED_PATHS_EMPTY:
  title: "Work node owns no path"
  title_vi: "Nút công việc chưa khai báo đường dẫn sở hữu"
  meaning_vi: "Một nút trong đồ thị công việc không nói nó sở hữu tệp hay thư mục nào."
  causes_vi:
    - "Nút được tạo nhưng chưa điền danh sách đường dẫn sở hữu"
    - "Danh sách bị xóa nhầm khi chỉnh sửa"
  nextStep_vi: "Đồ thị công việc bị từ chối; op lập kế hoạch phải điền đường dẫn sở hữu cho nút rồi kiểm tra lại."
  owner: other-op:work.author
  kind: check-finding

OWNED_PATH_OVERLAP:
  title: "Two work nodes own the same path"
  title_vi: "Hai nút công việc cùng sở hữu một đường dẫn"
  meaning_vi: "Hai nút công việc không liên quan nhau lại cùng nhận sở hữu một tệp hoặc thư mục."
  causes_vi:
    - "Cắt việc chưa chia rõ ranh giới"
    - "Hai lát cắt cùng chạm một thư mục chung"
  nextStep_vi: "Đồ thị bị từ chối; op lập kế hoạch phải chia lại phần sở hữu hoặc nối hai nút bằng một cạnh phụ thuộc."
  owner: other-op:work.author
  kind: check-finding

OWNER_DECISION_OPEN:
  title: "Owner decision still open"
  title_vi: "Còn quyết định đang chờ chủ dự án"
  meaning_vi: "Công việc chưa xong vì còn một quyết định mà chủ dự án phải đưa ra."
  causes_vi:
    - "Có câu hỏi dành cho chủ dự án chưa được trả lời"
    - "Quyết định đang ở trạng thái mở, đã nhận hoặc đã chuyển lên"
  nextStep_vi: "Tiến độ hiện màu đỏ cho tới khi chủ dự án trả lời quyết định; sau đó Kernel tiếp tục chạy."
  owner: owner
  kind: blocker

OWNER_DEVIATION_DECISION_REQUIRED:
  title: "Owner must decide an intentional deviation"
  title_vi: "Chủ dự án phải quyết định về chỗ lệch có chủ ý"
  meaning_vi: "Bản vẽ và giao diện thật khác nhau ở một chỗ được đánh dấu là cố ý, và cần chủ dự án đồng ý hay không."
  causes_vi:
    - "Có trường hợp lệch có chủ ý đang chờ duyệt"
    - "Chưa có quyết định của chủ dự án cho chỗ lệch này"
  nextStep_vi: "Op kiểm tra giao diện báo lại kèm bằng chứng rồi dừng, không giao việc tiếp; chủ dự án xem bằng chứng và quyết định."
  owner: owner
  kind: settle-reason

OWNER_PATH_NOT_APP_RELATIVE:
  title: "Owner path is not app-relative"
  title_vi: "Đường dẫn sở hữu không tính từ gốc app"
  meaning_vi: "Đường dẫn owners[].path, module hoặc composes[].module của bản ghi phải tính từ gốc app: be/..., fe/... hoặc một thư mục ở gốc app."
  causes_vi:
    - "Dùng tiền tố repository:<id>/ kiểu cũ"
    - "Thiếu tiền tố be/ hay fe/ (đường dẫn tính từ một phía)"
    - "Đường dẫn tuyệt đối hoặc có ../"
  nextStep_vi: "Bị từ chối; op ghi lại bản ghi sửa đường dẫn thành dạng tính từ gốc app (ví dụ be/src/... thay cho src/...)."
  owner: other-op:work.author
  kind: check-finding

OWNER_PATH_MISSING:
  title: "Owner directory not on disk"
  title_vi: "Thư mục của bên sở hữu không có trên đĩa"
  meaning_vi: "Một bản ghi ghi tên thư mục sở hữu nhưng thư mục đó không tồn tại."
  causes_vi:
    - "Tên thư mục viết sai hoặc đã đổi tên"
    - "Thư mục chưa được tạo trong kho mã"
  nextStep_vi: "Nếu bản ghi đã xong thì bị lỗi, nếu chưa xong chỉ là cảnh báo; op ghi lại bản ghi phải sửa đường dẫn."
  owner: other-op:work.author
  kind: check-finding

PACKAGE_INSTALL_RED:
  title: "Published package does not install clean"
  title_vi: "Gói phát hành không cài sạch được"
  meaning_vi: "Gói @starci không cài được từ chính manifest và lockfile của nó trong một thư mục tạm không có node_modules nào phía trên; bản phát hành sẽ hỏng y như vậy ở máy người dùng."
  causes_vi:
    - "package.json và package-lock.json của gói lệch nhau, npm ci từ chối"
    - "Một phụ thuộc khai báo không tồn tại hoặc không phân giải được trên npm registry"
  nextStep_vi: "Sửa manifest hoặc tạo lại lockfile của gói (npm install --package-lock-only trong một thư mục tạm), rồi chạy lại starci release clean-test."
  owner: runtime-core
  kind: check-finding

PACKAGE_NO_TEST:
  title: "Published package declares no test"
  title_vi: "Gói phát hành không khai báo bài kiểm tra"
  meaning_vi: "package.json của gói @starci không có script test, nên không có gì chứng minh gói chạy được khi cài sạch; một gói phát hành phải tự chứng minh mình."
  causes_vi:
    - "Gói mới chưa có bài kiểm tra riêng"
    - "Bài kiểm tra của gói chỉ nằm ở tests/ của runtime, chạy bằng node_modules của runtime"
  nextStep_vi: "Thêm script test vào package.json của gói, chạy bài kiểm tra riêng của gói chỉ với phụ thuộc gói tự khai báo, rồi chạy lại package-clean-test."
  owner: runtime-core
  kind: check-finding

PACKAGE_PROOF_UNRUN:
  title: "Clean package proof could not run"
  title_vi: "Không chạy được bước chứng minh cài sạch của gói"
  meaning_vi: "Bước chứng minh cài sạch không chạy được nên gói chưa được phán xét (thoát 2); đây không bao giờ là một lần đạt."
  causes_vi:
    - "Không gọi được npm, hoặc mạng không tới được npm registry"
    - "Thư mục tạm nằm dưới một thư mục có node_modules, nên bản cài không còn sạch"
    - "Hết thời gian cài hoặc chạy bài kiểm tra"
  nextStep_vi: "Khôi phục npm và mạng (hoặc chọn thư mục tạm không có node_modules phía trên) rồi chạy lại starci release clean-test."
  owner: runtime-core
  kind: check-finding

PACKAGE_TEST_RED:
  title: "Published package fails its tests on a clean install"
  title_vi: "Gói phát hành trượt bài kiểm tra khi cài sạch"
  meaning_vi: "Sau khi cài sạch từ chính manifest và lockfile của gói, script test của gói thất bại; thường là một phụ thuộc chưa khai báo vốn chỉ được node_modules dùng chung của runtime che đi."
  causes_vi:
    - "Mã hoặc bài kiểm tra của gói dùng một gói chưa khai báo trong package.json của nó"
    - "Bài kiểm tra trỏ tới đường dẫn nằm ngoài gói, như node_modules của runtime"
    - "Bài kiểm tra cần kiểu của một thư viện mà gói chưa khai báo"
  nextStep_vi: "Khai báo phụ thuộc còn thiếu trong package.json của gói (kèm lockfile nếu gói có), bỏ mọi đường dẫn ra ngoài gói, rồi chạy lại package-clean-test."
  owner: runtime-core
  kind: check-finding

PALETTE_IMAGE_UNREADABLE:
  title: "Palette image cannot be decoded"
  title_vi: "Không đọc được ảnh để so màu"
  meaning_vi: "Bộ kiểm tra màu thương hiệu không giải mã được ảnh nên chưa so được màu."
  causes_vi:
    - "Tệp ảnh hỏng hoặc không phải PNG hợp lệ"
    - "Ảnh bị cắt dở khi lưu"
  nextStep_vi: "Ghi nhận ở mức nghi ngờ; op vẽ giao diện phải tạo lại ảnh đọc được rồi chạy kiểm tra lại."
  owner: other-op:interface.draw
  kind: check-finding

PALETTE_OFF_BRAND:
  title: "Colours outside the brand palette"
  title_vi: "Có màu ngoài bảng màu thương hiệu"
  meaning_vi: "Ảnh giao diện dùng những màu mà thương hiệu chưa khai báo."
  causes_vi:
    - "Người vẽ dùng màu tự chọn thay vì màu trong bảng"
    - "Ảnh chụp có màu lệch quá ngưỡng cho phép"
  nextStep_vi: "Bộ kiểm tra báo từng màu lệch; op vẽ giao diện phải vẽ lại bằng màu thương hiệu."
  owner: other-op:interface.draw
  kind: check-finding

PARAM_DEFAULT:
  title: "Param needs exactly one of default or required"
  title_vi: "Tham số cần đúng một trong mặc định hoặc bắt buộc"
  meaning_vi: "Một tham số của op hoặc có cả giá trị mặc định lẫn bắt buộc, hoặc không có cái nào."
  causes_vi:
    - "Tác giả op khai báo thiếu hoặc thừa"
    - "Sửa tham số mà quên cập nhật nửa còn lại"
  nextStep_vi: "Bộ kiểm tra bản mô tả op báo lỗi; người sửa bản mô tả op phải chọn đúng một trong hai."
  owner: runtime-core
  kind: check-finding

PARAM_RESTATED:
  title: "Tunable value repeated in prose"
  title_vi: "Giá trị chỉnh được bị chép lại trong lời văn"
  meaning_vi: "Một con số đã có trong tham số lại được viết ra trong hướng dẫn, dễ lệch khi tham số đổi."
  causes_vi:
    - "Chép con số vào văn bản thay vì trích tên tham số"
    - "Đổi tham số nhưng văn bản vẫn giữ số cũ"
  nextStep_vi: "Bộ kiểm tra báo lỗi; người sửa bản mô tả op phải thay số bằng cách trích params.<tên>."
  owner: runtime-core
  kind: check-finding

PARENT_STATE_UNUSED:
  title: "No parent record claims done"
  title_vi: "Chưa có bản ghi cha nào báo hoàn tất"
  meaning_vi: "Chỉ là ghi chú: quy tắc kiểm tra bản ghi cha chưa xong đang chưa có dịp áp dụng vì chưa bản ghi cha nào báo hoàn tất."
  causes_vi:
    - "Các tính năng cha còn dở dang"
    - "Cây công việc mới chỉ có ít bản ghi cha"
  nextStep_vi: "Không cần làm gì; đây là thông tin, quy tắc sẽ tự chạy khi có bản ghi cha báo xong."
  owner: runtime-core
  kind: check-finding

PARITY_FIELD:
  title: "Example trees differ in fields"
  title_vi: "Hai cây ví dụ khác nhau về trường dữ liệu"
  meaning_vi: "Hai cây ví dụ viết cùng một loại bản ghi theo hai cách khác nhau hoặc dùng trường không còn trong hợp đồng."
  causes_vi:
    - "Một cây chưa cập nhật theo hợp đồng mới"
    - "Hai cây được sửa riêng rẽ"
  nextStep_vi: "Chỉ là thông tin; người bảo trì ví dụ nên đồng bộ hai cây."
  owner: runtime-core
  kind: check-finding

PARITY_SKIPPED:
  title: "Parity check skipped"
  title_vi: "Bỏ qua kiểm tra đồng bộ"
  meaning_vi: "Không so được sự nhất quán giữa hai cây ví dụ vì chỉ có một cây."
  causes_vi:
    - "Chỉ có một cây ví dụ trong lần chạy này"
  nextStep_vi: "Chỉ là thông tin; không cần hành động."
  owner: runtime-core
  kind: check-finding

PATHSPEC_FILE_UNREADABLE:
  title: "Pathspec list file unreadable"
  title_vi: "Không đọc được tệp danh sách đường dẫn git"
  meaning_vi: "Chốt chặn git không đọc được tệp danh sách đường dẫn nên không chứng minh được các đường dẫn thuộc về công việc này."
  causes_vi:
    - "Tệp danh sách không tồn tại hoặc không đọc được"
    - "Danh sách truyền qua đầu vào chuẩn bị rỗng"
  nextStep_vi: "Lệnh git bị từ chối; worker phải ghi danh sách đường dẫn sở hữu vào tệp đọc được hoặc ghi đường dẫn sau dấu --."
  owner: op-retry
  kind: dispatch-refusal

PATH_INVALID:
  title: "Work node path is not concrete"
  title_vi: "Đường dẫn của nút công việc không hợp lệ"
  meaning_vi: "Một nút công việc ghi đường dẫn không phải tiền tố cụ thể tính từ gốc workspace."
  causes_vi:
    - "Dùng đường dẫn tuyệt đối hoặc có ký tự đại diện"
    - "Đường dẫn lên thư mục cha (..)"
  nextStep_vi: "Đồ thị bị từ chối; op lập kế hoạch phải sửa thành đường dẫn tương đối cụ thể."
  owner: other-op:work.author
  kind: check-finding

PATH_JOINED:
  title: "Several paths joined in one write entry"
  title_vi: "Nhiều đường dẫn bị nối trong một mục ghi"
  meaning_vi: "Một mục ghi trong bản mô tả op nối nhiều đường dẫn bằng dấu cộng thay vì một đường dẫn cho mỗi mục."
  causes_vi:
    - "Gộp hai đường dẫn cho gọn"
    - "Sao chép mẫu cũ"
  nextStep_vi: "Bộ kiểm tra bản mô tả op báo lỗi; người sửa phải tách thành nhiều mục."
  owner: runtime-core
  kind: check-finding

PATH_NOT_OWNED:
  title: "Git path outside owned paths"
  title_vi: "Đường dẫn git nằm ngoài phạm vi được giao"
  meaning_vi: "Lệnh git nhắm tới tệp không thuộc phần việc của worker này, hoặc không biết phần việc được giao."
  causes_vi:
    - "Worker đụng vào tệp do quy trình khác đổi"
    - "Tệp bảo vệ (guard file) thiếu hoặc không đọc được"
  nextStep_vi: "Chốt chặn từ chối lệnh; worker chỉ nêu đường dẫn được giao sau dấu --, hoặc báo môi trường bị chặn nếu thiếu tệp bảo vệ."
  owner: op-retry
  kind: dispatch-refusal

PAYLOAD_AS_RECORD:
  title: "Asset payloads walked as records"
  title_vi: "Tệp dữ liệu đính kèm bị duyệt như bản ghi"
  meaning_vi: "Một số tệp yaml trong thư mục assets mang lược đồ ngoài hệ công việc, chúng là phần đính kèm chứ không phải bản ghi."
  causes_vi:
    - "Tài sản đính kèm dùng lược đồ riêng"
  nextStep_vi: "Chỉ là thông tin; cổng kiểm tra cơ bản không nên duyệt chúng như bản ghi."
  owner: runtime-core
  kind: check-finding

PAYLOAD_SKIPPED:
  title: "Artifact payload skipped"
  title_vi: "Bỏ qua tệp dữ liệu đính kèm"
