AGENT_HEADLESS_LAUNCH:
  title: "Headless agent launch refused"
  title_vi: "Không được tự chạy agent ở chế độ không giao diện"
  meaning_vi: "Lệnh bị chặn vì nó tự khởi động một agent ngoài sự giám sát của Orca (codex exec, claude -p hoặc --print, cursor-agent -p, devin -p, gemini -p, opencode run), nên Orca không thấy agent đó sống hay chết và không dừng hay giải phóng được nó."
  causes_vi:
    - "Gọi codex exec hoặc claude -p để giao một việc phụ cho agent khác"
    - "Chạy một agent qua npx hoặc qua lệnh bọc cmd, PowerShell, bash"
  nextStep_vi: "Lệnh không được chạy; mọi agent và worker phải khởi động bằng orca orchestration worker-start --agent <provider> và được theo dõi bằng worker-show, worker-read, worker-stop, worker-release."
  owner: op-retry
  kind: verb-refusal

AGENT_ORCA_WORKTREE:
  title: "An agent's own Orca worktree refused"
  title_vi: "Agent không được tự tạo hay xoá worktree Orca"
  meaning_vi: "Lệnh tạo hoặc xoá worktree Orca của agent (create, add, rm, remove, delete, prune, move) bị chặn: worktree chỉ do API worktree của runtime tạo và xoá, nơi kiểm link trước khi xoá và giữ registry cùng giới hạn số worktree."
  causes_vi:
    - "Op workspace.manage hoặc runtime.operate tự gọi lệnh xoá worktree của Orca để dọn một worktree"
    - "Agent tự tạo worktree Orca để làm việc riêng"
  nextStep_vi: "Lệnh không được chạy; xem worktree bằng starci machine worktrees counts, việc tạo và xoá đi qua API worktree của runtime; nhu cầu không tự đáp được thì báo blocked environment."
  owner: op-retry
  kind: verb-refusal

AGENT_CLI_SPAWN:
  title: "Runtime script spawns an agent CLI"
  title_vi: "Script runtime tự chạy agent CLI như tiến trình con"
  meaning_vi: "Một script trong scripts, engine, modules hoặc bin gọi spawn, exec, execFile hoặc fork của node:child_process với lệnh là một agent CLI (codex, claude, cursor-agent, devin, gemini, opencode hoặc shim .cmd/.exe của chúng), nên hook PreToolUse không thấy agent đó và Orca không giám sát, dừng hay giải phóng được nó."
  causes_vi:
    - "Giao một việc phụ (ví dụ chấm điểm bản vẽ) cho agent khác bằng codex exec hoặc claude -p ngay trong script"
    - "Chạy agent qua một hằng số, một shim .cmd hoặc lệnh bọc cmd /c, sh -c"
  nextStep_vi: "Bộ kiểm tra host-boundary từ chối; khởi động agent đó bằng scripts/agent/lib.mjs startAgent (orchestration worker-start --agent <provider>), chờ worker_done qua các lệnh orchestration rồi worker-stop và worker-release."
  owner: runtime-core
  kind: check-finding

ALIAS_PROPS:
