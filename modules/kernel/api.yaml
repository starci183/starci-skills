# ============================================================================
# KERNEL-API — modules/kernel/api.yaml
#
# THE KERNEL'S ONLY DOOR TO THE LEDGER. The [Kernel] is ONE long-lived LLM
# agent per workflow (start-workflow.yaml); it never opens
# .starciwork/runtime.sqlite, never writes a job row, never spawns a terminal
# itself — every state operation is one call:
#   node scripts/kernel/api.mjs <command> ...
# Ops are ephemeral [Op] agents spawned per job by `api dispatch`
# (dispatch.yaml). The kernel reasons; the api transacts.
#
# The op IPC is durable: contracts out (dispatch writes the contracts row,
# the worker reads it back via `api op-contract`), reports in (the worker
# files `api report`; the kernel integrates it via `api consume-report`),
# checks beside them (`api check` records the kernel's re-run). Report and
# contract truth lives in runtime.sqlite through these verbs.
#
# Sources (all under .claude/, relative to the skill root):
#   scripts/kernel/api.mjs      — the executable half; this file is its contract
#   engine/ledger-db.mjs        — the tables named below (DDL: engine/schema.sql)
#   scripts/agent/lib.mjs       — spawnAgent + terminal lifecycle the api drives;
#                                 the kernel never calls Orca itself
#   modules/kernel/driver-loop.yaml    — the caller's tick
#   modules/kernel/dispatch.yaml       — the packet `dispatch` builds + the
#                                        path-legality preflight before enqueue
#   modules/kernel/verdict-contract.yaml — what `settle` validates
#   modules/kernel/kernel-prompt.md    — the spawned kernel's boundary contract
#   modules/schemas/goal-plan.yaml     — the plan --file shape:
#                                        {legs:[{op, paths?, notes?}]}
# ============================================================================

schema: starci/module-kernel-api@1

about:
  kind: kernel-api-contract
  businessQuestion: >-
    "If the kernel is an LLM agent that may not touch the database, what is
    the exact command surface it reasons through — what does each call read,
    what does each call write, and when does it refuse?"
  businessAnswer: >-
    Twenty-five verbs. Pure reads return projections and touch no row (survey,
    status, hierarchy, peers, op-contract) and `estimate` computes slice sizing from
    modules/models/runtimes.yaml without reading the ledger at all; `observe`
    is the kernel's window onto its own job's exact op terminal screen —
    reasoning context and never evidence — and is the one screen read that
    still appends its own receipt event; the op IPC is durable rows (dispatch
    writes contracts, report files reports, consume-report integrates, check
    records re-runs); the rest are
    single ledger transactions that each append one hash-chained event (plan,
    enqueue, route, dispatch, reconcile, nudge, observe, questions, reply, notify, inbox --ack, settle, incident, finish). Every command prints
    one JSON object to stdout; a refusal exits non-zero with {ok:false,
    reason} — a refusal is a fact for the driver loop, never a crash to route
    around. The op lifecycle is fixed: enqueue -> route (model decision
    persisted) -> dispatch (contract row written, leases held; or reconcile a
    pre-contract effect_unknown launch back to the same queued attempt) -> worker
    files `api report` -> kernel `api consume-report` -> kernel re-runs
    checks -> `api check` -> `api settle` (consumption enforced — settle
    marks the report consumed if the kernel did not).
  sources:
    - scripts/kernel/api.mjs
    - engine/ledger-db.mjs
    - scripts/agent/lib.mjs

# ============================================================================
# CONVENTIONS — true of every command below.
# ============================================================================
conventions:
  invoke: 'node scripts/kernel/api.mjs <command> [--repo <path>] [--json]'
  ledger: >-
    .starciwork/runtime.sqlite under the bound repo (engine/ledger-db.mjs
    ledgerFileFor). Every command opens it first; no file there refuses
    `ledger-missing` before the verb runs
  stdout: >-
    one JSON object — {ok:true, ...} on success. A refusal prints ok:false and
    names itself in one of four fields: `code` (the thrown refusals, the
    common case), `reason` (nudge, observe, reconcile, the `max-ops`
    concurrency refusal route and dispatch share, and every refusal that
    carries a `detail` telling the Kernel its next call — enqueue's missing
    required param, dispatch's prerequisite-unmet, route and dispatch's
    tool-unavailable), `rejected` (every
    dispatch launch failure) or `refused` (dispatch admission drift). The
    kebab string is the contract callers match on; each command's `refuses:`
    below names the string it prints and every untyped refusal says so
  exitCode: '0 ok / 1 refusal / 2 usage error'
  writes: >-
    every mutation runs inside BEGIN IMMEDIATE and appends its event —
    events is hash-chained (engine/ledger-db.mjs EVENTS_DIGEST_TRIGGER), so a
    half-write or a silent edit is impossible
  identity: >-
    a job's durable identity is {workflow_id, op_id, attempt, generation} +
    lease_token; lease writes that do not match the job's complete identity
    abort at the trigger (engine/schema.sql leases_match_job
    RAISE(ABORT,'lease-identity-drift')); a report whose identity fields
    contradict the job's bound {run, task, dispatch, from} fails
    starci/op-report@1 at filing (report-invalid)
  callerBoundary: >-
    The ledger is the Kernel's through these verbs; an op reaches it only through its own `report`
    and the read projections (status, survey, hierarchy, estimate, op-contract). An op worker ran
    node:sqlite against .starciwork/runtime.sqlite (inc-360891316369), so this is enforced, not only
    instructed. ENFORCED: (1) the op packet and prompt name no ledger file - only the api verbs;
    (2) a command-terminal op launches with STARCI_ROLE=op and STARCI_OP_JOB=<job> set in its own
    shell (scripts/agent/lib.mjs envPrefix), and Orca exports ORCA_TERMINAL_HANDLE into every
    terminal it owns, so a caller whose handle is the bound terminal of an op job (worker_id,
    payload managed/orca agentTerminalHandle, hierarchy runtime terminalHandle) is that op even as a
    managed worker-start agent whose env StarCi cannot set; (3) from an op caller every kernel verb
    (plan, enqueue, route, dispatch, reconcile, nudge, observe, questions, messages, reply, peers, notify, inbox,
    settle, check, consume-report, serve-ask, retire-ask, incident, provider-health, finish) refuses `op-context-refused` before it runs, and `report`
    refuses `report-identity-mismatch` for any job but the caller's own (whose dispatch/contract
    binding the report binding then proves); each refusal appends 'op-caller-refused' on the op's
    job. RESIDUAL, owner-visible: the api cannot stop a raw file read - a worker with unattended
    shell permissions can still open the ledger file or unset the marker and call from a terminal
    Orca does not attribute to it. Nothing it reads that way is authority: only a filed report plus
    the Kernel's own `api check` settles, and a ledger claim quoted from a screen is never evidence.
    Nothing an op needs is only in the ledger: the packet carries the owner's goal statement
    (context.goal {revision, statement, amendment?} of the revision the job is bound to), so `api op-contract --json` answers what
    workers opened the file for (nivo auth inc-26b260e101e4). `messages` is a kernel verb too.
  sharedCheckout: >-
    Several workflows of one ledger build in ONE checkout on ONE branch (nivo: Login, workspace
    provision, modules and collab on nivo-backend main), and their workers damaged each other: a
    `git reset --soft HEAD~1` over a peer's landed commit (inc-40fed684fff8, inc-cb721b99fdd1), a commit
    sweeping a foreign file a hook re-staged (inc-5d7ce049e810), node_modules deleted under running
    checks (inc-7faca0d4d632, inc-3de1d5efdea6). ENFORCED at every op dispatch (scripts/guards/,
    install.mjs guardLaunch; the receipt rides on op-dispatched `guard`): (1) the worker's git and npm
    are shims first on its PATH (runtime/guards/bin; a native exe built from scripts/guards/launcher.cs
    on Windows): git-policy.mjs refuses reset (except `reset -- <owned paths>`), rebase, pull --rebase,
    commit --amend/-a/--no-verify or without explicit pathspecs, stash, clean -f, checkout/switch that
    moves HEAD, checkout/restore/add/rm of paths outside the job's owned paths, branch rewrites, forced
    pushes, update-ref and filter-branch - exit 3 with a typed code and the remedy; deps-guard.mjs runs
    every npm install-family command under one repository lock (<git common dir>/starci-deps.lock) and
    refuses npm ci / `shim.mjs deps-clean` while a job of ANOTHER workflow of the ledger is leased;
    (2) runtime/guards/jobs/<job>.json names the job's owned paths as absolute paths
    (STARCI_GUARD_FILE); (3) every checkout the job writes gets a reference-transaction hook
    (starci-history-guard) that git runs for every caller, managed agents and humans included: main,
    master and every checked-out branch only move forward and are never deleted, and a commit made
    with STARCI_GUARD_FILE set carries only that job's owned paths (refs/stash stays writable for
    lint-staged's pre-commit backup; the shim refuses a sweeping stash). The harness's own git plumbing
    (Codex CLI runs `-c core.hooksPath=NUL ...`) and staging into a private GIT_INDEX_FILE pass. The
    owner overrides one command with STARCI_HISTORY_GUARD=owner-override. config.yaml guards.shims /
    guards.historyHook false switch a layer off. Settle backs it: a committing pass whose commits since
    admission carry a path outside the owned paths refuses `foreign-paths` (settle --accept-foreign
    <paths> after the file's owner confirmed them), for legs admitted under shared-checkout-guard
  hierarchy: >-
    `hierarchy` projects starci/agent-hierarchy@1 from durable workflow/job
    identity. Stable nodes are workflow:<workflow>, agent:kernel:<workflow>
    and agent:operation:<job>; Orca terminal/pane ids are runtime metadata,
    never parent identity. The Kernel terminal owns one lazy workflow Run and
    every Op Task/Dispatch belongs to that Run.
  neverDoes:
    - 'never picks the next op or the model ad hoc — the kernel reasons, `api route` resolves and persists the decision on the job payload before every dispatch'
    - 'never answers an ask or revises a goal — intent is the owners (provision.ask)'
    - 'never deletes history — finish preserves goals/jobs/reports/events'
    - 'never spawns outside dispatch --spawn — one job, one terminal, one agent'
    # Boundary rules the KERNEL agent is held to (modules/kernel/kernel-prompt.md
    # BOUNDARY; driver-loop.yaml boundary). The api is the only door:
    - 'kernel never calls orca, git, or an agent CLI directly — host mechanics are api internals + scripts/agent/lib.mjs; the kernel sees receipts, not terminals'
    - 'kernel never writes files as the durable record — the ledger via api calls plus each job''s declared artifacts are the only durable surface (report/contract truth is the reports/contracts/checks rows)'
    - 'kernel never settles a report it has not consumed — `api consume-report` before `api settle`; consumption is the kernel''s durable acknowledgement and settle enforces it (marks consumed_at) at the latest'
    - 'kernel never holds durable state only in memory — survey findings, the derived plan, the slice table and routing reasoning persist via plan/incident into events/state_snapshots BEFORE dispatch'
    - 'kernel never reuses an op terminal — settle closes the worker terminal; a retry is a new job row at attempt+1'
    - 'kernel never mutates an op terminal outside nudge/settle — `api observe` is the only read of its screen (context, never proof; sending is `api nudge`, closing is `api settle`)'

# ============================================================================
# COMMANDS
# ============================================================================
commands:

  # --------------------------------------------------------------------------
  # PROJECTIONS — survey/status/hierarchy never mutate the ledger. They are
  # not the only non-mutating verbs (op-contract and estimate write nothing
  # either), and `observe` is a read of a terminal screen that still appends
  # its own receipt event — it lives in its own section below.
  # --------------------------------------------------------------------------

  survey:
    args: '--workflow <id> [--deliveries]'
    reads: >-
      workflows row; latest goals row (revision, goal_identity, json.opChain —
      the approved shape plan diffs against); all jobs; inbox rows; live
      signals; the tail of events; open incidents; the contracts rows of
      settled jobs and the current bytes of the inputs they recorded
      (staleInput and sourceDrift below); modules/kernel/contract-changes.yaml; with --deliveries, every settled job's filed report
      and every handover ask with its answer receipt
    writes: 'nothing — pure projection'
    returns:
      ok: true
      workflow: '{workflow_id, title, phase, generation, goal_identity}'
      goal: '{revision, goal_identity, opChain[]}'
      jobs: '[{job_id, op_id, kind, status, attempt, generation, worker_id, payload:{owned_paths,...}}] — OPEN jobs only; settled statuses are filtered out'
      inbox: '[{inbox_id, kind, key, status}]'
      signals: '[{scope, key, token, expires_at}]'
      events: '[{seq, kind, entity_id, created_at}] — newest last, bounded tail'
      eventsHead: 'the hash-chain head over the events tail'
      incidentsOpen: '[{incident_id, kind, status, attempts, last_progress}] — open only'
      staleInput: >-
        [{jobId, op, attempt, cut?:{id, ordinal, total}, path, kind:work, recorded, current, changed[], heldBy?}]
        — one row per changed product Work input (a .starciwork record of the job's payload.records)
        of a settled job (status succeeded, or failed on a partial report) that is the newest attempt
        of its op and cut ordinal, in a workflow that is not finished. `recorded` is the digest
        `settle` re-baselined on the contract (contracts.context_json.inputs, the bytes the job left),
        `current` the digest now; `changed` the record files that differ and that no owned path of
        the job itself, or of another job of the same workflow still open or settled after it,
        covers - its own workflow's later legs writing what they own is not staleness. A Source-law
        edit (knowledge/**, modules/schemas/**) NEVER appears here: see sourceDrift. A contract with
        no recorded inputs, or no settle baseline, never appears. `heldBy` names the open
        seam-ordinal job a higher stale slice of the same cut waits on. Computed by `inputDrift()`
        in scripts/kernel/input-digests.mjs, each distinct path digested once per call
      sourceDrift: >-
        [{jobId, op, attempt, cut?, path, kind:source, recorded, current, admittedAt, changes[],
        followUp[], unregistered}] — ADVISORY only: a Source-law input the settled job was admitted
        under (recorded at dispatch) has been edited since. The job is judged by what it was admitted
        under, so this is never owed work: `changes` are the registered contract changes after its
        admission whose `paths` cover the edit, `followUp` those registered `reach: follow-up`
        for this op (their owed legs are frontier.contractFollowUps), `unregistered` true when no
        change names the edit (a supervisor finding: register it)
      staleInputError: 'present only when the projection itself failed; staleInput and sourceDrift are then []'
      deliveries: >-
        --deliveries only: [{jobId, op, attempt, status, verdict, repository, ownedPaths, reportFile,
        outcome, summary, files, head, branch, credentialPending, open, blocker, checks[{name, command,
        exitCode}]}] — every settled (succeeded|failed) job except handover.review, with the fields of its
        filed report (reportFiled:false when none was filed); what a handover package is assembled from
        (scripts/kernel/handover.mjs deliveriesOf). survey is a read projection, so an op terminal may call it
      credentialPending: '--deliveries only: the union of every delivery report''s credentialPending'
      handoverHistory: '--deliveries only: [{dispatchId, attempt, state:pending|answered|superseded, decision:approve|feedback|question|null, answeredBy, byOwner, note, answeredAt, receiptPath}] — every handover.review ask, oldest first'
    refuses:
      - workflow-unknown: 'no workflows row for --workflow'
    usedBy: 'the ticks deep read — first call of every iteration (driver-loop.yaml tick.survey); with --deliveries, the handover.review op'

  status:
    args: '--workflow <id>'
    reads: >-
      workflows.phase + generation; jobs grouped by status; leases joined to live jobs; exact
      running-operation terminal show receipts; and, for each queued job, what blocks it — the
      approved leg order on the latest goals row, the workflow's slot-holding operation count
      against min(budgets.maxOps, maxParallelOps), the typed provider-health signal for its routed
      pool, overlapping `path:<owned_path>` lease rows, and the pool's declared maxParallel; the
      stale-input and source-drift projections survey.staleInput / survey.sourceDrift describe
    writes: 'nothing'
    returns:
      ok: true
      phase: '<workflows.phase>'
      frontier: '{state:finished|transition-ready|settle-ready|worker-dead|worker-question|worker-nudge-ready|worker-wedged|peer-message|engaged|handover-answered|finish-ready|ask-reserve|awaiting-owner|peer-wait|handover-due|orphaned-frontier|idle,actionable,openOperations,readyOperations,staleOperations[],unconsumedReports,nudgeReadyJobs[],workerQuestionJobs[] (jobs whose worker asked the coordinator through orca orchestration ask and waits: api questions, then api reply each),askReserveDispatches[] (unanswered asks that never reached the owner - no ask-notified on Telegram and no live serve-ask form; the Kernel parks each with serve-ask --dispatch, and any entry makes the frontier actionable),askOnDemandDispatches[] (unanswered asks the owner has on Telegram (ask-notified) with no live form: healthy, the owner serves the form from the ask Generate URL button; never re-served, never actionable),settleReadyJobs[] (jobs still running whose report was consumed but never settled: api check + api settle each; a job an open owner-gate or peer-wait holds is listed under heldSettleJobs instead),heldSettleJobs[] (settles the Kernel deferred behind a recorded wait - frontier.heldSettleJobs),wedgedJobs[] (workers past scripts/kernel/terminal-liveness.mjs WEDGE_MINUTES on one shell command still showing no output),deadWorkerJobs[] (running/answering jobs with no filed report whose exact worker liveness is disconnected or gone - after a host reboot every op terminal is gone; frontier worker-dead, ranked after settle-ready and before worker-question; api reconcile --dead-worker each),queued[],queuedCauses,reason} — actionable is the single boolean the yield rule reads (driver-loop.yaml wait): true for every state but finished, awaiting-owner (no open operation while at least one ask is unanswered: the answer wakes the Kernel), peer-wait (frontier.peerWaits) and a bare engaged, and true for an engaged workflow that still holds readyOperations (queued jobs to route/dispatch, effect_unknown launches to reconcile) or a staleOperations row without heldBy'
      'frontier.peerMessageKeys': >-
        [<key>] — pending peer-message inbox rows addressed to this workflow (api notify, the enqueue
        overlap heads-up). Any entry makes the frontier actionable, so the watchdog wakes a turn-idle
        Kernel; the state reads `peer-message` when no report, settle, worker question, idle or wedged
        worker comes first, and its reason says to read `api inbox` and ack each key with a
        disposition. An ack (or finish) clears it
      peerMessages: '[{key, from, kind, subject, at}] — the same pending rows; empty once the workflow is finished'
      'frontier.peerWaits': >-
        [{incidentId, peer, peerPhase, holds[], detail, untilMessage, refs[], since}] — the open
        peer-wait incidents (api incident --kind peer-wait): work whose preflight cannot pass until a
        peer workflow lands something. The state reads `peer-wait`, NOT actionable, when no report,
        settle, worker, peer message, handover move, re-serve or owner wait comes first and every open
        operation is a queued job or a deferred settle (frontier.heldSettleJobs) a wait holds (none open is the common case: the next approved
        leg is not enqueued yet). It stands after awaiting-owner and before handover-due and
        orphaned-frontier; before it existed mia-mia work-and-stacks (inc-0aebf976e625) sat at
        orphaned-frontier/actionable with zero open operations while brand.decide waited on a peer's
        Grammar install, and the watchdog re-woke the Kernel for nothing. A peer message from the
        awaited peer wakes the Kernel (api notify, peerWait) and the frontier reads peer-message.
        reason names each wait, its peer and what it holds
      'frontier.peerWaitsDead': >-
        [<incidentId>] — peer waits whose peer is no longer running (finished, archived, gone): the
        peer can never meet them, so any entry makes the frontier actionable and reason tells the
        Kernel to re-check the prerequisite itself, then resolve the wait or raise what is missing
      'frontier.heldSettleJobs': >-
        [{jobId, opId, attempt, heldBecause:owner-gate|peer-wait, blockedBy:{incident}|{incident, peer},
        detail}] — settles deferred behind a recorded wait: a running/answering job whose report was
        consumed but not settled, named by an open owner-gate or peer-wait incident in --holds (or,
        without --holds, as its --op). Owner-gate is checked first, as for queued jobs. Such a job is
        NOT in settleReadyJobs and does not make the frontier settle-ready or actionable; it counts
        like a held queued job, so with nothing else to move the state reads `awaiting-owner` (owner
        gate) or `peer-wait`, and reason says the settle is deferred behind the wait. Before it nivo
        wf-nivo-app-auth-mudqjob3 deferred the cut-closing settle of op-backend.implement-86ff31372a
        until a peer commit landed (peer-wait inc-9f2e1e7ff1f6) while status read settle-ready
        ACTIONABLE, the watchdog woke the Kernel every tick for nothing and the supervisor alerted
        STALLED. Resolving the wait (api incident --resolve, or the peer's message for an
        --until-message wait) makes the job settle-ready again: actionable, and the watchdog wakes the
        Kernel to check and settle it. api settle itself is never refused for a held job
      handover: >-
        {op:handover.review, state:approved|running|awaiting-owner|answered|retired|due|not-started, due,
        inApprovedChain, jobId, ask:{dispatchId, jobId, attempt, state, decision, answeredBy, byOwner, note,
        receiptPath}|null, approvedSeq, lastBusinessSettleSeq, finishAllowed, finishRefusal?} — the owner
        handover (scripts/kernel/handover.mjs handoverProjection; driver-loop.yaml handoverLoop). With no
        operation open it decides three frontier states, each actionable: `handover-answered` (the latest
        handover ask was answered and nothing acted on it yet; reason names the move per decision) and
        `finish-ready` (a handover-approved event newer than the last business settle: run api finish)
        stand before ask-reserve; `handover-due` (every approved leg other than the handover holds a
        succeeded job, no current approval, no other answered ask left to re-enqueue) stands before
        orphaned-frontier. A pending handover ask is `awaiting-owner` like any other ask
      'frontier.staleOperations': >-
        [{jobId, op, attempt, cut?, heldBy?, paths[]}] — staleInput grouped per job: settled work
        whose product Work inputs changed since it settled, which the Kernel re-dispatches as a new attempt
        (driver-loop.yaml enqueue.cutExecution). A row with `heldBy` waits on its cut's open seam
        ordinal and does not make the frontier actionable; `reason` names the rows without it when
        no earlier cause claims it
      staleInput: 'as survey.staleInput (and staleInputError when the projection failed)'
      sourceDrift: 'as survey.sourceDrift'
      'frontier.sourceDrift': >-
        present only when non-empty: {advisory:true, jobs, paths:[{path, jobs, changes[], followUp[],
        unregistered}]} — sourceDrift summarized per edited Source path. Never makes the frontier
        actionable and never enters `reason`: the Kernel does not redo settled work for it (what a
        follow-up change owes is frontier.contractFollowUps)
      'frontier.queued': >-
        [{jobId, opId, attempt, queuedBecause, blockedBy, detail, blocking?}] — one row per queued job,
        the jobs other work waits on first (heaviest blocking weight first, waiter-priority.mjs; such a
        row carries blocking {waiters, workflows[], weight, since}), the rest in created order, naming
        why it is not running. `queuedBecause` is
        owner-gate|peer-wait|dependency|dependency-failed|max-ops|circuit-open|path-lease|pool-full|ready and `blockedBy` carries
        the id that holds it: {incident} for an owner gate, {incident, peer} for a peer wait, {op, job} for a dependency, {ceiling, ceilingSource, running} for max-ops,
        {provider, pool} for an open circuit, {path, job} for a path lease, {pool, running,
        maxParallel} for a full pool, and null for `ready`. `ready` means nothing blocks it and the
        Kernel is the only thing left to move it
      'frontier.queuedBecause precedence': >-
        first cause that bites, in this order. A job whose payload.after names a job, or whose cut seam
        (the latest job of the same op and cut id at ordinal 1 that was not retired before dispatch -
        a dropped or goal-superseded row with no dispatch binding, engine/admission.mjs
        retiredBeforeDispatch, is no seam) has not settled succeeded, is `dependency` with blockedBy {op, job}:
        the kernel records a composition-first order with enqueue --after instead of holding siblings in
        its head, and an unsettled seam holds the other ordinals. A Work record in a job's owned_paths whose dependsOn
        names a record owned by another job of the workflow is held the same way until one owner of that
        record succeeded. `owner-gate` — an open incident of kind
        owner-gate names this job or its op in --holds (or, without --holds, as its --op): a step
        only the owner drives holds it, and no admission check can clear that. Then `peer-wait` — an open
        incident of kind peer-wait names this job or its op in --holds (or as its --op): a peer workflow
        must land something first, and route and dispatch refuse it. Then `dependency` — an approved leg that precedes this
        op has no job settled succeeded (modules/schemas/goal-plan.yaml carries no dependsOn field:
        ordering IS the legs array, so the earlier leg is the dependency). Then the four admission
        checks in the order route and dispatch run them: `max-ops` (the workflow ceiling, refused
        before anything else), `circuit-open` (the routed pool's provider credential is parked),
        `path-lease` (a live capacity-1 `path:<owned_path>` lease overlaps this job's closure —
        row existence is the fence, expiry only a recovery signal), `pool-full` (other holders of
        the routed pool already fill its maxParallel; this job's own routed-but-queued row does not
        count against itself). An unrouted job is never pool-full or circuit-open — there is no
        pool to be full of
      'frontier.queuedCauses': '{<cause>: <count>} — the same rows tallied by cause, omitting causes with no rows'
      'frontier.gateConditions': >-
        [{incidentId, kind, holds[], since, until[], conditions:[{condition, met, evidence,
        unmeetable?}], met, unmeetable[]}] — this workflow's open incidents that carry typed release
        conditions (api incident --until-*, commands.incident.typedRelease), each condition evaluated
        read-only on this call; present only when non-empty. Status first resolves every one whose
        conditions ALL hold, so a row here is still pending; an incident without typed conditions
        never appears and is never auto-resolved
      'frontier.autoResolved': >-
        [{incidentId, kind, holds[], evidence[]}] — present only when THIS status call resolved typed
        waits (events 'incident-resolved' {by:until-conditions, evidence} + 'incident-auto-resolved').
        What they held is already released in this same projection (queued rows read ready, held
        settles settle-ready), so the frontier is actionable and the watchdog tick that ran it wakes
        the Kernel
      'frontier.gateConditionsUnmeetable': >-
        [<incidentId>] — present when a typed condition can no longer hold on its own (--until-job
        :succeeded on a job that settled failed or cancelled, a named job or incident gone): any
        entry makes the frontier actionable and reason tells the Kernel to re-point the wait (api
        incident --attach) or resolve it
      'frontier.blockingOthers': >-
        [{jobId, opId, status, waiters, workflows[], since, waitedMinutes, weight, via:[{workflowId,
        via, ref, since}]}] — present only when non-empty: this workflow's open jobs that OTHER
        workflows of the ledger wait on, heaviest first (scripts/kernel/waiter-priority.mjs). A waiter is an open incident's typed
        --until-job naming the job (via until-job) or --until-record naming a record it owns
        (until-record), an open owner-gate/peer-wait of another workflow naming the job id in its
        text (gate-names), a pending peer request to this workflow naming the job id, its op or a
        .starciwork record it owns (peer-request), or a queued job declaring it --after
        (dependency: counted in weight and queued order, listed here only across workflows).
        weight = sum over waiters of 1 + hours waited. When such a job is still QUEUED and has
        blocked another workflow for BLOCKING_HEADS_UP_MS (15 minutes), status writes one heads-up
        peer message into this workflow's inbox from the longest-waiting workflow (payload auto
        blocking-waiters, blockingJob, waitingWorkflows; once per newly waiting workflow), so the
        frontier reads peer-message and the watchdog wakes this Kernel to dispatch it first
      jobs: '{<status>: <count>} — jobs grouped by status (queued|leased|running|answering|succeeded|failed|cancelled|effect_unknown); the queued rows are the dispatch candidates'
      failures: '{failed, awaitingOwner} — the `failed` rows split: an attempt settled awaiting-owner (verdict-contract.yaml retryAccounting.ownerWait) is a wait, never a failure'
      awaitingOwner: '[{jobId, opId, attempt, dispatchId, answer: pending|answered|superseded}] — one row per op whose LATEST attempt settled awaiting-owner; `answered` (askLifecycle ask-answered) means the Kernel re-enqueues the op now, `pending` means the owner has not answered'
      activeLeases: '[{resource_key, job_id, expires_at}] — live only; an expired lease is a detector, not a capacity gift'
      inboxPending: '<n> — unclaimed inbox rows for this workflow'
      workerQuestions: >-
        [{messageId, jobId, opId, attempt, question, options[], askedAt, bridged}] — pending
        `question` messages a running worker sent its coordinator with an Orca orchestration ask
        (Orca's preamble tells it to), read through the non-consuming host inbox
        (scripts/api/orca/orch-inbox.mjs) whenever a live operation terminal exists, plus rows `api
        questions` already bridged. Any entry makes the frontier `worker-question` (actionable): the
        worker is blocked until `api reply` answers (inc-b944cbaef24b, inc-20449a260df8).
        workerQuestionsError names an unreadable host inbox; status never writes the bridge itself
      cutSets: >-
        [{op, id, total, passed[], open[], jobs:{<ordinal>:{jobId,status}}, closingOrdinal?, closingJob?,
        closingCheck?}] — every cut set of the workflow with an ordinal whose latest job has not settled
        succeeded. With exactly one open ordinal it names that ordinal as the closing pass: its settle
        requires `full-regression-final` besides the slice checks (settle.cutSet), so the Kernel runs the
        unchanged full gates over the whole set before that settle. Ordinals settle out of order, so the
        closing ordinal is whichever is left, not the highest (inc-751dd1ac4492)
      contractFollowUps: >-
        frontier.contractFollowUps [{change, jobId, op, attempt, status, followUpOp, detail, after}] -
        for each `reach: follow-up` change in modules/kernel/contract-changes.yaml, the newest leg of
        its followUp.ops (per cut ordinal) that was admitted before the change, runs or succeeded,
        and has no follow-up recorded yet (the key is present only while one is owed). Any entry makes the frontier actionable: the Kernel
        enqueues followUpOp with --contract-change <change> --follow-up-of <jobId> (--after <jobId>
        while it runs) and never holds the running leg (driver-loop.yaml contractRollout)
      foundations: >-
        {peers[], declared, none, owns:[{name, kind, state, version, owner, ownerRunning}], needs:[...],
        required, advised, detail?} - this workflow's shared-foundation duty (api foundations);
        required means api enqueue refuses its non-foundation legs until it declares.
        frontier.queued lists foundation legs (queued[].foundation) first
      reports: '[{dispatch_id, op_id, attempt, outcome, consumed_at, created_at, job_id}] — filed op reports; consumed_at NULL means awaiting kernel integration'
      workers: '[{jobId,opId,terminalHandle,liveness:active|active-unclassified|wedged|staged-input|turn-idle|live-idle|interactive-gate|failed|disconnected|gone|unknown,connected,writable,lastOutputAt,outputAgeMs,screenState,livenessReason?,errorCode?,observedAt}] — gone is a running Orca''s typed refusal of the handle (errorCode terminal_handle_stale: it names no terminal, as every handle after a host reboot); an unreachable Orca reads unknown and never proves a worker dead. connected/writable proves terminal availability; current frame proves turn activity; report/output age alone never proves a live turn. An `active` frame is trusted only while output is recent: past runtimes.yaml allocation.liveness.activeStaleMs with no output it reads liveness turn-idle with livenessReason stale-active (screenState stays active), so the nudge frontier reaches it. `staged-input` is an unsubmitted paste in the input row: the classifier finds the input region by the text dispatch delivered (contracts.context_json.delivery.text + the contract markdown) and the card''s submission.stagedPattern, and only rows ABOVE it can prove a turn - the pasted contract''s own "Running"/"Working"/"esc to interrupt" words never make it active (inc-06aeecf432f1). A staged-input worker is nudge-ready'
    refuses:
      - workflow-unknown
    usedBy: 'the drive loops cheap per-tick poll (driver-loop.yaml drive.status)'

  hierarchy:
    args: '--workflow <id>'
    reads: 'workflow row plus every Kernel/Op job payload for the workflow'
    writes: 'nothing — pure projection'
    returns:
      schema: 'starci/agent-hierarchy@1'
      workflow: '{nodeId, role: workflow, workflowId, title, status, generation}'
      nodes: '[{nodeId,parentNodeId,role,workflowId,jobId,opId,attempt,generation,status,verdict,runtime:{host,agent,provider,model,profile,runtimePool,runId,taskId,dispatchId,terminalHandle}}] — verdict is result_json.verdict (pass|fail|blocked|awaiting-owner), null while unsettled'
      edges: '[{parentNodeId,childNodeId,relation: coordinates|dispatches}]'
    identityRules:
      - 'titles such as [Kernel]/[Op], tab order and parentPaneKey never define ownership'
      - 'the workflow Run coordinator handle is the Kernel terminal; worker-start owns managed Task injection and is never followed by a second dispatch'
      - 'command-terminal agents still receive an Orca Task/Dispatch; worker_id retains their terminal handle only for exact cleanup'
    refuses:
      - workflow-unknown
    usedBy: 'Orca/sidebar integrations and workflow monitors that need a semantic agent tree'

  # --------------------------------------------------------------------------
  # ESTIMATE — deterministic same-op slice sizing. No ledger row is touched.
  # --------------------------------------------------------------------------

  estimate:
    args: '--files <n> [--assertions <n>] [--components <n>] [--records <n>] [--paths <csv>] [--gear <n>]'
    reads: >-
      modules/models/runtimes.yaml allocation.slicing only — {weights:{file,
      assertion, component, record}, targetMinutes:[lo,hi], maxSlices, gears,
      size:{<class>:{from, agents}}} — plus the owner's parallel.gear through
      the one reader engine/config.mjs (`parallelGear()` in engine/config.mjs;
      STARCI_OWNER_ROOT repoints it). The kernel measures the write scope and
      passes the counts; the weights, class bounds, gear vocabulary and
      agents-per-gear table are declared data, never a model's guess. No ledger
      row is read
    writes: 'nothing — a pure computation, no row and no event'
    computes: >-
      W = sum(weight * count) agent-minutes;
      size = the largest allocation.slicing.size class any one count reaches its `from` bound of,
      else `s` when W is inside targetMinutes[0] and `m` above it;
      agentsRequested = 1 for `s`/`m`, else size.<class>.agents[gear];
      agentsAchievable = clamp(min(agentsRequested, maxSlices, <disjoint path prefixes of --paths>), 1, ...);
      perSliceMinutes = W / agentsAchievable
    gear: >-
      the owner's parallel.gear is the standing answer; `--gear <n>` overrides it for a dry run and
      writes nothing. A gear outside allocation.slicing.gears refuses either way. The gear raises
      only agentsRequested — never a pool's maxParallel, maxParallelOps or budgets.maxOps
    achievable: >-
      the seam-first partition itself is derived by the Kernel agent from repository evidence
      (driver-loop.yaml cutExecution), not by this code, so agentsAchievable is an UPPER BOUND and
      `achievableBasis` names which one: `disjoint-owned-path-prefixes` when --paths supplied a
      closure (the pairwise-disjoint concrete prefixes engine/admission.mjs normalizeOwnedPaths
      collapses it to), `unbounded-no-path-closure` when it did not
    returns: >-
      {ok:true, minutes, size:s|m|l|xl, gear, gearSource:config|flag, agentsRequested,
      agentsAchievable, achievableBasis, reason, pathGroups?, slices, perSliceMinutes, counts,
      weights, targetMinutes, maxSlices, gears, overTarget}. `reason` names why achievable fell
      below requested and is null when it did not. `slices` equals agentsAchievable — it is the N
      the --cut-total flags carry. `overTarget` means each slice still exceeds targetMinutes[1]:
      gear up or decompose the closure finer
    refuses:
      - estimate-no-measure: 'every count is absent or zero — there is nothing to size'
      - estimate-paths-invalid: '--paths holds a glob, an absolute path, a parent traversal or nothing concrete (engine/admission.mjs normalizeOwnedPath; a Next.js App Router segment - [lang], [...slug], [[...opt]], (group), @slot, (.)photo - is a literal name, not a glob)'
      - gear-undeclared: '--gear names an integer allocation.slicing.gears does not declare'
      - 'the owner config being unparsable or schema-short (UNTYPED): estimate reads parallel.gear strictly and refuses with the validation message rather than sizing a fan-out against a guessed gear. `--gear` does not consult the file and answers anyway. Admission (route/dispatch) keeps the opposite tolerance — see route.maxOps'
      - slicing-undeclared: 'allocation.slicing omits weights/targetMinutes/maxSlices/gears/size, a weight for a supplied count, or an agent count for this size at this gear'
    usedBy: 'the cut-bound evaluation before enqueue — the agent count the --cut-total flags carry (kernel-prompt.md)'

  # --------------------------------------------------------------------------
  # PLAN — persist the derived plan + structural diff vs the approved shape.
  # --------------------------------------------------------------------------

  plan:
    args: >-
      --workflow <id> --file <plan.json> [--replanned-from <plan-digest|event-seq>]
      [--blocker <kind>] [--path-delta <s>] [--routing-reason <s>]
    fileShape: '{legs: [{op, paths?, notes?}]} — modules/schemas/goal-plan.yaml'
    reads: 'latest goals row — the approved opChain is goals.json.opChain (define-goal.yaml: advisory, re-derived at boot, never trusted blindly)'
    writes: >-
      one events row kind 'plan-derived' {payload: {goal_revision, plan_digest,
      diff, lineage}} — the file stays the artifact; the ledger stores its digest
      and its diff, not a copy. `lineage` = {replannedFrom, blocker, pathDelta,
      routingReason}: which prior plan-derived event/digest this supersedes, the
      typed blocker or trigger that forced the re-plan, the owned_paths delta vs
      the prior legs, and why the legs routed as they did. It is recorded exactly
      as given, including all-null. Supplying it on a RE-PLAN is a kernel
      obligation the api does not enforce — re-planning without provenance is a
      quiet rewrite, and the rule lives in driver-loop.yaml replanTriggers.lineage.
    diff: >-
      STRUCTURAL only — the derived op ids + dependsOn edges vs the approved
      opChain legs. Added/removed/re-rooted legs are divergence; leg order
      and allowlist wording inside the approved shape are not
      (modules/schemas/goal-plan.yaml rules: acyclic dependsOn, disjoint
      allowlists). One addition is not divergence: handover.review appended
      as the LAST leg of a plan whose approved opChain predates it — the
      owner handover every workflow owes before `api finish`
      (driver-loop.yaml handoverLoop). The diff then records
      handoverAppended:true.
    returns:
      ok: true
      goalRevision: '<revision the plan was derived against>'
      diff: '{added[], removed[], changed[], identical:true|false}'
      divergent: 'true|false — structural divergence: the driver escalates and dispatches nothing on it'
    refuses:
      - plan-file-missing: 'the --file path does not exist'
      - plan-file-invalid: 'unparseable, or fails the goal-plan {legs:[{op,...}]} shape — the refusal names the rule'
      - workflow-unknown
    usedBy: 'tick.plan — divergence -> api incident --kind plan-divergence, never a quiet re-plan (driver-loop.yaml)'

  # --------------------------------------------------------------------------
  # QUEUE — queued job rows are the queue; a duplicate is a refusal.
  # --------------------------------------------------------------------------

  enqueue:
    args: >-
      --workflow <id> --op <opId> --paths <csv> [--records <csv>] [--params '<json>']
      [--repository <repo-id>] [--cut-id <stable-id> --cut-ordinal <n> --cut-total <N>] [--after <jobId>,...]
      [--foundation <name>] [--contract-change <id> --follow-up-of <jobId>] [--commit-only-of <jobId>,...]
      [--retry-of <jobId>]
      | --workflow <id> --op <opId> --commit-only-work-debt
    uncutLineage: >-
      an uncut op's retry lineage (payload.retry) chains only within its own unit of work
      (engine/admission.mjs sameWorkLineage): the same params.subject when either job names one, else
      overlapping owned paths, else overlapping records; two jobs naming none of them are one lineage. It
      used to chain to the op's latest earlier job whatever it owned, so a retry of the Collab tasks slice
      inherited the membership slice's green checks and lost its own red one (nivo inc-6a0cfe1b39d4) and a
      new decision record got another record's red checks and eight unrelated owner answers (mia
      inc-bca4d2034f8c). --retry-of <jobId> pins the predecessor explicitly (an earlier job of the same op
      that ran; else refused retry-of-invalid). The same rule narrows prior_attempt_failures, owner_answers
      and status awaitingOwner (an ask waits until a later job of ITS unit of work exists, mia
      inc-2f7968ede59c)
    foundations: >-
      --foundation <name> marks a leg that builds a shared foundation this workflow
      claimed (api foundation --claim): payload.foundation, and status lists it first in
      frontier.queued - foundation legs run first. Without it, a workflow with running
      peers that declared no foundation (owns / needs / none) is refused
      foundations-undeclared when it was created after the shared-foundation-planning
      contract change and its ledger plans foundations at all (a foundation or a
      declaration is recorded); an older workflow, or a ledger that registered none, is
      only advised (receipt foundationAdvisory, one stderr line) and never held.
    contractFollowUp: >-
      --contract-change <id> --follow-up-of <jobId> records the follow-up leg a
      `reach: follow-up` contract change owes an older leg (modules/kernel/contract-changes.yaml;
      api status frontier.contractFollowUps): payload.contractChange {id, followUpOf}. Pass
      --after <jobId> while the older leg still runs; it is never held for the change.
    commitOnly: >-
      --commit-only-of <jobId> enqueues a commit-only attempt for Work a
      succeeded job of the same op in this workflow wrote and never committed
      (api reconcile --work-debt prints the exact command): payload.commitOnly
      {of}, rendered into the packet as commit_only. --paths are exactly the
      uncommitted files; the attempt changes none of them and commits them at
      a reported head. --commit-only-of takes several jobs (csv), one attempt
      for all of them (payload.commitOnly.of is then the list). Refused
      commit-only-of-unknown / commit-only-of-invalid for another workflow's
      job, another op's, or one not succeeded.
      --commit-only-work-debt (with --workflow and --op, no --paths) is the
      batched repair: --paths becomes the union of the exact owed paths of every
      settled job of that op in the workflow with Work debt and no pending
      repair (api reconcile --work-debt), payload.commitOnly {of:[jobIds],
      batch:work-debt}. Refused no-work-debt when there is none, and
      commit-only-conflict with --paths or --commit-only-of. The landed proof
      reads the batch's pathspecs in bounded git calls.
    reads: >-
      workflows.phase; existing jobs for {workflow_id, op_id}; the brief
      modules/ops/ops/<opId>.yaml must exist and supplies the `params` block every
      override is checked against; the latest goals row's opChain leg for this op
      supplies what the owner set (modules/schemas/goal-plan.yaml legs[].params).
    writes: >-
      jobs row {job_id, workflow_id, op_id, attempt=max(prior attempts)+1
      (1 on first enqueue), generation, kind:'op', status:'queued',
      payload_json:{goal_binding:{revision,identity},records:[--records],
      owned_paths:[--paths],repository?:<repo-id>,params?:{<name>:<value>},cut?:{id,ordinal,total}}} + events 'job-enqueued'.
      `repository` is the repository the job's bare owned paths land in
      (scripts/kernel/target-repo.mjs): --repository resolved through the
      project binding whose Work owner is --repo (a binding role, repository
      name or root path; stored as its role), else `fe` for an op every
      modules/models/kinds.yaml lane delivers on the frontend side
      (interface.implement, interface.audit, uat.verify) when the binding
      declares fe, else absent — the job targets where dispatch places it.
      An owned path may name its repository itself: `repository:<id>/<path>`,
      an absolute path, `../<repo>/<path>` resolving from --repo into a
      bound repository, or `<repo-name>/<path>` whose first segment is a
      bound repository's name (the owner's own name included); the rest is
      relative to that repository's root. A `.starciwork/` path always lands
      in the Work owner.
      `cut` marks one bounded execution slice of the SAME approved semantic op;
      all three cut flags are atomic, ordinal is 1-based and total is at least
      two. The goal binding is
      frozen at enqueue so a later approved revision cannot silently retarget
      an already queued job. When a prior attempt of the op exists the payload
      also carries `retry` (engine/admission.mjs deriveRetryLineage):
      {retryOf, resumeOf, attempt, businessAttempt, retryClass, effectState,
      resumed, reusesDurableAttempt, consumesBusinessRetry}. `attempt` is
      durable dispatch identity; `businessAttempt` is what a route's retry
      limit is budgeted against, and it does not advance for a launch the
      prior result proved rejected before any effect (retryClass
      infrastructure) nor after an attempt that settled awaiting-owner
      (retryClass owner-answer). A cut enqueue chains only to its own
      ordinal (engine/admission.mjs cutRetryLineage): the predecessor is the
      latest job with the SAME op, cut id AND ordinal, `businessAttempt`
      counts only that ordinal's business attempts, `effectState` is that
      predecessor's, and `attempt` is the row's durable attempt; the first
      job of an ordinal carries no `retry`, whatever sibling ordinals ran.
      A row retired before it dispatched (reconcile --drop, or a goal revision
      that superseded it, with no dispatch binding: engine/admission.mjs
      retiredBeforeDispatch) ran nothing and is never a predecessor, cut or
      uncut: the retry of an answered ask stays retryClass owner-answer at
      the ask's businessAttempt however many queued retries were dropped.
      `records` is the explicit closed read binding carried
      unchanged into the dispatch packet; omission means no Work record is
      bound and never licenses repository-wide discovery.
      `params` is the op's tunables: the brief (modules/schemas/op.schema.yaml)
      declares each name's type, default, bounds and setter, the approved goal leg
      carries what the owner chose, and `--params` carries what the kernel chose.
      Only the overrides are stored on the row; dispatch merges the brief's
      defaults under them when it renders the packet. A `setBy: owner` name is
      accepted from --params only when the goal leg already carries it, and a
      `setBy: kernel` name is never accepted from a goal leg.
    returns: '{ok:true, job_id, workflowId, op, status:queued, attempt, cut, params, repository, peerOverlap:[{workflowId, jobId, path, ownPath}], peerHeadsUp:[{to, key, kind, subject}]}'
    peerOverlap: >-
      every open (queued|leased|running|answering|effect_unknown) job of a running peer (peers.rule)
      holding an owned path equal to, above or below one of --paths (engine/admission.mjs
      ownedPathsIntersect, the path-lease test) is listed in peerOverlap, and each such peer gets ONE
      heads-up peer message in the same transaction naming the overlapping job pairs
      (payload.overlapPairs, auto: enqueue-overlap; event 'peer-message-sent' on this workflow). A job
      pair already announced in either direction is not announced again. It never refuses: the
      capacity-1 path leases dispatch takes already serialize the writes
    refuses:
      - workflow-unknown: 'no workflows row'
      - workflow-finished: 'a finished phase takes no new work (finish below)'
      - unknown-op: 'no brief at modules/ops/ops/<opId>.yaml'
      - empty-paths: 'an op without owned_paths is an unbounded grant — never enqueued'
      - path-kernel-custody: 'an owned path under .starciwork/{kernel-evidence,kernel-strays,kernel-approvals} (modules/schemas/work-layout.yaml kernelCustody) — the kernel owns those roots and an op lease on one collides with every sibling op'
      - repository-unknown: '--repository names no repository the project binding (or, unbound, an existing directory) resolves'
      - path-repository-unknown: 'an owned path repository:<id>/… names a repository the project binding does not bind'
      - cut-invalid: 'cut flags are partial, empty, non-integral or outside 1 <= ordinal <= total with total >= 2'
      - after-unknown: '--after names a job that is not a job of this workflow'
      - after-settled: '--after names a job that already settled failed or cancelled; a settled row never succeeds, so the dependant could never run. A retry of that job (an answered ask included) chains through its retry lineage: enqueue the same op and cut ordinal without --after'
      - params-invalid: '--params is not a JSON object, names a param the brief does not declare, carries a value of the wrong type or outside its min/max/enum, sets a `setBy: owner` param the approved goal leg does not carry, or a goal leg carries a `setBy: kernel` param (scripts/route/dispatch-op.mjs resolveOpParams)'
      - 'params-invalid (field `reason`) for a missing `required: true` param: prints {ok:false, workflowId, op, reason:"params-invalid", param, detail} on stdout and exits 1, no job written. detail reads "<op> requires params.<name> (<type>, set by <setBy>): <doc> — none was given; re-run enqueue with --params ''{"<name>": <type>}''" (a `setBy: owner` param names the approved goal leg instead). provision.ask requires params.subject, the one-sentence provision or decision it asks'
      - 'foundations-undeclared (field `reason`): prints {ok:false, workflowId, op, reason, peers, detail} on stdout and exits 1, no job written - see foundations above'
      - foundation-not-owned: '--foundation names a foundation this workflow has not claimed'
      - foundation-name-invalid: '--foundation is not a lowercase slug'
      - contract-change-unknown: '--contract-change names no registered reach follow-up change'
      - follow-up-of-unknown: '--follow-up-of names no job of this workflow'
    duplicates: >-
      enqueue does not refuse a second live job for the same op: cutExecution
      (driver-loop.yaml) enqueues N disjoint same-op slices at once, each its
      own attempt. Duplicate suppression is the kernel's plan discipline, and
      the durable fence is dispatch admission — two jobs claiming a path both
      reach the capacity-1 `path:<owned_path>` lease and only one is admitted.
    usedBy: 'tick.enqueue — one row per planned op the queue lacks; retries enqueue attempt+1'

  # --------------------------------------------------------------------------
  # ROUTE — the model decision, persisted BEFORE dispatch. The kernel calls
  # this once per job before `dispatch`; it never picks a model ad hoc.
  # --------------------------------------------------------------------------

  route:
    args: '--job <job_id> [--prefer <pool>] [--avoid <pool>] [--difficulty <d>]'
    reads: >-
      the job row + its payload (payload.difficulty is the fallback when
      --difficulty is absent); the workflow goal's routing_bias {prefer[],
      avoid[]} — flag entries lead the merged list; modules/models/runtimes.yaml
      pool cards (maxParallel, provider) and maxParallelOps; the op
      manifest's route.riskHints host-tool-required entries against each
      pool's agent card capabilities.hostTools; the owner's
      budgets.maxOps; the workflow's own slot-holding operation count; live
      running counts; provider quota probes; typed expiring provider-health
      signals. Free-form incident text is evidence for the Kernel but never
      provider-health input
    providerCircuit: >-
      a pool whose provider has an OPEN provider-health circuit is rejected with
      "provider auth is unavailable: <detail> (circuit open until <iso>; the Kernel
      clears it with api provider-health --provider <p> --recover --reason <text>
      --probe)". An auth circuit records the non-reversible fingerprint of the
      credential it rejected (scripts/agent/credential-fingerprint.mjs: first 12 hex
      of sha256 over the key the card's credentialRefresh step resolves, or the Orca
      host account id for claude/codex) and reads CLOSED once the credential in
      effect has a different fingerprint. Otherwise only expiry or provider-health
      --recover closes it; resolving an incident never does
    typedWaits: >-
      before the owner-gate / peer-wait checks, route (and dispatch) resolve every open incident of
      the job's workflow whose typed --until-* conditions all hold (commands.incident.typedRelease),
      so a job whose wait is met is never refused for it
    blocking: >-
      a routed job's out carries blocking {waiters, workflows[], weight, outrankedBy:[{jobId, opId,
      weight, workflows[]}]} when other work waits on it or a heavier queued job of the same
      workflow does (scripts/kernel/waiter-priority.mjs): advisory, route never refuses on it; the
      Kernel dispatches the outranking job first (driver-loop.yaml tick.drive.waiterPriority)
    writes: >-
      jobs.payload_json gains {model, modelId, effort, routeChain,
      routeRejected, difficulty} — the PERSISTED route dispatch then launches
      exactly (dispatch reads payload.model/modelId/effort, never re-decides);
      events 'route-decided' {kind, difficulty, bias, ...decided}
    returns: '{ok:true, jobId, kind, difficulty, bias, decision:{model, modelId, effort, routeChain, routeRejected}}'
    maxOps: >-
      the workflow's concurrent-operation ceiling is min(budgets.maxOps, maxParallelOps) —
      the owner's per-workflow budget and the fleet-wide one, lower wins
      (engine/admission.mjs opSlotCeiling). A slot is held from the lease forward: leased,
      running, answering and the fenced effect_unknown. A queued job holds none. An unreadable
      owner config leaves budgets.maxOps unbounded and the fleet ceiling admits alone; a
      parallelism gear never raises either number. Pool maxParallel is a separate fence the
      capacity block above applies
    refuses:
      - 'max-ops (field `reason`): the workflow already holds min(budgets.maxOps, maxParallelOps) operations, so there is no slot for this decision to be spent on. Prints {ok:false, jobId, kind, reason:"max-ops", slots:{ok:false, running, ceiling, ceilingSource, reason}} and exits 1; the job stays queued and `api status` reports it queuedBecause max-ops'
      - 'peer-wait (field `reason`): an open peer-wait incident holds the job (status queuedBecause peer-wait). Prints {ok:false, jobId, kind, reason:"peer-wait", incident, peer} and exits 1; checked right after owner-gate, nothing is persisted'
      - job-unknown: 'no jobs row for --job'
      - job-reconcile-required: 'effect_unknown remains fenced until api reconcile proves no effect'
      - job-settled: 'a settled job takes no route — the decision was already spent'
      - job-not-queued: 'a live/leased/answering job cannot be rerouted; inspect status.workers and settle or reconcile its exact attempt'
      - job-live-worker: 'ledger says queued but the prior exact terminal is still connected+writable; reconcile it, never route a duplicate'
      - job-no-op: 'the job carries no op identity to route for'
      - 'tool-unavailable (field `reason`): the op''s manifest declares route.riskHints host-tool-required:<tool> and no pool in the kind''s order (its work/role order at the floor-raised difficulty, after bias) whose role and difficulty pin fit has an agent card listing that tool under capabilities.hostTools (scripts/agent/models.mjs missingHostTools). Capacity cannot fix it, so it is typed apart from the wait below. Prints {ok:false, jobId, kind, difficulty, bias, reason:"tool-unavailable", tools, holders:[{target, difficulties, roles}], detail} and exits 1, no decision persisted. detail reads "<op> needs host tool <tool> (...) and no agent in its <work> order at <difficulty> [...] has it; <pool> has it and is excluded by the avoid bias. Re-run api route --job <id> without --avoid <pool>." — or, when no holder is only avoided, "...; the agents that have it (...) are outside that order | no agent card lists it under capabilities.hostTools. Raise api incident --kind tool-unavailable for the owner." — both end "The job stays queued; never dispatch it on an agent without the tool."'
      - 'no decision (UNTYPED): selectPool returned none — capacity, eligibility or quota; a wait reason, not a failure. This one refusal prints {ok:false, jobId, kind, difficulty, bias, error:<selectPool message>} and exits 1 with no code string for the caller to match on'
    usedBy: >-
      drive.dispatch — `api route` runs BEFORE every `api dispatch`: the model
      decision is a ledger fact (payload + route-decided event), never an ad
      hoc kernel pick and never a dispatch-time surprise
  # --------------------------------------------------------------------------
  # DISPATCH — packet + contract row + lease + (with --spawn) the [Op]
  # terminal.
  # --------------------------------------------------------------------------

  dispatch:
    args: '--job <job_id> [--spawn] [--model <target>] [--worktree <sel>] [--lease-ttl <ms>]'
    leaseTtl: 'modules/models/runtimes.yaml allocation.dispatchLeaseTtlMs unless --lease-ttl or payload.leaseTtlMs overrides it'
    reads: >-
      the job row + its workflow — including the PERSISTED `api route`
      decision on jobs.payload_json (model/modelId/effort; dispatch launches
      what route wrote, it does not re-decide); resources/leases/budgets for
      admission; the op brief modules/ops/ops/<op>.yaml; in the target
      repository, the records its `mustExist` reads resolve to and the bound
      records' dependsOn (prerequisite-unmet below); the model resolution
      through route-model (modules/models/selection.yaml — eligibility first,
      budget orders the eligible)
    writes: >-
      admission FIRST, launch second: one `path:<owned_path>` lease row per
      owned_path (capacity-1 exclusive write fences, reserveTwoPhase — job
      queued->leased with its fencing token, ttl bounds a crashed worker's
      fence while settle releases early) + budget_reservations taken
      atomically; the packet's owned_paths resolve per target repository
      (enqueue `repository` above, scripts/kernel/target-repo.mjs): a path the
      resolver retargets carries {path relative to its repository, repository
      role, root checkout, declared}, and the prompt shows it bare when it
      lives in the worker's checkout (--worktree, else --repo) and rooted at
      its own checkout otherwise, under a `writes_in` line naming each root;
      a path it leaves where dispatch placed the worker (no binding, bare
      paths of an unretargeted op) stays {path} verbatim. api report accepts
      `files` in either spelling; contracts row = the rendered packet markdown keyed
      (workflow_id,op_id,attempt) with the dispatch_id — the worker's
      dispatch authority, read back via `api op-contract`, written BEFORE the
      job may stand running — whose context_json.inputs
      {schema:starci/input-digests@1, digests:[{path, digest, kind}]} records the
      sha256 of every input the op binds - kind source: each `knowledge/**` and
      `modules/schemas/**` path (and modules/models/code-patterns.yaml) named by
      the manifest's reads, context, knowledge or selected
      executionModes.<mode>.reads and by the packet params; kind work: each
      `.starciwork/**` record of payload.records (a record directory as the
      digest of its index.yaml/resource.yaml files) - a directory or glob as
      the digest of its sorted file digests, a missing path as `absent`
      (scripts/kernel/input-digests.mjs); `settle` later re-baselines the work
      entries to the bytes the job left; workflows.phase queued->running with a
      'phase-transition' event; jobs.status ->running with lease_token +
      worker_id only after attestation below (intent -> attested -> running);
      managed workers in an existing worktree have their exact assignee
      terminal renamed to `[Op] <op-id>` after dispatch-show (worker-start's
      creation display name otherwise renders as `worker-task_<id>`);
      events 'op-dispatched' ('dispatch-rejected' on refusal). A dispatch-rejected
      launch claims nothing — no contract row, no leases, no running phase.
    packet: >-
      the dispatch.yaml packet, fields unchanged — {op, brief,
      context:{workflow:{id,goal_revision,goal_identity},records,owned_paths,cut?},
      constraints:{model, budget, lease},
      returns:{verdict, evidence, suspicion}}
    priorFailures: >-
      a retry's prompt carries prior_attempt_failures: the red checks of the
      newest checks row of the job's OWN retry lineage before it
      (scripts/kernel/prior-failures.mjs priorChecksRow). An uncut op reads
      the newest earlier attempt of its own unit of work (enqueue uncutLineage);
      a cut ordinal reads only attempts of
      jobs with the same op, cut id AND ordinal (engine/admission.mjs
      cutRetryLineage), never a sibling slice that shares the op's durable
      attempt counter. payload.retry.retryOf, when it names a job of that
      lineage, caps the row at its attempt; one outside the lineage is
      ignored. No lineage row: no prior_attempt_failures.
    ownerAnswers: >-
      packet context.owner_answers (dispatch.yaml fields context.owner_answers):
      every ask an earlier attempt of the job's retry lineage filed that holds an
      `ask-answered` event, with the question, options, chosen {index, label},
      answeredBy, answeredAt and receipt path (scripts/kernel/owner-answers.mjs
      ownerAnswersOf; the lineage is payload.retry.retryOf|resumeOf, so a cut
      ordinal reads only its own ordinal). The prompt opens with an
      `owner_answers:` block saying each question is ALREADY ANSWERED, binding,
      and never asked again. Absent when the lineage holds no answered ask. An
      owner-answer retry is enqueued exactly as before (same op and cut ordinal,
      no --after); the answer rides in the packet, not in the Kernel's free text
      (starci-next business.decide attempt 12 re-filed the answered
      ctx_3074731253e3 as ctx_cc73a111de44 before this)
    spawn: >-
      with --spawn the api runs the Orca sequence itself — through
      scripts/agent/lib.mjs spawnAgent, so the agent card's
      command flags are auto-injected and can never be forgotten:
      terminal create titled `[Op] <op-id>` -> readiness read -> send the
      rendered packet — command, flags and readiness patterns from the
      agent card modules/models/agents/<agent>.yaml. The
      kernel agent never calls orca directly. Without --spawn: dry-run —
      the packet prints, nothing is reserved and nothing launches.
    attestation: >-
      spawn success is not launch success. Before the job may stand
      'running' the api attests the launch: the terminal handle is bound,
      the rendered packet visibly landed, and FIRST MODEL ACTIVITY is
      seen inside the launch window — against the adapter card's
      readiness patterns + knownFailures signatures. Managed-worker identity
      is read from Orca's typed launch receipt, including
      worker.startOptions.launch.effective (and the legacy top-level launch
      field); missing a legacy field is not a model mismatch. An auth failure or
      known-crash signature (e.g. '401 Invalid API-key'), a terminal that
      dies, or a prompt that never lands is `dispatch-rejected`: the job
      stays NOT running, the terminal is closed (scripts/agent/lib.mjs),
      and the lease + budget reservations are released — a dead launch is a
      routed refusal, never a running ghost.
    returns: '{ok:true, packet, job:{job_id, status, lease_token}, spawn:{terminal:<handle>}|null}'
    refuses:
      - 'max-ops (field `reason`): the workflow already holds min(budgets.maxOps, maxParallelOps) operations (route.maxOps above names the two numbers and which statuses hold a slot). Checked before the packet and before any Orca call, on a dry run as well as a --spawn, so nothing is reserved and nothing launches. Prints {ok:false, jobId, op, reason:"max-ops", slots:{ok:false, running, ceiling, ceilingSource, reason}} and exits 1; the job stays queued'
      - 'prerequisite-unmet (field `reason`): the op''s data prerequisites fail, checked after max-ops and before the packet and any Orca call, on a dry run as well as a --spawn (scripts/kernel/prerequisites.mjs). Two checks, data only: a manifest read marked `mustExist` whose every <placeholder> the job''s owned_paths or records spell out, with no file at that path in the repository (interface.audit reads.target); and, when graphPolicy.prerequisiteState is done, a bound record declaring dependsOn whose effective Work state (engine/index.mjs validateWorkspace) is decidably not done; and, for a read marked `layoutChain` (interface.draw reads.shell), a bound ui record whose `route` sits under a layout of the layout tree (.starciwork/shell/index.yaml) that is not settled. An unresolved placeholder, a record outside a Work tree, an invalid tree, or a ui record not yet written / without a route is unknown and admits. Prints {ok:false, jobId, op, reason:"prerequisite-unmet", unmet:[{kind:record-missing, read, path}|{kind:dependency-not-done, record, dependsOn:[{id,state}]}|{kind:layout-unsettled, read, record, route, layouts:[{node,reasons}]}], detail} and exits 1; nothing is reserved. detail reads "<op> reads <path> (reads.<id>, mustExist) and it does not exist | bound record <r> depends on <id> (<state>), not done, and <op> graphPolicy.prerequisiteState is done. Produce the missing record or finish the dependency through the op that owns it, then run api dispatch --job <id> again; if the job binds the wrong record, enqueue a corrected job and settle this one --verdict blocked. The job stays queued and nothing was reserved or launched."'
      - 'peer-wait (field `reason`): an open peer-wait incident holds the job. Checked right after owner-gate and before max-ops, on a dry run as well as a --spawn. Prints {ok:false, jobId, op, reason:"peer-wait", incident, peer} and exits 1; the job stays queued'
      - job-settled: 'job already settled — one lease, one agent, one verdict (dispatch.yaml oneOpOneAgent)'
      - job-not-queued: 'only a queued job may dispatch; a live attempt keeps its exact worker and lease'
      - job-live-worker: 'queued row still has a connected+writable exact worker; api reconcile must reattach it before any new dispatch'
      - job-no-op: 'the job row carries no op identity to dispatch'
      - model-unknown: 'no model profile at modules/models/profiles/<target>.yaml'
      - brief-missing: '--spawn with no brief at modules/ops/ops/<op>.yaml — the packet would cite a contract that is not there'
      - 'tool-unavailable (field `reason`): --spawn whose launch agent (the persisted route, --model, or the unrouted default) lacks a host tool the op''s route.riskHints requires. Checked before leases and before any Orca call; prints {ok:false, jobId, op, reason:"tool-unavailable", tools, model, detail} and exits 1, the job stays queued. detail reads "<pool> (agent <provider>) lacks host tool <tool> that <op> requires (...). Re-run api route --job <id> — it now selects only agents whose card lists the tool — then dispatch again. The job stays queued." A dry run does not refuse; it carries `toolUnavailable`'
      - managed-agent: '--spawn on a launch kind that is neither command-terminal nor managed — that path is orca orchestration worker-start (modules/host/orca/index.yaml managedFallback)'
      - 'reserve-failed (UNTYPED, field `refused`): admission threw on job identity/status drift — the job row is left untouched, an operator error rather than a dispatch rejection'
      - dispatch-rejected: >-
          the one typed rejection for every launch failure, carried in the
          `rejected` field: an open provider-health circuit, a refused
          admission (a live capacity-1 `path:<owned_path>` lease or
          `machine:*` budget another in-flight job already holds — the
          reasons ride `reserve.reasons`), run-create, task-create, a dead
          spawn, prompt send/submission, attestation against the adapter
          card's knownFailures, or a dispatch-show assignee mismatch. In every
          case the job is NOT running, the terminal is closed and the lease +
          budget reservations are released. The refused launch is appended to
          payload.rejectedDispatches[] {dispatchId, step, at, effectState} —
          the evidence reconcile proves no-effect against, kept apart from
          payload.managed so it can never be read as the job's live binding.
          An unclassified worker-start refusal also records a provider strike
          (modules/models/runtimes.yaml allocation.providerStrikes), and the
          strike that reaches the limit opens the typed provider circuit
    layoutPreflight: >-
      the owned-path legality preflight dispatch.yaml describes is the
      KERNEL's step before enqueue, not an api refusal: api dispatch does not
      read the target repo's layout/lint contracts
    usedBy: 'drive.dispatch — only jobs whose owned_paths are disjoint and whose capacity is free'

  # --------------------------------------------------------------------------
  # RECONCILE — resolve a quarantined managed launch from exact host proof.
  # --------------------------------------------------------------------------

  reconcile:
    args: '--job <job_id> [--retry-lineage | --drop --reason <text> | --reap | --dead-worker [--settle-failed] | --release-worker] | --orphan-kernel-jobs [--workflow <id>] [--dry-run] | --orca-tasks [--workflow <id>] [--dry-run] | --work-debt [--workflow <id>]'
    orphanKernelJobs: >-
      `--orphan-kernel-jobs` (no --job) settles every kernel job still queued,
      leased, running or answering whose workflow is finished or archived:
      status cancelled with result {reason:'orphan-kernel-job', workflowPhase,
      archivedAt, terminal}, its leases deleted, a finished workflow's kernel
      signal released, one 'orphan-kernel-job-reconciled' event each. The
      terminal it names is reported, never closed (resume-all's terminal dedupe
      owns stray terminals). --dry-run writes nothing. Returns
      {ok, mode:'orphan-kernel-jobs', dryRun, reconciled:[{jobId, workflowId,
      status, terminal, phase, archivedAt, signal, settledAs, leasesReleased,
      signalReleased}]}. Supervisor-safe: it touches only rows of workflows that
      can no longer run. Called by scripts/kernel/restart-all.mjs.
    workDebt: >-
      `--work-debt` (no --job) lists the Work that settled legs of the ops
      contract change authoring-ops-commit-work governs left uncommitted:
      for each succeeded job of those ops (or of --workflow), newest first,
      every untracked or dirty file under its owned paths, per checkout, each
      file named once (the newest job claims it). A file modified more than a
      minute after its job settled is listed as laterWrites, never as that
      job's debt. Read-only; it writes nothing. The repair is batched:
      `batches` holds one entry per workflow and op with the exact
      `api enqueue --workflow <wf> --op <op> --commit-only-work-debt`, ONE
      commit-only attempt covering the union of that op's owed paths, whose
      packet says it authors nothing and commits exactly those files, and which
      settles through the landed proof over all of them. Each debt also names
      its single-job repair (`--paths <those files> --commit-only-of <jobId>`).
      A job a live or succeeded commit-only attempt already names (alone or in
      a batch) is listed repairPending with no enqueue. Returns {ok, change,
      ops, debts:[{workflowId, jobId, op, attempt, repo, role, paths,
      laterWrites, repairPending, enqueue}], owed, files, batches:[{workflowId,
      op, jobs, files, enqueue}], unreadable}.
    orcaTasks: >-
      `--orca-tasks` (no --job) reconciles the Orca Tasks of each workflow
      (or --workflow) with the ledger. A running workflow whose kernel job is
      running and whose terminal is live gets its current Run bound to that
      terminal (scripts/kernel/orca-runs.mjs bindWorkflowRun, one run-use
      after a restart) and every open StarCi Task in the Run ([Op] display
      name or `<op> #<n>` title) that no running/answering/leased job holds is
      closed with task-update completed. Runs with no live coordinator
      (superseded, finished) are read only: their open Tasks are reported
      `unclosable`. A settled job whose Task Orca lists closed or no longer
      lists gets payload.taskClosed {ok:true, verifiedBy:orca-task-list}.
      One 'orca-tasks-reconciled' event per workflow that changed. Returns
      {ok, mode:'orca-tasks', dryRun, totals:{closed, unclosable,
      ledgerClosed, rebound, errors}, workflows:[{workflowId, kernelTerminal,
      currentRun, runs:[{runId, current, bound, closed, kept, unclosable,
      ledgerClosed, errors}]}]}; exit 1 when any Orca call failed. Called by
      scripts/kernel/restart-all.mjs after the kernels are live.
    deadWorker: >-
      `--dead-worker` is the saga recovery of a RUNNING (or answering) job whose
      exact worker terminal is gone: status worker liveness disconnected, or
      gone (a running Orca answered terminal_handle_stale - every op terminal
      after a host shutdown), or agent-exited (the terminal is back at a bare
      shell prompt), frontier `worker-dead`. An unreachable Orca
      (liveness unknown) refuses worker-liveness-unproven and a live terminal
      refuses worker-alive; both write nothing. Three routes. (1) A report is
      filed for the attempt: nothing is written and the answer is
      {recovery:'settle', route:'settle', report:{dispatchId,outcome,consumed},
      next} - consume-report, check and settle it as usual. (2) Provably no
      effect: no report, no checks row, no worker-question inbox row, the op
      manifest's route.riskHints name none of external-effects,
      runtime-effects, live-provider, destructive-gate, and git shows not one
      uncommitted change nor one commit on any ref since the dispatch
      contract's created_at under the owned paths (resolved per repository
      like settle's landed proof; an unreadable tree is evidence, never
      proof). The contract row alone is dispatch's delivery, not effect. The
      SAME job and attempt return to queued: leases deleted (machine refs
      released best-effort), managed/orca/runtime dispatch and terminal
      bindings cleared, a managed Dispatch stopped and released best-effort,
      payload.deadWorkers[] gains {attempt,dispatchId,terminal,liveness,
      recovery,at}, result {reason:'dead-worker-requeued',effectState:'none',
      attemptConsumed:false,retryable:true,proof} and one event
      'dead-worker-requeued'. It is an infrastructure retry that spends no
      business attempt; route and dispatch it again. The same attempt is
      requeued at most 3 times (DEAD_WORKER_REQUEUE_LIMIT); the next death
      is fenced with evidence infra-retries-exhausted:<n>. (3) Otherwise the
      job is fenced effect_unknown (effectState partial on effect evidence,
      unknown when only the budget ran out), leases and bindings kept, result
      {reason:'dead-worker-fenced',evidence[],worker,paths} and one event
      'dead-worker-fenced'. The Kernel inspects the evidence (dirty:<path>,
      commit:<sha>, checks, worker-question:<key>, risk:<hint>,
      owned-paths-unverifiable:<why>, op-manifest-unreadable) and settles it
      fail or blocked, then retries as a new attempt whose contract names the
      partial state; a plain reconcile of that job refuses dead-worker-fenced.
      Repeating --dead-worker on a recovered job is idempotent
      (alreadyRecovered:true). After a requeue or a fence is written (and on
      a repeat, for the attempt's recorded dead terminal) the worker's
      terminal is closed with its tab (scripts/kernel/close-op-terminal.mjs
      closeExitedTerminal) only on fresh proof that it is disconnected or its
      frame ends in a bare shell prompt (an exited agent's PowerShell); an
      agent screen, an unreadable frame or an Orca that does not answer
      leaves it open. The attempt is returned as terminalClosed
      {handle,closed,proof:disconnected|shell-prompt|gone|null,shellPrompt?,tab?,reason?,error?}
      and, unless the handle is gone, recorded as the job event
      'dead-worker-terminal-closed'. The settle route closes nothing. Returns
      '{ok:true,jobId,recovery:requeued|fenced|settle,status,attempt,effectState,attemptConsumed,evidence?,worker,proof?|paths?,terminalClosed?}'.
      A worker is also dead when its liveness is `quiet`: still at its idle
      prompt (or frozen) longer than its provider's quietMs after a delivered
      nudge of this dispatch, with no output since (runtimes.yaml
      allocation.liveness.quietMs, a card's liveness.quietMs); nudge refuses
      it worker-quiet, and its recovery quits the agent (quit-agent.mjs)
      before closing its terminal (proof quiet-quit).
    settleFailed: >-
      `--dead-worker --settle-failed` is the recovery the watchdog runs under
      --repair for every frontier deadWorkerJobs entry (scripts/kernel/watchdog.mjs
      recoverDeadWorkers), so a dead worker never waits on a Kernel or a
      hand-written incident. Routes (1) and (2) are unchanged. In place of
      route (3), evidence the owned paths bound (dirty:<path>, commit:<sha>,
      checks, worker-question:<key>, infra-retries-exhausted:<n>) settles the
      attempt failed with result {verdict:fail, reason:'failed-no-report',
      reportFiled:false, effectState:partial|unknown, attemptConsumed:true,
      evidence, worker, paths}: leases deleted, pending worker questions
      closed, events 'op-settled' {reason:failed-no-report, auto:true} and
      'worker-failed-no-report', and ONE retry of the same op, records, owned
      paths and cut ordinal enqueued as attempt+1 through the ordinary retry
      lineage (payload.retry.retryOf, payload.retryReason; a business attempt
      is spent and route limits still apply). After the transaction the
      managed worker is released (settle's releaseManagedWorker, custody
      proven), a plain terminal's dead shell or quiet agent is closed, and the
      Orca Task is closed. Evidence the owned paths cannot bound (risk:<hint>,
      owned-paths-unverifiable, op-manifest-unreadable) is still fenced for
      the Kernel. A job --dead-worker already fenced on bounded evidence is
      settled the same way by --settle-failed. When one op of a workflow has
      ended failed-no-report 3 times (DEAD_WORKER_PATTERN_THRESHOLD) one open
      incident '[worker-died-no-report-pattern] <op>: ...' names the pattern
      for the runtime supervisor, raised once while it stays open. A repeat
      on a settled job is idempotent (alreadyRecovered:true, retry). Returns
      '{ok:true,jobId,recovery:settled-failed,status:failed,verdict:fail,reason:failed-no-report,attempt,effectState,evidence,liveness,leasesReleased,retry:{enqueued,jobId,attempt,businessAttempt|reason},terminalClosed?,managedWorker?,taskClosed?,pattern:{raised,count,threshold,incidentId?}}'.
    releaseWorker: >-
      `--release-worker` proves, and if needed redoes, a SETTLED job's worker
      release: for a managed worker settle's release (quit with the worker's
      own agent CLI, worker-stop, worker-release, the exact agent terminal
      closed), for a command terminal the quit and close, then the Orca
      Task close. Custody is read back, never inferred from Orca's release
      answer: {state:released, proof:release-ok|terminal-disconnected|terminal-gone}
      when the release said ok or the exact agent terminal now reads
      disconnected or unknown to a running Orca; retained only while it still
      reads connected; unknown when Orca does not answer. Idempotent: a job
      whose recorded custody is released and whose Task is closed writes
      nothing (alreadyReleased:true). One event 'worker-release-reconciled'.
      Refuses release-worker-not-settled. Returns
      '{ok,jobId,custody,managedWorker?,terminalClosed?,taskClosed}'; exit 1
      while custody reads retained.
    reap: >-
      `--reap` cleans a SETTLED op's terminal that is still live (one settled
      before settle closed tabs and stopped leftover agent processes, or a
      supervisor ORPHAN/STRAY finding): it closes the terminal with its tab,
      stops the agent process when the close did not (only an unambiguous
      match, scripts/kernel/reap-agent-process.mjs), and appends
      'terminal-reaped' {handle, closed, tab, reaped, connected}. A terminal
      that is not live writes nothing. Refuses reap-not-settled and
      reap-no-terminal. Leftover op terminals are the Kernel's to clean.
    drop: >-
      `--drop --reason <text>` retires a QUEUED job that never crossed the
      dispatch boundary (the same evidence test as --retry-lineage): the row
      settles `cancelled` with result {verdict:'dropped', reason, at} and one
      event 'job-dropped' {op, attempt, reason, cut, waiting}. `waiting` names
      every queued job whose --after is this job, or whose cut seam this job
      is (it was the seam's live head). An --after dependant reads
      dependency-failed in status until the Kernel re-points or drops it; a
      dropped seam retry is no seam, so the other ordinals wait on the seam's
      previous live job (an answered ask reads `dependency`) or on the next
      ordinal-1 retry the Kernel enqueues. It
      is how a Kernel clears a cut whose grants are wrong before it re-plans
      it. Refuses drop-not-queued, drop-needs-reason and drop-dispatched
      (with `evidence`).
    retryLineage: >-
      `--retry-lineage` is a separate repair, not a launch reconcile: for a
      QUEUED job that never crossed the dispatch boundary it re-derives
      payload.retry exactly as enqueue now would (the cut rule above: same
      op + cut id + ordinal, skipping rows retired before dispatch) from the
      jobs before its attempt, rewrites it in
      one transaction and appends one event 'retry-lineage-repaired'
      {attempt, cut, before, after}. An already-correct lineage writes
      nothing and returns repaired:false. Returns
      '{ok:true,jobId,repaired,attempt,cut,before,after}' (repaired:false
      returns {retry} instead of before/after). Refuses
      retry-lineage-not-queued (status is not queued) and
      retry-lineage-dispatched (a contract, report, check, held lease,
      worker id, managed/orca/runtime dispatch binding, rejectedDispatches
      entry or dispatch-side event exists for the job; the refusal carries
      `evidence`) — a dispatched attempt's lineage is history and is never
      rewritten.
    reads: >-
      either an effect_unknown managed launch, or a queued row whose accepted
      contract still points at a connected+writable exact operation terminal;
      contracts and reports for the exact {workflow_id,op_id,attempt}; Orca
      terminal/worker observation and cleanup receipts through wrappers
    writes: >-
      queued+live recovery re-reserves the same owned-path leases, restores
      status=running and the exact worker identity, and appends
      live-worker-reconciled without spawning or re-sending anything. For an
      effect_unknown launch, only after proof of no operation effect: deletes the job's exact leases,
      clears stale worker/task/terminal bindings, returns the SAME job and
      attempt to queued, records result {reason:'dispatch-reconciled',
      effectState:'none',attemptConsumed:false,retryable:true,proof}, and appends
      'dispatch-reconciled'. Machine lease refs are released best-effort after
      the ledger transaction. An ambiguous proof writes nothing and retains
      the fence.
    proof: >-
      no accepted contract or report exists; the exact managed worker is
      failed at stage dispatch_input with last_failure agent_prompt_stalled;
      observation says exactWorker:true and the process/terminal is exited;
      release completed, or state=retained only because
      reason=identity_unproven (terminal bookkeeping with no process action)
    returns: '{ok:true,jobId,reconciled:true,dispatchId,status:queued,attempt,effectState:none,attemptConsumed:false,leasesReleased,machineRefsReleased,cleanup}'
    refuses:
      - job-unknown
      - job-not-reconcilable: 'status is neither effect_unknown nor the idempotent case of a row already back at queued'
      - retry-lineage-not-queued: '--retry-lineage on a job that is not queued'
      - retry-lineage-dispatched: '--retry-lineage on a job that was ever dispatched (refusal carries evidence[])'
      - dispatch-identity-missing: 'no exact managed Dispatch id is bound'
      - accepted-contract-exists: 'operation authority may have landed; never infer no effect'
      - worker-report-exists: 'worker evidence exists; use ordinary consume/check/settle'
      - 'incomplete proof (UNTYPED): cleanup reports effectState other than none — the refusal prints {ok:false, jobId, reconciled:false, dispatchId, effectState, cleanup} and exits 1; status and lease stay unchanged'
      - live-worker-lease-conflict: 'the exact live worker exists but its owned paths cannot be re-fenced; do not duplicate or continue unfenced'
      - dead-worker-not-running: '--dead-worker on a job that is neither running nor answering (nor already recovered by it)'
      - 'worker-liveness-unproven (UNTYPED exit 1): --dead-worker while the exact terminal reads unknown (Orca unreachable or no handle); nothing written'
      - 'worker-alive (UNTYPED exit 1): --dead-worker while the exact terminal is live; nothing written'
      - dead-worker-raced: 'the job changed status between the observation and the recovery transaction; re-read status'
      - dead-worker-fenced: 'a plain reconcile of a job --dead-worker fenced on effect evidence; inspect and settle it'
    usedBy: 'drive.reconcile before route; drive.status worker-dead (--dead-worker); infrastructure retry reuses the same logical attempt and does not consume business route budget'

  nudge:
    args: '--job <job_id>'
    reads: 'running operation job, exact report row, exact terminal show/read frame'
    writes: >-
      sends a fixed liveness wake to the same exact operation terminal and
      appends op-worker-nudged. It creates no job, contract, lease, retry,
      verdict or authority.
    returns: >-
      {ok:true,jobId,nudged:true|false,action?:wake|submit-staged-input,delivery?:delivered|queued,evidence?:wake-text|queued-marker|screen|receipt,sendErrorCode?,enterRetried?,splitRetried?,splitOutcome?:delivered-after-split|unstaged|unsubmitted,reason?,worker,receipt?}
      — nudged:false with ok:true and exit 0 is a SKIP, not a refusal: reason
      'report-filed' (the durable answer already exists) or 'worker-active'
      (the turn is running). A worker whose liveness is `staged-input` (its
      paste never left the input row) gets ONE Enter-only send and no wake
      text, action submit-staged-input: typing a wake on top of the paste
      would bury it (inc-06aeecf432f1). Every other nudge is action wake.
      Delivery is proven from the screen (scripts/kernel/wake-delivery.mjs),
      not Orca's receipt alone: the frame is read before and after the send,
      and the wake text appearing (delivered) or a queued-message marker such
      as Claude's "Press up to edit queued messages" (queued) proves it, so
      agent_prompt_stalled / agent_prompt_blocked with the wake on screen is a
      nudge (op-worker-nudged carries delivery and sendErrorCode), never
      terminal-send-failed (inc-b87a42ec8690, inc-e4f69f9ef061, inc-13ab4be5059f)
      A frame that stays turn-idle with no wake text, no queued marker and no
      staged input is a dropped send whatever the receipt said (a Codex Kernel
      took ok:true text+Enter sends that never reached its screen, 2026-09-24):
      the wake is retried once split - the text with enter:false, proven staged
      in the input row, then Enter-only, proven again - and the result and
      event carry splitRetried:true with splitOutcome delivered-after-split, or
      unstaged/unsubmitted on a terminal-send-failed. A worker whose agent
      exited is never woken (scripts/kernel/terminal-liveness.mjs
      exitedAgentPromptRow: the frame ends in a bare shell prompt, or in a
      prompt row drawn under the agent's own input row/footer, as when
      PowerShell's prompt overwrites a dead Codex's footer without clearing
      it): the frame is re-read immediately before typing, whatever observe
      saw, and refuses with reason 'agent-exited' and nothing typed; an
      unreadable frame types nothing (delivery unreadable). A frame read
      after the send that shows a host shell got the text (the text after a
      shell prompt, a new shell error, or a bare prompt) is never delivered:
      reason 'agent-exited', delivery agent-exited, evidence
      shell-echo|shell-error|shell-prompt, typed:true, no retry, and one
      event 'op-worker-wake-to-shell' instead of op-worker-nudged (nivo
      term_8f9e0611, 2026-09-24 03:56: PowerShell ran a nudge and its echo
      read as delivered). Recover the job with reconcile --dead-worker.
    refuses:
      - 'agent-exited (field `reason`, exit 1): the worker''s agent exited - before the send (nothing typed) or under it (typed:true, a shell received the text); run api reconcile --job <id> --dead-worker'
      - job-unknown: 'no jobs row for --job'
      - job-not-operation: 'only an operation job has a worker terminal to wake'
      - job-not-running: 'only the current running attempt may be nudged'
      # the four below exit 1 carrying the string in `reason`, not in `code`
      - worker-unavailable: 'exact terminal is disconnected/unwritable'
      - interactive-gate: 'permission/trust input is a typed environment problem, not a wake (liveness `failed` refuses under its own name the same way)'
      - worker-state-unknown: 'liveness is neither turn-idle nor live-idle — weak observation never authorizes input'
      - terminal-send-failed: 'neither the receipt nor the screen shows the wake on the exact terminal (delivery failed, evidence names what the screen showed); no op-worker-nudged event is appended'
    usedBy: 'drive.wait on the first turn-idle observation with no durable report'

  # --------------------------------------------------------------------------
  # OBSERVE — screen context on the job's own exact op terminal. It touches no
  # jobs/contracts/reports/checks/leases row and sends nothing, but it is not a
  # pure read: it appends its own 'op-observed' receipt event.
  # --------------------------------------------------------------------------

  observe:
    args: '--job <job_id> [--lines <n>]'
    reads: >-
      the job row; the exact operation terminal handle resolved from the
      dispatch binding (payload.managed/orca agentTerminalHandle, hierarchy
      runtime handle, or worker_id — the same source nudge/status use);
      Orca terminal-show for liveness plus a bounded terminal-read screen
      tail through scripts/api/orca wrappers — the kernel still never calls
      orca itself
    writes: >-
      one events row kind 'op-observed' {opId, attempt, terminal, turnState,
      screenBytes} — a compact receipt only; the screen bytes never enter
      the ledger. No jobs/contracts/reports/checks/leases row is touched:
      observation is READ-ONLY reasoning context, never evidence — an op's
      screen is never proof; only `api report` plus kernel-run `api check`
      rows settle a verdict
    returns: '{ok:true, job, jobId, opId, attempt, ledgerStatus, terminal:{handle,connected,writable,status,idleMs,screenState?}, screen:<tail of last --lines lines, default 80, null when unreadable>, turnState:active|staged-input|turn-idle|disconnected|unreadable|unknown, observedAt} — staged-input is an unsubmitted paste (status workers.liveness); api nudge submits it'
    refuses:
      - job-not-found: 'no jobs row for --job'
      - job-not-operation: 'only an operation job has an observable worker terminal'
      - no-live-worker: 'the job binds no live worker terminal (never dispatched, or no handle recorded) — typed, not a crash'
    usedBy: >-
      drive.wait — the modules/models/runtimes.yaml allocation.observeCadenceMs
      observation cadence on a running op keeps
      reasoning context alive before nudge/settle-fail decisions;
      observation never substitutes for report/checks

  # --------------------------------------------------------------------------
  # WORKER QUESTIONS — the bridge for a worker that asked through Orca instead
  # of filing `api report --outcome ask`. Orca's preamble tells every worker to
  # reach its coordinator with an Orca orchestration ask; the coordinator is the
  # Kernel terminal, which never calls Orca. Without these verbs the questions
  # sat unanswered while the workers waited (inc-b944cbaef24b,
  # inc-20449a260df8). The op contract is unchanged - an owner question is an
  # outcome ask carried by serve-ask - and the runtime still never strands a
  # worker that asked the other way.
  # --------------------------------------------------------------------------

  questions:
    args: '--workflow <id>'
    reads: >-
      the workflow's Orca Runs (payload orca/managed/hierarchy runId of its jobs); the host inbox
      through scripts/api/orca/orch-inbox.mjs (calls.yaml `inbox`, a read that acknowledges and marks
      nothing); every `question` row of those Runs, joined to the job whose dispatch
      (from_handle dispatch:<id> or payload.dispatchId) or terminal handle asked it; inbox rows of
      kind worker-question
    writes: >-
      one inbox row per new pending question {kind: worker-question, key: <message id>,
      payload {messageId, runId, jobId, opId, attempt, dispatchId, taskId, question, options[],
      subject, askedAt}, status pending} and event 'worker-question-bridged'; a bridged row whose job
      settled or that got a reply in Orca directly is closed status done {reason}
    returns: '{ok:true, workflowId, bridged, closed, pending:[{messageId, jobId, opId, attempt, question, options[], state:pending, bridged}], error?}'
    refuses:
      - workflow-unknown
    usedBy: 'drive.wait when status frontier is worker-question: bridge, read each question, then answer with api reply'

  messages:
    args: '--workflow <id> [--all]'
    reads: >-
      every orchestration message of the workflow's Orca Runs through scripts/api/orca/orch-inbox.mjs (the
      same non-consuming read `questions` uses; heartbeat and progress rows dropped unless --all), joined to
      the job whose dispatch or terminal sent it; the ids the Kernel already read (events
      orchestration-messages-read)
    writes: "one event 'orchestration-messages-read' {ids} naming the messages this read showed for the first time; nothing in Orca is acknowledged or marked read"
    returns: '{ok, workflowId, runs[], count, new, messages:[{id, type, subject, body<=600, from, to, runId, threadId, createdAt, jobId, opId, attempt, jobStatus, new, handle}], error?}'
    refuses:
      - workflow-unknown
    why: >-
      Orca tells the Kernel terminal "You have N orchestration messages. Run orca orchestration check ..."
      for every message type, but the Kernel may not call Orca and `questions` bridges only `question`
      rows, so the notice pointed at messages no authorized verb could read (starci-next
      inc-81559e3a064b, mia inc-c55b52879387). `handle` says where each type is acted on: a question
      through api reply, worker_done and status are information (the report and settle come through the
      ledger), an escalation through observe/nudge/reconcile or an incident.
    usedBy: 'the Kernel, whenever its terminal shows the orchestration-message notice (modules/kernel/driver-loop.yaml)'

  reply:
    args: '--workflow <id> --message <msg_id> (--body <answer> | --to-owner [--body <note>])'
    reads: 'the pending worker question (questions above), the job it belongs to'
    writes: >-
      Orca `reply` to the exact question message through scripts/api/orca/orch-reply.mjs (calls.yaml
      `reply`; --run is the question's Run and Orca resolves --from to the calling Kernel terminal), then
      the worker-question inbox row -> status applied {reply, toOwner, at} (inserted applied when it
      was never bridged) and event 'worker-question-answered'. A reply is technical guidance inside the
      job's existing contract and authority - never new scope, paths, retry or owner intent (the api
      never answers an owner's decision). --to-owner sends the fixed routing reply instead: the worker
      files the question as `api report --outcome ask` and ends its turn, so askLifecycle and serve-ask
      carry it to the owner exactly like any other ask.
    returns: '{ok:true, workflowId, messageId, jobId, toOwner, body}'
    refuses:
      - workflow-unknown
      - reply-body-missing: 'neither --body nor --to-owner'
      - question-unknown: 'no question message with that id in the workflow''s Runs'
      - 'question-answered / question-replied-elsewhere / question-job-settled / question-unmatched: the question no longer waits on this Kernel (already answered, answered in Orca, its job settled, or no job of this workflow asked it)'
      - 'reply-failed (field `reason`): the Orca reply did not land; nothing is written and the question stays pending'
    usedBy: 'drive.wait — answer every pending worker question before yielding'

  # --------------------------------------------------------------------------
  # PEER MESSAGES — Kernel-to-Kernel mail between workflows that build in the
  # same source. One product ledger holds several running workflows (nivo:
  # app-auth, workspace-provision, modules-agentos, collab-group-chat) whose
  # jobs write the same repositories. A Collab Kernel needed phone
  # verification the Login workflow owns and asked the owner who should build
  # it; workflows edited overlapping areas; a repo-wide migration was owned by
  # no workflow. Peers settle that between themselves through inbox rows of
  # kind peer-message. These are Kernel verbs: an op never sends or reads them.
  # --------------------------------------------------------------------------

  peers:
    args: '--workflow <id>'
    rule: >-
      A peer is every OTHER workflow of the same ledger whose phase is running, that is not
      archived, and that shares a source root (workflows.source_roots_json) with --workflow; a
      workflow with no recorded roots shares every root. define-goal records the ledger's own repo
      as every workflow's root and a job's `repository` is mostly unset, so in practice every
      running workflow of one ledger is a peer: the ledger is one product whose binding spans its
      repositories (nivo-backend + nivo-fe)
    reads: 'workflows rows; the open (queued|leased|running|answering|effect_unknown) jobs of each peer; pending peer-message inbox rows'
    writes: 'nothing — pure projection'
    returns: >-
      {ok:true, workflowId, rule, peers:[{workflowId, title, phase, currentLeg:{jobId, op, status,
      attempt}|null (the most recently moved in-flight job, else the latest queued one),
      ownedPaths:[{jobId, op, status, paths[]}], pending:{toPeer:[{key, from, to, kind, subject, at}],
      fromPeer:[...]}}]}
    refuses:
      - workflow-unknown
    usedBy: 'before planning work that may belong to another workflow''s scope, and to see who owns a path before touching it'

  notify:
    args: '--workflow <from> --to <peerId,...|peers> --kind <request|heads-up|handoff|reply> --subject <s> --body <text> [--reply-to <key>] [--refs <csv>]'
    kinds: >-
      request (work the sender needs that lies in the peer's scope — the peer builds it or answers
      why not), heads-up (the sender changed or will change a shared contract, record or path the
      peer reads), handoff (the sender gives the peer a piece of work or ownership, e.g. a repo-wide
      change no workflow owns), reply (answers a received message; --reply-to is required)
    reads: 'the sender and every target workflows row; the sender''s received message --reply-to names; the targets'' pending peer messages'
    writes: >-
      one inbox row per target {workflow_id: <target>, kind: peer-message, key: pm-<12 hex>, status
      pending, payload {from, fromTitle, kind, subject, body, replyTo, refs[], at}} and one event
      'peer-message-sent' {to, key, kind, subject, replyTo} on the sender. `--to peers` sends to
      every current peer (none is ok:true with sent []). A message identical to one still pending
      for that target (same from, kind, subject, body, replyTo) is not written again: its key comes
      back with deduped:true. A new message to a target that holds open peer-wait incidents on the
      sender resolves each of them marked --until-message ('incident-resolved' {detail, peerMessage,
      peer, by:peer-message} on the target) and wakes the target's Kernel best-effort with a
      peer-wait-message transition (kernel-transition-woken); a wait without --until-message stays
      open for that Kernel to resolve once it has checked the proof. Each target's typed waits
      (--until-message <peer>[:kind], commands.incident.typedRelease) are then evaluated: one that
      now holds is resolved and, unless the peer-wait wake above already ran, its Kernel is woken
      (transition incident-auto-resolved); sent[].autoResolved names them
    returns: '{ok:true, workflowId, kind, subject, replyTo, sent:[{to, key, kind, subject, deduped?, peerWait?:{waits[], resolved[], wake}, autoResolved?:[{incidentId, evidence[], wake?}]}]}'
    refuses:
      - workflow-unknown
      - workflow-finished: 'a finished sender sends nothing'
      - peer-kind-invalid: '--kind is not request|heads-up|handoff|reply'
      - peer-message-empty: '--subject or --body is blank'
      - reply-to-missing: '--kind reply without --reply-to'
      - reply-to-unknown: '--reply-to names no peer message the sender received'
      - reply-to-mismatch: 'the targets do not include the sender of the --reply-to message'
      - 'peer-self / peer-unknown / peer-not-running / peer-not-shared-source: a target is the sender, no workflow of this ledger, finished or archived, or shares no source root. Nothing is written for any target'
    usedBy: 'drive — a request instead of doing a peer''s work or asking the owner who should; a heads-up on every shared-contract change; a reply to every request'

  inbox:
    args: '--workflow <id> [--ack <key> --disposition <text>]'
    reads: 'peer-message inbox rows addressed to --workflow, and the latest 20 it sent'
    writes: >-
      without --ack nothing. --ack sets that pending row status applied, disposition_json
      {disposition, by, at} and applied_at, and appends 'peer-message-acked' {key, from, kind,
      disposition} on --workflow; the sender reads the disposition back in its own `api inbox` sent
      list
    returns: >-
      {ok:true, workflowId, pending:[{key, from, fromTitle, kind, subject, body, replyTo, refs[], at}],
      sent:[{key, to, kind, subject, replyTo, at, status, disposition, appliedAt}] newest first}  |
      --ack: {ok:true, workflowId, acked:{key, from, kind, subject, disposition}, pending:<n left>}
    refuses:
      - workflow-unknown
      - peer-message-unknown: '--ack names no peer message in this workflow''s inbox'
      - peer-message-not-pending: 'already acked (the existing disposition is quoted) or closed by finish'
      - disposition-missing: '--disposition is blank (absent is a usage error, exit 2)'
    usedBy: 'drive — every wake reads it before planning; each message is acted on and acked with what was done'

  # --------------------------------------------------------------------------
  # FOUNDATIONS — the ledger-level registry of shared foundations across the
  # workflows of one ledger (scripts/kernel/foundations.mjs; driver-loop.yaml
  # foundations): a layout tree/shell, a brand, a grammar version, a shared
  # module or contract - ONE owner workflow, a state, its dependents.
  # Stored as signals rows (scope 'foundation' key <name>; scope
  # 'foundation-declared' key <workflowId>) so no live ledger is migrated.
  # --------------------------------------------------------------------------

  foundations:
    args: '[--workflow <id>]'
    reads: 'every foundation row, every running workflow with its peers and declaration, and the open peer-waits with an untilFoundation condition'
    writes: 'nothing'
    returns: >-
      {ok:true, foundations:[{name, kind, state:unclaimed|claimed|landed, version, detail,
      owner:{workflowId, phase, claimedAt}|null, landed:{at, by, version, proof, refs}|null,
      dependents:[{workflowId, phase, detail, at}], waits:[{workflowId, incidentId, holds}]}],
      workflows:[{workflowId, title, peers:<n>, declared, none, owns[], needs[], required, advised}],
      undeclared:[workflowIds with running peers and no declaration]}; --workflow narrows both to
      the foundations it owns or needs and to that workflow
    refuses:
      - workflow-unknown
    usedBy: 'goal definition and boot (driver-loop.yaml foundations.declare); the supervisor reads it to see who owns what across a ledger'

  foundation:
    args: >-
      --workflow <id> (--claim <name> [--kind <layout-tree|brand|grammar|module|contract|baseline|scaffold|other>]
      [--version <v>] | --declare-dependent <name> | --land <name> --proof <text> [--version <v>] [--refs <csv>]
      | --declare-none) [--detail <s>]
    reads: 'the foundation row, the workflow and its running peers, open peer-waits naming the foundation'
    writes: >-
      --claim: the row's owner is --workflow and its state claimed (a new version of a landed
      foundation re-opens it; the landing stays in history); a foundation another RUNNING
      workflow owns is refused, one whose owner stopped running passes to the claimant
      (transferredFrom). --declare-dependent: --workflow joins its dependents (the row is created
      unclaimed when nobody registered it). --land (owner only): state landed with {at, by,
      version, proof, refs}; every running dependent gets a peer heads-up 'foundation landed:
      <name>' (auto foundation-landed), every open peer-wait --until-foundation <name> in any
      workflow of the ledger is resolved (incident-resolved {foundation, by:'foundation-landed'}),
      and each released or notified Kernel is woken (transition foundation-landed). Landing the
      same version again changes nothing. --declare-none: the workflow owns and needs nothing.
      Each writes the declaration marker and appends 'foundation-claimed' /
      'foundation-dependent-declared' / 'foundation-landed' / 'foundation-none-declared' on
      --workflow
    returns: >-
      {ok:true, workflowId, action, name, state, kind, version, owner, dependents[], idempotent,
      transferredFrom?, reopened?, landed?, notified?:[{to, key}], released?:[{workflowId,
      incidentId, holds}], wakes?:[{workflowId, action}], next?: what a dependent does next}
    refuses:
      - workflow-unknown
      - workflow-not-running: 'only a running workflow owns or needs a foundation'
      - foundation-action-invalid: 'not exactly one of --claim | --declare-dependent | --land | --declare-none'
      - foundation-name-invalid: 'the name is not a lowercase slug of at most 80 characters'
      - foundation-kind-invalid
      - foundation-owned: 'another running workflow owns it: declare a dependency or agree a handoff (api notify --kind handoff)'
      - foundation-self-dependent: 'the owner declared itself a dependent'
      - foundation-unknown: '--land on a foundation nobody claimed'
      - foundation-not-owner: '--land by a workflow that does not own it (claim it first when its owner stopped running)'
      - foundation-proof-missing: '--land without --proof'
      - foundation-declared: '--declare-none by a workflow that already owns or needs a foundation'
    usedBy: 'Kernel only (conventions.callerBoundary): at goal definition / boot before feature legs, and when a foundation leg settles (driver-loop.yaml foundations)'

  # --------------------------------------------------------------------------
  # OP IPC — the durable worker<->kernel channel. contracts out, reports in,
  # checks beside. These rows (engine/schema.sql reports/contracts/checks)
  # are the truth.
  # --------------------------------------------------------------------------

  op-contract:
    args: '--job <job_id>  |  --workflow <id> --op <opId> [--attempt <n>]'
    reads: 'the contracts row for the job''s {workflow_id,op_id,attempt} — the rendered packet markdown dispatch wrote'
    writes: 'nothing — pure read of the worker''s dispatch authority'
    returns: 'the stored contract markdown on stdout (machine form {ok:true, contract:{workflow_id, op_id, attempt, dispatch_id, markdown, context}} with --json)'
    dispatchInFlight: >-
      dispatch used to commit the contract row only with status running, after the preamble was sent and
      the model attested; a worker whose first action is op-contract landed in that window and read
      contract-missing for a row the Kernel read seconds later (nivo Modules inc-e09140ad9c22, WSPV
      inc-7f437d11edae). A command-terminal dispatch now commits the row as soon as Orca returns the
      dispatch id, BEFORE the preamble reaches the terminal (re-filed with the delivered text when the job
      goes running; removed again when the launch is refused after that point). As belt-and-braces, with
      --job, while the job is still leased and its row is absent (a managed worker-start launch), op-contract
      re-reads once a second for up to 120 s before refusing contract-missing
    admission: >-
      --json also returns admission {admittedAt, source:recorded|contract-row, runtimeSha, digest,
      laterChanges[], advisoryChecks[], advisoryCodes[]}: the contract version dispatch admitted
      this attempt under (context.contract, scripts/kernel/contract-version.mjs; a leg dispatched
      before versions were recorded is admitted at its row's created_at) and what contract
      changes landed after it (modules/kernel/contract-changes.yaml). The leg is judged against
      its admitted contract: those checks and codes are suspects for it, never refusals, and a
      check script takes the admission (shell-conformance --admitted-at <admittedAt> --op <op>)
    refuses:
      - contract-missing: 'no contracts row for the job''s attempt — the job was never dispatched'
      - bad-attempt: '--attempt is not a positive integer'
      - job-unknown
    usedBy: 'the [Op] worker — it reads its contract from the ledger row, not from the terminal prompt text'

  report:
    args: '--job <job_id> --report <file> [--outcome <done|partial|failed|ask|blocked>]'
    reads: 'the job row (identity + dispatch_id); the report file — a starci/op-report@1 JSON envelope {outcome, summary, files[], checks[{name,command,exitCode}], open|question|blocker per outcome}'
    writes: >-
      reports row UPSERT keyed UNIQUE(workflow_id, dispatch_id) — one
      dispatch, one durable report; the row carries outcome + the normalized
      report_json + from_terminal and binds the same dispatch_id the
      contracts row was written for; consumed_at stays NULL until
      `api consume-report` (or `api settle`). The api validates the envelope
      and stamps run/task/dispatch/from — the worker never claims identity.
      events 'report-filed'. After the transaction commits, the api
      best-effort wakes the SAME Kernel terminal when its provider frame is
      turn-idle and records `kernel-transition-woken`; terminal failure never
      rolls back or weakens the authoritative report row. Like `api nudge`,
      delivery is proven from the screen (scripts/kernel/wake-delivery.mjs):
      an agent_prompt_stalled/agent_prompt_blocked receipt whose wake landed
      or queued is kernel-woken, a staged wake gets one Enter-only send, and
      only a screen-proven miss is kernel-wake-failed; kernelWake and the
      event carry delivery, evidence and sendErrorCode. The watchdog
      (modules/models/runtimes.yaml allocation.watchdogCadenceMs) is only the fallback for a missed/racing event wake. The file stays the artifact the row binds —
      the ROW is the record, and `api status` projects it so the kernel
      knows exactly when an op answered and with what outcome. A row filed
      with outcome 'ask' then follows askLifecycle below until it is answered
      or superseded.
    returns: '{ok:true, jobId, workflowId, dispatchId, outcome, report, kernelWake:{action,terminal,...}, reask?:{dispatchId, reason}}'
    answeredAsks: >-
      an `ask` report is checked against the answered asks of the job's retry
      lineage (dispatch ownerAnswers, scripts/kernel/owner-answers.mjs
      repeatedAnswerOf): a question with the same text (case, spacing and
      trailing punctuation aside) or the same two or more option labels
      repeats that ask and is refused ask-already-answered. handover.review is
      exempt: every round asks approval of a new package with the same three
      options, so its earlier answers ride in the packet only. The one way past is a declared
      re-ask: question.reasks {dispatchId: <the answered ask>, reason} for an
      answer that provably could not take effect; it is filed with a WARNING
      on stderr, `reask` in the result and on the 'report-filed' event, so the
      Kernel sees it before it serves the ask
    binding: >-
      The contracts row for the job''s {workflow_id, op_id, attempt} resolves
      the dispatch a report binds to — it is the row `api dispatch` wrote
      before the job went running, so it is the only authority. The job
      payload answers only for an attempt that has no contracts row, and a
      dispatch listed in payload.rejectedDispatches[] is evidence of a refused
      launch, never a binding.
    refuses:
      - report-job-not-active: 'the job is not running, answering or effect_unknown — a queued or settled job has no worker to file for it'
      - report-dispatch-unbound: 'the job binds no operation dispatch at all: never dispatched, or every dispatch it carries was rejected'
      - report-contract-unbound: 'the job binds a dispatch that no contracts row for this attempt was written for'
      - report-missing: 'report file unreadable'
      - report-invalid: 'fails starci/op-report@1 — bad outcome, missing summary, files outside owned_paths, missing open/question/blocker for its outcome, identity mismatch (a report claiming a dispatch the job does not bind is refused here), a done|partial report of an op whose manifest commitPolicy commits without `head` = a 7-40 character hex sha (the api resolves the op''s commitPolicy exactly as settle does; the worker puts `git rev-parse HEAD` of the checkout holding its owned paths into `head` and re-files), prose that lost its non-ASCII letters to a legacy code page (a question mark inside words, U+FFFD) — the file must be written as UTF-8 (scripts/kernel/report-envelope.mjs lossyTextFields)'
      - outcome-mismatch: '--outcome flag contradicts the envelope outcome'
      - 'ask-already-answered: an ask whose question repeats an ask the job''s retry lineage already had answered (answeredAsks above). The error names the answered ask, who answered it with which option and the receipt; nothing is filed. Apply the answer (packet context.owner_answers), or declare a re-ask with question.reasks'
      - 'ask-declared-in-stack: an ask that requests what the repository''s stack declaration says the runtime already holds - a service in its services block (or the source host''s entry listing this repository) declared ownerAction none with its custody present, named by one of its credential or CI secret/variable names, or by the service next to a credential word (a Sonar token or host, a Codecov or GitHub CI setting). scripts/checks/check-starcistacks.mjs ownerAskConflict; nothing is filed; the error names the declaration and the custody to use. The guard fails open when a declaration cannot be read'
      - 'report-invalid (handover ask):a handover.review ask whose question.options are not exactly three distinct non-empty labels in the order approve, feedback, question, or that declares picks (scripts/kernel/handover.mjs handoverAskProblem)'
      - report-identity-mismatch: 'the caller is an op (conventions.callerBoundary) and --job is not its own job'
      - job-unknown / job-settled
    usedBy: 'the [Op] worker — filing its answer is this verb, never a bare file drop or last words on a terminal'

  serve-ask:
    args: '--workflow <id> [--dispatch <id>] [--ttl <ms>] [--now]'
    reads: 'the workflow row; with --dispatch, the reports row that filed that ask'
    writes: >-
      Parks the ask for the owner; it serves NO form by default (owner,
      2026-09-24: a form URL is served only when the owner asks for it).
      scripts/kernel/serve-ask.mjs parkAsk supersedes the earlier asks it
      replaces (ask-superseded, their Telegram messages deleted:
      ask-message-closed), sends the owner the question with its numbered
      options and one "Generate URL" button (scripts/connectors/telegram.mjs
      notifyAsk; deduped while the notice is in the chat) and appends
      ask-notified {dispatchId, onDemand:true, via:telegram, messageId, key,
      fresh, fields}. The Telegram bridge serves the form when the owner
      presses the button (serve-ask.mjs --on-demand telegram: ask-serving
      with onDemand, ask-serving-expired on --ttl, ask-answered on submit).
      `--now` also launches the form at once for local use; with Telegram off
      (or a failed send: ask-notify-failed) the form is launched at once as
      before, with the gateway and tunnel kept up. It is how a Kernel clears
      frontier.askReserveDispatches without leaving the api surface. With
      config.yaml asks.autoAcceptRecommended on, an ask that carries a
      recommended option and falls in no class of asks.excludes (credential
      and handover.review asks always do) is answered in-process instead
      (scripts/kernel/serve-ask.mjs autoAcceptAsk): the answer receipt,
      ask-answered with answeredBy auto-recommended, ask-auto-accepted, the
      kernel wake and one Telegram message; nothing is served.
    returns: '{ok:true, workflowId, dispatchId, onDemand:true, telegram:{notified, messageId, fresh}, superseded[], pid:null} | {ok:true, workflowId, dispatchId, pid, servedBy, onDemand:false, servedBecause, telegram?, connectors?} | {ok:true, workflowId, dispatchId, autoAccepted:true, optionIndex, option, answeredBy, receiptPath, wake, telegram}'
    refuses:
      - workflow-unknown
      - ask-unknown
    usedBy: 'drive.wait — an ask-reserve frontier parks each askReserveDispatches entry; an askOnDemandDispatches entry needs nothing'
  retire-ask:
    args: '--workflow <id> --dispatch <id> --reason <text>'
    reads: 'the reports row that filed that ask; its ask-answered/ask-superseded events'
    writes: >-
      one event ask-superseded {dispatchId, by:null, opId, retired:true, reason}
      - the terminal kind every open-ask reader already honours - so the owner
      is no longer asked a question the workflow has outgrown (a premise a
      later merge changed, an ask a later attempt made moot). The ask's
      Telegram messages are deleted (edited to "no longer needs an answer"
      only where Telegram refuses the delete) and ask-message-closed records
      it. An ask already answered or superseded writes nothing and returns
      retired:false.
    returns: '{ok:true, workflowId, dispatchId, retired, reason|already, telegramDeleted?, telegramEdited?}'
    refuses:
      - workflow-unknown
      - ask-unknown
      - retire-needs-reason
    usedBy: 'drive.wait — an awaiting-owner frontier whose only open ask is obsolete'
  consume-report:
    args: '--job <job_id>'
    reads: 'the reports row for the job''s dispatch_id'
    writes: >-
      reports.consumed_at = now — the kernel has read and integrated the
      report into its view of the frontier. The kernel consumes BEFORE it
      re-runs checks and settles; `api settle` enforces consumption at the
      latest by marking the row itself — a report that never gets consumed
      is a dispatch that never settled.
    returns: '{ok:true, jobId, workflowId, dispatchId, consumed} — consumed:false when no unconsumed reports row exists; an unfiled report is a fact, not a refusal'
    refuses:
      - job-unknown
    usedBy: 'drive.settle — the kernel reads the filed report, integrates it, consumes it, THEN re-runs checks'

  check:
    args: '--job <job_id> (--checks <json> | --checks-file <path>)'
    inputShape: >-
      {checks:[{name:<non-empty string>, exitCode:<integer>, command?:<string>, evidence?:<string>, codes?:[<finding code>]}]}.
      The envelope and checks array are mandatory and non-empty. JSON scalars, bare arrays,
      legacy key/value maps and double-encoded JSON strings are refused. `codes` names the
      finding codes that made a red check red.
    admittedContract: >-
      The job is judged against the contract it was admitted under (op-contract admission). A red
      check whose name a contract change registered after that admission added (adds.checks), or
      whose `codes` are all codes such changes added (adds.codes), is recorded with advisory
      {changes[], reason}: a suspect, counted neither passed nor failed (checkEvidence.advisory),
      so it never blocks a pass - which still needs one green check. A caller-supplied advisory is
      discarded; a safetyCritical change is never advisory. The retry of the leg is admitted under
      the current contract, so its prior_attempt_failures still carry those checks.
    reads: 'the job row; the op''s declared checks (the re-run results being recorded)'
    writes: >-
      checks row UPSERT keyed PK(workflow_id,op_id,attempt) — the kernel''s
      INDEPENDENT re-run of the op''s declared checks, one row per attempt,
      a re-run upserts itself rather than doubling; events
      'checks-recorded'. `done` is never taken on trust: these are the
      results the kernel measured, not the worker''s claims.
    returns: '{ok:true, jobId, workflowId, op, attempt, checks:<n>, checkEvidence:{observed,passed,failed,green,advisory?}, advisory?:[{name, changes[]}], admittedAt?}'
    refuses:
      - job-unknown
      - job-no-op: 'the job row carries no op identity — pass --op'
      - checks-invalid: 'the --checks payload is not valid JSON / not the check-result shape'
      - checks-file-missing: 'the --checks-file path does not exist'
      - bad-attempt: '--attempt is not a positive integer'
      - checks-attempt-mismatch: '--attempt names an attempt other than the job row''s — one checks row per attempt, never written against a neighbour'
      - checks-report-missing: 'no worker report is filed for the job''s bound dispatch — the kernel re-runs checks against a filed answer, not against silence'
      - 'report-job-not-active / report-dispatch-unbound / report-contract-unbound: the report binding refusals, resolved exactly as `report` binding declares'
    usedBy: 'drive.settle — after consume-report and before settle; the re-run record a `pass` verdict stands on'

  # --------------------------------------------------------------------------
  # SETTLE — the report row is the verdict; the api re-proves before
  # recording. Consumption is enforced — a report never settles unconsumed.
  # --------------------------------------------------------------------------

  settle:
    args: '--job <job_id> --verdict <pass|fail|blocked> [--report <path>] [--accept-foreign <paths>]'
    landedShared: >-
      The landed proof ignores every report file an op of the workflow filed (report-filed events): a
      worker writes evidence/<attempt>/report.json after its head commit, and counting it dirty cost a
      land-only retry each time (nivo Login a23/a24, WSPV a30, Collab seam a1). For a leg admitted under
      shared-checkout-guard it also refuses `foreign-paths` when a commit the job landed since admission
      (the head, and every commit since then touching its owned paths) carries a file outside them
      (detail.foreign [{sha, foreign[]}]); never rewrite the branch - the file's owner confirms or reverts
      it with a new commit, then the Kernel settles with --accept-foreign <those paths>
      (scripts/kernel/settle-landed.mjs foreignLandedPaths, conventions.sharedCheckout)
    reads: >-
      the job row (complete identity + lease_token); the reports row for the
      job''s dispatch_id — the kernel consumed it earlier via
      `api consume-report`; the report file; the ops declared checks; the
      checks row the kernel''s re-run recorded
    writes: >-
      jobs.status -> succeeded|failed + result_json {verdict,...} (a blocked
      verdict settles failed; the typed blocker rides the report; a blocked
      verdict on a filed `ask` report records verdict awaiting-owner —
      verdict-contract.yaml retryAccounting.ownerWait); the
      reports row''s
      consumed_at is set — consumption the kernel did not mark via
      `api consume-report` is enforced by settle itself, so a report is
      never settled unconsumed; lease and budget_reservation rows released —
      a
      settle frees the slot; the worker terminal is closed (terminal-close for
      a command terminal, worker-stop + worker-release for a managed worker)
      and the op's Orca Task is closed with `task-update --status done`,
      recorded as taskClosed on the receipt and the job payload — a settled op
      leaves no live terminal, worker or open Task
      (modules/kernel/start-workflow.yaml orcaTree is the rule);
      events 'op-settled' {verdict}
    validates: >-
      The reports ROW is the durable verdict — filed by `api report`,
      integrated by `api consume-report`; the done-marker/message is only
      the wake-up and the file is the bound artifact
      (modules/kernel/verdict-contract.yaml envelope). validateOpReport runs
      starci/op-report@1 at filing (`api report`, or on a --report file
      settle files first): outcome's payload present, files inside the job's
      owned_paths, identity bound to the job. `pass` records only after the declared checks
      re-ran green (`api check` row) —
      evidence is bytes on disk, never words in a summary
      (verdict-contract.yaml accepts). A filed envelope's outcome normally
      agrees with the verdict (pass↔done, fail↔failed|partial,
      blocked↔blocked|ask). The report is a worker claim, not authority: a
      recorded red Kernel check may overrule `done` to `fail`, settle the
      attempt and release its worker. Any other contradiction refuses
      'verdict-outcome-mismatch'; a dispatch with
      no filed report at all (a dead worker) still settles on the kernel's
      verdict, recorded reportFiled:false. A --report file with no reports
      row is validated and filed on the job's behalf first — an invalid one
      is simply not filed (the settle stands on the kernel's verdict).
    landed: >-
      A `pass` for an op whose manifest policy.commitPolicy commits (a mode
      other than none — scoped-local-commit today) owes a landed proof, run
      before anything is written (scripts/kernel/settle-landed.mjs). Each
      owned path resolves against its target repository
      (scripts/kernel/target-repo.mjs ownedPathPlacements), first match wins:
      the repository the path names (enqueue above); a `.starciwork/` path in
      the Work owner; payload.repository; the binding's
      fe root for a frontend op (a job enqueued before payload.repository
      existed resolves the same way); else the dispatch contract's worktree
      when that is a directory, else --repo. A resolved repository is checked
      in the contract worktree when that worktree is a checkout of it, else
      at its bound root. Paths are grouped per git checkout and each group is
      proven there. `git status --porcelain -- <owned_paths>` must be empty
      (each owned path a `:(literal)` pathspec, so src/app/[id] never reads as a glob),
      and the filed done report's `head` must name a commit that exists and
      is HEAD or an ancestor of it — a checkout ahead of origin passes. A done
      report filed before `api report` required `head` carries none: on a
      non-pushing policy settle skips the head half, still requires clean
      owned paths, and records landed.headCheck `skipped-legacy-report`
      (else `verified`). Only
      when commitPolicy.push is true does settle also run `git fetch origin
      <branch>` (report `branch`, else the checkout's current branch) and
      require origin/<branch> to contain `head`. Git reads use the
      allocation.settleGit timeouts in modules/models/runtimes.yaml. A job
      whose owned paths sit in no git checkout (jobs dispatched against a
      plain directory) settles without the proof, as does every fail or
      blocked verdict and every op without a committing commitPolicy. A
      proof that ran is recorded as `landed` on the receipt and result_json.
      Once the landed proof passes, a leg admitted at or after contract change
      settle-push-gate-lint (modules/kernel/contract-changes.yaml) also owes the
      target repository's own push gate (scripts/kernel/push-gate.mjs): the eslint
      commands its .husky/pre-push runs (directly or through package scripts), else
      its lint:check script, run with the repository's own ESLint and config over
      the files the job changed in each checked repository - its report `files`
      plus every file a commit since its admission touched under its owned paths -
      that the command's patterns reach. It is recorded as landed.pushGate. A
      repository that declares no push-gate lint, or a job that changed no file it
      reaches, settles as before. The run is bounded by allocation.pushGate.lintMs.
    handover: >-
      A `pass` of a handover.review job is the owner's approval turned into a ledger fact. Settle reads
      the latest handover ask filed before this attempt and its serve-ask answer receipt
      (scripts/kernel/handover.mjs handoverApprovalOf): the ask must be answered, the receipt bound to
      that ask, the picked option approve, and both the receipt and the ask-answered event must name
      answeredBy owner - a delegated answer never approves - and no business job (any op but
      handover.review) may have settled after the ask was filed. Then, after op-settled, it appends
      `handover-approved` {jobId, dispatchId (the answered ask), answeredBy, at (the answer time),
      askJobId, receiptPath, lastBusinessSettleSeq} and returns handoverApproved on the receipt; `api
      finish` reads that event.
    cutSet: >-
      A cut pass records result.cutSet {id, total, closesSet, open[]} on the job and the op-settled
      event. The closing pass (closesSet true) also appends `cut-set-closed` {op, cut, closedBy,
      ordinal, check: full-regression-final}: the set counts done only there, after the unchanged full
      gates ran green over every ordinal. `api status` cutSets names the pass that will close each
      open set before it happens.
    returns: '{ok:true, jobId, verdict, status, awaitingOwner, reportFiled, reportOutcome, checkEvidence, claimOverruled, cutSet?:{id,total,closesSet,open[]}, leasesReleased, reportsConsumed, terminalClosed, managedWorker?, landed?:{repo, dirty, repos:[{repo, role, paths, dirty}], head, headCheck:verified|skipped-legacy-report, localHead, missing, branch?, originHead?, pushGate?:{repos:[{repo, source, commands, changed, linted, errorCount, warningCount, findings, eslint} | {repo, skipped}]} | {skipped:admitted-before-change, change, admittedAt}}}'
    refuses:
      - report-missing: 'the --report path is unreadable'
      - pass-report-missing: 'pass requires the exact filed done report; a dead or silent worker cannot earn pass'
      - checks-not-green: 'pass requires at least one independently recorded green check and zero red checks'
      - cut-checks-missing: 'a cut pass lacks green cut-slice-postcondition + cut-regression-inventory, or the pass that CLOSES its cut set additionally lacks full-regression-final. The closing pass is the one that leaves no other ordinal of {op, cut id} open - every other ordinal''s latest job already settled succeeded - whichever ordinal settles last; ordinal === total is not the rule (inc-751dd1ac4492: ordinals settle out of order once the seam passes). The error names which case applies'
      - verdict-outcome-mismatch: 'the filed envelope outcome contradicts the verdict and no red Kernel check proves a done claim false'
      - 'handover-not-approved: a handover.review pass without the owner''s approve receipt for the latest handover ask, with a delegated (non-owner) answer, or with a business settle after that ask was filed (settle.handover); nothing is written and the job keeps its status'
      - job-settled: 'job already settled — a duplicate settle is refused, never double-counted (an effect_unknown job MAY settle again — it is not a settled status)'
      - 'report-job-not-active / report-dispatch-unbound / report-contract-unbound: a `pass` verdict re-proves the report binding first, exactly as `report` binding declares'
      - 'not-landed (field `reason`): a pass the landed proof refuses. Prints {ok:false, jobId, op, reason:"not-landed", detail:{repo, dirty:[<owned path with uncommitted or untracked changes, prefixed <checkout>: when several repositories are checked>], repos:[{repo, role, paths, dirty}], head, headCheck, localHead, missing:[head (pushing policy only) | commit:<sha> | ancestor-of-HEAD:<sha> | origin/<branch>:<sha>], branch?, originHead?}} and exits 1; nothing is written and the job keeps its status. The Kernel re-dispatches the owning slice to commit its own paths (and push, when its policy pushes), then settles again (driver-loop.yaml enqueue.cutExecution)'
      - 'landed-unverifiable (field `reason`): the landed proof could not read git — a status that failed, a detached HEAD with no report branch, a fetch of origin/<branch> that failed on a pushing policy, or an owned path / payload.repository naming a repository the binding cannot resolve (step repository, detail.unresolved). Prints {ok:false, jobId, op, reason:"landed-unverifiable", detail:{repo, step:repository|status|branch|fetch|push-gate, error, ...}} and exits 1; never a silent pass'
      - 'push-gate-red (field `reason`): the landed proof passed but the files the job changed break the target repository''s own push-gate lint (settle.landed push gate). Prints {ok:false, jobId, op, reason:"push-gate-red", hint, detail:{...landed, pushGate:{repo, source, commands, changed, linted, errorCount, warningCount, maxWarnings?, findings:[{file, line, rule, severity, message}]}}} and exits 1; nothing is written and the job keeps its status. The Kernel re-dispatches the owning slice to fix the findings in its own files (never by disabling a rule) and commit, then settles again. A push-gate lint that cannot run (the repository''s eslint missing, a crash, a timeout) is landed-unverifiable with step push-gate'
      # a verdict outside pass|fail|blocked is a usage error (exit 2), not a typed refusal
    usedBy: 'drive.settle — last step of the op lifecycle: consume-report -> check re-runs -> api check -> settle; a refused settle is a routed verdict (usually retry), never silent loss'

  # --------------------------------------------------------------------------
  # INCIDENT — the fingerprinted escalation record.
  # --------------------------------------------------------------------------

  incident:
    args: '--workflow <id> --kind <k> --detail <s> [--op <opId>] [--holds <opId|jobId>,...] [--peer <workflowId> [--refs <csv>] [--until-message]] [--until-foundation <name>]  |  --workflow <id> --resolve <incidentId> [--detail <s>]'
    reads: 'the workflows row for --workflow'
    ownerGate: >-
      --kind owner-gate parks work on a step only the owner can drive (an
      assisted OAuth run, a consent screen, a merchant choice). --holds lists
      the ops or job ids it holds; without it, --op is held. While the
      incident is open, status reports each held queued job
      queuedBecause owner-gate (so the frontier is not actionable on them and
      the watchdog does not wake the Kernel), and route and dispatch refuse
      it with reason owner-gate. When the owner's step lands (the receipt
      exists, the ask is answered), the Kernel runs --resolve and the jobs
      are ready again. Free prose such as "[owner-gate-pending]" in --detail
      holds only the incident's --op; name the rest in --holds. A held job whose
      report the Kernel already consumed is a settle deferred behind the gate
      (status frontier.heldSettleJobs), not settle-ready work
    peerWait: >-
      --kind peer-wait --peer <workflowId> records a typed, durable wait on a
      PEER workflow: the next step (--holds ops or job ids, else --op) cannot
      pass its preflight until that peer lands something - installs a
      dependency, writes a record (mia-mia work-and-stacks brand.decide waited
      on wf-miamia-base-repos' Grammar 0.5.0 install, inc-0aebf976e625). --peer
      must be a running peer of this workflow (the notify PEER RULE); --refs
      names the peer messages or jobs the wait is about; --until-message lets
      the peer's next message resolve it. While it is open, held queued jobs
      read queuedBecause peer-wait, route and dispatch refuse them with reason
      peer-wait, a held job whose report was consumed but not settled is a
      settle deferred behind the wait (frontier.heldSettleJobs, not
      settle-ready: the Kernel settles it once the wait resolves), and with
      nothing else to move the frontier reads `peer-wait`
      (not actionable), so the watchdog lets the Kernel sleep. A message from
      the peer (api notify) wakes the Kernel and, with --until-message,
      resolves the wait; otherwise the Kernel re-checks the prerequisite and
      runs --resolve. A wait whose peer stops running is frontier.peerWaitsDead
      (actionable). scripts/supervisor/stall.mjs judges each wait: PEER-WAIT
      while the peer runs and moves, STALE-PEER-WAIT when the peer finished,
      a named job settled after the wait, or the peer is idle past the stall
      threshold too; a pending message from the peer is UNREAD-PEER. incident-raised carries {peer,
      untilMessage, refs}
    sharedBlocker: >-
      --kind shared-blocker [--introduced-by <commit>,... | --introducer <workflowId>] [--fix <text>]
      raises a blocker several workflows hit (a served-app boot failure, a broken shared module) AND routes
      it to the workflow whose code introduced it (scripts/kernel/introducer.mjs resolveIntroducer: the
      named --introducer; else the workflow whose op report filed the commit as its head; else a workflow
      id, then a cut id, then a conventional-commit scope in the commit message; a finished introducer hands
      it to its running successor of the same title). The introducer gets a typed peer message kind
      `follow-up` {refs [incidentId, commit], followUp {incidentId, commit, via, introducedBy}} carrying the
      blocker and --fix, and its Kernel is woken; it repairs the code as its own defect and notifies the
      reporter, who then resolves the incident. Unresolved, self-introduced or not a running peer, nothing
      is sent and the answer's sharedBlocker {routed:false, why} says so: the supervisor assigns an owner.
      Event 'shared-blocker-routed' records either answer. Victims no longer each wait for the owner to
      pick a repairer (nivo WSPV inc-be78a39b6b50, Modules inc-b6f66a0d29ce).
    foundationWait: >-
      --kind peer-wait --until-foundation <name> is the typed wait on a SHARED FOUNDATION
      (api foundation): its release condition is the landing - a typed condition of
      scripts/kernel/gate-conditions.mjs (until [{type:'foundation', name}], also recorded as
      untilFoundation), so an already-open wait is typed onto a foundation with --attach <incidentId>
      --until-foundation <name> (an owner-gate that was really a peer dependency included), and
      the typed release re-checks it every status. --peer defaults to the foundation's owner
      (a different --peer is refused foundation-peer-mismatch); an unregistered foundation is
      refused foundation-unknown, a landed one foundation-landed (nothing to wait for), an
      unowned one foundation-unowned (nothing would land it). The waiter becomes a dependent.
      `api foundation --land <name>` resolves every such wait in the ledger and wakes its
      Kernel; frontier.peerWaits[].untilFoundation names it. Everything else is a peer-wait
    resolve: >-
      --resolve <incidentId> sets that open incident's status to resolved and
      appends events 'incident-resolved' {detail}; resolving a resolved
      incident changes nothing and returns changed:false. It is also how a
      superseded incident leaves survey.incidentsOpen
    typedRelease: >-
      Machine-checkable release conditions (scripts/kernel/gate-conditions.mjs), on any kind and
      repeatable, ALL of which must hold: --until-record <path>[@<state>|>=<rev>] (the file, or a
      directory's index.yaml, relative to --repo or absolute, exists; with @state its top-level
      state equals, with >=rev its top-level rev is at least), --until-job <jobId>[:settled|succeeded]
      (any job of the ledger settled pass or fail, the default, or succeeded; a CANCELLED job is not
      settled - the condition follows the job that replaced it, a later same-op job that retries it or
      holds its cut ordinal, and stays unmet while there is none, nivo auth inc-7c46a61faba1),
      --until-message <peer>[:<kind>] (a
      peer message from <peer>, of <kind>, reached this workflow after the wait was raised; a BARE
      --until-message keeps its peer-wait meaning), --until-commit <repo>:<ref-or-path> (the ref
      resolves to a commit, or the path is committed at that repo's HEAD), --until-incident
      <incidentId>[:resolved], --until-foundation <name> (the shared foundation landed: api
      foundation; incident.foundationWait). They are stored on 'incident-raised' as until:[{type,...}]. The
      runtime evaluates them read-only on every api status (so every watchdog tick), before route
      and dispatch read the gates, after every settle (ledger-wide, waking each released Kernel)
      and after every notify (the target's), and resolves the incident once all hold: events
      'incident-resolved' {detail, by:until-conditions, evidence[]} and 'incident-auto-resolved'
      {kind, until, holds, evidence[]}. That releases the queued jobs and deferred settles it held
      (status frontier.autoResolved; the frontier turns actionable and the watchdog wakes the
      Kernel). A condition already met at raise resolves the incident in the same call
      (status:resolved, autoResolved). A job, incident or message peer the conditions name must
      exist (until-job-unknown / until-incident-unknown / until-message-peer-unknown). Opt-in and
      backward compatible: an incident without typed conditions is stored and behaves exactly as
      before, and only the Kernel resolves it. Owner-only conditions (an ask answered, a consent
      given) have no typed form and stay owner-driven. The Kernel attaches typed conditions
      whenever the release is checkable (driver-loop.yaml tick.drive.typedRelease)
    attach: >-
      --attach <incidentId> --until-<type> <spec> ... types an OPEN incident of this workflow
      without re-raising it: appends 'incident-conditions-attached' {until, detail}, whose until
      replaces any earlier set, and evaluates at once (resolved when already met). This is how a
      free-text gate raised before typed conditions existed becomes machine-checked; its holds,
      kind and text are unchanged. Returns {ok:true, incidentId, workflowId, status, until,
      autoResolved?}
    writes: >-
      one incidents row per call {incident_id, workflow_id, op_id,
      attempts:0, status:'open', last_progress:'[<kind>] <detail>'} + events
      'incident-raised' {kind, detail, opId}. Each call opens its own row:
      recognising that two escalations carry identical evidence, and
      therefore that the retry budget is spent, is the kernel's reading of
      `survey.incidentsOpen` (driver-loop.yaml retry-budget-exhausted)
    returns: '{ok:true, incidentId, workflowId, kind, status:open|resolved, holds?, peer?, untilMessage?, refs?, until?, autoResolved?}  |  resolve: {ok:true, incidentId, workflowId, status:resolved, changed}  |  attach: {ok:true, incidentId, workflowId, status, until, autoResolved?}'
    refuses:
      - workflow-unknown: 'no workflows row'
      - incident-unknown: '--resolve names no incident on this workflow'
      - peer-wait-peer-missing: '--kind peer-wait without --peer'
      - peer-wait-kind-mismatch: '--peer or --until-message with a kind other than peer-wait'
      - 'peer-self / peer-unknown / peer-not-running / peer-not-shared-source: --peer is this workflow, no workflow of this ledger, finished or archived, or shares no source root (notify refuses the same)'
      - until-invalid: 'a malformed --until-<type> value (an unknown job state, a --until-commit without <repo>:<target>, a --until-incident state other than resolved)'
      - 'until-job-unknown / until-incident-unknown / until-message-peer-unknown: a typed condition names no job, no incident or no other workflow of this ledger'
      - until-missing: '--attach without any --until-<type> condition'
      - incident-not-open: '--attach names an incident that is no longer open'
      # an empty --kind or --detail is a usage error (exit 2), not a typed refusal
    usedBy: >-
      plan divergence, retry budgets past their limit, unreconciled op
      deaths — anything the driver may not decide alone (driver-loop.yaml
      escalation.mustAskOwner)
    providerCircuits: >-
      resolving an incident never clears a provider-health circuit: the two are
      separate facts. A circuit clears on expiry, on a rotated credential, or by
      api provider-health --recover

  provider-health:
    args: '--provider <p>  |  --provider <p> --recover --reason <text> [--probe]'
    reads: >-
      the signals row scope provider-health key <p> (a -agent suffix is dropped);
      the fingerprint of the credential a launch of <p> would present now
      (scripts/agent/credential-fingerprint.mjs: the card's credentialRefresh
      secret, or its providerEnvFile when the secrets file has no line, or the
      Orca host account id for an orca-account card). No key value is read into
      any output, event or log
    returns: >-
      read: {ok:true, provider, open, row:{...value, at, expiresAt, expired}|null,
      credential:{fingerprint, source, resolved, recorded, rotated}}  |  --recover:
      {ok:true, provider, recovered:true, previous, probe, credential} or
      {ok:true, recovered:false, reason:'no-open-circuit'} when nothing is open
    recover: >-
      --recover clears an OPEN circuit before its expiry: the row becomes
      {status:'recovered', recoveredAt, reason, failures:0, trips:0, probe,
      recoveredBy:{kernelJob, workflowId, terminal}, previous} expiring now, and
      events 'provider-health-recovered' {provider, reason, probe, previous,
      credential, kernelJob} lands on the proving Kernel's workflow. --probe first
      proves the credential live (scripts/agent/credential-probe.mjs): a card with
      credentialProbe.kind openai-models (qwen) is asked GET <baseUrl>/models with
      the credentialRefresh key, no tokens spent; any other provider passes on its
      quota probe reading ok or limited. A failed probe refuses the clear
    writes: 'with --recover only: the signals row above + events provider-health-recovered | provider-health-recover-refused'
    refuses:
      - 'op-context-refused: an op caller (KERNEL_ONLY_VERBS), read or recover'
      - 'supervisor-refused: --recover from a caller marked STARCI_ROLE=supervisor; the supervisor reports the command and the Kernel runs it'
      - 'kernel-proof-required: --recover whose ORCA_TERMINAL_HANDLE is not the terminal (worker_id or hierarchy seat) of a running kernel job in this ledger'
      - 'probe-failed: --probe could not prove the credential; the circuit stays open and events provider-health-recover-refused {provider, reason, probe} is appended'
      # --recover without --reason, or --probe without --recover, is a usage error (exit 2)
    usedBy: >-
      the Kernel, after the owner or a supervisor fixed a credential that an auth
      circuit still holds (driver-loop.yaml providerCircuitRecovery). Route and
      dispatch refusals, api status queuedBecause circuit-open and the
      [infra-provider] incident text name this command

  # --------------------------------------------------------------------------
  # FINISH — the last call of the loop. History preserved; live custody removed.
  # --------------------------------------------------------------------------

  finish:
    args: '--workflow <id>'
    reads: 'workflows row; every jobs row; the final verify verdict'
    writes: >-
      workflows.phase='finished' + finished_json {at, verdict}; the inbox
      goal row closed (status 'done'); the kernel singleton signal deleted;
      the Kernel job settled with worker_id and terminalHandle cleared; the
      exact Kernel terminal receives a best-effort close request after the
      durable receipt is emitted; every Task the Run still holds open is closed
      with `task-update --status done`, so a finished workflow leaves nothing
      in the Orca tree (modules/kernel/start-workflow.yaml orcaTree);
      events 'workflow-finished'.
      goals/jobs/reports/events all stay — a
      finished goal is history, not deletion
      (start-workflow.yaml: finished goals never re-enter the queue).
    handoverGate: >-
      A workflow is done only when the owner approved its handover. Before writing anything, finish
      requires a `handover-approved` event (settle.handover) whose seq is newer than the last
      op-settled event of any job other than the Kernel and handover.review
      (scripts/kernel/handover.mjs handoverGateOf). A chain approved before handover.review existed is
      held to the same gate: the kernel appends the leg (driver-loop.yaml handoverLoop). The one
      existing exit without an approval is a workflow the owner archived (workflows.archived_at set);
      no api verb sets it and no flag bypasses the gate. finished_json and the workflow-finished event
      carry handover {via: handover-approved|archived, approvedSeq, answeredBy}. A workflow already
      finished finishes again idempotently without the gate.
    returns: '{ok:true, workflowId, phase:finished, inboxClosed:<n>, alreadyFinished, kernelSignalsReleased, kernelJobsSettled, kernelTerminal, kernelTerminalCloseRequested, tasksClosed:[{jobId,taskId,status,ok}], handover?:{via, approvedSeq, answeredBy}}'
    refuses:
      - workflow-unknown
      - workflow-open-jobs: 'one or more operation jobs are unsettled; a model turn ending is not workflow completion'
      - 'handover-not-approved: no handover-approved event, or the newest one predates the last business settle (handoverGate); run handover.review and let the owner approve it'
    usedBy: 'tick.finish — called only once every job is settled, the final verify leg passed and the owner approved the handover (driver-loop.yaml)'

# ============================================================================
# ASK LIFECYCLE — the events an `outcome: ask` report passes through after it
# is filed. The report row stays OPEN until a terminal kind lands; every reader
# of open asks honours all of them.
# ============================================================================
askLifecycle:
  servedBy: scripts/kernel/serve-ask.mjs
  ordering: events are ordered by events.seq — event_id is a random token and orders nothing
  events:
    - ask-notified: 'api serve-ask (serve-ask.mjs parkAsk) told the owner on Telegram: the question with a Generate URL button, no link, no form. payload {dispatchId, onDemand:true, via:telegram, messageId, key, fresh, fields}. The ask then waits on the owner with no form (frontier.askOnDemandDispatches, supervisor liveness on-demand); like ask-serving it reopens an ask superseded before it'
    - ask-notify-failed: 'the Telegram notice could not be sent. payload {dispatchId, error}; api serve-ask then served the form at once'
    - ask-serving: 'the localhost form is bound and answering. payload {dispatchId, url, pid, fields, ttlMs, onDemand?, requestedBy?} (onDemand/requestedBy telegram when the owner pressed Generate URL); the newest ask-serving for a dispatch is the URL that counts'
    - ask-serving-expired: 'the --ttl window closed with no submission. payload {dispatchId}; the URL is dead until a re-serve appends a newer ask-serving'
    - ask-superseded: 'a later ask report for the same (workflow, op) and the same subject (the asking job params.subject, else overlapping question.refs) was served and retires this one; an ask of the same op about another subject stays open. payload {dispatchId: <retired ask>, by: <the ask now serving>, opId}; terminal — a retired ask is closed without an answer and is never relayed to the owner'
    - ask-answered: 'the owner submitted the form. payload {dispatchId, receiptPath, answeredBy, optionIndex, custodyWritten, envWritten, pointersWritten, errors} — names and custody paths only, never values; terminal. The receipt (starci/ask-answer@1) carries option, optionIndex (the picked option''s position in question.options), picks, answeredBy, note and at. On a handover.review ask serve-ask refuses a delegate''s approve (403): only the owner approves a handover'
    - ask-auto-accepted: 'config.yaml asks.autoAcceptRecommended answered the ask with its recommended option instead of serving it; appended with the ask-answered (answeredBy auto-recommended) it audits. payload {dispatchId, opId, optionIndex, option, recommendedReason, receiptPath, rule {key, autoAcceptRecommended, excludes, source: structured|text}, config {autoAcceptRecommended, excludes, source}}. A handover.review, credential or excluded-kind ask never gets one'
    - ask-message-closed: 'the ask no longer waits (answered, auto-accepted, retired or superseded) and its Telegram messages were removed. payload {dispatchId, reason, deleted[], edited[], failed[]}: deleted, or edited to say it was answered where Telegram refuses a delete (older than 48 h); the bridge sweep retries a failed one'
  open: 'an ask report carrying neither ask-answered nor ask-superseded for its dispatch_id (a supersede followed by ask-notified or ask-serving is open again); modules/supervisor/supervise.yaml is the reader that tags each open ask live, stale, dead, unserved or on-demand before it reaches the owner'

# ============================================================================
# TABLE MAP — which command touches which ledger table (ledger-db.mjs DDL).
# ============================================================================
tableMap:
  workflows:  {read: [survey, status, hierarchy, plan, enqueue, peers, notify, inbox, incident, finish], write: [dispatch, finish]}
  goals:      {read: [survey, plan, route], write: [plan]}
  jobs:       {read: [survey, status, hierarchy, enqueue, peers, route, dispatch, reconcile, observe, op-contract, report, consume-report, check, settle, finish], write: [enqueue, route, dispatch, reconcile, settle]}
  inbox:      {read: [survey, status, peers, notify, inbox, questions, reply, enqueue, reconcile], write: [enqueue, notify, inbox, questions, reply, finish]}
  signals:    {read: [survey, status, enqueue, incident, foundations, foundation], write: [finish, incident, foundation]}
  leases:     {read: [status, dispatch, reconcile, settle], write: [dispatch, reconcile, settle]}
  incidents:  {read: [survey, route], write: [dispatch, incident]}
  events:     {read: [survey], write: [plan, enqueue, route, dispatch, reconcile, observe, questions, reply, notify, inbox, foundation, report, consume-report, check, settle, incident, finish]}
  reports:    {read: [survey, status, reconcile, consume-report, settle], write: [report, consume-report, settle]}
  contracts:  {read: [survey, status, reconcile, op-contract], write: [dispatch]}
  checks:     {read: [settle, reconcile], write: [check]}
