# ============================================================================
# KERNEL-API — modules/kernel/api.yaml
#
# THE KERNEL'S ONLY DOOR TO THE LEDGER. The [Kernel] is ONE long-lived LLM
# agent per workflow (start-workflow.yaml); it never opens
# .starciwork/runtime.sqlite, never writes a job row, never spawns a terminal
# itself — every state operation is one call:
#   node scripts/kernel/api.mjs <command> ...
# Ops are ephemeral [Op] agents spawned per job by `api dispatch`
# (dispatch.yaml). The kernel reasons; the api transacts.
#
# The op IPC is durable: contracts out (dispatch writes the contracts row,
# the worker reads it back via `api op-contract`), reports in (the worker
# files `api report`; the kernel integrates it via `api consume-report`),
# checks beside them (`api check` records the kernel's re-run). Report and
# contract truth lives in runtime.sqlite through these verbs.
#
# Sources (all under .claude/, relative to the skill root):
#   scripts/kernel/api.mjs      — the executable half; this file is its contract
#   engine/ledger-db.mjs        — the tables named below (DDL: engine/schema.sql)
#   scripts/agent/lib.mjs       — spawnAgent + terminal lifecycle the api drives;
#                                 the kernel never calls Orca itself
#   modules/kernel/driver-loop.yaml    — the caller's tick
#   modules/kernel/dispatch.yaml       — the packet `dispatch` builds + the
#                                        path-legality preflight before enqueue
#   modules/kernel/verdict-contract.yaml — what `settle` validates
#   modules/kernel/kernel-prompt.md    — the spawned kernel's prompt (load order + pointers)
#   modules/schemas/goal-plan.yaml     — the plan --file shape:
#                                        {legs:[{op, paths?, notes?}]}
# ============================================================================

schema: starci/module-kernel-api@1

about:
  kind: kernel-api-contract
  businessQuestion: >-
    "If the kernel is an LLM agent that may not touch the database, what is
    the exact command surface it reasons through — what does each call read,
    what does each call write, and when does it refuse?"
  businessAnswer: >-
    The verbs are the `commands:` keys below. Pure reads return projections
    and touch no row (survey, hierarchy, peers, op-contract) and
    `estimate` computes slice sizing from modules/models/runtimes.yaml without
    reading the ledger at all; `observe` is the kernel's window onto its own
    job's exact op terminal screen — reasoning context and never evidence —
    and appends its own receipt event. Status can resolve typed waits, sweep
    autopilot asks, renew live worker leases, and record provider outages. The
    op IPC is durable rows (dispatch writes contracts, report files reports,
    consume-report integrates, check records re-runs); every other mutating
    verb is a single ledger transaction that appends one hash-chained event.
    Every command prints one JSON object to stdout; a refusal exits non-zero
    with {ok:false, reason} — a refusal is a fact for the driver loop, never a crash to route
    around. The op lifecycle is fixed: enqueue -> route (model decision
    persisted) -> dispatch (contract row written, leases held; or reconcile a
    pre-contract effect_unknown launch back to the same queued attempt) -> worker
    files `api report` -> kernel `api consume-report` -> kernel re-runs
    checks -> `api check` -> `api settle` (consumption enforced — settle
    marks the report consumed if the kernel did not).
  sources:
    - scripts/kernel/api.mjs
    - engine/ledger-db.mjs
    - scripts/agent/lib.mjs

# ============================================================================
# CONVENTIONS — true of every command below.
# ============================================================================
conventions:
  invoke: 'node scripts/kernel/api.mjs <command> [--repo <path>] [--json]'
  ledger: >-
    .starciwork/runtime.sqlite under the bound repo (engine/ledger-db.mjs
    ledgerFileFor). Every command opens it first; no file there refuses
    `ledger-missing` before the verb runs
  stdout: >-
    one JSON object — {ok:true, ...} on success. A refusal prints ok:false and
    names itself in one of four fields: `code` (the thrown refusals, the
    common case), `reason` (nudge, observe, reconcile, the `max-ops`
    concurrency refusal route and dispatch share, and every refusal that
    carries a `detail` telling the Kernel its next call — enqueue's missing
    required param, dispatch's prerequisite-unmet, route and dispatch's
    tool-unavailable), `rejected` (every
    dispatch launch failure) or `refused` (dispatch admission drift). The
    kebab string is the contract callers match on; each command's `refuses:`
    below names the string it prints and every untyped refusal says so
  exitCode: '0 ok / 1 refusal / 2 usage error'
  extensions: >-
    New verbs, boolean flags and status fields are FILES, never edits of api.mjs's shared lists
    (scripts/kernel/api-extensions.mjs): a verb is scripts/kernel/api-verbs/<verb>.mjs with its contract
    in modules/kernel/api-commands/<verb>.yaml (what commands.<verb> here would hold); a status field is
    scripts/kernel/api-status/<key>.mjs; a boolean flag is a line of scripts/kernel/api-boolean-flags.txt.
    `api extensions` lists them; check-api-surface reads both forms
  writes: >-
    every mutation runs inside BEGIN IMMEDIATE and appends its event —
    events is hash-chained (engine/ledger-db.mjs EVENTS_DIGEST_TRIGGER), so a
    half-write or a silent edit is impossible
  identity: >-
    a job's durable identity is {workflow_id, op_id, attempt, generation} +
    lease_token; lease writes that do not match the job's complete identity
    abort at the trigger (engine/schema.sql leases_match_job
    RAISE(ABORT,'lease-identity-drift')); a report whose identity fields
    contradict the job's bound {run, task, dispatch, from} fails
    starci/op-report@1 at filing (report-invalid)
  callerBoundary: >-
    The ledger is the Kernel's through these verbs; an op reaches it only through its own `report`
    and the read projections (status, survey, hierarchy, estimate, op-contract). An op worker ran
    node:sqlite against .starciwork/runtime.sqlite (inc-360891316369), so this is enforced, not only
    instructed. ENFORCED: (1) the op packet and prompt name no ledger file - only the api verbs;
    (2) a command-terminal op launches with STARCI_ROLE=op and STARCI_OP_JOB=<job> set in its own
    shell (scripts/agent/lib.mjs envPrefix), and Orca exports ORCA_TERMINAL_HANDLE into every
    terminal it owns, so a caller whose handle is the bound terminal of an op job (worker_id,
    payload managed/orca agentTerminalHandle, hierarchy runtime terminalHandle) is that op even as a
    managed worker-start agent whose env StarCi cannot set, and that job outranks STARCI_OP_JOB; (3) from an op caller every kernel verb
    (plan, enqueue, route, dispatch, reconcile, nudge, observe, questions, messages, reply, peers, notify, inbox,
    settle, check, consume-report, serve-ask, retire-ask, incident, provider-health, finish, archive) refuses `op-context-refused` before it runs, and `report`
    refuses `report-identity-mismatch` for any job but the caller's own (whose dispatch/contract
    binding the report binding then proves); each refusal appends 'op-caller-refused' on the op's
    job. RESIDUAL, owner-visible: the api cannot stop a raw file read - a worker with unattended
    shell permissions can still open the ledger file or unset the marker and call from a terminal
    Orca does not attribute to it. Nothing it reads that way is authority: only a filed report plus
    the Kernel's own `api check` settles, and a ledger claim quoted from a screen is never evidence.
    Nothing an op needs is only in the ledger: the packet carries the owner's goal statement
    (context.goal {revision, statement, amendment?} of the revision the job is bound to), so `api op-contract --json` answers what
    workers opened the file for (nivo auth inc-26b260e101e4). `messages` is a kernel verb too.
  sharedCheckout: >-
    Several workflows of one ledger build in ONE checkout on ONE branch; the shared branch is
    append-only and a worker touches only its owned paths. ENFORCED at every op dispatch
    (scripts/guards/, install.mjs guardLaunch; the receipt rides on op-dispatched `guard`, managed
    dispatches included): (1) a command-terminal worker's git and npm are shims first on its PATH
    (runtime/guards/bin; a native exe built from scripts/guards/launcher.cs on Windows): git-policy.mjs
    refuses reset (except `reset -- <owned paths>`), rebase, pull --rebase, commit --amend/-a/--no-verify
    or without explicit pathspecs (a --pathspec-from-file list, stdin `-` and --pathspec-file-nul
    included, is scoped line by line; an unreadable list refuses PATHSPEC_FILE_UNREADABLE), stash, clean
    -f, checkout/switch that moves HEAD, checkout/restore/add/rm of paths outside the job's owned paths,
    branch rewrites, forced pushes, a push to a URL or path or through a command-line remote redirect
    (PUSH_REMOTE_NOT_CONFIGURED), `remote add|set-url|rename|remove` (REMOTE_REWRITE), a `git config`
    write that changes core.hooksPath or a remote URL (CONFIG_GUARDED; setting core.hooksPath to its
    current value, as husky's install does, passes), update-ref and filter-branch, and a hooked write
    (commit, merge, push, reset, checkout, ...) with core.hooksPath overridden by -c, --config-env or
    GIT_CONFIG_* (HOOKS_BYPASS) - exit 3 with a typed code and the remedy; deps-guard.mjs runs every npm
    install-family command under one repository lock (<git common dir>/starci-deps.lock) and refuses
    npm ci while a job of ANOTHER workflow of the ledger is leased; (2) runtime/guards/jobs/<job>.json
    names the job's owned paths as absolute paths (STARCI_GUARD_FILE); a managed worker-start agent,
    whose env StarCi cannot set, is named by its Orca terminal instead
    (runtime/guards/terminals/<handle>.json, bound after dispatch-show, removed when that terminal
    closes); (3) every checkout the job
    writes gets a reference-transaction hook (starci-history-guard) that git runs for every caller:
    main, master and every checked-out branch only move forward and are never deleted, and an op
    (either identity above) never creates a worktree and every commit its update brings that no
    remote-tracking ref holds - a merge's own content and each commit it merges in - carries only its
    owned paths (refs/stash stays writable for lint-staged's pre-commit backup). The hook has no
    override. Staging into a private GIT_INDEX_FILE passes. config.yaml guards.shims /
    guards.historyHook false switch a layer off. Settle backs it: a committing pass whose commits since
    admission carry a path outside the owned paths refuses `foreign-paths` (settle --accept-foreign
    <paths> after the file's owner confirmed them), for legs admitted under shared-checkout-guard
  hierarchy: >-
    `hierarchy` projects starci/agent-hierarchy@1 from durable workflow/job
    identity. Stable nodes are workflow:<workflow>, agent:kernel:<workflow>
    and agent:operation:<job>; Orca terminal/pane ids are runtime metadata,
    never parent identity. The Kernel terminal owns one lazy workflow Run and
    every Op Task/Dispatch belongs to that Run.
  neverDoes:
    - 'never picks the next op or the model ad hoc — the kernel reasons, `api route` resolves and persists the decision on the job payload before every dispatch'
    - 'never answers an ask or revises a goal — intent is the owners (provision.ask)'
    - 'never deletes history — finish preserves goals/jobs/reports/events'
    - 'never spawns outside dispatch --spawn — one job, one terminal, one agent'
    # Boundary rules the KERNEL agent is held to (driver-loop.yaml boundary).
    # The api is the only door:
    - 'kernel never calls orca, git, or an agent CLI directly — host mechanics are api internals + scripts/agent/lib.mjs; the kernel sees receipts, not terminals'
    - 'kernel never writes files as the durable record — the ledger via api calls plus each job''s declared artifacts are the only durable surface (report/contract truth is the reports/contracts/checks rows)'
    - 'kernel never settles a report it has not consumed — `api consume-report` before `api settle`; consumption is the kernel''s durable acknowledgement and settle enforces it (marks consumed_at) at the latest'
    - 'kernel never holds durable state only in memory — survey findings, the derived plan, the slice table and routing reasoning persist via plan/incident into events BEFORE dispatch'
    - 'kernel never reuses an op terminal — settle closes the worker terminal; a retry is a new job row at attempt+1'
    - 'kernel never mutates an op terminal outside nudge/settle — `api observe` is the only read of its screen (context, never proof; sending is `api nudge`, closing is `api settle`)'

# ============================================================================
# COMMANDS
# ============================================================================
commands:

  # --------------------------------------------------------------------------
  # DISPATCH — packet + contract row + lease + (with --spawn) the [Op]
  # terminal.
  # --------------------------------------------------------------------------

  dispatch:
    args: '--job <job_id> [--spawn] [--model <target>] [--worktree <sel>] [--lease-ttl <ms>] [--env-gate off]'
    environmentPreStep: >-
      For uat.verify, uat.assisted.verify and e2e.verify (verify-failure.mjs ENV_GATED_OPS) dispatch first runs
      scripts/uat/env-health.mjs check --restart on the work/resource@1 environments the job's uat/e2e records
      reference: every declared probe, health-endpoint discovery when the declared path answers wrong
      (probe-drift - the service is up, the declaration is stale), a restart of a down or hung server the
      runtime can start (one it started through env-health serve, or the resource's configuration.start;
      a hung listener is killed only when it is that server or runs inside a workspace repository root), and
      the listener behind a hung port. The result rides the packet as context.environment and an
      environment-checked event. A port held by a process that is not the workspace's server (port-conflict)
      refuses the dispatch environment-not-ready with one open [environment] incident; the job stays queued
      and spends no attempt. --env-gate off (or STARCI_ENV_GATE=off) skips the step.
    model: '--model <target> is only an owner-named pool or profile target (gpt-6-sol) inside the kind''s order at its tier, launched at that pool''s pin; outside it dispatch refuses model-outside-order. Without it dispatch launches the persisted route'
    kernelBias: '--prefer/--avoid are accepted and ignored with a stderr warning (commands.route kernelBias); dispatch launches the persisted route'
    leaseTtl: 'modules/models/runtimes.yaml allocation.dispatchLeaseTtlMs unless --lease-ttl or payload.leaseTtlMs overrides it'
    reads: >-
      the job row + its workflow — including the PERSISTED `api route`
      decision on jobs.payload_json (model/modelId/effort; dispatch launches
      what route wrote, it does not re-decide); resources/leases/budgets for
      admission; the op brief modules/ops/ops/<op>.yaml; in the target
      repository, the records its `mustExist` reads resolve to and the bound
      records' dependsOn (prerequisite-unmet below); the model resolution
      through route-model (modules/models/selection.yaml — eligibility first,
      budget orders the eligible)
    writes: >-
      admission FIRST, launch second: one `path:<owned_path>` lease row per
      owned_path, spelled `path:repository:<role>/<path>` in a bound project
      (scripts/kernel/lease-canon.mjs: a bare path with --repository or a
      frontend op, a `<repo-name>/` prefix, `repository:<id>/`, a Work path —
      every spelling of one file is one key; a held row of either spelling is
      compared in that form through its holder job, and on Windows
      case-insensitively; the same relative path in another repository never
      overlaps; an unbound repository keeps the path as written)
      (capacity-1 exclusive write fences, reserveTwoPhase — job
      queued->leased with its fencing token, ttl bounds a crashed worker's
      fence while settle releases early) + budget_reservations taken
      atomically; the packet's owned_paths resolve per target repository
      (enqueue `repository` above, scripts/kernel/target-repo.mjs): a path the
      resolver retargets carries {path relative to its repository, repository
      role, root checkout, declared}, and the prompt shows it bare when it
      lives in the worker's checkout (--worktree, else --repo) and rooted at
      its own checkout otherwise, under a `writes_in` line naming each root;
      a path it leaves where dispatch placed the worker (no binding, bare
      paths of an unretargeted op) stays {path} verbatim. api report accepts
      `files` in either spelling; contracts row = the rendered packet markdown keyed
      (workflow_id,op_id,attempt) with the dispatch_id — the worker's
      dispatch authority, read back via `api op-contract`, written BEFORE the
      job may stand running — whose context_json.inputs
      {schema:starci/input-digests@1, digests:[{path, digest, kind}]} records the
      sha256 of every input the op binds - kind source: each `knowledge/**` and
      `modules/schemas/**` path (and modules/models/code-patterns.yaml) named by
      the manifest's reads, context, knowledge, the
      executionModes.<mode>.reads of the mode its declared params.mode
      selects (an op without params.mode binds none), and the packet
      params; kind work: each
      `.starciwork/**` record of payload.records (a record directory as the
      digest of its index.yaml/resource.yaml files) - a directory or glob as
      the digest of its sorted file digests, a missing path as `absent`
      (scripts/kernel/input-digests.mjs); `settle` later re-baselines the work
      entries to the bytes the job left; workflows.phase queued->running with a
      'phase-transition' event; jobs.status ->running with lease_token +
      worker_id only after attestation below (intent -> attested -> running);
      managed workers in an existing worktree have their exact assignee
      terminal renamed to `[Op] <op-id>` after dispatch-show (worker-start's
      creation display name otherwise renders as `worker-task_<id>`);
      events 'op-dispatched' ('dispatch-rejected' on refusal). A dispatch-rejected
      launch claims nothing — no contract row, no leases, no running phase.
    packet: >-
      the dispatch.yaml packet, fields unchanged — {op, brief,
      context:{workflow:{id,goal_revision,goal_identity},records,owned_paths,cut?},
      constraints:{model, budget, lease},
      returns:{verdict, evidence, suspicion}}
    priorFailures: >-
      a retry's prompt carries prior_attempt_failures: the red checks of the
      newest checks row of the job's OWN retry lineage before it
      (scripts/kernel/prior-failures.mjs priorChecksRow). An uncut op reads
      the newest earlier attempt of its own unit of work (enqueue uncutLineage);
      a cut ordinal reads only attempts of
      jobs with the same op, cut id AND ordinal (engine/admission.mjs
      cutRetryLineage), never a sibling slice that shares the op's durable
      attempt counter. payload.retry.retryOf, when it names a job of that
      lineage, caps the row at its attempt; one outside the lineage is
      ignored. No lineage row: no prior_attempt_failures.
      Beside them ride the Supervisor's lessons (modules/supervisor/lessons.yaml, supervise.yaml
      selfLearning) whose signature or text names one of those checks, as 'lesson <source>' entries
      (scripts/supervisor/lessons-file.mjs withLessons); none without a red check.
    ownerAnswers: >-
      packet context.owner_answers (dispatch.yaml fields context.owner_answers):
      every ask an earlier attempt of the job's retry lineage filed that holds an
      `ask-answered` event, with the question, options, chosen {index, label},
      answeredBy, answeredAt and receipt path (scripts/kernel/owner-answers.mjs
      ownerAnswersOf; the lineage is payload.retry.retryOf|resumeOf, so a cut
      ordinal reads only its own ordinal). The prompt opens with an
      `owner_answers:` block saying each question is ALREADY ANSWERED, binding,
      and never asked again. Absent when the lineage holds no answered ask. An
      owner-answer retry is enqueued exactly as before (same op and cut ordinal,
      no --after); the answer rides in the packet, not in the Kernel's free text
      (starci-next business.decide attempt 12 re-filed the answered
      ctx_3074731253e3 as ctx_cc73a111de44 before this)
    spawn: >-
      with --spawn the api runs the Orca sequence itself — through
      scripts/agent/lib.mjs spawnAgent, so the agent card's
      command flags are auto-injected and can never be forgotten:
      terminal create titled `[Op] <op-id>` -> readiness read -> send the
      rendered packet — command, flags and readiness patterns from the
      agent card modules/models/agents/<agent>.yaml. The
      kernel agent never calls orca directly. Without --spawn: dry-run —
      the packet prints, nothing is reserved and nothing launches.
    attestation: >-
      spawn success is not launch success. Before the job may stand
      'running' the api attests the launch: the terminal handle is bound,
      the rendered packet visibly landed, and FIRST MODEL ACTIVITY is
      seen inside the launch window — against the adapter card's
      readiness patterns + knownFailures signatures. Managed-worker identity
      is read from Orca's typed launch receipt, including
      worker.startOptions.launch.effective (and the legacy top-level launch
      field); missing a legacy field is not a model mismatch. An auth failure or
      known-crash signature (e.g. '401 Invalid API-key'), a terminal that
      dies, or a prompt that never lands is `dispatch-rejected`: the job
      stays NOT running, the terminal is closed (scripts/agent/lib.mjs),
      and the lease + budget reservations are released — a dead launch is a
      routed refusal, never a running ghost.
    returns: '{ok:true, packet, job:{job_id, status, lease_token}, spawn:{terminal:<handle>}|null}'
    refuses:
      - 'max-ops (field `reason`): the workflow already holds min(budgets.maxOps, maxParallelOps) operations (route.maxOps above names the two numbers and which statuses hold a slot). Checked before the packet and before any Orca call, on a dry run as well as a --spawn, so nothing is reserved and nothing launches. Prints {ok:false, jobId, op, reason:"max-ops", slots:{ok:false, running, ceiling, ceilingSource, reason}} and exits 1; the job stays queued'
      - 'seam-priority (field `reason`): the workflow has one free op slot left and a queued cut seam (ordinal 1 of a cut of more than one, not held by an owner-gate or peer-wait) waits for it; a job that is not a seam never takes that slot (scripts/kernel/cut-seam.mjs, driver-loop.yaml enqueue.seamContractFirst). Prints {ok:false, jobId, op, reason:"seam-priority", seam, slots} and exits 1; dispatch the seam first'
      - 'prerequisite-unmet (field `reason`): the op''s data prerequisites fail, checked after max-ops and before the packet and any Orca call, on a dry run as well as a --spawn (scripts/kernel/prerequisites.mjs). Two checks, data only: a manifest read marked `mustExist` whose every <placeholder> the job''s owned_paths or records spell out, with no file at that path in the repository (interface.audit reads.target); and, when graphPolicy.prerequisiteState is done, a bound record declaring dependsOn whose effective Work state (engine/index.mjs validateWorkspace) is decidably not done; and, for a read marked `layoutChain` (interface.draw reads.shell), a bound ui record whose `route` sits under a layout of the layout tree (.starciwork/shell/index.yaml) that is not settled. An unresolved placeholder, a record outside a Work tree, an invalid tree, or a ui record not yet written / without a route is unknown and admits. Prints {ok:false, jobId, op, reason:"prerequisite-unmet", unmet:[{kind:record-missing, read, path}|{kind:dependency-not-done, record, dependsOn:[{id,state}]}|{kind:layout-unsettled, read, record, route, layouts:[{node,reasons}]}], detail} and exits 1; nothing is reserved. detail reads "<op> reads <path> (reads.<id>, mustExist) and it does not exist | bound record <r> depends on <id> (<state>), not done, and <op> graphPolicy.prerequisiteState is done. Produce the missing record or finish the dependency through the op that owns it, then run api dispatch --job <id> again; if the job binds the wrong record, enqueue a corrected job and settle this one --verdict blocked. The job stays queued and nothing was reserved or launched."'
      - 'peer-wait (field `reason`): an open peer-wait incident holds the job. Checked right after owner-gate and before max-ops, on a dry run as well as a --spawn. Prints {ok:false, jobId, op, reason:"peer-wait", incident, peer} and exits 1; the job stays queued'
      - job-settled: 'job already settled — one lease, one agent, one verdict (dispatch.yaml oneOpOneAgent)'
      - 'kernel-rev-stale: as enqueue - the job''s op contract changed since the runtime rev the Kernel acked; checked before any reservation'
      - job-not-queued: 'only a queued job may dispatch; a live attempt keeps its exact worker and lease'
      - job-live-worker: 'queued row still has a connected+writable exact worker; api reconcile must reattach it before any new dispatch'
      - job-no-op: 'the job row carries no op identity to dispatch'
      - model-unknown: 'no model profile at modules/models/profiles/<target>.yaml'
      - 'model-outside-order (field `reason`): the launch pool (--model, the persisted route or the unrouted default qwen-agent) is outside the kind''s order at its floor-raised tier (scripts/agent/models.mjs kindOrder; a cut slice walks the fan-out order); a profile target counts as its provider''s pool. Strategy kinds (order think/decide/plan) therefore launch only on claude-agent or codex-agent. --spawn checks it before leases and any Orca call, prints {ok:false, jobId, op, reason:"model-outside-order", model, order, difficulty, allowed, detail} and exits 1; the job stays queued. A dry run does not refuse; it carries `modelOutsideOrder`'
      - brief-missing: '--spawn with no brief at modules/ops/ops/<op>.yaml — the packet would cite a contract that is not there'
      - 'tool-unavailable (field `reason`): --spawn whose launch agent (the persisted route, --model, or the unrouted default) lacks a host tool the op''s route.riskHints requires. Checked before leases and before any Orca call; prints {ok:false, jobId, op, reason:"tool-unavailable", tools, model, detail} and exits 1, the job stays queued. detail reads "<pool> (agent <provider>) lacks host tool <tool> that <op> requires (...). Re-run api route --job <id> — it now selects only agents whose card lists the tool — then dispatch again. The job stays queued." A dry run does not refuse; it carries `toolUnavailable`'
      - managed-agent: '--spawn on a launch kind that is neither command-terminal nor managed — that path is orca orchestration worker-start (modules/host/orca/index.yaml managedFallback)'
      - 'path-lease (field `reason`, `waiting: true`): a LIVE capacity-1 `path:<owned_path>` lease of another job (unexpired, its holder not settled) overlaps this job''s owned_paths - often the workflow''s OWN running job. A wait, never a launcher failure: checked before the provider circuit, the leases and any Orca call on --spawn (and again when reserve loses the race to a new holder), so nothing is reserved or launched and NO dispatch-rejected event is written. Prints {ok:false, jobId, op, reason:"path-lease", waiting:true, queuedBecause:"path-lease", holders:[{jobId, opId, workflowId, status, sameWorkflow, paths, expiresAt}], conflicts, detail} and exits 1; the job stays queued, api status reports it queuedBecause path-lease naming the holder and its lease expiry, and once the holder settles (releasing its rows) it reads ready, the frontier turns actionable and the next wake dispatches it. Never re-dispatch it by hand while it waits. An EXPIRED or orphaned overlapping row is no wait: reserve still refuses it as dispatch-rejected (a recovery signal - reconcile or settle the holder)'
      - 'host-resources-low (field `reason`, `waiting: true`): the host itself is short — free disk on the drive that holds %TEMP% and the repositories under runtimes.yaml allocation.resources.minFreeDiskGb, or the RAM-aware throttle (scripts/lib/ram-throttle.mjs, owner ruling 2026-09-28) refusing this op: the fleet already at maxParallelOps, a slot or the RAM a higher-priority workflow (allocation.resources.ramThrottle.priorities, scripts/supervisor/ram-cap.mjs prioritize) still claims (priority-reserved), a heavy op (allocation.resources.opRam class heavy) while free RAM is under minFreeRamPct or CPU is saturated and the workflow is below the top priority, any heavy op while free RAM is under ramThrottle.landSpecPauseBelowPct (heavy-paused, hysteresis: resumes above heavyResumeAbovePct), or its RAM estimate not fitting above hardFloorPct (does-not-fit); the answer then carries `throttle` {reason, op, class, estimateMb, mode, modeWhy, freeRamPct, cpuBusy, headroomMb, running, effectiveCap, heavyCap, maxParallelOps, priority} and the job''s ledger a `dispatch-throttled` event with the same numbers. Running ops are never stopped. A wait, never a launch failure: checked with the admission/provider-health path on --spawn before any Orca call, so nothing is reserved or launched and NO dispatch-rejected event is written. Prints {ok:false, jobId, op, reason:"host-resources-low", waiting:true, queuedBecause:"host-resources-low", resources:{drive, freeDiskGb, freeRamPct, minFreeDiskGb, minFreeRamPct}, detail} and exits 1; the job stays queued, api status reports it queuedBecause host-resources-low naming the drive and its free space, the watchdog runs housekeeping once against the shortage and stall-alert tells the owner with an approval-class alert naming the drive. Kernels wait for it — never a failure, never re-dispatched by hand; once the host is back over the thresholds the job reads ready and the next wake dispatches it'
      - 'reserve-failed (UNTYPED, field `refused`): admission threw on job identity/status drift — the job row is left untouched, an operator error rather than a dispatch rejection'
      - dispatch-rejected: >-
          the one typed rejection for every launch failure, carried in the
          `rejected` field: an open provider-health circuit, a refused
          admission (an expired or orphaned `path:<owned_path>` lease row, a
          resource with no declared capacity, or the machine arbiter — the
          reasons ride `reserve.reasons`; a LIVE lease another job holds is
          path-lease above, a wait), run-create, task-create, a dead
          spawn, prompt send/submission, attestation against the adapter
          card's knownFailures, or a dispatch-show assignee mismatch. In every
          case the job is NOT running, the terminal is closed and the lease +
          budget reservations are released. The refused launch is appended to
          payload.rejectedDispatches[] {dispatchId, step, at, effectState} —
          the evidence reconcile proves no-effect against, kept apart from
          payload.managed so it can never be read as the job's live binding.
          The prompt is sent observed for the card submission window
          (calls.yaml terminal-send-prompt): a turn_started receipt proves the
          submit. One not seen submitted (no turn start, or an old host's
          agent_prompt_stalled) is proven from the frame: lost (the provider
          idle at an empty input), it is sent once more, and lost again the send
          is refused with signal prompt-delivery-stalled; a terminal whose
          process incarnation the host refuses is terminal-incarnation-stale.
          That refusal and an unclassified worker-start refusal each record a provider strike
          (modules/models/runtimes.yaml allocation.providerStrikes), and the
          strike that reaches the limit opens the typed provider circuit
    layoutPreflight: >-
      the owned-path legality preflight dispatch.yaml describes is the
      KERNEL's step before enqueue, not an api refusal: api dispatch does not
      read the target repo's layout/lint contracts
    usedBy: 'drive.dispatch — only jobs whose owned_paths are disjoint and whose capacity is free'


# ============================================================================
# ASK LIFECYCLE — the events an `outcome: ask` report passes through after it
# is filed. The report row stays OPEN until a terminal kind lands; every reader
# of open asks honours all of them.
# ============================================================================
askLifecycle:
  servedBy: scripts/kernel/serve-ask.mjs
  ordering: events are ordered by events.seq — event_id is a random token and orders nothing
  events:
    - ask-notified: 'api serve-ask (serve-ask.mjs parkAsk) told the owner on Telegram: an approval ask is pushed (the question with a Generate URL button, no link, no form; via:telegram), a credential ask is listed for the bridge /creds and never pushed (via:creds). payload {dispatchId, onDemand:true, via:telegram|creds, askClass:approval|credential, messageId, key, fresh, fields}. The ask then waits on the owner with no form (frontier.askOnDemandDispatches, supervisor liveness on-demand); like ask-serving it reopens an ask superseded before it'
    - ask-notify-failed: 'the Telegram notice could not be sent. payload {dispatchId, error}; api serve-ask then served the form at once'
    - ask-serving: 'the localhost form is bound and answering. payload {dispatchId, url, pid, fields, ttlMs, onDemand?, requestedBy?} (onDemand/requestedBy telegram when the owner pressed Generate URL); the newest ask-serving for a dispatch is the URL that counts'
    - ask-serving-expired: 'the --ttl window closed with no submission. payload {dispatchId}; the URL is dead until a re-serve appends a newer ask-serving'
    - ask-superseded: 'a later ask report for the same (workflow, op) and the same subject (the asking job params.subject, else overlapping question.refs) was served and retires this one; an ask of the same op about another subject stays open. payload {dispatchId: <retired ask>, by: <the ask now serving>, opId}; terminal — a retired ask is closed without an answer and is never relayed to the owner'
    - ask-answered: 'the owner submitted the form. payload {dispatchId, receiptPath, answeredBy, optionIndex, custodyWritten, envWritten, pointersWritten, errors} — names and custody paths only, never values; terminal. The receipt (starci/ask-answer@1) carries option, optionIndex (the picked option''s position in question.options), picks, answeredBy, note and at. On a handover.review ask serve-ask refuses a delegate''s approve (403): only the owner approves a handover'
    - ask-auto-accepted: 'config.yaml asks.autoAcceptRecommended answered the ask with its recommended option instead of serving it; appended with the ask-answered (answeredBy auto-recommended) it audits. payload {dispatchId, opId, optionIndex, option, recommendedReason, receiptPath, rule {key, autoAcceptRecommended, excludes, source: structured|text}, config {autoAcceptRecommended, excludes, source}}. A handover.review, credential or excluded-kind ask never gets one'
    - draw-owner-ruling: 'an owner answer to a draw-review ask (form submit or a Telegram reply, serve-ask.mjs) holds a note: one event per note, the owner ruling bound to its shape and the part digests the owner saw (scripts/work/draw-feedback.mjs recordDrawAnswer). payload {noteId, record, recordPath, shape, part, parts, text, class (product-direction|grammar|knowledge|one-off), target, as, classifiedBy, decision, owed, dispatchId, jobId, receipt, receiptSha256}'
    - draw-redraw-owed: 'the owner answered a draw-review ask with a redraw: the same interface.draw leg owes a redraw that addresses every note. payload {record, recordPath, jobId, dispatchId, shapes, noteIds, receipt}; api status lists it as drawReviews[].redrawOwed and, until an interface.draw job is enqueued after it, a nextActions retry'
    - knowledge-change-requested: 'a draw note the runtime classified knowledge: a knowledge change request for the supervisor / runtime owner. payload {noteId, target, text, record, shape, dispatchId, receipt, status: open, for: supervisor}; api status lists open ones as knowledgeChangeRequests until knowledge-change-resolved {noteId}'
    - ask-message-closed: 'the ask no longer waits (answered, auto-accepted, retired or superseded) and its Telegram messages were removed. payload {dispatchId, reason, deleted[], edited[], failed[]}: deleted, or edited to say it was answered where Telegram refuses a delete (older than 48 h); the bridge sweep retries a failed one'
  open: 'an ask report carrying neither ask-answered nor ask-superseded for its dispatch_id (a supersede followed by ask-notified or ask-serving is open again); modules/supervisor/supervise.yaml is the reader that tags each open ask live, stale, dead, unserved or on-demand before it reaches the owner'
