schema: starci/module-kernel-start@1
id: kernel.start-workflow

# ============================================================================
# START-WORKFLOW <goal-id> — claims a queued goal from the ledger inbox and
# spawns ONE long-lived [Kernel] agent bound to that workflow_id. The kernel
# then runs modules/kernel/driver-loop.yaml until the workflow finishes. On
# finish the queue entry is consumed and the workflow closes; a finished
# goal never re-enters the queue.
# ============================================================================

about:
  en: >-
    Complement of goal.define. define-goal queues; start-workflow claims and
    launches. The spawned kernel receives only {workflow_id, goal_revision} —
    everything else it re-reads from the ledger. Kernel death → re-run
    start-workflow with the same goal id spawns a REPLACEMENT kernel
    (kernel attempt+1, same workflow generation), never a duplicate. Durable
    plan/jobs/events survive agent churn.

watchdog:
  executable: scripts/kernel/watchdog.mjs
  cadence: modules/models/runtimes.yaml allocation.watchdogCadenceMs
  resume: >-
    scripts/kernel/resume-all.mjs restarts the watchdogs a host reboot killed:
    one --repair watchdog per running, unarchived workflow that has none,
    once Orca answers (--wait-orca retries for a bounded time). Each watchdog
    then replaces its dead Kernel through start-workflow; a kernel handle a
    running Orca answers terminal_handle_stale for is gone, so nothing is
    closed and no incident is opened for it.
  boundary: >-
    Liveness only. It reads canonical status/survey and the attested Kernel
    terminal. A connected terminal at its provider input prompt is turn-idle
    and receives a continuation wake; disconnected/unwritable exact proof may
    re-enter start-workflow for the same approved goal. It never plans,
    enqueues, routes, dispatches, reconciles, settles or finishes operations.
    It owns the waiting cadence: the Kernel yields when no durable transition is
    immediately executable and never keeps a model turn alive with sleep or an
    internal polling loop.

actor: >-
  launcher — a human Codex, Claude or Devin chat surface
  (codex-chat | claude-chat | devin-chat). The launcher is ingress only; it
  does not become the workflow's execution host or Kernel agent.
host: orca
executable: scripts/kernel/start-workflow.mjs

usage: start-workflow.mjs --repo <path> --goal <workflow_id> [--agent <name>] [--adopt <terminal>]
# --repo is the project repository that owns .starciwork/runtime.sqlite, not Source
# without --goal: claims the oldest pending inbox goal
# --agent pins an explicit Kernel agent override (routedBy: override)
# --adopt binds a live kernel terminal back to its workflow (see claim.onLostSeat)

claim:
  transaction: >-
    UPDATE inbox SET status='claimed' WHERE workflow_id=<goal> AND status='pending'
    inside BEGIN IMMEDIATE — two starts never claim the same goal.
  onDeadKernel: >-
    inbox 'claimed' with no signal, an expired startup reservation, or a signal
    whose Orca terminal is disconnected/unwritable → clear the stale binding and
    spawn a replacement kernel for the same workflow (kernel attempt+1; workflow
    generation is unchanged). Dead means a RESPONDING Orca says so
    (scripts/kernel/host-outage.mjs): the handle is terminal_handle_stale or
    missing from the listing, or listed disconnected/unwritable.
  onAgentExited: >-
    A kernel terminal that is connected but whose frame ENDS in a bare shell
    prompt (scripts/kernel/terminal-liveness.mjs exitedAgentPromptRow: the
    agent exited and left its PowerShell/cmd/POSIX shell) is a dead kernel on
    a responding Orca, never a live signal and never adoptable. The watchdog
    confirms it with a second read after the death settle and asks
    start-workflow for a replacement; start-workflow re-proves it, clears the
    seat (kernel-stale-cleared with agentExited, shellPrompt), launches the
    replacement and only THEN closes the old shell with its tab on fresh proof
    it is still a bare shell or disconnected
    (close-op-terminal.mjs closeExitedTerminal), recorded as
    kernel-exited-terminal-closed {liveTerminal, terminals[]} and returned as
    exitedTerminalsClosed; a shell left open is an open
    kernel-stale-terminal-unclosed incident, and a closed one resolves the
    open incidents of that kind naming it. A kernel job terminal in that
    state does not answer kernel-terminal-alive either. A failed launch
    leaves the shell for the next start to close.
  onHostOutage: >-
    Orca not answering - runtime_unavailable, orca.exe ENOENT while an update
    replaces it, a timed-out call - says nothing about any terminal. It is
    host-unavailable: start-workflow refuses (step host-unavailable, exit 75)
    before touching the signal, the job or any terminal, and the watchdog waits
    with backoff, re-probes once Orca answers and confirms a death with a
    second probe before it asks for a replacement (2026-09-24 Orca
    auto-update: six kernel seats lost, one kernel duplicated).
  onLostSeat: >-
    A kernel job whose terminal is alive while its signal is gone (a restart
    that failed mid-outage) is never replaced: start-workflow refuses (step
    kernel-terminal-alive, exit 3) and `--adopt <terminal>` binds it back - the
    terminal must be named by the kernel job or a kernel event of the
    workflow, live on a responding Orca, in the repo's worktree and showing an
    agent session (a frame ending in a bare shell prompt refuses
    adopt-terminal-agent-exited), and no other live kernel may hold the
    signal; a signal terminal whose agent exited is closed after the adopt. Adopt writes
    the signal, marks the job running with that worker, resolves the open
    kernel-stale-terminal-unclosed incidents naming it, records
    kernel-adopted and types nothing into the terminal. The watchdog adopts on
    its own when start-workflow answers kernel-terminal-alive.
  onFinished: >-
    workflows.phase='finished' refuses a new kernel — a completed goal is gone
    from the queue for good.

spawn:
  title: '[Kernel] <workflow_id>'
  routing: >-
    Orca is always the execution host. The Kernel agent and concrete model are
    resolved by owner config first, otherwise scripts/route/route-model.mjs
    --kind model.manageWorkflow --risk high --repo <repo>. A config single pin
    or launcher override is an explicit Kernel identity pin and fails closed
    when unavailable; it is never silently replaced by Devin or another agent.
    A config kernel group and the unpinned think-group route are an ordered
    member list (docs/config-format.md "Kernel group"). Operation jobs retain
    their own independent profile/runtime-pool routing and fallback policy.
  fallThrough:
    rule: >-
      A group boot (config kernel group or unpinned route) launches its members
      in order within one boot and one startup reservation. A member whose
      launch fails at a noEffectSteps step — before the model took any input:
      the command could not be built, the terminal was not created, readiness
      refused (an interactive gate such as the Claude first-run onboarding or
      Codex directory trust, an auth death screen, a readiness timeout) or the
      model did not attest — is recorded as one kernel-start-failed event
      (fellThroughTo names the next member), its terminal is closed, and the
      next member launches. A failure at any later step (send, submission,
      attestation) has partial or unknown effect and never falls through; a
      failed member whose terminal close is refused never falls through either,
      so a boot never leaves an orphan terminal beside a new kernel. The last
      member's refusal, a single pin and an --agent override end the boot as
      before. Success records kernel-booted/kernel-restarted with fellThrough.
    noEffectSteps: [command, create, readiness, model-attestation]
  command: >-
    Every Kernel boots as one dedicated Orca terminal, including Codex and
    Claude agents that use managed workers for operation jobs. The command is
    composed only from modules/models/agents/<agent>.yaml. The card owns the
    executable plus modelArgs, effortArgs, bypassArgs and any credential/env
    preparation; the launcher never improvises flags. Codex currently uses
    --model <model>, -c model_reasoning_effort="<effort>",
    --ask-for-approval never and --sandbox danger-full-access.
  prompt: >-
    kernel packet: rendered from modules/kernel/kernel-prompt.md (contract
    data — the template lives in modules/, not scripts/): resolved Source
    host, project binding, BE/FE roots, ledger and
    absolute API path + {workflow_id, goal_revision} + mandatory load order —
    Source CONTEXT.md → modules/kernel/{driver-loop,api,dispatch,verdict-contract}.yaml →
    read goal from .starciwork/runtime.sqlite → run the loop. Every state
    mutation goes through node scripts/kernel/api.mjs <cmd>
    (the verb surface is modules/kernel/api.yaml `commands` — that file is the
    only list, and two of its verbs are worker-side op IPC) — never
    direct sqlite writes, never self-spawned op terminals, never direct
    orca/git/agent-CLI calls (report/contract/check truth is the ledger
    rows via the api verbs); `api route` persists the model decision before
    every dispatch; dispatch goes through api dispatch; findings/plans
    persist via api plan|incident before dispatch (kernel-prompt.md BOUNDARY).
  attestation: >-
    terminal.create → terminal.read readiness → terminal.send prompt →
    terminal.read activity. When a concrete model is requested, the ready
    terminal must render that exact model id before the prompt is accepted.
    A command-line model flag is request evidence, not attestation. Mismatch or
    absence fails with step=model-attestation, closes the terminal, clears the
    startup reservation and never records the Kernel job as running.

# ============================================================================
# The Orca tree (Run -> Task -> terminal) beside the ledger hierarchy. The
# ledger is the relationship source; this is the rule that keeps what Orca
# renders equal to it, continuously and not only at creation. Cited by
# modules/kernel/dispatch.yaml and modules/kernel/api.yaml; stated here once.
# ============================================================================
orcaTree:
  rule: >-
    A workflow has exactly one live kernel terminal; its Orca Run is created
    once and survives kernel restarts; every operation Task is created in that
    Run with the CURRENT kernel terminal as `from` (Orca `--parent` takes a task id, never a terminal); a job that
    ends (settle, reject, finish) leaves no live terminal, worker or open Task;
    a kernel restart closes the previous kernel terminal before the new one is
    recorded.
  enforcedBy:
    - scripts/kernel/start-workflow.mjs — the restart merges the new seat over the previous kernel payload, so orca.runId and hierarchy.runtime.runId survive, and terminal-closes the previous kernel terminal before the replacement is recorded; a refused close is a kernel-stale-terminal-unclosed event plus an open incident.
    - scripts/kernel/api.mjs — ensureWorkflowRun creates the Run once per workflow; createOperationTask passes the current kernel terminal as `from`; rejectDispatch closes the terminal or worker the refused attempt created and records terminalClosed; settle closes the worker and the Task; finish closes the kernel terminal and every Task the Run still holds open.
    - modules/host/orca/calls.yaml — the typed calls those steps issue (terminal-create --title, terminal-close, task-create --from, task-update).
  titles:
    kernelTerminal: '[Kernel] <workflow_id>'
    operationTerminal: '[Op] <op> a<attempt> · <workflow_id>'
    operationTask: '{displayName: [Op] <op>, taskTitle: <op> #<attempt>}'
    note: >-
      A Task hangs under its parent, which says the rest; a terminal is a flat
      sidebar row with no parent to read, so it carries the attempt and the
      workflow too. Titles are written at creation (terminal-create --title),
      not left to the provider's own summary; the managed path renames the
      exact attested assignee afterwards because worker-start creation labels
      do not reach a fresh terminal in an existing worktree.
  check:
    executable: scripts/checks/check-orca-tree.mjs
    usage: check-orca-tree.mjs --repo <ledger owner> (--terminals <terminal-list --json receipt> | --live) [--json]
    findings:
      DUPLICATE_KERNEL: a workflow with more than one live kernel terminal, or a kernel signal terminal that is not the kernel job's worker_id
      ORPHAN_TERMINAL: a live StarCi terminal bound to no running/answering job and not the kernel signal of a non-finished workflow
      DEAD_KERNEL: a non-finished workflow whose signal terminal is not in the listing
      TASK_OUTSIDE_RUN: a job holding an open Task in a Run that is not the workflow's current Run
    exit: 0 clean, 1 findings, 2 usage
    scope: >-
      Only StarCi's own terminals — a handle the ledger names, or a title the
      kernel wrote. An owner's own terminals are never findings.
    notInNpmCheck: >-
      It reads a ledger, which `npm run check` does not have. It runs against a
      project's .starciwork, and scripts/supervisor/poll.mjs prints the same
      findings every cycle.

records:
  jobs_row: {kind: 'kernel', workflow_id, status: 'running', worker_id: <terminal handle>, payload: {route: {host: orca, agent, model}, hierarchy: {schema: starci/agent-hierarchy@1, nodeId: 'agent:kernel:<workflow_id>', parentNodeId: 'workflow:<workflow_id>', role: kernel, runtime: {host: orca, agent, provider, model, profile, runtimePool, terminalHandle}}}}
  signals_row: {scope: 'kernel', key: workflow_id, token, value: {terminal: <terminal handle>, modelAttested: true}}

rules:
  - 'one kernel per workflow — signals singleton enforces it'
  - 'startup reserves the singleton with a bounded TTL before terminal creation'
  - 'boot never calls orchestration run-create/task-create/worker-start; those are operation lifecycle APIs'
  - 'prompt delivery is successful only after readiness, exact requested-model attestation and visible TUI activity'
  - 'kernel outlives ops; ops are ephemeral, kernel is not'
  - 'claim first, spawn second — never spawn for an unclaimed goal'
  - 'workflow finish closes the goal: workflows.phase=finished, inbox closed (status done)'

returns:
  kernel_terminal: handle
  workflow_id: bound
  host: orca
  agent: codex|claude|devin|qwen
  model: concrete model id
  model_attested: true
  replaced: true|false
