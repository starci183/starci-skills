# retired-paths.yaml — files deleted on purpose (owner ruling 2026-09-28 "delete on any error": the reconciler is the only
# loop; rollback is git revert, not a dormant fallback). History may still name them: a contract-change entry
# (modules/kernel/contract-changes/**) or modules/kernel/owner-rulings.yaml citing one of these paths is valid
# (scripts/checks/check-contract-cites.mjs); live contract text must name what runs now. `replacedBy` names the
# reconciler controller that owns the duty (modules/reconciler/reconciler.yaml), `removedIn` the lane.
#
# moved[]: a file that moved, one entry per move ({from, to, movedIn: the chunk, quiesced: true only for a pinned path moved
# with the fleet stopped}); written by the move codemod of the runtime HFS migration. History may cite `from`, live prose
# cites `to`; RT_RETIRED_PRESENT refuses a `from` that is tracked again, and the pending ratchet keeps a moved file's entry.
# retiredSymbols[]: a name replaced by an Orca built-in or another mechanism ({symbol, replacedBy}); RT_RETIRED_PRESENT
# refuses a declaration of it in runtime production code (scripts/hfs/runtime-rules/retired.mjs).
