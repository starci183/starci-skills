# The JSON files scripts/checks/check-json-exceptions.mjs admits without schema stamps. Exact relative
# paths (from this skill root), no wildcards: exceptions[] names one file each; directories[] names one
# exact directory whose direct *.json children are all admitted (an append-only record written one file
# per entry, a package whose every direct JSON is toolchain config, or a test-world fake's recorded
# payloads in the third party's own JSON wire format — subdirectories are not admitted, and the directory
# must exist). Generated runtime mirrors (GENERATED_MIRROR_ROOTS in scripts/checks/check-json-exceptions.mjs)
# are not authored source and are not listed.
json-exceptions:
  directories:
    - path: benchmark/snapshots
      reason: >
        Append-only model-pool snapshots written by scripts/agent/benchmark-snapshot.mjs, one
        <YYYY-MM-DD>-<N>h.json per date and window in the raw model-scorecard --json shape
        (benchmark/README.md). JSON by the scorecard contract; a new snapshot needs no new line here.
    - path: examples/ecommerce-app/be/contracts/billing
      reason: >
        The vendored async contract of the billing service (`starci/event-contract@1`), emitted by `starci app emit` from `apps/billing/src/events.ts`, never written by hand; JSON by the contract format (R151).
    - path: examples/ecommerce-app/be/contracts/order
      reason: >
        The vendored async contract of the order service (`starci/event-contract@1`), emitted by `starci app emit` from `apps/order/src/events.ts`, never written by hand; JSON by the contract format (R151).
    - path: examples/ecommerce-app/fe/packages/ecommerce-api
      reason: >
        npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
    - path: examples/ecommerce-app/fe/packages/ecommerce-i18n
      reason: >
        npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
    - path: examples/ecommerce-app/fe/packages/ecommerce-ui
      reason: >
        npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
    - path: packages/test-world
      reason: >
        The @starci/test-world package: its package.json, package-lock.json and tsconfig.json are toolchain config npm and tsc read as JSON.
    - path: packages/tsconfig
      reason: >
        The @starci/tsconfig package: its package.json and the shared presets (base, be, build, e2e, next) that product tsconfig files extend; tsc reads JSON, and a new preset needs no new line here.
  exceptions:
    - path: .claude/settings.json
      reason: >
        Claude Code project settings for the runtime checkout (the PreToolUse seat-tools guard hook); Claude Code reads JSON.
    - path: engine/yaml-license.json
      reason: >
        License metadata for the bundled yaml runtime in engine/yaml.mjs;
        authored JSON kept source-side by upstream license form.
    - path: examples/ecommerce-app/.starcistacks/dev/environment.json
      reason: >
        starci/rendered-environment output for the ecommerce-app application stack (be side); JSON by the rendering contract.
    - path: examples/ecommerce-app/.starcistacks/dev/infra/compose/realm-ecommerce.json
      reason: >
        Keycloak realm import for the dev Compose stack of the ecommerce-app back end; the
        Keycloak container's realm-import feature requires a JSON realm file.
    - path: examples/ecommerce-app/.starcistacks/dev/infra/metadata.json
      reason: >
        Resolved runtime projection (port map) for the ecommerce product; JSON by the example tooling contract.
    - path: examples/ecommerce-app/be/nest-cli.json
      reason: >
        Nest CLI monorepo map inside the ecommerce-app back end; the nest toolchain reads JSON.
    - path: examples/ecommerce-app/be/src/tests/tsconfig.json
      reason: >
        TypeScript config for the ecommerce-app back-end test tree (src/tests); tsc reads JSON (with comments).
