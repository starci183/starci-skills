# allowlist.yaml — the ONE explicit allowlist of the runtime (schema modules/schemas/allowlist.schema.yaml).
#
# Every exception a runtime check keeps lives in one named section here, each entry carrying the reason it
# exists; a reader loads its section through scripts/lib/allowlist.mjs (readAllowlist(kind)) and nothing
# else. Every section only shrinks: an entry goes when the exception it names is gone, and no second
# allowlist, baseline, pending or entries file is allowed (scripts/checks/check-one-allowlist.mjs).
schema: starci/allowlist@1

# Literals that look like finding codes to scripts/checks/check-failure-codes.mjs but are not: constants,
# env names, schema ids, event kinds, labels. Anything a checker or verb can emit as a reason belongs in
# modules/kernel/failure-codes.yaml instead.
not-codes:
  - literal: APP_FILTER
    reason: "NestJS framework token name the checker looks for, not a code"
  - literal: APP_GUARD
    reason: "NestJS framework token name the checker looks for, not a code"
  - literal: BAND_TOKEN_NAMES
    reason: "export name of a token table in the grammar knowledge"
  - literal: BLOCK_FOLDED
    reason: "YAML scalar type name, not an error code"
  - literal: BLOCK_LITERAL
    reason: "YAML scalar type name, not an error code"
  - literal: COMMON_GRAMMAR_COMPONENTS
    reason: "name of a registry constant in the grammar package, not a code"
  - literal: COMP_CWORD
    reason: "bash completion variable the generated starci completion script reads, not a code"
  - literal: ENGINE_SCHEMA
    reason: "constant naming the engine protocol marker (starci/engine@1), not an emitted code"
  - literal: GLOBAL_ANALYSIS_TOKEN
    reason: "SonarQube token type label passed when minting a token, not a failure code"
  - literal: INIT_CWD
    reason: "the env var npm sets for a lifecycle script; package-clean-test.mjs drops it from the clean install env, not a code"
  - literal: IO_DRIFT
    reason: "only named in a comment in kinds.yaml; no emit site found in scripts/engine/modules"
  - literal: LEDGER_SCHEMA
    reason: "schema id constant, not a code"
  - literal: LEDGER_VERSION
    reason: "schema version constant, not a code"
  - literal: MACHINE_SCHEMA
    reason: "schema id constant, not a code"
