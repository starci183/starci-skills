# The scripts scripts/checks/check-dead-scripts.mjs keeps despite having no code reader (spec utilities,
# generated-baseline recorders, deliberate touch points): an undeclared script with no executable reader
# is a dead script, and an entry whose script is gone or that code now reads is a stale entry, so this
# list only shrinks. Delete a script that nothing reads rather than declaring it.
