# ============================================================================
# modules/kernel/driver-loop.yaml — the kernel's tick contract
#
# The reasoned half of the kernel: what the ONE long-lived [Kernel] agent does
# every tick of a project's life — settle a verdict, pick the next leg, route
# the op and the model, dispatch, wait for the next verdict. Declarative rules
# only; every rule cites the mechanism that owns it. Nothing here executes —
# scripts/kernel/api.mjs + engine/ are the spine; this file is what an agent
# reads to reason like it.
#
# Operating model: .claude runs purely on Orca.
#   chat          = goal creator + trigger only. The owner prompt lands here;
#                   it spawns the kernel and is never an agent layer above it.
#   [Kernel] <p>  = ONE agent per project, LONG-LIVED. plan -> dispatch ->
#                   settle -> re-plan. Terminal title `[Kernel] <project>`
#                   (scripts/kernel/start-workflow.mjs spawn).
#   [Op] <name>   = 1 op = 1 EPHEMERAL agent, spawned per dispatch BY
#                   `api dispatch --spawn` through an Orca terminal, dies when
#                   its verdict settles — `api settle` closes the worker
#                   terminal (scripts/agent/lib.mjs). Terminal title
#                   `[Op] <op-or-task>` (the fleet naming rule).
#
# The kernel agent touches NO state directly: every read/write below is one
# `node scripts/kernel/api.mjs <command>` call — the full command contract is
# modules/kernel/api.yaml; the packet contract is modules/kernel/dispatch.yaml;
# the spawned kernel's boundary contract is modules/kernel/kernel-prompt.md.
#
# Sources (all under .claude/, relative to the skill root):
#   scripts/kernel/api.mjs   — the kernel's only door to the ledger + spawn;
#                              owns reserve/admission/dispatch-planning/settle/
#                              incident semantics this file cites
#   scripts/kernel/start-workflow.mjs — one kernel per workflow; spawn +
#                              health-window restart
#   scripts/agent/lib.mjs    — spawnAgent, terminal lifecycle, liveness reads
#   engine/ledger-db.mjs     — jobs/leases/events/incidents/state_snapshots
#                              tables; hash-chained events (engine/schema.sql)
#   engine/schema.sql        — the tables + lease-identity triggers the api
#                              transacts against (jobs/leases/events/signals)
#   modules/kernel/api.yaml  — the api contract (args, reads/writes, refusals)
#   modules/models/kinds.yaml — routes: bounded outcome routing table
#   modules/goal/legality.yaml — ambiguity ladder, backward edges, split rules
#   modules/models/selection.yaml — the model routing rules (route-model)
# ============================================================================

schema: starci/module-kernel-driver-loop@1

about:
  kind: kernel-driver-loop
  businessQuestion: >-
    "Given an approved goal and a fleet of ephemeral op agents, what does the
    kernel do on each tick — which leg goes next, to whom, on which model —
    and which decisions is it never allowed to take alone?"
  businessAnswer: >-
    The kernel is a state machine with a pulse. Each tick it settles every
    verdict that arrived, re-derives the frontier from the goal's state
    variables (never from memory of what it sent), launches only what the
    dispatch plan proves parallel-safe, and stops — it waits — when nothing is
    both ready and legal. It decides order and assignment; it never decides
    scope, identity or authority.
  sources:
    - scripts/kernel/api.mjs
    - engine/ledger-db.mjs
    - scripts/agent/lib.mjs

# ============================================================================
# 0 — KERNEL BOUNDARY. What the [Kernel] agent may never do itself. Each rule
#    names the defect it exists to prevent. The same boundary is in
#    modules/kernel/kernel-prompt.md (the spawned kernel's contract) and in
#    api.yaml conventions.neverDoes.
# ============================================================================
boundary:
  hostMechanics: >-
    The kernel NEVER calls orca, git, or an agent CLI directly — terminal
    create/read/send/close, spawn flags, liveness screens and workspace state
    are api internals and scripts/agent/lib.mjs functions; the kernel sees
    receipts, not terminals. The api owns host mechanics, period.
  durableSurface: >-
    The kernel NEVER writes files as the durable record — the ledger (via
    api calls) plus each job's declared artifacts are the only durable
    surface; dispatch-time prompt artifacts are api-owned and staged in the
    os tmpdir (delivered, then deleted). The op IPC is durable the same way:
    the contract, the report and the re-run checks are the
    contracts/reports/checks ROWS transacted through `api dispatch` /
    `api op-contract` / `api report` / `api consume-report` / `api check`.
  persistAsYouThink: >-
    Agent memory is not durable. Survey findings, the derived plan, the
    slice table and model/routing reasoning are persisted into the ledger
    as they form — `api plan` records the plan digest + structural diff +
    lineage, `api incident` records a named finding; events and
    state_snapshots (engine/schema.sql) are the durable memory. A kernel
    that dies mid-survey must lose nothing — hoarding state in context
    until dispatch is a defect.
  terminalLifecycle: >-
    `api settle` closes the worker terminal — the kernel never reuses an op
    terminal and never re-dispatches into a settled job's handle. What a retry
    costs in rows and attempts is tick.drive.oneOpOneAgent below.
  language: >-
    Owner rule: code is English, logs are in config.yaml `language` (the
    owner_language every packet carries). The kernel writes commands, api
    verbs and flags, identifiers, Work records, commit messages and incident
    kinds in English, and its terminal narration, status lines, `api notify`
    subjects and bodies, incident details and owner-facing summaries in
    owner_language.
  opTerminalObservation: >-
    The one sanctioned look at an op's screen is `api observe --job <id>` —
    read-only reasoning context through the api on the job's own exact
    worker. It sends nothing (that is `api nudge`), closes nothing (that is
    `api settle`), and an op's screen is never proof: only `api report`
    plus kernel-run `api check` rows settle a verdict.

# ============================================================================
# 1 — THE TICK. One iteration of the driver loop, in order — expressed in api
#    calls. The kernel agent NEVER opens .starciwork/runtime.sqlite and never
#    spawns a terminal itself: every state operation is
#    `node scripts/kernel/api.mjs <command>` (modules/kernel/api.yaml — args,
#    read/write sets, refusal strings). A refusal is a fact the loop routes,
#    never a crash. The kernel never skips ahead: a report it has not settled
#    is a verdict the next pick does not know about.
# ============================================================================
tick:
  order:
    - survey    # api survey --workflow — the tick opens on the ledger, never on memory; then api inbox (peer messages)
    - plan      # api plan --workflow --file <plan.json> — persist the derived plan; structural diff vs the approved opChain
    - enqueue   # api enqueue --workflow --op --paths [--records] — a queued job row per planned op the queue lacks
    - drive     # loop{ status -> reconcile effect_unknown and worker-dead (--dead-worker) -> route -> dispatch -> wait/observe -> report consumed -> checks re-run -> settle -> retry|incident } until the frontier empties
    - finish    # api finish --workflow — every job settled AND the owner approved the handover (handoverLoop)
  citation: "modules/kernel/api.yaml commands — the api + this loop are the spine: survey, inbox, plan, enqueue, route, dispatch, reconcile, observe, op-contract, report, consume-report, check, settle, incident, finish"

  survey:
    rule: >-
      `api survey` is the tick's one deep read — goal (latest revision + the
      approved opChain), jobs, inbox, signals, events tail, open incidents,
      in one projection. The kernel never queries sqlite itself; a state it
      cannot survey is a state it may not act on.
    neverMemory: >-
      The frontier is COMPUTED from the survey, never remembered — what was
      dispatched, what settled, what is parked is all re-read each tick
      (the api's status/survey projections apply the same discipline on the
      durable spine).
    peerInbox: >-
      Every wake, after survey and before planning, read `api inbox --workflow
      <id>`: peer workflows of this ledger send their requests, heads-ups,
      handoffs and replies there, and what they say can change your plan.
      Act on each and ack it (§ peers below).

  plan:
    rule: >-
      The kernel derives the plan from the surveyed goal and hands it to
      `api plan --file <plan.json>` (shape: modules/schemas/goal-plan.yaml). The api
      persists the digest + diff as a 'plan-derived' event and returns the
      STRUCTURAL diff of the derived op set vs the approved opChain in
      goals.json (define-goal.yaml: the chain is advisory — re-derived at
      boot, never trusted blindly).
    divergence: >-
      Structural divergence — legs added, removed or re-rooted vs the
      approved shape — is NOT a dispatch decision: `api incident --kind
      plan-divergence` and escalate per the ladder below; no dispatch runs
      on a divergent plan. Order tweaks and allowlist wording inside the
      approved shape are the driver's own call (escalation.driverAlone
      ORDER).

  enqueue:
    rule: >-
      Each planned op with no job row gets one: `api enqueue --op <opId>
      --paths <owned_paths csv> [--records <closed read-set csv>]` writes
      status='queued' with the op's explicit Work-record reads and write-set
      on the row. A downstream op that consumes a scope.define proposal binds
      that exact predecessor scope record here; it never discovers a
      repository-wide substitute. One row per planned op the queue lacks:
      `api enqueue` does not refuse a second live row for the same op
      (cutExecution needs N of them), so not doubling a leg is the kernel's
      own discipline and the durable fence is the capacity-1 path lease
      dispatch admission takes. A settled dispatch-rejected job
      is different: when its result explicitly proves infrastructure failure
      and effectState:none, it returns the same durable row/attempt to queued
      with the same businessAttempt. Repeating recovery creates no successor
      row, contract or effect, so rerouting is idempotent.
    cutExecution: >-
      A preflight-proven write closure beyond the canonical cut bounds is
      execution decomposition INSIDE the already approved semantic op, not a
      new semantic plan leg and not an owner gate. The agent count is
      computed, not guessed: measure the closure's files/assertions/
      components/records, pass its paths, and call `api estimate`; its
      `agentsAchievable` is N and its `slices` is the same number. That number
      is the closure's size class and the owner's parallelism gear read
      through the declared tables (modules/models/runtimes.yaml
      allocation.slicing `weights`, `targetMinutes`, `size.<class>.from`,
      `size.<class>.agents`, `gears`), then bounded by the disjoint partition
      the closure actually holds — `agentsRequested` is what the gear asks
      for and `reason` names what capped it. A gear raises the request only:
      the pool's maxParallel, the fleet's maxParallelOps and the workflow's
      budgets.maxOps still admit, and a slice refused `max-ops` stays queued
      until one of them frees.
      A cut is not fan-out within an operation: the slices are DISJOINT jobs
      of the same approved op, each still one job with one agent and one
      verdict (dispatch.yaml oneOpOneAgent), never several agents sharing one
      operation — which is what fanOutWithinOperation forbids.
      Derive a stable cut id and a complete seam-first partition of concrete,
      pairwise-disjoint path slices; enqueue one job per slice with the SAME
      approved op id using `--cut-id <id> --cut-ordinal <n> --cut-total <N>`.
      Every slice stays at or below the file/assertion/component bounds and
      carries the same exact goal/record binding. Route the set spread across
      the tier's pool order (`--prefer` rotated per ordinal) so parallel
      slices occupy devin/codex/claude/qwen lanes concurrently instead of
      saturating one pool. Do not inject work.author, duplicate the op in the
      derived goal plan, or create a mega-op. The semantic leg advances only
      after every ordinal in the cut set settles pass and the union of their
      declared paths equals the preflight closure. A failed slice, or any
      settled job `api status` lists in `staleInput` (a law input it read
      changed after dispatch), is redone as a new attempt of that same op and
      cut ordinal with the same cut id/total — a stale cut seam-first, its
      seam ordinal (the lowest, owning the root configs) alone before the
      rest — a passed slice whose inputs are unchanged is never rerun, and a
      stale job never counts toward its leg until its redo passes.
      An op `ask` or `blocked` that names another slice's owned paths (files
      it may not commit), and an `api settle` refused `not-landed`, is
      resolved by re-dispatching the owning slice to commit its own paths
      (and push, when its policy pushes) as a new attempt of that op and cut
      ordinal, never by leaving the asker waiting. A job whose owned paths or
      repository name the wrong target is settled fail or blocked with that
      reason and re-enqueued with the right --paths/--repository
      (api.yaml commands.enqueue), never fixed by editing its payload — a
      direct ledger write §1 forbids.
      When the operation contract declares cut-set-aware integration proof,
      each non-final slice reruns the unchanged full regression but may retain
      only failures mapped to unsettled sibling ordinals; its independent
      Kernel checks are green `cut-slice-postcondition` and
      `cut-regression-inventory`, with the raw nonzero integration result kept
      as evidence rather than mislabeled green. The pass that closes the set
      - the last ordinal to settle, whichever it is (`api status` cutSets
      names it as closingOrdinal) - must record `full-regression-final` green:
      the Kernel runs the unchanged full gates over the whole set before that
      settle (inc-751dd1ac4492). This is a saga-style bounded migration:
      slice acceptance proves monotonic progress, final acceptance proves the
      global postcondition.
      If a complete disjoint partition cannot be derived from repository
      evidence, that inability is a technical planner incident for Kernel/AI
      repair; it becomes an owner gate only when business scope or authority
      truly must expand.
    boundary: >-
      Enqueue is declaration, not launch: owned_paths ride on the job row so
      dispatch-time disjointness is checkable before any agent exists
      (modules/goal/legality.yaml splitRules; modules/schemas/goal-plan.yaml disjoint
      allowlists). Paths are normalized concrete workspace-relative prefixes;
      absolute/root/traversal/glob grants are refused (a trailing `/**` is
      normalized to its directory prefix). Broad `workspace.manage` grants are
      decomposed into exact selected migration node/resource/stack slices when
      those slices are derivable. In multi-repository projects each product
      prefix is qualified by its stable repository binding (for example
      `nivo-fe/apps/landing`); canonical Work remains `.starciwork/...`.

  drive:
    status: >-
      Each loop iteration opens on `api status` — phase, jobs grouped by
      status, live leases, filed reports, and exact running-operation terminal
      liveness/output freshness. Survey is the deep ledger read. Report age is
      never worker liveness: connected+writable only proves a terminal can
      receive input. The api also reads the current provider frame: an activity
      marker is active, while a ready input prompt is `turn-idle`. Output age is
      fallback evidence only. A running active or live-idle attempt is never
      routed/dispatched again; its own lease blocking a duplicate is a safety
      fence, not a capacity defect. An expired lease under a 'running' job is a
      detector, not free capacity (the api keeps unproved leases held).
      `frontier.state=worker-nudge-ready` is never a wait reason: immediately
      call `api nudge` for each exact id in `frontier.nudgeReadyJobs` before
      applying any age/wedge threshold. A worker with `staged-input` liveness
      holds an unsubmitted paste: api nudge submits it with one Enter.
      `frontier.state=worker-question` is not a wait either: a worker asked its
      coordinator through an Orca orchestration ask and blocks until answered
      (inc-b944cbaef24b). Run `api questions --workflow <id>`, then for each
      pending question `api reply --message <id> --body <answer>` when it is
      technical guidance inside the job's contract and authority, or
      `api reply --message <id> --to-owner` when only the owner can decide -
      the worker then files it as an outcome ask and serve-ask carries it. A
      reply never grants scope, paths, retries or owner intent. `orphaned-frontier` is likewise an
      immediate technical plan/repair transition, not a reason to yield.
      `worker-wedged` is not a wait either: api observe each id in
      `frontier.wedgedJobs` once, then api nudge it to interrupt the stuck
      command, or reconcile and re-dispatch the attempt.
      `worker-dead` is not a wait either: a running job's exact terminal is
      gone (disconnected, or unknown to a running Orca - every op terminal
      after a host shutdown) and no report is filed, so nothing will ever
      arrive. Run `api reconcile --job <id> --dead-worker` for each id in
      `frontier.deadWorkerJobs` (reconcile.deadWorker below).
      `peer-message` (`frontier.peerMessageKeys`) is not a wait either: read
      `api inbox`, act on each message and ack it (§ peers below).
      `frontier.askReserveDispatches` (an unanswered ask whose serve-ask form
      expired or was never served) is not a wait either: re-serve each with
      serve-ask --dispatch before yielding; a dead link is not an owner wait.
      A re-serve config.yaml asks.autoAcceptRecommended answers returns
      autoAccepted with the recommended option instead of a form: the ask is
      answered (answeredBy auto-recommended), so re-enqueue the op with it
      (provisionAsk below).
      `awaiting-owner` (no open operation, at least one unanswered ask) is a
      legitimate wait: yield naming the pending ask dispatch ids; the
      answer's ask-answered wake brings you back. A pending handover ask is
      this wait too. `handover-answered`, `finish-ready` and `handover-due`
      are never waits: each is the next handover move (handoverLoop below),
      and `api status` `handover` names it.
    reconcile: >-
      An `effect_unknown` job is part of the open frontier and remains fenced.
      Before routing it, call `api reconcile --job <id>`. The api reads the
      exact managed Dispatch through Orca wrappers and requeues the same
      job/attempt only when no contract/report exists and host evidence proves
      prompt injection stalled before model input, the exact worker process is
      exited, and release either completed or retained terminal bookkeeping
      only as `identity_unproven`. Any weaker observation leaves the lease and
      effect_unknown status intact; the kernel records/relays that blocker and
      never creates a successor attempt from a guess.
    deadWorker: >-
      A workflow survives a host shutdown like a saga: the ledger is the
      whole state, so a restarted Kernel (the watchdog relaunches it through
      start-workflow, and scripts/kernel/resume-all.mjs restarts the
      watchdogs after a reboot) re-reads status and recovers each
      `worker-dead` job with `api reconcile --job <id> --dead-worker`
      (modules/kernel/api.yaml commands.reconcile.deadWorker). The answer
      names one route. recovery `settle`: the worker filed its report before
      it died - consume-report, check and settle as usual. recovery
      `requeued`: the attempt provably had no effect (no report, checks or
      worker question, no effect outside its owned paths, no change or
      commit under them since dispatch), so the SAME job and attempt are
      queued again - route and dispatch it; this infrastructure retry spends
      no business attempt. recovery `fenced`: the job is effect_unknown with
      evidence (dirty:<path>, commit:<sha>, checks, worker-question, risk,
      unverifiable paths, or infra-retries-exhausted) - read it, inspect the
      owned paths, settle it `fail` (or `blocked` when only the owner can
      decide) and enqueue a new attempt whose contract states what already
      landed. Never requeue a fenced attempt by hand and never dispatch a
      duplicate over a running row.
    dispatch:
      rule: >-
        For each ELIGIBLE queued job — normalized concrete owned_paths disjoint
        from every durable in-flight path lease AND capacity free — the kernel first
        calls `api route --job <id>` (the model decision is resolved and
        persisted on the job payload: model/modelId/effort/routeChain), then
        `api dispatch --job <id> --spawn` reserves the durable lease, writes
        the contracts row (the rendered packet — the worker's dispatch
        authority, read back via `api op-contract`) and lands the `[Op]`
        terminal itself. The kernel picks WHICH jobs; the api owns the
        mechanics (modules/kernel/dispatch.yaml spawnMechanics). Without
        --spawn it is a dry-run packet preview.
      eligibility: >-
        Dispatch planning's three levels, enforced inside the api's refusals:
        file (no write/write or write/read ancestor/equality overlap with
        anything in flight),
        lease (no contested capacity-1 resource — the path:* write fences and
        machine:* budgets), group (seam runs alone and first;
        siblings bounded by runtimes.yaml fanOut.maxPerGroup). An op whose
        `api estimate` over its measured write scope returns slices > 1
        (the twelve-file / eight-assertion / three-component screen in
        modules/models/kinds.yaml implementation.plan is the coarse form of
        the same measure) is cut into a complete set of disjoint SAME-OP
        execution slices before any slice is enqueued (`enqueue.cutExecution`);
        this does not alter the approved semantic chain. These checks span all workflows in the canonical ledger.
        There is no repository-wide, ledger-wide, workflow-wide or open-job
        exclusion: disjoint concrete paths remain concurrently eligible.
      route: >-
        The op id was route-op's pick during plan (scripts/route/route-op.mjs
        — pick + reasons + citations, never a whole-contract read). The
        packet's constraints.model is decided by `api route --job <id>
        [--prefer <pool>] [--avoid <pool>] [--difficulty <d>]` BEFORE
        dispatch: it resolves through the pool selection
        (modules/models/runtimes.yaml + selection rules — eligibility first,
        capacity/quota/incidents order the eligible; budget never makes a
        model eligible) and PERSISTS {model, modelId, effort, routeChain,
        routeRejected, difficulty} onto the job payload plus a
        'route-decided' event. Dispatch then launches exactly what route
        persisted — the kernel never picks a model ad hoc and dispatch never
        re-decides. A verify job is allocated AWAY from the runtime that
        implemented its slice (the api's verify-avoidance rule).
      oneOpOneAgent: >-
        One queued job = one dispatch = one ephemeral [Op] agent; a job
        holding a lease is never re-dispatched and a settled job is never
        re-launched — a retry is a NEW row at attempt+1
        (dispatch.yaml oneOpOneAgent; the api settles it, not a new launch).
        The only same-row retry is an infrastructure launch rejected before
        contract/effect and explicitly returned to queued by no-effect
        rejection or `api reconcile`; that row no longer holds a lease.
      starvation: >-
        A dispatch refused because another in-flight job already holds the
        capacity-1 path lease or machine budget it needs comes back
        `dispatch-rejected` with the reserve reasons attached — a wait reason,
        not a failure. The loop records it and yields; it does not force
        (modules/models/runtimes.yaml maxParallelOps). A
        path lease remains the durable fence until explicit settle/reconcile;
        expiry is a recovery signal, never proof that a prior worker cannot
        still write.
    wait:
      rule: >-
        Between dispatch and the next report the kernel WAITS durably, not
        inside one model turn. It yields only after an `api status` issued
        AFTER its last settle or consume-report comes back
        `frontier.actionable: false`; on `true` it does the work that field
        names — route/dispatch the queued jobs, reconcile the fenced ones,
        consume the filed reports, nudge the idle workers — and asks again.
        A status read before that last transition is stale and never
        authorizes a yield. When the fresh status is not actionable, the
        kernel records/names the exact wait reason and yields immediately.
        The external watchdog owns the cadence
        (modules/models/runtimes.yaml allocation.watchdogCadenceMs) and wakes the same
        Kernel identity; the resumed turn begins with `api status`. The Kernel
        never runs Start-Sleep, shell sleep, a timer, or an in-turn polling loop.
        It does not poll for work to invent. The report discipline is durable:
        the worker files its answer through `api report --job <id> --report
        <file>` — the file is a starci/op-report@1 JSON envelope, an upsert
        keyed UNIQUE(workflow_id, dispatch_id) on the reports row, which IS
        the verdict of record; `api status` projects the filed rows
        (modules/kernel/verdict-contract.yaml envelope). The done-marker/
        Orca message is only the wake-up.
      observe: >-
        While a running op owes a report the kernel may keep reasoning
        context on it: `api observe --job <id> [--lines <n>]` reads the exact
        worker terminal's liveness plus a bounded screen tail, on the cadence
        modules/models/runtimes.yaml allocation.observeCadenceMs declares and
        especially before a nudge or settle-fail
        decision — an op that dies without filing leaves `result.report:
        null`, so the screen is how the kernel learns what the op was doing.
        The screen is context, never evidence: only `api report` plus the
        kernel's own `api check` re-runs settle a verdict, and the read never
        sends (that is `api nudge`) or closes (that is `api settle`).
      turnIdle: >-
        A connected+writable Op terminal showing its provider input prompt is
        not working. On the first `turn-idle` observation with no filed report,
        call `api nudge --job <id>`; that wakes the exact worker with its existing
        contract and grants no new authority. If the bounded wake returns idle
        without a report, record worker-idle-without-report and settle fail from
        the missing-report evidence before the retry (drive.oneOpOneAgent).
        Never wait indefinitely and never spawn a duplicate over the original
        lease.
      workerDonePing: >-
        An op's `worker_done` / terminal-done signal is a completion PING,
        never an outcome — the durable outcome is the reports row filed via
        `api report`. A worker_done with no reports row settles as
        outcome=failed (reportFiled:false): the signal wakes the kernel,
        the row carries the verdict.
      boundary: >-
        Waiting is itself supervised outside the model turn. A turn-idle Kernel
        is woken on the watchdog cadence; only a Kernel whose terminal is proven
        disconnected or unwritable is restarted
        (failureHandling.kernelDeath). Failure detectors run on the resumed
        state transition — failureHandling section.
    settle:
      rule: >-
        A landed report settles in order: the kernel reads the reports row
        the worker filed, integrates it via `api consume-report --job <id>`
        (consumed_at set — the kernel's durable acknowledgement), re-runs
        the op's declared checks itself and records the results via `api
        check --job <id> --checks
        '{"checks":[{"name":"<check>","command":"<exact rerun>","exitCode":0,"evidence":"<observed proof>"}]}'`,
        and only then `api settle
        --job <id> --verdict <v> [--report <path>]` — the api validates the
        filed envelope's outcome against the verdict, binds the reports row
        to the job's dispatch_id (the envelope's identity fields {run, task,
        dispatch, from} were stamped from the job row at filing —
        validateOpReport), releases the lease and records the verdict. Consumption is enforced: settle sets the report's
        consumed_at if the kernel did not already mark it — a report is
        never settled unconsumed, and a dispatch with no filed report has
        nothing to settle. A refused settle is a routed verdict,
        never silent loss (api.yaml refuses).
      neverTrust: >-
        `done` is never taken on trust — the op's own checks are re-run and
        the re-run results recorded on the checks row via `api check` before
        settle, and the envelope itself is re-validated starci/op-report@1
        (validateOpReport: outcome payload present, files inside owned_paths,
        identity stamped from the job row). Evidence is bytes
        on disk, never words in a summary (verdict-contract.yaml).
      durableHalf: >-
        The settle is a ledger transaction: the durable job completes, the
        consumed report stands integrated, its machine lease refs release
        and the worker terminal is closed
        (scripts/agent/lib.mjs — a settled op leaves no live terminal). A
        report whose identity fields contradict the job's bound {run, task,
        dispatch, from} is refused at filing ('report-invalid' —
        validateOpReport), not partially accepted.
      signalNote: >-
        The marker/report convention is the WAKE-UP only: a `<job>.done`
        marker beside the job's `<job>-REPORT.md` under its declared
        artifact dir is scratch signal, never the durable record — the
        durable report is the reports row written by `api report`, and the
        durable contract is the contracts row written by dispatch.
        Row first, file second, signal third.
    repair:
      onFail: >-
        verdict fail -> retry inside the route's limit: `api enqueue` the
        same op with the failure named back (modules/models/
        kinds.yaml routes — the full table is verdictTable below;
        drive.oneOpOneAgent owns what the new row costs). A
        dispatch-rejected/no-effect infrastructure recovery reroutes the same
        queued durable attempt and does not consume this route limit.
      onBlocked: >-
        verdict blocked -> the typed blocker is the route key
        (verdictTable.blocked); environment/authority/ask go to needUser.
      forensicLadder: >-
        On a settle-fail or a suspicious report the kernel climbs a ladder,
        never reads a transcript: (1) `api check` re-runs the deterministic
        checks; (2) the kernel takes one bounded tail read of the op
        terminal via `api observe` — triage classification only; (3) full-transcript
        forensics are delegated to a fresh op (kind review.verify)
        that files its own report envelope; (4) repeated failures
        escalate to the owner with the terminal handle. The kernel never
        ingests a full raw transcript.
      budget: >-
        Past the route's limit, `api incident --kind <k> --detail <s>`
        records the fingerprint and the workflow asks the user — identical
        evidence is not progress and a runtime swap alone never resets the
        budget (the api's incident fingerprint/attempt upsert). Only attempts
        that may have produced business effects count here; an explicit
        dispatch-rejected result with effectState:none, retryable:true and
        attemptConsumed:false uses the separately bounded infrastructure
        restart budget.

  finish:
    rule: >-
      When `api status` shows every job settled, the final verify leg settled
      pass AND the owner approved the handover (frontier `finish-ready`),
      `api finish` closes the workflow: phase=finished, goal finished, history
      preserved (api.yaml finish). For product delivery the final verify must
      include one current reconciliation proving SRS, SDS, code, test/E2E and
      UAT against the same delivery revision; a settled job list is not that
      proof. The approval is enforced, not instructed: `api finish` refuses
      `handover-not-approved` unless a `handover-approved` event is newer than
      the last business settle (scripts/kernel/handover.mjs handoverGateOf).
      A finished workflow finishes again idempotently.
    citation: "modules/kernel/api.yaml finish — 'run the gates, finish'; scripts/kernel/handover.mjs"

# ============================================================================
# 2 — VERDICT HANDLING. What the driver does with each settled verdict.
#    `outcome` is the op's report; `verdict` is the kernel's judgement of it.
#    The closed route table is modules/models/kinds.yaml routes: — first
#    match wins, an explicit `from` stands before `any`, `limit` bounds one
#    route per node group, and past the limit the workflow asks the user.
# ============================================================================
verdictTable:
  # The report outcome enum and blocker vocabulary live in
  # modules/kernel/verdict-contract.yaml (starci/op-report@1):
  # OUTCOMES=['done','partial','failed','ask','blocked'],
  # BLOCKER_KINDS=['shared-change','srs-gap','sds-gap','interface-gap',
  #                'brand-gap','grammar-gap','test-gap','environment','authority'].

  - verdict: pass           # report done AND kernel re-ran the checks green
    driverDoes: "settle the op; mark its produces: variables established; pick the next leg"
    route: "no route fires — the chain advances"
    citation: "the api's settle validation (validateOpReport, scripts/kernel/report-envelope.mjs); modules/models/kinds.yaml lanes advance on done"

  - verdict: fail           # outcome failed, or done the kernel could not reproduce
    driverDoes: >-
      Route by the table: outcome failed -> `same` kind again (limit 3,
      retry); a report the kernel could not reproduce -> verdict rejected ->
      `same` (limit 2, retry); uat/e2e/perf red -> lane.build repair (limit 3,
      reopen); review findings -> lane.build repair (limit 3, settle);
      gate-failed -> lane.build gate repair (limit 3, settle); partial ->
      `same` carrying open items (limit 5, retry). `interface.audit` is the
      deliberate exception to generic failed->same: bounded/local drift routes
      to interface.implement; systemic, unclear or creatively inadequate
      direction reports interface-gap and routes to interface.draw. Both paths
      return through interface.implement and fresh capture before re-audit.
    budget: >-
      Each route's own `limit:` bounds it (modules/models/kinds.yaml routes —
      failed->same 3, partial->same 5, rejected->same 2, repairs 3, gaps 2).
      Route limits are
      per node group; `api incident` fingerprints progress so repeated
      identical evidence is not progress — a runtime swap alone never resets
      the budget.
    exhausted: "past the limit -> the workflow asks the user (route `then: needUser` is explicit per row)"
    citation: "modules/models/kinds.yaml routes"

  - verdict: blocked        # typed blocker, or ask
    driverDoes: >-
      Route by blocker kind: srs-gap -> business.revise; sds-gap ->
      architecture.revise; interface-gap -> interface.draw; brand-gap ->
      brand.decide; grammar-gap -> grammar.update; test-gap -> test.author
      (each limit 2, reopen); shared-change -> scoped build of the owning kind
      (limit 3, pause); environment -> needUser (limit 1); authority ->
      needUser (limit 1); outcome ask -> needUser (limit 1 — the kernel may
      answer only from the options the question offered, never an invented one).
      A handover.review ask is the exception that is routed by its answer:
      approve, feedback or question (handoverLoop; kinds.yaml handover routes).
    provisionAsk: >-
      Owner-bound needs go through provision.ask / decision.prepare and are
      projected to the owner as owner requests via the inbox
      (modules/ops/ops/provision.ask.yaml; kinds: information, credential,
      account, access, consent, authority, business-decision,
      irreversible-confirmation). A credential ask parks only the live-proof
      legs that need the real value (integration.verify, e2e.verify,
      uat.verify, uat.assisted.*) and settles by PRESENCE — the op is
      'running' with no dispatch, no runtime, no slot. Build legs never wait
      on it: they code against the declared env var or custody key with a
      `placeholder-<VAR_NAME>` stand-in and report credentialPending
      (modules/ops/_common.yaml "Bounded finish and blockers"; owner ruling
      2026-09-23: asking for a credential does not mean not doing the
      work). When a report lands with outcome ask, the kernel runs
      `api serve-ask --workflow <id> --dispatch <id>`, which launches
      scripts/kernel/serve-ask.mjs detached — it serves the question as a localhost form
      (first free port in 6969..7069, nonce path), writes submitted values to
      sealed custody/.env.local without any agent seeing them, files a
      sanitized `ask-answered` event, and wakes the kernel. With config.yaml
      asks.autoAcceptRecommended on, an ask that carries a recommended option
      (question.recommended, or exactly one option marked "(khuyến nghị)",
      "(recommended)" or "(đề xuất)") and falls in no class of asks.excludes
      is never served: `api serve-ask` records `ask-answered` with answeredBy
      auto-recommended (receipt option, optionIndex and a note citing the
      config key and the recommendedReason) plus an `ask-auto-accepted` audit
      event, wakes the kernel and tells the owner once on Telegram. That
      answer binds like an owner answer for a business choice: re-enqueue the
      op with it bound and record the decision with its source
      (auto-recommended, the recommendedReason). The owner can reverse it
      later; a later owner answer supersedes it and is handled like a new
      ask. A credential ask, an excluded kind and every handover.review ask
      are always served, and a handover is never auto-accepted: its approval
      is the owner's own answer. The ask leg stays
      parked meanwhile; runnable frontier ops keep driving. `api status`
      awaitingOwner[] lists every op whose latest attempt waits on the owner
      and whether its ask is answered; an answered one is re-enqueued, and
      that attempt spends no business retry (verdict-contract.yaml
      retryAccounting.ownerWait).
    citation: "modules/models/kinds.yaml routes; modules/kernel/verdict-contract.yaml BLOCKER_KINDS; modules/ops/ops/provision.ask.yaml"

  - verdict: suspicion      # the mid-flight wrongness signal
    driverDoes: >-
      Not an exception — a backward edge. The finding travels BACK to the
      boundary that owns it and the work re-runs forward with fresh evidence:
      propagate-invalidation marks every derivation on the changed section
      stale; a report from the prior rev is admitted into the new rev only
      when digests are identical (modules/goal/legality.yaml;
      modules/ops/ops/goal.revise.yaml).
    route: >-
      Three levels (modules/goal/legality.yaml backwardEdges.suspicionLevels):
      spec-conflict-in-scope -> the owning revise route (srs-gap ->
      business.revise etc., or goal.revise for a goal-level conflict);
      scope-expansion -> re-run scope.define, then provision.ask if authority
      widens; identity-wrong -> provision.ask ALWAYS.
    citation: "modules/goal/legality.yaml backwardEdges; modules/ops/ops/goal.revise.yaml"

interfaceAuditLoop:
  chain: >-
    interface.draw -> interface.implement -> fresh capture -> interface.audit.
    A bounded repair omits redraw; a systemic/direction repair repeats it with
    a more explicit coverage/component/state map. interface.audit only inspects
    and writes findings: it never edits code/design/assets/Grammar, never
    captures replacement renders and never dispatches a repair.
  budget: >-
    Count interface.audit attempts for the same selected matrix across both
    repair routes as one shared budget. Round must be 1..5 with immediate
    predecessor lineage. Do not enqueue round 6 even if an individual route
    counter would still permit it. On round 5, no-actionable-drift advances;
    actionable drift records AUDIT_ROUND_LIMIT with the complete trend and
    stops at the declared budget boundary rather than claiming pass.
  freshness: >-
    Every source/design repair invalidates prior captures. The next audit is
    executable only after interface.implement stamps fresh real route x state
    x viewport x theme captures from the repaired served build.
  realization: >-
    interface.draw classifies every visible region as raster-asset or
    code-native. Rich authored mascot/illustration/photo/textured media keeps
    exact asset identity and provenance; layout, cards, panels, controls,
    typography, system icons, responsive structure, shadows, glows and simple
    geometry use semantic DOM plus installed Grammar/CSS/repository-native SVG.
    interface.implement persists the actual binding and interface.audit treats
    flattened UI or silent CSS approximation of required authored media as hard
    realization.mode drift.
  deviations: >-
    A claimed intentional departure from the accepted draw never passes by an
    auditor or implementer explanation. interface.audit persists the measured
    side-by-side diff, rationale, accepted-conformant alternative, strongest
    counterargument, risks, rollback and recheck matrix as a hash-bound
    append-only deviation case. Until an explicit owner decision names that
    exact case digest and draw/capture hashes, keep the finding open and stop
    with OWNER_DEVIATION_DECISION_REQUIRED. Owner approval creates newer
    accepted direction lineage; it is not an audit self-waiver.
  citation: "modules/ops/ops/interface.audit.yaml auditPolicy; modules/models/kinds.yaml interface audit routes"

handoverLoop:
  why: >-
    Owner ruling 2026-09-23: at handover one op lets the owner test, give
    feedback or ask, and the workflow counts as done only when the reviewer
    approves. handover.review is that op and the last leg of every chain
    (modules/ops/ops/handover.review.yaml; modules/models/kinds.yaml
    handover routes).
  enqueue: >-
    When every other approved leg settled (frontier `handover-due`), enqueue
    handover.review with `--paths .starciwork/evidence/<workflow>.handover`
    and no other grant, route it and dispatch it. A chain approved before the
    op existed has no handover leg: append it as the LAST leg of the derived
    plan - `api plan` records divergence.handoverAppended and does not count
    it as divergence - and enqueue it anyway; no owner question is needed to
    add it, because `api finish` refuses without it.
  ask: >-
    The attempt reads the goal and `api survey --deliveries` and files
    outcome ask with the package. `api report` refuses a handover ask that is
    not exactly the options approve, feedback, question in that order.
    Settle it `blocked` (awaiting-owner, no business attempt spent), run
    `api serve-ask --workflow <id> --dispatch <ask dispatch>`, and yield on
    `awaiting-owner`; an expired form is `ask-reserve` like any other ask.
  approve: >-
    `handover-answered` with decision approve and byOwner true: enqueue
    handover.review again. It reads the approval and files done; record one
    kernel check (name handover-owner-approval, command the `api status
    --workflow <id> --json` read, exit 0, evidence the ask dispatch, decision
    and answeredBy) with `api check`, then `api settle --verdict pass`. Settle
    re-reads the receipt itself and records `handover-approved {jobId,
    dispatchId, answeredBy, at}`, or refuses `handover-not-approved` when the
    receipt is not the owner's approve of the latest handover ask or a
    business job settled after that package was filed. Then frontier reads
    `finish-ready`: retire any leftover ask and `api finish`.
  delegation: >-
    Only the owner approves. serve-ask refuses a delegated approve outright;
    a receipt whose answeredBy is not the owner never settles the handover
    pass and never satisfies `api finish`, whatever config.yaml delegation
    allows for other asks. A delegate's feedback or question is routed like
    the owner's.
  feedback: >-
    `handover-answered` with decision feedback: the note (status handover.ask.note,
    the receipt's note) is a defect report. Route it to the fix op of the slice it
    names - that node's lane build step with origin repair, or the
    srs-gap / sds-gap / interface-gap route when the note says the requirement
    or the design itself is wrong - enqueued with `--title "handover feedback
    <ask dispatch>: <the note in a line>"`; the fix op reads the whole note in
    `api survey --workflow <id> --deliveries` handoverHistory. Once that fix
    settles pass the frontier reads `handover-due`: run handover.review again;
    its package opens with what was fixed and how to re-test it.
  question: >-
    `handover-answered` with decision question: enqueue handover.review again.
    The attempt reads the question from `api survey --deliveries`
    handoverHistory and opens its package with the answer, then asks again.
    The kernel never answers the owner in chat or in an ask of its own.
  staleness: >-
    A business job that settles after the approval makes it stale: status
    `handover.finishAllowed` turns false and the handover runs again.
  archived: >-
    The one existing way out without an approval is a workflow whose record
    the owner archived (workflows.archived_at); nothing in the api sets it.
  citation: "modules/ops/ops/handover.review.yaml; scripts/kernel/handover.mjs; modules/models/kinds.yaml routes"

assistedUatLoop:
  classify: >-
    Third-party involvement is not itself a human gate. Use ordinary automated
    UAT/integration whenever the action and assertions are automatable. Select
    assisted UAT only for a declared human/provider gesture the workflow may
    not automate, such as CAPTCHA, OTP custody, 3DS or external consent.
  prepare: >-
    uat.assisted.prepare freezes exact scripts, bindings, redaction and cleanup
    without executing the journey or changing canonical Work. The user-facing
    skills/run-assisted-uat session may create exactly one append-only receipt.
  verify: >-
    A later uat.assisted.verify selects exact request/session/receipt paths and
    derives pass from current digest equality, complete ordered execution,
    machine postconditions, genuine sanitized artifacts and verified cleanup.
    Human `ok` means execution finished only. Final reconciliation, not the
    runner or either assisted op, projects current evidence into Work done.
  slots: >-
    UAT runs share one machine-wide ceiling, config.yaml uat.maxConcurrent
    (default 10, STARCI_UAT_MAX_CONCURRENT overrides): scripts/uat/uat-slots.mjs
    keeps one lock file per slot under <runtime>/uat-slots and a FIFO queue of
    waiters. The assisted-runner worker holds a slot before any browser or app
    work and records phase queued (waitingForSlot, queuePosition) while it
    waits; `uat-slots.mjs run -- <command>` gives any other UAT browser run the
    same slot. A slot is released on every exit path; one whose holder died or
    predates this boot is reclaimed. Waiting has no timeout of its own.
  citation: "modules/ops/ops/uat.assisted.{prepare,verify}.yaml; skills/run-assisted-uat/SKILL.md; scripts/uat/uat-slots.mjs"

# ============================================================================
# 3 — RE-PLAN TRIGGERS. When the driver stops following the plan and makes a
#    new one. Re-planning is re-measurement, not a rescue mode.
# ============================================================================
# Re-plan LINEAGE — provenance is part of the plan, not a side note.
replanLineage: >-
  Every re-plan carries its provenance INTO the ledger — `api plan` records
  {replannedFrom, blocker, pathDelta, routingReason} on the plan-derived
  event: which plan it supersedes, the typed blocker or trigger that forced
  it, the owned_paths delta vs the prior legs, and why the legs routed as
  they did (modules/kernel/api.yaml plan records the fields verbatim and does
  not refuse an omitted lineage — supplying it is the kernel's obligation, and
  a new plan with no history is a quiet rewrite this loop never files). The same fields ride a re-enqueue that exists because a
  leg was re-planned.
replanTriggers:
  - trigger: s0-measured-wrong
    when: >-
      A survey assumption turns out false mid-flight — an op discovers the
      record it was given contradicts reality, or a `done` surface it must
      extend has drifted (its verified variable is DEP_STALE).
    driverDoes: >-
      Re-run the decomposition from the corrected S₀: SURVEY -> GAP -> CHAIN
      (modules/goal/anatomy.yaml; legality.yaml existingSurfaceRules). The
      delta shrinks or the chain re-routes; evidence derived from the stale
      premise is marked stale and re-proven, never asserted fresh
      (propagateInvalidation; scripts/checks/check-work-deep.mjs DEP_STALE).
    citation: "modules/goal/legality.yaml existingSurfaceRules + backwardEdges; modules/ops/ops/goal.revise.yaml"

  - trigger: goal-identity-wrong
    when: "the discovery is that the goal itself is the wrong goal — wrong workflow, feature or product boundary"
    driverDoes: >-
      ESCALATE — always provision.ask, never self-decide. The spine forbids
      the quiet fix: a goal revision that changes the workflow identity is
      rejected, and an amendment binds baseGoalIdentity
      (modules/goal/legality.yaml; modules/ops/ops/goal.revise.yaml). A wrong
      identity voids every downstream derivation — every op, question,
      decision and report is bound to the goalRev that produced it.
    neverAlone: "the single hardest rule in this module: identity is the owner's"
    citation: "modules/goal/legality.yaml ambiguityRules INTENT rung + backwardEdges identity-wrong"

  - trigger: retry-budget-exhausted
    when: "a route's limit fired its last allowed time for a node group"
    driverDoes: "the route's own `then: needUser` fires — the workflow stops for the user with the failure history attached"
    citation: "modules/models/kinds.yaml routes purpose lines; modules/kernel/api.yaml incident"

  - trigger: goal-completes
    when: "every leg settled, the gates ran and the owner approved the handover"
    driverDoes: "evaluate goal metrics against the goal's done block; `api finish` closes the workflow (phase=finished, inbox closed, 'workflow-finished' event) and refuses handover-not-approved without the owner's approval (handoverLoop); the kernel's job ends — the chat only ever hears the verdict"
    citation: "modules/kernel/api.yaml finish"

# ============================================================================
# 4 — ESCALATION LADDER. What the driver may decide alone vs must ask the
#    owner. Ordered by the cost of being wrong (legality.yaml ambiguityRules).
# ============================================================================
escalation:
  driverAlone:
    - kind: ORDER
      scope: "which ready leg goes first, which runtime takes it, whether two ops share a tick"
      basis: "route: prerequisites + lane order + dispatch-planning disjointness; a wrong order costs reruns only"
      record: "assumptions land on the goal (`assumed:`) so a later revision can see they were guesses"
    - kind: RETRY
      scope: "re-dispatch inside a route's limit, with the failure named back"
      basis: "modules/models/kinds.yaml routes — the route row carries the limit"
    - kind: REPAIR-ROUTE
      scope: "red proof / gap blocker -> the revise/build kind the route table names"
      basis: "the route table is closed — the driver matches, it does not improvise"
    - kind: TECHNICAL-BLOCKER
      scope: >-
        checker/adapter/runtime defects, red reproducible proof, worker
        lifecycle cleanup and other machine-resolvable failures; repair in
        current authority or persist the typed incident for the authorized
        runtime monitor, then resume without asking the owner
      basis: >-
        the report is a claim; Kernel checks settle truth. A model turn ending
        is not workflow completion, and a technical incident keeps the
        workflow running/resumable until the repair lands
  mustAskOwner:
    - kind: INTENT
      why: "S* cannot be formed — a wrong identity voids all downstream evidence"
      via: provision.ask
    - kind: SCOPE-WIDENING
      why: "scope is the owner's contract; AUTHORITY_WIDENING is a declared blocker that becomes an owner decision"
      via: "scope.define proposal -> provision.ask / decision.prepare"
    - kind: IDENTITY-WRONG
      why: "validateGoalRevision structurally rejects it; the only legal move is the owner question"
      via: provision.ask
    - kind: ENVIRONMENT / AUTHORITY blocker
      why: "route limit 1, `then: needUser` — not an operation's to fix, never auto-retried"
      via: needUser
    - kind: BUDGET-EXHAUSTED
      why: "every route past its limit asks the user"
      via: needUser
    - kind: PEER-DISAGREEMENT
      why: "two workflows of the ledger both claim, or both refuse, a scope or a shared contract change after exchanging messages (§ peers); who should do a piece of work is otherwise settled between the peers, never asked"
      via: "provision.ask naming both workflows and the message keys"
  citation: "modules/goal/legality.yaml ambiguityRules; modules/models/kinds.yaml routes; modules/ops/ops/provision.ask.yaml owner-request kinds"

# ============================================================================
# PEERS — workflows of one ledger that build in the same source repositories
#    talk to each other instead of through the owner (modules/kernel/api.yaml
#    peers, notify, inbox; the peer rule is api.yaml peers.rule).
# ============================================================================
peers:
  who: >-
    `api peers --workflow <id>` lists every running peer: its title, current
    leg and the owned_paths of its open jobs, plus the messages pending
    between you. Read it before planning work that may sit in another
    workflow's scope and before touching a path a peer's job owns.
  request: >-
    Work you need that belongs to a peer's scope (its goal, its records, a
    path its open job owns: phone verification in the Login workflow while
    you build Collab) is `api notify --to <peer> --kind request`, never work
    you do yourself and never an owner question about who should do it. Carry
    on with the rest of the frontier; the reply lands in your inbox and wakes
    you.
  headsUp: >-
    When you change a shared contract, API, schema, migration or Work record a
    peer reads, send it `--kind heads-up` (`--to peers` when every peer reads
    it). Repo-wide work no workflow owns (an uncommitted migration, a shared
    config) is taken with a heads-up or given with `--kind handoff` to the
    peer whose scope it is. `api enqueue` already sends the owned_paths
    overlap heads-up; its receipt `peerOverlap` names the jobs.
  ack: >-
    Every received message is acked with `api inbox --ack <key> --disposition
    <what you did>` (built it, queued it as <job>, adjusted the plan, declined
    because ..., answered in <key>); the sender reads that disposition back. A
    request also gets `api notify --kind reply --reply-to <key>`.
  escalate: >-
    Only a disagreement the peers cannot settle between them goes to the
    owner (escalation.mustAskOwner PEER-DISAGREEMENT).
  boundary: >-
    peers, notify and inbox are Kernel verbs; an op never uses them
    (api.yaml conventions.callerBoundary). An op that finds work outside its
    contract says so in its report and the Kernel routes it.

# ============================================================================
# 5 — FAILURE HANDLING. The failure shapes this loop meets in practice, and
#    the detector + respawn rule each one maps to. The durable spine
#    codifies each of them — both are cited.
# ============================================================================
failureHandling:

  agentChildExit:
    symptom: >-
      The spawned agent's process is gone but no verdict arrived — the
      terminal shows a bare shell ('exited', `PS D:\>`), or the screen still
      says WORKING while nothing moves.
    detection-output-staleness: >-
      Terminal liveness is classified from the last screen lines:
      NEED-TRUST / NEED-PERM / CRASH / WORKING / DONE / IDLE? / EXITED /
      UNKNOWN. WORKING with an UNCHANGED context meter
      ('Context: Nk / Mk tokens (P%)') for longer than
      modules/models/runtimes.yaml allocation.stallAfterMs is STALL? —
      output staleness is the child-exit detector: a live agent's context
      never stops moving. The api reads the terminal
      (scripts/agent/lib.mjs health/liveness) — the kernel never runs the
      orca call itself (boundary.hostMechanics).
    detection-durable: >-
      The api reconciles an op believed running whose Dispatch Orca no
      longer lists and whose terminal is gone: 'dead: no worker and no
      terminal' (scripts/agent/lib.mjs terminal state). Before it is called
      dead the Dispatch is asked for its last words; a worker that finished
      but could not reach the report command gets its report recovered and
      judged on the normal path — except 'done', which is never honoured
      from last words because it owes checks the kernel never saw
      (modules/kernel/verdict-contract.yaml rejects done-from-last-words).

  respawnPolicy:
    ownFault: >-
      A dead agent with no infrastructure cause and nothing to say: the op
      attempt is settled and the route's retry re-enqueues it — past the
      route's limit it is blocked and the owner is told
      (the api's reconciliation; kinds.yaml route limits). Re-brief with the
      failure named and relaunch — never
      silently continue a half-dead agent.
    infrastructureFault: >-
      A death the op did not cause does not spend its restarts: the
      launch-time known-failure signatures — MODULE_NOT_FOUND /
      report-command ENOENT, agent_prompt_stalled (task never delivered),
      session_not_reported, a terminal closed under a live worker
      (modules/host/orca/calls.yaml signatures; the adapter card's
      knownFailures). When the durable rejection proves effectState:none, the
      same job returns to queued at the same durable and business attempt; no
      successor or accepted dispatch contract is created. These charge infra restarts, bound
      by the infra restart budget, then blocked + needUser
      (the api classifies the cause). Unknown/partial effect is never classified
      as a free resume and consumes the ordinary business route budget.
    neverRespawn: >-
      Never respawn over an unsettled lease — the durable attempt is settled
      FIRST while the writer fence is still held (the api's settle path); an
      op whose stop cannot be reconciled is quarantined, not requeued.
      Never re-bind a Run a second time — a repeated run-use invalidates
      every live Dispatch.

  permissionStall:
    symptom: >-
      The agent is parked on a human gate: 'trust the authors' (NEED-TRUST),
      a permission menu 'approve once / always allow / bypass mode'
      (NEED-PERM), or an interactive prompt that will never answer itself.
    rule: >-
      A permission stall is not work and not failure — it is an unanswered
      precondition. The api's liveness read raises it as an event for the
      driver/owner (the NEED-TRUST/NEED-PERM classification -> EVENT); the
      lane makes no progress until it is answered.
      Prevention beats handling: spawn lines that pre-answer the gate —
      `devin --permission-mode dangerous`, `qwen --yolo`, trust answered
      once at spawn — which is exactly what the agent card
      (modules/models/agents/<agent>.yaml) injects into spawnAgent
      (scripts/agent/lib.mjs).
    credentialShape: >-
      On the durable spine a credential need never stalls a worker at all:
      the ask becomes a provision request projected to the owner, the op
      waits by presence with no runtime held (see verdictTable.blocked).
      The chat relays the kernel's questions verbatim — it does not answer
      for the kernel (workflow-chat rule; the Orca operating model).

  kernelDeath:
    symptom: "the [Kernel] agent/process itself is gone or silent"
    detection: >-
      start-workflow proves process/terminal availability. The canonical
      watchdog additionally distinguishes an active LLM turn from the same
      connected terminal sitting at its input prompt. Every 5 minutes it reads
      api status/survey plus the attested frame; turn-idle wakes the same Kernel,
      and so does an `active` frame whose terminal printed nothing for
      modules/models/runtimes.yaml allocation.liveness.activeStaleMs (the result
      carries reason stale-active: a frozen spinner row is not a running turn),
      while disconnected/unwritable exact proof re-enters start-workflow for a
      replacement. The Kernel itself never sleeps or polls to preserve liveness
      (scripts/kernel/watchdog.mjs; scripts/kernel/start-workflow.mjs;
      modules/kernel/start-workflow.yaml claim.onDeadKernel).
    respawn: >-
      start-workflow re-opens the `[Kernel] <id>` terminal and
      re-sends the workflow-run command (kernel attempt+1, same workflow
      generation); stale Kernel terminals of the dead kernel are
      closed by handle first (scripts/agent/lib.mjs terminal close).
    singleton: >-
      One kernel per workflow, one supervisor per ledger — kernel-lock and
      supervisor-lock signal rows are the claims (engine/schema.sql
      signals). Two kernels for one workflow is the corruption this exists
      to prevent.
    note: >-
      On Orca the [Kernel] agent plays this role toward its [Op]
      children — it IS the supervisor of its own dispatches. The watchdog is a
      liveness-only supervisor of the Kernel turn: it may wake/restart the same
      durable identity, but may never choose or settle workflow work.

# ============================================================================
# 6 — SUPERVISION CHAIN. Who watches whom.
# ============================================================================
supervision:
  chain: >-
    owner chat (trigger only) -> [Kernel] agent (one per project, long-lived)
    -> [Op] agents (one per op, ephemeral). Above the kernel:
    watchdog (scripts/kernel/watchdog.mjs) — a liveness loop at
    modules/models/runtimes.yaml allocation.watchdogCadenceMs over
    canonical status/survey and the attested Kernel terminal; start-workflow
    (scripts/kernel/start-workflow.mjs) — a one-shot
    claim -> spawn -> attest; re-running it on a dead kernel claims the stale
    binding and spawns the replacement (kernel attempt+1). The chain ends
    there: one kernel orchestrates its whole workflow, and every other agent
    inside it is an ephemeral Op that kernel dispatched.
  auditTrail: >-
    Every transition is an event in the ledger (engine/ledger-db.mjs events
    table, hash-chained — verifyChain; engine/schema.sql); persist-as-you-
    think (boundary.persistAsYouThink) is what makes that trail complete —
    findings and plans land in events/state_snapshots as they form, so a
    dead kernel leaves a re-readable trail, not a lost context.
