# ============================================================================
# modules/kernel/dispatch.yaml — the spawn contract
#
# THE SPAWN CONTRACT — the packet each ephemeral [Op] agent is launched with.
# The packet flows through `api dispatch`: the [Kernel] agent calls
# `node scripts/kernel/api.mjs dispatch --job <id> --spawn` and the api —
# never the kernel itself — reserves the lease, renders the packet and runs
# the Orca terminal sequence (modules/kernel/api.yaml dispatch).
# Every field is defined once, with the kernel mechanism that enforces it
# named beside it. The packet is the whole world the op knows: its brief,
# the records it may read, the paths it may write, the model and budget it
# was allocated, and the lease token that binds everything it does back to
# one durable job identity. The rendered packet is durable too — dispatch
# writes it as the contracts row (workflow_id,op_id,attempt), which the
# worker reads back via `api op-contract`; the terminal text is only the
# delivery, the row is the dispatch authority. The answer travels the same
# channel back: `api report` files the durable reports row.
#
# Sources (all under .claude/, relative to the skill root):
#   scripts/kernel/api.mjs   — the dispatch command: packet build, lease,
#                              admission reserve/expire + drift guard,
#                              reserve-time path:* lease admission rules,
#                              identity-drift checks, terminal spawn
#                              + post-spawn attestation (contract:
#                              modules/kernel/api.yaml)
#   scripts/agent/lib.mjs    — spawnAgent: terminal-create/-read/-send launch
#                              sequence, adapter-card flag injection,
#                              terminal close on settle/failure
#   engine/ledger-db.mjs     — jobs/leases tables; leases_match_job trigger
#                              ('lease-identity-drift' RAISE(ABORT));
#                              DDL source: engine/schema.sql
#   scripts/agent/lib.mjs    — readiness/attestation windows from the agent
#                              card; scripts/kernel/api.mjs holds the lease TTL
#   modules/kernel/verdict-contract.yaml — starci/op-report@1, OUTCOMES,
#                              validateOpReport semantics the api's settle runs
#   modules/models/kinds.yaml — role per kind (role:, roleOfKind), routes
#   modules/models/selection.yaml — model eligibility (route-model)
#   modules/ops/ops/<id>.yaml — the brief the packet names
#   scripts/checks/check-work-deep.mjs      — DEP_STALE
#   scripts/checks/check-work-artifacts.mjs — artifact byte checks
#   modules/models/code-patterns.yaml       — layout/lint ruleIds the
#                              path-legality preflight enforces (e.g.
#                              starci-be/unit-test-colocated)
# ============================================================================

schema: starci/module-kernel-dispatch@1

about:
  kind: dispatch-contract
  businessQuestion: >-
    "When the kernel spawns one ephemeral agent for one operation, what exactly
    is it told, what exactly may it touch, and what proves its answer belongs
    to this dispatch and no other?"
  businessAnswer: >-
    A packet is a bounded grant, not a prompt. It names one op, one brief, a
    closed read set, a closed write set, one model, one budget and one lease
    token. The lease is the spine of it: identity is bound at reservation time
    and enforced at the database trigger level, so an agent physically cannot
    record evidence for another job.
  sources:
    - scripts/kernel/api.mjs
    - scripts/agent/lib.mjs
    - engine/ledger-db.mjs

# ============================================================================
# THE PACKET — the contract shape from the brief, annotated.
# ============================================================================
packet:
  op: <id>                              # the operation id; resolves to the full durable identity
  brief: modules/ops/ops/<id>.yaml      # business context the shell agent reads
  context:
    workflow:                           # approved authority binding, not revision authority
      id: <workflow-id>
      goal_revision: <revision>
      goal_identity: <identity>
    records: [...]                      # .starciwork records it touches (the read set)
    owned_paths: [...]                  # what it may modify — boundary enforcement
  constraints:
    model: <runtime-id>                 # allocated runtime, never chosen by the agent
    budget: <reservation>               # ai/global + ai/provider:<p> + writer + machine units
    lease: <token>                      # the durable lease token — identity binding
  returns:
    verdict: pass|fail|blocked          # see modules/kernel/verdict-contract.yaml
    evidence: [...paths]                # files the verdict stands on
    suspicion: <string?>                # free-text mid-flight wrongness signal

# ============================================================================
# FIELD DEFINITIONS + ENFORCEMENT. One row per field: what it means, where the
# kernel writes it, which mechanism refuses a violation.
# ============================================================================
fields:

  op:
    meaning: >-
      The operation id is shorthand for the FULL durable identity:
      {workflowId, opId, attempt, generation} (the api's durable identity —
      the jobs row in engine/ledger-db.mjs).
      Each attempt owns a distinct durable job row — jobId
      `op-<op>-<token>` is minted at enqueue and a retry is a NEW row at
      attempt+1, never a rewrite of the old one.
    enforcedBy: >-
      The jobs table row (engine/ledger-db.mjs) plus the
      lease-identity-drift guarantee: state, op lease and durable
      job must share the complete identity or the write refuses.

  brief:
    meaning: >-
      The op's authored contract: modules/ops/ops/<id>.yaml is the canonical
      manifest (operator contract + business analysis + route: block); the
      api renders it into the task text the agent receives
      (scripts/kernel/api.mjs buildPacket/buildPrompt; the rendered markdown
      is stored in the contracts table, keyed by workflow/op/attempt — the
      worker reads it back via `api op-contract --job <id>`; the row, not
      the prompt text, is the dispatch authority).
    enforcedBy: >-
      The agent reads the brief; it does not renegotiate it. Reads/writes the
      brief declares become the packet's context. A brief that cannot produce
      every criterion assigned returns blocked with the exact gap
      (modules/ops/ops/task.execute.yaml outcome requirement).

  context.records:
    meaning: >-
      The closed READ set: the .starciwork records (and resolved references)
      this op may consult. In dispatch-planning terms these are the op's
      `reads` — resolved references and binding inputPaths resolved through
      the loaded Work tree by the api before launch. They are supplied by
      `api enqueue --records`; an empty list is no authority to scan for a
      convenient substitute. A consumer of a scope.define proposal must name
      that exact predecessor scope record here.
    enforcedBy: >-
      Read sets matter at the file level: an op must never READ a path another
      in-flight op is rewriting — the api's conflict check compares my reads
      against their writes both directions. The one deliberate exception:
      two provision.ask ops may share a feature's decision folder — each
      writes a new slug of its own (the provision.ask exception).

  context.workflow:
    meaning: >-
      The immutable workflow id plus latest approved goal revision and stable
      goal identity the job was dispatched against. This lets a consumer prove
      that an explicitly bound proposal belongs to the same approved chain;
      it grants no goal-revision authority.
    enforcedBy: >-
      scripts/kernel/api.mjs freezes the latest approved goal revision and
      identity into jobs.payload_json at enqueue, then combines that binding
      with the job's workflow_id while building the durable contract packet.
      A later goal revision never silently retargets an already queued job.
      The op may compare bindings and report a mismatch, but never revise or
      substitute them.

  context.owned_paths:
    meaning: >-
      The closed WRITE set — the op's allowlist. Disjointness of sibling
      allowlists is what makes fan-out legal at all
      (modules/goal/legality.yaml splitRules; modules/schemas/goal-plan.yaml
      makes disjoint path-prefix allowlists a schema constraint on
      independent ops).
    enforcedBy: >-
      Four independent walls, so a slip is caught before enqueue, at plan
      time, at report time and at effect time:
      (0) PREFLIGHT — owned_paths must satisfy the target repo's layout/lint
          contracts; contradictions -> incident, never dispatch (the
          `preflight` section below);
      (1) PLAN — the api's dispatch planning refuses launch when my writes
          meet another in-flight write or read scope;
      (2) REPORT — the api's validateOpReport rejects report.files outside the
          allowlist ('file <f> is outside owned_paths';
          modules/kernel/verdict-contract.yaml);
      (3) EFFECT — the candidate seal covers only what the declared
          scope covers; outside-allowlist / canonical-drift / baseline-touched
          reasons keep the writer fence (the api's settle-time seal reasons).
      And over time: a done record whose deps moved since baseline refuses
      DEP_STALE — writing a path re-arms the re-verification debt of every
      record that owns it (scripts/checks/check-work-deep.mjs DEP_STALE;
      modules/goal/legality.yaml done-record-reverify).

  constraints.model:
    meaning: >-
      The allocated runtime/model for this dispatch — the persisted output
      of `api route --job <id>` (run BEFORE dispatch; it writes
      {model, modelId, effort, routeChain} onto the job payload and a
      'route-decided' event), never an agent choice and never an ad hoc
      kernel pick. Selection rules live in modules/models/selection.yaml
      (eligibility by risk/qualityFloor, probation gates, highKinds that may
      never run on probation) over the pool cards in
      modules/models/runtimes.yaml: eligibility first, budget orders the
      eligible, cooling/capacity park. Dispatch launches what route wrote.
    enforcedBy: >-
      Eligibility is evaluated against the kind's ROLE
      (modules/models/kinds.yaml role: resolved through
      modules/models/runtimes.yaml roleOfKind;
      scripts/agent/models.mjs selectPool); a verify op additionally avoids the
      implementing runtime
      (modules/models/runtimes.yaml verifyAvoidsImplementRuntime). A
      model NAME is an
      availability fact, never proof of capability
      (modules/models/selection.yaml, modules/models/capabilities.yaml rule).

  constraints.budget:
    meaning: >-
      The resource reservation the dispatch holds: the path:* write fences
      (one capacity-1 lease per owned_path, the api's reserveOpLeases),
      ai/global (the machine-wide
      ceiling of admitted AI jobs), ai/provider:<provider> (per-provider
      family ceiling — the widest real runtime of the family, not the sum),
      and declared machine locks
      (machine:* from the op's checks) — assembled by the api's reserve.
    enforcedBy: >-
      The api's admission takes all of them atomically with a TTL
      (DISPATCH_LEASE_TTL_MS=30min default, --lease-ttl overrides;
      scripts/kernel/api.mjs); expiry is lazy — expired leases are deleted on
      admission and by machine.sweep — and an unproved timed-out
      worker moves to effect_unknown and DELIBERATELY retains its lease:
      uncertainty never becomes free capacity. Leases mirror machine-DB
      reservations through machine_ref (engine/machine.sql); releasing
      drops both.

  constraints.lease:
    meaning: >-
      The lease token is the packet's spine. The api's reserveOpLeases seeds
      the path:* resources and reserveTwoPhase takes the lease atomically
      (intent-v1 exact-binding, engine/schema.sql §6); the token is what
      every later
      fact must match. The agent's writes, its report and its settlement all
      hang off {jobId, leaseToken} — the op physically cannot record evidence
      for another job, because no lease row can exist unless it matches the
      job's complete identity.
    enforcedBy: >-
      The leases_match_job BEFORE INSERT/UPDATE triggers RAISE(ABORT,
      'lease-identity-drift') when a lease row does not match its job's
      {workflow_id, op_id, attempt, generation, lease_token}
      (engine/ledger-db.mjs / engine/schema.sql); the api wraps that as a
      typed {ok:false, code:'lease-identity-drift'}. A reservation whose
      durable status or resource
      binding no longer matches exactly is status 'effect_unknown' — it stops the
      launch, it is never guessed past (a lease field proven stale from the
      ledger's own rows is cleared, never assumed).

  returns:
    meaning: "what the [Op] owes the kernel when it dies — the verdict contract"
    enforcedBy: "modules/kernel/verdict-contract.yaml — accepted/rejected shapes, evidence byte checks, suspicion mapping"
    timing: >-
      Row first, file second, signal third: the op files its answer through
      `api report --job <id> --report <file>` — the file is a
      starci/op-report@1 JSON envelope and the reports row
      (UNIQUE(workflow_id, dispatch_id)) is the durable verdict, the file is
      the bound artifact, the Orca message only the wake-up
      (verdict-contract.yaml envelope). The kernel then consumes the row
      (`api consume-report`),
      re-runs the checks (`api check`) and settles. The op's terminal dies
      when its verdict settles — `api settle` closes the worker terminal
      (scripts/agent/lib.mjs); machine.sweep reaps expired and orphaned
      machine-side reservations (engine/ledger-db.mjs sweep; engine/machine.sql).

# ============================================================================
# PATH-LEGALITY PREFLIGHT — owned_paths are checked against the target repo's
#    own layout/lint contracts BEFORE enqueue, not discovered at settle.
# ============================================================================
preflight:
  rule: >-
    owned_paths must satisfy the target repo's layout/lint contracts;
    contradictions -> api incident, never dispatch.
  detail: >-
    Before `api enqueue`, the kernel checks each candidate owned_paths grant
    against the target repo's declared layout and lint rules — the
    applicability/ruleIds tables in modules/models/code-patterns.yaml and
    the check surface under scripts/checks/ that enforces them
    (code-patterns/*, check-scoped-lint). A grant that contradicts a layout
    rule — e.g. `src/tests/**` claimed while the repo profile enforces
    starci-be/unit-test-colocated — is `api incident --kind
    path-illegality`, never a job row that dispatches and settles red.
    Disjointness between sibling ops is a different wall (fields
    .owned_paths above); this one is grant-vs-repo-legality. Where the
    context pack or a machine check exposes the repo's layout contract,
    cite it; the obligation stands regardless — the defect this prevents is
    a conflict only caught at settle.
  citation: "modules/models/code-patterns.yaml applicability/ruleIds; scripts/checks/code-patterns/*; modules/kernel/api.yaml dispatch layoutPreflight — the api does not refuse an illegal path, the kernel does not enqueue one"

# ============================================================================
# SPAWN MECHANICS — how a packet becomes a running agent on Orca.
# ============================================================================
spawnMechanics:
  caller: >-
    The kernel agent invokes `node scripts/kernel/api.mjs dispatch --job
    <job_id> --spawn` and reads the JSON receipt — it never runs an orca
    terminal-* command itself (modules/kernel/api.yaml conventions.neverDoes).
    The only look at a running op's screen is `api observe --job <id>` —
    read-observe via the api only, context never proof; the mutation
    surfaces are unchanged (send stays `api nudge`, close stays `api settle`).
    Without --spawn the same call is a dry-run: the packet prints, nothing is
    reserved and nothing launches.
  sequence: >-
    Inside the api call: reserve (durable lease, intent-v1) -> create or reuse
    the workflow Orca Run whose coordinator is the dedicated Kernel terminal
    -> create one operation Task -> launch exactly one agent. Managed agents
    use worker-start, which owns Task injection; the api reads dispatch-show
    and worker-show for terminal/model attestation and never dispatches the
    Task a second time. Command-terminal agents use terminal-create + readiness
    -> orchestration dispatch --return-preamble to that exact handle ->
    terminal-send of the returned preamble -> submission/death attestation.
    Either path persists starci/agent-hierarchy@1 plus Run/Task/Dispatch and
    terminal metadata before job -> running. Failure = dispatch-rejected, job
    not running, terminal closed/released as applicable, slot released.
    Command flags and readiness patterns come from the agent card
    modules/models/agents/<agent>.yaml.
    The kernel's own launch shows the same primitive sequence
    (scripts/kernel/start-workflow.mjs: terminal-create -> terminal-read ->
    terminal-send -> bind the startup terminal).
  naming: >-
    `[Kernel] <project>` for the coordinator terminal, `[Op] <op-or-task>`
    for workers — Orca titles are the fleet's address book; a terminal
    nobody reads is closed (scripts/agent/lib.mjs terminal close).
  launchWindow: >-
    A launch that never acquires is bounded, not awaited forever — the agent
    card's readiness.timeoutMs caps the readiness/attestation read
    (modules/models/agents/<agent>.yaml; scripts/agent/lib.mjs), and the
    lease TTL bounds a crashed worker's fence until the sweep proves it dead
    (scripts/kernel/api.mjs DISPATCH_LEASE_TTL_MS; engine/ledger-db.mjs
    machine.sweep).
  oneOpOneAgent: >-
    One operation = one agent = one Dispatch = one terminal. An operation is
    never split among several agents, and a failed agent is never silently
    continued — the attempt is settled and a NEW dispatch carries a fresh
    attempt number (driver-loop.yaml failureHandling.respawnPolicy).
  hierarchy: >-
    `node scripts/kernel/api.mjs hierarchy --workflow <id> --json` is the
    canonical workflow -> Kernel -> Op projection. Orca tab/pane layout is a
    rendering surface, not the relationship source.
  spawnLines: >-
    The agent card injects the permission-gate answer into the
    spawn line — `qwen -i "<prompt>" --yolo`, or Devin
    `--permission-mode dangerous`. Both Kernel and Op seats are unattended;
    their distinct authority comes from the Kernel packet versus the exact
    operation contract + owned-path lease, not from a per-command UI menu.
    Verify the spawn actually landed with
    terminal-read --screen — a long typed command can leave Enter
    un-landed, which is exactly the launch-window case above.

# ============================================================================
# NON-GOALS — what a packet never carries.
# ============================================================================
nonGoals:
  - "no goal-identity authority — the op cannot revise the goal; suspicion travels back as a report field (verdict-contract.yaml)"
  - "no other op's write scope — dispatch planning proved disjointness before this packet existed; an op that needs a foreign path reports blocker shared-change"
  - "no credential values — custody asks go through provision.ask and the owner's Orca GUI; an agent never sees a secret (modules/ops/ops/provision.ask.yaml)"
  - "no model/agent override — the agent runs what constraints.model names; host calls come only from the loaded Orca contracts, never inferred (CONTEXT.md provider rule)"
  - "no second dispatch of the same op — one lease, one agent, one verdict (oneOpOneAgent above)"
