# ============================================================================
# TINKLE-9 / WAVE2-w1 — modules/kernel/dispatch.yaml
# Brief: ex-testing/briefs/tinkle/tinkle-9.md + ex-testing/briefs/wave2/w1.md.
#
# THE SPAWN CONTRACT — the packet each ephemeral [Op] agent is launched with.
# The packet now flows through `api dispatch`: the [Kernel] agent calls
# `node scripts/kernel/api.mjs dispatch --job <id> --spawn` and the api —
# never the kernel itself — reserves the lease, renders the packet and runs
# the Orca terminal sequence (modules/kernel/api.yaml dispatch).
# Every field is defined once, with the kernel mechanism that enforces it
# named beside it. The packet is the whole world the op knows: its brief,
# the records it may read, the paths it may write, the model and budget it
# was allocated, and the lease token that binds everything it does back to
# one durable job identity.
#
# Sources (all under .claude/, relative to the skill root):
#   scripts/kernel/api.mjs   — the dispatch command: packet build, lease,
#                              terminal spawn (contract: modules/kernel/api.yaml)
#   kernel/engine.mjs        — opIdentity, reserveOperation (intent-v1),
#                              reservationPhase, beginLaunchIntent, launched,
#                              settled, settleStoppedOperation, beginCandidate,
#                              freezeCandidate
#   kernel/ledger-db.mjs     — jobs/leases tables; leases_match_job trigger
#                              ('lease-identity-drift' RAISE(ABORT))
#   kernel/admission.mjs     — reserve/renew/expire; isLeaseDrift guard
#   kernel/dispatcher.mjs    — planDispatch file/lease/group rules, opScopes,
#                              writerKeys, verifyAvoids
#   kernel/continuation.mjs  — lease-identity-drift / dispatch-identity-drift /
#                              writer-identity-drift resume checks
#   kernel/reports.mjs       — starci/op-report@1, OUTCOMES, validateReport
#   kernel/verify.mjs        — changedFiles (git-computed), validateAccepted
#   kernel/supervisor.mjs    — terminal-create/-read/-send launch sequence,
#                              LAUNCH_WINDOW_MS via launch.mjs
#   kernel/launch.mjs        — startup phases, launch window
#   model/kinds.yaml         — role per kind (kindRole), routes
#   modules/models/selection.yaml — model eligibility (route-model)
#   modules/ops/ops/<id>.yaml — the brief the packet names
#   scripts/checks/check-work-deep.mjs      — DEP_STALE
#   scripts/checks/check-work-artifacts.mjs — artifact byte checks
#   ex-testing/FLEET-STARCI.md, watchdog*.sh — observed spawn practice
# ============================================================================

schema: starci/module-kernel-dispatch@1

about:
  kind: dispatch-contract
  businessQuestion: >-
    "When the kernel spawns one ephemeral agent for one operation, what exactly
    is it told, what exactly may it touch, and what proves its answer belongs
    to this dispatch and no other?"
  businessAnswer: >-
    A packet is a bounded grant, not a prompt. It names one op, one brief, a
    closed read set, a closed write set, one model, one budget and one lease
    token. The lease is the spine of it: identity is bound at reservation time
    and enforced at the database trigger level, so an agent physically cannot
    record evidence for another job.
  sources:
    - scripts/kernel/api.mjs
    - kernel/engine.mjs
    - kernel/ledger-db.mjs
    - kernel/dispatcher.mjs

# ============================================================================
# THE PACKET — the contract shape from the brief, annotated.
# ============================================================================
packet:
  op: <id>                              # the operation id; resolves to the full durable identity
  brief: modules/ops/ops/<id>.yaml      # business context the shell agent reads
  context:
    records: [...]                      # .starciwork records it touches (the read set)
    owned_paths: [...]                  # what it may modify — boundary enforcement
  constraints:
    model: <runtime-id>                 # allocated runtime, never chosen by the agent
    budget: <reservation>               # ai/global + ai/provider:<p> + writer + machine units
    lease: <token>                      # the durable lease token — identity binding
  returns:
    verdict: pass|fail|blocked          # see modules/kernel/verdict-contract.yaml
    evidence: [...paths]                # files the verdict stands on
    suspicion: <string?>                # free-text mid-flight wrongness signal

# ============================================================================
# FIELD DEFINITIONS + ENFORCEMENT. One row per field: what it means, where the
# kernel writes it, which mechanism refuses a violation.
# ============================================================================
fields:

  op:
    meaning: >-
      The operation id is shorthand for the FULL durable identity:
      {workflowId, opId, attempt, generation} (kernel/engine.mjs opIdentity).
      Each dispatch attempt owns a distinct durable job row — jobId
      `operation-<digest>` re-keyed on dispatchAttempt when a predecessor was
      cancelled before ever launching (reserveOperation re-key loop +
      'operation-job-rekeyed' event).
    enforcedBy: >-
      The jobs table row (kernel/ledger-db.mjs) plus the resume-time drift
      checks in kernel/continuation.mjs: dispatch-identity-drift,
      task-identity-drift, lease-identity-drift — state, op lease and durable
      job must share the complete identity or the resume refuses.

  brief:
    meaning: >-
      The op's authored contract: modules/ops/ops/<id>.yaml is the canonical
      manifest (operator.yaml port + business analysis + route: block); the
      runtime renders it into the task text the agent receives
      (kernel/kernel.mjs renderContract; the rendered markdown is stored in
      the contracts table, keyed by workflow/op/attempt).
    enforcedBy: >-
      The agent reads the brief; it does not renegotiate it. Reads/writes the
      brief declares become the packet's context. A brief that cannot produce
      every criterion assigned returns blocked with the exact gap
      (ops/task.execute/operator.yaml outcome requirement).

  context.records:
    meaning: >-
      The closed READ set: the .starciwork records (and resolved references)
      this op may consult. In planDispatch terms these are the op's `reads` —
      resolvedReferences and binding inputPaths resolved through the loaded
      Work tree (kernel/dispatcher.mjs opScopes, refToPath, nodePathOf).
    enforcedBy: >-
      Read sets matter at the file level: an op must never READ a path another
      in-flight op is rewriting — firstConflict checks my reads against their
      writes both directions (dispatcher.mjs). The one deliberate exception:
      two provision.ask ops may share a feature's decision folder — each
      writes a new slug of its own (firstConflict isAsk exception).

  context.owned_paths:
    meaning: >-
      The closed WRITE set — the op's allowlist. Disjointness of sibling
      allowlists is what makes fan-out legal at all
      (modules/goal/legality.yaml splitRules; goal-plan.json makes disjoint
      path-prefix allowlists a schema constraint on independent ops).
    enforcedBy: >-
      Three independent walls, so a slip is caught at plan time, at report
      time and at effect time:
      (1) PLAN — planDispatch refuses launch when my writes meet another
          in-flight write or read scope (firstConflict);
      (2) REPORT — validateReport rejects report.files outside the allowlist
          (kernel/reports.mjs, 'File outside the allowlist');
      (3) EFFECT — freezeDetectionCandidate seals only what the declared
          scope covers; outside-allowlist / canonical-drift / baseline-touched
          reasons keep the writer fence (kernel/engine.mjs freezeCandidate;
          settleStoppedOperation seal reasons).
      And over time: a done record whose deps moved since baseline refuses
      DEP_STALE — writing a path re-arms the re-verification debt of every
      record that owns it (scripts/checks/check-work-deep.mjs DEP_STALE;
      legality.yaml done-record-reverify).

  constraints.model:
    meaning: >-
      The allocated runtime/model for this dispatch — an output of
      route-model, never an agent choice. Selection rules live in
      modules/models/selection.yaml (eligibility by risk/qualityFloor,
      probation gates, highKinds that may never run on probation);
      the durable executor is eligibleModelSelection (kernel/engine.mjs):
      eligibility first, budget orders the eligible, cooling/capacity park.
    enforcedBy: >-
      Eligibility is evaluated against the ROLE's pinned model
      (kernel/engine.mjs reserveOperation admittedModel; kindRole in
      common.mjs); a verify op additionally avoids the implementing runtime
      (dispatcher.mjs verifyAvoids). A model NAME is an availability fact,
      never proof of capability (selection.yaml, capabilities.json rule).

  constraints.budget:
    meaning: >-
      The resource reservation the dispatch holds: ai/global (the machine-wide
      ceiling of admitted AI jobs), ai/provider:<provider> (per-provider
      family ceiling — the widest real runtime of the family, not the sum),
      the canonical writer fence(s) (canonical-writer:* per repo root or
      runtime-projection:* per managed file), and declared machine locks
      (machine:* from the op's checks) — assembled in reserveOperation.
    enforcedBy: >-
      admission.reserve takes all of them atomically with a TTL
      (kernel/admission.mjs; engine.mjs ttlMs 10*60*1000); pulse() renews the
      leases of live ops and expires the dead ones (engine.mjs pulse;
      admission.expire moves an unproved timed-out worker to effect_unknown
      and DELIBERATELY retains its lease — uncertainty never becomes free
      capacity). Leases mirror machine-DB reservations through machine_ref;
      releasing drops both (engine.mjs machineRefs/releaseRefs).

  constraints.lease:
    meaning: >-
      The lease token is the packet's spine. reserveOperation writes the job
      row (reservationProtocol 'intent-v1', expectedResources = the exact
      sorted resource set) and takes the lease; the token is what every later
      fact must match. The agent's writes, its report and its settlement all
      hang off {jobId, leaseToken} — the op physically cannot record evidence
      for another job, because no lease row can exist unless it matches the
      job's complete identity.
    enforcedBy: >-
      The leases_match_job BEFORE INSERT/UPDATE triggers RAISE(ABORT,
      'lease-identity-drift') when a lease row does not match its job's
      {workflow_id, op_id, attempt, generation, lease_token}
      (kernel/ledger-db.mjs ~273-284); admission wraps that as a typed
      {ok:false, reason:'lease-identity-drift'} (kernel/admission.mjs
      isLeaseDrift/driftGuard). At resume, continuation.mjs issues the same
      checks as findings (lease-identity-drift, writer-identity-drift). A
      reservation whose durable status or resource binding no longer matches
      exactly is phase 'unknown' — it stops the launch, it is never guessed
      past (engine.mjs reservationPhase; staleLeaseProof proves a lease field
      stale from the journal's own rows before it is cleared).

  returns:
    meaning: "what the [Op] owes the kernel when it dies — the verdict contract"
    enforcedBy: "modules/kernel/verdict-contract.yaml — accepted/rejected shapes, evidence byte checks, suspicion mapping"
    timing: >-
      File first, signal second: the report file is the source of truth, the
      Orca message only the wake-up (kernel/reports.mjs head). The op's
      terminal dies when its verdict settles (w1 operating model); the
      kernel's sweep closes tabs nobody reads (kernel/terminals.mjs
      sweepStaleTerminals, SWEEP_MS=5min, keepsAskTab for owner-open asks).

# ============================================================================
# SPAWN MECHANICS — how a packet becomes a running agent on Orca.
# ============================================================================
spawnMechanics:
  caller: >-
    The kernel agent invokes `node scripts/kernel/api.mjs dispatch --job
    <job_id> --spawn` and reads the JSON receipt — it never runs an orca
    terminal-* command itself (modules/kernel/api.yaml conventions.neverDoes).
    Without --spawn the same call is a dry-run: the packet prints, nothing is
    reserved and nothing launches.
  sequence: >-
    Inside the api call: reserve (durable lease, intent-v1) ->
    beginLaunchIntent (operation-launch-intent event) -> Orca
    terminal-create titled `[Op] <op-or-task>` + terminal-read readiness +
    terminal-send of the rendered packet -> operation-launch-observed/
    launched (job -> running, worker_id = dispatch) -> wait for verdict.
    Command flags and readiness patterns come from the provider adapter card
    providers/orca/adapters/<provider>.yaml; a managed-agent profile refuses
    --spawn (providers/orca/index.yaml managedFallback — worker-start path).
    The supervisor's own kernel launch shows the same primitive sequence
    (kernel/supervisor.mjs startKernel: terminal-create -> terminal-read ->
    terminal-send -> bindStartupTerminal).
  naming: >-
    `[Kernel] <project>` for the coordinator terminal, `[Op] <op-or-task>`
    for workers — Orca titles are the fleet's address book; a terminal
    nobody reads is closed (kernel/terminals.mjs sweepStaleTerminals;
    ex-testing/FLEET-STARCI.md naming rule).
  launchWindow: >-
    A launch that never acquires is reclaimed after LAUNCH_WINDOW_MS=10min —
    the reservation's phases (launching / launching-child / launching-native)
    bound how long an unacquired launch may stand before the next round calls
    it dead (kernel/launch.mjs startupRowHolds; supervisor.mjs reserveAndStart).
  oneOpOneAgent: >-
    One operation = one agent = one Dispatch = one terminal. An operation is
    never split among several agents, and a failed agent is never silently
    continued — the attempt is settled and a NEW dispatch carries a fresh
    attempt number (driver-loop.yaml failureHandling.respawnPolicy).
  prototypePractice: >-
    Observed spawn lines (fleet prototype, FLEET-STARCI.md ops notes):
    `devin --permission-mode dangerous -- "<prompt>"` with the trust prompt
    answered once at spawn; `qwen -i "<prompt>" --yolo`. Verify the spawn
    actually landed with terminal-read --screen — a long typed command can
    leave Enter un-landed, which is exactly the launch-window case above.

# ============================================================================
# NON-GOALS — what a packet never carries.
# ============================================================================
nonGoals:
  - "no goal-identity authority — the op cannot revise the goal; suspicion travels back as a report field (verdict-contract.yaml)"
  - "no other op's write scope — planDispatch proved disjointness before this packet existed; an op that needs a foreign path reports blocker shared-change"
  - "no credential values — custody asks go through provision.ask and the owner's Orca GUI; an agent never sees a secret (ops/provision.ask/operator.yaml)"
  - "no model/provider override — the agent runs what constraints.model names; provider calls come only from the loaded provider contracts, never inferred (SKILL.md provider rule)"
  - "no second dispatch of the same op — one lease, one agent, one verdict (oneOpOneAgent above)"
