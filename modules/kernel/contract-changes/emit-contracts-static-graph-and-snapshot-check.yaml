id: emit-contracts-static-graph-and-snapshot-check
effectiveAt: '2026-09-30T00:00:00+07:00'
summary: >-
  `hfs emit-contracts` decides what an api app serves from its source: the module graph is walked from AppModule through
  every import (imports of imports, register/forRoot/forRootAsync dynamic modules, forwardRef, spreads, both branches of a
  conditional) and the GraphQLModule `include` list is honored; only the resolver classes it yields are loaded, compiled the
  way tsc compiles them, and printed by Nest's GraphQLSchemaFactory. It needs no environment and never boots the app.
  The full `hfs check` (never --fast, which says so in its coverage) emits every api app to a temp directory and compares
  its hash with the committed `contracts/<app>/schema.graphql`; a mismatch is HFS_CONTRACT_SNAPSHOT_DRIFT naming both
  shas and `npm run contract:emit`, and an emit that cannot run is the same code with the emit error. Text of the code
  updated; no new code, verb or YAML key.
reach: new-legs
paths:
  - modules/kernel/contract-changes/emit-contracts-static-graph-and-snapshot-check.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/lib/hfs-rules/contract.mjs
  - packages/hfs/bin/hfs.mjs
  - packages/hfs/emit/contracts.mjs
  - packages/hfs/emit/static-graph.mjs
  - packages/hfs/emit/schema-worker.mjs
  - tests/hfs-emit-contracts.spec.mjs
  - tests/_hfs-cli-fixture.mjs
