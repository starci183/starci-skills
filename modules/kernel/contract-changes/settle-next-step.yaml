id: settle-next-step
effectiveAt: '2026-09-27T04:39:00+07:00'
summary: "Op graph P0 (settle-next): a failed settle always leaves its next step in the ledger. api settle --verdict fail and reconcile --dead-worker --settle-failed run the modules/models/kinds.yaml route themselves (scripts/kernel/api.mjs enqueueNextStep): a retry, a repair of the lane's build with the reporter again behind it, or a read-only root verify when the report names a rootCause node; the route limit is enforced per retry lineage and past it an owner gate holds the failed job alone (result_json.nextStep, event failure-routed). A worker that files no report retries at most twice on another pool (route no-report-retries-on-another-pool, inc-70834a1b8f73). api status returns nextActions [{kind:retry|root-verify|dispatch|impact-check|owner-gate|wait, op, jobId?, reason}] and legs [{op, color:green|yellow|red|gray, jobId, status}], frontier next-ready when nothing is open and nextActions names a move, and queued jobs wait on plan ancestors (scripts/route/plan-edges.mjs planAncestorsOf) instead of every earlier leg; api plan keeps derivedPlan.edges (the plan file's edges, else the recorded ones while the op set is unchanged) and goal-plan.yaml describes them. A Kernel enqueue of a step the runtime already queued retires the runtime's row instead of doubling it, so a Kernel on the previous contract that still enqueues its own retry stays correct. Adds no op check or finding code"
paths:
  - scripts/kernel/api.mjs
  - modules/models/kinds.yaml
  - modules/kernel/api.yaml
  - modules/kernel/driver-loop.yaml
  - modules/kernel/kernel-prompt.md
  - modules/schemas/goal-plan.yaml
  - tests/settle-next-step.spec.mjs
  - tests/cut-set-integration.spec.mjs
  - tests/ask-kinds.spec.mjs
