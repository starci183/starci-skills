id: a3-work-unit-gate
effectiveAt: '2026-09-28T23:30:00+07:00'
summary: >-
  H3/H4/H5 (alpha.3): every op job is a try of one work unit (work_units). api enqueue, graph-edit and the failure
  routes admit each try on the unit's gate: a unit has a try budget (default 5, raised only by the owner or the
  Supervisor through the new api unit verb), retry_of links only the unit's latest FAILED try, a passed unit runs
  again only with enqueue --reopen <reason>, a new unit over a failed unit's paths is refused, and a unit a graph
  edit carves out of others (--derived-from) inherits what is left of their budget. Owner answers bind to the unit.
  reconcile --retry-lineage and businessAttempt are gone.
reach: new-legs
paths:
  - modules/kernel/api-commands/enqueue.yaml
  - modules/kernel/api-commands/reconcile.yaml
  - modules/kernel/api-commands/unit.yaml
  - modules/kernel/verdict-contract.yaml
  - modules/kernel/contract-changes/a3-work-unit-gate.yaml
