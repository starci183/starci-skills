id: hfs-bounded-contexts
effectiveAt: '2026-10-02T09:00:00+07:00'
summary: >-
  Owner decision 2026-10-02 (bounded contexts, alpha.4). A connection of hfs.json is a bounded context: every
  `sides.be.connections` entry gains a required `owner` (the api or worker app that composes it) and `isolation`
  (`database` or `schema`; a schema context reads `<PREFIX>_SCHEMA`, and the split to its own database is an env
  change). New rules, all errors: R159 BE_CONTEXT_OWNER (an app composes only the connections and capabilities of the
  contexts it owns, the cli composes all), R160 BE_CONTEXT_COUPLING (no cross-context entity relation, migration
  foreign key or import), R161 BE_CONTEXT_TRANSACTION (one transaction touches one context's connection), R162
  BE_CONTRACT_BREAKING (events.json against its pinned events.pin.json evolves only additively, a breaking change is
  `<event>.v2`) and R163 BE_CONTEXT_PLATFORM_TABLES (a perConnection platform capability, the event-bus outbox and the
  job table, has its tables on every connection that uses it). R86 BE_SQL_TABLE_OWNER now reads only the tables of its
  own context (a cross-context JOIN is refused), R84 BE_CONNECTION_DUPLICATE allows two schema contexts in one
  database with different schemas, and R35 BE_SCHEMA_OWNER lets a perConnection platform capability register on several
  connections. The be.persistence slot covers `src/modules/projections/<capability>/persistence/`, the manifest slot field
  `perConnection` lists the platform capabilities that exist per connection, the context tiers are domain and projections,
  and the opt-in slot be.contract.events.pin is new. BE-PERSISTENCE-2, -3, -5, -8 and -9 change and BE-PERSISTENCE-11 to -15 are new;
  BE-CONVENTION 1.4.1, 1.4.3, 1.4.6 change and 1.4.7 is new. Rule ids are provisional and renumber at rebase.
reach: new-legs
