id: api-archive
effectiveAt: '2026-09-27T07:00:00+07:00'
summary: "api archive --workflow <id> --reason <text> [--by owner|supervisor] stops a workflow that will not finish: its open asks are retired (retire-ask, reason workflow-archived), then one transaction sets workflows.archived_at, closes its inbox, cancels every unsettled operation job as dropped (reason workflow-archived) with its leases, releases the Kernel signal and settles the Kernel job cancelled, and appends workflow-archived {archived {at, reason, by}, ...}; each dropped worker is then released, every open Task in the Run closed and the Kernel terminal closed last. A second archive writes nothing. api status carries archivedAt; the Kernel watchdog ends with action archived instead of replacing the Kernel; start-workflow refuses an archived goal; poll lists no archived workflow. finish and retire-ask share its helpers, behaviour unchanged. Adds no check or finding code"
reach: new-legs
paths:
  - scripts/kernel/api.mjs
  - scripts/kernel/watchdog.mjs
  - scripts/kernel/start-workflow.mjs
  - scripts/supervisor/poll.mjs
  - modules/kernel/api.yaml
  - modules/kernel/driver-loop.yaml
  - modules/kernel/start-workflow.yaml
