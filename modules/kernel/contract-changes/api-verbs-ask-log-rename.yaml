id: api-verbs-ask-log-rename
effectiveAt: '2026-09-28T00:00:00+07:00'
summary: >-
  File split only, no contract change: the verbs `api serve-ask`, `api retire-ask`,
  `api kernel-ack-rev`, `api rename` and `api log` moved out of scripts/kernel/api.mjs into
  scripts/kernel/api-verbs/<verb>.mjs (the file-based verb registry, scripts/kernel/api-extensions.mjs),
  and their contracts moved out of modules/kernel/api.yaml commands into
  modules/kernel/api-commands/<verb>.yaml. The helpers they share with the verbs still in api.mjs moved
  to scripts/kernel/api-lib/ (rows.mjs ledger reads, kernel-seat.mjs, caller.mjs op-caller guard,
  asks.mjs retireAsk) and api.mjs imports them back under the same names. Behaviour is identical:
  same args, reads, returns and refusals; extension verbs whose help line stays in api.mjs usage() set
  usageInCore so `api --help` is unchanged.
reach: new-legs
paths:
  - scripts/kernel/api.mjs
  - scripts/kernel/api-lib/rows.mjs
  - scripts/kernel/api-lib/kernel-seat.mjs
  - scripts/kernel/api-lib/caller.mjs
  - scripts/kernel/api-lib/asks.mjs
  - scripts/kernel/api-verbs/serve-ask.mjs
  - scripts/kernel/api-verbs/retire-ask.mjs
  - scripts/kernel/api-verbs/kernel-ack-rev.mjs
  - scripts/kernel/api-verbs/rename.mjs
  - scripts/kernel/api-verbs/log.mjs
  - modules/kernel/api.yaml
  - modules/kernel/api-commands/serve-ask.yaml
  - modules/kernel/api-commands/retire-ask.yaml
  - modules/kernel/api-commands/kernel-ack-rev.yaml
  - modules/kernel/api-commands/rename.yaml
  - modules/kernel/api-commands/log.yaml
  - modules/kernel/contract-changes/api-verbs-ask-log-rename.yaml
