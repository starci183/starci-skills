id: runtime-db-location
effectiveAt: '2026-09-28T21:30:00+07:00'
summary: "Decision Q1: a project's runtime.sqlite lives outside .starciwork at %LOCALAPPDATA%/StarCi/projects/<ledger_id>/runtime.sqlite. engine/ledger-db.mjs ledgerFileFor(<backend Work root>) resolves it (until the machine registry resolves ledgers by repo_root, the ledger_id is a name-based UUID of the normalized root; meta.repo_root records it). Only the ledger module engine/ledger-db.mjs and the machine-db module of lane a3-2 open SQLite: scripts/checks/check-db-openers.mjs is a land gate tree check (RESEARCH-STORAGE §3). The typed-log writer writes through the ledger writer and no longer checkpoints (one checkpointer per ledger). Adds the check-db-openers tree check; no finding code"
reach: new-legs
paths:
  - modules/schemas/workspace-routing.yaml
  - engine/ledger-db.mjs
  - scripts/checks/check-db-openers.mjs
  - scripts/supervisor/land.mjs
  - scripts/kernel/log-writer.mjs
  - scripts/kernel/host-event.mjs
  - scripts/reconciler/ledger-health.mjs
  - scripts/checks/ledger-throughput.mjs
