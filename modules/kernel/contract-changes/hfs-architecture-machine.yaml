id: hfs-architecture-machine
effectiveAt: '2026-09-29T23:30:00+07:00'
summary: >-
  HFS Phase 0 item 0.4 (owner-approved decision 1: repositories carry only hfs.json). The architecture checker
  (scripts/checks/architecture.mjs and scripts/checks/architecture/) becomes the HFS architecture machine, driven by
  hfs.json and knowledge/hfs/slots.yaml through scripts/lib/hfs-slots.mjs. architecture.json support is removed with no
  dual path: loadArchitectureConfig derives the profile, apps, roots, owners (every directory an owner slot matches that
  has its entry file), the Nest registration selection and the Grammar contract from hfs.json and the slots; the
  checkArchitecture configFile option, the architecture.mjs --config flag, the check-scoped-lint and canon-scan
  --architecture-config flag, the code-pattern architectureConfig inputs and the Next architectureProjects authority
  (projects now come from package.json#starci.codePatterns.next.projects only) are gone. New checks, each with a
  catalogued why code and Vietnamese text: the tier direction matrix for BE and FE with feature to feature forbidden
  (BE_TIER_DIRECTION, FE_TIER_DIRECTION, FE_APP_ISOLATION), owner cycles including type-only imports reported with the
  cycle path (ARCH_OWNER_CYCLE), reachability (BE_FEATURE_NOT_COMPOSED, BE_MODULE_NOT_COMPOSED, FE_OWNER_REACHABLE,
  FE_HREF_RESOLVES), dead exports (HFS_UNUSED_EXPORT), required files (FE_ERROR_BOUNDARY_MISSING,
  BE_REQUIRED_MODULE_MISSING, HFS_REQUIRED_FILE_MISSING), file-size-growth against the merge-base (HFS_SIZE_GROWTH) and
  token-normalised duplicate blocks across owners (HFS_DUPLICATE_BLOCK, threshold ruleParams duplicateBlockLines 25).
  knowledge/hfs/slots.yaml adds src/app/[locale]/loading.tsx to the fe.app.next required files and duplicateBlockLines to
  ruleParams; the schema and loader validate the new key. Lead decisions the same day: no legacy - the earlier direction rules
  BE_MODULE_IMPORTS_FEATURE, BE_MODULE_IMPORTS_APP, BE_FEATURE_IMPORTS_APP, FE_TIER_IMPORTS_UPWARD,
  FE_FEATURE_DEPENDENCY_DIRECTION, FE_APP_INTERNAL_IMPORT_OUTSIDE_FEATURES, FE_FRAMEWORK_ADAPTER_IMPORT and
  FE_COMPONENT_IMPORTS_TRANSPORT are deleted with their catalog entries, knowledge references (BE_TIER_DIRECTION and
  FE_TIER_DIRECTION are the one rule per law), specs and the code.refactor relocation entry of the first of the FE route
  rules. The FE matrix gains two tiers: foundation (modules/{config,i18n,routes,types}, new optional slot fe.modules.types)
  which components may import, and transport (modules/api) which components may not; hooks may import hooks of another
  domain only through hooks/<domain>/index.ts (fe.hooks is now an owner slot requiring index.ts). architecture.json is
  replaced everywhere it was named: every example carries hfs.json (shape-slot keeps a root src/ and needs its own move
  to apps/<app>/src), the todo-app-example workflow drops --architecture-config, the code.refactor sharedRoots policy is
  empty and the api.mjs and cut-seam.mjs defaults are empty because owners are derived from slots and nothing registers
  one; the scaffold, bridging, driver-loop and work-layout prose and json-exceptions name hfs.json. The op manifests
  backend.implement, interface.implement and review.verify drop the retired --architecture-config flag text.
  knowledge/repository-baseline.yaml is left to the sync lane that retires it.
reach: new-legs
