id: land-live-deps-guard
effectiveAt: '2026-09-29T21:30:00+07:00'
summary: >-
  The land gate refuses to run checks when the live runtime's node_modules is missing or empty, and refuses a land
  whose checks ran while it lost entries (new failure code live-deps-missing). Housekeeping reports liveDeps and
  fails its run when a sweep reduced the live node_modules. Fix for live-node-modules-wiped (2026-09-29 13:29Z).
reach: new-legs
