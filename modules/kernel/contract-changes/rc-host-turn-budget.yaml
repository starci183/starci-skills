id: rc-host-turn-budget
effectiveAt: '2026-09-28T21:00:00+07:00'
summary: >-
  A seat's turn budget (coordinator, 2026-09-28: the fe-canon Kernel sat in single 30-40 minute turns, busy not
  wedged, and every doorbell and notice was deferred kernel-busy). The host controller reads each seat's running turn
  from its spinner timer (services.mjs --turn, read-only). One busy turn longer than allocation.liveness
  kernelTurnBudgetMs (20 min; the [Supervisor] seat supervisorTurnBudgetMs, 30 min) gets the agent's own interrupt
  key (host.yaml turnBudget.interruptKeys: Esc, Devin Esc twice), then the decision doorbell (top DI and its ranked
  actions) and the seat's own wake pass, and the KERNEL_TURN_OVERDUE clock starting at the turn's start. Still the
  same turn turnInterruptGraceMs (5 min) later, the seat terminal is quit and closed (services.mjs --turn-replace) and
  the seat's existing watchdog --once --repair pass replaces it; that replacement counts toward the seat quarantine.
  The host controller's clock states are now sla.yaml codes (SERVICE_DOWN, SEAT_VACANT, ORPHAN_PROCESS,
  LEDGER_CORRUPT, ...), so the SLA layer reports each under its code and severity; the pre-code states are cleared once.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-host-turn-budget.yaml
  - modules/models/runtimes.yaml
  - modules/reconciler/host.yaml
  - modules/reconciler/sla.yaml
  - scripts/reconciler/controllers/host.mjs
  - scripts/reconciler/services.mjs
  - tests/reconciler-host.spec.mjs
  - tests/reconciler-services.spec.mjs
