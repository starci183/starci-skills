id: kernel-guard-file
effectiveAt: '2026-10-02T12:00:00+07:00'
summary: >-
  THE KERNEL HAS A GUARD FILE (lane C0-KGUARD). Before, only ops and [Worker]s got a job guard, so the PreToolUse
  command guard (scripts/guards/command-guard.mjs) let every Kernel shell command through. scripts/kernel/start-workflow.mjs
  now calls guardLaunch (scripts/guards/install.mjs) for the Kernel with jobId kernel-<workflowId>, no owned path,
  role kernel (writeJobGuard's new role field, GUARD_ROLES op|kernel) and the workflow worktree, refreshes the history
  and work hooks in that worktree, and binds the guard to the Kernel's Orca terminal from startAgent's onCreated (the
  moment worker-start names the terminal; a replaced Kernel's terminal is unbound). The Kernel is refused what an op is
  refused: inside the workflow worktree a git history or ref change (WORKFLOW_HISTORY_CHANGE), git worktree add, a
  recursive delete, a kill by image name and a raw agent launch (RAW_TERMINAL_CREATE, AGENT_HEADLESS_LAUNCH); its
  `node api.mjs <verb>` calls and git reads pass. The history hook (HOOK_VERSION 6) skips a guard of role kernel: the
  runtime's own git under the Kernel's api calls (checkpoints, land scratch trees) inherits the Kernel's
  ORCA_TERMINAL_HANDLE. The guard receipt rides on kernel-booted and the start receipt as `guard`; a layer that did not
  install carries the new code kernel-guard-unbound (best effort, as for an op: it never refuses the boot).
adds:
  codes:
    - kernel-guard-unbound
reach: new-legs
paths:
  - modules/kernel/contract-changes/kernel-guard-file.yaml
  - scripts/kernel/start-workflow.mjs
  - scripts/guards/install.mjs
  - scripts/guards/command-guard.mjs
  - modules/kernel/api.yaml
  - modules/kernel/failure-codes.yaml
  - CHANGELOG.md
  - tests/kernel-guard.spec.mjs
