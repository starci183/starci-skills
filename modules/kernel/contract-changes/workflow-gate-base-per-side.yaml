id: workflow-gate-base-per-side
effectiveAt: '2026-10-02T06:30:00+07:00'
summary: >-
  THE GATE BASE OF A WORKFLOW-WORKTREE OP IS PER SIDE (WFWT2 2.2). Before, a settle accepted only the current checkpoint as
  the base of an op's gate JSON, so an fe op gated before a be op's checkpoint was refused op-gate-base-mismatch and re-ran
  its whole gate once. Now settle accepts any checkpoint of the chain the op's side has not moved since
  (scripts/machine/workflow-tree.mjs gateBasesOf: the current checkpoint, then each older one while the checkpoint stepped
  over changed none of the op's owned paths, back to the merge-base with main). An op owning '.' or no known path keeps
  the current checkpoint only. scripts/kernel/gate-settle.mjs judgeLoop and judgeJobLoop take gateBases (newest first)
  in place of expectedBase, which is deleted; the refusal still names the current checkpoint. gate.mjs's default base is
  unchanged (the current checkpoint), and the finish gates the whole branch against main.
reach: new-legs
paths:
  - modules/kernel/contract-changes/workflow-gate-base-per-side.yaml
  - scripts/machine/workflow-tree.mjs
  - scripts/kernel/gate-settle.mjs
  - scripts/kernel/cli.mjs
  - tests/kernel/workflow-checkpoint.spec.mjs
