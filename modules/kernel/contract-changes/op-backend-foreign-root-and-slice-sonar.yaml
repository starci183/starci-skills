id: op-backend-foreign-root-and-slice-sonar
effectiveAt: '2026-09-28T01:30:00+07:00'
summary: "backend.implement throughput (lane op-backend; measured 2026-09-27 *mujek* workflows: 32 jobs, 2 succeeded, 9 failed, median run 61 min). (1) Gate attribution: a failing file red before the retry lineage began - clean, outside the owned paths, importing nothing under them, last committed by another workflow - is peer via preexisting (nivo collab inc-72edd7aa6741: workspace-provision's c0e7552d read unknown and the attempt was spent); a failing path relative to or under another bound repository is read with git there; a red check with no failing list is attributed on the source paths its evidence names (failing + failingDerived). (2) Settle: a partial/failed report with rootCause.self false that no job of this workflow can verify is never re-run blind - nextStep peer-blocked (its red checks attribute peer: result.peerBlocked source report, no business attempt) or root-elsewhere (nothing queued, counted false; the Kernel hands the root to its owner first). Before, partial-resumes-the-same-op re-ran bd2609ff17 -> a1dad730db and f920334582 -> a89b597df5 for hours with identical open items. (3) sonar-local scan: --isolate analyses only --paths in a throwaway project <key>-slice-<hash> with the admin token, then deletes it, typing the slice through the repository root tsconfig.json only (SonarJS otherwise builds a program for each of the 31 stray tsconfig.json copies in nivo-backend); measured on nivo collab composition: 3.4 min (10 min under full host load) against 21 min for the whole-project analysis, same slice verdict (pass, 100% changed-line coverage); --lcov reads this attempt's slice coverage from a job-private directory; --cwd resolves a bare repository name beside or above the current directory (792d53da0b read starci-next/starci-next). (4) check-scoped-lint --compact: the evidence form (23 MB -> ~0.2 MB for nivo collab). (5) backend.implement brief: slice coverage + --isolate Sonar instead of test:ci + whole-project analysis per attempt (full suite at the cut-set closing pass / release); a repo-wide red only on files the slice did not change is recorded with failing + rootCause self false, never partial; a todo dependsOn record is not DECLARED_DEPENDENCY_UNMET by itself (d5bf375e7a). op-prompt prints the sonar machine line for briefs that use --isolate, --compact on the code-patterns line, and the repo-wide red rule. Adds no check or finding code; nothing accepted before is refused"
reach: new-legs
paths:
