id: rc-sla-workflow
effectiveAt: '2026-09-28T18:00:00+07:00'
summary: >-
  Reconciler lane F (<tmp>/reconciler-design/LANES.md "Lane F", DESIGN.md §8.2, §8.8, §9.2, §17.1, Appendix A),
  landed in SHADOW (config.yaml reconciler.controllers.workflow.mode, lane rc-engine; nothing acts until it is set
  active). The SLA / Invariant layer scripts/reconciler/sla.mjs slaPass(ctx), the engine's built-in pass every
  modules/reconciler/sla.yaml passMs: a reconciler.sqlite sla_clocks row past its sla_ms is ONE
  runtime-invariant-violated event on the supervisor ledger (entity type invariant, entity id the dedupeKey
  <CODE>|<entity>) plus one typed warning row (data.event invariant.violated); its clear is ONE
  runtime-invariant-cleared event; a critical code opens a runtime-defect Decision Item for the Supervisor. A clock
  state is a catalogue code or <CODE>/critical; sla.yaml lists every Appendix A code and cites the runtimes.yaml key
  of a number that already exists instead of copying it. The Workflow controller
  scripts/reconciler/controllers/workflow.mjs (concerns workflow.stall-wake, workflow.progress, workflow.ask-repark;
  key workflow:<ledgerId>:<workflowId>, resync 120 s) reads one projection per pass (the cached api status plus
  scripts/supervisor/stall.mjs stallFindings answered from that status), keeps the workflow's clocks, opens the Kernel
  DIs progress-stall, stale-gate, stale-wait, stale-peer-wait, unread-peer, orphaned-frontier and rev-ack (idempotency
  key <kind>:<workflowId>:<subject>, evidence line plus the first untried rca action), escalates a stall past
  allocation.progress.supervisorGraceMs to the Supervisor, rings the Kernel seat's doorbell through lane
  rc-decisions ringDoorbell (a would-row until it lands and in shadow), re-parks dead / stale / unserved owner asks
  (api serve-ask) and finishes a finish-ready workflow (api finish). A running workflow with a null goal text is a
  critical GOAL_TEXT_MISSING clock (INV-W4). Once active it replaces the [stall] wake of stall-alert.mjs and the
  progress-stall owed action of progress-watch.mjs (the old loops yield per concern through reconcilerOwns). No api
  verb, ledger schema or op contract changes; the Kernel's contract is unchanged until lane rc-decisions routes DIs.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-sla-workflow.yaml
  - modules/reconciler/sla.yaml
  - modules/reconciler/workflow.yaml
  - scripts/reconciler/sla.mjs
  - scripts/reconciler/controllers/workflow.mjs
