id: hfs-fe-managed-config
effectiveAt: '2026-09-30T22:00:00+07:00'
summary: >-
  Lane F0 sub-lane G (COVERAGE X2, X3, X5, X6, A4, A5; rules R05, R13, R16, R17, R19, R22): a front end's whole tool
  configuration is rendered by `hfs sync` and compared by `hfs check`, by the mechanism a back end already has (hfs-managed-config),
  and stylelint and the e2e lint are in every automatic gate. (1) Slots: fe.tool-config (managed: tsconfig.json extending
  @starci/tsconfig/next.json and excluding the e2e tree, tsconfig.e2e.json, the one-line eslint.config.mjs, the one-line
  stylelint.config.mjs, the one-line vitest.config.ts, .prettierrc, .prettierignore), fe.package-manifest (managed `scripts` block,
  mode scripts) with fe.lockfile, fe.tool-config-local (forbidden: .eslintrc*, a second eslint or stylelint config, prettier, vitest,
  jest and lint-staged configs) and fe.tool-config-repo (vitest.setup.ts, playwright.config.ts, turbo.json: the repository's own
  facts, which no preset can render). fe.thin-config and the fe use of repo.package-manifest are deleted. (2) One lint gate:
  `lint:check` is one ESLint run over apps, packages and e2e/ (the factory's e2e block) with --max-warnings=0 and no
  --ignore-pattern, plus stylelint over {apps,packages}/*/src/**/*.css; there is no `lint:e2e` script, and the machine rule
  HFS_E2E_IN_AUTOMATIC_GATE no longer counts a `lint:e2e` command as running e2e (linting is not running). `test:e2e` is the only
  script that runs Playwright. Front-end hooks (pre-commit: eslint, stylelint, prettier on staged files, no lint-staged; pre-push:
  typecheck, lint:check, format:check, hfs:check --fast, test:affected) and CI (hfs:report, lint:check, format:check, typecheck,
  test:ci, build) call only managed scripts. (3) @starci/stylelint-canon exports loadAppTokens(import.meta.url), which derives
  `appTokens` from the globals.css files, so the managed stylelint.config.mjs holds no repository choice. (4) hfs check judges both
  profiles: HFS_RULE_OFF_WITHOUT_REPLACEMENT also for stylelint.config.mjs, HFS_TS_STRICT for the front end's root tsconfig,
  HFS_TOOL_CONFIG_LOCAL also for stylelint plugins, stylelint flags and tool configuration keys of a package.json, and the new gate
  findings HFS_CI_MISSING_CANON (R13) and HFS_FORMAT (R19), reported when the CI workflow or a hook lost a canon step of its render
  (ci-missing-canon and format ship as `hfs` enforcers in packages/hfs/sync/managed.mjs). (5) Sonar (amends hfs-sonar-import):
  `hfs report <eslint|stylelint> <in> <out>` replaces `hfs report-stylelint` and converts both linters through one placement rule,
  so a finding on a file outside sonar.sources (packages, e2e/, a config file) is filed on the first source file with its real
  path in the message instead of being dropped; sonar.eslint.reportPaths is no longer rendered (both profiles) and
  sonar.externalIssuesReportPaths lists reports/{hfs,eslint,stylelint}.sonar.json; a front end's sonar.sources and sonar.tests
  include packages when hfs.json opts into repo.packages or an fe.package.* slot. The gate's engines are unchanged. (6) The
  front-end skeleton (hfs sync --init) writes a one-app repository's next-intl stack and API client in the app, and a repository
  with two or more apps writes them once as packages/<project>-i18n and packages/<project>-api with thin per-app adapters (--init
  refuses it unless hfs.json opts into fe.package.i18n and fe.package.api). Examples (ecommerce-app-fe, todo-app-frontend,
  shape-slot) are not edited here; they need `hfs sync --write` and the code changes the managed configuration implies.
reach: new-legs
