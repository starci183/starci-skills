id: rc-host-probe-flap
effectiveAt: '2026-09-28T19:30:00+07:00'
summary: >-
  The host controller restarted a healthy harness about every 10 minutes from 09:25 (coordinator, 2026-09-28): its
  harness-ui probe gave one request 5 s, and the harness's first request after idle can take 5-9 s (11.5 s through the
  tunnel). Now one probe pass tries probeTries times (harness 3 x 15 s local, 3 x 20 s public; the connector status
  probes 2 tries) and passes on the first answer; the harness probes GET /healthz instead of the snapshot page; a
  service goes failed only after failAfter consecutive failed passes; before any restart the service is asked once
  more with aliveTimeoutMs (harness port, public URL, ask-gateway port, an Orca terminal listing) and one that still
  answers is never restarted (the pass counts as degraded, logged reconciler.host.service-slow, no restart counted
  toward the quarantine); SERVICE_DOWN runs from failed onward, never on one degraded pass.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-host-probe-flap.yaml
  - modules/reconciler/host.yaml
  - scripts/reconciler/controllers/host.mjs
  - scripts/reconciler/services.mjs
  - tests/reconciler-host.spec.mjs
  - tests/reconciler-services.spec.mjs
