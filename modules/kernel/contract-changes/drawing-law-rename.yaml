id: drawing-law-rename
effectiveAt: '2026-10-02T20:53:00+07:00'
summary: >-
  The FE canon law `shape-slot` is renamed `drawing` (its slots.yaml role id): packages/eslint/fe/
  shape-slot.mjs and its spec are drawing.mjs/drawing.spec.mjs, the fe index contributes the law as
  drawing, and every comment, message and why entry says drawing. The law still reads the ui.shapes
  record of an interface.draw leg and the same four lint rules (base-props-atom, base-import-pair,
  no-data-status-shape, slot-status-through-slotview) keep their ids - only the law name changed, and
  no alias for `shape-slot` is kept. `examples/shape-slot` stays the Next 15 reference tree; a path
  that names it is unchanged. modules/kernel/retired-paths.yaml records the two file moves.
reach: new-legs
paths:
  - packages/eslint/fe
  - modules/kernel/retired-paths.yaml
  - modules/models/canon-conformance.yaml
