id: e2e-manual-hfs-check
effectiveAt: '2026-09-29T15:00:00+07:00'
summary: >-
  Owner ruling 2026-09-29: e2e runs MANUALLY only. The HFS architecture check declares HFS_E2E_IN_AUTOMATIC_GATE
  and flags a repository whose husky pre-commit or pre-push hook, a script a hook calls (through npm run), or
  lint-staged runs an e2e command (test:e2e, typecheck:e2e, lint:e2e, playwright test, jest --selectProjects e2e or an
  e2e jest config; an --ignore-pattern naming the e2e tree is not a run); a backend unit or coverage script
  (test, test:unit, test:ci, test:affected, test:coverage) that runs jest without --selectProjects unit; a
  jest.config.js collectCoverageFrom that does not exclude src/tests/**; a default tsconfig.json that still includes
  src/tests/e2e/** (backend) or e2e/** (frontend root); and a workflow that starts on push or pull_request and runs
  e2e. The root entry tsconfig.e2e.json (the manual typecheck:e2e project) joins the optional HFS root entries.
reach: new-legs
paths:
  - modules/kernel/contract-changes/e2e-manual-hfs-check.yaml
  - scripts/checks/architecture/hfs.mjs
  - tests/hfs-test-kinds.spec.mjs
