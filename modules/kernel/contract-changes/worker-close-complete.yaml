id: worker-close-complete
effectiveAt: '2026-10-03T00:30:00+07:00'
summary: >-
  A FINISHED WORKER IS CLOSED COMPLETELY (owner rule 2026-10-02 23:35; correcting contract change worker-release-ends-agent). `worker-release` alone does NOT end every agent:
  live smoke E1 proved it for claude, codex and devin only, and a released cursor worker kept its cursor-agent process running (about 11,200 CPU seconds, 19:25 to 23:27)
  until its terminal was closed and the PID stopped by hand. Every release now goes through ONE path, scripts/machine/worker-close.mjs closeWorker: worker-show (the terminal handle,
  and a snapshot of the processes that belong to that terminal), worker-stop only on the caller's proof the Dispatch is not settled, worker-release (repeated once on request), the
  terminal close of the worker's own terminal (close-verify closeAndVerify), then a bounded verify (allocation.workerClose.verifyMs) that no process of the terminal's shell tree remains.
  A process belongs to the terminal when it, or an ancestor in the process table, inherited ORCA_TERMINAL_HANDLE=<the terminal> (read from the process environment by
  scripts/api/process/process-env.mjs); nothing is ever matched by name (the owner's ChatGPT desktop app runs codex.exe on this host and is never touched). A survivor so proven is stopped by pid
  and re-verified; one that stays raises the host-hygiene finding `worker-process-survived`, which NEVER changes the worker's outcome (a worker that sent worker_done and succeeded stays
  succeeded). Verify cannot run (Orca unreachable, table or environments unreadable, no process carries the handle): nothing is killed and the answer is `unverifiable`, left for the sweep.
  A caller inside the worker's own terminal releases but does not close or verify it. Settle, finish, reconcile --release-worker, the dead-worker recovery, the rejected-launch cleanup, the
  Kernel replacement, the GC sweeps, the supervisor seat, the draw critic, the launch smoke and the agent launch cleanup all use it (`stopAndRelease` and `releaseSelfSafe` moved there from
  close-verify). The agent cards declare it (`release.closeTerminal`, `release.verify: terminal-process-tree`); the false statements that worker-release alone ends the agent are corrected.
reach: new-legs
adds:
  codes: [worker-process-survived]
paths:
  - modules/kernel/contract-changes/worker-close-complete.yaml
  - modules/kernel/failure-codes.yaml
  - modules/models/runtimes.yaml
  - modules/models/agents/claude.yaml
  - modules/models/agents/codex.yaml
  - modules/models/agents/devin.yaml
  - modules/models/agents/cursor.yaml
  - scripts/machine/worker-close.mjs
  - scripts/api/process/process-env.mjs
  - tests/machine/worker-close.spec.mjs
