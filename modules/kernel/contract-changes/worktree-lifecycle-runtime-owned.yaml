id: worktree-lifecycle-runtime-owned
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  THE RUNTIME OWNS THE GIT WORKTREE LIFECYCLE (owner order lane WT 2026-10-01: 600+ orphan worktrees had piled up).
  scripts/lib/worktrees.mjs createWorktree is the only `git worktree add` of the runtime (scripts/checks/check-worktree-add.mjs,
  a land gate tree check and part of npm run check, fails any other). Every worktree is registered in machine.sqlite
  `worktrees` (owner op, repo, branch, kind, created-at) with a `claims` row for its creating process, and an op worktree
  is capped per repository (modules/kernel/product-land.yaml worktrees.capPerRepo, 10): a full repository refuses the
  dispatch worktree-cap and the job waits queued. Exactly one worktree per op, <repo>/.starciwork/worktrees/<op> off main
  at dispatch; the per-workflow integration worktree (_wf), the workflow branch, `api product-land` and `api product-deps`
  are gone. A green settle lands the op LAST (every other settle refusal first): the merge guard over its history
  (land-merge-dropped-main), op/<op> rebased onto main's tip, the land gate on exactly the tree that lands, the pre-land
  verify (product-integrate-red), main compare-and-swap fast-forwarded (land-main-refused) and pushed, one
  product-op-landed event per op; the worktree and its branch are removed right
  after the worker is released (`branch -d` once landed). A failed or blocked op's uncommitted work and unlanded commits go
  to refs/heads/preserved/<job> first, and its worktree is removed too. Removal (scripts/lib/safe-remove.mjs
  safeRemoveWorktree) finds every link without following one, removes each as a link, asserts zero remain, only then runs
  `git worktree remove`, and asserts the main checkout lost no tracked file and kept its node_modules entry counts - a
  violation stops every worktree GC until `node scripts/lib/worktrees.mjs resume`. The reconciler GC controller's
  gc:worktrees pass runs ACTIVE whatever the controller mode and removes, after preserving, a worktree whose branch is
  merged, whose owner op settled, or whose owner process has been gone 30 minutes; the Supervisor sweep judges lanes in
  bounded, resumable passes (allocation.gc.laneBudgetMs). `node scripts/reconciler/start.mjs --check` shows each
  repository's worktree count against its cap, red when over it or holding orphans. Adds the codes worktree-cap,
  worktree-registry-unavailable, op-worktree-dirty, op-worktree-reset-failed, land-merge-dropped-main, land-main-refused,
  main-unresolved, preserve-failed, link-stuck and main-checkout-damaged; retires the workflow-branch codes.
reach: new-legs
