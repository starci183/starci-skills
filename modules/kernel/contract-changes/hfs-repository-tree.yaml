id: hfs-repository-tree
effectiveAt: '2026-09-29T03:03:42+07:00'
summary: "HFS (house folder structure) becomes the one repository law. New knowledge source
  knowledge/patterns/repo/folder.yaml (id repo.folder, REPO-FOLDER-1..5) owns the tracked-root allowlist,
  the mandatory apps/<app>/ monorepo on both profiles, npm-only package management, and backend-only
  .starciwork/.starcistacks. be/folder.yaml BE-FOLDER-1 now requires apps/<app> on every backend and
  fixes module tiers to exactly domain|platform|integrations (bussiness/business/etc forbidden, no
  mapped-layout exception); fe/folder.yaml FE-FOLDER-1 requires apps/<app>/src and forbids a root src/;
  be/architecture-check.yaml drops the transport-first explicit-mapping escape. repository-baseline.yaml
  materialises the Next profile as an apps/<app> workspace package (root tsconfig base, per-app
  package/next.config/tsconfig/postcss/vitest, root vitest projects, next dev|build|start apps/<app>)
  and adds BASELINE-ONE-LAYOUT. index/enforcement/scan-coverage register the new source and the eight
  HFS_* automated codes the architecture checker will report. docs/source-layout.md and
  docs/backend-source-pattern.md trees rewritten to the HFS; architecture-rules.md tree sections aligned.
  Tests asserting the old Next baseline layout are a known out-of-scope repair tracked on the HFS board."
reach: new-legs
paths:
  - knowledge/index.yaml
  - knowledge/patterns/repo/folder.yaml
  - knowledge/patterns/be/folder.yaml
  - knowledge/patterns/be/architecture-check.yaml
  - knowledge/patterns/fe/folder.yaml
  - knowledge/patterns/enforcement.yaml
  - knowledge/patterns/scan-coverage.yaml
  - knowledge/repository-baseline.yaml
  - docs/source-layout.md
  - docs/backend-source-pattern.md
  - docs/architecture-rules.md
  - modules/kernel/contract-changes/hfs-repository-tree.yaml
