id: bld-test-builders
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  Lane BLD (BE-TEST-16 enforcers). One rule per builder obligation, ids widened to R<two or three digits> (catalog schema, loader,
  parity gate, README table reader): R98 BE_TEST_BUILDER_HOME (new eslint-be rule persisting-builder-in-builders-slot: a non-spec module of
  the test tree that exports a function creating persisted rows through an EntityManager, DataSource or QueryRunner is a builder and must be
  in be.tests.fixtures.builders; the file-name half stays BE_SOURCE_FORM), R99 BE_TEST_ROW_BY_BUILDER (spec-no-raw-insert moves here from R48,
  its behaviour unchanged except that it also reads a tagged-template statement, and the R99 law text is the sentence it had in R48; new
  spec-no-repeated-row-literal: a persistence entity, recognised by its typeorm @Entity declaration through the contextual type, built as an
  object literal without spread more than once in a spec), R100 BE_TEST_CONSTRAINTS_ON (new tests-keep-constraints: every file under be.tests.*
  keeps constraints on: constraint-off SQL in a query call or tagged template on a typeorm receiver, and dropForeignKey(s),
  dropCheckConstraint(s) and dropUniqueConstraint(s) on a QueryRunner), R101 BE_TEST_BUILDER_ARRANGES (builder-arranges-only moves here from
  R48, judges the builders slot through hfsOf instead of the file name, and no longer judges constraints). R48 keeps its other obligations.
  Adds the failure codes BE_TEST_BUILDER_HOME, BE_TEST_ROW_BY_BUILDER, BE_TEST_CONSTRAINTS_ON and BE_TEST_BUILDER_ARRANGES; no alias.
reach: new-legs
paths:
  - modules/kernel/contract-changes/bld-test-builders.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/be/test.yaml
  - packages/eslint/be/builders.mjs
  - packages/eslint/be/lib/db-writes.mjs
  - modules/kernel/failure-codes.yaml
