id: release-prerequisites
effectiveAt: 2026-10-03T19:51:41.542Z
summary: >-
  The publication plan orders package dependencies before consumers; bundled canon pins affect
  only ready ties and dependency cycles refuse the plan. Clean package proof installs exact
  declared direct local dependencies from candidate tarballs in unlocked scratch manifests and
  compares installed regular files with their packed payload. Version mismatches fail; locked,
  peer or transitive local substitution is visibly unrun. The CLI package runs its actual binary
  and dispatcher tests. L4 binds the existing host concurrency resolver to the declared direct
  Node test script while preserving preloads and file selection, and records the actual command
  and concurrency decision. The example Sonar declarations use the existing host extension and
  sealed local credential custody. Publication declarations and comments cite the dependency
  order owner.
  The native CLI catalog writer updates the dispatcher, reference and completions from command YAML.
reach: new-legs
paths:
  - scripts/gates/release-plan.mjs
  - scripts/gates/package-clean-test.mjs
  - packages/cli/package.json
  - packages/cli/src/package-entry.spec.mjs
  - tests/gates/release-gate.spec.mjs
  - tests/gates/package-clean-test.spec.mjs
  - tests/helpers/npm-tarball.mjs
  - scripts/supervisor/release-l4.mjs
  - tests/supervisor/release-l4-wiring.spec.mjs
  - examples/lite-app/.starcistacks/application-stacks.yaml
  - examples/shape-slot/.starcistacks/application-stacks.yaml
  - modules/cli/commands/release/publish.yaml
  - scripts/gates/release-publish.mjs
  - ext/sonar/secrets/sonarqube-lite-app-token.key.enc
  - ext/sonar/secrets/sonarqube-shape-slot-token.key.enc
  - packages/cli/src/catalog.generated.mjs
  - docs/cli.md
  - packages/cli/completions/starci.bash
