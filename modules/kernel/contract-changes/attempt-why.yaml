id: attempt-why
effectiveAt: '2026-09-29T18:30:00+07:00'
summary: >-
  Every failed, blocked, refused, requeued or waiting attempt now explains itself in the owner's language. New catalog
  modules/kernel/failure-codes.yaml (every code the runtime emits as a verdict reason, check finding, blocker kind,
  dispatch refusal or settle reason: title, meaning, causes, next step, owner), enforced by npm run check
  (scripts/checks/failure-codes.mjs). op_attempts gains why_json (starci/why@1: headline, cause, disagreement, next,
  owner, codes, refs), written by settle, the dispatch refusal, the dead-worker settle, reconcile and archive; api status
  legs/frontier carry it and add kernelNotes[]. A ledger created before this change is upgraded in place on the writer's
  first open (column, views v_attempt_state / v_op_history, ui_state_map awaiting-owner). No verb, flag or verdict changes.
reach: new-legs
paths:
  - modules/kernel/failure-codes.yaml
  - engine/migrations/runtime/0004-attempt-why.sql
  - modules/cli/commands/kernel/status.yaml
  - modules/kernel/contract-changes/attempt-why.yaml
