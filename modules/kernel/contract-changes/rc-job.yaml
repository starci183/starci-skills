id: rc-job
effectiveAt: '2026-09-28T14:20:00+07:00'
summary: >-
  RECONCILER JOB CONTROLLER (lane rc-job; DESIGN §8.1, §9.1). scripts/reconciler/controllers/job.mjs, contract
  modules/reconciler/job.yaml, owns job.settle, job.worker, job.dispatch, job.consume-check, job.close-verify. Keys
  job:<ledger>:<job>, wf:<ledger>:<wf>, workers:supervisor, overlap:<ledger>:<seq>. Per job, the first due step: dead
  worker -> api reconcile --dead-worker --settle-failed; held worker -> --release-worker; a reported job the runtime has
  neither settled nor handed over -> the runtime settler for that job (scripts/reconcile/job-settle.mjs, wrapped, never
  re-implemented); a settle refused as product-integrate-conflict/-red -> api enqueue a continuation --retry-of the job
  from the refused head (continuationCap per lineage, then a DI); deps-unit-required -> api enqueue the deps unit; any
  other handover -> Decision Item settle-nongreen (one per report); answering -> api questions + DI worker-question;
  effect_unknown past effectUnknownMs -> api reconcile; settled with its release unproven or its product worktree not
  removed -> the settler for the job (close + verify, reap; recordLeftover op-worker-after-settle). Per workflow:
  api dispatch-ready below progress.allowedParallel, once per dispatchEveryMs, held while api status importsBroken
  (DI repoint-needed / repoint-dispatch). The Supervisor ledger's [Worker] jobs: sweepWorkers (called). A
  product-wf-overlap event -> a cross-workflow DI for the Supervisor. SLA clocks per phase on job:<ledger>:<job>
  (READY_UNDISPATCHED, LEASE_STUCK, QUESTION_OVERDUE, SETTLE_OVERDUE, DECISION_OVERDUE, DEAD_WORKER_UNRECONCILED,
  EFFECT_UNKNOWN_STUCK, WORKER_RELEASE_LEAK, WORKTREE_REMOVE_OVERDUE). Lands in shadow (config.yaml
  reconciler.controllers.job.mode); the old loops yield per concern only while it is active.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-job.yaml
  - modules/reconciler/job.yaml
  - scripts/reconciler/controllers/job.mjs
  - tests/reconciler-job.spec.mjs
