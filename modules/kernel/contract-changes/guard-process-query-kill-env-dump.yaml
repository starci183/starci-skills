id: guard-process-query-kill-env-dump
effectiveAt: '2026-10-02T12:00:00+07:00'
summary: >-
  The op command guard (scripts/guards/command-guard.mjs) gains two rules, each in its own module. (1) A kill whose targets
  come from a process QUERY is refused with PROCESS_KILL_BY_NAME (scripts/guards/process-kill-verdict.mjs): Get-CimInstance
  or Get-WmiObject Win32_Process, Get-Process, ps, pgrep or tasklist feeding Stop-Process, kill, taskkill /PID <variable>,
  .Terminate(), .Kill(), Invoke-CimMethod Terminate or xargs kill, and wmic process ... delete|terminate; a literal PID, a
  PID from the caller's own Start-Process or `cmd & pid=$!`, a read-only query and text that only mentions these commands
  pass. A lane killed other lanes' node runs by their command line (2026-10-02). (2) A command that writes the whole
  environment to output is refused with the new ENV_DUMP (scripts/guards/env-dump-verdict.mjs): env, printenv, bare set,
  export -p, declare -x|-p, Get-ChildItem env:, [Environment]::GetEnvironmentVariables(), node -p|-e printing process.env,
  python -c printing os.environ, cmd /c set - filtered or not, because names outside a redaction pattern leak (the AWS,
  Azure and Anthropic values reached a transcript). One named variable, `env VAR=x cmd`, `set -e` and mentions pass.
reach: new-legs
paths:
  - modules/kernel/contract-changes/guard-process-query-kill-env-dump.yaml
  - scripts/guards/command-guard.mjs
  - scripts/guards/process-kill-verdict.mjs
  - scripts/guards/env-dump-verdict.mjs
  - scripts/guards/assigned-command.mjs
  - modules/kernel/failure-codes.yaml
  - tests/process-kill-guard.spec.mjs
  - tests/env-dump-guard.spec.mjs
