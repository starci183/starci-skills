id: typed-logs-diff
effectiveAt: '2026-09-27T18:10:00+07:00'
summary: "Logs are typed data, not scraped terminal text. New runtime custody file <repo>/.starciwork/logs.sqlite (scripts/kernel/typed-logs.mjs; its own WAL file beside runtime.sqlite, append-only by trigger, held from housekeeping by artifact-hold, excluded from Work validation and input digests): logs(seq, at, workflow_id, job_id, actor kernel|op|runtime|check|land, node_id, level, kind, msg, data_json <=4KB, refs_json, src). New api verbs `log` (one validated, redacted, per-job-capped row; no ledger write; an op logs only its own job) and `logs` (read, after syncing). An op may append the same rows to <job dir>/log.jsonl; settle ingests it (idempotent by line hash + offset) and derives rows from the ledger's own events (dispatch, report, check.result per recorded check, settle, land, incident, error, job.drop). Redaction reuses the push secret-scan patterns, moved to scripts/lib/secret-patterns.mjs (push-mains.mjs imports and re-exports them). Artifact indexing writes <patch>.json beside each job .patch (scripts/kernel/patch-json.mjs: files, status A|M|D|R, hunks with line numbers, binary/image flags, decoded image literals in <patch>.assets, capped by allocation.logs.diff) and indexes a job's log.jsonl as a log artifact; scripts/work/backfill-patch-json.mjs writes it for existing patches. The Kernel prompt and driver-loop boundary.typedLogs, and the op prompt `logging:` block, ask for typed rows instead of prose. Adds no check or finding code; nothing is refused that was accepted before"
paths:
  - scripts/kernel/typed-logs.mjs
  - scripts/kernel/patch-json.mjs
  - scripts/kernel/job-artifacts.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/op-prompt.mjs
