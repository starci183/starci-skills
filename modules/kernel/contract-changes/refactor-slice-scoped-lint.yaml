id: refactor-slice-scoped-lint
effectiveAt: '2026-09-28T06:54:00+07:00'
summary: "code.refactor cut slices use check-scoped-lint --base <slice admission commit> -- <owned paths> before and after, with slice.status gating only new findings and exact command/report parity. The ordinal that closes the cut set records one whole-repository --all check with full-regression-final; uncut refactors retain --all before and after. This avoids concurrent multi-GB whole-repository lint runs across cut slices while preserving the final repository measurement. Adds no finding code; a leg admitted before this change keeps its contract."
reach: new-legs
ops: [code.refactor]
paths:
  - modules/ops/ops/code.refactor.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/checks/check-scoped-lint.mjs
  - tests/refactor-slice-scoped-lint.spec.mjs
