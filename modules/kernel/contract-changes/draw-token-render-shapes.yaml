id: draw-token-render-shapes
effectiveAt: '2026-09-27T05:10:00+07:00'
summary: "interface.draw draws only shapes - the ui record's `ui.shapes`, one per XBase#state (the flow states less every data status for a record without them) - and never a data status (loading, empty, error, forbidden, skeleton, 401/403/404, a loading/error/not-found surface). Each part is token-rendered: real HTML/CSS in the Grammar tokens or the real XBase with fixtures, captured by scripts/work/draw-render.mjs at @2x per viewport and composed with --tool draw-render; image_gen.imagegen paints only raster regions, so route.riskHints drops host-tool-required:image_gen.imagegen and the manifest declares grammarContext: required (lane draw-records wires it). The brief carries the grammar-geometry --prompt block, the ui-proof-brief cases and values with rule ids, the grammar sources and the brand-palette block with no invented number, and places a status line alone atop its card or as a neutral grey band; a full-width control takes the fill-variant geometry of the block, and the part's .content.html is a declared ui asset so shell-conformance GEOMETRY_OFF_GRAMMAR measures it. Owner review text follows draw-review: shapes only (one per XBase#state of ui.shapes), retired data-status images never shown, the owner request read from ledger lineage by drawOwnerRulingOf, and the ask is draw-review.mjs question --job <id>. The self-check (visual-review.md, proof self-check) cites a rule id for every inset, gap, radius and type size and marks each applicable proof case satisfied / not satisfied / not observable. Proof imagegen-provenance becomes render-provenance; blocker RENDER_TOOL_UNAVAILABLE is new. Draw keeps Codex alone, GPT-6 Sol at effort high (runtimes.yaml comments only). A running leg keeps the ImageGen contract it was admitted under"
ops: [interface.draw]
reach: new-legs
paths:
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/registry.yaml
  - modules/models/runtimes.yaml
  - tests/interface-draw-token-render.spec.mjs
