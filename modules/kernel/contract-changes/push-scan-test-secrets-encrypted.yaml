id: push-scan-test-secrets-encrypted
effectiveAt: '2026-09-28T20:00:00+07:00'
summary: >-
  Owner 2026-09-28 ("đừng chặn pass tests", clarified "secret test encrypt thành enc"): test credentials are
  never committed as literals. scripts/lib/test-secrets.mjs is the encrypted test-secret store - AES-256-GCM
  with the name bound as AAD, key generated once at ~/.starci/secrets/test-secrets.key (outside every repo,
  owner-only), values committed as <repo>/.starciwork/secrets/<name>.enc envelopes {v, iv, tag, ct};
  testSecret(name, {repo}) / setTestSecret(name, value, {repo}) and a set/get CLI that never prints a value
  unless `get --reveal`. The push secret scan stays strict: a plaintext test password still refuses the push and
  the refusal names the fix (TEST_SECRET_HINT); a `.enc` file passes only when its added text is the bare
  envelope. push-scan-allow.yaml entries (the owner's 2026-09-27 exemptions, landed here) may be pinned to an
  already-committed range with `until: <sha>` and are spent once origin/main holds it; the nivo-backend
  capture.mjs literal is let through that way. The shared op policy and the capture/e2e/UAT/implement ops tell
  workers to generate test credentials per run or read them with testSecret().
reach: new-legs
paths:
  - modules/kernel/contract-changes/push-scan-test-secrets-encrypted.yaml
  - modules/kernel/owner-rulings.yaml
  - modules/supervisor/push-scan-allow.yaml
  - modules/ops/_common.yaml
  - modules/ops/ops/backend.implement.yaml
  - modules/ops/ops/interface.implement.yaml
  - modules/ops/ops/e2e.verify.yaml
  - modules/ops/ops/uat.verify.yaml
  - modules/ops/ops/uat.assisted.prepare.yaml
  - scripts/lib/test-secrets.mjs
  - scripts/supervisor/push-mains.mjs
  - scripts/supervisor/land.mjs
