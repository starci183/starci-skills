id: push-scan-test-secrets-encrypted
effectiveAt: '2026-09-28T20:00:00+07:00'
summary: >-
  Owner 2026-09-28 ("đừng chặn pass tests", "secret test encrypt thành enc", then "hoạt động y chang .stacks,
  không push mk bình thường lên"): test credentials follow the product repository's own .starcistacks + sops
  convention and a plaintext password is never pushed. There is no runtime-owned store: a stable test credential
  lives at <repo>/.starcistacks/<stack>/secrets/test/<name> (plaintext git-ignored by the repo's .starcistacks/**
  rules), is stored with the repo's own stack-secret set command (npm run secret:set -- <stack>/secrets/test/<name>) so only the
  sops .enc twin is committed, and scripts/lib/test-secrets.mjs testSecret(name, {repo, stack}) reads it - the
  local plaintext when present, else the .enc decrypted by sops with the shared age identity
  (~/.starci/master.identity), in memory, never printed (CLI `get` prints only with --reveal). The first cut's
  AES-GCM store with its own key file is withdrawn. The push secret scan stays strict: a plaintext test password
  still refuses the push and the refusal names the .starcistacks path and command (TEST_SECRET_HINT); a .enc passes
  only when it is a sops envelope (isSopsEnvelope: every value ENC[AES256_GCM,...], a sops block with its mac, no
  unencrypted_suffix plaintext), judged on the whole file at the pushed commit; a non-envelope .enc under
  .starcistacks/ refuses (sops-not-envelope) and so does any plaintext under .starcistacks/<stack>/secrets/
  (starcistacks-secret-plaintext). push-scan-allow.yaml entries may be pinned with `until: <sha>` and are spent once
  origin/main holds it; the nivo-backend capture.mjs literal was let through that way. The shared op policy and the
  capture/e2e/UAT/implement ops tell workers to generate test credentials per run or keep them as .starcistacks
  sops twins read with testSecret().
reach: new-legs
paths:
