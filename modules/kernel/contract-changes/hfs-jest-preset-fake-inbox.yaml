id: hfs-jest-preset-fake-inbox
effectiveAt: '2026-10-02T11:20:00+07:00'
summary: >-
  `fakeInbox()` in @starci/jest-preset (alpha.5 item 6.6), the twin of `recordingOutbox()` for the delivery side, and the INBOX row of
  `ruleParams.be.specDoubles` of knowledge/hfs/slots.yaml: a provider `{ provide: <...INBOX...>, useValue: X }` in a unit spec takes X from
  `fakeInbox()` (R48 `spec-infra-double-from-kit`), so a `mock<Inbox>()` is now a finding. The double claims a (source, eventId) pair
  once, releases it, marks a redelivery and scripts one-shot failures. The examples' `mock<Inbox>` specs are migrated when the examples
  are re-pinned to the published kit.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-jest-preset-fake-inbox.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/patterns/be/test.yaml
  - packages/jest-preset/inbox.cjs
  - packages/jest-preset/inbox.d.ts
  - packages/jest-preset/index.cjs
  - packages/jest-preset/index.d.ts
  - packages/jest-preset/package.json
  - packages/jest-preset/README.md
  - packages/jest-preset/CHANGELOG.md
