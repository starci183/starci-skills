id: hfs-code-merge-required-and-test-kind
effectiveAt: '2026-10-02T09:00:00+07:00'
summary: >-
  One failure code per obligation (alpha.5 item 6.9). BE_REQUIRED_MODULE_MISSING is merged into HFS_REQUIRED_FILE_MISSING: a
  required file or directory that is missing is one obligation whatever the slot, so the architecture machine reports every
  missing required entry of a backend app, feature, domain, integrations or platform instance under HFS_REQUIRED_FILE_MISSING
  (R01; FE_ERROR_BOUNDARY_MISSING stays the front-end error-boundary code). HFS_TEST_KIND_RETIRED is merged into
  BE_TEST_TOPOLOGY: a retired test kind, a retired test folder and a per-lane test config are the same R47 obligation as a
  `.test` file, a `testing/` folder and a second jest configuration, so they are reported under BE_TEST_TOPOLOGY. Both retired
  codes are removed from modules/kernel/failure-codes.yaml and from the rule catalog, and no alias remains. R66 FE_E2E_SHAPE
  stays retired, so R47 is the only rule that owned the test-kind finding. The near-duplicate tree codes of the
  repository-tree check (hfs.mjs) against the slot check are not part of this change.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-code-merge-required-and-test-kind.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/patterns/be/folder.yaml
  - knowledge/patterns/be/test.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/hfs/architecture/required-files.mjs
  - scripts/hfs/architecture/hfs.mjs
  - scripts/hfs/rules/test-topology.mjs
  - docs/architecture-check.md
  - packages/hfs/README.md
