id: common-agent-admission
effectiveAt: '2026-10-03T14:00:00+07:00'
summary: >-
  Kernel, Op, Supervisor, generic workers and Critic use one concrete allow-group admission contract.
  Role quality floors and independent criticism are hard gates. Every available quota window must be fresh;
  allocation.admission declares reserve and exhaustion thresholds; exhausted windows or bad auth refuse even scoped overrides.
  Unknown critical capacity cannot admit a new agent. Prefer never expands eligibility, require never silently falls
  back, and atomic fenced provider reservations survive uncertain launches until definitive reconciliation evidence.
reach: new-legs
