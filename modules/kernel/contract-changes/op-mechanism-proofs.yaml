id: op-mechanism-proofs
effectiveAt: '2026-10-01T16:00:00+07:00'
summary: >-
  EVERY OP USES THE MECHANISMS ITS JOB TOUCHES, AND SETTLE ENFORCES THE MANDATORY ONES (lane OPS2 under C0, owner 2026-10-01).
  knowledge/op-gate.yaml gains `proofs` and `opProofs`: an op named there attaches the document of each mechanism it owes and
  `api settle` re-reads it (scripts/kernel/gate-settle.mjs judgeJobProofs, runtime check op-proof); a done that lacks it, is red
  or could not run is refused. e2e.verify and integration.verify attach the test-world run summary (scripts/checks/test-world-run.mjs,
  starci/test-world-run@1: the preset's world runner, useTestWorld with apps for e2e and modules for integration, useSandbox for
  the live provider's contract run, no hand-rolled docker, container, DataSource, process.env or sleep, the outage calls counted, a
  green run with nothing skipped; integration.verify owes the integration and the contract projects and every attached summary is judged): op-test-world-proof-missing,
  op-test-world-hand-rolled, op-test-world-run-red. unit.verify attaches the unit run summary (scripts/checks/unit-run.mjs,
  starci/unit-run@1: the whole unit project green, every service at 100 on each metric with its spec beside it built by
  Test.createTestingModule over the kit doubles): op-unit-proof-missing, op-unit-run-red, op-unit-coverage-below,
  op-unit-kit-violation. security.verify attaches hfs lint and its typed findings by rule
  (starci/security-findings@1), and every finding of the security canon codes (R41, R42, R44, R49, R71, R90, R107; op-gate.yaml
  securityCodes and securityRules) must be carried: op-lint-proof-missing, op-lint-tool-failed, op-security-findings-missing,
  op-security-finding-unreported. interface.audit attaches hfs lint over the audited fe/ files and may not stand done on an fe/
  finding; interface.draw and interface.asset lint every file they produce and may not stand done on any finding: op-lint-findings. review.verify runs gate.mjs read-only over the reviewed range
  (merge guard included) in its code modes and classifies every defect business or non-business, a non-business defect no check
  caught carrying a missingCheck for .claude (starci/review-defects@1): op-gate-proof-missing, op-gate-tool-failed,
  op-gate-new-findings, op-review-defects-missing, op-review-defect-unclassified, op-review-missing-check-unrecorded.
  release.deliver attaches the release proof for a publish or a deploy (scripts/checks/release-proof.mjs, starci/release-proof@1:
  release-app-installs, check-canon-pins with the canon content digest, the merge guard over the release range, npm run check;
  none skipped): op-release-proof-missing, op-release-step-skipped, op-release-step-red. docs.author, knowledge.repair and
  work.author READ with a digest and pass the document gate (gate.mjs --profile docs over op-gate.yaml docChecks: doc-language,
  check-work-surfaces, check-work-deep, check-example-work, check-contract-cites, check-json-exceptions): op-read-digest-missing,
  op-read-digest-no-knowledge, op-doc-gate-missing, op-doc-gate-tool-failed, op-doc-gate-red. architecture.decide, scope.define,
  scope.finish, business.decide, decision.prepare and brand.decide READ the knowledge and hfs slots their decision cites
  (read-digest.mjs --knowledge) and attach the digest. workspace.manage and runtime.operate act on worktrees only through
  scripts/lib/worktrees.mjs and launch agents only through worker-start; the uat ops use the app's real dev stack. A leg admitted
  earlier settles without the proofs.
reach: new-legs
ops: [e2e.verify, integration.verify, unit.verify, security.verify, review.verify, release.deliver, docs.author, knowledge.repair, work.author, interface.audit, interface.draw, interface.asset, architecture.decide, scope.define, scope.finish, business.decide, decision.prepare, brand.decide]
adds:
  checks:
    - op-proof
  codes:
    - op-read-digest-no-knowledge
    - op-doc-gate-missing
    - op-doc-gate-tool-failed
    - op-doc-gate-red
    - op-test-world-proof-missing
    - op-test-world-hand-rolled
    - op-test-world-run-red
    - op-unit-proof-missing
    - op-unit-run-red
    - op-unit-coverage-below
    - op-unit-kit-violation
    - op-lint-proof-missing
    - op-lint-tool-failed
    - op-lint-findings
    - op-security-findings-missing
    - op-security-finding-unreported
    - op-review-defects-missing
    - op-review-defect-unclassified
    - op-review-missing-check-unrecorded
    - op-release-proof-missing
    - op-release-step-skipped
    - op-release-step-red
paths:
  - modules/kernel/contract-changes/op-mechanism-proofs.yaml
  - knowledge/op-gate.yaml
  - modules/kernel/failure-codes.yaml
  - modules/ops/registry.yaml
  - scripts/checks/gate.mjs
  - scripts/checks/read-digest.mjs
  - scripts/checks/test-world-run.mjs
  - scripts/checks/unit-run.mjs
  - scripts/checks/release-proof.mjs
  - scripts/kernel/gate-settle.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/api-verbs/settle.mjs
  - scripts/kernel/op-prompt.mjs
  - tests/op-mechanism-proofs.spec.mjs
  - tests/helpers/sonar-scan.mjs
