id: hfs-integration-specs
effectiveAt: '2026-10-01T22:00:00+07:00'
summary: >-
  Lane EX (lead C0): the todo example declared four integrations and no integration spec, and nothing noticed; the first
  integration specs then caught a real defect (FetchHttpClient classified a deadline by its prototype chain, so a timeout
  reported "unreachable"). New rule R112 BE_INTEGRATION_SPEC_MISSING (error, hfs enforcer
  scripts/lib/hfs-rules/integration-specs.mjs): every `src/modules/integrations/<provider>/` holding `<provider>.config.ts`
  has a `src/tests/integration/<provider>/*.integration-spec.ts` that, read as a TypeScript syntax tree, calls
  `useTestWorld({ modules })` with a factory registering the integration's own module (origin of the identifier, not its name),
  references the ErrorCode enum the integration exports and drives an outage through the world. dead-exports (HFS_UNUSED_EXPORT)
  counts such a spec as a consumer of its own provider's exports only, paired by the provider folder of the slots. The
  be.tests.integration and be.integrations slots name the rule. @starci/test-world 1.0.4 (world.resolve takes any Nest token) and
  1.0.5 (peer apps in a modules world, world.apps.<name>.during, w.keycloak.clientSecret) carry what the specs need.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-integration-specs.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/hfs/slots.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/lib/hfs-rules/integration-specs.mjs
  - scripts/lib/hfs-check.mjs
