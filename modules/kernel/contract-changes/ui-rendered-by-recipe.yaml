id: ui-rendered-by-recipe
effectiveAt: '2026-09-27T06:05:00+07:00'
summary: "A ui record rendered by recipe - its surface is loading, error or not-found at every breakpoint, or every state it names or draws is a data status no nonDerivable shape exempts (scripts/checks/ui-shapes.mjs recipeRenderedOf, the one rule) - has nothing to draw: interface.draw writes it done with no drawing and no owner review (SlotView, or notFound() for not-found); the check-example-work done gate needs no drawing for it; draw-review.mjs status owes nothing and names the recipe, and question refuses it. shell-conformance's DRAW_MATRIX_INCOMPLETE counts no retired composite, and COMPOSITE_MISSING reads generatedDrawingsOf, so a raster region beside a draw-render drawing owes no composite. Adds no check or finding code"
ops: [interface.draw]
reach: new-legs
paths:
  - modules/ops/ops/interface.draw.yaml
  - scripts/checks/ui-shapes.mjs
  - scripts/checks/check-example-work.mjs
  - scripts/checks/shell-conformance.mjs
  - scripts/work/draw-review.mjs
