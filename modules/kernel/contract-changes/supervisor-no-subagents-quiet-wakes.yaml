summary: "the [Supervisor] seat launches with its agent's subagent tool denied (claude --disallowedTools 'Agent,Task'; applies from its next start) and diagnoses through [Worker] jobs (worker outcome diagnosed, announced by a [report] wake); its watchdog never wakes it while it is mid-turn or its subagents still run, names what each wake is about (inbox ids, last tick, job ids) and never sends a text identical to one it already attempted. Supervisor-only: adds no op check or finding code"
