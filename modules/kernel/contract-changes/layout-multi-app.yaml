id: layout-multi-app
effectiveAt: '2026-09-29T18:00:00+07:00'
summary: "The layout tree covers every app of a frontend monorepo. work/layout-tree@1 holds apps[] (name, root, appDir, source, i18n, nodes per app) instead of one app/source/i18n/nodes; a node id is a route within its app. workspace.yaml repositories[role fe].apps declares the apps (a frontend holding several app/ directories must declare them, none is discovered by search); layout-tree.mjs scan scans each, and capture/plan/destinations take --app. A work/ui-screen@1 record binds its route in an app with `app` (optional when the tree holds one app or only one app holds the route). UI_APP_UNKNOWN and UI_APP_MISSING refuse an app the tree does not declare or a route that does not decide one; a route not in the named app is UI_ROUTE_UNKNOWN. No compatibility: a tree with the single app/source/i18n/nodes shape is not read, it is re-scanned."
reach: new-legs
adds:
  codes:
    - UI_APP_MISSING
    - UI_APP_UNKNOWN
paths:
  - scripts/work/layout-tree.mjs
  - scripts/work/compose-direction.mjs
  - scripts/work/draw-review.mjs
  - scripts/checks/shell-conformance.mjs
  - scripts/checks/brand-palette.mjs
  - scripts/checks/check-example-work.mjs
  - scripts/kernel/shell-foundation.mjs
  - modules/schemas/work-layout-tree.schema.yaml
  - modules/schemas/work-ui-screen.schema.yaml
  - modules/schemas/work-workspace.schema.yaml
  - modules/kernel/failure-codes.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/ops/interface.implement.yaml
  - modules/ops/ops/interface.scaffold.yaml
  - modules/ops/ops/brand.decide.yaml
  - docs/layout-tree.md
