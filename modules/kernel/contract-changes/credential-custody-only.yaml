  - modules/schemas/work-functional-requirement.schema.yaml
  - modules/schemas/work-gap.schema.yaml
  - modules/schemas/work-implementation.schema.yaml
  - modules/schemas/work-integration.schema.yaml
  - modules/schemas/work-non-functional-requirement.schema.yaml
