id: credential-custody-only
effectiveAt: '2026-09-29T20:00:00+07:00'
summary: >-
  An integration credential declares custody: identity:<slug> and nothing else; the retired `where` (a place, not a
  custody) is refused in every work schema block, and a declaration without custody is refused. sonar-local reads only
  the current declaration (host {local, public}, credentials[].custody), and .stacks is no longer a stack root in
  redact.mjs, sonar-local or the application-stacks credential path pattern. Product records were migrated first.
reach: new-legs
paths:
  - modules/schemas/work-brand.schema.yaml
  - modules/schemas/work-business-rule.schema.yaml
  - modules/schemas/work-contract.schema.yaml
  - modules/schemas/work-customer-journey.schema.yaml
