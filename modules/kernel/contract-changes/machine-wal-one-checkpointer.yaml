id: machine-wal-one-checkpointer
effectiveAt: '2026-09-28T23:30:00+07:00'
summary: >-
  Incident 2026-09-28 22:46: a land of 85d817621 (lane ui) moved and pushed main, then its record write and a
  read-only quick_check saw "database disk image is malformed" on machine.sqlite; minutes later integrity_check was ok
  and the ui land's ticket, lane row, push row and land_runs row were all absent. SQLite 3.50.4 (Node 25.2.1) is in the
  WAL-reset bug range (3.7.0-3.51.2): back-to-back checkpoints while another connection resets the WAL can drop a
  committed transaction. machine-db now runs wal_autocheckpoint=0 on every connection; the only checkpoint is the
  engine leader's PASSIVE checkpoint({name, holder, epoch}), fenced on the engine_leader row (a standby, draining or
  superseded engine gets {skipped}); a new leader waits a full period before its first one. A transient
  SQLITE_CORRUPT/SQLITE_NOTADB is retried after a reopen (an autocommit statement alone, a transaction as a whole,
  25/150/600 ms); a recovery is a machine_logs warn row, a persistent one throws STARCI_MACHINE_CORRUPT and is an
  incident row; readMachine rethrows it instead of answering the fallback. The land gate writes its core record as one
  idempotent recordLandOutcome (keyed on span_id); when that write fails after main moved, the land stays passed
  (recordError), the record is written again or queued in <machine.sqlite>.outbox.jsonl (recordDeferred), and the
  next land flushes the outbox inside the gate (result.outbox).
reach: new-legs
paths:
  - modules/kernel/contract-changes/machine-wal-one-checkpointer.yaml
  - engine/machine-db.mjs
  - scripts/reconciler/engine.mjs
  - scripts/supervisor/land.mjs
