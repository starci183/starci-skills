id: layout-tree-no-legacy
effectiveAt: '2026-09-29T15:30:00+07:00'
summary: "The layout tree keeps no backward compatibility. A shell record that is not work/layout-tree@1 is one refusal (SHELL_RECORD_NOT_TREE; SHELL_RECORD_LEGACY and the app-shell convert command are gone, work/app-shell@1 is no longer catalogued). extensions.destinationCaptures is refused by the schema and never read as destinations (destinations --promote and LAYOUT_DESTINATIONS_LEGACY are gone). A tree that records catalogs without the keyed digest (i18n.used.keys) is stale (LAYOUT_TREE_STALE) until layout-tree.mjs scan --write records it; LAYOUT_TREE_I18N_UNKEYED is gone. The examples/todo-app-backend shell record was re-scanned onto the keyed digest. No new code or check is added."
reach: new-legs
paths:
  - scripts/work/layout-tree.mjs
  - scripts/checks/shell-conformance.mjs
  - scripts/kernel/gate-conditions.mjs
  - modules/schemas/work-app-shell.schema.yaml
  - modules/schemas/work-layout-tree.schema.yaml
  - modules/schemas/index.yaml
  - modules/kernel/dispatch.yaml
  - modules/cli/commands/kernel/incident.yaml
  - modules/ops/ops/brand.decide.yaml
  - modules/ops/ops/interface.audit.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/ops/interface.implement.yaml
  - modules/kernel/retired-paths.yaml
  - docs/layout-tree.md
  - docs/interface-audit.md
