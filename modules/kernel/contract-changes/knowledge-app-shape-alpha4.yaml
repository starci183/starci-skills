summary: >-
  Lane KNOW (1.0.0-alpha.4): the written knowledge follows the app shape and this release. knowledge/hfs
  (README sections 1-11, the rules.yaml gates and law text, slots wording), knowledge/patterns/{repo,be,fe}
  and knowledge/op-gate.yaml name app-relative paths (be/..., fe/...), one root package.json, lockfile and
  hfs.json of kind app, .starciwork at the app root and be/.starcistacks, no front-end tests and be/contracts
  read in place; op-gate kinds map every app.* slot; docs describe the op loop, settle enforcement, the merge
  guard, the op worktree lifecycle and worker-start launches. Wording only: no check or finding code is added.
