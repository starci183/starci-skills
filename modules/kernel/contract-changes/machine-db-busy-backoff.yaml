id: machine-db-busy-backoff
effectiveAt: '2026-09-29T22:00:00+07:00'
summary: >-
  machine.sqlite writers back off on a locked database (bounded, after busy_timeout) and then throw the coded
  STARCI_MACHINE_BUSY instead of a raw SQLITE_BUSY; land.mjs acquireLand reports gate-busy with why db-busy instead of
  crashing. Adds the STARCI_MACHINE_BUSY failure code. No API verb or YAML key changes.
reach: new-legs
paths:
  - modules/kernel/failure-codes.yaml
  - modules/kernel/contract-changes/machine-db-busy-backoff.yaml
