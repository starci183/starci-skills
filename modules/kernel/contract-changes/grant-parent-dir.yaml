id: grant-parent-dir
effectiveAt: '2026-09-29T18:00:00+07:00'
summary: >-
  api enqueue and api dispatch refuse a write grant whose directory does not exist in the target repository
  (grant-parent-missing, naming the missing directory and the closest existing one); a create-new-module grant
  is declared with the new enqueue flag --new-module. A Kernel that grants a path it has not confirmed on disk
  now gets the refusal and fixes the path or declares the new module.
reach: new-legs
paths:
  - modules/cli/commands/kernel/enqueue.yaml
  - modules/kernel/failure-codes.yaml
  - modules/kernel/contract-changes/grant-parent-dir.yaml
