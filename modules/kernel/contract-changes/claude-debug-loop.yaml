id: claude-debug-loop
effectiveAt: '2026-10-01T12:00:00+07:00'
summary: >-
  Owner order 2026-10-01: `/claude-debug` is invoked once and loops through Claude Code's own `/loop <interval>
  /claude-debug pass`, the interval read from the new config.yaml block claudeDebug {interval, worktreeLimit}
  (engine/config.mjs validateConfig and claudeDebugSettings; the default lives only in config.example.yaml).
  scripts/supervisor/debug-pass.mjs records the one loop per host (setup starts none while a loop is live; a loop that
  stopped passing for 2 x interval + 5 min is stale and replaced) and the open fixes keyed by core-watch alert key, so
  each pass dispatches only new alerts (claim/note/release bind them). State lives in <state root>/claude-debug/state.json,
  not in machine.sqlite. scripts/supervisor/core-watch.mjs is a single read-only snapshot only (the forever change-stream
  mode, --once, --interval and diffFacts are removed with no alias) and now also checks orphan ledgers, worktree counts
  and orphans, main-checkout integrity (tracked deletions, empty node_modules and packages/node_modules) and failing land
  and push gates. No API verb, ledger table or module YAML key changes.
reach: new-legs
paths:
  - modules/kernel/contract-changes/claude-debug-loop.yaml
  - skills/claude-debug/SKILL.md
  - scripts/supervisor/core-watch.mjs
  - scripts/supervisor/debug-pass.mjs
  - engine/config.mjs
  - config.example.yaml
