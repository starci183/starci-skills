id: worker-accounting-orca-worker-list
effectiveAt: '2026-10-02T18:00:00+07:00'
summary: >-
  WORKER ACCOUNTING THROUGH ORCA'S WORKER-LIST (lane WLIST under C0; owner rule: never write ourselves what Orca has).
  Orca's orchestration worker-list (new wrapper scripts/api/orca/worker-list.mjs and its calls.yaml entry: --run,
  --terminal-state, --cursor, --limit; workerListAll follows page.nextCursor past 100 rows; activeWorkersAllRuns accepts
  only a listing over every Run, scope.source all) is the one source for which worker terminal is active, reclaimable,
  retained or released, its liveness and its next action. The Supervisor GC "agents" collector (scripts/supervisor/gc.mjs)
  lists every Orca Run the ledgers and the Supervisor's jobs name, Run by Run with --run, and releases a reclaimable
  worker whose liveness is live or exited and whose literal nextAction is worker-release of that Dispatch
  (scripts/lib/worker-accounting.mjs releasePlan); an unverifiable, release_unknown or otherwise-directed row is reported
  (WORKER_RELEASE_REFUSED) and never touched; the reconciler GC sweep raises ONE owner Decision Item (key
  gc-unverifiable-workers) listing every unverifiable worker's terminal handle, Run and age, so none is left silent; a failed release is WORKER_RELEASE_FAILED; a Run whose listing failed
  touches none of its workers (WORKER_LIST_UNAVAILABLE). The title-regex and screen identification of worker terminals
  is deleted ([Worker]/[Kernel]/[Op]/[Supervisor] titles, the staging path on screen, workflowsNamed, the ownerless-lane
  matching and its Supervisor Decision Item): a terminal Orca accounts for is Orca's, a terminal the ledgers bind by
  handle to a settled job or an ended workflow and Orca does not account for is closed and verified as before, and the
  shells collector is kept. The reconciler GC controller's entity events release the entity's reclaimable workers through
  worker-release (scripts/api/orca/worker-release.mjs, through ctx.run). The lane-owner rule (scripts/lib/lane-owner.mjs)
  is an active Orca worker whose resource.worktreeId is the lane, or a non-final Supervisor job registered for it; an
  Orca that does not answer for every Run removes nothing. check-orca-tree (and the Supervisor poll's tree) counts a
  terminal as StarCi's when the ledger names it or Orca accounts for it as a worker of the ledger's Runs (--workers
  <worker-list receipt> with --terminals; --live lists them); a [Kernel]/[Op] tab title proves nothing. The host
  controller's TERMINAL_COUNT_DRIFT measures Orca's terminals against Orca's active workers over every Run plus
  terminalSlack, instead of the ledgers' seats and running jobs. machine.sqlite 0004-terminals-shells-only
  (MACHINE_VERSION 4) keeps in terminals only the GC's shell sightings (role shell/other: handle, title, opened_at,
  closed_at, close_verified_at, closed_by); the worker columns and worker rows go, v_seats loses its terminal join and
  v_leaks its terminal branch; openTerminals is deleted. The UI reads an attempt's and a workflow's op terminals from the
  ledger's op_attempts. Kept (the runtime's own, Orca has no equivalent): the admission counts (ram-throttle slot
  counting includes leased slots Orca never sees; the Supervisor's adaptiveCap counts spawning jobs before worker-start).
reach: new-legs
