id: hfs-rules
effectiveAt: '2026-09-29T23:10:00+07:00'
summary: >-
  HFS Phase 0 item 0.2. Adds knowledge/hfs/rules.yaml, the machine-readable catalog of the 67 HFS rules R01-R67 (id,
  finding code, Vietnamese title, the law in one line, fix kinds, gates pre-commit/pre-push/settle/land/ci/sonar, failure
  codes and every enforcer: eslint-be and eslint-fe rule ids, stylelint, architecture machine, hfs, work-validate and
  sonar checks; an enforcer still owed carries status: planned), its schema modules/schemas/hfs-rules.schema.yaml, and the
  loader loadRuleCatalog / rules() in scripts/lib/hfs-slots.mjs (also openHfs().rules()). scripts/checks/check-hfs-rules.mjs,
  wired into npm run check, refuses a rule with no enforcer, an existing eslint id the plugin does not ship, a planned one it
  already ships, an existing machine/hfs/work-validate enforcer whose file is missing or emits none of the rule's codes,
  and a failure code with no Vietnamese title, meaning and next step. The failure-code scanner also reads rules.yaml, so a
  rule whose checker is still owed keeps its code in the catalog. New failure codes: the codes of every rule that had none
  (R01-R67 except those the canon-be lane already catalogues), FE_NEXT_CONVENTIONS, FE_STYLE_SOURCE_UNRESOLVED,
  HFS_RULES_INVALID, HFS_RULE_NO_ENFORCER, HFS_RULE_ENFORCER_MISSING, HFS_RULE_ENFORCER_STALE and
  HFS_RULE_CODE_UNCATALOGUED. Lands after lane/hfs-canon-be (its 13 codes and the eslint-be rule ids) and
  lane/hfs-canon-fe (the eslint-fe rule ids).
reach: new-legs
paths:
  - knowledge/hfs/rules.yaml
  - knowledge/index.yaml
  - modules/schemas/hfs-rules.schema.yaml
  - modules/schemas/index.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/lib/hfs-slots.mjs
  - scripts/checks/check-hfs-rules.mjs
  - scripts/checks/failure-codes.mjs
  - tests/hfs-rules.spec.mjs
  - package.json
