id: guard-worktree-delete-launch
effectiveAt: '2026-10-01T23:00:00+07:00'
summary: >-
  The op command guard (scripts/guards/command-guard.mjs, the PreToolUse hook bound to an op's Orca terminal) enforces at
  tool level the rules lane OPS2 left as text (workspace.manage, runtime.operate). Through every wrapper it opens (cmd /c
  and //c, powershell -Command/-EncodedCommand/-File, bash -c, env, xargs, npx/bunx) and every chain it refuses: a raw
  `git worktree add|move|remove` with any flags including -C <dir> (WORKTREE_NOT_OPS, its remedy now names the runtime
  worktree API: scripts/lib/worktrees.mjs createWorktree/removeWorktree, safeRemoveWorktree, the op worktree lifecycle); a
  recursive delete - rm -r/-rf/-fr/-R/--recursive, rmdir|rd /s, del|erase /s, robocopy /MIR|/PURGE, Remove-Item -Recurse
  and its PowerShell aliases ri/rm/del/erase/rd/rmdir (RECURSIVE_DELETE, remedy: safeRemoveTree in
  scripts/lib/safe-remove.mjs; one junction with `cmd /c rmdir <path>`, no /s); a kill by image name, unchanged
  (PROCESS_KILL_BY_NAME, taskkill /IM|/FI and pkill covered in every shell); a raw terminal create
  (RAW_TERMINAL_CREATE) and a headless agent CLI - codex exec|e, claude|cursor-agent|devin -p/--print, gemini
  -p/--prompt, opencode run (AGENT_HEADLESS_LAUNCH), both with the remedy scripts/api/orca/worker-start.mjs (orchestration worker-start
  --agent <provider>). No false positives: rm <file>, git worktree list, cmd /c rmdir <junction>, taskkill /PID, worker-start and
  text that only mentions a refused command pass; the tokenizer now skips a bash heredoc body (still running an unquoted
  body's $(...)) and keeps PowerShell's $true/$false/$null literal. No runtime script needs an exception: the runtime's
  only `git worktree add` is scripts/lib/worktrees.mjs createWorktree (scripts/checks/check-worktree-add.mjs), and node
  child processes never pass through the agent's PreToolUse hook. modules/ops/_common.yaml states the rules for every op.
reach: new-legs
paths:
  - modules/kernel/contract-changes/guard-worktree-delete-launch.yaml
  - scripts/guards/command-guard.mjs
  - scripts/guards/git-policy.mjs
  - modules/ops/_common.yaml
  - modules/kernel/failure-codes.yaml
  - tests/command-guard-rules.spec.mjs
