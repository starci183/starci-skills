id: hfs-be-round3b
effectiveAt: '2026-09-30T09:00:00+07:00'
summary: >-
  HFS back-end round 3 catch-up and fix (owner-approved 2026-09-29: locale resolution, inbox-dedupe consumer
  detection by shape, and the inbox_claims table). The round-3 landing (R78-R82) bumped `@starci/eslint-canon-be`'s
  own package.json to 1.6.0 but left the `nest` code-pattern profile's canon version and content digest at the
  round-2 values, and added no prose pattern docs or obligation mapping for the five new rules; this entry closes
  both gaps and lands three owner decisions.
  Gap 1: `modules/models/code-patterns.yaml` `profiles.nest.canon` now carries the correct digest of
  `packages/eslint/be` computed with the same `packageIdentity` hashing utility earlier rounds used
  (`scripts/checks/check-scoped-lint.mjs`), and two new `obligations` entries (`NEST-USER-COPY-CATALOG`,
  `NEST-RESILIENT-DELIVERY`) plus two `semanticOnly` entries (`NEST-LOCALE-RESOLUTION`, `NEST-INBOX-CLAIM-STORAGE`)
  map every new BE-* rule id into a declared obligation or semantic review, keeping the profile's inventory
  invariant (`checkedProfile` in check-scoped-lint.mjs) satisfied for every downstream repository.
  Gap 2: five new prose pattern docs under `knowledge/patterns/be/` (`knowledge/patterns/be/messages.yaml`
  BE-MESSAGES-1/2, `knowledge/patterns/be/temporal.yaml` BE-TEMPORAL-1, `knowledge/patterns/be/idempotency.yaml`
  BE-IDEMPOTENCY-1/2, `knowledge/patterns/be/resilience.yaml` BE-RESILIENCE-1, and
  `knowledge/patterns/be/persistence.yaml` gains BE-PERSISTENCE-6), each cross-linked to R78-R82, registered in
  `knowledge/patterns/be/index.yaml`.
  Decision (a): `platform/i18n` exposes a `RequestLocale` provider. Inside a request, locale is the authenticated
  user's stored preference, else the first of vi/en named in `Accept-Language`, else `vi`. Outside a request (a job,
  a notification), locale is the message recipient's stored preference, else `vi`. `MessageCatalog.get` takes the
  resolved locale explicitly; no call site guesses.
  Decision (b): `inbox-dedupe-required` no longer relies only on the `<event>.consumer.ts` filename. A method
  decorated `@EventPattern`/`@MessagePattern`/`@OnEvent`/`@Process`, or a class named `*Consumer`/`*OutboxConsumer`,
  is a consumer wherever the file sits; an outbox producer (`*-outbox.service.ts` / `*OutboxService`, which only
  publishes) is not flagged unless it also consumes. `@starci/eslint-canon-be` becomes 1.6.1 for this fix, with
  updated RuleTester specs (not run).
  Decision (c): the shared inbox is one table, `inbox_claims(id uuid pk, source text, event_id text, claimed_at
  timestamptz)`, unique on `(source, event_id)`, owned by `platform/inbox` persistence, created by a migration using
  `IF NOT EXISTS`.
  The cook-round X-PATTERNS reference doc (outside this repository, under the hfs cook-round working tree) has its
  round-3 section updated to carry these decisions, replacing its earlier "default to vi and flag it" placeholder
  for locale and its R80 helper description, and gains a Z-AMENDMENTS note for the z01/z19 task-queue blocks there,
  which still tell an agent to guess the locale mechanism; the queue files themselves are left untouched per the
  cook-round's append-only rule for a live feeder.
reach: new-legs
