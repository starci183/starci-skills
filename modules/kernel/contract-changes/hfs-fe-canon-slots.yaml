id: hfs-fe-canon-slots
effectiveAt: '2026-09-30T20:00:00+07:00'
summary: >-
  Lane F0 (FE coverage): @starci/eslint-canon-fe 6.0.0 is attached like the back end, `export default starciFeConfig({ hfs:
  loadHfs(import.meta.url) })`: the factory owns the files (every app's and every package's src/, the e2e tree), typed linting
  on the source (projectService), the ignores, every rule and React Hooks rule at error, and settings.starci.hfs - the slot view
  (scripts/lib/hfs-view.mjs, bundled into both eslint packages by sync-runtime) every path-scoped rule asks. The `layout`
  option, LAYOUT_GLOBS and the effective-config audit (lint-adoption law) are deleted: the managed one-liner compared by hfs
  check (R17) is the proof no rule is off. Slots: fe.package.api (+ fe.package.api.client/outcome) and fe.package.i18n hold the
  one transport client, the one Outcome union and the one next-intl stack a repository shares across its apps;
  fe.transport.client/outcome name a one-app repository's own; fe.modules.api is optional (requires index.ts) and
  fe.modules.i18n requires only index.ts; ruleParams.fe.clientModule is deleted (the client is a slot).
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-fe-canon-slots.yaml
  - knowledge/hfs/slots.yaml
  - modules/schemas/hfs-slots.schema.yaml
  - scripts/lib/hfs-slots.mjs
  - scripts/lib/hfs-view.mjs
  - packages/hfs/scripts/sync-runtime.mjs
  - packages/eslint/fe/index.mjs
  - packages/eslint/fe/lib/config.mjs
  - packages/eslint/fe/lib/hfs.mjs
  - packages/eslint/fe/lib/types.mjs
  - packages/eslint/be/lib/hfs.mjs
