id: autopilot-run-to-finish
effectiveAt: '2026-09-28T02:16:00+07:00'
summary: "Owner ruling 2026-09-28 (owner-rulings autopilot-run-to-finish): AUTOPILOT, default ON for every running workflow (runtimes.yaml allocation.autopilot, per-workflow override workflows.<id>.enabled or api autopilot --set). scripts/kernel/autopilot.mjs: every api status (so every watchdog tick) and api serve-ask hand each pending ask to autopilot - a draw-review / brand-direction-review ask whose machine gates pass (draw loop metrics with the DNA gate, independent critic beauty >= drawLoop.beautyMin, rationale.json; the direction checks and golden bytes) is answered PROVISIONALLY (receipt answeredBy autopilot, provisional:true, acceptance {provisional, by: autopilot, receipt: <gate evidence>}; event autopilot-provisional); failing gates answer redraw/revise with the findings (redrawBudget per record, a stale ask spends none, then deferred); a recommended business choice is taken provisionally; credential / real-money / shared-system / owner-only asks are deferred-to-handover (nothing sent, sandbox/stub path + owed proof recorded). draw-review.mjs apply writes a provisional acceptance (never golden; drawReviewStatus owes nothing now, owedAtHandover); brand-direction.mjs apply writes brand.direction.archetypes.<name>.provisional (work/brand@1 schema), brand.mjs checkDirection evidence.provisional validates its autopilot receipt (the direction-unaccepted prerequisite itself is relaxed by the op-draw lane's provisional readiness). Retry caps and needUser environment routes open supervisor-gate incidents with the attempts' evidence (settle.nextStep kind supervisor-gate; supervisorExtraBudget gates, then nextStep kind deferred), an authority blocker is deferred to handover, api incident --kind owner-gate is recorded as supervisor-gate, status re-routes open owner gates, frontier-parked.mjs counts jobs held by a supervisor-gate or deferred as no open Kernel work, a supervisor-gate past supervisorGateTimeoutMs defers what it holds, a spent budget (attempts/tokens/wall) opens one supervisor-gate holding ['*']; scripts/supervisor/poll.mjs lists supervisor-gate. 'Limit provision asks': api enqueue refuses a mid-flow provision.ask (autopilot-provision-deferred); nextActions proposes provision.ask only as the ONE end-of-flow credential checklist (params.subject handover-credentials, api autopilot --checklist); live proofs needing a deferred value read queuedBecause deferred-to-handover (dispatch refuses them) and resume once the owner's checklist answer supersedes the credential asks. Status: autopilot {on, provisional[], deferred[], deferredToHandover[], supervisorGates[], budget, checklist?, sweep?}; legs colour green-provisional (label 'self-accepted provisionally') and deferred; queuedBecause supervisor-gate|deferred|deferred-to-handover; nextActions kind supervisor-gate; frontier state supervisor-wait; handover due counts deferred legs. handover.review's ask must carry question.autopilot (the 'backlog awaiting the owner's review' bundle, api survey --deliveries .autopilot); api autopilot --reopen re-opens one provisional item from a verified owner handover answer. New verb api autopilot. owner-answers.mjs: a brand-direction review repeats only by its text. settle's root-verify also resolves a rootCause.node that is a Work record id (not <op>#...) to the job owning that record (nivo auth uat.verify named impl.login.nivo-backend.session-custody five times while the route re-ran the same UAT). UI: leg colours green-provisional and deferred in the contract vocabulary. Owner-claim guard unchanged: an autopilot receipt is never an owner answer. Adds no op check or finding code"
reach: new-legs
