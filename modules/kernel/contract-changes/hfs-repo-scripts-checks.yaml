id: hfs-repo-scripts-checks
effectiveAt: '2026-10-01T00:30:00+07:00'
summary: >-
  Owner decision 2026-09-30: a product repository keeps no check, test or lint source of its own, so the laws the deleted root scripts held
  move into the runtime. Slot repo.scripts now owns scripts/{.gitkeep,*.mjs,*.cjs,*.ps1,*.sh} (operational scripts, or an empty folder with
  .gitkeep, which hfs sync --init writes). New rules, all error, hfs enforcers: R98 BE_SPEC_PLACEMENT (a spec or test file outside the four test
  layers is a finding, scripts/ and tools/ included), R99 HFS_REPO_LOCAL_CHECK (a check-* file in scripts/ or tools/, an eslint-local-rules* file
  or local eslint plugin, a package script that runs a local check), R100 HFS_LINT_SUPPRESSION_FILE (an eslint.suppressions* file, a
  lint:suppressions script, an eslint suppress flag, a suppressions configuration), R101 HFS_PROOF_COMMAND_FILE_MISSING (a .starciwork
  requiresProof command that runs a file the repository does not hold; only records of the repository itself are judged). R14
  HFS_DEP_VERSION_SKEW also refuses a dependency declared at another version than its root overrides pin. ruleParams.be.infraOwners names
  @nestjs/cache-manager (the retired local rule must-use-cache-service). Rule ids may have three digits (numeric order).
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-repo-scripts-checks.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - scripts/lib/hfs-rules/spec-placement.mjs
  - scripts/lib/hfs-rules/repo-local-checks.mjs
  - scripts/lib/hfs-rules/lint-suppression.mjs
  - scripts/lib/hfs-rules/proof-commands.mjs
  - scripts/lib/hfs-rules/deps.mjs
  - scripts/lib/hfs-check.mjs
  - packages/hfs/templates
