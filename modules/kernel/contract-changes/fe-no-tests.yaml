id: fe-no-tests
effectiveAt: '2026-09-30T23:30:00+07:00'
summary: >-
  Owner decision 2026-09-30: a front end has no tests, with no exception and no deferral. New rule R97 FE_NO_TESTS (hfs
  enforcer fe-no-tests, error): in a front-end repository any *.spec.*, *.test.* or *-spec.* file, e2e/, __tests__/,
  __mocks__/ or test-support/ directory, vitest, jest, playwright or cypress config or setup file, tsconfig.e2e.json, e2e
  workflow, test script (test, test:*, or a script running a test runner) and test dependency (runner, environment,
  testing-library, axe) in any package.json is a finding, scripts/ included; it is the only finding of such a path (the slot
  check and the root-entry check leave it alone). Retired: R66 FE_E2E_SHAPE and R67 FE_SPEC_QUALITY with eslint-canon-fe 7.0.0
  (14 test rules, the e2e config block and every spec/e2e exemption removed), the FE spec code-pattern checks
  (FE_SPEC_SUBJECT_AND_DESCRIBE, FE_SPEC_NO_SNAPSHOT) and knowledge/patterns/fe/test.yaml; rule ids may now have gaps and a
  retired id is never reused. hfs sync renders no vitest.config.ts, tsconfig.e2e.json, e2e.yml or codecov.yml for a front end,
  its package scripts have no test scripts, its hooks and ci.yml no test or codecov step, its sonar file no test lines, its root
  tsconfig.json excludes only node_modules; slots fe.e2e, fe.e2e-support(.i18n) are deleted, codecov.yml is the back-end slot
  be.codecov; @starci/vitest-preset and @starci/playwright-preset are deleted. The FE examples lose their tests.
reach: new-legs
paths:
  - modules/kernel/contract-changes/fe-no-tests.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - scripts/lib/hfs-rules/fe-no-tests.mjs
  - scripts/lib/hfs-check.mjs
  - packages/hfs/templates/fe
  - packages/eslint/fe
