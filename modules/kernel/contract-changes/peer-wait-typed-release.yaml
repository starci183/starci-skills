id: peer-wait-typed-release
effectiveAt: '2026-09-26T20:30:00+07:00'
summary: "starci-next sn-subscription inc-6156f4a868e9 (part 2): the supervisor stall check (scripts/supervisor/stall.mjs judgePeerWait) read the job ids a peer-wait's text and refs name, never its typed until set, and followed no retry lineage, so a wait whose until-job already followed the running retry head read STALE-PEER-WAIT once the named attempt (or any op id in the text) settled. A typed wait is now judged by its until set alone, through the runtime's own typedIncidents + evaluateCondition (stall.mjs typedRelease): stale when every condition holds (the runtime has not resolved it yet) or one can no longer hold; an untyped wait keeps the text/refs rule with each job at its lineage head. The PEER-WAIT line names the until conditions. Adds no op check or finding code"
paths:
  - scripts/supervisor/stall.mjs
  - modules/kernel/api.yaml
  - modules/kernel/driver-loop.yaml
  - modules/supervisor/supervise.yaml
  - tests/peer-wait.spec.mjs
reach: new-legs
