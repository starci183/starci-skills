id: lint-typed-app-root-bound
effectiveAt: '2026-10-02T08:00:00+07:00'
summary: >-
  THE TYPED LINT NEVER READS TYPES ABOVE THE APP ROOT (lane GUARDS under C0, 3.3). gate-tsc-app-root-bound bounded the gate's
  tsc programs and left the lint step open: typescript-eslint's projectService builds its server host from tsserver.sys and
  exposes no host through parserOptions (8.71), so a typed rule could still read types from an enclosing repository's
  node_modules. `hfs lint` now starts ESLint with `node --require packages/hfs/lint/bound-sys.cjs` and STARCI_LINT_BOUND set
  to the app root. The preload patches `sys` of the app's own TypeScript (typescript/lib/tsserverlibrary and typescript) in
  place, before ESLint loads the parser: fileExists, directoryExists, readFile, getDirectories and readDirectory answer only
  for paths inside the app root and TypeScript's own lib directory, and realpath is the identity, the same bound the gate's
  tsc programs use. Nothing is patched when the variable is unset or TypeScript is not installed. No config switch turns the
  bound off.
reach: new-legs
paths:
  - modules/kernel/contract-changes/lint-typed-app-root-bound.yaml
  - packages/hfs/lint/bound-sys.cjs
  - packages/hfs/lint/run.mjs
  - tests/packages-hfs/hfs-lint-bound.spec.mjs
