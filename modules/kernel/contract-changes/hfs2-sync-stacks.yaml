id: hfs2-sync-stacks
effectiveAt: '2026-09-30T03:00:00+07:00'
summary: >-
  hfs.json gains the optional field stacks, front end only: a relative path to the sibling back-end repository that owns
  the .starcistacks declaration (for example ../nivo-backend). hfs sync reads a front-end repository's Sonar key from
  that declaration under the front end's own repository name, so the key has one source; a stacks path with no
  declaration behind it is HFS_SYNC_SONAR_KEY. A back-end repository may not carry stacks. modules/schemas/hfs-repo.schema.yaml
  and resolveRepoDeclaration accept the field. The package parses the declaration with its bundled YAML parser, not
  a yaml package, because the linked package installs without node_modules.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs2-sync-stacks.yaml
  - modules/schemas/hfs-repo.schema.yaml
  - scripts/lib/hfs-slots.mjs
  - packages/hfs/sync
