id: work-hygiene-gate
effectiveAt: '2026-09-29T20:00:00+07:00'
summary: >-
  Two failure classes slipped through on 2026-09-29: YAML the runtime loader cannot parse (a colon-space inside a
  plain scalar) was committed to product .starciwork and to .claude knowledge, and literal usernames and passwords sat
  in product accounts.yaml files with no check to flag them. scripts/checks/work-hygiene.mjs is now the one check
  (parse every .starciwork YAML with engine/yaml.mjs, work-validate --strict over each touched record directory judged
  only on the touched files, secret scan of every non-.enc file under .starciwork and .starcistacks). It runs at two
  points. The pre-commit hook scripts/guards/install.mjs ensureWorkHook installs beside the history hook refuses a
  commit whose staged files fail it (staged records only; e2e never runs there; config guards.workHook false switches
  it off). api settle runs it over the files a pass changed (report files plus the files its commits changed since its
  base) and refuses a red one work-hygiene-red before anything is written. A leg admitted before this change settles as
  admitted. check-module-yaml.mjs now parses knowledge/**/*.yaml as well as modules/**/*.yaml, so npm run check catches a
  broken knowledge file before land.
reach: new-legs
adds:
  codes:
    - WORK_YAML_UNPARSEABLE
    - WORK_VALIDATE_REFUSED
    - WORK_SECRET_FILE
    - WORK_SECRET_PATTERN
    - WORK_SECRET_LITERAL
    - WORK_ACCOUNT_LITERAL
paths:
  - scripts/checks/work-hygiene.mjs
  - scripts/checks/check-module-yaml.mjs
  - scripts/guards/install.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/api-verbs/settle.mjs
  - modules/cli/commands/kernel/settle.yaml
  - modules/kernel/failure-codes.yaml
  - modules/kernel/contract-changes/work-hygiene-gate.yaml
  - tests/work-hygiene.spec.mjs
  - tests/check-module-yaml.spec.mjs
