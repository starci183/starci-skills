id: ask-kinds-credential-approval
effectiveAt: '2026-09-25T19:00:00+07:00'
summary: "Two ask kinds, never mixed (owner, 2026-09-25): scripts/kernel/serve-ask.mjs askClassOf classifies an ask approval (handover, draw review, options or picks, a declared non-credential kind) or credential (kind credential/account/access/consent, or credential fields with no options). api serve-ask (parkAsk) pushes an approval ask to Telegram as before and only lists a credential ask (ask-notified via creds, askClass; notifyAsk push:false). api status frontier gains credentialAskDispatches: a credential ask holds only the live-proof legs (isLiveProofOp), so it parks the frontier at awaiting-owner only when every approved leg still owed is a live proof; otherwise the frontier reads orphaned-frontier and names the legs to enqueue with placeholders. The Telegram bridge /asks lists approval asks only, /creds lists credential asks in one message (cred:<key> buttons), both over the connector repos plus config supervisor.repos; the /status report and the owner stall digest count credential asks in one /creds line, and a workflow parked on credential asks alone never makes a digest due. Adds no op check or finding code"
paths:
  - scripts/kernel/serve-ask.mjs
  - scripts/kernel/api.mjs
  - scripts/connectors/telegram.mjs
  - scripts/connectors/telegram-bridge.mjs
  - scripts/connectors/lib.mjs
  - scripts/supervisor/progress-report.mjs
  - scripts/supervisor/stall.mjs
  - scripts/supervisor/stall-alert.mjs
  - modules/kernel/driver-loop.yaml
  - modules/kernel/api.yaml
  - modules/supervisor/supervise.yaml
reach: new-legs
