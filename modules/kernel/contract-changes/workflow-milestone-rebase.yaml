id: workflow-milestone-rebase
effectiveAt: '2026-10-02T06:30:00+07:00'
summary: >-
  A WORKFLOW BRANCH IS REBASED MID-WORKFLOW AT MILESTONES (WFWT2 2.1). Before, only the finish rebased the workflow branch
  onto main, so a long workflow met every conflict at the end, after review.verify. Now api settle, after a green
  checkpoint (scripts/kernel/workflow-checkpoint.mjs settleCheckpoint), calls milestoneRebase: it reads the facts and the
  pure policy scripts/lib/rebase-milestone.mjs decides - not-idle (another op of the workflow is live: never), up-to-date,
  conflict-known (this main tip already conflicted), overlap (main changed a path the branch changed: due), behind (main
  is worktrees.rebaseMilestoneBehind commits past the merge-base, default 20, modules/kernel/product-land.yaml: due), else
  quiet. A due rebase runs rebaseWorkflow and the checkpoint follows the new head. A conflict leaves the branch where it
  was, keeps its head as refs/heads/preserved/<workflowId>/rebase-<main sha 12> (the existing preserved-ref prefix; it is
  also what makes the same main tip conflict-known) and opens one Decision Item of the new kind rebase-conflict (decider
  kernel, escalated to the Supervisor on the usual ladder; idempotency key per main tip, a newer tip supersedes it). The
  result is recorded as the milestone field of the settle's workflow-checkpoint event. It never refuses the settle; the
  finish's rebase stays the hard stop (workflow-finish-rebase-conflict).
reach: new-legs
paths:
  - modules/kernel/contract-changes/workflow-milestone-rebase.yaml
  - scripts/lib/rebase-milestone.mjs
  - scripts/kernel/workflow-checkpoint.mjs
  - scripts/kernel/verbs/settle.mjs
  - scripts/machine/decisions.mjs
  - scripts/machine/worktree-registry.mjs
  - modules/kernel/product-land.yaml
  - modules/kernel/failure-codes.yaml
  - docs/workflow-kernel.md
  - tests/kernel/workflow-rebase-milestone.spec.mjs
