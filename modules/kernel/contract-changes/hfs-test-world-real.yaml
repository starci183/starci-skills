id: hfs-test-world-real
effectiveAt: '2026-10-01T10:00:00+07:00'
summary: >-
  Owner refinement 2026-09-30 of the test policy (BE-CONVENTION 1.16, R47). Every service of the repository's own stack
  definition (.starcistacks/<env>) runs REAL in the test world - Postgres, Redis, Keycloak with the realm imported as the dev
  stack imports it, a mail host when the stack declares one, k3s through k3d plus a local registry when the app drives
  Kubernetes; only an external SaaS the team does not operate is faked at the network edge (fakes/<provider>/). Failure
  injection on real infrastructure goes through toxiproxy (world.infra.<service>.latency(ms), .cut(), .restore(); no
  interruptDatabase, no per-service interrupt). The world's services and image versions come from the stack at run time, and a
  warm stack (attach when it answers, tear down only what setup started) is supported. All of that is implemented by the
  test-world library (@starci/test-world, test-world.config.ts with `stacks` and `fakedBy`); this change is the law, the
  convention text and the machine check. R47 test-world-files (BE_TEST_TOPOLOGY) refuses a fakes/<provider>/ that fakes a
  service the stack declares. One owner-approved exception: a stack service that is stateless compute needing special
  hardware or an external model (GPU inference, a self-hosted embedding model) may be faked when test-world.config.ts
  declares it in fakedBy with a non-empty reason; a stateful kind (database, cache, identity, storage, mail, queue, search) or
  a service with a persistent volume is never accepted, and a fakedBy entry naming a missing stack service or fake folder is
  refused. jest-preset is unchanged.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-test-world-real.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/be/test.yaml
  - scripts/lib/stack-services.mjs
  - scripts/checks/architecture/test-world-files.mjs
  - packages/eslint/be/test-world.mjs
  - packages/hfs/CHANGELOG.md
  - tests/architecture-test-world-files.spec.mjs
