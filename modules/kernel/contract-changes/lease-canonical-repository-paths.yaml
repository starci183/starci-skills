id: lease-canonical-repository-paths
effectiveAt: '2026-09-25T12:40:00+07:00'
summary: "durable path leases compared the owned-path strings, so one file spelled two ways was admitted twice: nivo Modules enqueued apps/app/src/messages/vi.json bare (--repository fe) while fe-debt enqueued nivo-fe/apps/app/src/messages prefixed with the fe repository's name, and neither fenced the other (nivo wf-nivo-fe-debt-mug06w7h inc-52a4a5ee5b12). In a bound project (.workspaces/projects/<p>/work.json) every owned path now resolves through the resolver dispatch places workers with (scripts/kernel/target-repo.mjs ownedPathPlacements: repository:<id>/, a bound repository's name, an absolute or ../ path, a Work path to the Work owner, else payload.repository or a frontend op's fe side) to repository:<role>/<path> (scripts/kernel/lease-canon.mjs); api dispatch takes its leases in that form, and route/dispatch/status/reconcile and reserveTwoPhase (canonicalOf) compare both sides in it (engine/admission.mjs leaseCompareForm), case-insensitively on Windows. Transition: a held row taken before this change keeps its stored spelling and is canonicalized through its holder job's payload at comparison time, so old bare and old prefixed leases still conflict with new requests. The same relative path in another repository never overlaps. An unbound repository keeps the paths as written (no change). The enqueue peerOverlap heads-up compares in the same form. Adds no check or finding code"
paths:
  - engine/admission.mjs
  - engine/ledger-db.mjs
  - scripts/kernel/lease-canon.mjs
  - scripts/kernel/api.mjs
  - modules/kernel/api.yaml
  - tests/lease-canonical-paths.spec.mjs
reach: new-legs
