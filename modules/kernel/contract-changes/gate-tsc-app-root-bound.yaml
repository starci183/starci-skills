id: gate-tsc-app-root-bound
effectiveAt: '2026-10-01T22:00:00+07:00'
summary: >-
  THE GATE'S TYPE-CHECK NEVER RESOLVES ABOVE THE APP ROOT (lane BOUND under C0). The runtime's main checkout lives inside
  the host repository, so a type-check of an example app silently resolved packages from the host's node_modules (before
  the examples had their own install, main measured 734 fewer errors than a bounded check): an ambient dependency leak that
  makes a tree look greener than it is. scripts/checks/gate.mjs now bounds both tsc programs, head and base, to the
  project's app root (appRootOf: the nearest directory up to --root holding hfs.json of kind app, else the app whose side
  folder --root is, else the nearest lockfile root, else --root). Their compiler host and parsed-config sys (fileExists,
  directoryExists, readFile, getDirectories, readDirectory, getSourceFile, realpath) answer only for paths inside it,
  TypeScript's own lib directory and the head buildinfo; realpath is the identity and preserveSymlinks is on, so a junctioned
  install inside the app stays inside it. An import only an enclosing repository installs is TS2307. TypeScript itself is
  loaded from the first node_modules/typescript between the project and the app root, never above it. NO INSTALL, NO
  MEASUREMENT: a project whose app root (or side) has no node_modules, or no typescript inside it, is GATE_INSTALL_MISSING,
  exit 2, never compared and never a pass. The installed-canon check resolves the canon inside the same app root, so a
  canon in an enclosing node_modules is CANON_INSTALL_MISSING. The tsc cache keys carry the bound method (bounded-v1), so a
  result measured unbounded is never reused. The lint step is not bounded: typescript-eslint's projectService (8.71) builds
  its server host from tsserver.sys and exposes no host through parserOptions, so a typed rule can still read types from an
  enclosing node_modules; an unresolved import in a changed file of a tsconfig project is still reported by the bounded tsc
  step of the same run, so the gate is
  never green on such an import.
reach: new-legs
paths:
  - modules/kernel/contract-changes/gate-tsc-app-root-bound.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/checks/gate.mjs
  - tests/op-gate-loop.spec.mjs
