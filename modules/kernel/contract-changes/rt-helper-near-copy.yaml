id: rt-helper-near-copy
effectiveAt: '2026-10-02T17:00:00+07:00'
summary: >-
  Smell wave S3-02 to S3-06: scripts/checks/check-helper-once.mjs also refuses a top-level function of 30 or more normalised
  tokens that is 80% alike (token 3-gram Dice) to a function of another file (RT_HELPER_NEAR_COPY), whatever the names or
  small edits. The cluster has one home, the exported lib helper or the first path; the other members import it. Every
  finding in the tree is fixed with the check: local path normalisers, yaml readers, walkers, hashes, escapers, move helpers
  and argument parsers import the scripts/lib helper.
reach: new-legs
adds:
  checks: [check-helper-once]
  codes: [RT_HELPER_NEAR_COPY]
paths:
  - modules/kernel/contract-changes/rt-helper-near-copy.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/runtime-slots.yaml
  - scripts/checks/check-helper-once.mjs
  - tests/checks/check-helper-once.spec.mjs
