id: runtime-db-clean-slate
effectiveAt: '2026-09-28T21:00:00+07:00'
summary: "alpha.3 clean slate for runtime.sqlite (ARCHITECTURE-DB §4, DBTREE.sql PHẦN A). The ledger DDL is engine/migrations/runtime/0001-init.sql executed as is (meta.schema starci/runtime@1, user_version 1, STRICT tables, the workflow/job/unit state machines, append-only, try_budget and retry_of guards as triggers, the v_* views). engine/schema.sql, engine/evidence.sql and engine/triggers.sql are deleted, and with them every migrator, backup-migration and backfill path; a ledger of any other schema is refused with a pointer to the comeback. engine/ledger-db.mjs is the ONE writer: typed write functions per table group, the events digest chain computed in JS (sha256(prev_digest||event_id||kind||payload_json||created_at) per workflow), idempotency through api_requests, trace/span ids passed through. Connection policy: WAL (refused otherwise), busy_timeout 15000, foreign_keys, trusted_schema OFF, wal_autocheckpoint 0 on every connection but the one checkpointer, read-only handles with query_only for readers, sqlite_version recorded in meta and a downgrade refused. Adds no check or finding code"
reach: new-legs
paths:
  - engine/ledger-db.mjs
  - engine/admission.mjs
  - engine/migrations/runtime/0001-init.sql
  - modules/kernel/api.yaml
  - modules/kernel/dispatch.yaml
  - modules/kernel/driver-loop.yaml
  - modules/kernel/verdict-contract.yaml
  - modules/kernel/retired-paths.yaml
  - modules/kernel/api-commands/artifacts.yaml
  - modules/kernel/api-commands/logs.yaml
  - modules/kernel/api-commands/reconcile.yaml
  - modules/kernel/api-commands/settle.yaml
  - modules/kernel/api-commands/verify-proofs.yaml
  - modules/schemas/index.yaml
