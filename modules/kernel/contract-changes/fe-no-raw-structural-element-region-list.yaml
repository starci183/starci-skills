id: fe-no-raw-structural-element-region-list
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  starci-fe/no-raw-structural-element names the new grammar primitives Region (section), NavLandmark (nav), List (ul, ol) and ListItem (li)
  as the sanctioned owners of those tags, so app code that needs a semantic landmark or list renders them through the
  grammar. The refused tag set is unchanged; only the owner text of the finding changes. @starci/grammar exports Region
  (label or labelledBy, spacing spaced|flush), NavLandmark (label, layout bar|scrolling), List and ListItem; the two app-local
  leaves the examples drew for these (LabelledSection, NavLandmark) map onto them one to one.
reach: new-legs
paths:
  - packages/eslint/fe/grammar-boundary.mjs
  - packages/eslint/fe/grammar-boundary.test.mjs
  - packages/eslint/fe/docs/grammar-boundary.md
  - packages/grammar/src/core/primitive/Region/index.tsx
  - packages/grammar/src/core/primitive/NavLandmark/index.tsx
  - packages/grammar/src/core/primitive/List/index.tsx
  - packages/grammar/src/core/primitive/ListItem/index.tsx
  - modules/kernel/contract-changes/fe-no-raw-structural-element-region-list.yaml
