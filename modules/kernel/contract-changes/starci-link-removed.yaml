id: starci-link-removed
effectiveAt: '2026-09-30T18:00:00+07:00'
summary: >-
  Owner decision 2026-09-30 (task pub1, ruling one-pattern-no-legacy): every @starci package is published to the public
  npm registry and a product repository installs it at the exact version in knowledge/hfs/canon-pins.yaml, so the
  `starci link` command has no job and is deleted with no alias and no fallback: bin/starci.mjs no longer routes `link`,
  its installer script and spec are removed, and every pin of a starci group must carry
  `install: registry`. The pin-drift finding HFS_CANON_PIN_DRIFT judges a @starci spec like any other pin (the exact
  version; `file:` and ranges are drift), check-canon-pins --repo no longer reads a linked copy, the generated CI and e2e
  workflows no longer check out the runtime or run `starci link`, and the messages that named `starci link`
  (HFS_CANON_PIN_DRIFT, HFS_SYNC_PRESET_MISSING, HFS_SYNC_SKELETON_MISSING) now say to set the exact pinned version from
  knowledge/hfs/canon-pins.yaml and reinstall. Packages published for the first time: @starci/tsconfig 1.0.0,
  @starci/jest-preset 1.1.0, @starci/prettier-config 1.0.0, @starci/vitest-preset 1.0.0, @starci/playwright-preset 1.0.0,
  @starci/stylelint-canon 1.1.0, @starci/hfs 1.0.0; @starci/eslint-canon-be 1.7.0 and @starci/eslint-canon-fe 5.1.2 move
  past the registry's 1.2.2 and 4.0.0. There is no compatibility window.
reach: new-legs
paths:
  - modules/kernel/contract-changes/starci-link-removed.yaml
  - modules/kernel/owner-rulings.yaml
  - modules/kernel/failure-codes.yaml
  - modules/schemas/canon-pins.schema.yaml
  - modules/schemas/index.yaml
  - knowledge/hfs/canon-pins.yaml
  - knowledge/patterns/repo/pins.yaml
  - knowledge/patterns/repo/tooling.yaml
  - scripts/checks/check-canon-pins.mjs
  - scripts/lib/hfs-check.mjs
  - bin/starci.mjs
  - packages/README.md
  - packages/hfs/README.md
  - packages/hfs/package.json
  - packages/hfs/sync/index.mjs
  - packages/hfs/templates/fe/ci-workflows/github/workflows/ci.yml
  - packages/hfs/templates/be/ci-workflows/github/workflows/e2e.yml
  - packages/hfs/templates/fe/ci-workflows/github/workflows/e2e.yml
  - packages/hfs/templates/common/gitignore.base
