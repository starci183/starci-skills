id: draw-adopt-gate
effectiveAt: '2026-09-27T15:20:00+07:00'
summary: "nivo wf-nivo-app-auth-mujek72s op-interface.draw-7c2821e002 (a commit-only work-debt leg adopted from wf-nivo-app-auth-mub1d7gs) settled interface.draw pass by committing 40 image-gen files of three pre-token-render draws unchanged, and its 3/3 green checks (committed, clean, ancestor) never looked at a drawing. api settle now judges an interface.draw pass over EVERY asset it binds - the files it wrote and every one it adopted, inherited or found already there (report files and owned paths), and every live drawing of each ui record they belong to - with scripts/checks/draw-acceptance.mjs: DRAW_ASSET_NOT_TOKEN_RENDERED (no draw-render receipt: record generation.tool draw-render or a starci/draw-render@1 capture of the same sha256; or image-gen provenance: generation.tool image_gen.imagegen on a drawing, a draws entry not provenance.tool draw-render, an imagegen-provenance assertion, a ui-mockup prompt), DATA_STATUS_DRAWN (ui-shapes.mjs, and a draws / selected-matrix state that is a data status), DRAW_NOT_SHAPES (no ui.shapes, a drawing of no shape, a draws or matrix entry naming a screen and no XBase#state) and DRAW_NOT_REDRAWN (nothing token-rendered and no recipe-rendered record) refuse it draw-not-accepted; a raster region beside a live draw-render drawing and a retired asset pass. work/ui-screen@1 asset `retired` gains `image-gen` (kept, never deleted). contract-version.mjs contractFollowUpsOf: a commit-only leg never records a follow-up and is never a group's newest leg while a leg that did the op's work exists; a group of commit-only legs alone is judged by the earliest admission of the legs whose Work it committed (commitOnly.of, any workflow; unknown reads older) - so a pre-contract draw adopted by commit-only still owes draw-redo-token-render-shapes. api status: a leg owed a contract follow-up reads red in legs, the work-graph nodes it covers read red (work-graph-store liveCoverage rework; also the UI), and nextActions carries a dispatch naming api enqueue --contract-change <change> --follow-up-of <job>"
reach: new-legs
ops: [interface.draw]
adds:
  codes:
    - DRAW_ASSET_NOT_TOKEN_RENDERED
    - DRAW_NOT_SHAPES
    - DRAW_NOT_REDRAWN
paths:
  - scripts/checks/draw-acceptance.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/contract-version.mjs
  - scripts/work/work-graph-store.mjs
  - ui/server.mjs
  - modules/kernel/api.yaml
  - modules/kernel/contract-changes.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/schemas/work-ui-screen.schema.yaml
  - tests/draw-acceptance.spec.mjs
  - tests/draw-review.spec.mjs
  - tests/shell-conformance.spec.mjs
  - modules/kernel/api.yaml
