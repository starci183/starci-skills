id: worker-done-capability
effectiveAt: '2026-10-02T18:00:00+07:00'
summary: >-
  THE OP PASSES ITS DISPATCH CAPABILITY TO API REPORT (lane ORCA, live smoke E3 on Orca 1.4.209: the first E3 run failed). Orca
  authenticates a worker_done with the Dispatch capability only the worker holds (the dcap_ value of the --dispatch-capability flag in
  its Orca preamble) and answers dispatch_capability_invalid without it; the runtime never sees it, and Orca revokes it when the
  Dispatch settles. So \`api report\` takes --dispatch-capability <cap>, scripts/api/orca/send.mjs forwards it as --dispatch-capability,
  and the op prompt and modules/ops/_common.yaml tell the op to pass it. The capability is never stored: not on the job payload, not in
  the report, not in an event. Without it api report sends nothing and records payload.workerDone {ok: false, code: worker-done-unsent,
  errorCode: dispatch_capability_missing}; settle then reads the Dispatch not settled and fences it with worker-stop before the release.
paths:
  - scripts/api/orca/send.mjs
  - scripts/kernel/verbs/report.mjs
  - scripts/kernel/op-prompt.mjs
  - modules/ops/_common.yaml
  - modules/kernel/api-commands/report.yaml
