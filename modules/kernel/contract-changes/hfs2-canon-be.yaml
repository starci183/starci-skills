id: hfs2-canon-be
effectiveAt: '2026-09-29T22:00:00+07:00'
summary: >-
  HFS v2 back-end lint rules (catalog R18, R20, R34, R36-R38, R40-R45, R48). `@starci/eslint-canon-be` becomes 1.3.0
  and gains 22 rules: catch-must-account, error-home, no-runtime-schema, sql-only-in-repository, no-entity-in-contract,
  no-untyped-body, public-needs-reason, no-direct-env-read, no-secret-default, secret-compare-timing-safe,
  global-module-allowlist, typed-module-definition, static-module-register, no-new-injectable, no-module-let,
  one-module-per-file, no-inline-suppression, file-size-growth, spec-no-source-read and
  spec-typed-doubles. `must-deep-module-import` and `no-folder-reexport` now hold the HFS v2 owner `index.ts` surface
  (an aliased import names the owner and stops; an index lists a bounded set of named exports) and are on in
  `starciBeConfig`. No rule is off any more: the retired-rule list is gone with the Academy AbstractException rules,
  handler-has-twin-spec, no-handler-encoded-failure, no-self-global-module, no-line-suppression and require-vn-ok-reason.
  The nest profile drops the three off-state guard obligations, follows the new canon version and content digest, and
  gains obligations for the new rules. A lint finding of one of these rules carries a catalogued Vietnamese why code
  (scripts/checks/lint-why.mjs; 13 new codes in failure-codes.yaml). A repository that pins the canon adopts it through
  its own migration lane; there is no compatibility window.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs2-canon-be.yaml
  - modules/kernel/failure-codes.yaml
  - modules/models/code-patterns.yaml
  - knowledge/repository-baseline.yaml
  - knowledge/patterns/be/error.yaml
  - knowledge/patterns/be/test.yaml
  - knowledge/patterns/scan-coverage.yaml
  - packages/eslint/be/package.json
  - packages/eslint/be/README.md
  - packages/eslint/be/CHANGELOG.md
  - scripts/checks/lint-why.mjs
  - scripts/checks/check-scoped-lint.mjs
  - tests/lint-why.spec.mjs
