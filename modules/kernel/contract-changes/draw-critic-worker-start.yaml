id: draw-critic-worker-start
effectiveAt: '2026-10-02T00:00:00+07:00'
summary: >-
  THE DRAW CRITIC IS AN ORCA WORKER (owner rule 2026-10-01: every agent starts through orchestration worker-start; lane
  dv-c0-critic). scripts/work/draw-critic.mjs runCritic no longer spawns `codex exec` or `claude -p` as a child process
  (the PreToolUse hook could not see it and Orca could not supervise it): it starts the critic through
  scripts/agent/lib.mjs startAgent (run-create from the loop's terminal, task-create, worker-start --agent <provider>
  --model --effort from runtimes.yaml allocation.drawLoop.critic or criticWhenDrawer.<drawer>, worker-show attestation)
  placed in the clean temp dir that holds only the round's PNGs, screen.html and rubric.yaml. Its Task spec names those
  files and verdict.json, the one file it may write, and forbids every other write. The runtime waits for its
  worker_done (or its escalation, or worker-show showing it ended) through the non-consuming orchestration inbox and
  worker-show, bounded by the critic's timeoutMs, reads verdict.json, then worker-stop, worker-release and closes the
  Task. critique.json gains `outcome`: judged, not-configured, launch-failed, timeout, refused or verdict-missing; only
  judged carries a verdict, every other outcome has an error and no beauty (DRAW_CRITIC_MISSING at finish, never a
  pass). Removed with no alias: criticArgv, the child-process runner and its Windows shell-quoting shim, the critic's
  `command` field in runtimes.yaml, critique.json critic.argv/command/exit, and the draw-loop `criticRunner` /
  critiqueRound and critiqueBest `runner` test seams (now `criticOrca` / `orca`, a fake Orca client). Enforcement: new
  check-host-boundary.mjs rule agent-cli-spawn (code AGENT_CLI_SPAWN, in npm run check) reads every .mjs/.cjs/.js/.ts
  under scripts, engine, modules and bin with the TypeScript AST and fails on a call whose callee is bound to
  node:child_process (spawn, spawnSync, exec, execSync, execFile, execFileSync, fork) and whose command - a literal, a
  const resolving to one, either branch of a conditional, the first word of a shell string, or the program a
  cmd/sh/powershell argv runs - is codex, claude, cursor-agent, devin, gemini or opencode (or a .cmd/.exe shim). A
  mention in a comment, a message or docs is not a call; git, node and npm spawns pass. A nested critic is one level
  below the op that runs the loop: Orca's nested worker depth must allow Supervisor -> Kernel -> Op -> critic.
reach: new-legs
paths:
  - modules/kernel/contract-changes/draw-critic-worker-start.yaml
  - scripts/work/draw-critic.mjs
  - scripts/work/draw-loop.mjs
  - scripts/checks/check-host-boundary.mjs
  - modules/models/runtimes.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/kernel/failure-codes.yaml
  - tests/draw-critic-worker-start.spec.mjs
  - tests/check-host-boundary.spec.mjs
  - tests/helpers/fake-critic-orca.mjs
