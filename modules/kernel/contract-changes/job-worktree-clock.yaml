id: job-worktree-clock
effectiveAt: '2026-09-28T16:10:00+07:00'
summary: >-
  Job controller fix (op-code.refactor-b966ced588 kept WORKTREE_REMOVE_OVERDUE violated after its folder was gone):
  an isolated op's worktree counts removed when job-worktree-removed exists OR its folder is gone; while the event is
  owed, every pass runs `product-worktree.mjs reap --job` (idempotent: removes and verifies, writes the missing event
  for a folder already gone, or records the failure and is retried next pass), for settled jobs up to 7 days old; the
  clock runs only while the folder exists. Every job with an open SLA clock is listed on resync, so a job that left
  the settled window still gets the pass that clears its clocks (WORKER_STALLED included once it is settled).
reach: new-legs
paths:
  - modules/kernel/contract-changes/job-worktree-clock.yaml
  - scripts/reconciler/controllers/job.mjs
  - tests/reconciler-job.spec.mjs
