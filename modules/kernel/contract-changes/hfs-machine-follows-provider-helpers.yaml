id: hfs-machine-follows-provider-helpers
effectiveAt: '2026-10-02T09:10:00+07:00'
summary: >-
  The architecture machine's provider reader (machineKit.providersOf, used by error-masked R39 and default-deny-app-guard R41)
  follows a call or a spread inside the app root file to a function or a const declared in another file of the program, to a
  depth of four, so an `APP_FILTER` or `APP_GUARD` entry built by a helper outside app.module.ts is counted and judged where the
  app root provides it (alpha.5 item 6.2). A callee is resolved by the checker to its declaration, never by a name, and a
  declaration outside the program (a package) is never followed. module-per-transport (R45) was already built; its enforcers are
  unchanged.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-machine-follows-provider-helpers.yaml
  - scripts/hfs/architecture/machine-ast.mjs
  - docs/architecture-check.md
  - tests/repo/architecture-default-deny.spec.mjs
  - tests/repo/architecture-error-masked.spec.mjs
