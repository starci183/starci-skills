id: work-credential-one-shape
effectiveAt: '2026-09-25T20:00:00+07:00'
summary: "every work family schema copied the pre-custody integration credential {name, providedBy, where (required)}, so a record declaring custody: identity:<slug> (the monolith's shape, used by integration.verify and provision.ask, and by 12 nivo records) was refused under starci validate --strict. All 18 credential blocks (the 16 families, work-integration's root and work.schema.yaml) are now one shape: {name, providedBy: owner, custody: identity:<slug>}, with the deprecated where still accepted and a declaration with neither refused; work-layout.yaml names custody. Disposable accounts are {role, identity} only: the monolith's dead $defs.disposableAccounts (plaintext password) is gone and engine/index.mjs refuses a username/password pair on a legacy work/node@1 UAT. Also text-only schema metadata fixes (index.yaml gaps/coverage, relationships.yaml, spec/contract.schema.yaml pattern-decision wording). Adds no check or finding code"
paths:
  - modules/schemas
  - engine/index.mjs
  - tests/work-credential-shape.spec.mjs
  - tests/module-spec.spec.mjs
reach: new-legs
