id: product-worktrees-orca-visible
effectiveAt: '2026-09-28T18:00:00+07:00'
summary: >-
  EVERY OP AGENT IS VISIBLE IN ORCA (DESIGN §16.7; owner-visible defect 2026-09-28: agents in
  <repo>/.starciwork/worktrees/<wf>/<op> showed under no project). A product op's command terminal is created on the
  product repository's ROOT Orca worktree with the op worktree as its directory (Set-Location first). A managed op's
  agent is launched the same way by the runtime (routed model attested on screen) and handed to
  `orchestration worker-start --terminal <handle>` (modules/host/orca/calls.yaml worker-start: exactly one of --agent or
  --terminal); a refused adoption with no effect closes that terminal and falls back to worker-start --agent (event
  product-worker-adoption).
reach: new-legs
paths:
  - modules/kernel/contract-changes/product-worktrees-orca-visible.yaml
  - modules/host/orca/calls.yaml
  - scripts/api/orca/worker-start.mjs
  - scripts/kernel/api.mjs
