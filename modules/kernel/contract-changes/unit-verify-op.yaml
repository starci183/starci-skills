id: unit-verify-op
effectiveAt: '2026-09-29T18:10:00+07:00'
summary: >-
  New op `unit.verify` (modules/ops/ops/unit.verify.yaml, registry regenerated by build-ops-registry.mjs): it runs the product
  repository's FULL unit suite (npm run test:unit, unit only, never e2e) on the delivered source and reports totals and
  failures grouped by spec file; it repairs nothing. It is dispatched only when the goal or the owner explicitly asks for the
  full unit run: modules/goal/archetypes.yaml adds the `unit-verify` archetype with explicit phrases only (full unit, whole
  unit suite, all unit tests, the Vietnamese phrase for run the whole unit suite ...), route-plan.mjs maps it to the goal variable `unit.X: verified` that
  modules/goal/legality.yaml declares and unit.verify produces, and no lane step names it. Kind unit.verify (modules/models
  kinds.yaml, registry.yaml, runtimes.yaml: verify role, hands-on, review order, heavy 2500 MB), a route rule
  unit-red-repairs-the-build (failed, class product -> lane.build repair, limit 3), label in modules/ops/_labels.yaml, and
  scripts/kernel/verify-failure.mjs VERIFY_OPS. Its policy.specsToggle is {unit: defer-leg}: while specs.unit is false it
  settles deferred. Adds no check or finding code; blockers UNIT_RUNNER_MISSING, UNIT_RUN_NOT_REQUESTED.
reach: new-legs
paths:
  - modules/kernel/contract-changes/unit-verify-op.yaml
  - modules/ops/ops/unit.verify.yaml
  - modules/ops/registry.yaml
  - modules/ops/_labels.yaml
