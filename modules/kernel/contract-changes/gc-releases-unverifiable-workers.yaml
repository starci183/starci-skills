id: gc-releases-unverifiable-workers
effectiveAt: '2026-10-02T16:00:00+07:00'
summary: >-
  A SETTLED WORKER WITH UNVERIFIABLE LIVENESS IS RELEASED (lane ORCA, alpha5 item 1.6; live smoke E1: worker-release leaves no agent
  process of the terminal, so Orca's reclaimable state plus its own nextAction is enough). scripts/lib/worker-accounting.mjs
  releasePlan releases a reclaimable row whose liveness is live, exited or unverifiable when Orca's nextAction is worker-release of
  that Dispatch; a row with no liveness verdict, release_unknown, or another next action is still refused and reported. The GC's owner
  incident gc-unverifiable-workers and its controller function are deleted: after one sweep the list of settled workers Orca holds but
  cannot verify is empty.
paths:
  - scripts/lib/worker-accounting.mjs
  - scripts/reconciler/controllers/gc.mjs
  - scripts/supervisor/gc.mjs
