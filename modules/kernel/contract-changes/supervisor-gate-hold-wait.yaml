id: supervisor-gate-hold-wait
effectiveAt: '2026-09-28T10:05:55+07:00'
summary: >-
  An open supervisor-gate holding every queued and proposed dispatch leaves the
  Kernel frontier at supervisor-wait. Held nextActions remain visible with heldBy
  incident evidence. The stall scanner reports SUPERVISOR-WAIT and does not wake
  the Kernel; an unheld ready job still makes the frontier actionable.
reach: new-legs
