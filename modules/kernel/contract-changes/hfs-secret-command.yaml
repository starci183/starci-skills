id: hfs-secret-command
effectiveAt: '2026-10-02T10:10:00+07:00'
summary: >-
  `hfs secret list|show|set|gen` (alpha.5 item 6.4): the canon command over the sealed secrets of an app,
  `.starcistacks/<env>/secrets/<slug>.enc` (R06). It is scripts/hfs/secret.mjs over the runtime's sops api
  (scripts/api/sops: decrypt.mjs, and the new seal.mjs, a `sops encrypt` over stdin, so a value never sits on an argument list), bundled
  into @starci/hfs through the runtime copy and dispatched by packages/hfs/bin/hfs.mjs. `list` reads key names without decrypting,
  `show` prints one value, `set` seals the value read from stdin keeping the document's other keys, format and recipients (a new
  secret takes --age or the repository's .sops.yaml), `gen` seals a random value without printing it. The plain `sops` commands of
  the examples' KEYS.md and runbooks are retired; the examples are re-pinned and edited once this is published.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-secret-command.yaml
  - scripts/hfs/secret.mjs
  - scripts/api/sops/seal.mjs
  - scripts/hfs/sync-runtime.mjs
  - packages/hfs/bin/hfs.mjs
  - packages/hfs/README.md
  - packages/hfs/CHANGELOG.md
  - tests/hfs/hfs-secret.spec.mjs
