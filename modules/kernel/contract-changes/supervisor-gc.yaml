id: supervisor-gc
effectiveAt: '2026-09-28T13:00:00+07:00'
summary: >-
  Garbage collection and verified closes (owner 2026-09-28: "why does the supervisor not delete workers, and ops are full of garbage!!!
  there must be garbage collection"). Ownership: a Kernel closes its own op workers at settle, and the settle receipt's
  terminalClosed now carries `verified` (a terminal still connected after the close is closed again and read back
  through scripts/lib/close-verify.mjs; ok is false until it is proven gone). api finish and api archive close the
  Kernel terminal through closeSelfSafe: inline and verified from another terminal, from the Kernel's own terminal
  by a detached verifier that logs the proof to the Supervisor's machine log. The Supervisor closes its own
  [Worker]s when they file a diagnosed/blocked/failed report, are cancelled or land (workers.mjs
  closeWorkerTerminal, payload.terminalClosed, worker-terminal-closed / worker-terminal-unclosed events). The
  supervisor tick gains the duty gc (scripts/supervisor/gc.mjs) that sweeps the leftovers, writes the new log kinds
  gc.collect and gc.summary, records a supervisor-gc event the owner digest sums into one line, and records each
  leftover class as a lesson. purge-workflow accepts an archived workflow like a finished one.
reach: new-legs
paths:
  - modules/kernel/contract-changes/supervisor-gc.yaml
  - modules/supervisor/supervise.yaml
  - modules/models/runtimes.yaml
  - scripts/kernel/api.mjs
  - scripts/kernel/typed-logs.mjs
  - scripts/lib/close-verify.mjs
  - scripts/supervisor/gc.mjs
  - scripts/supervisor/tick.mjs
  - scripts/supervisor/workers.mjs
  - scripts/supervisor/actions.mjs
  - scripts/supervisor/lessons.mjs
  - scripts/work/purge-workflow.mjs
  - ui/src/contract.ts
  - ui/CONTRACT.md
