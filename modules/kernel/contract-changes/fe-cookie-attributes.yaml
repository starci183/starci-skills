id: fe-cookie-attributes
effectiveAt: '2026-10-01T12:00:00+07:00'
summary: "New catalog rule R107 FE_COOKIE_ATTRIBUTES with the eslint-fe rule response-cookie-attributes (error, law client-boundary). A set on Next's ResponseCookies (response.cookies.set, (await cookies()).set) is identified by the method's declaring class of the next package. It states httpOnly as a literal (true for a session, false only for a preference page script reads), carries secure and uses sameSite lax or strict. The options are judged by their TYPE, so an as-const constant and a spread of it keep their literals. Adds the finding code FE_COOKIE_ATTRIBUTES (failure-codes.yaml), the why entry, the doc section and the pattern FE-BOUNDARY-4."
paths:
  - packages/eslint/fe/client-boundary.mjs
  - packages/eslint/fe/lib/why.mjs
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/fe/boundaries.yaml
  - modules/kernel/failure-codes.yaml
reach: new-legs
