id: sealed-secrets-one-location
effectiveAt: '2026-09-29T18:00:00+07:00'
summary: >-
  Owner ruling 2026-09-29: every sealed secret lives at `.starcistacks/<env>/secrets/<identity-or-resource-slug>.enc`
  (sops age); `.starciwork` holds only the identity/resource record, whose `custody.sealed` points there, and never a
  sealed file or a plaintext value. work-resource.schema.yaml now pins `custody.sealed` to that shape (no not-sealed-yet
  form exists in the schema, so none is kept), check-work-artifacts refuses a `custody.sealed` elsewhere
  (SEALED_CUSTODY_LOCATION) and any sealed file under the Work tree (SEALED_FILE_IN_WORK), both catalogued with
  Vietnamese text. The retired `.starcistacks/<env>/secrets/<slug>/secrets.yaml.enc` and
  `.starciwork/_resources/identities/<id>/secrets.enc.yaml` forms are removed from work.schema.yaml, the family schemas,
  integration.verify, provision.ask, uat.verify (the op that writes the sealed file) and docs/application-stacks.md; no
  alias is kept. Product repositories repoint their records in their own lanes.
reach: new-legs
paths:
  - modules/kernel/contract-changes/sealed-secrets-one-location.yaml
  - modules/schemas
  - modules/ops/ops/uat.verify.yaml
  - modules/ops/ops/integration.verify.yaml
  - modules/ops/ops/provision.ask.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/checks/check-work-artifacts.mjs
  - docs/application-stacks.md
  - tests/sealed-custody-location.spec.mjs
