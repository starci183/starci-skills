id: hfs-fe-round2
effectiveAt: '2026-09-30T01:30:00+07:00'
summary: >-
  Front-end enforcer round 2, measured on nivo-fe, starci-next-fe and miamia-fe. @starci/eslint-canon-fe 5.1.0 adds 22
  rules, all errors, registered in knowledge/hfs/rules.yaml under the catalogue rule each enforces with 16 new
  Vietnamese failure codes (FE_TYPE_ESCAPE, FE_LIST_KEY, FE_EFFECT_CLEANUP, FE_EFFECT_FETCH, FE_SWALLOWED_ERROR,
  FE_CONSOLE_CALL, FE_PAGE_METADATA_MISSING, FE_SUSPENSE_NULL_FALLBACK, FE_I18N_NAVIGATION, FE_I18N_FORMATTER,
  FE_ROUTE_HARDCODED, FE_CLIENT_SERVER_IMPORT, FE_STORAGE_OUTSIDE_MODULES, FE_DANGEROUS_HTML, FE_NATIVE_IMAGE,
  FE_OUTCOME_KIND_UNHANDLED). No catalogue rule is added and none renumbered. @starci/stylelint-canon 1.1.0 lets
  brand-layer-shape accept the grammar family root selector as the light, dark and system scopes of brand.css. The
  architecture machine declares HFS_HOOKS_PATH_REDIRECTED (rule R13): a clone whose repository-local core.hooksPath is
  anything but .husky or .husky/_ is refused at pre-push and land. knowledge/hfs/canon-pins.yaml moves the two pins.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-fe-round2.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/canon-pins.yaml
  - modules/models/code-patterns.yaml
  - scripts/checks/architecture/hfs.mjs
  - tests/architecture-hfs-hooks-path.spec.mjs
