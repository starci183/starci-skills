id: hfs-managed-config
effectiveAt: '2026-09-30T18:00:00+07:00'
summary: >-
  Lane C0 sub-lane H2 (BE-CONVENTION 1.17, 3.1 principle 4, rules R05, R16, R17, R22): a back end's whole tool configuration
  is rendered by `hfs sync` and compared by `hfs check`. The managed file list is the managedBy slots of slots.yaml (be.tool-config,
  be.package-manifest, repo.quality-config, repo.hooks, repo.ci, repo.ci-e2e; templates/<profile|common>/<managedBy>/): tsconfig.json
  (extends @starci/tsconfig/be.json plus the three aliases), tsconfig.build.json, tsconfig.e2e.json, the one-line eslint.config.mjs,
  jest.config.js, .prettierrc, .prettierignore and the package.json scripts block (compared as parsed JSON). @starci/tsconfig 2.0.0
  replaces nest.json by be.json (every strict flag of the convention, nodenext, noEmit) and adds build.json; @starci/jest-preset 2.0.0
  takes no options, owns the three aliases and measures coverage with v8. HFS_MANAGED_FILE_DRIFT (R05), HFS_RULE_OFF_WITHOUT_REPLACEMENT
  (R17, the eslint one-liner differs from its render), HFS_TOOL_CONFIG_LOCAL (R16, tool configs outside the managed set through the
  forbidden slot be.tool-config-local, local rule files, configuration-swapping flags) and HFS_TS_STRICT (R22, by flag) ship as `hfs` enforcers
  in packages/hfs/sync/managed.mjs and ts-strict.mjs. Back-end hooks and CI call only managed scripts (no lint-staged, no test:ci,
  no test:affected, no second `hfs sync --check` step). Examples must be re-rendered with `hfs sync --write`.
reach: new-legs
adds:
  codes:
    - HFS_SYNC_TEMPLATE_MISSING
    - HFS_SYNC_MANIFEST_MANAGED
paths:
  - modules/kernel/contract-changes/hfs-managed-config.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/enforcement.yaml
  - knowledge/patterns/repo/tooling.yaml
  - packages/tsconfig/be.json
  - packages/tsconfig/build.json
  - packages/tsconfig/package.json
  - packages/tsconfig/README.md
  - packages/tsconfig/CHANGELOG.md
  - packages/jest-preset/index.cjs
  - packages/jest-preset/index.d.ts
  - packages/jest-preset/package.json
  - packages/jest-preset/README.md
  - packages/jest-preset/CHANGELOG.md
  - packages/hfs/sync/index.mjs
  - packages/hfs/sync/managed.mjs
  - packages/hfs/sync/ts-strict.mjs
  - packages/hfs/bin/hfs.mjs
