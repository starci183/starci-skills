id: rt-export-unused
effectiveAt: '2026-10-02T17:30:00+07:00'
summary: >-
  Smell wave S5-01: `npm run check` runs scripts/checks/check-export-used.mjs. A name a runtime `.mjs` source exports that no
  other tracked text file mentions as a whole word (source, spec, yaml, json, markdown, shell) is RT_EXPORT_UNUSED. A
  package's public entry (the files its package.json names under main, exports, bin, types) is exempt as API for external
  consumers. There is no pending list: every finding in the tree was fixed with the check (the export stripped where the
  file uses the name itself, the declaration deleted where nothing does).
reach: new-legs
adds:
  checks: [check-export-used]
  codes: [RT_EXPORT_UNUSED]
paths:
  - modules/kernel/contract-changes/rt-export-unused.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/runtime-slots.yaml
  - scripts/checks/check-export-used.mjs
  - tests/checks/check-export-used.spec.mjs
