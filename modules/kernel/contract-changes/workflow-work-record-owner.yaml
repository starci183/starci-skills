id: workflow-work-record-owner
effectiveAt: '2026-10-02T09:00:00+07:00'
summary: >-
  THE ONE RULE FOR WORK RECORDS IN WORKFLOW WORKTREES (WFWT2 2.8, C0 ruling B). A Work record is committed only by the
  runtime, on the workflow branch of its owner workflow (scripts/kernel/work-ownership.mjs ownerOf): the op that writes it
  commits nothing and its green checkpoint carries it. settle refuses a green op that changed a .starciwork record another
  live workflow definitely owns (any ownership rule but the repo-owner fallback): workflow-work-record-not-owner
  (scripts/kernel/workflow-settle.mjs requireWorkOwner, called by settleCheckpoint before the checkpoint). The owner
  reads its own records at its workflow branch (workflowCommittedReader, used by input-digests inputDrift), so its later
  settles see them before it lands; every other workflow reads main, so a peer sees a record when its owner lands. api
  record-change reads and judges the owner's records in its workflow worktree; record-change-uncommitted now says the
  runtime commits a record when the op that wrote it settles green. Written in docs/workflow-kernel.md (Work records).
reach: new-legs
