id: kernel-wake-one-path
effectiveAt: '2026-09-25T20:00:00+07:00'
summary: "One Kernel wake path (scripts/kernel/wake-delivery.mjs wakeKernel / wakeKernelForTransition) replaces the three copies in api.mjs, serve-ask.mjs and supervisor/stall-alert.mjs. The ask-answered wake now reads a frozen `active` frame as turn-idle (staleAwareState) and the input-box draft, like every other wake. kernelWake.action (api report, peer-wait, foundation, follow-up wakes) answers kernel-busy or kernel-gated where it said kernel-active, kernel-exited for a wake that reached a shell, and carries delivered. Every durable transition wake ends with one short bound line (WAKE_BOUNDS); the follow-up-received wake names the follow-up instead of a null job; the auto-accepted ask wake drops its rationale (driver-loop.yaml states the binding rule). A leftover [supervisor] notice or [Supervisor watchdog] wake draft is runtime text (cleared), not foreign input. devin.yaml drops kernelCommandRequirements (identical to commandRequirements, which the Kernel launch falls back to). Adds no op check or finding code"
paths:
  - scripts/kernel/wake-delivery.mjs
  - scripts/kernel/terminal-liveness.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/serve-ask.mjs
  - scripts/supervisor/stall-alert.mjs
  - modules/models/agents/devin.yaml
