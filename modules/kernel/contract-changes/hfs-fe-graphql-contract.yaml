id: hfs-fe-graphql-contract
effectiveAt: '2026-10-02T09:00:00+07:00'
summary: >-
  Lane EX (lead C0): both example front ends sent GraphQL documents written against an older back end (`(request: ...)` where
  every contract takes `input`, an `account` query with an argument it no longer takes, REST session doors the identity app
  no longer serves), and no check noticed because a front end type-checks its documents as plain text. New rule R113
  FE_GRAPHQL_CONTRACT (error, hfs enforcer scripts/lib/hfs-rules/fe-contract-documents.mjs over the dependency-free GraphQL
  reader scripts/lib/graphql-contract.mjs): every operation of a `.graphql` file under `fe/` is validated against the
  contract snapshot `be/contracts/<service>/schema.graphql` that declares its first root field - fields, arguments, input
  fields, required arguments, variable types, leaf and object selections and unused variables. The examples' front ends now
  send what the back ends serve.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-fe-graphql-contract.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - modules/kernel/failure-codes.yaml
  - scripts/lib/graphql-contract.mjs
  - scripts/lib/hfs-rules/fe-contract-documents.mjs
  - scripts/lib/hfs-check.mjs
  - packages/hfs/README.md
