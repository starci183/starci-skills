id: status-api-unit-graph-attempts
effectiveAt: '2026-09-28T19:30:00+07:00'
summary: "Harness status API (read-only, ui/CONTRACT.md, CONTRACT_VERSION 2026-09-28.5) for the StarCi Status control room. GET /api/workflow board: each BoardUnit carries `attempt` (UnitAttempt: stage dispatched|routed|none, agent/provider/model/pool/effort from jobs.payload.hierarchy.runtime else the newest op-dispatched event, routedAt, startedAt = first op-dispatched, dispatches, lastEventAt, reportedAt, settledAt, source, why naming every null) and `diff` (UnitDiffRef: the unit's newest stored settle patch, job_artifacts kind patch, landed|unlanded, opened with /api/diff); the Op report `outcome` and the Kernel `verdict` stay separate; `displayName` is filled. board.graph (UnitGraph, ui/unit-graph.mjs) is the unit dependency DAG from recorded dispatch gates only: `after` (jobs.payload.after) and `seam` (a cut ordinal > 1 waits on ordinal 1 of its cut; cut.seamStub = recorded release), with met, fromJob/toJob, counts (dangling, selfLoops), sources, omitted (Work-record dependsOn is not in the ledger) and status empty + reason when nothing is recorded; never inferred from order, time or plan.edges. GET /api/system reconciler: an engine reconcile-failed row counts as the error of the controller it names (data.name; it was dropped before), per-controller modeAt, events, lastActAt, lastErrorAt, lastError, `others` for engine/SLA rows, windowMs, logSource; no per-controller CPU/RAM (not measured). WorkflowPageData, SystemView and ReconcilerView are now typed in ui/src/contract.ts and checked by ui/contract-shapes.mjs (endpoints workflow, system) with fixtures ui/fixtures/workflow.json and system.json. /api/agents/<job>/changes stays live-only. No runtime, ledger or op behaviour change; adds no check or finding code"
reach: new-legs
paths:
  - ui/unit-graph.mjs
  - ui/reconciler.mjs
  - ui/server.mjs
  - ui/contract-shapes.mjs
  - ui/contract-capture.mjs
  - ui/src/contract.ts
  - ui/CONTRACT.md
  - ui/fixtures/workflow.json
  - ui/fixtures/system.json
  - tests/harness-contract.spec.mjs
  - tests/status-api-units.spec.mjs
