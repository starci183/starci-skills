id: draw-alert-action-by-tone-badge-dot
effectiveAt: '2026-09-27T20:30:00+07:00'
summary: "Owner rulings 2026-09-27, with grammar 0.5.3. (1) Knowledge: ACCENT-5 case-5 now says the Alert's action is the grammar Button in the variant the grammar Alert gives its tone (accent/informative -> primary, danger/negative -> danger, every other tone -> secondary), not always secondary; knowledge/ui/examples/brand-direction.nivo.yaml notice recipe reads 'Alert action = grammar Button variant by tone (accent→primary, danger→danger, else secondary)' (the warning attention and success result keep secondary), with A14, G2, the dashboard note and the header comment aligned; P4 and rubric T1 say a status badge carries the grammar Badge dot (isDot), never a hand-drawn dot; interface.draw worker text and scripts/work/draw-critic.mjs DEFAULT_RUBRIC G2/T1 say the same. (2) DRAW_ALERT_ANATOMY (scripts/checks/draw-dna.mjs) now requires an Alert action Button's variant (data-variant, data-grammar-variant, else its vendor button--<variant> class) to be the one alertActionVariantFor gives the Alert's tone - a primary action on a warning Alert, a danger one on a non-danger Alert, or an outline one anywhere fails ('Alert action variant off its tone'); a variant outside the DNA closedValues still fails as before. (3) DRAW_OFF_GRAMMAR_COMPONENT refuses a status dot that is not the DNA Badge isDot dot: a dot-classed/-parted element outside a Badge or not the badge-dot anatomy ('hand-made status dot'), a Badge dot with a box-shadow/ring/outline/border halo ('Badge dot with a halo'), or one not 6px ('Badge dot off its size'). Adds no new code; stricter findings are advisory for an interface.draw leg admitted earlier"
reach: new-legs
ops: [interface.draw]
paths:
  - knowledge/ui/composition/accent.yaml
  - knowledge/ui/examples/brand-direction.nivo.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/checks/draw-dna.mjs
  - scripts/work/draw-critic.mjs
  - tests/heroui-alert-asset.spec.mjs
  - tests/draw-loop-dna.spec.mjs
