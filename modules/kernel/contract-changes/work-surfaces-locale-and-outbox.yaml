id: work-surfaces-locale-and-outbox
effectiveAt: '2026-10-01T23:00:00+07:00'
summary: >-
  check-work-surfaces drops the leading locale segment through layout-tree's isLocaleSegment (next-intl's [locale],
  the same predicate the layout-tree scan uses), not a [lang] literal, so app/[locale]/x/page.tsx serves /x
  (UI_ROUTE_GHOST false positives). EVENT_UNEMITTED counts the standard emission: inside a transaction callback, a call
  whose first argument is that callback's transaction handle (outbox.enqueue(manager, message)) emits every event its
  message names by a string literal or a string-valued enum member (task.created -> event.task.created). A declared
  event with no emission is still refused. No code added or removed.
reach: new-legs
paths:
  - scripts/checks/check-work-surfaces.mjs
  - scripts/work/layout-tree.mjs
  - tests/work-surfaces.spec.mjs
  - modules/kernel/contract-changes/work-surfaces-locale-and-outbox.yaml
