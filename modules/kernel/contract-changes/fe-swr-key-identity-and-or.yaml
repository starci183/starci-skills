id: fe-swr-key-identity-and-or
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  FE_SWR_KEY_IDENTITY reads `&&` and `||` conditions of a disabled-key ternary: taking the true branch of `a && b` proves
  an identity available when either side proves it, and taking the false branch of `a || b` does when either side's
  negation does. The other branch of each operator proves nothing. A key such as `token && taskId ? key : null` no longer
  reports a missing null gate. No finding code changes.
reach: new-legs
paths:
