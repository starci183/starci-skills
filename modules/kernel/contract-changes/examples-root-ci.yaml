id: examples-root-ci
effectiveAt: '2026-10-01T23:30:00+07:00'
summary: >-
  Lane C0 SONAR2: GitHub runs only the repository-root workflows and Codecov reads one root config, so the example apps' own
  ci.yml and codecov.yml (the app-repository form hfs sync renders) never ran in the runtime repository. One root workflow,
  .github/workflows/examples.yml, runs every example app through a job matrix DERIVED from examples/*/hfs.json of kind app
  (scripts/checks/examples-ci.mjs --matrix): on push and pull_request typecheck, hfs lint (with the Sonar import file), the
  unit project with coverage, the Codecov upload under the app's flag (CODECOV_TOKEN; skipped with a log notice when absent),
  the front-end build and the Sonar scan and gate where a server is configured (skipped with a notice otherwise); integration
  and e2e start the docker stack through the test world and run only on workflow_dispatch (input layers), the owner's ruling
  that e2e runs manually only. One root codecov.yml carries a flag per example app over examples/<app>/ plus the hfs coverage
  scope (packages/hfs/sync/index.mjs coverageScope over the jest preset's COVERAGE_SOURCES), project and patch at 100 per flag,
  rendered by examples-ci.mjs --write. example-unit.yml, todo-app-example.yml and todo-app-live-e2e.yml are folded in and
  deleted (modules/kernel/retired-paths.yaml). npm run check runs scripts/checks/examples-ci.mjs: the matrix must be the
  derived output (never a hand-written list), no other root workflow may run an example, integration/e2e/contract steps must
  be gated on workflow_dispatch, and codecov.yml must equal its render. The owner adds CODECOV_TOKEN once to this repository;
  each product monorepo adds its own.
reach: new-legs
paths:
  - modules/kernel/contract-changes/examples-root-ci.yaml
  - .github/workflows/examples.yml
  - codecov.yml
  - scripts/checks/examples-ci.mjs
  - package.json
  - modules/kernel/retired-paths.yaml
  - .github/workflows/example-unit.yml
  - .github/workflows/todo-app-example.yml
  - .github/workflows/todo-app-live-e2e.yml
  - examples/todo-app/README.md
  - examples/ecommerce-app/README.md
  - examples/todo-app/be/docs/guides/testing.md
  - docs/releasing.md
  - packages/hfs/README.md
