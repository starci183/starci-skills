id: grammar-0.6.0-draw-gaps
effectiveAt: '2026-09-27T23:45:00+07:00'
summary: "@starci/grammar 0.6.0 (additive; owner ruling 2026-09-27 'thêm hết', owner-rulings grammar-gaps-0.6.0): every gap the real-component prototype found is a grammar piece. SurfaceCard treatment surface|ink (the one signature band on the brand ink - Common --accent, Offset Pop its ink/canvas, Heritage over its paper - re-binding foreground (white/black from the ink's own lightness), muted, separator, plate and soft tone foregrounds through --grammar-ink-band* so children stay AA on any accent; the Storybook a11y matrix passes) with artwork (aria-hidden decorative zone: 22.5x15rem bleeding off the top/inline-end edge at a 48rem+ band, the head face keeping 12.25rem; 11.25x7.5rem in flow at the head below) and motif none|orbit (static SVG rings and nodes in the artwork zone only, dropped under forced colours); Divider without label (1px --separator hairline, BOUNDARY-1, semantics separator|presentation); DescriptionList layout stat-strip (DescriptionListStatItem icon/unit/meta; 2x2 below 48rem, one hairline-divided row at 48rem+, 0.75rem each side of the hairline, figure FONT-5 600 tabular, label/unit/meta FONT-2 muted 400); AlertAction.icon (leading Icon; tone->variant unchanged); Image/MediaFrame assetSlot/assetSha256/assetPrompt -> data-asset-slot/-sha256/-prompt; SectionHeader count (muted '(n)' in the heading) and meta (FONT-1 muted source time); TagGroupItem isOff/offLabel (HeroUI tertiary chip + 1px border outline + muted, still focusable, visually hidden state word); IconButton variant tertiary|ghost; new renderer PinnedActionBar (sticky bottom, safe-area inset, top hairline, one command, visibility narrow|always; registry 96); data-component + data-tier on every renderer root (28 emitted none). knowledge/grammars DNA re-measured by grammar-knowledge --write (versions 0.6.0, 96 renderers, starci/DNA.yaml says what 0.6.0 added); knowledge/ui BOUNDARY-1 case-1 and PADDING-3 case-4 name the grammar owners (Divider, DescriptionList stat-strip); brand-direction.nivo.yaml signatureBand/primaryActionPlacement use the pieces and mark the artworkBand, OrbitMotif, stat-strip and pinnedAction proposals accepted. Gates on a real grammar render: grammar-geometry reads a one-edge-ruled square box (a stat-strip cell, a pinned bar) as no card; ui-proof-brief measures a card's top inset below an in-flow artwork zone and counts an outlined transparent box (an off chip) by its outer edge. draw-render's root-hook map stays only for a product still on 0.5.x. Not published: npm publish awaits the owner. Adds no op check or finding code"
