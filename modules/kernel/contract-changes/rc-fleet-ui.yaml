id: rc-fleet-ui
effectiveAt: '2026-09-28T19:00:00+07:00'
summary: >-
  Reconciler lane G, harness part (D:/starci-tmp/reconciler-design/LANES.md "Lane G", DESIGN.md §17.2, §19, §20),
  plus the owner's UI redesign of 2026-09-28 ("fix the .claude UX/UI so it is easy to track, the information is too chaotic now"). The
  harness (ui/server.mjs, 127.0.0.1:4547, harness.starci.org) now builds ONE snapshot per tick
  (STARCI_STATUS_TICK_MS, default 20 s) and answers every request from it at once; `api status` of each live workflow
  runs in its own background loop and is applied when it returns, so no page waits on the verb. New read-only
  endpoints, one per page: GET /api/home (per live workflow: units that passed their gates, units/hour, ETA, a state
  pill ok|slow|stuck|done, the top RCA reason, who is on it and the next action - all from
  scripts/kernel/progress-rca.mjs workflowView, the function behind api status progress/rca; the owner-only items;
  one health strip), GET /api/workflow?id (op-graph, units by job state queued|running|reported|settled|released,
  the Kernel's decision log, RCA clusters and ranked actions, Decision Items, worktrees), GET /api/system (reconciler
  engine, controllers mode / last pass / would vs act rows, services, seats, ledgers, open SLA violations, GC summary,
  op health, the Supervisor's decisions, the land gate), GET /api/nav, GET /api/reconciler/state and GET
  /api/reconciler/decisions[?workflow] (DIs across ledgers). The navigation is Overview, Workflow, System, Log
  plus Needs owner only while an owner item waits; the older pages stay reachable from System. /api/snapshot keeps
  its shape (each live workflow gains a `fleet` field). No api verb, ledger schema or op contract changes; nothing
  here writes.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-fleet-ui.yaml
  - ui/reconciler.mjs
  - ui/server.mjs
  - ui/CONTRACT.md
  - ui/src/reconciler.tsx
  - ui/src/decisions.tsx
  - ui/src/app.tsx
