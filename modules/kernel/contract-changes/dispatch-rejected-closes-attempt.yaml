id: dispatch-rejected-closes-attempt
effectiveAt: '2026-09-29T16:00:00+07:00'
summary: "a dispatch refused at submission (nivo wf-nivo-collab-mum8xsop op-scope.define try 3, attempt 28: Codex prompt-stuck, retried as attempt 29) left its op_attempts row without settled_at and released_at, so the UI, the frontier and the leg pipeline showed it running for 107 minutes and the unit counted it as a dispatch. Now rejectDispatch ends the attempt in the same transaction (engine/ledger-db.mjs endRejectedAttempt): end_state requeued, settled_at with settled_by kernel and no verdict, released_at, its Orca Task closed (task_closed_at), work_units.dispatches given back, settle_json.message human-readable, the dispatch-rejected event carries attemptId; an unknown effect ends effect-unknown and stays for reconcile. Readers no longer treat settled_at alone as open: ui/api/pipeline.mjs attemptOpen/attemptStatus (requeued reads retry, worker-dead failed, effect-unknown blocked, cancelled dropped) and the fleet and active-attempt lists. scripts/kernel/repair-rejected-attempts.mjs seals the rows an older runtime left open (dry run by default). Adds no check or finding code"
paths:
  - engine/ledger-db.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/api-verbs/dispatch.mjs
  - scripts/kernel/repair-rejected-attempts.mjs
  - modules/kernel/api-commands/dispatch.yaml
  - ui/api/pipeline.mjs
  - tests/rejected-attempt-repair.spec.mjs
  - tests/terminal-create-recovery.spec.mjs
reach: new-legs
