id: hfs-be-query-in-loop
effectiveAt: '2026-09-30T01:00:00+07:00'
summary: >-
  HFS back-end catalog rule R77 (BE_QUERY_IN_LOOP) with its Vietnamese failure code. `@starci/eslint-canon-be` becomes 1.5.0 and gains
  no-query-in-loop (in the query-safety law): a repository, entity-manager or query-builder read inside a for loop or an array iteration
  callback is an N+1 and is refused; the nest profile follows the new canon version, content digest and rule list, and lint-why maps the
  rule to its code. A repository adopts the canon through its own migration lane; there is no compatibility window.
reach: new-legs
