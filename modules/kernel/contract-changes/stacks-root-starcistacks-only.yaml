id: stacks-root-starcistacks-only
effectiveAt: '2026-09-28T20:00:00+07:00'
summary: >-
  .starcistacks is the only stack root. The pre-rename `.stacks` root is no longer read: check-starcistacks
  finds the declaration only at <repo>/.starcistacks/application-stacks.yaml and no longer emits
  STACKS_LEGACY_ROOT or STACKS_DUAL_ROOT; a service's stack.root is the constant .starcistacks; sonar-local
  reads the source host's dev stack at <source>/.starcistacks/dev; serve-ask writes custody only under
  .starcistacks/dev/runtime/files. A repository still on `.stacks` renames the tree before its next leg.
reach: new-legs
paths:
  - modules/kernel/contract-changes/stacks-root-starcistacks-only.yaml
  - modules/schemas/application-stacks.schema.yaml
  - modules/schemas/stacks-layout.yaml
  - modules/schemas/index.yaml
  - scripts/checks/check-starcistacks.mjs
  - scripts/checks/sonar-local.mjs
  - scripts/kernel/serve-ask.mjs
  - docs/application-stacks.md
  - modules/ops/_common.yaml
  - modules/ops/ops/provision.ask.yaml
  - knowledge/repository-baseline.yaml
