id: hfs-unversion
effectiveAt: '2026-09-29T23:30:00+07:00'
summary: >-
  Owner ruling 2026-09-29: the HFS standard was never released as a first version, so the runtime carries no second-version
  label. Every "HFS v2" wording in knowledge, docs, schemas, failure-code texts, package READMEs and changelogs, script
  comments and specs is now just "HFS". knowledge/hfs/slots.yaml and rules.yaml are version 1.0.0 (schema ids
  starci/hfs-slots@1 and starci/hfs-rules@1, urn:starci:hfs-slots:1, hfs-rules:1 and hfs-repo:1); hfs.json pins manifest
  major 1 (the loader and hfs-repo schema accept 1 or more) and every example and fixture hfs.json follows. The HFS
  contract-change entries hfs-v2-* and hfs2-* are renamed without the version (they were never released); retired-paths
  records the new removedIn id. The hard rule is added to skills/claude-debug/SKILL.md section 5.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-unversion.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - modules/schemas/hfs-slots.schema.yaml
  - modules/schemas/hfs-rules.schema.yaml
  - modules/schemas/hfs-repo.schema.yaml
  - modules/schemas/index.yaml
