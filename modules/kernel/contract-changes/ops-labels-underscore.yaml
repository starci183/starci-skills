id: ops-labels-underscore
effectiveAt: '2026-09-28T15:35:00+07:00'
summary: "The op label map moves to modules/ops/_labels.yaml: without the underscore prefix the op catalog scanners (scripts/route/build-ops-registry.mjs, route-op.mjs) read it as an op and emitted a bogus 'labels' registry entry plus a 'no route: block' note. The '_' prefix is the existing convention for shared non-op documents under modules/ops/ (_common.yaml). The generated modules/ops/registry.yaml is rebuilt current (37 ops; picks up code.refactor's canonWire/resumeFrom/admissionBase params it was missing). Readers repoint: scripts/lib/display-names.mjs LABELS_FILE; doc/cite updates in modules/kernel/api.yaml, contract-changes (readable-names), modules/schemas/index.yaml, progress-report.mjs and display-names.spec.mjs. Adds no check or finding code; nothing refused before is accepted or vice versa"
reach: new-legs
paths:
  - modules/ops/_labels.yaml
  - modules/ops/registry.yaml
  - modules/schemas/index.yaml
  - modules/kernel/api.yaml
  - scripts/lib/display-names.mjs
