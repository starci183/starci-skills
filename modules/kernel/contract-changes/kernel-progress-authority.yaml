id: kernel-progress-authority
effectiveAt: '2026-09-28T12:55:00+07:00'
summary: >-
  Each Kernel owns its workflow's progress. api status adds `progress` (units that passed their gates per
  hour, legs done, running vs allowed parallelism, queued-ready, ETA, stall) and `rca` (failed/blocked
  attempts clustered by cause with RANKED candidate actions, each with its exact command, expected effect,
  tier light|heavy|proposal|supervisor and decision-log memory; scripts/kernel/progress-rca.mjs). New
  kernel verbs: decide (decision log; a reverted action is refused), graph-edit (light, bounded,
  reversible unit edits: drop, widen, wire, continue, retry with a changed shape, reorder, split, merge,
  params, canon scan + recut, undo), dispatch-ready (parallelism push), op-override (local additive op
  variant rendered as packet context.kernel_override), redesign (dispatch work.author|scope.define|
  goal.revise with the RCA as brief, routed as allocation.redesign.routeAs), kernel-proposal (tier 2 for
  the Supervisor). driver-loop.yaml progress is the Kernel's first duty every wake; the Supervisor tick's
  progress duty (scripts/supervisor/progress-watch.mjs) is the backstop: progress-stall, runtime RCA
  clusters and kernel proposals are its owed actions, and the owner digest says why a workflow is slow.
reach: new-legs
