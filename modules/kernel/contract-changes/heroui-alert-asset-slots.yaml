id: heroui-alert-asset-slots
effectiveAt: '2026-09-27T19:55:00+07:00'
summary: "Owner rulings 2026-09-27 (heroui-alert-asset). (1) The Alert is the REAL HeroUI Alert (@heroui/styles alert.css): a white bg-surface row with shadow-surface, a small indicator glyph (size-4, p-1) LEFT of the title in the tone's soft-foreground, the title in that same tone colour, a muted description, its action the grammar Button variant=secondary exactly as the grammar Alert renders it - no tone-filled background, no IconTile. Earlier runtime text wrongly said an Alert has a tone fill: fixed in knowledge/ui/examples/brand-direction.nivo.yaml (notice recipe, A14, rubric G2), interface.draw worker text and grammar-dna proof, scripts/work/draw-critic.mjs DEFAULT_RUBRIC G2; new knowledge case ACCENT-5 case-5. New DNA-gate code DRAW_ALERT_ANATOMY (scripts/checks/draw-dna.mjs): a declared (inline style, bg-* class, <style> rule) or captured (draw-render record anatomy.alerts) Alert background other than --surface, an IconTile or a 32px+ indicator inside it, an indicator not left of the title, a hand-made action or a Button variant outside the DNA closedValues. (2) A Meter track is the HeroUI h-2 (8px) track across the full width of its band - the segmented Meter (DNA Meter segments, grammar 0.5.2) the h-1 (4px) track - segments equal with small gaps, never a stub: DRAW_METER_TRACK; a segmented Meter no longer needs data-grammar-proposal=Meter.segments (DNA since 0.5.2), only a hand-segmented one (segments without the meter-segment anatomy) is DRAW_RATIO_NOT_METER (declared height/width, and the captured track vs its band's content box and segments, draw-render anatomy.meters). (3) Artwork comes from interface.asset, never reused ad hoc: a drawing marks data-asset-slot on its MediaFrame/Image/img (placeholder allowed) and requests it in asset-request.md - DRAW_ASSET_SLOT_UNDECLARED otherwise; scripts/work/asset-slot.mjs list|check; api settle of interface.draw/interface.asset records asset-slot-owed / asset-slot-filled (filled = data-asset-sha256 names the bytes of its src), api status lists assetSlotsOwed[] and nextActions proposes a dispatch of interface.asset for them; interface.asset fills the placeholder (new write `placeholder`: src + data-asset-sha256 + data-asset-prompt only) under the brand imagery.promptRules. The brand masters (the unicorn masters) are the LANDING's art and the style reference only: every product slot is owed a NEW generation (new pose/composition, same style) - a slot is filled only by bytes that are not byte-identical to any brand/assets/** master and carry their prompt (data-asset-prompt or <file>.prompt.txt); a master may be a placeholder only; a done work/ui-screen@1 with an owed slot is refused ASSET_SLOT_UNFILLED (scripts/checks/check-example-work.mjs); BRAND-2 case-1/case-3 reworded (a new generation in the masters' style, never their bytes on a product surface). (4) The Nivo seed records the owner's stated dashboard choices (layout r5 devin, overview band r5 claude, real HeroUI Alert, black brand ink #040d1c with red only for artwork/danger, --background canvas, neutral IconTile, segmented Meter proposal) as stated, still pending the brand-direction-review ask: work/brand@1 pendingRulings[].ownerStated (optional prose; the ruling stays open), and the review question text names it. Adds codes DRAW_ALERT_ANATOMY, DRAW_METER_TRACK, DRAW_ASSET_SLOT_UNDECLARED, ASSET_SLOT_UNFILLED - advisory for an interface.draw leg admitted earlier"
reach: new-legs
ops: [interface.draw, interface.asset]
adds:
  codes:
    - DRAW_ALERT_ANATOMY
    - DRAW_METER_TRACK
    - DRAW_ASSET_SLOT_UNDECLARED
    - ASSET_SLOT_UNFILLED
