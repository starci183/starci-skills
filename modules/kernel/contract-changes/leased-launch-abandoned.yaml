id: leased-launch-abandoned
effectiveAt: '2026-09-26T01:35:00+07:00'
summary: "nivo inc-c1d5bdbea173: a Kernel wrapped api dispatch --spawn in a shell timeout, the api died mid-spawn and the job stayed leased with no worker; drop, --dead-worker and dispatch all refused it, and the lease deadline (jobs.deadline) was never read. A leased job with no worker bound now reads liveness launching until its lease deadline and launch-abandoned after it (a dead-worker liveness): status lists it in frontier.deadWorkerJobs (worker-dead), and api reconcile --dead-worker [--settle-failed] accepts a leased job, requeuing it with its leases released or settling it on effect evidence; before the deadline it refuses dispatch-in-flight. api dispatch records the terminal it creates on the leased job the moment it exists (payload.launchTerminal {handle, at}, scripts/agent/lib.mjs spawnAgent onCreated); reconcile --dead-worker and api settle of a job with no bound worker quit and close that terminal (nivo inc-e523617a3c31). Every Run-scoped call binds the workflow's Orca Run to the current Kernel terminal first (api reply and a settled job's Task close as well as dispatch; event run-rebound), so a replaced Kernel is never refused consumer_fenced. driver-loop.yaml boundary.apiCallsRunToEnd: never wrap an api call in a shell timeout. Adds no check or finding code"
paths:
