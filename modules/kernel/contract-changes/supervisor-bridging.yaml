id: supervisor-bridging
effectiveAt: '2026-09-28T02:30:00+07:00'
summary: "Owner mandate 2026-09-28: the Supervisor adds supplementary (bridging) workflows when workflows depend on each other and reorganizes them (modules/supervisor/bridging.yaml). scripts/kernel/dependency-graph.mjs computes each ledger's cross-workflow dependency graph - peer-waits, typed until-* conditions, gates naming a peer's job, peer requests, foundation dependents, foreign-file incidents, refused record-change declarations (new record-change-refused event on record-change-not-owner), work-graph reads - and flags circular-wait, unowned-need (incl. one foundation spelled two ways: nivo.brand ~ brand, shell ~ layout-tree), hub-blocker (>= 2 workflows on one peer, clear-cut when on ONE job queued >= 2h) and duplicate-work (shared wiring excepted), each with the Supervisor's action. scripts/supervisor/bridge.mjs detect|list|bridge|rewire|transfer|revise|designate: bridge defines a bridging workflow through define-goal (--defined-by supervisor: goal json definedBy supervisor, provisional, bridge {bridgeId, reason}) that owns the shared part as a foundation and re-types the dependents' waits as peer-wait --until-foundation on it; transfer moves a foundation's or a record's ownership (signals scope ownership-transfer, work-ownership.mjs ownerOf rule 0 transfer) or merges an alias foundation; revise applies define-goal --revise with --approved-by supervisor (goal-revision-approval source supervisor-autopilot, ownerApproval null); designate resolves the lead side of a circular wait --by supervisor. Under autopilot every action is recorded provisional (signals scope supervisor-bridge, events supervisor-bridge-*, supervisor-action in the supervisor ledger); autopilot off needs --owner-ok. start-workflow's launch prompt for a Supervisor-defined goal names the provisional bridge, never an owner approval. api peers returns the ledger graph as dependencies; api status carries dependencies when the workflow takes part; poll.mjs prints DEPENDENCY lines; the ui snapshot adds projects[].dependencies (contract 2026-09-28.2). Adds no op check or finding code"
reach: new-legs
paths:
  - modules/supervisor/bridging.yaml
  - modules/kernel/api.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/kernel/dependency-graph.mjs
  - scripts/kernel/api.mjs
