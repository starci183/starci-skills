  - scripts/kernel/start-workflow.mjs
  - scripts/goal/define-goal.mjs
  - scripts/supervisor/bridge.mjs
  - scripts/supervisor/poll.mjs
  - ui/server.mjs
  - ui/contract-shapes.mjs
  - ui/src/contract.ts
  - ui/src/types.ts
  - ui/CONTRACT.md
  - tests/supervisor-bridge.spec.mjs
