id: workflow-verify-head-pinned
effectiveAt: '2026-10-02T07:30:00+07:00'
summary: >-
  REVIEW.VERIFY IS PINNED TO THE HEAD THAT LANDS (WFWT2 2.5). Before, the finish's default judge
  (scripts/kernel/workflow-checkpoint.mjs reviewVerifiedOf) trusted the head the review.verify report named. Now the
  verified head is the one the runtime recorded at the review's settle (its workflow-checkpoint event: review.verify owns no
  path, so that checkpoint is the tree it verified); the report's head must name that same commit (an op checkpointed
  while the review ran makes it stale), and both must equal the head that lands, else workflow-finish-verify-stale. The
  report field branch is deleted (ops never push); the op prompt says what head means (the commit the checks ran on; for
  review.verify, the head it verified). review.verify gains the proof verified-head.
reach: new-legs
paths:
  - modules/kernel/contract-changes/workflow-verify-head-pinned.yaml
  - scripts/kernel/workflow-checkpoint.mjs
  - scripts/kernel/op-prompt.mjs
  - scripts/kernel/report-envelope.mjs
  - scripts/kernel/handover.mjs
  - modules/kernel/verdict-contract.yaml
  - modules/ops/ops/review.verify.yaml
  - tests/kernel/workflow-checkpoint.spec.mjs
