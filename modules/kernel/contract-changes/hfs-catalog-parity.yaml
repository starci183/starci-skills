id: hfs-catalog-parity
effectiveAt: '2026-09-30T15:00:00+07:00'
summary: >-
  Lane C0 step 1 (BE-CONVENTION 3.1, redundancy RED19/RED20/RED23): the HFS rule catalog is held to what ships in
  both directions. scripts/checks/check-hfs-rules.mjs adds HFS_RULE_CODE_UNEMITTED (a rule that claims every enforcer
  is built but whose code no eslint rule, plugin `why` entry or machine/hfs/work-validate file emits),
  HFS_RULE_UNCATALOGUED (a shipped eslint rule no catalog enforcer names, or a plugin `why` code its rule does not
  list), HFS_RULE_LAW_DRIFT (README section 12 rows equal the catalog id/code/law; no typed rule range) and extends
  HFS_RULE_ENFORCER_STALE to machine/hfs/work-validate enforcers. R21 has one code (HFS_DUPLICATE_CODE; the machine's
  HFS_DUPLICATE_BLOCK is gone) and one threshold, ruleParams.<profile>.duplicateBlock {lines: 8, tokens: 60}, applied
  to every copy (same owner included); failure-code text carries no number. The hand tables lint-why.mjs and
  style-why.mjs are deleted (loadRuleCatalog().lintCode derives the why code). Catalog skeleton of the locked
  convention: R36 becomes BE_SQL_OUTSIDE_PERSISTENCE (sql-text-only, no-query-builder planned); new R84
  BE_CONNECTION_DUPLICATE, R85 BE_RAW_INJECT, R86 BE_SQL_TABLE_OWNER, R87 BE_CQRS_SHAPE, R88 BE_TRANSPORT_SHAPE,
  R89 BE_SOURCE_FORM, R90 BE_INFRA_OWNER with their planned enforcers, and R91 FE_SOURCE_FORM, R92 FE_COMPONENT_API,
  R93 FE_VENDOR_BOUNDARY that own the FE plugin rules no rule named. Every other shipped eslint rule gets its R-id;
  the SAB-only cdc and event-delivery laws are deleted from eslint-canon-be with the NEST-DELIVERY-CONTRACT-SHAPE
  obligation. Shipped machine enforcers of R15, R26, R27, R31, R53, R57, R64 lose `status: planned`.
reach: new-legs
adds:
  codes: [HFS_RULE_CODE_UNEMITTED, HFS_RULE_UNCATALOGUED, HFS_RULE_LAW_DRIFT, BE_SQL_OUTSIDE_PERSISTENCE, BE_CONNECTION_DUPLICATE, BE_RAW_INJECT, BE_SQL_TABLE_OWNER, BE_CQRS_SHAPE, BE_TRANSPORT_SHAPE, BE_SOURCE_FORM, BE_INFRA_OWNER, FE_SOURCE_FORM, FE_COMPONENT_API, FE_VENDOR_BOUNDARY]
paths:
  - modules/kernel/contract-changes/hfs-catalog-parity.yaml
  - modules/kernel/failure-codes.yaml
  - modules/kernel/retired-paths.yaml
  - modules/models/code-patterns.yaml
