id: hfs-be-ambient-id
effectiveAt: '2026-10-02T11:00:00+07:00'
summary: >-
  R142 BE_AMBIENT_ID (alpha.5 item 6.5). eslint-be `no-ambient-id` refuses `randomUUID` of Node's crypto (named, namespace, default or the
  global `crypto`), the `v1`/`v4`/`v6`/`v7` generators of `uuid`, `nanoid` and `ulid` anywhere but `platform/ids` and the test world,
  specs included: code asks the injected `Ids` port and a spec provides `fakeIds()`. The generators are found by the module they
  are imported from, never by a local name. The examples' direct `randomUUID()` call sites are converted when the examples are
  re-pinned to the published canon, so the examples stay at lint 0.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-be-ambient-id.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - modules/kernel/failure-codes.yaml
  - packages/eslint/be/ambient-id.mjs
  - packages/eslint/be/index.mjs
  - packages/eslint/be/README.md
  - packages/eslint/be/CHANGELOG.md
