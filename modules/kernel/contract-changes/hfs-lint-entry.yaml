id: hfs-lint-entry
effectiveAt: '2026-10-01T12:00:00+07:00'
summary: >-
  Lane C0 (lint entry): ONE lint entry, ONE report, ONE Sonar file. (1) The entry is `hfs lint [--repo <dir>] [--changed <file>...]
  [--fix] [--format text|json] [--sonar <file>] [--stylelint <glob>]` (packages/hfs/lint/run.mjs), behind the managed scripts `lint`
  (`hfs lint`; front end: `npm run codegen --silent && hfs lint --stylelint "<styleGlob>"`) and `lint:fix` (the same with `--fix`).
  It runs ESLint through the repository's own install (per-file rules and the project-graph rules of the architecture machine),
  the repository pass of `hfs check` for what has no TypeScript file to sit on, and stylelint when --stylelint names the glob.
  (2) The one report format is `starci/lint@1`: `{ schema, ok, changed, counts.error, engines, errors[], findings[{ engine, rule,
  code, severity, path, line, column, message }] }`, printed on stdout by `--format json`; engine is starci-hfs (code = failure
  code), eslint (code = the `[CODE]` prefix of the message when present) or stylelint. Exit code: 0 no finding, 1 at least one
  finding, 2 a tool could not run (a missing ESLint or stylelint install, an unreadable report, a crashed check) - never a pass.
  (3) The one Sonar file is `reports/lint.sonar.json`, written by `npm run lint -- --sonar reports/lint.sonar.json` (engines
  starci-hfs, eslint and stylelint in one Generic Issue Import document); the managed sonar-project.properties carries
  `sonar.externalIssuesReportPaths=reports/lint.sonar.json` only, and the managed CI workflow runs that one lint step before the
  Sonar scan (the scan and gate keep `!cancelled()`, no continue-on-error). (4) Removed, not aliased: the scripts `lint:check`,
  `lint:report`, `lint:report:css`, `hfs:check` and `hfs:report`, the CLI verb `hfs report <eslint|stylelint>` and the flag
  `hfs check --sonar`; `hfs check` stays as the repository pass (`--fast`, `--base`, `--json`). R13 (HFS_CI_MISSING_CANON) now
  demands a CI step that runs `hfs lint` (at the pinned @starci/hfs version when one is named) and a pre-push that runs
  `npm run typecheck` and `npm run lint`. (5) The land-gate command is exactly `npm run lint -- --changed <files...> --format json`:
  ESLint and stylelint see only the listed files, and of the repository findings only those on a listed file or on no file are
  kept; the gate reads `ok` / the exit code (0 pass, 1 findings in `findings[]`, 2 the gate could not run and blocks). Examples
  must be re-rendered with `hfs sync --write`.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-lint-entry.yaml
  - knowledge/sonar-gate.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/repo/tooling.yaml
  - packages/hfs/lint/run.mjs
  - packages/hfs/templates
  - packages/hfs/report/sonar.mjs
  - packages/hfs/bin/hfs.mjs
  - packages/hfs/README.md
  - scripts/lib/hfs-rules/pipeline.mjs
  - skills/push-git/SKILL.md
