id: starcistacks-terraform-decoded-files
effectiveAt: '2026-09-28T19:30:00+07:00'
summary: >-
  stacks-layout custody.gitignoreRules also denies .starcistacks/*/infra/terraform/files/ and
  .starcistacks/*/infra/terraform/*.tar.gz after the infra value denies. The !infra/terraform/** re-include
  alone left the credential files terraform decodes for a deploy committable: adopting the previous list in
  mia-mia-backend turned 14 decoded vps credentials under vps/infra/terraform/files/ (plus files.tar.gz)
  from ignored to untracked. nivo-backend already carried both denies. The todo-app example kit's
  .gitignore now follows the ordered list too. check-starcistacks no longer raises STACKS_CI_UNUSED on a
  frontend governed by its backend's declaration for a service that does not name that frontend among its
  projects (the backend-only image registry): wrongly flagged example nivo-fe against the nivo-backend
  container-registry entry, 2026-09-28. Safety-critical: a leak one git add away is never demoted for an older leg.
safetyCritical: true
reach: new-legs
paths:
  - modules/kernel/contract-changes/starcistacks-terraform-decoded-files.yaml
  - modules/schemas/stacks-layout.yaml
  - scripts/checks/check-starcistacks.mjs
  - tests/check-starcistacks.spec.mjs
  - examples/todo-app-backend/.gitignore
