id: registry-compaction-alpha4
effectiveAt: '2026-10-02T21:40:00+07:00'
summary: >-
  Registry compaction at the release line (row S1-14): every entry whose effectiveAt predates the
  previous published release's base (1.0.0-alpha.3, 7b2737d2e, 2026-09-28T18:55:01+07:00) was deleted
  from modules/kernel/contract-changes/ - 265 entry files. A leg admitted under alpha.3 or later
  already carries every earlier change in its admitted contract, so the registry stays operational
  only for what landed after that base; the removed entries live in git history and the CHANGELOG,
  there is no archive copy. A pre-base leg (only a pre-clean-slate ledger can hold one) is judged by
  the current contract for a deleted change, exactly as for an unregistered one.
reach: new-legs
paths:
  - modules/kernel/contract-changes/
