id: settle-runtime-service
effectiveAt: '2026-09-28T13:40:00+07:00'
summary: >-
  SETTLE IS A RUNTIME SERVICE (owner ruling settle-runtime-service). scripts/reconcile/job-settle.mjs
  reconcileJobSettle, called by every workflow watchdog loop each allocation.settler.everyMs and right after
  api report, settles every reported job (filed or consumed, still live) whose report is done and whose declared
  checks re-verify green, through the same api check + api settle --verdict pass path, and proves its worker
  released (reported -> settled -> released, events job-settle-settled / job-settle-released). Everything else is
  handed to the Kernel as needs-kernel-decision (event job-settle-needs-kernel, api status settleDecisions, the top
  rca action); settle-backlog counts only those. api settle keeps a synchronous core and queues its heavy tail
  (session retention, media, input re-baseline, artifact indexing) to api settle-tail, retried by the settler. The
  Supervisor tick asserts no reported job older than allocation.settler.invariantMaxAgeMs is neither settled nor
  handed over (settle-unsettled-report, a runtime bug).
reach: new-legs
paths:
  - modules/kernel/contract-changes/settle-runtime-service.yaml
  - modules/kernel/owner-rulings.yaml
  - modules/kernel/driver-loop.yaml
  - modules/kernel/kernel-prompt.md
  - modules/cli/commands/kernel/settle-tail.yaml
  - modules/models/runtimes.yaml
  - scripts/reconcile/job-settle.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/api-verbs/settle-tail.mjs
  - scripts/kernel/api-status/settle-decisions.mjs
  - scripts/kernel/api-boolean-flags.txt
  - scripts/kernel/kernel-authority.mjs
  - scripts/kernel/progress-rca.mjs
  - scripts/kernel/watchdog.mjs
  - scripts/supervisor/tick.mjs
