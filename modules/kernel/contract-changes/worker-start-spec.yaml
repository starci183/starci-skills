id: worker-start-spec
effectiveAt: '2026-10-01T22:00:00+07:00'
summary: >-
  ORCA'S STANDARD LAUNCH AND IDEMPOTENCY, NOTHING PARALLEL (lane C0 Lane A, Orca deep map items RR1, W1(a) and W1(b)).
  (1) Every agent starts through scripts/api/orca/worker-start.mjs with --spec <prompt> [--task-title <t>]: Orca files the
  worker's Task in the same call and returns it as result.taskId, so a start that fails leaves no orphan Task. The
  scripts/api/orca/task-create.mjs wrapper and its calls.yaml entry are deleted; worker-start no longer declares --task
  or --retry-of (Orca's --retry-of needs --task), and its failed recovery is a new --spec start after the failed
  Dispatch is settled. The Kernel's op Task title stays `<op> #<attempt>` and its display name `[Op] <...>`.
  (2) The worker's terminal is result.worker.agentTerminalHandle from the start receipt, else the attestation
  worker-show's result.dispatch.assigneeHandle. scripts/api/orca/dispatch-show.mjs and its calls.yaml entry are
  deleted; a start that names neither is refused worker-terminal-unknown, a ready start without a Task
  worker-start-no-task, and both stop and release the worker they started. (3) calls.yaml idempotency is implemented:
  every mutation declares `replay` none | reissue | request, and scripts/api/orca/lib.mjs orcaCall enforces it
  (scripts/checks/providers.mjs refuses a mutation without one). `request` mutations (run-create, run-use,
  worker-start) carry --retry-request from their FIRST issue, the id is the UUIDv5 (fixed namespace ORCA_REQUEST_NAMESPACE) of the verb and the
  caller's ledger identity (api dispatch: the job and its lease token; start-workflow: the workflow, Kernel attempt
  and reservation token; the Supervisor: its attempt and token; a [Worker]: its job and spawn attempt; the draw critic:
  its clean directory; run-use: the Run and terminal it binds), so a restarted process derives the same id. A lost
  receipt (timeout or non-JSON) is settled by the new `request-show` read: completed or pending is replayed once
  under the same id, absent or unreadable is outcome unknown (request-absent, request-show-unreadable), never a blind
  second issue. `reissue` mutations (worker-stop, worker-release, task-update) are naturally idempotent and are
  re-issued once without an id, so the settle-dispatch recovery's deliberate repeat stays a fresh effect. `none`
  (reply, send, worktree and terminal writes) is never re-issued by the runner. Adds request-show to
  modules/host/orca/api.yaml publicCommands and the workflowKernel allowlist; removes task-create and dispatch-show
  from that allowlist. Adds four failure codes: worker-start-no-task, worker-terminal-unknown, request-absent,
  request-show-unreadable.
paths:
  - modules/kernel/contract-changes/worker-start-spec.yaml
  - modules/host/orca/calls.yaml
  - modules/host/orca/api.yaml
  - scripts/api/orca/lib.mjs
  - scripts/api/orca/request-show.mjs
  - scripts/api/orca/worker-start.mjs
  - scripts/api/orca/run-create.mjs
  - scripts/api/orca/run-use.mjs
  - scripts/agent/lib.mjs
  - scripts/kernel/api-verbs/dispatch.mjs
  - scripts/kernel/start-workflow.mjs
  - scripts/supervisor/start-supervisor.mjs
  - scripts/supervisor/workers.mjs
  - scripts/work/draw-critic.mjs
  - scripts/checks/providers.mjs
reach: new-legs
