id: canon-conformance
effectiveAt: '2026-09-27T04:00:00+07:00'
summary: "Canon-conformance debt cleanup: scripts/checks/canon-scan.mjs measures one product repository with its own eslint.config and ESLint while its import of the canon package (code-patterns.yaml canon.package) resolves to this runtime's packages/eslint source, plus the architecture check (architecture.json when present), and prints a starci/canon-findings@1 record: findings by canon law, rule and folder, and the conformance cut - pairwise-disjoint slices in modules/models/canon-conformance.yaml waves (foundation with the shape-slot seams, shared tiers, surfaces), each at most allocation.slicing targetMinutes[1]/weights.file files. code.refactor gains the owner param canonFamilies: a set leg runs canon-scan over its owned paths before and after (--fix first, then hand restructure; never a disable, level change or ignore) and proves status ok (proof canon-conformance); its policy.canonConformance names canon-scan's slices as the cut. review.verify lint runs canon-scan with the goal's families as the conformance gate. archetypes.yaml phrase set canonIntent (Vietnamese phrases for debt cleanup and source normalization, conform to the starci canon, tech debt, ...) routes to refactor and is excluded from feature-build-with-ui, feature-build-backend and verify-only. A leg admitted earlier carries no canonFamilies and is unaffected"
ops: [code.refactor, review.verify]
adds:
  checks: [canon-scan]
reach: new-legs
paths:
  - scripts/checks/canon-scan.mjs
  - modules/models/canon-conformance.yaml
  - modules/ops/ops/code.refactor.yaml
  - modules/ops/ops/review.verify.yaml
  - modules/ops/registry.yaml
  - modules/goal/archetypes.yaml
  - modules/schemas/index.yaml
  - modules/models/registry.yaml
  - tests/canon-conformance.spec.mjs
