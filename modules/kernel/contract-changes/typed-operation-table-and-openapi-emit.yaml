id: typed-operation-table-and-openapi-emit
effectiveAt: '2026-10-01T00:00:00+07:00'
summary: >-
  Canon: a versioned operation `<name>@<version>` is declared once in the app's typed operation table
  (`apps/<app>/src/operations.ts` exporting `OPERATIONS`, made by `defineOperations` with `query`/`mutation` of the platform
  capability `operations`; BE-OPERATIONS-1). New rule R95 `BE_OPERATION_CONTRACT` (eslint-be `operation-contract-decidable`,
  `operation-route-driven-by-table`): an input or output of `any`, `unknown` or `Record<string, unknown>`, a refusal that is not a
  closed union of string literals, and a route that does not take `OperationRequest<Table>` and answer `OperationReply<Table>` of one
  table are errors. `hfs emit-contracts` writes `contracts/<app>/openapi.json` (OpenAPI 3.1, `x-operation`, oneOf over success and
  refusal, sorted keys) from the table with the type checker, an undecidable type being an error naming the operation; the full
  `hfs check` compares it with the committed file like the GraphQL schema (HFS_CONTRACT_SNAPSHOT_DRIFT). New failure code
  BE_OPERATION_CONTRACT, text of HFS_CONTRACT_SNAPSHOT_DRIFT updated.
reach: new-legs
