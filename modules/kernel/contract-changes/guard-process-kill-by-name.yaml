id: guard-process-kill-by-name
effectiveAt: '2026-10-01T20:00:00+07:00'
summary: >-
  The op command guard (scripts/guards/command-guard.mjs, the PreToolUse hook bound to an op's Orca terminal) refuses a kill
  that selects processes by image name or pattern - taskkill /IM or /FI (any of /, // or - spellings), pkill, killall,
  Stop-Process -Name/-ProcessName (spps, PowerShell kill), wmic process where name=... - through every wrapper the guard
  opens (cmd //c, powershell -Command, bash -c), with PROCESS_KILL_BY_NAME: the machine is shared with Orca and every other
  agent, and a lane's taskkill of node.exe restarted Orca (2026-10-01). Ending a PID the agent started (taskkill /PID,
  kill <pid>, Stop-Process -Id) passes. modules/ops/_common.yaml states the rule for every op.
reach: new-legs
paths:
  - modules/kernel/contract-changes/guard-process-kill-by-name.yaml
  - scripts/guards/command-guard.mjs
  - modules/ops/_common.yaml
  - modules/kernel/failure-codes.yaml
  - tests/process-kill-guard.spec.mjs
