id: test-world-library
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  The shared e2e library @starci/test-world 1.0.0 lands in packages/test-world (ported from lane/tw a7017c67d; main's world law
  is unchanged: R47 keeps test-world.config.ts, use-test-world.ts, the jest hook files and fakes/ in src/tests/world/, and R48's
  only skip is the library's useSandbox). It carries the warm stack behind toxiproxy, the network-edge fakes, the Nest boot, the
  typed useTestWorld handle and the starci-test-stack bin behind the managed test:stack script, with its 172 node:test specs.
  New in the port: the run's outage lock. Every world holds it shared while it boots, around every test (beforeEach/afterEach
  that useTestWorld registers) and while it stops; cut(), latency(ms), during(fn) and keycloak.rotateClientSecret take it
  exclusively themselves and keep it until restore() (a rotation until the world stops), so an outage spec never runs beside
  another spec file of the run and a spec cannot forget the lock. canon-pins.yaml pins @starci/test-world 1.0.0 for back ends.
reach: new-legs
paths:
  - modules/kernel/contract-changes/test-world-library.yaml
  - packages/test-world/package.json
  - packages/test-world/CHANGELOG.md
  - packages/test-world/README.md
  - packages/test-world/src/nest/world-lock.ts
  - packages/test-world/src/nest/world.ts
  - packages/test-world/src/config/define.ts
  - knowledge/hfs/canon-pins.yaml
  - packages/README.md
