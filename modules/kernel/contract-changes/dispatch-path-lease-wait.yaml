id: dispatch-path-lease-wait
effectiveAt: '2026-09-25T12:40:00+07:00'
summary: "a path overlap with a LIVE durable lease was a dispatch rejection: nivo wf-nivo-modules-agentos-mudqjov6 dispatched a qwen job twice and both were rejected at step reserve ('resource path:apps/app/src/messages/en.json overlaps durable lease ...') behind its own running op-interface.implement-f291042a12 (en.json, vi.json, accounting), recorded dispatch-rejected and raised repeat-reject OWED (cae2e44b). Now api dispatch --spawn (before the provider circuit, the leases and any Orca call, and again when reserve loses the race) and api route answer reason path-lease, waiting:true, naming each holder {jobId, opId, workflowId, status, sameWorkflow, paths, expiresAt}: the job stays queued with no dispatch-rejected or route-decided event, api status projects it queuedBecause path-lease with blockedBy {path, job, op, expiresAt} and the expiry in detail, and once the holder settles (releasing its rows) it reads ready, the frontier turns actionable and the next wake dispatches it. Live = unexpired row whose holder has not settled; an expired or orphaned row still refuses at reserve as before (recovery signal). reserveTwoPhase's refusal carries pathConflicts. owed.mjs repeat-reject skips reserve refusals whose every reason is a lease overlap (isLeaseOverlapRefusal, also for events recorded before this change) and still counts real launcher failures. The reserve rejection message now states the real job status (queued for a no-effect refusal) instead of 'failed'. Kernel docs (driver-loop dispatch.ownRunningOverlap, api.yaml route/dispatch refuses path-lease): never dispatch a job whose paths overlap your own running job - sequence it with --after or narrow its paths - and never re-dispatch a waiting job by hand. Adds no check or finding code"
paths:
  - engine/ledger-db.mjs
  - scripts/kernel/api.mjs
  - scripts/supervisor/owed.mjs
  - modules/kernel/api.yaml
  - modules/kernel/driver-loop.yaml
  - tests/dispatch-path-lease-wait.spec.mjs
reach: new-legs
