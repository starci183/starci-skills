id: draw-real-components
effectiveAt: '2026-09-27T21:30:00+07:00'
summary: "Owner ruling 2026-09-27 ('settled'): interface.draw stops hand-writing HTML/CSS and stops taking storybook or reference screenshots as input - it DRAWS WITH THE REAL GRAMMAR COMPONENTS. The deliverable per shape is <XBase>.draw.tsx, a shape-slot XBase ({state, props, on}) composing only @starci/grammar[/<family>] exports with real props and closed variants (icons only as Icon/IconTile/IconButton sources, art only as a relative raster import into Image/MediaFrame, HTML only for layout with grammar-scale layout classes), with one fixture JSON per state (optionally per viewport), rendered at the product slot sizes by scripts/work/draw-render.mjs --component ... --product <app dir> --css <product global css> in the product's own CSS (Tailwind + HeroUI + grammar + brand). New scripts/checks/draw-source.mjs is the source gate: TypeScript first (the product's typescript and tsconfig, @starci/grammar mapped to the grammar the draw renders with; DRAW_TYPECHECK_FAILED), then the AST gate (DRAW_OFF_GRAMMAR_COMPONENT for a JSX element that is no grammar export or local component, DRAW_RAW_STYLED_HTML for non-layout HTML, style, a non-literal or painting className, DRAW_IMPORT_OFF_GRAMMAR, DRAW_LAYOUT_VALUE_UNJUSTIFIED for a spacing step off the GAP/PADDING scale no rationale.json spacing|layout decision names with a rule id, DRAW_BASE_SIGNATURE for no exported <X>Base or a fixture that is not {state, props, on}). New scripts/work/draw-grammar.mjs resolves the grammar a draw renders with: the product's install when the draw type-checks against it, else the runtime-built claude-dist through an alias in the draw bundle only (JS and CSS), recorded as source.grammar {grammarSource product@x | claude-dist@y, upgradeOwed {status owed, from, to, range, inRange}}; the product's package.json is never touched by a draw. draw-render resolves every bare import of a draw from the product app dir (the product checkout is only read), stamps drawn layout elements data-draw-layout, measures rendered-DOM ownership (record ownership; red off-grammar-dom: a painting element owned by a layout element, not a grammar component - grammar roots are marked by data-component, a data-grammar-* hook or a starci-core-* class), writes the DOM snapshot <part>.dom.html (data-component copied to data-grammar-component), reads Alert/Meter anatomy by data-component too, and resolves a workspace package whose exports hide its package.json. draw-loop round --source <XBase>.draw.tsx --fixture <json> --product <app dir> runs the source gate (metric source), renders, judges the rendered DOM, keeps round-<n>/{source.tsx, fixture*.json, grammar.json, harness/, parts, metrics, critique}; finish installs <part>.draw.tsx + <part>.fixture.json (roles render-source, render-fixture). grammarContext gains grammarInputs (op.schema.yaml): interface.draw is component-source - no grammar captures, the grammar dist types + packages/grammar/src (role grammar-source) and @heroui/styles (heroui-styles). interface.implement starts the XBase from the accepted <part>.draw.tsx and owns an owed grammar upgrade. Every interface.draw leg admitted before owes ONE follow-up redraw with real components"
reach: follow-up
followUp:
  op: interface.draw
  ops:
    - interface.draw
  detail: "redraw each shape as <XBase>.draw.tsx with the real grammar components, type-checked and rendered in the product CSS"
ops: [interface.draw, interface.implement]
adds:
  codes:
    - DRAW_TYPECHECK_FAILED
    - DRAW_RAW_STYLED_HTML
    - DRAW_IMPORT_OFF_GRAMMAR
    - DRAW_LAYOUT_VALUE_UNJUSTIFIED
    - DRAW_BASE_SIGNATURE
paths:
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/ops/interface.implement.yaml
  - modules/schemas/op.schema.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/checks/draw-source.mjs
  - scripts/work/draw-grammar.mjs
  - scripts/work/draw-render.mjs
  - scripts/work/draw-loop.mjs
  - scripts/kernel/grammar-context.mjs
  - scripts/kernel/api.mjs
  - tests/draw-real-components.spec.mjs
  - tests/interface-draw-token-render.spec.mjs
  - tests/grammar-context.spec.mjs
