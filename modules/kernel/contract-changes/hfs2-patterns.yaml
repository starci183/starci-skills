id: hfs2-patterns
effectiveAt: '2026-09-29T23:00:00+07:00'
summary: >-
  HFS v2 Phase 0 item 0.11 (lane hfs2-patterns). The knowledge the agents read now states only HFS v2. New canonical
  standard knowledge/hfs/README.md (principles, slots and versioning, hfs.json, repository map, backend and frontend trees,
  tests, secrets, tooling, gates, done criteria, rule catalog R01 to R67) beside the slot manifest slots.yaml. Backend patterns
  rewritten (folder, naming, test, error, function, typing, imports, comment, architecture-check) with new topics api-auth,
  config, logging, persistence and background; frontend patterns rewritten with new topics transport, boundaries, i18n
  (next-intl, [locale], default locale vi, localePrefix as-needed, proxy.ts), css, packages and multi-app; repository
  patterns gain index, starciwork, starcistacks, secrets, tooling, formatter, pins and size-budgets and folder.yaml is
  rewritten to slots and storage states. Each rule cites its catalog rule ids (hfsRules) and the finding codes that judge it.
  docs/source-layout.md and docs/backend-source-pattern.md are rewritten; enforcement.yaml and scan-coverage.yaml carry no
  earlier-standard wording; knowledge/index.yaml, CONTEXT.md and docs/architecture-rules.md point at the standard. References
  to the temporary spec copy are replaced by knowledge/hfs/README.md. The FE-FOLDER-1 machine lists
  frameworkPinnedRootFiles and frameworkPinnedRootExports are unchanged in content so the framework-pinned readers stay valid.
reach: new-legs
