id: evidence-dir
effectiveAt: '2026-09-29T07:50:55+00:00'
summary: "The op evidence directory convention is renamed from E/ to evidence/ (owner: E/ is unreadable). Every op manifest write path, the shared op prompt, the schemas that bind evidence files (work-graph, assets, realization-check, assisted-uat) and the kernel prompt now say evidence/ (evidence/manifest.yaml, evidence/result.md, evidence/work-graph.json, attachments/evidence/<path>); the E/ form is removed with no legacy fallback. Attempts dispatched after this change write <scratch>/evidence/ and file it with api report --attach <scratch>/evidence."
reach: new-legs
