id: hfs-be-doors-and-modules
effectiveAt: '2026-09-30T19:30:00+07:00'
summary: >-
  Lane C0 sub-lane RD (BE-CONVENTION 1.2, 1.7, 1.8, 1.9, 2.6, 2.7 delta 1): @starci/eslint-canon-be 2.0.0 (unreleased)
  ships the errors, default-deny, input, config and module rules by type and by declaring owner instead of by name.
  R38 error-home (a DomainError subclass only in errors/<capability>.error.ts), throw-domain-error (a thrown value's type
  derives from DomainError; a domain owner never throws a platform error) and error-family-shape (one code enum, one
  Record<Code, ErrorKind> table, one empty class); R40 catch-must-account accepts a method call on a receiver typed
  Logger from platform/logging; R41 public-needs-reason takes a PublicReason member of domain/identity and the new
  no-auth-use-guards replaces identity-needs-guard (deleted); R42 input-bounded ships (it merges dto-needs-validator,
  deleted) with no-offset-pagination; R43/R44 no-direct-env-read allows process.env only in the file declaring EnvSource
  in platform/config and refuses @nestjs/config, dotenv and envConfig(), no-secret-default is rewritten on the Secret
  and Url brands; R45 no-global-decorator replaces global-module-allowlist (deleted, with ruleParams.be.globalModules in
  slots.yaml, its loader validation, schema and test), is-global-only-in-app, no-cross-owner-module-import and capability-module-shape join,
  static-module-register allows only register and no-new-injectable is decided by the class declaration. Failure-code
  texts of BE_ERROR_HOME, BE_LOGGER_REQUIRED, BE_DEFAULT_DENY, BE_INPUT_BOUNDED, BE_CONFIG_OWNER, BE_SECRET_DEFAULT and
  BE_MODULE_SHAPE follow. The typed tester fixtures gain repository-shaped owners under fixtures/typed/src.
reach: new-legs
