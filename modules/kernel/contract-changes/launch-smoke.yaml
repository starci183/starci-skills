id: launch-smoke
effectiveAt: '2026-10-02T00:00:00+07:00'
summary: >-
  THE PRE-WORKFLOW LAUNCH SMOKE AND THE CRITIC'S WORKTREE PLACEMENT (lane dv-c0-smoke). scripts/kernel/launch-smoke.mjs
  (starci/launch-smoke@1) proves on the live Orca host, before the owner runs a workflow, the two nesting paths
  launch-through-worker-start had not proven: entry -> [Supervisor] (1) -> [Worker] (2), the [Worker] started by
  scripts/supervisor/workers.mjs startWorkerAgent from the Supervisor's own terminal in the Run that terminal creates;
  and entry -> [Kernel] (1) -> [Op] (2) -> draw critic (3), the Op started the api dispatch way (startAgent: run-create
  --from <kernel terminal>, task-create, worker-start --task --run --from) and the critic by scripts/work/draw-critic.mjs
  launchCriticWorker on its criticWorkspace placement from the Op's terminal. Every agent is a no-op on the cheapest
  priced model a registry.yaml pool pins (noopAgent: gpt-6-luna, effort low): a parent runs `launch-smoke.mjs stage --as
  <role>` (it starts its child from the parent's own terminal), every agent runs `mark --as <role>` (one result line)
  and reports worker_done; an agent's command names only its role and the run's state directory is found by its own
  ORCA_TERMINAL_HANDLE (resolveState). The smoke reads each worker back with worker-read, checks the depth and the
  creator Dispatch worker-show reports, and always - in a finally, deepest first - stops a worker that has not settled,
  releases every worker, closes a Task its worker did not settle (from its coordinator's terminal) and removes the
  critic's placement and its state directory. It prints one JSON result {schema, ok, entry, noop, paths{supervisor-
  worker, op-critic: {status, depths, problems?}}, agents, cleanup, error, ms} and exits 0 only when both paths are ok.
  It runs from a plain Orca shell or the owner's chat (the entry, depth 0), never from an agent, and it is run by hand
  as a step of the pre-workflow readiness (docs/releasing.md); no check or spec starts it (tests/launch-smoke.spec.mjs
  drives the runtime launchers against a fake Orca). The draw critic's placement changes: Orca places a worker only on
  a worktree it resolves, and a bare temp directory is refused selector_not_found (the host's worktree resolution,
  2026-10-01). draw-critic.mjs criticWorkspace now creates a runtime worktree (scripts/lib/worktrees.mjs createWorktree,
  kind op, owned by the op job of the terminal running the loop, never capped) of the repository the loop runs in,
  under <repo>/.starciwork/worktrees, detached at a commit of the empty tree, so it holds only its .git file until the
  round's PNGs, HTML and rubric are copied in; removeCriticWorkspace removes it through removeWorktree. No repository,
  no placement: the critic is launch-failed, never placed in a bare directory. runCritic's `tmpRoot` is replaced by
  `placement` (criticWorkspace options) and the Orca client may replace the placement (criticWorkspace,
  removeCriticWorkspace). New wrapper scripts/api/orca/worker-read.mjs and the calls.yaml `worker-read` read call. Adds
  no finding code.
reach: new-legs
