id: hfs-test-layout-2
effectiveAt: '2026-10-01T01:00:00+07:00'
summary: >-
  Follow-up of hfs-test-layout (owner test layout 2026-09-30) across templates, checks and docs. The back-end tests tsconfig
  is src/tests/tsconfig.json (extends the root config and @starci/tsconfig/e2e.json) and the managed root tsconfig.json
  excludes src/tests/world, integration, e2e and contract (fixtures stay in the root program); package scripts test:integration,
  test:e2e, test:contract (each npm run typecheck:tests && jest --selectProjects <name>) and typecheck:tests replace
  typecheck:e2e and test:e2e:live; husky hooks and HFS_E2E_IN_AUTOMATIC_GATE keep integration, e2e and contract out of the
  automatic gates. A forbidden slot retires src/tests/e2e/world/ (goes to src/tests/world/); the src/tests children are world,
  fixtures, integration, e2e, contract and live/harness folders stay retired (HFS_TEST_KIND_RETIRED). New machine check
  test-world-files (R47, BE_TEST_TOPOLOGY): src/tests/world/ holds only global-setup.ts, global-teardown.ts, use-test-world.ts,
  fakes/, kit/ and role-suffixed files at its root, read through the slot's allows. HFS_ALIAS_REEXPORT (R30) also refuses an
  exported const Y = X / X.y, type Y = X and interface Y extends X {} that only rename another repository declaration, in BE
  and FE. R47, R48 and R83 law text and README rows state the layout; BE-CONVENTION 1.16 is rewritten to match.
reach: new-legs
