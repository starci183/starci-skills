id: shape-slot-hfs-app-tree
effectiveAt: '2026-09-29T23:59:00+07:00'
summary: >-
  examples/shape-slot moves its source from the repository root (src/, messages/) into the HFS app tree
  apps/shape-slot/src with a full FE repository skeleton (hfs.json with one next app, tool-config stubs, sync-rendered
  husky, CI, sonar, codecov and .gitignore block, canon-pinned package manifests, [locale] route shell with error,
  not-found and loading boundaries, modules api/client.ts and outcome.ts, config, i18n, routes). Because the manifest
  slots take blocks, overlays, pages and layouts as one <Name> folder, components/blocks/<domain>/<Name> and
  features/overlays/<domain>/<Name> are flattened. Every knowledge citation of the moved paths follows: the shape-slot
  reference files of the starci grammar playbook, the block, overlay and mock example paths of the fe folder, naming
  and test patterns, the connected-block code example, and the json-exceptions entries of the example's JSON files
  (messages/vi.json now lives under modules/i18n/messages). No behaviour of any check changes; only where the reference
  example lives.
reach: new-legs
paths:
  - knowledge/grammars/starci/playbook.yaml
  - knowledge/patterns/fe/folder.yaml
  - knowledge/patterns/fe/naming.yaml
  - knowledge/patterns/fe/test.yaml
  - knowledge/code-examples/frontend/connected-block/index.yaml
  - modules/schemas/json-exceptions.yaml
