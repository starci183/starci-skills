id: hfs-be-round2
effectiveAt: '2026-09-30T00:30:00+07:00'
summary: >-
  HFS back-end round 2: nine new catalog rules R68-R76 (BE_SQL_INTERPOLATED, BE_QUERY_UNBOUNDED, BE_HTTP_TIMEOUT,
  BE_LOG_SECRET, BE_TYPE_ESCAPE, BE_ASYNC_NO_AWAIT, BE_MIGRATION_REVERSIBLE, BE_RETURN_TYPE, BE_JSON_PARSE_UNGUARDED),
  each with a Vietnamese failure code, and a second enforcer for R42 (dto-needs-validator). `@starci/eslint-canon-be`
  becomes 1.4.0 and gains no-interpolated-sql, query-needs-limit, http-needs-timeout, json-parse-needs-guard,
  no-secret-in-log, async-needs-await, dto-needs-validator, no-never-cast, no-non-null-assertion,
  explicit-handler-return-type and migration-down-reversible in five new laws (query-safety, resilience, log-safety,
  async-discipline, input-bounds) plus additions to type-safety and schema-authority. The nest profile follows the new
  canon version and content digest and gains the NEST-HFS-RUNTIME-SAFETY obligation; lint-why maps each rule to its
  code. The slot manifest gains two optional slots that the nivo-backend migration relies on:
  be.feature.application.support (src/features/<f>/application/support/: helpers and types local to one feature, a
  spec beside each file, not importable from another feature) and be.feature.transport.cli
  (src/features/<f>/transport/cli/: a command line transport that calls application use cases only and is composed by
  an app of kind cli). Both are additions inside manifest 1.0.0, so no existing path changes its answer. A repository
  adopts the canon through its own migration lane; there is no compatibility window.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-be-round2.yaml
