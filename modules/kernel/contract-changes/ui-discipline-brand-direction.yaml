  - knowledge/index.yaml
  - knowledge/ui/index.yaml
  - knowledge/ui/composition/taste.yaml
  - knowledge/ui/composition/hierarchy.yaml
  - knowledge/ui/composition/accent.yaml
  - knowledge/ui/composition/index.yaml
  - knowledge/ui/proof/taste.yaml
  - knowledge/ui/proof/index.yaml
  - knowledge/ui/examples/brand-direction.nivo.yaml
  - modules/schemas/work-brand.schema.yaml
  - modules/ops/ops/brand.decide.yaml
  - modules/ops/registry.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/checks/brand.mjs
  - scripts/work/brand-direction.mjs
  - tests/brand-direction.spec.mjs
  - tests/ui-knowledge.spec.mjs
