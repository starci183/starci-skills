id: hfs-connections-declared
effectiveAt: '2026-09-30T16:00:00+07:00'
summary: >-
  Lane C0, BE-CONVENTION 1.4.1 (R84, owner ruling one database = one connection = one injector): hfs.json
  `connections` is a list of {name, envPrefix} - the logical database name (never the engine: primary, identity,
  order, instance-db) and the prefix of the env keys its platform/database/<conn>.config.ts reads. Names and prefixes
  are unique and no prefix covers another's keys (HFS_DECLARATION_INVALID otherwise); a bare string entry is refused,
  there is no second form. modules/schemas/hfs-repo.schema.yaml and scripts/lib/hfs-slots.mjs agree; the resolver
  exposes the objects to the lint factory (settings.starci.hfs.connections) and the architecture machine.
  examples/todo-app-backend declares {primary, PRIMARY_DB}.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-connections-declared.yaml
  - modules/schemas/hfs-repo.schema.yaml
  - scripts/lib/hfs-slots.mjs
  - tests/hfs-slots.spec.mjs
  - tests/hfs-rules.spec.mjs
  - examples/todo-app-backend/hfs.json
