id: exkinds-kind-transport-layout
effectiveAt: '2026-10-02T12:00:00+07:00'
summary: >-
  Lane EX-KINDS (lead C2): the webhooks, realtime and jobs kinds follow the feature layers rules (feature-layout, module-per-transport,
  background-unowned) instead of keeping module and door at the root of the kind folder. The kind root stays src/features/<kind>/<name>/
  (the owner slot) and each door sits in its transport folder: webhooks transport/http/ (slots be.feature.webhooks.http, be.feature.webhooks.dto),
  realtime transport/graphql/ and transport/websocket/ (be.feature.realtime.graphql, be.feature.realtime.websocket, be.feature.realtime.dto),
  jobs transport/queue/ (new slot be.feature.jobs.queue, composedBy api and worker: <job>-queue.module.ts and <job>.processor.ts); the
  application module <job>.module.ts of a job stays at the job root with its steps/ and application/. The door slot ids replace the old door
  ids in KIND_DOOR_SLOTS and in the webhook-shape, webhook-verify-first, realtime-* and job-shape enforcers. The `hfs add job` template
  tree (knowledge/patterns/be/jobs.yaml, templates/be/patterns/jobs) generates the queue module and moves the processor. R160 names the
  new processor home. Three adjustments found by the first real lint of ecommerce: the typed producer file of a queue (`<queue>.queue.ts` of slot
  be.queues) may take the caller's transaction (no-repository-class); the table of a projection declared by its `<name>.projection-entity.ts` is
  its own schema owner (schema-owner, BE_SCHEMA_OWNER); the inbox joins event-bus and jobs in the perConnection list of be.persistence; a queue needs
  no module file (a scheduler-only queue has none); HFS_CONTRACT_SNAPSHOT_DRIFT asks a GraphQL snapshot only of an api app whose root module composes
  platform/graphql. `hfs add webhook <provider> --service Class=module` and `hfs add realtime <channel> --service topicFn=module` generate the door
  trees of both kinds from their pattern topics (ruleParams.be.addKinds, templates under templates/be/patterns/webhooks and realtime).reach: new-legs
