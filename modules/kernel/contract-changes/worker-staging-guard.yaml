id: worker-staging-guard
effectiveAt: '2026-09-28T15:30:00+07:00'
summary: >-
  Closes the gap node-modules-link-wipe left open: a Supervisor [Worker] (scripts/supervisor/workers.mjs
  spawnWorkers) now launches with the same guard layer op workers get (scripts/guards/install.mjs guardLaunch: the
  shim bin first on PATH, STARCI_GUARD_BIN, BASH_ENV, a job guard file; no product history hook). Its staging
  checkout's node_modules is a junction to the live runtime's, and the npm shim refuses any install through it
  (DEPS_THROUGH_LINK) - verified end to end: `npm ci` through a junction exits 3 and the target stays whole. A launch
  whose guard bin could not be built records worker-guard-missing; the receipt rides on the job payload (guard).
reach: new-legs
paths:
  - modules/kernel/contract-changes/worker-staging-guard.yaml
  - scripts/supervisor/workers.mjs
  - tests/supervisor-kernel.spec.mjs
