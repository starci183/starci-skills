id: op-draw-reliability
effectiveAt: '2026-09-28T01:50:00+07:00'
summary: "Lane op-draw (interface.draw 37 jobs -> 4 ok, brand.decide 9 -> 2 ok since 2026-09-27T05:50Z). (A) Gates calibrated on the passing real-component reference draw: the redline and render-asset draw-loop finish binds beside a token-rendered drawing are evidence, not drawings; draw-quality reads a component part's <part>.dom.html render source, its rendered-DOM ownership and anatomy (not the html DNA attribute gate), <part>.rationale.json and <part>.score.json. (B) api check attributes a red check whose every failing file is an untouched Work record outside the owned paths as foreign: advisory {outOfScope}, counted neither passed nor failed. (C) The critic always runs: component rounds pick the critic by criticFor, draw-loop finish critiques an uncritiqued best round, and a round no critic scored is DRAW_CRITIC_MISSING (DRAW_BEAUTY_BELOW only for a real score). (D) scripts/work/draw-gates.mjs is the drawer's self-check before every report: the settle and check gates as report.checks entries with failing files (interface.draw proof draw-gates). (E) draw-render --component resolves a FRESH grammar dist (runtime, else the main worktree, else the stale one named) and its product from the draw's --css. (F) Under autopilot a proposed brand.direction archetype whose direction check passes with its golden on disk is provisionally ready for interface.draw (ui-archetype.mjs). (G) api enqueue refuses an --after on the job's own retry lineage (after-self-lineage). New checks and codes are advisory for legs admitted earlier."
reach: new-legs
ops: [interface.draw, brand.decide]
adds:
  checks:
    - draw-acceptance
    - draw-metrics
    - validate-strict
    - draw-loop
  codes:
    - DRAW_CRITIC_MISSING
paths:
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/ops/brand.decide.yaml
  - modules/kernel/contract-changes.yaml
  - scripts/checks/draw-acceptance.mjs
  - scripts/checks/draw-quality.mjs
  - scripts/kernel/gate-attribution.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/prerequisites.mjs
  - scripts/work/draw-loop.mjs
  - scripts/work/draw-critic.mjs
  - scripts/work/draw-gates.mjs
  - scripts/work/draw-grammar.mjs
  - scripts/work/draw-render.mjs
  - scripts/work/ui-archetype.mjs
