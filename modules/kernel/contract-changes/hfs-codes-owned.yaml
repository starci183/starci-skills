id: hfs-codes-owned
effectiveAt: '2026-09-30T18:00:00+07:00'
summary: >-
  Lane C0 sub-lane C1 (RED19, emitted ids = catalog): every finding code the architecture machine or `hfs check` can emit
  belongs to exactly one rule of knowledge/hfs/rules.yaml. scripts/checks/check-hfs-rules.mjs adds HFS_RULE_CODE_UNOWNED
  (an emittable code no rule lists in failureCodes); the only exempt codes are the infrastructure refusals ("cannot judge"),
  which their owners export as one list each (ERROR_RULE_IDS of the machine index, REFUSAL_CODES of scripts/lib/hfs-check.mjs).
  The ~60 machine codes that had no rule are now sub-codes of the rule whose law they serve (R01 root/tree layout, R02
  required files and the README shape, R14 package manager, R26 FE tier direction and package to app, R29 feature layout and
  application to transport, R30 package export bypass, R32 app business role, R45 handler and provider registration, R47
  retired test kinds, R50 SWR identity, R54 route adapters, R56 hook location, R57 href, R87 readonly boundary, R89 public
  contract form, R91 FE source layout, R92 pure component and world ownership, R93 Grammar entry) with their machine
  enforcers named; the law lines of R02, R14, R26, R29, R30, R31, R45, R50, R56, R87, R89, R92 and R93 state the obligations
  their new codes judge (README section 12 rows identical). Two codes are deleted with every reference: FE_FETCH_OUTSIDE_TRANSPORT
  (superseded by R50 FE_TRANSPORT_OWNER; the machine's raw-fetch scan in frontend.mjs is gone) and BE_MODULE_NOT_COMPOSED (the
  same obligation as R31 BE_FEATURE_NOT_COMPOSED, which now reports capability modules too).
reach: new-legs
adds:
  codes: [HFS_RULE_CODE_UNOWNED]
paths:
  - modules/kernel/contract-changes/hfs-codes-owned.yaml
  - modules/kernel/failure-codes.yaml
  - modules/models/code-patterns.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/fe/architecture-check.yaml
  - knowledge/patterns/fe/function.yaml
  - knowledge/patterns/fe/transport.yaml
  - docs/architecture-check.md
  - scripts/checks/check-hfs-rules.mjs
  - scripts/checks/architecture/index.mjs
  - scripts/checks/architecture/frontend.mjs
  - scripts/checks/architecture/reachability.mjs
  - scripts/lib/hfs-check.mjs
  - tests/hfs-rules.spec.mjs
  - tests/architecture-hfs-package-manager.spec.mjs
