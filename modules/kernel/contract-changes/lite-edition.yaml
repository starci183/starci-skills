id: lite-edition
effectiveAt: '2026-10-02T21:00:00+07:00'
summary: >-
  The lite edition of the HFS standard (owner-approved design, alpha.4): hfs.json takes an optional `edition` (full when absent, or lite)
  and an optional `supabase` block; the one slot manifest (2.1.0) and the one rule catalog carry `editions`, `litePresence`, `lite` overlays,
  `liteManagedBy` and the lite slots, so lite is the same engine filtered, never a second manifest. A lite app has no test world and no event
  machinery (R212), keeps the whole lint, grammar, security and Docker canon, holds its schema in supabase/migrations (R213 to R216 on a real
  PostgreSQL parser: migration shape, row level security as static code, safe definer functions and buckets, a checked config and generated
  types) and reaches the database through one door per side (R217), typed and handled results (R218), a verified principal (R219) and no
  credential in the tree or the front end (R220). `hfs check` drops the findings of rules the edition does not judge in one place; sync renders
  the lite managed files (no jest, tests or coverage; db:* wrappers, a db-types drift job, a coverage-free Sonar gate); `hfs scaffold app --edition lite`
  writes the design shape and generates the Supabase types by starting the app's own local stack; `hfs add table|app|cli` serve lite;
  `hfs upgrade --edition full [--plan]` only adds what full has and `hfs check --edition full` shows what is left; `add`/`new` refuse the nouns lite
  lacks. examples/lite-app is the reference lite app, produced by these tools.
reach: new-legs
paths:
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/sonar-gate.yaml
  - modules/schemas/hfs-repo.schema.yaml
  - modules/schemas/hfs-rules.schema.yaml
  - modules/schemas/hfs-slots.schema.yaml
