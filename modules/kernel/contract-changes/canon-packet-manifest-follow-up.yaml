id: canon-packet-manifest-follow-up
effectiveAt: '2026-09-28T13:30:00+07:00'
summary: >-
  wf-nivo-fe-canon-mujek980, 06:01-06:03Z: 14 code.refactor slices settled blocked and the cut sat at
  10/36 with 0 units/h. Three runtime defects, fixed here. (1) The packet's context.cut held only
  {id, ordinal, total} while the brief requires the complete path-union manifest and passed-ordinal
  state before editing (op-code.refactor-cae0499f4a, -da9ab10e32 blocked authority): dispatch now binds
  context.cut.manifest from the ledger's cut set (scripts/kernel/cut-seam.mjs cutManifestOf - every
  ordinal's latest job, paths and status, the path union, passed/open/absent ordinals, overlaps among
  open ordinals, the canon-wire legs), the op prompt renders it, and the brief says to bind it and never
  block for it. (2) A canon slice blocked on shared-change - config, architecture.json, a public entry
  or its components/pages -> features/pages relocation - was a dead end (-e3e6aafea4, -982b465b8d, ...),
  and (3) a slice that committed its in-ceiling part and then blocked settled as a plain block with no
  next step (-e03238eccb d78d303, -ebc4fc914f, -2321d5d829, -b4158123d3, -e71d4e59d7): settle now leaves
  the next step itself (api.mjs canonSettleFollowUp, cut-seam.mjs canonSettleFollowUpOf) - ONE follow-up
  --retry-of the slice that is a continuation from its commit (params.resumeFrom,
  kernelEdit.continuationOf) owning its page relocation grants, while shared-root/config/public-entry
  paths widen the queued canon-wire leg (or a new wire leg after the follow-up); at most 3 per ordinal,
  a redo the Kernel already queued wins. The brief widens owedToWire to config, public entries and
  parent folders, and an architecture/code-pattern machine that answers unavailable is a tool error
  recorded with toolError true, never the slice's blocker.
reach: new-legs
paths:
  - modules/kernel/contract-changes/canon-packet-manifest-follow-up.yaml
  - modules/kernel/driver-loop.yaml
  - modules/ops/ops/code.refactor.yaml
  - scripts/kernel/api.mjs
  - scripts/kernel/cut-seam.mjs
  - scripts/kernel/op-prompt.mjs
