id: comeback-removed
effectiveAt: '2026-09-29T12:00:00+07:00'
summary: >-
  The comeback concept is removed (owner ruling 2026-09-29, HFS). scripts/supervisor/comeback.mjs is deleted
  and listed in modules/kernel/retired-paths.yaml; no script migrates, archives or resets a store any more.
  COMEBACK_HINT is gone from engine/ledger-db.mjs and engine/machine-db.mjs: an old-schema runtime.sqlite or
  machine.sqlite is still refused (STARCI_LEDGER_SCHEMA_REFUSED / STARCI_MACHINE_SCHEMA_OLD - no migrator, no
  backfill, no read fallback), but the refusal now names how a fresh store is created - openLedger at the file
  ledgerFileFor(<repo root>) resolves for a project, openMachine for the host - each on first use once the
  refused file is moved aside; archiving an old store is a manual owner act. The schema vocabulary follows for
  new stores: archives.kind drops 'comeback' (its only writer was comeback.mjs) and the lifecycle_changes.by
  comment drops the comeback actor in engine/migrations/{runtime,machine}/0001-init.sql.
  modules/schemas/work-layout.yaml, docs/ledger-db.md, scripts/reconciler/schedules.mjs,
  scripts/supervisor/home.mjs, scripts/lib/starciwork-boundary.mjs and
  tests/machine-registry-isolation.spec.mjs drop their references; scripts/checks/check-example-work.mjs is
  what refuses known agent data in a .starciwork tree [HFS_AGENT_DATA_TRACKED], and the .starciwork/.gitignore
  text is written by scripts/example/work-example.mjs. Historical contract-change entries keep their mentions
  (history). Adds no check or finding code; nothing is refused that was accepted before.
safetyCritical: false
reach: new-legs
paths:
  - modules/kernel/contract-changes/comeback-removed.yaml
  - modules/kernel/retired-paths.yaml
  - modules/schemas/work-layout.yaml
  - scripts/supervisor/comeback.mjs
  - engine/ledger-db.mjs
  - engine/machine-db.mjs
  - engine/migrations/runtime/0001-init.sql
  - engine/migrations/machine/0001-init.sql
  - scripts/reconciler/schedules.mjs
  - scripts/supervisor/home.mjs
  - scripts/lib/starciwork-boundary.mjs
  - docs/ledger-db.md
  - CHANGELOG.md
  - tests/machine-registry-isolation.spec.mjs
