id: arch-owner-export-entries
effectiveAt: '2026-10-01T12:00:00+07:00'
summary: >-
  ARCH_OWNER_EXPORT_BYPASS: a workspace package's public entries are every source file its package.json exports
  maps (dist back to src, the same mapping workspace imports use), not only src/index.ts. A client entry plus
  server subpaths (proxy, layout, request) are all accepted; a deep import no export maps is still refused.
  No failure code, YAML key or API verb changes.
reach: new-legs
paths:
  - scripts/checks/architecture/owners.mjs
  - scripts/checks/architecture/typescript.mjs
  - tests/architecture-owner-export-entries.spec.mjs
  - modules/kernel/contract-changes/arch-owner-export-entries.yaml
