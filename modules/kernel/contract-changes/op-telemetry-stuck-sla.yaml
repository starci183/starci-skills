id: op-telemetry-stuck-sla
effectiveAt: '2026-09-28T03:00:00+07:00'
summary: "Op health and the stuck SLA (owner 2026-09-28, 'upgrade supervisor to track properly'): api status adds read-only stuck[] (every wait aged against runtimes.yaml allocation.opTelemetry.stuckSla, with severity and the owner of the next action) and opHealth (the workflow's per-op success rate, failure classes, queue/run/settle time, attempts per node, repeated identical failures, dead-worker rate, owner wait, throttle; scripts/supervisor/op-metrics.mjs). The supervisor tick gains the opHealth duty: one supervisor-op-metrics event per tick, warn/critical waits listed as owed actions, critical ones alerted; the owner digest carries the trend line; /api/snapshot exposes opHealth and stuck[] (harness contract 2026-09-28.3). Status writes nothing new and refuses nothing new. Also registers the three supervisor ui/fixtures (supervisor-logs, supervisor-logs-stream, supervisor-state) in modules/schemas/json-exceptions.yaml, which tests/json-exceptions.spec.mjs found unregistered. Adds no check or finding code"
reach: new-legs
paths:
  - modules/kernel/api.yaml
  - modules/schemas/json-exceptions.yaml
  - modules/supervisor/supervise.yaml
  - modules/models/runtimes.yaml
  - scripts/supervisor/op-metrics.mjs
