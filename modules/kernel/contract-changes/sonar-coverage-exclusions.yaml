id: sonar-coverage-exclusions
effectiveAt: '2026-10-02T00:30:00+07:00'
summary: >-
  Lane C0 SONAR3. The real scans of both example apps showed that SonarQube has no `sonar.coverage.inclusions` property, so
  Sonar ignored it: overall coverage counted every executable be file at 0% (65.8% and 45.2% while every service was at 100).
  (1) The managed sonar-project.properties renders `sonar.coverage.exclusions` as the COMPLEMENT of the services. The globs
  come from packages/hfs/sync/index.mjs coverageExclusions, over the jest preset's COVERAGE_SOURCES and the slot manifest:
    every be role of ruleParams.be.suffixes (R89) other than the covered `service`;
    the be file names a slot declares outside that vocabulary (main.ts, index.ts, connection.ts, the migrations, the test
    world's files);
    fe/**.
  `sonar.coverage.inclusions` is deleted everywhere; a coverage source that is not <dir>/**/*.<role>.ts is refused
  (HFS_SYNC_COVERAGE_SCOPE). The runtime reads the scope as Sonar does: the sources outside sonar.exclusions,
  sonar.coverage.exclusions and the tests (scripts/checks/sonar-gate.mjs coverageScopeOf, coverageTargetOf; judgeCoverage
  and judgeDashboard take the scope). The server's coverage and new_coverage conditions stay; Codecov keeps its paths. A spec
  proves every executable be file of both examples is a service or excluded, never both and never neither, and that Sonar's
  coverage set equals Codecov's. Re-scanned, both examples read 100 overall. (2) Custody: a project's analysis token is the
  declared credential that names the project, else the one declared credential whose purpose is analysis. The examples declare
  that credential, a PROJECT_ANALYSIS_TOKEN sealed with sops to the ext/sonar recipient (ext/sonar/secrets/KEYS.md), so no
  --token-ref is needed. (3) The FE canon's route-slot-fixed-name holds error.tsx to `ErrorBoundary`: `Error` shadows the
  global Error constructor (Sonar S2137, a bug). The hfs fe skeleton and both examples are renamed. hfs, eslint-canon-fe and
  jest-preset (README and an index.cjs comment) change their published content and are bumped in C0's batch.
reach: new-legs
ops: [backend.implement, interface.implement, code.refactor]
paths:
  - modules/kernel/contract-changes/sonar-coverage-exclusions.yaml
  - packages/hfs/sync/index.mjs
  - packages/hfs/templates/app/quality-config/sonar-project.properties
  - packages/hfs/templates/app/quality-config/codecov.yml
  - packages/hfs/templates/fe/skeleton/apps/__app__/src/app/[locale]/error.tsx
  - packages/eslint/fe/file-layout.mjs
  - scripts/checks/sonar-gate.mjs
  - scripts/checks/sonar-local.mjs
  - examples/todo-app/sonar-project.properties
  - examples/ecommerce-app/sonar-project.properties
  - examples/todo-app/.starcistacks/application-stacks.yaml
  - examples/ecommerce-app/.starcistacks/application-stacks.yaml
  - ext/sonar/secrets/KEYS.md
  - knowledge/patterns/be/test.yaml
  - knowledge/sonar-gate.yaml
  - modules/kernel/failure-codes.yaml
