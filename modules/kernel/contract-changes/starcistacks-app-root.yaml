id: starcistacks-app-root
effectiveAt: '2026-10-01T23:30:00+07:00'
summary: >-
  .STARCISTACKS LIVES AT THE APP ROOT (owner correction, lane ROOT under C0). The app root holds fe/, be/, .starcistacks/ and
  .starciwork/ plus the root files; be/.starcistacks (lane CLOSE, 07b0750c4) is reversed with no alias. The slots
  app.starcistacks and app.sops (profile app, required) replace be.starcistacks and be.sops; repo.side-root-forbidden lists
  .starcistacks/ and .sops.yaml, so a side holding either is HFS_FORBIDDEN_PRESENT, and the architecture machine reports a
  .starcistacks in either side as HFS_STACKS_IN_SIDE (it replaces HFS_STACKS_IN_FE). custody.sealed is
  .starcistacks/<env>/secrets/<slug>.enc, app-relative (the work-resource schema pattern, SEALED_LOCATION_RE of
  check-work-artifacts, check-example-work); the side form be/.starcistacks/... is refused by name with SEALED_CUSTODY_LOCATION
  and HFS_IDENTITY_CUSTODY. R10 HFS_STACKS_SHAPE judges the app root's tree; R47 test-world-files, R84 connection-map, the hfs
  Sonar key and gate, hfs work-hygiene and @starci/test-world 1.0.2 (declared paths resolve from the app root) read it there.
  The managed .gitignore block carries the stacks-layout custody rules; hfs scaffold app writes
  .starcistacks/application-stacks.yaml and .sops.yaml at the root. hfs 4.0.2, eslint-canon-be 3.0.2, eslint-canon-fe 8.0.2.
reach: new-legs
