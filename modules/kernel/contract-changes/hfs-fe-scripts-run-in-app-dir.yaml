id: hfs-fe-scripts-run-in-app-dir
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  The managed fe scripts (dev:fe, start:<app>, build:fe) run `next` from the app directory (`cd fe/apps/<app> && next ...`)
  instead of `cd fe && next ... apps/<app>`: next-intl resolves the request config against the working directory, so the
  old form failed to find it. The skeleton next.config.ts pins the workspace root three levels above the app. A template
  spec runs build:fe on a rendered skeleton.
reach: new-legs
paths:
  - packages/hfs/sync/index.mjs
  - tests/hfs-sync.spec.mjs
  - tests/hfs-scaffold-app.spec.mjs
  - packages/hfs/templates/fe/skeleton/apps/__app__/next.config.ts
  - modules/kernel/contract-changes/hfs-fe-scripts-run-in-app-dir.yaml
