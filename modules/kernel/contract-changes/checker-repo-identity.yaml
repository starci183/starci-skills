id: checker-repo-identity
effectiveAt: '2026-09-29T00:00:00+07:00'
summary: >-
  Checkers derived a repository's identity from path.basename(root), so any git worktree (D:/starci-lanes/<lane>/<name>)
  failed checks its main checkout passes: the README title (HFS_README_TITLE_INVALID) and the stack-declaration project
  name (STACKS_PROJECT_MISSING). scripts/lib/repo-identity.mjs derives the name from repository identity (the main
  checkout folder via the git common dir, else the origin remote, else package.json outside Git, else the folder) and
  the sibling-repository home; repo-presentation/HFS, check-starcistacks and sonar-local use it. A folder inside a
  larger repository (an example) is still named by its own folder.
reach: new-legs
paths:
  - modules/kernel/contract-changes/checker-repo-identity.yaml
  - scripts/lib/repo-identity.mjs
  - scripts/checks/architecture/hfs.mjs
  - scripts/checks/check-starcistacks.mjs
  - scripts/checks/sonar-local.mjs
