id: sops-custody-helper
effectiveAt: '2026-09-29T00:00:00+07:00'
summary: >-
  The standard contradicted itself on encrypted custody: integration.verify and work.schema mandated
  `secrets.enc.yaml` read with `sops exec-env`, but check-starcistacks refuses any tracked non-`.enc` member under
  `.starcistacks/<env>/secrets/` and sops 3.13.2 `exec-env` has no --input-type flag, so it cannot read a
  `<name>.<fmt>.enc` file. Canonical rule: custody files are `<name>.<fmt>.enc` and every read states the format.
  One shared runtime helper, scripts/lib/sops-exec-env.mjs (exec mode, --get NAME, --keys names only), decrypts in
  memory with the stated input type and runs a command with the keys in its environment, never writing plaintext.
  integration.verify and the identityResource schema text now point at it (secrets.yaml.enc), the stacks doc
  documents the naming and the helper, and check-starcistacks gives a rename hint for `<name>.enc.<fmt>` names.
reach: new-legs
paths:
  - modules/kernel/contract-changes/sops-custody-helper.yaml
  - modules/ops/ops/integration.verify.yaml
  - modules/schemas/work.schema.yaml
  - docs/application-stacks.md
  - scripts/lib/sops-exec-env.mjs
  - scripts/checks/check-starcistacks.mjs
  - tests/core.spec.mjs
