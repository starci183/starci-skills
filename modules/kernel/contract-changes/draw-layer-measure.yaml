id: draw-layer-measure
effectiveAt: '2026-09-28T04:30:00+07:00'
summary: "Owner, 2026-09-28 (StarCi Next SignInBase#signed-out round 2: the sign-in card stretched the full 1184px content region; the Remember me Checkbox on the card kept the primary variant). 'This is KNOWLEDGE, not golden rules': the runtime catches both from knowledge and gates. (1) Knowledge: measure.yaml MEASURE-1 remark (the page width, never a region's cap) and new MEASURE-4 case-4 (a drawn XBase is the content region only and owns its measure: a form/auth/single-task region caps by case-3 - SurfaceCard measure=form/formCompact, else w-full max-w-md mx-auto, a Width-scale step with evidence); anatomy-source.yaml ANATOMY-2 case-1 generalised from 'an input' to every form control (Checkbox, RadioGroup, Select, Textarea, ...; Switch/Slider exempt) and new case-3 (Background -> Surface -> nested control: a form region stands in a Surface). (2) Brief selection by component presence: a knowledge case may declare `elements` (any-of element kinds) and ui-proof-brief.mjs classifyCase applies it by those kinds instead of reading its prose (MEASURE-4 case-3 read 'a game table' as needing a row, so no form got it); MEASURE-4 case-3/case-4 and ANATOMY-2 case-1/case-3 declare [field]. (3) Grammar (packages/grammar, unpublished pending owner approval): SurfaceCard measure=form/formCompact now caps and centres the card (the root's width 100% !important beat the form measure - the actual cause of the stretched card); Checkbox, CheckboxGroup, RadioGroup, Textarea, Select, SearchField, NumberField, DateField, TimeField, DatePicker, DateRangePicker, ComboBox take HeroUI's variant primary|secondary and every control root stamps data-grammar-variant; DNA regenerated. (4) Gates: scripts/checks/draw-layer.mjs, a draw-loop machine metric `layer` (so re-run at settle by draw-loop-settle / draw-gates draw-metrics): DRAW_NESTED_VARIANT (rendered DOM: a form control on a bounded surface without variant secondary; a form region on the bare page Background) and DRAW_MEASURE_UNCAPPED (draw-render measures each form region - nearest ancestor of a primary submit holding a field - in the browser, record `layer`; wider than W-3xl 48rem fails). Owner, same day: both are STANDARD PRINCIPLES of every drawing - the four cases declare elements [page], so the brief loads them for every shape, and both gates run on every shape in the draw loop (metric layer) and in draw-gates (new gate draw-layer, plus the draw-metrics re-render); existing renders are judged by node scripts/checks/draw-layer.mjs <render dir|part png>... [--playwright <product dir>] (re-renders a record without the measure from its round harness). Every earlier interface.draw leg owes one follow-up redraw under them"
reach: follow-up
ops: [interface.draw]
followUp:
  op: interface.draw
  ops:
    - interface.draw
  detail: "redraw through scripts/work/draw-loop.mjs until DRAW_NESTED_VARIANT and DRAW_MEASURE_UNCAPPED are clear: every form control on a Surface in variant=secondary, form regions in a Surface and capped (SurfaceCard measure=form/formCompact or w-full max-w-md mx-auto)"
adds:
  codes:
    - DRAW_NESTED_VARIANT
    - DRAW_MEASURE_UNCAPPED
paths:
  - knowledge/ui/presentation/measure.yaml
  - knowledge/ui/proof/anatomy-source.yaml
  - knowledge/grammars/common/DNA.yaml
  - knowledge/grammars/starci/DNA.yaml
  - knowledge/grammars/offset-pop/DNA.yaml
  - packages/grammar/src
  - scripts/checks/draw-layer.mjs
  - scripts/checks/ui-proof-brief.mjs
  - scripts/work/draw-render.mjs
  - scripts/work/draw-loop.mjs
  - scripts/work/draw-gates.mjs
  - modules/ops/ops/interface.draw.yaml
  - modules/kernel/contract-changes.yaml
  - tests/draw-layer.spec.mjs
  - tests/ui-proof-brief.spec.mjs
  - modules/models/runtimes.yaml
