id: hfs-supervisor-rulings-1
effectiveAt: '2026-09-30T21:30:00+07:00'
summary: >-
  Lane C0, supervisor and owner rulings of 2026-09-30. (1) R07 HFS_AGENT_DATA_TRACKED judges tracked files only
  (git ls-files): ignored local agent data is not a validation refusal (no false positives). (2) R61's planned hfs
  style-source-unresolved enforcer is deleted: stylelint source-resolves already emits FE_STYLE_SOURCE_UNRESOLVED (one
  obligation, one enforcer). (3) The file-size ratchet arithmetic lives once in scripts/lib/recorded-lines.mjs, copied
  into the BE and FE canon runtime bundles by sync-runtime (no duplicated recordedLines). (4) New eslint-be rule
  e2e-no-schema-work (R47 BE_TEST_TOPOLOGY): an e2e spec never imports a migration or the migrate app, never calls
  runMigrations/synchronize/dropDatabase/createSchema on a typeorm receiver and never starts a testcontainers container;
  the e2e globalSetup runs apps/migrate once and specs assert through the fixture's EntityManager.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-supervisor-rulings-1.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - scripts/checks/check-example-work.mjs
  - scripts/lib/recorded-lines.mjs
  - packages/hfs/scripts/sync-runtime.mjs
  - packages/eslint/be/size-budget.mjs
  - packages/eslint/fe/size-growth.mjs
  - packages/eslint/be/e2e-flow.mjs
  - packages/eslint/be/e2e-schema.test.mjs
  - tests/example-work-gate.spec.mjs
