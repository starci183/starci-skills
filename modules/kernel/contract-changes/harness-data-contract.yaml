id: harness-data-contract
effectiveAt: '2026-09-27T19:50:00+07:00'
summary: "The data behind harness.starci.org is complete and self-describing. (1) job_artifacts.subkind (engine/schema.sql; added to an existing ledger by migrateLedger's new ADDITIVE_COLUMNS step, one nullable ALTER TABLE ADD COLUMN): what produced each indexed file, a closed set (engine/ledger-db.mjs JOB_ARTIFACT_SUBKINDS: draw-render, asset-gen, app-capture, e2e-capture, uat-capture, uat-video, e2e-video, playwright-trace, patch, patch-json, diff, report, log, critique, metrics, grammar-proposal, asset-request), derived at index time by scripts/kernel/artifact-subkind.mjs from the op id, the runtime's path conventions and the ui record manifests (index.yaml/draws.yaml/manifest.yaml generation.tool or provenance.tool, a starci/draw-render@1 record beside a PNG); unknown stays null. scripts/work/backfill-artifact-subkind.mjs (dry-run default, --apply idempotent, never clears a stored value) derives it for older rows. api artifacts --subkind, bySubkind; the job's <patch>.json is indexed (patch-json). (2) Playwright recordings: scripts/uat/uat-slots.mjs run records an op's run (STARCI_OP_JOB) into its own folder (playwright-recording.mjs recordingsRootOf) that collectJobFiles reads as the job's proof - the proof-media gate and the index both see its video, trace.zip and screenshots; a playwright-<stamp> directory is an evidence directory; draw-render --trace writes <base>.trace.zip (off by default). (3) Typed logs the runtime derives itself: a cmd.run per recorded check (command, exit, durationMs, evidenceRef), and from artifacts-indexed a file.edit per changed patch file (+/-, status, diffRef <patch>.json#<path>) and a render/video/trace row per indexed image/video/trace with its subkind; new log kinds video, trace, warning; typed-logs.mjs sync --rederive re-derives old events (src dedupes). (4) LOG_TYPED_MISSING (WARN only, never a refusal): an op job settled without its own step.start, step.end and a cmd.run per reported check gets a runtime warning row and one log-typed-missing ledger event; api status lists logTypedMissing. The op prompt's logging block names what is owed. (5) ui/CONTRACT.md, ui/src/contract.ts (CONTRACT_VERSION), ui/contract-shapes.mjs, ui/fixtures/*.json and ui/contract-capture.mjs: every status API endpoint typed and validated; ui/server.mjs adds /api/contract, /api/coverage, /api/verify-proofs, /api/artifacts subkind, snapshot grammarProposals/logTypedMissing, and STARCI_STATUS_PROJECTS / STARCI_STATUS_OFFLINE / STARCI_STATUS_LOG_SYNC for a fixture server. Adds the warning code LOG_TYPED_MISSING, which refuses nothing"
adds:
  codes:
    - LOG_TYPED_MISSING
paths:
  - engine/schema.sql
  - engine/ledger-db.mjs
  - scripts/kernel/artifact-subkind.mjs
  - scripts/kernel/job-artifacts.mjs
  - scripts/kernel/typed-logs.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/op-prompt.mjs
  - scripts/work/backfill-artifact-subkind.mjs
  - scripts/work/draw-render.mjs
  - scripts/uat/playwright-recording.mjs
  - scripts/uat/uat-slots.mjs
  - modules/kernel/api.yaml
  - modules/kernel/contract-changes.yaml
  - ui/server.mjs
  - ui/op-proofs.mjs
  - ui/typed-logs.mjs
  - ui/CONTRACT.md
  - ui/src/contract.ts
  - ui/contract-shapes.mjs
  - ui/contract-capture.mjs
  - ui/fixtures
  - tests/artifact-subkind.spec.mjs
  - tests/harness-contract.spec.mjs
  - tests/typed-logs.spec.mjs
reach: new-legs
