id: hfs-v2-architecture-machine
effectiveAt: '2026-09-29T23:30:00+07:00'
summary: >-
  HFS v2 Phase 0 item 0.4 (owner-approved decision 1: repositories carry only hfs.json). The architecture checker
  (scripts/checks/architecture.mjs and scripts/checks/architecture/) becomes the HFS v2 architecture machine, driven by
  hfs.json and knowledge/hfs/slots.yaml through scripts/lib/hfs-slots.mjs. architecture.json support is removed with no
  dual path: loadArchitectureConfig derives the profile, apps, roots, owners (every directory an owner slot matches that
  has its entry file), the Nest registration selection and the Grammar contract from hfs.json and the slots; the
  checkArchitecture configFile option, the architecture.mjs --config flag, the check-scoped-lint and canon-scan
  --architecture-config flag, the code-pattern architectureConfig inputs and the Next architectureProjects authority
  (projects now come from package.json#starci.codePatterns.next.projects only) are gone. New checks, each with a
  catalogued why code and Vietnamese text: the tier direction matrix for BE and FE with feature to feature forbidden
  (BE_TIER_DIRECTION, FE_TIER_DIRECTION, FE_APP_ISOLATION), owner cycles including type-only imports reported with the
  cycle path (ARCH_OWNER_CYCLE), reachability (BE_FEATURE_NOT_COMPOSED, BE_MODULE_NOT_COMPOSED, FE_OWNER_REACHABLE,
  FE_HREF_RESOLVES), dead exports (HFS_UNUSED_EXPORT), required files (FE_ERROR_BOUNDARY_MISSING,
  BE_REQUIRED_MODULE_MISSING, HFS_REQUIRED_FILE_MISSING), file-size-growth against the merge-base (HFS_SIZE_GROWTH) and
  token-normalised duplicate blocks across owners (HFS_DUPLICATE_BLOCK, threshold ruleParams duplicateBlockLines 25).
  knowledge/hfs/slots.yaml adds src/app/[locale]/loading.tsx to the fe.app.next required files and duplicateBlockLines to
  ruleParams; the schema and loader validate the new key. The op manifests backend.implement, interface.implement and
  review.verify drop the retired --architecture-config flag text. The older v1 direction rules (BE_FEATURE_IMPORTS_APP,
  BE_MODULE_IMPORTS_APP, BE_MODULE_IMPORTS_FEATURE, FE_TIER_IMPORTS_UPWARD, FE_FEATURE_DEPENDENCY_DIRECTION) stay as
  the finer barrel-chain explanations beside the matrix. Examples, the repository-baseline templates, the
  todo-app-example CI workflow and the code.refactor sharedRoots policy still name architecture.json and are owed to the
  templates and sync lanes.
reach: new-legs
paths:
