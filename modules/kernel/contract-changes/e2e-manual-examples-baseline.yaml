id: e2e-manual-examples-baseline
effectiveAt: '2026-09-29T14:00:00+07:00'
summary: >-
  Owner ruling 2026-09-29: e2e runs MANUALLY only. The four product examples and the nest repository baseline
  apply it: the default tsconfig (and tsconfig.build.json for the baseline) exclude src/tests/e2e/**; a dedicated
  tsconfig.e2e.json backs a manual typecheck:e2e (frontend examples point it at their existing e2e/tsconfig.json);
  the backend examples' lint, lint:check and lint:fix skip the e2e tree (lint:e2e is the manual check); the
  baseline's lint scripts and staged lint (--ignore-pattern for src/tests/e2e/** and e2e/**) do the same, and its
  typecheck:e2e and lint:e2e scripts are the manual checks. In the runtime's own CI the example-coverage and
  todo-app-example jobs select the jest unit project only (a bare `npx jest` also ran the e2e project), and the
  live stack + Playwright UAT job moves to its own workflow_dispatch-only file, todo-app-live-e2e.yml. The example
  READMEs and TESTING.md state that e2e is manual. Adds no check or finding code.
reach: new-legs
paths:
  - modules/kernel/contract-changes/e2e-manual-examples-baseline.yaml
  - knowledge/repository-baseline.yaml
  - tests/repository-baseline.spec.mjs
  - .github/workflows/example-coverage.yml
  - .github/workflows/todo-app-example.yml
  - .github/workflows/todo-app-live-e2e.yml
  - examples/ecommerce-app-be/package.json
  - examples/ecommerce-app-be/tsconfig.json
  - examples/ecommerce-app-be/tsconfig.e2e.json
  - examples/ecommerce-app-be/README.md
  - examples/ecommerce-app-be/docs/guides/testing.md
  - examples/ecommerce-app-fe/package.json
  - examples/ecommerce-app-fe/README.md
  - examples/todo-app-backend/package.json
  - examples/todo-app-backend/tsconfig.json
  - examples/todo-app-backend/tsconfig.e2e.json
  - examples/todo-app-backend/README.md
  - examples/todo-app-backend/docs/TESTING.md
  - examples/todo-app-frontend/package.json
  - examples/todo-app-frontend/README.md
