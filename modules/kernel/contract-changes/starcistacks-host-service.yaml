id: starcistacks-host-service
effectiveAt: '2026-09-29T03:00:00+07:00'
summary: >-
  A local service's stack may be host-owned: services.*.stack accepts
  {owner: host, root: .claude/ext/<service>, environment, compose, container?, publishedBy?}
  resolved inside the installed runtime tree, beside the project form
  {repository, root: .starcistacks, ...}; a service credential may cite custody under
  .claude/ext/<service>/secrets/. The shared SonarQube moves to .claude/ext/sonar (compose
  project starci, container starci-sonarqube, the legacy starci-sonarqube-* volumes and the
  published port unchanged); check-starcistacks verifies the extension's compose file exists.
reach: new-legs
paths:
  - modules/kernel/contract-changes/starcistacks-host-service.yaml
  - modules/schemas/application-stacks.schema.yaml
  - scripts/checks/check-starcistacks.mjs
  - scripts/checks/stacks.mjs
  - docs/application-stacks.md
  - ext/sonar/compose.yaml
  - ext/sonar/cloudflared.yaml
  - ext/sonar/README.md
  - ext/sonar/.gitignore
  - ext/sonar/secrets/KEYS.md
  - examples/starcistacks-services/mia-mia-backend.services.yaml
  - examples/starcistacks-services/nivo-backend.services.yaml
  - examples/starcistacks-services/starci-next.services.yaml
  - examples/starcistacks-services/starci-academy-backend.application-stacks.yaml
  - package.json
