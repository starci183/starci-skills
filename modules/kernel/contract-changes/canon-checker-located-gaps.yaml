id: canon-checker-located-gaps
effectiveAt: '2026-09-28T13:45:00+07:00'
summary: >-
  wf-nivo-fe-canon-mujek980: every canon slice's before-proof read unavailable (op-code.refactor-56f780b4ca,
  -cae0499f4a, -e49a8bd90e, -f1c6ad2849, -4cb4604a51), so slices blocked environment or refused to edit. The
  tsconfig alias itself resolves (apps/*/tsconfig.json "@/*" -> ./src/*); the causes were located defects read as
  machine failures. (1) canon-scan: an ARCH_INTERNAL_IMPORT_UNRESOLVED error on a file (39 files still import
  @/i18n/navigation after the seam moved it to @/modules/i18n/navigation) made the architecture machine
  unavailable (exit 3); it is now a finding (family architecture) of the file that holds it - the slice owning
  that file repoints it - and the machine reads ran. (2) check-scoped-lint / next-errors: the same unresolved
  imports anywhere in the program were thrown as one unlocated SCRIPT_INPUT_UNAVAILABLE; now a gap on a selected
  file is a located input gap (a slice finding), a gap on a context-only file is recorded in
  execution.contextImportGaps and the check runs. (3) INPUTS_CHANGED_DURING_CHECK on the shared checkout (15
  parallel slices commit while one checks) now names the changed source files in a scoped run, so it gates a
  slice only when it touches the slice's own files; config/tooling/inventory-unsafe changes and --all stay
  run-level unavailable.
reach: new-legs
paths:
  - modules/kernel/contract-changes/canon-checker-located-gaps.yaml
  - scripts/checks/canon-scan.mjs
  - scripts/checks/check-scoped-lint.mjs
  - scripts/checks/code-patterns/next-errors.mjs
