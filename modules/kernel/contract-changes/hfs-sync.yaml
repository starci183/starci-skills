id: hfs-sync
effectiveAt: '2026-09-29T23:00:00+07:00'
summary: >-
  HFS `hfs sync` (Phase 0 item 0.9, decision 10). knowledge/repository-baseline.yaml, the 1100 lines of copied
  toolchain configs and their spec, is retired: there is no baseline shape any more. The files a product repository
  cannot `extends` are generated and verified by content hash from packages/hfs/templates - .husky/pre-commit (staged
  lint, typecheck, unit specs of staged files, work hygiene; never e2e), .github/workflows/ci.yml (hfs sync and hfs
  check, lint, typecheck, unit with coverage, build, Codecov, Sonar; no e2e) and e2e.yml (workflow_dispatch only),
  .gitignore (the HFS never-tracked list plus .starci/, as a managed block), sonar-project.properties and codecov.yml
  (coverage exclusions taken from @starci/jest-preset or @starci/vitest-preset) and, for a back end,
  .starciwork/.gitignore (the one allowlist, now read by scripts/lib/starciwork-boundary.mjs from its template).
  `hfs sync --check` fails on drift and `--write` rewrites it. backend.scaffold and interface.scaffold write the
  manifest and preset stubs, run `hfs sync --write` and require `hfs sync --check`; the repository-baseline knowledge
  branch is removed from the index and from the scaffold kinds. Follow-ups: .husky/pre-push (typecheck, lint:check,
  hfs check --fast, affected unit specs) is generated too; the Sonar key comes from the stack declaration
  (services.sonar.projects of this repository) and is derived from hfs.json only when none is declared; the skeleton
  source the baseline carried is now templates/{be,fe}/skeleton written once by `hfs sync --init` (platform config,
  logging and errors, the { status, info, error, details } health endpoint, and for a front end next-intl [locale]
  with vi default, as-needed prefix and proxy.ts); the HFS_SYNC_* and HFS_WORK_* failure codes are catalogued;
  @nestjs/terminus, next-intl and supertest join knowledge/hfs/canon-pins.yaml.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-sync.yaml
  - knowledge/repository-baseline.yaml
  - knowledge/index.yaml
  - modules/models/kinds.yaml
  - modules/goal/archetypes.yaml
  - modules/ops/ops/backend.scaffold.yaml
  - modules/ops/ops/interface.scaffold.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/canon-pins.yaml
  - modules/kernel/retired-paths.yaml
