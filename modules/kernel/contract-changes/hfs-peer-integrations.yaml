id: hfs-peer-integrations
effectiveAt: '2026-10-01T18:00:00+07:00'
summary: >-
  Lane SHAPE (lead C0): neither old backend of the examples declared @as-integrations/express5, so the Apollo GraphQL api
  could not boot under Express 5 and nothing noticed before e2e. New rule R111 HFS_PEER_INTEGRATION_MISSING (error, hfs
  enforcer scripts/lib/hfs-rules/peer-integrations.mjs): the app root package.json that depends on every package of a pair of
  the data catalog knowledge/hfs/peer-integrations.yaml (schema starci/hfs-peer-integrations@1) at the named major declares
  the pair's peer in its dependencies; the first pair is @nestjs/apollo on @nestjs/platform-express 11, which requires
  @as-integrations/express5. The scaffold spec boots the scaffolded be api from the linked installs. Also in this lane:
  be.tests.world allows fakes/<provider>/server.ts, which BE_SOURCE_FORM reads as the file's role; R105 judges the records
  of the be and fe sides from the app root; the managed typecheck builds the fe packages before the fe apps; the scaffold
  writes the be/fe sides form of workspace.yaml; the Work checks resolve a record's repository only as a declared side
  (the two-repository binding fallback, check-evidence-binding --repo and PROOF_COMMAND_AMBIGUOUS are deleted).
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-peer-integrations.yaml
  - knowledge/hfs/peer-integrations.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/hfs/slots.yaml
  - modules/schemas/hfs-peer-integrations.schema.yaml
  - scripts/lib/hfs-rules/peer-integrations.mjs
  - scripts/lib/hfs-rules/proof-commands.mjs
  - scripts/lib/hfs-path-findings.mjs
  - scripts/lib/hfs-check.mjs
  - scripts/example/example-ownership.mjs
  - scripts/checks/check-evidence-binding.mjs
  - scripts/checks/check-work-deep.mjs
  - packages/hfs/sync/index.mjs
  - packages/hfs/templates
