id: hfs-be-injected-param-name
effectiveAt: '2026-10-02T09:50:00+07:00'
summary: >-
  R85 BE_RAW_INJECT gains its parameter-name clause (alpha.5 item 6.1). The name list is `ruleParams.be.paramNames` of
  knowledge/hfs/slots.yaml (validated by scripts/hfs/slots.mjs and modules/schemas/hfs-slots.schema.yaml): for a port the
  convention names (`Clock`, `Logger`, `Cache`, `CommandBus`, `QueryBus`, `EntityManager`, `*Options`) the eslint-be rule
  `injected-param-name` holds a container-built constructor parameter that carries an injector and is annotated with that
  infrastructure type to the listed name (`entityManager` or `<connection>EntityManager`, `options` or `<owner>Options`). The type
  is found by where it is declared, as infra-needs-injector finds infrastructure; a type no entry names stays free. Violating and
  passing cases are in injection.spec.mjs.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-be-injected-param-name.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/be/injection.yaml
  - modules/schemas/hfs-slots.schema.yaml
  - scripts/hfs/slots.mjs
  - packages/eslint/be/injection.mjs
  - packages/eslint/be/README.md
