id: rc-engine
effectiveAt: '2026-09-28T15:00:00+07:00'
summary: >-
  The reconciler engine (scripts/reconciler/engine.mjs, boot.mjs, sources.mjs, state.mjs, owns.mjs, workqueue.mjs,
  ctx.mjs, testing.mjs; contract modules/reconciler/reconciler.yaml): one host process that runs the file-discovered
  controllers level-triggered, with a leader lock and epoch fence, a persisted workqueue, an events cursor per ledger
  and a shadow gate on every actuator. Every controller lands shadow (config.yaml reconciler, documented in
  config.example.yaml; numbers in runtimes.yaml allocation.reconciler). The old loops ask reconcilerOwns(concern)
  before each duty and yield it only while the leader heartbeat is fresh and the owning controller runs active:
  kernel/watchdog.mjs, kernel/resume-all.mjs, supervisor/tick.mjs, supervisor/watchdog.mjs, supervisor/stall-alert.mjs.
  Typed log kinds reconciler.would / act / error / event and invariant.violated / cleared are added. The workflow
  controller coalesces a stale runtime rev into a Kernel re-wake and opens one rev-ack decision per workflow only past
  REV_ACK_OVERDUE.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-engine.yaml
  - modules/reconciler/reconciler.yaml
  - scripts/reconciler/engine.mjs
  - scripts/reconciler/boot.mjs
  - scripts/reconciler/sources.mjs
  - scripts/reconciler/state.mjs
  - scripts/reconciler/owns.mjs
  - scripts/reconciler/workqueue.mjs
  - scripts/reconciler/ctx.mjs
  - scripts/reconciler/testing.mjs
  - scripts/reconciler/controllers/workflow.mjs
  - scripts/kernel/watchdog.mjs
  - scripts/kernel/resume-all.mjs
  - scripts/kernel/typed-logs.mjs
  - scripts/supervisor/tick.mjs
  - scripts/supervisor/watchdog.mjs
  - scripts/supervisor/stall-alert.mjs
  - engine/config.mjs
  - config.example.yaml
  - modules/models/runtimes.yaml
