id: ci-upload-oidc
effectiveAt: '2026-10-02T20:00:00+07:00'
summary: >-
  The Codecov upload of every CI workflow authenticates with GitHub's OIDC token (`use_oidc: true`, `permissions: id-token: write`)
  and fails the job when the upload fails (`fail_ci_if_error: true`). No repository secret (CODECOV_TOKEN) is needed, and the old
  `if: env.CODECOV_TOKEN != ''` gate that turned a missing token into a silently skipped upload is gone. Rule R202
  CI_UPLOAD_NOT_SILENT (runtime gate, scripts/hfs/runtime-rules/ci-upload.mjs) refuses a codecov/codecov-action step of the root
  workflows, the example workflows and the hfs template workflows that lacks OIDC, fail_ci_if_error or the id-token grant, has
  continue-on-error, or is gated on a secret. The managed ci.yml that `hfs sync` renders and the two example ci.yml files follow.
reach: new-legs
adds:
  codes: [CI_UPLOAD_NOT_SILENT]
paths:
  - modules/kernel/contract-changes/ci-upload-oidc.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/rules.yaml
  - scripts/hfs/runtime-rules/ci-upload.mjs
  - tests/hfs-runtime-rules/runtime-hfs-rules.spec.mjs
  - .github/workflows/examples.yml
  - packages/hfs/templates/app/ci-workflows/github/workflows/ci.yml
