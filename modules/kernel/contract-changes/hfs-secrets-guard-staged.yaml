id: hfs-secrets-guard-staged
effectiveAt: '2026-10-01T00:30:00+07:00'
summary: >-
  The secrets guard of the deleted nivo-backend scripts/secrets-guard.mjs becomes canon. R06 HFS_PLAINTEXT_SECRET keeps its whole-tree check and
  gains its commit half: hfs work-hygiene (the managed pre-commit hook, first line of both the back-end and the front-end hook) reads every staged
  file from the index and judges it with the same secretFileFindings as the tree check (a secret by being, an .enc that is no sops envelope, a line
  that matches a secret pattern), so a git add -f or a path tracked before a rule tightened cannot reach the history. There is no override: the old
  ALLOW_SECRET_SCAN switch, the plaintext twin re-encryption and the .enc twin sync are not part of the canon (secrets exist only as sealed .enc).
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-secrets-guard-staged.yaml
  - scripts/lib/hfs-rules/secrets.mjs
  - packages/hfs/sync/hygiene.mjs
  - packages/hfs/templates/be/hooks/husky/pre-commit
  - packages/hfs/templates/fe/hooks/husky/pre-commit
