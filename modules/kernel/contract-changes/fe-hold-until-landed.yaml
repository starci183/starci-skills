id: fe-hold-until-landed
effectiveAt: '2026-09-28T18:45:00+07:00'
summary: "Owner 2026-09-28 ('tất cả workflows của nivo', then 'vẽ ux ui được mà, code backend được mà'): the relaunched Nivo workflows run every leg now except the legs that WRITE nivo-fe code, which wait until wf-nivo-fe-canon-mujek980 has product-landed its restructure into nivo-fe main. New typed release condition --until-landed <workflowId>@<repository> (scripts/kernel/gate-conditions.mjs): met when that workflow is finished, or when it has a product-land-landed event for that repository, its wf/ branch is not ahead of main and none of its code-writing legs (CODE_WRITING_OPS) is open; a workflow that is gone reads unmeetable. On api incident --kind peer-wait it names the peer (a different --peer is refused: landed-peer-mismatch) and the wait carries untilLanded (api status frontier.peerWaits[].untilLanded, the text status line, dependency-graph edge via until-landed). Held ops are named with --holds as before, so dispatch/route refuse them with the peer-wait reason while every other leg is unaffected; the runtime resolves the wait itself (by: until-conditions) on the next status/route/dispatch/settle after the land. A peer-wait holds only the ops it names: status nextActions marks a step whose op/job a peer-wait holds heldBy {incident, peer}, and a frontier that would read peer-wait reads next-ready while an unheld next step exists, so the Kernel keeps moving the non-held legs. define-goal: a fresh owner-defined goal with --reason records ownerApproval {by: owner, source: owner-chat, reason} on the goal json, the inbox entry, the goal-defined event and the output. Adds no op check or finding code"
reach: new-legs
paths:
  - scripts/kernel/gate-conditions.mjs
  - scripts/kernel/api-verbs/incident.mjs
  - scripts/kernel/api-lib/peers.mjs
  - scripts/kernel/api-verbs/status.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/dependency-graph.mjs
  - scripts/goal/define-goal.mjs
  - modules/kernel/api-commands/incident.yaml
