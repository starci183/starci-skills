id: router-no-compat-args
effectiveAt: '2026-09-29T18:00:00+07:00'
summary: "owner rule: .claude keeps no backward compatibility. api route and api dispatch no longer accept --prefer/--avoid (they were parsed, ignored with a warning and recorded as biasIgnored): both refuse them with the typed error unknown-option, and route-decided/answers no longer carry biasIgnored; route-model.mjs drops the flags and its bias plumbing. The only routing bias is the owner goal routing_bias. api plan now requires the plan file's edges (refused plan-edges-missing when absent, partial, naming an unknown leg or cyclic); the recorded-edges carry-over is gone, planGraphOf reads derivedPlan.edges only (no opChain.edges or linear-chain fallback), and a goal whose derivedPlan lacks edges is refused plan-edges-missing by api status. define-goal derivedPlan requires route-plan's edges. Incident text no longer describes free-text incidents as backward compatible, and the driver-loop circuit-recovery rule drops the predates-fingerprints case; the dispatch contract reads Orca worker launch only from startOptions.launch.effective. One-shot data migration: node scripts/kernel/migrate-plan-edges.mjs [--apply] (dry-run by default) projects the goal's own opChain.edges onto a derivedPlan that lacks edges for every non-finished workflow of every registered ledger and reports an underivable one without inventing edges; that workflow needs one api plan with edges. Kernels must call: api route --job <id> [--difficulty <d>]; api dispatch --job <id> [--spawn] [--model <t>] [--worktree <sel>] [--lease-ttl <ms>] [--env-gate off]; api plan --workflow <id> --file <plan.json with legs AND edges> [lineage flags]."
