id: land-conflict-free-registries
effectiveAt: '2026-09-28T22:30:00+07:00'
summary: "Land throughput (lane land-throughput; supervisor ledger 2026-09-28: 44 lands in 8 h, 16 failed, 15 of them cherry-pick conflicts on the shared tails every lane appends to). (1) Contract changes are one file per entry, modules/kernel/contract-changes/<id>.yaml (a plain map: id, effectiveAt, summary, reach, paths, ...); scripts/kernel/contract-changes-store.mjs is the one reader (readContractChangesDoc, readContractChangesDocAt) used by loadContractChanges, runtime-rev, the land gate's contract-changes paths coverage and gate-stability, draw-rationale and the self-learning revert lane (which now writes an entry file). The old contract-changes.yaml list stays read during the transition (an item there wins over a file of the same id) and `node scripts/kernel/contract-changes-store.mjs --migrate` empties it into the directory once the queued lanes landed. (2) The kernel api grows by files (scripts/kernel/api-extensions.mjs): a verb is scripts/kernel/api-verbs/<verb>.mjs with its contract in modules/kernel/api-commands/<verb>.yaml, a status field scripts/kernel/api-status/<key>.mjs, a boolean flag a line of scripts/kernel/api-boolean-flags.txt (merge=union); check-api-surface reads both forms; `api extensions` lists them. No existing verb, flag or field moved. (3) land.mjs refuses a pick that cannot apply BEFORE the queue: a lock-free preflight (git merge-tree of each commit onto main, conflictPreflight) - and the gate's own cherry-pick - return every conflicting file with its marker hunks (`conflicts`) and one instruction (`hint`: rebase onto main, resolve those hunks, land the new sha); land-failed records the files. (4) packages/grammar/CHANGELOG.md merges union (ui/CONTRACT.md stays a normal merge: lanes edit it in place). Adds no check or finding code; nothing accepted before is refused"
reach: new-legs
paths:
