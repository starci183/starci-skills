id: test-kinds-unit-e2e
effectiveAt: '2026-09-29T00:00:00+07:00'
summary: >-
  Owner ruling 2026-09-29: a repository has exactly two test kinds - unit `<name>.spec.ts` beside its subject and
  e2e `*.e2e-spec.ts`. The `*.int-spec.ts` (integration) and `*.harness-spec.ts` (harness) kinds and the
  `src/tests/integration/` and `src/tests/harness/` folders are retired: their specs are e2e. Backend: every
  non-unit spec under `src/tests/e2e/`, environment code in `src/tests/e2e/setup/`, data in `src/tests/fixtures/`,
  one root `jest.config.js` with exactly the projects `unit` and `e2e`, scripts `test:unit`, `test:e2e` and the
  optional `test:e2e:live` (filter on `src/tests/e2e/live/`). Frontend: Playwright specs in root `e2e/` named
  `*.e2e-spec.ts`, one root `playwright.config.ts`, script `test:e2e`. The HFS architecture check declares
  HFS_TEST_KIND_RETIRED and flags retired suffixes, retired folders, per-lane jest configs and unsuffixed Playwright
  specs; `src/tests/` may hold only `e2e` and `fixtures`. BE-TEST-1, BE-FOLDER-7, BE-NAMING, FE-TEST-1 and the
  repo folder rule are rewritten to match; the canon testing rules treat `src/tests/e2e/live/` e2e specs as the
  opt-in live-provider lane. The four product examples are converted.
reach: new-legs
paths:
