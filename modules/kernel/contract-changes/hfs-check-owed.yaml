id: hfs-check-owed
effectiveAt: '2026-09-30T18:00:00+07:00'
summary: >-
  Lane C0 sub-lane Q1: every owed `hfs` enforcer of the rule catalog ships. `hfs check` (scripts/lib/hfs-check.mjs, with the
  tree checks in scripts/lib/hfs-rules/) reports HFS_PLAINTEXT_SECRET (R06, over the one secret pattern list of
  scripts/lib/secret-patterns.mjs), HFS_STACKS_SHAPE (R10, the be.starcistacks slot's allows list and the host-owned Sonar,
  read through scripts/lib/stack-declaration.mjs, the reader now shared with check-starcistacks), HFS_CI_MISSING_CANON (R13),
  HFS_DEP_VERSION_SKEW (R14, package.json specs and the lockfile), HFS_CONTRACT_SNAPSHOT_DRIFT (R23, hash of the front-end
  copy against the sibling back end named by hfs.json stacks), BE_TEST_TOPOLOGY (R47), FE_WIRE_GENERATED (R52),
  FE_I18N_PLACEMENT (R59) and FE_I18N_CATALOG (R60). packages/hfs/sync reports HFS_GITIGNORE_BLOCK_DRIFT (R04) and
  HFS_SONAR_CONFIG (R11) by comparing the file with its render (the rendered sonar-project.properties no longer carries
  sonar.host.url) and HFS_FORMAT (R19) by running the repository's own prettier; a repository without prettier is a refusal,
  HFS_FORMAT_TOOL_MISSING, and the check is not part of --fast. One name per finding: HFS_PATH_NO_SLOT is
  HFS_SLOT_UNDECLARED, HFS_REQUIRED_MISSING is HFS_SLOT_REQUIRED_MISSING and HFS_STACKS_PLAINTEXT is HFS_PLAINTEXT_SECRET; the
  sub-codes HFS_SLOT_AMBIGUOUS, HFS_SLOT_NOT_ENABLED, HFS_FORBIDDEN_PRESENT, HFS_TRACKED_MUST_BE_IGNORED, HFS_MIN_INSTANCES,
  HFS_SIZE_SOFT_BACKLOG and HFS_TEST_KIND_RETIRED are listed under the rules that own them (R01, R02, R20, R47). R61's planned
  hfs enforcer is stylelint source-resolves, which already ships. The catalog carries no planned hfs enforcer of these rules.
ops: []
adds:
  codes:
    - HFS_SLOT_UNDECLARED
    - HFS_SLOT_REQUIRED_MISSING
    - HFS_PLAINTEXT_SECRET
    - HFS_STACKS_SHAPE
    - HFS_CI_MISSING_CANON
    - HFS_DEP_VERSION_SKEW
    - HFS_CONTRACT_SNAPSHOT_DRIFT
    - BE_TEST_TOPOLOGY
    - FE_WIRE_GENERATED
    - FE_I18N_PLACEMENT
    - FE_I18N_CATALOG
    - HFS_GITIGNORE_BLOCK_DRIFT
    - HFS_SONAR_CONFIG
    - HFS_FORMAT
    - HFS_FORMAT_TOOL_MISSING
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-check-owed.yaml
  - knowledge/hfs/rules.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/lib/hfs-check.mjs
  - scripts/lib/hfs-slots.mjs
  - scripts/lib/hfs-rules
  - scripts/lib/stack-declaration.mjs
  - scripts/lib/secret-patterns.mjs
  - scripts/checks/check-starcistacks.mjs
  - scripts/checks/check-hfs-rules.mjs
  - scripts/checks/check-hfs-sync.mjs
  - scripts/supervisor/push-mains.mjs
  - packages/hfs
