id: provider-qwen-removed
effectiveAt: '2026-09-29T22:00:00+07:00'
summary: >-
  The Qwen provider is removed from the runtime entirely (owner ruling 2026-09-29: "remove qwen, it is far too lame!! not
  buying it any more, devin codex claude are enough"). Only claude, codex and devin remain. Gone: the qwen agent card and the
  qwen-agent, qwen3.8-max and deepseek-v4-pro profiles; the qwen-agent runtime pool and its place in every
  allocation tier, preference and audit order (allocation.hands is [devin-agent]; the easy tier lists the pools
  that pin an easy model, so Devin, which pins none, is absent there; a review of what Devin implemented goes to
  Opus or Sol under the cross-family rule); registry targets, aliases, operator chains and environments;
  scripts/api/quota/qwen.mjs and the config.yaml quota key (Qwen was its only member); the Qwen credential
  probes (openai-models, openai-chat) in scripts/agent/credential-probe.mjs; the qwen-loop-detection gate, the
  card inputRow and ghostSuggestion liveness fields and the boxed "*" input glyph in the terminal readers; the Qwen
  token adapter (scripts/lib/llm-usage.mjs USAGE_AGENTS is claude and codex), session-directory and
  housekeeping sweeps; the model-scorecard token block; the base-pool line of the supervisor status block; the
  Orca qwen agent, recipe and receipt list; qwen in provider-circuit, quit-agent, reconciler seat detection and
  the workers agent set; the qwen CHECK values of the machine and runtime 0001-init schemas. The defaultOperation
  target is devin-agent. A config.yaml that still names qwen (allocation.preferredProvider, allocation.shares,
  allocation.grants, kernel.agent, kernel.group agent, supervisor.kernel.agent) is refused with "Qwen has been
  removed; use claude, codex or devin"; a leftover quota key is refused as an unknown key. The card hooks only Qwen declared - credentialRefresh, hostPrerequisites (scripts/agent/trust.mjs ensureHostSettings) and
  hostIdentity - are deleted with their readers; gateAutoAnswer stays (the claude and codex cards declare it). History (earlier contract-change entries, benchmark snapshots and findings, CHANGELOG) keeps its
  mentions; the deleted files it cites are listed in modules/kernel/retired-paths.yaml.
safetyCritical: false
reach: new-legs
