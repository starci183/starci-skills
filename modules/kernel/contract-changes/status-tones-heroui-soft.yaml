id: status-tones-heroui-soft
effectiveAt: '2026-09-30T12:00:00+07:00'
summary: "Status tones follow HeroUI (owner decision 2026-09-30). scripts/checks/brand.mjs contrast-aa holds a token with role <success|warning|info|danger>-soft and its foreground, and that foreground as a bare glyph on every surface, background or canvas token, to policy.softMinContrast (3 by default, evidence kinds soft and status-glyph); body and interactive text keep policy.minContrast (4.5). knowledge/ui/proof/contrast.yaml COLOR-5 case-1a and the grammar contrast suite (SOFT_MIN) carry the same 3:1 for soft pairs."
ops:
  - brand.decide
paths:
  - scripts/checks/brand.mjs
  - modules/schemas/work-brand.schema.yaml
  - modules/ops/ops/brand.decide.yaml
  - modules/kernel/owner-rulings.yaml
  - knowledge/ui/proof/contrast.yaml
  - knowledge/ui/presentation/tone.yaml
  - packages/grammar/src/__test__/contrast.ts
  - docs/brand-checks.md
