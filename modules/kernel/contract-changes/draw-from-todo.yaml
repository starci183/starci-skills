id: draw-from-todo
effectiveAt: '2026-09-29T20:00:00+07:00'
summary: "owner ruling 2026-09-29 (draw-from-todo): interface.draw starts from a todo shell - the layout-unsettled dispatch refusal and the shell mustExist / layoutChain prerequisite are removed; the op scans the layout tree, draws or captures the missing shell, ancestor layouts and brand lockup first, settles them in its own writes (shellNode/shellAssets, kinds interface.draw writes shell), then draws EVERY screen of its scope (representativeScreensMax removed) at desktop and mobile; shell-conformance judges the result after the op. The shell is one shared foundation `shell`: api dispatch claims it for the first draw that has parents to draw, a draw of another live workflow is deferred as foundation-wait (queuedBecause foundation-wait, declared dependent), a stalled owner (allocation.drawLoop.shellFoundationStallMs) opens a Supervisor Decision Item (cross-workflow), and a passed draw lands the foundation once the tree is settled; brand.decide is no longer the exclusive layout-capture gate. Hard design gate: api dispatch refuses interface.implement (prerequisite-unmet, kind design-not-settled, code DESIGN_NOT_SETTLED, Vietnamese explanation) while the ui record it proves has no settled interface.draw (reads.draws designDrawn). Tiếng Việt - draw chạy được từ todo, tự vẽ/chụp shell và layout cha trước rồi vẽ màn hình; code trước khi vẽ xong bị từ chối."
ops: [interface.draw, interface.implement, brand.decide]
paths:
