id: workflow-host-startup
effectiveAt: '2026-10-03T20:55:13Z'
summary: >-
  Accepted workflow ingress ensures the existing host without recursive Kernel repair, requires the
  actual public harness health contract and served UI entry assets, and prepares each new Kernel's
  owned tree through native npmCi. Optional debug uses a declared caller route independent of the
  Kernel agent; unknown effects remain blocked. Cold harness toolchains use the native npm API under
  the existing host lock, including non-Git package installs, with local path and manifest custody.
  New boot receipts bind actual readiness and installation.
