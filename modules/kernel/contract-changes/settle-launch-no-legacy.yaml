id: settle-launch-no-legacy
effectiveAt: '2026-09-29T20:00:00+07:00'
summary: >-
  Remove the settle, launch, admission and worktree compatibility paths. A done report without `head`
  is `missing: head` under every commit policy (landed.headCheck is only `verified`; the
  `skipped-legacy-report` value is gone). Difficulty accepts only easy|medium|hard|insane (the
  s/m/l/xl, small/med/large and high spellings are unknown, including as pool models/effort keys).
  An owned pathspec is always `:(literal)`. Adapter cards declare terminalFallback.bypassArgs (the
  bypassFlag seam is gone). importsBroken scans only the workflow's _wf worktrees (no live shared-tree
  scan). terminal-send with --wait-submit on a host without prompt receipts returns a typed failure
  (host-contract-drift or incompatible_runtime) and sends nothing; the plain terminal-send fallback is gone.
reach: new-legs
paths:
  - modules/cli/commands/kernel/settle.yaml
  - modules/models/agents/devin.yaml
  - modules/kernel/contract-changes/settle-launch-no-legacy.yaml
