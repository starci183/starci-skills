id: workspace-uat-rules-guarded
effectiveAt: '2026-10-02T09:30:00+07:00'
summary: >-
  THE UAT, WORKSPACE AND RUNTIME RULES ARE ENFORCED BY THE COMMAND GUARD (OPS2 3.1, WFWT2). They were evidence-level only.
  scripts/guards/launch-verdict.mjs (called by command-guard.mjs commandVerdict with the guard) now refuses an agent's own Orca
  worktree write (create, add, rm, remove, delete, prune, move: scripts/api/orca/worktree-create.mjs, worktree-rm.mjs; AGENT_ORCA_WORKTREE: worktrees are created and removed only by
  the runtime worktree API, which runs the link check and keeps the registry and cap; `git worktree` writes stay
  WORKTREE_NOT_OPS), and, in a uat op (uat.verify, uat.assisted.*), a test world (`node .../test-world-run.mjs`,
  UAT_TEST_WORLD: the walk runs on the real dev stack). The op guard file carries the job's op id (writeJobGuard and
  guardLaunch take op; api dispatch passes it). The other workspace/runtime rules already had a refusal (recursive delete,
  kill by name, raw terminal create, headless agent launch); tests/guards/workspace-uat-rules-guard.spec.mjs shows them all
  in one place. modules/ops/_common.yaml names both new refusals.
reach: new-legs
paths:
  - modules/kernel/contract-changes/workspace-uat-rules-guarded.yaml
  - scripts/guards/launch-verdict.mjs
  - scripts/guards/command-guard.mjs
  - scripts/guards/hook-install.mjs
  - scripts/kernel/cli.mjs
  - modules/kernel/failure-codes.yaml
  - modules/ops/_common.yaml
  - tests/guards/workspace-uat-rules-guard.spec.mjs
