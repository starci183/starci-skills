id: worker-release-on-report
effectiveAt: '2026-09-28T13:15:00+07:00'
summary: >-
  Owner 2026-09-28 ("tức là kernel xong việc không tự đóng op à?"): once api report has validated and
  filed an op's report, the runtime closes that op's worker right away - the agent terminal is closed and
  verified gone with its process tree (scripts/lib/close-verify.mjs; from the op's own terminal a detached
  verifier closes it after the report command exits) - and records payload.workerReleased {at, by: report,
  handle, custody} plus a worker-released-on-report event. The report and evidence are already in the
  ledger and files, so nothing the settle needs is lost; settle still runs its verified close, which then
  only proves the release (and closes it when missing, e.g. a failed close or failed-no-report). An `ask`
  report keeps its worker (the answer arrives in the same session); a managed worker is released by settle.
reach: new-legs
paths:
  - modules/kernel/contract-changes/worker-release-on-report.yaml
  - modules/kernel/driver-loop.yaml
  - scripts/kernel/api.mjs
