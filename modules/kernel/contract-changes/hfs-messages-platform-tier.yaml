id: hfs-messages-platform-tier
effectiveAt: '2026-09-30T20:00:00+07:00'
summary: >-
  Lane FPE (BE-CONVENTION 1.15, 1.18: Vietnamese only in messages/ catalogs): the slot be.domain.messages now covers
  src/modules/{domain,platform,integrations}/<capability>/messages/, so a platform capability may own a catalog and
  no-non-ascii-source accepts it. Also: no-string-token accepts Nest framework tokens exported by @nestjs/core,
  unit-test-colocated accepts a spec its slot requires,
  no-runtime-schema treats DataSource operation overrides as operations and now also refuses dropDatabase(), runMigrations() outside apps/migrate and the test world, dropSchema, schema builders, @Entity synchronize and boot-time writes in lifecycle hooks; infra-needs-injector judges only container-built classes; error-home accepts an unexported spec-local DomainError subclass; infra-import-owner and no-ambient-clock treat the whole be.tests.world.* family as the test composition root; transport-dispatch-only skips @Module classes; input-bounded accepts IsIn on a closed literal union.
reach: new-legs
paths:
  - modules/kernel/contract-changes/hfs-messages-platform-tier.yaml
  - knowledge/hfs/slots.yaml
  - packages/eslint/be/injection.mjs
  - packages/eslint/be/testing.mjs
  - packages/eslint/be/schema-authority.mjs
  - packages/eslint/be/infra-owner.mjs
  - packages/eslint/be/transport.mjs
  - packages/eslint/be/input-bounds.mjs
  - packages/eslint/be/error-handling.mjs
  - modules/kernel/failure-codes.yaml
