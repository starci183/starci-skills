id: hfs-be-shape
effectiveAt: '2026-09-30T18:30:00+07:00'
summary: >-
  Lane C0 sub-lane RC (BE-CONVENTION 1.5, 1.6, 1.10-1.15; R87-R90): eslint-canon-be 2.0.0 (unreleased) gains the CQRS
  shape rules (message-typed-result, execute-params-shape, no-use-case, no-event-bus; handler-overrides-process and
  message-carries-params-only now read the slot and types), the transport shape rules (transport-dispatch-only,
  no-response-envelope, no-graphql-json; door-lives-in-features, no-capability-imports-features and
  rest-door-needs-a-reason now read the slot and types), naming/no-default-export, and the new infra-owner law
  (infra-import-owner over ruleParams.be.infraOwners). The slot manifest gains ruleParams.be.infraOwners, suffixes and
  bannedSuffixes (validated by hfs-slots.mjs and the schema), the application slots drop use-case, and `hfs check`
  reports BE_SOURCE_FORM for a tracked back-end .ts outside the closed suffix vocabulary. The architecture machine's
  BE_SOURCE_NAME_INVALID is renamed BE_SOURCE_FORM (one obligation, one code) and its failure-code entry is deleted.
  no-non-ascii-source loses its test-lane exemption (only message catalogs may hold Vietnamese).
reach: new-legs
adds:
  codes: [BE_SOURCE_FORM]
