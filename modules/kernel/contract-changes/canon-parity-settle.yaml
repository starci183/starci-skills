id: canon-parity-settle
effectiveAt: '2026-09-28T15:00:00+07:00'
summary: >-
  CANON PARITY VERIFIER (coordinator decision under the owner's delegation, reconciler lane rc-job). The runtime
  settler (scripts/reconcile/job-settle.mjs verifyReported) no longer hands the Kernel every done code.refactor canon
  cut slice (payload.cut + params.canonFamilies) whose declared checks are red or not re-verifiable: it measures the
  slice itself over its OWNED paths against its admission base (params.admissionBase, else the --base of its
  scoped-lint checks) in scripts/reconcile/canon-parity.mjs, and settles it (api check + api settle --verdict pass,
  via canon-parity) only when ALL hold: (a) canon-scan over the owned paths has 0 findings; (b) check-scoped-lint
  --base over the owned source files (its own child process) has no gating issue - no new located finding and no
  unlocated issue inside the slice (a run voided only by INPUTS_CHANGED_DURING_CHECK is measured again, up to 3x);
  (c) every declared red is superseded by an owned-scope measurement of its family (canon, lint, typecheck, git diff
  --check) or re-runs exit 0 as a runtime check, so what stays red is foreign residue outside the owned paths; any
  other red, and any green claim nothing re-measures, stays the Kernel's; (d) TypeScript has no NEW error versus base
  in any project holding an owned file (the base is the same tree with only the owned files at their base blobs, an
  in-memory overlay, so a new error in an owned file or in an importer is the slice's). This formalises the Kernel's
  "parity, no new findings" judgement as stricter code; it weakens no gate. A refusal is handed over with its parity
  reason (parity-lint-new, parity-tsc-new, parity-uncovered, parity-rerun-red, parity-no-base, ...) and cached per
  dispatch in <ledger dir>/settle-parity/ while the slice's base and owned files are unchanged (30 min; 5 min after a
  sibling-edit-only failure). Rollback: STARCI_SETTLER_PARITY=0. Also: the settle invariant (settle-unsettled-report)
  now runs from every workflow watchdog loop on the settler cadence (allocation.settler.everyMs, 60 s), records a
  job-settle-invariant-violated ledger event once per dispatch, and skips a job a settler pass is verifying (its
  per-job lock held within itemBudgetMs); the Supervisor tick keeps its owner alert as the backstop for a dead loop.
reach: new-legs
paths:
  - modules/kernel/contract-changes/canon-parity-settle.yaml
  - scripts/reconcile/canon-parity.mjs
  - scripts/reconcile/job-settle.mjs
  - scripts/kernel/watchdog.mjs
  - tests/job-settle-parity.spec.mjs
