id: evidence-off-starciwork
effectiveAt: '2026-09-29T01:00:00+07:00'
summary: "alpha.3 (ARCHITECTURE-DB §5.1-§5.3): op evidence leaves .starciwork. `E/` in every op brief is the attempt's evidence folder inside STARCI_JOB_SCRATCH (modules/ops/_common.yaml Path and field contract), filed with api report --attach <scratch>/E (a directory attaches every file under it, as attachments/<path in scratch>); uat.verify files its run from <scratch>/runs/<runId> (artifacts role uat-run with run_id) and the flow's evidence.yaml cites run {id, result, screens[], videos[]} by sha256; interface.audit files its verdict as <scratch>/interface-audit.json, which api report writes as the audit's interface_audits row (the operations family and features/<f>/operations/** are gone from work-layout.yaml); captures/** attach as capture/dom, round-<n>/ carries the round. api report answers with every artifact {id, name, sha256}. work-layout.yaml drops the operations, runs, uatRun and evidence shape entries; check-example-work refuses agent data in an example tree [HFS_AGENT_DATA_TRACKED] and a done uat-flow accepts a cited run. Transition: impl running-page captures, shell/assets layout captures and draw-loop rounds are still written in place until their readers resolve blobs"
reach: new-legs
adds:
  codes:
    - HFS_AGENT_DATA_TRACKED
    - STARCIWORK_DRIFT
paths:
  - modules/ops/_common.yaml
  - modules/kernel/api-commands/report.yaml
  - modules/ops/ops/uat.verify.yaml
  - modules/ops/ops/interface.audit.yaml
  - modules/schemas/work-layout.yaml
  - modules/schemas/work-uat-flow.schema.yaml
  - modules/schemas/interface-audit-operation.yaml
  - modules/kernel/contract-changes/operations-family.yaml
  - modules/kernel/contract-changes/operations-record-legacy.yaml
