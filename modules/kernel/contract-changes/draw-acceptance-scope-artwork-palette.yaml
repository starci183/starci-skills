id: draw-acceptance-scope-artwork-palette
effectiveAt: '2026-09-28T00:35:00+07:00'
summary: "Runtime checker defects (nivo inc-c4337a7874da, inc-59f939a53469; starci-next inc-2c34ae792249). (1) draw-acceptance attributes a bound image to the ui record whose directory is its LONGEST path-segment prefix (ownerOf), so an image of a nested child record (owned-shell/module-ledger) is read against the child's assets, retired flags and draw-render receipts, not the parent's. (2) draw-acceptance judges an evidence document (draws / selectedMatrix / assertions / proofs) the pass names itself (a report file, an explicit --files entry) always, and one reached only by walking an owned directory only when the live owning record binds its path (boundByRecord, outside a retired entry); kept historical image-gen evidence (earlier rounds' draws.yaml, baselines) is kept proof, not re-judged. An entry marked retired is skipped; a rejected-* asset is kept proof like a retired one; an image its record already refused (coverage.map) is not refused twice. Every live bound asset is still judged. (3) draw-render.mjs records layout.artwork: every visible <img>'s painted box (clipped by overflow-clipping ancestors, document CSS px) and the sha256 of the bytes it shows. brand-palette.mjs skips exactly the boxes whose bytes are a registered brand artwork master (brand.artworkSlots[].sha256 or the sha256 of its master file) - in a part from its draw-render record, in a composite mapped through composite.rect/fit from its content part's record - so a token-rendered drawing embedding a registered master (the Academy learning-journey image) is no longer PALETTE_OFF_BRAND on the master's own shading. No colour allowlist: an unregistered or altered image, paint outside the box, and the master checked on its own are judged as before. Legs drawn before this change re-render to carry layout.artwork."
reach: new-legs
ops: [interface.draw, brand.decide, interface.implement]
paths:
  - scripts/checks/draw-acceptance.mjs
  - scripts/checks/brand-palette.mjs
  - scripts/checks/shell-conformance.mjs
  - scripts/work/draw-render.mjs
  - scripts/work/draw-loop.mjs
  - modules/kernel/contract-changes.yaml
  - tests/draw-acceptance-scope.spec.mjs
  - tests/brand-palette-artwork.spec.mjs
