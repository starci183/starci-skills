id: work-graph-v0
effectiveAt: '2026-09-27T04:45:00+07:00'
summary: "A workflow's work graph (starci/work-graph@1: domains, foundation/slice/task nodes with owned paths, reads, rollback target, size, FRs and shapes, data/contract/order edges) lives versioned in the new ledger table work_graph_versions (engine/schema.sql, created additively by migrateLedger). scripts/work/work-graph.mjs show|validate|diff|propose; propose validates the candidate (acyclic, disjoint owned paths, FR and shape coverage, api estimate bounds via scripts/work/slice-estimate.mjs, an edge for every read of another node's path, a contract edge across domains) and records the next version with its author op/job, reason, diff and colours (removed or changed nodes and their descendants turn red). Only a job of an op whose graphPolicy.workGraph (op.schema.yaml) is draw (scope.define), revise (business.decide, architecture.decide, interface.draw) or cut (work.author, one slice) may write; the Kernel is refused graph-write-denied. scripts/work/backfill-work-graph.mjs builds v0 for running workflows from feature scope, journey, FR, implementation and ui records. Adds no check or finding code; a leg admitted earlier keeps its manifest"
reach: new-legs
ops: [scope.define, business.decide, architecture.decide, interface.draw, work.author]
paths:
  - modules/schemas/work-graph.schema.yaml
  - modules/schemas/op.schema.yaml
  - modules/schemas/index.yaml
  - modules/ops/_common.yaml
  - modules/ops/ops/scope.define.yaml
  - modules/ops/ops/business.decide.yaml
  - modules/ops/ops/architecture.decide.yaml
  - modules/ops/ops/work.author.yaml
  - modules/ops/ops/interface.draw.yaml
  - modules/ops/registry.yaml
  - engine/schema.sql
  - engine/ledger-db.mjs
  - scripts/work/work-graph.mjs
  - scripts/work/work-graph-model.mjs
  - scripts/work/work-graph-store.mjs
  - scripts/work/work-graph-context.mjs
  - scripts/work/slice-estimate.mjs
  - scripts/work/backfill-work-graph.mjs
  - scripts/checks/check-op-manifest.mjs
  - docs/ledger-db.md
  - tests/work-graph.spec.mjs
