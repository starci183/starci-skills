id: rt-spec-behaviour
effectiveAt: '2026-10-02T18:30:00+07:00'
summary: >-
  Smell wave S10-01 and S10-03: `npm run check` runs scripts/checks/check-specs.mjs over every runtime spec.
  RT_SPEC_ASSERTS_SOURCE_TEXT: a spec reads the text of a runtime production source of this repository (named through
  import.meta or a repository-root constant) instead of driving the exported function. RT_SPEC_SKIP_UNEXPLAINED: a skipped
  test (t.skip, it.skip, { skip: cond }) whose skip carries no reason text. Every finding in the tree is fixed with the check:
  specs call the exported function with injected dependencies; platform and tool skips state what is missing, and the tests
  that skipped for want of Prettier or Playwright now run because the runtime provisions them.
reach: new-legs
adds:
  checks: [check-specs]
  codes: [RT_SPEC_ASSERTS_SOURCE_TEXT, RT_SPEC_SKIP_UNEXPLAINED]
paths:
  - modules/kernel/contract-changes/rt-spec-behaviour.yaml
  - modules/kernel/failure-codes.yaml
  - knowledge/hfs/runtime-slots.yaml
  - scripts/checks/check-specs.mjs
  - tests/checks/check-specs.spec.mjs
