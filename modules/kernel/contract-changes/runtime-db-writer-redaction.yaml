id: runtime-db-writer-redaction
effectiveAt: '2026-09-28T23:30:00+07:00'
summary: "The runtime.sqlite writer (engine/ledger-db.mjs) redacts every free-text and JSON column it stores (REDACTED_COLUMNS: log messages and data, reports, check commands, incident details, inbox payloads, decisions, contracts, events payloads before their digest) through scripts/lib/redact.mjs, so no caller can skip redaction. ledgerFileFor resolves a project's ledger through machine.ledgers (resolveLedger by repo_root) and a new ledger registers itself. markBlobArchived and pruneAttemptSnapshots are the blob GC's ledger hooks. Work validation no longer excepts runtime.sqlite or logs.sqlite in .starciwork (they live outside it); the logs.sqlite migration wait is gone. Adds no check or finding code"
reach: new-legs
paths:
  - engine/ledger-db.mjs
  - engine/index.mjs
  - modules/schemas/work-layout.yaml
  - scripts/kernel/typed-logs.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/input-digests.mjs
