id: canon-owed-to-wire-envelope
effectiveAt: '2026-09-28T13:55:00+07:00'
summary: >-
  The code.refactor brief tells a canon slice to report done listing each wire-owned residual finding as
  owedToWire [{path, finding}], but the report envelope (scripts/kernel/report-envelope.mjs ALLOWED_KEYS) refused
  the field as unknown, so no slice could declare it and the Kernel overruled valid slices for "missing the formal
  owedToWire declaration" (wf-nivo-fe-canon-mujek980 op-code.refactor-c54caae5fb ordinal 10: canon 13 -> 2, both
  architecture.json owner registrations). The envelope now accepts owedToWire [{path, finding, file?, ruleId?}]
  (verdict-contract.yaml), a canon slice's cut-slice-postcondition is green when every residual finding is listed
  there (driver-loop.yaml), and settle adds a passed slice's owedToWire paths to the queued canon-wire leg
  (api.mjs widenCanonWire, shared with the blocked-slice follow-up).
reach: new-legs
paths:
  - modules/kernel/contract-changes/canon-owed-to-wire-envelope.yaml
  - modules/kernel/verdict-contract.yaml
  - modules/kernel/driver-loop.yaml
  - scripts/kernel/report-envelope.mjs
  - scripts/kernel/api.mjs
