id: ended-workflow-views
effectiveAt: '2026-09-30T18:30:00+07:00'
summary: >-
  THE RUNTIME VIEWS HIDE AN ENDED WORKFLOW'S LEFTOVERS (cluster ended-workflow-views; evidence 2026-09-30
  nivo-backend di-876124d7: a live owner DI on a workflow archived 2026-09-29, unresolvable under
  events_refuse_archived, still listed 'bad' by v_decision_rows and counted by the UI). Migration
  0005-ended-workflow-views (user_version 4 -> 5, VACUUM INTO backup + checks, engine/ledger-db.mjs
  FORWARD_MIGRATIONS) recreates v_decision_rows, v_blocking and v_open_work with the ENDED join of
  scripts/reconciler/decisions.mjs listDecisions — every UNION leg keeps only rows whose workflow is missing or
  not archived|finished; v_decision_rows keeps an ended workflow's resolved rows as history. The two raw
  decision_items counts of ui/api/routes/work.mjs (ownerDecisions, decisionsOpen) carry the same join. Adds no
  check or finding code.
reach: new-legs
paths:
  - modules/kernel/contract-changes/ended-workflow-views.yaml
  - engine/ledger-db.mjs
  - engine/migrations/runtime/0005-ended-workflow-views.sql
  - ui/api/routes/work.mjs
  - docs/ledger-db.md
  - ui/CONTRACT.md
