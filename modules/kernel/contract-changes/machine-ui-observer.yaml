id: machine-ui-observer
effectiveAt: '2026-10-03T22:00:00+07:00'
summary: >-
  engine/db/machine.mjs exports openMachineObserver for public observation. It uses the shared read-only
  schema validation and bounded retry mechanisms, returns visible typed corruption diagnostics and
  in-memory recovery notices, and persists no incident or recovery record. Its public handle exposes
  read metadata, the read connection, close and the existing typed registry, service, seat, provider,
  log, metric and resource queries without the operational mutation API.
  openMachineReader, readMachine and writers retain their operational incident and recovery persistence.
  engine/db/machine-connection.mjs owns shared connection retries and read-only diagnostics; machine.mjs
  owns writable preparation, transactions and incident/outbox persistence.
reach: new-legs
paths:
  - engine/db/machine.mjs
  - engine/db/machine-connection.mjs
  - knowledge/hfs/runtime-slots.yaml
  - tests/engine-db/machine-observer.spec.mjs
  - docs/ledger-db.md
  - modules/kernel/contract-changes/machine-ui-observer.yaml
