id: draw-rules-freeze
effectiveAt: '2026-09-28T01:05:00+07:00'
summary: "Owner ruling 2026-09-28 'Freeze the drawing rules: stop changing the draw gates while a workflow is running; batch the changes, apply them once, and owe a redraw only once' (2026-09-27: 8 reach follow-up changes on interface.draw, draws failed 18/37, attempts 9-11 per node). (1) Freeze: modules/kernel/contract-freeze.yaml lists frozen op families (interface.draw since 2026-09-27T00:00+07:00); a change governing one (ops or followUp op/ops) is batched (default batch = family, or its own `batch: <slug>`; never a safetyCritical one) and reaches a workflow created before it only at a release: api contract-release --family <op> writes one contract-release event per live workflow naming the changes it releases. Until then dispatch admits new legs there with them withheld (contracts.context_json.contract.withheld; api op-contract admission.withheld): their checks and codes are advisory (laterChangesFor/advisoryCodesFor/classifyChecks) and their settle gates off (admittedBeforeChange), and they owe no follow-up; api status lists frozenContractChanges. (2) Follow-up batching (contractFollowUpsOf): after a release a leg that does not carry the released set owes ONE follow-up (alsoCovers the rest); a queued redo of it, a redo admitted under the change, or a redo of the change's follow-up ops (the obligation moves to it) means nothing more is owed; a cancelled leg or redo covers nothing and never hides the leg before it. The release re-stamps queued legs of the family op (payload.contractRelease) and drops an older never-dispatched duplicate (same cut group and owned paths, nothing --after it; superseded-by-contract-release). (3) Gate stability: land.mjs reports (never refuses) gate-stability <family> when a land touches the family's gatePaths or adds/edits a change adding checks/codes for it: scripts/supervisor/gate-stability.mjs runs the family's gates as main and as the candidate have them over the latest accepted leg of every live workflow on the host registry, read-only, and counts flips. (4) Running legs whose op contract moved since dispatch are listed as status runningOpRevDrift and api nudge's wake carries the notice (judged by admission; later/withheld findings advisory). Adds no check or finding code"
reach: new-legs
paths:
  - modules/kernel/contract-freeze.yaml
  - modules/kernel/contract-changes.yaml
  - modules/kernel/api.yaml
  - modules/supervisor/supervise.yaml
  - scripts/kernel/contract-version.mjs
  - scripts/kernel/api.mjs
  - scripts/supervisor/land.mjs
  - scripts/supervisor/gate-stability.mjs
  - bin/starci.mjs
  - tests/contract-freeze.spec.mjs
