id: hfs-schema-owner-no-connection-alias
effectiveAt: '2026-09-30T20:00:00+07:00'
summary: >-
  C0 lead decision 2026-09-30 (one name, no alias): persistence/connection.ts no longer exports
  `CONNECTION = <CONN>_CONNECTION`. The R35 machine schema-owner derives a capability's connection structurally
  from where its `<c>Entities` / `<c>Migrations` are registered (the entities/migrations of a connection literal
  of DatabaseModule.register, of the migrate app and of the test worlds). The arrays are registered under exactly
  one connection across all apps, that connection is declared in hfs.json, persistence/connection.ts declares the
  two arrays, and every Inject<Conn>EntityManager used inside the capability is that same connection. BE_SCHEMA_OWNER
  keeps its code; its failure text and law change. BE-CONVENTION 1.4.6, the be.persistence slot comment, the R35 law,
  the README row, the persistence and naming patterns and docs/architecture-check.md follow.
reach: new-legs
paths:
  - scripts/checks/architecture/schema-owner.mjs
  - scripts/checks/architecture/connection-map.mjs
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/slots.yaml
  - knowledge/hfs/README.md
  - knowledge/patterns/be/persistence.yaml
  - knowledge/patterns/be/naming.yaml
  - modules/kernel/failure-codes.yaml
  - modules/kernel/contract-changes/hfs-schema-owner-no-connection-alias.yaml
  - modules/schemas/hfs-repo.schema.yaml
  - docs/architecture-check.md
