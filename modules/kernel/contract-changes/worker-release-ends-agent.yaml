id: worker-release-ends-agent
effectiveAt: '2026-10-02T15:00:00+07:00'
summary: >-
  worker-release ALONE ENDS A MANAGED WORKER'S AGENT (lane ORCA, alpha5 items 0.2 and 3.7; live smoke E1 on Orca 1.4.209: claude, codex
  and devin leave no agent process of the terminal 10 s after worker-release, and the tab leaves `terminal list`). Deleted with every
  reference and spec: scripts/kernel/reap-agent-process.mjs, `api reconcile --reap` (and the failure codes reap-not-settled and
  reap-no-terminal), allocation.reap.windowMs, quitWorkerTerminal, closeDeadWorkerTerminal and closeQuietTerminal, releaseWorkerOnReport,
  the settle and settler close of a command terminal (a job launched before the worker-start change is no longer live), and the quit
  input, tab close and process reaper inside releaseManagedWorker. releaseManagedWorker(payload) is now: worker-show, worker-stop only
  when the Dispatch did not settle itself, worker-release, one repeat when it is not ok. Custody is the release receipt's state; when the
  release is not ok the exact terminal is read back (disconnected or gone proves release). A dead worker's Dispatch is released once per
  attempt (event dead-worker-released). A dispatch killed mid-launch records its Dispatch id beside its terminal
  (payload.launchTerminal.dispatchId) and settle and reconcile --dead-worker release it. releaseSettled promotes only on a managed release
  proof. close-verify --tree stays for terminals not released through worker-release (Kernel self-close, GC sweep): E1 did not cover them.
  New failure code: managed-unproven.
paths:
  - scripts/kernel/cli.mjs
  - scripts/kernel/verbs/settle.mjs
  - scripts/kernel/settle/job-settle.mjs
  - modules/kernel/api-commands/reconcile.yaml
  - modules/kernel/failure-codes.yaml
