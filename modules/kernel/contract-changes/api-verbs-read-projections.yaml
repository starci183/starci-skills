id: api-verbs-read-projections
effectiveAt: '2026-09-28T00:00:00+07:00'
summary: >-
  File split only, no contract change: the read verbs `api artifacts`, `api logs`, `api coverage` and
  `api verify-proofs` moved out of scripts/kernel/api.mjs into scripts/kernel/api-verbs/<verb>.mjs (the
  file-based verb registry, scripts/kernel/api-extensions.mjs), and their contracts moved out of
  modules/kernel/api.yaml commands into modules/cli/commands/kernel/<verb>.yaml. Behaviour is identical:
  same args, reads, returns and refusals; extension verbs whose help line stays in api.mjs usage() set
  usageInCore so `api --help` is unchanged.
reach: new-legs
paths:
  - scripts/kernel/api.mjs
  - scripts/kernel/api-extensions.mjs
  - scripts/kernel/api-verbs/artifacts.mjs
  - scripts/kernel/api-verbs/logs.mjs
  - scripts/kernel/api-verbs/coverage.mjs
  - scripts/kernel/api-verbs/verify-proofs.mjs
  - modules/kernel/api.yaml
  - modules/cli/commands/kernel/artifacts.yaml
  - modules/cli/commands/kernel/logs.yaml
  - modules/cli/commands/kernel/coverage.yaml
  - modules/cli/commands/kernel/verify-proofs.yaml
  - modules/kernel/contract-changes/api-verbs-read-projections.yaml
