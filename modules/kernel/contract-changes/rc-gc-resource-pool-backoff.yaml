id: rc-gc-resource-pool-backoff
effectiveAt: '2026-09-28T21:00:00+07:00'
summary: >-
  Adaptive per-pool concurrency (AIMD) after provider rate limits (14 parallel Devin workers hit "Reached free model
  rate limit" and 5 op workers stalled). The Resource controller's new key resource:pools reads the Job controller's
  worker-health probe signals (reconciler.provider-rate-limited typed rows on the Supervisor ledger, and
  provider-rate-limited ledger events) and provider-health rows of failureKind rate-limited, halves the
  pool's effective parallelism (floor 2, once per 2 minutes), and after 15 quiet minutes raises it +1 per 5 minutes up
  to runtimes.yaml maxParallel. Active: it publishes poolBackoff (+ slotTargets.poolCaps) in ram-throttle.json; route
  (scripts/agent/models.mjs selectPool, live routes) rejects a pool at its backed-off cap so the next eligible pool
  takes the job, and api dispatch-ready routes before it dispatches. A publication older than 10 minutes is ignored.
  A pool held at its floor while still rate limited for 15 minutes opens its provider circuit through the new verb
  api provider-backoff (failureKind quota by default). Shadow until reconciler.controllers.resource.mode is active.
  Thresholds: modules/reconciler/resource.yaml backoff*.
reach: new-legs
paths:
  - modules/kernel/contract-changes/rc-gc-resource-pool-backoff.yaml
  - modules/kernel/api-commands/provider-backoff.yaml
  - modules/reconciler/resource.yaml
  - scripts/agent/models.mjs
  - scripts/kernel/api-verbs/provider-backoff.mjs
  - scripts/lib/pool-backoff.mjs
  - scripts/reconciler/controllers/resource.mjs
  - tests/reconciler-pool-backoff.spec.mjs
  - tests/reconciler-resource.spec.mjs
