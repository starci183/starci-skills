id: generated-runtime-copies-untracked
effectiveAt: '2026-10-02T19:00:00+07:00'
summary: >-
  The three published-package runtime copies (packages/{hfs,eslint/be,eslint/fe}/runtime, ~340 files) are git-ignored
  output of scripts/hfs/sync-runtime.mjs, no longer tracked: .gitignore excludes them, pack and the packages' own tests
  regenerate them (prepack and pretest run packages/hfs/prep-runtime.mjs), the runtime check and the canon-pins check
  sync before judging, the clean-package proof carries the freshly synced copies into its tracked-files-only checkout,
  and the land gate syncs each scratch before it checks it (the new 'sync-runtime.mjs' gate check). The new code
  GENERATED_UNTRACKED (R121) refuses a git-tracked path under a ruleParams.runtime.generated root, emitted in-process
  by the runtime check and by the new self-check generated-untracked
  (scripts/checks/check-generated-untracked.mjs); the runtime.package-runtime-copy slot's presence is now optional.
reach: new-legs
adds:
  checks:
    - sync-runtime.mjs
    - generated-untracked
  codes:
    - GENERATED_UNTRACKED
paths:
  - knowledge/hfs/rules.yaml
  - knowledge/hfs/runtime-slots.yaml
  - knowledge/hfs/README.md
  - modules/kernel/failure-codes.yaml
  - modules/kernel/contract-changes/generated-runtime-copies-untracked.yaml
