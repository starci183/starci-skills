id: peer-red-gate-attribution
effectiveAt: '2026-09-26T19:00:00+07:00'
summary: "Ops share one checkout, so a repo-wide gate reads every peer's change: nivo academy-debt's test:ci went red 812/813 on module-studio commit 9caa2d5c (inc-9474fe9ff445) and on module-studio's uncommitted spec (inc-36b309cb9138), and backend.implement spent attempts 9-12 on breakage it did not cause. A check entry (api check, op report) may name `failing` files; api check attributes each (scripts/kernel/gate-attribution.mjs): own under the job's owned paths or in a commit of its own workflow since its lineage began, peer when uncommitted under another job's path lease or in such a commit resolving to another workflow (introducer.mjs), else unknown. A red check with no own and one peer file is recorded peerBlocked {peers, routes}: counted neither passed nor failed (checkEvidence.peerBlocked), so it never blocks a pass or overrules a done report. A settle whose only red checks are peerBlocked records result.peerBlocked: no business retry (retryDisposition peer-blocked), no pool demotion (lineage-route cause peer-blocked), no OWED retry-loop/repeat-check step; its routes are the peer-wait --until-job / shared-blocker --introduced-by the Kernel runs. _common.yaml (d): a worker records such a gate with `failing` instead of a shared-change blocker. Adds no check or finding code; a leg admitted earlier reports as it was admitted"
reach: new-legs
paths:
  - scripts/kernel/gate-attribution.mjs
  - scripts/kernel/api.mjs
  - scripts/kernel/report-envelope.mjs
  - scripts/kernel/lineage-route.mjs
  - scripts/supervisor/owed.mjs
  - engine/admission.mjs
  - modules/kernel/api.yaml
  - modules/kernel/driver-loop.yaml
  - modules/kernel/verdict-contract.yaml
  - modules/ops/_common.yaml
  - tests/gate-attribution.spec.mjs
  - tests/supervisor-owed.spec.mjs
