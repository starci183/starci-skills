id: hfs-check-machine
effectiveAt: '2026-09-30T18:00:00+07:00'
summary: >-
  Lane C0 (BE-CONVENTION 3.1 principle 5, redundancy audit RED12 and RED14): `hfs check` now runs the whole architecture
  machine after its own slot, pin and size checks and reports the machine's violations and errors as findings under their
  own codes with the Vietnamese why (exit 1 on any). The package stays self-contained: packages/hfs/runtime carries a byte
  copy of the machine and every file it imports (computed from the import graph by sync-runtime.mjs, not listed by hand)
  plus the failure-code slice of every code the machine can emit (derived from the machine's exported rule id lists,
  ARCHITECTURE_RULE_IDS). One implementation: the CLI calls the bundled copy, the runtime calls
  scripts/checks/architecture.mjs. `hfs check --fast [--base <ref>]` (the pre-push hook) judges only the owners changed
  since the merge-base with origin/main (else main) with the machine minus clones and dead exports; no merge-base is a
  refusal (exit 2). R03 ships as an hfs enforcer: empty directories (HFS_EMPTY_DIR), ghost trees, an empty directory beside
  a sibling one typo away (HFS_GHOST_TREE), and untracked non-ignored entries outside an ignored slot
  (HFS_UNTRACKED_ROOT_ENTRY). scripts/checks/check-example-architecture.mjs runs the full `hfs check` on every
  examples/<name> with an hfs.json (not wired into `npm run check` yet). The machine's root-entry allowlist now accepts
  `.prettierignore`, which the slot manifest already requires.
reach: new-legs
adds:
  codes:
    - HFS_EMPTY_DIR
    - HFS_GHOST_TREE
    - ARCH_KNOWLEDGE_UNAVAILABLE
    - ARCH_TYPESCRIPT_INVALID
    - ARCH_TYPESCRIPT_MISSING
paths:
  - modules/kernel/contract-changes/hfs-check-machine.yaml
  - knowledge/hfs/rules.yaml
  - modules/kernel/failure-codes.yaml
  - scripts/lib/hfs-check.mjs
  - scripts/lib/hfs-tree.mjs
  - scripts/checks/architecture/index.mjs
  - scripts/checks/architecture/hfs.mjs
  - scripts/checks/check-example-architecture.mjs
  - packages/hfs/bin/hfs.mjs
  - packages/hfs/scripts/sync-runtime.mjs
  - packages/hfs/README.md
  - packages/hfs/CHANGELOG.md
