$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:integration:1
type: object
additionalProperties: false
description: "One external system the product talks to, written as a record rather than as a remark inside
  the requirement that mentions it. A declared `extensions.work3.integrations` edge owes exactly one of
  these, and the reason it is a family of its own is the proof rule it carries: this record reaches done
  only through a run against the real provider, whose evidence says `proof: {boundary: live, fakes: []}`.
  An integration whose only evidence names it among another run's fakes is proven against a stand-in, which
  is the one thing an external dependency cannot be proven against."
required:
  - provider
  - boundary
  - endpoints
properties:
  schema:
    const: work/integration@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^integration(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The integration's stable id, a lowercase dot-path under the integration family:
      integration.<feature>.<provider>; example integration.login.keycloak. It is the exact id a
      requirement's `extensions.work3.integrations` entry declares, so the declaration and the record it
      owes are matched by string equality rather than by a reader's judgement."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What the external system does for this product, in the product's terms. A reader learns
      from this line why the dependency exists before learning which vendor supplies it.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  provider:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The external system by name - keycloak, postgresql, redis. It is the vendor or product
      name rather than a role, because two features depending on "the database" and on "postgresql" are
      making different claims about what can be swapped.
  boundary:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What stays on each side of the line - what this product owns and what the provider owns.
      It is required because the failure mode of an external dependency is not usually an outage; it is
      each side assuming the other holds something, and this sentence is where that is settled.
  endpoints:
    type: array
    minItems: 1
    uniqueItems: true
    description: The reachable points this product actually uses, one entry each. At least one is required
      because an integration with no endpoint is a dependency nobody can probe, and the live proof this
      family demands has nothing to aim at.
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - method
        - path
      properties:
        name:
          $ref: "urn:work:common:1#/$defs/slug"
          description: A short name for the point, as this product refers to it - token, userinfo, primary.
        method:
          $ref: "urn:work:common:1#/$defs/prose"
          description: How the point is reached - an HTTP verb, or the protocol itself where there is no
            verb, as with a raw TCP connection.
        path:
          $ref: "urn:work:common:1#/$defs/prose"
          description: The address, exactly as the client uses it - a URL path, a connection string with no
            credential in it. It is the provider's address, never a secret, which is what `credential`
            below is for.
  credential:
    type: object
    additionalProperties: false
    required:
      - name
      - providedBy
      - custody
    description: "The credential this product authenticates with, named and never carried. It declares custody;
      a declaration without it is refused."
    properties:
      name:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
        description: The exact environment variable the client reads. The name only; a value never enters a
          record, a report, a log or a chat.
      providedBy:
        const: owner
        description: The owner supplies the value, never the agent and never the repository.
      custody:
        type: string
        pattern: "^identity:[a-z0-9]+([-_.][a-z0-9]+)*$"
        description: "identity:<slug> - the stable identity alias. Resolve its selected environment from the backend Stack declaration; encrypted custody is .starcistacks/<env>/secrets/<slug>.enc at the app root (app-relative), outside the Work tree."
  sandbox:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What can be run against without touching the provider's production - the dev instance, the
      vendor's test mode, the port it listens on. It is where the live proof this family demands is actually
      obtainable, which is the difference between a demand and an impossibility.
  module:
    oneOf:
      - $ref: "urn:work:common:1#/$defs/prose"
      - $ref: "urn:work:common:1#/$defs/proseList"
    description: The module-root directory or directories holding this product's client for the provider.
      It is a directory a reader would call the module's root, never an individual file, so a file moving
      inside it during a refactor is not by itself a broken reference.
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"