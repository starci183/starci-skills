$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:uat-flow:1
type: object
additionalProperties: false
description: "A walk somebody performs against the running product, written as steps a person can follow
  without being told how the product is built. It is the family that observes behaviour rather than
  asserting it, which is why its steps are phrased as actions and its accounts are a collocated fixture of
  disposable identities - a walk that needs a real person's credentials is a walk nobody will repeat. What
  it `proves` is the authored forward edge to the records it demonstrates, and it reaches done only once a
  settled run - cited from its sibling evidence.yaml as run {id, result, screens[], videos[]} by sha256, the
  files themselves blobs of the uat.verify attempt - holds at least one screenshot, at least one recording and
  a result reporting a pass."
required:
  - entry
  - actor
  - accounts
  - steps
properties:
  schema:
    const: work/uat-flow@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^uat(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The flow's stable id, a lowercase dot-path under the uat family: uat.<feature>.<name>;
      example uat.task.create. The prefix is enforced so a record citing uat.x is visibly citing an observed
      walk rather than a specification."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What the walk does, including the part that is meant to fail. A title that names only the
      happy path invites a walk that only ever takes it.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  entry:
    $ref: "urn:work:common:1#/$defs/prose"
    description: Where the walk starts, as the route a person would open. It is on the record rather than
      inside the first step because a walk that cannot say where it begins cannot be repeated by somebody
      who did not write it.
  actor:
    $ref: "urn:work:common:1#/$defs/slug"
    description: Who performs the walk, by the role the accounts fixture names. One flow has one starting
      actor; a step performed by somebody else names that person on the step itself.
  accounts:
    const: accounts.yaml
    description: The collocated disposable-accounts fixture this walk signs in with, by filename. It is a
      sibling file rather than inline values so that the identities live in one place with one schema that
      permits only sealed refs into _resources, and so the flow's steps stay readable.
  environment:
    $ref: "urn:work:common:1#/$defs/recordId"
    description: The environment this walk runs against, as an edge into the _resources family. It must
      resolve to a `work/resource@1` of kind environment, so a flow pointed at a fixture or an identity is a
      refusal rather than a run that fails confusingly.
  fixtures:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/recordId"
    description: The fixtures that must be seeded before the walk, each an edge to a `work/resource@1` of
      kind fixture. A fixture seeds prerequisites only, never the outcome under test.
  steps:
    type: array
    minItems: 1
    uniqueItems: true
    description: "The walk itself, in order, one action per item, written so somebody who has never seen the
      code can perform it. Steps that name a function, an endpoint or a database row are not a walk - they
      are the implementation checking itself, and they will pass on a product no person can use."
    items:
      type: object
      additionalProperties: false
      required:
        - order
        - actor
        - action
        - expected
      properties:
        order:
          type: integer
          minimum: 1
          description: Where this step sits in the walk. It is authored rather than taken from the array
            position so that a reordered list is a visible edit rather than a silent one.
        actor:
          $ref: "urn:work:common:1#/$defs/slug"
          description: Who performs this step, by the role the accounts fixture names. It is per step
            because a walk that proves a permission boundary has to change hands part way through.
        action:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What the person does, in their own terms.
        expected:
          $ref: "urn:work:common:1#/$defs/prose"
          description: The business outcome the person should see, stated so that a walk which produced
            something else is a failure rather than a matter of interpretation.
        checks:
          type: array
          uniqueItems: true
          description: The observed-feedback checks that apply to this step - whether a loading state
            showed, whether a refusal named its reason. They are separate from `expected` because the
            outcome is what happened and these are how the product behaved while it happened, and a product
            can be correct and unusable.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - expected
            properties:
              id:
                $ref: "urn:work:common:1#/$defs/checkId"
                description: Which feedback check this is, by the name the run manifest will report it
                  under, so the flow and the run line up by string equality.
              expected:
                enum:
                  - "yes"
                  - "no"
                description: Whether the check should hold at this step. A negative expectation is a real
                  check - proving a control stays absent is as much a proof as proving it appears - so it
                  is written rather than inferred.
  failurePaths:
    type: array
    minItems: 1
    uniqueItems: true
    description: "The refusal arms this walk is required to exercise, listed so that coverage of them is a
      count rather than a judgement. A flow whose steps only ever succeed demonstrates that the product
      works when nothing goes wrong, which is the half nobody needed demonstrating; naming the failure paths
      here is what lets a checker read whether the other half was walked."
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - expected
      properties:
        id:
          $ref: "urn:work:common:1#/$defs/slug"
          description: A short name for the refusal, used by the run to report whether it was reached.
        step:
          type: integer
          minimum: 1
          description: The `order` of the step this failure path branches from, where it belongs to one
            step rather than to the walk as a whole.
        expected:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What the person should see when the product refuses - which is a design statement,
            not an error message, and is why it is written before anybody walks it.
  recording:
    type: object
    additionalProperties: false
    minProperties: 1
    description: "What a run of this flow must capture beyond screenshots. A done flow's settled run needs
      at least one file under videos/, and this block is where the flow says what that recording has to
      show - which is the difference between a video that exists and a video of the walk."
    properties:
      required:
        const: true
        description: That a recording is demanded at all. It is only ever true, because the absence of the
          block already says nothing beyond screenshots is asked for.
      format:
        $ref: "urn:work:common:1#/$defs/slug"
        description: The container the run should produce, where the flow has a reason to pin one.
      covers:
        $ref: "urn:work:common:1#/$defs/prose"
        description: What the recording must actually show - the whole walk, or the one transition a
          sequence of stills cannot carry. A recording that stops before the step it was asked for is a
          file, not a proof.
  effects:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: What this walk changes in the system it runs against. It is written before the run so that
      a person can tell an observation that left nothing behind from one that has to be cleaned up, and so
      that an effect the environment does not permit is caught before it happens rather than after.
  cleanup:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: What the run must undo, one entry per effect it can leave. A walk that creates rows and
      does not say how to remove them is a walk that can only be performed once against any environment.
  proves:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/recordId"
    description: The records this walk demonstrates, by id. This is the authored forward edge; the record on
      the other end does not restate it in reverse, because one edge written twice is two facts that can
      disagree with nothing to settle which is right.
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  evidence:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder holding what the walk
      observed. It is optional because a flow can be written before it is ever walked, and at most one,
      because a flow has one current answer to what happened when somebody last performed it.
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"