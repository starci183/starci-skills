$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:uat-flow:1
type: object
additionalProperties: false
description: A walk somebody performs against the running product, written as steps a person can follow
  without being told how the product is built. It is the family that observes behaviour rather than asserting
  it, which is why its steps are phrased as actions and its accounts are a collocated disposable fixture - a
  walk that needs a real person's credentials is a walk nobody will repeat. What it `proves` is the authored
  forward edge to the records it demonstrates.
required:
  - schema
  - id
  - title
  - state
  - accounts
  - steps
  - proves
properties:
  schema:
    const: work/uat-flow
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  id:
    type: string
    pattern: ^uat(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The flow's stable id, a lowercase dot-path under the uat family: uat.<feature>.<name>;
      example uat.task.create. The prefix is enforced so a record citing uat.x is visibly citing an observed
      walk rather than a specification."
  title:
    $ref: "#/$defs/prose"
    description: What the walk does, including the part that is meant to fail. A title that names only the
      happy path invites a walk that only ever takes it.
  state:
    $ref: "#/$defs/state"
  accounts:
    const: accounts.yaml
    description: The collocated disposable-accounts fixture this walk signs in with, by filename. It is a
      sibling file rather than inline values so that the credentials live in one place with one schema that
      permits only synthetic disposable identities, and so the flow's steps stay readable.
  steps:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: The walk itself, in order, one action per item, written so somebody who has never seen the
      code can perform it. Steps that name a function, an endpoint or a database row are not a walk - they
      are the implementation checking itself, and they will pass on a product no person can use.
  proves:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/recordId"
    description: The records this walk demonstrates, by id. This is the authored forward edge; the record on
      the other end does not restate it in reverse, because one edge written twice is two facts that can
      disagree with nothing to settle which is right.
  evidence:
    $ref: "#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder holding what the walk
      observed. It is optional because a flow can be written before it is ever walked, and at most one,
      because a flow has one current answer to what happened when somebody last performed it.
  blockedBy:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: What is standing in the way, in sentences that name the record responsible. It is prose
      rather than lifecycle state because an impediment is a fact about the world, not a status.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that an id
      written twice by two authors is the same string.
  recordId:
    type: string
    pattern: ^(?:br|fr|nfr|data|decision|journey|sds|impl|ui|uat)(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The id of any record in the tree, family prefix included. Requiring a known prefix means a
      dangling reference is caught as a malformed id rather than surviving as a plausible-looking string.
  state:
    enum:
      - todo
      - done
    description: "Whether this leaf is outstanding or finished, and nothing else. There is deliberately no
      third authored value: `stale` is derived by the checker when an input a done record was proved against
      has moved, and authoring it would let a record claim a status the checker is supposed to compute -
      which is how a tree starts reporting its own opinion of its freshness instead of a measured one."
