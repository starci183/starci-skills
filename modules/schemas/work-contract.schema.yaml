$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:contract:1
type: object
additionalProperties: false
description: "One synchronous request/response surface between a provider feature and a consumer feature,
  owned by the feature that serves it. It exists because the seam between two features is where each side's
  own records stop being enough: the provider's rules describe what it guarantees and the consumer's
  describe what it needs, and neither file says what happens when the two disagree. This record does, and
  it demands proof from both halves, because a surface one side has exercised is a surface half tested."
required:
  - owner
  - between
  - surface
properties:
  schema:
    const: work/contract@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^contract(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The contract's stable id, a lowercase dot-path under the contract family:
      contract.<feature>.<name>; example contract.login.identity-for-task. The feature segment is the
      provider's, because a surface is owned by whoever serves it and not by whoever happens to call it."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What the two sides have agreed, written so a reader learns the seam's purpose without
      opening either side's records.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  owner:
    $ref: "urn:work:common:1#/$defs/featureId"
    description: The feature accountable for this surface - the provider. It is named separately from
      `between` so that the one answerable party is unambiguous when the surface has to change.
  between:
    type: object
    additionalProperties: false
    required:
      - provider
      - consumer
    description: The two features the surface joins. Both are required because a contract with one side is
      a description of an interface, and the entire point of the family is that somebody on the other end
      is relying on it.
    properties:
      provider:
        $ref: "urn:work:common:1#/$defs/featureId"
        description: The feature that serves the surface and owns what it guarantees.
      consumer:
        $ref: "urn:work:common:1#/$defs/featureId"
        description: The feature that calls it and owns the obligations below.
  surface:
    type: array
    minItems: 1
    uniqueItems: true
    description: The callable or subscribable points this contract covers, one entry each. At least one is
      required because a contract that names no surface has agreed on nothing a checker or a reader can
      find.
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - shape
        - guarantee
        - stability
      properties:
        name:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What the point is called - a route, a method, or the id of the `work/event@1` the
            surface carries. It is the string a reader greps for when they need the code behind it.
        shape:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What goes in and what comes back, concretely enough that the consumer can be written
            against this line rather than against the provider's source.
        transport:
          $ref: "urn:work:common:1#/$defs/prose"
          description: How the call actually travels - an in-process bus, HTTP, a queue. It is optional
            because some surfaces are defined by their shape alone, and stated when the transport is itself
            part of what the consumer must handle.
        guarantee:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What the provider promises about this point, in terms the consumer can rely on
            without reading the provider's implementation.
        stability:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What kind of change to this point breaks the consumer, named explicitly. It is the
            field that turns "we will try not to break it" into something the provider's own `change.kind`
            can be checked against.
  guarantees:
    type: array
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: What the provider promises across the surface as a whole, beyond any single point - that
      counts cover only the caller's own rows, that a token naming no live session is refused rather than
      resolved. It may be empty when every promise is already local to one surface entry.
  consumerObligations:
    type: array
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: What the consumer must do in return - how it treats a refusal, a timeout, an unreachable
      provider. They are written on the contract rather than in the consumer's own records because an
      obligation only one side knows about is an assumption, and this is the file both sides read.
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"