schema: starci/json-exceptions@1
description: >
  Exact relative paths (from this skill root) allowed to remain authored JSON
  while declarative sources are YAML. No wildcards. exceptions[] names one file
  each; directories[] names one exact directory whose direct *.json children are
  all admitted: an append-only record written one file per entry, or a package whose
  every direct JSON is toolchain config, or a test-world fake's recorded payloads in the
  third party's own JSON wire format (subdirectories are not admitted, and the
  directory must exist). Generated runtime mirrors (GENERATED_MIRROR_ROOTS in
  scripts/checks/check-json-exceptions.mjs) are not authored source and are not listed.
directories:
  - path: benchmark/snapshots
    reason: >
      Append-only model-pool snapshots written by scripts/agent/benchmark-snapshot.mjs, one
      <YYYY-MM-DD>-<N>h.json per date and window in the raw model-scorecard --json shape
      (benchmark/README.md). JSON by the scorecard contract; a new snapshot needs no new line here.
  - path: examples/ecommerce-app/be/contracts/billing
    reason: >
      The vendored async contract of the billing service (`starci/event-contract@1`), emitted by `hfs emit-contracts` from `apps/billing/src/events.ts`, never written by hand; JSON by the contract format (R151).
  - path: examples/ecommerce-app/be/contracts/order
    reason: >
      The vendored async contract of the order service (`starci/event-contract@1`), emitted by `hfs emit-contracts` from `apps/order/src/events.ts`, never written by hand; JSON by the contract format (R151).
  - path: examples/ecommerce-app/fe/packages/ecommerce-api
    reason: >
      npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
  - path: examples/ecommerce-app/fe/packages/ecommerce-i18n
    reason: >
      npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
  - path: examples/ecommerce-app/fe/packages/ecommerce-ui
    reason: >
      npm workspace package of the ecommerce-app front end: its package.json, tsconfig.json and tsconfig.build.json are toolchain config npm and tsc read as JSON.
  - path: packages/test-world
    reason: >
      The @starci/test-world package: its package.json, package-lock.json and tsconfig.json are toolchain config npm and tsc read as JSON.
  - path: packages/tsconfig
    reason: >
      The @starci/tsconfig package: its package.json and the shared presets (base, be, build, e2e, next) that product tsconfig files extend; tsc reads JSON, and a new preset needs no new line here.
exceptions:
