    reason: >
      Claude Code project settings for the runtime checkout (the PreToolUse seat-tools guard hook); Claude Code reads JSON.
  - path: engine/yaml-license.json
    reason: >
      License metadata for the bundled yaml runtime in engine/yaml.mjs;
      authored JSON kept source-side by upstream license form.
  - path: examples/ecommerce-app/.starcistacks/dev/environment.json
    reason: >
      starci/rendered-environment output for the ecommerce-app application stack (be side); JSON by the rendering contract.
  - path: examples/ecommerce-app/.starcistacks/dev/infra/compose/realm-ecommerce.json
    reason: >
      Keycloak realm import for the dev Compose stack of the ecommerce-app back end; the
      Keycloak container's realm-import feature requires a JSON realm file.
  - path: examples/ecommerce-app/.starcistacks/dev/infra/metadata.json
