# ============================================================================
# TINKLE-3 — schema relationship map
# ============================================================================
# Edges between schemas (who references/governs-whom) and between schemas and
# subsystems (which engine part a schema binds). Companion to index.yaml.
# Edge `type` vocabulary:
#   pairs-with    — two halves of one contract (tree vs content, request vs receipt)
#   delegates     — the file names another schema as the record kind for a slot
#   governs       — schema file -> the record/document instance it constrains
#   emits         — engine/check produces documents of this schema
#   consumes      — engine/check reads/validates documents of this schema
#   supersedes    — newer record generation beside a still-valid older one
#   mirrors       — documentation twin of an executable contract (drift = bug)
# Every edge cites the source the claim was read from.

schemaToSchema:

  # --- stacks: one contract, two halves -------------------------------------
  - {from: stacks-layout, to: application-stacks, type: pairs-with,
     note: "layout governs the .starcistacks TREE; application-stacks.schema governs the manifest CONTENT — 'the machine form of the layout's content half'",
     source: "schemas/stacks-layout.yaml purpose; schemas/application-stacks.schema.yaml description"}
  - {from: application-stacks, to: stacks-layout, type: consumes,
     note: "docs/application-stacks.md: checker reads layout's read-only structural findings plus manifest content; manifest fields are a strict subset of what the layout names",
     source: "docs/application-stacks.md"}

  # --- routing: routing declares which layout contract applies --------------
  - {from: workspace-routing, to: source-layout, type: delegates,
     note: "workspace-routing.yaml carries sourceLayoutContract: schemas/source-layout.yaml",
     source: "schemas/workspace-routing.yaml"}

  # --- work tree: layout delegates each family to its record schema ---------
  - {from: work-layout, to: work-business-rule, type: delegates, note: "shape.br -> schema work/business-rule", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-acceptance-criterion, type: delegates, note: "shape.ac -> work/acceptance-criterion, nested under its br", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-functional-requirement, type: delegates, note: "shape.fr", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-non-functional-requirement, type: delegates, note: "shape.nfr", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-data, type: delegates, note: "shape.data", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-customer-journey, type: delegates, note: "shape.journey", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-policy-decision, type: delegates, note: "shape.decision", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-sds-component, type: delegates, note: "shape.sds + owners module-root rule", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-ui-screen, type: delegates, note: "shape.ui + assets; feeds IMPL_BEFORE_DIRECTION", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-implementation, type: delegates, note: "shape.impl, impl/<repository>/<name>", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-uat-flow, type: delegates, note: "shape.uat", source: "schemas/work-layout.yaml"}
  - {from: work-layout, to: work-disposable-accounts, type: delegates, note: "accounts.yaml carries schema work/disposable-accounts (example tree convention)", source: "schemas/work-layout.yaml:244"}
  - {from: work-layout, to: "work/{contract,integration,gap,event}", type: delegates,
     note: "GAP: four families named in shape have NO per-family schema file — see index.yaml gaps[]",
     source: "schemas/work-layout.yaml:57-66"}

  # --- work tree: record-to-record edges ------------------------------------
  - {from: work-acceptance-criterion, to: work-business-rule, type: consumes,
     note: "ac nests under its rule and authors `rule:` (owning br id); has no identity apart from it",
     source: "schemas/work-layout.yaml shape.ac; work-acceptance-criterion.schema.yaml"}
  - {from: work-uat-flow, to: work-disposable-accounts, type: consumes,
     note: "uat-flow's accounts resolve to the collocated accounts.yaml fixture (const accounts.yaml in the flow schema)",
     source: "schemas/work-uat-flow.schema.yaml:36; check-work-artifacts.mjs:451"}
  - {from: work-catalog, to: work-feature, type: delegates,
     note: "catalog lists which features exist and where their records live; both are stateless parents",
     source: "work-catalog/work-feature schema descriptions; check-work-artifacts.mjs:503,521"}
  - {from: work-implementation, to: "work/{fr,nfr,sds,ui,business-rule,...}", type: consumes,
     note: "impl `proves` is the outbound edge to records it realises; proof-direction exempt from requiresProof",
     source: "work-implementation.schema.yaml; check-work-consistency.mjs comment"}
  - {from: work-uat-flow, to: "work/{fr,journey,...}", type: consumes,
     note: "uat `proves` — authored forward edge to demonstrated records",
     source: "work-uat-flow.schema.yaml"}
  - {from: work-evidence, to: "(any work record)", type: consumes,
     note: "evidence binds record+source version via recordDigest; expiry computed from it",
     source: "work-evidence.schema.yaml"}
  - {from: "work-*.schema.yaml (v2 family)", to: work.schema.yaml, type: supersedes,
     note: "v2 unversioned work/<kind> ids supersede the v1 @N kinds for the covered families; the monolith remains authority for work/node@2, work/resource@1, starci/source-identity@1, starci/design-review@1, starci/evidence-packet@1",
     source: "work.schema.yaml $defs consts vs work-*.schema.yaml consts (observed)"}

  # --- kernel/engine chain ---------------------------------------------------
  - {from: goal, to: goal-plan, type: delegates,
     note: "frozen goal is the input; assessGoal answers starci/goal-plan@1 (definitionOfDone+ledger+ops)",
     source: "schemas/goal-plan.yaml module: models/functions.mjs; docs/model-functions.md"}
  - {from: workflow-amendment, to: goal, type: consumes,
     note: "amendment binds baseGoalIdentity — supplements a frozen goal without rewriting its approval",
     source: "schemas/workflow-amendment.schema.yaml"}
  - {from: goal-plan, to: op-io, type: delegates,
     note: "each ops[] entry's kind dispatches an operation whose io form op-io defines",
     source: "schemas/goal-plan.yaml ops.kind; schemas/op-io.yaml"}
  - {from: op-io, to: op-report, type: delegates,
     note: "operation produces `outputs` inside starci/op-report@1",
     source: "schemas/op-io.yaml purpose"}
  - {from: op-report, to: workflow-report, type: delegates,
     note: "workflow-report.files = union of accepted op reports; same outcome/signal vocabulary",
     source: "schemas/workflow-report.schema.yaml"}
  - {from: orchestration-supervision, to: op-report, type: consumes,
     note: "monitor's idempotent processing of op deliveries (messageId/deliveryId, stale attempts fenced)",
     source: "schemas/orchestration-supervision.yaml messageIdentity"}
  - {from: execution-request, to: execution-receipt, type: pairs-with,
     note: "request in, receipt out; receipt operations must match request order one-to-one",
     source: "execution/api.mjs:68-73"}
  - {from: workflow-state, to: ledger-db, type: delegates,
     note: "engine.ledgerFile names the runtime.sqlite whose tables ledger-db catalogs",
     source: "schemas/workflow-state.schema.yaml description"}
  - {from: ledger-db, to: "kernel/ledger-db.mjs CREATE TABLEs", type: mirrors,
     note: "documentation twin of the executable contract — silent drift is a bug filed against whichever changed last",
     source: "schemas/ledger-db.schema.yaml description"}
  - {from: source-staleness, to: "work-layout + work-*", type: consumes,
     note: "the staleness scan walks canonical Work records the layout/family schemas govern (coverage.mode: canonical-work)",
     source: "kernel/source-staleness.mjs report shape"}

  # --- providers -------------------------------------------------------------
  - {from: orca-call, to: "providers/orca/calls.yaml", type: governs,
     note: "calls.yaml carries schema: starci/orca-calls@1; envelope must emit starci/orca-call-result@1",
     source: "providers/orca/calls.yaml; providers/validate.mjs:66-67"}
  - {from: profile-registry-v3, to: "model/registry.yaml", type: governs,
     note: "registry.yaml carries schema: starci/profile-registry@3",
     source: "model/registry.yaml:1"}

  # --- knowledge --------------------------------------------------------------
  - {from: code-example-catalog, to: code-example-manifest, type: delegates,
     note: "catalog lists examples; each example's detail is a code-example@1 manifest",
     source: "schema titles/required fields"}
  - {from: knowledge-source, to: knowledge-rule, type: delegates,
     note: "topics contain rule entries; both validated by compile-knowledge (legacy/builders/) in the retired projection pipeline",
     source: "scripts/compile-knowledge.mjs:39-42"}

  # --- code-pattern pipeline --------------------------------------------------
  - {from: code-pattern-check, to: code-pattern-profile, type: consumes,
     note: "aggregate report names its profile; statuses implemented|missing|conflict read against the profile's rule set",
     source: "scripts/checks/check-scoped-lint.mjs:12-13"}
  - {from: code-pattern-check, to: "starci/code-pattern-script@1 (no file)", type: consumes,
     note: "check-scoped-lint aggregates per-script results emitted as code-pattern-script@1 by scripts/checks/code-patterns/*.mjs — an unschematized sibling id",
     source: "scripts/checks/code-patterns/*.mjs result.schema; check-scoped-lint.mjs:176"}

# ----------------------------------------------------------------------------
# Schema -> subsystem binding: which engine part each schema constrains.
# Use this when asking "which schemas does subsystem X obey?".
# ----------------------------------------------------------------------------
schemaToSubsystem:

  work-tree:        # the .starciwork product record tree
    schemas: [work-layout, work.schema (v1), work-workspace, work-catalog, work-feature, work-brand,
              work-business-rule, work-acceptance-criterion, work-functional-requirement,
              work-non-functional-requirement, work-customer-journey, work-policy-decision,
              work-data, work-sds-component, work-ui-screen, work-implementation,
              work-uat-flow, work-disposable-accounts, work-evidence]
    note: "19 files — the largest subsystem. v2 per-record family (pending-build) + v1 monolith + layout."

  kernel:           # workflow kernel state and boundaries
    schemas: [workflow-state, workflow-report, workflow-amendment, orchestration-supervision,
              goal, goal-plan, ledger-db]
    note: "goal/goal-plan are lifecycle contracts the kernel binds; ledger-db documents the store workflow-state names."

  ops:              # operation contracts
    schemas: [op-io, op-report]
    note: "the normalized envelope every op shares; per-op authority stays in ops/*/operator.yaml."

  engine:           # sealed runtime admission (runtime 1.0 execution boundary)
    schemas: [execution-request, execution-receipt]
    note: "starci.workflow/v1 + starci.execution/v1 — consumed by execution/*.mjs, distinct from the kernel's workflow records."

  gate:             # executable checks / verification reports
    schemas: [source-staleness, code-pattern-profile, code-pattern-check, profiles]
    note: "report shapes + the per-kind proof ceiling; nonzero findings never authorize writes."

  routing:          # host/workspace/source resolution
    schemas: [workspace-routing, source-layout]
    note: "read before effects; failures are defects, never fixed by duplicating runtime/Work."

  stacks:           # .starcistacks deployment knowledge
    schemas: [stacks-layout, application-stacks]
    note: "tree half + content half of one stack contract."

  providers:        # host/provider call contracts
    schemas: [orca-call]
    note: "Orca only in v1; other providers' contracts live under providers/<name>/ with their own files."

  model:            # model/runtime registry
    schemas: [profile-registry-v3]
    note: "governs model/registry.yaml; analyzed in depth by modules/models/ (tinkle-2)."

  knowledge:        # compiled guidance + examples
    schemas: [knowledge-source, knowledge-rule, code-example-manifest, code-example-catalog]
    note: "validated by compile-knowledge.mjs (legacy/builders/) in the retired projection pipeline."

  build:            # build/migration helpers
    schemas: [json-exceptions]
    note: "source-only by design — the one file compile-declarative.mjs excludes."

# ----------------------------------------------------------------------------
# Reading order for an agent that must WRITE a governed document:
#   1. find the subsystem above -> 2. open the schema file named in index.yaml
#   -> 3. check distState (pending-build sources still bind — the yaml IS authority)
#   -> 4. never satisfy a schema by copying a generated artifact back as a source.
# ----------------------------------------------------------------------------
