# ============================================================================
# modules/schemas/ — schema relationship map
# ============================================================================
# Edges between schemas (who references/governs-whom) and between schemas and
# subsystems (which engine part a schema binds). Companion to index.yaml.
# Edge `type` vocabulary:
#   pairs-with    — two halves of one contract (tree vs content, request vs receipt)
#   delegates     — the file names another schema as the record kind for a slot
#   governs       — schema file -> the record/document instance it constrains
#   emits         — engine/check produces documents of this schema
#   consumes      — engine/check reads/validates documents of this schema
#   supersedes    — newer record generation beside a still-valid older one
#   mirrors       — documentation twin of an executable contract (drift = bug)
# Every edge cites the source the claim was read from.

schemaToSchema:

  # --- stacks: one contract, two halves -------------------------------------
  - {from: stacks-layout, to: application-stacks, type: pairs-with,
     note: "layout governs the .starcistacks TREE; application-stacks.schema governs the manifest CONTENT — 'the machine form of the layout's content half'",
     source: "modules/schemas/stacks-layout.yaml purpose; modules/schemas/application-stacks.schema.yaml description"}
  - {from: application-stacks, to: stacks-layout, type: consumes,
     note: "docs/application-stacks.md: checker reads layout's read-only structural findings plus manifest content; manifest fields are a strict subset of what the layout names",
     source: "docs/application-stacks.md"}

  # --- work tree: layout delegates each family to its record schema ---------
  - {from: work-layout, to: work-business-rule, type: delegates, note: "shape.br -> schema work/business-rule@1", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-acceptance-criterion, type: delegates, note: "shape.ac -> work/acceptance-criterion, nested under its br", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-functional-requirement, type: delegates, note: "shape.fr", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-non-functional-requirement, type: delegates, note: "shape.nfr", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-data, type: delegates, note: "shape.data", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-customer-journey, type: delegates, note: "shape.journey", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-policy-decision, type: delegates, note: "shape.decision", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-sds-component, type: delegates, note: "shape.sds + owners module-root rule", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-ui-screen, type: delegates, note: "shape.ui + assets; feeds IMPL_BEFORE_DIRECTION", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-implementation, type: delegates, note: "shape.impl, impl/<repository>/<name>", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-uat-flow, type: delegates, note: "shape.uat", source: "modules/schemas/work-layout.yaml"}
  - {from: work-layout, to: work-disposable-accounts, type: delegates, note: "accounts.yaml carries schema work/disposable-accounts@1 (example tree convention)", source: "modules/schemas/work-layout.yaml:244"}
  - {from: work-layout, to: "work/{contract,integration,gap,event}", type: delegates,
     note: "GAP: four families named in shape have NO per-family schema file — see index.yaml gaps[]",
     source: "modules/schemas/work-layout.yaml:57-66"}

  # --- work tree: record-to-record edges ------------------------------------
  - {from: work-acceptance-criterion, to: work-business-rule, type: consumes,
     note: "ac nests under its rule and authors `rule:` (owning br id); has no identity apart from it",
     source: "modules/schemas/work-layout.yaml shape.ac; work-acceptance-criterion.schema.yaml"}
  - {from: work-uat-flow, to: work-disposable-accounts, type: consumes,
     note: "uat-flow's accounts resolve to the collocated accounts.yaml fixture (const accounts.yaml in the flow schema)",
     source: "modules/schemas/work-uat-flow.schema.yaml:36; check-work-artifacts.mjs:451"}
  - {from: work-catalog, to: work-feature, type: delegates,
     note: "catalog lists which features exist and where their records live; both are stateless parents",
     source: "work-catalog/work-feature schema descriptions; check-work-artifacts.mjs:503,521"}
  - {from: work-implementation, to: "work/{fr,nfr,sds,ui,business-rule,...}", type: consumes,
     note: "impl `proves` is the outbound edge to records it realises; proof-direction exempt from requiresProof",
     source: "work-implementation.schema.yaml; check-work-consistency.mjs comment"}
  - {from: work-uat-flow, to: "work/{fr,journey,...}", type: consumes,
     note: "uat `proves` — authored forward edge to demonstrated records",
     source: "work-uat-flow.schema.yaml"}
  - {from: work-evidence, to: "(any work record)", type: consumes,
     note: "evidence binds record+source version via recordDigest; expiry computed from it",
     source: "work-evidence.schema.yaml"}
  - {from: "work-*.schema.yaml (per-record family)", to: work.schema.yaml, type: supersedes,
     note: "the per-family work/<kind>@1 ids supersede the monolith for the covered families; the monolith remains authority for work/node@1, work/resource@1, starci/source-identity@1, starci/design-review@1, starci/evidence-packet@1",
     source: "work.schema.yaml $defs consts vs work-*.schema.yaml consts"}

  # --- kernel chain (the goal is a sqlite row; the plan file is
  #     the only schema'd artifact) ------------------------------------------
  - {from: "goals.json.opChain (ledger row)", to: goal-plan, type: delegates,
     note: "the approved opChain legs are the shape api plan diffs the derived {legs:[{op,paths?,notes?}]} file against",
     source: "scripts/kernel/api.mjs cmdPlan; modules/schemas/goal-plan.yaml"}
  - {from: goal-plan, to: "modules/ops/ops/<op>.yaml", type: delegates,
     note: "each leg's `op` names a catalog op; enqueue refuses unknown-op",
     source: "modules/schemas/goal-plan.yaml rules; modules/kernel/api.yaml enqueue"}
  - {from: source-staleness, to: "work-layout + work-*", type: consumes,
     note: "the staleness scan walks canonical Work records the layout/family schemas govern (coverage.mode: canonical-work)",
     source: "scripts/checks/source-staleness.mjs report shape"}

  # --- spec subsystem --------------------------------------------------------
  - {from: specification-contract, to: srs-sections, type: delegates,
     note: "contract.schema.yaml semantics.layout: 'the typed split SRS contract in srs-sections.schema.yaml'",
     source: "modules/schemas/spec/contract.schema.yaml"}
  - {from: specification-contract, to: sds-map, type: delegates,
     note: "currentArchitectureMapContract names modules/schemas/spec/sds-map.schema.yaml",
     source: "modules/schemas/spec/contract.schema.yaml"}
  - {from: specification-contract, to: sds, type: delegates,
     note: "architecture.schema names modules/schemas/spec/sds.schema.yaml",
     source: "modules/schemas/spec/contract.schema.yaml"}
  - {from: specification-contract, to: srs, type: delegates,
     note: "compatibilityBusiness.schema names modules/schemas/spec/srs.schema.yaml — compat only",
     source: "modules/schemas/spec/contract.schema.yaml"}
  - {from: sds-map, to: srs-sections, type: consumes,
     note: "sds sections trace businessRefs back to the SRS items the split-SRS contract defines",
     source: "modules/schemas/spec/sds-map.schema.yaml businessRefs"}
  - {from: srs, to: srs-sections, type: supersedes,
     note: "split SRS sections supersede the compatibility record for new authoring",
     source: "modules/schemas/spec/contract.schema.yaml compatibilityBusiness.compatibility"}

  # --- providers -------------------------------------------------------------
  - {from: orca-call, to: "modules/host/orca/calls.yaml", type: governs,
     note: "calls.yaml carries schema: starci/orca-calls@1; envelope must emit starci/orca-call-result@1",
     source: "modules/host/orca/calls.yaml; scripts/checks/providers.mjs"}
  - {from: profile-registry, to: "modules/models/registry.yaml", type: governs,
     note: "registry.yaml carries schema: starci/profile-registry@1",
     source: "modules/models/registry.yaml:1"}

  # --- knowledge --------------------------------------------------------------
  - {from: code-example-catalog, to: code-example-manifest, type: delegates,
     note: "catalog lists examples; each example's detail is a code-example@1 manifest",
     source: "schema titles/required fields"}
  - {from: knowledge-source, to: knowledge-rule, type: delegates,
     note: "topics contain rule entries — contracts of the shipped knowledge/ tree",
     source: "modules/schemas/knowledge-source.schema.yaml; modules/schemas/knowledge-rule.schema.yaml"}

  # --- code-pattern pipeline --------------------------------------------------
  - {from: code-pattern-check, to: code-pattern-profile, type: consumes,
     note: "aggregate report names its profile; statuses implemented|missing|conflict read against the profile's rule set",
     source: "scripts/checks/check-scoped-lint.mjs:12-13"}
  - {from: code-pattern-check, to: "starci/code-pattern-script@1 (no file)", type: consumes,
     note: "check-scoped-lint aggregates per-script results emitted as code-pattern-script@1 by scripts/checks/code-patterns/*.mjs — an unschematized sibling id",
     source: "scripts/checks/code-patterns/*.mjs result.schema; check-scoped-lint.mjs:176"}

# ----------------------------------------------------------------------------
# Schema -> subsystem binding: which engine part each schema constrains.
# Use this when asking "which schemas does subsystem X obey?".
# ----------------------------------------------------------------------------
schemaToSubsystem:

  work-tree:        # the .starciwork product record tree
    schemas: [work-layout, work.schema (v1), work-workspace, work-catalog, work-feature, work-brand,
              work-business-rule, work-acceptance-criterion, work-functional-requirement,
              work-non-functional-requirement, work-customer-journey, work-policy-decision,
              work-data, work-sds-component, work-ui-screen, work-implementation,
              work-uat-flow, work-disposable-accounts, work-evidence]
    note: "19 files — the largest subsystem. per-record family + monolith + layout."

  kernel:           # workflow kernel boundaries
    schemas: [goal-plan]
    note: "the api plan-file contract is the only kernel record schema — the goal itself is a sqlite row + modules/goal/define-goal.yaml."

  spec:             # SRS/SDS payload contracts
    schemas: [specification-contract, sds, sds-map, srs-sections, srs]
    note: "modules/schemas/spec/*.schema.yaml — umbrella contract + split-section maps + two compat monoliths; executables live in scripts/checks/spec/."

  gate:             # executable checks / verification reports
    schemas: [source-staleness, code-pattern-profile, code-pattern-check, profiles]
    note: "report shapes + the per-kind proof ceiling; nonzero findings never authorize writes."

  routing:          # host/workspace/source resolution
    schemas: [workspace-routing]
    note: "the rules list in workspace-routing.yaml is the whole routing contract."

  stacks:           # .starcistacks deployment knowledge
    schemas: [stacks-layout, application-stacks]
    note: "tree half + content half of one stack contract."

  host:             # host call contracts
    schemas: [orca-call]
    note: "the contract document itself lives at modules/host/orca/calls.yaml and carries the schema const."

  model:            # model/runtime registry
    schemas: [profile-registry]
    note: "governs modules/models/registry.yaml; the model-side detail lives in modules/models/."

  knowledge:        # authored guidance + examples
    schemas: [knowledge-source, knowledge-rule, code-example-manifest, code-example-catalog]
    note: "read directly as authored sources — contracts of the shipped knowledge/ tree."

  build:            # build helpers
    schemas: [json-exceptions]
    note: "source-only by design — the one file no consumer projects."

# ----------------------------------------------------------------------------
# Reading order for an agent that must WRITE a governed document:
#   1. find the subsystem above -> 2. open the schema file named in index.yaml
#   -> 3. satisfy the authored YAML directly — there is no compiled projection
#   -> 4. never satisfy a schema by copying a generated artifact back as a source.
# ----------------------------------------------------------------------------
