$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:assisted-uat-request:1
type: object
additionalProperties: false
required: [schema, requestId, nodeId, preparedAt, bindings, build, environment, flows, humanGates, scripts, sessionManifest, redaction, cleanup, receipt, limits]
properties:
  schema: {const: starci/assisted-uat-request@1}
  requestId: {$ref: '#/$defs/id'}
  nodeId: {$ref: '#/$defs/id'}
  preparedAt: {$ref: '#/$defs/timestamp'}
  bindings: {$ref: '#/$defs/requestBindings'}
  build:
    type: object
    additionalProperties: false
    required: [repository, revision, servedIdentity]
    properties:
      repository: {$ref: '#/$defs/text'}
      revision: {$ref: '#/$defs/text'}
      servedIdentity: {$ref: '#/$defs/text'}
  environment:
    type: object
    additionalProperties: false
    required: [resourceId, revision, origins]
    properties:
      resourceId: {$ref: '#/$defs/id'}
      revision: {$ref: '#/$defs/text'}
      origins:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, format: uri}
  flows:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, entry, actor, steps]
      properties:
        id: {$ref: '#/$defs/id'}
        entry: {$ref: '#/$defs/text'}
        actor: {$ref: '#/$defs/text'}
        steps:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, action, expected, postconditions, evidence]
            properties:
              id: {$ref: '#/$defs/id'}
              action: {$ref: '#/$defs/text'}
              expected: {$ref: '#/$defs/text'}
              postconditions:
                type: array
                items: {$ref: '#/$defs/text'}
              evidence:
                type: array
                items: {$ref: '#/$defs/text'}
  humanGates:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, flowId, afterStepId, class, reason, prompt, responseSchema, evidenceRequired]
      properties:
        id: {$ref: '#/$defs/id'}
        flowId: {$ref: '#/$defs/id'}
        afterStepId: {$ref: '#/$defs/id'}
        class:
          enum: [secret-entry, anti-automation-challenge, cross-device-action, subjective-observation, reserved-manual-action]
        reason: {$ref: '#/$defs/text'}
        prompt: {$ref: '#/$defs/text'}
        responseSchema:
          type: object
          additionalProperties: true
        evidenceRequired:
          type: array
          items: {$ref: '#/$defs/text'}
  scripts:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [flowId, path, sha256, command, cwd]
      properties:
        flowId: {$ref: '#/$defs/id'}
        path: {$ref: '#/$defs/relativePath'}
        sha256: {$ref: '#/$defs/digest'}
        command: {$ref: '#/$defs/command'}
        cwd: {$ref: '#/$defs/text'}
  sessionManifest:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {$ref: '#/$defs/relativePath'}
  redaction:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path: {$ref: '#/$defs/relativePath'}
      sha256: {$ref: '#/$defs/digest'}
  cleanup:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path: {$ref: '#/$defs/relativePath'}
      sha256: {$ref: '#/$defs/digest'}
  receipt:
    type: object
    additionalProperties: false
    required: [schema, pathTemplate, immutable]
    properties:
      schema: {const: starci/assisted-uat-receipt@1}
      pathTemplate: {$ref: '#/$defs/templatePath'}
      immutable: {const: true}
  limits:
    type: object
    additionalProperties: false
    required: [timeoutMs, retries]
    properties:
      timeoutMs: {type: integer, minimum: 1000, maximum: 86400000}
      retries: {type: integer, minimum: 0, maximum: 20}
      spend: {type: number, minimum: 0}
$defs:
  text: {type: string, minLength: 1}
  id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
  digest: {type: string, pattern: '^[a-f0-9]{64}$'}
  timestamp: {type: string, format: date-time}
  relativePath:
    type: string
    minLength: 1
    pattern: '^(?![A-Za-z]:)(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*\\).+$'
  templatePath:
    type: string
    minLength: 1
    pattern: '^(?![A-Za-z]:)(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*\\).*\{runId\}.*$'
  command:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  requestBindings:
    type: object
    additionalProperties: false
    required: [inputDigest, buildDigest, environmentDigest, flowsDigest]
    properties:
      inputDigest: {$ref: '#/$defs/digest'}
      buildDigest: {$ref: '#/$defs/digest'}
      environmentDigest: {$ref: '#/$defs/digest'}
      flowsDigest: {$ref: '#/$defs/digest'}
