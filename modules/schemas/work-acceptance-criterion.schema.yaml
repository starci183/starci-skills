$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:acceptance-criterion:1
type: object
additionalProperties: false
description: One checkable consequence of a business rule, written as given/when/then. It is the unit of
  proof, not a unit of work, and that is why it carries no state - nobody schedules a criterion, implements
  it or finishes it; the rule is the work and the criterion is how anyone can tell whether the rule holds. A
  `state` key here is refused on purpose, because a criterion that could be marked done would let a tree
  report proof it never observed, and because it would then be counted twice - once as work under its rule
  and once on its own.
required:
  - schema
  - id
  - rule
  - given
  - when
  - then
properties:
  schema:
    const: work/acceptance-criterion
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  id:
    type: string
    pattern: ^ac(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){3,}$
    description: "The criterion's stable id, a lowercase dot-path under the ac family: its rule's id with br
      replaced by ac, plus the criterion's own name; example ac.task.title.required.refuses-empty. The
      prefix is enforced so an evidence assertion naming ac.x is unambiguously naming a criterion, and the
      shared tail is what lets a reader see at a glance which rule a criterion belongs to."
  rule:
    type: string
    pattern: ^br(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The business rule this criterion proves, by id. It is stated explicitly rather than derived
      from the id or the directory so that the edge survives a move, and so a criterion can never be an
      orphan that proves nothing.
  given:
    $ref: "#/$defs/prose"
    description: The situation that holds before anything happens, in the product's own terms rather than
      the implementation's. It is what somebody must set up before they can observe this criterion at all.
  when:
    $ref: "#/$defs/prose"
    description: The one thing that happens. A criterion with two triggers is two criteria, and separating
      them is what makes a failure point at a single cause.
  then:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: What must be observably true afterwards, one item per observation. Each item is written so
      that a person or a check can look and say yes or no; an outcome nobody can look at is not a criterion,
      it is a hope.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
