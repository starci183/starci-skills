schema: starci/schema@1
id: starci/ci-standard@1
title: The StarCi CI standard
description: >-
  The one CI standard of every StarCi workflow (owner ruling ci-standard, 2026-10-18): the jobs of the managed app CI per edition, the heavy steps that need
  a raised Node heap, and the standard's items, each with what it requires, the workflows it covers (app-ci, runtime) and what enforces it: R301 CI_STANDARD
  for the items marked `check: ci-standard`, the rules or renders named in `by` for the others.
type: object
additionalProperties: false
required: [schema, id, title, jobs, defaults, heap, items]
properties:
  schema:
    const: starci/ci-standard@1
  id:
    const: ci-standard
  title:
    type: string
    minLength: 1
  jobs:
    type: object
    additionalProperties: false
    required: [full, lite]
    properties:
      full: {$ref: '#/$defs/jobShape'}
      lite: {$ref: '#/$defs/jobShape'}
  defaults:
    type: object
    additionalProperties: false
    required: [shards, timeoutMinutes]
    properties:
      shards: {type: integer, minimum: 1, maximum: 20}
      timeoutMinutes:
        type: object
        additionalProperties: false
        required: [fast, lint, test, coverage, build, sonar, db-types]
        properties:
          fast: {$ref: '#/$defs/minutes'}
          lint: {$ref: '#/$defs/minutes'}
          test: {$ref: '#/$defs/minutes'}
          coverage: {$ref: '#/$defs/minutes'}
          build: {$ref: '#/$defs/minutes'}
          sonar: {$ref: '#/$defs/minutes'}
          db-types: {$ref: '#/$defs/minutes'}
  heap:
    type: object
    additionalProperties: false
    required: [minMiB, steps]
    properties:
      minMiB: {type: integer, minimum: 1024}
      steps: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  items:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/item'}
$defs:
  minutes: {type: integer, minimum: 5, maximum: 360}
  jobId:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  jobShape:
    type: object
    additionalProperties: false
    required: [required, optional]
    properties:
      required: {type: array, minItems: 1, items: {$ref: '#/$defs/jobId'}}
      optional: {type: array, items: {$ref: '#/$defs/jobId'}}
  item:
    type: object
    additionalProperties: false
    required: [id, title, requires, covers]
    properties:
      id: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
      title: {type: string, minLength: 1}
      requires: {type: string, minLength: 1}
      covers: {type: array, minItems: 1, items: {enum: [app-ci, runtime]}}
      check: {const: ci-standard}
      by: {type: array, minItems: 1, items: {type: string, minLength: 1}}
