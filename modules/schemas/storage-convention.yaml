# storage-convention.yaml — the one convention for what a database row holds (owner ruling 2026-10-09: "assets live in .runtime, the DB holds the ref").
# Content lives as a file in the content-addressed blob store under the runtime state dir (<runtime root>/.runtime/artifacts, engine/db/blob.mjs); a row holds only
# the reference (the sha) plus the small scalars it is queried by. Every text column of both stores (the product ledger runtime.sqlite, machine.sqlite) is declared here
# with the class that bounds what it may hold; the storage-convention check (scripts/checks/check-storage-convention.mjs) refuses a column that is not declared.
schema: starci/storage-convention@1
classes:
  scalar: "an id, a state, a timestamp, a count, a short code or one line of reason: at most scalarBytes"
  bounded: "free text that is queried or shown whole and stays small: at most inlineBytes; anything longer is content"
  reference: "holds the sha (or the uri) of a blob, never the content"
  spill: "a payload that may be any size: the writer is appendEvent / supEvent, which keeps a bounded inline view and the whole payload behind the sha (engine/db/event-compact.mjs)"
  migrate: "holds content inline today (measured above inlineBytes): the target is a reference column; the migration is proposed, not run (a runtime migration verb, idempotent and journalled)"
scalarBytes: 256
inlineBytes: 1024
spillInlineBytes: 16384
# What is ALWAYS content (a blob, whatever its size): a report, a critique or verdict, a prompt or dispatch contract, a read manifest, a list of files, a log or command
# output, a menu or digest snapshot, an image or render, a diff. What may stay inline: ids, states, timestamps, counts, short codes, and one-line reasons up to scalarBytes.
alwaysBlob: [report, critique, verdict, prompt, contract, read-manifest, file-list, log, command-output, menu-snapshot, digest-snapshot, image, render, diff]
# The columns that hold content inline today, with the largest value seen in the read-only copies of the live stores (2026-10-09): the proposed migration targets.
