$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/model-tiers.schema.json
title: StarCi model tiers
type: object
required: [schema, tiers, tierOrder, seats, kindSeats, callerSeatTiers, difficulty, kindTiers, tierUse, calls, balance, usage]
additionalProperties: false
properties:
  schema: {const: starci/model-tiers@1}
  purpose: {type: string}
  tiers:
    type: object
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/chain"}
  tierOrder: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  seats: {type: object, additionalProperties: {type: string, minLength: 1}}
  kindSeats: {type: object, additionalProperties: {type: string, minLength: 1}}
  callerSeatTiers: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  difficulty:
    type: object
    required: [easy, medium, hard, insane]
    additionalProperties: false
    properties:
      easy: {type: string, minLength: 1}
      medium: {type: string, minLength: 1}
      hard: {type: string, minLength: 1}
      insane: {type: string, minLength: 1}
  kindTiers: {type: object, additionalProperties: {type: string, minLength: 1}}
  tierUse: {type: object, additionalProperties: {enum: [seat, call]}}
  calls:
    type: object
    additionalProperties:
      type: object
      required: [tier, timeoutMs, maxImages, maxReferences]
      additionalProperties: false
      properties:
        tier: {type: string, minLength: 1}
        timeoutMs: {type: integer, minimum: 1000}
        maxImages: {type: integer, minimum: 1}
        maxReferences: {type: integer, minimum: 0}
  balance:
    type: object
    required: [maxStreak, maxSharePercent]
    additionalProperties: false
    properties:
      maxStreak: {type: integer, minimum: 1}
      maxSharePercent: {type: number, exclusiveMinimum: 0, maximum: 100}
  usage:
    type: object
    required: [reservePercent, biasPercent, exhaustedPercent]
    additionalProperties: false
    properties:
      reservePercent: {type: number, minimum: 0, maximum: 100}
      biasPercent: {type: number, minimum: 0, maximum: 100}
      exhaustedPercent: {type: number, minimum: 0, maximum: 100}
$defs:
  chain:
    type: array
    minItems: 1
    items:
      type: object
      required: [agent, model]
      additionalProperties: false
      properties:
        agent: {type: string, minLength: 1}
        model: {type: string, minLength: 1}
        effort: {type: string, minLength: 1}
