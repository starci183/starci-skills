$schema: https://json-schema.org/draft/2020-12/schema
$id: https://starci.dev/schemas/source-staleness.schema.json
title: StarCi deterministic source staleness report
type: object
additionalProperties: false
required: [schema, workRoot, targets, baselineDigest, clean, coverage, limitations, impactGraph, currentInputs, subjects, findings, reportDigest]
properties:
  schema: {const: starci/source-staleness-report@1}
  workRoot: {type: string, minLength: 1}
  targets: {type: array, uniqueItems: true, items: {$ref: '#/$defs/id'}}
  baselineDigest: {$ref: '#/$defs/digest'}
  clean: {type: boolean}
  coverage:
    type: object
    additionalProperties: false
    required: [mode, closure, selectedNodeIds, sourceBindings]
    properties:
      mode: {const: canonical-work}
      closure: {type: string, minLength: 1}
      selectedNodeIds: {type: array, uniqueItems: true, items: {$ref: '#/$defs/id'}}
      sourceBindings:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [nodeId, type, repository, coverage, paths]
          properties:
            nodeId: {$ref: '#/$defs/id'}
            type: {enum: [source-identity, code-refs, source-ref]}
            repository: {anyOf: [{$ref: '#/$defs/id'}, {type: 'null'}]}
            coverage: {enum: [full-tree, scoped, exact-path, unknown]}
            paths: {type: array, uniqueItems: true, items: {type: string}}
  limitations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  impactGraph:
    type: object
    additionalProperties: false
    required: [edges, impactSets]
    properties:
      edges:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [from, to, relation]
          properties:
            from: {$ref: '#/$defs/id'}
            to: {$ref: '#/$defs/id'}
            relation: {enum: [dependsOn, refs, child-input, ancestor-context, semantic-input, brand-context]}
      impactSets:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, rootNodeId, affectedNodeIds]
          properties:
            id: {$ref: '#/$defs/id'}
            rootNodeId: {$ref: '#/$defs/id'}
            affectedNodeIds: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/id'}}
  currentInputs:
    type: object
    additionalProperties: false
    required: [work, repositories]
    properties:
      work:
        type: object
        additionalProperties: false
        required: [ok, selectedNodes, snapshotDigest]
        properties:
          ok: {type: boolean}
          selectedNodes: {type: integer, minimum: 0}
          snapshotDigest: {$ref: '#/$defs/digest'}
      repositories:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, root, head, dirty, originDigest, credentialFreeOrigin, snapshotDigest]
          properties:
            id: {$ref: '#/$defs/id'}
            root: {type: string, minLength: 1}
            head: {type: string, pattern: '^[a-f0-9]{40}(?:[a-f0-9]{24})?$'}
            dirty: {type: boolean}
            originDigest: {anyOf: [{$ref: '#/$defs/digest'}, {type: 'null'}]}
            credentialFreeOrigin: {type: boolean}
            snapshotDigest: {$ref: '#/$defs/digest'}
  subjects:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, path, kind, inputDigest, effectiveState, status, findingIds]
      properties:
        id: {$ref: '#/$defs/id'}
        path: {type: string, minLength: 1}
        kind: {type: string, minLength: 1}
        inputDigest: {$ref: '#/$defs/digest'}
        effectiveState: {type: string, minLength: 1}
        status: {$ref: '#/$defs/status'}
        findingIds: {type: array, uniqueItems: true, items: {$ref: '#/$defs/id'}}
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, bindingId, nodeId, category, status, layer, code, detail, expected, observed, route, operator, impactSetId, repairCandidate]
      properties:
        id: {$ref: '#/$defs/id'}
        bindingId: {type: string, minLength: 1}
        nodeId: {anyOf: [{$ref: '#/$defs/id'}, {type: 'null'}]}
        category: {enum: [source-drift, evidence-invalid, input-unavailable, contract-drift, stack-drift]}
        status: {$ref: '#/$defs/status'}
        layer: {enum: [source, work, stack]}
        code: {type: string, minLength: 1}
        detail: {type: string, minLength: 1}
        expected: {}
        observed: {}
        route: {enum: [business.decide, architecture.decide, backend.implement, interface.implement, runtime.operate, review.verify]}
        operator: {enum: [business.decide, architecture.decide, backend.implement, interface.implement, runtime.operate, review.verify]}
        impactSetId: {anyOf: [{$ref: '#/$defs/id'}, {type: 'null'}]}
        repairCandidate:
          anyOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [paths, authorized]
              properties:
                paths: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
                authorized: {const: false}
  reportDigest: {$ref: '#/$defs/digest'}
$defs:
  id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
  digest: {type: string, pattern: '^[a-f0-9]{64}$'}
  status: {enum: [verified-conforming, revalidation-needed, known-drift, missing, unverifiable]}
