$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:business-rule:1
type: object
additionalProperties: false
description: "One rule the product promises to keep, and the criteria that decide whether it is kept. The
  statements are the promise and the criteria are how anybody checks it; a rule with statements and no
  criterion is an intention. Since v11 the criteria are carried inline on this record rather than as
  separate ac/ files: a criterion has no identity apart from the rule it accepts, so it keeps its own id and
  shares the rule's lifecycle, and a criterion that genuinely needs its own state or its own evidence is a
  sign the rule is really two rules."
required:
  - statements
properties:
  schema:
    const: work/business-rule@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^br(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The rule's stable id, a lowercase dot-path under the br family: br.<feature>.<name>;
      example br.task.title.required. The prefix is enforced so a reference to br.x is unambiguously a rule
      rather than a requirement that happens to read like one."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: The rule in one sentence, written as what the product promises rather than as what it
      forbids where both are available - a reader should learn the rule from this line without the
      statements.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  statements:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: What the rule actually promises, one clause each, each true or false about a running
      product. They are split rather than written as a paragraph because a revision withdraws clauses, and a
      clause that cannot be named cannot be withdrawn.
  acceptance:
    type: array
    minItems: 1
    uniqueItems: true
    description: "The criteria that decide whether the statements hold, carried inline since the v11
      collapse. Each keeps the id its former ac/ record had, so a reference to the old id still resolves and
      the canonical form is `<this record's id>#<criterion id>`. A criterion here carries no state, change,
      evidence or provenBy of its own: it shares the rule's, and one that needs its own belongs in a rule of
      its own."
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - given
        - when
        - then
      properties:
        id:
          type: string
          pattern: ^ac(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){3,}$
          description: The criterion's own id, which must be `ac.` plus this rule's id without its family
            segment plus the criterion's name - the same place-law the file under ac/ lived under. The gate
            refuses an id its place does not imply, and refuses one a second rule also claims.
        given:
          $ref: "urn:work:common:1#/$defs/prose"
          description: The situation the criterion starts from.
        when:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What happens to it.
        then:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "urn:work:common:1#/$defs/prose"
          description: What must be observable afterwards, one observation each, concrete enough that two
            people checking it would agree. A `then` that restates the `when` is a criterion that checks
            nothing.
  authorityRefs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/prose"
    description: Where the rule's authority comes from - an owner's ruling, a regulation, a decision record
      - quoted so that a later reader can tell a rule somebody decided from a rule somebody assumed.
  module:
    oneOf:
      - $ref: "urn:work:common:1#/$defs/prose"
      - $ref: "urn:work:common:1#/$defs/proseList"
    description: "The module-root directory or directories that enforce this rule. It is a plain string for
      the ordinary one-module case and a list where the rule genuinely spans more than one path; either way
      each entry is the directory a reader would call the module's root, never an individual file, so a file
      moving inside it during a refactor is not by itself a broken reference. Every entry is app-relative
      (be/<path>, fe/<path>; OWNER_PATH_NOT_APP_RELATIVE otherwise)."
  appliesTo:
    $ref: "urn:work:common:1#/$defs/appliesTo"
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  evidence:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder that carries what was
      observed of this rule directly. At most one, because a rule has one current answer to what was last
      observed of it.
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"