schema: starci/schema@1
describes: starci/goal-plan@1
module: scripts/kernel/api.mjs
purpose: |-
  The plan file the kernel agent hands to `node scripts/kernel/api.mjs plan --workflow <id> --file
  <plan.json>`: the derived op chain for the goal, expressed as an ordered list of legs. The api
  persists only the plan's digest and its STRUCTURAL diff against the approved opChain stored in
  goals.json.opChain.legs - the file stays the artifact, the ledger stores what it proves, never a
  copy (modules/kernel/api.yaml commands.plan).
shape:
  file: 'one JSON document, UTF-8; parse must yield a plain object with a `legs` array'
  legs: |-
    ordered list of plan legs, earliest first. Each leg is an object:
      {op: <opId>, paths?: [<repo-relative path prefix>...], params?: {<name>: <value>}, notes?: <string>}
  legs[].op: 'non-empty string naming a catalog op - modules/ops/ops/<op>.yaml must exist (enqueue refuses unknown-op)'
  legs[].params: 'optional map of the op tunables the OWNER chose - each name is declared in that op brief params block (modules/schemas/op.schema.yaml) with setBy owner; api enqueue validates type, min, max and enum and refuses params-invalid, then the dispatch packet carries the brief defaults with these on top'
  legs[].paths: 'optional list of repository-relative path prefixes the leg owns - the write ceiling enqueued onto the job row as owned_paths and the set dispatch disjointness is checked against'
  legs[].notes: 'optional free text - why the leg exists, what it must not touch, sequencing intent'
rules:
  - legs is required and must be an array; every leg carries a non-empty string `op` - anything else is plan-file-invalid.
  - Leg order is execution intent: the api diffs it structurally against goals.json.opChain.legs - legs added, removed or re-ordered vs the approved chain mark the plan divergent, and a divergent plan escalates (api incident --kind plan-divergence), never dispatches.
  - An oversized approved leg is not duplicated in this semantic plan. The Kernel partitions its concrete closure into same-op execution jobs using api enqueue cut metadata; see modules/kernel/driver-loop.yaml enqueue.cutExecution.
  - "Independent legs (no dependency between them) must declare disjoint `paths` prefixes: the kernel runs several ops at once on one worktree, so an overlap is a re-plan, not a risk note (modules/goal/legality.yaml splitRules; api dispatch refuses path-collision)."
  - A leg with no `paths` is an unbounded grant: enqueue refuses empty-paths, so a leg meant to run must name its ceiling.
  - "A tunable an owner chose is a value on the leg, never a sentence in the goal text: `params` carries it, `api enqueue --params` relays it and the packet delivers it, so no agent has to read prose to decide how many candidates, rounds or options the owner wanted."
  - "A leg may carry only params the op declares with `setBy: owner`; a `setBy: kernel` param on a leg is params-invalid."
  - Op ids come only from the operator catalog; there is no dependsOn field - ordering is the legs array itself plus the approved opChain it is diffed against.
validation: |-
  api.mjs cmdPlan reads the file as JSON and requires plan.legs to be an array whose every element
  has a non-empty string `op` ({legs:[{op,paths?,notes?}]}). Failure is a typed refusal:
  plan-file-missing when the file does not exist, plan-file-invalid when it does not parse or the
  legs shape is wrong. On success the api writes goals.json.derivedPlan {legs, divergence,
  derivedAt} and appends one 'plan-derived' event carrying the legs and the divergence record
  {missing, extra, reordered, diverged}.
