$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:hfs-slots:1
title: HFS slot manifest
description: >-
  The shape of knowledge/hfs/slots.yaml. Semantic rules JSON Schema cannot state (unique ids, every tier named by a
  slot or mayImport exists in the profile, a retired slot has a successor, an app-kind slot names a declared kind)
  are checked by scripts/lib/hfs-slots.mjs loadSlotManifest.
type: object
additionalProperties: false
required: [schema, version, versioning, presenceValues, trackedValues, testValues, appKinds, tiers, ruleParams, slots]
properties:
  schema: {const: starci/hfs-slots@1}
  version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: MAJOR.MINOR.PATCH. The major must equal the number after @ in `schema`; a repository pins only the major.
  versioning:
    type: object
    additionalProperties: false
    required: [patch, minor, major, retire, pins]
    properties:
      patch: {type: string}
      minor: {type: string}
      major: {type: string}
      retire: {type: string}
      pins: {type: string}
  presenceValues: {const: [required, optional, opt-in, forbidden]}
  trackedValues: {const: [tracked, ignored, external]}
  testValues: {const: [unit-beside, e2e, none]}
  appKinds:
    type: object
    additionalProperties: false
    required: [be, fe]
    properties:
      be: {$ref: '#/$defs/nameList'}
      fe: {$ref: '#/$defs/nameList'}
  tiers:
    type: object
    additionalProperties: false
    required: [be, fe]
    properties:
      be: {$ref: '#/$defs/tierMap'}
      fe: {$ref: '#/$defs/tierMap'}
  ruleParams:
    type: object
    additionalProperties: false
    required: [be, fe]
    properties:
      be:
        type: object
        additionalProperties: false
        required: [fileLines, duplicateBlock, infraOwners, suffixes, bannedSuffixes]
        properties:
          fileLines: {$ref: '#/$defs/fileLines'}
          duplicateBlock: {$ref: '#/$defs/duplicateBlock'}
          infraOwners:
            type: object
            minProperties: 1
            description: R90 BE_INFRA_OWNER. Raw library specifier or global reference -> the capabilities allowed to use it; [] means nowhere.
            additionalProperties:
              type: array
              uniqueItems: true
              items: {type: string, pattern: '^(platform|integrations)/[a-z][a-z0-9-]*$'}
          suffixes: {$ref: '#/$defs/roleSuffixes'}
          bannedSuffixes: {$ref: '#/$defs/roleSuffixes'}
      fe:
        type: object
        additionalProperties: false
        required: [fileLines, duplicateBlock]
        properties:
          fileLines: {$ref: '#/$defs/fileLines'}
          duplicateBlock: {$ref: '#/$defs/duplicateBlock'}
  crossOwner: {type: string}
  crossApp: {type: string}
  slots:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/slot'}
  consumers:
    type: array
    items: {type: string}
$defs:
  fileLines:
    type: object
    additionalProperties: false
    required: [soft, hardGrowth]
    properties:
      soft: {type: integer, minimum: 1}
      hardGrowth: {type: boolean}
  duplicateBlock:
    type: object
    additionalProperties: false
    required: [lines, tokens]
    description: The one threshold of R21 duplicate code; checks and messages render it from here.
    properties:
      lines: {type: integer, minimum: 2}
      tokens: {type: integer, minimum: 1}
  roleSuffixes:
    type: array
    minItems: 1
    uniqueItems: true
    description: R89 BE_SOURCE_FORM. The closed role-suffix vocabulary of a source file name (suffixes) or the suffixes that are never a role (bannedSuffixes); the two lists are disjoint.
    items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  nameList:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  tierMap:
    type: object
    minProperties: 1
    propertyNames: {pattern: '^[a-z][a-z0-9-]*$'}
    additionalProperties:
      type: object
      additionalProperties: false
      required: [mayImport]
      properties:
        mayImport:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        acyclic: {type: boolean}
        lowerLayerOnly: {type: boolean}
  semver: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
  major: {type: integer, minimum: 2}
  stringList:
    type: array
    items: {type: string, minLength: 1}
  slot:
    type: object
    additionalProperties: false
    required: [id, profiles, path, presence, tracked, tier, tests]
    properties:
      id: {type: string, pattern: '^(repo|be|fe)\.[a-z0-9-]+(\.[a-z0-9-]+)*$'}
      profiles:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [be, fe]}
      path: {type: string, minLength: 1}
      presence: {enum: [required, optional, opt-in, forbidden]}
      tracked: {enum: [tracked, ignored, external]}
      tier: {type: string, pattern: '^[a-z][a-z0-9-]*$', description: 'a tier of the matrix, none, or inherit (the tier of the enclosing owner)'}
      tests: {enum: [unit-beside, e2e, none]}
      owner: {type: boolean}
      appKind: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      minInstances: {type: integer, minimum: 1}
      requiredWhen: {const: connections}
      requiredInstances:
        type: object
        additionalProperties: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      requires: {$ref: '#/$defs/stringList'}
      allows: {$ref: '#/$defs/stringList'}
      forbids: {$ref: '#/$defs/stringList'}
      layers: {$ref: '#/$defs/stringList'}
      kinds:
        allOf: [{$ref: '#/$defs/stringList'}]
        description: folder kinds a rule asks about that are not import layers (feature pages/layouts/overlays; the layer folders of a ui package); classification reports the one a file sits in
      roles:
        type: object
        minProperties: 1
        propertyNames: {pattern: '^[a-z][a-z0-9-]*$'}
        additionalProperties: {type: string, minLength: 1, pattern: '^[^/]+$'}
        description: role name -> file name inside the slot (a <var> is filled from the path); classification reports the role of a file whose name is one of them
      composedBy:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        description: the app kinds that may compose this slot (a transport folder); an app of another kind never imports its module
      budget:
        type: object
        minProperties: 1
        additionalProperties: {type: integer, minimum: 1}
      managedBy: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      rules:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[A-Z][A-Z0-9_]*\*?$'}
      goesTo: {type: string, minLength: 1}
      why: {type: string, minLength: 1}
      since: {$ref: '#/$defs/semver'}
      retiredIn: {$ref: '#/$defs/major'}
      successor: {type: string}
    allOf:
      - if: {properties: {tracked: {const: external}}, required: [tracked]}
        then: {required: [goesTo], properties: {presence: {const: forbidden}}}
      - if: {properties: {presence: {const: forbidden}}, required: [presence]}
        then: {properties: {tracked: {const: external}}}
      - if: {required: [retiredIn]}
        then: {required: [successor]}
