schema: starci/schema@1
id: starci/protected-installations@1
title: Protected host installations
description: >-
  Container-name markers and host ports owned by installations outside this runtime. Docker and Supabase actions may
  observe them but never start, stop, remove, build over or bind them.
type: object
additionalProperties: false
required: [schema, containerMarkers, ports]
properties:
  schema: {const: starci/protected-installations@1}
  containerMarkers:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  ports:
    type: object
    additionalProperties: false
    required: [list, ranges]
    properties:
      list:
        type: array
        uniqueItems: true
        items: {type: integer, minimum: 1, maximum: 65535}
      ranges:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [first, last]
          properties:
            first: {type: integer, minimum: 1, maximum: 65535}
            last: {type: integer, minimum: 1, maximum: 65535}
