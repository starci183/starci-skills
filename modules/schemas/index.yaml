# ============================================================================
# modules/schemas/ — the schema catalog (catalog + analysis, no schema bodies)
# ============================================================================
# This file is the index of the authored schema tree: every schema in live
# use lives under `modules/schemas/`, and the five
# specification schema bodies live under `modules/schemas/spec/` with
# normalized `*.schema.yaml` names.
#
# The authored YAML under modules/schemas/ is the authority: every consumer
# reads these files directly. The same holds for knowledge/**/*.yaml, so the
# per-entry usedBy lines below name their real reader and nothing else.

about:
  kind: schema-catalog
  authoredTree: modules/schemas/    # YAML sources; the only place to read or edit a schema
  dialects:
    json-schema: "draft 2020-12 with $schema/$id/$defs — machine-checkable shape (ajv-style consumers)"
    prose-contract: "schema:/purpose:/fields:/rules: YAML — a contract an agent reads and honours; no validator executes it"
  identityRule: >-
    A governed record names its schema in its own `schema:` field (e.g. schema: work/business-rule@1,
    schema: starci/orca-calls@1). The catalog `id` below is that const — the value a record would carry —
    not the file name.

schemas:

  # --------------------------------------------------------------------------
  # WORK TREE — .starciwork record kinds (the product's canonical Work)
  # --------------------------------------------------------------------------

  - id: starci/work-layout@1
    file: modules/schemas/work-layout.yaml
    dialect: prose-contract
    subsystem: work-tree
    governs: >-
      The SHAPE of the whole .starciwork tree: which folders exist, what they are named,
      which of the 15 families a record belongs to, and which record schema each family
      carries (shape: maps family -> `schema work/<kind>`). The tree, not the record bodies.
    binds: .starciwork/** (workspace.yaml, index.yaml, features/<feature>/<family>/<name>/index.yaml)
    usedBy:
      - scripts/checks/check-example-work.mjs (reads shape.families; FAMILIES_DRIFT if gate and schema disagree)
      - scripts/checks/check-work-consistency.mjs, scripts/example/work-example.mjs
    business:
      question: "Is this .starciwork tree laid out the way every checker, gate and agent assumes?"
      whenNeeded: Before any gate that walks Work records, and whenever a workflow creates a new node/family folder.
      whenNot: Never for record field content — that is the work-*.schema.yaml family's job. The layout knows a br lives at features/<f>/br/<n>/index.yaml; it does not know what a br contains.
      selectedBy: Not selected per-workflow — it is the standing spatial contract every Work operation assumes.
    note: "self-defending: check-example-work reads families FROM this file, so the doc and the gate cannot drift silently (see its own familiesNote)."

  - id: urn:work:metadata:1
    file: modules/schemas/work.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: >-
      Work metadata monolith: the versioned record kinds work/workspace@1, work/node@1,
      work/resource@1, work/evidence@1, work/disposable-accounts@1 plus starci/source-identity@1
      and starci/design-review@1.
    binds: versioned .starciwork records carrying @-suffixed schema ids
    usedBy:
      - engine/index.mjs (metadataSchema — reads modules/schemas/work.schema.yaml)
      - modules/models/kinds.yaml (its knowledge-schema list names the monolith kinds verbatim)
      - scripts/example/work-example.mjs (projected for readers)
    business:
      question: "Is a versioned Work record still structurally valid?"
      whenNeeded: Reading trees that carry @-suffixed record kinds, and the auxiliary kinds (source-identity, design-review, evidence-packet) that the per-family files do not re-issue.
      whenNot: Not for the per-family records — each family's own work-<kind>.schema.yaml is the authority for its kind. Authoring a NEW record under a monolith-only kind is the misuse mode.
      selectedBy: Record's own `schema:` const — the monolith covers node/workspace/resource plus the auxiliary kinds; family records resolve to work-<kind>.schema.yaml.
    note: "the monolith and the per-family schemas coexist by design; check each family's own file first."

  # --- Work per-record schemas ----------------------------------------------

  - id: work/workspace@1
    file: modules/schemas/work-workspace.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "The tree's own identity record — which project and which repositories this .starciwork serves."
    binds: .starciwork/workspace.yaml
    usedBy: [scripts/checks/check-work-artifacts.mjs (record walk), scripts/checks/check-work-consistency.mjs]
    business:
      question: "Which project does this Work tree belong to, and which repos serve it?"
      whenNeeded: Once per workspace — project identity lives here so no .starciwork/<project>/ wrapper directory exists.
      whenNot: Never per feature; features do not get their own workspace record.
      selectedBy: prepare-work / storage binding; read by anything resolving 'which product am I in'.

  - id: work/catalog@1
    file: modules/schemas/work-catalog.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "The product catalog — the one place that says which features exist and where their records live."
    binds: .starciwork/index.yaml
    usedBy: [scripts/checks/check-work-artifacts.mjs (parent records may not author state)]
    business:
      question: "What features does this product have?"
      whenNeeded: Reading or adding a feature; it is the tree's directory.
      whenNot: Never carries `state` — a parent whose progress is computed from leaves; authoring done here is refused.
      selectedBy: Any agent entering a Work tree reads this first.

  - id: work/feature@1
    file: modules/schemas/work-feature.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "A feature's own record — names the feature; every rule/requirement/screen/impl/flow lives under its directory."
    binds: .starciwork/features/<feature>/index.yaml
    usedBy: [scripts/checks/check-work-artifacts.mjs]
    business:
      question: "What is this feature about, and where does its work hang?"
      whenNeeded: Creating a feature; locating a feature's records.
      whenNot: A feature is not a unit of work — `state` is refused on purpose; progress derives from leaves.
      selectedBy: feature-scoped workflows; work-catalog entries point here.

  - id: work/brand@1
    file: modules/schemas/work-brand.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "The product's brand as ONE root record beside features/ — identity inputs every feature shares."
    binds: .starciwork/brand/index.yaml (+ brand/assets/**)
    usedBy: ["scripts/example/example-render-proof.mjs (the record's own brand: spec is what render checks read)"]
    business:
      question: "What does the product look and sound like, once, for everyone?"
      whenNeeded: UI design and render-proof lanes read it as shared context.
      whenNot: Never duplicated per feature; not a state-carrying leaf.
      selectedBy: Implicit — source-staleness calls it 'implicit brand context' input.

  - id: work/business-rule@1
    file: modules/schemas/work-business-rule.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One business rule — true whatever screen or endpoint it surfaces on; owns appliesTo/module/blockedBy."
    binds: .starciwork/features/<feature>/br/<name>/index.yaml
    usedBy:
      - scripts/checks/check-work-consistency.mjs (reads its $defs.state enum to refuse invented states; additionalProperties:false, NO requiresProof)
    business:
      question: "What must be true of the product regardless of where it is implemented?"
      whenNeeded: SRS/business definition; the rule is the unit of work its acceptance criteria prove.
      whenNot: Not for checkable consequences (those are ac children) nor for implementation claims (impl).
      selectedBy: define-business workflows authoring SRS-side truth.

  - id: work/acceptance-criterion@1
    file: modules/schemas/work-acceptance-criterion.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One checkable consequence of a business rule, given/when/then — the unit of proof, not of work."
    binds: .starciwork/features/<feature>/br/<rule>/ac/<name>/index.yaml (nested under its rule)
    usedBy: [scripts/checks/check-work-consistency.mjs (rule lists criterion id tails)]
    business:
      question: "How would anyone tell whether this rule holds?"
      whenNeeded: Whenever a business rule needs observable proof.
      whenNot: Never carries `state` (refused by design) — a criterion that could be 'done' would let a tree report unobserved proof.
      selectedBy: With its parent br — has no identity apart from the rule it accepts.

  - id: work/functional-requirement@1
    file: modules/schemas/work-functional-requirement.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One thing a person can do with the product end to end; authors requiresProof."
    binds: .starciwork/features/<feature>/fr/<name>/index.yaml
    usedBy: [scripts/checks/check-work-consistency.mjs (PROOF_DEMAND_SCHEMAS member — done requires declared proof)]
    business:
      question: "What can a user actually do, and what would prove it works?"
      whenNeeded: Capability-level SRS decomposition before implementation.
      whenNot: Owns no rule (rules are br) and no design (sds); an fr without requiresProof cannot go done.
      selectedBy: define-business; consumed downstream by impl proves-edges and uat.

  - id: work/non-functional-requirement@1
    file: modules/schemas/work-non-functional-requirement.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "A quality the product must hold — speed, safety, availability — expressed so it can be checked; requiresProof."
    binds: .starciwork/features/<feature>/nfr/<name>/index.yaml
    usedBy: [scripts/checks/check-work-consistency.mjs (PROOF_DEMAND_SCHEMAS)]
    business:
      question: "What quality bar does this capability sit under, and who checked it?"
      whenNeeded: NFRs attached to features; a done nfr needs observed proof like an fr.
      whenNot: Not a place for functional steps or screens.
      selectedBy: define-business / architecture quality lanes.

  - id: work/customer-journey@1
    file: modules/schemas/work-customer-journey.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "What a person does in order across however many features it takes — steps phrased as the person's actions and expectations; requiresProof."
    binds: .starciwork/features/<feature>/journey/<name>/index.yaml
    usedBy: [scripts/checks/check-work-consistency.mjs (PROOF_DEMAND_SCHEMAS)]
    business:
      question: "Is the product usable end to end, not just feature-correct?"
      whenNeeded: Cross-feature flows (e.g. landing->shop sign-in); one accountable feature owns even shared journeys.
      whenNot: Steps never describe what the SYSTEM does — that is uat/sds vocabulary.
      selectedBy: Business analysis; verified by uat flows that walk it.

  - id: work/policy-decision@1
    file: modules/schemas/work-policy-decision.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "An unanswered product question written down as a record (tension.records names the disagreeing sides)."
    binds: .starciwork/features/<feature>/decision/<name>/index.yaml
    usedBy: [scripts/checks/check-work-consistency.mjs (two done records may not leave the tension open)]
    business:
      question: "Where does the unresolved business question live so it cannot be silently dropped?"
      whenNeeded: When business alternatives conflict and the owner must decide — the record IS the open question.
      whenNot: Not a defect tracker; not for settled decisions.
      selectedBy: Any lane that hits an unresolved business choice; resolved by owner answer, not by code.

  - id: work/data@1
    file: modules/schemas/work-data.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One thing the product stores, in product terms: field list PLUS invariants true of every instance forever."
    binds: .starciwork/features/<feature>/data/<name>/index.yaml
    usedBy: [scripts/checks/check-work-consistency.mjs]
    business:
      question: "What does the product remember, and what promises does that memory keep?"
      whenNeeded: Business/data modeling; invariants are what rules depend on and refactors break.
      whenNot: Not a DDL doc — fields describe shape, invariants describe promises; do not author DDL here.
      selectedBy: define-business; consumed by sds/impl that realise the storage.

  - id: work/sds-component@1
    file: modules/schemas/work-sds-component.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One piece of intended technical design — responsibilities and allowed dependencies; a done one must name owners [{role,path}] whose paths are module-root directories that exist; requiresProof."
    binds: .starciwork/features/<feature>/sds/<name>/index.yaml
    usedBy:
      - scripts/checks/check-work-consistency.mjs (PROOF_DEMAND_SCHEMAS; owners/module-root rule)
      - work-layout shape note (todo without owners = warn, done without owners = refuse)
    business:
      question: "What is the intended design, component by component, and which real module owns each piece?"
      whenNeeded: design-architecture / SDS lanes; the read-scope boundary a design describes is a module boundary.
      whenNot: Not for prose architecture essays — a done component must trace to module roots on disk.
      selectedBy: Architecture workflows; implementation sidearms (architecture.decide) revise it.

  - id: work/ui-screen@1
    file: modules/schemas/work-ui-screen.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "One screen and EVERY state it can be in — the state list is the point; a screen specified only happy-path gets built only happy-path."
    binds: .starciwork/features/<feature>/ui/<name>/index.yaml + <name>/assets/** (design PNGs)
    usedBy: [work-layout rule IMPL_BEFORE_DIRECTION — done impl proving FE work is refused while relevant ui-screen is not done]
    business:
      question: "What does the user see, in every state, before anyone builds it?"
      whenNeeded: design-interface / draw lanes; direction precedes implementation by lane order.
      whenNot: Not for interaction flows (journey/uat) — this is per-screen states.
      selectedBy: UI design ops; implementation reads it as binding direction.

  - id: work/implementation@1
    file: modules/schemas/work-implementation.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "A module of real code where it actually lives, the records it `proves`, a pinned revision, and verificationSource (kernel-observed vs hand-written)."
    binds: .starciwork/features/<feature>/impl/<repository>/<name>/index.yaml
    usedBy: [scripts/checks/check-work-artifacts.mjs, check-work-consistency.mjs (proves-edge records exempt from requiresProof — proof is outbound)]
    business:
      question: "Which real code claims to realise which records — and was that verification observed or asserted?"
      whenNeeded: implement-backend/frontend lanes; the only family reaching out of the tree into a repo, so it pins a commit.
      whenNot: Never without the repository + revision; a claim about source without its commit is a claim about nothing.
      selectedBy: Implementation ops; FE-vs-BE split by the record's own `repository` value.

  - id: work/uat-flow@1
    file: modules/schemas/work-uat-flow.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "A walk performed against the RUNNING product — steps a person can follow; `proves` is the authored forward edge to demonstrated records."
    binds: .starciwork/features/<feature>/uat/<name>/index.yaml (+ runs/, captures)
    usedBy: [scripts/checks/check-work-artifacts.mjs (accounts cross-check vs work/disposable-accounts@1)]
    business:
      question: "What observable walk proves the product behaves — against a live system, not a unit test?"
      whenNeeded: verify-flows / browser UAT; observes behaviour rather than asserting it.
      whenNot: Never unit/component verification (that is review-code/impl checks); never needs real credentials (see disposable-accounts).
      selectedBy: verify-flows job and UAT fixtures.

  - id: work/disposable-accounts@1
    file: modules/schemas/work-disposable-accounts.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "Synthetic sign-in identities collocated with the uat-flow that uses them — a record whose whole purpose is a prohibition."
    binds: .starciwork/features/<feature>/uat/<flow>/accounts.yaml
    usedBy: [scripts/checks/check-work-artifacts.mjs (uat-flow.accounts must resolve to this fixture)]
    business:
      question: "Which throwaway identities may a UAT walk sign in with?"
      whenNeeded: Any UAT flow needing auth — a walk needing a real person's credentials is a walk nobody repeats.
      whenNot: NEVER a real credential — the file is tracked, readable, and outlives its walk; no id and no state (fixture, not work).
      selectedBy: uat-flow record's accounts field; written by whoever authors the flow.

  - id: work/evidence@1
    file: modules/schemas/work-evidence.schema.yaml
    dialect: json-schema
    subsystem: work-tree
    governs: "What was observed, when, by whom, against which record/source version — carries recordDigest so expiry is computed not noticed; stale-marked, never rewritten or deleted."
    binds: .starciwork/**/evidence.yaml (and evidence/<id>/ bundles per modules/kernel/verdict-contract.yaml)
    usedBy: [scripts/kernel/api.mjs (settle persists verdict evidence paths), scripts/example/example-evidence.mjs]
    business:
      question: "What proof exists for this record's claim, and is it still about the current version?"
      whenNeeded: Every accepted leaf — done is only as good as its evidence manifest.
      whenNot: Never edited after publish (bytes under a published manifest are frozen); corrected proof gets a NEW evidence id.
      selectedBy: Verification lanes publish; completion review reads.

  # --------------------------------------------------------------------------
  # KERNEL — the plan-file contract
  # --------------------------------------------------------------------------

  - id: starci/goal-plan@1
    file: modules/schemas/goal-plan.yaml
    dialect: prose-contract
    subsystem: kernel
    governs: "The api `plan --file` document: {legs:[{op, paths?, notes?}]} — the kernel's derived op chain diffed structurally against the approved goals.json.opChain.legs."
    binds: "the --file JSON a kernel agent hands to `api plan`"
    usedBy: [scripts/kernel/api.mjs (cmdPlan legs check + plan-derived event), modules/kernel/api.yaml commands.plan]
    business:
      question: "Is the derived plan still the approved op chain — or did it diverge?"
      whenNeeded: Every tick.plan — the api persists digest + structural diff and a divergent plan escalates, never dispatches.
      whenNot: Not the goal record itself — the goal lives in the goals table; this is only the derived-plan file contract.
      selectedBy: The kernel agent's plan step — driver-loop.yaml tick.plan.

  - id: starci/op@1
    file: modules/schemas/op.schema.yaml
    dialect: json-schema
    subsystem: kernel
    governs: "The shape of every operator manifest under modules/ops/ops/: typed `params` for tunables, `reads`/`writes` as data, one rule per `steps[].action`, `proofs` as what settle verifies, and one `policy` map for op-specific policy."
    binds: modules/ops/ops/*.yaml
    usedBy:
      - scripts/checks/check-op-manifest.mjs (validates the shape plus PARAM_RESTATED, RULE_DUPLICATED, RULE_IN_DATA, PATH_JOINED, CHECK_MISSING)
      - scripts/route/build-ops-registry.mjs (indexes id/goal/params/route into modules/ops/registry.yaml)
      - scripts/kernel/api.mjs (enqueue validates --params against the op's params block; dispatch merges defaults into the packet)
    business:
      question: "What is an operation, exactly — and where does each of its rules and numbers live?"
      whenNeeded: Every op manifest edit; the check refuses a stray key, a restated number or a rule written twice.
      whenNot: Not the op's return envelope — that is starci/op-report@1 in modules/kernel/verdict-contract.yaml.
      selectedBy: "The manifest's own `schema: starci/op@1` stamp."

  - id: starci/asset-manifest@1
    file: modules/schemas/asset-manifest.schema.yaml
    dialect: json-schema
    subsystem: kernel
    governs: "interface.implement's asset inventory for one delivered interface scope: one entry per asset the accepted direction asked for, reused, produced or deferred, with the brief a deferred entry owes."
    binds: E/assets.json under an impl node's evidence bundle
    usedBy:
      - modules/ops/ops/interface.implement.yaml (the assetManifest write names this const; its asset-coverage proof is measured against this shape)
      - modules/ops/ops/interface.asset.yaml (reads the deferred briefs it has to satisfy)
    business:
      question: "Which assets does this interface owe, and which of them exist?"
      whenNeeded: Every interface.implement that consumes an accepted direction with artwork slots.
      whenNot: Not the bytes themselves — the images live under the node's assets, and this file indexes them.
      selectedBy: "The file's own `schema: starci/asset-manifest@1` stamp."

  - id: starci/realization-check@1
    file: modules/schemas/realization-check.schema.yaml
    dialect: json-schema
    subsystem: kernel
    governs: "How each region of an accepted direction was realized — raster-asset or code-native — and the evidence for the choice."
    binds: E/realization-check.json under an impl node's evidence bundle
    usedBy:
      - modules/ops/ops/interface.implement.yaml (the realizationCheck write names this const)
      - modules/ops/ops/interface.audit.yaml (reads it as the realization map a hard realization.mode finding is measured against)
    business:
      question: "Was each region built the way the accepted direction said it would be?"
      whenNeeded: Every interface.implement delivering a draw-backed surface, and every audit of one.
      whenNot: Not a verdict — the audit decides; this file is what it reads.
      selectedBy: "The file's own `schema: starci/realization-check@1` stamp."

  - id: starci/agent-hierarchy@1
    file: modules/schemas/agent-hierarchy.yaml
    dialect: prose-contract
    subsystem: kernel
    governs: "The durable Workflow -> Kernel -> Op ownership tree, including stable node ids, semantic edges and distinct agent/provider/model/profile/runtimePool plus Orca Run/Task/Dispatch/terminal runtime references."
    binds: "the read-only document emitted by `node scripts/kernel/api.mjs hierarchy --workflow <id>`"
    usedBy:
      - scripts/kernel/api.mjs (cmdHierarchy projection)
      - modules/kernel/api.yaml (commands.hierarchy)
      - Orca UI integrations that render workflow agent ownership
    business:
      question: "Which long-lived Kernel owns this workflow, and which operation agents did that Kernel dispatch?"
      whenNeeded: Inspecting, rendering or auditing a workflow's agent tree independently of Orca tab/pane layout.
      whenNot: Never infer ownership from paneKey, parentPaneKey, terminal titles or tab order; those are presentation/runtime hints only.
      selectedBy: Workflow id; the command reads persisted workflow/job hierarchy metadata and derives missing provider metadata from the selected profile.

  - id: starci/source-staleness-report@1
    file: modules/schemas/source-staleness.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "The deterministic staleness report — workRoot, targets, baselineDigest, clean, coverage{mode:canonical-work,closure,selectedNodeIds,sourceBindings}, limitations, impactGraph, currentInputs{work,repositories[head/dirty/originDigest/snapshotDigest]}, subjects, findings, reportDigest."
    binds: stdout/report of `starci check-stales`
    usedBy: [scripts/checks/check-stales.mjs (emits the report; exit 0 clean / 1 findings / 2,3 errors), the kernel agent and review.verify ops (interpret exit codes — nonzero never authorizes writes)]
    business:
      question: "Which declared inputs went stale — so repair is chosen on evidence, not vibes?"
      whenNeeded: Before choosing repairs on existing source; changed input = revalidation, not mandated rewrite.
      whenNot: Proves declared structural freshness ONLY — no semantic SRS/SDS conformance, no runtime/browser behavior (its own limitations[] say so).
      selectedBy: review.verify modes stales/lint; repair lanes read findings.

  # --------------------------------------------------------------------------
  # HOST / PROVIDER — Orca call contract
  # --------------------------------------------------------------------------

  - id: starci/orca-calls@1 (emits starci/orca-call-result@1)
    file: modules/host/orca/calls.yaml
    dialect: prose-contract
    subsystem: host
    governs: "The complete Orca public-command contract — provider orca, api, liveSchema{call:agent-context,schemaVersion:1,compare:[command,flags],onMismatch:stop-before-effects-and-request-runtime-contract-upgrade}, envelope, defaults, idempotency, calls, forbiddenCalls, recoveries. The document carries the schema const itself."
    binds: modules/host/orca/calls.yaml (the contract document)
    usedBy: [scripts/api/orca/ (call sites need calls.schema==='starci/orca-calls@1'; live agent-context compare), scripts/checks/providers.mjs (envelope must emit starci/orca-call-result@1)]
    business:
      question: "Which Orca commands may the runtime issue, with what envelope, and what happens when live Orca disagrees?"
      whenNeeded: Before ANY Orca effect — provider calls come only from this contract + live discovery; never inferred from prose or another provider.
      whenNot: onMismatch is stop-before-effects — never continue on a drifted live schema, never fall through silently.
      selectedBy: The Orca host adapter requires it; the provider validator fails closed without it.

  # --------------------------------------------------------------------------
  # ROUTING / LAYOUT — where Work and sources live
  # --------------------------------------------------------------------------

  - id: starci/workspace-routing@1
    file: modules/schemas/workspace-routing.yaml
    dialect: prose-contract
    subsystem: routing
    governs: "Project binding resolution — .claude+.workspaces host pair, registry .workspaces/projects/<project>/work.json, one canonical .starciwork per project, features under features/<feature>/, rules against copying the host into routed sources."
    binds: host repo layout + project registry entries
    usedBy: [the kernel agent (the routing questions it asks before effects), CONTEXT.md]
    business:
      question: "Which backend/frontend/Work does this project bind — before any effect?"
      whenNeeded: Project start/prep and any cross-repo delegation; preserve binding when changing directories.
      whenNot: Routed sources never receive .claude/.workspaces copies; a task opened in FE must get host+binding explicitly.
      selectedBy: Every job that resolves repositories — read at binding, not per-operation.

  # --------------------------------------------------------------------------
  # STACKS — .starcistacks deployment knowledge
  # --------------------------------------------------------------------------

  - id: starci/stacks-layout@1
    file: modules/schemas/stacks-layout.yaml
    dialect: prose-contract
    subsystem: stacks
    governs: "The .starcistacks TREE contract — root <repo>/.starcistacks, declaration application-stacks.yaml, environment-name-as-directory identity, required/refused files, runbook's seven commands (prepare/doctor/up/status/logs/down/verification), rendered-vs-authored distinction."
    binds: <repo>/.starcistacks/**
    usedBy: [docs/application-stacks.md (checker shares its read-only findings), scripts/checks/stacks.mjs]
    business:
      question: "Which directories/files must a stack tree have — and which are refused?"
      whenNeeded: Stack declaration/deploy lanes; it governs the tree while application-stacks.schema.yaml governs the manifest CONTENT — confusing the two is why three incompatible .starcistacks trees existed.
      whenNot: Layout says nothing about whether a stack ran — no runtime evidence here.
      selectedBy: application-stacks / deploy lanes; checker reads both halves.

  - id: starci/application-stacks@1
    file: modules/schemas/application-stacks.schema.yaml
    dialect: json-schema
    subsystem: stacks
    governs: "Manifest CONTENT — sources, components, environments, k8s posture; static repository-owned inventory for reproducible environments; strict subset of what the layout's kit uses."
    binds: <repo>/.starcistacks/application-stacks.yaml
    usedBy: [scripts/checks/stacks.mjs (loads the source yaml schema), docs/application-stacks.md]
    business:
      question: "Is this stack declaration structurally complete — components, environments, custody, runbook?"
      whenNeeded: Validating a stack manifest before deploy work; declares intent, never proves a stack ran.
      whenNot: Not evidence of runtime health; readiness/recovery is a separate check.
      selectedBy: stacks checker + deploy lanes; the unversioned id is required verbatim.

  # --------------------------------------------------------------------------
  # KNOWLEDGE / EXAMPLES — the authored knowledge tree
  # --------------------------------------------------------------------------

  - id: starci/knowledge-source@1
    file: modules/schemas/knowledge-source.schema.yaml
    dialect: json-schema
    subsystem: knowledge
    governs: "One authored knowledge topic — id, title, purpose, appliesTo, related/families/observations."
    binds: knowledge/**/*.yaml topic files
    usedBy: [agents and skills, reading knowledge/**/*.yaml]
    business:
      question: "Is this authored guidance a well-formed knowledge topic?"
      whenNeeded: Authoring/updating knowledge yaml (update-knowledge scope).
      whenNot: Knowledge is English-only canonical content — config language never translates it.
      selectedBy: Knowledge authoring review.

  - id: starci/knowledge-rule@1
    file: modules/schemas/knowledge-rule.schema.yaml
    dialect: json-schema
    subsystem: knowledge
    governs: "A knowledge rule record — id, title, kind (+ lenient additionalProperties)."
    binds: rule entries inside knowledge topics
    usedBy: [agents and skills, reading knowledge/**/*.yaml]
    business:
      question: "Is this rule entry identifiable and kinded inside its topic?"
      whenNeeded: Same lane as knowledge-source — rule granularity inside topics.
      whenNot: additionalProperties:true — it is deliberately permissive; do not treat as a strict contract.
      selectedBy: Knowledge authoring review.

  - id: starci/code-example@1
    file: modules/schemas/code-example-manifest.schema.yaml
    dialect: json-schema
    subsystem: knowledge
    governs: "A code example manifest — id, title, purpose, appliesTo, relatedRules, files, entrypoint, adapt, dependencies, verification, provenance."
    binds: code-example manifests inside the authored knowledge tree
    usedBy: [agents and skills, reading knowledge/**/*.yaml]
    business:
      question: "Is this example reusable — does it say what it adapts, needs and how to verify?"
      whenNeeded: Curating example code into the knowledge fleet.
      whenNot: Not example CODE itself — the manifest describing it.
      selectedBy: Knowledge authoring review.

  - id: starci/code-example-catalog@1
    file: modules/schemas/code-example-catalog.schema.yaml
    dialect: json-schema
    subsystem: knowledge
    governs: "The catalog listing code examples — schema/title/purpose/examples[]."
    binds: the example catalog document
    usedBy: [agents and skills, reading knowledge/**/*.yaml]
    business:
      question: "Which examples exist and what is each for?"
      whenNeeded: Browsing/picking an example before adapting it.
      whenNot: Catalog, not manifest — per-example detail lives in code-example@1 manifests.
      selectedBy: Agents browsing examples.

  # --------------------------------------------------------------------------
  # CODE-PATTERN ENFORCEMENT — executable rule conformance
  # --------------------------------------------------------------------------

  - id: starci/code-pattern-profile@1
    file: modules/schemas/code-pattern-profile.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "The profile registry for pattern checks — required profiles nest + next, each declaring its rule set (per #/$defs/profile)."
    binds: code-pattern profile declarations
    usedBy: [scripts/checks/check-scoped-lint.mjs (PROFILE_SCHEMA const; status enum implemented|missing|conflict)]
    business:
      question: "Which mechanical rules apply to THIS repository's framework?"
      whenNeeded: Before a pattern check runs — the profile picks the nest/next rule set.
      whenNot: Framework substitution is not licensed by a profile existing; mono/single-source mappings keep Nest/Next roles.
      selectedBy: check-scoped-lint / code-pattern enforcement lanes.

  - id: starci/code-pattern-check@1
    file: modules/schemas/code-pattern-check.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "The aggregated pattern-check REPORT — profile, repository, ok, status(clean|findings|unavailable|invalid), inventoryDigest, canon{name,version,digest,files}, tooling, inputs, machineResults, coverage, obligations, files, issues, limitations, reportDigest."
    binds: the report a scoped-lint/pattern run emits
    usedBy: [scripts/checks/check-scoped-lint.mjs (CODE_PATTERN_REPORT const); checker scripts emit the sibling starci/code-pattern-script@1 per-file results it aggregates]
    business:
      question: "Did mechanical code-pattern conformance run clean, with what coverage and what limits?"
      whenNeeded: review.verify lint/stales modes; enforcement needs executable coverage, not agent approval.
      whenNot: status unavailable/invalid is not clean; a missing checker can never be replaced by agent sign-off (per CONTEXT.md).
      selectedBy: pattern-check orchestration; auditors read reportDigest-bound output.

  # --------------------------------------------------------------------------
  # SPECIFICATION — SRS/SDS payload contracts (bodies under
  # modules/schemas/spec/; validators live in scripts/checks/spec/).
  # CURRENT: CONTEXT.md sends all new authoring to business/srs/ and
  # architecture/sds/, and these schemas are what those payloads validate
  # against. The work-* family schemas and the check-work-* gate stack govern
  # the .starciwork work/* record tree — a different axis, not a replacement.
  # --------------------------------------------------------------------------

  - id: starci/specification-contract@1
    file: modules/schemas/spec/contract.schema.yaml
    dialect: prose-contract
    subsystem: spec
    governs: "The specification contract meta-record — required sections, row shapes, statuses (draft|blocked|pass), preserved-English rules, and pointers to the current SRS/SDS contracts (srs-sections.schema.yaml, sds-map.schema.yaml, sds.schema.yaml, srs.schema.yaml)."
    binds: cohesive starci/specification@1 records + the split SRS/SDS layout rules
    usedBy: [scripts/checks/spec/validate.mjs (loads it as the section contract; cohesive detail checks live in scripts/checks/spec/specification.mjs), work-*/index.yaml extensions.work3.specification|srs|sds payloads]
    business:
      question: "Which sections must a specification carry, in which language, under which lifecycle?"
      whenNeeded: Authoring or validating any SRS/SDS record; the umbrella contract the section schemas hang under.
      whenNot: Not the section schemas themselves — srs-sections/sds-map own the typed payloads.
      selectedBy: spec validators + decide ops' declared reads (compatibility inputs).

  - id: starci/sds@1
    file: modules/schemas/spec/sds.schema.yaml
    dialect: json-schema
    subsystem: spec
    governs: "The source-independent SDS record — purpose, businessRefs, designRefs, views, decisions, checks, references, limitations; op const architecture.decide."
    binds: SDS records authored under the sds@1 payload (extensions.work3.sds / architecture trees)
    usedBy: [scripts/checks/spec/sds.mjs (SDS_SCHEMA), contract.schema.yaml architecture.schema, tests/sds.spec.mjs]
    business:
      question: "Is this SDS structurally a source-independent design record?"
      whenNeeded: architecture.decide output validation; compatibility reads of existing SDS records.
      whenNot: New authoring uses the component-based sds-map sections over the cohesive monolith.
      selectedBy: The record's own schema const starci/sds@1.

  - id: starci/sds-map@1
    file: modules/schemas/spec/sds-map.schema.yaml
    dialect: prose-contract
    subsystem: spec
    governs: "The filesystem-split SDS map — overview (starci/sds-overview@1) plus typed sections flows/components/contracts/data/quality/deployment/decisions/verification with their per-section required fields; aggregate starci/sds-aggregate@1."
    binds: architecture/{overview,sds/**}/index.yaml payloads (extensions.work3.sds)
    usedBy: [scripts/checks/spec/sds-map.mjs (SDS_MAP_CONTRACT, classifySDSPath/validateSDSMap), contract.schema.yaml currentArchitectureMapContract]
    business:
      question: "Does the SDS map trace every accepted business flow through logical components to verification?"
      whenNeeded: Authoring/validating split SDS sections — the current canonical SDS shape.
      whenNot: Source paths/symbols/revisions never belong here — implementation owns code mapping.
      selectedBy: SDS map section files; architecture.decide lanes.

  - id: starci/srs-sections@1
    file: modules/schemas/spec/srs-sections.schema.yaml
    dialect: prose-contract
    subsystem: spec
    governs: "The typed split-SRS section contracts — aggregate starci/srs-aggregate@1 with allowedSections, plus per-section records (functional-requirement, nfr, business-rule, policy-decision, data, customer-journey) with required fields."
    binds: business/srs/**/index.yaml payloads (extensions.work3.srs) — the canonical split-SRS tree
    usedBy: [scripts/checks/spec/srs-sections.mjs (SRS_SECTION_CONTRACT), contract.schema.yaml semantics.layout]
    business:
      question: "Does each split SRS leaf carry exactly the fields its section type owns?"
      whenNeeded: Authoring/validating the current canonical SRS tree.
      whenNot: Aggregate parents hold no specification payload — leaves own the items.
      selectedBy: SRS section files; business.decide lanes.

  - id: starci/srs@1
    file: modules/schemas/spec/srs.schema.yaml
    dialect: json-schema
    subsystem: spec
    governs: "The compatibility SRS record — id, nodeType, name, summary, refs, content; op const business.decide."
    binds: business/srs leaves authored against the cohesive record (compatibility/recovery reads)
    usedBy: [scripts/checks/spec/srs.mjs (SRS_SCHEMA compat reader), contract.schema.yaml compatibilityBusiness.schema, tests/srs.spec.mjs]
    business:
      question: "Is a pre-split SRS record still readable under its original checks?"
      whenNeeded: Compatibility reads of existing SRS records.
      whenNot: Never for new authoring — new SRS uses srs-sections.schema.yaml.
      selectedBy: The record's schema const starci/srs@1.

  # --------------------------------------------------------------------------
  # ASSISTED UAT — immutable human-checkpoint package and derived verification
  # --------------------------------------------------------------------------

  - id: starci/assisted-uat-request@1
    file: modules/schemas/assisted-uat-request.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "Frozen assisted-UAT intent, current input/build/environment/flow bindings, genuine human gates, scripts, policies, receipt template and limits."
    binds: "uat.assisted.prepare E/assisted-uat/request.yaml"
    usedBy: [modules/ops/ops/uat.assisted.prepare.yaml, scripts/uat/assisted-runner.mjs]
    business: {question: "Exactly what controlled journey may the user perform?", whenNeeded: "Before opening the assisted browser session.", whenNot: "Not a pass receipt or canonical Work state.", selectedBy: "Exact --request path; latest-run discovery is forbidden."}

  - id: starci/assisted-uat-session-manifest@1
    file: modules/schemas/assisted-uat-session-manifest.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "Digest-bound runner/browser identity, launch, ordered scripts, human-gate IDs, artifact policy and write-once receipt target."
    binds: "uat.assisted.prepare E/assisted-uat/session-manifest.yaml"
    usedBy: [modules/ops/ops/uat.assisted.prepare.yaml, scripts/uat/assisted-runner.mjs]
    business: {question: "Which exact prepared bytes and browser contract form this session?", whenNeeded: "At assisted-run admission and later verification.", whenNot: "Never a mutable latest-session pointer.", selectedBy: "Request-selected exact manifest path and sha256."}

  - id: starci/assisted-uat-cleanup@1
    file: modules/schemas/assisted-uat-cleanup.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "Closed cleanup actions plus mandatory read-back probes for run-owned effects."
    binds: "uat.assisted.prepare E/assisted-uat/cleanup.yaml"
    usedBy: [scripts/uat/assisted-runner.mjs, modules/ops/ops/uat.assisted.verify.yaml]
    business: {question: "How are this run's effects removed/restored and proved clean?", whenNeeded: "Every assisted run that can create or mutate state.", whenNot: "Not authority to delete unrelated or unbound resources.", selectedBy: "The prepared request's cleanup path and digest."}

  - id: starci/assisted-uat-redaction@1
    file: modules/schemas/assisted-uat-redaction.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "Closed evidence redaction rules and deterministic inspection commands."
    binds: "uat.assisted.prepare E/assisted-uat/redaction.yaml"
    usedBy: [scripts/uat/assisted-runner.mjs, modules/ops/ops/uat.assisted.verify.yaml]
    business: {question: "Which prohibited values must be removed and how is that verified?", whenNeeded: "Before receipt finalization and during independent verification.", whenNot: "Never permission to place a secret in chat or source.", selectedBy: "The prepared request's redaction path and digest."}

  - id: starci/assisted-uat-receipt@1
    file: modules/schemas/assisted-uat-receipt.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "One append-only controlled-run record with exact bindings, ordered flow/gate completion, checks, artifacts, postconditions, cleanup and redaction."
    binds: "E/assisted-uat/receipts/<run-id>.yaml"
    usedBy: [scripts/uat/assisted-runner.mjs, modules/ops/ops/uat.assisted.verify.yaml]
    business: {question: "What exactly happened in this one human-assisted run?", whenNeeded: "After controlled execution finishes.", whenNot: "completionSignal ok is never an acceptance verdict.", selectedBy: "Explicit absolute --receipt path; write once."}

  - id: starci/assisted-uat-verification@1
    file: modules/schemas/assisted-uat-verification.schema.yaml
    dialect: json-schema
    subsystem: gate
    governs: "Independent current binding/check/evidence/postcondition/cleanup/redaction result and machine-derived disposition."
    binds: "uat.assisted.verify E/assisted-uat/verification.yaml"
    usedBy: [modules/ops/ops/uat.assisted.verify.yaml]
    business: {question: "Does the exact immutable assisted run still prove the current accepted flow?", whenNeeded: "In the separate acceptance workflow before final reconciliation.", whenNot: "Not a receipt rewrite or direct Work completion.", selectedBy: "Exact request/session/receipt inputs and current read-only probes."}

  # --------------------------------------------------------------------------
  # PROFILES / REGISTRY — evidence profiles and runtime registry
  # --------------------------------------------------------------------------

  - id: "(evidence profiles map — no schema: const; file modules/schemas/profiles.yaml)"
    file: modules/schemas/profiles.yaml
    dialect: prose-data
    subsystem: gate
    governs: "Completion-evidence capability per node kind — business/architecture/implementation/uat/uat.ui/uat.ux/release each declare which proof kinds they support (assertions, code, uat, image, behavior)."
    binds: Work node completion profiles (what proof a done leaf of each kind needs)
    usedBy: [engine/index.mjs (profiles export — reads modules/schemas/profiles.yaml; UNSUPPORTED_PROFILE warning when a leaf kind has no profile; inline design-review restricted to listed kinds)]
    business:
      question: "What evidence may complete a done claim for this kind of node?"
      whenNeeded: preflightCompletion / completion review — the proof ceiling per kind.
      whenNot: Distinct from profile-registry (runtime/model profiles) — same word, different axis; do not conflate.
      selectedBy: core validation when a node kind asserts completion.

  - id: starci/profile-registry@1
    file: modules/schemas/profile-registry.schema.yaml
    dialect: json-schema
    subsystem: model
    governs: "The model/runtime registry contract — runtimes[], aliases, executionModel, defaults, targets, skills, operators, fallback."
    binds: "modules/models/registry.yaml (carries schema starci/profile-registry@1)"
    usedBy: [scripts/checks/providers.mjs (reads modules/models/registry.yaml targets; Orca admission must use profile resolver output)]
    business:
      question: "Which runtimes/agents exist, what can each run, and what is the fallback order?"
      whenNeeded: Before creating execution agents — load the registry catalog tree first, fail closed on disagreement.
      whenNot: Quota/eligibility still gate each call — registry presence is not dispatch authority.
      selectedBy: Provider validation + agent admission (modules/models/ holds the model-side detail).

  # --------------------------------------------------------------------------
  # BUILD HELPERS
  # --------------------------------------------------------------------------

  - id: starci/json-exceptions@1
    file: modules/schemas/json-exceptions.yaml
    dialect: prose-data
    subsystem: build
    governs: "Exact relative paths allowed to remain authored JSON — no directory wildcards; each entry carries a reason."
    binds: the authored-JSON allowlist (rendered envs, realm imports, UAT run receipts, licenses...)
    usedBy: [scripts/checks/check-json-exceptions.mjs (inventory-only; offenders listed)]
    business:
      question: "Which JSON files are legitimate exceptions?"
      whenNeeded: Adding any authored .json — it needs a listed exception with a reason, or it converts to YAML.
      whenNot: Never a wildcard allowlist; adding an exception is a deliberate per-file decision.
      selectedBy: The json-exceptions check at lint/gate time.

  # --------------------------------------------------------------------------
  # KNOWN GAPS
  # --------------------------------------------------------------------------

# ============================================================================
# MODULE-LOCAL DOCUMENT KINDS — the other half of the stamp inventory.
#
# A contract document under modules/ stamps the kind it IS. These kinds have no
# schema file: the document is its own contract, and its shape is whatever the
# file declares. They are listed here, once, so that every `schema:` const in
# the tree is accounted for in exactly one place —
# `node scripts/checks/check-schema-catalog.mjs` fails on a stamp that appears
# in neither list, on a file this block does not name, and on an entry no file
# stamps. modules/ops/ops/*.yaml is excluded: those manifests all carry the one
# op kind the generated modules/ops/registry.yaml indexes.
# ============================================================================
moduleLocalDocumentKinds:
  - id: starci/schema@1
    governs: "This file is a schema document: it `describes` the record const its consumers stamp."
    files:
      - modules/schemas/agent-hierarchy.yaml
      - modules/schemas/application-stacks.schema.yaml
      - modules/schemas/goal-plan.yaml

  - id: starci/document@1
    governs: "A sectioned prose policy document (title/blocks)."
    files: [modules/ops/_common.yaml]

  - id: starci/module-ops-registry@1
    governs: "The generated op index. Never hand-edited — rebuild with scripts/route/build-ops-registry.mjs."
    files: [modules/ops/registry.yaml]

  # --- kernel ---------------------------------------------------------------
  - id: starci/module-kernel-api@1
    governs: "The scripts/kernel/api.mjs command contract — args, read/write sets, refusal strings."
    files: [modules/kernel/api.yaml]
  - id: starci/module-kernel-driver-loop@1
    governs: "The tick the kernel agent runs."
    files: [modules/kernel/driver-loop.yaml]
  - id: starci/module-kernel-dispatch@1
    governs: "The packet an operation is launched with."
    files: [modules/kernel/dispatch.yaml]
  - id: starci/module-kernel-start@1
    governs: "Claim a queued goal, spawn its kernel."
    files: [modules/kernel/start-workflow.yaml]
  - id: starci/module-kernel-verdict@1
    governs: "What `api settle` accepts and rejects."
    files: [modules/kernel/verdict-contract.yaml]

  - id: starci/supervisor@1
    governs: "The chat-facing observe/analyze/patch/restart loop contract."
    files: [modules/supervisor/supervise.yaml]

  - id: starci/module-quality-bar@1
    governs: "The one code-quality bar every workflow scores against, layer by layer, with each layer's real enforcement status."
    files: [modules/quality/quality-bar.yaml]

  # --- goal chain -----------------------------------------------------------
  - id: starci/module-goal-anatomy@1
    governs: "What a goal is — record, revision counter, amendments, lifecycle."
    files: [modules/goal/anatomy.yaml]
  - id: starci/module-goal-archetypes@1
    governs: "Memoized delta-to-chain patterns; priors, never templates."
    files: [modules/goal/archetypes.yaml]
  - id: starci/module-goal-define@1
    governs: "The define-goal entry contract — inputs, returns, refusals."
    files: [modules/goal/define-goal.yaml]
  - id: starci/module-goal-existing@1
    governs: "The survey leg — existing-surface detection and extend-vs-add."
    files: [modules/goal/existing.yaml]
  - id: starci/module-goal-legality@1
    governs: "The five legality families a proposed op chain must satisfy."
    files: [modules/goal/legality.yaml]

  # --- models ---------------------------------------------------------------
  - id: starci/module-models-index@1
    governs: "The modules/models coverage manifest."
    files: [modules/models/index.yaml]
  - id: starci/module-model-selection@1
    governs: "Which model may take which workload — qualification, probation, ordering."
    files: [modules/models/selection.yaml]
  - id: starci/module-model-profile@1
    governs: "One routing/capability target: identity, capacity cache, launch shape, position."
    files:
      - modules/models/profiles/claude-agent.yaml
      - modules/models/profiles/claude-fable.yaml
      - modules/models/profiles/codex-agent.yaml
      - modules/models/profiles/deepseek-v4-pro.yaml
      - modules/models/profiles/devin-agent.yaml
      - modules/models/profiles/gpt-5.6-luna.yaml
      - modules/models/profiles/qwen-agent.yaml
      - modules/models/profiles/qwen3.8-max.yaml
  - id: starci/agent-card@1
    governs: "One agent's spawn contract. Enforced by scripts/checks/providers.mjs (schema id, agent == file stem) and tests/provider-orca.spec.mjs."
    files:
      - modules/models/agents/claude.yaml
      - modules/models/agents/codex.yaml
      - modules/models/agents/devin.yaml
      - modules/models/agents/qwen.yaml
  - id: starci/runtimes@1
    governs: "The quota-window runtime pools, allocation policy and roleOfKind table. The only concurrency authority."
    files: [modules/models/runtimes.yaml]
  - id: starci/kinds@1
    governs: "The operation-kind catalog: lanes, routes, blockers, the kernel-agent legality graph."
    files: [modules/models/kinds.yaml]
  - id: starci/records@1
    governs: "The record catalog the kinds graph writes against."
    files: [modules/models/records.yaml]
  - id: starci/model-capability-policy@1
    governs: "A model NAME is an availability fact, never proof of capability — the evidence a qualification must carry."
    files: [modules/models/capabilities.yaml]
  - id: starci/model-qualifications@1
    governs: "The measured-qualification store. Empty in the package: shipping is not certifying."
    files: [modules/models/qualifications.yaml]

  # --- hosts ----------------------------------------------------------------
  - id: starci/orca-provider@1
    governs: "The Orca host contract entry — hierarchy names, environment binding, kernel and op call templates."
    files: [modules/host/orca/index.yaml]
  - id: starci/orca-api@1
    governs: "The observed Orca command inventory and the StarCi allowlist over it."
    files: [modules/host/orca/api.yaml]
  - id: starci/orca-capabilities@1
    governs: "Orca host topology, isolation boundaries and identity sources."
    files: [modules/host/orca/capabilities.yaml]
  - id: starci/orca-recipes@1
    governs: "The ordered call sequences for each launch and settlement shape."
    files: [modules/host/orca/recipes.yaml]
  - id: starci/orca-provider-validation@1
    governs: "Preflight, receipt, dispatch, UI and message assertions for Orca-hosted work."
    files: [modules/host/orca/validation.yaml]
  - id: starci/provider-envelopes@1
    governs: "The normalized operation input/output envelopes a host carries."
    files: [modules/host/orca/envelopes.yaml]
  - id: starci/claude-provider@1
    governs: "What a Claude Code chat is to StarCi: launcher and monitor, never an execution host."
    files: [modules/host/claude/index.yaml]
  - id: starci/codex-provider@1
    governs: "What a Codex chat is to StarCi: launcher and monitor, never an execution host."
    files: [modules/host/codex/index.yaml]

gaps:
  - "work-layout@1 shape declares 15 families; only 11 have per-family schemas. work/contract@1, work/integration@1, work/gap@1, work/event@1 have NO work-*.schema.yaml file — check-work-consistency.mjs comments confirm contract+integration 'author requiresProof in both live trees and have no per-family schema file of their own' (gap/event likewise unfiled). Their records are covered only by the layout's shape line and the generic work/ walk in check-work-artifacts.mjs."
  - "starci/goal@1 (kernel goal.json) has no dedicated schema file — the workflow goal is a sqlite row written by `api enqueue`/define-goal; its contract lives in modules/goal/define-goal.yaml."
  - "starci/code-pattern-script@1 is emitted by every scripts/checks/code-patterns/*.mjs script and consumed by check-scoped-lint.mjs, but has no schema file — only the aggregate starci/code-pattern-check@1 is schematized."
  - "Record kinds named in modules/models/kinds.yaml but not backed by a file here: work/node@1, work/resource@1 (inside work.schema.yaml monolith — covered), starci/evidence-packet@1 (no file found — only listed)."

coverage:
  tree: "modules/schemas/ — 40 authored files + modules/schemas/spec/ 5 files + index.yaml + relationships.yaml"
  authoredFiles: 45            # 40 top-level + 5 under spec/
  authority: the authored YAML in this tree, read directly by its consumers
