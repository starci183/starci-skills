$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:uat-run-manifest:1
type: object
additionalProperties: false
description: "One append-only UAT run, written by the Playwright harness into
  features/<feature>/uat/<flow>/runs/<runId>/manifest.yaml. It is an artifact payload rather than a Work
  record - it has no lifecycle, no refs and no place-derived identity, and
  scripts/checks/check-example-work.mjs walks past it as PAYLOAD_SKIPPED - but it is the evidence a
  `work/uat-flow@1` settles on, so its shape is contracted here rather than left to whatever the harness
  happened to write. A run is never edited once settled: a re-run adds a new runId, which is why this file
  records what was observed, the exact bytes of every capture, and the commits that were serving at the
  time, and never a verdict about the record it belongs to."
required:
  - schema
  - id
  - nodeId
  - inputDigest
  - outcome
  - assertions
  - assets
  - provenance
  - files
properties:
  schema:
    const: starci/uat-run-manifest@1
    description: Document kind discriminator. It is deliberately not a `work/` kind, because that prefix is
      what tells the record walk which yaml files are records at all.
  id:
    type: string
    pattern: ^uat(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}\.runs\.[0-9]{8}T[0-9]{6}Z-[a-f0-9]+$
    description: "The run's own id: the flow's id, then `runs`, then the run directory's name. It mirrors
      the path so that a manifest which has been copied into another run's folder is caught rather than
      silently attaching itself to a run it did not describe."
  nodeId:
    type: string
    pattern: ^uat(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The `work/uat-flow@1` this run walked, by id. It is stated explicitly rather than parsed
      back out of the run id, because the flow is what the run is about and a reader should not have to
      strip a suffix to learn it.
  inputDigest:
    $ref: "#/$defs/sha256"
    description: The digest of the flow definition this run was performed against. It is what makes a run
      expire honestly - the steps can be rewritten afterwards, and a run recorded against the old steps is
      then evidence of a walk nobody would perform today.
  outcome:
    enum:
      - pass
      - partial-pass
      - fail
      - inconclusive
    description: "What the run as a whole established. `partial-pass` and `inconclusive` exist because a
      walk against a live system genuinely stops halfway - a dependency this lane was not authorized to
      touch, an origin that never answered - and collapsing those into `pass` or `fail` would either claim
      a proof the run does not have or report a product failure that did not happen."
  assertions:
    type: array
    uniqueItems: true
    description: What the walk set out to observe, one entry per check. It may be empty for a run that
      never got far enough to check anything, and that emptiness is itself the honest record of the run.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - expected
        - observed
      properties:
        id:
          type: string
          minLength: 1
          description: What was checked - a record id, one of its inline criteria addressed as
            `<record>#<criterion>`, or a short name for an observed-feedback check the flow's steps declare.
        expected:
          enum:
            - "yes"
            - "no"
          description: Whether the walk expected to see the thing. A negative expectation is a real check -
            proving a refusal happens is as much of a proof as proving an action succeeds - so it is
            recorded rather than inferred from the observation.
        observed:
          enum:
            - "yes"
            - "no"
            - not-run
          description: "What the walk actually saw. `not-run` is a third value on purpose: a check that was
            never reached is not a check that failed, and folding the two together would either manufacture
            a product defect or let an unreached check read as satisfied."
        note:
          type: string
          minLength: 1
          description: What was seen, or why the check was not reached, specifically enough that somebody
            else could look for the same thing.
  assets:
    type: array
    uniqueItems: true
    description: Every capture the run produced, with the exact bytes it produced. The digests are what
      make the run auditable after the fact - a screenshot swapped later is a different file, and a
      manifest naming its size and hash says so.
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - sha256
        - size
      properties:
        path:
          type: string
          minLength: 1
          description: The capture's path relative to the run directory - screens/<name>.png,
            videos/<name>.webm.
        sha256:
          $ref: "#/$defs/sha256"
          description: The capture's own digest, so the manifest is a statement about specific bytes rather
            than about a filename.
        size:
          type: integer
          minimum: 0
          description: The capture's size in bytes. It is recorded beside the digest because a zero-byte
            video and a real one hash differently but read identically in a directory listing, and an empty
            capture is the most common way a run looks complete without being it.
  provenance:
    type: object
    additionalProperties: false
    required:
      - tool
      - version
      - browser
      - baseURL
      - frontendCommit
      - backendCommit
    description: What performed the walk, where, and against which code. All six are required because a run
      against an unidentified build proves something about nothing in particular, and a walk is the one
      kind of evidence whose subject is a whole running system rather than a file.
    properties:
      tool:
        $ref: "#/$defs/slug"
        description: The harness that drove the browser.
      version:
        type: string
        minLength: 1
        description: That harness's version. Browser automation changes what it can see between releases,
          so a run's tool version is part of what was observed.
      browser:
        $ref: "#/$defs/slug"
        description: The browser the walk ran in.
      baseURL:
        type: string
        minLength: 1
        description: The origin the walk addressed. It is the single fact that distinguishes a run against
          the shared dev stack from one against a run-owned stack on another port.
      frontendCommit:
        type: string
        pattern: ^[a-f0-9]{7,64}$
        description: The frontend commit that was being served.
      backendCommit:
        type: string
        pattern: ^[a-f0-9]{7,64}$
        description: The backend commit that was being served. It is separate from the frontend's because
          a two-repository product is routinely served from two different commits, and one field would
          record whichever the harness happened to ask first.
  files:
    type: object
    minProperties: 1
    propertyNames:
      type: string
      pattern: ^[A-Za-z_][A-Za-z0-9_.-]*\.(?:json|md)$
    additionalProperties:
      oneOf:
        - type: string
          minLength: 1
        - type: object
          minProperties: 1
          propertyNames:
            type: string
            minLength: 1
    description: "The run's sibling files, mirrored into the manifest by name: the harness's own run
      ledger, flow definition, walk, ux-checks, readback and cleanup payloads, plus any note the run
      carries about how it should be read. The values are the payloads themselves, each governed by its own
      `schema:` const, and their inner shape is the harness's contract rather than this file's - mirroring
      them keeps one readable manifest without this schema claiming authority over documents it does not
      own."
$defs:
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that a name
      written twice by two authors is the same string.
  sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
    description: A lowercase hex SHA-256. It is pinned to one case and one length so that two records
      digesting the same bytes produce the same string.
