$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/code-pattern-profile.schema.json
type: object
additionalProperties: false
required: [schema, profiles]
properties:
  schema: {const: starci/code-pattern-profile@1}
  profiles:
    type: object
    additionalProperties: false
    required: [nest, next]
    properties:
      nest: {$ref: '#/$defs/profile'}
      next: {$ref: '#/$defs/profile'}
$defs:
  nonempty: {type: string, minLength: 1}
  stringList:
    type: array
    uniqueItems: true
    items: {$ref: '#/$defs/nonempty'}
  profile:
    type: object
    additionalProperties: false
    required: [title, canon, sourceRuleRoots, expectedSourceRuleIds, sourceGlobs, inputGlobs, obligations, semanticOnly]
    properties:
      title: {$ref: '#/$defs/nonempty'}
      canon:
        type: object
        additionalProperties: false
        required: [package, version, contentDigest]
        properties:
          package: {$ref: '#/$defs/nonempty'}
          version: {$ref: '#/$defs/nonempty'}
          contentDigest:
            type: object
            additionalProperties: false
            required: [algorithm, include, exclude, framing, value, files]
            properties:
              algorithm: {const: sha256}
              include: {$ref: '#/$defs/stringList'}
              exclude: {$ref: '#/$defs/stringList'}
              framing: {const: sorted-posix-relative-path-null-raw-bytes-null}
              value: {type: string, pattern: '^[a-f0-9]{64}$'}
              files: {type: integer, minimum: 1}
      sourceRuleRoots: {$ref: '#/$defs/stringList'}
      expectedSourceRuleIds: {$ref: '#/$defs/stringList'}
      sourceGlobs: {$ref: '#/$defs/stringList'}
      inputGlobs: {$ref: '#/$defs/stringList'}
      obligations:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/obligation'}
      semanticOnly:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, sourceRuleIds, rationale, guidance]
          properties:
            id: {$ref: '#/$defs/nonempty'}
            sourceRuleIds: {$ref: '#/$defs/stringList'}
            rationale: {$ref: '#/$defs/nonempty'}
            guidance: {$ref: '#/$defs/nonempty'}
  obligation:
    type: object
    additionalProperties: false
    required: [id, sourceRuleIds, applicability, mechanical, semantic, status]
    properties:
      id: {$ref: '#/$defs/nonempty'}
      sourceRuleIds: {$ref: '#/$defs/stringList'}
      applicability:
        type: object
        additionalProperties: false
        required: [include]
        properties:
          include: {$ref: '#/$defs/stringList'}
          exclude: {$ref: '#/$defs/stringList'}
      mechanical:
        type: object
        additionalProperties: false
        required: [requirement, check]
        properties:
          requirement: {$ref: '#/$defs/nonempty'}
          check:
            type: object
            additionalProperties: false
            required: [kind, ruleIds]
            properties:
              kind: {enum: [eslint, architecture, repository-audit, script]}
              ruleIds: {$ref: '#/$defs/stringList'}
              sourceOnly: {type: boolean}
              expected:
                type: object
                additionalProperties: false
                required: [severity]
                properties:
                  severity: {enum: [off, warn, error, 0, 1, 2]}
                  optionsByRule:
                    type: object
                    additionalProperties:
                      type: array
              externalResult:
                type: object
                additionalProperties: false
                required: [schema, command]
                properties:
                  schema: {$ref: '#/$defs/nonempty'}
                  command: {$ref: '#/$defs/nonempty'}
      semantic:
        type: object
        additionalProperties: false
        required: [guidance, review]
        properties:
          guidance: {$ref: '#/$defs/nonempty'}
          review: {$ref: '#/$defs/nonempty'}
      status: {enum: [implemented, missing, conflict]}
      conflict: {$ref: '#/$defs/nonempty'}
