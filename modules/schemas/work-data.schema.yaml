$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:data:1
type: object
additionalProperties: false
description: One thing the product stores, described in the product's own terms rather than a DDL
  script's. It lists the fields a reader must know about and, separately, the invariants that are true of
  every instance forever. The two are kept apart because a field list describes shape and an invariant
  describes a promise - shape can be read off a database, a promise cannot, and it is the promise that a
  rule depends on and a refactor quietly breaks.
required:
  - schema
  - id
  - title
  - state
  - fields
  - invariants
  - appliesTo
properties:
  schema:
    const: work/data@1
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  id:
    type: string
    pattern: ^data(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The definition's stable id, a lowercase dot-path under the data family:
      data.<feature>.<name>; example data.task.task. The prefix is enforced so a reference to data.x is
      unambiguously a stored thing rather than a rule about it."
  title:
    $ref: "#/$defs/prose"
    description: What the thing is called in conversation - Person, Task - rather than in a table name. The
      product's word for it is the one every other record should use.
  state:
    $ref: "#/$defs/state"
  fields:
    type: array
    minItems: 1
    uniqueItems: true
    description: What each instance carries, one entry per field. It is required and nonempty because a
      stored thing with no field is not a thing anyone can store.
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
          description: The field's name as the product uses it, lowerCamelCase. One spelling is fixed so
            that a rule, a screen and a payload can all name the same field and be checked against each
            other.
          minLength: 1
        type:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
          description: The kind of value the field holds in the product's vocabulary - text, boolean,
            timestamp - not a database or language type. It is kept product-side so that changing the store
            is not a change to this record.
        required:
          type: boolean
          description: Whether every instance must carry a value. It is a boolean rather than an absence
            because "not stated" and "optional" are different claims, and only one of them is a decision.
        default:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: The value an instance carries when none is supplied. It is recorded here because a
            default is a product decision that a reader of a rule needs, not an implementation detail.
        note:
          $ref: "#/$defs/prose"
          description: What a reader must know about this field that the name and type do not say - that an
            identifier is never reused, that an email is lowercased on write. It is where the reason lives,
            so the rest of the entry can stay mechanical.
  invariants:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: What is true of every instance at all times, one sentence each. These are the promises
      other records rely on, so they are stated separately from the fields and are required - a definition
      with no invariant is a table, and a table makes no promises anybody can depend on.
  appliesTo:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/recordId"
    description: The records that depend on this definition, by id. It is what makes a field change land as
      a visible impact on named rules rather than as a schema change nobody connected to a promise.
  blockedBy:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: What is standing in the way, in sentences that name the record responsible. It is prose
      rather than lifecycle state because an impediment is a fact about the world, not a status.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
  recordId:
    type: string
    pattern: ^(?:br|fr|nfr|data|decision|journey|sds|impl|ui|uat)(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The id of any record in the tree, family prefix included. Requiring a known prefix means a
      unresolvable reference is caught as a malformed id rather than surviving as a plausible-looking string.
  state:
    enum:
      - todo
      - done
    description: "Whether this leaf is outstanding or finished, and nothing else. There is deliberately no
      third authored value: `stale` is derived by the checker when an input a done record was proved against
      has moved, and authoring it would let a record claim a status the checker is supposed to compute -
      which is how a tree starts reporting its own opinion of its freshness instead of a measured one."
