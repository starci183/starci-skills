$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:hfs-repo:1
title: HFS repository declaration (hfs.json)
description: >-
  The one file a product repository adds to say which HFS it follows. Owners are derived from slots, so it lists no
  owners, no paths and no switched-off rules. The manifest decides which app kinds and slot ids are legal
  (scripts/lib/hfs-slots.mjs resolveRepoDeclaration): kinds must exist for the profile, optionalSlots may name only
  opt-in slots, and a slot that an app kind implies is never listed.
type: object
additionalProperties: false
required: [hfs, profile, project, apps]
properties:
  hfs:
    type: integer
    minimum: 1
    description: The pinned manifest MAJOR. A repository always follows the latest minor of that major; another major than the manifest's is refused.
  profile: {enum: [be, fe]}
  project:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    description: Binds .workspaces/projects/<project>/work.json.
  apps:
    type: array
    minItems: 1
    description: Every apps/<name>, with its kind. Names are unique.
    items:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        kind: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  optionalSlots:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^(repo|be|fe)\.[a-z0-9-]+(\.[a-z0-9-]+)*$'}
  connections:
    type: array
    uniqueItems: true
    description: >-
      Backend only. One entry per physical database (R84): its logical name (the connection the arrays of a be.persistence slot are registered on,
      the <conn> of platform/database/<conn>.{connection,config,decorators}.ts, one migrate run) and the prefix of the env
      keys its <conn>.config.ts reads. Names and prefixes are unique and no prefix covers another's keys (checked by
      scripts/lib/hfs-slots.mjs).
    items:
      type: object
      additionalProperties: false
      required: [name, envPrefix]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        envPrefix: {type: string, pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'}
  stacks:
    type: string
    minLength: 1
    pattern: '^(?![a-zA-Z]:)(?![\/])'
    description: >-
      Front end only. A relative path to the sibling back-end repository that owns the .starcistacks declaration
      (for example "../nivo-backend"). hfs sync reads this repository's Sonar key from that declaration, so the key has
      one source. A back-end repository omits it because it owns its declaration.
allOf:
  - if: {properties: {profile: {const: fe}}, required: [profile]}
    then: {not: {required: [connections]}}
    else: {not: {required: [stacks]}}
