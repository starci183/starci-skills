$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:hfs-repo:2
title: HFS declaration (hfs.json)
description: >-
  The one file an app repository adds at its root to say which HFS it follows. A product is ONE app repository of kind `app`
  with two sides, `be` (the folder be/) and `fe` (the folder fe/); there is no standalone back-end or front-end repository.
  Owners are derived from slots, so it lists no owners, no paths and no switched-off rules. The manifest decides which app
  kinds, slot ids and cross-side reads are legal (scripts/hfs/slots.mjs resolveRepoDeclaration): per side, kinds must exist
  for that profile, optionalSlots may name only opt-in slots of the side, a slot that an app kind implies is never listed, and
  `reads` is a subset of the manifest's sides.<side>.reads. App names are unique across both sides. The StarCi runtime
  repository itself declares kind `runtime` ({hfs, kind, project} only): it is judged by the runtime manifest
  knowledge/hfs/runtime-slots.yaml and has no sides or apps.
oneOf:
  - {$ref: '#/$defs/app'}
  - {$ref: '#/$defs/runtime'}
$defs:
  runtime:
    type: object
    additionalProperties: false
    required: [hfs, kind, project]
    properties:
      hfs: {type: integer, minimum: 1, description: The pinned major of knowledge/hfs/runtime-slots.yaml.}
      kind: {const: runtime}
      project: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  app:
    type: object
    additionalProperties: false
    required: [hfs, kind, project, sides]
    properties:
      hfs:
        type: integer
        minimum: 1
        description: The pinned manifest MAJOR. A repository always follows the latest minor of that major; another major than the manifest's is refused.
      kind: {const: app}
      project:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        description: Binds .workspaces/projects/<project>/work.json.
      sides:
        type: object
        additionalProperties: false
        required: [be, fe]
        properties:
          be:
            allOf:
              - {$ref: '#/$defs/side'}
              - properties:
                  connections:
                    type: array
                    uniqueItems: true
                    description: >-
                      One entry per physical database (R84): its logical name (the connection the arrays of a be.persistence slot are
                      registered on, the <conn> of platform/database/<conn>.{connection,config,decorators}.ts, one migrate run) and the
                      prefix of the env keys its <conn>.config.ts reads. Names and prefixes are unique and no prefix covers another's
                      keys (checked by scripts/hfs/slots.mjs).
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, envPrefix, owner, isolation]
                      properties:
                        name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
                        envPrefix: {type: string, pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'}
                        owner: {type: string, pattern: '^[a-z][a-z0-9-]*$', description: 'The api or worker app that owns this bounded context (the connection is the context): only it composes the connection (R174).'}
                        isolation: {enum: [database, schema], description: 'The context is its own logical database, or its own schema of a shared database (<PREFIX>_SCHEMA); splitting a schema out into a database is an env-only change.'}
          fe:
            allOf:
              - {$ref: '#/$defs/side'}
              - not: {required: [connections]}
  side:
    type: object
    unevaluatedProperties: false
    required: [apps]
    properties:
      apps:
        type: array
        minItems: 1
        description: Every <side>/apps/<name>, with its kind. Names are unique across the app.
        items:
          type: object
          additionalProperties: false
          required: [name, kind]
          properties:
            name: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
            kind: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      optionalSlots:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^(app|repo|be|fe)\.[a-z0-9-]+(\.[a-z0-9-]+)*$'}
      kinds:
        type: array
        uniqueItems: true
        description: The trigger kinds of the features this back end holds (api, webhooks, realtime, saga, reactors, jobs, cli); each declared kind has at least one feature, every kind in use is declared, and the patterns and platform capabilities of each kind exist.
        items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      patterns:
        type: array
        uniqueItems: true
        description: The design patterns this side applies (event-bus, queue, fenced-job, projection, saga); each enables the opt-in slots that name it, and the checks require its proof scenarios.
        items: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      connections: true
      reads:
        type: array
        uniqueItems: true
        description: The paths of the other side this side reads (the front end reads be/contracts/ for its codegen); nothing else crosses sides.
        items: {type: string, minLength: 1}
