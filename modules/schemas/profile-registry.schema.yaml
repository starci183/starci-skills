$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/profile-registry.schema.json
title: StarCi profile registry
type: object
required: [schema, runtimes, aliases, executionModel, defaults, targets, skills, operators, fallback]
properties:
  schema: {const: starci/profile-registry@1}
  runtimes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  aliases:
    type: object
    additionalProperties: {type: string, minLength: 1}
  executionModel:
    type: object
    additionalProperties: false
    required: [levels, host, chat, workflowKernel, kernelAuthority, operationAgent, operationMapping, isolationBoundary, worktree, scheduling, fanOutWithinOperation, concreteAgentBinding, concurrency]
    properties:
      levels:
        const: [workflow-kernel, operation-agent]
      host: {const: orca}
      chat: {const: trigger-and-monitor-only}
      workflowKernel: {const: one-long-lived-agent-per-workflow}
      kernelAuthority: {const: sole-workflow-state-writer-through-scripts/kernel/api.mjs}
      operationAgent: {const: one-ephemeral-agent-per-job}
      operationMapping: {const: one-operation-instance-one-agent}
      isolationBoundary: {const: operation}
      worktree: {const: isolated-child-per-job}
      scheduling: {const: dependency-dag}
      fanOutWithinOperation: {const: forbidden}
      concreteAgentBinding: {const: provider-profile-model}
      # A pointer, never a number: the slot counts live in runtimes.yaml, which
      # is the only file scripts/kernel/api.mjs and scripts/agent/models.mjs read
      # for capacity.
      concurrency: {type: string, minLength: 1}
  defaults: {type: object}
  targets:
    type: object
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/target"}
  skills: {type: object}
  targetAliases:
    type: object
    additionalProperties: {type: string, minLength: 1}
  operators:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [skill, chain, environments]
      properties:
        skill: {type: string, minLength: 1}
        chain:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        environments:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [environment, profiles]
            properties:
              environment: {type: string, minLength: 1}
              profiles:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
  fallback:
    type: object
    additionalProperties: false
    required: [allowedReasons, requiredEffectState, blockedReasons]
    properties:
      allowedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      requiredEffectState: {const: none}
      blockedReasons:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
$defs:
  model:
    type: [string, "null"]
    minLength: 1
  target:
    type: object
    additionalProperties: false
    required: [runtime, profiles, requestedModel, orcaLaunch]
    properties:
      runtime: {type: string, minLength: 1}
      profiles:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          working: {type: string, minLength: 1}
          reasoning: {type: string, minLength: 1}
      requestedModel: {$ref: "#/$defs/model"}
      executionHosts:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [orca]
      orcaLaunch:
        oneOf:
          - type: object
            additionalProperties: false
            required: [kind, agent]
            properties:
              kind: {const: managed-agent}
              agent: {type: string, minLength: 1}
              startup:
                enum: [direct-native-worker-start]
              modelAuthority:
                enum: [verified-qwen-runtime-configuration]
              supervision:
                enum: [worker-start-agent]
          - type: object
            additionalProperties: false
            required: [kind, command, dispatch, adapter, nestedAgents]
            properties:
              kind: {const: command-terminal}
              command: {type: string, minLength: 1}
              reasoningCommand: {type: string, minLength: 1}
              dispatch: {const: return-preamble-and-send}
              adapter: {type: string, minLength: 1}
              nestedAgents: {const: forbidden}
              capacityGate: {const: explicit-workflow-quota}
