$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:metadata:1
description: Canonical Work metadata is authored as YAML 1.2. Work stores its records in
  index.yaml, keeps source provenance inline, and keeps every structured record in YAML, including a
  collocated disposable UAT accounts.yaml fixture.
oneOf:
  - $ref: "#/$defs/workspace"
  - $ref: "#/$defs/resource"
  - $ref: "#/$defs/evidence"
$defs:
  string:
    type: string
    minLength: 1
    description: Reusable nonempty prose value.
  id:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    description: Stable graph identifier used by dependencies and digest propagation; example login.business.
  digest:
    type: string
    pattern: ^[a-f0-9]{64}$
    description: Lowercase SHA-256 digest binding current semantic inputs.
  commit:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit
    properties:
      repository:
        $ref: "#/$defs/id"
        description: Direct repository name or path; example nivo-backend.
      commit:
        type: string
        pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
  workspace:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
    properties:
      schema:
        const: work/workspace@1
        description: Workspace format discriminator.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      extensions:
        type: object
  resourceFile:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        $ref: "#/$defs/string"
        description: Repository-relative source or evidence path.
  resource:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - kind
      - owner
      - revision
      - details
    properties:
      schema:
        const: work/resource@1
        description: Resource format discriminator; canonical Work uses direct provenance.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      kind:
        $ref: "#/$defs/string"
        description: Owner category such as business, architecture, implementation or uat.
      owner:
        $ref: "#/$defs/string"
        description: Service or team that owns the data.
      revision:
        $ref: "#/$defs/string"
        description: Exact inspected or implemented revision.
      details:
        type: object
      files:
        type: array
        items:
          $ref: "#/$defs/resourceFile"
        description: Relevant source files.
      extensions:
        type: object
  sourceIdentity:
    type: object
    additionalProperties: false
    required:
      - schema
      - repositories
    properties:
      schema:
        const: starci/source-identity@1
      repositories:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - repository
            - origin
            - state
            - coverage
          oneOf:
            - properties:
                state:
                  const: committed
              required:
                - commit
              not:
                anyOf:
                  - required:
                      - baseCommit
                  - required:
                      - snapshot
            - properties:
                state:
                  const: dirty
              required:
                - baseCommit
                - snapshot
              not:
                required:
                  - commit
          properties:
            repository:
              $ref: "#/$defs/id"
            origin:
              type: string
              minLength: 1
            state:
              enum:
                - committed
                - dirty
            commit:
              type: string
              pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
            baseCommit:
              type: string
              pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
            snapshot:
              type: object
              additionalProperties: false
              required:
                - artifact
                - sha256
              properties:
                artifact:
                  type: string
                  minLength: 1
                sha256:
                  $ref: "#/$defs/digest"
            coverage:
              type: object
              additionalProperties: false
              required:
                - kind
                - paths
                - dependencyCoverage
                - limitations
              properties:
                kind:
                  enum:
                    - full-tree
                    - scoped
                paths:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                dependencyCoverage:
                  type: string
                  minLength: 1
                limitations:
                  type: array
                  items:
                    type: string
                    minLength: 1
    description: Direct tested source identity; dirty snapshots must be preserved as hashed evidence
      assets, never represented by HEAD alone. This is declared identity, not independent execution
      proof.
  stringList:
    type: array
    items:
      $ref: "#/$defs/string"
  outcome:
    enum:
      - pass
      - fail
      - not-run
      - inconclusive
  assertion:
    type: object
    additionalProperties: false
    required:
      - id
      - outcome
      - observation
    properties:
      id:
        $ref: "#/$defs/string"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      outcome:
        $ref: "#/$defs/outcome"
      observation:
        $ref: "#/$defs/string"
      kind:
        type: string
        description: Owner category such as business, architecture, implementation or uat.
  asset:
    type: object
    additionalProperties: false
    required:
      - path
      - sha256
    properties:
      path:
        $ref: "#/$defs/string"
        description: Repository-relative source or evidence path.
      sha256:
        $ref: "#/$defs/digest"
      scope:
        enum:
          - evidence
          - node
        description: "Default evidence: relative to manifest directory. node: path must be within the
          primary evidence owner node assets/ directory."
  servedVersion:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit
      - artifact
    properties:
      repository:
        $ref: "#/$defs/commit/properties/repository"
        description: Direct repository name or path; example nivo-backend.
      commit:
        $ref: "#/$defs/commit/properties/commit"
      artifact:
        $ref: "#/$defs/string"
  provenance:
    type: object
    additionalProperties: false
    required:
      - environment
      - servedVersions
      - tool
      - capturedAt
      - servedVersionEvidence
    properties:
      environment:
        $ref: "#/$defs/id"
        description: Direct UAT environment label and URL; do not point through resource IDs.
      actor:
        $ref: "#/$defs/id"
        description: Person or system performing this step.
      anonymous:
        const: true
      servedVersions:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/servedVersion"
      tool:
        $ref: "#/$defs/string"
      capturedAt:
        type: string
        format: date-time
      servedVersionEvidence:
        $ref: "#/$defs/string"
    oneOf:
      - required:
          - actor
        not:
          required:
            - anonymous
      - required:
          - anonymous
        not:
          required:
            - actor
  evidenceBinding:
    type: object
    additionalProperties: false
    required:
      - nodeId
      - inputDigest
    properties:
      nodeId:
        $ref: "#/$defs/id"
      inputDigest:
        $ref: "#/$defs/digest"
        description: SHA-256 binding of this node specification, ancestor context, dependencies and
          referenced inputs; mismatch makes authored done effectively uninvestigate.
  evidence:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
    properties:
      schema:
        const: work/evidence@1
        description: YAML evidence manifest format discriminator.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      nodeId:
        $ref: "#/$defs/id"
      inputDigest:
        $ref: "#/$defs/digest"
        description: SHA-256 binding of this node specification, ancestor context, dependencies and
          referenced inputs; mismatch makes authored done effectively uninvestigate.
      bindings:
        type: array
        items:
          $ref: "#/$defs/evidenceBinding"
      outcome:
        $ref: "#/$defs/outcome"
      assertions:
        type: array
        items:
          $ref: "#/$defs/assertion"
      assets:
        type: array
        items:
          $ref: "#/$defs/asset"
      proof:
        type: object
        additionalProperties: false
        required:
          - boundary
        properties:
          boundary:
            enum:
              - api
              - live
            description: "What this run actually exercised: api is the product's own surface on a real
              stack, live is the outside system itself. e2e.verify writes api, integration.verify writes
              live."
          fakes:
            $ref: "#/$defs/stringList"
            description: The declared integration ids this run did not call for real - each one it mocked,
              stubbed, recorded or pointed at a local double. A live proof names none. An integration whose
              only evidence lists it here is proven against a fake, not live.
        description: What the evidence was proven against. An evidence record that carries no proof block
          makes no claim about the boundary it ran at; one that does is binding.
      provenance:
        $ref: "#/$defs/provenance"
      sourceIdentity:
        $ref: "#/$defs/sourceIdentity"
      codeRefs:
        type: array
        items:
          $ref: "#/$defs/commit"
        description: Exact repository commits covered by completion.
      extensions:
        type: object
    description: Relative YAML, image or video evidence paths that support the result.