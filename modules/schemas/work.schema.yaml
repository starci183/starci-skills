$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:metadata:1
description: Canonical Work metadata is authored as YAML 1.2. Work stores active nodes in
  index.yaml, keeps source provenance inline, and keeps every structured record in YAML, including a
  collocated disposable UAT accounts.yaml fixture.
oneOf:
  - $ref: "#/$defs/workspace"
  - $ref: "#/$defs/node"
  - $ref: "#/$defs/resource"
  - $ref: "#/$defs/evidence"
$defs:
  string:
    type: string
    minLength: 1
    description: Reusable nonempty prose value.
  id:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    description: Stable graph identifier used by dependencies and digest propagation; example login.business.
  digest:
    type: string
    pattern: ^[a-f0-9]{64}$
    description: Lowercase SHA-256 digest binding current semantic inputs.
  ids:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/id"
    description: Unique stable Work IDs used for graph edges.
  commit:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit
    properties:
      repository:
        $ref: "#/$defs/id"
        description: Direct repository name or path; example nivo-backend.
      commit:
        type: string
        pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
  workspace:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
    properties:
      schema:
        const: work/workspace@1
        description: Workspace format discriminator.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      extensions:
        type: object
  resourceFile:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        $ref: "#/$defs/string"
        description: Repository-relative source or evidence path.
  resource:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - kind
      - owner
      - revision
      - details
    properties:
      schema:
        const: work/resource@1
        description: Resource format discriminator; canonical Work uses direct provenance.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      kind:
        $ref: "#/$defs/string"
        description: Owner category such as business, architecture, implementation or uat.
      owner:
        $ref: "#/$defs/string"
        description: Service or team that owns the data.
      revision:
        $ref: "#/$defs/string"
        description: Exact inspected or implemented revision.
      details:
        type: object
      files:
        type: array
        items:
          $ref: "#/$defs/resourceFile"
        description: Relevant source files.
      extensions:
        type: object
  sourceIdentity:
    type: object
    additionalProperties: false
    required:
      - schema
      - repositories
    properties:
      schema:
        const: starci/source-identity@1
      repositories:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - repository
            - origin
            - state
            - coverage
          oneOf:
            - properties:
                state:
                  const: committed
              required:
                - commit
              not:
                anyOf:
                  - required:
                      - baseCommit
                  - required:
                      - snapshot
            - properties:
                state:
                  const: dirty
              required:
                - baseCommit
                - snapshot
              not:
                required:
                  - commit
          properties:
            repository:
              $ref: "#/$defs/id"
            origin:
              type: string
              minLength: 1
            state:
              enum:
                - committed
                - dirty
            commit:
              type: string
              pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
            baseCommit:
              type: string
              pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
            snapshot:
              type: object
              additionalProperties: false
              required:
                - artifact
                - sha256
              properties:
                artifact:
                  type: string
                  minLength: 1
                sha256:
                  $ref: "#/$defs/digest"
            coverage:
              type: object
              additionalProperties: false
              required:
                - kind
                - paths
                - dependencyCoverage
                - limitations
              properties:
                kind:
                  enum:
                    - full-tree
                    - scoped
                paths:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                dependencyCoverage:
                  type: string
                  minLength: 1
                limitations:
                  type: array
                  items:
                    type: string
                    minLength: 1
    description: Direct tested source identity; dirty snapshots must be preserved as hashed evidence
      assets, never represented by HEAD alone. This is declared identity, not independent execution
      proof.
  completion:
    type: object
    additionalProperties: false
    required:
      - inputDigest
    oneOf:
      - required:
          - evidence
        not:
          required:
            - review
      - required:
          - review
        not:
          required:
            - evidence
    properties:
      inputDigest:
        $ref: "#/$defs/digest"
        description: SHA-256 binding of this node specification, ancestor context, dependencies and
          referenced inputs; mismatch makes authored done effectively uninvestigate.
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/id"
        description: Relative YAML, image or video evidence paths that support the result.
      review:
        $ref: "#/$defs/designReview"
      sourceIdentity:
        $ref: "#/$defs/sourceIdentity"
      codeRefs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/commit"
        description: Exact repository commits covered by completion.
    description: Historical proof binding for authored done. Digest mismatch makes effective state
      uninvestigate without rewriting this receipt.
  designReview:
    type: object
    additionalProperties: false
    required:
      - schema
      - reviewer
      - authority
      - reviewedAt
      - observations
      - limitations
    properties:
      schema:
        const: starci/design-review@1
      reviewer:
        $ref: "#/$defs/string"
      authority:
        $ref: "#/$defs/string"
        description: Actual user or delegated review provenance, not an authenticated receipt supplied by
          the validator.
      reviewedAt:
        type: string
        format: date-time
      observations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - outcome
            - observation
          properties:
            id:
              $ref: "#/$defs/id"
            outcome:
              enum:
                - pass
                - fail
                - not-run
                - inconclusive
            observation:
              $ref: "#/$defs/string"
      limitations:
        type: array
        items:
          $ref: "#/$defs/string"
    description: Collocated review of current SRS/SDS or business overview only; never substitutes for
      implementation tests, UI captures or UAT execution.
  stringList:
    type: array
    items:
      $ref: "#/$defs/string"
  integrationDeclaration:
    type: object
    additionalProperties: false
    required:
      - id
      - provider
      - credential
    properties:
      id:
        $ref: "#/$defs/id"
        description: Stable id of this external system inside the product; the integration node that proves
          it lives at features/<feature>/integration/<id>/index.yaml and the evidence of any proof that
          fakes it names this same id in proof.fakes.
      provider:
        $ref: "#/$defs/string"
        description: The outside system itself, as the product names it; example telegram-bot-api.
      credential:
        type: object
        additionalProperties: false
        required:
          - name
          - providedBy
          - custody
        properties:
          name:
            $ref: "#/$defs/string"
            description: The exact variable name the code reads at the moment of use. The name only; a
              credential value is never written into a record, a report, a log or a chat.
          providedBy:
            const: owner
            description: A credential is the owner's. The runtime asks for it by name and never invents,
              stubs, defaults or silently skips one.
          custody:
            $ref: "#/$defs/string"
            pattern: "^identity:[a-z0-9]+([-_.][a-z0-9]+)*$"
            description: "identity:<slug> - the encrypted identity resource of this Work tree that holds the
              value (see identityResource). That is the only custody a credential has: an environment
              variable belongs to whichever terminal exported it, is gone on the next machine, and the tree
              cannot say who set it."
          where:
            $ref: "#/$defs/string"
            description: "A place the value was set. It is not a custody; `custody` is required."
      sandbox:
        $ref: "#/$defs/string"
        description: The provider's own test or sandbox endpoint the live proof runs against, when it
          offers one.
    description: "One external system a business (SRS) or design (SDS) record declares as data under
      extensions.work3.integrations[]. The declaration is what makes the integration a record: the tree
      owes it one integration node, that node walks integration.verify against the real provider, and an
      evidence manifest that only fakes it is read as proven against a fake, not live."
  identityResource:
    type: object
    description: "The custody of a credential, at .starciwork/_resources/identity/<slug>/resource.yaml
      (schema work/resource@1, kind identity) beside secrets.enc.yaml. The resource record is readable and
      carries the alias the product calls this identity by, the subject on the provider (the account, the
      sender, the merchant - the WHO, never the what), the role it is allowed to play, and the variable
      NAMES it holds. It never carries a value: every value lives in secrets.enc.yaml, encrypted with sops
      under the host's own age or GPG key (the product repositories already carry a .sops.yaml), and is read
      only at the moment of use - `sops exec-env <secrets.enc.yaml> '<command>'` - so it exists inside one
      process and is never copied into a file, a log, a report or a contract. An operation that cannot reach
      sops, the key or the resource reports blocked environment naming the slug and the variable; it never
      invents, stubs or defaults a value, and it never prints one."
  sourceRef:
    type: object
    additionalProperties: false
    required:
      - repository
      - revision
      - path
      - observation
    properties:
      repository:
        $ref: "#/$defs/id"
        description: Direct repository name or path; example nivo-backend.
      revision:
        type: string
        pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        description: Exact inspected or implemented full lowercase Git SHA (40 or 64 hex characters).
      path:
        type: string
        minLength: 1
        pattern: ^(?=.*\S)(?!/)(?!.*[\\:\x00-\x1f])(?!(?:.*/)?\.{1,2}(?:/|$))[^/]+(?:/[^/]+)*$
        description: Normalized repository-relative source or evidence path using forward slashes; no
          absolute paths, traversal, empty segments, backslashes, drive/stream colon or control
          characters.
      lineRange:
        $ref: "#/$defs/string"
        description: Optional source line span, for example 40-58.
      symbol:
        $ref: "#/$defs/string"
        description: Class, function, route or component name.
      observation:
        $ref: "#/$defs/string"
    description: Direct source observation at an exact repository revision and path; no resource
      manifest is involved. Each observed structured specification source binds to an entry on its
      owning node by repository, path and revision.
  businessSpec:
    type: object
    additionalProperties: false
    required:
      - module
      - purpose
      - scope
      - actors
      - functionalRequirements
      - dataAndStates
      - flows
      - businessRules
      - nonFunctionalRequirements
      - acceptanceCriteria
      - unresolvedQuestions
      - inputsOutputs
      - aiAuthority
      - exceptions
    properties:
      module:
        $ref: "#/$defs/string"
        description: Human module name; example Login.
      purpose:
        $ref: "#/$defs/string"
        description: Why the module exists and the user or business outcome it serves.
      scope:
        type: object
        additionalProperties: false
        required:
          - included
          - excluded
        properties:
          included:
            $ref: "#/$defs/stringList"
            description: Behaviors and responsibilities inside this module.
          excluded:
            $ref: "#/$defs/stringList"
            description: Nearby concerns intentionally outside this module.
        description: Boundary of the SRS; list what is included and explicitly excluded.
      actors:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - responsibilities
            - rights
            - restrictions
          properties:
            name:
              $ref: "#/$defs/string"
              description: Short stable human name.
            responsibilities:
              $ref: "#/$defs/stringList"
              description: What the actor must do in this module.
            rights:
              $ref: "#/$defs/stringList"
              description: What the actor is allowed to do.
            restrictions:
              $ref: "#/$defs/stringList"
              description: What the actor must not do or conditions that limit access.
        description: People or systems that interact with the module.
      functionalRequirements:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - title
            - behavior
          properties:
            title:
              $ref: "#/$defs/string"
              description: Short requirement label.
            behavior:
              $ref: "#/$defs/string"
              description: Observable behavior the system must provide.
        description: Required observable module behaviors, one compact title and behavior per item.
      dataAndStates:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - subject
            - states
            - rules
          properties:
            subject:
              $ref: "#/$defs/string"
              description: Business entity or concept whose state is described.
            states:
              $ref: "#/$defs/stringList"
              description: Allowed business states for the subject.
            rules:
              $ref: "#/$defs/stringList"
              description: Constraints, transitions or invariants that govern the subject.
        description: Business data subjects, allowed states and transition rules.
      flows:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - preconditions
            - steps
            - alternatives
            - errors
            - postconditions
          properties:
            name:
              $ref: "#/$defs/string"
              description: Short stable human name.
            preconditions:
              $ref: "#/$defs/stringList"
              description: Facts that must hold before the flow starts.
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - actor
                  - action
                  - systemResponse
                properties:
                  actor:
                    $ref: "#/$defs/string"
                    description: Person or system performing this step.
                  action:
                    $ref: "#/$defs/string"
                    description: Action performed during the flow or UAT step.
                  systemResponse:
                    $ref: "#/$defs/string"
                    description: Observable response required from the system.
              description: Ordered interactions or design actions.
            alternatives:
              $ref: "#/$defs/stringList"
              description: Valid alternate paths through the flow.
            errors:
              $ref: "#/$defs/stringList"
              description: Expected error cases and required handling.
            postconditions:
              $ref: "#/$defs/stringList"
              description: Facts that must hold after successful completion.
        description: End-to-end business journeys with preconditions, steps and outcomes.
      businessRules:
        $ref: "#/$defs/stringList"
        description: Cross-flow business constraints and invariants.
      nonFunctionalRequirements:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - quality
            - observableCriterion
            - verification
          properties:
            quality:
              $ref: "#/$defs/string"
              description: Quality concern such as security, accessibility or latency.
            observableCriterion:
              $ref: "#/$defs/string"
              description: Measurable or directly observable success condition.
            verification:
              $ref: "#/$defs/string"
              description: How the criterion or implementation change is checked.
        description: Quality requirements expressed as observable criteria with a verification method;
          unknown targets must be stated as unresolved rather than invented.
      acceptanceCriteria:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - given
            - when
            - then
          properties:
            given:
              $ref: "#/$defs/string"
              description: Initial context.
            when:
              $ref: "#/$defs/string"
              description: Triggering action.
            then:
              $ref: "#/$defs/string"
              description: Required observable result.
        description: Behavior acceptance in Given/When/Then form.
      unresolvedQuestions:
        $ref: "#/$defs/stringList"
        description: Unknowns that require a person or source to resolve.
      inputsOutputs:
        type: object
        additionalProperties: false
        required:
          - inputs
          - outputs
        description: Business inputs accepted and outputs produced at the module boundary.
        properties:
          inputs:
            $ref: "#/$defs/stringList"
            description: Required business information or triggers entering the module.
          outputs:
            $ref: "#/$defs/stringList"
            description: Observable business results emitted by the module.
      aiAuthority:
        type: object
        additionalProperties: false
        required:
          - allowed
          - requiresHumanDecision
        description: Explicit boundary between actions the AI system/service may perform and decisions
          reserved for a person.
        properties:
          allowed:
            $ref: "#/$defs/stringList"
            description: Actions the AI system/service is authorized to perform without impersonating a user.
          requiresHumanDecision:
            $ref: "#/$defs/stringList"
            description: Business decisions that require an accountable person.
      exceptions:
        $ref: "#/$defs/stringList"
        description: Exceptional business cases that alter the normal flow; keep exclusions in scope.excluded.
    description: "Module SRS: business outcome, scope, behavior, rules, quality and acceptance; it
      defines what is needed."
  architectureSpec:
    type: object
    additionalProperties: false
    required:
      - status
      - target
      - observations
      - gaps
    properties:
      status:
        enum:
          - observed
          - proposed
          - mixed
        description: Whether the record describes observed current behavior, proposed target behavior, or a
          mixture.
      target:
        type: object
        additionalProperties: false
        required:
          - style
          - serviceOwner
          - callChain
          - contracts
          - dataOwnership
          - transactionBoundary
          - concurrencyControls
          - securityControls
          - schema
          - migrationRequirements
          - configuration
          - recovery
        properties:
          style:
            $ref: "#/$defs/string"
            description: Architectural style used by the module.
          serviceOwner:
            $ref: "#/$defs/string"
            description: Service or bounded context accountable for the behavior.
          callChain:
            $ref: "#/$defs/stringList"
            description: Ordered runtime call path.
          contracts:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - type
                - errors
              properties:
                name:
                  $ref: "#/$defs/string"
                  description: Short stable human name.
                type:
                  $ref: "#/$defs/string"
                  description: Contract category.
                input:
                  $ref: "#/$defs/string"
                  description: Input payload or precondition.
                output:
                  $ref: "#/$defs/string"
                  description: Success output.
                errors:
                  $ref: "#/$defs/stringList"
                  description: Expected error cases and required handling.
            description: Commands, queries, events or APIs exchanged at boundaries.
          dataOwnership:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - store
                - owner
                - entities
              properties:
                store:
                  $ref: "#/$defs/string"
                  description: Database, cache or external system.
                owner:
                  $ref: "#/$defs/string"
                  description: Service or team that owns the data.
                entities:
                  $ref: "#/$defs/stringList"
                  description: Owned records or aggregates.
            description: Stores and entities owned by each service.
          transactionBoundary:
            $ref: "#/$defs/string"
            description: Where atomic work starts and ends.
          concurrencyControls:
            $ref: "#/$defs/stringList"
            description: Idempotency, locking, versioning or ordering controls.
          securityControls:
            $ref: "#/$defs/stringList"
            description: Authentication, authorization and data protection controls.
          saga:
            type: object
            additionalProperties: false
            required:
              - required
              - coordinator
              - steps
              - gaps
            properties:
              required:
                const: true
                description: Whether this node must complete for its parent to complete.
              coordinator:
                $ref: "#/$defs/string"
                description: Component coordinating the Saga.
              steps:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - command
                    - successEvent
                    - compensation
                  properties:
                    command:
                      $ref: "#/$defs/string"
                      description: Command issued for this Saga step.
                    successEvent:
                      $ref: "#/$defs/string"
                      description: Event proving the Saga step succeeded.
                    compensation:
                      $ref: "#/$defs/string"
                      description: Action that reverses or mitigates a failed step.
                description: Ordered interactions or design actions.
              gaps:
                $ref: "#/$defs/stringList"
                description: Explicit differences between current implementation and the required target; never
                  present a gap as already implemented.
            description: Optional selected saga design; concrete mechanisms are required when present.
          cqrs:
            type: object
            additionalProperties: false
            required:
              - required
              - commands
              - queries
              - events
              - gaps
            properties:
              required:
                const: true
                description: Whether this node must complete for its parent to complete.
              commands:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - handler
                  properties:
                    name:
                      $ref: "#/$defs/string"
                      description: Short stable human name.
                    handler:
                      $ref: "#/$defs/string"
                      description: Code or target component responsible for handling the operation.
                description: CQRS write operations and their handlers.
              queries:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - handler
                  properties:
                    name:
                      $ref: "#/$defs/string"
                      description: Short stable human name.
                    handler:
                      $ref: "#/$defs/string"
                      description: Code or target component responsible for handling the operation.
                    readModel:
                      $ref: "#/$defs/string"
                      description: Read model used by a query when applicable.
                description: CQRS read operations and their handlers.
              events:
                $ref: "#/$defs/stringList"
                description: Domain or integration events emitted or consumed.
              gaps:
                $ref: "#/$defs/stringList"
                description: Explicit differences between current implementation and the required target; never
                  present a gap as already implemented.
            description: Optional selected cqrs design; concrete mechanisms are required when present.
          schema:
            $ref: "#/$defs/stringList"
            description: Current target data schema, constraints and compatibility requirements.
          migrationRequirements:
            $ref: "#/$defs/stringList"
            description: Required data or contract migration behavior; say none when no migration applies.
          configuration:
            $ref: "#/$defs/stringList"
            description: Runtime configuration and environment inputs needed by the target design, excluding
              secret values.
          recovery:
            $ref: "#/$defs/stringList"
            description: Retry, rollback, compensation and operational recovery behavior.
        description: Intended SDS design; it may exceed current implementation when gaps say so explicitly.
      observations:
        $ref: "#/$defs/stringList"
        description: Verified facts about current behavior, backed by sourceRefs where applicable.
      gaps:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - requirement
            - current
            - target
            - impact
          properties:
            requirement:
              $ref: "#/$defs/string"
              description: Business or technical need affected by the gap.
            current:
              $ref: "#/$defs/string"
              description: Observed current behavior.
            target:
              $ref: "#/$defs/string"
              description: Intended SDS design; it may exceed current implementation when gaps say so explicitly.
            impact:
              $ref: "#/$defs/string"
              description: Consequence of leaving the gap unresolved.
        description: Explicit differences between current implementation and the required target; never
          present a gap as already implemented.
    description: "Module SDS: target technical design, observed facts and explicit gaps. Named pattern
      designs are optional and must be concrete when selected."
  implementationSpec:
    type: object
    additionalProperties: false
    required:
      - status
      - changes
      - gaps
    properties:
      status:
        enum:
          - observed
          - proposed
          - mixed
        description: Whether the record describes observed current behavior, proposed target behavior, or a
          mixture.
      changes:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - what
            - why
            - repository
            - directory
            - revision
            - verification
          properties:
            what:
              $ref: "#/$defs/string"
              description: What changed or must change.
            why:
              $ref: "#/$defs/string"
              description: Reason the change is needed.
            repository:
              $ref: "#/$defs/id"
              description: Direct repository name or path; example nivo-backend.
            directory:
              $ref: "#/$defs/string"
              description: Owning source directory.
            files:
              $ref: "#/$defs/stringList"
              description: Optional targeted source anchors when useful; do not duplicate the changed-file
                inventory already available from the bound Git diff.
            revision:
              $ref: "#/$defs/string"
              description: Exact inspected or implemented revision.
            verification:
              $ref: "#/$defs/stringList"
              description: How the criterion or implementation change is checked.
        description: Concrete implemented or planned code changes with source and verification.
      currentCodeMap:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - componentRef
            - layer
            - symbol
            - path
            - responsibility
          properties:
            componentRef:
              $ref: "#/$defs/id"
              description: Logical starci/sds-component@1 ID implemented by this source mapping.
            layer:
              $ref: "#/$defs/string"
              description: Application, domain, infrastructure or UI layer.
            symbol:
              $ref: "#/$defs/string"
              description: Class, function, route or component name.
            path:
              $ref: "#/$defs/string"
              description: Repository-relative source or evidence path.
            responsibility:
              $ref: "#/$defs/string"
              description: What the mapped code currently does.
        description: Optional focused mapping from logical SDS component IDs to actual source;
          not a required inventory of files or symbols.
      gaps:
        $ref: "#/$defs/stringList"
        description: Explicit differences between current implementation and the required target; never
          present a gap as already implemented.
    description: Concrete current or planned code mapping, revisions, verification and remaining gaps.
  uatSpec:
    type: object
    additionalProperties: false
    required:
      - status
      - environment
      - localFiles
      - scenarios
      - gaps
    properties:
      status:
        enum:
          - not-run
          - historical
          - planned
          - observed
          - mixed
        description: Whether the record describes observed current behavior, proposed target behavior, or a
          mixture.
      environment:
        type: object
        additionalProperties: false
        required:
          - name
          - url
        properties:
          name:
            $ref: "#/$defs/string"
            description: Short stable human name.
          url:
            $ref: "#/$defs/string"
            description: Direct local or approved test URL.
        description: Direct UAT environment label and URL; do not point through resource IDs.
      localFiles:
        type: object
        additionalProperties: false
        required:
          - accounts
        properties:
          accounts:
            const: accounts.yaml
            description: Disposable local human login fixtures for this flow.
          fixtures:
            const: fixtures.yaml
            description: Optional concrete YAML input data used by the flow.
          seedScript:
            const: seed.sql
            description: Optional useful SQL seed script; never create a placeholder.
          cleanupScript:
            const: cleanup.sql
            description: Optional useful SQL cleanup script that reverses seeded data.
        description: Files collocated with this UAT flow; accounts.yaml is the sole JSON exception and
          scripts are optional.
      scenarios:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - actor
            - preconditions
            - data
            - steps
            - evidence
            - cleanup
            - uxValidated
            - result
          properties:
            name:
              $ref: "#/$defs/string"
              description: Short stable human name.
            actor:
              $ref: "#/$defs/string"
              description: User or system role whose behavior the UAT scenario exercises. The test runner is not
                this identity, and the schema does not prescribe product authorization design.
            preconditions:
              $ref: "#/$defs/stringList"
              description: Facts that must hold before the flow starts.
            data:
              $ref: "#/$defs/string"
              description: Compact YAML text describing scenario input; secrets belong only in the declared
                disposable accounts fixture.
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - order
                  - action
                  - expected
                properties:
                  order:
                    type: integer
                    description: Positive execution order within the scenario.
                    minimum: 1
                  action:
                    $ref: "#/$defs/string"
                    description: Action performed during the flow or UAT step.
                  expected:
                    $ref: "#/$defs/string"
                    description: Observable result for this action.
              description: Ordered interactions or design actions.
            evidence:
              $ref: "#/$defs/stringList"
              description: Relative YAML, image or video evidence paths that support the result.
            cleanup:
              $ref: "#/$defs/stringList"
              description: Steps needed to remove disposable test data.
            uxValidated:
              type: boolean
              description: Whether a person actually assessed the user experience.
            result:
              enum:
                - pass
                - fail
                - not-run
                - inconclusive
              description: "Observed result: pass, fail, not-run or inconclusive."
        description: Executable UAT scenarios for this flow.
      gaps:
        $ref: "#/$defs/stringList"
        description: Explicit differences between current implementation and the required target; never
          present a gap as already implemented.
    description: One executable UAT flow with direct environment details, collocated fixture paths,
      steps, evidence and observed result.
  reconciliationRow:
    type: object
    additionalProperties: false
    required:
      - case
      - record
    properties:
      case:
        enum:
          - reference
          - conflict
          - new
        description: "Which of the three reconciliation cases this row is. reference: the decided record
          already holds what this feature repeats, so it is cited by id and never restated. conflict: this
          feature cannot hold together with what that record decided, so it is neither overwritten nor
          averaged - a decision record under this feature states both sides and the owner answers it. new:
          no decided record covers it, so it is authored under this feature."
      record:
        $ref: "#/$defs/id"
        description: The record this row is about - the decided record of another feature for reference and
          conflict, and the newly authored record of this feature for new.
      decision:
        $ref: "#/$defs/id"
        description: Required by a conflict row - the todo decision record authored under this feature that
          states both sides, the consequences, the numbered options and one recommendation. The kernel puts
          it to the owner and the workflow does not finish over an unanswered one.
      reads:
        $ref: "#/$defs/ids"
        description: Declared by a new row - the decided records it rests on, each of a record kind its own
          record kind is derived from.
      hands:
        $ref: "#/$defs/ids"
        description: Declared by a new row - the records of this feature it hands work on to.
      detail:
        $ref: "#/$defs/string"
        description: One line saying what this feature shares with, conflicts with, or adds beyond the
          named record; it is the claim the validator judges the row against.
    description: One typed row of a feature's reconciliation against the records the product already decided.
      The list of these rows lives at extensions.work3.reconciliation of the feature's module record; the
      kernel checks it mechanically when an intake reports done and before the validator reads it.
  node:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - kind
      - required
    properties:
      schema:
        enum:
          - work/node@1
        description: Format and version discriminator; canonical index.yaml nodes carry work/node@1.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      kind:
        $ref: "#/$defs/string"
        description: Owner category such as business, architecture, implementation, uat, e2e or
          integration. An integration node carries the live proof of one system its feature's records
          declared under extensions.work3.integrations.
      required:
        type: boolean
        description: Whether this node must complete for its parent to complete.
      state:
        enum:
          - uninvestigate
          - todo
          - doing
          - blocked
          - done
          - na
          - suspended
        x-operational: true
        description: "Authored leaf state: uninvestigate for unconfirmed generated/imported content, todo
          for defined work, or done with bound proof."
      refs:
        $ref: "#/$defs/ids"
        description: Other technical node IDs used as context; resource indirection is not canonical Work.
      dependsOn:
        $ref: "#/$defs/ids"
        description: Technical prerequisite node IDs whose semantic changes invalidate this node.
      assertions:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/string"
      completion:
        $ref: "#/$defs/completion"
        x-operational: true
        description: Proof binding for authored done; retain stale proof historically and rebind only after
          relevant verification.
      blocker:
        $ref: "#/$defs/string"
        x-operational: true
      suspensionReason:
        $ref: "#/$defs/string"
        x-operational: true
      naReason:
        $ref: "#/$defs/string"
      timestamps:
        type: object
        x-operational: true
      createdAt:
        type: string
        x-operational: true
      updatedAt:
        type: string
        x-operational: true
      extensions:
        type: object
        description: "Free-form namespaced payloads the validator preserves and hashes but does not
          constrain, so a runtime adds keys here without a schema change. The runtime authors these under
          work3: extensions.work3.integrations is a list of integrationDeclaration entries - every external
          system this record talks to, its provider, the exact credential variable the owner provides and
          the sandbox a live proof runs against; extensions.work3.reconciliation is the list of
          reconciliationRow entries a feature module record carries after an intake, one row per decided
          record the feature touches, checked by the kernel itself; extensions.work3.checks and
          extensions.work3.allowlist are what the kernel may launch the node with;
          extensions.work3.decisionLog is the append-only revise log, shaped by the decisionLog $defs entry
          of the flat work-*.schema.yaml family schemas, where a revise operation writes it; and
          extensions.work3.kernel is the kernel own receipt, including the contractDigest of the kind
          declaration the proof was taken under."
      description:
        type: string
        description: Concise specification prose for a small unstructured node; module SRS/SDS nodes use
          their structured category instead.
      sourceRefs:
        type: array
        items:
          $ref: "#/$defs/sourceRef"
        description: Direct observed-source provenance; cite repository, exact revision, path and
          observation without resource indirection.
      business:
        $ref: "#/$defs/businessSpec"
        description: "Module SRS: defines business intent, scope, actors, behavior, states, flows, rules,
          quality criteria and acceptance."
      architecture:
        $ref: "#/$defs/architectureSpec"
        description: "Technical design for the selected scope: responsibilities, connections, storage and
          context-specific risks. Patterns are justified choices, not mandatory business
          requirements."
      implementation:
        $ref: "#/$defs/implementationSpec"
        description: "Implementation record: maps current code and concrete changes to repositories,
          revisions and verification."
      uat:
        $ref: "#/$defs/uatSpec"
        description: "UAT record: defines an executable flow, local disposable fixtures, observations,
          evidence and remaining gaps."
      assets:
        type: array
        description: Any number of semantic input files owned by this node under assets/**. Paths are
          relative to this index.yaml. Images, videos, diagrams and sample documents retain their
          original formats; current bytes bind dependent work. Execution captures are outputs, not
          semantic inputs.
        items:
          $ref: "#/$defs/nodeAsset"
      activity:
        enum:
          - idle
          - investigating
          - implementing
          - verifying
        x-operational: true
        description: Current operational activity; excluded from semantic hashes.
      blockers:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/string"
        x-operational: true
        description: Current operational blockers; they prevent completion but do not alter semantic hashes.
      investigation:
        type: object
        additionalProperties: false
        required:
          - contextDigest
        properties:
          contextDigest:
            $ref: "#/$defs/digest"
            description: Exact context digest reviewed or completed.
        x-operational: true
        description: Optional reviewed-context receipt for unconfirmed source material.
      history:
        type: array
        items:
          type: object
        x-operational: true
        description: Operational history retained without changing semantic hashes.
      ui:
        $ref: "#/$defs/uiSpec"
        description: UI design direction and owned generated assets; separate from frontend implementation
          screenshots and UAT captures.
      businessOverview:
        $ref: "#/$defs/businessOverviewSpec"
        description: Overall product intent in customer language, owned by .starciwork/business/index.yaml
          before detailed module SRS records.
      brand:
        $ref: "#/$defs/brandSpec"
        description: The product's single canonical brand record, owned by .starciwork/brand/index.yaml and
          read by every design operation. It is a decided record, not a design deliverable, and its
          rev is what invalidates frontend-facing completions.
    allOf:
      - if:
          properties:
            state:
              const: suspended
              description: "Authored leaf state: uninvestigate for unconfirmed generated/imported content, todo
                for defined work, or done with bound proof."
          required:
            - state
        then:
          required:
            - suspensionReason
      - if:
          properties:
            schema:
              const: work/node@1
              description: Canonical index.yaml node format discriminator.
          required:
            - schema
        then:
          properties:
            state:
              enum:
                - uninvestigate
                - todo
                - done
              description: "Authored leaf state: uninvestigate for unconfirmed generated/imported content, todo
                for defined work, or done with bound proof."
    description: One Work node. work/node@1 is canonical index.yaml; leaves use exactly uninvestigate,
      todo or done and parents derive state.
  outcome:
    enum:
      - pass
      - fail
      - not-run
      - inconclusive
  assertion:
    type: object
    additionalProperties: false
    required:
      - id
      - outcome
      - observation
    properties:
      id:
        $ref: "#/$defs/string"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      outcome:
        $ref: "#/$defs/outcome"
      observation:
        $ref: "#/$defs/string"
      kind:
        type: string
        description: Owner category such as business, architecture, implementation or uat.
  asset:
    type: object
    additionalProperties: false
    required:
      - path
      - sha256
    properties:
      path:
        $ref: "#/$defs/string"
        description: Repository-relative source or evidence path.
      sha256:
        $ref: "#/$defs/digest"
      scope:
        enum:
          - evidence
          - node
        description: "Default evidence: relative to manifest directory. node: path must be within the
          primary evidence owner node assets/ directory."
  servedVersion:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit
      - artifact
    properties:
      repository:
        $ref: "#/$defs/commit/properties/repository"
        description: Direct repository name or path; example nivo-backend.
      commit:
        $ref: "#/$defs/commit/properties/commit"
      artifact:
        $ref: "#/$defs/string"
  provenance:
    type: object
    additionalProperties: false
    required:
      - environment
      - servedVersions
      - tool
      - capturedAt
      - servedVersionEvidence
    properties:
      environment:
        $ref: "#/$defs/id"
        description: Direct UAT environment label and URL; do not point through resource IDs.
      actor:
        $ref: "#/$defs/id"
        description: Person or system performing this step.
      anonymous:
        const: true
      servedVersions:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/servedVersion"
      tool:
        $ref: "#/$defs/string"
      capturedAt:
        type: string
        format: date-time
      servedVersionEvidence:
        $ref: "#/$defs/string"
    oneOf:
      - required:
          - actor
        not:
          required:
            - anonymous
      - required:
          - anonymous
        not:
          required:
            - actor
  evidenceBinding:
    type: object
    additionalProperties: false
    required:
      - nodeId
      - inputDigest
    properties:
      nodeId:
        $ref: "#/$defs/id"
      inputDigest:
        $ref: "#/$defs/digest"
        description: SHA-256 binding of this node specification, ancestor context, dependencies and
          referenced inputs; mismatch makes authored done effectively uninvestigate.
  evidence:
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - nodeId
      - inputDigest
      - outcome
      - assertions
      - assets
    properties:
      schema:
        const: work/evidence@1
        description: YAML evidence manifest format discriminator.
      id:
        $ref: "#/$defs/id"
        description: Stable graph identifier used by dependencies and digest propagation; example
          login.business.
      nodeId:
        $ref: "#/$defs/id"
      inputDigest:
        $ref: "#/$defs/digest"
        description: SHA-256 binding of this node specification, ancestor context, dependencies and
          referenced inputs; mismatch makes authored done effectively uninvestigate.
      bindings:
        type: array
        items:
          $ref: "#/$defs/evidenceBinding"
      outcome:
        $ref: "#/$defs/outcome"
      assertions:
        type: array
        items:
          $ref: "#/$defs/assertion"
      assets:
        type: array
        items:
          $ref: "#/$defs/asset"
      proof:
        type: object
        additionalProperties: false
        required:
          - boundary
        properties:
          boundary:
            enum:
              - api
              - live
            description: "What this run actually exercised: api is the product's own surface on a real
              stack, live is the outside system itself. e2e.verify writes api, integration.verify writes
              live."
          fakes:
            $ref: "#/$defs/stringList"
            description: The declared integration ids this run did not call for real - each one it mocked,
              stubbed, recorded or pointed at a local double. A live proof names none. An integration whose
              only evidence lists it here is proven against a fake, not live.
        description: What the evidence was proven against. An evidence record that carries no proof block
          makes no claim about the boundary it ran at; one that does is binding.
      provenance:
        $ref: "#/$defs/provenance"
      sourceIdentity:
        $ref: "#/$defs/sourceIdentity"
      codeRefs:
        type: array
        items:
          $ref: "#/$defs/commit"
        description: Exact repository commits covered by completion.
      extensions:
        type: object
    description: Relative YAML, image or video evidence paths that support the result.
  nodeAsset:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        type: string
        pattern: ^assets/(?=[^\\:\x00-\x1f]*$)(?!(?:.*/)?\.{1,2}(?:/|$))[^/]+(?:/[^/]+)*$
        description: Node-relative file under assets/, with arbitrary nested folders. No absolute paths,
          traversal, empty segments, backslashes or control characters.
      description:
        $ref: "#/$defs/string"
        description: What this resource illustrates or supplies. A file is not a completion or verification
          claim.
  disposableAccounts:
    description: Strict accounts.yaml beside its UAT index.yaml. Only synthetic disposable local
      identities are allowed; tokens and remote credentials are forbidden.
    type: object
    additionalProperties: false
    required:
      - schema
      - disposable
      - accounts
    properties:
      schema:
        const: work/disposable-accounts@1
        description: Disposable UAT account fixture format discriminator.
      disposable:
        const: true
        description: Safety declaration that every listed identity is synthetic and may be deleted.
      accounts:
        type: array
        minItems: 1
        description: Synthetic local identities used by this UAT flow.
        items:
          type: object
          additionalProperties: false
          required:
            - role
            - username
            - password
          properties:
            role:
              $ref: "#/$defs/string"
              description: Human access role represented by this disposable local login fixture, for example
                tenant owner. It does not represent the AI runner or grant access by itself.
            username:
              $ref: "#/$defs/string"
              description: Synthetic local login name.
            password:
              $ref: "#/$defs/string"
              description: Plain password allowed only inside this disposable local fixture.
  uiSpec:
    description: UI design specification at module/ui/index.yaml or any scoped descendant under ui/.
      Each node may describe multiple screens, states and viewports, and own any number of design
      files under its own assets/**. Assets retain their actual formats; neither two filenames nor
      one image per screen is prescribed. New image-first directions carry a representative visual
      set plus a complete coverage/component/state map. Generated directions, implementation renders
      and browser UAT captures are three separate outputs.
    type: object
    additionalProperties: false
    required:
      - status
      - intent
      - surfaces
      - states
      - accessibility
      - responsive
      - assets
      - observations
      - gaps
    properties:
      status:
        enum:
          - observed
          - proposed
          - mixed
        description: Whether the UI record is observed, proposed or a clearly identified mixture.
      intent:
        $ref: "#/$defs/string"
        description: Visual and interaction direction grounded in the module SRS and SDS.
      surfaces:
        type: array
        description: Screens or surfaces governed by this design.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - route
            - purpose
            - actors
          properties:
            name:
              $ref: "#/$defs/string"
              description: Human screen name.
            route:
              $ref: "#/$defs/string"
              description: Route or entry point, for example /login.
            purpose:
              $ref: "#/$defs/string"
              description: User outcome supported by the surface.
            actors:
              $ref: "#/$defs/stringList"
              description: User or system roles that use the surface.
      states:
        type: array
        description: Visible UI states and their behavior.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - trigger
            - behavior
          properties:
            name:
              $ref: "#/$defs/string"
              description: State name such as loading or denied.
            trigger:
              $ref: "#/$defs/string"
              description: Condition that activates the state.
            behavior:
              $ref: "#/$defs/string"
              description: Visible behavior in this state.
      coverage:
        type: object
        additionalProperties: false
        required:
          - scale
          - representativeScreens
          - map
        description: |-
          Image-first delivery map. Large frontend scopes generate only a small representative set of
          critical screens; every remaining screen, state and viewport derives through this explicit
          component/state map. This is design coverage, not component, API or running-render proof.
        properties:
          scale:
            enum:
              - bounded
              - large
            description: Whether the selected frontend scope is bounded or large enough to require a deliberately small representative set.
          representativeScreens:
            $ref: "#/$defs/stringList"
            description: Critical surfaces selected for ImageGen. For a large scope this is a small subset, not every screen.
          map:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - screen
                - state
                - viewport
                - components
                - derivation
              properties:
                screen:
                  $ref: "#/$defs/string"
                state:
                  $ref: "#/$defs/string"
                viewport:
                  $ref: "#/$defs/string"
                components:
                  $ref: "#/$defs/stringList"
                  description: Actual installed Grammar component anatomy used as the implementation reference; never an invented export.
                derivation:
                  $ref: "#/$defs/string"
                  description: How this combination follows a representative direction, accepted inputs and Grammar state contracts.
                directionAsset:
                  $ref: "#/$defs/string"
                  description: Optional ui-owned generated direction path when this exact combination is in the representative set.
      accessibility:
        $ref: "#/$defs/stringList"
        description: Keyboard, semantics, contrast and assistive-technology requirements.
      responsive:
        $ref: "#/$defs/stringList"
        description: Viewport and layout adaptation rules.
      assets:
        type: array
        description: Any number of design/reference assets under this UI node's assets/**. Explain covered
          screens, states and viewports in role; record origin in provenance. Each path also appears
          in node.assets. Multiple images do not imply alternative design directions. New representative
          directions are generated through built-in ImageGen from accepted business/SDS, brand, relevant UI
          knowledge and actual installed Grammar anatomy/reference inputs. Keep the exact prompt as a sibling
          asset and record the tool provenance. A direction is never exact component/render/API proof.
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - role
            - provenance
          properties:
            path:
              $ref: "#/$defs/string"
              description: Relative ui-owned design path under assets/, for example assets/login.png.
            role:
              $ref: "#/$defs/string"
              description: How the design asset informs implementation.
            provenance:
              $ref: "#/$defs/string"
              description: Generation or source provenance for the design asset.
            generation:
              type: object
              additionalProperties: false
              required:
                - tool
                - promptPath
                - inputRefs
              description: Actual generation provenance for an ImageGen direction. Omit for non-generated references and prompt files.
              properties:
                tool:
                  const: image_gen.imagegen
                  description: The built-in ImageGen tool actually invoked; a prose claim or substitute renderer is not sufficient.
                promptPath:
                  $ref: "#/$defs/string"
                  description: UI-owned prompt file whose exact bytes produced this direction.
                inputRefs:
                  $ref: "#/$defs/stringList"
                  description: Accepted business/SDS, brand, UI knowledge and actual Grammar anatomy/reference inputs supplied to the prompt.
                observedModel:
                  $ref: "#/$defs/string"
                  description: Optional only when the tool itself exposes an exact model identity. Never infer or promise a model name.
      observations:
        $ref: "#/$defs/stringList"
        description: Verified facts about current UI behavior or design system.
      gaps:
        $ref: "#/$defs/stringList"
        description: Unimplemented or unresolved differences between observed UI and target direction.
      artworkSlots:
        type: array
        description: Artwork the approved candidate embeds - an illustration, the brand mascot, a decorative
          image, a chart placeholder - declared by the drawing so the asset operation can generate each one
          from its crop and the build can wire it by file. A slot names its file once it is generated.
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - screen
            - state
            - purpose
            - brief
          properties:
            id:
              $ref: "#/$defs/string"
            screen:
              $ref: "#/$defs/string"
              description: The surface the slot sits in, by its name in surfaces.
            state:
              $ref: "#/$defs/string"
              description: The state of that surface the artwork belongs to.
            region:
              $ref: "#/$defs/string"
              description: The blueprint region the slot fills.
            purpose:
              $ref: "#/$defs/string"
            brief:
              $ref: "#/$defs/string"
              description: The prompt that reproduces the artwork, stated inside the brand imagery rules.
            size:
              type: object
              additionalProperties: false
              properties:
                w:
                  type: integer
                h:
                  type: integer
                viewport:
                  $ref: "#/$defs/string"
            format:
              enum:
                - png
                - svg
                - webp
            references:
              $ref: "#/$defs/stringList"
              description: Brand masters the artwork is drawn from, as brand/assets/ paths.
            crop:
              type: object
              additionalProperties: false
              properties:
                x:
                  type: integer
                y:
                  type: integer
                w:
                  type: integer
                h:
                  type: integer
              description: Where the slot sits in the candidate image it was taken from.
            file:
              $ref: "#/$defs/string"
              description: The generated file, as a ui-owned path under assets/, once the asset operation produced it.
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            status:
              enum:
                - declared
                - generated
                - wired
            provenance:
              $ref: "#/$defs/string"
  businessOverviewSpec:
    description: Customer-language product overview captured before module SRS work. Keep values as
      readable YAML block prose; this records stated intent and unknowns, not approval of inferred
      requirements.
    type: object
    additionalProperties: false
    required:
      - purpose
      - customerUnderstanding
      - desiredOutcome
      - scope
      - openQuestions
    properties:
      purpose:
        $ref: "#/$defs/string"
        description: Why the customer wants the product, in their natural language.
      customerUnderstanding:
        $ref: "#/$defs/string"
        description: How the customer describes the product and its users without technical translation.
      desiredOutcome:
        $ref: "#/$defs/string"
        description: What success should feel or look like to the customer.
      scope:
        $ref: "#/$defs/string"
        description: Plain-language boundary of what the customer currently asks to address.
      openQuestions:
        $ref: "#/$defs/string"
        description: Unresolved customer questions or “None stated”; do not silently convert guesses into
          requirements.
  brandAssetPath:
    type: string
    pattern: ^brand/assets/(?=[^\\:\x00-\x1f]*$)(?!(?:.*/)?\.{1,2}(?:/|$))[^/]+(?:/[^/]+)*$
    description: Tree-relative brand payload path under brand/assets/, with arbitrary nested folders. No
      absolute paths, traversal, empty segments, backslashes or control characters. The same file is
      also declared in the brand node's own assets/ list so its current bytes bind the record.
  brandAsset:
    type: object
    additionalProperties: false
    required:
      - path
      - purpose
    properties:
      path:
        $ref: "#/$defs/brandAssetPath"
      purpose:
        $ref: "#/$defs/string"
        description: What this master is for; a file is not a permission to use it anywhere.
      pose:
        $ref: "#/$defs/string"
        description: Named pose or variant of a mascot/logo master, for example waving or mono-dark.
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
        description: Optional recorded digest of the master bytes; the validator hashes the file itself.
  brandColorToken:
    type: object
    additionalProperties: false
    required:
      - token
      - value
      - role
    properties:
      token:
        type: string
        minLength: 3
        description: Installed grammar token name, for example --starci-core-primary. A brand value is
          always bound to the token it overrides, never to a loose colour name.
      value:
        $ref: "#/$defs/string"
        description: Colour value as #rrggbb or oklch(...); no other notation is accepted.
      foreground:
        $ref: "#/$defs/string"
        description: Readable foreground value paired with this token, in the same notation.
      role:
        enum:
          - primary
          - danger
          - success
          - warning
          - info
          - focus
          - surface
          - other
        description: Semantic role the token plays in the product. Two tokens may share one value; a brand
          may deliberately make danger the primary colour when its policy allows it.
      note:
        $ref: "#/$defs/string"
        description: Why this value is the brand's answer for that role.
      valueSource:
        $ref: "#/$defs/brandValueSource"
        description: The reference render the value was read from, for a token the app has not written yet.
  brandValueSource:
    type: object
    additionalProperties: false
    required:
      - path
      - value
    description: The external reference a planned colour token's value was read from (read-only).
      scripts/checks/brand.mjs passes the token as planned-from-reference at the decide stage while the app
      source does not declare it, and refuses it (planned-source-missing) at the verify stage.
    properties:
      path:
        type: string
        pattern: ^(?![A-Za-z]:)(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
        description: The reference file, relative to the --source root.
      token:
        type: string
        pattern: ^--[A-Za-z0-9_-]+$
        description: The custom property the reference declares, when it is not the token's own name.
      value:
        $ref: "#/$defs/string"
        description: The exact value the reference declares.
      line:
        type: integer
        minimum: 1
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
      note:
        $ref: "#/$defs/string"
  brandContrastException:
    type: object
    additionalProperties: false
    required:
      - foreground
      - background
      - ratio
      - reason
      - acceptedBy
    description: One pair the owner accepted below the contrast floor, named by its two declared token
      names and bound to the measured ratio and the owner answer that accepted it. scripts/checks/brand.mjs
      contrast-aa refuses it when the pair has moved more than 0.05 from ratio, a token is undeclared, or no
      owner-answered starci/ask-answer@1 receipt exists for acceptedBy.
    properties:
      foreground:
        type: string
        minLength: 3
        description: Declared token painted as the ink.
      background:
        type: string
        minLength: 3
        description: Declared token it is painted on.
      ratio:
        type: number
        minimum: 1
        description: WCAG 2.x ratio of the pair as the owner accepted it.
      reason:
        $ref: "#/$defs/string"
      acceptedBy:
        $ref: "#/$defs/string"
        description: Dispatch id of the owner ask whose answer accepted the pair.
      receipt:
        $ref: "#/$defs/string"
        description: Receipt path relative to the repository root; found by acceptedBy when absent.
  brandColorScale:
    type: object
    additionalProperties: false
    required:
      - name
      - steps
    properties:
      name:
        $ref: "#/$defs/string"
        description: Scale name, for example primary or neutral.
      steps:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - step
            - value
          properties:
            step:
              $ref: "#/$defs/string"
              description: Step label such as 50, 500 or 900.
            value:
              $ref: "#/$defs/string"
              description: Colour value as #rrggbb or oklch(...).
  brandColorSet:
    type: object
    additionalProperties: false
    required:
      - tokens
    properties:
      tokens:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/brandColorToken"
      scales:
        type: array
        items:
          $ref: "#/$defs/brandColorScale"
    description: One complete colour answer, made of the grammar tokens the brand sets and the optional
      scales behind them.
  brandSpec:
    description: The product's brand, as one decided record at .starciwork/brand/index.yaml. Every design
      operation reads this record instead of restating colours, the mascot or imagery rules, and the
      machine checks compare it against the real frontend token sources named in sources. At most one
      brand record exists per Work tree; brand/assets/** beside it holds the masters.
    type: object
    additionalProperties: false
    required:
      - rev
      - identity
      - color
      - typography
      - iconography
      - imagery
      - forbidden
      - sources
    properties:
      rev:
        $ref: "#/$defs/string"
        description: The brand revision every frontend-facing node binds. Bumping it invalidates their
          completions, so it changes only with an owner decision.
      identity:
        type: object
        additionalProperties: false
        required:
          - name
          - family
          - owner
        properties:
          name:
            $ref: "#/$defs/string"
            description: Product brand name as the customer sees it.
          tagline:
            $ref: "#/$defs/string"
          family:
            $ref: "#/$defs/string"
            description: Installed grammar family id the brand dresses, for example starci.
          owner:
            $ref: "#/$defs/string"
            description: Person or role who decides this brand; a reviewer is not an owner.
      color:
        type: object
        additionalProperties: false
        required:
          - tokens
          - policy
        properties:
          tokens:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/brandColorToken"
          scales:
            type: array
            items:
              $ref: "#/$defs/brandColorScale"
          dark:
            $ref: "#/$defs/brandColorSet"
            description: The dark answer, in the same shape. Absent means the grammar's dark values stand.
          policy:
            type: object
            additionalProperties: false
            required:
              - dangerMayMatchPrimary
            properties:
              dangerMayMatchPrimary:
                type: boolean
                description: Whether the brand is allowed to give danger the primary value. False makes an
                  equal pair a BRAND_POLICY failure instead of a silent override of the grammar.
              minContrast:
                type: number
                minimum: 1
                description: Minimum foreground/background contrast the brand accepts; 4.5 when unstated.
              contrastExceptions:
                type: array
                minItems: 1
                items:
                  $ref: "#/$defs/brandContrastException"
                description: The colour pairs the owner accepted below minContrast, one each; contrast-aa
                  passes a pair under the floor only through an entry here.
      typography:
        type: object
        additionalProperties: false
        required:
          - family
        properties:
          family:
            $ref: "#/$defs/string"
            description: Type family the brand installs, with its real fallback stack.
          scale:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - value
              properties:
                name:
                  $ref: "#/$defs/string"
                value:
                  $ref: "#/$defs/string"
                usage:
                  $ref: "#/$defs/string"
          rules:
            $ref: "#/$defs/stringList"
      mascot:
        type: object
        additionalProperties: false
        required:
          - name
          - assets
          - allowedIn
          - forbiddenIn
          - rules
        properties:
          name:
            $ref: "#/$defs/string"
          component:
            $ref: "#/$defs/string"
            description: Grammar leaf component id that already renders the mascot; a design record uses it
              instead of embedding the artwork again.
          assets:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/brandAsset"
          allowedIn:
            $ref: "#/$defs/stringList"
            description: Surfaces and slots the mascot may appear in.
          forbiddenIn:
            $ref: "#/$defs/stringList"
            description: Surfaces and slots it may never appear in.
          minSize:
            $ref: "#/$defs/string"
          rules:
            $ref: "#/$defs/stringList"
      logo:
        type: object
        additionalProperties: false
        properties:
          mark:
            $ref: "#/$defs/brandAsset"
          wordmark:
            $ref: "#/$defs/brandAsset"
          lockups:
            type: array
            items:
              $ref: "#/$defs/brandAsset"
          clearSpace:
            $ref: "#/$defs/string"
          minSize:
            $ref: "#/$defs/string"
          dark:
            $ref: "#/$defs/brandAsset"
      iconography:
        type: object
        additionalProperties: false
        required:
          - set
        properties:
          set:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/string"
            description: The glyph packages the product is allowed to draw from.
          custom:
            $ref: "#/$defs/stringList"
          forbidden:
            $ref: "#/$defs/stringList"
      imagery:
        type: object
        additionalProperties: false
        required:
          - style
        properties:
          style:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/string"
          forbidden:
            $ref: "#/$defs/stringList"
          promptRules:
            $ref: "#/$defs/stringList"
            description: Rules every image-model prompt must state, so a generated image is brand-bound
              before it is generated rather than judged afterwards.
          references:
            type: array
            items:
              $ref: "#/$defs/brandAssetPath"
            description: Sample imagery under brand/assets/ that shows the style, also declared in the
              brand node's assets.
      voice:
        type: object
        additionalProperties: false
        required:
          - locales
        properties:
          locales:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - locale
                - tone
              properties:
                locale:
                  $ref: "#/$defs/string"
                tone:
                  $ref: "#/$defs/stringList"
                vocabulary:
                  type: object
                  description: Preferred and refused wording for this locale.
      motion:
        type: object
        additionalProperties: false
        required:
          - rules
        properties:
          rules:
            $ref: "#/$defs/stringList"
      forbidden:
        $ref: "#/$defs/stringList"
        description: Product-wide don'ts that hold whatever the surface is.
      sources:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - repository
            - path
            - kind
          properties:
            repository:
              $ref: "#/$defs/id"
              description: Repository that actually holds the file, for example the frontend.
            path:
              type: string
              minLength: 1
              pattern: ^(?=.*\S)(?!/)(?!.*[\\:\x00-\x1f])(?!(?:.*/)?\.{1,2}(?:/|$))[^/]+(?:/[^/]+)*$
              description: Normalized repository-relative path of the real token or component file the
                checks compare this record against.
            kind:
              enum:
                - css
                - tokens
                - component
              description: What the file is, so a check knows how to read it.
            note:
              $ref: "#/$defs/string"
        description: The real frontend files this record is proven against. A brand with no sources cannot
          be checked and is refused.
      artworkSlots:
        type: object
        additionalProperties: false
        required:
          - conventions
        properties:
          conventions:
            $ref: "#/$defs/stringList"
            description: How a design record declares an embedded artwork slot, so the mascot and sample
              imagery arrive through a named slot instead of being pasted into a layout.
