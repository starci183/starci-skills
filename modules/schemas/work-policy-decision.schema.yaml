$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:policy-decision:1
type: object
additionalProperties: false
description: A question about the product that nobody has answered yet, written down as a record rather than
  left in a conversation. It exists so that an undecided thing is visible as undecided - with its options,
  their consequences and a recommendation somebody can argue with - instead of being settled by whoever
  writes the code first. The decision names the records it blocks, which is what keeps a rule honest at todo
  while the question is open.
required:
  - schema
  - id
  - title
  - state
  - outcome
  - question
  - options
  - recommendation
  - recommendationReason
properties:
  schema:
    const: work/policy-decision
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  id:
    type: string
    pattern: ^decision(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The decision's stable id, a lowercase dot-path under the decision family:
      decision.<feature>.<scope...>; example decision.task.list.scope. The prefix is enforced so that a rule
      pointing at a decision is visibly pointing at an open question rather than at another rule."
  title:
    $ref: "#/$defs/prose"
    description: The question as a heading, short enough to scan in a list of open decisions. It is where an
      owner looks to find what is waiting on them.
  state:
    $ref: "#/$defs/state"
  outcome:
    $ref: "#/$defs/slug"
    description: "`open` while the question is unanswered, and otherwise the id of the option the owner
      chose. Recording the chosen option here rather than as prose means a settled decision can be compared
      mechanically against the recommendation that was made, so a decision taken against advice stays
      visible instead of being smoothed over in the retelling."
  question:
    $ref: "#/$defs/prose"
    description: The question in full, with the concrete situation that raises it. A decision stated
      abstractly gets answered abstractly; the situation is what makes the consequences of each option real.
  options:
    type: array
    minItems: 2
    uniqueItems: true
    description: Every option genuinely on the table, each with what it costs. At least two are required,
      because a decision with one option is not a decision - it is a plan that has been written in the shape
      of a question.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - summary
        - consequence
      properties:
        id:
          $ref: "#/$defs/slug"
          description: A short name for the option, unique within this decision. It is what `outcome` and a
            discussion elsewhere refer to, so the option can be named without quoting its summary.
        summary:
          $ref: "#/$defs/prose"
          description: What the option actually is, in one sentence. It states the option's own content, not
            an argument for it.
        consequence:
          $ref: "#/$defs/prose"
          description: What follows if this option is taken, including what it costs and who it hurts. It is
            a required field because an option list without consequences reads as a menu of equals, and the
            whole value of writing the decision down is that they are not equal.
  recommendation:
    $ref: "#/$defs/slug"
    description: The option this record recommends, by its id. A recommendation is required so that the
      person who understood the question leaves behind an answer rather than only a list, and so the owner is
      deciding on something rather than starting from nothing.
  recommendationReason:
    $ref: "#/$defs/prose"
    description: Why that option, in terms of the consequences already listed. It is separate from the
      recommendation so the reasoning can be attacked on its own - which is how a recommendation gets
      overturned for a good reason rather than by preference.
  blocks:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/recordId"
    description: The records that cannot honestly be finished until this question is answered, by id. It is
      the edge that turns an open question into visible scheduling pressure instead of a note nobody reads.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that an id
      written twice by two authors is the same string.
  recordId:
    type: string
    pattern: ^(?:br|fr|nfr|data|decision|journey|sds|impl|ui|uat)(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The id of any record in the tree, family prefix included. Requiring a known prefix means a
      dangling reference is caught as a malformed id rather than surviving as a plausible-looking string.
  state:
    enum:
      - todo
      - done
    description: "Whether this leaf is outstanding or finished, and nothing else. There is deliberately no
      third authored value: `stale` is derived by the checker when an input a done record was proved against
      has moved, and authoring it would let a record claim a status the checker is supposed to compute -
      which is how a tree starts reporting its own opinion of its freshness instead of a measured one."
