$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:policy-decision:1
type: object
additionalProperties: false
description: "One question the product has to settle, its options with the consequence of each, and - once
  settled - which one was chosen. Its vocabulary is deliberately closed: `outcome` says open or decided and
  nothing else, and the chosen option's own id goes in `chosen`. A decision that wrote its option's name
  directly into `outcome` would invent a private vocabulary that no reader of another decision could rank,
  and a decision carrying a pointer to where it will eventually be implemented would be doing the
  implementation record's job before anybody built anything."
required:
  - question
  - options
  - outcome
properties:
  schema:
    const: work/policy-decision@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^decision(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The decision's stable id, a lowercase dot-path under the decision family:
      decision.<feature>.<name>; example decision.task.list.scope."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: The question in one line, phrased as a question. A title phrased as an answer is a decision
      that has already been taken somewhere other than this record.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  question:
    $ref: "urn:work:common:1#/$defs/prose"
    description: The question in full, with the tension that makes it a question - which records disagree,
      which reading of which rule is at stake. It is required because a decision whose question is only a
      heading gets settled by whoever reads it most narrowly.
  options:
    type: array
    minItems: 2
    uniqueItems: true
    description: What could be chosen, at least two, each with what it would cost. Fewer than two is not a
      decision; it is a plan written in the shape of one.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - consequence
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z][A-Za-z0-9-]*$
          description: The option's own name, which `chosen` names back. It is a name rather than a number
            so that a reader of `chosen` learns the decision without coming back here.
        summary:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What the option actually is, in one sentence.
        consequence:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What follows if it is taken - which records stay true, which stop being true, what
            becomes unbuildable. It is required because options without consequences are a list of phrasings
            and the decision is then made on taste.
        state:
          enum:
            - chosen
            - rejected
          description: How this option fared, where the record annotates the options themselves as well as
            naming the winner in `chosen`. It is not a lifecycle - an option is not work - and the two
            values are the only two a settled decision leaves behind.
  outcome:
    enum:
      - open
      - decided
    description: Whether the question has been settled. Two values and no others, because a third would be
      a way of describing a decision that is nearly made, and a decision nearly made schedules exactly like
      one not made at all.
  chosen:
    type: string
    pattern: ^[a-zA-Z][A-Za-z0-9-]*$
    description: The option that was taken, by its id. It is required exactly when the outcome is decided,
      and the gate refuses a value that names no option in the list above.
  reason:
    $ref: "urn:work:common:1#/$defs/prose"
    description: Why that option was taken, in the decider's terms. It is what a reader needs when the
      choice went against the recommendation, which is the case where the record is read at all.
  recommendation:
    type: string
    pattern: ^[a-zA-Z][A-Za-z0-9-]*$
    description: The option the record's author would take, by id, recorded before the decision is made. It
      is kept even after a different option is chosen, because a recommendation that is quietly rewritten to
      match the outcome makes every past decision look unanimous.
  recommendationReason:
    $ref: "urn:work:common:1#/$defs/prose"
    description: Why that option is recommended, argued from the consequences above rather than restating
      them. It is required alongside the recommendation, because a recommendation with no argument is a
      preference.
  blocks:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/recordId"
    description: What settling this decision unblocks, by id. It is the outbound half of the wait - the
      records themselves cite this decision in `blockedBy` - and it is here so that a reader of an open
      decision can see what is standing still behind it.
  tension:
    type: object
    additionalProperties: false
    required:
      - records
      - statement
    description: "Three or more records that are each individually true and jointly unsatisfiable. It is
      authored on the decision that owns settling them and refused anywhere else, because a set like this is
      not a chain of pairwise conflicts: no two of them are wrong, and only a decision about which to give
      up can resolve it."
    properties:
      records:
        type: array
        minItems: 2
        uniqueItems: true
        items:
          $ref: "urn:work:common:1#/$defs/recordId"
        description: The records in the set, by id. The gate requires every one to resolve and at least two
          to be named, because a tension over one record is a record that is simply wrong.
      statement:
        $ref: "urn:work:common:1#/$defs/prose"
        description: Why they cannot all hold, stated so that a reader can check the impossibility rather
          than take it on trust.
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  evidence:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder, where somebody went and
      checked the consequence they decided on. It is optional because this family is an authored claim by
      nature - a settled decision is true because it was agreed.
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
dependentRequired:
  recommendation:
    - recommendationReason
  recommendationReason:
    - recommendation
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"
  - if:
      properties:
        outcome:
          const: decided
      required:
        - outcome
    then:
      required:
        - chosen
      properties:
        chosen: true
    description: A decided question with no chosen option is a record that says it has been settled without
      saying how, which reads as settled to every scheduling filter and to no reader.