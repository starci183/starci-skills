$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:critique:1
type: object
additionalProperties: false
description: "The generated reading of a `.starciwork` tree's own weak points - blast radius, fan-in
  hotspots, designed todos, unrooted blockers - written to _derived/critique.yaml by
  scripts/example/example-critique.mjs and never authored by hand. It is a projection, so it carries no id
  and no state: every finding is recomputed from the records on disk, and a finding that disappears
  disappeared because the tree changed, not because somebody deleted the line about it."
required:
  - schema
  - findings
properties:
  schema:
    const: work/critique@1
    description: Document kind discriminator. It names the generated projection rather than a record family
      so that the record walk can exclude it by schema instead of by the directory it happens to sit in.
  findings:
    type: array
    uniqueItems: true
    description: Every observation the critique made, in the generator's own deterministic order. It may be
      empty, and an empty list is a result - it says the pass ran and found nothing, which is a different
      fact from the pass not having run.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - severity
        - records
        - because
      properties:
        id:
          type: string
          minLength: 1
          description: "The finding's stable name, written as <kind>:<subject>. It is derived from what the
            finding is about rather than from where it appeared in the list, so the same condition keeps
            the same name across runs and a diff of two critiques is readable."
        kind:
          $ref: "#/$defs/slug"
          description: Which analysis produced this finding. It is a plain name rather than a closed enum
            because the generator owns the set and adding an analysis must not require editing a schema in
            another directory to make its output legal.
        severity:
          enum:
            - critical
            - warn
            - info
          description: How much the finding should change what happens next. The three values are closed so
            that a new analysis cannot introduce a fourth word that a reader ranks by guessing.
        records:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/$defs/recordId"
          description: The records the finding is about, by id. At least one is required because a critique
            of the tree in general is an opinion; a critique naming records is something a reader can go and
            check.
        because:
          type: string
          minLength: 1
          description: What the generator actually measured, in a sentence that carries the number it
            measured. It is the difference between a warning a reader can act on and one they can only
            silence.
$defs:
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that a name
      written twice by two authors is the same string.
  recordId:
    type: string
    pattern: ^(?:br|ac|fr|nfr|data|journey|decision|sds|ui|impl|uat|contract|integration|gap|event|environment|identity|fixture)(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}(?:#[a-z0-9]+(?:[-.][a-z0-9]+)*)?$
    description: "The id of any record in the tree, family prefix included, optionally addressing one
      criterion the record carries inline as `<record id>#<criterion>`. Requiring a known prefix means an
      unresolvable reference is caught as a malformed id rather than surviving as a plausible-looking
      string."
