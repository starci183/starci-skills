$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:starci:assisted-uat-cleanup:1
type: object
additionalProperties: false
required: [schema, actions, verify]
properties:
  schema: {const: starci/assisted-uat-cleanup@1}
  actions:
    type: array
    items: {$ref: '#/$defs/command'}
  verify:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/command'}
$defs:
  command:
    type: object
    additionalProperties: false
    required: [id, command]
    properties:
      id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
      command:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      cwd: {type: string, minLength: 1}
