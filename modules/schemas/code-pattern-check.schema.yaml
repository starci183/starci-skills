$schema: https://json-schema.org/draft/2020-12/schema
$id: starci://schemas/code-pattern-check.schema.json
type: object
additionalProperties: false
required: [schema, profile, repository, ok, status, inventoryDigest, canon, tooling, inputs, machineResults, coverage, obligations, files, issues, limitations, reportDigest]
properties:
  schema: {const: starci/code-pattern-check@1}
  profile: {type: [string, 'null']}
  repository: {type: string}
  ok: {type: boolean}
  status: {enum: [clean, findings, unavailable, invalid]}
  inventoryDigest: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
  canon:
    anyOf:
      - {type: 'null'}
      - type: object
        additionalProperties: false
        required: [name, version, digest, files]
        properties:
          name: {type: string, minLength: 1}
          version: {type: [string, 'null']}
          digest: {type: string, pattern: '^[a-f0-9]{64}$'}
          files: {type: integer, minimum: 0}
  tooling:
    anyOf:
      - {type: 'null'}
      - type: object
        additionalProperties: false
        required: [eslintVersion]
        properties:
          eslintVersion: {type: [string, 'null']}
  inputs:
    anyOf:
      - {type: 'null'}
      - type: object
        additionalProperties: false
        required: [before, after, stable]
        properties:
          before: {$ref: '#/$defs/inputSnapshot'}
          after:
            anyOf:
              - {type: 'null'}
              - {$ref: '#/$defs/inputSnapshot'}
          stable: {type: boolean}
  machineResults:
    type: array
    items:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, schema, digest, ok, files, kinds, coverage]
          properties:
            kind: {const: architecture}
            schema: {type: [string, 'null']}
            digest: {type: string, pattern: '^[a-f0-9]{64}$'}
            ok: {type: boolean}
            files: {type: integer, minimum: 0}
            kinds: {$ref: '#/$defs/strings'}
            coverage: {type: [object, 'null']}
        - type: object
          additionalProperties: false
          required: [kind, obligation, schema, digest, ok, files, checkedRuleIds, compiler]
          properties:
            kind: {const: script}
            obligation: {type: string, minLength: 1}
            schema: {type: [string, 'null']}
            digest: {type: string, pattern: '^[a-f0-9]{64}$'}
            ok: {type: boolean}
            files: {$ref: '#/$defs/strings'}
            checkedRuleIds: {$ref: '#/$defs/strings'}
            compiler: {type: [object, 'null']}
            execution: {type: object}
  coverage:
    type: object
    additionalProperties: false
    required: [expectedFiles, requestedFiles, configuredFiles, lintedFiles, ignoredFiles, missingFiles, required, covered, uncovered, conflicting]
    properties:
      expectedFiles: {$ref: '#/$defs/strings'}
      requestedFiles: {$ref: '#/$defs/strings'}
      configuredFiles: {$ref: '#/$defs/strings'}
      lintedFiles: {$ref: '#/$defs/strings'}
      ignoredFiles: {$ref: '#/$defs/strings'}
      missingFiles: {$ref: '#/$defs/strings'}
      required: {type: array, items: {type: object}}
      covered: {$ref: '#/$defs/strings'}
      uncovered: {$ref: '#/$defs/strings'}
      conflicting: {$ref: '#/$defs/strings'}
  obligations:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, sourceRuleIds, applicability, status, machine, coverage, files, rules]
      properties:
        id: {type: [string, 'null']}
        sourceRuleIds: {$ref: '#/$defs/strings'}
        applicability: {type: object}
        status: {type: [string, 'null']}
        machine: {type: [object, 'null']}
        coverage: {enum: [required, covered, uncovered, conflicting, not-applicable, pending]}
        files: {$ref: '#/$defs/strings'}
        rules: {type: array, items: {type: object}}
  files:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, errorCount, warningCount, fatalErrorCount, suppressedCount]
      properties:
        path: {type: string}
        errorCount: {type: integer, minimum: 0}
        warningCount: {type: integer, minimum: 0}
        fatalErrorCount: {type: integer, minimum: 0}
        suppressedCount: {type: integer, minimum: 0}
  issues:
    type: array
    items:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 1}
  limitations:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  # Present only on a scoped run (explicit files): the slice's own verdict. issues are the ones on the slice's
  # files plus run-level ones; owed are the REPOSITORY_OBLIGATION_OWED notes (a repo-level obligation contract the
  # repository owner must declare - never unavailable for the slice); outside counts issues located only outside it.
  # The CLI exit code of a scoped run follows slice.status. A scoped run judges the slice's NEW findings against
  # --base (default the merge-base of HEAD with its upstream): a located finding (LINT_MESSAGE, SUPPRESSED_MESSAGE,
  # ARCHITECTURE_VIOLATION, SCRIPT_PATTERN_VIOLATION, SCRIPT_INPUT_UNAVAILABLE with a path) stays in issues (with newBecause) when its file is new, it sits
  # on a line the slice changed, its key is absent at base or the slice made it worse (more occurrences); the rest
  # are preexisting SLICE_PREEXISTING_FINDINGS notes owed to code.refactor, never a block. counts shows new versus
  # preexisting; baseline records the base, how it was measured and the changed lines.
  slice:
    type: object
    additionalProperties: false
    required: [files, status, ok, issues, owed, outside]
    properties:
      files: {$ref: '#/$defs/strings'}
      status: {enum: [clean, findings, unavailable]}
      ok: {type: boolean}
      issues:
        type: array
        items: {type: object, required: [code], properties: {code: {type: string, minLength: 1}}}
      owed:
        type: array
        items:
          type: object
          required: [code, severity, owner, obligation, contracts, declaredIn, causes, ruleIds, sliceFiles, details, message]
          properties:
            code: {const: REPOSITORY_OBLIGATION_OWED}
            severity: {const: note}
            owner: {const: repository}
            obligation: {type: string, minLength: 1}
            contracts: {$ref: '#/$defs/strings'}
            declaredIn: {$ref: '#/$defs/strings'}
            causes: {$ref: '#/$defs/strings'}
            ruleIds: {$ref: '#/$defs/strings'}
            sliceFiles: {$ref: '#/$defs/strings'}
            details: {$ref: '#/$defs/strings'}
            message: {type: string, minLength: 1}
      outside: {type: integer, minimum: 0}
      preexisting:
        type: array
        items:
          type: object
          required: [code, severity, owner, finding, ruleId, file, count, lines, message]
          properties:
            code: {const: SLICE_PREEXISTING_FINDINGS}
            severity: {const: note}
            owner: {const: code.refactor}
            finding: {type: string, minLength: 1}
            obligation: {type: string, minLength: 1}
            ruleId: {type: [string, 'null']}
            file: {type: string, minLength: 1}
            count: {type: integer, minimum: 1}
            lines: {type: array, items: {type: integer, minimum: 1}}
            message: {type: string, minLength: 1}
      counts:
        type: object
        required: [new, preexisting, runLevel]
        properties:
          new: {type: integer, minimum: 0}
          preexisting: {type: integer, minimum: 0}
          runLevel: {type: integer, minimum: 0}
      baseline:
        type: object
        required: [method, status]
        properties:
          base: {type: [string, 'null']}
          baseCommit: {type: string, pattern: '^[a-f0-9]{40,64}$'}
          source: {enum: [argument, merge-base, head]}
          method: {enum: [base-tree, changed-lines, unchanged, no-findings, none]}
          status: {enum: [measured, partial, not-needed, skipped, unavailable]}
          baseStatus: {enum: [clean, findings, unavailable]}
          baseUnavailable: {$ref: '#/$defs/strings'}
          reason: {type: string}
          baseFiles: {$ref: '#/$defs/strings'}
          changedFiles:
            type: array
            items:
              type: object
              required: [path, added, ranges]
              properties:
                path: {type: string, minLength: 1}
                added: {type: boolean}
                ranges: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: integer, minimum: 1}}}
  reportDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
$defs:
  inputSnapshot:
    type: object
    additionalProperties: false
    required: [digest, files, unsafe]
    properties:
      digest: {type: string, pattern: '^[a-f0-9]{64}$'}
      files: {$ref: '#/$defs/strings'}
      unsafe: {$ref: '#/$defs/strings'}
  strings:
    type: array
    uniqueItems: true
    items: {type: string}
