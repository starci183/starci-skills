$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:customer-journey:1
type: object
additionalProperties: false
description: "One route a person takes across the product, from wanting something to having it. It exists
  because every other family describes one piece: the requirements are each correct on their own and the
  route between them is where a product stops working. That is why its proof demand is two things at once -
  the route was walked, and every requirement on the route holds - and why it names the features it crosses
  rather than pretending to belong to one."
required:
  - steps
  - requirements
properties:
  schema:
    const: work/customer-journey@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^journey(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The journey's stable id, a lowercase dot-path under the journey family:
      journey.<feature>.<name>; example journey.task.first-task. The feature segment names the accountable
      owner, not the only feature the route touches."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: The route in one line, told from the person's side. A title that names a feature rather
      than a person's intent is describing a screen tour.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  steps:
    type: array
    minItems: 1
    uniqueItems: true
    description: The route in order, one move each, told as what the person does and what they expect back.
      It is deliberately not a list of screens - a journey written as screens survives a redesign that
      breaks the route.
    items:
      type: object
      additionalProperties: false
      required:
        - actor
        - does
      properties:
        actor:
          $ref: "urn:work:common:1#/$defs/slug"
          description: Who takes this step. It is per step because a journey routinely changes hands - an
            operator picks up what a person started - and a route that cannot say so hides the handover.
        does:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What they do, in their own words.
        expects:
          $ref: "urn:work:common:1#/$defs/prose"
          description: What they should get back, where the expectation is worth stating apart from the
            action. It is optional because many steps carry it inside `does`, and splitting a sentence in
            two to satisfy a schema would not make the route clearer.
  requirements:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/recordId"
    description: The requirements this route travels through, by id. It is what turns the journey's proof
      demand into a count that grows with the route rather than a single tick - a journey holds when the
      route was walked and when every requirement on it holds, neither one alone.
  crossesFeatures:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "urn:work:common:1#/$defs/featureId"
    description: The features the route passes through. It is authored because a journey is the one family
      whose subject is deliberately larger than its owner, and naming the crossings is how a change in one
      feature becomes visibly a question for the others.
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  evidence:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder holding what was
      observed of the route itself. At most one, because a route has one current answer to whether somebody
      walked it.
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"