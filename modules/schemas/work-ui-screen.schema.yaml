$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:ui-screen:1
type: object
additionalProperties: false
description: "One screen the person actually sees, and every state it can be in. The state list is the point
  of the record: a screen specified only in its happy state gets built only in its happy state, and the empty,
  refused and working states are discovered by a person hitting them in production. Because the screen binds
  the brand by revision, a brand change is a visible input change here rather than a silent divergence
  between what was captured and what now renders."
required:
  - schema
  - id
  - title
  - state
  - states
  - brand
  - refs
properties:
  schema:
    const: work/ui-screen@1
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  id:
    type: string
    pattern: ^ui(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The screen's stable id, a lowercase dot-path under the ui family: ui.<feature>.<name>;
      example ui.task.list. The prefix is enforced so that an implementation naming ui.x is visibly claiming
      to build a screen rather than to enforce a rule."
  title:
    $ref: "#/$defs/prose"
    description: What the screen is, in the words a person would use for it. It is the name the journey and
      the UAT flow will use, so it is settled here once.
  state:
    $ref: "#/$defs/state"
  states:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/slug"
    description: Every state this screen can be in - empty, one item, many, refused, working. Listing them
      is what turns "design the screen" into a countable piece of work and what a capture set is checked
      against; an unlisted state is a state nobody designed and nobody captured.
  brand:
    type: object
    additionalProperties: false
    required:
      - rev
    description: The brand revision this screen is designed against. It is a binding, not a decoration - the
      brand record owns the tokens, and naming its revision here is what makes a brand bump suspend this
      screen's captures instead of leaving them quietly wrong.
    properties:
      rev:
        type: integer
        minimum: 1
        description: The revision of the brand record this screen was designed and captured against. A
          number rather than a copy of the tokens, because a copy is a second source of truth that drifts.
  refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/recordId"
    description: The records this screen serves, by id - the functional requirements a person carries out
      through it. It is required because a screen that serves no stated requirement is a picture, and nobody
      can say whether it is finished or even needed.
  proves:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/recordId"
    description: The records this screen itself demonstrates, by id, where it is the thing that demonstrates
      them. It is the same authored forward edge an implementation carries, and it is optional because most
      screens only serve requirements through `refs` and are themselves demonstrated by an implementation or
      a walk.
  evidence:
    $ref: "#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder that carries the proof
      this screen was seen in the states it declares. At most one, because a screen has one current answer to
      whether its captures are real.
  blockedBy:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/prose"
    description: What is standing in the way, in sentences that name the record responsible. It is prose
      rather than lifecycle state because an impediment is a fact about the world, not a status - a capture
      set taken against an older brand revision is the usual case, and it is stated rather than ignored.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that an id
      written twice by two authors is the same string.
  recordId:
    type: string
    pattern: ^(?:br|fr|nfr|data|decision|journey|sds|impl|ui|uat)(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: The id of any record in the tree, family prefix included. Requiring a known prefix means a
      unresolvable reference is caught as a malformed id rather than surviving as a plausible-looking string.
  state:
    enum:
      - todo
      - done
    description: "Whether this leaf is outstanding or finished, and nothing else. There is deliberately no
      third authored value: `stale` is derived by the checker when an input a done record was proved against
      has moved, and authoring it would let a record claim a status the checker is supposed to compute -
      which is how a tree starts reporting its own opinion of its freshness instead of a measured one."
