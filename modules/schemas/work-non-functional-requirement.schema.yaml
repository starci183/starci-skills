$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:non-functional-requirement:1
type: object
additionalProperties: false
description: "A quality the product must have, written so that it can be passed, failed and regressed
  against. Its whole weight is in `measurement`: a quality with no way to measure it cannot be met and
  cannot be missed, so it is enforced as a requirement of the record rather than left to whoever gets round
  to it. The threshold is authored once, here, which is why this family's proof demand is `measurement` and
  nothing else - restating the number in the demand would be a second copy to drift."
required:
  - quality
  - observableCriterion
  - measurement
properties:
  schema:
    const: work/non-functional-requirement@1
    $ref: "urn:work:common:1#/$defs/familyDiscriminator"
  id:
    type: string
    pattern: ^nfr(?:\.[a-z0-9]+(?:-[a-z0-9]+)*){2,}$
    description: "The requirement's stable id, a lowercase dot-path under the nfr family:
      nfr.<feature>.<name>; example nfr.task.list.latency."
  title:
    $ref: "urn:work:common:1#/$defs/prose"
    description: The quality in one sentence, in the terms a person would notice it - a list that feels
      immediate, a refusal that does not leak through timing.
  state:
    $ref: "urn:work:common:1#/$defs/state"
  activity:
    $ref: "urn:work:common:1#/$defs/activity"
  quality:
    $ref: "urn:work:common:1#/$defs/slug"
    description: Which quality this is - latency, integrity, security, compliance. It is a single word so
      that the tree can be read by quality across features, which is how a product notices it has nine
      latency requirements and no availability one.
  observableCriterion:
    $ref: "urn:work:common:1#/$defs/prose"
    description: What somebody would observe if the quality holds, stated without the apparatus that
      measures it. It is separate from `measurement` because the criterion outlives the tool - a new load
      harness changes how it is measured and not what is being claimed.
  measurement:
    type: object
    additionalProperties: false
    required:
      - how
      - threshold
      - environment
    description: How the criterion is turned into a number, what number counts as met, and where it was
      taken. All three are required because each missing one is a way for two people to measure the same
      quality and get answers that cannot be compared.
    properties:
      how:
        $ref: "urn:work:common:1#/$defs/prose"
        description: The apparatus - the harness, the command, the loop - concrete enough that a second
          person could repeat it rather than invent their own.
      threshold:
        $ref: "urn:work:common:1#/$defs/prose"
        description: The number, and the condition that makes it a pass. A threshold without its condition
          is a reading nobody can act on.
      environment:
        $ref: "urn:work:common:1#/$defs/prose"
        description: Where the measurement was taken, named with whatever qualification it needs - which
          stack, against which boundary, with which fake in place. Two numbers from two environments are not
          comparable, and an unlabelled one will be compared anyway.
  appliesTo:
    $ref: "urn:work:common:1#/$defs/appliesTo"
  refs:
    $ref: "urn:work:common:1#/$defs/refs"
  dependsOn:
    $ref: "urn:work:common:1#/$defs/dependsOn"
  subscribes:
    $ref: "urn:work:common:1#/$defs/subscribes"
  requiresProof:
    $ref: "urn:work:common:1#/$defs/requiresProof"
  provenBy:
    $ref: "urn:work:common:1#/$defs/provenBy"
  evidence:
    $ref: "urn:work:common:1#/$defs/slug"
    description: The single evidence directory under this record's evidence/ folder holding the measurement
      that was actually taken. At most one, because a quality has one current answer to whether it holds.
  blockedBy:
    $ref: "urn:work:common:1#/$defs/blockedBy"
  conflictsWith:
    $ref: "urn:work:common:1#/$defs/conflictsWith"
  blockers:
    $ref: "urn:work:common:1#/$defs/blockers"
  verificationSource:
    $ref: "urn:work:common:1#/$defs/verificationSource"
  because:
    $ref: "urn:work:common:1#/$defs/because"
  change:
    $ref: "urn:work:common:1#/$defs/change"
  extensions:
    $ref: "urn:work:common:1#/$defs/extensions"
allOf:
  - $ref: "urn:work:common:1#/$defs/leafIdentity"
  - $ref: "urn:work:common:1#/$defs/authoredClaimMustSayWhy"