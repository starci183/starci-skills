schema: starci/work-layout@1
format: YAML 1.2
node: index.yaml
identity: stable metadata id; folder path is not identity
shape:
  workspace: workspace.yaml
  brand: brand/index.yaml
  brandAssets: brand/assets/**/<file-in-original-format>
  shell: shell/index.yaml
  shellAssets: none - layout captures and lockups are blobs shell/index.yaml cites {name, sha256} (agent data, shape.agentData)
  families: [br, ac, fr, nfr, data, journey, decision, sds, ui, impl, uat, contract, integration, gap, event]
  familiesNote: "The array above is the executable form of this shape block: every record lives in a flat
    family folder directly under its feature - features/<feature>/<family>/<name>/index.yaml - with no
    business/, architecture/, business/srs/ or architecture/sds/ segment anywhere.
    scripts/work/validate/check-example-work.mjs reads shape.families from this file at gate time and refuses
    (FAMILIES_DRIFT) the moment its own FAMILIES set and this list disagree, so the two cannot drift apart
    silently. A root-level .starciwork/<name>/index.yaml operations or import record outside features/ is a
    path outside the product list (drift) and belongs in the catalog's setup entries (shape.setup)."
  br: features/<feature>/br/<name>/index.yaml, schema work/business-rule@1. May carry appliesTo, module
    (a string or list of module-root directory paths - never individual files, see the owners note under
    implementation below) and blockedBy.
  ac: "features/<feature>/br/<rule>/ac/<name>/index.yaml, schema work/acceptance-criterion@1. Nested one
    level under the br it accepts rather than living in its own sibling family folder - an acceptance
    criterion has no identity apart from the rule it accepts. Authors rule (the owning br's id), given,
    when, then and carries no lifecycle state of its own (see rules, below, on which nodes author state)."
  fr: features/<feature>/fr/<name>/index.yaml, schema work/functional-requirement@1
  nfr: features/<feature>/nfr/<name>/index.yaml, schema work/non-functional-requirement@1
  data: features/<feature>/data/<name>/index.yaml, schema work/data@1
  journey: features/<feature>/journey/<name>/index.yaml, schema work/customer-journey@1
  decision: features/<feature>/decision/<name>/index.yaml, schema work/policy-decision@1
  sds: "features/<feature>/sds/<name>/index.yaml, schema work/sds-component@1 - a logical component of the
    architecture map, tracing SRS paths through entry points, contracts, data, quality controls,
    deployment and verification. architecture.decide leaves owners absent (a design names no repository
    paths); review.verify's final reconciliation writes owners: [{role, path}] - module-root directories
    that exist on disk - from the done implementation records that prove the component. Before any done
    implementation proves it a component without owners is SDS_OWNERS_PENDING (info); after, a done one
    without owners is refused and a todo one warned (SDS_OWNERS_MISSING)."
  ui: "features/<feature>/ui/<name>/index.yaml plus <name>/assets/**, schema work/ui-screen@1. Per
    modules/models/kinds.yaml lanes order, drawing precedes implementing: a done work/implementation@1 that names a
    ui-screen in its own proves, or whose repository is the workspace's fe side, is refused
    (IMPL_BEFORE_DIRECTION) unless every relevant ui-screen - the ones it proves, or, when it proves none
    by id, every ui-screen its own feature owns - is itself done."
  impl: "features/<feature>/impl/<repository>/<name>/index.yaml, schema work/implementation@1, one flat
    family folder per feature split by the app side the code lives in (<repository> is the exact value
    the record's own `repository` field names, e.g. impl/be/<name> beside
    impl/fe/<name> in one app) - never an `implementation/` singular
    parent with `frontend/`/`backend/` children, which no example tree or gate ever used. `owners: [{role,
    path}]` names one or more module-root directories, never individual files: `path` (and
    `work/business-rule@1.module`, and `work/sds-component@1.owners[].path` above) is the directory a reader
    would call the module's root - `be/src/modules/domain/task`, not
    `be/src/modules/domain/task/ownership.guard.ts` - so a file inside it moving during a refactor is not, by
    itself, a broken reference. Every owner path is app-relative - `be/<path>`, `fe/<path>` (`fe/apps/landing`)
    or a directory of the app root - the one form a job's owned_paths, gate.mjs and every finding use; a
    `repository:<id>/` prefix or a side-relative path is refused (OWNER_PATH_NOT_APP_RELATIVE). A done
    implementation's every owner directory must exist on disk
    (OWNER_PATH_MISSING otherwise refuses it); a todo one is warned, not refused. A done implementation
    whose `proves` names a record that is not itself `state: done` is refused (PROVES_TARGET_NOT_DONE) -
    proof cannot outrun what it proves."
  uat: features/<feature>/uat/<name>/{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql} - see uatFlow
    below; a run is agent data (uat.verify files it with starci kernel report, the flow's evidence.yaml cites it).
  contract: features/<feature>/contract/<name>/index.yaml, schema work/contract@1 - a synchronous
    request/response surface between a provider feature and a consumer feature; provenBy.provider/consumer
    each name the implementation(s) that proved their half.
  integration: features/<feature>/integration/<name>/index.yaml, schema work/integration@1 - the one
    record a declared extensions.work3.integrations edge or a referencing dependsOn/refs edge owes,
    proven only against the real external provider.
  gap: "features/<feature>/gap/<name>/index.yaml, schema work/gap@1. closedBy is a list of record ids (a
    bare string is accepted and normalised to a one-element list, for the many gaps that only ever needed
    one) - a gap reaches done only once every id in closedBy is itself done, because a gap whose statement
    named two missing things is not honestly closed by building one of them."
  event: features/<feature>/event/<name>/index.yaml, schema work/event@1
  assets: <node>/assets/**/<file-in-original-format> - payload organization beside a record's own
    index.yaml, never a Work node in its own right and never given an index.yaml.
  derived: "_derived/{index.yaml,frontier.md,critique.yaml,critique.md} at the .starciwork root - GENERATED by
    scripts/example/example-derive.mjs and scripts/example/example-critique.mjs, never authored by hand. Excluded from every record walk (it is not itself
    a record, has no id) and refused (scripts/checks/check-example-derived.mjs) the moment it goes stale against
    what is actually on disk, or the moment any real record authors a top-level usedBy/effectiveState/
    frontier field of its own."
  nodeAssets: <node>/assets/**/<file-in-original-format>
  uatFlow: "features/<feature>/uat/<flow>/{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql,assets/}.
    The flow's index.yaml declares entry, actor, an ordered steps[] (each an action, its expected
    business outcome and the observed-feedback checks that apply to it), fixtures, effects and
    cleanup, in uat.verify's own shape. accounts.yaml keeps its work/disposable-accounts@1 schema and
    stays local/synthetic, and each entry names {role, identity} (an _resources identity id);
    a literal password is refused."
  productPaths:
    - "The EXPLICIT list of what an app repository's .starciwork holds (docs/ledger-db.md); its executable
      form is scripts/lib/starciwork-boundary.mjs (isProductPath). Everything else is agent data or drift."
    - .gitignore, .gitattributes, workspace.yaml, index.yaml
    - brand/{index.yaml,evidence.yaml}, brand/assets/**
    - shell/{index.yaml,evidence.yaml}
    - _resources/{environments,identities,fixtures,runtimes}/<name>/resource.yaml plus its declared encrypted payload
    - _resources/grammar-captures/**
    - _derived/{index.yaml,frontier.md,critique.yaml,critique.md}
    - features/index.yaml - the recursive semantic product catalog when a tree carries one
    - features/<feature>/index.yaml
    - features/<feature>/<family>/index.yaml and features/<feature>/impl/<repository>/index.yaml - recursive semantic scope records, not delivery leaves
    - features/<feature>/{br,fr,nfr,data,journey,decision,sds,contract,integration,gap,event}/<name>/index.yaml
    - features/<feature>/br/<rule>/ac/<name>/index.yaml
    - features/<feature>/ui/<screen>/index.yaml, ui/<screen>/{flow.yaml,lifecycle-interface.yaml} and ui/<screen>/assets/** (authored design payloads and the approved direction, Q2)
    - features/<feature>/impl/<repository>/<name>/index.yaml
    - features/<feature>/uat/<flow>/{index.yaml,accounts.yaml,fixtures.yaml,seed.sql,cleanup.sql}
    - "<name>, <rule>, <screen> and <flow> may nest by name segment where a group needs it (br/title/required,
      fr/cart/add, ui/<group>/<screen>, impl/<repository>/<group>/<name>); a nesting folder is never assets/ or an
      agentData folder (evidence, runs, draw-loop, kernel-*), so agent output never passes as a record."
    - features/<feature>/<family>/<name>/evidence.yaml - work/evidence@1, citing artifacts by id + sha256
  agentData:
    - "Agent output is never product content. It lives in the project ledger (reports, check_runs, job_artifacts,
      logs, interface_audits, ask_requests) and in the content-addressed blob store outside every repository,
      and a product record cites it by artifact id + sha256 (docs/ledger-db.md). The categories below
      are scripts/lib/starciwork-boundary.mjs agentDataCategory, which scripts/work/validate/check-example-work.mjs
      refuses in a .starciwork tree [HFS_AGENT_DATA_TRACKED], and shape.starciworkIgnore keeps them out of git."
    - kernel-evidence/**, kernel-strays/**, kernel-approvals/**
    - evidence/<workflow>.<mode>/** and any <node>/evidence/<id>/** bundle
    - any evidence/** capture, impl/<repository>/<name>/assets/** capture, shell/assets/** layout capture
    - uat/<flow>/runs/<runId>/**, ui/<screen>/assets/**/draw-loop/** rounds, features/<feature>/operations/**
    - report*.json copies, *.tmp.json, settle-parity/, settle-tail/, runtime/, canon-seams/
    - the ledger and log files (runtime.sqlite*, logs.sqlite*) and worktrees/ (a workflow's one worktree is created and owned by Orca outside the app checkout)
    - "evidence/** bundles, UAT runs and interface.audit verdicts are filed from STARCI_JOB_SCRATCH with starci kernel report --attach
      (modules/ops/_common.yaml Path and field contract): artifacts of the attempt, the audit an interface_audits row.
      Draw-loop rounds are one blob bundle generation.loop cites {sha256, round}; impl running-page captures are blobs
      the implementation record's assets[] cites {artifact?, name, role, sha256}; layout captures and lockups are blobs
      shell/index.yaml cites {name, sha256}. Every reader resolves them through engine/db/blob.mjs. The final
      directions the owner accepts stay product content under ui/<screen>/assets (decision Q2)."
  starciworkIgnore:
    - "The .starciwork/.gitignore of an app repository (starciwork-boundary.mjs
      STARCIWORK_GITIGNORE): deny the root,
      re-admit the productPaths roots, deny agent output inside them. Side folders have no .starciwork."
    - "/*"
    - "!/.gitignore !/.gitattributes !/workspace.yaml !/index.yaml"
    - "!/brand/ !/shell/ !/_resources/ !/_derived/ !/features/"
    - "/brand/* !/brand/index.yaml !/brand/evidence.yaml !/brand/assets/ /shell/* !/shell/index.yaml !/shell/evidence.yaml"
    - "/_resources/* !/_resources/{environments,identities,fixtures,runtimes,grammar-captures}/"
    - "/_derived/* !/_derived/index.yaml !/_derived/frontier.md !/_derived/critique.yaml !/_derived/critique.md"
    - "evidence/ runs/ draw-loop/ operations/ report*.json *.tmp.json /features/**/impl/**/assets/ /shell/assets/"
  workflowRunState: one SQLite file per project ledger, <runtime root>/.runtime/projects/<ledger_id>/runtime.sqlite
    (decision Q1; engine/db/ledger.mjs ledgerFileFor resolves it through machine.ledgers), outside every product repository (in the git-ignored host-state directory of the runtime). Untracked, never product content (shape.agentData). It holds workflows, units, jobs,
    op attempts, contracts, reports, check runs, artifacts, blobs, events, logs, conditions, leases, inbox and
    citations. Report JSON lives only in reports.report_json. Query views expose op history, media, timeline and
    workflow progress. See ledger-db.md.
  operationalBlobs: "Raw check logs and JSON, patches, screenshots, videos, DOM snapshots, transcripts and report
    attachments belong in the content-addressed blob store outside every product repository (<runtime root>/.runtime/artifacts/, or
    STARCI_ARTIFACT_ROOT). The ledger references each blob by sha256 (blob_ref_columns lists every referencing
    column) and serves it at /api/blob/<sha256>. A product record cites a blob through work_citations, which pins
    it; scripts/housekeeping/blob-gc.mjs sweeps an unreferenced blob only after the 24 h grace and a verified archive."
  workflowLogs: the typed log rows the kernel, ops and runtime write are the logs table of the project ledger (see
    workflowRunState). No log file, cursor or log database lives in the Work tree.
  uiDirectionAsset: "features/<feature>/ui/<screen>/assets/<name>.png with a sibling
    <name>.prompt.txt under the same assets/. interface.draw writes both - the record's ui block
    (intent, surfaces, states, coverage {scale, representativeScreens, map}, accessibility,
    responsive, artworkSlots, observations, gaps) and, in assets/ui.assets, one entry per
    representative direction with role direction and a generation object (tool image_gen.imagegen,
    promptPath, inputRefs) beside the prompt file's own entry with role prompt and no generation. A
    model name is recorded only when the tool itself exposes one; it is never authored, and it is
    never the host that ran the tool (an Orca-hosted run is the host, not a field). A ui record
    reaches done only with at least one asset carrying generation and a coverage map that names
    every state the record's states list names. Until interface.draw has run, the record stays todo
    and cites a gap.<feature>.direction-not-drawn record in blockedBy - the image is a designed op
    output, not something an agent types into place."
  frontendCaptures: "blobs the implementation record's assets[] cites {artifact?, name, role, sha256} - the running-page
    screenshot and its markup under the same stem, filed from STARCI_JOB_SCRATCH/captures (never under the impl node). These assets never carry a
    generation record - that is what tells a capture and a direction apart regardless of prose
    provenance (see scripts/work/ui/render.mjs's capture-identity rule) - and a generation-bearing asset
    never sits outside a work/ui-screen@1 record's own assets/. Agent data (shape.agentData): its target is job_artifacts(role=capture/dom) + blobs."
  featureCatalog: index.yaml at the .starciwork root, schema work/catalog@1 - one entry per feature
  setup: "index.yaml at the .starciwork root under extensions.work3.setup.<workflow>.<mode>, typed by
    work-catalog.schema.yaml $defs.setup - the record workspace.manage's prepare, import and stacks modes
    write, citing its observations as artifacts (job_artifacts id + sha256); no evidence/ bundle sits beside
    the catalog. No record directory
    sits at the root besides features/, brand/, shell/ and _resources/; workspace.manage writes.node says why
    the catalog carries it."
  feature: features/<feature>/index.yaml
  resources: ".starciwork/_resources/{environments,identities,fixtures}/<name>/resource.yaml, schema
    work/resource@1. uat.verify's reads.environment/reads.accounts/reads.fixtures and
    writes.resources resolve here: an environment resource names target/origins, owner,
    configuration revision, probes and allowedEffects; an identity resource names its provider,
    disposability and a custody ref into the repository's sealed secrets (never a secret value
    itself); a fixture resource names its schema/seed files, preconditions and run-owned namespace.
    A uat-flow's environment and fixtures[] fields, and its accounts.yaml's accounts[].identity
    field, are edges into this family and must resolve to a resource.yaml of the matching kind.
    A repository is not a resource: its portable identity is workspace.yaml repositories[] ({role,
    name}) and its checkout and remote are the host project binding (starci/workspace-binding@2),
    so there is no _resources/repositories/ record; workspace.manage lists a bound repository there
    and keeps observed remote/HEAD/dirty state in its evidence bundle.
    tests/engine/op-work-paths.spec.mjs holds every op manifest's .starciwork paths to this shape."
rules:
  - SRS and SDS are the upstream source of truth for every feature and are independent of source
    code. SRS owns required behavior and SDS owns target technical design. UI, implementation and
    UAT trace to them through stable IDs; current code may prove conformance or expose a gap, but
    never supplies or silently redefines either root.
  - "A specification record separates reviewed-input readiness from completion. A successful decide op
    leaves its authored requirement and design records `state: todo`, usable downstream as reviewed
    inputs, while `state: done` is reserved for final reconciliation: current requirements, design,
    code, test/E2E and UAT evidence must bind one delivery revision. A missing or stale link leaves
    the affected record todo and the workflow partial or blocked. New product delivery authoring
    never rolls a specification record up to done early."
  - "Implementation, ui and uat keep their own state. They are evidence of a specification AND assets with a
    lifetime of their own: a dependency upgrade, a security patch or a refactor is work on them while every
    specification stays correct. Collapsing them into pure evidence of a record would leave nowhere to
    schedule that work except by suspending a specification that is not wrong."
  - "`proven` is counted, not merely stored: the ledger summary reports agreed and proven separately per kind,
    so the gap between a specification corpus and its demonstration is a number an owner reads rather than an
    inference. An unmeasured gap becomes the comfortable default."
  - "A product's brand is one record: brand/index.yaml at the tree root, a sibling of features/, schema
    work/brand@1, with its masters in brand/assets/**. At most one brand record exists per tree; a
    second one, or a brand record anywhere else, is refused. It is a decision, done only through a
    review that names who settled which rev and on what authority, and it is the only place colour
    tokens, typography, mascot, logo, iconography, imagery, voice, motion and the product-wide
    don'ts are authored. Every design operation reads it instead of restating it, and the record
    names the real frontend token or component files its machine checks compare against."
  - "A product's layout tree is one record: shell/index.yaml at the tree root, a sibling of brand/, schema
    work/layout-tree@1, with its captures in
    shell/assets/**. It is generated by scanning the frontend's Next.js app/ directory
    (scripts/work/layout-tree.mjs): one node per segment with its special files and digests - layouts,
    route groups, @slots, (.)intercepts, loading/error/not-found - each visible layout's navigation with
    labels from the i18n catalogs and captures per breakpoint and theme with the page slot measured, plus
    productLocale, demo personas by role and the brand lockup; before a frontend exists its nodes are
    planned. A work/ui-screen@1 declares route, surface (per breakpoint for an overlay), a drawer's
    direction, routed and host, and binds the tree as shell: {ref: shell, rev, layouts: [{node, rev}]} or
    {chromeless: true, because}; its directions are composited into the layout captures
    (scripts/work/compose-direction.mjs) and scripts/work/ui/shell-conformance.mjs holds the record, the
    draws and the implementations to it. At most one shell record exists per tree."
  - "Frontend-facing nodes bind the brand implicitly: a ui node, an implementation or uat node with a
    frontend layout, and any node that names the brand in refs or dependsOn fold the brand's spec
    digest into their own inputDigest. A rev bump or a changed colour therefore suspends their
    completions; no authored edge per screen is required, and backend-only work is untouched."
  - One project owns one canonical .starciwork in its bound source repository. Its product catalog
    is the root index.yaml (shape.featureCatalog); every actual feature owns its own directory of flat family folders,
    features/<feature>/<family>/<name>/index.yaml with the families shape.families lists.
  - The project or repository name belongs in workspace metadata, not a wrapper directory. Do not
    author .starciwork/<project>/, .starciwork/business/ or .starciwork/features/business/.
    Individual features, FE, BE and services do not create another project workspace.
  - A shared rule, data definition, NFR or cross-feature journey has one accountable feature owner.
    Other features reference its stable ID rather than copy it or create a second product-level
    business tree. Parent indexes link to actual children and empty layers are not scaffolded.
  - Retained AI interface.draw images and real running-product screenshots both live under the bound
    backend .starciwork in their owning node assets/**. Identify generated design versus real
    capture and the actual capture environment; external/temp/chat-only media are not stored Work
    deliverables. Keep one owner and reference it across UI/implementation/UAT rather than copying
    bytes.
  - Each record owns one index.yaml inside its family folder and may nest deeper by name segment
    (fr/documents/update/index.yaml sits beside fr/documents/index.yaml, still inside the fr
    family) or carry optional assets/. An acceptance criterion nests one level under the rule it
    accepts (br/<rule>/ac/<name>/); no other family name ever appears inside a family folder.
    Asset subfolders are payload organization, not Work records, and need no index.yaml. Keep
    small scopes flat; do not create empty template folders.
  - Split by independently owned questions and acceptance boundaries, not workflow stages. Names and
    depth stay flexible.
  - "Canonical records use the work/*@1 family schemas. A feature's readable overview is its
    features/<feature>/index.yaml (work/feature@1); the specification itself lives in flat family
    records - fr for functional requirements, nfr for qualities, br for rules, data for data
    definitions, journey for customer journeys and decision for open or settled policy questions.
    Every record is a complete typed document of its own family schema."
  - Each fr record owns its actors, trigger, main/exception flows, postconditions, composes,
    requiresProof and provenBy in one file. Rule, quality, data, decision and journey records
    remain separate addressable owners and link through stable semantic IDs. Parent indexes
    aggregate; they never repeat descendant detail.
  - Create a detailed record only for an actual requirement, quality, rule, decision, data
    definition or journey. Deeper name segments may group related records, but every index.yaml
    is a complete record of its own family - there are no aggregate-only parent indexes.
  - "Only leaves author state: uninvestigate, todo or done. todo is confirmed incomplete work and requires no
    investigation receipt. `todo + activity: idle` is defined work not currently running;
    `todo + activity: investigating|implementing|verifying` is in progress. done is the only state that
    requires bound proof. blockers[] explains impediments without becoming lifecycle state. Parents author
    no state or completion and derive progress from required descendants. Never add an inprogress state."
  - "Reviewed todo SRS/SDS seeds are semantic inputs linked through refs, not execution prerequisites in
    dependsOn. The durable op-job chain orders business.decide, architecture.decide and implementation.
    dependsOn remains for prerequisites that truly must be effectively done; using it for an intentionally
    todo SRS/SDS seed would deadlock delivery."
  - "Authored state is a claim; effective state is the runtime's computation, and they are deliberately not the
    same field. A node whose bound input changed keeps `state: done` with its completion, its evidence and its
    history intact, and the validator derives `effectiveState: suspended` with a reason. Historical proof is
    never rewritten to say the work was not done - it was; what changed is the input it was proved against."
  - "Authored `suspended` is a different word for a different thing - imported or unapproved scope, which
    carries a suspensionReason and never satisfies a prerequisite. The two meanings must not be merged: a
    re-verification of proven work and an unapproved import are opposite situations, and one word for both
    would schedule each as the other."
  - "A derived state still needs a lane. A node with `effectiveState: suspended` is currently skipped by every
    scheduling filter, because they admit `state === 'todo'` alone - so an input-changed node keeps its proof
    and is never re-verified. The lane admits the derived signal, tagged as re-verification against the changed
    input, and the work it schedules is never re-authoring."
  - When investigation occurs, investigation.contextDigest binds semantic context, excluding child
    rollup and auxiliary activity, blockers and history. A semantic parent change makes every
    affected descendant effectively uninvestigate while preserving stored done, completion, history
    and evidence.
  - "dependsOn uses stable node IDs; refs bind semantic inputs without implying execution order. An edge
    records the digest of the slice it bound, so a change invalidates exactly the dependents that bound the
    changed slice - one hop, at the edge. Invalidation is not transitive: a dependent whose own bound slice
    did not change stays as it is, and a root edit therefore cannot suspend a subtree that never read the
    part that moved. Where a dependent is genuinely affected it becomes suspended, keeping its proof."
  - Done is a current status, never an edit lock. Authorized revisions may edit the node and its
    owned assets. Re-evaluate changed inputs and affected dependents; never copy stale completion
    onto changed content. Preserve unrelated work and useful media. New required work prevents
    parent done; unrelated completed branches remain intact.
  - "Freshness reports keep three conditions distinct: source drift means current implementation no
    longer matches an implementation completion's sourceIdentity; evidence invalidation means a
    canonical semantic digest or required proof changed; unavailable input means a required
    repository, revision, asset, tool or proof cannot be resolved. Unavailability blocks an
    observation without rewriting state or guessing drift. Current code never becomes SRS/SDS truth."
  - "Impact follows declared semantic edges and the canonical digest model: ancestor specifications,
    child aggregation, refs, dependsOn, typed SRS/SDS links, resources and implicit frontend brand
    binding. A shared aggregate constraint can legitimately affect several branches; directory
    proximity or an unrelated SRS sibling edit cannot create a global invalidation on its own.
    Reports name the owner, edge and cause and never alter hash policy."
  - Declare semantic design/source files using node.assets with paths under own assets/. Their exact
    bytes contribute to semantic context; conservative hashing does not ignore presumed typo-only
    edits.
  - "Record output screenshots/videos in evidence assets with scope: node and paths under the
    primary owner assets/. Output evidence is not also declared as a semantic input, avoiding
    self-invalidating proof."
  - "Product records, SRS/SDS, UI specifications and brand remain canonical Work in .starciwork.
    Agent/runtime metadata, including execution evidence, captures and renders, lives in SQL
    plus the external blob store even when a product record cites it. The runtime reads no Work proof
    path; operational artifacts use storage=blob and have no repo_path."
  - Source code remains in bound repositories; code/index.yaml tracks requirements, exact source
    references and completion.
  - All structured Work records and results use YAML. JSON and underscore-prefixed directories are
    rejected in canonical records; the only workspace-root underscore directory is _resources for typed
    resource.yaml custody plus declared opaque or encrypted payloads (any other underscore directory is
    a violation). Central schemas stay in .claude.
  - Repository and environment provenance is written directly in sourceRefs or the owning module
    record. refs and dependsOn remain stable technical node IDs for digest propagation.
  - "UAT accounts.yaml uses schema work/disposable-accounts@1 (the example tree's own convention;
    an entry never embeds a literal username/password
    pair: _resources/identities/** holds identities). Each entry is
    {role, identity: <_resources identity resource id>} - a sealed ref, never a synthetic password
    written into the flow's own tree. Images and video remain original binary assets."
  - "Direction, capture and run are three different outputs and never share a shape. interface.draw's
    generated direction is a ui-owned {path, role: direction, generation: {tool: image_gen.imagegen,
    promptPath, inputRefs}} asset with its exact prompt kept as a sibling {role: prompt} asset; a
    model name is recorded only when the tool exposes one, never authored, and never the host (an
    Orca-run image step is the host, not a generation field). frontend.implement's implementation
    capture is a real running-page screenshot the owning impl/<repository>/<name>/ record cites as a blob
    with its markup under the same stem and never a generation record. uat.verify's run is the
    append-only
    run the op's writes.evidence names, filed as blobs of its attempt and cited by the flow's sibling
    evidence.yaml (run {id, result, screens[], videos[]} by sha256). A generation-bearing asset outside a
    work/ui-screen@1 record, or one inside a work/implementation@1 record, is refused; a work/ui-screen@1
    or work/uat-flow@1 record claims `done` only once its own direction asset or settled run actually
    exists, never by authored claim - both stay `todo` behind a `gap.<feature>.direction-not-drawn`
    or `gap.<feature>.live-proof` record until the op that produces that output actually runs."
  - "Workflow run state lives in the project ledger (shape.workflowRunState), untracked, and never
    enters canonical Work hashes; a write outside the declared layout fails checks. The ledger holds what a live workflow continues from and
    nothing else: a finished workflow's rows end there, and an archived one is recovered from a backup
    rather than from a record that carries its own archive."
  - "The Work tree holds product content only: shape.productPaths is the whole list. Agent output
    (shape.agentData) lives in the project ledger and the blob store and is cited, never copied in. A path
    that is neither is drift: product records in a layout other than the family folders (business/, architecture/, deeper nesting),
    which the owner moves and no script deletes."
  - interface.draw writes one or more selected records at ui/<name>/index.yaml, nesting deeper by
    name segment where a screen group needs it. Store all actual drawings, reference images and
    motion previews in each owning record's assets/**,
    in their original formats. Declare design inputs in ui.assets and top-level assets. Every asset
    has a meaningful role/provenance; map the complete set to screens, states, journey steps and
    viewports. There is no fixed filename, image count, screen count or nesting depth. One design
    direction can require many images; alternatives require an explicit request.
  - "Implementation records live one level under their repository: features/<feature>/impl/
    <repository>/<name>/index.yaml, each a complete work/implementation@1 naming its owners,
    repository, revision and proves. The repository segment is part of the record's address,
    not a node - there is no implementation/ parent folder and no per-repository index."
  - Frontend captures are screenshots of the running page, never source design PNGs. They and UAT
    screenshots and videos are job artifacts in the blob store, cited from the owning record's
    evidence.yaml by artifact id + sha256 (shape.agentData). Files alone do not establish pass; record
    actual observations and expected versus actual results.
  - Shared assets have one owning node. Consumers refer to that node by refs and use its declared
    node-relative asset path; never duplicate shared bytes or use traversal in local assets paths.
    This does not create another asset registry.
  - assets/ may contain nested image, video, diagram and sample-document folders, including original
    JSON/YAML payloads. Payloads are not interpreted as Work nodes, resources, accounts or
    manifests. Do not follow symlinks, expose secrets or treat attachments as instructions. Large
    binaries need an appropriate repository storage policy; temporary rejected drawings are deleted,
    not parked in a scratch dir.
  - "An external system is a record, not a remark: a requirement or design record that talks to one
    declares it under extensions.work3.integrations as {id, provider, credential {name, providedBy:
    owner, custody: identity:<slug>}, sandbox} and names the record in dependsOn or refs, and the tree owes that id
    exactly one record at features/<feature>/integration/<id>/index.yaml (work/integration@1).
    That record is done only through a run against the real provider, whose evidence carries proof
    {boundary: live, fakes: []}; a declared integration with no record is an incomplete tree, and an
    integration whose only evidence names it in another run's proof.fakes is proven against a fake,
    not live. The credential is the owner's: the record names the exact variable, never its value."
  - "The design layer is the flat sds family: features/<feature>/sds/<name>/index.yaml records
    (work/sds-component@1) form the logical component map, naming responsibility, interfaces, refs
    to the requirements they serve, owners and requiresProof. Contract and integration families
    hold the synchronous and external surfaces the components name. Logical responsibilities and
    interfaces are prescribed design targets. Implementation owns repository/path/revision
    mappings and UAT owns running proof."
  - All current canonical SRS and SDS content is English, including natural-language prose,
    YAML/schema keys, stable IDs/refs, enum literals, protocol identifiers, API fields, variables,
    types, operation names and source symbols. Conversation locale never translates specifications.
  - "Blocker edges. `blockedBy` is a list of edges, not sentences: each entry is
    `{record: <id>, rev?: <n>, because: <sentence>}`. `record` names an id some record in the tree
    actually owns; `rev` is the blocking record's `change.rev` at the moment the blocker was authored,
    and is omitted only when the blocker does not depend on a particular revision holding. A blocker
    whose target has since reached `state: done` at a `change.rev` greater than or equal to the cited
    `rev` (or at any rev, when none was cited) is stale: the thing that was supposed to unblock it has
    happened, and citing it further would go silently out of date. The gate refuses a stale blocker and
    refuses a `record` that does not resolve. Prose that is not really about a record - an absence with
    no owner - is not authored as `blockedBy` prose; it is a `gap` record (below), and `blockedBy` points
    at its id like any other."
  - "Blockers form a DAG, and a cycle in it is refused outright (BLOCKER_CYCLE): nothing can honestly wait
    on something that is itself waiting on it, so a `blockedBy` chain that reaches back to a record already
    on its own walk is a structural impossibility, not a fact about the work. A chain's real root - the
    reason nothing further needs authoring - is a `work/gap@1` or an open `work/policy-decision@1`
    (`outcome: open`); a chain that dead-ends at an ordinary record instead (neither cyclic nor gap/open-
    decision rooted) is warned rather than refused (BLOCKER_UNROOTED), because forcing a gap to be authored
    for every such dead end in one pass would be a larger sweep than any single change should make - the
    warning names the actual unrooted target so the fact stays visible until a gap is written for it."
  - "Known absences are records, not restated prose. `work/gap@1` lives at
    `features/<feature>/gap/<name>/index.yaml`, id `gap.<feature>.<name>`, and carries `state: todo|done`
    and a plain `statement` of the fact that is missing - an event nobody emits yet, a field no data
    record declares, a module that has not been written under the stack the project is moving to. An
    optional `closedBy: <record id>` names the record whose completion actually closes the gap, so a
    reader can tell an open absence from one already scheduled to close. `blockedBy` and `conflictsWith`
    point at a gap's id exactly as they would at any other record, so the same absence is named once and
    every dependent points at that one name instead of restating it."
  - "Pairwise conflicts, and the sibling for sets. `conflictsWith` stays a list of
    `{record: <id>, rev?: <n>, because: <sentence>}` for two records that currently cannot both be true.
    The gate resolves `record` and, when `rev` is cited, refuses a mismatch against the target's current
    `change.rev`. Three or more records that are each individually true and jointly unsatisfiable are not
    a chain of pairwise conflicts; they are a set only the settling decision can resolve, so `tension:
    {records: [<id>, <id>, ...], statement: <sentence>}` is authored on the `work/policy-decision@1` record
    that owns settling them, and refused anywhere else. The gate requires every id in `records` to resolve
    and at least two of them."
  - "A decision's vocabulary is closed. `work/policy-decision@1` authors `outcome: open | decided`,
    `options: [{id, consequence, summary?}]`, `chosen?: <option id>` (required exactly when
    `outcome: decided`, and refused unless it names an id present in `options`), and an optional
    `blocks: [<record id>]` naming what the decision's settling unblocks. A decision does not invent its
    own outcome vocabulary by writing the chosen option's id (or any other free-form word) directly into
    `outcome`, and it does not carry a `targetModule` or similar ad hoc pointer to where the decision will
    eventually be implemented - that belongs to the `implementation` record that later proves it, not the
    decision."
  - "Change is authored, staleness is derived, and neither is folklore. `change: {rev, kind:
    initial|editorial|clarifying|breaking, at, withdraws?: [<exact statement>], retains?: [<exact
    statement>], reason?}` records one authored edit; `withdraws` names statements this rev removes
    verbatim and `retains` names statements an editorial pass keeps verbatim, so a change that removes
    half a sentence is not forced to withdraw the whole thing to be honest about what moved. On
    `work/evidence@1`, `stale?: true`, `staleSince?: {record: <id>, rev?: <n>}` and `staleReason?` say a
    passed run no longer speaks for the record beside it. The digest that decides this is the kernel's
    own: sha256 of the record's `index.yaml` file bytes — the digest `engine/digest.mjs` sha256File
    computes — computed for reconciliation. An `evidence.yaml` whose `recordDigest`
    does not equal that digest, computed now, must carry `stale: true`; the gate refuses one that does
    not. Staleness is never cleared by editing `recordDigest` to match - only a fresh run, which is a
    kernel act, clears it."
  - "`work/evidence@1`'s `provenance.actor` names who ran the assertions, and the value is a claim that must
    be true, not a label of convenience. `starci-kernel` means a live kernel workflow's own
    `ctx.work.api.markDone` write settled the record, re-running the checks itself. `example-evidence`
    means `scripts/example/example-evidence.mjs` produced the file by actually running the given commands outside
    any kernel workflow, against one of the example trees - a real run, with a real recordDigest, just not
    one a kernel operation performed. Neither actor authors `state` on the record beside it; only a
    person or a kernel operation does that."
  - "Done means proven or says so. A record with `state: done` needs a sibling `evidence.yaml`, or an
    authored `verificationSource: authored-claim` with a `because:` sentence saying why no run proves it.
    `work/data@1`, `work/brand@1` and `work/policy-decision@1` are authored claims by nature - a data shape, a
    brand token or a settled decision is true because it was written down and agreed, not because a test
    ran - so the gate treats every `done` record of those three schemas as satisfying this rule without
    the declaration being repeated on each one. Every other schema needs the evidence file or the explicit
    declaration; the gate refuses a `done` record of any other schema that has neither. Requirement
    and design records are not authored-claim exceptions: their final done requires current
    reconciliation evidence covering requirements, design, code, test/E2E and UAT at the same
    delivery revision."
  - "A rule may constrain a record it does not own. `work/business-rule@1` and `work/sds-component@1` may
    carry `appliesTo: [<record id>]`, an outbound edge naming a record - owned by any feature - that the
    rule's or component's requirement reaches even though the rule does not own it and does not edit it.
    The gate only resolves the ids; it does not require the target to acknowledge the edge back. The
    derived consequence is one sentence: a `done` record that acquires an `appliesTo` edge newer than its
    proof reads as `effectiveState: suspended` until it is re-proven against the new constraint, the same
    way a changed input suspends a record that read it. `appliesTo` is refused on any other schema -
    `work/data@1` in particular does not carry it, because a data record's relationship to the rules it
    embodies is `refs`, an inbound reading, not an outbound constraint on a record it does not own."
  - "Events are a family; data may extend data; time may trigger. `work/event@1` lives at
    `features/<feature>/event/<name>/index.yaml`, id `event.<feature>.<name>`, and authors `producer: <record
    id>` (the record whose flow raises it), `payload: [{name, type, note?}]` and `delivery: {guarantee:
    at-least-once|at-most-once|exactly-once, ordering: none|per-key|total}`. A consumer declares
    `subscribes: [<event id>]`, each id resolving to a `work/event@1` record; `work/contract@1` remains for a
    synchronous request/response surface and is not overloaded to describe a fire-and-forget signal. On
    `work/data@1`, `extends?: <data id>` names a base data record this one specializes, with `adds: [<field
    definition>, ...]` listing only the fields the base does not already declare - the shared fields are
    inherited, not repeated as a fresh disagreement about the base's shape. On `stateMachine.transitions[]`,
    `on` may be the plain string it always was, or `{timer: <duration or plain-language description>}` when
    what actually fires the transition is a clock, not an event - a digest window closing, a scheduled
    tick - and the gate accepts either shape."
  - "Implementation names owners, plural. `work/implementation@1` authors `owners: [{role, path}]` - each
    entry the path of one real or intended artifact and the role it plays (`module`, `route`, `entry`,
    `block`, or another short word naming the kind of unit) - because one screen or one flow can span more
    than one owned artifact (a route adapter, a feature entry, a connected block and its pure twin) and a
    single `directory`/`files` pair cannot name more than one shape at a time. `work/business-rule@1.module`
    may be a plain string, for the ordinary one-module case, or a list of strings when the rule's module
    genuinely spans more than one path. The gate refuses `directory`/`files` on `work/implementation@1` —
    `owners` carries that shape instead — and the gate refuses an `owners` entry missing either `role` or
    `path`."
  - "One app repository hosts the record tree. `.starciwork` lives at the app root;
    `.workspaces/projects/<project>/work.json` binds that repository and resolves be and fe to
    their side folders. `hfs.json` declares the app and its sides. Every feature record lives
    under the flat `features/<feature>/<family>/<name>/index.yaml` tree."
