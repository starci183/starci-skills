$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:work:disposable-accounts:1
type: object
additionalProperties: false
description: "The identities a UAT flow signs in with, collocated with the flow that uses them. It is the one
  family whose whole purpose is a prohibition: the values here are synthetic, local and disposable, and a
  real credential must never be written into this file, because it is tracked, it is read by anybody who can
  read the tree, and it will still be there long after the walk it was written for. The record carries no id
  and no state - it is a fixture belonging to its flow, not a unit of work that can be finished - and the
  flow points at it by filename."
required:
  - schema
  - accounts
properties:
  schema:
    const: work/disposable-accounts@1
    description: Record family discriminator. Every record names its own family so a file can be validated
      without inferring its meaning from the directory it happens to sit in.
  accounts:
    type: array
    minItems: 1
    uniqueItems: true
    description: The identities the walk uses, one per role it needs. At least one is required, because a
      fixture with no account cannot sign anybody in; more than one is the normal case, since the
      interesting half of most walks is what a second person is refused.
    items:
      type: object
      additionalProperties: false
      required:
        - role
        - username
        - password
      properties:
        role:
          $ref: "#/$defs/slug"
          description: What this identity is in the walk - the owner, a stranger. The steps name the role
            rather than the username, so that a reader follows who is acting without tracking which
            synthetic account was allocated to them.
        username:
          $ref: "#/$defs/prose"
          description: The synthetic local username to sign in with. It is written plainly because it is
            disposable by construction; a username that would be recognisable as a real person's is the
            wrong value for this field.
        password:
          $ref: "#/$defs/prose"
          description: The disposable password for that synthetic account, and nothing that would ever open
            anything else. It is stored in the clear precisely because it must be worthless - a field that
            could hold a real secret would eventually hold one, and no schema can tell the difference by
            looking, so the rule is that every value here is created for the walk and thrown away after it.
$defs:
  prose:
    type: string
    minLength: 1
    description: A nonempty sentence a person reads. An empty string is an unwritten field pretending to be
      a written one, so it is refused at the type.
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: A lowercase hyphenated name with no dots. Casing and separators are fixed so that an id
      written twice by two authors is the same string.
