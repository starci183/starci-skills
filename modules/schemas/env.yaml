schema: starci/env-catalog@1
module: scripts/lib/env.mjs

purpose: >-
  The catalog of every environment variable the runtime reads or sets. scripts/checks/check-env.mjs holds the source to it:
  a variable absent here is RT_ENV_UNCATALOGUED, a direct read of process.env outside the reader module is
  RT_ENV_READ_OUTSIDE_OWNER, production code branching on the test runner is RT_TEST_ENV_IN_PRODUCTION, an entry nothing
  reads is RT_ENV_STALE_ENTRY.

reader: scripts/lib/env.mjs

kinds:
  config: a setting an owner or an agent may export to change what the runtime does
  seam: a switch or override that isolates or redirects the runtime for a spec or a probe
  handoff: a value the runtime sets for the process it launches
  host: a fact of the host, the OS or another tool, read as it is
  secret: a value only the owner holds, kept in the one untracked .claude/secret.env (listed in secret.env.example) and read only through engine/secrets.mjs; the runtime repository tracks no secret file (RT_SECRET_TRACKED)

variables:
  SONAR_TOKEN: {kind: secret, purpose: "The SonarCloud token of everything that lives in the runtime repository: the release's Sonar proof of the three examples (scripts/supervisor/release-sonarcloud.mjs) reads it from secret.env, and the runtime's own CI and examples.yml use the repository secret of the same name; scripts/gates/sonar-credentials.mjs reads the analysis token of a product run from the environment; never printed or minted by analysis."}
  SONAR_ORGANIZATION: {kind: config, purpose: "The SonarCloud organization key (configuration, not a secret): it wins over config.yaml sonar.organization when the release's Sonar proof composes the example project keys <organization>_<declared key> (scripts/supervisor/release-sonarcloud.mjs sonarOrganization); CI reads the repository variable of the same name."}
  SONAR_HOST_URL: {kind: config, purpose: "Selected Sonar analysis server URL resolved by scripts/gates/sonar-local.mjs; explicit options or the governing declaration may supply it instead."}
  APPDATA: {kind: host, purpose: "Windows per-user roaming application-data root, set by the OS; the runtime derives Devin CLI and Orca data paths from it, defaulting to the roaming application-data folder under the user home when unset."}
  CI: {kind: host, purpose: "Non-empty marker CI providers set on their runners; runStep in scripts/supervisor/push-git.mjs forwards it to the test children it spawns, defaulting to '1' when unset."}
  COMSPEC: {kind: host, purpose: "Windows command-interpreter path set by the OS; run-real-tool uses it to execute resolved .cmd and .bat launchers without shell lookup, defaulting to cmd.exe when unset."}
  CLAUDE_CODE_GIT_BASH_PATH: {kind: host, purpose: "Path of the Git Bash executable Claude Code runs hooks and shell tools in on Windows, set by the user; scripts/api/process/probe-guard-command.mjs runs the guard hook command through it, falling back to the bin/bash.exe of the Git installation git resolves to."}
  CLAUDE_CODE_SESSION_ID: {kind: host, purpose: "Session id Claude Code exports into the chat or terminal process it runs; scripts/supervisor/channel.mjs records it to bind the supervisor channel to that chat session, empty when absent."}
  CLAUDE_CONFIG_DIR: {kind: host, purpose: "Claude Code's own config-directory override, set by the user or Claude; agent trust and op-session read it as one agent-home candidate, default <home>/.claude."}
  CODEX_HOME: {kind: host, purpose: "Codex CLI's home directory, set by the user or by Orca for its embedded codex; agent trust, op-session and session housekeeping read it among the codex homes, and the runtime re-exports it to launched agents."}
  GIT_CONFIG_COUNT: {kind: host, purpose: "Count git sets when it hands `-c` config to a child (hook) process; the git-policy guard reads it with GIT_CONFIG_KEY_<n>/GIT_CONFIG_VALUE_<n> to judge a command's effective config."}
  GIT_CONFIG_PARAMETERS: {kind: host, purpose: "Sq-quoted 'k=v' entries git uses to carry `-c` options into children; the git-policy guard decodes it for the same audit."}
  GITHUB_REF: {kind: host, purpose: "Git ref GitHub Actions sets for a workflow run; scripts/gates/runtime-artifact.mjs records it in the runtime-artifact manifest, null when unset."}
  GITHUB_RUN_ATTEMPT: {kind: host, purpose: "Attempt number GitHub Actions sets for a workflow run; scripts/gates/runtime-artifact.mjs records it in the runtime-artifact manifest, null when unset."}
  GITHUB_RUN_ID: {kind: host, purpose: "Run id GitHub Actions sets for a workflow run; scripts/gates/runtime-artifact.mjs records it in the runtime-artifact manifest, null when unset."}
  GITHUB_SHA: {kind: host, purpose: "Commit sha GitHub Actions sets for a workflow run; scripts/gates/runtime-artifact.mjs records it in the runtime-artifact manifest, null when unset."}
  GITHUB_STEP_SUMMARY: {kind: host, purpose: "File path GitHub Actions sets for the step summary; scripts/gates/install-sandbox.mjs appends its markdown summary there, nothing is written when unset."}
  GIT_INDEX_FILE: {kind: handoff, purpose: "Git index-file pointer the runtime sets for the private-index commits it stages (snapshot-commit, workflow-checkpoint); the git-policy guard reads it to treat staging into a private index as safe."}
  HOME: {kind: host, purpose: "POSIX home directory set by the OS; the home fallback wherever USERPROFILE is absent."}
  LOCALAPPDATA: {kind: host, purpose: "Windows per-user local application-data root, set by the OS; only the lanes default reads it (<LOCALAPPDATA>/StarCi/lanes, scripts/machine/home.mjs lanesDefault, kept out of the checkout); the host state base is <runtime root>/.runtime."}
  NODE_TEST_CONTEXT: {kind: seam, purpose: "Marker `node --test` sets into every spec process tree; isSpecRun() of scripts/lib/env.mjs is the one reader and production code never touches host state when it is present."}
  ORCA_CLI_COMMAND: {kind: host, purpose: "Executable selected by Orca for managed sessions such as WSL; scripts/api/orca/lib.mjs honors it after the explicit StarCi command override and never retries another build."}
  ORCA_TERMINAL_HANDLE: {kind: host, purpose: "Terminal handle Orca exports into every terminal it owns; guards and kernel verbs read it to bind a caller to its Orca terminal, empty outside Orca."}
  PATH: {kind: host, purpose: "Executable search path of the host OS; binary lookups (sonar-ext-custody resolveCommand, host-agents onPath, the assisted-runner SAFE_ENV allowlist) read it or forward it to children."}
  PATHEXT: {kind: host, purpose: "Windows executable-extension list set by the OS; agent-binary and sops lookups split it (default '.EXE;.CMD;.BAT') to resolve a CLI file."}
  SOPS_AGE_KEY: {kind: config, purpose: "Inline age identity supplied locally through the canonical runtime environment; engine/secrets.mjs owns selection and its held execution prerequisite."}
  SOPS_AGE_KEY_FILE: {kind: config, purpose: "Explicitly selected original age identity file forwarded by engine/secrets.mjs; no identity file is inferred when absent."}
  SOPS_AGE_KEY_CMD: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_AGE_SSH_PRIVATE_KEY_FILE: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_AGE_SSH_PRIVATE_KEY_CMD: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_AGE_RECIPIENT: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_KEYSERVICE: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_ENABLE_LOCAL_KEYSERVICE: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_DECRYPTION_ORDER: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_KMS_ARN: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_GCP_KMS_IDS: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_HUAWEICLOUD_KMS_IDS: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_AZURE_KEYVAULT_URLS: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_VAULT_URIS: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_PGP_FP: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  SOPS_AGE_RECIPIENTS: {kind: host, purpose: "Upstream SOPS input removed by scripts/api/sops/lib.mjs from a selected inline invocation; it cannot add identity, remote-service or recipient authority to that child."}
  STARCI_ACTOR: {kind: handoff, purpose: "Actor tag the reconciler ('reconciler/<controller>') and the supervisor ('supervisor') export into the children they spawn so verbs and decisions know the non-Kernel actor; unset for a direct call."}
  STARCI_AGENT_TRUST_HOME: {kind: seam, purpose: "Re-roots every agent-trust write target (Claude config dir, codex homes) under one directory for a spec; unset in a spec run, trust writes are refused outright."}
  STARCI_API_CHILD: {kind: handoff, purpose: "Set to '1' by apiRun for the children of graph-edit and redesign verbs so decisions.mjs knows the caller is an api child; unset for a top-level call."}
  STARCI_APP_INSTALLS: {kind: handoff, purpose: "Path-delimiter list of node_modules directories a spec may borrow packages from; set by release-app-installs and CI for the spec processes they launch."}
  STARCI_ARCHIVE_ROOT: {kind: config, purpose: "Repoints the archive root (session files, blob retention, ledger backups); set by the owner or an agent, winning over config roots.archive, default <starciLocalRoot>/archive (<runtime root>/.runtime/archive)."}
  STARCI_ARTIFACT_ROOT: {kind: config, purpose: "Repoints the content-addressed blob store (<sha[0:2]>/<sha256> files); the owner or a debug probe sets it, default <starciLocalRoot>/artifacts (<runtime root>/.runtime/artifacts)."}
  STARCI_ASSISTED_UAT_PROTOCOL: {kind: handoff, purpose: "Stdout line prefix the assisted-UAT runner sets for the launched script so its structured protocol lines are recognizable; always the PROTOCOL_PREFIX constant."}
  STARCI_ASSISTED_UAT_REQUEST: {kind: handoff, purpose: "Path of the frozen assisted-UAT request file the runner sets for the launched script."}
  STARCI_ASSISTED_UAT_RUN_DIR: {kind: handoff, purpose: "Run directory (state, checkpoints, receipt) the assisted-UAT runner sets for the launched script."}
  STARCI_AUTOPILOT: {kind: seam, purpose: "'on'|'off' override of the runtimes.yaml autopilot.enabled default for this process, exported mainly by specs exercising the owner flow; unset means the config decides."}
  STARCI_CALLER: {kind: handoff, purpose: "Set to 'runtime-settler' by job-settle for the settler children it launches; check and settle read it to attribute re-run checks and the settling actor."}
  STARCI_CLAUDE_PROJECTS_ROOT: {kind: seam, purpose: "Path-delimiter override listing the directories that hold <project-slug>/ Claude transcript folders for hk-claude; default <USERPROFILE|HOME>/.claude/projects."}
  STARCI_CLAUDE_SUPERVISOR_PROJECT: {kind: config, purpose: "Pins the supervisor's Claude project slug so housekeeping exempts its transcripts while the desktop session is alive; unset means the slug is derived from the workspace."}
  STARCI_CLAUDE_SUPERVISOR_WORKSPACE: {kind: config, purpose: "Pins the supervisor's Claude workspace cwd (slugified the way Claude Code names projects) for the same exemption; unset means the Source root."}
  STARCI_CLOUDFLARED_ARGS: {kind: seam, purpose: "JSON list of prefix arguments that replaces the cloudflared invocation; specs set it with STARCI_CLOUDFLARED_COMMAND to run a fake, default []."}
  STARCI_CLOUDFLARED_COMMAND: {kind: seam, purpose: "Replaces the cloudflared binary; a spec must point it (with STARCI_CLOUDFLARED_ARGS) at a fake since a spec run never launches the real binary, default 'cloudflared'."}
  STARCI_CO_AUTHOR: {kind: config, purpose: "Default Co-Authored-By trailer value for starci git commit when --co-author is absent; the caller sets it, and an unset value adds no co-author trailer."}
  STARCI_CONNECTORS_OFF: {kind: config, purpose: "'1' turns every connector (telegram notify/media, cloudflared tunnel, bridge) into a no-op; the owner or a spec exports it, unset means connectors follow the owner config."}
  STARCI_DEPTH_PROBE_AGENT: {kind: seam, purpose: "Agent id the worker-depth probe launches to measure Orca's depth limit; default 'claude'."}
  STARCI_DEVIN_SEAT_ENDPOINT: {kind: seam, purpose: "Overrides the Devin seat API URL the quota probe reads; honored only for loopback URLs, default the seat's own endpoint."}
  STARCI_DOCKER: {kind: config, purpose: "docker command name or path the local sonar gate shells out to; set by the owner, default 'docker'."}
  STARCI_ENGINE_START_REASON: {kind: handoff, purpose: "Why the engine started ('self-reload'|'manual'), set by the launcher for the engine process and deleted right after the engine reads it."}
  STARCI_ENV_GATE: {kind: config, purpose: "'off' skips the environment-health pre-step of env-gated dispatch ops (the --env-gate off equivalent); the owner or an agent exports it, unset means the gate runs."}
  STARCI_ENV_PROBE_TIMEOUT_MS: {kind: seam, purpose: "Per-probe timeout bound of the env-health check, exported by specs to keep waits small; default 20000 ms."}
  STARCI_GIT_MEMO_DIR: {kind: seam, purpose: "Re-roots the kernel cli's memoized git-answer directory; a spec points it at a temp dir, default <os tmp>/starci-git-memo."}
  STARCI_GRAMMAR_DIST: {kind: seam, purpose: "Pins the claude-dist/grammar package root for draw-grammar when --grammar-dist is absent; used as given (a lane checkout or spec fixture), default the runtime's own packages/grammar."}
  STARCI_GUARDS_ROOT: {kind: seam, purpose: "Relocates the guard-state directory (default <starciLocalRoot>/guards); every spec process gets its own so parallel specs never share bound guards."}
  STARCI_GUARD_FILE: {kind: handoff, purpose: "Path of the guard file bound to the calling Orca terminal; hook-install exports it into the verify-commit pre-commit child so the gate can check owned paths."}
  STARCI_HK_SESSIONS_MODULE: {kind: seam, purpose: "Module specifier op-session imports for session housekeeping; a spec points it at a stub, default scripts/housekeeping/hk-sessions.mjs."}
  STARCI_HOST_LOCK_DIR: {kind: seam, purpose: "Relocates the host lock directory (default <starciLocalRoot>/host-lock): the one lock that serialises heavy runs on the host (scripts/machine/host-lock.mjs); a spec points it at a temp directory."}
  STARCI_HOST_RESOURCES_JSON: {kind: seam, purpose: "JSON override of the host resource probe (drive free space, RAM) that dispatch admission and the RAM throttle read; a spec's fake measurements, unset means probe the live host."}
  STARCI_HOST_WAIT_MS: {kind: seam, purpose: "Overrides allocation.hostOutage.waitMs (how long a watchdog tick waits for an unreachable Orca); the declared runtimes.yaml value is the default, the env name is the spec seam."}
  STARCI_KERNEL_DEATH_SETTLE_MS: {kind: seam, purpose: "Overrides allocation.hostOutage.deathSettleMs (the grace before a dead Kernel's jobs settle); the declared runtimes.yaml value is the default."}
  STARCI_KERNEL_REV_ROOT: {kind: seam, purpose: "Repoints the runtime root whose HEAD is the stamped revision; the spec seam, default the skill root."}
  STARCI_KNOWLEDGE_DIR: {kind: config, purpose: "Knowledge directory generate-rule-catalog reads when argv[2] is absent; set by the caller, default the sibling starci-academy-backend/.claude/knowledge tree."}
  STARCI_LANES_ROOT: {kind: config, purpose: "Repoints the lane-worktree root, winning over config roots.lanes; the owner sets it (e.g. moving lanes off C:), default the per-user profile directory <LOCALAPPDATA>/StarCi/lanes (<STARCI_LOCAL_ROOT>/lanes when that seam is set), resolved by scripts/machine/home.mjs lanesRoot and kept out of the checkout's .runtime."}
  STARCI_LINT_BOUND: {kind: handoff, purpose: "App-root path `starci app lint` sets for the ESLint child so the bound-sys preload confines TypeScript's project resolution inside it; unset means nothing is patched."}
  STARCI_LOCAL_ROOT: {kind: config, purpose: "Replaces the whole host state base for a process tree (debug probes and spec trees); default <runtime root>/.runtime."}
  STARCI_MACHINE_BUSY_TIMEOUT_MS: {kind: seam, purpose: "Positive-integer override of the machine.sqlite writer's busy_timeout; the documented test seam, unset in production."}
  STARCI_MACHINE_DB: {kind: seam, purpose: "Points ui/api/db.mjs at a specific machine.sqlite (a seeded fixture) instead of resolving the host's; unset means the normal machineFileFor resolution. Also the generic machine-db Error.code."}
  STARCI_MARKER: {kind: handoff, purpose: "Not a settable variable: the regex constant in scripts/kernel/terminal-dedupe.mjs matching the '[Kernel]'/'op-<name>-<sha>' markers the runtime stamps into the Orca terminal titles it launches."}
  STARCI_ORCA_ARGS: {kind: seam, purpose: "JSON list of prefix arguments that replaces the orca CLI invocation; specs point it at a node stub, default []."}
  STARCI_ORCA_CODEX_HOME: {kind: seam, purpose: "Re-roots Orca's codex-runtime-home for a spec; default the Electron userData/codex-runtime-home/home directory."}
  STARCI_ORCA_COMMAND: {kind: seam, purpose: "Replaces the orca CLI command; specs point it at a stub so no real Orca call runs, default 'orca' resolved per platform."}
  STARCI_ORCA_LIVE: {kind: seam, purpose: "'1' opts into a live Orca probe (the worker-depth measure, live settle smokes) that otherwise never runs; unset means config-only."}
  STARCI_ORCA_SKIP_LIVE_CHECK: {kind: seam, purpose: "'1' skips the live host-contract drift check before mutation orca calls; documented to exist for specs and stubbed binaries only."}
  STARCI_ORCA_USER_DATA: {kind: seam, purpose: "Re-roots Orca's Electron userData folder (settings file, codex home base) for a spec; default the platform's userData directory."}
  STARCI_OWNER_CONFIG_WITHIN: {kind: config, purpose: "Confines the owner config.yaml to a directory tree: when set, an owner file is read only from under that directory, else every owner file is visible; read by engine/config.mjs, set by tests/setup/isolated-temp.mjs to the spec's own temp root so a spec never reads the live file."}
  STARCI_OWNER_ROOT: {kind: seam, purpose: "Points config.yaml readers at a different owner directory; a test and tooling seam, default the skill root."}
  STARCI_PLAYWRIGHT_DIR: {kind: config, purpose: "Directory whose node_modules holds playwright for the draw and geometry tools when neither the repo nor the runtime resolves it; the owner sets it, unset means only repo/runtime installs."}
  STARCI_PROJECTS_ROOT: {kind: config, purpose: "Repoints the projects/ ledger directory (one runtime.sqlite per project); the owner or a spec sets it, default <starciLocalRoot>/projects."}
  STARCI_PUSH_GIT: {kind: handoff, purpose: "Set to '1' by push-git's runStep for the test children it spawns, marking them as inside a push pipeline run."}
  STARCI_RECONCILER_EPOCH: {kind: handoff, purpose: "Epoch the reconciler exports into every child it spawns so the child knows which reconciler generation launched it."}
  STARCI_RELOADED_AT: {kind: handoff, purpose: "Timestamp the self-reload sets for the relaunched engine; read once at boot, then deleted."}
  STARCI_RELOAD_PINNED_TEMP: {kind: handoff, purpose: "Set to '1' by an engine self-reload that pinned STARCI_TEMP_ROOT because its own code could not read config.yaml; the relaunched engine deletes both variables at boot and reads config.yaml itself."}
  STARCI_RELOAD_HANDOVER_FROM: {kind: handoff, purpose: "Identity of the engine the self-reload hands over from, set for the relaunched engine; read once at boot, then deleted."}
  STARCI_RELEASE_CUT: {kind: handoff, purpose: "Set to '1' by the release-cut flow for its test child so starci test run may admit the otherwise-refused L4 scope; unset outside that flow."}
  STARCI_REQUIRE_ORCA_LIVE: {kind: handoff, purpose: "Set to '1' by the L4 row of the release cut for its spec run (and by CI) so the live Orca specs execute and a missing Orca or terminal fails them instead of skipping them quietly; it implies the opt-in of STARCI_ORCA_LIVE."}
  STARCI_REQUIRE_APP_INSTALLS: {kind: handoff, purpose: "Set to '1' by release-app-installs and CI for the spec children they launch so a missing app install fails the spec instead of skipping it."}
  STARCI_RUNTIME: {kind: config, purpose: "Root of the StarCi runtime tree the starci dispatcher runs runtime groups from (first in the locate order, before the per-user runtime.json and an upward .claude search); git hooks the runtime writes set it so a hook finds the runtime without PATH."}
  STARCI_ROLE: {kind: handoff, purpose: "The rights role a session claims (op, supervisor, lead, coordinator, release): the launch that starts the session sets it, the command guard reads it (scripts/guards/rights.mjs rightsRoleOf). A claim of release counts only while the host lock is held live by role release; a guard or seat bound to the Orca terminal decides first."}
  STARCI_RUNTIME_REV: {kind: seam, purpose: "Overrides the stamped runtime revision (writerRev/sourceRev) the machine db records; a spec/probe sets it, default the checkout's HEAD-derived rev and 'unknown' outside a checkout."}
  STARCI_SESSION_ARCHIVE_ROOT: {kind: seam, purpose: "Re-roots where a settled session's archive is written for a spec; default the normal archive-root resolution."}
  STARCI_SETTLER_PARITY: {kind: config, purpose: "'0' turns the canon parity verifier off (the documented rollback of the canon-parity-settle change); the owner or an agent exports it, default '1'."}
  STARCI_SLEEP_SCALE: {kind: seam, purpose: "Number >= 0 multiplying every runtime wait (sleepSync and the db busy backoff); the test seam, default 1."}
  STARCI_SONAR_CONTAINER: {kind: config, purpose: "Docker container name the local sonar gate execs into; set by the owner, default the declared stack's container."}
  STARCI_SONAR_HOST_URL: {kind: config, purpose: "SonarQube host URL the local sonar gate scans against; set by the owner, default the declared host."}
  STARCI_SONAR_STACK: {kind: config, purpose: "Path of the sonar docker stack the local gate drives; set by the owner, default the Source host's stack directory."}
  STARCI_SOPS: {kind: config, purpose: "sops binary path or command the custody gate uses; set by the owner, default the PATH/winget resolveCommand lookup."}
  STARCI_SOURCE_ROOT: {kind: config, purpose: "Points the runtime at the StarCi Source root (the host holding .claude and .workspaces); set for a runtime copy in a worktree or lane, default the checkout's parent."}
  STARCI_STATUS_MEMO: {kind: config, purpose: "'off' disables the kernel cli's memoized status prefetch answers; the owner exports it, unset means memoized answers are served."}
  STARCI_STATUS_PORT: {kind: config, purpose: "Port the ui/server.mjs status UI listens on; the owner sets it, default 4547."}
  STARCI_SUPERVISOR_MODE: {kind: config, purpose: "Overrides config.yaml supervisor.mode ('chat'|'kernel'); the owner or a spec exports it, invalid values are ignored."}
  STARCI_SUPERVISOR_ONLINE_MS: {kind: config, purpose: "How young a supervisor heartbeat must be to count as online for the telegram bridge; the owner or a spec exports it, default the ONLINE_MS constant."}
  STARCI_SWC_CACHE: {kind: config, purpose: "Directory of the @swc/core native-binding cache that `next build` uses (scripts/gates/build-env.mjs); set by the owner when the default, `starci-swc-cache` under the user home, is unusable."}
  STARCI_TELEGRAM_API_BASE: {kind: seam, purpose: "Replaces https://api.telegram.org for every connector call; a spec points it at a fake since a spec run never reaches the real Bot API, unset means the default."}
  STARCI_TEMP_ROOT: {kind: config, purpose: "Repoints the temp root (every temporary file the runtime creates, and TEMP/TMP/TMPDIR of the processes it starts), winning over config roots.temp, default the OS temp directory; resolved by engine/temp-root.mjs tempRoot, set by the owner or by tests/setup/isolated-temp.mjs for a spec process tree."}
  STARCI_TEST_MACHINE_FILE: {kind: seam, purpose: "Names the exact machine.sqlite a spec process tree opens (TEST_REGISTRY_ENV); the spec seam, default <starciLocalRoot>/machine.sqlite."}
  STARCI_TUNNEL_BACKOFF_MS: {kind: seam, purpose: "First cloudflared restart backoff in milliseconds, exported by tests; default 1000 ms, doubling to 60 s."}
  STARCI_CONNECTOR_LAUNCH: {kind: handoff, purpose: "Fresh tunnel-child launch nonce verified through the same captured process handle before recording PID custody; never a credential or owner setting."}
  STARCI_TUNNEL_OWNER_CHECK_MS: {kind: config, purpose: "How often the cloudflared lock holder re-checks for another live owner; the owner or a spec sets it, default 30000 ms."}
  STARCI_UAT_MAX_CONCURRENT: {kind: config, purpose: "Overrides config uat.maxConcurrent for one process tree; the owner or a spec sets it, default 10."}
  STARCI_UAT_RECORDINGS_ROOT: {kind: config, purpose: "Where assisted-UAT playwright recordings land when the caller names no directory; the owner or a spec sets it, default <os tmp>/starci-uat-recordings."}
  SWC_NATIVE_BINDING_CACHE: {kind: seam, purpose: "Directory passed to changed-code lint and typecheck children for SWC native bindings; the land gate accepts an injected override and otherwise uses starci-swc-cache under the OS temporary directory."}
  TEMP: {kind: host, purpose: "Windows temp directory set by the OS; engine/temp-root.mjs osTempDir and tempDirsOf read it (with TMP, TMPDIR and os.tmpdir()) as the OS temp directory the temp root falls back to, and the runtime sets it in the children it starts to the temp root."}
  TMP: {kind: host, purpose: "POSIX-style temp directory set by the OS or shell; read with TEMP as the second temp-dir candidate."}
  TMPDIR: {kind: host, purpose: "POSIX temp directory set by the OS or shell; engine/temp-root.mjs osTempDir reads it after TEMP and TMP, and the runtime sets it in the children it starts to the temp root."}
  USERPROFILE: {kind: host, purpose: "Windows user profile root set by the OS; the first home fallback before HOME/os.homedir()."}
  SYSTEMROOT: {kind: host, purpose: "Windows system directory set by the OS (SystemRoot); scripts/api/process/system-tool.mjs resolves PowerShell, schtasks, netstat, tasklist and nvidia-smi under its System32, defaulting to the standard Windows folder on drive C when both this and WINDIR are unset."}
  WINDIR: {kind: host, purpose: "Windows system directory set by the OS (windir); the fallback of SystemRoot for scripts/api/process/system-tool.mjs."}
  XDG_CONFIG_HOME: {kind: host, purpose: "XDG config root on Linux/macOS set by the user; codex/claude home resolution and hk-devin read it, default ~/.config."}
