group: supervisor
verb: start
owner: runtime
summary: enable and start the one long-lived Supervisor seat
impl:
  script: scripts/supervisor/start-supervisor.mjs
flags:
  - name: plan
    type: boolean
    summary: prove the launch plan without starting the seat
  - name: reason
    type: string
    summary: owner reason recorded with the launch
internalFlags:
  - {name: replace, pointer: "the watchdog replaces a dead seat itself; to reload the standing prompt run starci supervisor stop, then starci supervisor start"}
  - {name: rotate, pointer: "the watchdog rotates an idle Supervisor itself (scripts/supervisor/seat-rotation.mjs); to reload the standing prompt run starci supervisor stop, then starci supervisor start"}
  - {name: restart, pointer: "run starci supervisor stop, then starci supervisor start"}
exit:
  "0": supervisor started or already healthy
  "1": launch refused or failed
  "75": Orca is not answering (host unavailable)
  "2": bad usage
json: flag
examples:
  - starci supervisor start
  - starci supervisor start --plan
editions: [full]
