group: runtime
verb: verify
owner: runtime
summary: verify a commit - the check, package clean-test and scaffold e2e on one commit, one receipt
impl: {module: scripts/reconciler/runtime-verify.mjs, export: runtimeVerify}
effect: host
runtimeSide: tree
roles: [worker, lead, coordinator, release, owner]
conventions:
  - "A branch is verified only by this receipt: check N of N, the clean-test of every package base..tip touches, the scaffold e2e."
  - "The runtime has no specs of its own (owner ruling no-runtime-specs): package specs and the scaffold e2e decide."
  - "A fix lane reports the last line of this verb, not the line of starci runtime check (which runs no test)."
  - "Refuses a tree with uncommitted or untracked changes; the receipt binds a commit."
  - "starci git land, starci runtime deploy and the release read the same receipt: every proof passed."
flags:
  - {name: base, type: string, summary: 'ref to diff against (default: the merge-base with main, else origin/main)'}
  - {name: root, type: string, summary: 'repository root (default: the command cwd)'}
positional: []
exit:
  "0": "verified: check, package clean-test and scaffold e2e passed on the exact commit, receipt written"
  "1": "NOT VERIFIED: dirty tree, no base, red check, a red or unrun package, or a failed or skipped scaffold e2e test"
  "2": "bad usage"
json: starci/runtime-verify@2
examples:
  - starci runtime verify --base <tip>
  - starci runtime verify --json
editions: [full]
