group: runtime
verb: example-secrets
owner: runtime
summary: run a command in a disposable copy of an example with freshly generated sealed members
impl:
  script: scripts/hfs/example-secrets.mjs
positional:
  - name: command-arguments
    required: false
    variadic: true
flags:
  - name: run
    type: string
    summary: the example directory to copy; the command after -- runs in the copy and the copy is removed afterwards
exit:
  "0": the command succeeded in the disposable copy
  "1": the command failed or the copy could not be prepared
  "2": bad usage
json: none
examples:
  - starci runtime example-secrets --run examples/lite-app -- npm run lint
editions:
  - full
