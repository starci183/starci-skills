group: runtime
verb: doctor
owner: runtime
summary: run the installed tree's own specs and report drift against the install manifest
impl:
  script: scripts/install/install.mjs
  args:
    - doctor
flags:
  - name: quick
    type: boolean
    summary: only the core kernel/ledger spec subset
exit:
  "0": every spec passed
  "1": a spec failed or the tree drifted
  "2": bad usage
json: none
examples:
  - starci runtime doctor --cwd <repo> --quick
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci doctor
  - npx starci doctor
