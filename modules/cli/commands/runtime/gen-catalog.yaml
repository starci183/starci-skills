group: runtime
verb: gen-catalog
owner: runtime
summary: write or check the generated CLI catalog outputs, docs and shell completions
impl: {script: scripts/cli/gen-catalog.mjs}
writesRuntimeTree: write
flags:
  - {name: write, type: boolean, summary: rewrite every generated output from modules/cli/commands}
  - {name: check, type: boolean, summary: exit 1 listing each output that differs}
  - {name: root, type: string, summary: the runtime tree to read and write}
exit:
  "0": outputs in sync or written
  "1": drift listed or a catalog error
  "2": "neither --write nor --check given, bad usage, or [RUNTIME_TREE_TARGET_FOREIGN]: the located runtime is not the tree that owns this CLI (set STARCI_RUNTIME or --root)"
json: none
examples:
  - starci runtime gen-catalog --check
  - starci runtime gen-catalog --write
editions: [full]
