group: runtime
verb: import-held-secret
owner: runtime
summary: move one sealed member of the old tracked custody from git history into secret.env
impl:
  script: scripts/gates/import-held-secret.mjs
flags:
  - {name: member, type: string, summary: "the old tracked path of the member (the table of docs/host-secrets.md)"}
  - {name: rev, type: string, summary: "the revision that still holds the member; default the parent of the commit that deleted it"}
exit: {"0": the variable was appended to secret.env, "1": refused and nothing written, "2": bad usage}
json: flag
examples:
  - starci runtime import-held-secret --member <member-path>
editions: [full]
