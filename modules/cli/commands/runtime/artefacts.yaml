group: runtime
verb: artefacts
owner: runtime
summary: judge or migrate the artefacts the runtime installs outside its tree
impl: {module: scripts/reconciler/artefacts-verb.mjs, export: runtimeArtefacts}
effect: local-write
roles: [worker, lead, coordinator, release, owner]
conventions:
  - without --migrate it only reads; with --migrate it rewrites hooks and generated copies of the live workflows and the host tree
  - it never touches product content, only artefacts listed in modules/kernel/installed-artefacts.yaml
  - a deploy runs it from the new tree after the fast-forward; the engine runs the same migration when it starts
flags:
  - {name: migrate, type: boolean, summary: rewrite every stale artefact to the revision of this tree and verify the stamp}
exit:
  "0": every artefact is current, or was migrated and verified
  "1": an artefact is stale in check mode, or a migration was refused
  "2": bad usage
json: starci/runtime-artefacts@1
examples:
  - starci runtime artefacts
  - starci runtime artefacts --migrate --json
editions: [full]
