group: runtime
verb: status
owner: runtime
summary: the runtime's version, tree root and manifest drift — a read-only summary
impl:
  script: scripts/cli/lib/runtime-status.mjs
flags: []
exit:
  "0": status printed
  "1": the install manifest is invalid or an installed file drifted (a source checkout has none and is healthy)
  "2": bad usage
json: flag
examples:
  - starci runtime status
editions:
  - full
