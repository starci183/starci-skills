group: runtime
verb: gen-ops
owner: runtime
summary: regenerate or check the generated operation registry
impl:
  script: scripts/route/build-ops-registry.mjs
flags:
  - {name: check, type: boolean, summary: compare without writing}
  - {name: ops-dir, type: string, summary: operation catalog directory}
  - {name: out, type: string, summary: registry output file}
exit: {"0": registry written or current, "1": registry is stale or sources are invalid, "2": bad usage}
json: none
examples:
  - starci runtime gen-ops
  - starci runtime gen-ops --check
  - starci runtime gen-ops --ops-dir <dir> --out <file>
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/route/build-ops-registry.mjs
