group: harness
verb: stop
owner: runtime
summary: stop only harness processes recorded by harness start
impl: {module: ui/harness-verbs.mjs, export: harnessStopVerb}
effect: host
roles: [lead, coordinator, owner]
conventions:
  - stop acts only when the recorded PID, creation time and harness start command all match
  - a missing PID clears a stale record while an identity mismatch is retained and refused
flags: []
positional: []
exit:
  "0": recorded harness processes stopped or were already gone
  "1": a recorded PID could not be verified or stopped
  "2": bad usage
json: flag
examples:
  - starci harness stop
  - starci harness stop --json
editions: [full]
