group: harness
verb: status
owner: runtime
summary: report whether the harness health endpoint is up
impl: {module: scripts/machine/harness-verbs.mjs, export: harnessStatusVerb}
effect: read
roles: [worker, lead, coordinator, release, owner]
conventions:
  - status probes /healthz at the local harness URL derived from the runtime statusApp port
flags: []
positional: []
exit:
  "0": harness is healthy
  "1": harness is down or its probe failed
  "2": bad usage
json: flag
examples:
  - starci harness status
  - starci harness status --json
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node ui/start.mjs status
