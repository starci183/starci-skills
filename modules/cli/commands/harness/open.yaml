group: harness
verb: open
owner: runtime
summary: open the local harness URL in the default browser
impl: {module: scripts/machine/harness-verbs.mjs, export: harnessOpenVerb}
effect: host
roles: [lead, coordinator, owner]
conventions:
  - open uses the local harness URL derived from the runtime statusApp port
flags: []
positional: []
exit:
  "0": browser open requested
  "1": the browser could not be opened
  "2": bad usage
json: none
examples:
  - starci harness open
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node ui/start.mjs open
