group: reconciler
verb: install-task
owner: runtime
summary: print or apply the StarCi-Reconciler scheduled task
impl:
  script: scripts/reconciler/boot.mjs
  args: [--install-task]
flags:
  - name: apply
    type: boolean
    summary: register the task instead of printing its plan
exit:
  "0": task plan printed or task registered
  "1": task registration failed
  "2": bad usage
json: flag
examples:
  - starci reconciler install-task
  - starci reconciler install-task --apply
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/reconciler/boot.mjs --install-task
