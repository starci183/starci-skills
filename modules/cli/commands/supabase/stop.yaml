group: supabase
verb: stop
owner: runtime
summary: stop only the app's configured Supabase project
impl: {module: scripts/machine/supabase-stack.mjs, export: supabaseStop}
effect: host
roles: [worker, lead, coordinator, owner]
conventions:
  - stop names the project id from supabase/config.toml and never uses --all
  - never stop a protected foreign stack or another project's stack
  - secrets stay in sops and never appear in command output
  - stop the project's stack when the work that needs it is done
flags:
  - {name: no-backup, type: boolean, summary: stop without creating a local database backup}
positional: []
exit:
  "0": "the configured project stack stopped"
  "1": "the Supabase CLI failed"
  "2": "the app or project config was refused"
json: starci/supabase-stop@1
examples:
  - starci supabase stop --cwd <app>
  - starci supabase stop --cwd <app> --no-backup
editions: [full]
