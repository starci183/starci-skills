group: sonar
verb: analysis
owner: runtime
summary: run native analysis with the selected target's analysis credential
impl: {module: scripts/gates/sonar-manage.mjs, export: runSonarManage}
effect: remote
roles: [worker, lead, coordinator, owner]
positional: [{name: action, enum: [run], required: true, variadic: false}]
operationPolicy:
  run: {action: sonar.analysis.run, effect: remote, credentials: [analysis, browse], destination: none, checkpoints: [private-input]}
flags:
  - {name: target, type: string, required: true, summary: named operation target}
  - {name: operation, type: string, summary: durable operation id}
  - {name: execute, type: boolean, summary: execute under existing accepted operation scope}
  - {name: reconcile, type: boolean, summary: inspect prior processing before another analysis}
  - {name: key, type: string, summary: exact declared project key}
  - {name: revision, type: string, summary: expected immutable source revision}
conventions:
  - analysis uses the declared analysis role and does not provision a project or substitute an administrator token
exit: {"0": plan prepared or operation completed, "1": processing or quality gate failed or remains uncertain, "2": policy or input refused}
json: always
examples: [starci sonar analysis run --target quality --operation quality-analysis --revision <sha>]
editions: [full, lite]
