group: workflow
verb: start
owner: runtime
summary: ensure the host, then claim an approved goal and boot its Kernel
impl:
  script: scripts/kernel/start-workflow.mjs
flags:
  - name: repo
    type: string
    summary: "repository whose registered project ledger holds the goal queue (default: the working directory)"
  - name: goal
    type: string
    summary: explicit workflow_id to boot instead of the oldest queued
  - name: agent
    type: string
    summary: override the routed kernel agent
  - name: launched-by
    type: enum
    enum: [watchdog, supervisor]
    default: supervisor
    summary: provenance of an automated start
  - name: plan
    type: boolean
    summary: resolve and report the launch without starting anything
exit:
  "0": approved Kernel booted or already live, or a non-actuating plan
  "1": goal approval, host readiness or Kernel launch refused
  "2": bad usage
  "3": the previous Kernel dispatch is still alive
  "75": Orca is not answering (host unavailable)
json: flag
examples:
  - starci workflow start
  - starci workflow start --repo <path> --goal <workflow_id>
editions:
  - full
