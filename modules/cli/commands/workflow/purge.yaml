group: workflow
verb: purge
owner: runtime
summary: remove what an archived workflow left on the host (plan by default)
impl:
  module: scripts/kernel/workflow-purge.mjs
  export: workflowPurge
effect: host
roles: [owner]
conventions:
  - the plan is the default and changes nothing; --apply acts, under the host lock and the gc lock
  - only an archived workflow with no live job, lease, seat or worker is purged; Orca must answer
  - trees, refs, workers and terminals go through the worktree home, the git api and worker-close; never a raw recursive delete
  - a branch is deleted only with its proof (registry row, or name grammar with a tip in main or on the workflow's checkpoint chain); the plan prints every tip
  - what the ledger or Orca cannot tie to the workflow by evidence is listed and never touched
  - the ledger rows are kept unless --ledger archives them to a verified zip and drops them
flags:
  - name: repo
    type: string
    summary: "repository whose .starciwork ledger holds the workflow (default: the working directory)"
  - name: workflow
    type: string
    required: true
    summary: the workflow_id of an archived workflow
  - name: plan
    type: boolean
    summary: print what would be removed and change nothing (the default)
  - name: apply
    type: boolean
    summary: remove the planned set
  - name: ledger
    type: boolean
    summary: also archive the workflow's ledger rows to a verified zip and drop them
  - name: expect
    type: string
    summary: with --apply, refuse unless the plan still starts with this sha (12 characters or more)
exit:
  "0": plan printed, or the purge finished (or was already done)
  "1": a precondition refused it, or a step failed and the purge can be resumed
  "2": bad usage
json: flag
examples:
  - starci workflow purge --repo <repo> --workflow <id>
  - starci workflow purge --repo <repo> --workflow <id> --apply --expect <sha>
editions:
  - full
