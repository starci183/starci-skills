group: workflow
verb: assess
owner: runtime
summary: cold-scan repositories for goal-definition evidence
impl: {script: scripts/goal/assess.mjs}
flags:
  - {name: repo, type: list, summary: "repository to scan; repeat for several (without --json at least one is required)"}
exit: {"0": assessment completed, "2": bad usage}
json: flag
examples:
  - starci workflow assess --repo <path> --json
editions: [full]
