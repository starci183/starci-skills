group: workflow
verb: start-in-orca
owner: runtime
summary: start an approved goal from a shell Orca did not open, through one plain Orca relay terminal
impl:
  script: scripts/kernel/start-in-orca.mjs
flags:
  - name: repo
    type: string
    summary: "repository whose registered project ledger holds the goal queue (default: the working directory)"
  - name: goal
    type: string
    summary: explicit workflow_id to boot instead of the oldest queued
  - name: agent
    type: string
    summary: override the routed kernel agent
  - name: timeout-ms
    type: string
    summary: "how long to wait for the relay's receipt (default: 300000)"
exit:
  "0": approved Kernel booted or already live
  "1": the relay terminal was not created, gave no receipt in time, or workflow start refused
  "2": bad usage, or this shell is already an Orca terminal (run starci workflow start)
  "3": the previous Kernel dispatch is still alive
  "75": Orca is not answering (host unavailable)
json: flag
examples:
  - starci workflow start-in-orca --repo <path> --goal <workflow_id>
editions:
  - full
