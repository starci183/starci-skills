group: git
verb: land
owner: runtime
summary: verify a lane and fast-forward it onto local main without pushing
impl:
  module: scripts/supervisor/git-land.mjs
  export: gitLand
effect: local-write
roles: [coordinator, owner]
conventions:
  - land only a tip `starci runtime verify` proved (check, package clean-test, scaffold e2e on that exact commit)
  - the runtime has no specs of its own (owner ruling no-runtime-specs)
  - lands are serial and hold the host land lock through the receipt, gate, full check and local merge
  - local main is the only destination; a land never pushes, tags or touches origin
positional:
  - {name: worktree, required: true, variadic: false}
  - {name: ref, required: true, variadic: false}
flags:
  - {name: dry-run, type: boolean, summary: run every verification step but stop before local main moves}
  - {name: lane, type: string, summary: the workflow or lane id recorded in the human result}
  - {name: kernel-note, type: string, summary: "one line, what a Kernel must do differently after this land; the land record carries it and the runtime delivers it verbatim with the Kernels' next wake (absent: no line)"}
exit:
  "0": the verification passed and local main fast-forwarded, or a dry run passed without moving it
  "1": refused at the verify receipt, a named gate, the check, the lock or the fast-forward step
  "2": bad usage
json: starci/git-land@2
examples:
  - starci git land <worktree> <ref>
  - starci git land <worktree> <ref> --dry-run --json
  - starci git land <worktree> <ref> --kernel-note "settle needs --evidence now"
editions: [full]
