group: machine
verb: kernel-watchdog
owner: runtime
summary: inspect or repair one running workflow Kernel seat
impl: {script: scripts/kernel/kernel-watchdog.mjs}
flags:
  - {name: repo, type: string, required: true}
  - {name: workflow, type: string}
  - {name: goal, type: string}
  - {name: once, type: boolean, required: true}
  - {name: repair, type: boolean}
  - {name: interval-ms, type: number}
exit: {"0": seat healthy or repaired, "1": seat check failed, "2": bad usage}
json: flag
examples:
  - starci machine kernel-watchdog --repo <path> --workflow <id> --once
  - starci machine kernel-watchdog --repo <path> --workflow <id> --once --repair
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/kernel/kernel-watchdog.mjs
  - node .claude/scripts/kernel/kernel-watchdog.mjs
