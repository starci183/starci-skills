group: kernel
verb: enqueue
owner: runtime
summary: enqueue a work-unit job with its op, owned paths, records and retry lineage
impl:
  script: scripts/kernel/cli.mjs
  args:
    - enqueue
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: op
    type: string
    required: true
    summary: op id (a brief at modules/ops/ops/<op>.yaml)
  - name: paths
    type: string
    required: true
    summary: comma list of the paths the job owns (its write set)
  - name: records
    type: string
    summary: comma list of .starciwork records the job reads
  - name: params
    type: string
    summary: op params as a JSON object
  - name: repository
    type: string
    summary: repository id the job runs in
  - name: cut-id
    type: string
    summary: "cut id; with --cut-ordinal and --cut-total"
  - name: cut-ordinal
    type: number
    summary: position of the unit in its cut, from 1
  - name: cut-total
    type: number
    summary: number of units in the cut
  - name: after
    type: string
    summary: comma list of job ids this job waits for
  - name: foundation
    type: string
    summary: shared foundation this unit builds
  - name: contract-change
    type: string
    summary: registered follow-up change id in contract-changes.yaml
  - name: follow-up-of
    type: string
    summary: job of this workflow the follow-up leg answers
  - name: new-module
    type: string
    summary: comma list of module root dirs the grant creates
  - name: retry-of
    type: string
    summary: job this one retries
  - name: reopen
    type: string
    summary: reason a settled unit is reopened
  - name: derived-from
    type: string
    summary: comma list of job ids this unit derives from
  - name: canon-scan
    type: string
    summary: canon scan file of a canon slice
  - name: resolves
    type: string
    summary: Decision Item id this enqueue resolves (decisions-first gate)
  - name: what
    type: string
    summary: short display name (60 chars)
  - name: title
    type: string
    summary: job title
  - name: risk
    type: string
    summary: risk note recorded on the job
exit:
  "0": job enqueued
  "1": refused or failed (unknown op, paths outside the op writes, undeclared foundation, bad cut)
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel enqueue --repo <path> --workflow <workflow> --op <op> --paths <paths>
  - starci kernel enqueue --repo <path> --workflow <workflow> --op <op> --paths <paths> --retry-of <job>
  - starci kernel enqueue --repo <path> --workflow <workflow> --op <op> --paths <paths> --cut-id <cut> --cut-ordinal 1 --cut-total 3
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api enqueue
  - node scripts/kernel/cli.mjs enqueue
workUnit: "Every op job is a try of exactly one work unit (scripts/kernel/units.mjs; DBTREE
  work_units, jobs_enqueue_guard): one op, one subject key (engine/admission.mjs unitSubjectKey -
  cut:<id>#<ordinal>, else subject:<params.subject>, else the digest of the records, else of the
  owned paths) and one goal revision. enqueue admits the try on the unit's gate (H3/H4/H5): a new
  work identity creates the unit (its id is the new job's id, try_no 1, no lineage); the same
  identity is the next try of that unit - retry_of its latest try when that one failed, resume_of it
  when it was cancelled - and --retry-of <jobId> names the unit explicitly (it must be the unit's
  latest try and failed, else retry-lineage-invalid; a job of another op or unit is
  retry-of-foreign), whatever shape the new try has. A unit whose latest try passed runs again only
  with --reopen <reason> (work_units.reopen_reason/by/at). No try passes work_units.try_budget
  (default 5, Q13; only the owner or the Supervisor raises it: starci kernel unit --raise-budget). A new unit
  over the owned paths or records of a FAILED unit of the same op is refused
  unit-overlaps-failed-unit (retry that unit instead). --derived-from <jobs> (graph-edit split,
  merge, wire, recut) makes a new unit inherit what is left of those units' budgets. owner_answers,
  prior_attempt_failures and the lineage route adjustments read the unit's own tries only"
foundations: "--foundation <name> marks a leg that builds a shared foundation this workflow claimed
  (starci kernel foundation --claim): payload.foundation, and status lists it first in frontier.queued -
  foundation legs run first. Without it, a workflow with running peers that declared no foundation
  (owns / needs / none) is refused foundations-undeclared when it was created after the
  shared-foundation-planning contract change and its ledger plans foundations at all (a foundation
  or a declaration is recorded); an older workflow, or a ledger that registered none, is only
  advised (receipt foundationAdvisory, one stderr line) and never held."
contractFollowUp: "--contract-change <id> --follow-up-of <jobId> records the follow-up leg a `reach:
  follow-up` contract change owes an older leg (modules/kernel/contract-changes/; starci kernel status
  frontier.contractFollowUps): payload.contractChange {id, followUpOf}. Pass --after <jobId> while
  the older leg still runs; it is never held for the change."
reads: workflows.phase; existing jobs for {workflow_id, op_id}; the brief
  modules/ops/ops/<opId>.yaml must exist and supplies the `params` block every override is checked
  against; the latest goals row's opChain leg for this op supplies what the owner set
  (modules/schemas/goal-plan.yaml legs[].params).
writes: "jobs row {job_id, workflow_id, op_id, attempt=max(prior attempts)+1 (1 on first enqueue),
  generation, kind:'op', status:'queued',
  payload_json:{goal_binding:{revision,identity},records:[--records],
  owned_paths:[--paths],repository?:<repo-id>,params?:{<name>:<value>},cut?:{id,ordinal,total}}} +
  events 'job-enqueued'. In a bound app (scripts/kernel/target-repo.mjs) every owned path is
  app-relative - be/<path>, fe/<path>, .starciwork/<path> or a path of the app root - the one form
  gate.mjs, the knowledge and every finding use; a repository:<id>/ prefix, an absolute or ../ path,
  the app's name as a prefix and a side-relative path (src/x where be/src/x exists) are refused
  path-not-app-relative. `repository` records the side the paths name by their first segment (one
  side is its role, several or a path of the app root is app); Work paths alone take --repository
  (resolved through the binding, stored as its role), else `fe` for an op every
  modules/models/kinds.yaml lane delivers on the frontend side (interface.implement,
  interface.audit, uat.verify), else absent. Unbound, --repository (an existing directory) or absent
  - the job targets where dispatch places it. `cut` marks one bounded execution slice of the SAME
  approved semantic op; all three cut flags are atomic, ordinal is 1-based and total is at least
  two. The goal binding is frozen at enqueue so a later approved revision cannot silently retarget
  an already queued job. The unit and its lineage live on the job row (unit_id, try_no, retry_of,
  resume_of, retry_class; commands.enqueue workUnit), never in the payload. `records` is the
  explicit closed read binding carried unchanged into the dispatch packet; omission means no Work
  record is bound and never licenses repository-wide discovery. `params` is the op's tunables: the
  brief (modules/schemas/op.schema.yaml) declares each name's type, default, bounds and setter, the
  approved goal leg carries what the owner chose, and `--params` carries what the kernel chose. Only
  the overrides are stored on the row; dispatch merges the brief's defaults under them when it
  renders the packet. A `setBy: owner` name is accepted from --params only when the goal leg already
  carries it, and a `setBy: kernel` name is never accepted from a goal leg."
returns: "{ok:true, job_id, workflowId, op, status:queued, attempt, cut, params, repository,
  peerOverlap:[{workflowId, jobId, path, ownPath}], peerHeadsUp:[{to, key, kind, subject}]}"
peerOverlap: "every open (queued|leased|running|answering|effect_unknown) job of a running peer
  (peers.rule) holding an owned path equal to, above or below one of --paths (engine/admission.mjs
  ownedPathsIntersect, the path-lease test) is listed in peerOverlap, and each such peer gets ONE
  heads-up peer message in the same transaction naming the overlapping job pairs
  (payload.overlapPairs, auto: enqueue-overlap; event 'peer-message-sent' on this workflow). A job
  pair already announced in either direction is not announced again. It never refuses: the
  capacity-1 path leases dispatch takes already serialize the writes"
refuses:
  - workflow-unknown: no workflows row
  - "workflow-finished | workflow-archived | workflow-not-accepting-work: only a queued or running
    workflow takes new work (paused, stopped, finished and archived do not; DBTREE
    jobs_enqueue_guard)"
  - "unit-in-flight (field open): a try of this work unit is still open; edit it (starci kernel graph-edit
    widen|params) or let it settle"
  - "unit-already-passed: the unit's latest try passed; a re-run needs --reopen <reason> (H5)"
  - "unit-try-budget-exhausted: the next try would pass work_units.try_budget; only the owner or the
    Supervisor raises it (starci kernel unit --raise-budget, H3)"
  - "retry-lineage-invalid: --retry-of is not the unit's latest try, or that try did not fail (H4)"
  - "retry-of-foreign: --retry-of names no earlier job of this op in this workflow"
  - "unit-overlaps-failed-unit (field overlaps): a new unit over the owned paths or records of a
    failed unit of the same op would restart its budget; retry that unit with --retry-of"
  - "after-self-lineage: --after names a try of this job's own unit"
  - "canon-slice-unplanned: the first try of a canon slice (params.canonFamilies, a cut, not
    canonWire) needs --canon-scan <the record it was cut from>: the canon planner is mandatory (H6)"
  - "canon-slice-missing-grants (field missing): the slice's --paths do not cover the plan's owned
    paths (its paths plus the relocation destinations its findings need)"
  - "canon-slice-no-fix-target: the plan gives every move this slice's findings need to another
    slice or the wire; cut it again"
  - "canon-slice-unknown | canon-scan-invalid: the ordinal is not a slice of the record, or the
    record is no canon-scan"
  - unknown-op: no brief at modules/ops/ops/<opId>.yaml
  - "kernel-rev-stale: the Kernel's acked runtime rev is behind and this op's contract (its brief,
    _common, the verdict contract, the schemas and checks it cites, scripts/kernel/op-prompt.mjs) or
    a contract change scoped to it changed in between (runtime-rev.mjs opRevStale). Re-read what api
    status kernelRev lists, starci kernel kernel-ack-rev, enqueue again; legs of other ops are unaffected"
  - "grant-parent-missing: an owned path whose directory does not exist in its target repository
    (the path itself for a directory or glob grant, its parent for a file grant - e.g. src/app when
    the repository keeps its router at apps/app/src/app), so the worker could never satisfy the
    grant; prints {ok:false, reason, violations[{owned, dir, closest}], detail} naming the missing
    directory and the closest existing one, exits 1, no job written (dispatch re-judges it and
    leaves the job queued). --new-module <repository-relative dir,...> declares a create-new-module
    grant (payload.new_modules): grants under that module root pass, provided the module root's own
    parent directory exists. Work paths are exempt"
  - empty-paths: an op without owned_paths is an unbounded grant — never enqueued
  - path-kernel-custody: an owned path under
      .starciwork/{kernel-evidence,kernel-strays,kernel-approvals} (modules/schemas/work-layout.yaml
      kernelCustody) — the kernel owns those roots and an op lease on one collides with every
      sibling op
  - "owned-paths-outside-writes (field `reason`): an authoring op whose manifest writes only
    .starciwork/features/<feature>/<family> records (business.decide, architecture.decide,
    decision.prepare - scripts/kernel/write-families.mjs) is given an owned path of another family,
    the feature overview it may not write, or a path outside .starciwork; prints {ok:false,
    workflowId, op, reason, violations[{path, family, why}], families, owners{family:[op]}, detail}
    and exits 1, no job written. The detail routes each family to the ops that write it"
  - repository-unknown: --repository names no repository the project binding (or, unbound, an existing
      directory) resolves
  - path-not-app-relative: in a bound app, an owned path is not app-relative (a repository:<id>/ prefix,
      an absolute or ../ path, the app name as a prefix, or a side-relative path); the detail names
      the app-relative spelling when a side holds it
  - path-repository-unknown: unbound, an owned path repository:<id>/… names a repository no project binding resolves
  - cut-invalid: cut flags are partial, empty, non-integral or outside 1 <= ordinal <= total with total >= 2
  - after-unknown: --after names a job that is not a job of this workflow
  - after-settled: "--after names a job that already settled failed or cancelled; a settled row never
      succeeds, so the dependant could never run. A retry of that job (an answered ask included)
      chains through its retry lineage: enqueue the same op and cut ordinal without --after"
  - params-invalid: "--params is not a JSON object, names a param the brief does not declare, carries a
      value of the wrong type or outside its min/max/enum, sets a `setBy: owner` param the approved
      goal leg does not carry, or a goal leg carries a `setBy: kernel` param
      (scripts/kernel/dispatch-op.mjs resolveOpParams)"
  - "params-invalid (field `reason`) for a missing `required: true` param: prints {ok:false,
    workflowId, op, reason:\"params-invalid\", param, detail} on stdout and exits 1, no job written.
    detail reads \"<op> requires params.<name> (<type>, set by <setBy>): <doc> — none was given;
    re-run enqueue with --params '{\"<name>\": <type>}'\" (a `setBy: owner` param names the approved
    goal leg instead). provision.ask requires params.subject, the one-sentence provision or decision
    it asks"
  - "foundations-undeclared (field `reason`): prints {ok:false, workflowId, op, reason, peers,
    detail} on stdout and exits 1, no job written - see foundations above"
  - foundation-not-owned: --foundation names a foundation this workflow has not claimed
  - foundation-name-invalid: --foundation is not a lowercase slug
  - contract-change-unknown: --contract-change names no registered reach follow-up change
  - follow-up-of-unknown: --follow-up-of names no job of this workflow
duplicates: "enqueue does not refuse a second live job for the same op: cutExecution
  (driver-loop.yaml) enqueues N disjoint same-op slices at once, each its own attempt. Duplicate
  suppression is the kernel's plan discipline, and the durable fence is dispatch admission — two
  jobs claiming a path both reach the capacity-1 `path:<owned_path>` lease and only one is
  admitted."
usedBy: tick.enqueue — one row per planned op the queue lacks; retries enqueue attempt+1
