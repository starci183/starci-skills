group: kernel
verb: estimate
owner: runtime
summary: deterministic size class + agent count from runtimes.yaml allocation.slicing
impl:
  script: scripts/kernel/cli.mjs
  args:
    - estimate
flags:
  - name: files
    type: string
    required: true
  - name: assertions
    type: string
  - name: components
    type: string
  - name: records
    type: string
  - name: paths
    type: string
  - name: gear
    type: string
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel estimate --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api estimate
  - node scripts/kernel/cli.mjs estimate
reads: modules/models/runtimes.yaml allocation.slicing only — {weights:{file, assertion, component,
  record}, targetMinutes:[lo,hi], maxSlices, gears, size:{<class>:{from, agents}}} — plus the
  owner's parallel.gear through the one reader engine/config.mjs (engine/config.mjs loadConfig();
  STARCI_OWNER_ROOT repoints it). The kernel measures the write scope and passes the counts; the
  weights, class bounds, gear vocabulary and agents-per-gear table are declared data, never a
  model's guess. No ledger row is read
writes: nothing — a pure computation, no row and no event
computes: W = sum(weight * count) agent-minutes; size = the largest allocation.slicing.size class
  any one count reaches its `from` bound of, else `s` when W is inside targetMinutes[0] and `m`
  above it; agentsRequested = 1 for `s`/`m`, else size.<class>.agents[gear]; agentsAchievable =
  clamp(min(agentsRequested, maxSlices, <disjoint path prefixes of --paths>), 1, ...);
  perSliceMinutes = W / agentsAchievable
gear: the owner's parallel.gear is the standing answer; `--gear <n>` overrides it for a dry run and
  writes nothing. A gear outside allocation.slicing.gears refuses either way. The gear raises only
  agentsRequested — never a pool's maxParallel, maxParallelOps or budgets.maxOps
achievable: "the seam-first partition itself is derived by the Kernel agent from repository evidence
  (driver-loop.yaml cutExecution), not by this code, so agentsAchievable is an UPPER BOUND and
  `achievableBasis` names which one: `disjoint-owned-path-prefixes` when --paths supplied a closure
  (the pairwise-disjoint concrete prefixes engine/admission.mjs normalizeOwnedPaths collapses it
  to), `unbounded-no-path-closure` when it did not"
returns: "{ok:true, minutes, size:s|m|l|xl, gear, gearSource:config|flag, agentsRequested,
  agentsAchievable, achievableBasis, reason, pathGroups?, slices, perSliceMinutes, counts, weights,
  targetMinutes, maxSlices, gears, overTarget}. `reason` names why achievable fell below requested
  and is null when it did not. `slices` equals agentsAchievable — it is the N the --cut-total flags
  carry. `overTarget` means each slice still exceeds targetMinutes[1]: gear up or decompose the
  closure finer"
refuses:
  - estimate-no-measure: every count is absent or zero — there is nothing to size
  - estimate-paths-invalid: --paths holds a glob, an absolute path, a parent traversal or nothing
      concrete (engine/admission.mjs normalizeOwnedPath; a Next.js App Router segment - [lang],
      [...slug], [[...opt]], (group), @slot, (.)photo - is a literal name, not a glob)
  - gear-undeclared: --gear names an integer allocation.slicing.gears does not declare
  - "the owner config being unparsable or schema-short (UNTYPED): estimate reads parallel.gear
    strictly and refuses with the validation message rather than sizing a fan-out against a guessed
    gear. `--gear` does not consult the file and answers anyway. Admission (route/dispatch) keeps
    the opposite tolerance — see route.maxOps"
  - slicing-undeclared: allocation.slicing omits weights/targetMinutes/maxSlices/gears/size, a weight
      for a supplied count, or an agent count for this size at this gear
usedBy: the cut-bound evaluation before enqueue — the agent count the --cut-total flags carry
  (driver-loop.yaml tick.enqueue.cutExecution)
