group: kernel
verb: dispatch
owner: runtime
summary: "admit a routed job and launch its worker with --spawn; without it print the launch plan"
impl:
  script: scripts/kernel/cli.mjs
  args:
    - dispatch
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: job
    type: string
    required: true
    summary: job to dispatch
  - name: spawn
    type: boolean
    summary: actually launch the worker (contract row, leases)
  - name: model
    type: string
    summary: model target, overriding the persisted route
  - name: worktree
    type: string
    summary: worker checkout; for a Git workflow it must name the registered workflow worktree
  - name: lease-ttl
    type: number
    summary: path-lease time-to-live in milliseconds
  - name: env-gate
    type: enum
    summary: skip the environment-health gate for an env-gated op
    enum:
      - off
exit:
  "0": plan shown or worker launched
  "1": refused, waiting or rejected (the JSON reason names which)
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel dispatch --repo <path> --job <job>
  - starci kernel dispatch --repo <path> --job <job> --spawn --model <target>
editions:
  - full
environmentPreStep: "For uat.verify, uat.assisted.verify and e2e.verify (verify-failure.mjs
  ENV_GATED_OPS) dispatch first runs scripts/uat/env-health.mjs check --restart on the
  work/resource@1 environments the job's uat/e2e records reference: every declared probe,
  health-endpoint discovery when the declared path answers wrong (probe-drift - the service is up,
  the declaration is stale), a restart of a down or hung server the runtime can start (one it
  started through env-health serve, or the resource's configuration.start; a hung listener is killed
  only when it is that server or runs inside a workspace repository root), and the listener behind a
  hung port. The result rides the packet as context.environment and an environment-checked event. A
  port held by a process that is not the workspace's server (port-conflict) refuses the dispatch
  environment-not-ready with one open [environment] incident; the job stays queued and spends no
  attempt. --env-gate off (or STARCI_ENV_GATE=off) skips the step."
model: --model <target> is only an owner-named pool or profile target (gpt-6.1-sol) inside the kind's
  order at its tier, launched at that pool's pin; outside it dispatch refuses model-outside-order.
  Without it dispatch launches the persisted route
kernelBias: --prefer/--avoid are unknown options and refused (unknown-option; commands.route
  kernelBias); dispatch launches the persisted route
leaseTtl: modules/models/runtimes.yaml allocation.dispatchLeaseTtlMs unless --lease-ttl or
  payload.leaseTtlMs overrides it
placement: >-
  A spawned Git workflow op runs in its registered workflow worktree, never the live main
  checkout or a separate op tree. An explicit --worktree supports that same registered path;
  a different Git placement, a missing tree or unavailable registry refuses before admission
  and worker-start. The packet context.workflow_worktree, immutable contract context.worktree
  and op_attempts.worktree_path bind the accepted placement for settle. A non-Git ledger has
  no Git checkpoint. scripts/kernel/workflow-worktree.mjs requireWorkflowPlacement owns this
  boundary; the checkpoint contract is modules/cli/commands/kernel/settle.yaml checkpoint.
reads: the job row + its workflow — including the PERSISTED `starci kernel route` decision on
  jobs.payload_json (model/modelId/effort; dispatch launches what route wrote, it does not
  re-decide); resources/leases/budgets for admission; the op brief modules/ops/ops/<op>.yaml; in the
  target repository, the records its `mustExist` reads resolve to and the bound records
  (prerequisite-unmet below); the model resolution through route-model
  (modules/models/selection.yaml — eligibility first, budget orders the eligible)
attempt: "alpha.3: a queued or ready job launches (ready: a launch refused before its op took the
  contract returns the SAME job to ready, H13 - no new try, attemptConsumed false; a launch whose
  effect is unknown fences the job effect_unknown for reconcile). Once Orca returns the dispatch id,
  one op_attempts row (dispatch_seq, scratch_dir = the job scratch, terminal, run, task, pool) and
  its contracts row (keyed by attempt_id) are written in one transaction that also moves a queued
  workflow to running; the op's prompt names that job scratch (STARCI_JOB_SCRATCH in op contracts),
  the scratch starci kernel report reads its report from. A refused launch ends that attempt in the refusal's
  own transaction (end_state requeued, or effect-unknown when the effect is unknown; a requeued
  attempt is also settled_at/settled_by kernel with no verdict, released_at set, its Orca Task
  closed, task_closed_at set, and work_units.dispatches gives the slot back) and keeps it as
  history: it is never open, never running in starci kernel status or the UI, never a try. settle_json.message
  says what step refused it and why."
writes: "admission FIRST, launch second: one `path:<owned_path>` lease row per owned_path, spelled
  app-relative in a bound app (scripts/kernel/lease-canon.mjs: be/<path>, fe/<path>,
  .starciwork/<path> or a path of the app root - one file is one key; a held row is compared in that
  form through its holder job, and on Windows case-insensitively; be/x and fe/x never overlap; an
  unbound repository keeps the path as written) (capacity-1 exclusive write fences, reserveTwoPhase
  — job queued->leased with its fencing token, ttl bounds a crashed worker's fence while settle
  releases early) + budget_reservations taken atomically; the packet's owned_paths resolve through
  scripts/kernel/target-repo.mjs: in a bound app each carries {path (app-relative, as declared),
  repository (its side: be, fe, app, or none for a Work path), root (the registered workflow
  worktree for a Git workflow, otherwise the target checkout), declared}; the worker starts at that checkout, so the prompt
  shows every owned path bare, the same spelling gate.mjs --root <app> --changed and every finding
  use, under a `writes_in` line naming the root; unbound, a path stays {path} verbatim (an explicit
  payload repository or an absolute path roots it). starci kernel report accepts `files` app-relative or
  rooted; contracts row = the rendered packet markdown keyed (workflow_id,op_id,attempt) with the
  dispatch_id — the worker's dispatch authority, read back via `starci kernel op-contract`, written BEFORE the
  job may stand running — whose context_json.inputs {schema:starci/input-digests@1, digests:[{path,
  digest, kind}]} records the sha256 of every input the op binds - kind source: each `knowledge/**`
  and `modules/schemas/**` path (and modules/models/code-patterns.yaml) named by the manifest's
  reads, context, knowledge, the executionModes.<mode>.reads of the mode its declared params.mode
  selects (an op without params.mode binds none), and the packet params; kind work: each
  `.starciwork/**` record of payload.records (a record directory as the digest of its
  index.yaml/resource.yaml files) - a directory or glob as the digest of its sorted file digests, a
  missing path as `absent` (scripts/kernel/input-digests.mjs); `settle` later re-baselines the work
  entries to the bytes the job left; workflows.phase queued->running with a 'phase-transition'
  event; jobs.status ->running with lease_token + worker_id only after attestation below (intent ->
  attested -> running); managed workers in an existing worktree have their agent terminal renamed to
  `[Op] <op-id>` once the start names it (worker-start's creation display name otherwise renders as
  `worker-task_<id>`); events 'op-dispatched' ('dispatch-rejected' on refusal). A dispatch-rejected
  launch claims nothing — no contract row, no leases, no running phase."
packet: the dispatch.yaml packet, fields unchanged — {op, brief,
  context:{workflow:{id,goal_revision,goal_identity},records,owned_paths,cut?}, constraints:{model,
  budget, lease}, returns:{verdict, evidence, suspicion}}
priorFailures: "a retry's prompt carries prior_attempt_failures: the red checks of the newest checks
  row of the job's OWN retry lineage before it (scripts/kernel/prior-failures.mjs priorChecksRow).
  An uncut op reads the newest earlier attempt of its own unit of work (enqueue uncutLineage); a cut
  ordinal reads only attempts of jobs with the same op, cut id AND ordinal (engine/admission.mjs
  cutRetryLineage), never a sibling slice that shares the op's durable attempt counter.
  payload.retry.retryOf, when it names a job of that lineage, caps the row at its attempt; one
  outside the lineage is ignored. No lineage row: no prior_attempt_failures. Beside them ride the
  Supervisor's lessons (modules/supervisor/lessons.yaml, supervise.yaml selfLearning) whose
  signature or text names one of those checks, as 'lesson <source>' entries
  (scripts/machine/lessons-file.mjs withLessons); none without a red check."
ownerAnswers: "packet context.owner_answers (dispatch.yaml fields context.owner_answers): every ask
  an earlier attempt of the job's retry lineage filed that holds an `ask-answered` event, with the
  question, options, chosen {index, label}, answeredBy, answeredAt and receipt path
  (scripts/machine/owner-answers.mjs ownerAnswersOf; the lineage is payload.retry.retryOf|resumeOf,
  so a cut ordinal reads only its own ordinal). The prompt opens with an `owner_answers:` block
  saying each question is ALREADY ANSWERED, binding, and never asked again. Absent when the lineage
  holds no answered ask. An owner-answer retry is enqueued exactly as before (same op and cut
  ordinal, no --after); the answer rides in the packet, not in the Kernel's free text (an earlier
  business.decide attempt once re-filed an answered ask as a new dispatch before this)"
spawn: "with --spawn the api runs the Orca sequence itself — through scripts/agent/lib.mjs
  spawnAgent, the one agent launch: worker-start --spec <the rendered packet> --agent <provider>
  [--model <id> --effort <level>] --worktree <the workflow worktree> (Orca files the Task in the
  same call; --retry-request derived from the job and its lease) -> the agent terminal (start
  receipt, else worker-show) -> terminal rename `[Op] <op>` -> worker-show attestation. Orca
  composes the agent command with the owner's per-agent default args. The kernel agent never calls
  orca directly. Without --spawn: dry-run — the packet prints, nothing is reserved and nothing
  launches."
attestation: "spawn success is not launch success. Before the job may stand 'running' the api
  attests the launch: the terminal handle is bound, the rendered packet visibly landed, and FIRST
  MODEL ACTIVITY is seen inside the launch window — against the adapter card's readiness patterns +
  knownFailures signatures. Managed-worker identity is read from Orca's typed launch receipt,
  including worker.startOptions.launch.effective only. An auth failure or known-crash signature
  (e.g. '401 Invalid API-key'), a terminal that dies, or a prompt that never lands is
  `dispatch-rejected`: the job stays NOT running, the terminal is closed (scripts/agent/lib.mjs),
  and the lease + budget reservations are released — a dead launch is a routed refusal, never a
  running ghost."
returns: "{ok:true, packet, job:{job_id, status, lease_token}, spawn:{terminal:<handle>}|null}"
refuses:
  - unknown-option: "--prefer or --avoid was passed: a Kernel does not bias a route (kernelBias)"
  - 'max-ops (field `reason`): the workflow already holds min(budgets.maxOps, maxParallelOps)
    operations (route.maxOps above names the two numbers and which statuses hold a slot). Checked
    before the packet and before any Orca call, on a dry run as well as a --spawn, so nothing is
    reserved and nothing launches. Prints {ok:false, jobId, op, reason:"max-ops", slots:{ok:false,
    running, ceiling, ceilingSource, reason}} and exits 1; the job stays queued'
  - 'seam-priority (field `reason`): the workflow has one free op slot left and a queued cut seam
    (ordinal 1 of a cut of more than one, not held by an owner-gate or peer-wait) waits for it; a
    job that is not a seam never takes that slot (scripts/kernel/seam-policy.mjs, driver-loop.yaml
    enqueue.seamContractFirst). Prints {ok:false, jobId, op, reason:"seam-priority", seam, slots}
    and exits 1; dispatch the seam first'
  - "prerequisite-unmet (field `reason`): the op's data prerequisites fail, checked after max-ops
    and before the packet and any Orca call, on a dry run as well as a --spawn
    (scripts/kernel/prerequisites.mjs). Two checks, data only: a manifest read marked `mustExist`
    whose every <placeholder> the job's owned_paths or records spell out, with no file at that path
    in the repository (interface.audit reads.target); and, for a read marked `designDrawn`
    (interface.implement reads.draws), a bound implementation record whose proved ui record
    (`proves`/`dependsOn` ui.<feature>.<name>) does not exist or has no settled interface.draw
    (state done, owner-accepted drawing current): the hard design gate, code before design is
    refused with code DESIGN_NOT_SETTLED and a Vietnamese explanation. interface.draw has NO layout
    prerequisite: a todo shell and unsettled ancestor layouts admit (see foundation-wait). An
    unresolved placeholder, a record outside a Work tree or an invalid tree is unknown and admits.
    Prints {ok:false, jobId, op, reason:\"prerequisite-unmet\", unmet:[{kind:record-missing, read,
    path}|{kind:design-not-settled, code:DESIGN_NOT_SETTLED, read, record, ui, why}], detail} and
    exits 1; nothing is reserved. detail reads \"<op> reads <path> (reads.<id>, mustExist) and it
    does not exist | implementation record <r> proves ui record <ui> whose interface.draw has not
    settled pass (DESIGN_NOT_SETTLED). Produce the missing record or finish the dependency through
    the op that owns it, then run starci kernel dispatch --job <id> again; if the job binds the wrong record,
    enqueue a corrected job and settle this one --verdict blocked. The job stays queued and nothing
    was reserved or launched.\""
  - 'foundation-wait (field `reason`): an interface.draw whose record has layouts above it that are
    not settled (or a todo shell) while another RUNNING workflow owns the shared foundation `shell`
    (claimed, not landed): this workflow is declared a dependent and the dispatch waits instead of
    drafting a second shell (scripts/kernel/shell-foundation.mjs). The first draw that finds parents
    to draw claims the foundation itself and draws the shell, ancestor layouts and lockup in its own
    op; settle lands it when the tree is settled. Past allocation.drawLoop.shellFoundationStallMs
    the refusal opens a Supervisor Decision Item (kind cross-workflow). starci kernel status shows
    queuedBecause foundation-wait. Prints {ok:false, jobId, op, reason:"foundation-wait",
    foundation, owner, detail, decision?} and exits 1; the job stays queued'
  - 'peer-wait (field `reason`): an open peer-wait incident holds the job. Checked right after
    owner-gate and before max-ops, on a dry run as well as a --spawn. Prints {ok:false, jobId, op,
    reason:"peer-wait", incident, peer} and exits 1; the job stays queued'
  - job-settled: job already settled — one lease, one agent, one verdict (dispatch.yaml oneOpOneAgent)
  - "kernel-rev-stale: as enqueue - the job's op contract changed since the runtime rev the Kernel
    acked; checked before any reservation"
  - job-not-queued: only a queued job may dispatch; a live attempt keeps its exact worker and lease
  - "workflow-not-accepting-work | workflow-finished | workflow-archived: the workflow is paused,
    stopped, finished or archived; nothing launches (H9). Checked first, and again inside the
    running transaction"
  - "dispatch-lease-lost (field `refused`): the leased -> running move is a compare-and-set on
    status leased and this dispatch's lease token (H9); when an archive, drop or reconcile took the
    job while its worker started, the started worker is stopped, the early contract row removed, a
    dispatch-abandoned event appended, and the dispatch exits 1"
  - job-live-worker: queued row still has a connected+writable exact worker; starci kernel reconcile must reattach
      it before any new dispatch
  - job-no-op: the job row carries no op identity to dispatch
  - model-unknown: no pool or launch target named <target> in modules/models/registry.yaml (pools, targets)
  - "model-outside-order (field `reason`): the launch pool (--model, the persisted route or the
    unrouted default devin-agent) is outside the kind's order at its floor-raised tier
    (scripts/agent/models.mjs kindOrder; a cut slice walks the fan-out order); a profile target
    counts as its provider's pool. Strategy kinds (order think/decide/plan) therefore launch only on
    claude-agent or codex-agent. --spawn checks it before leases and any Orca call, prints
    {ok:false, jobId, op, reason:\"model-outside-order\", model, order, difficulty, allowed, detail}
    and exits 1; the job stays queued. A dry run does not refuse; it carries `modelOutsideOrder`"
  - brief-missing: --spawn with no brief at modules/ops/ops/<op>.yaml — the packet would cite a contract
      that is not there
  - "tool-unavailable (field `reason`): --spawn whose launch agent (the persisted route, --model, or
    the unrouted default) lacks a host tool the op's route.riskHints requires. Checked before leases
    and before any Orca call; prints {ok:false, jobId, op, reason:\"tool-unavailable\", tools,
    model, detail} and exits 1, the job stays queued. detail reads \"<pool> (agent <provider>) lacks
    host tool <tool> that <op> requires (...). Re-run starci kernel route --job <id> — it now selects only
    agents whose card lists the tool — then dispatch again. The job stays queued.\" A dry run does
    not refuse; it carries `toolUnavailable`"
  - "path-lease (field `reason`, `waiting: true`): a LIVE capacity-1 `path:<owned_path>` lease of
    another job (unexpired, its holder not settled) overlaps this job's owned_paths - often the
    workflow's OWN running job. A wait, never a launcher failure: checked before the provider
    circuit, the leases and any Orca call on --spawn (and again when reserve loses the race to a new
    holder), so nothing is reserved or launched and NO dispatch-rejected event is written. Prints
    {ok:false, jobId, op, reason:\"path-lease\", waiting:true, queuedBecause:\"path-lease\",
    holders:[{jobId, opId, workflowId, status, sameWorkflow, paths, expiresAt}], conflicts, detail}
    and exits 1; the job stays queued, starci kernel status reports it queuedBecause path-lease naming the
    holder and its lease expiry, and once the holder settles (releasing its rows) it reads ready,
    the frontier turns actionable and the next wake dispatches it. Never re-dispatch it by hand
    while it waits. An EXPIRED or orphaned overlapping row is no wait: reserve still refuses it as
    dispatch-rejected (a recovery signal - reconcile or settle the holder)"
  - "host-resources-low (field `reason`, `waiting: true`): the host itself is short — free disk on
    the drive that holds %TEMP% and the repositories under runtimes.yaml
    allocation.resources.minFreeDiskGb, or the RAM-aware throttle (scripts/machine/ram-throttle.mjs,
    owner ruling 2026-09-28) refusing this op: the workers already at maxParallelOps, a slot or the
    RAM a higher-priority workflow (allocation.resources.ramThrottle.priorities,
    scripts/supervisor/ram-cap.mjs prioritize) still claims (priority-reserved), a heavy op
    (allocation.resources.opRam class heavy) while free RAM is under minFreeRamPct or CPU is
    saturated and the workflow is below the top priority, any heavy op while free RAM is under
    ramThrottle.landSpecPauseBelowPct (heavy-paused, hysteresis: resumes above heavyResumeAbovePct),
    or its RAM estimate not fitting above hardFloorPct (does-not-fit); the answer then carries
    `throttle` {reason, op, class, estimateMb, mode, modeWhy, freeRamPct, cpuBusy, headroomMb,
    running, effectiveCap, heavyCap, maxParallelOps, priority} and the job's ledger a
    `dispatch-throttled` event with the same numbers. Running ops are never stopped. A wait, never a
    launch failure: checked with the admission/provider-health path on --spawn before any Orca call,
    so nothing is reserved or launched and NO dispatch-rejected event is written. Prints {ok:false,
    jobId, op, reason:\"host-resources-low\", waiting:true, queuedBecause:\"host-resources-low\",
    resources:{drive, freeDiskGb, freeRamPct, minFreeDiskGb, minFreeRamPct}, detail} and exits 1;
    the job stays queued, starci kernel status reports it queuedBecause host-resources-low naming the drive
    and its free space, the watchdog runs housekeeping once against the shortage and stall-alert
    tells the owner with an approval-class alert naming the drive. Kernels wait for it — never a
    failure, never re-dispatched by hand; once the host is back over the thresholds the job reads
    ready and the next wake dispatches it"
  - "reserve-failed (UNTYPED, field `refused`): admission threw on job identity/status drift — the
    job row is left untouched, an operator error rather than a dispatch rejection"
  - dispatch-rejected: "the one typed rejection for every launch failure, carried in the `rejected`
      field: an open provider-health circuit, a refused admission (an expired or orphaned
      `path:<owned_path>` lease row, a resource with no declared capacity, or the machine arbiter —
      the reasons ride `reserve.reasons`; a LIVE lease another job holds is path-lease above, a
      wait), run-create, a dead spawn, prompt send/submission, attestation against the adapter
      card's knownFailures, or a start whose receipt names no Task or agent terminal
      (worker-start-no-task, worker-terminal-unknown). In every case the job is NOT running, the
      terminal is closed and the lease + budget reservations are released. The refused launch is
      appended to payload.rejectedDispatches[] {dispatchId, step, at, effectState} — the evidence
      reconcile proves no-effect against, kept apart from payload.managed so it can never be read as
      the job's live binding. The prompt is sent observed for the card submission window (calls.yaml
      terminal-send-prompt): a turn_started receipt proves the submit. One not seen submitted (no
      turn start, or an old host's agent_prompt_stalled) is proven from the frame: lost (the
      provider idle at an empty input), it is sent once more, and lost again the send is refused
      with signal prompt-delivery-stalled; a terminal whose process incarnation the host refuses is
      terminal-incarnation-stale. That refusal and an unclassified worker-start refusal each record
      a provider strike (modules/models/runtimes.yaml allocation.providerStrikes), and the strike
      that reaches the limit opens the typed provider circuit"
layoutPreflight: "the owned-path legality preflight dispatch.yaml describes is the KERNEL's step
  before enqueue, not an api refusal: starci kernel dispatch does not read the target repo's layout/lint
  contracts"
usedBy: drive.dispatch — only jobs whose owned_paths are disjoint and whose capacity is free
