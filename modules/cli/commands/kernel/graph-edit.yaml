# The contract of `starci kernel graph-edit` (scripts/kernel/verbs/graph-edit.mjs): the Kernel's LIGHT unit edits
# (owner 2026-09-28: ops draw the graph, the Kernel only makes light edits; a heavy redesign is starci kernel redesign).
group: kernel
verb: graph-edit
owner: runtime
summary: "apply a logged, reversible light edit to the workflow's unit jobs (drop, widen, wire, ...)"
impl:
  script: scripts/kernel/cli.mjs
  args:
    - graph-edit
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: edit
    type: enum
    required: true
    summary: the edit to apply
    enum:
      - drop
      - widen
      - wire
      - continue
      - retry
      - reorder
      - split
      - merge
      - params
      - scan
      - recut
      - undo
  - name: decision
    type: string
    summary: "Decision Item the edit answers; required for every edit except undo"
  - name: jobs
    type: string
    summary: comma list of job ids (drop, merge)
  - name: job
    type: string
    summary: the job edited (widen, reorder, params, continue, retry, split)
  - name: add-paths
    type: string
    summary: comma list of paths added to the job
  - name: paths
    type: string
    summary: comma list of owned paths of the merged job
  - name: op
    type: string
    summary: op id (merge, recut)
  - name: before
    type: string
    summary: comma list of job ids the new job runs before (wire, merge)
  - name: after
    type: string
    summary: comma list of job ids the job runs after (reorder, wire)
  - name: parts
    type: string
    summary: JSON array of path arrays that partition the job (split)
  - name: set
    type: string
    summary: JSON object of param overrides (params, continue, retry)
  - name: cut-id
    type: string
    summary: cut id (scan, recut)
  - name: from-scan
    type: string
    summary: canon scan file the recut reads
  - name: path-prefix
    type: string
    summary: prefix put before the recut paths
  - name: exclude
    type: string
    summary: comma list of path prefixes the scan skips
  - name: reason
    type: string
    summary: why the edit is made (required for drop)
  - name: undo
    type: string
    summary: edit id to undo (--edit undo)
exit:
  "0": edit applied (receipt carries the undo command)
  "1": refused or failed (decision missing, job foreign, wrong status, bad JSON)
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel graph-edit --repo <path> --workflow <workflow> --edit drop --decision <decision> --jobs <jobs> --reason <reason>
  - starci kernel graph-edit --repo <path> --workflow <workflow> --edit reorder --decision <decision> --job <job> --after <jobs>
  - starci kernel graph-edit --repo <path> --workflow <workflow> --edit undo --undo <edit>
editions:
  - full
purpose: "Edit this workflow's own queued units, logged and reversible: drop units whose paths are
  absent, widen a unit inside its repository, add ONE serial wire unit for shared files, continue a
  failed unit's preserved work (preserved/<wf>/<job>) as a continuation unit, retry a failed unit
  with a CHANGED shape, reorder (--after), split or merge a few units, set a unit's override (notes,
  commandTimeoutMs, difficulty, model, effort), start a fresh canon-scan and re-cut a canon cut's
  remaining units from it (the goal's own cut method), or undo an edit. The work graph
  (scripts/work/work-graph.mjs) and the leg plan stay the ops'."
guardrails:
  - only queued, never-dispatched units change; a running unit is never interrupted
  - at most runtimes.yaml allocation.progress.maxUnitsPerEdit units per edit (a recut from a
    canon-scan record is exempt)
  - added paths stay in the unit's repository, never kernel custody, never .claude, inside the op's
    write families, and never overlap another workflow's open unit or lease
    (path-held-by-other-workflow)
  - every new unit goes through starci kernel enqueue (its autopilot, foundation and family refusals hold)
  - a retry or widen that reproduces a shape that already failed for a shape cause is refused
    (shape-already-failed)
  - every edit is a kernel-graph-edit event holding its inverse; --edit undo --undo <edit> reverts it (a dropped unit comes back as a NEW try of its unit, resume_of the cancelled job: cancelled is terminal)
  - split, merge, wire and recut create units --derived-from the units they reshape: the new units inherit what is left of those try budgets, never a fresh one (H3)
  - recut goes through the canon planner (scripts/kernel/seam-policy.mjs canonCutPlanOf):
      each slice owns its paths plus the relocation grants its findings need, contested moves go to
      one canon-wire leg per wave, and a slice with no fix target (its moves held by another slice)
      is refused and cut again (H6); the scan runs under the OS temp dir and the record a recut uses
      is kept as a kernel artifact (role scan)
writes:
  - jobs payload (queued units only)
  - jobs status queued->cancelled (dropped)
  - a new try on undo
  - job_artifacts (the recut scan record)
  - events kernel-graph-edit
  - logs kind decision
kernelOnly: true
