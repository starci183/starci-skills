group: kernel
verb: plan
owner: runtime
summary: write the workflow's derived plan into the ledger
impl:
  script: scripts/kernel/cli.mjs
  args:
    - plan
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
  - name: file
    type: string
    required: true
    summary: plan JSON file {legs:[{op,paths?,notes?}], edges:[[fromLeg,toLeg]]}
  - name: replanned-from
    type: string
    summary: lineage note - the plan this one replaces
  - name: blocker
    type: string
    summary: lineage note - the blocker that forced the replan
  - name: path-delta
    type: string
    summary: lineage note - how the owned paths changed
  - name: routing-reason
    type: string
    summary: lineage note - why the routing changed
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel plan --repo <path> --workflow <workflow> --file <file>
  - starci kernel plan --repo <path> --workflow <workflow> --file <file> --replanned-from <plan> --blocker <blocker> --json
editions:
  - full
fileShape: "{legs: [{op, paths?, notes?}], edges: [[fromLeg, toLeg]]} —
  modules/schemas/goal-plan.yaml; edges are required (route-plan emits them); a single leg may omit
  them"
reads: "latest goals row — the approved opChain is goals.json.opChain (define-goal.yaml: advisory,
  re-derived at boot, never trusted blindly)"
writes: The latest goals.json.derivedPlan becomes {legs, edges, divergence, lineage, derivedAt}.
  Edges come from the file and only from it. A pending goal-revision inbox row for this revision is
  marked applied. One plan-derived event records {goal_revision, legs, divergence, lineage,
  inboxApplied, file}. `lineage` is {replannedFrom, blocker, pathDelta, routingReason}, recorded
  exactly as supplied. A re-plan should name its provenance as required by driver-loop.yaml
  replanTriggers.lineage.
diff: "STRUCTURAL only — the derived op ids vs the approved opChain legs. Added, removed or
  re-ordered legs are divergence; edges and allowlist wording inside the approved shape are not
  (modules/schemas/goal-plan.yaml rules: disjoint allowlists). One addition is not divergence:
  handover.review appended as the LAST leg of a plan whose approved opChain lacks it — the owner
  handover every workflow owes before `starci kernel finish` (driver-loop.yaml handoverLoop). The divergence
  then records handoverAppended:true."
returns: "{ok:true, workflowId, goalRevision, divergence:{storedOps,planOps,missing[],extra[],
  reordered,noStoredChain,handoverAppended?,diverged}, lineage, inboxApplied, legs,
  testsDeferred:{off,legs,jobs}}. The legs and divergence are persisted in goals.json.derivedPlan."
refuses:
  - plan-file-missing: the --file path does not exist
  - "plan-edges-missing: the plan file has no edges, or its edges leave a leg untouched, name an
    unknown leg or form a cycle; the plan is refused and nothing is written"
  - plan-file-invalid: unparseable, or fails the goal-plan {legs:[{op,...}]} shape — the refusal names the rule
  - workflow-unknown
usedBy: tick.plan — divergence -> starci kernel incident --kind plan-divergence, never a quiet re-plan
  (driver-loop.yaml)
