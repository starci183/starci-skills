group: kernel
verb: nudge
owner: runtime
summary: wake a running job's worker at its exact terminal so it files its report
impl:
  script: scripts/kernel/cli.mjs
  args:
    - nudge
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: job
    type: string
    required: true
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel nudge --repo <path> --job <job>
editions:
  - full
reads: running operation job, exact report row, exact terminal show/read frame
writes: sends a fixed liveness wake to the same exact operation terminal and appends
  op-worker-nudged. It creates no job, contract, lease, retry, verdict or authority.
returns: "{ok:true,jobId,nudged:true|false,action?:wake|submit-staged-input|answer-gate,delivery?:d\
  elivered|queued,evidence?:wake-text|queued-marker|screen|receipt,sendErrorCode?,enterRetried?,spl\
  itRetried?,splitOutcome?:delivered-after-split|unstaged|unsubmitted,reason?,input?,worker,receipt\
  ?} — nudged:false with ok:true and exit 0 is a SKIP, not a refusal: reason 'report-filed' (the
  durable answer already exists), 'worker-active' (the turn is running) or 'worker-starting' (a
  managed worker inside its launchGraceMs - worker-start returned before Orca injected the Task;
  nothing is typed). A worker whose liveness is `staged-input` (its paste never left the input row)
  gets ONE Enter-only send and no wake text, action submit-staged-input: typing a wake on top of the
  paste would bury it. A worker at a host dialog its agent card allowlists (liveness
  interactive-gate with worker.gateAutoAnswer; modules/models/agents/<agent>.yaml
  gateAutoAnswer.gates, e.g. a loop-detection menu) gets the card's option picked with arrow keys
  and Enter, no wake text, action answer-gate
  {gate,select,answered,cleared,keystroke,answers,limit}, and one op-worker-gate-answered event.
  Answered the gate's maxPerAttempt times on the same attempt, the dialog is a loop: the worker
  reads liveness gate-loop, listed in frontier.wedgedJobs, and nudge refuses it `worker-gate-loop`
  (one op-worker-gate-loop event, nothing typed). Every other nudge is action wake. Before a wake is
  typed the input row is read once more: non-empty input text that is neither the provider''s
  painted placeholder (its idle prompt hint) nor the runtime''s own (a card-declared paste marker, a
  verbatim piece of the dispatched contract, or this same wake left staged) is foreign input, and
  the nudge refuses `foreign-input` typing nothing - the wake never appends to words this job did
  not write (Supervisor ruling). The input box's draft counts as its input row. Orca lifts the text
  of an agent's input box out of the frame and answers it as `draft`
  (scripts/api/orca/terminal-read.mjs); read without it, a send whose Enter was dropped sat
  invisible and each later send was appended to it. Liveness reads the draft in the input row (the
  contract left there is staged-input); a draft the runtime did not type refuses `foreign-input`
  (inputSource draft, draftProbe) without sending keys. This same wake left there gets one Enter
  (evidence draft-submitted); runtime wakes piled up or cut short are emptied with bounded Ctrl+U,
  and a box that shrinks but will not empty refuses `draft-stuck`. Only runtime-owned text the first
  Ctrl+U leaves unchanged carries draftNote 'draft-stale' and staleDraft. The delivery proof
  after the send stays the backstop. Delivery is proven from the screen
  (scripts/kernel/wake-delivery.mjs), not Orca's receipt alone: the frame is read before and after
  the send, and the wake text appearing (delivered) or a queued-message marker such as Claude's
  \"Press up to edit queued messages\" (queued) proves it, so agent_prompt_stalled /
  agent_prompt_blocked with the wake on screen is a nudge (op-worker-nudged carries delivery and
  sendErrorCode), never terminal-send-failed. A frame that stays turn-idle with no wake text, no
  queued marker and no staged input is a dropped send whatever the receipt said (a Codex Kernel took
  ok:true text+Enter sends that never reached its screen): the wake is retried once split - the text
  with enter:false, proven staged in the input row, then Enter-only, proven again - and the result
  and event carry splitRetried:true with splitOutcome delivered-after-split, or unstaged/unsubmitted
  on a terminal-send-failed. A worker whose agent exited is never woken
  (scripts/lib/terminal-liveness.mjs exitedAgentPromptRow: the frame ends in a bare shell prompt, or
  in a prompt row drawn under the agent's own input row/footer, as when PowerShell's prompt
  overwrites a dead Codex's footer without clearing it): the frame is re-read immediately before
  typing, whatever observe saw, and refuses with reason 'agent-exited' and nothing typed; an
  unreadable frame types nothing (delivery unreadable). A frame read after the send that shows a
  host shell got the text (the text after a shell prompt, a new shell error, or a bare prompt) is
  never delivered: reason 'agent-exited', delivery agent-exited, evidence
  shell-echo|shell-error|shell-prompt, typed:true, no retry, and one event 'op-worker-wake-to-shell'
  instead of op-worker-nudged (PowerShell once ran a nudge and its echo read as delivered). Recover
  the job with reconcile --dead-worker."
refuses:
  - "agent-exited (field `reason`, exit 1): the worker's agent exited - before the send (nothing
    typed) or under it (typed:true, a shell received the text); run starci kernel reconcile --job <id>
    --dead-worker"
  - job-unknown: no jobs row for --job
  - job-not-operation: only an operation job has a worker terminal to wake
  - job-not-running: only the current running attempt may be nudged
  - worker-unavailable: exact terminal is disconnected/unwritable
  - interactive-gate: permission/trust input the worker's card does not allowlist is a typed environment
      problem, not a wake (liveness `failed` refuses under its own name the same way); an
      allowlisted host dialog is answered instead (action answer-gate)
  - worker-state-unknown: liveness is neither turn-idle nor live-idle — weak observation never authorizes input
  - worker-wedged: the worker's turn ran past the wedge threshold on one command with no output; a wake
      would land behind a turn that never ends - run starci kernel reconcile --job <id> --dead-worker
      --settle-failed
  - worker-gate-loop: the host dialog the runtime answered maxPerAttempt times on this attempt is back
      (liveness gate-loop); another answer is an endless continue - run starci kernel reconcile --job <id>
      --dead-worker --settle-failed (Esc closes the dialog before the agent is quit), and a repeat
      on the retry reads as a retry-loop finding
  - foreign-input: the input row (or the input box draft Orca reports, inputSource draft) holds
      non-empty text that is neither a staged paste nor the runtime's own delivered text; the wake
      was not typed (a draft got only a Ctrl+U probe that changed it - real text - and the cut typed
      back, draftProbe says restored), no event is appended. A draft the probe left unchanged is
      draft-stale, never this refusal
  - draft-stuck: the input box holds piled-up runtime text that bounded Ctrl+U shrank but could not
      empty; the wake was not typed onto it, no event is appended
  - terminal-send-failed: neither the receipt nor the screen shows the wake on the exact terminal
      (delivery failed, evidence names what the screen showed); no op-worker-nudged event is
      appended. An Orca refusal terminal_not_writable adds sendRefused:true and event
      op-worker-unwritable, which status reads as liveness disconnected
usedBy: drive.wait on the first turn-idle observation with no durable report
