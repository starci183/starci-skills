# The contract of `starci kernel serve-ask` (scripts/kernel/verbs/serve-ask.mjs). One file per extension verb
# (scripts/kernel/api-extensions.mjs); split out of modules/kernel/api.yaml commands.serve-ask (lane slim-api).
group: kernel
verb: serve-ask
owner: runtime
summary: "park an owner ask (serve-ask.mjs): Telegram notice first, form on demand"
impl:
  script: scripts/kernel/cli.mjs
  args:
    - serve-ask
flags:
  - name: workflow
    type: string
    required: true
  - name: dispatch
    type: string
  - name: ttl
    type: string
  - name: now
    type: boolean
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel serve-ask --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api serve-ask
  - node scripts/kernel/cli.mjs serve-ask
reads: the workflow row; with --dispatch, the reports row that filed that ask
writes: 'Parks the ask for the owner; it serves NO form by default (owner, 2026-09-24: a form URL is
  served only when the owner asks for it). scripts/kernel/ask-server.mjs parkAsk supersedes the
  earlier asks it replaces (ask-superseded, their Telegram messages deleted: ask-message-closed),
  sends the owner the question with its numbered options and one "Generate URL" button
  (scripts/connectors/telegram.mjs notifyAsk; deduped while the notice is in the chat) and appends
  ask-notified {dispatchId, onDemand:true, via:telegram, messageId, key, fresh, fields}. The
  Telegram bridge serves the form when the owner presses the button (serve-ask.mjs --on-demand
  telegram: ask-serving with onDemand, ask-serving-expired on --ttl, ask-answered on submit).
  `--now` also launches the form at once for local use; with Telegram off (or a failed send:
  ask-notify-failed) the form is launched at once as before, with the gateway and tunnel kept up. It
  is how a Kernel clears frontier.askReserveDispatches without leaving the api surface. With
  config.yaml asks.autoAcceptRecommended on, an ask that carries a recommended option and falls in
  no class of asks.excludes (credential and handover.review asks always do) is answered in-process
  instead (scripts/kernel/ask-server.mjs autoAcceptAsk): the answer receipt, ask-answered with
  answeredBy auto-recommended, ask-auto-accepted, the kernel wake and one Telegram message; nothing
  is served. A draw-review ask (question.kind draw-review, scripts/work/draw-review.mjs) the owner
  did not ask for is auto-accepted the same way with its accept option (unless asks.excludes lists
  draw-review); one the owner asked for (serve-ask.mjs drawOwnerRequestOf: a prior owner redraw or
  feedback on the record, the owner opened its form, question.ownerRequested) only the owner
  accepts, and a delegate never accepts. Its answer receipt keeps question.review - the record and
  the part digests shown - for draw-review.mjs apply.'
returns: "{ok:true, workflowId, dispatchId, onDemand:true, telegram:{notified, messageId, fresh},
  superseded[], pid:null} | {ok:true, workflowId, dispatchId, pid, servedBy, onDemand:false,
  servedBecause, telegram?, connectors?} | {ok:true, workflowId, dispatchId, autoAccepted:true,
  optionIndex, option, answeredBy, receiptPath, wake, telegram}"
refuses:
  - workflow-unknown
  - ask-unknown
usedBy: drive.wait — an ask-reserve frontier parks each askReserveDispatches entry; an
  askOnDemandDispatches entry needs nothing
