group: kernel
verb: reply
owner: runtime
summary: answer a pending worker question, or route it to the owner with --to-owner
impl:
  script: scripts/kernel/cli.mjs
  args:
    - reply
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
  - name: message
    type: string
    required: true
    summary: id of the pending worker question or escalation
  - name: body
    type: string
    summary: the answer text; required unless --to-owner
  - name: to-owner
    type: boolean
    summary: route the question to the owner through outcome ask (--body adds a Kernel note)
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel reply --repo <path> --workflow <workflow> --message <message> --body <answer>
  - starci kernel reply --repo <path> --workflow <workflow> --message <message> --to-owner --json
editions:
  - full
reads: the pending worker question or escalation (questions above), the job it belongs to
writes: "the workflow's Orca Run bound to the current Kernel terminal (orca-runs.mjs
  bindWorkflowRun, a no-op once bound; event run-rebound), then Orca `reply` to the exact question
  message through scripts/api/orca/reply.mjs (calls.yaml `reply`; --run is the question's Run and
  Orca resolves --from to the calling Kernel terminal), then the worker-question inbox row -> status
  applied {reply, toOwner, at} (inserted applied when it was never bridged) and event
  'worker-question-answered'. A reply is technical guidance inside the job's existing contract and
  authority - never new scope, paths, retry or owner intent (the api never answers an owner's
  decision). --to-owner sends the fixed routing reply instead: the worker files the question as `api
  report --outcome ask` and ends its turn, so askLifecycle and serve-ask carry it to the owner
  exactly like any other ask."
returns: "{ok:true, workflowId, messageId, jobId, toOwner, body}"
refuses:
  - workflow-unknown
  - reply-body-missing: neither --body nor --to-owner
  - question-unknown: no question or escalation message with that id in the workflow's Runs
  - "question-answered / question-replied-elsewhere / question-job-settled / question-unmatched: the
    question no longer waits on this Kernel (already answered, answered in Orca, its job settled, or
    no job of this workflow asked it)"
  - "reply-failed (field `reason`): the Orca reply did not land; nothing is written and the question
    stays pending"
usedBy: drive.wait — answer every pending worker question before yielding
