# The contract of `starci kernel retire-ask` (scripts/kernel/verbs/retire-ask.mjs). One file per extension verb
# (scripts/kernel/api-extensions.mjs); split out of modules/kernel/api.yaml commands.retire-ask (lane slim-api).
group: kernel
verb: retire-ask
owner: runtime
summary: close an ask the owner should no longer answer (ask-superseded)
impl:
  script: scripts/kernel/cli.mjs
  args:
    - retire-ask
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow that owns the ask
  - name: dispatch
    type: string
    required: true
    summary: dispatch id of the ask report to retire
  - name: reason
    type: string
    required: true
    summary: why the owner should no longer answer it, recorded on the ask-superseded event
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel retire-ask --repo <path> --workflow <workflow> --dispatch <dispatch> --reason <reason>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api retire-ask
  - node scripts/kernel/cli.mjs retire-ask
reads: the reports row that filed that ask; its ask-answered/ask-superseded events
writes: one event ask-superseded {dispatchId, by:null, opId, retired:true, reason} - the terminal
  kind every open-ask reader already honours - so the owner is no longer asked a question the
  workflow has outgrown (a premise a later merge changed, an ask a later attempt made moot). The
  ask's Telegram messages are deleted (edited to "no longer needs an answer" only where Telegram
  refuses the delete) and ask-message-closed records it. An ask already answered or superseded
  writes nothing and returns retired:false.
returns: "{ok:true, workflowId, dispatchId, retired, reason|already, telegramDeleted?, telegramEdited?}"
refuses:
  - workflow-unknown
  - ask-unknown
  - retire-needs-reason
usedBy: drive.wait — an awaiting-owner frontier whose only open ask is obsolete
