group: kernel
verb: finish
owner: runtime
summary: finish an owner-approved workflow and release its kernel seat
impl:
  script: scripts/kernel/cli.mjs
  args:
    - finish
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
exit:
  "0": finished (also when it was already finished)
  "1": refused or failed
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel finish --repo <path> --workflow <workflow>
editions:
  - full
reads: workflows row; every jobs row; the final verify verdict
writes: "workflows.phase='finished' + finished_json {at, verdict}; the inbox goal row closed (status
  'done'); every open incident resolved with reason workflow-finished (H12); every live Decision
  Item resolved by the runtime (status resolved, resolution_verb workflow-finished, event
  decision-resolved auto:true - a leftover could never be decided and would keep being counted); the
  kernel singleton signal deleted; the Kernel job settled with worker_id and terminalHandle cleared;
  the exact Kernel terminal receives a best-effort close request after the durable receipt is
  emitted; every Task the Run still holds open is closed with `task-update --status done`, so a
  finished workflow leaves nothing in the Orca tree (modules/kernel/start-workflow.yaml orcaTree);
  events 'workflow-finished'. The ledger retention pass (scripts/housekeeping/hk-ledger.mjs: debug
  log rows older than 14 days (Q5) and an incremental vacuum; never a purge and never a WAL
  checkpoint) then runs on the ledger, recorded on the receipt as `retention`. A workflow ended more
  than 30 days ago is zipped, verified and purged by the housekeeping sweep (Q6,
  scripts/work/purge-workflow.mjs), not by finish. goals/jobs/reports/events all stay — a finished
  goal is history, not deletion (start-workflow.yaml: finished goals never re-enter the queue)."
handoverGate: "A workflow is done only when the owner approved its handover. Before writing
  anything, finish requires a `handover-approved` event (settle.handover) whose seq is newer than
  the last op-settled event of any job other than the Kernel and handover.review
  (scripts/kernel/handover.mjs handoverGateOf). A chain approved before handover.review existed is
  held to the same gate: the kernel appends the leg (driver-loop.yaml handoverLoop). The one
  existing exit without an approval is a workflow the owner archived (workflows.archived_at, set
  only by starci kernel archive); no flag bypasses the gate. finished_json and the workflow-finished event
  carry handover {via: handover-approved|archived, approvedSeq, answeredBy}. A workflow already
  finished finishes again idempotently without the gate."
returns: "{ok:true, workflowId, phase:finished, inboxClosed:<n>, incidentsClosed:<n>,
  decisionsClosed:[diId], alreadyFinished, kernelSignalsReleased, kernelJobsSettled, kernelTerminal,
  kernelTerminalCloseRequested, handover?:{via, approvedSeq, answeredBy}, retention?:{retained:true,
  debugLogsDeleted, vacuumed}|{retained:false, reason}}"
refuses:
  - workflow-unknown
  - "workflow-not-accepting-work: the workflow is not running (running -> finished only, DBTREE
    workflow_transitions); a paused or stopped workflow is resumed first"
  - workflow-open-jobs: one or more operation jobs are unsettled; a model turn ending is not workflow completion
  - "handover-not-approved: no handover-approved event, or the newest one predates the last business
    settle (handoverGate); run handover.review and let the owner approve it"
usedBy: tick.finish — called only once every job is settled, the final verify leg passed and the
  owner approved the handover (driver-loop.yaml)
