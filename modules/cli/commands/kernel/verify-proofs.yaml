# The contract of `api verify-proofs` (scripts/kernel/verbs/verify-proofs.mjs). One file per extension
# verb (scripts/kernel/api-extensions.mjs); split out of modules/kernel/api.yaml commands.verify-proofs
# (lane slim-04).
group: kernel
verb: verify-proofs
owner: runtime
summary: re-hash every indexed proof file and walk the events digest chain; exit 1 on tampering
impl:
  script: scripts/kernel/cli.mjs
  args:
    - verify-proofs
flags:
  - name: workflow
    type: string
    required: true
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel verify-proofs --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api verify-proofs
  - node scripts/kernel/cli.mjs verify-proofs
purpose: Re-read every artifact's blob (the store re-hashes it) and walk the events digest chain;
  exit 1 on tampering.
reads: every job_artifacts row of the workflow, the blob each cites, and the workflow's events
  digest chain
writes: nothing — pure projection; exit 1 when anything is tampered or the chain is broken
returns:
  schema: starci/proof-verify@1
  ok: true when every file matches and the chain holds
  files: "{checked, intact, unchained, tampered:[{artifactId, jobId, name, reason:
    missing|modified|ledger-row-differs-from-chain, expected, actual?}]} — a blob must still hash to
    its sha256, and the row's sha256 must be the one its chained report-filed / artifacts-indexed
    event recorded; unchained counts rows no chained event covers"
  chain: "{events, ok, brokenAt, broken:[{seq, kind, reason}]} — engine/db/ledger.mjs verifyEventChain"
refusals:
  workflow-unknown: no workflows row for --workflow
usedBy: the owner and supervisor auditing that a workflow's proof is the proof that was indexed
