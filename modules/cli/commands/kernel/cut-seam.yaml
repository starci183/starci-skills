group: kernel
verb: cut-seam
owner: runtime
summary: "the seam publishes its interface: siblings start on it"
impl:
  script: scripts/kernel/cli.mjs
  args:
    - cut-seam
flags:
  - name: publish-interface
    type: boolean
  - name: job
    type: string
  - name: files
    type: string
  - name: summary
    type: string
  - name: release
    type: boolean
  - name: workflow
    type: string
  - name: op
    type: string
  - name: cut-id
    type: string
  - name: reason
    type: string
  - name: reconcile
    type: boolean
  - name: exit-code
    type: string
  - name: command
    type: string
  - name: evidence
    type: string
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel cut-seam --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api cut-seam
  - node scripts/kernel/cli.mjs cut-seam
reads: the job row(s) of the cut (ordinal 1 attempts not retired before dispatch), the seam-* events
  of the cut, and for --publish-interface the named files in the repository
  (scripts/kernel/seam-policy.mjs)
writes: "exactly one event, never a job row: --publish-interface -> seam-interface-published {op,
  cutId, files:[{path, sha256, bytes}], summary, by} on the seam job (every sibling ordinal is
  released to build against it: status seamStub mode interface); --release -> seam-released {op,
  cutId, reason, seamJobId, seamStatus} (siblings run on a stub now: mode released); --reconcile ->
  seam-reconciled {op, cutId, exitCode, via: reconcile, command, evidence, seamJobId} on the sibling
  (the cut-seam-reconcile result; red owes a retry of that ordinal). api settle writes
  seam-reconciled itself (via settle-checks for a stub sibling passing after its seam passed, via
  full-regression-final for every stub sibling still owed when the pass closes the set)"
returns: "{ok:true, mode, jobId?, workflowId, op, cutId, files?|seamJobId?, exitCode?}"
refuses:
  - "cut-seam-mode: not exactly one of --publish-interface|--release|--reconcile"
  - "op-context-refused: an operation may only publish its OWN seam interface"
  - "cut-seam-not-seam: --publish-interface on a job that is not ordinal 1 of a cut of more than one"
  - "cut-seam-settled: a failed/cancelled seam attempt publishes nothing"
  - "cut-seam-files-missing | seam-interface-path-invalid | seam-interface-outside-seam |
    seam-interface-file-missing: the files must be committed, workspace-relative and inside the seam
    job's owned paths"
  - "cut-seam-unknown | cut-seam-passed: --release of a cut with no seam job, or whose seam already
    passed"
  - "cut-seam-not-sibling | cut-seam-no-stub | cut-seam-not-passed | cut-seam-exit-code |
    cut-seam-not-landed: --reconcile is for a passed sibling that ran on a stub, with an integer
    exit code, once its seam passed"
usedBy: the seam op itself (--publish-interface of its own job, the backend.implement /
  interface.implement contract-first step); the Kernel for --release (a seam stuck behind a wait or
  being re-cut) and --reconcile (driver-loop.yaml enqueue.seamContractFirst)
