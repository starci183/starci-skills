# The contract of `starci kernel kernel-ack-rev` (scripts/kernel/verbs/kernel-ack-rev.mjs). One file per extension verb
# (scripts/kernel/api-extensions.mjs); split out of modules/kernel/api.yaml commands.kernel-ack-rev (lane slim-api).
group: kernel
verb: kernel-ack-rev
owner: runtime
summary: project or attest the complete current Kernel READ manifest
impl:
  script: scripts/kernel/cli.mjs
  args:
    - kernel-ack-rev
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: rev
    type: string
    summary: exact current Git SHA or installed required-byte revision returned by --plan
  - name: plan
    type: boolean
    summary: return the current server-derived required manifest without acknowledgement
  - name: read-manifest
    type: string
    summary: regular JSON file containing the exact complete manifest read by this Kernel
  - name: op
    type: string
    summary: include this declared upcoming op contract in the required READ set
exit:
  "0": planned or acknowledged
  "1": refused or unavailable current identity/READ inputs
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel kernel-ack-rev --repo <path> --workflow <workflow> --plan
  - starci kernel kernel-ack-rev --repo <path> --workflow <workflow> --rev <rev> --read-manifest <file>
editions:
  - full
reads: current workflow, job, singleton signal and actual required runtime contract bytes
writes: one runtime-rev-acked event bound to the exact current incarnation and complete required READ hashes
returns: '{ok:true, workflowId, readManifest, unread? (--plan: the paths this incarnation has not attested with these bytes), rev?, attempt?}'
refuses:
  - workflow-unknown
  - kernel-rev-unknown
  - kernel-caller-stale
  - kernel-read-unverified
usedBy: the current Kernel after reading every path --plan lists under unread
