# The contract of `starci kernel revision-ack` (scripts/kernel/verbs/revision-ack.mjs). One file per extension verb
# (scripts/kernel/api-extensions.mjs).
group: kernel
verb: revision-ack
owner: runtime
summary: project or attest the files a runtime revision change sends to this Kernel
impl:
  script: scripts/kernel/cli.mjs
  args:
    - revision-ack
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: rev
    type: string
    summary: exact current Git SHA of the runtime revision the plan names
  - name: plan
    type: boolean
    summary: return the files this revision change sends to the Kernel (with their hashes) without acknowledging
  - name: read-manifest
    type: string
    summary: regular JSON file holding the exact manifest --plan returned, after every file in it was read
exit:
  "0": planned or acknowledged
  "1": refused or unavailable current identity/READ inputs
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel revision-ack --repo <path> --workflow <workflow> --plan
  - starci kernel revision-ack --repo <path> --workflow <workflow> --rev <rev> --read-manifest <file>
editions:
  - full
reads: the workflow ledger's revision records and the bytes of the files the change sends
writes: one runtime-rev-noticed event (verdict acked) with the two revisions, a count and the diff hash; the file list is a blob
returns: '{ok:true, workflowId, state, readManifest (null when nothing is owed)} for --plan; {ok:true, workflowId, rev, count, filesSha} for an attestation'
refuses:
  - workflow-unknown
  - kernel-rev-unknown
  - kernel-caller-stale
  - revision-read-unverified
  - revision-nothing-owed
usedBy: the current Kernel woken with the files a runtime revision change sends it
