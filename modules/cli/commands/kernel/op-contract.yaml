group: kernel
verb: op-contract
owner: runtime
summary: read the contract row dispatch wrote for a job or an op+attempt
impl:
  script: scripts/kernel/cli.mjs
  args:
    - op-contract
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: job
    type: string
  - name: workflow
    type: string
  - name: op
    type: string
  - name: attempt
    type: string
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel op-contract --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api op-contract
  - node scripts/kernel/cli.mjs op-contract
reads: the contracts row for the job's {workflow_id,op_id,attempt} — the rendered packet markdown
  dispatch wrote
writes: nothing — pure read of the worker's dispatch authority
returns: "the stored markdown on stdout; with --json: {ok:true, workflowId, op, attempt, dispatchId,
  markdown, context, createdAt, admission:{admittedAt, source, withheld, runtimeSha, digest,
  laterChanges, advisoryChecks, advisoryCodes}}"
dispatchInFlight: dispatch used to commit the contract row only with status running, after the
  preamble was sent and the model attested; a worker whose first action is op-contract landed in
  that window and read contract-missing for a row the Kernel read seconds later (nivo Modules
  inc-e09140ad9c22, WSPV inc-7f437d11edae). A dispatch commits the row as soon as Orca returns the
  dispatch id, BEFORE the preamble reaches the terminal (re-filed with the delivered text when the
  job goes running; removed again when the launch is refused after that point). As belt-and-braces,
  with --job, while the job is still leased and its row is absent (a managed worker-start launch),
  op-contract re-reads once a second for up to 120 s before refusing contract-missing
admission: "--json also returns admission {admittedAt, source:recorded|contract-row, runtimeSha,
  digest, laterChanges[], advisoryChecks[], advisoryCodes[]}: the contract version dispatch admitted
  this attempt under (context.contract, scripts/machine/contract-version.mjs; a leg dispatched
  before versions were recorded is admitted at its row's created_at) and what contract changes
  landed after it (modules/kernel/contract-changes/). The leg is judged against its admitted
  contract: those checks and codes are suspects for it, never refusals, and a check script takes the
  admission (shell-conformance --admitted-at <admittedAt> --op <op>)"
refuses:
  - contract-missing: no contracts row for the job's attempt — the job was never dispatched
  - bad-attempt: --attempt is not a positive integer
  - job-unknown
usedBy: the [Op] worker — it reads its contract from the ledger row, not from the terminal prompt text
