group: kernel
verb: foundation
owner: runtime
summary: claim, land or declare a shared foundation (or none) for a workflow
impl:
  script: scripts/kernel/cli.mjs
  args:
    - foundation
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: claim
    type: string
    summary: foundation name this workflow owns
  - name: kind
    type: enum
    summary: foundation kind (--claim)
    enum:
      - layout-tree
      - brand
      - grammar
      - module
      - contract
      - baseline
      - scaffold
      - other
  - name: version
    type: string
    summary: version of the foundation (--claim, --land)
  - name: declare-dependent
    type: string
    summary: foundation name this workflow needs
  - name: land
    type: string
    summary: "foundation name that landed; needs --proof"
  - name: proof
    type: string
    summary: what proves the landing (--land)
  - name: refs
    type: string
    summary: comma list of refs recorded with --land
  - name: declare-none
    type: boolean
    summary: declare the workflow owns and needs no shared foundation
  - name: detail
    type: string
    summary: free detail recorded with the action
exit:
  "0": recorded
  "1": refused or failed (not exactly one action, workflow not running, unknown kind)
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel foundation --repo <path> --workflow <workflow> --claim <name> --kind module
  - starci kernel foundation --repo <path> --workflow <workflow> --declare-dependent <name>
  - starci kernel foundation --repo <path> --workflow <workflow> --land <name> --proof <proof>
  - starci kernel foundation --repo <path> --workflow <workflow> --declare-none
editions:
  - full
reads: the foundation row, the workflow and its running peers, open peer-waits naming the foundation
writes: "--claim: the row's owner is --workflow and its state claimed (a new version of a landed
  foundation re-opens it; the landing stays in history); a foundation another RUNNING workflow owns
  is refused, one whose owner stopped running passes to the claimant (transferredFrom).
  --declare-dependent: --workflow joins its dependents (the row is created unclaimed when nobody
  registered it). --land (owner only): state landed with {at, by, version, proof, refs}; every
  running dependent gets a peer heads-up 'foundation landed: <name>' (auto foundation-landed), every
  open peer-wait --until-foundation <name> in any workflow of the ledger is resolved
  (incident-resolved {foundation, by:'foundation-landed'}), and each released or notified Kernel is
  woken (transition foundation-landed). Landing the same version again changes nothing.
  --declare-none: the workflow owns and needs nothing. Each writes the declaration marker and
  appends 'foundation-claimed' / 'foundation-dependent-declared' / 'foundation-landed' /
  'foundation-none-declared' on --workflow"
returns: "{ok:true, workflowId, action, name, state, kind, version, owner, dependents[], idempotent,
  transferredFrom?, reopened?, landed?, notified?:[{to, key}], released?:[{workflowId, incidentId,
  holds}], wakes?:[{workflowId, action}], next?: what a dependent does next}"
refuses:
  - workflow-unknown
  - workflow-not-running: only a running workflow owns or needs a foundation
  - foundation-action-invalid: not exactly one of --claim | --declare-dependent | --land | --declare-none
  - foundation-name-invalid: the name is not a lowercase slug of at most 80 characters
  - foundation-kind-invalid
  - foundation-owned: "another running workflow owns it: declare a dependency or agree a handoff (api
      notify --kind handoff)"
  - foundation-self-dependent: the owner declared itself a dependent
  - foundation-unknown: --land on a foundation nobody claimed
  - foundation-not-owner: --land by a workflow that does not own it (claim it first when its owner stopped running)
  - foundation-proof-missing: --land without --proof
  - foundation-declared: --declare-none by a workflow that already owns or needs a foundation
usedBy: "Kernel only (conventions.callerBoundary): at goal definition / boot before feature legs,
  and when a foundation leg settles (driver-loop.yaml foundations)"
