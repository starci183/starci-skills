group: kernel
verb: questions
owner: runtime
summary: the workflow's open questions waiting on the owner
impl:
  script: scripts/kernel/cli.mjs
  args:
    - questions
flags:
  - name: workflow
    type: string
    required: true
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel questions --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api questions
  - node scripts/kernel/cli.mjs questions
reads: "the drain of scripts/kernel/verbs/shared/worker-messages.mjs: each Run of the workflow
  (payload orca/managed/hierarchy runId of its jobs) through scripts/api/orca/check.mjs (calls.yaml
  `check`, Orca's consuming FIFO Delivery, --run <run> --terminal <Kernel terminal>; a
  consumer_fenced answer on the Kernel's own Run re-binds it once with run-use); every `question`
  and `escalation` row is joined to the job whose dispatch (from_handle dispatch:<id> or
  payload.dispatchId) or terminal handle asked it; inbox rows of kind worker-question"
writes: "per Delivery, in one transaction committed before the Delivery is acknowledged (check
  --ack): an inbox row kind worker-question per new question or escalation {key: <message id>,
  payload {messageId, type, runId, jobId, opId, attempt, dispatchId, taskId, question, options[],
  subject, askedAt, from}} with event 'worker-question-bridged'; an event 'orchestration-message'
  per other message (worker_done, status, handoff, ...; worker_done is the audit echo of the op's
  own worker_done: settle reads the Dispatch with worker-show); heartbeats counted on the event
  'orchestration-delivery-bridged' {runId, deliveryId, count, types, heartbeats}; a replayed
  Delivery writes nothing twice (keyed by message id). Then a pending question whose job settled or
  reported, that got a reply threaded in Orca, or that matches no job is closed status done
  {reason}"
returns: "{ok:true, workflowId, bridged, closed, deliveries, pending:[{messageId, jobId, opId,
  attempt, question, options[], state:pending}], error?}"
refuses:
  - workflow-unknown
usedBy: "drive.wait when status frontier is worker-question: bridge, read each question, then answer
  with starci kernel reply"
