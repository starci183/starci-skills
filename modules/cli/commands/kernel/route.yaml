group: kernel
verb: route
owner: runtime
summary: resolve and persist the model decision of a job
impl:
  script: scripts/kernel/cli.mjs
  args:
    - route
flags:
  - name: job
    type: string
    required: true
  - name: difficulty
    type: string
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel route --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api route
  - node scripts/kernel/cli.mjs route
reads: "the job row + its payload (payload.difficulty is the fallback when --difficulty is absent);
  the workflow goal's routing_bias {prefer[], avoid[]} (define-goal: the owner's own bias, always
  applied, the ONLY bias); the job's retry lineage (lineageAdjust below);
  modules/models/runtimes.yaml pool cards (maxParallel, provider) and maxParallelOps; the op
  manifest's route.riskHints host-tool-required entries against each pool's agent card
  capabilities.hostTools; the owner's budgets.maxOps; the workflow's own slot-holding operation
  count; live running counts; provider quota probes; typed expiring provider-health signals.
  Free-form incident text is evidence for the Kernel but never provider-health input"
providerCircuit: "a pool whose provider has an OPEN provider-health circuit is rejected with
  \"provider <failureKind> is unavailable: <detail> (circuit open until <iso>; the Kernel clears it
  with api provider-health --provider <p> --recover --reason <text> --probe)\". An auth circuit
  records the non-reversible fingerprint of the credential it rejected
  (scripts/agent/credential-fingerprint.mjs: first 12 hex of sha256 over the Orca host account id
  for claude/codex) and reads CLOSED once the credential in effect has a different fingerprint.
  Otherwise only expiry or provider-health --recover closes it; resolving an incident never does. A
  QUOTA circuit (failureKind quota: a card's quotaExhausted) reads \"...; its quota probe clears it
  (api provider-health --provider <p> --quota-probe, run by the watchdog ...)\" and needs no Kernel.
  A CAPACITY circuit (failureKind capacity: modules/models/agents/devin.yaml capacityExhausted)
  expires after allocation.cooldownMs.capacity"
kernelBias: "a Kernel does not bias a route (owner decision 2026-09-25: a Kernel once routed an
  interface.implement leg with --avoid devin-agent and it went to codex, defeating the evidence
  routing that sends implementation to Devin first). --prefer and --avoid are unknown options on api
  route and api dispatch: both refuse them with the typed error unknown-option before any work. Pool
  health and retry evidence are the router's: providerCircuit and lineageAdjust"
lineageAdjust: "retry-aware routing (scripts/kernel/lineage-route.mjs). For a job with a retry
  lineage (payload.retry.retryOf|resumeOf, same unit of work), each earlier attempt that FAILED on a
  pool (its persisted payload.model) for a pool-attributable cause counts against that pool:
  no-report (settled failed-no-report), gate-loop (op-worker-gate-loop, then no report), quota
  (dispatch refused on a quota circuit), provider-outage (settled failed with no report while a
  quota or capacity circuit of its pool opened, events provider-unavailable), agent-crash (dispatch
  refused with a provider auth / readiness / worker-start / prompt-delivery-stalled circuit; a first
  strike opens none and counts nothing), report-rejected (a done report the recorded checks
  overruled, claimOverruled), repeat-red-check (a partial report red on a check that was red on the
  attempt it retried). A product or environment failure never counts: blocked / awaiting-owner (a
  missing secret, an owner gate), a failed report or a first red check (e.g. a peer's red tests), a
  dispatch refused with no provider fault (leases, reserve), cancelled or dropped rows. One count
  demotes the pool: it moves to the end of the order and is taken only when no other candidate is
  eligible (under either policy). Two exclude it for this retry: it is rejected \"excluded for this
  retry lineage: failed 2x on it (<cause> (<jobId>), ...)\". route-decided (and the answer) carry
  lineageAdjust {demoted[], excluded[], pools:{<pool>: {failures, causes[]}}, attempts:[{jobId,
  attempt, pool, cause, attributable, detail}], demotedTaken} for any job with a lineage; a first
  attempt has none"
typedWaits: before the owner-gate / peer-wait checks, route (and dispatch) resolve every open
  incident of the job's workflow whose typed --until-* conditions all hold
  (commands.incident.typedRelease), so a job whose wait is met is never refused for it
blocking: "a routed job's out carries blocking {waiters, workflows[], weight, outrankedBy:[{jobId,
  opId, weight, workflows[]}]} when other work waits on it or a heavier queued job of the same
  workflow does (scripts/kernel/waiter-priority.mjs): advisory, route never refuses on it; the
  Kernel dispatches the outranking job first (driver-loop.yaml tick.drive.waiterPriority)"
order: "the pool order is the kind's runtimes.yaml roleOfKind order (scaffold: Devin first; draw:
  Devin then Codex; review: Devin, Opus and Sol overflow only), else the think order (Opus, Sol) for
  think work, else the role's order (implementation: Devin, then Codex, then Claude); a hands-on cut
  slice (payload.cut, total >= 2) walks the scaffold order unless its kind is pinned to draw or
  review. Under the balanced policy the first eligible pool of that order still below its
  config.yaml allocation.shares target takes the job; when all are at or over their share, the least
  over does (owner decision 2026-09-25, 72h model-scorecard evidence). A verify kind is routed away
  from the family of the op whose output it reviews (scripts/agent/balance.mjs auditAuthorOf;
  routeCrossFamily on the route): a review of Devin's work goes to Opus or Sol (owner decision
  2026-09-25 review-hands)"
writes: jobs.payload_json gains {model, modelId, effort, routeChain, routeOrder, routeRejected,
  routeBalance, difficulty} — the PERSISTED route dispatch then launches exactly (dispatch reads
  payload.model/modelId/effort, never re-decides); events 'route-decided' {kind, difficulty, bias,
  lineageAdjust?, ...decided} (bias is the goal's routing_bias actually applied)
returns: "{ok:true, jobId, kind, difficulty, bias, lineageAdjust?, decision:{model, modelId, effort,
  routeChain, routeRejected}}"
maxOps: "the workflow's concurrent-operation ceiling is min(budgets.maxOps, maxParallelOps) — the
  owner's per-workflow budget and the fleet-wide one, lower wins (engine/admission.mjs
  opSlotCeiling). A slot is held from the lease forward: leased, running, answering and the fenced
  effect_unknown. A queued job holds none. An unreadable owner config leaves budgets.maxOps
  unbounded and the fleet ceiling admits alone; a parallelism gear never raises either number. Pool
  maxParallel is a separate fence the capacity block above applies"
refuses:
  - 'max-ops (field `reason`): the workflow already holds min(budgets.maxOps, maxParallelOps)
    operations, so there is no slot for this decision to be spent on. Prints {ok:false, jobId, kind,
    reason:"max-ops", slots:{ok:false, running, ceiling, ceilingSource, reason}} and exits 1; the
    job stays queued and `api status` reports it queuedBecause max-ops'
  - "path-lease (field `reason`, `waiting: true`): a live `path:<owned_path>` lease of another job
    overlaps the job's owned_paths (dispatch.refuses path-lease). No pool decision is spent and no
    route-decided event written; prints {ok:false, jobId, kind, reason:\"path-lease\", waiting:true,
    holders, conflicts, detail} and exits 1; the job stays queued path-lease and routes once the
    holder releases the lease"
  - 'peer-wait (field `reason`): an open peer-wait incident holds the job (status queuedBecause
    peer-wait). Prints {ok:false, jobId, kind, reason:"peer-wait", incident, peer} and exits 1;
    checked right after owner-gate, nothing is persisted'
  - unknown-option: "--prefer or --avoid was passed: a Kernel does not bias a route (kernelBias); only
      the owner goal routing_bias applies"
  - job-unknown: no jobs row for --job
  - job-reconcile-required: effect_unknown remains fenced until api reconcile proves no effect
  - job-settled: a settled job takes no route — the decision was already spent
  - job-not-queued: a live/leased/answering job cannot be rerouted; inspect status.workers and settle or
      reconcile its exact attempt
  - job-live-worker: ledger says queued but the prior exact terminal is still connected+writable;
      reconcile it, never route a duplicate
  - job-no-op: the job carries no op identity to route for
  - "tool-unavailable (field `reason`): the op's manifest declares route.riskHints
    host-tool-required:<tool> and no pool in the kind's order (its work/role order at the
    floor-raised difficulty, after bias) whose role and difficulty pin fit has an agent card listing
    that tool under capabilities.hostTools (scripts/agent/models.mjs missingHostTools). Capacity
    cannot fix it, so it is typed apart from the wait below. Prints {ok:false, jobId, kind,
    difficulty, bias, reason:\"tool-unavailable\", tools, holders:[{target, difficulties, roles}],
    detail} and exits 1, no decision persisted. detail reads \"<op> needs host tool <tool> (...) and
    no agent in its <work> order at <difficulty> [...] has it; <pool> has it and is excluded by the
    goal's routing_bias avoid (the owner's). Only the owner changes that bias.\" — or, when no
    holder is only avoided, \"...; the agents that have it (...) are outside that order | no agent
    card lists it under capabilities.hostTools. Raise api incident --kind tool-unavailable for the
    owner.\" — both end \"The job stays queued; never dispatch it on an agent without the tool.\""
  - "no decision (UNTYPED): selectPool returned none — capacity, eligibility or quota; a wait
    reason, not a failure. This one refusal prints {ok:false, jobId, kind, difficulty, bias,
    error:<selectPool message>} and exits 1 with no code string for the caller to match on"
usedBy: "drive.dispatch — `api route` runs BEFORE every `api dispatch`: the model decision is a
  ledger fact (payload + route-decided event), never an ad hoc kernel pick and never a dispatch-time
  surprise"
