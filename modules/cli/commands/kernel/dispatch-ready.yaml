# The contract of `starci kernel dispatch-ready` (scripts/kernel/verbs/dispatch-ready.mjs): the parallelism push.
group: kernel
verb: dispatch-ready
owner: runtime
summary: route and dispatch queued-ready jobs up to the workflow allowed parallelism
impl:
  script: scripts/kernel/cli.mjs
  args:
    - dispatch-ready
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: workflow
    type: string
    required: true
    summary: workflow id
  - name: max
    type: number
    summary: dispatch at most this many jobs
  - name: dry-run
    type: boolean
    summary: "show which jobs would be dispatched; dispatch nothing"
  - name: foreground
    type: boolean
    summary: run in this process instead of a detached child
exit:
  "0": pushed or started (the result file or JSON lists each job)
  "1": refused or failed (decisions-first gate, unreadable status)
  "2": "bad usage: a required flag is missing or a flag has no value"
json: flag
examples:
  - starci kernel dispatch-ready --repo <path> --workflow <workflow>
  - starci kernel dispatch-ready --repo <path> --workflow <workflow> --max 2 --dry-run
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api dispatch-ready
  - node scripts/kernel/cli.mjs dispatch-ready
purpose: Route and dispatch this workflow's queued-ready units up to starci kernel status
  progress.allowedParallel (the fleet RAM cap, the pools, the workflow's priority reserve) in one
  call, through the ordinary starci kernel route + starci kernel dispatch --spawn (every admission refusal holds). A
  unit whose shape already failed for a shape cause is skipped. Without --foreground it runs
  detached and answers with its result file.
writes:
  - through starci kernel route/dispatch
  - events kernel-dispatch-push
  - logs kind decision
  - the push result <kernel scratch>/dispatch/<push>.json (op-prompt.mjs kernelScratchDirOf: OS temp
  - outside every repository)
kernelOnly: true
