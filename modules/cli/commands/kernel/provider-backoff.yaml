# The contract of `starci kernel provider-backoff` (scripts/kernel/verbs/provider-backoff.mjs): open the provider circuit a
# persisting rate limit calls for (reconciler Resource controller, adaptive per-pool concurrency, scripts/machine/pool-backoff.mjs).
group: kernel
verb: provider-backoff
owner: runtime
summary: open the provider circuit a persisting rate limit calls for (idempotent)
impl:
  script: scripts/kernel/cli.mjs
  args:
    - provider-backoff
flags:
  - name: provider
    type: string
    required: true
  - name: open-circuit
    type: boolean
    required: true
  - name: kind
    type: enum
    enum:
      - quota
      - rate-limited
  - name: reason
    type: string
    required: true
  - name: by
    type: string
    required: true
exit:
  "0": opened or already open
  "1": refused
  "2": bad usage
json: flag
examples:
  - starci kernel provider-backoff --repo <path>
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api provider-backoff
  - node scripts/kernel/cli.mjs provider-backoff
purpose: "Open the ledger's provider-health circuit for one provider (failureKind quota by default,
  or rate-limited) for allocation.cooldownMs.<kind>, when the Resource controller's AIMD backoff
  held the provider's pool at its floor and the rate limit still persisted. The same circuit api
  route and starci kernel dispatch already refuse on; it clears by expiry, the quota probe (quota) or the
  Kernel's provider-health --recover. Idempotent: an open circuit is left as it is."
writes:
  - machine.sqlite provider_health row of <provider> + one provider_health_events row
    (scripts/machine/provider-circuit.mjs); the answer reads back the pools' pool_backoff rows
refusals:
  provider-missing: --provider names no provider
  action-missing: --open-circuit is absent
  kind-invalid: --kind is neither quota nor rate-limited
kernelOnly: true
