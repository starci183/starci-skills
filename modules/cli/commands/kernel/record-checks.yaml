group: kernel
verb: record-checks
owner: runtime
summary: record independent checks against a filed worker report
impl:
  script: scripts/kernel/cli.mjs
  args:
    - record-checks
flags:
  - name: repo
    type: string
    summary: managed repository whose .starciwork ledger the command uses
  - name: job
    type: string
    required: true
    summary: job whose filed worker report the checks are recorded against
  - name: checks
    type: string
    summary: 'JSON {checks:[{name,exitCode,command?,evidence?}]}; one of --checks or --checks-file is required'
  - name: checks-file
    type: string
    summary: path to a file holding the same JSON, absolute or relative to --repo
exit:
  "0": success
  "1": refusal or error
  "2": bad usage
json: flag
examples:
  - starci kernel record-checks --repo <path> --job <job> --checks '{"checks":[{"name":"build","exitCode":0}]}'
  - starci kernel record-checks --repo <path> --job <job> --checks-file <file> --json
editions:
  - full
since: 1.0.0-alpha.4
removed:
  - starci api record-checks
  - node scripts/kernel/cli.mjs record-checks
  - starci api check
  - node scripts/kernel/cli.mjs check
inputShape: "{checks:[{name:<non-empty string>, exitCode:<integer>, command?:<string>,
  evidence?:<string>, codes?:[<finding code>], failing?:[<repo-relative file>]}]}. The envelope and
  checks array are mandatory and non-empty. JSON scalars, bare arrays, legacy key/value maps and
  double-encoded JSON strings are refused. `codes` names the finding codes that made a red check
  red; `failing` names the files a red repo-wide gate's failure implicates (each failing test file
  and the source file it points at, `path[:line]`)."
rawExit: "H8: a verdict reads only the RAW exit a runtime runner observed, never an exit a caller
  declared. A check whose command the runtime can re-run (scripts/kernel/settle/job-settle.mjs
  classifyCheck: a runtime check script, argv, no shell, no mutating flag) is re-run by starci kernel record-checks in
  the repository; its raw exit replaces exitCode and the caller's value is kept as declaredExitCode
  (authority runtime). A command the runtime cannot re-run is recorded authority declared: its red
  counts failed, its green never counts passed (checkEvidence.declared), so a pass needs at least
  one runtime-green check. A re-run whose checker could not run
  (scripts/kernel/settle/check-verdict.mjs: status unavailable, exit 124/127) is unavailable (H7):
  counted neither (checkEvidence.unavailable). The runtime settler (STARCI_CALLER runtime-settler)
  passes checks it re-ran itself; they are recorded authority runtime as given."
admittedContract: "The job is judged against the contract it was admitted under (op-contract
  admission). A red check whose name a contract change registered after that admission added
  (adds.checks), or whose `codes` are all codes such changes added (adds.codes), is recorded with
  advisory {changes[], reason}: a suspect, counted neither passed nor failed
  (checkEvidence.advisory), so it never blocks a pass - which still needs one green check. A
  caller-supplied advisory is discarded; a safetyCritical change is never advisory. The retry of the
  leg is admitted under the current contract, so its prior_attempt_failures still carry those
  checks."
peerBlocked: "Ops share one checkout, so a repo-wide gate reads every peer's change. A red check
  with `failing` is attributed per file (scripts/kernel/gate-attribution.mjs): own when it lies
  under the job's owned paths or a commit since the job's retry lineage began that touched it
  resolves to this workflow; peer when it is uncommitted under a path lease another job holds, or
  such a commit resolves to another workflow (scripts/kernel/introducer.mjs); peer via preexisting
  when nothing touched it since the lineage began, it is clean, it imports nothing under the job's
  owned paths, and its last (older) commit resolves to another workflow - the gate was red on that
  workflow's change before this op started (a collaborating workflow incident); else unknown. A failing
  file printed relative to, or absolute under, another repository of the project binding is read
  with git there. A check with no own file and at least one peer file is recorded attribution
  {class:peer, files} and peerBlocked {peers:[{workflowId, via:lease|commit|preexisting, jobId?,
  commit?, files[]}], routes[]}: the peer's, counted neither passed nor failed
  (checkEvidence.peerBlocked), so it never blocks a pass and never overrules a done report. A red
  check with no `failing` list is attributed on the source paths its own evidence/output text names
  (`path(l,c)`, `path:l[:c]`; recorded failing + failingDerived true). Any other red check with
  `failing` records its attribution and counts failed. A caller-supplied peerBlocked or attribution
  is discarded; a git read that fails leaves its file unknown."
reads: the job row; the op's declared checks (the re-run results being recorded)
writes: "checks row UPSERT keyed PK(workflow_id,op_id,attempt) — the kernel''s INDEPENDENT re-run of
  the op''s declared checks, one row per attempt, a re-run upserts itself rather than doubling;
  events 'checks-recorded'. `done` is never taken on trust: these are the results the kernel
  measured, not the worker''s claims."
returns: "{ok:true, jobId, workflowId, op, attempt, checks:<n>,
  checkEvidence:{observed,passed,failed,green,advisory?,peerBlocked?}, advisory?:[{name,
  changes[]}], peerBlocked?:[{name, peers[]}], admittedAt?}"
refuses:
  - job-unknown
  - job-no-op: the job row carries no op identity — pass --op
  - checks-invalid: the --checks payload is not valid JSON / not the check-result shape
  - checks-file-missing: the --checks-file path does not exist
  - bad-attempt: --attempt is not a positive integer
  - checks-attempt-mismatch: --attempt names an attempt other than the job row's — one checks row per
      attempt, never written against a neighbour
  - checks-report-missing: no worker report is filed for the job's bound dispatch — the kernel re-runs
      checks against a filed answer, not against silence
  - "report-job-not-active / report-dispatch-unbound / report-contract-unbound: the report binding
    refusals, resolved exactly as `report` binding declares"
usedBy: drive.settle — after consume-report and before settle; the re-run record a `pass` verdict stands on
