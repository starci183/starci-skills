group: gate
verb: starcistacks
owner: runtime
summary: check a repository's stack declaration and custody layout
impl: {script: scripts/gates/starcistacks.mjs}
positional:
  - {name: repo-root, required: true, variadic: false}
flags:
  - {name: new, type: boolean, summary: check a repository being created by this leg}
  - {name: admitted-at, type: string, summary: admission time for contract-change advice}
  - {name: op, type: string, summary: admitted operation for contract-change advice}
exit:
  "0": declaration and custody layout are clean
  "1": repository is refused
  "2": bad usage
json: flag
examples:
  - starci gate starcistacks <repo-root>
  - starci gate starcistacks <repo-root> --new --json
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/gates/starcistacks.mjs
  - node .claude/scripts/gates/starcistacks.mjs
