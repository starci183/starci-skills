group: gate
verb: reference-conventions
owner: runtime
summary: probe the installed backend reference rules of a reference root
impl: {script: scripts/gates/probe-reference-conventions.mjs}
positional:
  - {name: reference-root, required: false, variadic: false}
flags: []
exit: {"0": probes passed, "1": a probe failed, "2": bad usage}
json: none
examples:
  - starci gate reference-conventions <backend-reference-root>
editions: [full]
