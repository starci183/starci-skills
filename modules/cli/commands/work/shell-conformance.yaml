group: work
verb: shell-conformance
owner: runtime
summary: check Work and implementation records against the measured frontend shell
impl: {script: scripts/work/ui/shell-conformance.mjs}
positional:
  - {name: target, required: true, variadic: false}
flags:
  - {name: admitted-at, type: string, summary: ISO time or epoch ms the work was admitted at}
  - {name: op, type: string, summary: "op id whose contract changes count (needs --admitted-at)"}
exit: {"0": conformant, "1": refused or suspect records, "2": bad usage}
json: flag
examples: ['starci work shell-conformance .starciwork --json']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/ui/shell-conformance.mjs']
