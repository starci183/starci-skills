group: work
verb: grammar-proposal
owner: runtime
summary: list or check grammar proposals in Work records
impl: {script: scripts/work/grammar-proposal.mjs}
positional:
  - {name: command, enum: [list, check], required: true, variadic: false}
  - {name: target, required: true, variadic: true}
flags: []
exit: {"0": "every proposal is complete, or list was asked", "1": check found an incomplete proposal, "2": bad usage}
json: flag
examples:
  - 'starci work grammar-proposal check .starciwork'
  - 'starci work grammar-proposal list .starciwork --json'
editions: [full]
