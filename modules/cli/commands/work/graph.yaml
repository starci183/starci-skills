group: work
verb: graph
owner: runtime
summary: inspect, validate, diff or propose a workflow work graph
impl: {script: scripts/work/work-graph.mjs}
positional:
  - {name: action, enum: [show, validate, diff, propose], required: true, variadic: false}
flags:
  - {name: repo, type: string, required: true, summary: repository root that holds the ledger}
  - {name: workflow, type: string, summary: "workflow id whose graph is read (propose may name --job instead)"}
  - {name: version, type: number, summary: "graph version to show (default is the latest)"}
  - {name: file, type: string, summary: "candidate graph file (JSON or YAML)"}
  - {name: from, type: number, summary: graph version to diff from}
  - {name: to, type: number, summary: "graph version to diff to (default is the latest)"}
  - {name: job, type: string, summary: op job id that proposes the change}
  - {name: reason, type: string, summary: "why the graph changes; propose needs it"}
  - {name: slice, type: string, summary: slice id a cutting job changes}
exit: {"0": action completed, "1": the graph was refused or is invalid, "2": bad usage}
json: flag
examples:
  - starci work graph show --repo <path> --workflow <id>
  - starci work graph propose --repo <path> --job <id> --file <candidate> --reason <text>
editions: [full]
