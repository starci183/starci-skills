group: work
verb: draw-rationale
owner: runtime
summary: verify the rationale bound to a rendered drawing
impl: {script: scripts/work/draw/draw-rationale.mjs}
positional:
  - {name: html, required: true, variadic: false}
flags:
  - {name: rationale, type: string}
  - {name: ui, type: string}
  - {name: records, type: string}
exit: {"0": clean, "1": findings, "2": bad usage}
json: flag
examples: ['starci work draw-rationale <render.html> --json']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/draw/draw-rationale.mjs']
