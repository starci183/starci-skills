group: work
verb: example-derive
owner: runtime
summary: derive example catalog artifacts from a Work tree
impl: {script: scripts/example/example-derive.mjs}
flags:
  - {name: work, type: string, required: true, summary: the .starciwork tree to derive from}
  - {name: write, type: boolean, summary: "write the derived artifacts; without it only checks they are current"}
exit: {"0": artifacts are current or were written, "1": artifacts are stale or the tree was refused, "2": bad usage}
json: none
examples: ['starci work example-derive --work .starciwork --write']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/example/example-derive.mjs']
