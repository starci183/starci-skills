group: work
verb: imagegen
owner: runtime
summary: generate images headlessly on the imagegen call tier and write them with a receipt
impl: {script: scripts/work/imagegen.mjs}
positional: []
flags:
  - {name: prompt, type: string, required: true, summary: "file holding the image brief, sent verbatim"}
  - {name: out, type: string, required: true, summary: "output directory inside the op's worktree (a record's assets directory)"}
  - {name: reference, type: list, summary: "reference image (png, jpg or webp); repeatable"}
  - {name: count, type: string, summary: "number of images, 1 to the call's maxImages (default 1)"}
  - {name: size, type: string, summary: "requested size WxH, a request the tool may not honour (the receipt records the real size)"}
  - {name: name, type: string, summary: "file stem of the images (default: the prompt file's name); an existing target is refused"}
  - {name: stage, type: string, summary: "label of the receipt entries (default final)"}
exit: {"0": "images and receipt written", "1": "typed refusal: quota, capacity, unavailable, runner failed, timeout, no output, bad input or output outside the worktree", "2": "bad usage"}
json: flag
examples:
  - 'starci work imagegen --prompt <STARCI_JOB_SCRATCH>/mascot.prompt.txt --out .starciwork/brand/assets --name mascot --json'
  - 'starci work imagegen --prompt hero.prompt.txt --out ui/home/assets --reference ui/home/assets/hero-ref.png --count 2 --size 1536x1024'
editions: [full]
