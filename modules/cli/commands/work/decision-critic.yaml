group: work
verb: decision-critic
owner: runtime
summary: judge a decision leg's records with the independent Critic and write its typed verdict
impl: {script: scripts/work/decision-critic.mjs}
flags:
  - {name: kind, type: enum, enum: [scope.define, architecture.decide], required: true, summary: the decision leg whose records are judged}
  - {name: root, type: string, required: true, summary: the work root (.starciwork) or the repository that holds it}
  - {name: out, type: string, required: true, summary: the verdict file to write (the op attaches it; starci kernel settle requires it for exactly these bytes)}
  - {name: records, type: string, summary: "comma-separated decision record files or directories to judge; default every decision record of the kind under the work root"}
  - {name: input, type: string, summary: "comma-separated extra input files the decision rests on, such as the goal or request text"}
  - {name: maker, type: string, summary: "provider that made the records; default the provider of the op running this verb"}
  - {name: json, type: boolean, summary: print the outcome as JSON}
exit: {"0": judged and the verdict passes, "1": judged and the verdict fails - fix every failed check and run it again, "2": bad usage, "3": no verdict - a Critic hold; report blocked with the CRITIC_ code}
json: flag
examples: ['starci work decision-critic --kind scope.define --root <app> --out <STARCI_JOB_SCRATCH>/critic-verdict.json']
editions: [full]
