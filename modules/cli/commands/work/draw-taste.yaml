group: work
verb: draw-taste
owner: runtime
summary: check a rendered drawing against visual taste rules
impl: {script: scripts/work/draw/draw-taste.mjs}
flags:
  - {name: html, type: string, required: true, summary: rendered HTML to check}
  - {name: png, type: list, summary: "rendered part PNG for the accent budget; repeatable"}
exit: {"0": within the taste budgets, "1": a taste finding, "2": bad usage}
json: flag
examples: ['starci work draw-taste --html <render.html> --json']
editions: [full]
