group: work
verb: brand-direction
owner: runtime
summary: inspect, ask for, or apply owner review of a brand direction
impl: {script: scripts/work/brand-direction.mjs}
positional:
  - {name: command, enum: [status, question, apply], required: true, variadic: false}
flags:
  - {name: work, type: string, required: true, summary: the .starciwork root that holds the brand record}
  - {name: archetype, type: string, summary: brand direction archetype to ask the owner about}
  - {name: lang, type: enum, enum: [en, vi], summary: language of the owner question, default: en}
  - {name: receipt, type: string, summary: owner answer receipt to apply}
  - {name: write, type: boolean, summary: "write the answer into the brand record; without it apply only reports"}
exit: {"0": "status printed, question built or answer applied", "1": the review failed or the answer was refused, "2": bad usage}
json: flag
examples: ['starci work brand-direction status --work .starciwork']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/brand-direction.mjs']
