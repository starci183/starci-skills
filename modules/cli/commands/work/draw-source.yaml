group: work
verb: draw-source
owner: runtime
summary: validate a drawing source and its fixture bindings
impl: {script: scripts/work/draw/draw-source.mjs}
positional:
  - {name: source, required: true, variadic: false}
flags:
  - {name: fixture, type: list}
  - {name: product, type: string}
  - {name: grammar, type: enum, enum: [auto, product, claude-dist]}
  - {name: grammar-dist, type: string}
  - {name: rationale, type: string}
exit: {"0": clean, "1": findings, "2": bad usage}
json: flag
examples: ['starci work draw-source <X.draw.tsx> --product <app> --json']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/draw/draw-source.mjs']
