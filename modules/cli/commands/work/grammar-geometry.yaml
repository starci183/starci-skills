group: work
verb: grammar-geometry
owner: runtime
summary: emit grammar geometry guidance or check captured geometry
impl: {script: scripts/work/ui/grammar-geometry.mjs}
flags:
  - {name: prompt, type: boolean}
  - {name: repo, type: string, required: true}
  - {name: family, type: enum, enum: [starci, nivo]}
  - {name: check, type: string}
  - {name: viewport, type: string}
exit: {"0": clean, "1": findings, "2": bad usage}
json: flag
examples: ['starci work grammar-geometry --prompt --repo <repo> --json']
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/ui/grammar-geometry.mjs']
