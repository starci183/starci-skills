group: work
verb: asset-slot
owner: runtime
summary: list or check asset slots in Work records
impl: {script: scripts/work/asset-slot.mjs}
positional:
  - {name: command, enum: [list, check], required: true, variadic: false}
  - {name: target, required: true, variadic: true}
flags: []
exit: {"0": "every slot has a request, or list was asked", "1": check found a slot with no request, "2": bad usage}
json: flag
examples:
  - 'starci work asset-slot check .starciwork'
  - 'starci work asset-slot list .starciwork --json'
editions: [full]
since: 1.0.0-alpha.4
removed: ['node scripts/work/asset-slot.mjs']
