group: work
verb: hygiene
owner: runtime
summary: parse, scope-validate and secret-check Work and stack files before they are committed
impl: {script: scripts/work/validate/work-hygiene.mjs}
positional:
  - {name: mode, enum: [staged, files], required: true, variadic: false}
  - {name: file, required: false, variadic: true}
flags:
  - {name: repo, type: string, summary: the product repository (default is the current directory)}
exit: {"0": every file is clean, "1": a hygiene finding, "2": bad usage}
json: flag
examples:
  - starci work hygiene staged --repo <repo>
  - starci work hygiene files --repo <repo> <file>
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/work/validate/work-hygiene.mjs
  - node .claude/scripts/work/validate/work-hygiene.mjs
