group: npm
verb: install
owner: runtime
summary: install exact dependencies and move StarCi pins with the target CLI
impl: {module: scripts/machine/npm-install.mjs, export: npmInstall}
effect: host
roles: [lead, owner]
conventions:
  - bare package names resolve only from knowledge/hfs/canon-pins.yaml and never through a registry lookup
  - explicit versions use exact x.y.z form and must agree with the canon pin when one exists, except the target CLI version on a canon upgrade
  - "naming @starci/cli or passing --canon installs the exact target CLI first,"
  - "then reads its installed HFS runtime canon-pins.yaml and, in the same host lock,"
  - "moves each other pinned @starci package only where a root or workspace package.json declares it, in its own section"
  - --canon without a CLI positional uses the running runtime's exact CLI pin as the target
  - target pins never fall back to the running runtime when the target pin file is missing or inconsistent
  - each target StarCi pin is reported as moved (with its workspace), skipped when no package.json declares it, or refused with a reason
  - a failed canon phase exits nonzero even when the first CLI install succeeded
  - installs always use --save-exact and report the package.json and package-lock.json diff stat
  - after an install, a core.hooksPath naming a missing or empty folder runs the root husky prepare (npm run prepare), lifecycle scripts ignored or not
  - the receipt's hooks field reports the git hooks as installed, repaired, not-set or not-declared
  - a hooks path still naming a missing or empty folder after the installer ran fails the verb
flags:
  - {name: dev, type: boolean, summary: save the CLI and explicit packages as development dependencies}
  - {name: canon, type: boolean, summary: install the target CLI and move its declared exact StarCi canon pins}
positional:
  - {name: package, required: false, variadic: true}
exit:
  "0": "exact dependencies and any requested canon pins were installed"
  "1": "npm, Git, target canon loading, the host lock or the git hooks install failed"
  "2": "the package, target pin or worktree was refused"
json: starci/npm-install@1
examples:
  - starci npm install typescript
  - starci npm install left-pad@1.3.0 --dev
  - starci npm install @starci/cli --dev
  - starci npm install --canon --dev
editions: [full]
