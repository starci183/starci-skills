group: app
verb: stack
owner: "@starci/hfs"
summary: Swarm deploy tooling of an app (prepare to rollback) and the full edition test-world infrastructure
impl: null
positional:
  - {name: action, enum: [up, down, status, prepare, doctor, connect, disconnect, build-args, render, deploy, converge, verify, rollback, prune, backup, jobs, ingress], required: true, variadic: false}
  - {name: args, required: false, variadic: true}
flags:
  - {name: stack, type: string, summary: "up, down, status: stack definition directory"}
  - {name: services, type: list, summary: "up, down, status: comma-separated infrastructure services to keep warm"}
  - {name: k3d, type: boolean, summary: "up, down, status: also warm the k3d cluster and registry"}
  - {name: force, type: boolean, summary: "up, down, status: stop the stack even while leases exist"}
  - {name: env, type: string, default: production, summary: environment of .starcistacks whose deploy block drives the action}
  - {name: execute, type: boolean, summary: perform the effects; without it every effectful action is a dry run}
  - {name: image, type: list, summary: "render, deploy: service=registry/name@sha256:digest, repeatable or comma-separated"}
  - {name: source-sha, type: string, summary: "render, deploy: the git commit the images were built from"}
  - {name: previous, type: string, summary: "render: the previous accepted release id (16 hex)"}
  - {name: out, type: string, summary: "render, deploy: directory that receives stack.yaml, stack.generated.yaml and release.json"}
  - {name: release, type: string, summary: "rollback: release id (16 lowercase hex) to deploy again; default the previous accepted release"}
  - {name: since, type: string, summary: "converge: ISO instant the deploy began"}
  - {name: timeout, type: number, summary: "deploy, converge, rollback: seconds to wait for convergence"}
  - {name: retry, type: number, summary: "deploy, verify: seconds public checks keep retrying"}
  - {name: keep, type: list, summary: "prune: release.json of a release whose secrets and configs stay"}
  - {name: app, type: string, summary: "build-args: the app whose image receives the public build values"}
  - {name: ssh-cmd, type: string, summary: "prepare, doctor, backup, jobs, deploy, rollback: ssh command to reach the manager instead of the configured alias"}
  - {name: extra-compose, type: list, summary: "render: additional compose files for a local throwaway swarm"}
  - {name: allow-unpinned, type: boolean, summary: "render: accept stand-in images without a digest (a local throwaway swarm; never the placeholder digest)"}
  - {name: init-swarm, type: boolean, summary: "prepare: run the one-time docker swarm init (needs --execute and --owner-approved)"}
  - {name: owner-approved, type: boolean, summary: "prepare: the owner approved the one-time docker swarm init (with --init-swarm --execute)"}
  - {name: swarm-state, type: boolean, summary: "backup: also archive /var/lib/docker/swarm, encrypted"}
  - {name: skip-public, type: boolean, summary: "verify: skip the public HTTP checks"}
  - {name: skip-internal, type: boolean, summary: "verify: skip the checks run inside a service task"}
conventions:
  - the deploy actions read environments.<env>.deploy of .starcistacks/application-stacks.yaml and nothing app-specific is kept anywhere else
  - effectful actions are a dry run unless --execute is given; a placeholder (all-zero) image digest is always refused
  - secret values are decrypted in memory, piped to docker on stdin and never printed or written
  - "docker swarm init runs once: --init-swarm, --execute and --owner-approved (or STARCI_SWARM_INIT_APPROVED=1); never on an active swarm"
  - up, down and status are the full edition's local test-world verbs
exit: {"0": action completed, "1": a check or step failed, "2": refusal or bad usage, "3": owner approval missing}
json: flag
examples:
  - starci app stack up
  - starci app stack status --json
  - starci app stack down --force
  - starci app stack doctor --env production
  - starci app stack prepare --env production --init-swarm --owner-approved --execute
  - starci app stack render --env production --image api=ghcr.io/org/app-api@sha256:<digest> --source-sha <sha>
  - starci app stack deploy --env production --image api=ghcr.io/org/app-api@sha256:<digest> --source-sha <sha> --execute
  - starci app stack rollback --env production --release <16 hex> --execute
  - starci app stack backup --env production --swarm-state --execute
  - starci app stack jobs stats --env production
  - starci app stack ingress plan --env production
editions: [full, lite]
