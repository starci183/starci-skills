group: app
verb: release
owner: "@starci/hfs"
summary: run the release gates and write the L4 record and tag, or push branch and tag atomically
impl: null
positional:
  - {name: action, enum: [gate, push], required: true, variadic: false}
flags:
  - {name: execute, type: boolean, summary: run the gates and write the record and tag (gate) or push for real (push); without it both are dry runs}
  - {name: source, type: string, summary: "gate: ref that must equal HEAD (default HEAD)"}
  - {name: tag-prefix, type: string, summary: "gate: release tag prefix (default from release.tagPrefix, v)"}
  - {name: sonar, type: boolean, summary: "gate: append a local Sonar scan using services.sonar host and the token environment variable named by ci.token (default SONAR_TOKEN)"}
  - {name: remote, type: string, summary: "push: remote name (default origin)"}
  - {name: json, type: boolean, summary: print the result as JSON}
conventions:
  - "the gate list is release.gates of application-stacks.yaml (argument arrays), else app-check, audit, then every row the managed CI runs"
  - "audit runs npm audit --omit=dev --audit-level=high by default; services.audit.level and omitDev configure it,"
  - "and an explicit audit.in without release-gate omits it;"
  - "declared release.gates gets audit appended if missing"
  - "a declared services.sonar is a row (as --sonar): @sonar/scan@4.3.0 against its host (host.public for a mapping), plus organization for sonarcloud;"
  - "disabled or unavailable Sonar or an unset token refuses RELEASE_SONAR_UNAVAILABLE"
  - "a scanner exit 0 is not a pass: the row polls api/ce/task until the analysis ends, then reads api/qualitygates/project_status with the same token"
  - "OK passes; ERROR is red as RELEASE_SONAR_GATE_FAILED naming each failed condition, as is a FAILED or CANCELED task"
  - "a task still running after 600 s is RELEASE_SONAR_GATE_TIMEOUT; no report-task, an HTTP 4xx or no gate is RELEASE_SONAR_GATE_UNREADABLE"
  - "a network error or HTTP 5xx is retried up to 5 times with backoff inside the 600 s; still failing, it is RELEASE_SONAR_GATE_UNREADABLE"
  - "OWNER RULING candidate-ci (2026-10-18): the gate no longer reads the default-branch CI; the verdict is the candidate run of the sha"
  - "release.requireCi (default false, owner ruling release-require-ci-per-project) decides whether push waits for CI; every local gate row runs either way"
  - "requireCi false: push needs the tag and the green L4 record, runs the dry run, pushes atomically and states CI was not required"
  - "requireCi true: push --execute sends HEAD to refs/heads/release/candidate-<version> first and waits for its ci.yml run"
  - "green moves the branch and the tag in one atomic push; red refuses RELEASE_CANDIDATE_CI_RED naming the failing jobs"
  - "no run, or no end in time, refuses RELEASE_CANDIDATE_CI_TIMEOUT; unreadable GitHub refuses RELEASE_CI_UNKNOWN; nothing reaches the branch"
  - "only the owner's starci release ci-override --sha <sha> --reason <text> record lets a red candidate through; there is no --no-ci-check flag"
  - "gate refuses a dirty tree, HEAD other than --source, a moved HEAD and a tree dirtied by the gates; record and tag only when all gates are green"
  - "a gate with summary jest is red on failed tests and on a coverage threshold miss even when the process exits 0"
  - "push needs the annotated tag and L4 record of HEAD, runs git push --dry-run --atomic first and never uses --no-verify"
exit: {"0": gate green or push done or nothing to do, "1": "a gate is red, the candidate CI of the sha is not green, or the push was refused by the hook", "2": "refusal or bad usage including RELEASE_SONAR_UNAVAILABLE"}
json: flag
examples:
  - starci app release gate
  - starci app release gate --execute
  - starci app release gate --sonar --execute
  - starci app release push --remote origin
  - starci app release push --execute
editions: [full, lite]
