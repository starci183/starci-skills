group: app
verb: check
owner: "@starci/hfs"
summary: judge the app tree, managed output, contracts, formatting and architecture
impl: null
flags:
  - {name: fast, type: boolean, summary: judge only paths changed since the merge base}
  - {name: base, type: string, summary: merge-base ref used by --fast}
exit: {"0": clean, "1": findings, "2": refusal or bad usage}
json: flag
examples: ['starci app check', 'starci app check --fast', 'starci app check --json']
editions: [full]
since: 1.0.0
removed: ['hfs check', 'npx hfs check']
