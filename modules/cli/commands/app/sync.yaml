group: app
verb: sync
owner: "@starci/hfs"
summary: compare or write every managed app file from its canonical template
impl: null
flags:
  - {name: check, type: boolean, summary: compare managed output without writing}
  - {name: write, type: boolean, summary: rewrite managed output that drifted}
exit: {"0": managed output is current, "1": drift or render error, "2": refusal or bad usage}
json: none
examples: ['starci app sync --check', 'starci app sync --write']
editions: [full, lite]
