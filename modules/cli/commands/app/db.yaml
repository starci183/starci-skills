group: app
verb: db
owner: "@starci/hfs"
summary: preview or apply a migration baseline, restamp, history migration or post-cutover step
impl: null
positional:
  - {name: action, enum: [baseline, restamp, plan, migrate, post-cutover], required: true, variadic: false}
flags:
  - {name: stamp, type: string, summary: fourteen-digit timestamp of the new baseline migration}
  - {name: map, type: string, summary: explicit old-to-new migration stamp map for restamp}
  - {name: apply, type: boolean, summary: apply baseline or restamp mutations after validation}
  - {name: local, type: boolean, summary: inspect or repair the local Supabase database instead of the linked project}
  - {name: execute, type: boolean, summary: "migrate, post-cutover: apply the plan (also needs STARCI_DB_ARMED=1); without it both are read-only"}
  - {name: linked, type: boolean, summary: "migrate, post-cutover: use the project the app is linked to (the default)"}
  - {name: url-env, type: string, summary: "migrate, post-cutover: name of the environment variable that holds the connection string"}
  - {name: green-at, type: string, summary: "post-cutover: ISO time of the last green smoke; must be at least database.postCutover.minAgeHours (48) old"}
  - {name: owner-confirms-old-app-gone, type: boolean, summary: "post-cutover: the owner confirms the old app is gone (opens the time gate)"}
  - {name: json, type: boolean, summary: "plan, migrate, post-cutover: print the result as JSON"}
conventions:
  - baseline accepts --stamp; restamp requires --map; both preview without --apply
  - plan is always read-only and supports --json; it compares migrations, cron, queues and Vault names
  - "migrate and post-cutover read the optional database block of application-stacks.yaml; both are dry runs without --execute"
  - "migrate is idempotent: baseline plus forward on the remote prints nothing to do; held-back migrations are never applied by it"
  - "post-cutover applies held-back migrations after the read-only pg_proc preflight, an open time gate and STARCI_DB_ARMED=1"
exit: {"0": preview or action completed with no drift, "1": database plan drift, "2": refusal or bad usage}
json: flag
examples:
  - starci app db baseline
  - starci app db baseline --stamp 20261014000000 --apply
  - starci app db restamp --map restamp.yaml
  - starci app db plan --json
  - starci app db plan --local
  - starci app db migrate --linked
  - starci app db migrate --execute
  - starci app db post-cutover --green-at 2026-10-10T00:00:00Z
editions: [full, lite]
