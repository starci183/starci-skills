group: app
verb: db
owner: "@starci/hfs"
summary: preview or apply database migrations, encrypted backups and guarded linked resets
impl: null
positional:
  - {name: action, enum: [baseline, restamp, plan, migrate, post-cutover, dump, reset], required: true, variadic: false}
flags:
  - {name: out, type: string, summary: "dump: destination outside the app and every Git worktree"}
  - {name: schema-only, type: boolean, summary: "dump: omit data parts; this backup cannot authorize reset"}
  - {name: auth, type: string, summary: "reset: required keep or drop; drop deletes users and identities"}
  - {name: storage, type: string, summary: "reset: required keep or drop; drop empties objects metadata but does not delete backend files"}
  - {name: backup, type: string, summary: "reset: existing full encrypted backup receipt for this project, younger than database.reset.backupMaxAgeHours (default 24)"}
  - {name: stamp, type: string, summary: fourteen-digit timestamp of the new baseline migration}
  - {name: map, type: string, summary: explicit old-to-new migration stamp map for restamp}
  - {name: apply, type: boolean, summary: apply baseline or restamp mutations after validation}
  - {name: local, type: boolean, summary: inspect or repair the local Supabase database instead of the linked project}
  - {name: execute, type: boolean, summary: "migrate, post-cutover, reset: apply the plan (also needs STARCI_DB_ARMED=1); otherwise read-only"}
  - {name: linked, type: boolean, summary: "use the linked project; required explicitly for reset and one of the dump target choices"}
  - {name: url-env, type: string, summary: "migrate, post-cutover, dump: environment variable holding the connection string"}
  - {name: green-at, type: string, summary: "post-cutover: ISO time of the last green smoke; must be at least database.postCutover.minAgeHours (48) old"}
  - {name: owner-confirms-old-app-gone, type: boolean, summary: "post-cutover: the owner confirms the old app is gone (opens the time gate)"}
  - {name: json, type: boolean, summary: "plan, migrate, post-cutover, dump, reset: print the result as JSON"}
conventions:
  - 'Owner ruling 2026-10-17 alpha.20: "add a canon DB reset/backup verb design ... at least starci app db dump (encrypted, outside repo) and starci app db reset --linked with explicit auth/storage behaviour flags"'
  - 'Owner ruling main 2026-10-17: reset "must require --backup <receipt> pointing at an existing encrypted dump made in the last N hours, and must refuse without explicit --auth/--storage choices"'
  - "dump requires exactly one target; archives roles, schema, auth/storage schema, data and rowcounts; age encrypts to .sops.yaml recipients and deletes plaintext even on failure"
  - "dump verifies age archive header, size and sha256; owner identity is required for a separate decryption proof"
  - "reset is linked only, dry run by default, and requires STARCI_DB_ARMED=1 with --execute; local reset stays npm run db:reset"
  - "reset keep encrypts auth/storage data before reset, proves identity access, restores transactionally and verifies fingerprints and migration head; requires Supabase db query --file and SOPS_AGE_KEY or SOPS_AGE_KEY_FILE"
  - "reset keeps encrypted temporary recovery parts after a reset/restore failure and reports their directory; plaintext is always deleted"
  - baseline accepts --stamp; restamp requires --map; both preview without --apply
  - plan is always read-only and supports --json; it compares migrations, cron, queues and Vault names
  - "migrate and post-cutover read the optional database block of application-stacks.yaml; both are dry runs without --execute"
  - "migrate is idempotent: baseline plus forward on the remote prints nothing to do; held-back migrations are never applied by it"
  - "post-cutover applies held-back migrations after the read-only pg_proc preflight, an open time gate and STARCI_DB_ARMED=1"
exit: {"0": preview or action completed with no drift, "1": database plan drift or failed tool/verification, "2": refusal or bad usage, "3": database mutation is not armed}
json: flag
examples:
  - starci app db dump --linked --out /var/backups/my-app
  - starci app db reset --linked --auth keep --storage keep --backup /var/backups/my-app/backup.receipt.json
  - starci app db baseline
  - starci app db baseline --stamp 20261014000000 --apply
  - starci app db restamp --map restamp.yaml
  - starci app db plan --json
  - starci app db plan --local
  - starci app db migrate --linked
  - starci app db migrate --execute
  - starci app db post-cutover --green-at 2026-10-10T00:00:00Z
editions: [full, lite]
