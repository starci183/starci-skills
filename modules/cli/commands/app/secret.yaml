group: app
verb: secret
owner: "@starci/hfs"
summary: list, read, seal or generate an encrypted app secret
impl: null
positional:
  - {name: action, enum: [list, show, set, gen], required: true, variadic: false}
  - {name: slug, required: false, variadic: false}
flags:
  - {name: key, type: string, summary: key inside a multi-value secret}
  - {name: env, type: string, summary: stack environment name}
  - {name: age, type: list, summary: age recipient used to seal the secret}
  - {name: bytes, type: number, summary: random byte count for gen}
exit: {"0": action completed, "1": findings, "2": refusal or bad usage}
json: none
examples: ['starci app secret list', 'starci app secret gen database --key PASSWORD']
editions: [full]
since: 1.0.0
removed: ['hfs secret', 'npx hfs secret']
