group: app
verb: secret
owner: "@starci/hfs"
summary: initialize, seal, edit, materialize and verify app secrets
impl: null
positional:
  - {name: action, enum: [init, set, get, unset, rename, remove, materialize, list, verify], required: true, variadic: false}
  - {name: env, required: false, variadic: false}
  - {name: slug, required: false, variadic: false}
  - {name: key, required: false, variadic: false}
  - {name: new-key, required: false, variadic: false}
flags:
  - {name: generate, type: number, summary: generate this many random bytes for set instead of reading stdin}
  - {name: to-file, type: boolean, summary: write one private file per KEY outside the repository}
  - {name: reveal, type: boolean, summary: explicitly print decrypted values for get}
  - {name: execute, type: boolean, summary: apply the edit instead of only reporting what unset or rename or remove would do}
  - {name: force-nonempty, type: boolean, summary: let remove delete a member that still holds keys}
exit: {"0": action completed, "2": verification findings or refusal or bad usage}
json: none
examples:
  - starci app secret init
  - starci app secret set production app-be-db DB_PASSWORD --generate 32
  - starci app secret get production app-be-db DB_PASSWORD --to-file
  - starci app secret unset production stack N8N_SIGNING_SECRET --execute
  - starci app secret rename production vps-ssh-key data privateKey --execute
  - starci app secret remove production web --force-nonempty --execute
  - starci app secret materialize production
  - starci app secret list production
  - starci app secret verify production
editions: [full, lite]
