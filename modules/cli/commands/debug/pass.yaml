group: debug
verb: pass
owner: runtime
summary: run or maintain the debug loop; writes only its own debug-loop state
impl:
  script: scripts/reconciler/debug-pass.mjs
positional:
  - {name: action, enum: [setup, bind, block, pass, claim, note, release, stop, status], required: true, variadic: false}
flags:
  - {name: loop-id, type: string, summary: exact held loop identity for binding or a scheduled pass}
  - {name: scheduler, type: enum, enum: [codex-heartbeat, claude-loop], summary: verified native recurrence facility}
  - {name: scheduler-id, type: string, summary: exact native scheduler identity from its receipt}
  - {name: confirmation, type: enum, enum: [cancelled, ended, not-created], summary: authoritative native cancellation or creation outcome}
  - {name: confirmed, type: boolean, summary: caller verified the exact native receipt before recording it}
  - {name: snapshot, type: string, summary: saved core-watch snapshot for a pass}
  - {name: child-timeout, type: number, summary: child call timeout in seconds}
  - {name: token-window, type: number, summary: token-spike window in minutes}
  - {name: token-spike, type: number, summary: token count that raises an alert}
  - {name: key, type: string, summary: debug alert key}
  - {name: lane, type: string, summary: lane fixing the alert}
  - {name: reason, type: string, summary: reason no core fix is owed}
exit: {"0": debug-loop state action completed, "1": state action failed, "2": bad usage}
json: always
examples:
  - starci debug pass setup
  - starci debug pass pass
  - starci debug pass claim --key <alert> --lane <lane>
  - starci debug pass status
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/reconciler/debug-pass.mjs
