group: guard
verb: verify-commit
owner: runtime
summary: verify a protected-branch update carries only worker-owned paths
impl:
  script: scripts/guards/verify-commit.mjs
positional:
  - name: old
    required: true
    variadic: false
  - name: new
    required: true
    variadic: false
flags: []
exit:
  "0": update allowed or the verifier failed open
  "3": update refused because it carries foreign paths
json: none
examples:
  - starci guard verify-commit <old> <new>
editions: [full]
since: 1.0.0-alpha.4
removed: []
internal: true
why: git reference-transaction hooks cannot rely on the per-user starci shim being on PATH
