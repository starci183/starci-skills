group: release
verb: app-installs
owner: runtime
summary: verify a scaffolded app against fresh registry installs
impl: {script: scripts/gates/release-app-installs.mjs}
flags:
  - {name: keep, type: boolean, summary: keep and print the temporary application path}
exit:
  "0": scaffold install and application proof passed
  "1": scaffold, install or application proof failed
  "2": bad usage
json: none
examples:
  - starci release app-installs
  - starci release app-installs --keep
editions: [full]
since: 1.0.0-alpha.4
removed:
  - node scripts/gates/release-app-installs.mjs
  - node .claude/scripts/gates/release-app-installs.mjs
