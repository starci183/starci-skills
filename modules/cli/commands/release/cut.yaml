group: release
verb: cut
owner: runtime
summary: cut the release, the only way the runtime's remote main and a release tag move
impl:
  script: scripts/supervisor/release-cut-cli.mjs
flags:
  - {name: repo, type: string, summary: "the repository to release (default: the runtime this command runs from, not the directory it is started in)"}
  - {name: remote, type: string, summary: the remote to push to (default origin)}
  - {name: branch, type: string, summary: the release branch (default main)}
  - {name: plan, type: boolean, summary: "report what the cut would run and require, and stop; it runs nothing"}
  - {name: tag, type: string, summary: the release tag v* to push (default is the one new annotated v* tag on HEAD)}
  - {name: rows, type: string, summary: "re-run only these rows (comma separated, names as --plan lists them) on the SAME commit and complete the record when every other row is already green on it; a row that is not green there refuses the cut"}
  - {name: no-reuse, type: boolean, summary: run every row; stand in for none from an earlier commit or an earlier cut of this one}
exit:
  "0": the candidate CI of the release sha was green, then main plus its tag were pushed atomically, or --plan found nothing missing
  "1": refused (RELEASE_CANDIDATE_CI_RED, RELEASE_CANDIDATE_CI_TIMEOUT, RELEASE_CI_UNKNOWN, dirty tree, no or wrong tag, release notes incomplete, version not moved past the remote main, suite red, main moved, secret scan) and nothing was pushed
  "2": bad usage
json: flag
conventions:
  - "OWNER RULING candidate-ci (2026-10-18): never again have main receive a release whose CI is red, with the owner confirming afterwards."
  - "Before the suite, including --plan, the workflows the candidate CI waits for (release-cut.yaml candidate.workflows) must be readable,"
  - "else RELEASE_CI_UNKNOWN. The latest run on main is no longer read: a red main needs no owner override before the next release."
  - "After the suite and the secret scan the exact HEAD is pushed to refs/heads/release/candidate-<version>;"
  - "a re-cut of the same version force-moves only that ref, never main."
  - "The cut waits for every required workflow run of that sha (pollSeconds, graceMinutes, waitMinutes in release-cut.yaml)."
  - "Red refuses RELEASE_CANDIDATE_CI_RED with the run URLs and the failing jobs and steps; nothing reaches main."
  - "No run within the grace, or no end within the wait, refuses RELEASE_CANDIDATE_CI_TIMEOUT."
  - "A red candidate keeps its ref for diagnosis; after a cut the candidate ref is left on the remote, naming the released sha."
  - "Only on green is the annotated tag created and main plus the tag pushed atomically; the release record logs the candidate verdict."
  - "Emergency path, owner-only: starci release ci-override --sha <HEAD> --reason <text> lets a red candidate through."
  - "The release record logs its use."
examples:
  - starci release cut
  - starci release cut --plan --tag v1.0.0-alpha.9
  - starci release cut --tag v1.0.0-alpha.9 --rows "npm run test:e2e,linux-parity"
  - starci release cut --repo <path> --tag v1.0.0-alpha.9 --json
editions:
  - full
