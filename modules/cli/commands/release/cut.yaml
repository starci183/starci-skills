group: release
verb: cut
owner: runtime
summary: cut the release, the only way the runtime's remote main and a release tag move
impl:
  script: scripts/supervisor/release-cut-cli.mjs
flags:
  - {name: repo, type: string, summary: "the repository to release (default: the runtime this command runs from, not the directory it is started in)"}
  - {name: remote, type: string, summary: the remote to push to (default origin)}
  - {name: branch, type: string, summary: the release branch (default main)}
  - {name: plan, type: boolean, summary: "report what the cut would run and require, and stop; it runs nothing"}
  - {name: tag, type: string, summary: the release tag v* to push (default is the one new annotated v* tag on HEAD)}
  - {name: rows, type: string, summary: "re-run only these rows (comma separated, names as --plan lists them) on the SAME commit and complete the record when every other row is already green on it; a row that is not green there refuses the cut"}
  - {name: no-reuse, type: boolean, summary: run every row; stand in for none from an earlier commit or an earlier cut of this one}
exit:
  "0": the release was cut and main plus its tag were pushed atomically, or --plan found nothing missing
  "1": refused (RELEASE_CI_RED, RELEASE_CI_UNKNOWN, dirty tree, no or wrong tag, release notes incomplete, version not moved past the remote main, suite red, main moved, secret scan) and nothing was pushed
  "2": bad usage
json: flag
conventions:
  - "OWNER RULING 2026-10-17 (chat to main, relayed): alpha.20 \"cut refuses when the latest CI on main is red, with a documented owner override verb\";"
  - "the override is owner-only, records who and why in the owner rulings, and agents cannot run it."
  - "Before the suite, including --plan, read the newest completed CI workflow run on main."
  - "Only success continues; every other conclusion refuses RELEASE_CI_RED and names the run URL and headSha."
  - "Unreadable GitHub or no completed run refuses RELEASE_CI_UNKNOWN: a cut must not proceed blind, including under suite ci."
  - "The owner may run starci release ci-override --sha <headSha> --reason <text>."
  - "A red run requires both starci-release/<headSha>.ci-override.json in the git common dir and ci-override-<sha12>"
  - "in modules/kernel/owner-rulings.yaml of the tree being cut. Commit the ruling before cutting."
examples:
  - starci release cut
  - starci release cut --plan --tag v1.0.0-alpha.9
  - starci release cut --tag v1.0.0-alpha.9 --rows "npm run test:e2e,linux-parity"
  - starci release cut --repo <path> --tag v1.0.0-alpha.9 --json
editions:
  - full
