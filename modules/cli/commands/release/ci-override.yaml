group: release
verb: ci-override
owner: runtime
summary: the owner accepts red CI for one SHA and records who and why
impl:
  script: scripts/supervisor/release-ci-override-cli.mjs
flags:
  - {name: sha, type: string, summary: "required full 40 lowercase hex SHA of the red CI run"}
  - {name: reason, type: string, summary: "required nonempty owner reason, recorded verbatim after trimming"}
  - {name: repo, type: string, summary: "repository receiving the override (default current directory)"}
exit:
  "0": the override record and runtime owner ruling were written
  "2": "RIGHTS_OWNER_ONLY (a bound role or non-TTY stdin), bad usage, confirmation mismatch, or write failure"
json: none
conventions:
  - 'OWNER RULING 2026-10-17 (chat to main, relayed): alpha.20 "cut refuses when the latest CI on main is red, with a documented owner override verb"; the override is owner-only, records who and why in the owner rulings, and agents cannot run it.'
  - "Every bound role is refused by the command guard and by this script. The owner must use a terminal and type the first 12 SHA characters exactly."
  - "Writes <git-common-dir>/starci-release/<sha>.ci-override.json, schema starci/ci-override@1, with sha, reason, by (git user.name and OS user), at, and runUrl (empty if GitHub is unavailable)."
  - "For the runtime, appends ci-override-<sha12> under rulings before the top-level supersedes key in modules/kernel/owner-rulings.yaml. Commit that entry into the tree being cut. App repositories receive only the record."
  - "An override applies only to its exact SHA. It does not permit a cut when CI is unknown. Existing ruling IDs with another reason refuse."
examples:
  - 'starci release ci-override --sha 0123456789abcdef0123456789abcdef01234567 --reason "Owner accepts this CI failure for the release"'
  - 'starci release ci-override --repo D:/apps/example --sha 0123456789abcdef0123456789abcdef01234567 --reason "Owner accepts the failed run"'
editions:
  - full
