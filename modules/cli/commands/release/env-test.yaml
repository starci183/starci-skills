group: release
verb: env-test
summary: run the runtime spec suite under the release cut's own conditions
owner: runtime
impl: {script: scripts/supervisor/release-env-test.mjs}
conventions:
  - the suite is the cut's own spec leg, so a red the cut would find shows here first; it takes minutes to an hour and writes each step to a log
  - without --lane it refuses (exit 2) unless the host has an Orca terminal, a reachable Orca and a Docker daemon, the same prerequisites the cut refuses on
flags:
  - {name: lane, type: boolean, summary: "a lane clone is no Orca terminal: leave out STARCI_REQUIRE_ORCA_LIVE and the host check, keep everything else of the cut"}
  - {name: reuse-installs, type: boolean, summary: keep an example app whose node_modules exists instead of a fresh npm ci}
exit:
  "0": the suite is green and no skip fails the evidence rule
  "1": a step is red or a skipped test ran in no leg
  "2": the host lacks a prerequisite of the cut, or bad usage
json: none
examples:
  - starci release env-test
  - starci release env-test --lane --reuse-installs
editions: [full]
