# ============================================================================
# modules/goal/anatomy.yaml
#
# What a goal IS — the record, the revision counter, the amendments, and the
# lifecycle (derive -> critique -> approve/freeze -> derive ops -> revise ->
# invalidate). The business answer, in one line: a goal is the machine-checkable
# contract between the owner's intent and the op chain. The owner says what the
# product must be when this is over; the chain is every operation the kernel
# will dispatch to get there; the goal is what makes "there" checkable.
#
# Sources (all under .claude/, relative to the skill root):
#   modules/kernel/driver-loop.yaml — the kernel agent's loop contract; the goal
#                                  lifecycle duties below (goalPhase, approve,
#                                  reviseGoal, validateGoalRevision,
#                                  diffGoalSections, propagateInvalidation,
#                                  adoptReportRev, noteGoalMetrics,
#                                  GOAL_SPIN_LIMIT, applyWorkflowAmendment,
#                                  designGate, cutOpFor, goalRevOf) are
#                                  kernel-agent reasoning over these contracts
#   modules/kernel/api.yaml         — the api.mjs command surface the kernel
#                                  reasons through
#   modules/goal/define-goal.yaml — the goal contract (starci/goal@1 record shape)
#   modules/schemas/goal-plan.yaml — the api plan --file shape {legs:[{op,paths?,notes?}]}
#   engine/ledger-db.mjs           — the .starciwork/runtime.sqlite goal/job rows
#   docs/workflow-kernel.md        — goal phase narrative
#   skills/define-goal/SKILL.md    — the owner-only approval gate (exact `ok`)
#   modules/models/kinds.yaml      — lanes (nodeKind -> ordered steps), routes, kinds
#   modules/ops/registry.yaml      — generated stage/coarsePhase index (read-only)
#
# Convention: claims marked (inferred) are analysis, not literal source text.
# Everything else cites the file that states it.
# ============================================================================

schema: starci/module-goal-anatomy@1

about:
  kind: goal-anatomy
  businessQuestion: >-
    "What exactly did the owner ask this workflow to make true, how will we know
    it is true, and what is every dispatched operation allowed to touch while
    getting there?"
  businessAnswer: >-
    A goal is the machine-checkable contract between the owner's intent and the
    op chain. It is not a paragraph for humans (goal.md is only the human
    rendering); it is the frozen record every operation, question, decision and
    report is bound to by rev, and against which the kernel evaluates done.
  sources:
    - modules/goal/define-goal.yaml
    - the kernel agent

# ----------------------------------------------------------------------------
# STATE MODEL — the frame the whole module reads the world through.
# An op is a state transition: needs: (preconditions on state variables) ->
# produces: (postconditions). The state space is the variables .starciwork
# records carry. Decomposition is classical planning over that space — see
# decomposition: below and existing.yaml for the SURVEY leg.
# ----------------------------------------------------------------------------
stateModel:
  opIs: >-
    A state transition: `needs:` (preconditions on state variables) ->
    `produces:` (postconditions it establishes). The op's route block
    `prerequisites:` are the needs; the produces vocabulary is specified in
    legality.yaml `producesVocabulary` — the machine-readable table
    scripts/route/route-plan.mjs consumes (route: blocks carry prerequisites
    only; each op's produces lives as business: prose on its contract).
  stateSpace: >-
    The state variables carried by .starciwork records — e.g.
    `business.X: decided`, `sds.X: decided`, `ui.X: verified`,
    `impl.X: done`, `evidence.X: valid`, `brand: settled`. A variable's value
    is the record's `state` plus the validity of the evidence pinned to it
    (stale evidence = variable back to unsettled for chain purposes).
  goalAsState: >-
    A goal IS a target-state expression S* over those variables:
    "thêm tính năng A" -> {feature.A: exists ∧ proven}. The done: metrics are
    the machine-checkable form of S* — evaluateGoalMetrics literally evaluates
    the ledger/operation/gate variables against it (the kernel agent).
  currentState: >-
    S₀ is what SURVEY measures — which .starciwork records already own the
    touched paths and what state they are in (see existing.yaml). Decomposition
    is never on raw input; it is input x current-state.
  delta: >-
    Δ = S* − S₀: the state variables missing, wrong, or stale. The op chain is
    exactly the transitions that produce Δ and nothing else — which is why an
    already-done surface shortens the chain automatically (existing.yaml
    extend-vs-add).
  sources:
    - the kernel agent (evaluateGoalMetrics, deriveGoalMetrics)
    - engine/ledger-db.mjs (record states) + the api's path:* lease admission (scripts/kernel/api.mjs)
    - scripts/checks/check-work-deep.mjs (normDigest/DEP_STALE — staleness of a done variable)
    - modules/goal/existing.yaml

# ----------------------------------------------------------------------------
# DECOMPOSITION — the 5-step planning method. request.analyze runs it; the
# kernel validates its output. NOT archetype matching — archetypes are only
# memoized Δ->chain patterns (archetypes.yaml), a cache over this method.
# ----------------------------------------------------------------------------
decomposition:
  steps:
    - id: PARSE
      does: "input -> S*: form the target-state expression"
      example: "'thêm tính năng A' -> {feature.A: exists ∧ proven}; 'lint check repo' -> {repo.checks: reported}"
      failsWhen: "INTENT ambiguous — S* cannot be formed -> provision.ask, never guess (legality.yaml ambiguity.intent)"

    - id: SURVEY
      does: >-
        measure S₀: query .starciwork owners for the records owning the touched
        paths (the .starciwork ownership tree — docs/ledger-db.md; record
        state via engine/ledger-db.mjs; work.author's intake mode reconciles
        authored records against decided ones as three typed cases —
        reference/conflict/new — modules/models/kinds.yaml) and scan the
        source surfaces they name
      produces: "the existing-surface map — what exists, what state, extendable or not"
      detail: "the full survey leg is existing.yaml — every feature/refactor input passes it BEFORE a chain is proposed"

    - id: GAP
      does: "Δ = S* − S₀: which state variables are missing, wrong, or stale"
      consequence: >-
        extend-vs-add falls out HERE: SURVEY found `api.X: done` -> Δ contains
        only the new part -> chain shortens and records `extends: X` -> the
        extended surface's `verified` variable goes stale -> a
        regression/re-verification leg on X is generated automatically
        (DEP_STALE semantics, scripts/checks/check-work-deep.mjs)

    - id: CHAIN
      does: >-
        backward-chain from S*: each missing variable -> which op produces it
        -> topological sort by needs -> the op chain
      requires: >-
        a produces: vocabulary per op (legality.yaml producesVocabulary —
        the machine-readable table route-plan.mjs consumes; each op also
        declares its produces as business: prose on its contract)
      fallback: "when no archetype caches this Δ->chain pattern, this step IS the algorithm — never force-fit an archetype"

    - id: VALIDATE
      does: "legality: prerequisites satisfied? scopes disjoint? which ambiguity tier fires? (legality.yaml — all five families)"
  replanning: >-
    "cấn cấn" (mid-flight wrongness) is RE-PLANNING, not an exception:
    discovering the SRS is wrong = discovering S₀ was measured wrong (the
    `sds: decided` variable is actually invalid) -> re-run from step 2 with
    corrected S₀ -> new chain. There is no separate rollback logic;
    propagateInvalidation is the kernel's mark of which variables went stale
    (the kernel agent; legality.yaml backwardEdges).
  sources:
    - the kernel agent
    - engine/ledger-db.mjs
    - modules/models/kinds.yaml work.author intake cases (reference/conflict/new)
    - scripts/checks/check-work-deep.mjs (DEP_STALE)
    - modules/goal/legality.yaml, modules/goal/existing.yaml, modules/goal/archetypes.yaml

# ----------------------------------------------------------------------------
# IDENTITY — what names this goal and what may never change under it.
# ----------------------------------------------------------------------------
identity:
  record: starci/goal@1
  files:
    goalRow: .starciwork/runtime.sqlite goals/inbox rows  # the durable record (engine/ledger-db.mjs)
    goalMd:  rendered for humans only — never a store     # runtime.sqlite is the store
  # starci/goal@1 has no schema file: the goal is a sqlite row and this list is
  # the contract the kernel agent authors against. This yaml owns it.
  requiredFields:
    - schema          # const starci/goal@1
    - id
    - workflow
    - requestId
    - originalRequest
    - finalOutcome
    - scope           # {business, paths, resources, exclusions}
    - criteria
    - businessChanges
    - impacts
    - resourceEffects
    - opChain         # the ordered op legs scripts/route/route-plan.mjs derives
    - workTargets
  rev: >-
    Integer revision counter. `goalRevOf(state)` = state.goalRev ?? goal.rev ??
    goal.json rev ?? 1 (the kernel agent). Set at approval; every derivation
    binds it. A revision is rev+1 exactly — never a skip, never a rewrite
    (reviseGoal, the kernel agent).
  digest: >-
    `state.goalDigest` = stateGoalIdentity(state), frozen before the first
    revision (the kernel agent). The amendment's `baseGoalIdentity` must
    match it — an amendment cannot redirect a workflow to a different goal.
  immutability: >-
    Goal/workflow identity cannot change during revision:
    validateGoalRevision rejects a revision that changes the workflow identity
    (the kernel agent). A wrong identity is therefore never an edit — see
    legality.yaml ambiguity.intent (it is an owner question, always).
  source: the kernel agent, the kernel agent, modules/goal/define-goal.yaml

# ----------------------------------------------------------------------------
# DERIVATION — where a goal comes from. Two ledger modes, one phase.
# ----------------------------------------------------------------------------
derivation:
  phase: >-
    `goalPhase(state)` runs BEFORE the human approval gate (the kernel agent).
    It either derives the goal from the Work ledger or has the model assess one,
    then writes goal.json + goal.md, critique, prerequisites, questions, risks,
    planned operations and the definition-of-done data, and lands the workflow
    in `awaiting-approval`.
  ledgerModes:
    work: >-
      `state.ledgerMode === 'work'`: the .starciwork tree is the TODO list.
      `goalFromLedger` derives the goal from authored nodes — the scope,
      criteria and work targets come from the tree itself; operations are
      later derived per node from its lane (modules/models/kinds.yaml lanes:).
    plan: >-
      `state.ledgerMode === 'plan'`: `assessGoal` fills the plan form
      (modules/schemas/goal-plan.yaml — the api --file shape is {legs:[...]}).
      Only plan kinds may appear — PLAN_OP_KINDS = the kinds whose writes
      stay inside {code, runtime, evidence, asset} or nothing
      (modules/models/kinds.yaml). Record-writing kinds (business.decide,
      architecture.decide, work.author, scope.define, goal.revise, ...)
      never appear on a plan ledger — a plan has no Work tree to write.
  intakeNote: >-
    `request.analyze` is `external: true` in modules/models/kinds.yaml — the chat app
    runs it and hands the kernel a finished scope statement; no lane, route or
    scheduler may dispatch it inside the workflow.
  sources:
    - the kernel agent (goalPhase, goalFromLedger)
    - modules/models/kinds.yaml (PLAN_OP_KINDS, plan form)
    - modules/schemas/goal-plan.yaml
    - modules/models/kinds.yaml (request.analyze external)

# ----------------------------------------------------------------------------
# DEFINITION OF DONE — the checkable half of the contract.
# ----------------------------------------------------------------------------
definitionOfDone:
  shape: >-
    `done:` block of checkable metrics: {id, kind: ledger|operation|gate, ref,
    expect[]}. deriveGoalMetrics supplies the defaults — every ledger item
    verified/preexisting/out-of-repository, every gate passed, every
    kernel-derived op settled (the kernel agent).
  evaluation: >-
    evaluateGoalMetrics -> {rev, ok, metrics, gaps, unevaluable}. Approval
    refuses when the metrics cannot be evaluated; validateGoalRevision requires
    the revised goal keep a nonempty, checkable done block whose metrics resolve
    against the revised goal (the kernel agent).
  spinGuard: >-
    GOAL_SPIN_LIMIT = 5: settled dispatches that change no done metric raise a
    goal-stall needUser — motion without progress on the contract is a stop,
    not more dispatching (noteGoalMetrics, the kernel agent).
  source: the kernel agent

# ----------------------------------------------------------------------------
# CRITIQUE — the model's challenge before anything is frozen.
# ----------------------------------------------------------------------------
critique:
  verdicts: [sound, revise, refuse, unavailable]
  surfaces:
    - objections       # including hidden-decision objections
    - required         # what the goal must gain before it is sound
    - alternatives
    - question         # a question for the owner, when the critique needs one
    - prerequisites    # missing features -> planned intake ops
    - overlaps         # {reference | conflict} against existing records
    - provisions       # owner-only inputs the goal will need
  mechanics: >-
    planCritiquePrerequisites plans intake ops for missing features;
    planCritiqueDecisions plans decision asks for decisive hidden-decisions.
    critique === 'not-attempted' blocks approval (goalApprovalBlocks,
    the kernel agent).
  source: the kernel agent (critiqueGoalPhase, planCritique*)

# ----------------------------------------------------------------------------
# APPROVAL — the freeze. Owner-only.
# ----------------------------------------------------------------------------
approval:
  gate: >-
    `approve` is the owner-only gate (skills/define-goal/SKILL.md). It freezes
    the goal at `state.goalRev`, evaluates the done metrics, and refuses when
    they are unevaluable.
  blocks:  # goalApprovalBlocks (the kernel agent)
    - no definitionOfDone
    - grounds assessment === 'none'
    - critique === 'not-attempted'
  effect: >-
    From this rev forward, every operation, question, decision and report is
    written against goalRev. The frozen record is the base all later diffs
    apply to — a goal that was never approved cannot be revised, only replaced
    upstream.
  sources:
    - the kernel agent (approve, goalApprovalBlocks)
    - skills/define-goal/SKILL.md

# ----------------------------------------------------------------------------
# REVISION — goal.revise: the typed way a frozen goal changes.
# ----------------------------------------------------------------------------
revision:
  rpc: goal_amend / reviseGoal        # the kernel agent exports
  op: goal.revise                     # modules/ops/ops/goal.revise.yaml
  entry: scripts/goal/define-goal.mjs --revise <workflow_id>
  prerequisites: "an approved goal exists"   # route block
  rules:
    bump: rev increments by exactly one; the diff is explicit
    identity: workflow identity may not change (validateGoalRevision)
    ids: stable ledger/operation/decision ids are preserved; dropped ids rejected
    done: revised goal keeps a nonempty checkable done block whose metrics resolve
    authority: >-
      A revision that widens scope, authority, allocation or done-metrics is
      AUTHORITY_WIDENING — a declared blocker routed to an owner decision, never
      applied silently (goal.revise op contract + reviseGoal).
  mechanics:
    diff: diffGoalSections names which sections/records/operations/metrics moved
    invalidation: >-
      propagateInvalidation marks every derivation that depended on a changed
      section stale — op.goalStale {rev, changed}, ledger item.goalStale,
      decision.goalStale. Stale evidence remains history; it no longer
      certifies the changed input (docs/verify-proof.md).
    inFlight: >-
      opInputDigests (spec digest + goal digest + record digests) re-validate
      in-flight ops at settle: adoptReportRev adopts a report into the new rev
      when digests are identical; changed digests make it stale — it does not
      count. reopenStaleOp re-queues the op or skips it when the metric is
      already met.
    history: >-
      state.goalRevisions[] appends {schema: starci/goal-revision@1, rev, at,
      source, changed}; historical reports stay bound to the rev that produced
      them — evidence is never relabelled.
    approvalPreview: >-
      --revise ... --plan is read-only and emits
      starci/goal-revision-preview@1: base/next revision, stable goal identity,
      explicit op-chain diff, content-bound approval token and argv. Only the
      exact preview approved by the owner may append revision+1; a stale or
      mismatched token refuses before writes.
    liveKernel: >-
      Revision appends one pending goal-revision inbox row to the same workflow.
      It never adds another kind=goal row or starts another Kernel. A live
      Kernel remains parked on plan-divergence before approval and may resurvey
      only after the approved goal, approval receipt, inbox row and
      goal-revised event commit atomically.
    scopeIsolation: >-
      Multiple workflows may share the one project ledger. Co-residence is
      custody, not a conflict; conflict requires concrete owned-path/effect
      overlap or a live custody constraint. Product landing scope and
      workspace canonicalization therefore keep distinct goal identities and
      op chains even when both are registered in the same runtime.sqlite.
  businessRule: >-
    A mid-flight discovery that the goal itself is wrong is NOT fixed in place.
    It becomes a revision (or an owner question), the affected derivations are
    marked stale, and the work re-runs from the affected boundary producing
    fresh evidence (CLAUDE.md work-correction policy).
  sources:
    - the kernel agent (reviseGoal, validateGoalRevision, diffGoalSections,
      propagateInvalidation, adoptReportRev, reopenStaleOp)
    - modules/ops/ops/goal.revise.yaml
    - CLAUDE.md (work-correction policy)
    - docs/verify-proof.md

# ----------------------------------------------------------------------------
# AMENDMENT — owner-authored change bound to the frozen identity.
# ----------------------------------------------------------------------------
amendment:
  record: starci/workflow-amendment@1   # applyWorkflowAmendment, the kernel agent
  binding: >-
    `baseGoalIdentity` must equal stateGoalIdentity(state) — the amendment
    applies to THIS goal's frozen digest or it is not this workflow's amendment.
  authority:
    actor: owner
    provenance: >-
      {threadId, messageId, messageIdAvailability, quote, assurance:
      conversation-context-not-authenticated, at} — an amendment carries where
      the owner said it; the kernel does not pretend the channel authenticated
      them.
  changes:  # the typed change set
    - clarifications
    - addScope + scopeBindings
    - addDefinitionOfDone / supersedeDefinitionOfDone
    - operationFindings / operationEffects
    - addOperations / operationDependencies / supersedeOperationChecks
    - effectCeiling {paths, resources, external}
  containment: >-
    effectPathCovered is directional: the granted ceiling must cover the
    requested effect — coverage never runs the other way, so a request can
    never outgrow its grant.
  idempotence: >-
    Keyed by digest; a replayed amendment is recognised, not re-applied. The
    original approval record is never rewritten.
  source: the kernel agent (applyWorkflowAmendment, effectPathCovered)

# ----------------------------------------------------------------------------
# QUESTIONS — how the goal talks to the owner mid-flight.
# ----------------------------------------------------------------------------
questions:
  askKinds: [decision.prepare, provision.ask]      # ASK_KINDS, the kernel agent
  rule: >-
    The runtime prepares a decision; the owner takes it. The kernel never
    answers for the owner — and it never invents an answer it was not offered
    (question-needs-the-user route, modules/models/kinds.yaml).
  stopKinds: [credential, account, dataset, authority, irreversible]  # STOP_KINDS
  stopBehaviour: >-
    A question whose stop reason is a provision or an irreversible effect opens
    a `provision.ask` and PAUSES the requester — there is nothing honest to do
    until the owner acts (openOwnerAsk, the kernel agent).
  provisionalBehaviour: >-
    Every other question opens `decision.prepare`; the requester waits only on
    the ask op (dependsOn) and resumes on the runtime's own recommendation as a
    PROVISIONAL answer. The owner overturns it later; a different answer
    reopens what was built on it (the kernel agent header + openOwnerAsk).
  enrolledMode: >-
    When the workflow is enrolled — its engine record carries ENGINE_SCHEMA
    (engine/constants.mjs isEnrolled) — every non-mechanical
    question is ownerRequired — the provisional path closes (openOwnerAsk).
  conflictDecision: >-
    openConflictDecision takes an intake-recorded conflict as a decision
    record with numbered options and one recommendation — provisionally, the
    same way; the workflow never finishes blocked over a conflict the runtime
    can take a side on (the kernel agent).
  projections: >-
    The kernel agent projects the canonical ask ops into owner-facing request
    kinds: information, credential, account, access, consent, authority,
    business-decision, irreversible-confirmation. Credential verification binds
    to the exact integration verification, credential versions and kernel
    receipts — a credential is "verified" only after the integration.verify it
    feeds reports done+pass (verifyAcceptedIntegrationOwnerRequests).
  sources:
    - the kernel agent

# ----------------------------------------------------------------------------
# DERIVATION CHAIN — how the goal becomes ops (the resolver's side).
# ----------------------------------------------------------------------------
opChain:
  workLedger: >-
    Per node: lane lookup in modules/models/kinds.yaml `lanes:` by {kind, role}; the
    lane's ordered `steps` are the node's op chain; `optionalWhen` predicates
    (node.hasNoArtworkSlots, goal.requiresSecurity, goal.requiresPerf) read the
    done metrics to skip steps. designGate holds a frontend build until the
    feature's `ui` node is done (the kernel agent). A node too big for one
    op is cut by implementation.plan into disjoint-scope children — seam first,
    then one observable behaviour each (cutOpFor — the kernel agent).
  planLedger: >-
    The model proposes the ops array directly (goal-plan.json): unique ids,
    same-plan dependsOn, acyclic, every ledger item referenced unless already
    done, independent ops disjoint-allowlisted, each op small enough for one
    session, and only PLAN_OP_KINDS. Process mechanics (ping/report/retry) are
    runtime behaviour — never planned as business operations.
  routingNotChosen: >-
    Models fill operation content; they do not choose the next step, the repair
    kind, or the retry count. Outcomes route through modules/models/kinds.yaml `routes:`
    and modules/goal/legality.yaml — closed, data-driven, first match wins.
  sources:
    - modules/models/kinds.yaml (lanes, routes, kinds)
    - the kernel agent (designGate, cutOpFor)
    - modules/goal/legality.yaml
    - modules/schemas/goal-plan.yaml
    - modules/kernel/dispatch.yaml

# ----------------------------------------------------------------------------
# WHAT A GOAL IS NOT — boundaries that keep the contract honest.
# ----------------------------------------------------------------------------
not:
  - not-a-chat-message: goal.md renders for humans; goal.json is the contract
  - not-a-workflow-enum: the goal does not pick archetypes; lanes+routes resolve the chain
  - not-mutable-in-place: change is revision (typed) or amendment (owner), never an edit
  - not-the-repairer: verification reports findings; the graph routes the repair
  - not-the-answerer: questions go to the owner (stop) or a decision.prepare recommendation (provisional) — the goal never fills its own blanks
  - not-a-debt-ledger: a wrong flow returns to its owning workflow and re-runs from the boundary (CLAUDE.md)
