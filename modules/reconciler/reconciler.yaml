schema: starci/reconciler@1
purpose: |-
  The contract of the host's ONE reconciler engine (scripts/reconciler/engine.mjs). Level-triggered controllers read the
  ledgers and converge them through the existing api verbs; the engine owns every duty it covers.
  Design: <tmp>/reconciler-design/DESIGN.md (approved 2026-09-28) §5, §7 (engine), §8 (controllers),
  §8.8 (SLA/Invariant), §10.3 (Decision Item), §11 (decider contract), §12 (liveness). Lanes: LANES.md "Shared contract".
design: <tmp>/reconciler-design/DESIGN.md

engine:
  process: one per host (DESIGN §7.1); boot.mjs is the only way in (`ensure | --restart | --status | --install-task`)
  files:
    engine: scripts/reconciler/engine.mjs      # leader, heartbeat, self-reload, discovery, dispatch, --once
    boot: scripts/reconciler/boot.mjs          # ensure (crash-loop guard -> --safe + one urgent Telegram), status, task
    sources: scripts/reconciler/sources.mjs    # events cursor per ledger, routing
    state: scripts/reconciler/state.mjs        # settings (the state itself is machine.sqlite, engine/db/machine.mjs)
    owns: scripts/reconciler/owns.mjs          # CONCERN_OWNER: concern -> controller (ctx.owns, boot --status)
    workqueue: scripts/reconciler/workqueue.mjs
    ctx: scripts/reconciler/ctx.mjs            # the ctx every controller acts through
    testing: scripts/reconciler/testing.mjs    # fakeCtx(overrides), tempState() for specs
    modes: scripts/reconciler/engine-modes.mjs # config.yaml -> effective modes; an unreadable config keeps the running modes (ENGINE_CONFIG_UNREADABLE)
    reload: scripts/reconciler/reload-env.mjs  # the replacement's environment when the running code cannot read config.yaml; reload-bounds.mjs holds the watched paths and the bound
    drift: scripts/reconciler/drift.mjs        # controller mode vs config.yaml and engine revision vs live HEAD, seen by boot --status and the start rows
  state: machine.sqlite through engine/db/machine.mjs (DBTREE.sql B2); tables engine_leader + leader_history, process_runs, engine_cursors, engine_queue, engine_actions, schedules, sla_episodes, services + service_events, controller_modes + mode_changes
  heartbeat: engine_leader.heartbeat_at and process_runs.last_heartbeat_at, every allocation.reconciler.renewMs
  log: machine_logs actor reconciler (no text log)
  numbers: modules/models/runtimes.yaml allocation.reconciler   # pollMs, leaseMs, renewMs, heartbeatStaleMs, statusCacheMs, backoff, crashLoop
  modes: config.yaml reconciler.controllers.<name>.mode          # off | shadow | active; config.example.yaml documents it
  task: StarCi-Reconciler (at logon + every 5 min, conhost --headless, IgnoreNew, below-normal); created only by `boot.mjs --install-task --apply`, run by the owner or the coordinator

leader:
  lock: claimManager('reconciler') (scripts/connectors/lib.mjs), handed over on self-reload (scripts/machine/self-reload.mjs)
  row: machine.sqlite engine_leader, epoch + 1 on every takeover (a leader_history row with how it was acquired and why it was released); renewed every renewMs, lost at leaseMs
  standby: a second engine waits read-only and takes over once the row expires
  fence: every mutation (ctx.api, ctx.run, ctx.openDecision in active) runs only while the engine's epoch is the leader's; a leader that loses the row stops and exits (DESIGN §7.5, §12.3)
  env: children get STARCI_ACTOR=reconciler/<controller> and STARCI_RECONCILER_EPOCH

controllers:
  discovery: every scripts/reconciler/controllers/<name>.mjs; a load failure is a reconciler.event row and that controller is skipped
  module: |-
    export default {
      name: '<file name>', concerns: [...],          // the concerns below
      resyncMs, concurrency, timeoutMs,              // defaults 60000, 1, 300000; modules/reconciler/<name>.yaml overrides
      routes: { '<event kind>' | '<prefix>*': (ev) => key | [keys] | null },   // ev {ledgerId, repo, seq, workflowId, entityType, entityId, kind}
      async list(ctx) { return [keys]; },            // the periodic resync
      async reconcile(key, ctx) { ... },             // idempotent: read, then act through ctx
    };
  names: [job, host, gc, resource, workflow, workers, learning]
  lanes: {job: rc-job, host: rc-host, gc: rc-gc-resource, resource: rc-gc-resource, workflow: rc-sla-workflow, workers: rc-workers, learning: rc-workers}
  slaLayer: scripts/reconciler/sla.mjs slaPass(ctx), every 30 s when the module exists (lane rc-sla-workflow); its ctx mode follows the workflow controller

# concern -> controller: the same map as scripts/reconciler/owns.mjs CONCERN_OWNER (tests/reconciler/reconciler-owns.spec.mjs checks it).
concerns:
  job.settle: job
  job.worker: job
  job.dispatch: job
  job.consume-check: job
  job.close-verify: job
  host.kernel-seat: host
  host.supervisor-seat: host
  host.services: host
  host.orca: host
  host.processes: host
  host.ledger-health: host
  resource.throttle: resource
  resource.quota: resource
  gc.sweep: gc
  gc.housekeeping: gc
  workflow.stall-wake: workflow
  workflow.progress: workflow
  workflow.ask-repark: workflow
  workers.owed: workers
  workers.push: workers
  workers.deps: workers
  notify.owner: workers
  learning.tick: learning
  sla.report: workflow

# No separate loop runs a concern the engine covers (kernel/watchdog loop, resume-all, supervisor tick/watchdog loop,
# stall-alert).

routing:
  source: every ledger's events (scripts/reconciler/sources.mjs), per allocation.reconciler.pollMs; the first run of a ledger starts at MAX(seq), no replay
  ledgers: config.yaml supervisor.repos (ledgerId = folder name) + the Supervisor (ledgerId supervisor, its events in machine.sqlite sup_events)
  examples:   # DESIGN §7.4
    op-reported: 'job:<ledgerId>:<jobId>'
    op-dispatched: ['job:<ledgerId>:<jobId>', 'resource:host']
    incident-raised: 'workflow:<ledgerId>:<wf>'
    kernel-proposal: 'workers:proposals'
    land-*: 'workers:land'
  owner: each controller declares its own routes; this file only summarises them

workqueue:
  dedupe: (controller, key), persisted in machine.sqlite engine_queue
  inFlight: one reconcile per key; an event during it runs the key once more after
  backoff: allocation.reconciler.backoff (1 s doubling to 5 min, maxAttempts 24, the one retry budget of scripts/lib/retry-budget.mjs; a spent key parks with due_at NULL until a new event for it re-arms the budget)
  concurrency: per controller (DESIGN §7.4, job 4, workflow 2, others 1), from the module or modules/reconciler/<name>.yaml
  resync: per controller resyncMs (DESIGN §7.4)

shadow:
  meaning: |-
    A shadow controller reads everything and records clocks, but ctx.api, ctx.run and ctx.openDecision run nothing:
    each writes one `reconciler.would` row to machine.sqlite machine_logs (scripts/reconciler/ctx.mjs; the same
    call at most once per 10 minutes) and answers {ok: true, shadow: true}. ctx.owns() is false: nobody does the
    duty, so a controller is only left in shadow for a first trial. --safe (crash loop) runs every active controller
    as shadow. Every controller lands in shadow; flipping one to active is a separate config change (order: job, host,
    gc, resource, workflow, workers, learning), each after >= 30 min of shadow with `boot.mjs --status` clean.
  rollback: git revert of the change (no separate loop exists to take a duty back); config.yaml reconciler.controllers.<name>.mode off stops the controller

writes:
  rule: |-
    The engine writes product ledgers ONLY through `api` verbs (ctx.api -> scripts/kernel/cli.mjs child); it opens them
    read-only (openLedgerReader). Its own state is machine.sqlite (engine/db/machine.mjs); its log rows go to machine_logs.
    Every real mutation is journaled in `engine_actions` (full result, stdout and stderr as blobs) (intent -> running -> done|failed); a stale intent/running
    row becomes `unknown` and is re-evaluated from the ledger, never replayed (DESIGN §7.6).
  decisionItems: ctx.openDecision -> scripts/machine/decisions.mjs openDecision (lane rc-decisions, `starci kernel decisions --open`), schema starci/decision-item@1 (DESIGN §10.3)
  violations: runtime-invariant-violated events (DESIGN §8.8), written by the SLA layer
