schema: starci/reconciler@1
purpose: |-
  The contract of the host's ONE reconciler engine (scripts/reconciler/engine.mjs). Level-triggered controllers read the
  ledgers and converge them through the existing api verbs; the old loops yield a duty only while the engine owns it.
  Design: D:/starci-tmp/reconciler-design/DESIGN.md (approved 2026-09-28) §5, §7 (engine), §8 (controllers),
  §8.8 (SLA/Invariant), §10.3 (Decision Item), §11 (decider contract), §12 (liveness). Lanes: LANES.md "Shared contract".
design: D:/starci-tmp/reconciler-design/DESIGN.md

engine:
  process: one per host (DESIGN §7.1); boot.mjs is the only way in (`ensure | --restart | --status | --install-task`)
  files:
    engine: scripts/reconciler/engine.mjs      # leader, heartbeat, self-reload, discovery, dispatch, --once
    boot: scripts/reconciler/boot.mjs          # ensure (crash-loop guard -> --safe + one urgent Telegram), status, task
    sources: scripts/reconciler/sources.mjs    # events cursor per ledger, routing
    state: scripts/reconciler/state.mjs        # reconciler.sqlite (DESIGN §7.3), settings
    owns: scripts/reconciler/owns.mjs          # reconcilerOwns(concern) for the old loops
    workqueue: scripts/reconciler/workqueue.mjs
    ctx: scripts/reconciler/ctx.mjs            # the ctx every controller acts through
    testing: scripts/reconciler/testing.mjs    # fakeCtx(overrides), tempState() for specs
  state: <supervisor home>/reconciler.sqlite (STARCI_RECONCILER_STATE overrides); tables cursors, leader, queue, actions, sla_clocks, services, modes (DESIGN §7.3)
  heartbeat: <supervisor home>/reconciler.heartbeat and leader.heartbeat_at, every allocation.reconciler.renewMs
  log: '%LOCALAPPDATA%/StarCi/runtime/reconciler.log'
  numbers: modules/models/runtimes.yaml allocation.reconciler   # pollMs, leaseMs, renewMs, heartbeatStaleMs, statusCacheMs, backoff, crashLoop
  modes: config.yaml reconciler.controllers.<name>.mode          # off | shadow | active; config.example.yaml documents it
  task: StarCi-Reconciler (at logon + every 5 min, conhost --headless, IgnoreNew, below-normal); created only by `boot.mjs --install-task --apply`, run by the owner or the coordinator

leader:
  lock: claimManager('reconciler') (scripts/connectors/lib.mjs), handed over on self-reload (scripts/lib/self-reload.mjs)
  row: reconciler.sqlite leader, epoch + 1 on every takeover; renewed every renewMs, lost at leaseMs
  standby: a second engine waits read-only and takes over once the row expires
  fence: every mutation (ctx.api, ctx.run, ctx.openDecision in active) runs only while the engine's epoch is the leader's; a leader that loses the row stops and exits (DESIGN §7.5, §12.3)
  env: children get STARCI_ACTOR=reconciler/<controller> and STARCI_RECONCILER_EPOCH

controllers:
  discovery: every scripts/reconciler/controllers/<name>.mjs; a load failure is a reconciler.event row and that controller is skipped
  module: |-
    export default {
      name: '<file name>', concerns: [...],          // the concerns below
      resyncMs, concurrency, timeoutMs,              // defaults 60000, 1, 300000; modules/reconciler/<name>.yaml overrides
      routes: { '<event kind>' | '<prefix>*': (ev) => key | [keys] | null },   // ev {ledgerId, repo, seq, workflowId, entityType, entityId, kind}
      async list(ctx) { return [keys]; },            // the periodic resync
      async reconcile(key, ctx) { ... },             // idempotent: read, then act through ctx
    };
  names: [job, host, gc, resource, workflow, fleet, learning]
  lanes: {job: rc-job, host: rc-host, gc: rc-gc-resource, resource: rc-gc-resource, workflow: rc-sla-workflow, fleet: rc-fleet-ui, learning: rc-fleet-ui}
  slaLayer: scripts/reconciler/sla.mjs slaPass(ctx), every 30 s when the module exists (lane rc-sla-workflow); its ctx mode follows the workflow controller

# concern -> controller: the same map as scripts/reconciler/owns.mjs CONCERN_OWNER (tests/reconciler-owns.spec.mjs checks it).
concerns:
  job.settle: job
  job.worker: job
  job.dispatch: job
  job.consume-check: job
  job.close-verify: job
  host.kernel-seat: host
  host.supervisor-seat: host
  host.services: host
  host.orca: host
  host.processes: host
  host.ledger-health: host
  resource.throttle: resource
  resource.quota: resource
  gc.sweep: gc
  gc.housekeeping: gc
  workflow.stall-wake: workflow
  workflow.progress: workflow
  workflow.ask-repark: workflow
  fleet.owed: fleet
  fleet.push: fleet
  fleet.deps: fleet
  notify.owner: fleet
  learning.tick: learning
  sla.report: workflow

# Where each old loop yields (owns.mjs reconcilerOwns; the loop records action 'reconciler-owned' and skips the duty).
yields:
  scripts/kernel/watchdog.mjs:
    recoverDeadWorkers: job.worker
    releaseHeldWorkers: job.worker
    settler (startSettler between ticks): job.settle
    probeQuotaCircuits: resource.quota
    hostResourcesTick: gc.housekeeping
    footprintTick: host.processes
    runWatchdogLoop: host.kernel-seat   # the LOOP exits 0 with action=reconciler-owned; --once stays whole (the Host controller runs it)
  scripts/kernel/resume-all.mjs:
    watchdogs (and the terminal dedupe before them): host.kernel-seat
    connectors and the telegram bridge: host.services
    ensureStallAlert: workflow.stall-wake
    ensureSupervisor: host.supervisor-seat
  scripts/supervisor/tick.mjs:
    host (stopTree of runaway chains and its alert): host.processes
    orca (the app restart and its alert): host.orca
    statusApp (the task restart and its alert): host.services
    progress: workflow.progress
    actions / sla (owed actions and their inbox SLA): fleet.owed
    learning: learning.tick
    census / ramThrottle / footprint: resource.throttle
    gc: gc.sweep
    sendAlerts Telegram (the inbox alerts stay): notify.owner
    pushMains (runTick): fleet.push
  scripts/supervisor/watchdog.mjs:
    runLoop: host.supervisor-seat       # the LOOP exits; --once stays whole (the Host controller runs it)
    sweepWorkers (watchdogPass): job.close-verify
  scripts/supervisor/stall-alert.mjs:
    kernel wakes: workflow.stall-wake
    owner Telegram digest and host-resource push: notify.owner

routing:
  source: every ledger's events (sources.mjs), per allocation.reconciler.pollMs; the first run of a ledger starts at MAX(seq), no replay
  ledgers: config.yaml supervisor.repos (ledgerId = folder name) + the Supervisor ledger (ledgerId supervisor)
  examples:   # DESIGN §7.4
    op-reported: 'job:<ledgerId>:<jobId>'
    op-dispatched: ['job:<ledgerId>:<jobId>', 'resource:host']
    incident-raised: 'workflow:<ledgerId>:<wf>'
    kernel-proposal: 'fleet:proposals'
    land-*: 'fleet:land'
  owner: each controller declares its own routes; this file only summarises them

workqueue:
  dedupe: (controller, key), persisted in reconciler.sqlite queue
  inFlight: one reconcile per key; an event during it runs the key once more after
  backoff: allocation.reconciler.backoff (1 s doubling to 5 min)
  concurrency: per controller (DESIGN §7.4, job 4, workflow 2, others 1), from the module or modules/reconciler/<name>.yaml
  resync: per controller resyncMs (DESIGN §7.4)

shadow:
  meaning: |-
    A shadow controller reads everything and records clocks, but ctx.api, ctx.run and ctx.openDecision run nothing:
    each writes one `reconciler.would` typed row on the Supervisor ledger (scripts/supervisor/sup-log.mjs; the same
    call at most once per 10 minutes) and answers {ok: true, shadow: true}. ctx.owns() is false, and so is
    reconcilerOwns() for its concerns: every old loop keeps the duty. --safe (crash loop) runs every active controller
    as shadow. Every controller lands in shadow; flipping one to active is a separate config change (order: job, host,
    gc, resource, workflow, fleet, learning), each after >= 30 min of shadow with `boot.mjs --status` clean.
  rollback: config.yaml reconciler.controllers.<name>.mode off (or shadow); the old loop takes the duty back within heartbeatStaleMs

writes:
  rule: |-
    The engine writes product ledgers ONLY through `api` verbs (ctx.api -> scripts/kernel/api.mjs child); it opens them
    read-only (openLedgerReader). Its own state is reconciler.sqlite; its log rows go to the Supervisor ledger through
    sup-log.mjs. Every real mutation is journaled in `actions` (intent -> running -> done|failed); a stale intent/running
    row becomes `unknown` and is re-evaluated from the ledger, never replayed (DESIGN §7.6).
  decisionItems: ctx.openDecision -> scripts/reconciler/decisions.mjs openDecision (lane rc-decisions, `api decisions --open`), schema starci/decision-item@1 (DESIGN §10.3)
  violations: runtime-invariant-violated events (DESIGN §8.8), written by the SLA layer
