# job.yaml — the Job controller (lane rc-job): scripts/reconciler/controllers/job.mjs.
#
# Design: <tmp>/reconciler-design/DESIGN.md §8.1 (Job controller), §9.1 (job state machine + SLA table),
# §8.8 (SLA/Invariant), §10.3 (Decision Item), §16.7 (product worktrees). Engine contract:
# <tmp>/reconciler-design/LANES.md "Shared contract".
#
# Mode: config.yaml reconciler.controllers.job.mode (off | shadow | active; lane rc-engine). In shadow every api call,
# settler run and DI is a would-row (ctx.api / ctx.run / ctx.openDecision); SLA clocks are recorded in every mode. In
# active mode the controller is the only owner of these concerns.
#
# Keys: job:<ledgerId>:<jobId> | wf:<ledgerId>:<workflowId> | workers:supervisor | overlap:<ledgerId>:<seq>.
# One job pass does the FIRST due step (DESIGN §8.1 order):
#   dead worker (starci kernel status frontier.deadWorkerJobs)  starci kernel reconcile --job J --dead-worker --settle-failed      job.worker
#   held worker (frontier.heldWorkerJobs)             starci kernel reconcile --job J --release-worker                   job.worker
#   reported, not settled nor handed over             node scripts/kernel/settle/job-settle.mjs --repo R --job J   job.settle
#                                                     (the runtime settler, wrapped: consume, re-verify or canon parity
#                                                     [contract change canon-parity-settle], starci kernel record-checks + starci kernel settle,
#                                                     release, product worktree reap)
#   handed over: deps-unit-required                   starci kernel enqueue the deps unit (the refusal's manifest files, params.depsUnit)
#   handed over: anything else                        DI settle-nongreen (idempotency settle-nongreen:<jobId>:<dispatchId>)
#   answering                                         starci kernel questions --workflow W + DI worker-question per pending question
#   effect_unknown older than effectUnknownMs         starci kernel reconcile --job J
#   settled, release unproven or worktree not removed the settler for J (closes + verifies, reaps the worktree);
#                                                     recordLeftover op-worker-after-settle when it had to close
# wf key: running < progress.allowedParallel and queued-ready -> starci kernel dispatch-ready --workflow W (once per dispatchEveryMs);
#   starci kernel status importsBroken (IMPORTS_BROKEN_AFTER_MOVE) holds the push and opens DI repoint-needed (blocksNextWave: no
#   repoint unit queued) or repoint-dispatch (queued: the Kernel dispatches it) - the next wave waits for the repoint.
# workers:supervisor: scripts/supervisor/supervisor-watchdog.mjs sweepWorkers (called); in shadow over a dry ledger and dry seams.
# overlap: a product-wf-overlap event -> DI product-wf-overlap for the Supervisor (cross-workflow).
schema: starci/reconciler-controller@1
controller: job
resyncMs: 30000             # the worker-health probe (key health:all) runs every resync
concurrency: 2
timeoutMs: 960000            # a settler run with a canon parity measurement takes minutes
concerns: [job.settle, job.worker, job.dispatch, job.consume-check, job.close-verify]
decisionDueMs: 900000
effectUnknownMs: 300000
dispatchEveryMs: 60000
settledWindowMs: 3600000     # settled jobs this recent are close-verified
allowedVerbs: [settle, check, reconcile, enqueue, incident]
# Worker-health probe (scripts/reconciler/worker-health.mjs; owner-driven 2026-09-28): key health:all, one orca terminal
# list per resync; working | rate-limited | done-without-report | idle-at-prompt | dead. Nudges via
# scripts/api/orca/terminal-send.mjs, staggered; a DI worker-stalled only after the automatic actions fail.
health:
  idleMs: 300000             # no output this long, no report -> idle-at-prompt
  maxIdleNudges: 2
  idleNudgeEveryMs: 300000
  staggerMs: 15000           # at most one nudge per this across all workers
  backoffMinMs: 30000        # rate limit with no reset hint: 30s -> 5min, +20% jitter
  backoffMaxMs: 300000
  rateLimitDecisionMs: 1800000
  rateLimitWaitMs: 300000    # a rate-limit reset further away than this moves the job to the next eligible agent
  doneNudgeEveryMs: 180000
  doneFailAfterMs: 600000    # done-without-report this long -> starci kernel reconcile --dead-worker --settle-failed
# SLA per phase (DESIGN §9.1); codes in modules/reconciler/sla.yaml; entity job:<ledgerId>:<jobId>
# (READY_UNDISPATCHED on wf:<ledgerId>:<workflowId>). Unset numbers come from runtimes.yaml (liveness, settler).
sla:
  READY_UNDISPATCHED: 120000
  LEASE_STUCK: 300000
  QUESTION_OVERDUE: 600000
  CONSUME_OVERDUE: 60000
  DECISION_OVERDUE: 900000
  DEAD_WORKER_UNRECONCILED: 120000
  EFFECT_UNKNOWN_STUCK: 600000
  WORKER_RELEASE_LEAK: 60000
