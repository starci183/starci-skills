    family: correctness
    finding: {role: runtime, duty: bound, verdict: departs, evidence: "Nivo brand.decide blocked BRAND_TOKEN_UNTRACEABLE: the op reported correctly (a correct error); the departure is the contract that demands a trace its own scope forbids producing. The ruling was an answered ask (dispatch ctx_398c5d4ea8da, answeredBy autopilot, option A naming --accent: #040d1c), no file declared the value, and the declaring file belongs to interface.implement", remedy: {state: in-tree, change: "valueSource has a ruling form {ruling, token, value} checked against the ledger's recorded answer (brand-value-source.mjs): the answer must exist, be an owner, autopilot or auto-accept answer, carry the value, and the token be this brand token; the token passes as planned-from-ruling with the declaration owed to interface.implement (its planned-brand-tokens requirement), and review.verify refuses it as planned-source-missing until the app theme declares it"}}
    met: {date: "2026-10-08", where: "brand.decide gate demanded an edit a later leg makes", evidence: "owner report 2026-10-08; nivo ledger op-brand.decide-f093d5c923 report 4; decisions dec-26ab5d9fc8a0"}
    rule: {file: scripts/work/brand/brand-value-source.mjs, anchor: "planned-from-ruling"}
