  - id: worktree-gc-spec-red-once-under-load
    family: concurrency
    finding: {role: runtime, duty: does, verdict: departs, evidence: "(duty: a removal the runtime owns survives a file another process holds for a moment) the pass over an ended workflow's Orca tree answered ok:false once under load (tests/api-git/worktree-lifecycle.spec.mjs, 18.4 s against 3 to 9 s): the git home of a removal retries a busy file with a backoff (scripts/api/fs/safe-remove.mjs, retries 5) and the Orca home asked Orca once and recorded the refusal, so a hold of an indexer, a scanner or a child still exiting turned the pass red; the removal in the spec is the only one of the three that goes through the Orca home", remedy: {state: in-tree, change: "removeOrcaWorktree asks Orca again, up to worktrees.removeRetries times with a growing wait (removeRetryMs), when the refusal is Orca's untyped one that names a held file and the tree is still there (removeThroughOrca); a typed refusal and a hold that does not pass are recorded as before, bounded"}}
    met: {date: "2026-10-08", where: "the alpha.6 full-suite run: tests/api-git/worktree-lifecycle.spec.mjs 'the GC reclaims orphans...' failed once at the assertion on the ended workflow's removal item, 18.4 s, then passed in 20 of 20 stress runs", evidence: "the alpha.6 clean-tree full-suite log and its 20 stress logs"}
    rule: {file: scripts/machine/worktree-orca.mjs, anchor: "removeThroughOrca"}
