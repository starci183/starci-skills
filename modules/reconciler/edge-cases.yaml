  - id: config-unreadable-controllers-off
    family: change-under-running
    met: {date: "2026-10-07", where: "reconciler engine on an unreadable config.yaml", evidence: "commit 6a6eb2b7e; CHANGELOG 1.0.0-alpha.6 Fixed"}
    rule: {file: scripts/reconciler/engine-modes.mjs}
