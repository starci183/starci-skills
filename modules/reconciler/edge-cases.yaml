  - id: guard-hook-unresolvable-git-bash
    family: authority-safety
    met: {date: "2026-10-07", where: "Windows seat under Git Bash", evidence: "commit f30acc9e4; CHANGELOG 1.0.0-alpha.6 Fixed"}
