schema: starci/module-reconciler-edge-cases@1
id: reconciler.edge-cases

# The registry of every edge case met so far. An entry is added in the same change that resolves the case (skills/starci/references/
# debug-loop.md). `covered` names the rule that handles it (a file, and an `anchor` text that file contains) and the spec that
# reproduces it; `open` names why it is not covered. The `edge-case-registry` self-check refuses a covered entry whose rule or spec
# does not exist, and an entry whose family is not listed.
families:
  - power-lifecycle
  - change-under-running
  - failure-while-running
  - correctness
  - smooth-operation
  - record-vs-reality
  - authority-safety
  - concurrency
  - ending

