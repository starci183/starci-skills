    spec: tests/kernel/autopilot.spec.mjs
    status: covered
  - id: kernel-killed-waiting-on-condition
    family: failure-while-running
    met: {date: "2026-10-07", where: "wf-starci-auth-test kernel replaced as idle during a typed machine wait", evidence: "AUDIT-starci-workflow.md issue 7"}
    rule: {file: scripts/kernel/kernel-watchdog.mjs}
    spec: tests/kernel/kernel-watchdog.spec.mjs
