  - id: op-judge-self-authored-tests
    family: correctness
    met: {date: "2026-10-09", where: "the judge declarations of backend.implement, e2e.verify and integration.verify", evidence: "backend.implement writes or updates the unit specs of the subjects it changes (modules/ops/ops/backend.implement.yaml, the unit-specs sentence of the implementation-quality step and the step 'Add or repair scoped unit tests') and the gate's specs and the Sonar coverage of 100 on the measured logic files count those specs; e2e.verify writes 'one scenario per assertion' at the allowlisted spec paths (sideEffects: end-to-end scenario spec authoring) and integration.verify writes the contract specs it then runs, and settle re-runs the world with the specs the same op wrote. The independent measures today are lint, typecheck and canon of the gate, the Sonar new-code issues, the test-world structural rules (no hand-rolled world, none skipped), the provider's own sandbox for integration.verify and the later review.verify; nothing checks that an authored case traces to an acceptance record of work.author"}
    why: "The declarations say the truth (machine with the independent measures, plus next-leg review.verify where a reviewing leg exists) and the behaviour is unchanged. The owner decides whether a spec the same attempt wrote may stand as proof of behaviour: e.g. a settle measure that refuses an authored case with no assertion id of the work.author records, or a rule that the leg that runs the specs is not the leg that wrote them. Either tightens a gate, so it is the owner's."
    status: open
  - id: op-judge-substance-unjudged
    family: correctness
    met: {date: "2026-10-09", where: "the judge declarations of business.decide, content.generate, perf.verify, scope.finish and test.author", evidence: "each of these ops is judged by machine measures alone and none of them reads substance: the settler re-runs the record validators (shape, references, coverage of the records) and the READ digest is re-read, but no Critic, no reviewing leg and no owner gate judges whether the specified behaviour (business.decide), the generated content and its examples (content.generate), the measured numbers (perf.verify), the retention of live consumers and sole evidence copies (scope.finish) or the cases of the authored tests (test.author) are right; the op's own run is the evidence"}
    why: "Adding a Critic row, a reviewing leg or an owner gate for an op changes who can fail a leg, which is the owner's decision per leg and not part of declaring today's behaviour. The declarations name the gap in their why so the op is told its checks are shape only."
    status: open
