  - id: worktree-gc-spec-red-once-under-load
    family: concurrency
    met: {date: "2026-10-08", where: "the alpha.6 full-suite run: tests/api-git/worktree-lifecycle.spec.mjs 'the GC reclaims orphans...' failed once at the assertion on the ended workflow's removal item, 18.4 s, then passed in 20 of 20 stress runs", evidence: "the alpha.6 clean-tree full-suite log and its 20 stress logs"}
    status: open
    why: "not reproduced: three runs of the spec beside six CPU-burning processes passed, and the item's reason was not recorded (the assertion then had no message; it now prints the removal item). The GC makes one Orca worktree remove per pass (kind mutation, replay none) and a refusal is recorded on the row for the next pass; the fake runs one git worktree remove --force. Whether a transient git refusal on Windows or something else failed that removal is not proven, so the fake is not changed on a guess. 2026-10-09 (wave 3 f7): read the pass for an ordering or clock assumption and found none (the time budget gcBudgetMs is 120 s against a real clock and the spec ran 18 s; every other time input is injected: now, ownerAlive, jobStatusOf); 15 serial runs beside six CPU burners and 16 runs four at a time beside eight burners all passed, so the cause is still unproven"
