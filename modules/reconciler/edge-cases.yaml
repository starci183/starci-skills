    finding: {role: runtime, duty: does, verdict: departs, evidence: "StarCi brand.decide reported SHELL_RENDER_UNAVAILABLE after starting next dev by hand pinned to 127.0.0.1: the product's shared next-intl proxy rewrites to localhost, which a server pinned to another host treats as an external rewrite and answers 307 to / for ever (reproduced in a scratch copy of the worktree: a pinned server loops, a server with no pin answers 200 on localhost and 127.0.0.1); the op prompt and contract named no render path and no verb served the app", remedy: {state: in-tree, change: "starci work layout-render serves the app itself (next dev, free port, no host pin, localhost URLs, the scaffold's public-origin variables set), keys the slot, records the capture and stops its server; the command policy refuses a hand-started server and names the verb; the op prompt and brand.decide name it; a render that cannot be produced prints SHELL_RENDER_UNAVAILABLE with a typed cause, the URL and the redirect chain"}}
