    met: {date: "2026-10-07", where: "scope.define attempt 1 failed on op-read-digest-missing", evidence: "AUDIT-starci-workflow.md issue 4; commit 9526b2b73"}
    rule: {file: scripts/kernel/mechanism-proofs.mjs}
