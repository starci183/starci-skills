  - id: job-refused-by-admission-while-pool-admits-others
    family: failure-while-running
    finding: {role: runtime, duty: does, verdict: departs, evidence: "Nivo op-business.decide-58d0a31e7e was refused at admission (no-eligible-candidate, provider claude) six times in two hours while the pool admitted other jobs; the dispatch-rejected record kept only that string, never the per-candidate codes, so neither the Kernel nor the ledger could say which rule refused it (the machine copy has purged the reservation rows of that hour), and every refusal counted as claude's fault toward the agent switch although a full pool is a wait. The StarCi host-resources-low disagreement between status and dispatch was closed earlier (host-hold.mjs, status-frontier-admission.spec.mjs)", remedy: {state: in-tree, change: "a refused launch admission records its candidates with their typed codes and the untried members of the job's route chain on the dispatch-rejected event, the job result and the printed refusal; a refusal whose every code is a capacity condition (capacity-full, incident-open, provider-blocked) is a wait that reads as the policy hold pool-full or circuit-open and spends no pool strike (job-rejections.mjs); a status projection of provider-reservation load is not added, so the Kernel meets the wait at dispatch, typed"}}
    met: {date: "2026-10-07", where: "Nivo wf-nivo-auth-test-workflow-muxq1xov business.decide retry; wf-starci-auth-test dispatch", evidence: "AUDIT-starci-workflow.md issue 8; nivo ledger op-business.decide-58d0a31e7e dispatch-rejected events 12:28-14:16"}
