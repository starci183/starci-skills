    spec: tests/supervisor/spawn-restart.spec.mjs
    status: covered
  - id: reboot-closure-unconfirmable
    family: power-lifecycle
    met: {date: "2026-10-08", where: "worker release after the terminal is gone", evidence: "commit 1a39c73c9"}
