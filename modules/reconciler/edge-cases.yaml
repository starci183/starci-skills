  - id: running-workflow-tree-collected-after-reboot
    family: power-lifecycle
    finding: {role: runtime, duty: does, verdict: departs, evidence: "the worktree GC (reconciler gc controller, always active) collected the trees of two running workflows as owner-unknown after the host restart: its ledger lookup read a handle member that does not exist, so no workflow had a phase, and Orca listed no terminal in a tree after the reboot; each tree was removed after its uncommitted work was preserved to preserved/<workflow>/gc", remedy: {state: in-tree, change: "the lookup reads the ledger phase through the open reader, an unreadable ledger answers ledger-unreadable and keeps the tree (worktree-ledger-lookup.mjs)"}}
    met: {date: "2026-10-08", where: "wf-nivo-auth-test-workflow and wf-starci-auth-test-workflow after the 2026-10-07 shutdown", evidence: "machine.sqlite gc_items runs 110 and 111, machine_logs seq 3483 and 3502; Debug custody audit 2026-10-08"}
    rule: {file: scripts/machine/worktree-ledger-lookup.mjs, anchor: "readerOf"}
    spec: tests/machine/worktree-gc-workflow-phase.spec.mjs
    status: covered
  - id: workflow-restarted-from-main-after-tree-loss
