    spec: tests/kernel/workflow-custody.spec.mjs
    status: covered
  - id: admitted-op-placement-names-a-lost-tree-path
    family: power-lifecycle
    finding: {role: runtime, duty: does, verdict: departs, evidence: "settle of a reported op (Nivo op-architecture.decide-e78adc94cc) refused op-gate-tool-failed 'the current owned slice could not be bound': the op's immutable admission names the original tree path (the workflow's first worktree directory), the GC removed that directory, and the replacement tree is registered at the -2 path; the custody repair restored the content and the checkpoint chain but not the original path; and starci workflow custody --apply refused workflow-custody-busy because the job was reported although its worker was gone", remedy: {state: in-tree, change: "when a workflow tree is put back at another path (starci workflow start, starci workflow custody --apply, the settler's own pass), every admitted, unsettled attempt whose recorded path is lost is rebound by a placement-rebound ledger event that settle, the checks and the op gate read (its worker gone, its report filed and every report file in the tree), or ended by the runtime as placement-lost with no business attempt spent (otherwise); the custody busy refusal counts only ops with a live worker"}}
    met: {date: "2026-10-08", where: "settle of an op admitted before the tree was lost", evidence: "nivo runtime.sqlite events 489, 490, 496, 497 (kernel-proposal kprop-f9ee099c38, runtime-defect incident); check_runs 59 and 60 (op-gate, settler, 05:29 and 05:31Z); worktrees rows ...-muxq1xov (removed 03:01Z) and ...-muxq1xov-2 (created 05:26Z)"}
