    met: {date: "2026-10-07", where: "record-checks and settle re-ran checks in the main checkout", evidence: "AUDIT-starci-workflow.md issue 5; commit 3d187fbac"}
    rule: {file: scripts/kernel/settle/job-settle-verify.mjs}
    spec: tests/kernel-settle/check-rerun-worktree.spec.mjs
    status: covered
  - id: plan-divergence-after-provisional-answer
    family: failure-while-running
    met: {date: "2026-10-07", where: "a provisional answer left a step unable to run", evidence: "commit cdcbdcf71; op-incident-policy gateCauses"}
    rule: {file: modules/kernel/op-incident-policy.yaml, anchor: "plan-divergence"}
    spec: tests/kernel/gate-ladder.spec.mjs
    status: covered
  - id: land-host-lock-starves-workflows
