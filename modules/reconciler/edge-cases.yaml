    finding: {role: runtime, duty: does, verdict: departs, evidence: "ensureWorkflowWorktree created the replacement tree of both workflows from main (branch wf-<id>-2) while the workflow branch and its preserved ref held the checkpoints and the uncommitted records; a Kernel started in that tree would have worked without them and the settle gate then saw an owned slice of records only", remedy: {state: in-tree, change: "a workflow that owns a branch or a preserved ref gets its tree at that branch with the preserved work restored; a registered tree behind the branch is moved onto it; refs off one chain are refused workflow-custody-diverged (workflow-custody.mjs, starci workflow custody)"}}
    met: {date: "2026-10-08", where: "starci workflow start of both real workflows after the GC removed their trees", evidence: "git reflog of starci183/wf-wf-nivo-auth-test-workflow-muxq1xov-2 (Created from refs/heads/main 05:26Z); Debug custody audit 2026-10-08"}
    rule: {file: scripts/kernel/workflow-custody.mjs, anchor: "moveTreeToTip"}
    spec: tests/kernel/workflow-custody.spec.mjs
    status: covered
  - id: admitted-op-placement-names-a-lost-tree-path
    family: power-lifecycle
    finding: {role: runtime, duty: does, verdict: departs, evidence: "settle of a reported op (Nivo op-architecture.decide-e78adc94cc) refused op-gate-tool-failed 'the current owned slice could not be bound': the op's immutable admission names the original tree path (the workflow's first worktree directory), the GC removed that directory, and the replacement tree is registered at the -2 path; the custody repair restores the content and the checkpoint chain but not the original path", remedy: {state: open}}
    met: {date: "2026-10-08", where: "settle of an op admitted before the tree was lost", evidence: "nivo runtime.sqlite events 489, 490, 496, 497 (kernel-proposal kprop-f9ee099c38, runtime-defect incident)"}
    status: open
    why: "the admission binds the op to the tree path it ran in; a registered tree that has to be recreated gets a new path from Orca, so a reported but unsettled op needs its admitted placement re-pointed to the registered tree by a runtime rule (an owner decision on who may rewrite an immutable admission), not by hand"
  - id: op-prompt-files-the-whole-knowledge-tree
    family: smooth-operation
    finding: {role: runtime, duty: does, verdict: departs, evidence: "the shared standard read of the nine deciding and authoring ops was knowledge/**: their prompt listed 260 to 290 mandatory files (2.4 to 2.9 MB) in a 88 to 95 KB prompt that the worker reads and carries in its context for every later turn; the usage rows of 14 decision attempts show 3.4 to 13.4 M tokens each, 47 to 113 turns, a prompt of 25 thousand tokens carried across 13 percent of all of it, and the READ digest it required hashed 254 files nobody can read", remedy: {state: in-tree, change: "each of the nine ops files the law inputs plus the knowledge its own READ step names (docs, op-gate, its patterns): 19 to 45 mandatory files and a 21 to 28 KB prompt; the budget is knowledge/op-gate.yaml readSet"}}
    met: {date: "2026-10-08", where: "decision legs of the Nivo and StarCi auth-test workflows", evidence: "llm_usage rows of both product ledgers; worker transcript dd6caf3b (113 turns, 13.07 M cache-read tokens, a 102 KB packet read at turns 1 and 2)"}
    rule: {file: knowledge/op-gate.yaml, anchor: "readSet"}
    spec: tests/kernel/op-read-set.spec.mjs
    status: covered
  - id: documented-command-two-extractors
    family: correctness
    finding: {role: runtime, duty: does, verdict: departs, evidence: "two code paths decided whether a text shows a starci command that exists, tests/helpers/doc-commands.mjs (tokens, flags, enums, required options) and scripts/checks/check-prose-commands.mjs (R230: regex heads and prose clauses); a regex written into a yaml value was read as a command by one and not the other, and an earlier attempt to give R230 the helper's extractor produced 15 false positives because a prose word after 'starci' was read as an unknown group", remedy: {state: in-tree, change: "scripts/checks/lib/doc-commands.mjs is the one extractor and judge; R230 and the doc-command specs call it, R230 holds a prose mention to unknown verbs and options and a span or fence to unknown groups too; 2834 occurrences of the tree and 6000 fuzzed lines read identically before and after the move"}}
    met: {date: "2026-10-08", where: "R230 and the doc-command helper disagreed on a regex pattern over a command spelling", evidence: "tests/repo/doc-commands.spec.mjs regex-pattern test; lane brief alpha.8 E3"}
    rule: {file: scripts/checks/lib/doc-commands.mjs, anchor: "extractCommands"}
    spec: tests/checks/check-prose-commands.spec.mjs
    status: covered
  - id: land-gate-skips-specs-that-spawn-the-cli
    family: correctness
    finding: {role: runtime, duty: does, verdict: departs, evidence: "the land gate's bounded selection (24 graph-only specs, one per directory) let a change through that broke 13 specs: each spawns scripts/kernel/cli.mjs or packages/cli/bin/starci.mjs and runs a verb whose handler reaches the changed file, so no import of theirs names it and the smoke bound left them out", remedy: {state: in-tree, change: "the direct and touching selections add the specs that spawn a CLI entry and name a verb whose handler reaches a changed file: the verbs importing a changed file themselves, then the nearest others up to allocation.landGate.cliVerbs (land-cli-specs.mjs)"}}
