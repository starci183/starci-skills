# Resource controller (scripts/reconciler/controllers/resource.mjs; DESIGN §8.3, §14; lane rc-gc-resource).
# The throttle thresholds (minFreeRamPct 10, heavyResumeAbovePct 15, landSpecPauseBelowPct 2.5, landSpecResumeAbovePct 5,
# hardFloorPct, cpuHeavyStopAbove 0.95, cpuHeavyResumeBelow 0.85) and priorities stay in modules/models/runtimes.yaml
# allocation.resources (scripts/machine/ram-throttle.mjs throttleThresholds); this file holds only the controller's numbers.
name: resource
concerns: [resource.throttle, resource.quota]
# resource:host is reconciled every resyncMs (census, load, memory -> mode, slot targets).
resyncMs: 30000
concurrency: 2
# One op-ram-footprint supervisor event per footprintEveryMs (the per-op RAM history ram-throttle.mjs reads).
footprintEveryMs: 300000
# resource:quota:<ledger>: api provider-health --quota-probe at most once per quotaProbeEveryMs while a quota circuit is open.
quotaProbeEveryMs: 300000
quotaProbeTimeoutMs: 120000
# cap-starved: the priority workflow held fewer than min(reserve, demand) slots for this long -> Decision Item to the Supervisor.
capStarvedMs: 900000
# SLA clocks (lane F reads them): RAM_CRITICAL while the throttle is critical, DISK_LOW while host-resources reads lowDisk.
ramCriticalSlaMs: 600000
diskLowSlaMs: 3600000
# Adaptive per-pool concurrency (AIMD; scripts/machine/pool-backoff.mjs, key resource:pools). A provider-rate-limited event
# (the Job controller's worker-health probe) or a provider-health row of failureKind rate-limited halves the pool's
# effective parallelism, never below backoffFloor, at most once per backoffDecreaseCooldownMs (one burst of stalled
# workers is one halving). After backoffIncreaseAfterMs with no signal it rises +1 per backoffIncreaseStepMs up to the
# pool's runtimes.yaml maxParallel. Route rejects a pool at its backed-off cap, so the next eligible pool takes the job.
# A publication older than backoffStaleMs is ignored (a dead engine never pins a pool). A pool held at its floor while
# still rate limited for backoffPersistMs opens a backoffCircuitKind (quota | rate-limited) circuit for its provider.
backoffFloor: 2
backoffDecreaseCooldownMs: 120000
backoffIncreaseAfterMs: 900000
backoffIncreaseStepMs: 300000
backoffStaleMs: 600000
backoffPersistMs: 900000
backoffCircuitKind: quota
