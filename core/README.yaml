schema: starci/document@1
sections:
  - title: Canonical expandable Work layout
    blocks:
      - Canonical Work v2 uses workspace.yaml and one index.yaml per active node. New Business
        separates overview/index.yaml from typed recursive srs/**/index.yaml section leaves.
        Architecture uses a typed target code map below architecture/sds; implementation and UAT
        later prove that map. Legacy cohesive specification@2 and source-independent
        specification@3 records remain readable.
      - Only leaves author uninvestigate, todo or done. Parents derive progress. Stable dependsOn
        and refs edges propagate semantic changes without rewriting stored state or evidence.
      - All structured records and results use YAML. JSON and underscore-prefixed directories are
        rejected in canonical records. Root _local is the sole excluded execution-state directory;
        nested _local remains invalid. Central schemas remain in .claude; Plan/run records live in
        .starciwork/_local/plans.
      - SRS and SDS are upstream source-of-truth contracts. SRS owns required behavior and SDS owns
        the prescribed technical design; implementation and UAT provide actual conformance proof.
        Source provenance is direct through sourceRefs on proof-owning nodes, with full lowercase
        40/64-hex revision and normalized repository-relative path. Legacy specification source
        observations retain their compatibility binding. work/node@1 retains its resource/revision
        checks. UAT flows collocate index.yaml, exact disposable accounts.yaml, assets and optional
        seed/delete scripts.
      - "UI ownership is explicit: module/ui/index.yaml owns design direction and generated PNGs
        under ui/assets. A thin implementation parent derives state from separate frontend and
        backend implementation leaves. Frontend assets are running-page screenshots; each UAT flow
        owns its own screenshots and video."
  - title: Read-only Work metadata core
    blocks:
      - previewCompletion(root, completions) predicts proposed leaf state/completion using the same
        validators entirely in memory. previewEvidence(root, {directory,nodeId,name}) validates a
        sealed new evidence bundle outside canonical records (including the direct root
        _local/evidence-staging area) against current owners, IDs, schemas and asset hashes. Both
        return preview:true and never write, publish, accept results or establish actual done.
        Workflow preflightCompletion additionally binds the unchanged result and exact target set;
        publishEvidence publishes only a prevalidated new immutable evidence directory from backend
        .starciwork/_local/evidence-staging.
      - "`validateWorkspace(root)` is synchronous and returns
        `{ok,errors,warnings,nodes,resources}`. Each diagnostic has `code,path,message`; paths are
        workspace-relative. Node summaries expose
        `id,path,kind,required,state,effectiveState,specDigest,inputDigest,eligible,children,depend\
        sOn,refs,blockedBy,suspensionReasons`. `dependsOn` and `refs` contain safe, unique sorted
        effective IDs (own plus inherited scope); `blockedBy` lists direct effective prerequisites
        not currently done. `suspensionReasons` contains `{code,ids}` with `INPUT_CHANGED`,
        `PREREQUISITE_NOT_DONE`, `CHILD_SUSPENDED` or `DECLARED_SUSPENSION`. Resources expose only
        `id,path,kind,revision,specDigest`. No metadata bodies, account details, raw file bytes or
        credentials are printed. Unknown extension data stays untouched on disk and participates in
        semantic hashes. `canonicalJSON(value)`, `sha256(bytesOrString)`, `profiles` and
        `impactWorkspace(root,id)` are also exported."
      - Metadata uses YAML 1.2. Canonical work/node@2 validates typed payloads against the central
        .claude schema. SRS defines outcomes with detailed FR flows and alternative/exception
        branches. SDS defines context-driven target design and current gaps; named patterns are
        optional. Implementation records inspected code and changes; UAT records executable observed
        flows. Unknown fields, malformed nested values, JSON files and underscore-prefixed
        directories in canonical records fail validation; only the root _local execution subtree is
        excluded.
  - title: Layout and identity
    blocks:
      - The argument is a .starciwork directory containing workspace.yaml. Arbitrary module
        directories contain index.yaml; the nearest ancestor node defines the parent. Evidence
        manifests are YAML. Source and environment provenance is direct and collocated. No _schema,
        _resources, _archive or _workflows directory belongs in canonical Work v2. Original binary
        images/video may live under owned assets/. accounts.yaml is parsed strictly as synthetic
        disposable local credentials and is never returned in validation output.
  - title: Digests and effective state
    blocks:
      - "`specDigest` covers all node metadata except fields marked `x-operational` in the schema
        (`state`, `completion`, `blocker`, `suspensionReason`, `timestamps`, `createdAt`,
        `updatedAt`), plus normalized Markdown body. `naReason` is semantic: changing an
        applicability justification invalidates consumers of that scope. Unknown extension fields
        are included conservatively. `inputDigest` additionally binds workspace metadata, ancestor
        specifications and their referenced inputs, recursively referenced
        nodes/dependencies/resources, and descendants for branches. An inherited ancestor `refs`
        entry pointing at the current node or its containing subtree is redundant and is not
        recursively expanded; this permits a goal to reference its requirements subtree without
        making that subtree inherit a false reference to itself. Explicit references and all
        dependency edges still undergo cycle detection. Node paths are excluded so a rename
        preserving hierarchy and IDs does not invalidate proof. Resource metadata, including its
        explicit revision and details, is bound in full. Resource-to-resource links inside arbitrary
        details are not interpreted; reference every applicable resource from the consuming node. No
        field hidden inside extension prose is automatically a dependency."
      - "Changing only completion or state does not mechanically alter a digest. Dependency
        eligibility is still checked separately: a consumer requires its own and inherited ancestor
        `dependsOn` targets to be effectively **done**. An N/A prerequisite does not prove a
        module/account/service exists. `refs` bind semantic inputs but do not impose an execution
        gate. A changed specification/resource yields effective `suspended` and retained
        `STALE_COMPLETION`/`STALE_EVIDENCE` diagnostics until actual re-verification; never
        overwrite a digest merely to clear the gate. A previously done consumer whose prerequisite
        regresses also becomes suspended, even if its input digest is unchanged. Persisted
        `state:done` and its evidence remain intact; validation never writes a replacement status.
        Todo/doing consumers with unmet prerequisites retain their declared state but expose
        `eligible:false` and `blockedBy`. Restoring the exact prerequisite can restore validity only
        when all original input/evidence bindings still match; changed semantics require fresh
        verification."
      - "Declared leaf states: `todo`, `doing`, `blocked`, `done`, `na`, `suspended`. Effective
        state additionally includes `invalid`. Authored `suspended` requires a nonempty concrete
        `suspensionReason`; it represents imported or explicitly unverified scope, requires no
        fabricated previous completion/evidence, and never satisfies a prerequisite or contributes
        done. In particular, a business inferred from code is an observation awaiting owner
        approval, not an approved requirement. `suspensionReason` is operational and changing it
        alone does not alter semantic digests. This authored state differs from derived suspended:
        when recorded done loses current input/prerequisite validity, the validator retains the
        original done/evidence on disk and only reports suspended in its output. Do not rewrite
        historical proof into an import record."
      - N/A requires a reason and is not evidence of passing. Required children drive parent rollup;
        all N/A becomes N/A, mixed done/N/A becomes done, otherwise
        invalid/blocked/suspended/doing/todo applies. This completion rollup does not make an N/A
        prerequisite pass its separate dependency gate. An all-optional branch is N/A, not certified
        done; unfinished optional work produces a warning. Shared metadata/evidence integrity errors
        fail closed for all nodes. Unknown leaf kinds remain readable with warnings but cannot earn
        `done`; supported profiles must be implemented and tested before certifying new kinds.
      - Resources may declare `files:[{path}]`. Each path is normalized and relative to the
        directory containing that resource's `resource.yaml`; paths cannot escape it, use symlinks,
        point to a directory or require remote retrieval. The core hashes actual local file bytes at
        validation time and incorporates their normalized paths and computed SHA-256 into the
        resource specification digest. No authored hash field is required. A linked design-image
        edit therefore suspends its UI consumers without needing a manual resource revision bump.
        Transitive consumers are invalidated through declared refs/dependencies; a valid edit to an
        unreferenced resource does not invalidate unrelated leaves. File integrity checks do not
        interpret the design's meaning or automatically inspect external code/runtime.
  - title: Read-only impact inspection
    blocks:
      - '`impactWorkspace(root,id)` returns `{ok,errors,warnings,target,affected}`. Target is
        `{id,path,type:"node"|"resource"}` or null with `MISSING_TARGET`; affected entries are
        `{id,path,kind,direct,via:[id],reasons:[reason]}` and exclude the source itself. Reasons are
        `dependency`, `reference`, `ancestor-spec` and `child-input`. `ok` and diagnostics reflect
        current workspace validation, so suspended proof can be inspected even while validation
        reports failures.'
      - Impact means the declared graph potentially consumes a changed source specification or
        resource bytes; it is not a command to execute. A node specification change affects its
        descendants through inherited scope. An input change propagates to explicit/effective
        consumers and parent rollups, but **parent input alone never propagates back into an
        unrelated sibling**. The `child-input` reason denotes derived parent rollup, not a new
        parent implementation op. This distinction avoids a design-image edit selecting unrelated
        backend work. No automatic task, op, rerun or file mutation occurs.
  - title: Completion profiles
    blocks:
      - Every supported done leaf declares nonempty `assertions:[id]`. Completion is
        `{inputDigest,evidence:[evidenceId],codeRefs?:[{repository,commit}]}`. Evidence must
        explicitly bind that node and its current inputs, report overall pass, contain nonempty
        passing observations, and cover every declared assertion ID. A failed, missing, not-run or
        inconclusive assertion cannot become done. Hashes establish binding and byte integrity,
        **not the truth of an observation**.
      - "One run bundle can serve multiple leaves without copying screenshots: retain its primary
        `nodeId,inputDigest`, then add `bindings:[{nodeId,inputDigest}]` for additional consumers.
        Every bound node ID must resolve and appear only once (including the primary); each consumer
        is checked against its own current digest and declared assertions. Store the manifest and
        assets once at the flow's `evidence/<id>/` and reference the same evidence ID from each
        appropriate leaf. An unlisted consumer cannot reuse the proof. Changing one consumer
        suspends that consumer, not an unrelated binding whose inputs still match. Overall failure
        or corrupted assets invalidates the shared bundle for all consumers."
      - Implementation and release require repository resource IDs and full lowercase 40/64-hex
        commit SHAs. Those resource IDs must be in node `refs`; every selected evidence record must
        carry corresponding `codeRefs`. The core does not check Git object existence, ancestry,
        remote publication or commit origin. Record original versus integrated commits in explicit
        extensions when required; do not equate one commit binding with deployed code.
      - Operators must refresh applicable repository and environment resource revisions from actual
        inspected code/build state before validation. The core re-hashes explicitly declared local
        resource files, but does not otherwise watch repository source files or deployments. A
        changed Git HEAD or remote runtime is not automatically detected if applicable metadata is
        left unchanged; hashes cannot repair stale or fabricated inputs. `eligible` means
        structurally valid with satisfied own/inherited prerequisites, not user approval or
        authority to execute.
      - "UAT evidence requires
        `provenance:{environment,actor,servedVersions,tool,capturedAt,servedVersionEvidence}` or
        `anonymous:true` instead of actor. Environment and actor resolve to resources of kinds
        `environment` and `identity`. Each served version is `{repository,commit,artifact}`: an
        actual observed immutable image/build identity, not a copied source HEAD.
        `servedVersionEvidence` identifies a passing assertion explaining the runtime version
        observation. Environment, actor and repository IDs must be included in node refs for
        invalidation. The core verifies declared binding, not the external endpoint; an operator
        must inspect the actual served target and capture tool-derived observations. A fabricated
        build label can pass structural checks and must be caught by tool evidence and review."
      - '`uat.ui` additionally requires hashed local PNG/JPEG/WebP image bytes. Image recognition
        checks file signatures only, not complete image decoding, correct rendering, authenticity,
        viewport or freshness. The operator must open and examine the image. `uat.ux` requires at
        least one passing assertion marked `kind:"behavior"`; screenshot-only evidence cannot
        suffice. Observation semantics and assertion adequacy require review.'
      - Evidence assets are relative normalized paths under their evidence directory with SHA-256;
        missing files, mismatched hashes, absolute paths, traversal and symlinks are rejected.
        Remote-only evidence cannot be certified in this implementation. No command runs, no account
        is created, no state is repaired and no next op is dispatched by validation.
  - title: Minimal authoring sequence
    blocks:
      - Author source requirements/resources and a `todo` leaf with declared assertions. Call
        validation to obtain its current `inputDigest`. Execute only the approved op, save real
        evidence with that digest and actual code/runtime binding. Set completion only after
        reviewing passing proof; revalidate. These steps are operator responsibilities, not an
        automatic chain. Examples and tests use synthetic observations and must not be cited as
        product acceptance.
      - "Structured `extensions.work3.specification` is validated through
        `specifications/contract.json`: coverage/IDs, source revision bindings, receiving-service
        ownership, pattern mechanisms and threat review. Canonical `journeys` use the same validator
        as the FE workflow. Referenced business journey changes in architecture produce
        `SPECIFICATION_JOURNEY_DRIFT`. This is structure and binding validation, not proof of
        deployed behavior or approved intent."
