# HFS slot manifest (owner-approved 2026-09-29, decisions 1-10 in the owner decisions record).
# The one place that says what may exist in a StarCi product repository and where. A product is ONE app repository
# (hfs 4, manifest major 2): the app root holds the one package.json, lockfile and node_modules, the hfs.json of kind app,
# the CI, the hooks and .starciwork (slots of profile `app`); `be/` and `fe/` are its two sides, each laid out as the old
# standalone repository root (slots of profile be or fe, paths relative to the side folder). Every tracked path of every
# repository must match exactly one slot. Checks, lint factories, the architecture machine, templates and the why
# catalog READ this file through scripts/hfs/slots.mjs; none of them hardcodes a path.
# Shape: modules/schemas/hfs-slots.schema.yaml. The repository side is hfs.json: modules/schemas/hfs-repo.schema.yaml.
schema: starci/hfs-slots@2
version: 2.0.0

versioning:
  # MAJOR.MINOR.PATCH of this manifest. A repository pins only the MAJOR in hfs.json ("hfs": 2).
  patch: wording, why text, examples; no check result can change.
  minor: >-
    add a slot (always presence optional or opt-in), add an app kind or protocol slot, add a rule at severity warn,
    tighten a budget that no pinned repo currently exceeds. A minor never changes an existing slot's path,
    presence, imports or tests. Every repo pinned to the same MAJOR stays green without edits.
  major: >-
    change or remove an existing slot, make an optional slot required, promote a rule warn to error, change the
    direction matrix. Needs owner approval and a migration lane per repo. There is no compatibility window: the old
    MAJOR is refused the day the new one lands (owner ruling: no backward compatibility).
  retire: >-
    a slot is never edited in place; it gets retiredIn (a major) and a successor slot id. After that major a
    path matching a retired slot is HFS_SLOT_RETIRED (error).
  pins: knowledge/hfs/canon-pins.yaml carries the exact versions of every @starci/* package and framework this MAJOR supports.

# Field meaning, per slot.
#   id          stable name, never changes meaning inside a major.
#   profiles    app (the app root; alone), or be, fe or both: the sides the slot exists in (its path is relative to the side folder).
#   path        pattern. <name> is one path segment (bound to the variable name), * and ? stay inside a segment,
#               ** spans directories, {a,b} alternates. A pattern ending in / is a directory: it owns everything
#               below it, except what a more specific slot owns. Otherwise it names files.
#   presence    required | optional | opt-in (legal only when hfs.json lists it or declares an app of its kind) | forbidden.
#               A slot is optional in the sense of the requirements list when its presence is not required.
#   tracked     tracked (committed) | ignored (may exist, must be gitignored) | external (must not exist in the tree;
#               goesTo says where it lives).
#   tier        node of the import direction matrix (tiers below); none = takes no part in import checks;
#               inherit = the tier of the enclosing owner.
#   owner       true when every directory matching the slot is an owner: the unit cross-owner imports and cycles use.
#   requires    files or directories that must exist inside each instance; <var> is replaced by the bound name,
#               a leading / means repository root; a trailing / means directory.
#   requiredInstances  variable -> names that must exist as instances (config, logging ... of platform).
#   minInstances       at least this many instances (one feature, one api app).
#   requiredWhen       connections: required only when hfs.json declares a database connection.
#   allows / forbids   names inside the instance; the loader exposes them, slot-check enforces them.
#   tests       unit-beside | e2e | none.
#   composedBy  the app kinds allowed to compose a transport slot (an app of another kind imports none of its modules).
#   budget      size budgets (lines per file, files per slot, exports).
#   trigger     the trigger kind (triggerKinds) of a feature-tier slot: api, webhooks, realtime, saga, reactors, jobs or cli. A feature of one kind
#               never imports a feature of another (BE_KIND_ISOLATION); the two meet only through the event bus.
#   pattern     the design pattern whose declaration (hfs.json sides.<side>.patterns) enables this opt-in slot; a path in the slot of an
#               undeclared pattern is HFS_SLOT_NOT_ENABLED, and a declared pattern's proof scenarios are ruleParams.be.patternScenarios.
#   appKind     the app kind of hfs.json apps[].kind whose directory this slot describes.
#   managedBy   the template directory hfs sync renders this slot's files from. The slot path then lists literal files
#               only, and each is rendered from templates/<profile or common>/<managedBy>/<path, leading dots dropped>;
#               the managed file list lives here and nowhere in code. A difference is HFS_MANAGED_FILE_DRIFT (a
#               back end's tsconfig.json: HFS_TS_STRICT when a flag or an option was added).
#   rules       rule ids (the catalog lands with knowledge/hfs/rules.yaml).
#   since / retiredIn / successor   lifecycle.
presenceValues: [required, optional, opt-in, forbidden]
trackedValues: [tracked, ignored, external]
testValues: [unit-beside, e2e, none]

# The two sides of an app: the folder of each is its profile name (be/, fe/). `reads` lists the only paths of the OTHER side a side
# may read (hfs.json sides.<side>.reads names a subset); nothing else crosses sides.
sides:
  be: {reads: []}
  fe: {reads: [be/contracts/]}     # the back end's committed contract snapshots, the input of the front end's codegen

# The trigger kinds of the back end's features: what starts the work of a feature. A feature slot names its kind in `trigger`; no kind imports another
# (BE_KIND_ISOLATION), every cross-kind call is an event on the bus, and only be/apps/* compose features.
triggerKinds: [api, webhooks, realtime, saga, reactors, jobs, cli]

appKinds:
  be: [api, worker, cli]
  fe: [next]

# ---------------------------------------------------------------------------------------------------------
# Tiers and the dependency direction matrix (owner granularity; type-only imports count; no cycles anywhere)
# mayImport lists the tiers a file of that tier may import. Importing inside the same owner is always allowed.
# ---------------------------------------------------------------------------------------------------------
tiers:
  be:
    app:          {mayImport: [feature, domain, events, queues, projections, platform, integrations, package]}
    feature:      {mayImport: [domain, events, queues, projections, platform, integrations, package]}          # never another feature
    domain:       {mayImport: [domain, events, queues, platform, integrations, package], acyclic: true}      # a domain service writes the outbox: it publishes events and enqueues queue jobs inside its own transaction
    events:       {mayImport: [events, platform, package], acyclic: true}          # modules/events/<service>: typed event classes (pattern event-bus)
    queues:       {mayImport: [queues, events, platform, package], acyclic: true}  # modules/queues/<queue>: typed producers and schedulers (pattern queue)
    projections:  {mayImport: [projections, domain, events, platform, integrations, package], acyclic: true}   # modules/projections/<name>: read models (pattern projection)
    integrations: {mayImport: [platform, package]}
    platform:     {mayImport: [platform, package], acyclic: true}
    e2e:          {mayImport: [e2e, app, feature, domain, events, queues, projections, platform, integrations, fixtures, package]}
    fixtures:     {mayImport: [domain, events, queues, projections, platform, integrations, package]}          # public contracts only
    package:      {mayImport: [package]}
  fe:
    route:        {mayImport: [feature, foundation, modules, transport, package]} # app/** adapters
    feature:      {mayImport: [components, hooks, foundation, modules, transport, package]}
    # A component never reaches data: config, routes, i18n and types are foundation; every other module and the api
    # transport are reached through a hook (owner decision 2026-09-29).
    components:   {mayImport: [components, hooks, foundation, package], lowerLayerOnly: true} # blocks, composites, branches, leaves
    # Across domains a hook is imported only through the other domain's public index (hooks/<domain>/index.ts), never deep.
    hooks:        {mayImport: [hooks, foundation, modules, transport, package]}
    foundation:   {mayImport: [foundation, package], acyclic: true}               # modules/{config,i18n,routes,types}
    modules:      {mayImport: [foundation, modules, transport, package], acyclic: true}
    transport:    {mayImport: [foundation, modules, package]}                     # modules/api: the one fetch
    package:      {mayImport: [package]}
crossOwner: every import across owners targets the owner's public entry (index.ts or index.tsx); never export *.
crossApp: apps never import each other; shared code is a packages/<pkg> slot.

# Parameters the lint factories and checks read per profile (through ruleParams(profile) in scripts/hfs/slots.mjs).
ruleParams:
  be:
    # HFS_SIZE_GROWTH: a file above soft may not grow against its parent commit; a new file stays within soft.
    fileLines: {soft: 500, hardGrowth: true}
    # R21 HFS_DUPLICATE_CODE: the ONE threshold of duplicate code (the architecture machine reads it here; no other file states it):
    # a token-normalised block of at least `lines` source lines and `tokens` tokens that appears twice.
    duplicateBlock: {lines: 8, tokens: 60}
    # R90 BE_INFRA_OWNER: raw infrastructure library (a module specifier or a global reference) -> the platform or
    # integration capabilities allowed to import it; [] means nowhere in a back end. A specifier also covers its subpaths.
    infraOwners:
      fetch: [platform/http]
      axios: [platform/http]
      got: [platform/http]
      undici: [platform/http]
      "node:http": [platform/http]
      "node:https": [platform/http]
      http: [platform/http]
      https: [platform/http]
      cache-manager: [integrations/cache, integrations/redis]
      "@nestjs/cache-manager": [integrations/cache, integrations/redis]     # the CACHE_MANAGER token: caching goes through the cache capability (retired local rule must-use-cache-service)
      redis: [integrations/cache, integrations/redis]
      ioredis: [integrations/cache, integrations/redis]
      bullmq: [platform/queue, platform/messaging]   # platform/messaging: interim BullMQ transport of the ecommerce example until platform/event-bus lands; pattern queue: BullMQ jobs and job schedulers (the relay of the outbox into queues)
      "@nestjs/bullmq": [platform/queue, platform/messaging]
      kafkajs: [platform/event-bus]          # pattern event-bus: Kafka is the only event transport
      "@nestjs/schedule": []                 # no @Cron / @Interval / @Timeout anywhere: a schedule is a BullMQ job scheduler of a queue
      eventemitter2: []
      setInterval: [platform/retry, platform/event-bus, platform/queue, platform/http]
      setTimeout: [platform/retry, platform/event-bus, platform/queue, platform/http]
      "node:timers": [platform/retry, platform/event-bus, platform/queue, platform/http]
      "node:timers/promises": [platform/retry, platform/event-bus, platform/queue, platform/http]
      winston: [platform/logging]
      dayjs: [platform/clock, platform/primitives]
      moment: [platform/clock, platform/primitives]
      date-fns-tz: [platform/clock, platform/primitives]
      "@nestjs/config": []
      dotenv: []
      "@nestjs/event-emitter": []
      "@nestjs/platform-socket.io": [platform/realtime]
      socket.io: [platform/realtime]
      graphql-subscriptions: [platform/realtime]
      graphql-ws: [platform/realtime]
    # R48 BE_SPEC_QUALITY spec-infra-double-from-kit: in a `<name>.service.spec.ts` a provider `{ provide: TOKEN, useValue: X }` takes X from
    # the kit named here (the package root of `kit`). The token name is normalised to UPPER_SNAKE (`EntityManager` -> ENTITY_MANAGER), the
    # FIRST entry whose `token` regex matches decides, and `fallback` decides for every other token. `forms` say what X may be:
    # call = `double(...)`, new = `new Double(...)`, curried = `double(...)(...)`, object = a plain object literal (REAL values),
    # primitive = a string/number/boolean literal, array = an array literal (multi-providers of doubles). A const bound to such a value counts.
    specDoubles:
      kit: "@starci/jest-preset"
      doubles:
        - {token: "(?:^|_)OPTIONS$", double: builder, forms: [curried, object]}
        - {token: "(?:^|_)ENTITY_MANAGER$", double: mockEntityManager, forms: [call]}
        - {token: "(?:^|_)TRANSACTION(?:_RUNNER)?$", double: fakeTransaction, forms: [call]}
        - {token: "(?:^|_)CLOCK$", double: FakeClock, forms: [new]}
        - {token: "(?:^|_)EVENT_BUS$", double: recordingEventBus, forms: [call]}
        - {token: "(?:^|_)QUEUE_OUTBOX$", double: recordingQueueOutbox, forms: [call]}
        - {token: "(?:^|_)CACHE(?:_|$)", double: fakeCache, forms: [call]}
        - {token: "(?:^|_)(?:LOCK|LEASE|FENCE|HOLD)(?:_|$)", double: fakeLock, forms: [call]}
        - {token: "(?:^|_)(?:IDS|ID_GENERATOR|ID_FACTORY)$", double: fakeIds, forms: [call]}
      fallback: {double: mock, forms: [call, primitive, array]}
    # R89 BE_SOURCE_FORM: the closed role-suffix vocabulary of a source file name (<kebab-name>.<suffix>.ts; BE-CONVENTION 1.15)
    # and the suffixes that are never a role. index.ts, main.ts, app.module.ts and the migrations of be.persistence are the
    # only names outside it.
    suffixes: [module, module-definition, decorators, options, config, connection, service, command, query, handler, compensation, saga-state, saga-step, saga, contracts, port, resolver, controller, gateway, webhook, subscription, consumer, cli, event, queue, projection, projection-entity, processor, step, input, type, args, request, response, mapper, policy, entity, sql, rows, error, messages, log-events, cache-keys, guard, interceptor, filter, client, spec, integration-spec, e2e-spec, contract-spec, global-setup, builder]
    # R47 BE_CONTRACT_UNGUARDED: the world's shape vocabulary. `helper` names the function a contract spec imports to erase the values of a JSON
    # payload (`shapeOf`); a contract spec proves a fake's fixtures by asserting helper(real) equals helper(fixture).
    contractShape: {helper: shapeOf}
    # THE list of unit-tested roles of a back end (the ONE source every consumer reads: the eslint unit-test rules, hfs
    # spec-placement and the cli spec check, the architecture machine's unit-spec checks, the unit-run gate, the jest preset's
    # coverage sources, held equal by spec, and the Sonar and Codecov coverage scope rendered from them). A role's subject is
    # `<name>.<role>.ts` (inside `slot` when one is named), its unit spec `<name>.<spec>.ts` beside it, and `coverage` the be-relative
    # glob the unit run measures at 100 per file. `thin` lists the thin-door rules the role is exempt from: a cli command is an
    # action runner, not a thin transport (R134). A lane that adds a unit-tested role adds its entry here and nowhere else.
    unitRoles:
      - {role: service, spec: service.spec, coverage: "src/**/*.service.ts"}
      - {role: cli, spec: cli.spec, slot: be.cli, coverage: "src/features/cli/**/*.cli.ts", exempt: [BE_TRANSPORT_SHAPE]}
    # BE_PATTERN_SPEC_MISSING: a declared pattern (hfs.json sides.be.patterns) is proven on the test world. Each id below needs a test titled
    # "<pattern>/<id>: ..." in an e2e or integration spec (be/src/tests/e2e, be/src/tests/integration).
    patternScenarios:
      event-bus: [atomic-with-transaction, relay-only-after-commit, redelivery-then-dead-letter, duplicate-delivery-is-a-noop]
      queue: [enqueue-atomic-with-transaction, relay-job-id-is-outbox-id, scheduler-fires-once]
      webhooks: [bad-signature-is-refused, replay-is-refused, accepted-delivery-publishes-once]
      realtime: [subscriber-receives-push, foreign-topic-is-isolated, disconnect-releases-subscription]
      fenced-job: [claim-bumps-token, zombie-fenced-out, redispatch-isolated]
      projection: [recompute-is-idempotent, replay-rebuilds]
    # BE_KIND_DECLARATION: the patterns an app that uses a trigger kind declares in hfs.json sides.be.patterns; the platform capabilities of those
    # patterns (the slots of tier platform that name the pattern) must exist.
    kindPatterns:
      api: []
      webhooks: []
      realtime: []
      reactors: [event-bus]
      jobs: [fenced-job, queue]
      cli: []
    # hfs add <noun> <name>: the pattern topic (knowledge/patterns/be/<topic>.yaml) whose files tree is generated, the path variable of the
    # instance, what it registers in hfs.json, the options it needs (--<option>), the other nouns generated with it under the same name (a job is
# the consumer of its queue, so `also: [queue]`) and the defaults of the other variables ("@name" = the name).
    addKinds:
      job: {topic: jobs, variable: job, trigger: jobs, patterns: [fenced-job, queue], also: [queue], defaults: {step: "@name"}}
      reactor: {topic: reactors, variable: reactor, trigger: reactors, patterns: [event-bus], needs: [event, from, service], defaults: {action: "@name"}}
      queue: {topic: queues, variable: queue, patterns: [queue]}
      projection: {topic: projections, variable: name, patterns: [projection], needs: [connection]}
    bannedSuffixes: [use-case, repository, fixture, factory, store, worker, scheduler, cron, job, listener, dto, util, utils, helper, helpers, rules, types, constants, int-spec, harness-spec, test]
  fe:
    # Slot budgets (component.tsx 300, hooks 200, modules 400) are stricter than this cap where they apply.
    fileLines: {soft: 500, hardGrowth: true}
    duplicateBlock: {lines: 8, tokens: 60}

slots:

  # ----- app root (profile app: the one repository of a product) --------------------------------------------
  - id: app.declaration
    profiles: [app]
    path: hfs.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_ARCH_CONFIG_UNREAD]
  - id: app.readme
    profiles: [app]
    path: README.md
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_README_*]
  - id: app.package-manifest
    profiles: [app]
    # The one package.json of the app, at the app root: be's dependencies and every tool, and every script; npm workspaces are
    # exactly fe/apps/* and fe/packages/* (HFS_MONO_WORKSPACES), each with its own package.json. be has no package.json of its own.
    path: package.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: package-scripts     # the `scripts` block only; the rest of the file is the repository's
    rules: [HFS_PACKAGE_MANAGER_MIXED, HFS_DEP_VERSION_SKEW, HFS_CANON_PIN_DRIFT, HFS_MANAGED_FILE_DRIFT, HFS_MONO_WORKSPACES, HFS_MONO_WORKSPACE_DEP]
  - id: app.task-graph
    profiles: [app]
    # The turbo task graph of the app (build, dev, lint, typecheck over the fe workspaces; build depends on ^build and caches
    # .next and dist): rendered by hfs sync from templates/app/task-graph/turbo.json, judged for drift by hfs check. turbo needs
    # it beside the root package.json and lockfile.
    path: turbo.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: task-graph
    rules: [HFS_MANAGED_FILE_DRIFT, HFS_MONO_WORKSPACES]
  - id: app.lockfile
    profiles: [app]
    path: package-lock.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_PACKAGE_MANAGER_MIXED, HFS_DEP_VERSION_SKEW]
  - id: app.git-meta
    profiles: [app]
    path: "{.gitignore,.gitattributes}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_GITIGNORE_BLOCK_DRIFT]     # the marked block of .gitignore is rendered by hfs sync (templates/app/gitignore)
  - id: app.tool-config
    profiles: [app]
    path: "{.editorconfig,.nvmrc}"
    presence: required     # plain dotfiles, the repository's own
    tracked: tracked
    tier: none
    tests: none
  - id: app.format-config
    profiles: [app]
    # The one formatter configuration of the app (prettier walks up from every file of both sides to it): .prettierrc names
    # @starci/prettier-config, .prettierignore is the template.
    path: "{.prettierrc,.prettierignore}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: tool-config
    rules: [HFS_MANAGED_FILE_DRIFT, HFS_TOOL_CONFIG_LOCAL]
  - id: app.tool-config-optional
    profiles: [app]
    path: .npmrc
    presence: optional
    tracked: tracked
    tier: none
    tests: none
  - id: app.tool-config-local
    profiles: [app]
    path: "{tsconfig.json,.eslintrc,.eslintrc.*,.eslintignore,eslint.config.*,.stylelintrc,.stylelintrc.*,.stylelintignore,stylelint.config.*,.prettierrc.*,prettier.config.*,jest.config.*,lint-staged.config.*,.lintstagedrc*}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "nowhere at the app root: each side holds exactly its managed tool configuration (be.tool-config, fe.tool-config) and the root only the formatter (app.format-config)"
    rules: [HFS_TOOL_CONFIG_LOCAL]
  - id: app.quality-config
    profiles: [app]
    path: "{sonar-project.properties,codecov.yml}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: quality-config
    rules: [HFS_SONAR_CONFIG, HFS_MANAGED_FILE_DRIFT]
  - id: app.hooks
    profiles: [app]
    path: ".husky/{pre-commit,pre-push}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: hooks
    rules: [HFS_CI_E2E_AUTOMATIC, HFS_MANAGED_FILE_DRIFT]
  - id: app.ci
    profiles: [app]
    path: ".github/workflows/ci.yml"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: ci-workflows
    rules: [HFS_CI_E2E_AUTOMATIC, HFS_CI_MISSING_CANON, HFS_MANAGED_FILE_DRIFT]
  - id: app.ci-e2e
    profiles: [app]
    path: ".github/workflows/e2e.yml"
    presence: optional     # on: workflow_dispatch only
    tracked: tracked
    tier: none
    tests: none
    managedBy: ci-workflows
    rules: [HFS_CI_E2E_AUTOMATIC, HFS_MANAGED_FILE_DRIFT]
  - id: app.ci-images
    profiles: [app]
    # Builds every image of the app (one matrix entry per declared app, path-filtered), never pushes: rendered by hfs sync.
    path: ".github/workflows/images.yml"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: ci-workflows
    rules: [HFS_MANAGED_FILE_DRIFT]
  - id: app.dockerignore
    profiles: [app]
    # The one build-context filter of every image (the context is the app root): rendered by hfs sync; it keeps secrets and build output out.
    path: .dockerignore
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: docker-ignore
    rules: [HFS_MANAGED_FILE_DRIFT]
  - id: app.github-meta
    profiles: [app]
    path: ".github/{CODEOWNERS,pull_request_template.md,ISSUE_TEMPLATE/**,dependabot.yml}"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
  - id: app.scripts
    profiles: [app]
    # The app's operational scripts only (`*.mjs`, `*.cjs`, `*.ps1`, `*.sh`), or nothing: an empty folder is `scripts/.gitkeep`, which
    # `hfs scaffold app` writes. A spec or a test (BE_SPEC_PLACEMENT, FE_NO_TESTS), a check or lint source (`check-*`, `eslint-local-rules*`,
    # a local eslint plugin: HFS_REPO_LOCAL_CHECK) and anything that re-implements a canon check is not an operational script and has no place here.
    path: "scripts/{.gitkeep,*.mjs,*.cjs,*.ps1,*.sh}"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_SCRIPT_ONE_OFF, BE_SPEC_PLACEMENT, HFS_REPO_LOCAL_CHECK]     # one-off codemods and fix-* scripts are agent output, not tooling
  - id: app.sides
    profiles: [app]
    # The two sides. Everything below be/ and fe/ is judged by the side's own slots (profiles be and fe) with the side folder as its root;
    # this slot answers only for the side folders themselves.
    path: "{be,fe}/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
  - id: app.starciwork
    profiles: [app]
    path: ".starciwork/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    requires: [.gitignore, workspace.yaml, features/index.yaml]
    allows: [workspace.yaml, "brand/**", shell/index.yaml, "features/<feature>/index.yaml",
             "features/<feature>/<family>/<name>/index.yaml", "features/<feature>/br/<rule>/ac/<name>/index.yaml",
             "features/<feature>/ui/<name>/assets/<approved-file>", "features/<feature>/uat/<name>/{index,accounts,fixtures}.yaml",
             "features/<feature>/uat/<name>/{seed,cleanup}.sql", "_resources/{identities,environments,fixtures}/<slug>/resource.yaml"]
    forbids: [evidence/, logs/, reports/, captures/, runs/, "kernel-*/", "*.sqlite*", _derived/, "work/node records"]
    rules: [HFS_AGENT_DATA_TRACKED, HFS_WORK_NODE_RETIRED, HFS_IDENTITY_CUSTODY]
  - id: app.starcistacks
    profiles: [app]
    # The stack declarations and the sealed custody of the app, at the app root beside be/, fe/ and .starciwork (never under a side).
    path: ".starcistacks/"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    requires: [application-stacks.yaml]
    allows: [application-stacks.yaml, "<env>/README.md", "<env>/environment.json", "<env>/infra/{compose,k8s,terraform}/**", "<env>/infra/metadata.json",
             "<env>/runtime/{config,env}/**", "<env>/runtime/env/KEYS.md", "<env>/secrets/<slug>.enc", "<env>/seeds/**"]
    forbids: ["<env>/runtime/files/**", "**/*.enc outside <env>/secrets/", DESIGN.md, deployment.json, "k8s/ at root"]
    rules: [HFS_STACKS_SHAPE, HFS_STACKS_IN_SIDE, HFS_PLAINTEXT_SECRET, HFS_IDENTITY_CUSTODY]
  - id: app.sops
    profiles: [app]
    # The sops custody rule of .starcistacks/<env>/secrets/*.enc, at the app root beside the tree it seals.
    path: .sops.yaml
    presence: required
    tracked: tracked
    tier: none
    tests: none
  - id: app.build-output
    profiles: [app]
    path: "{**/node_modules/,coverage/,reports/,test-results/,**/*.tsbuildinfo}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
  - id: app.tool-cache
    profiles: [app]
    path: "{.eslintcache,.turbo/,.scannerwork/,.sonar/,.jest-cache/,.cache/,.tools/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "${STARCI_CACHE_HOME:-%LOCALAPPDATA%/StarCi/cache}/<repo>/<tool>/ (the canon presets set eslint --cache-location, jest cacheDirectory, turbo cacheDir, sonar.working.directory)"
  - id: app.agent-output
    profiles: [app]
    path: "{report*.json,*.tmp.json,%*%,nul,.artifacts/,.tmp-*,*-lint.json,lf.json,lt.json,*.log,design-plans/,.gitmounts/,.dat,vi-flat.txt}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "agent scratchpad or the StarCi blob store (%LOCALAPPDATA%/StarCi/blobs), cited by {name, sha256}"
    rules: [HFS_UNTRACKED_ROOT_ENTRY, HFS_AGENT_DATA_TRACKED]
  - id: app.worktrees
    profiles: [app]
    path: "{.worktrees/,worktrees/,.starciwork/worktrees/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "<lanes root>/<project>/<lane>/ (outside every repository) for a lane; a Kernel workflow's worktree is created and owned by Orca outside the app checkout, never tracked, and removed by the runtime's host-side controller once the workflow's finish marked it release-pending"
  - id: app.plaintext-env
    profiles: [app]
    path: "{.env,.env.*,.secrets/,**/*.pem,**/*.key}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: ".starcistacks/<env>/secrets/<slug>.enc (at the app root); decrypted values only in memory or under %LOCALAPPDATA%/StarCi/secrets/<project>/<env>/ via *_FILE"
    rules: [HFS_PLAINTEXT_SECRET]

  # ----- side root (both sides): what the old standalone repository root held, less the app-root files ----------
  - id: repo.side-root-forbidden
    profiles: [be, fe]
    path: "{package.json,package-lock.json,hfs.json,README.md,.gitignore,.gitattributes,.husky/,.github/,.starciwork/,.starcistacks/,.sops.yaml,sonar-project.properties,codecov.yml,.prettierrc,.prettierignore,scripts/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "the app root: one package.json, lockfile, hfs.json, README, git and CI files, hooks, formatter, Sonar and Codecov configuration, scripts/, .starciwork, .starcistacks and .sops.yaml per app"
  - id: be.tool-config
    profiles: [be]
    # Managed files (hfs sync renders them, hfs check compares them): the whole tool configuration of a back end. Each is
    # a reference to a canon package, never a configuration: tsconfig.json extends @starci/tsconfig/be.json and adds the
    # three path aliases and excludes the world, integration, e2e and contract trees (fixtures stay in the root program: unit
    # specs import them); tsconfig.build.json puts an overlay preset after it and adds only the path-relative options a
    # preset cannot hold; the tests' own src/tests/tsconfig.json (the nearest config of a world, integration, e2e or contract
    # file, so typed lint and typecheck:tests both find it) extends it with the e2e preset; eslint.config.mjs is the
    # one-line starciBeConfig call; jest.config.js calls the @starci/jest-preset factory (the root scripts run it with
    # --config be/jest.config.js). The formatter configuration is the app's (app.format-config); every preset resolves from the
    # app root node_modules.
    path: "{tsconfig.json,tsconfig.build.json,src/tests/tsconfig.json,eslint.config.mjs,jest.config.js}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: tool-config
    rules: [HFS_MANAGED_FILE_DRIFT, HFS_TOOL_CONFIG_LOCAL, HFS_TS_STRICT]
  - id: be.nest-cli
    profiles: [be]
    # The Nest monorepo of the back end: `monorepo: true` and one project per declared be app (apps/<app>, even for one service).
    path: nest-cli.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_MONO_NEST_PROJECTS]
  - id: be.tool-config-local
    profiles: [be]
    path: "{.eslintrc,.eslintrc.*,.eslintignore,eslint.config.js,eslint.config.cjs,eslint.config.ts,eslint.config.mts,eslint.config.cts,.prettierrc.*,prettier.config.*,jest.config.ts,jest.config.mjs,jest.config.cjs,jest.config.json,jest.config.e2e.js}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "nowhere: a back end has exactly the managed tool configuration (be.tool-config); a change to a rule or a flag is proposed in the .claude runtime"
    rules: [HFS_TOOL_CONFIG_LOCAL]
  - id: fe.tool-config
    profiles: [fe]
    # Managed files (hfs sync renders them, hfs check compares them): the tool configuration of a front end. Each is a
    # reference to a canon package, never a configuration: tsconfig.json extends @starci/tsconfig/next.json and only
    # names the preset and nothing else (each app's own tsconfig.json, in fe.app.next, carries its aliases and include; there is
    # no test tsconfig: a front end has no tests, FE_NO_TESTS); eslint.config.mjs is the one-line starciFeConfig call;
    # stylelint.config.mjs is the one-line starciStylelintConfig call. The formatter configuration is the app's (app.format-config).
    # A front end has no test configuration at all (FE_NO_TESTS).
    path: "{tsconfig.json,eslint.config.mjs,stylelint.config.mjs}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: tool-config
    rules: [HFS_MANAGED_FILE_DRIFT, HFS_TOOL_CONFIG_LOCAL, HFS_RULE_OFF_WITHOUT_REPLACEMENT, HFS_TS_STRICT]
  - id: fe.tool-config-local
    profiles: [fe]
    path: "{.eslintrc,.eslintrc.*,.eslintignore,eslint.config.js,eslint.config.cjs,eslint.config.ts,eslint.config.mts,eslint.config.cts,.stylelintrc,.stylelintrc.*,.stylelintignore,stylelint.config.js,stylelint.config.cjs,stylelint.config.ts,stylelint.config.json,prettier.config.*,.prettierrc.*,lint-staged.config.*,.lintstagedrc*,turbo.json}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "nowhere: a front end has exactly the managed tool configuration (fe.tool-config); the task graph is the app root's turbo.json (app.task-graph); a change to a rule or a flag is proposed in the .claude runtime"
    rules: [HFS_TOOL_CONFIG_LOCAL]
  - id: repo.docs
    profiles: [be, fe]
    path: "docs/{adr,runbooks,guides}/**/*.md"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_ROOT_MARKDOWN_FORBIDDEN]
  - id: repo.docs-media
    profiles: [be, fe]
    path: "docs/**/*.{png,svg,webp}"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    budget: {bytes: 512000}
  - id: repo.packages
    profiles: [be, fe]
    path: "packages/<pkg>/"
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    requires: [package.json, src/index.ts, tsconfig.json]
    tests: unit-beside
    rules: [FE_PACKAGE_SHAPE, HFS_UNUSED_EXPORT]
  - id: repo.app-image
    profiles: [be, fe]
    # One image per app: every declared app has its own Dockerfile (apps/<app>/Dockerfile), built from the APP ROOT (the folder with
    # the one package.json). It is app-owned (hfs scaffold writes it once from templates/<side>/image) and judged by the docker rules.
    # A Dockerfile anywhere else is owned by no slot.
    path: "apps/<app>/Dockerfile"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules: [HFS_DOCKER_BUILD_CONTEXT, HFS_DOCKER_STAGES, HFS_DOCKER_ENTRY, HFS_DOCKER_BASE_PIN, HFS_DOCKER_SECRETS]

  # ----- never tracked: build output the tools need in place ---------------------------------------------
  - id: repo.build-output
    profiles: [be, fe]
    path: "{**/node_modules/,dist/,apps/*/dist/,packages/*/dist/,.next/,apps/*/.next/,coverage/,reports/,test-results/,**/next-env.d.ts,**/*.tsbuildinfo}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
  - id: repo.generated
    profiles: [be, fe]
    path: "{**/__generated__/,apps/*/src/schema.gql}"
    presence: optional
    tracked: ignored
    tier: none
    tests: none
    why: produced by `npm run codegen` (prebuild and pretypecheck); never committed

  # ----- never in the working tree: caches, scratch, agent output ----------------------------------------
  - id: repo.tool-cache
    profiles: [be, fe]
    path: "{.eslintcache,.turbo/,.scannerwork/,.sonar/,.jest-cache/,.cache/,.tools/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "${STARCI_CACHE_HOME:-%LOCALAPPDATA%/StarCi/cache}/<repo>/<tool>/ (the canon presets set eslint --cache-location, jest cacheDirectory, turbo cacheDir, sonar.working.directory)"
  - id: repo.agent-output
    profiles: [be, fe]
    path: "{report*.json,*.tmp.json,%*%,nul,.artifacts/,.tmp-*,*-lint.json,lf.json,lt.json,*.log,design-plans/,.gitmounts/,.dat,vi-flat.txt}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "agent scratchpad or the StarCi blob store (%LOCALAPPDATA%/StarCi/blobs), cited by {name, sha256}"
    rules: [HFS_UNTRACKED_ROOT_ENTRY, HFS_AGENT_DATA_TRACKED]
  - id: repo.worktrees
    profiles: [be, fe]
    path: "{.worktrees/,worktrees/,.starciwork/worktrees/}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "<lanes root>/<project>/<lane>/ (outside every repository)"
  - id: repo.plaintext-env
    profiles: [be, fe]
    path: "{.env,.env.*,.secrets/,**/*.pem,**/*.key}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: ".starcistacks/<env>/secrets/<slug>.enc (at the app root); decrypted values only in memory or under %LOCALAPPDATA%/StarCi/secrets/<project>/<env>/ via *_FILE"
    rules: [HFS_PLAINTEXT_SECRET]
  - id: be.root-e2e
    profiles: [be]
    path: "e2e/"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "src/tests/e2e/ for specs; operational probes move to scripts/ or are deleted"

  # ----- contract snapshots (the committed machine-emitted files, because they are a cross-repo interface) --
  - id: be.contract.graphql
    profiles: [be]
    path: "contracts/<app>/schema.graphql"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    why: emitted by `npm run contract:emit` (`hfs emit-contracts`, never written by hand); CI fails when the emitted file differs (a contract, not a build artefact)
    rules: [HFS_CONTRACT_SNAPSHOT_DRIFT]
  - id: be.contract.openapi
    profiles: [be]
    path: "contracts/<app>/openapi.json"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    why: emitted by `npm run contract:emit` (`hfs emit-contracts`, never written by hand) from the app's typed operation table `apps/<app>/src/operations.ts` (canon BE-OPERATIONS-1); CI fails when the emitted file differs
    rules: [HFS_CONTRACT_SNAPSHOT_DRIFT]
  - id: be.contract.events
    profiles: [be]
    path: "contracts/<app>/events.json"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    why: the async contract of a service (`starci/event-contract@1`), emitted by `npm run contract:emit` (`hfs emit-contracts`, never written by hand) from the typed event classes of `src/modules/events/<service>/`; the consumers of its events rely on it (R151 HFS_EVENT_CONTRACT)
    rules: [HFS_EVENT_CONTRACT]
  - id: be.contract.events.pin
    profiles: [be]
    path: "contracts/<app>/events.pin.json"
    presence: opt-in
    tracked: tracked
    tier: none
    tests: none
    why: the previously published event contract of a service, the same format as its events.json (copied over when the contract is published, never edited); the current events.json may only extend it additively, a breaking change is a new `<event>.v2` key (R162 BE_CONTRACT_BREAKING)
    rules: [BE_CONTRACT_BREAKING]

  # ----- BE: apps (one slot per app kind; a new kind = a new slot, minor bump) ---------------------------
  - id: be.app.api
    profiles: [be]
    path: "apps/<app>/src/"
    appKind: api
    presence: required            # at least one api app
    tracked: tracked
    tier: app
    owner: true
    minInstances: 1
    requires: [main.ts, app.module.ts]
    allows: [main.ts, app.module.ts, "<app>.options.ts", operations.ts]
    tests: none                   # an app is proven by the e2e world (useTestWorld({ apps })), never by a unit spec
    budget: {app.module.ts: 250, main.ts: 80}
    rules: [BE_APP_COMPOSITION_ONLY, BE_APP_BUSINESS_ROLE, BE_DEFAULT_DENY, BE_ERROR_MASKED, BE_FEATURE_NOT_COMPOSED, BE_CONTEXT_OWNER]
  - id: be.app.worker
    profiles: [be]
    path: "apps/<app>/src/"
    appKind: worker               # composes transport/message modules and job processors only (an api app may compose them too: a worker app is for separate scaling)
    presence: opt-in
    tracked: tracked
    tier: app
    owner: true
    requires: [main.ts, app.module.ts]
    allows: [main.ts, app.module.ts, "<app>.options.ts"]
    tests: none                   # an app is proven by the e2e world (useTestWorld({ apps })), never by a unit spec
    rules: [BE_APP_COMPOSITION_ONLY, BE_BACKGROUND_UNOWNED, BE_CONTEXT_OWNER]
  - id: be.app.cli
    profiles: [be]
    # The ONE app of every one-off action (migrate, seed, sync, backup, any operator command): be/apps/cli, on nest-commander.
    # main.ts boots with CommandFactory.run (BE_CLI_BOOTSTRAP); app.module.ts composes the platform and the cli feature root
    # (src/features/cli/cli.module.ts); cli.options.ts carries what it needs from the environment, the connections it migrates
    # among them (the test world migrates through the same list). It is required as soon as the back end declares a connection
    # or tracks a command, with its image apps/cli/Dockerfile (BE_CLI_REQUIRED): one image, run as `cli <group> <command>`.
    path: "apps/<app>/src/"
    appKind: cli
    presence: opt-in
    tracked: tracked
    tier: app
    owner: true
    requires: [main.ts, app.module.ts]
    allows: [main.ts, app.module.ts, "<app>.options.ts"]
    tests: none                   # an app is proven by the e2e world (useTestWorld({ apps })), never by a unit spec
    rules: [BE_CLI_REQUIRED, BE_CLI_BOOTSTRAP, BE_CLI_OWNER, BE_SCHEMA_AUTHORITY]

  # ----- BE: features ------------------------------------------------------------------------------------
  # src/features/ is grouped by TRIGGER KIND (owner decision 2026-10-02): features/api/<feature>/ (a request: application/ and
  # transport/<protocol>/, composed by the api apps), features/cli/ (a one-off action: the cli feature root, compiled only into
  # apps/cli). Every kind imports only downward into modules/*; no kind imports another.
  - id: be.feature
    profiles: [be]
    path: "src/features/api/<feature>/"
    presence: required
    trigger: api                  # a request-driven feature (graphql, http); the other trigger kinds have their own roots below
    tracked: tracked
    tier: feature
    owner: true
    minInstances: 1
    requires: [index.ts, "<feature>.module.ts", application/]
    allows: [index.ts, "<feature>.module.ts", application/, transport/, messages/]   # nothing else at feature root
    tests: none
    budget: {files: 250, indexExports: 60}   # a feature above 250 source files must be split by product capability
    rules: [BE_FEATURE_SHAPE, BE_FEATURE_IMPORTS_FEATURE, BE_PUBLIC_SURFACE, BE_FEATURE_NOT_COMPOSED]
  - id: be.feature.application
    profiles: [be]
    path: "src/features/{api/,jobs/,reactors/}<feature>/application/"     # inside a trigger kind (jobs, reactors) the feature folder is one level down
    presence: required
    tracked: tracked
    tier: feature
    allows: ["<action>.{command,query,handler,contracts}.ts"]
    forbids: [graphql/, http/, message/, schedule/, transport/]   # no protocol names under application/
    tests: none
    rules: [BE_APPLICATION_IMPORTS_TRANSPORT, BE_APPLICATION_TRANSPORT_FRAMEWORK, BE_ENTITY_IN_CONTRACT, BE_CQRS_SHAPE]
  - id: be.feature.saga
    profiles: [be]
    path: "src/features/api/<feature>/saga/"
    pattern: saga                 # enabled by `patterns: ["saga"]` in hfs.json sides.be (R154 to R158); an undeclared saga folder is HFS_SLOT_NOT_ENABLED
    presence: opt-in
    tracked: tracked
    tier: feature
    allows: ["<saga>.saga.service.ts", "<saga>.saga.service.spec.ts", "<saga>.saga-state.ts"]   # the orchestrator (a step list plus compensations, a `*.service.ts` because a handler injects only services, unit-tested beside it) and the typed, versioned state of a run
    forbids: [graphql/, http/, message/, schedule/, transport/]
    tests: unit-beside            # <saga>.saga.service.spec.ts beside the orchestrator; the state machine and its fence are platform/saga's service; each compensation path has an e2e spec
    rules: [BE_SAGA_STEP_COMPENSATION, BE_SAGA_STATE_VERSIONED, BE_SAGA_EVENT_CONTRACT, BE_SAGA_E2E_MISSING]
  - id: be.feature.saga.steps
    profiles: [be]
    path: "src/features/api/<feature>/saga/steps/"
    pattern: saga
    presence: opt-in
    tracked: tracked
    tier: feature
    allows: ["<step>.saga-step.ts"]    # one step, dispatching one command and naming the event it puts on the wire
    tests: none
    rules: [BE_SAGA_STEP_COMPENSATION, BE_SAGA_EVENT_CONTRACT]
  - id: be.feature.saga.compensations
    profiles: [be]
    path: "src/features/api/<feature>/saga/compensations/"
    pattern: saga
    presence: opt-in
    tracked: tracked
    tier: feature
    allows: ["<step>.compensation.ts"]   # REQUIRED for every step: the command that undoes it, naming the failure event that triggers it
    tests: none
    rules: [BE_SAGA_STEP_COMPENSATION, BE_SAGA_EVENT_CONTRACT, BE_SAGA_E2E_MISSING]
  - id: be.feature.application.support
    profiles: [be]
    path: "src/features/{api/,jobs/,reactors/}<feature>/application/support/"
    presence: optional            # helpers and types local to ONE feature; same tier as application, never a shared home
    tracked: tracked
    tier: feature                 # feature tier: another feature cannot import it (features never import features)
    allows: ["<name>.<role>.ts"]     # <role> from ruleParams.be.suffixes; no <name>.types.ts
    forbids: [graphql/, http/, message/, schedule/, transport/]
    tests: none
    rules: [BE_APPLICATION_IMPORTS_TRANSPORT, BE_APPLICATION_TRANSPORT_FRAMEWORK, BE_FEATURE_IMPORTS_FEATURE]
    since: 1.0.0
  - id: be.transport.http
    profiles: [be]
    path: "src/features/api/<feature>/transport/http/"
    presence: optional
    tracked: tracked
    tier: feature
    requires: ["<feature>-http.module.ts"]
    allows: ["<action>.controller.ts", "dto/<action>.{request,response}.ts", "<action>.mapper.ts"]
    tests: none
    composedBy: [api]
    rules: [BE_DEFAULT_DENY, BE_INPUT_BOUNDED, BE_TRANSPORT_SHAPE]
  - id: be.transport.graphql
    profiles: [be]
    path: "src/features/api/<feature>/transport/graphql/"
    presence: optional
    tracked: tracked
    tier: feature
    requires: ["<feature>-graphql.module.ts"]
    allows: ["<action>.resolver.ts", "dto/<action>.{input,type,args}.ts", "<action>.mapper.ts"]
    tests: none
    composedBy: [api]
    rules: [BE_DEFAULT_DENY, BE_INPUT_BOUNDED, BE_TRANSPORT_SHAPE]
  - id: be.transport.message
    profiles: [be]
    path: "src/features/{api/,reactors/}<feature>/transport/message/"
    presence: opt-in              # queue consumer: composed by the service that owns it (an api app) or by a worker app scaled apart
    pattern: event-bus            # a consumer reads the event bus; declaring the pattern enables the slot
    tracked: tracked
    tier: feature
    requires: ["<feature>-message.module.ts"]
    allows: ["<event>.consumer.ts"]     # BE-CONVENTION 1.6: transport/message holds only consumers; a .message.ts is outside the closed suffix list
    tests: none
    composedBy: [api, worker]
    rules: [BE_BACKGROUND_UNOWNED, BE_SAGA_CONSUMER_DEDUPE]
  # ----- BE: feature kinds that are not an api: a webhook door and a realtime door. Each kind is a folder of src/features/ named by
  # the kind and holds one folder per provider or channel; a kind imports only modules/* (never another kind) and only an
  # api-kind app composes it. Their doors answer to the same door laws as every transport (default deny, bounded input,
  # no envelope), plus the kind laws of knowledge/patterns/be/webhooks.yaml and realtime.yaml.
  - id: be.feature.webhooks
    profiles: [be]
    path: "src/features/webhooks/<provider>/"
    presence: opt-in              # a provider webhook intake: verifies the signature and replay window, then hands the delivery to ONE domain intake method
    pattern: webhooks             # declaring the pattern (hfs.json sides.be.patterns) enables the kind (knowledge/patterns/be/webhooks.yaml)
    trigger: webhooks
    tracked: tracked
    tier: feature
    owner: true
    requires: [index.ts, "<provider>-webhook.module.ts", "<provider>.webhook.ts", "<provider>.webhook.spec.ts"]
    allows: [index.ts, "<provider>-webhook.module.ts", "<provider>.webhook.ts", "<provider>.webhook.spec.ts", dto/]
    tests: unit-beside            # the door's own spec (<provider>.webhook.spec.ts) beside the door: the one non-service unit spec of this kind
    composedBy: [api]
    rules: [BE_WEBHOOK_SHAPE, BE_WEBHOOK_UNVERIFIED, BE_DEFAULT_DENY, BE_INPUT_BOUNDED, BE_FEATURE_NOT_COMPOSED]
    since: 1.0.0
  - id: be.feature.webhooks.dto
    profiles: [be]
    path: "src/features/webhooks/<provider>/dto/"
    presence: opt-in
    pattern: webhooks
    tracked: tracked
    tier: feature
    allows: ["<event>.request.ts"]   # the typed provider payload, validated and bounded (BE_INPUT_BOUNDED)
    tests: none
    composedBy: [api]
    rules: [BE_INPUT_BOUNDED]
    since: 1.0.0
  - id: be.feature.realtime
    profiles: [be]
    path: "src/features/realtime/<channel>/"
    presence: opt-in              # a push channel: reads and pushes only (a socket gateway or a GraphQL subscription), no domain write
    pattern: realtime             # declaring the pattern (hfs.json sides.be.patterns) enables the kind (knowledge/patterns/be/realtime.yaml)
    trigger: realtime
    tracked: tracked
    tier: feature
    owner: true
    requires: [index.ts, "<channel>-realtime.module.ts"]
    allows: [index.ts, "<channel>-realtime.module.ts", "<channel>.gateway.ts", "<channel>.gateway.spec.ts", "<channel>.subscription.ts", "<channel>.subscription.spec.ts", dto/]
    tests: unit-beside            # the door's own spec beside the door (a gateway or a subscription has no service of its own)
    composedBy: [api]
    rules: [BE_REALTIME_SHAPE, BE_REALTIME_WRITES, BE_REALTIME_TOPIC_SCOPE, BE_DEFAULT_DENY, BE_FEATURE_NOT_COMPOSED]
    since: 1.0.0
  - id: be.feature.realtime.dto
    profiles: [be]
    path: "src/features/realtime/<channel>/dto/"
    presence: opt-in
    pattern: realtime
    tracked: tracked
    tier: feature
    allows: ["<name>.{input,type,args}.ts"]
    tests: none
    composedBy: [api]
    rules: [BE_INPUT_BOUNDED]
    since: 1.0.0
  - id: be.cli
    profiles: [be]
    # The cli feature root: every one-off action of the back end, compiled only into apps/cli. A group is a nest-commander
    # @Command (<group>/<group>.cli.ts) whose sub-commands are @SubCommand classes extending CommandRunner
    # (<group>/subs/<name>.cli.ts), each with its unit spec beside it (<name>.cli.spec.ts): a command is an action runner, not a
    # thin transport (BE_CLI_COMMAND_SHAPE). `.cli.ts` because `.command.ts` is the CQRS message (HFS delta 3). The feature root
    # module (cli.module.ts, module-definition pattern) imports each group module.
    path: "src/features/cli/"
    presence: optional
    trigger: cli                  # the one cli feature root: a one-off action never imports a feature of another kind (BE_KIND_ISOLATION)
    tracked: tracked
    tier: feature
    owner: true
    requires: [index.ts, cli.module.ts, cli.module-definition.ts]
    allows: [index.ts, cli.module.ts, cli.module-definition.ts, "<group>/<group>.cli.ts", "<group>/<group>.cli.spec.ts", "<group>/<group>.module.ts", "<group>/<group>.module-definition.ts", "<group>/<group>.options.ts", "<group>/<group>.decorators.ts", "<group>/subs/<name>.cli.ts", "<group>/subs/<name>.cli.spec.ts"]
    tests: unit-beside
    rules: [BE_CLI_COMMAND_SHAPE, BE_CLI_OWNER, BE_CLI_REQUIRED, BE_SCHEMA_AUTHORITY]

  # ----- BE: modules (three tiers, closed set) -----------------------------------------------------------
  - id: be.domain
    profiles: [be]
    path: "src/modules/domain/<capability>/"
    presence: optional
    tracked: tracked
    tier: domain
    owner: true
    requires: [index.ts]
    allows: ["<capability>.module.ts", "<capability>.config.ts", "<capability>.options.ts", errors/, messages/, persistence/, policies/, "*.service.ts", "*.service.spec.ts", "*.contracts.ts"]
    forbids: [testing/, exceptions/, utils/, helpers/, shared/]
    tests: unit-beside            # <name>.service.spec.ts beside each <name>.service.ts, nothing else
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, BE_PUBLIC_SURFACE, BE_ERROR_HOME, BE_CONFIG_OWNER, BE_CONTEXT_COUPLING, BE_CONTEXT_TRANSACTION]
  - id: be.errors
    profiles: [be]
    path: "src/modules/{domain,integrations}/<capability>/errors/"
    presence: optional
    tracked: tracked
    tier: inherit
    allows: ["<capability>.error.ts", "<name>.error.ts"]   # one family per capability, extends platform/errors DomainError
    tests: none
    rules: [BE_ERROR_HOME]
  - id: be.domain.messages
    profiles: [be]
    path: "src/modules/{domain,platform,integrations}/<capability>/messages/"
    presence: optional            # a capability (any tier) that raises no user-facing text carries none
    tracked: tracked
    tier: inherit
    allows: ["<capability>.messages.ts"]   # one keyed catalog per capability, vi and en, read through the platform/i18n MessageCatalog port
    tests: none
    rules: [BE_USER_COPY_LITERAL]
    since: 1.0.0
  - id: be.feature.messages
    profiles: [be]
    path: "src/features/api/<feature>/messages/"
    presence: optional
    tracked: tracked
    tier: feature
    allows: ["<feature>.messages.ts"]   # one keyed catalog per feature, vi and en, read through the platform/i18n MessageCatalog port
    tests: none
    rules: [BE_USER_COPY_LITERAL]
    since: 1.0.0
  - id: be.persistence
    profiles: [be]
    path: "src/modules/{domain,platform,projections}/<capability>/persistence/"
    # R163: the platform capabilities whose tables exist on EVERY connection that uses them (the event-bus outbox, the job table); their arrays may be
    # registered on several declared connections. Any other capability registers its arrays on exactly one (BE_SCHEMA_OWNER).
    perConnection: [event-bus, jobs]
    presence: optional
    tracked: tracked
    tier: inherit
    requires: [connection.ts]     # the capability's <c>Entities / <c>Migrations arrays (the owner index re-exports the two arrays by name); no CONNECTION alias: the connection is the one the apps register the arrays on
    allows: ["entities/<table>.entity.ts", "migrations/<epochMs13>-<kebab-name>.ts", "<name>.sql.ts", "<name>.rows.ts", connection.ts]
    forbids: [index.ts, "<name>.repository.ts"]
    tests: none
    rules: [BE_SCHEMA_OWNER, BE_SCHEMA_AUTHORITY, BE_SQL_OUTSIDE_PERSISTENCE, BE_SQL_TABLE_OWNER, BE_SQL_RETURNING_SHAPE, BE_CONTEXT_COUPLING, BE_CONTEXT_PLATFORM_TABLES]
  - id: be.platform
    profiles: [be]
    path: "src/modules/platform/<capability>/"
    presence: required
    tracked: tracked
    tier: platform
    owner: true
    # config = EnvSource reader only; logging = LoggerPort + adapter; errors = DomainError base + one filter + GraphQL
    # formatError with masking; primitives = isRecord, hashing, ids, cookies; clock = the injected Clock port
    # (now()), with a FakeClock test double from @starci/jest-preset; i18n = the MessageCatalog port, a keyed
    # lookup with named interpolation over the vi/en catalogs a capability or feature carries in its messages/,
    # resolved through the RequestLocale provider (request: stored user preference, else Accept-Language, else
    # vi; non-request: recipient's stored preference, else vi - see knowledge/patterns/be/messages.yaml);
    # database when a connection exists.
    requiredInstances: {capability: [config, logging, errors, primitives, clock, i18n]}
    requires: [index.ts]
    forbids: [common/, utils/, shared/, testing/]   # primitives live in platform/primitives
    tests: unit-beside            # <name>.service.spec.ts beside each <name>.service.ts, nothing else
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, BE_MODULE_SHAPE]
  # ----- BE: pattern slots (opt-in; enabled by hfs.json sides.be.patterns). A path under one is HFS_SLOT_NOT_ENABLED unless its pattern is declared.
  - id: be.platform.event-bus
    profiles: [be]
    path: "src/modules/platform/event-bus/"
    presence: opt-in
    pattern: event-bus            # the ONE durable event transport: transactional outbox, relay, Kafka, inbox, retry and dead letter (knowledge/patterns/be/event-bus.yaml)
    tracked: tracked
    tier: platform
    owner: true
    requires: [index.ts, event-bus.module.ts, event-bus.port.ts, event-bus.contracts.ts, event-bus.service.ts, event-bus.service.spec.ts]
    tests: unit-beside
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, BE_MODULE_SHAPE, BE_INFRA_OWNER]
  - id: be.platform.queue
    profiles: [be]
    path: "src/modules/platform/queue/"
    presence: opt-in
    pattern: queue                # the ONE BullMQ owner: the outbox relay into queues (jobId = outbox id) and job schedulers (knowledge/patterns/be/queues.yaml)
    tracked: tracked
    tier: platform
    owner: true
    requires: [index.ts, queue.module.ts, queue.port.ts, queue.contracts.ts, queue-outbox.service.ts, queue-outbox.service.spec.ts]
    tests: unit-beside
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, BE_MODULE_SHAPE, BE_INFRA_OWNER]
  - id: be.events
    profiles: [be]
    path: "src/modules/events/<service>/"
    presence: opt-in
    pattern: event-bus            # typed event classes of one service; each equals an entry of be/contracts/<service>/events.json
    tracked: tracked
    tier: events
    owner: true
    requires: [index.ts]
    allows: ["<event>.event.ts", index.ts]
    tests: none
    rules: [BE_EVENT_CLASS_CONTRACT, BE_TIER_DIRECTION]
  - id: be.queues
    profiles: [be]
    path: "src/modules/queues/<queue>/"
    presence: opt-in
    pattern: queue                # a typed producer of one queue: enqueueX(payload, tx) writes the outbox; its schedulers live beside it
    tracked: tracked
    tier: queues
    owner: true
    requires: [index.ts, "<queue>.queue.ts", "<queue>.module.ts"]
    allows: ["<queue>.queue.ts", "<queue>.module.ts", "<queue>.contracts.ts", index.ts]
    tests: none
    rules: [BE_OUTBOX_WRITE_TX, BE_TIER_DIRECTION]
  - id: be.feature.reactors
    profiles: [be]
    path: "src/features/reactors/<reactor>/"
    presence: opt-in
    pattern: event-bus            # a reactor consumes events of another context and keeps a local copy or triggers a projection
    trigger: reactors
    tracked: tracked
    tier: feature
    owner: true
    requires: [index.ts, "<reactor>.module.ts", transport/]
    allows: [index.ts, "<reactor>.module.ts", application/, transport/]
    tests: none
    rules: [BE_KIND_ISOLATION, BE_FEATURE_IMPORTS_FEATURE, BE_FEATURE_NOT_COMPOSED]
  - id: be.feature.jobs
    profiles: [be]
    path: "src/features/jobs/<job>/"
    presence: opt-in
    pattern: fenced-job           # a background job: a processor with a fenced claim, steps and the application it dispatches to
    trigger: jobs
    tracked: tracked
    tier: feature
    owner: true
    requires: [index.ts, "<job>.module.ts", "<job>.processor.ts", steps/]
    allows: [index.ts, "<job>.module.ts", "<job>.processor.ts", application/, steps/]
    tests: none
    rules: [BE_KIND_ISOLATION, BE_FEATURE_IMPORTS_FEATURE, BE_FEATURE_NOT_COMPOSED]
  - id: be.jobs.steps
    profiles: [be]
    path: "src/features/jobs/<job>/steps/"
    presence: opt-in
    pattern: fenced-job           # one external effect per step; it takes the claimed job and writes through the guarded methods
    tracked: tracked
    tier: feature
    allows: ["<step>.step.ts"]
    tests: none
    rules: [BE_JOB_SHAPE, BE_JOB_RUN_KEY]
  - id: be.platform.jobs
    profiles: [be]
    path: "src/modules/platform/jobs/"
    presence: opt-in
    pattern: fenced-job           # the ONE fencing primitive: the job entity, the claim that bumps the token, guarded writes (knowledge/patterns/be/jobs.yaml)
    tracked: tracked
    tier: platform
    owner: true
    requires: [index.ts, jobs.module.ts, jobs.port.ts, jobs.contracts.ts, job-claim.service.ts, job-claim.service.spec.ts, fenced.processor.ts]
    tests: unit-beside
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, ARCH_OWNER_CYCLE, BE_MODULE_SHAPE, BE_JOB_WRITE_OUTSIDE_OWNER, BE_JOB_FENCE_REQUIRED]
  - id: be.projections
    profiles: [be]
    path: "src/modules/projections/<name>/"
    presence: opt-in
    pattern: projection           # a read model: only its projection writes its table; recompute is idempotent and replayable; readers use get*
    tracked: tracked
    tier: projections
    owner: true
    requires: [index.ts, "<name>.module.ts", "<name>.projection.ts", "<name>.projection-entity.ts"]
    allows: [index.ts, "<name>.module.ts", "<name>.projection.ts", "<name>.projection-entity.ts", "<name>.contracts.ts", persistence/]
    tests: none
    rules: [BE_PROJECTION_WRITE_OWNER, BE_PROJECTION_SHAPE, BE_TIER_DIRECTION, BE_CONTEXT_COUPLING]
  - id: be.integrations
    profiles: [be]
    path: "src/modules/integrations/<provider>/"
    presence: optional
    tracked: tracked
    tier: integrations
    owner: true
    requires: [index.ts, "<provider>.config.ts"]
    tests: unit-beside            # <name>.service.spec.ts beside each <name>.service.ts; plus src/tests/integration/<provider>/ (R112)
    budget: {indexExports: 60}
    rules: [BE_TIER_DIRECTION, BE_ERROR_HOME, BE_SECRET_DEFAULT, BE_INTEGRATION_SPEC_MISSING]
  - id: be.integrations.model
    profiles: [be]
    path: "src/modules/integrations/<provider>/model/"
    presence: opt-in
    tracked: tracked
    tier: integrations
    tests: none
    why: an ML or LLM model client is an integration; weights and datasets are never in git

  # ----- BE: tests (owner test layout 2026-09-30). Unit specs are <name>.service.spec.ts beside their service and nothing else; everything else
  # lives under src/tests/, one folder per kind, and the folder and the file suffix always agree (a file whose suffix does
  # not match its folder matches no slot: HFS_SLOT_UNDECLARED).
  - id: be.tests.world
    profiles: [be]
    path: "src/tests/world/"
    presence: optional
    tracked: tracked
    tier: e2e
    allows: [global-setup.ts, global-teardown.ts, use-test-world.ts, "fakes/<provider>/server.ts", fakes/]   # jest globalSetup/globalTeardown default-export (Jest API); fakes/<provider>/server.ts is the fake server of a provider, a literal file name BE_SOURCE_FORM reads as its role; plus root files with a role suffix (test-world-files, R47)
    tests: none
    why: >-
      the ONLY test infrastructure location, shared by integration and e2e: global-setup.ts starts the shared
      infrastructure (containers) and runs the migrations once over the cli app's connections; use-test-world.ts exports
      useTestWorld({ apps: { <name>: { module, listen? } } } | { modules: [...] }) -> world.apps.<name>.api,
      world.db.<connection> (the shared EntityManager), world.infra.<service> (latency/cut/restore on a REAL service of the repository's
      own stack, the app root's `.starcistacks/<env>`, each behind toxiproxy), world.fake.<provider> (a network-edge fake of an external SaaS started by the world, with
      failNext/replayWebhook/delay), world.waitFor; fakes/<provider>/ holds the fake servers and payload fixtures, kit/ the inlined test helpers, and the world root may hold role-suffixed helpers (<name>.client.ts, <name>.contracts.ts, ...). Nothing is
      overridden in the DI container. It is the only test location that may import typeorm's DataSource or testcontainers,
      call migrate/runMigrations/synchronize, or write process.env.
  - id: be.tests.world.kit
    profiles: [be]
    path: "src/tests/world/kit/"
    presence: optional
    tracked: tracked
    tier: e2e
    allows: ["<name>.ts"]    # plain kebab names, like platform/primitives (BE-CONVENTION 1.11 names primitives/time.ts): the world's inlined test helpers (poll, free-ports)
    tests: none
    why: the helpers the test world needs (polling, free ports, transports), inlined so the world imports no other repository; a bare <name>.ts entry in allows is what admits a plain name in BE_SOURCE_FORM
  - id: be.tests.fixtures
    profiles: [be]
    path: "src/tests/fixtures/"
    presence: optional
    tracked: tracked
    tier: fixtures
    allows: [i18n/]   # i18n/ is the one folder that may carry localized text
    tests: none
    why: payload fixtures with a role suffix (the doubles come from @starci/jest-preset, not from here); the test data builders live in its builders/ slot; importable by unit specs, integration and e2e; never imports a feature
  - id: be.tests.fixtures.builders
    profiles: [be]
    path: "src/tests/fixtures/builders/*.builder.ts"
    presence: optional
    tracked: tracked
    tier: fixtures
    tests: none
    why: >-
      the ONLY home of test data builders, one <area>.builder.ts per area, shared by every spec of that area: pure object builders
      (commissionRow(overrides), accrueInput(overrides)) for unit specs and persisting builders (orderBuilder(world.db.primary).pending().build(overrides))
      for integration and e2e; arrange only, constraints on, deterministic defaults. A .builder.ts anywhere else, and a *.repository.ts,
      *.fixture.ts or *.factory.ts anywhere, is a BE_SOURCE_FORM finding
    rules: [BE_SOURCE_FORM]
  - id: be.tests.fixtures.i18n
    profiles: [be]
    path: "src/tests/fixtures/i18n/"
    presence: optional
    tracked: tracked
    tier: fixtures
    allows: ["<name>.<role>.ts"]   # data files that deliberately carry localized text (a real Vietnamese string a parser or formatter must accept); no specs here
    tests: none
    why: the ONLY test-fixture location where Vietnamese or another language may appear in source (LANG_NOT_ENGLISH); placement is the marker, there is no comment pragma
  - id: be.tests.integration
    profiles: [be]
    path: "src/tests/integration/<capability>/*.integration-spec.ts"
    presence: optional
    tracked: tracked
    tier: e2e
    tests: e2e
    why: one capability module through useTestWorld({ modules }), no HTTP door of ours (SQL, transactions, concurrency, inbox claims on the real database; and every integration client, `<capability>` being its provider folder, against our real infra, a real peer app or the library fake at the network edge, with its success, its ErrorCode refusal mapping and an outage through the world, R112); run by test:integration
    rules: [BE_TEST_TOPOLOGY, BE_INTEGRATION_SPEC_MISSING]
  - id: be.tests.e2e
    profiles: [be]
    path: "src/tests/e2e/<area>/*.e2e-spec.ts"
    presence: optional
    tracked: tracked
    tier: e2e
    tests: e2e
    why: flow e2e through useTestWorld({ apps }); external services are the world's network fakes; run by test:e2e
    rules: [HFS_CI_E2E_AUTOMATIC, BE_TEST_TOPOLOGY, BE_E2E_FLOW]
  - id: be.tests.contract
    profiles: [be]
    path: "src/tests/contract/<provider>/*.contract-spec.ts"
    presence: optional
    tracked: tracked
    tier: e2e
    tests: e2e
    why: provider sandbox contracts, skipped without sandbox config; run only by test:contract, never part of test or test:e2e
    rules: [BE_TEST_TOPOLOGY]
  - id: be.tests.e2e-world-retired
    profiles: [be]
    path: "src/tests/e2e/world/"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "src/tests/world/ (the only test infrastructure location; e2e/<area>/ holds only *.e2e-spec.ts)"

  # ----- FE: apps ----------------------------------------------------------------------------------------
  - id: fe.app.next
    profiles: [fe]
    # Each fe app is an npm workspace: its package.json is @<project>/<app> with its own runtime dependencies and the fixed
    # workspace scripts (HFS_MONO_FE_WORKSPACE); turbo runs them.
    path: "apps/<app>/{package.json,next.config.ts,tsconfig.json,postcss.config.mjs}"
    appKind: next
    presence: required
    tracked: tracked
    tier: none
    minInstances: 1
    requires: [package.json, next.config.ts, tsconfig.json, postcss.config.mjs, src/app/, src/modules/i18n/,
               "src/app/global-error.tsx", "src/app/[locale]/layout.tsx", "src/app/[locale]/error.tsx", "src/app/[locale]/not-found.tsx", "src/app/[locale]/loading.tsx"]
    tests: none
    rules: [FE_APP_ISOLATION, FE_ERROR_BOUNDARY_MISSING, FE_NEXT_CONVENTIONS, HFS_MONO_FE_WORKSPACE, HFS_MONO_WORKSPACE_DEP]
  - id: fe.app-optional
    profiles: [fe]
    path: "apps/<app>/public/"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
  - id: fe.route
    profiles: [fe]
    path: "apps/<app>/src/app/"
    presence: required
    tracked: tracked
    tier: route
    allows: ["[locale]/**/{page,layout,template,loading,error,not-found,default}.tsx", "[locale]/**/route.ts", "[locale]/providers.tsx",
             global-error.tsx, page.tsx,   # the root page.tsx only redirects (FE_ROUTE_FILES_THIN)
             not-found.tsx, layout.tsx,    # next-intl: a request outside every locale renders the root not-found inside a root layout
             "health/{live,ready}/route.ts", "api/**/route.ts", "_*/**", providers.tsx, globals.css,
             "{icon,favicon,apple-icon,opengraph-image,twitter-image}.*", robots.ts, sitemap.ts, manifest.ts]
    # providers.tsx (root or [locale]) is the client wrapper the server layout renders around its children to host context providers.
    roles: {page: page.tsx, layout: layout.tsx, template: template.tsx, loading: loading.tsx, error: error.tsx, not-found: not-found.tsx, default: default.tsx, route: route.ts, global-error: global-error.tsx, providers: providers.tsx}
    tests: none
    rules: [FE_ROUTE_FILES_THIN, FE_CLIENT_BOUNDARY, FE_OWNER_REACHABLE]
  - id: fe.source-root-pinned
    profiles: [fe]
    path: "apps/<app>/src/{proxy.ts,instrumentation.ts,instrumentation-client.ts}"
    presence: optional
    tracked: tracked
    tier: route
    roles: {proxy: proxy.ts, instrumentation: instrumentation.ts, instrumentation-client: instrumentation-client.ts}
    tests: none
    rules: [FE_NEXT_CONVENTIONS]   # middleware.ts is refused on Next >= 16 (fe.source-root-retired)
  - id: fe.source-root-retired
    profiles: [fe]
    path: "apps/<app>/src/{middleware.ts,middleware.js}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "apps/<app>/src/proxy.ts: Next >= 16 renamed middleware to proxy and refuses the old name"
    rules: [FE_NEXT_CONVENTIONS]
  - id: fe.feature
    profiles: [fe]
    path: "apps/<app>/src/features/{pages,layouts,overlays}/<name>/"
    presence: required
    tracked: tracked
    tier: feature
    owner: true
    kinds: [pages, layouts, overlays]
    requires: [index.tsx]
    allows: [index.tsx, component.tsx, classNames.ts]
    roles: {entry: index.tsx, drawing: component.tsx, styles: classNames.ts}   # the connected entry, the pure drawing half and the styling declarations of a component owner
    tests: none
    budget: {component.tsx: 300, index.tsx: 200, dataHooks: 6, useState: 6}
    rules: [FE_SIZE_BUDGET, FE_OWNER_REACHABLE, FE_I18N_LITERAL]
  - id: fe.components
    profiles: [fe]
    path: "apps/<app>/src/components/{blocks,composites,branches,leaves}/<name>/"
    presence: optional
    tracked: tracked
    tier: components
    owner: true
    layers: [blocks, composites, branches, leaves]   # a layer imports only the layers after it
    requires: [index.tsx]
    allows: [index.tsx, component.tsx, classNames.ts]
    roles: {entry: index.tsx, drawing: component.tsx, styles: classNames.ts}   # the connected entry, the pure drawing half and the styling declarations of a component owner
    tests: none
    budget: {component.tsx: 300, index.tsx: 200, dataHooks: 6, useState: 6}
    rules: [FE_CONNECTED_BLOCK_RENDER_PAIR, FE_I18N_LITERAL, FE_NATIVE_FORM_CONTROL, FE_CLIENT_BOUNDARY]
  - id: fe.hooks
    profiles: [fe]
    path: "apps/<app>/src/hooks/<domain>/"
    presence: optional
    tracked: tracked
    tier: hooks
    owner: true                   # a domain is an owner: other domains import it through index.ts only
    requires: [index.ts]
    allows: [index.ts, "use<name>.ts", "<domain>.shared.ts"]   # React hooks only; <domain>.shared.ts = sanctioned non-hook helpers
    roles: {entry: index.ts, shared: "<domain>.shared.ts"}
    tests: none
    budget: {file: 200, dataHooks: 6, useState: 6}
    rules: [FE_HOOKS_ARE_HOOKS, FE_DATA_FRESHNESS]
  - id: fe.modules
    profiles: [fe]
    path: "apps/<app>/src/modules/<capability>/"
    presence: required
    tracked: tracked
    tier: modules
    owner: true
    requiredInstances: {capability: [config, i18n, routes]}
    requires: [index.ts]
    tests: none
    budget: {file: 400}
    rules: [FE_ENV_OWNER, FE_TRANSPORT_OWNER]
  - id: fe.modules.api
    profiles: [fe]
    path: "apps/<app>/src/modules/api/"
    presence: optional
    tracked: tracked
    tier: transport
    # The app's reads of the one client. A repository has exactly ONE transport client and ONE Outcome union: the app's
    # client.ts/outcome.ts (fe.transport.client/outcome) in a one-app repository, or the api package's
    # (fe.package.api.client/outcome) when the repository shares it (FE_TRANSPORT_OWNER, machine).
    requires: [index.ts]
    allows: [index.ts, client.ts, outcome.ts, "<domain>/read-*.ts", "<domain>/*.graphql", "<domain>/<domain>.mapper.ts", __generated__/]
    roles: {entry: index.ts, reader: "read-*.ts"}   # a reader is a server module (FE_CLIENT_REACHES_SERVER)
    tests: none
    rules: [FE_TRANSPORT_OWNER, FE_HTTP_STATUS_COLLAPSE, FE_WIRE_GENERATED]
  - id: fe.transport.client
    profiles: [fe]
    path: "apps/<app>/src/modules/api/client.ts"
    presence: optional
    tracked: tracked
    tier: transport
    tests: none
    why: the one fetch of a one-app repository (timeout, abort, 401/403 -> refused); a shared client is fe.package.api.client
    rules: [FE_TRANSPORT_OWNER]
  - id: fe.transport.outcome
    profiles: [fe]
    path: "apps/<app>/src/modules/api/outcome.ts"
    presence: optional
    tracked: tracked
    tier: transport
    tests: none
    why: the one Outcome union of a one-app repository; a shared union is fe.package.api.outcome
    rules: [FE_HTTP_STATUS_COLLAPSE]
  - id: fe.modules.config
    profiles: [fe]
    path: "apps/<app>/src/modules/config/"
    presence: required
    tracked: tracked
    tier: foundation
    tests: none
    why: the only reader of process.env and NEXT_PUBLIC_*; fails fast, no localhost fallback
  - id: fe.modules.i18n
    profiles: [fe]
    path: "apps/<app>/src/modules/i18n/"
    presence: required
    tracked: tracked
    tier: foundation
    # The app's i18n module: its catalogs and the one call of the repository's i18n factory. The next-intl stack (routing,
    # navigation, request config) is written once per repository: in the i18n package (fe.package.i18n, `createAppI18n`)
    # when the repository has one, else in the only app's module.
    requires: [index.ts]
    tests: none
    rules: [FE_I18N_PLACEMENT, FE_I18N_CATALOG]
  - id: fe.modules.brand
    profiles: [fe]
    path: "apps/<app>/src/modules/brand/brand.css"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    why: the ONLY app file that may hold colour values; sets grammar brand tokens only, light and dark
    rules: [FE_STYLE_TOKEN_ONLY]
  - id: fe.modules.routes
    profiles: [fe]
    path: "apps/<app>/src/modules/routes/"
    presence: required
    tracked: tracked
    tier: foundation
    tests: none
    why: every href builder; FE_HREF_RESOLVES checks each against app/
  - id: fe.modules.types
    profiles: [fe]
    path: "apps/<app>/src/modules/types/"
    presence: optional
    tracked: tracked
    tier: foundation
    tests: none
    why: shared types with no runtime behaviour; a component may import them
  - id: fe.package.ui
    profiles: [fe]
    path: "packages/<family>-ui/"
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    kinds: [composites, branches, leaves]   # the layer folders under src/ (a package owns no blocks)
    roles: {entry: index.tsx, drawing: component.tsx, styles: classNames.ts}
    requires: [package.json, src/index.ts, tsconfig.json]
    tests: none
    budget: {component.tsx: 300, index.tsx: 200, dataHooks: 6, useState: 6}
    why: built to dist with explicit named exports; only composites, branches and leaves; no unused export; no colour literal
    rules: [FE_PACKAGE_SHAPE, HFS_UNUSED_EXPORT, FE_STYLE_TOKEN_ONLY]
  - id: fe.package.api
    profiles: [fe]
    path: "packages/<family>-api/"
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    requires: [package.json, src/index.ts, src/client.ts, src/outcome.ts, tsconfig.json]
    tests: none
    why: the one transport client and the one Outcome union shared by every app of the repository; no app keeps its own
    rules: [FE_TRANSPORT_OWNER, FE_PACKAGE_SHAPE, HFS_UNUSED_EXPORT]
  - id: fe.package.api.client
    profiles: [fe]
    path: "packages/<family>-api/src/client.ts"
    presence: optional     # enabled with its package (fe.package.api is the opt-in)
    tracked: tracked
    tier: package
    tests: none
    why: the repository's one fetch (timeout, abort, 401/403 -> refused)
    rules: [FE_TRANSPORT_OWNER]
  - id: fe.package.api.outcome
    profiles: [fe]
    path: "packages/<family>-api/src/outcome.ts"
    presence: optional     # enabled with its package (fe.package.api is the opt-in)
    tracked: tracked
    tier: package
    tests: none
    why: the repository's one Outcome union
    rules: [FE_HTTP_STATUS_COLLAPSE]
  - id: fe.package.i18n
    profiles: [fe]
    path: "packages/<family>-i18n/"
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    requires: [package.json, src/index.ts, tsconfig.json]
    tests: none
    why: the next-intl stack (routing, navigation, request config) written once, exported as the createAppI18n factory every app calls
    rules: [FE_I18N_PLACEMENT, FE_PACKAGE_SHAPE, HFS_UNUSED_EXPORT]

# Checks that read this manifest (all ship from .claude; none keeps its own path list)
consumers:
  - scripts/hfs/slots.mjs                  # the loader every consumer below goes through
  - scripts/hfs/check.mjs                  # hfs check: HFS_SLOT_* / tracked / external, the side view per side
  - scripts/hfs/architecture.mjs            # tiers, direction matrix, cycles, reachability
  - packages/eslint/be starciBeConfig({hfs})   # file globs for rules come from slots
  - packages/eslint/fe starciFeConfig({hfs})
  - packages/stylelint                         # @starci/stylelint-canon: colour and brand allowances from fe.modules.brand
  - packages/hfs/sync                          # renders managedBy templates (hfs sync) and judges them (hfs check)
  - modules/kernel/failure-codes.yaml          # every rule id listed above has a Vietnamese why
