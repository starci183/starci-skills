{{header}}
name: ci

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov upload authenticate with GitHub's OIDC token: no repository secret, no silent skip.
    permissions:
      contents: read
      id-token: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{nodeMajor}}
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint -- --sonar reports/lint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: unit
        run: npm test -- --ci
      - name: coverage upload
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        with:
          use_oidc: true
          files: {{lcovReport}}
          disable_search: true
          fail_ci_if_error: true
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
      - uses: SonarSource/sonarqube-scan-action@v7
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
