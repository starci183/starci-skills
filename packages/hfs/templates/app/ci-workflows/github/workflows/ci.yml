{{header}}
name: ci

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov upload authenticate with GitHub's OIDC token: no repository secret, no silent skip.
    permissions:
      contents: read
      id-token: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: {{nodeMajor}}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lint
        run: npm run lint -- --sonar reports/lint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: unit
        run: npm test -- --ci
      - name: coverage upload
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        with:
          use_oidc: true
          files: {{lcovReport}}
          disable_search: true
          fail_ci_if_error: true
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
{{> app/ci-workflows/sonar-steps.yml}}
