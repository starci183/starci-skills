{{header}}
name: ci

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    timeout-minutes: 20
    runs-on: ubuntu-latest
{{sonarEnv}}
    steps:
{{> app/ci-workflows/install-steps.yml}}
{{> app/ci-workflows/lint-base.yml}}
      - name: production dependency audit
        run: {{auditCommand}}
{{ciLintSteps}}
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck

  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
{{> app/ci-workflows/install-steps.yml}}
{{> app/ci-workflows/jest-cache.yml}}
      - name: unit
        run: npm test -- --ci --forceExit --cacheDirectory .jest-cache
      - name: coverage proof
        run: {{ciCoverageProof}}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('{{lcovReport}}') != ''
        with:
          name: {{lcovArtifact}}
          path: {{lcovReport}}
{{codecovSteps}}

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: build be
        run: npm run build:be
{{ciBuildSteps}}

{{sonarJob}}
