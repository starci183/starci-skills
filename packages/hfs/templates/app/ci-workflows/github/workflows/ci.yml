{{header}}
name: ci

# The release candidate ref first (starci app release push waits for this run of the release sha before the branch and the tag move), then the tag.
on:
  push:
    branches: ["release/candidate-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# The job shape of the StarCi CI standard (knowledge/hfs/ci-standard.yaml): fast, lint per side, the unit run in shards, one coverage merge, build,
# and sonar. Timeouts and the shard count come from ci.jobs of .starcistacks/application-stacks.yaml (defaults in the standard).
jobs:
  fast:
    timeout-minutes: {{timeoutFast}}
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: production dependency audit
        run: {{auditCommand}}
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck

  lint:
    timeout-minutes: {{timeoutLint}}
    runs-on: ubuntu-latest
{{sonarEnv}}
    strategy:
      fail-fast: false
      matrix:
        side: [be, fe]
    steps:
{{> app/ci-workflows/install-steps.yml}}
{{> app/ci-workflows/lint-base.yml}}
{{ciLintSteps}}

  test:
    timeout-minutes: {{timeoutTest}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: {{testShards}}
    steps:
{{> app/ci-workflows/install-steps.yml}}
{{> app/ci-workflows/jest-cache.yml}}
      # A shard (STARCI_COVERAGE_SHARD=1, the jest preset) measures only the files its specs load, without the per-file threshold, and writes istanbul
      # JSON; the coverage job merges the shards by source location and proves 100 per file on the merged report. A small suite may leave a shard empty.
      - name: unit
        run: npm test -- --ci --forceExit --cacheDirectory .jest-cache --shard=${{ matrix.shard }}/{{testShardTotal}} --passWithNoTests --coverageThreshold={}
        env:
          STARCI_COVERAGE_SHARD: "1"
{{> app/ci-workflows/jest-cache-save.yml}}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('{{shardCoverageReport}}') != ''
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: {{shardCoverageReport}}

  coverage:
    needs: test
    timeout-minutes: {{timeoutCoverage}}
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: {{lcovShardsDir}}
      - name: merge coverage
        run: npx starci app coverage merge --out {{lcovReport}} {{lcovShardsDir}}
      - name: coverage proof
        run: {{ciCoverageProof}}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('{{lcovReport}}') != ''
        with:
          name: {{lcovArtifact}}
          path: {{lcovReport}}
{{codecovSteps}}

  build:
    timeout-minutes: {{timeoutBuild}}
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: build be
        run: npm run build:be
{{ciBuildSteps}}
{{> app/ci-workflows/build-cache-save.yml}}

{{sonarJob}}
