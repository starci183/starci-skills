schema: starci/application-stacks@1
sources:
  - repository: "{{project}}"
components:
  supabase-postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    role: stateful
    compose: infra/compose/postgres.yaml
    purpose: The pinned PostgreSQL-compatible database behind the Supabase project.
    required: true
  api:
    image: "{{project}}/api:0.0.0"
    role: service
    compose: infra/compose/api.yaml
    purpose: The Nest API that owns privileged and cross-tenant operations.
    required: true
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      supabase-postgres: { port: 5432 }
      api: { port: 3001 }
    runbook: README.md
    secrets: []
k8s:
  status: deferred
  reason: The upgrade establishes the full local stack first; deployment topology is selected separately.
ci:
  secrets:
    - {name: SONAR_TOKEN, scope: repository, purpose: Sonar analysis token provisioned for this app, optional: true}
    - {name: SOPS_AGE_KEY, scope: repository, purpose: Decrypt app members during deployment, optional: true}
    - {name: VPS_SSH_KEY, scope: repository, purpose: Deployment SSH key, optional: true}
    - {name: VPS_KNOWN_HOSTS, scope: repository, purpose: Pinned deployment SSH host keys, optional: true}
  vars:
    - {name: SONAR_HOST_URL, scope: repository, value: "https://sonar.{{project}}.example.invalid", purpose: Documentation endpoint to replace with this app's public Sonar host, optional: true}
    - {name: VPS_HOST, scope: repository, value: 203.0.113.10, purpose: Documentation deployment address to replace before use, optional: true}
    - {name: VPS_USER, scope: repository, value: deploy, purpose: Documentation deployment user to replace before use, optional: true}
services:
  sonar:
    provider: sonarqube
    mode: disabled
    reason: Enable the repository's Sonar service when a host and project token are provisioned.
    qualityGate: starci-quality
    credentials: []
    projects: [{repository: "{{project}}", key: "{{project}}"}]
    ci: {wiring: optional-follow-up, workflow: .github/workflows/ci.yml, token: SONAR_TOKEN, hostVar: SONAR_HOST_URL}
    ownerAction: none
  codecov:
    provider: codecov
    mode: hosted
    purpose: Report application coverage through GitHub OIDC.
    auth: oidc
    target: 100
    components: auto
    required: true
    ci: {wiring: optional-follow-up, workflow: .github/workflows/ci.yml}
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Keep application dependencies and workflow actions current.
    ecosystems: [npm, docker, github-actions]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Refuse high severity production dependency vulnerabilities.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
  container-registry:
    provider: ghcr
    mode: hosted
    purpose: Publish this app's deployment images with the workflow GitHub token.
    host: {public: https://ghcr.io}
    auth: github-token
    projects: [{repository: "{{project}}", key: "{{project}}"}]
    ci: {wiring: optional-follow-up, workflow: .github/workflows/images.yml}
    ownerAction: none
