{{header}}
name: ci

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
{{sonarEnv}}
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: production dependency audit
        run: {{auditCommand}}
{{ciLintSteps}}
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: unit
        run: npm test -- --ci
      - name: coverage proof
        run: {{ciCoverageProof}}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('{{lcovReport}}') != ''
        with:
          name: {{lcovArtifact}}
          path: {{lcovReport}}
{{codecovSteps}}

  build:
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
      - name: database migration checks
        run: {{ciDatabaseLint}}

{{sonarJob}}

  db-types:
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
      - name: start Supabase
        run: npm run db:start
      - name: apply migrations
        run: npm run db:reset
      - name: regenerate database types
        run: npm run db:types
      - name: database types are committed
        run: git diff --exit-code -- supabase/types/database.types.ts
      - name: stop Supabase
        if: always()
        run: npm run db:stop
