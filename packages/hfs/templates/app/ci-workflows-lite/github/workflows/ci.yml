{{header}}
name: ci

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: {{nodeMajor}}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lint
        if: env.SONAR_TOKEN == ''
        run: npm run lint
      - name: lint with Sonar import
        if: env.SONAR_TOKEN != ''
        run: npm run lint -- --sonar reports/lint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
      - name: database migration checks
        run: npm run db:lint
{{> app/ci-workflows/sonar-steps.yml}}

  db-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: {{nodeMajor}}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: start Supabase
        run: npm run db:start
      - name: apply migrations
        run: npm run db:reset
      - name: regenerate database types
        run: npm run db:types
      - name: database types are committed
        run: git diff --exit-code -- supabase/types/database.types.ts
      - name: stop Supabase
        if: always()
        run: npm run db:stop
