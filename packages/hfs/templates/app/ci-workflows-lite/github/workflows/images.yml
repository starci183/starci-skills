{{header}}
# Builds each image declared by the lite app. The API image is required; a front-end image is emitted only when declared.
# It runs on the release tag, so every image is built there, and never pushes.
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
{{imageMatrix}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: {{imageProject}}/${{ matrix.name }}:ci
          # OCI keeps the SBOM and provenance attestations without publishing to a registry.
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.name }}.oci.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: retain image with SBOM and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.name }}.oci.tar
          if-no-files-found: error
          compression-level: 0
