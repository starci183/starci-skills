{{> app/quality-config/sonar-base.properties}}
sonar.tests=be/apps,be/src
sonar.exclusions={{sonarExclusions}}
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.tsconfigPaths={{tsconfigPaths}}
sonar.externalIssuesReportPaths=reports/lint.sonar.json
sonar.javascript.lcov.reportPaths={{lcovReport}}
sonar.coverage.exclusions={{coverageExclusions}}
sonar.nodejs.maxspace=8192
