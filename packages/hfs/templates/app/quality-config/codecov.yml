{{header}}
# The be unit run's lcov ({{lcovReport}}), uploaded by the managed CI workflow. Coverage is the services' alone: the status
# paths are the one coverage scope hfs sync renders into sonar.coverage.inclusions too, held at 100 on the project and on
# the patch. fe/ is outside coverage (a front end has no tests).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        paths:
{{codecovPaths}}
    patch:
      default:
        target: 100%
        threshold: 0%
        paths:
{{codecovPaths}}
ignore:
  - "fe/**"
