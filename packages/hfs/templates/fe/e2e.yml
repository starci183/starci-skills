# End-to-end runs are manual: nothing triggers this workflow but a person dispatching it.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{nodeMajor}}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e
        run: npm run test:e2e
