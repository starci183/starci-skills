sonar.projectKey={{sonarKey}}
sonar.host.url=https://sonar.starci.org
sonar.sourceEncoding=UTF-8
sonar.sources=apps
sonar.tests=apps
sonar.exclusions={{sonarExclusions}}
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions={{sonarCoverageExclusions}}
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths={{tsconfigPaths}}
sonar.nodejs.maxspace=8192
