{{header}}
sonar.projectKey={{sonarKey}}
sonar.sourceEncoding=UTF-8
sonar.sources=apps
sonar.tests=apps
sonar.exclusions={{sonarExclusions}}
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions={{sonarCoverageExclusions}}
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths={{tsconfigPaths}}
sonar.eslint.reportPaths=reports/eslint.json
sonar.externalIssuesReportPaths=reports/hfs.sonar.json,reports/stylelint.sonar.json
sonar.nodejs.maxspace=8192
