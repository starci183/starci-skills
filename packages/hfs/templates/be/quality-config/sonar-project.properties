{{header}}
sonar.projectKey={{sonarKey}}
sonar.sourceEncoding=UTF-8
sonar.sources=apps,src
sonar.tests=apps,src
sonar.exclusions={{sonarExclusions}}
sonar.test.inclusions=**/*.spec.ts
sonar.coverage.exclusions={{sonarCoverageExclusions}}
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint.json
sonar.externalIssuesReportPaths=reports/hfs.sonar.json
sonar.nodejs.maxspace=8192
