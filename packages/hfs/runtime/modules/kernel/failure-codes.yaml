HFS_CANON_PIN_DRIFT:
  title: "Dependency version differs from the canon pin"
  title_vi: "Phiên bản phụ thuộc lệch khỏi bản đã ghim"
  meaning_vi: "Một phụ thuộc trong package.json không đúng phiên bản chính xác mà knowledge/hfs/canon-pins.yaml ghim cho cả họ kho; @starci/grammar phải được cài từ npm registry đúng phiên bản đã ghim (không dùng file:), còn các gói @starci khác được cài bằng starci link."
  causes_vi:
    - "Phiên bản viết dạng khoảng (^, ~) thay vì phiên bản chính xác"
    - "Một workspace giữ phiên bản cũ của cùng phụ thuộc"
    - "@starci/grammar khai báo dạng file: hoặc khoảng phiên bản thay vì phiên bản chính xác trên registry"
    - "Gói @starci khác chưa được starci link nên bản chép trong .starci/packages thiếu hoặc cũ"
  nextStep_vi: "Đặt phụ thuộc về đúng phiên bản ghim (@starci/grammar: phiên bản chính xác từ registry) hoặc chạy lại starci link cho các gói @starci khác, rồi cài lại. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DECLARATION_INVALID:
  title: "hfs.json missing or invalid"
  title_vi: "hfs.json thiếu hoặc sai định dạng"
  meaning_vi: "Kho mã không có tệp hfs.json hợp lệ nên không thể biết nó theo chuẩn HFS nào, có những ứng dụng nào và bật những ô tuỳ chọn nào."
  causes_vi:
    - "Thiếu tệp hfs.json ở gốc kho, hoặc tệp không đọc được như JSON"
    - "Loại ứng dụng không có trong bảng kê của HFS, ví dụ một loại ứng dụng do kho tự đặt"
    - "optionalSlots ghi một ô không phải loại tuỳ chọn, hoặc ghi một ô mà loại ứng dụng đã tự bật"
    - "Thiếu loại ứng dụng bắt buộc, ví dụ chưa khai ứng dụng api hoặc chưa khai ứng dụng migrate dù đã khai kết nối cơ sở dữ liệu"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa hfs.json theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORBIDDEN_PRESENT:
  title: "Tracked path in a forbidden slot"
  title_vi: "Có tệp bị cấm trong cây mã nguồn"
  meaning_vi: "Tệp được theo dõi nằm trong một ô bị cấm (bộ nhớ đệm công cụ, đầu ra của tác tử, worktree, tệp bí mật dạng rõ). Ô này quy định nơi tệp phải ở, ngoài kho."
  causes_vi:
    - "Tác tử để lại tệp tạm hoặc báo cáo ở gốc kho rồi bị commit"
    - "Tệp .env hoặc khoá bí mật dạng rõ nằm trong kho"
    - "Thư mục e2e ở gốc thay vì src/tests/e2e"
  nextStep_vi: "Chuyển tệp tới nơi ô đó chỉ định (trường goesTo) hoặc xoá nó, rồi gỡ khỏi Git; tệp bí mật phải được niêm phong đúng chỗ, không bao giờ để dạng rõ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_INIT_EXISTS:
  title: "hfs.json already exists"
  title_vi: "hfs.json đã có sẵn"
  meaning_vi: "Lệnh hfs init không ghi đè bản khai báo đã có vì bản đó là quyết định của kho."
  causes_vi:
    - "Chạy hfs init trong kho đã có hfs.json"
  nextStep_vi: "Sửa hfs.json trực tiếp, hoặc dùng hfs init --stdout để xem bản dò tự động rồi so sánh."
  owner: op-retry
  kind: verb-refusal

HFS_INIT_UNDETECTED:
  title: "Repository profile or apps not detected"
  title_vi: "Không dò được loại kho hoặc ứng dụng"
  meaning_vi: "Lệnh hfs init không xác định chắc chắn kho là backend hay frontend, hoặc không thấy ứng dụng nào dưới apps/ để khai báo, nên không đoán mò."
  causes_vi:
    - "Không có next hay @nestjs/core trong phụ thuộc, hoặc có cả hai"
    - "Kho chưa có thư mục apps/<tên>/ (Nest cần thêm src/, Next cần next.config)"
  nextStep_vi: "Tạo bố cục apps/<tên>/ theo chuẩn hoặc viết hfs.json bằng tay theo modules/schemas/hfs-repo.schema.yaml."
  owner: op-retry
  kind: verb-refusal

HFS_MANIFEST_INVALID:
  title: "HFS slot manifest invalid"
  title_vi: "Bảng kê ô HFS sai định dạng"
  meaning_vi: "Tệp knowledge/hfs/slots.yaml của bộ chạy không đọc được hoặc vi phạm lược đồ của nó, nên mọi kiểm tra HFS bị từ chối chứ không chạy trên một bảng kê hỏng."
  causes_vi:
    - "Một ô thiếu trường bắt buộc, dùng giá trị ngoài danh sách cho phép hoặc trùng mã với ô khác"
    - "Ma trận hướng import nhắc tới một tầng không tồn tại"
    - "Hai ô cùng khai một mẫu đường dẫn, hoặc một ô đã ngừng dùng mà không chỉ ra ô kế nhiệm"
  nextStep_vi: "Đây là lỗi của bộ chạy, không phải của sản phẩm; người giám sát sửa knowledge/hfs/slots.yaml qua một nhánh đã được duyệt, sản phẩm không tự sửa."
  owner: supervisor
  kind: check-finding

HFS_MANIFEST_MAJOR_MISMATCH:
  title: "hfs.json pins another manifest major"
  title_vi: "Phiên bản chính của bảng kê không khớp"
  meaning_vi: "Trường hfs trong hfs.json ghim một phiên bản chính khác với bảng kê ô của bộ chạy. HFS không có giai đoạn tương thích: khi phiên bản chính mới được nạp thì phiên bản chính cũ bị từ chối ngay."
  causes_vi:
    - "Bộ chạy đã lên phiên bản chính mới của bảng kê nhưng kho chưa được di chuyển sang"
    - "hfs.json ghi số phiên bản chính sai hoặc chép từ một kho khác"
  nextStep_vi: "Chủ sở hữu duyệt một nhánh di chuyển cho kho này rồi mới đổi số hfs; không có cách bỏ qua hay giữ song song hai phiên bản."
  owner: owner
  kind: check-finding

HFS_MIN_INSTANCES:
  title: "Fewer instances of a slot than required"
  title_vi: "Số thực thể của ô ít hơn mức tối thiểu"
  meaning_vi: "Một ô đòi có ít nhất một số thực thể (ví dụ ít nhất một tính năng trong src/features) nhưng kho có ít hơn."
  causes_vi:
    - "Kho chưa có tính năng nào đúng mẫu src/features/<tên>/"
    - "Toàn bộ mã nghiệp vụ nằm ở chỗ ngoài mẫu nên không được tính"
  nextStep_vi: "Chuyển mã nghiệp vụ vào thực thể đúng mẫu của ô hoặc tạo thực thể còn thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_PATH_NO_SLOT:
  title: "Path matches no HFS slot"
  title_vi: "Đường dẫn không khớp ô nào của HFS"
  meaning_vi: "Một tệp hoặc thư mục trong kho không thuộc ô nào trong bảng kê; mọi đường dẫn được theo dõi phải khớp đúng một ô. Bộ kiểm tra báo kèm ô gần nhất để biết tệp lẽ ra thuộc đâu."
  causes_vi:
    - "Tệp đặt sai chỗ, ví dụ một tệp không phải *.e2e-spec.ts nằm trong thư mục kiểm thử e2e"
    - "Thư mục do kho tự đặt ở gốc hoặc trong src mà HFS không có ô cho nó"
    - "Tên tệp hoặc thư mục viết sai so với mẫu của ô gần nhất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển tệp vào ô gần nhất được báo hoặc xoá nó; nếu thực sự cần một loại nội dung mới thì đó là việc thêm ô vào bảng kê, do người giám sát làm, không phải kho tự thêm."
  owner: op-retry
  kind: check-finding

HFS_REPO_UNREADABLE:
  title: "Repository is not a readable Git work tree"
  title_vi: "Không đọc được kho Git"
  meaning_vi: "Bộ kiểm tra HFS chỉ xét những gì Git theo dõi nên cần một cây làm việc Git đọc được; thư mục được chỉ định thì không."
  causes_vi:
    - "Đường dẫn --repo sai hoặc không phải kho Git"
    - "Git chưa cài hoặc kho bị hỏng"
  nextStep_vi: "Trỏ --repo vào gốc một kho Git hợp lệ rồi chạy lại."
  owner: op-retry
  kind: input-invalid

HFS_REQUIRED_MISSING:
  title: "Required file or directory missing"
  title_vi: "Thiếu tệp hoặc thư mục bắt buộc"
  meaning_vi: "Một ô bắt buộc (hoặc một thực thể của ô, như một ứng dụng hay một tính năng) đòi có tệp hoặc thư mục này nhưng nó không nằm trong những gì Git theo dõi."
  causes_vi:
    - "Tính năng thiếu index.ts, tệp module hoặc thư mục application"
    - "Ứng dụng thiếu main.ts, app.module.ts hoặc spec ghép ứng dụng"
    - "Kho thiếu tệp gốc bắt buộc như README.md, hfs.json, .starciwork, .starcistacks"
  nextStep_vi: "Tạo tệp hoặc thư mục theo mẫu của ô rồi commit; tệp chưa git add vẫn tính là thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SIZE_SOFT_BACKLOG:
  title: "Source file above the soft size"
  title_vi: "Tệp mã vượt cỡ mềm (chỉ báo cáo)"
  meaning_vi: "Tệp mã nguồn dài hơn ngưỡng mềm của ruleParams.fileLines.soft. Đây là danh mục việc cần tách dần, chỉ báo cáo và không bao giờ làm bộ kiểm tra thất bại."
  causes_vi:
    - "Tệp tích tụ qua nhiều lần sửa mà chưa được tách"
  nextStep_vi: "Không cần hành động ngay; khi sửa tệp này, tách theo trách nhiệm để không tăng thêm. Quy tắc tăng trưởng HFS_SIZE_GROWTH mới là chỗ chặn tệp vượt ngưỡng lớn thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_AMBIGUOUS:
  title: "Path owned equally by two slots"
  title_vi: "Đường dẫn thuộc hai ô cùng mức cụ thể"
  meaning_vi: "Hai ô của bảng kê cùng khớp một đường dẫn với độ cụ thể bằng nhau nên không xác định được ô nào sở hữu. Đây là chỗ hở của bảng kê, không phải lỗi của kho."
  causes_vi:
    - "Hai mẫu đường dẫn trong bảng kê chồng lên nhau"
    - "Một ô mới thêm chưa loại phần trùng với ô cũ"
  nextStep_vi: "Người giám sát sửa bảng kê để mỗi đường dẫn chỉ có một ô sở hữu; kho không tự xử lý. Bộ kiểm tra chạy lại sau khi bảng kê được sửa."
  owner: op-retry
  kind: check-finding

HFS_SLOT_NOT_ENABLED:
  title: "Path in an opt-in slot the repository did not enable"
  title_vi: "Đường dẫn thuộc ô tuỳ chọn mà kho chưa bật"
  meaning_vi: "Tệp được theo dõi nằm trong một ô loại tuỳ chọn, nhưng hfs.json không liệt kê ô đó trong optionalSlots và không có ứng dụng nào thuộc loại tự bật ô đó."
  causes_vi:
    - "Kho dùng một loại nội dung tuỳ chọn (worker, websocket, tài liệu, gói dùng chung) mà chưa khai báo"
    - "Ứng dụng của loại tương ứng chưa được ghi vào apps của hfs.json"
  nextStep_vi: "Khai báo ô trong optionalSlots hoặc khai ứng dụng đúng loại ở hfs.json nếu nội dung này là thật; nếu không thì chuyển hoặc xoá tệp. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TRACKED_MUST_BE_IGNORED:
  title: "Tracked path that must be gitignored"
  title_vi: "Tệp bị theo dõi nhưng lẽ ra phải bị bỏ qua"
  meaning_vi: "Tệp nằm trong một ô loại ignored (kết quả build, tệp sinh tự động, phụ thuộc) nhưng đã được đưa vào Git."
  causes_vi:
    - "Thư mục dist, coverage, .next hoặc tệp sinh tự động bị git add"
    - ".gitignore thiếu dòng cho thư mục này"
  nextStep_vi: "Gỡ tệp khỏi Git bằng git rm --cached và thêm vào khối .gitignore chuẩn; không xoá thư mục trên đĩa. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding
