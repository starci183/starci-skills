FE_COMPONENT_WORLD_OWNERSHIP:
  title: "Component owns product-world state"
  title_vi: "Thành phần nắm trạng thái của thế giới sản phẩm"
  meaning_vi: "Một thành phần cấp thấp tự giữ dữ liệu, điều hướng, ngôn ngữ hoặc phiên, trong khi chỉ được xử lý tương tác trình duyệt đơn giản."
