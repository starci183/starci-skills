    - "Tệp bị xoá hoặc đổi tên trong lúc dọn dẹp"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để thêm tệp còn thiếu vào đúng src/app hoặc src/app/[locale]; giao diện của các trang này do người thiết kế duyệt."
