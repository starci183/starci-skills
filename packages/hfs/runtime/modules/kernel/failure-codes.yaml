    - "Còn tệp khóa của trình khác"
  nextStep_vi: "Op dựng khung đưa packageManager về npm rồi kiểm tra lại."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_PATH_NO_SLOT:
  title: "Path matches no HFS slot"
  title_vi: "Đường dẫn không khớp ô nào của HFS"
  meaning_vi: "Một tệp hoặc thư mục trong kho không thuộc ô nào trong bảng kê; mọi đường dẫn được theo dõi phải khớp đúng một ô. Bộ kiểm tra báo kèm ô gần nhất để biết tệp lẽ ra thuộc đâu."
  causes_vi:
    - "Tệp đặt sai chỗ, ví dụ một tệp không phải *.e2e-spec.ts nằm trong thư mục kiểm thử e2e"
    - "Thư mục do kho tự đặt ở gốc hoặc trong src mà HFS không có ô cho nó"
    - "Tên tệp hoặc thư mục viết sai so với mẫu của ô gần nhất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển tệp vào ô gần nhất được báo hoặc xoá nó; nếu thực sự cần một loại nội dung mới thì đó là việc thêm ô vào bảng kê, do người giám sát làm, không phải kho tự thêm."
  owner: op-retry
  kind: check-finding

HFS_README_BADGE_NOT_LIVE:
  title: "README badge is not a live service"
  title_vi: "Huy hiệu README không phải dịch vụ ngoài đang chạy"
  meaning_vi: "Một huy hiệu trong README không trỏ tới dịch vụ ngoài HTTPS đang hoạt động."
  causes_vi:
    - "Dùng huy hiệu tĩnh hoặc địa chỉ nội bộ"
    - "Địa chỉ huy hiệu không hợp lệ"
  nextStep_vi: "Op docs.author thay bằng huy hiệu từ dịch vụ ngoài HTTPS thật."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_DESCRIPTION_INVALID:
  title: "README description line invalid"
  title_vi: "Dòng mô tả trong README chưa đúng"
  meaning_vi: "README thiếu một dòng mô tả ngắn ngay dưới tên kho."
  causes_vi:
    - "Không có dòng mô tả dưới tiêu đề"
    - "Mô tả dài nhiều dòng"
