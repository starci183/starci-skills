  causes_vi:
    - "Vi phạm luật R52: Kiểu wire sinh từ ảnh chụp hợp đồng của be (`be/contracts/`, chạy `npm run codegen` ở gốc app); tài liệu GraphQL trong `.graphql`; cấm `as GraphqlResult<T>`; enum wire không phải `string`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_WORLD_OWNER_RENDER_BOUNDARY:
  title: "World-state owner renders inline"
  title_vi: "Nơi giữ trạng thái sản phẩm tự render trực tiếp"
  meaning_vi: "Thành phần đọc trạng thái sản phẩm không giao mọi đường render cho hàm hoặc thành phần thuần đã xác định."
  causes_vi:
    - "Viết JSX trực tiếp trong thành phần đọc dữ liệu"
    - "Chưa có thành phần thuần tương ứng"
  nextStep_vi: "Op interface.implement tách phần hiển thị sang thành phần thuần và giao cho nó."
  owner: other-op:interface.implement
  kind: check-finding

HFS_ALIAS_REEXPORT:
  title: "A declaration re-exported under a second name"
  title_vi: "Xuất lại một khai báo dưới tên thứ hai"
  meaning_vi: "Mã sản xuất dùng `export { X as Y }`, `export { default as Y }`, `export * as ns`, hoặc khai báo xuất `const Y = X`, `type Y = X`, `interface Y extends X {}` chỉ để đặt tên thứ hai cho một khai báo khác của repo: một khai báo có hai tên, nên người đọc và công cụ tìm kiếm phải đoán hai tên là một. Luật áp cho cả backend lẫn frontend."
  causes_vi:
    - "Cửa vào của owner đổi tên một khai báo để tránh trùng tên với khai báo cùng tên ở owner khác"
    - "Đổi tên tạm để giữ tên cũ cho nơi dùng cũ"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đổi tên chính khai báo cho đúng nghĩa, hoặc import và xuất nó bằng tên của nó; không giữ tên cũ song song."
  owner: op-retry
  kind: check-finding

HFS_APPS_REQUIRED:
  title: "Repository has no apps directory"
  title_vi: "Kho mã không có thư mục apps"
  meaning_vi: "Kho HFS phải là monorepo apps/<app>/ và có ít nhất một ứng dụng nhưng chưa có."
  causes_vi:
    - "Chưa tạo thư mục apps"
    - "Mã còn nằm ở gốc kho"
  nextStep_vi: "Op dựng khung (backend.scaffold hoặc interface.scaffold) tạo apps/<app> theo bố cục HFS."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_APP_LAYOUT_INVALID:
  title: "App directory layout invalid"
  title_vi: "Bố cục thư mục ứng dụng chưa đúng"
  meaning_vi: "Mục dưới apps/ không phải thư mục, hoặc thiếu các tệp mà slot của loại ứng dụng đó yêu cầu (requires; ví dụ ứng dụng migrate không cần app.module.ts)."
  causes_vi:
    - "Có tệp lẻ trong apps/"
    - "Ứng dụng thiếu tệp bắt buộc"
  nextStep_vi: "Op dựng khung sửa bố cục ứng dụng theo HFS rồi kiểm tra lại."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_ARCH_CONFIG_UNREAD:
  title: "The machine reads `hfs.json`; zero files analysed is red"
  title_vi: "Máy kiến trúc không đọc được hfs.json"
  meaning_vi: "Kiểm tra kiến trúc không đọc được `hfs.json` phân tích 0 tệp, hoặc repo còn một tệp cấu hình mà máy không đọc nữa (`architecture.json`) — đây là đỏ, không phải 'chưa có dữ liệu'."
  causes_vi:
    - "Vi phạm luật R24: Máy kiến trúc tự đọc `hfs.json`; phân tích 0 tệp hay `unavailable` cho một profile đã khai = thất bại."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CANON_PIN_DRIFT:
  title: "Dependency version differs from the canon pin"
  title_vi: "Phiên bản phụ thuộc lệch khỏi bản đã ghim"
  meaning_vi: "Một phụ thuộc trong package.json không đúng phiên bản chính xác mà knowledge/hfs/canon-pins.yaml ghim cho cả họ kho; mọi gói @starci đều được cài từ npm registry đúng phiên bản đã ghim (không dùng file:)."
  causes_vi:
    - "Phiên bản viết dạng khoảng (^, ~) thay vì phiên bản chính xác"
    - "Một workspace giữ phiên bản cũ của cùng phụ thuộc"
    - "Một gói @starci khai báo dạng file: hoặc khoảng phiên bản thay vì phiên bản chính xác trên registry"
  nextStep_vi: "Đặt phụ thuộc về đúng phiên bản chính xác ghi trong knowledge/hfs/canon-pins.yaml rồi cài lại từ npm registry. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CI_MISSING_CANON:
  title: "CI runs the pinned `hfs lint`; pre-push runs typecheck and lint"
  title_vi: "CI thiếu bước canon"
  meaning_vi: "Workflow/husky thiếu bước `<step>`. Cấu trúc chỉ được kiểm khi agent chạy — CI phải tự kiểm."
  causes_vi:
    - "Vi phạm luật R13: CI phải chạy `hfs lint` (`npm run lint` hoặc `npx @starci/hfs lint`, bản pin); pre-push phải có `typecheck` + `lint`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CONTRACT_SNAPSHOT_DRIFT:
  title: "The be side commits its contract snapshot and it equals the emit"
  title_vi: "Bản hợp đồng lệch bản thật"
  meaning_vi: "Hợp đồng `<file>` lệch bản thật (`<sha>` ≠ `<sha>`). Chạy `npm run contract:emit` ở gốc app rồi commit kết quả. Nếu emit không chạy được thì finding nêu nguyên văn lỗi của emit; không bao giờ bỏ qua âm thầm."
  causes_vi:
    - "Vi phạm luật R23: phía be: `be/contracts/<app>/schema.graphql` và `be/contracts/<app>/openapi.json` (sinh từ bảng thao tác có kiểu `apps/<app>/src/operations.ts`) phải bằng bản `hfs emit-contracts` phát ra ngay lúc kiểm tra (đồ thị module đọc từ mã nguồn, không cần env, DB hay mạng); chỉ chạy ở lượt kiểm tra đầy đủ, `--fast` bỏ qua và nói rõ trong phần coverage. Phía fe đọc thẳng `be/contracts/` (đường đọc chéo duy nhất khai trong hfs.json `sides.fe.reads`), không giữ bản sao."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_COVERAGE_SCOPE_DRIFT:
  title: "A file states a coverage scope the slot manifest does not derive"
  title_vi: "Tệp nêu phạm vi độ phủ khác với phạm vi suy ra từ slot manifest"
  meaning_vi: "Phạm vi độ phủ (những tệp nào bị đo 100% từng tệp) chỉ có một nguồn: trường `coverage: required|none` của từng slot be trong knowledge/hfs/slots.yaml cùng ruleParams.be.logicRoles, qua scripts/hfs/coverage-scope.mjs. Ba nơi dùng phạm vi đó đều do hfs sync sinh: be/jest.config.js (ngưỡng từng tệp), dòng sonar.coverage.exclusions của sonar-project.properties và codecov.yml (đường dẫn cùng các component theo từng service app và platform). `<detail>` nêu tệp đã lệch khỏi bản sinh; không ai được sửa tay phạm vi này."
  causes_vi:
    - "Sửa tay be/jest.config.js, codecov.yml hoặc dòng sonar.coverage.exclusions để đo ít tệp hơn hoặc thêm ngoại lệ"
    - "Đổi trường coverage của slot hoặc ruleParams.be.logicRoles nhưng chưa chạy lại hfs sync"
    - "Thêm service app hoặc capability mới nên các component của codecov.yml đã cũ"
  nextStep_vi: "Chạy `npx hfs sync --write` để sinh lại ba tệp từ slot manifest; muốn đổi phạm vi thì đổi trường `coverage` của slot (và ruleParams.be.logicRoles) trong .claude runtime, không sửa tệp sinh. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DECLARATION_INVALID:
  title: "hfs.json missing or invalid"
  title_vi: "hfs.json thiếu hoặc sai định dạng"
  meaning_vi: "Kho mã không có tệp hfs.json hợp lệ nên không thể biết nó theo chuẩn HFS nào, có những ứng dụng nào và bật những ô tuỳ chọn nào."
  causes_vi:
    - "Thiếu tệp hfs.json ở gốc kho, hoặc tệp không đọc được như JSON"
    - "Loại ứng dụng không có trong bảng kê của HFS, ví dụ một loại ứng dụng do kho tự đặt"
    - "optionalSlots ghi một ô không phải loại tuỳ chọn, hoặc ghi một ô mà loại ứng dụng đã tự bật"
    - "Thiếu loại ứng dụng bắt buộc, ví dụ chưa khai ứng dụng api hoặc chưa khai ứng dụng migrate dù đã khai kết nối cơ sở dữ liệu"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa hfs.json theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DEP_VERSION_SKEW:
  title: "One version per dependency in the workspace"
  title_vi: "Một gói nhiều phiên bản"
  meaning_vi: "`<pkg>` có `<n>` version trong workspace (`<list>`). Chỉ được một."
  causes_vi:
    - "Vi phạm luật R14: Mỗi dependency một version trong workspace; cấm bản sao lồng thứ hai (`apps/*/node_modules/@starci/grammar`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BASE_PIN:
  title: "A Dockerfile base image is not pinned"
  title_vi: "Image nền của Dockerfile không được ghim"
  meaning_vi: "Mọi FROM của Dockerfile phải là một stage trước đó, image node duy nhất của chuẩn (phiên bản node và bản alpine cụ thể), hoặc image ghim bằng digest `@sha256`; không dùng tag trôi nổi (`latest`, `node:22`) và không để build argument chưa xác định."
  causes_vi:
    - "Vi phạm luật R190: tag trôi nổi làm image đổi nội dung mà không có thay đổi nào trong repo, nên build không tái lập và lỗ hổng mới lọt vào không dấu vết."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi FROM thành image node của chuẩn (xem `NODE_IMAGE` trong scripts/hfs/rules/docker.mjs) hoặc ghim image bằng digest `@sha256`."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BUILD_CONTEXT:
  title: "The Dockerfile does not build from the app root"
  title_vi: "Dockerfile không build từ gốc app"
  meaning_vi: "Dockerfile của app phải ghi trong comment đầu tệp lệnh `docker build -f <be|fe>/apps/<app>/Dockerfile -t <image> .` đúng đường dẫn của chính nó (context là gốc app, nơi có `package.json` và lockfile duy nhất), và mọi nguồn của COPY/ADD nằm trong context (không có `..`, không có đường dẫn tuyệt đối)."
  causes_vi:
    - "Vi phạm luật R187: context build là gốc app; lệnh build sai hoặc nguồn COPY vượt ra ngoài context khiến image build được trên máy này nhưng hỏng trên CI hoặc trộn lẫn dữ liệu của app khác."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt lệnh `docker build -f <đường dẫn Dockerfile> -t <image> .` vào comment đầu Dockerfile và sửa các nguồn COPY/ADD về đường dẫn tương đối trong gốc app."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_ENTRY:
  title: "The Dockerfile does not start the app's own entry or declare its port and health"
  title_vi: "Dockerfile không chạy đúng entry của app hoặc thiếu cổng và healthcheck"
  meaning_vi: "Stage `runtime` phải chạy entry đã build của chính app ở dạng exec (be: `node be/dist/apps/<app>/src/main.js`; fe: `node fe/apps/<app>/server.js`); app api hoặc Next đặt `ENV PORT`, EXPOSE đúng cổng đó và có HEALTHCHECK; worker có HEALTHCHECK theo tiến trình và không EXPOSE; cli/migrate ghi `HEALTHCHECK NONE` và không EXPOSE; app Next build bằng `turbo run build --filter=@<project>/<app>` và `next.config.ts` đặt `output: \"standalone\"`."
  causes_vi:
    - "Vi phạm luật R189: một image khởi động sai entry, không công bố cổng hoặc không có healthcheck thì nền tảng không thể điều phối hay phát hiện lỗi của nó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa CMD/ENTRYPOINT về entry của app, thêm `ENV PORT`, `EXPOSE`, `HEALTHCHECK` (hoặc `HEALTHCHECK NONE` cho cli), và đặt `output: \"standalone\"` trong `next.config.ts` của app Next."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_SECRETS:
  title: "A secret enters an image"
  title_vi: "Bí mật bị đưa vào image"
  meaning_vi: "Không được COPY/ADD tệp `.env*` (trừ `.env.example`) hay đường dẫn trong `.starcistacks`, `.secrets`, `.volume`, khóa, chứng chỉ, kubeconfig; không ADD một URL; không có ARG hoặc ENV mang tên một thông tin xác thực (PASSWORD, SECRET, TOKEN, KEY, CREDENTIAL, PRIVATE); riêng `NEXT_PUBLIC_*` được phép vì được công khai theo thiết kế."
  causes_vi:
    - "Vi phạm luật R191: mọi thứ trong layer hoặc lịch sử image đều lấy ra được; một bí mật trong image là bí mật đã lộ cho mọi nơi image được kéo về."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ COPY/ADD hoặc ARG/ENV đó, mount thông tin xác thực lúc chạy, và tải về bằng stage có kiểm checksum thay vì ADD URL."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_STAGES:
  title: "The Dockerfile stages, user or install break the canon"
  title_vi: "Các stage, user hoặc lệnh cài của Dockerfile sai chuẩn"
  meaning_vi: "Dockerfile phải nhiều stage: một stage tên `build` (cài và build) và stage cuối tên `runtime` (thứ được chạy); runtime kết thúc bằng `USER node` và không chạy build; mọi lệnh cài là `npm ci` (không `npm install`); runtime của be chạy `npm ci --omit=dev --ignore-scripts`, runtime của fe không cài gì."
  causes_vi:
    - "Vi phạm luật R188: image chạy bằng root, mang theo công cụ build hoặc cài không theo lockfile thì vừa lớn vừa kém an toàn, và không tái lập được."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tách Dockerfile thành stage `build` và stage cuối `runtime`, thêm `USER node`, đổi `npm install` thành `npm ci`, và chuyển mọi lệnh build ra khỏi runtime."
  owner: op-retry
  kind: check-finding

HFS_DOC_NOT_ENGLISH:
  title: "Document is not English"
  title_vi: "Tài liệu không viết bằng tiếng Anh"
  meaning_vi: "Tệp Markdown hoặc YAML trong knowledge/, docs/, src/ hoặc apps/ có chữ cái tiếng Việt (kể cả trong khối mã của Markdown); tài liệu, mẫu và ví dụ phải viết bằng tiếng Anh."
  causes_vi:
    - "Viết hoặc dán đoạn tiếng Việt vào tài liệu, mẫu, ví dụ hay lời trích của chủ dự án"
    - "Đặt dữ liệu YAML có tiếng Việt ngoài slot danh mục thông điệp hoặc slot fixture i18n"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dịch dòng được nêu sang tiếng Anh. Chỉ dữ liệu YAML trong slot danh mục thông điệp hoặc slot fixture i18n được giữ tiếng khác; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_CODE:
  title: "Duplicated code block"
  title_vi: "Mã trùng lặp"
  meaning_vi: "Một đoạn mã (bỏ qua khác biệt về tên biến và giá trị chữ hoặc số) xuất hiện hai lần trong mã sản phẩm: ở hai chủ sở hữu, ở hai tệp của một chủ sở hữu, hoặc hai lần trong một tệp. Ngưỡng số dòng và số token là một định nghĩa duy nhất trong ruleParams.<profile>.duplicateBlock của knowledge/hfs/slots.yaml; lời nhắn của bộ kiểm tra ghi rõ ngưỡng và hai vị trí."
  causes_vi:
    - "Op cần một hàm hỗ trợ đã có ở nơi khác nhưng chép lại thay vì dùng chung"
    - "Hai nơi cùng tự viết một logic giống nhau vì chưa ai đưa nó vào chỗ dùng chung"
    - "Đoạn mã được chép nguyên rồi chỉ đổi tên biến hoặc hằng số"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đưa đoạn mã về một chỗ duy nhất theo lời nhắn (trong cùng chủ sở hữu, hoặc src/modules/platform/primitives, module miền của năng lực đó, hay packages/* với FE) rồi gọi từ cả hai nơi; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_SYMBOL:
  title: "One exported name declared in two files"
  title_vi: "Một tên xuất được khai báo ở hai tệp"
  meaning_vi: "Một tên mà cửa vào công khai (index.ts) của một chủ sở hữu xuất ra, truy về tệp khai báo nó, cũng được một tệp sản xuất khác của repo khai báo và xuất ra (hàm, lớp, hằng, enum, kiểu, interface). Hai bản khai báo cùng tên khiến import nhầm một bản mà trình biên dịch không báo, ví dụ hai decorator cùng tên InjectPrimaryEntityManager cho hai kết nối khác nhau. Việc xuất lại (re-export) một khai báo duy nhất không phải là bản thứ hai. Không có danh sách tên được miễn."
  causes_vi:
    - "Hai module cùng tự viết một helper, decorator hoặc kiểu với cùng một tên thay vì dùng chung một bản"
    - "Mỗi kết nối hoặc mỗi ứng dụng chép nguyên một tệp rồi giữ nguyên tên xuất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để giữ đúng một khai báo (dùng chung qua cửa vào của chủ sở hữu thích hợp) hoặc đổi tên bản còn lại cho đúng nghĩa của nó; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_E2E_IN_AUTOMATIC_GATE:
  title: "E2E runs in automatic gate"
  title_vi: "Kiểm thử e2e nằm trong cổng tự động"
  meaning_vi: "Hook husky hoặc script tự động gọi cả kiểm thử e2e, trong khi e2e không được nằm trong cổng tự động."
  causes_vi:
    - "Pre-commit hoặc pre-push chạy e2e"
    - "Script lint:check kéo e2e vào"
  nextStep_vi: "Op backend.scaffold gỡ e2e khỏi hook và script tự động."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_EMPTY_DIR:
  title: "No empty directory outside an `ignored` slot"
  title_vi: "Thư mục rỗng còn sót lại"
  meaning_vi: "Có thư mục không có tệp nào bên dưới (kể cả các thư mục con cũng rỗng). Git không theo dõi thư mục rỗng nên nó chỉ là dấu vết của cấu trúc đã đổi tên hoặc đã xóa. Xóa thư mục."
  causes_vi:
    - "Vi phạm luật R03: cấu trúc bị đổi tên hoặc tệp bị xóa mà thư mục cũ không được dọn (vd `src/modules/business/*` còn trống bên cạnh `domain/*`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_EVENT_CONTRACT:
  title: "The async contract between services is vendored and consumers match it"
  title_vi: "Hợp đồng sự kiện giữa các dịch vụ không khớp"
  meaning_vi: "Ảnh chụp `be/contracts/<service>/events.json` thiếu, cũ so với bảng `apps/<service>/src/events.ts` của bên phát, một mục trong `apps/<app>/src/consumes.ts` của bên nhận trỏ tới sự kiện không có trong ảnh chụp hoặc có phiên bản khác, hoặc một hàng đợi consumer định nghĩa bằng `defineQueue` không được liệt kê trong bảng `consumes.ts` nào."
  causes_vi:
    - "Vi phạm luật R166: hợp đồng giữa các dịch vụ được vendor dưới `be/contracts/<service>/` và bên nhận chỉ đọc đúng sự kiện và phiên bản mà ảnh chụp khai báo."
    - "Bên phát đổi sự kiện nhưng chưa chạy `npm run contract:emit`, hoặc bên nhận khai báo phiên bản cũ."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chạy `npm run contract:emit` rồi cập nhật `consumes.ts` và cách xử lý của bên nhận cho khớp; không sửa tay ảnh chụp."
  owner: op-retry
  kind: check-finding

HFS_FORBIDDEN_PRESENT:
  title: "Tracked path in a forbidden slot"
  title_vi: "Có tệp bị cấm trong cây mã nguồn"
  meaning_vi: "Tệp được theo dõi nằm trong một ô bị cấm (bộ nhớ đệm công cụ, đầu ra của tác tử, worktree, tệp bí mật dạng rõ). Ô này quy định nơi tệp phải ở, ngoài kho."
  causes_vi:
    - "Tác tử để lại tệp tạm hoặc báo cáo ở gốc kho rồi bị commit"
    - "Tệp .env hoặc khoá bí mật dạng rõ nằm trong kho"
    - "Thư mục e2e ở gốc thay vì src/tests/e2e"
  nextStep_vi: "Chuyển tệp tới nơi ô đó chỉ định (trường goesTo) hoặc xoá nó, rồi gỡ khỏi Git; tệp bí mật phải được niêm phong đúng chỗ, không bao giờ để dạng rõ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT:
  title: "Prettier is the only formatter"
  title_vi: "Chưa format bằng Prettier"
  meaning_vi: "`<file>` chưa được format. Chạy `npm run format`."
  causes_vi:
    - "Vi phạm luật R19: Prettier (config `@starci/prettier-config`) là formatter duy nhất; ESLint không còn luật định dạng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT_TOOL_MISSING:
  title: "The repository's own prettier is not installed"
  title_vi: "Kho chưa cài prettier của chính nó"
  meaning_vi: "Kiểm tra định dạng (R19) chạy prettier của chính kho. Kho chưa cài prettier nên không thể xác nhận định dạng, và trạng thái đó không bao giờ được tính là đạt."
  causes_vi:
    - "Chưa chạy `npm ci` trong kho"
    - "prettier không nằm trong devDependencies của kho"
  nextStep_vi: "Cài đúng phiên bản prettier ghi trong canon-pins.yaml (`npm ci`) rồi chạy lại `hfs check`."
  owner: op-retry
  kind: input-invalid

HFS_GHOST_TREE:
  title: "No empty directory beside a near-identical sibling"
  title_vi: "Cây thư mục ma cạnh thư mục gần trùng tên"
  meaning_vi: "Có thư mục rỗng mà tên chỉ khác vài ký tự so với thư mục anh em cùng cấp (thông báo nêu cả hai), tức là bản đổi tên hoặc gõ sai của cùng một cấu trúc chưa được dọn. Giữ bản có tệp, xóa bản rỗng."
  causes_vi:
    - "Vi phạm luật R03: đổi tên cấu trúc để lại bản cũ hoặc bản gõ sai (vd `business` và `bussiness`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_GITIGNORE_BLOCK_DRIFT:
  title: "The managed `.gitignore` block equals its render"
  title_vi: "Khối .gitignore lệch bản render"
  meaning_vi: "Khối .gitignore chuẩn đã bị sửa tay hoặc thiếu dòng `<rule>`. Chạy `hfs sync`."
  causes_vi:
    - "Vi phạm luật R04: Khối `.gitignore` do `.claude` quản lý phải trùng bản render (never-tracked list, deny `.env*`, cache)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_HOOKS_PATH_REDIRECTED:
  title: "A clone redirects core.hooksPath away from husky"
  title_vi: "core.hooksPath bị đổi hướng khỏi husky"
  meaning_vi: "Cấu hình Git cục bộ của bản clone đặt `core.hooksPath` trỏ ra ngoài `.husky`, nên hook pre-commit và pre-push không chạy và cổng mà mọi clone khác phải qua đã bị bỏ qua. Chỉ xét khi thư mục được kiểm tra chính là gốc work tree Git của nó; một thư mục nằm trong clone khác (một ví dụ trong clone runtime) không có hook riêng nên không bị xét."
  causes_vi:
    - "Vi phạm luật R13: pre-push chạy typecheck và lint, và không clone nào được đổi `core.hooksPath` để né husky; giá trị duy nhất được phép là `.husky` hoặc `.husky/_` do chính husky đặt."
  nextStep_vi: "Gỡ cấu hình bằng `git config --local --unset core.hooksPath` rồi commit lại qua hook; không dùng `--no-verify` và không đổi đường dẫn hook để né kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_IMAGE_UNPINNED:
  title: "Every image of a multi-service stack is pinned"
  title_vi: "Image của stack nhiều dịch vụ chưa được ghim phiên bản"
  meaning_vi: "Trong `.starcistacks/application-stacks.yaml` của một sản phẩm có từ hai dịch vụ trở lên, một `components.<name>.image` không có tag, dùng `latest`, một từ nhánh hoặc tag chỉ gồm major/minor (ví dụ `postgres:16`), nên image trôi theo thời gian."
  causes_vi:
    - "Vi phạm luật R164: image được ghim bằng digest (`@sha256:...`) hoặc phiên bản chính xác `x.y.z`; image của dịch vụ trong repo là `<repo>/<service>:<x.y.z>`, dịch vụ bên thứ ba cũng là image đã ghim."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: ghi tag chính xác hoặc digest vào `image` của thành phần; không dùng tag trôi."
  owner: op-retry
  kind: check-finding

HFS_LINT_SUPPRESSION_FILE:
  title: "A repository keeps no lint-suppression file, script or option"
  title_vi: "Kho có tệp hoặc script ghi nhận bỏ qua lỗi lint"
  meaning_vi: "Kho có tệp, script hoặc tùy chọn ghi nhận lỗi lint để bỏ qua ở `<f>`: `eslint.suppressions*`, script `lint:suppressions`, cờ `--suppress-all`/`--suppressions-location`, hoặc cấu hình eslint có `suppressions`."
  causes_vi:
    - "Vi phạm luật R104: lỗi lint được sửa trong mã (hoặc luật được đổi trong canon); không ghi nhận để lỗi nằm lại trong tệp suppressions."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp, script hoặc cờ, và sửa các lỗi lint trong mã."
  owner: op-retry
  kind: check-finding

HFS_MANAGED_FILE_DRIFT:
  title: "A managed file equals its template render"
  title_vi: "Tệp do .claude quản lý bị lệch"
  meaning_vi: "`<file>` do `.claude` quản lý nhưng nội dung lệch bản render từ template. Chạy `hfs sync --write`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R05: Tệp trong slot có `managedBy` của slots.yaml (tsconfig, jest.config.js, .prettierrc, .prettierignore, husky, workflows, sonar, khối `scripts` của package.json) phải bằng bản render từ template; danh sách tệp nằm trong slots.yaml, không nằm trong mã."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MANIFEST_INVALID:
  title: "HFS slot manifest invalid"
  title_vi: "Bảng kê ô HFS sai định dạng"
  meaning_vi: "Tệp knowledge/hfs/slots.yaml của bộ chạy không đọc được hoặc vi phạm lược đồ của nó, nên mọi kiểm tra HFS bị từ chối chứ không chạy trên một bảng kê hỏng."
  causes_vi:
    - "Một ô thiếu trường bắt buộc, dùng giá trị ngoài danh sách cho phép hoặc trùng mã với ô khác"
    - "Ma trận hướng import nhắc tới một tầng không tồn tại"
    - "Hai ô cùng khai một mẫu đường dẫn, hoặc một ô đã ngừng dùng mà không chỉ ra ô kế nhiệm"
  nextStep_vi: "Đây là lỗi của bộ chạy, không phải của sản phẩm; người giám sát sửa knowledge/hfs/slots.yaml qua một nhánh đã được duyệt, sản phẩm không tự sửa."
  owner: supervisor
  kind: check-finding

HFS_MANIFEST_MAJOR_MISMATCH:
  title: "hfs.json pins another manifest major"
  title_vi: "Phiên bản chính của bảng kê không khớp"
  meaning_vi: "Trường hfs trong hfs.json ghim một phiên bản chính khác với bảng kê ô của bộ chạy. HFS không có giai đoạn tương thích: khi phiên bản chính mới được nạp thì phiên bản chính cũ bị từ chối ngay."
  causes_vi:
    - "Bộ chạy đã lên phiên bản chính mới của bảng kê nhưng kho chưa được di chuyển sang"
    - "hfs.json ghi số phiên bản chính sai hoặc chép từ một kho khác"
  nextStep_vi: "Chủ sở hữu duyệt một nhánh di chuyển cho kho này rồi mới đổi số hfs; không có cách bỏ qua hay giữ song song hai phiên bản."
  owner: owner
  kind: check-finding

HFS_MIN_INSTANCES:
  title: "Fewer instances of a slot than required"
  title_vi: "Số thực thể của ô ít hơn mức tối thiểu"
  meaning_vi: "Một ô đòi có ít nhất một số thực thể (ví dụ ít nhất một tính năng trong src/features) nhưng kho có ít hơn."
  causes_vi:
    - "Kho chưa có tính năng nào đúng mẫu src/features/<tên>/"
    - "Toàn bộ mã nghiệp vụ nằm ở chỗ ngoài mẫu nên không được tính"
  nextStep_vi: "Chuyển mã nghiệp vụ vào thực thể đúng mẫu của ô hoặc tạo thực thể còn thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MODULE_TIER_INVALID:
  title: "Module tier name is not allowed"
  title_vi: "Tên tầng module không hợp lệ"
  meaning_vi: "Trong src/modules có thư mục tầng không thuộc domain, platform hoặc integrations."
  causes_vi:
    - "Đặt tên tầng tự do"
    - "Sai chính tả tên tầng"
  nextStep_vi: "Op backend.implement chuyển module về một trong ba tầng hợp lệ."
  owner: other-op:backend.implement
  kind: check-finding

HFS_MONO_FE_WORKSPACE:
  title: "An fe workspace manifest breaks the workspace shape"
  title_vi: "Manifest của một workspace fe sai hình dạng"
  meaning_vi: "Mỗi app fe `fe/apps/<app>` là workspace `@<project>/<app>`, private, có đúng các script build, dev, lint (`hfs lint --workspace .`), start và typecheck; mỗi gói `fe/packages/<pkg>` là private và có build, typecheck cùng script lint của workspace."
  causes_vi:
    - "Vi phạm luật R144: turbo chạy các task theo script của từng workspace; tên, script hoặc cờ private sai khiến build, lint hoặc typecheck của app bị bỏ qua hoặc chạy khác chuẩn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt tên `@<project>/<app>`, `\"private\": true` và đúng bộ script trong `package.json` của workspace đó."
  owner: op-retry
  kind: check-finding

HFS_MONO_NEST_PROJECTS:
  title: "be/nest-cli.json does not match the declared be apps"
  title_vi: "be/nest-cli.json không khớp các app be đã khai báo"
  meaning_vi: "`be/nest-cli.json` phải là `\"monorepo\": true`, project mặc định là một app api, và `projects` đúng bằng các app be mà `hfs.json` khai báo, mỗi project có `root` là `apps/<app>` và `sourceRoot` là `apps/<app>/src`."
  causes_vi:
    - "Vi phạm luật R145: back end luôn là monorepo Nest của `be/apps/<app>`, kể cả khi chỉ có một service; một project thừa hoặc thiếu nghĩa là app đó không được build hoặc chạy theo khai báo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa `be/nest-cli.json` cho khớp đúng các app be trong `hfs.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACES:
  title: "The app root is not the monorepo root"
  title_vi: "Gốc app không phải gốc monorepo"
  meaning_vi: "`package.json` ở gốc app phải khai báo `workspaces` đúng `[\"fe/apps/*\", \"fe/packages/*\"]`, `packageManager` là `npm@<phiên bản cụ thể>` và `turbo` trong devDependencies; gốc app giữ `turbo.json` do hfs sync sinh ra."
  causes_vi:
    - "Vi phạm luật R143: mọi sản phẩm luôn là monorepo, kể cả khi chỉ có một service, nên hình dạng hfs đồng nhất; thiếu workspaces hoặc turbo thì các app fe không được build qua turbo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `workspaces`, `packageManager` và devDependency `turbo` (đúng bản ghim) trong `package.json` ở gốc, rồi chạy `npx hfs sync --write` để sinh `turbo.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACE_DEP:
  title: "An fe workspace imports a package it does not declare"
  title_vi: "Một workspace fe import gói mà nó không khai báo"
  meaning_vi: "Mọi gói mà các tệp của một workspace fe import phải được khai báo trong `package.json` của chính workspace đó (gói workspace anh em ghi `\"*\"`); `package.json` ở gốc không bao giờ khai báo một gói workspace."
  causes_vi:
    - "Vi phạm luật R146: một app chỉ chạy được nhờ gói được hoist từ gốc sẽ hỏng khi build riêng (`npm run build -w`) hoặc khi turbo không biết thứ tự phụ thuộc."
