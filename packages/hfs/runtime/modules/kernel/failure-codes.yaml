BE_ERROR_HOME:
  title: "Error declared outside its capability"
  title_vi: "Lỗi không nằm ở capability sở hữu"
  meaning_vi: "Một lớp lỗi nằm ngoài errors/<capability>.error.ts của capability sở hữu nó, kế thừa Error trần hay base đã bỏ thay vì DomainError, hoặc tệp errors/<capability>.error.ts không đúng hình dạng (một enum <C>ErrorCode, một bảng <C>_ERROR_KINDS kiểu Record<<C>ErrorCode, ErrorKind>, một lớp <C>Error rỗng); hoặc code ném giá trị không phải DomainError (new Error, exception của framework, chuỗi), hoặc domain ném lỗi của platform."
  causes_vi:
    - "Lớp lỗi đặt ở tệp service hay tệp khác thay vì <capability>/errors/<capability>.error.ts"
    - "Lớp lỗi kế thừa Error hoặc AbstractException thay vì DomainError"
    - "throw new Error(...), throw new NotFoundException(...) hoặc throw một chuỗi thoát ra khỏi capability"
    - "Giá trị enum không theo <CAPABILITY>_<WHAT>, bảng kind thiếu kiểu Record hoặc lớp lỗi có thân"
    - "Domain ném ConfigError hay lỗi khác của platform"
    - "Giá trị của enum <C>ErrorCode không phải chuỗi literal dạng <CAPABILITY>_<WHAT>, có hậu tố _ERROR hay _EXCEPTION, hoặc trùng với một mã ở nơi khác trong repo"
  nextStep_vi: "Chuyển lỗi về errors/<capability>.error.ts với đúng ba thành phần, kế thừa DomainError, dịch lỗi platform thành lỗi của capability; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ERROR_MASKED:
  title: "One filter per app; undeclared errors are masked"
  title_vi: "Lỗi nội bộ lộ ra client"
  meaning_vi: "App `<a>` trả thông điệp lỗi nội bộ ra client (`<where>`). Lỗi lạ phải bị che."
  causes_vi:
    - "Vi phạm luật R39: Mỗi app đăng ký đúng một filter/formatError của `platform/errors`; lỗi không khai báo → 500 + thông điệp chung, chi tiết chỉ vào log."
    - "Gốc app api không cung cấp đúng một APP_FILTER dùng lớp khai báo trong platform/errors"
    - "GraphQLModule.forRoot không truyền formatError của platform/errors"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_IMPORTS_FEATURE:
  title: "A feature never imports a feature"
  title_vi: "Feature import feature khác"
  meaning_vi: "Feature `<a>` import feature `<b>`. Logic dùng chung phải là một capability domain."
  causes_vi:
    - "Vi phạm luật R28: Feature không import feature khác (kể cả qua `index.ts`); dùng chung thì đưa xuống domain."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

BE_FEATURE_LAYOUT_INVALID:
  title: "Feature folder layout invalid"
  title_vi: "Bố cục thư mục feature sai"
  meaning_vi: "Tệp của feature đặt sai thư mục application hoặc transport so với vai trò của nó."
  causes_vi:
    - "Đặt vai trò giao vận trong application/ hoặc ngược lại"
    - "Thiếu tên giao thức dưới transport/"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_NOT_COMPOSED:
  title: "Feature not composed into any app"
  title_vi: "Feature không được lắp vào ứng dụng nào"
  meaning_vi: "Một feature backend không có đường import chạy thật (không tính import chỉ-kiểu) từ tệp gốc của bất kỳ ứng dụng nào (app.module.ts hoặc main.ts). Không tiến trình nào nạp nó nên code này không bao giờ được phục vụ."
  causes_vi:
    - "Quên thêm module của feature vào app.module.ts của ứng dụng"
    - "Chỉ import kiểu (import type) từ ứng dụng, nên feature không thật sự được lắp vào"
    - "Feature đã bị bỏ dở hoặc thay bằng feature khác nhưng thư mục cũ vẫn còn"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để lắp module của feature vào ứng dụng phù hợp hoặc xoá feature không dùng; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_SHAPE:
  title: "Feature root is `index.ts`, module, `application/`, `transport/<protocol>/`"
  title_vi: "Feature sai hình dạng"
  meaning_vi: "Feature `<f>` có `<dir>` ngoài hình dạng chuẩn (application/ + transport/<protocol>/)."
  causes_vi:
    - "Vi phạm luật R29: Feature gốc chỉ có `index.ts`, `<feature>.module.ts`, `application/`, `transport/<protocol>/` với protocol có slot; không `application/graphql\\|http`, không `infrastructure/`, `composition/`, cây transport-first."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_HANDLER_REGISTRATION:
  title: "Handler not registered exactly once"
  title_vi: "Handler chưa đăng ký đúng một lần"
  meaning_vi: "Một handler không được đăng ký trực tiếp đúng một lần trong module Nest."
  causes_vi:
    - "Quên đăng ký vào providers"
    - "Đăng ký ở nhiều module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_NOT_COMPOSED:
  title: "Capability module not composed into any app"
  title_vi: "Module năng lực không được lắp vào ứng dụng nào"
  meaning_vi: "Một module domain, integrations hoặc platform không có đường import chạy thật từ tệp gốc của bất kỳ ứng dụng nào, kể cả qua các module khác đã được lắp. Nó là code chết: không tiến trình nào dùng đến."
  causes_vi:
    - "Module được viết sẵn nhưng chưa feature nào import nó"
    - "Feature từng dùng module này đã bị xoá hoặc đổi hướng sang module khác"
    - "Chỉ có import kiểu tới module, không có import chạy thật"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để nối module vào feature cần nó hoặc xoá module không ai dùng; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_PROVIDER_REREGISTRATION:
  title: "Provider re-registered"
  title_vi: "Provider bị đăng ký lại"
  meaning_vi: "Một provider đã có nơi đăng ký lại bị đăng ký thêm ở module khác."
  causes_vi:
    - "Khai báo cùng provider ở hai module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_SHAPE:
  title: "Nest module shape invalid"
  title_vi: "Hình dạng module Nest sai"
  meaning_vi: "Một module vi phạm hình dạng chuẩn: @Global() ở bất kỳ đâu, isGlobal: true ngoài apps/<app>/src/app.module.ts, import module của owner khác vào @Module({ imports }), ConfigurableModuleBuilder không khai kiểu options, có forRoot, forFeature hay registerAsync thay vì chỉ static register, nhiều module trong một tệp, new một provider, hoặc biến let ở cấp module."
  causes_vi:
    - "@Global() trên bất kỳ module nào (kể cả trong spec)"
    - "isGlobal: true ở ngoài app.module.ts của app"
    - "Module của một capability khác bị import vào imports thay vì dùng qua Inject<Thing>()"
    - "new ConfigurableModuleBuilder() không có kiểu options"
    - "register không static, hoặc có forRoot, forFeature, registerAsync"
    - "new XService() hoặc let ở cấp module tạo trạng thái toàn cục"
    - "Feature có hai module trong một thư mục transport (một module cho mỗi thao tác), có module-definition, hoặc @Module ngoài `<f>.module.ts` và `<f>-<protocol>.module.ts`; app import module ứng dụng của feature hoặc module transport không thuộc loại app cho phép (api: graphql/http/websocket; worker: schedule/message; cli: cli)"
    - "Bộ máy đồ thị module: module đại diện của capability được đăng ký hai lần trong một app, thiếu isGlobal: true ở gốc app, hoặc bị module khác import"
    - "Module con có hơn một nơi import, hoặc vừa nằm ở gốc app vừa được module khác import"
    - "isGlobal: true xuất hiện ngoài gốc app apps/<app>/src/app.module.ts"
  nextStep_vi: "Bỏ @Global, để app đăng ký capability đúng một lần với isGlobal: true, dùng capability khác qua Inject<Thing>(), khai kiểu options, chỉ dùng static register, tách module, để container dựng provider; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_CONTRACT_FORM:
  title: "Public contract form invalid"
  title_vi: "Dạng hợp đồng công khai sai"
  meaning_vi: "Hợp đồng công khai của backend không được khai báo theo dạng được yêu cầu (ví dụ kiểu inline)."
  causes_vi:
    - "Viết kiểu ngay tại tham số thay vì khai báo tên riêng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_SURFACE:
  title: "Owner public surface violated"
  title_vi: "Bề mặt công khai của owner bị vi phạm"
  meaning_vi: "Một import chui vào tệp bên trong owner khác thay vì đi qua index.ts của owner, hoặc index.ts export * , export cả thư mục types, export token kho (*_STORE), hoặc export quá nhiều tên."
  causes_vi:
    - "Import theo đường dẫn sâu như @modules/domain/plan/plan.service"
    - "index.ts dùng export * hoặc export cả thư mục"
    - "index.ts export token kho hoặc vượt số export cho phép"
    - "Có index.ts lồng bên trong owner (persistence/index.ts, errors/index.ts), hoặc index.ts chứa import, khai báo, export default thay vì chỉ các dòng export { } / export type { }"
  nextStep_vi: "Import qua index.ts của owner và liệt kê tường minh những gì owner cung cấp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_READONLY_BOUNDARY:
  title: "Readonly boundary violated"
  title_vi: "Vi phạm ranh giới chỉ-đọc"
  meaning_vi: "Thông điệp hoặc phụ thuộc được tiêm không được đánh dấu readonly hoặc có setter."
  causes_vi:
    - "Thiếu readonly trên trường"
    - "Có setter hay index signature"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_REQUIRED_MODULE_MISSING:
  title: "Required backend module, app or feature file is missing"
  title_vi: "Thiếu tệp hoặc thư mục bắt buộc của một phần backend"
  meaning_vi: "Bảng kê HFS bắt buộc mỗi ứng dụng, tính năng, module miền, tích hợp và module nền tảng (cấu hình, ghi nhật ký, lỗi, kiểu nguyên thuỷ) phải có một số tệp hoặc thư mục cố định, ví dụ index.ts, tệp .module.ts, thư mục application/ hay bài kiểm thử ghép ứng dụng. Ở đây một mục như vậy không tồn tại, nên phần đó chưa đúng khuôn và các bộ kiểm tra khác không thể tin vào nó."
  causes_vi:
    - "Tạo module hoặc tính năng mới nhưng quên tệp cửa vào index.ts hoặc tệp .module.ts"
    - "Module nền tảng bắt buộc (config, logging, errors, primitives) chưa được tạo hoặc đặt tên khác"
    - "Ứng dụng thiếu bài kiểm thử ghép <app>.composition.spec.ts"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tạo tệp hoặc thư mục còn thiếu đúng theo bảng kê; nếu tên hiện có là do thiết kế khác thì đó là việc đổi bảng kê, do người giám sát quyết định."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_OWNER:
  title: "Entities and migrations live in the owning capability's `persistence/`"
  title_vi: "Entity hoặc migration sai chủ"
  meaning_vi: "Entity/migration `<file>` không nằm dưới `persistence/` của capability sở hữu (hoặc sai tên)."
  causes_vi:
    - "Vi phạm luật R35: Entity + migration nằm trong `<capability>/persistence/` của capability sở hữu bảng, có `connection.ts`; `connection.ts` trỏ tới một connection khai trong `hfs.json`; tên migration `<epochMs13>-<kebab>.ts`, class `<Pascal><epochMs13>`, thuộc tính `name` bằng tên class; `index.ts` của owner export `<c>Entities` và `<c>Migrations`, app compose."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_SOURCE_FORM:
  title: "Back-end source file breaks the naming or form canon"
  title_vi: "Tệp nguồn BE sai quy ước tên hoặc hình thức"
  meaning_vi: "Tên tệp phải là kebab-case với hậu tố vai trò trong danh sách đóng của slots.yaml; chỉ export có tên (không export default); mọi export và thành viên công khai có JSDoc tiếng Anh; không emoji hay tiếng Việt ngoài catalog messages/."
  causes_vi:
    - "Tệp dùng hậu tố bị cấm (use-case, repository, store, util, helper, types, constants)"
    - "Export default"
    - "Thiếu JSDoc trên export"
    - "Chú thích tiếng Việt trong mã"
  nextStep_vi: "Đổi tên tệp theo vai trò trong danh sách đóng, chuyển kiểu vào <tên>.contracts.ts, thêm JSDoc tiếng Anh và bỏ export default. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SQL_TABLE_OWNER:
  title: "SQL touches another capability's table or reads unbounded"
  title_vi: "SQL ghi bảng của năng lực khác hoặc đọc không giới hạn"
  meaning_vi: "Bộ kiểm tra phân tích từng hằng SqlText: câu lệnh ghi (INSERT, UPDATE, DELETE) chỉ được chạm bảng của entity thuộc chính năng lực đó; câu đọc chỉ được chạm bảng của năng lực mà chủ sở hữu được phép import; SELECT nhiều dòng phải có LIMIT trừ khi lọc theo khóa chính hoặc khóa duy nhất hoặc chỉ tính tổng."
  causes_vi:
    - "Service của năng lực A cập nhật bảng của năng lực B"
    - "Truy vấn danh sách quên LIMIT"
    - "Bảng chưa có entity khai báo ở năng lực sở hữu"
  nextStep_vi: "Chuyển câu ghi về năng lực sở hữu bảng và gọi qua API công khai của năng lực đó; thêm LIMIT theo PAGE_SIZE_MAX, LIST_ROWS_MAX hoặc BATCH_ROWS của platform/database. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_TIER_DIRECTION:
  title: "Backend import against the tier direction"
  title_vi: "Backend import ngược chiều tầng"
  meaning_vi: "Một tệp backend import từ tầng mà bảng kê HFS không cho phép tầng của nó phụ thuộc vào. Mỗi tầng (app, feature, domain, integrations, platform) chỉ được nhìn xuống các tầng liệt kê trong bảng; hai feature import nhau là mã riêng BE_FEATURE_IMPORTS_FEATURE, và import chỉ kiểu (type-only) cũng tính như import thật."
  causes_vi:
    - "Một module domain, integrations hoặc platform import ngược lên feature hoặc app"
    - "Một module platform import domain hoặc integrations"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đưa phần dùng chung xuống đúng tầng (domain hoặc platform) rồi cho cả hai bên import từ đó; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_APP_ISOLATION:
  title: "App imports another app"
  title_vi: "Một app import app khác"
  meaning_vi: "Một app trong apps/ import mã nguồn của app khác. Các app độc lập, build và triển khai riêng; mã dùng chung phải nằm trong một gói packages/<pkg>."
  causes_vi:
    - "Import đường dẫn tương đối hoặc bí danh trỏ sang apps/<app-khác>/src"
    - "Sao chép cách dùng chung bằng import thay vì tạo gói dùng chung"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển phần dùng chung vào một gói packages/<pkg> hoặc nhân bản có chủ đích; nếu cần ô gói mới thì người giám sát thêm ô vào bảng kê."
  owner: op-retry
  kind: check-finding

FE_BLOCK_PRODUCT_HOOK_DEFINITION:
  title: "Block defines a product hook"
  title_vi: "Khối giao diện tự định nghĩa hook sản phẩm"
  meaning_vi: "Một block định nghĩa luôn vòng đời dữ liệu của sản phẩm, trong khi block chỉ được gọi hook có sẵn từ thư mục hooks."
  causes_vi:
    - "Viết hook dữ liệu ngay trong file block"
    - "Trộn logic thế giới sản phẩm vào block"
  nextStep_vi: "Op interface.implement chuyển hook sang thư mục hooks và để block chỉ gọi nó."
  owner: other-op:interface.implement
  kind: check-finding

FE_COMPONENT_DEEP_HOOK_IMPORT:
  title: "Component imports a hook too deeply"
  title_vi: "Thành phần nhập hook quá sâu"
  meaning_vi: "Thành phần giao diện nhập hook dữ liệu không qua cửa (barrel) của thư mục hooks."
