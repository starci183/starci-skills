schema: starci/knowledge-source@1
id: be.domain
title: Domain capabilities (module family domain)
purpose: |-
  Given a business capability (orders, payments, catalog), where does its decision live? In `modules/domain/<capability>/`: services that
  own the rules, the entities and migrations of its tables on one connection, its errors and its messages. The capability belongs to
  one bounded context, so everything inside it is synchronous and runs in one transaction; the context talks to other contexts only
  through events. Features reach it through its public `index.ts`.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - knowledge/patterns/be/services.yaml
    - knowledge/patterns/be/persistence.yaml
    - knowledge/patterns/be/event-bus.yaml
    - owner decision 2026-10-02 (bounded contexts)
  limitations: |-
    Static checks prove the folder shape, the one connection per context, the coupling between contexts and the one-transaction rule. They do
    not prove that a rule is the right business rule; the service specs and the e2e run do.
rules:
  - id: BE-DOMAIN-1
    title: A capability owns its rules, its tables and its transaction
    kind: mandatory
    hfsRules: [R175, R176, R174, R30]
    requirement: |-
      A capability folder holds `index.ts`, `<capability>.module.ts`, `<capability>.service.ts` with its `<capability>.service.spec.ts` beside it,
      `<capability>.contracts.ts`, `errors/`, `messages/` and `persistence/` (its entities, migrations, SQL and rows on the connection of its
      context). A service opens one transaction on that connection and publishes its events inside it (`eventBus.publish(event, tx)`, event-bus.yaml).
      No relation, foreign key or import reaches a capability of another context; contexts are coupled by events only.
    rationale: |-
      A capability that owns its rules and its tables can change them without asking another team, and a transaction that touches one connection
      stays atomic.
    cases:
      - id: case-1
        when: Order and payment must agree
        write: 'The payment service commits its row and publishes PaymentSettledEvent in one transaction; an order reactor consumes it and the order service updates its own copy.'
    verification:
      automated:
        - BE_CONTEXT_COUPLING
        - BE_CONTEXT_TRANSACTION
        - BE_CONTEXT_OWNER
        - BE_PUBLIC_SURFACE
        - ARCH_OWNER_EXPORT_BYPASS
        - ARCH_OWNER_EXPORT_STAR
        - HFS_ALIAS_REEXPORT
        - ARCH_PACKAGE_EXPORT_BYPASS
      manual:
        - Confirm the capability is named after the business capability, not after a technical layer.
    relatedExamples: [domain]
  - id: BE-DOMAIN-2
    title: Work inside one context is synchronous; an event crosses contexts or starts async work
    kind: mandatory
    hfsRules: [R152, R175]
    requirement: |-
      A handler that needs another capability of the same context calls its service in the same transaction and no event exists for it. An event is
      published only when another context must react or when the work it starts is asynchronous by nature (a job, a saga step, a reactor, a projection
      recompute), and only from a domain service inside its transaction.
    rationale: |-
      An event inside one context adds a delivery that can fail between two writes the transaction would have made atomic.
    cases:
      - id: case-1
        when: Checkout reserves stock in the same context
        write: 'The order service calls the catalog service in its transaction; PlacementCompletedEvent is published only for the billing context.'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_CONTEXT_COUPLING
      manual:
        - Confirm no published event is consumed by the context that published it only to tell itself something.
    relatedExamples: [domain]
files:
  - path: src/modules/domain/<capability>/index.ts
    slot: be.domain
    role: The public surface (services, contracts, errors and the entity and migration arrays), never an entity class used elsewhere.
    rules: [BE_PUBLIC_SURFACE]
  - path: src/modules/domain/<capability>/<capability>.module.ts
    slot: be.domain
    role: Registers the services of the capability.
  - path: src/modules/domain/<capability>/<capability>.service.ts
    slot: be.domain
    role: The rules, in one transaction on the connection of the context.
    rules: [BE_CONTEXT_TRANSACTION, BE_OUTBOX_WRITE_TX]
  - path: src/modules/domain/<capability>/<capability>.service.spec.ts
    slot: be.domain
    role: The unit spec beside the service, with a few mocks.
  - path: src/modules/domain/<capability>/<capability>.contracts.ts
    slot: be.domain
    role: The plain types the service takes and returns.
  - path: src/modules/domain/<capability>/errors/<capability>.error.ts
    slot: be.errors
    role: The error family of the capability.
  - path: src/modules/domain/<capability>/messages/<capability>.messages.ts
    slot: be.domain.messages
    role: The keyed vi and en text of the capability.
  - path: src/modules/domain/<capability>/persistence/connection.ts
    slot: be.persistence
    role: The entity and migration arrays the apps register on the connection of the context.
  - path: src/modules/domain/<capability>/persistence/entities/<table>.entity.ts
    slot: be.persistence
    role: One table of the capability; no relation to another context.
    rules: [BE_CONTEXT_COUPLING]
  - path: src/modules/domain/<capability>/persistence/migrations/<epochMs13>-<name>.ts
    slot: be.persistence
    role: One migration; no foreign key onto another context.
    rules: [BE_CONTEXT_COUPLING]
  - path: src/modules/domain/<capability>/persistence/<name>.sql.ts
    slot: be.persistence
    role: The statements of the capability, one owner per table.
