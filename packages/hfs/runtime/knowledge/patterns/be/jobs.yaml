schema: starci/knowledge-source@1
id: be.jobs
title: Fenced background jobs
purpose: |-
  Given work that runs in the background and must survive a worker that stalls, restarts or is replaced, how is it claimed and
  settled? A job is a row whose `fencingToken` the claim bumps. Every write on a claimed job carries the token the writer holds and
  is refused when it is stale, so a zombie worker (one that lost its claim but kept running) changes nothing, and every external
  effect carries a run key that includes the token, so the provider drops a repeat. `platform/jobs` is the one owner of the row.
appliesTo:
  - backend
family: be
pattern: fenced-job
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (fenced jobs with a required fencing token)
    - https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html
  limitations: |-
    Static checks prove who writes the job row, that the token is required in the type and not cast around, that effects carry a
    run key and that a processor has the fenced base. They do not prove that the provider honours the idempotency key or that a
    step is safe to repeat; the test-world scenarios (`fenced-job/*`) prove the zombie and re-dispatch behaviour against real
    Postgres and a double of the provider.
rules:
  - id: BE-JOBS-1
    title: The job row has one owner and one atomic claim
    kind: mandatory
    hfsRules: [R157, R86]
    requirement: |-
      `modules/platform/jobs` holds the job entity (`id`, `kind`, `status`, `currentStep`, `fencingToken`, `claimedBy`,
      `leaseExpiresAt`, `payload`, a unique `jobKey`), `job-claim.service.ts` and the persistence of the table. `claim()` is one
      atomic upsert keyed by the delivery (`INSERT ... ON CONFLICT (job_key) DO UPDATE SET fencing_token = jobs.fencing_token + 1 ... WHERE
      status = 'failed' OR the lease expired ... RETURNING`, a `SqlText` constant): the job row is created by its first claim, the token is
      bumped by the store and returned, and a done job or a live claim matches nothing. `JobRunnerService` calls it for every BullMQ
      delivery (the job key is the BullMQ job id), then `process`, then the guarded `complete`. Nothing else writes the row: no
      `manager.update`, `increment`, `save`, `insert`, `delete` or query-builder write on the job entity outside `platform/jobs`. The table
      exists on every connection that runs jobs.
    rationale: |-
      A read-modify-write claim races, and a second writer defeats the fence. One owner and one atomic statement keep the token
      monotonic.
    cases:
      - id: case-1
        when: A worker picks up a job
        write: 'const job = await this.claims.claim({ kind: "send-receipt", jobKey: delivery.id, payload, workerId, leaseMs })  // token = previous + 1'
    verification:
      automated:
        - BE_JOB_WRITE_OUTSIDE_OWNER
        - BE_SQL_TABLE_OWNER
      manual:
        - Confirm the claim SQL is a single statement and the lease length fits the longest step.
    relatedExamples: [fenced-job]
  - id: BE-JOBS-2
    title: Every write to a claimed job carries expectedFencingToken, required in the type
    kind: mandatory
    hfsRules: [R158]
    requirement: |-
      `JobClaims.advance`, `complete` and `fail` take `GuardedWrite & {...}` where `GuardedWrite = { jobId: string; expectedFencingToken: number }`:
      the token is required, never optional or nullable, and a call never passes it through `as`, `!` or `any`. Each write is
      `UPDATE ... WHERE id = $1 AND fencing_token = $2`; zero rows updated throws `JobFencedOut` and the worker stops with no
      further effect. A step or processor never catches around a guarded write: the `FencedProcessor` base owns the failure path.
    rationale: |-
      An optional guard is a guard some caller forgets. The token is checked atomically by the store that accepts the write, which
      is the only place a stale worker can be refused.
    cases:
      - id: case-1
        when: A step finishes
        write: 'await this.claims.advance({ jobId: job.jobId, expectedFencingToken: job.fencingToken, step: "send" })'
    verification:
      automated:
        - BE_JOB_FENCE_REQUIRED
      manual: []
    relatedExamples: [fenced-job]
  - id: BE-JOBS-3
    title: An external effect carries a run key that includes the token
    kind: mandatory
    hfsRules: [R159]
    requirement: |-
      `JobClaims.runKey(job, step)` returns a `RunKey` (`<jobId>:<step>:<fencingToken>`); it is the only way to make one. Every call
      from `steps/<step>.step.ts` to an integration passes it as the provider's idempotency key, so a repeated effect of a stale
      worker is dropped by the provider. A read from an integration belongs in the application layer, not in a step. When the
      provider cannot enforce idempotency, constrain overlap and reconcile before a retry.
    rationale: |-
      Fencing the local row does not fence the remote effect. The key ties the effect to one claim.
    cases:
      - id: case-1
        when: A step sends a mail
        write: 'await this.mail.send(message, this.claims.runKey(job, "send"))'
    verification:
      automated:
        - BE_JOB_RUN_KEY
      manual:
        - Confirm the provider documents idempotent handling of its key.
    relatedExamples: [fenced-job]
  - id: BE-JOBS-4
    title: A job is a processor plus steps, started by a producer and run by a worker or api app
    kind: mandatory
    hfsRules: [R160, R156, R46, R203]
    requirement: |-
      `features/jobs/<job>/transport/queue/<job>.processor.ts` declares a class extending `FencedProcessor` (it claims, calls `process(job)` and
      settles through the guarded writes); `steps/<step>.step.ts` declares a class implementing `JobStep`; `application/` holds
      plain CQRS. The processor and every step are thin feature files (R203 `BE_FEATURE_THIN`): they map the claimed job and
      delegate into `modules/`; the claim, the fence, the settle and the retry live in `platform/jobs`. A domain service starts
      the job with a typed queue producer `enqueueX(payload, tx)` inside its transaction
      (queues.yaml). The jobs kind imports only `modules/*`: it never imports an api, saga or reactor feature, and it talks to
      them through events. An app of kind `worker` or `api` composes the job queue module.
    rationale: |-
      One place and one base class mean a job cannot skip the fence, and the kind boundary keeps a long job from running inside a
      request.
    cases:
      - id: case-1
        when: A new background job send-receipt
        write: 'features/jobs/send-receipt/{transport/queue/send-receipt.processor.ts, transport/queue/send-receipt-queue.module.ts, send-receipt.module.ts, steps/mail.step.ts, application/send-receipt.command.ts}'
    verification:
      automated:
        - BE_JOB_SHAPE
        - BE_KIND_ISOLATION
        - BE_BACKGROUND_UNOWNED
        - BE_FEATURE_THIN
      manual:
        - Confirm each step is one external effect that is safe to repeat under the same run key.
    relatedExamples: [fenced-job]
  - id: BE-JOBS-5
    title: A declared fenced-job is proven on the test world
    kind: mandatory
    hfsRules: [R155]
    requirement: |-
      An app that declares `fenced-job` has tests titled `fenced-job/<scenario>: ...` for `claim-bumps-token`,
      `zombie-fenced-out` (a worker with a stale token gets `JobFencedOut` and the external double sees zero calls) and
      `redispatch-isolated` (a re-dispatch claims a higher token, the old worker's write is refused and the new run's effects carry
      their own run key), run on the test world with real Postgres.
    rationale: |-
      The fence is a runtime property; only a paused old worker resuming after reassignment shows it holds.
    cases:
      - id: case-1
        when: The send-receipt e2e suite
        write: "it('fenced-job/zombie-fenced-out: the stale worker changes nothing', ...)"
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual: []
    relatedExamples: [fenced-job]
files:
  - path: src/modules/platform/jobs/index.ts
    slot: be.platform.jobs
    role: "Public surface of the capability."
    template: jobs/platform/jobs.index.ts.tpl
  - path: src/modules/platform/jobs/jobs.module.ts
    slot: be.platform.jobs
    role: "Dynamic module registered once per app that runs jobs, over the connection that holds the job table."
    template: jobs/platform/jobs.module.ts.tpl
  - path: src/modules/platform/jobs/jobs.module-definition.ts
    slot: be.platform.jobs
    template: jobs/platform/jobs.module-definition.ts.tpl
  - path: src/modules/platform/jobs/jobs.options.ts
    slot: be.platform.jobs
    template: jobs/platform/jobs.options.ts.tpl
  - path: src/modules/platform/jobs/jobs.config.ts
    slot: be.platform.jobs
    template: jobs/platform/jobs.config.ts.tpl
  - path: src/modules/platform/jobs/jobs.decorators.ts
    slot: be.platform.jobs
    role: "InjectJobClaims, InjectJobProcessorRegistry and their tokens."
    template: jobs/platform/jobs.decorators.ts.tpl
  - path: src/modules/platform/jobs/jobs.contracts.ts
    slot: be.platform.jobs
    role: "ClaimedJob, GuardedWrite (the token is required), RunKey."
    template: jobs/platform/jobs.contracts.ts.tpl
  - path: src/modules/platform/jobs/jobs.port.ts
    slot: be.platform.jobs
    role: "JobClaims, JobStep and JobProcessorRegistry ports."
    rules: [BE_JOB_FENCE_REQUIRED]
    template: jobs/platform/jobs.port.ts.tpl
  - path: src/modules/platform/jobs/job-claim.service.ts
    slot: be.platform.jobs
    role: "The claim and the guarded writes; the only writer of the job row."
    rules: [BE_JOB_WRITE_OUTSIDE_OWNER]
    template: jobs/platform/job-claim.service.ts.tpl
  - path: src/modules/platform/jobs/job-claim.service.spec.ts
    slot: be.platform.jobs
    template: jobs/platform/job-claim.service.spec.ts.tpl
  - path: src/modules/platform/jobs/job-runner.service.ts
    slot: be.platform.jobs
    role: "Subscribes processors to their queues; claim, process, complete or fail, fenced out means stop."
    template: jobs/platform/job-runner.service.ts.tpl
  - path: src/modules/platform/jobs/job-runner.service.spec.ts
    slot: be.platform.jobs
    template: jobs/platform/job-runner.service.spec.ts.tpl
  - path: src/modules/platform/jobs/fenced.processor.ts
    slot: be.platform.jobs
    role: "The base class every processor extends."
    template: jobs/platform/fenced.processor.ts.tpl
  - path: src/modules/platform/jobs/jobs.log-events.ts
    slot: be.platform.jobs
    template: jobs/platform/jobs.log-events.ts.tpl
  - path: src/modules/platform/jobs/errors/jobs.error.ts
    slot: be.platform.jobs
    role: "JobFencedOut."
    template: jobs/platform/jobs.error.ts.tpl
  - path: src/modules/platform/jobs/messages/jobs.messages.ts
    slot: be.domain.messages
    template: jobs/platform/jobs.messages.ts.tpl
  - path: src/modules/platform/jobs/persistence/connection.ts
    slot: be.persistence
    role: "The job entity array registered on every connection that runs jobs."
    template: jobs/platform/persistence.connection.ts.tpl
  - path: src/modules/platform/jobs/persistence/entities/job.entity.ts
    slot: be.persistence
    template: jobs/platform/persistence.job.entity.ts.tpl
  - path: src/modules/platform/jobs/persistence/jobs.sql.ts
    slot: be.persistence
    role: "The claim and guarded-write statements as SqlText constants."
    template: jobs/platform/persistence.jobs.sql.ts.tpl
  - path: src/modules/platform/jobs/persistence/jobs.rows.ts
    slot: be.persistence
    template: jobs/platform/persistence.jobs.rows.ts.tpl
  - path: src/modules/platform/jobs/persistence/migrations/<epochMs13>-create-jobs.ts
    slot: be.persistence
    template: jobs/platform/persistence.migration.ts.tpl
  - path: src/features/jobs/<job>/index.ts
    slot: be.feature.jobs
    template: jobs/job.index.ts.tpl
  - path: src/features/jobs/<job>/<job>.module.ts
    slot: be.feature.jobs
    template: jobs/job.module.ts.tpl
  - path: src/features/jobs/<job>/transport/queue/<job>-queue.module.ts
    slot: be.feature.jobs.queue
    template: jobs/job.queue.module.ts.tpl
    role: The queue transport module of the job; composed by an api or worker app, registers the processor.
  - path: src/features/jobs/<job>/transport/queue/<job>.processor.ts
    slot: be.feature.jobs.queue
    template: jobs/job.processor.ts.tpl
    role: 'The processor of one job; extends FencedProcessor — thin (R203 `BE_FEATURE_THIN`): `process` maps the claimed job and delegates into modules/.'
    rules: [BE_JOB_SHAPE]
  - path: src/features/jobs/<job>/steps/<step>.step.ts
    slot: be.jobs.steps
    template: jobs/job.step.ts.tpl
    role: 'One external effect; implements JobStep and passes the run key — thin (R203 `BE_FEATURE_THIN`): it maps the job and delegates into modules/.'
    rules: [BE_JOB_SHAPE, BE_JOB_RUN_KEY]
  - path: src/features/jobs/<job>/application/<action>.command.ts
    slot: be.feature.application
    optional: true
  - path: src/features/jobs/<job>/application/<action>.handler.ts
    slot: be.feature.application
    optional: true
  - path: src/features/jobs/<job>/application/<action>.contracts.ts
    slot: be.feature.application
    optional: true
  - path: src/tests/e2e/<area>/<job>.e2e-spec.ts
    slot: be.tests.e2e
    role: "Titles fenced-job/<scenario>: ... prove the pattern."
    spec: fenced-job/claim-bumps-token, fenced-job/zombie-fenced-out, fenced-job/redispatch-isolated
    rules: [BE_PATTERN_SPEC_MISSING]
