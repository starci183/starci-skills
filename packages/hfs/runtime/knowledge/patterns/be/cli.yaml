schema: starci/knowledge-source@1
id: be.cli
title: Backend cli
purpose: |-
  Given a one-off action (migrate, seed, sync, backup, an operator command), where does it live and how is it written? Every
  one-off action is a nest-commander command of the cli feature root `be/src/features/cli/`, compiled into the one cli app
  `be/apps/cli` and shipped as one image run as `cli <group> <command>`. A command is an action runner: thin (R203
  `BE_FEATURE_THIN`) like every other feature file — it maps the command line and makes one delegating call into the
  modules — and it still owes its unit spec beside it (the `cli` role of `ruleParams.be.unitRoles`). Its slot is
  `coverage: none`, so a command is never a coverage target.
appliesTo:
  - backend
family: be
pattern: cli
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (one cli app on nest-commander; features grouped by trigger kind)
    - https://docs.nestjs.com/recipes/nest-commander
  limitations: |-
    Static checks prove where a command is declared, how the cli app boots, that every command has its spec beside it and
    that nothing else parses the command line. They do not prove that a migration or a seed is right for live data, that a
    deploy runs the migrate command first and once, or that an operator command is safe to re-run; the command's spec, the
    test world's migration run and the deploy review prove those.
rules:
  - id: BE-CLI-1
    title: One cli app boots nest-commander and never serves
    kind: mandatory
    hfsRules: [R147, R148]
    requirement: |-
      Every one-off action of a back end runs in ONE app, `be/apps/cli` (slot `be.app.cli`, kind `cli`, named `cli`). It is
      required as soon as the back end declares a connection in `hfs.json` `sides.be.connections` (its migrations run as
      `cli migrate run`) or tracks a command under `src/features/cli/`, and it tracks its image `be/apps/cli/Dockerfile`: one
      image, run as `cli <group> <command>`. `apps/cli/src/main.ts` boots with `CommandFactory.run(AppModule, logger)` of
      nest-commander and never serves: no `NestFactory.create*`, no `.listen()`, no microservice connection, no
      `@nestjs/platform-*` adapter and no `@nestjs/microservices`. `apps/cli/src/app.module.ts` composes the platform modules
      the commands need (the database capability over every connection with its entities and migrations, like an api app) and
      the static cli feature root module `CliModule`; `apps/cli/src/cli.options.ts` carries what the cli reads from the
      environment, the connections it migrates among them.
    rationale: |-
      One image for every operator action gives one place to find, deploy and audit them, and a process that never listens
      cannot become a second, unguarded door into the application.
    cases:
      - id: case-1
        when: The cli entry
        write: |-
          // be/apps/cli/src/main.ts
          async function bootstrap(): Promise<void> {
              await CommandFactory.run(AppModule.register(parseCliOptions(EnvSource.fromProcess())), new JsonLinesLogger())
          }
          void bootstrap()
      - id: case-2
        when: The cli app calls `NestFactory.createApplicationContext` or `app.listen()`
        write: 'Refused (BE_CLI_BOOTSTRAP): the cli app boots only through CommandFactory.run.'
      - id: case-3
        when: A back end declares a connection and has no apps/cli
        write: 'Refused (BE_CLI_REQUIRED): add be/apps/cli with main.ts, app.module.ts, cli.options.ts and its Dockerfile, declared as { "name": "cli", "kind": "cli" } in hfs.json sides.be.apps.'
    verification:
      automated:
        - BE_CLI_REQUIRED
        - BE_CLI_BOOTSTRAP
      manual:
        - Confirm the deploy runs the cli image as a job and never as a long-running service.
    relatedExamples: []
  - id: BE-CLI-2
    title: Commands live in the cli feature root as groups and sub-commands
    kind: mandatory
    hfsRules: [R149]
    requirement: |-
      A nest-commander command (`@Command` or `@SubCommand`) is declared only in the cli feature root `src/features/cli/`
      (slot `be.cli`). The root holds `index.ts` and `cli.module.ts` and one folder per group: `<group>/<group>.cli.ts` (the
      group `@Command` with its `subCommands`), `<group>/<group>.module.ts` and `<group>/subs/<name>.cli.ts` (a `@SubCommand`
      class extending `CommandRunner`), one command per file. The cli feature root is a feature, so every module of it is a
      static `@Module({ imports, providers })` with no module definition, no options file and no `register`: `CliModule`
      imports each group module and a group module provides its commands. A command makes its one delegating call on an
      injected runner service of the modules (the migrate and seed runners of `platform/database`) and takes its options
      from a nest-commander `@Option` of its own (`cli seed run --env <name>`). The suffix is
      `.cli.ts`, because `.command.ts` is the CQRS message (api.yaml).
    rationale: |-
      A fixed group and sub-command layout maps the command line `cli <group> <command>` to one file path, so an operator
      command and its spec are found from the name alone.
    cases:
      - id: case-1
        when: The migrate group
        write: |-
          // be/src/features/cli/migrate/migrate.cli.ts
          @Command({ name: "migrate", subCommands: [RunCli], description: "Schema migrations of every connection" })
          /** The migrate group; without a sub-command it shows its help. */
          export class MigrateCli extends CommandRunner {
              async run(): Promise<void> { this.command.help() }
          }
      - id: case-2
        when: A `@SubCommand` declared in src/modules/platform/database/reindex.cli.ts or in features/api/
        write: 'Refused (BE_CLI_COMMAND_SHAPE, BE_CLI_OWNER): move it to src/features/cli/<group>/subs/reindex.cli.ts and register it in the group module.'
    verification:
      automated:
        - BE_CLI_COMMAND_SHAPE
      manual: []
    relatedExamples: []
  - id: BE-CLI-3
    title: A command is an action runner with its own unit spec
    kind: mandatory
    hfsRules: [R149, R47, R102, R203]
    requirement: |-
      A cli command is thin (R203 `BE_FEATURE_THIN`) like every other file of a feature-tier slot: `run` maps the command
      line and makes one delegating call into the modules (a service, a platform capability or a modules function), with no
      branch, loop, `try`, `throw` or computation. As an action runner it is exempt from the transport-shape law R88 (the
      `exempt` of the `cli` entry of `ruleParams.be.unitRoles`), and it still owes its unit spec `<name>.cli.spec.ts` beside
      it, built like a service spec (test.yaml BE-TEST-2), which asserts the delegation. The slot `be.cli` is
      `coverage: none`, so a command is never a coverage target. A command never imports an api feature: what it shares
      with a request lives in a domain capability (folder.yaml BE-FOLDER-2).
    rationale: |-
      An operator action runs against production data, often once; its delegation has no request path that an e2e run
      exercises, so the unit spec is the only automatic proof that the command hands its inputs to the right module.
    cases:
      - id: case-1
        when: A seed command
        write: 'features/cli/seed/subs/demo.cli.ts (`@SubCommand({ name: "demo" })`, `DemoSeedCli extends CommandRunner`) reads its options and calls the seed runner of a platform or domain capability; demo.cli.spec.ts beside it asserts the delegation.'
      - id: case-2
        when: A command with no spec
        write: 'Refused (BE_CLI_COMMAND_SHAPE, unit-test-colocated): features/cli/db/subs/backup.cli.ts without backup.cli.spec.ts beside it.'
    verification:
      automated:
        - BE_CLI_COMMAND_SHAPE
        - BE_TEST_TOPOLOGY
        - BE_CONTRACT_UNGUARDED
        - BE_SPEC_PLACEMENT
        - BE_FEATURE_THIN
      manual:
        - Confirm a command that writes is safe to re-run or refuses a second run explicitly.
    relatedExamples: []
  - id: BE-CLI-4
    title: Only the cli parses the command line
    kind: mandatory
    hfsRules: [R150]
    requirement: |-
      `nest-commander` is imported only by `be/apps/cli` and `src/features/cli/`. No back-end source parses command-line
      arguments itself: `process.argv` and the parsers `commander`, `yargs` and `minimist` are refused everywhere, the cli
      included. A one-off action anywhere but a cli command is a door this rule closes.
    rationale: |-
      A flag read in an api app's main.ts or a script beside the source is an operator door no review sees and no spec
      covers.
    cases:
      - id: case-1
        when: An api main.ts reads `process.argv.includes("--seed")` to seed before listening
        write: 'Refused (BE_CLI_OWNER): the seed is `cli seed demo`, run as its own job.'
    verification:
      automated:
        - BE_CLI_OWNER
      manual: []
    relatedExamples: []
  - id: BE-CLI-5
    title: Migrations and seeds run only as cli commands
    kind: mandatory
    hfsRules: [R34, R147]
    requirement: |-
      Migrations run only through the cli migrate command (`cli migrate run`, the root script `npm run migrate`) and through
      the test world over the same connection list (`cli.options.ts`). Seed data never sits in a
      migration: it is a sub-command of the `seed` group. Api and worker apps neither migrate nor seed (persistence.yaml
      BE-PERSISTENCE-2).
    rationale: |-
      One runner per connection removes the race of two processes migrating, and one list shared with the test world makes
      the tested schema the deployed one.
    cases:
      - id: case-1
        when: The migrate command
        write: 'features/cli/migrate/subs/run.cli.ts (`@SubCommand({ name: "run" })`, `RunCli extends CommandRunner`) makes one call on `MigrationRunnerService` of `platform/database`, which migrates every connection in order and fails the process on the first error; run.cli.spec.ts beside it.'
      - id: case-2
        when: A module runs `dataSource.runMigrations()` at boot of an api app
        write: 'Refused (BE_SCHEMA_AUTHORITY): only the cli and the test world run migrations.'
    verification:
      automated:
        - BE_SCHEMA_AUTHORITY
        - BE_CLI_REQUIRED
      manual:
        - Confirm the deploy runs `cli migrate run` to completion before the api and worker apps start.
    relatedExamples: []
files:
  - path: apps/cli/Dockerfile
    slot: repo.app-image
    optional: true
    role: the one cli image, run as `cli <group> <command>`
    rules:
      - BE_CLI_REQUIRED
  - path: apps/cli/src/main.ts
    slot: be.app.cli
    optional: true
    role: CommandFactory.run(AppModule, logger); never serves
    rules:
      - BE_CLI_BOOTSTRAP
      - BE_ENTRYPOINT_ONLY_IN_APPS
  - path: apps/cli/src/app.module.ts
    slot: be.app.cli
    optional: true
    role: composes the platform modules and CliModule; no business code
    rules:
      - BE_APP_COMPOSITION_ONLY
      - BE_CLI_BOOTSTRAP
  - path: apps/cli/src/cli.options.ts
    slot: be.app.cli
    optional: true
    role: what the cli reads from the environment, the connection list it migrates among them
    rules:
      - BE_CLI_REQUIRED
      - BE_SCHEMA_AUTHORITY
  - path: src/features/cli/index.ts
    slot: be.cli
    optional: true
    role: exports CliModule to the cli app
    rules:
      - BE_PUBLIC_SURFACE
  - path: src/features/cli/cli.module.ts
    slot: be.cli
    optional: true
    role: the static cli feature root module; imports each group module
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_MODULE_SHAPE
  - path: src/features/cli/migrate/migrate.cli.ts
    slot: be.cli
    optional: true
    role: the migrate group @Command and its subCommands
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_CLI_OWNER
    spec: src/features/cli/migrate/migrate.cli.spec.ts
  - path: src/features/cli/migrate/migrate.module.ts
    slot: be.cli
    optional: true
    role: "the static migrate group module: provides its command and sub-commands"
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_MODULE_SHAPE
  - path: src/features/cli/migrate/subs/run.cli.ts
    slot: be.cli
    optional: true
    role: "`cli migrate run`: one delegating call on the migration runner of `platform/database`, the one runner of the schema"
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_SCHEMA_AUTHORITY
    spec: src/features/cli/migrate/subs/run.cli.spec.ts
  - path: src/features/cli/seed/seed.cli.ts
    slot: be.cli
    optional: true
    role: the seed group @Command and its subCommands
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_CLI_OWNER
    spec: src/features/cli/seed/seed.cli.spec.ts
  - path: src/features/cli/seed/seed.module.ts
    slot: be.cli
    optional: true
    role: "the static seed group module: provides its command and sub-commands"
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_MODULE_SHAPE
  - path: src/features/cli/seed/subs/run.cli.ts
    slot: be.cli
    optional: true
    role: "`cli seed run [--env <name>]`: one delegating call on the seed runner of `platform/database`"
    rules:
      - BE_CLI_COMMAND_SHAPE
    spec: src/features/cli/seed/subs/run.cli.spec.ts
  - path: src/features/cli/<group>/<group>.cli.ts
    slot: be.cli
    role: the group @Command and its subCommands
    template: cli/group.cli.ts.tpl
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_CLI_OWNER
  - path: src/features/cli/<group>/<group>.cli.spec.ts
    slot: be.cli
    role: the unit spec of the group, beside it
    template: cli/group.cli.spec.ts.tpl
  - path: src/features/cli/<group>/<group>.module.ts
    slot: be.cli
    role: "the static group module: provides its command and sub-commands"
    template: cli/group.module.ts.tpl
    rules:
      - BE_CLI_COMMAND_SHAPE
      - BE_MODULE_SHAPE
  - path: src/features/cli/<group>/subs/run.cli.ts
    slot: be.cli
    role: the first sub-command of the group; one delegating call on the injected runner service
    template: cli/sub.run.cli.ts.tpl
    rules:
      - BE_CLI_COMMAND_SHAPE
  - path: src/features/cli/<group>/subs/run.cli.spec.ts
    slot: be.cli
    role: the unit spec of the sub-command, beside it
    template: cli/sub.run.cli.spec.ts.tpl
