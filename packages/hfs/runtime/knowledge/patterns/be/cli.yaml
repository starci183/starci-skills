schema: starci/knowledge-source@1
id: be.cli
title: Operator commands (kind cli)
purpose: |-
  Given an operation an operator runs by hand (requeue dead letters, rebuild a projection, backfill), where does it live? A feature of kind
  `cli` under `features/cli/<command>/`: one command-line entry that dispatches one command or query, composed only by an app of kind
  `cli` and run from the shell, never from a request. It reaches the system through the same application layer an api feature uses.
appliesTo:
  - backend
family: be
provenance:
  reviewedAt: 2026-10-02
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (seven trigger kinds)
  limitations: |-
    Static checks prove the entry shape, that only a cli app composes it and the kind boundary. They do not prove that an operation is safe
    to repeat; the e2e run of the command twice does.
rules:
  - id: BE-CLI-1
    title: A cli entry dispatches one message and is composed by a cli app
    kind: mandatory
    hfsRules: [R136, R90, R46]
    requirement: |-
      `features/cli/<command>/transport/cli/<name>.cli.ts` is registered through `platform/cli`, maps the arguments and flags to a request,
      dispatches exactly one command or query on the bus and prints the typed result; it holds no business decision. Only an app of kind `cli`
      composes it, and it imports no feature of another kind. A command that must be safe to run twice says so in its handler through an
      idempotent write, and a long operation enqueues a job (queues.yaml) instead of looping in the shell.
    rationale: |-
      The shell is one more door; the decision and its transaction stay in the domain.
    cases:
      - id: case-1
        when: An operator requeues a dead letter
        write: 'features/cli/requeue-dead-letter/transport/cli/requeue-dead-letter.cli.ts parses the id and dispatches RequeueDeadLetterCommand.'
    verification:
      automated:
        - BE_ENTRYPOINT_ONLY_IN_APPS
        - BE_FEATURE_NOT_COMPOSED
        - BE_KIND_ISOLATION
        - BE_TRANSPORT_SHAPE
      manual:
        - Confirm the command is safe to run twice, or refuses a second run with a typed error.
    relatedExamples: [cli]
  - id: BE-CLI-2
    title: A cli command is proven by running it on the world
    kind: mandatory
    hfsRules: [R46]
    requirement: |-
      Each command has an e2e spec that boots the cli app on the test world and runs it with real arguments: the intended change happens, a second
      run is a no-op or a typed refusal, and a bad argument exits non-zero with the error code.
    rationale: |-
      Argument parsing and exit codes are what an operator sees; only a run through the app exercises them.
    cases:
      - id: case-1
        when: The requeue command
        write: 'requeue-dead-letter.e2e-spec.ts buries an event, runs the command, reads the delivery, runs it again and reads no second delivery.'
    verification:
      automated:
        - BE_BACKGROUND_UNOWNED
      manual: []
    relatedExamples: [cli]
files:
  - path: src/features/cli/<command>/index.ts
    slot: be.feature.cli
    role: The public surface of the command; only a cli app imports it.
  - path: src/features/cli/<command>/<command>.module.ts
    slot: be.feature.cli
    role: Composes the application and the cli transport.
  - path: src/features/cli/<command>/application/<action>.command.ts
    slot: be.feature.application
    role: The command (or `.query.ts`) the entry dispatches.
  - path: src/features/cli/<command>/application/<action>.handler.ts
    slot: be.feature.application
    role: Authorizes, then calls the domain service of its context.
  - path: src/features/cli/<command>/application/<action>.contracts.ts
    slot: be.feature.application
    role: The plain request and result types of the action.
  - path: src/features/cli/<command>/transport/cli/<name>.cli.ts
    slot: be.feature.transport.cli
    role: The entry maps arguments, dispatches one message and prints the result.
    rules: [BE_TRANSPORT_SHAPE, BE_ENTRYPOINT_ONLY_IN_APPS]
  - path: src/features/cli/<command>/transport/cli/<command>-cli.module.ts
    slot: be.feature.transport.cli
    role: One module for the cli transport of the command.
  - path: src/tests/e2e/<area>/<command>.e2e-spec.ts
    slot: be.tests.e2e
    role: The command run on the booted cli app, with its effect, a repeat and a bad argument.
