# supabase/config.toml violating L08: literal credentials, an over-long JWT, and auth values the app did not declare.
[api]
enabled = true
schemas = ["public"]

[auth]
site_url = "https://undeclared.example.com"
jwt_expiry = 86400
enable_signup = true
additional_redirect_urls = ["https://evil.example.com"]

[auth.external.apple]
secret = "env(APPLE_SECRET)"

# The github provider's literal secret is appended per run by hfs-database-rules.spec.mjs (a generated value, never a committed one).
[auth.external.github]
client_id = "literal-client-id"
