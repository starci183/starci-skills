# Publishes the local SonarQube as the public host URL every product's GitHub
# CI scans against (see README.md), under the `starci` Compose project. The Cloudflare control plane and API credential live
# at Source scope; this stack owns only the connector process, which receives its issued run token from the
# environment (`${CLOUDFLARE_TUNNEL_TOKEN}`, a secret.env variable that `starci gate sonar up --public` passes and
# requires). No token is stored here or beside it.
name: starci

services:
  cloudflared-sonarqube:
    image: cloudflare/cloudflared:2026.8.2
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}cloudflared-sonarqube
    profiles: [public]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?run through starci gate sonar up --public - CLOUDFLARE_TUNNEL_TOKEN is a secret.env variable}
    depends_on:
      sonarqube:
        condition: service_healthy
      sonarqube-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
