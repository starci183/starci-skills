# The shared local SonarQube - a HOST extension, not part of any product stack.
#
# One SonarQube Community Build with a dedicated PostgreSQL database serves every
# StarCi product (see README.md). This file runs under the `starci`
# Compose project. The project name, container names, named volumes and the
# published port variable are fixed, so the running starci-sonarqube
# container and its data keep working under this extension.
#
# No secret is stored here or beside it. The stack reads `${SONARQUBE_DB_PASSWORD}` and
# `${SONARQUBE_ADMIN_PASSWORD}` from the environment of the process that runs Compose: `starci gate sonar up`
# passes them from the owner's untracked `.claude/secret.env` (engine/secrets.mjs secretEnv) and refuses, naming
# the variable, when one is missing. The one-shot bootstrap replaces SonarQube's default admin password with
# SONARQUBE_ADMIN_PASSWORD. The published port variable is `${STARCI_PORT_SONARQUBE}`, which the same verb derives
# from the host declared in scripts/gates/sonar-local.mjs.
#
# Cloudflare routing is published by cloudflared.yaml (profile `public`).
name: starci

services:
  sonarqube-postgres:
    image: postgres:17-alpine
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}sonarqube-postgres
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?run through starci gate sonar up - SONARQUBE_DB_PASSWORD is a secret.env variable}
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sonarqube -d sonarqube
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}sonarqube
    depends_on:
      sonarqube-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?run through starci gate sonar up - SONARQUBE_DB_PASSWORD is a secret.env variable}
    ports:
      - "${STARCI_PORT_SONARQUBE:?run through starci gate sonar up - it derives the published port}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-temp:/opt/sonarqube/temp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --noproxy '*' -fsS http://localhost:9000/api/system/status |
          grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  sonarqube-bootstrap:
    image: curlimages/curl:8.15.0
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}sonarqube-bootstrap
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONARQUBE_ADMIN_PASSWORD: ${SONARQUBE_ADMIN_PASSWORD:?run through starci gate sonar up - SONARQUBE_ADMIN_PASSWORD is a secret.env variable}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if curl -fsS -u "admin:$${SONARQUBE_ADMIN_PASSWORD}" \
          http://sonarqube:9000/api/authentication/validate | grep -q '"valid":true'; then
          exit 0
        fi
        curl -fsS -u admin:admin -X POST \
            --data-urlencode 'login=admin' \
            --data-urlencode 'previousPassword=admin' \
            --data-urlencode "password=$${SONARQUBE_ADMIN_PASSWORD}" \
            http://sonarqube:9000/api/users/change_password
    restart: "no"

volumes:
  sonarqube-postgres-data:
    name: starci-sonarqube-postgres-data
  sonarqube-data:
    name: starci-sonarqube-data
  sonarqube-extensions:
    name: starci-sonarqube-extensions
  sonarqube-logs:
    name: starci-sonarqube-logs
  sonarqube-temp:
    name: starci-sonarqube-temp
