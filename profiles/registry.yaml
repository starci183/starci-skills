schema: starci/profile-registry@3
runtimes:
  - codex
  - claude
  - qwen
aliases:
  openai: codex
  anthropic: claude
  qwencloud: qwen
  alibaba: qwen
executionModes:
  solo:
    hosts: [codex, claude, orca]
    controlPlane: current-chat-session
    operationAgent: inline-background-agent
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: current-session-worktree
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
  orchestrated:
    controlPlane: orca
    workers: [codex, claude, qwen]
    workflowWrapperAgent: child-worktree-agent
    operationAgent: workflow-inline-subagent
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: isolated-child-per-workflow-attempt
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
agentArchitecture:
  levels: [plan, coordinator, workflow-wrapper, operation-wrapper-agent, concrete-operation-agent]
  flexibleLayers: [plan, coordinator, workflow-wrapper]
  isolationBoundary: operation
  wrapperResponsibilities: [resolve-dependencies, normalize-input, resolve-agent-chain, validate-output, route-output, retry-no-effect]
  operationMapping: one-operation-instance-one-agent
  concreteAgentBinding: provider-profile-model
orchestration:
  runtime: orca
  owner: source-host
  workspaceRouting: .workspaces/projects/<project>/work.json
  approvalPolicy: approvals/policy.json
  approvalMode: accepted-brief-then-auto
  dispatch: The Orca parent coordinates the Plan DAG and creates one isolated child worktree for each
    ready workflow. The child workflow wrapper resolves dependencies and launches one isolated
    subagent for each ready operation, using the first ready external agent in that operation's chain.
defaults:
  codex:
    working: gpt-5.6-sol
    reasoning: gpt-5.6-sol-reviewer
  claude:
    working: opus
    reasoning: fable
  qwen:
    working: qwen3.8-flash-worker
    reasoning: qwen3.8-max-reviewer
reasoningOps:
  - business.decide
  - architecture.decide
  - review.verify
targets:
  codex-gpt-5.6-sol:
    runtime: codex
    profile: gpt-5.6-sol
    requestedModel: gpt-5.6-sol
    orcaLaunch:
      kind: managed-agent
      agent: codex
  codex-gpt-5.6-sol-reviewer:
    runtime: codex
    profile: gpt-5.6-sol-reviewer
    requestedModel: gpt-5.6-sol
    orcaLaunch:
      kind: managed-agent
      agent: codex
  claude-opus:
    runtime: claude
    profile: opus
    requestedModel: null
    orcaLaunch:
      kind: managed-agent
      agent: claude
  claude-fable:
    runtime: claude
    profile: fable
    requestedModel: null
    orcaLaunch:
      kind: managed-agent
      agent: claude
  qwen-qwen3.8-flash-worker:
    runtime: qwen
    profile: qwen3.8-flash-worker
    requestedModel: qwen3.8-flash
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-flash --approval-mode auto
      dispatch: return-preamble-and-send
  qwen-qwen3.8-max-worker:
    runtime: qwen
    profile: qwen3.8-max-worker
    requestedModel: qwen3.8-max
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --approval-mode auto
      dispatch: return-preamble-and-send
  qwen-qwen3.8-max-reviewer:
    runtime: qwen
    profile: qwen3.8-max-reviewer
    requestedModel: qwen3.8-max
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --approval-mode auto
      dispatch: return-preamble-and-send
  qwen-qwen3.8-flash-reviewer:
    runtime: qwen
    profile: qwen3.8-flash-reviewer
    requestedModel: qwen3.8-flash
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-flash --approval-mode auto
      dispatch: return-preamble-and-send
skills:
  starci:
    chains:
      working:
        - codex-gpt-5.6-sol
        - claude-opus
        - qwen-qwen3.8-flash-worker
        - qwen-qwen3.8-max-worker
      reasoning:
        - codex-gpt-5.6-sol-reviewer
        - claude-fable
        - qwen-qwen3.8-max-reviewer
        - qwen-qwen3.8-flash-reviewer
operators:
  architecture.decide:
    skill: starci
    chain: [codex-gpt-5.6-sol-reviewer, claude-fable, qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol-reviewer]}
      - {environment: claude, profiles: [claude-fable]}
      - {environment: qwen, profiles: [qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]}
  backend.implement:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  business.decide:
    skill: starci
    chain: [codex-gpt-5.6-sol-reviewer, claude-fable, qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol-reviewer]}
      - {environment: claude, profiles: [claude-fable]}
      - {environment: qwen, profiles: [qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]}
  content.generate:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker, codex-gpt-5.6-sol, claude-opus]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
  interface.draw:
    skill: starci
    chain: [codex-gpt-5.6-sol, qwen-qwen3.8-max-worker, claude-opus, qwen-qwen3.8-flash-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: qwen, profiles: [qwen-qwen3.8-max-worker, qwen-qwen3.8-flash-worker]}
      - {environment: claude, profiles: [claude-opus]}
  interface.implement:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker, codex-gpt-5.6-sol, claude-opus]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
  knowledge.repair:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  release.deliver:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  review.verify:
    skill: starci
    chain: [codex-gpt-5.6-sol-reviewer, claude-fable, qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol-reviewer]}
      - {environment: claude, profiles: [claude-fable]}
      - {environment: qwen, profiles: [qwen-qwen3.8-max-reviewer, qwen-qwen3.8-flash-reviewer]}
  runtime.operate:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  scope.retire:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  task.execute:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  uat.verify:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
  workspace.manage:
    skill: starci
    chain: [codex-gpt-5.6-sol, claude-opus, qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker, qwen-qwen3.8-max-worker]}
fallback:
  allowedReasons:
    - unavailable
    - quota-exhausted
    - rate-limited
    - startup-failure
    - unsupported
  requiredEffectState: none
  blockedReasons:
    - permission-denied
    - user-checkpoint
    - business-ambiguity
    - safety-block
    - partial-or-unknown-effects
selection: Orca supplies the observed external-agent inventory. Resolve the selected skill and
  operator chain from top to bottom, choosing the first ready runtime/profile. Fall through only
  after an allowed failure with verified no-effect state. This policy never installs an agent,
  authenticates a provider, grants tools or expands the workflow authority. Use managed-agent
  launch when Orca recognizes the provider; use the declared command-terminal strategy for a
  usable CLI such as Qwen that this Orca build does not recognize for supervised worker-start.
assetFallback: When image generation is unavailable, reuse verified assets first; Claude may leave
  decorative image slots blank with a concrete deferred brief. Never mark missing artwork generated
  or satisfy a functional criterion with a blank slot.
examples:
  codexFrontend:
    runtime: codex
    profile: gpt-5.6-sol
    model: gpt-5.6-sol
    imageGenerationAvailable: true
  claudeFrontend:
    runtime: claude
    profile: opus
    model: null
    imageGenerationAvailable: false
  orcaInterfaceImplementation:
    skill: starci
    op: interface.implement
    availableRuntimes:
      - codex
      - claude
      - qwen
examplesNote: Examples of frontend context.execution only. Set availability from observed host
  tools, never copy true as proof. Fixed-runtime contexts may omit model to inherit the actual host
  configuration. Orca resolves ordered skill/operator candidates from observed readiness instead.
