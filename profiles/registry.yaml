      - {environment: claude, profiles: [claude-opus]}
      - {environment: qwen, profiles: [qwen3.8-flash]}
  interface.implement:
    skill: starci
    chain: [qwen3.8-flash, claude-opus, gpt-5.6-sol]
    environments:
