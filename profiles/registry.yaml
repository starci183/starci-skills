schema: starci/profile-registry@3
runtimes:
  - codex
  - claude
  - qwen
aliases:
  openai: codex
  anthropic: claude
  qwencloud: qwen
  alibaba: qwen
  deepseek: qwen
executionModes:
  solo:
    hosts: [codex, claude, orca]
    controlPlane: current-chat-session
    operationAgent: isolated-background-agent
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: current-session-worktree
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
  orchestrated:
    controlPlane: orca
    bootstrapHosts: [codex, claude, orca]
    bootstrapRole: create-native-coordinator-and-handoff
    coordinatorAgent: persistent-native-agent-in-main-worktree
    coordinatorAuthority: owns-plan-run-and-dag
    workers: [codex, claude, qwen]
    workflowWrapperAgent: persistent-native-manager-agent-in-child-worktree
    workflowManagerAuthority: owns-operation-dag-and-boundary-loop
    workflowManagerReportsTo: parent-coordinator
    workflowManagerExecutionPolicy: decision-dispatch-wait-only
    higherLayerSubstitution: forbidden
    operationAgent: supervised-native-agent-in-workflow-worktree
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: isolated-child-per-workflow-attempt
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
agentArchitecture:
  levels: [plan, coordinator, workflow-wrapper, operation-wrapper-agent, concrete-operation-agent]
  flexibleLayers: [plan, coordinator, workflow-wrapper]
  isolationBoundary: operation
  wrapperResponsibilities: [resolve-dependencies, normalize-input, resolve-agent-chain, validate-output, route-output, retry-no-effect]
  operationMapping: one-operation-instance-one-agent
  concreteAgentBinding: provider-profile-model
orchestration:
  runtime: orca
  owner: source-host
  defaultOperationTarget: qwen3.8-flash
  workspaceRouting: .workspaces/projects/<project>/work.json
  approvalPolicy: approvals/policy.json
  approvalMode: accepted-brief-then-auto
  dispatch: A bootstrap session creates a persistent native Coordinator agent in the Orca main
    worktree and hands off the Plan Run. That Coordinator owns the DAG and creates one isolated child
    worktree for each ready workflow and launches one persistent native Workflow Manager in that child. The
    Workflow Manager resolves operation dependencies, launches one isolated subagent for each ready
    operation and waits for its boundary, using the first ready external agent in that operation's chain.
    Managers never implement, repair or test on behalf of a lower layer.
defaults:
  codex:
    working: gpt-5.6-sol
    reasoning: gpt-6-astra
  claude:
    working: opus
    reasoning: fable-5.1
  qwen:
    working: qwen3.8-flash-worker
    reasoning: qwen3.8-flash-reviewer
reasoningOps:
  - business.decide
  - architecture.decide
  - review.verify
targets:
  gpt-5.6-sol:
    runtime: codex
    requestedModel: gpt-5.6-sol
    profiles:
      working: gpt-5.6-sol
      reasoning: gpt-5.6-sol-reviewer
    orcaLaunch:
      kind: managed-agent
      agent: codex
  gpt-6-astra:
    runtime: codex
    requestedModel: gpt-6-astra
    profiles:
      reasoning: gpt-6-astra
    orcaLaunch:
      kind: managed-agent
      agent: codex
  claude-opus:
    runtime: claude
    requestedModel: null
    profiles:
      working: opus
    orcaLaunch:
      kind: managed-agent
      agent: claude
  claude-fable-5.1:
    runtime: claude
    requestedModel: null
    profiles:
      reasoning: fable-5.1
    orcaLaunch:
      kind: managed-agent
      agent: claude
  qwen3.8-flash:
    runtime: qwen
    requestedModel: qwen3.8-flash
    profiles:
      working: qwen3.8-flash-worker
      reasoning: qwen3.8-flash-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-flash --approval-mode yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      reasoningCommand: qwen --model qwen3.8-flash --approval-mode yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
  qwen3.8-max:
    runtime: qwen
    requestedModel: qwen3.8-max
    profiles:
      working: qwen3.8-max-worker
      reasoning: qwen3.8-max-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --approval-mode yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
  deepseek-v4-pro:
    runtime: qwen
    requestedModel: deepseek-v4-pro
    profiles:
      working: deepseek-v4-pro-worker
      reasoning: deepseek-v4-pro-reviewer
    orcaLaunch:
      kind: command-terminal
      command: qwen --model deepseek-v4-pro --approval-mode yolo --exclude-tools agent --max-session-turns 240 --max-wall-time 90m --max-tool-calls 600 --chat-recording false
      dispatch: return-preamble-and-send
targetAliases:
  qwen-qwen3.8-flash-worker: qwen3.8-flash
  qwen-qwen3.8-flash-reviewer: qwen3.8-flash
  codex-gpt-5.6-sol: gpt-5.6-sol
  codex-gpt-5.6-sol-reviewer: gpt-5.6-sol
  codex-gpt-6-astra: gpt-6-astra
  codex-gpt-6-astra-reviewer: gpt-6-astra
  qwen-qwen3.8-max-worker: qwen3.8-max
  qwen-qwen3.8-max-reviewer: qwen3.8-max
  qwen-deepseek-v4-pro-worker: deepseek-v4-pro
  qwen-deepseek-v4-pro-reviewer: deepseek-v4-pro
skills:
  starci:
    chains:
      working:
        - qwen3.8-flash
        - claude-opus
        - gpt-5.6-sol
      reasoning:
        - claude-fable-5.1
        - gpt-6-astra
supervisors:
  schema: starci/supervisor-chains@1
  note: Persistent native agents that only decide, dispatch and wait. Session stability outranks
    model depth here, so the working Claude profile leads and Codex Sol is the managed fallback.
  planCoordinator:
    chain: [claude-opus, gpt-5.6-sol]
    effort: high
  workflowMonitor:
    chain: [claude-opus, gpt-5.6-sol]
    effort: high
