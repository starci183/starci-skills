  architecture.decide:
    skill: starci
    chain: [claude-fable-5.1, gpt-6-astra]
    environments:
      - {environment: claude, profiles: [claude-fable-5.1]}
      - {environment: codex, profiles: [gpt-6-astra]}
  backend.implement:
    skill: starci
    chain: [qwen3.8-flash, claude-opus, gpt-5.6-sol]
    environments:
