schema: starci/profile-registry@3
runtimes:
  - codex
  - claude
  - qwen
aliases:
  openai: codex
  anthropic: claude
  qwencloud: qwen
  alibaba: qwen
  deepseek: qwen
executionModes:
  solo:
    hosts: [codex, claude, orca]
    controlPlane: current-chat-session
    operationAgent: isolated-background-agent
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: current-session-worktree
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
  orchestrated:
    controlPlane: orca
    bootstrapHosts: [codex, claude, orca]
    bootstrapRole: create-native-coordinator-and-handoff
    coordinatorAgent: persistent-native-agent-in-main-worktree
    coordinatorAuthority: owns-plan-run-and-dag
    workers: [codex, claude, qwen]
    workflowWrapperAgent: persistent-native-manager-agent-in-child-worktree
    workflowManagerAuthority: owns-operation-dag-and-boundary-loop
    workflowManagerReportsTo: parent-coordinator
    workflowManagerExecutionPolicy: decision-dispatch-wait-only
    higherLayerSubstitution: forbidden
    operationAgent: supervised-native-agent-in-workflow-worktree
    maxConcurrentOperationAgents: 3
    isolation: isolated-per-operation
    worktree: isolated-child-per-workflow-attempt
    scheduling: dependency-dag
    fanOutWithinOperation: forbidden
agentArchitecture:
  levels: [plan, coordinator, workflow-wrapper, operation-wrapper-agent, concrete-operation-agent]
  flexibleLayers: [plan, coordinator, workflow-wrapper]
  isolationBoundary: operation
  wrapperResponsibilities: [resolve-dependencies, normalize-input, resolve-agent-chain, validate-output, route-output, retry-no-effect]
  operationMapping: one-operation-instance-one-agent
  concreteAgentBinding: provider-profile-model
orchestration:
  runtime: orca
  owner: source-host
  defaultOperationTarget: qwen-qwen3.8-flash-worker
  workspaceRouting: .workspaces/projects/<project>/work.json
  approvalPolicy: approvals/policy.json
  approvalMode: accepted-brief-then-auto
  dispatch: A bootstrap session creates a persistent native Coordinator agent in the Orca main
    worktree and hands off the Plan Run. That Coordinator owns the DAG and creates one isolated child
    worktree for each ready workflow and launches one persistent native Workflow Manager in that child. The
    Workflow Manager resolves operation dependencies, launches one isolated subagent for each ready
    operation and waits for its boundary, using the first ready external agent in that operation's chain.
    Managers never implement, repair or test on behalf of a lower layer.
defaults:
  codex:
    working: gpt-5.6-sol
    reasoning: gpt-6-astra-reviewer
  claude:
    working: opus
    reasoning: fable-5.1
  qwen:
    working: qwen3.8-flash-worker
    reasoning: qwen3.8-flash-reviewer
reasoningOps:
  - business.decide
  - architecture.decide
  - review.verify
targets:
  codex-gpt-5.6-sol:
    runtime: codex
    profile: gpt-5.6-sol
    requestedModel: gpt-5.6-sol
    orcaLaunch:
      kind: managed-agent
      agent: codex
  codex-gpt-5.6-sol-reviewer:
    runtime: codex
    profile: gpt-5.6-sol-reviewer
    requestedModel: gpt-5.6-sol
    orcaLaunch:
      kind: managed-agent
      agent: codex
  codex-gpt-6-astra-reviewer:
    runtime: codex
    profile: gpt-6-astra-reviewer
    requestedModel: gpt-6-astra
    orcaLaunch:
      kind: managed-agent
      agent: codex
  claude-opus:
    runtime: claude
    profile: opus
    requestedModel: null
    orcaLaunch:
      kind: managed-agent
      agent: claude
  claude-fable-5.1:
    runtime: claude
    profile: fable-5.1
    requestedModel: null
    orcaLaunch:
      kind: managed-agent
      agent: claude
  qwen-qwen3.8-flash-worker:
    runtime: qwen
    profile: qwen3.8-flash-worker
    requestedModel: qwen3.8-flash
    orcaLaunch:
      kind: managed-agent
      agent: qwen-code
      startup: direct-native-worker-start
      modelAuthority: verified-qwen-runtime-configuration
      supervision: worker-start-agent
  qwen-qwen3.8-max-worker:
    runtime: qwen
    profile: qwen3.8-max-worker
    requestedModel: qwen3.8-max
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --approval-mode auto --exclude-tools agent --max-session-turns 80 --max-wall-time 30m --max-tool-calls 160 --chat-recording false
      dispatch: return-preamble-and-send
  qwen-deepseek-v4-pro-worker:
    runtime: qwen
    profile: deepseek-v4-pro-worker
    requestedModel: deepseek-v4-pro
    orcaLaunch:
      kind: command-terminal
      command: qwen --model deepseek-v4-pro --approval-mode auto --exclude-tools agent --max-session-turns 80 --max-wall-time 30m --max-tool-calls 160 --chat-recording false
      dispatch: return-preamble-and-send
  qwen-deepseek-v4-pro-reviewer:
    runtime: qwen
    profile: deepseek-v4-pro-reviewer
    requestedModel: deepseek-v4-pro
    orcaLaunch:
      kind: command-terminal
      command: qwen --model deepseek-v4-pro --approval-mode auto --exclude-tools agent --max-session-turns 40 --max-wall-time 20m --max-tool-calls 80 --chat-recording false
      dispatch: return-preamble-and-send
  qwen-qwen3.8-max-reviewer:
    runtime: qwen
    profile: qwen3.8-max-reviewer
    requestedModel: qwen3.8-max
    orcaLaunch:
      kind: command-terminal
      command: qwen --model qwen3.8-max --approval-mode auto --exclude-tools agent --max-session-turns 40 --max-wall-time 20m --max-tool-calls 80 --chat-recording false
      dispatch: return-preamble-and-send
  qwen-qwen3.8-flash-reviewer:
    runtime: qwen
    profile: qwen3.8-flash-reviewer
    requestedModel: qwen3.8-flash
    orcaLaunch:
      kind: managed-agent
      agent: qwen-code
      startup: direct-native-worker-start
      modelAuthority: verified-qwen-runtime-configuration
      supervision: worker-start-agent
skills:
  starci:
    chains:
      working:
        - qwen-qwen3.8-flash-worker
        - codex-gpt-5.6-sol
      reasoning:
        - codex-gpt-6-astra-reviewer
        - claude-fable-5.1
operators:
  architecture.decide:
    skill: starci
    chain: [codex-gpt-6-astra-reviewer, claude-fable-5.1]
    environments:
      - {environment: codex, profiles: [codex-gpt-6-astra-reviewer]}
      - {environment: claude, profiles: [claude-fable-5.1]}
  backend.implement:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  business.decide:
    skill: starci
    chain: [codex-gpt-6-astra-reviewer, claude-fable-5.1]
    environments:
      - {environment: codex, profiles: [codex-gpt-6-astra-reviewer]}
      - {environment: claude, profiles: [claude-fable-5.1]}
  content.generate:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  interface.draw:
    skill: starci
    chain: [codex-gpt-5.6-sol, qwen-qwen3.8-flash-worker]
    environments:
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
  interface.implement:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  knowledge.repair:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  release.deliver:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  review.verify:
    skill: starci
    chain: [qwen-qwen3.8-flash-reviewer, codex-gpt-5.6-sol-reviewer]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-reviewer]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol-reviewer]}
  runtime.operate:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  scope.retire:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  task.execute:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  uat.verify:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
  workspace.manage:
    skill: starci
    chain: [qwen-qwen3.8-flash-worker, codex-gpt-5.6-sol]
    environments:
      - {environment: qwen, profiles: [qwen-qwen3.8-flash-worker]}
      - {environment: codex, profiles: [codex-gpt-5.6-sol]}
fallback:
  allowedReasons:
    - unavailable
    - quota-exhausted
    - rate-limited
    - startup-failure
    - unsupported
  requiredEffectState: none
  blockedReasons:
    - permission-denied
    - user-checkpoint
    - business-ambiguity
    - safety-block
    - partial-or-unknown-effects
selection: Orca supplies the observed external-agent inventory. Resolve the selected skill and
  operator chain from top to bottom, choosing the first ready runtime/profile. Fall through only
  after an allowed failure with verified no-effect state. This policy never installs an agent,
  authenticates a provider, grants tools or expands the workflow authority. Use managed-agent
  launch when Orca recognizes the provider. This Orca build recognizes Qwen through native agent
  id qwen-code; Qwen 3.8 Flash therefore uses supervised worker-start and inherits its exact model
  from the verified Qwen runtime configuration. Launch it directly with `worker-start --agent qwen-code`;
  never create or attach a terminal by running the `qwen` command. Use a declared command-terminal only when an exact
  per-operation model override is required and the native adapter cannot carry that model.
costPolicy: |-
  Qwen 3.8 Flash is the default execution and independent-review target, including backend,
  frontend and UAT. Codex gpt-5.6-sol remains first only for interface.draw. Strategy and analysis
  operations business.decide and architecture.decide use Codex gpt-6-astra first and Claude Fable 5.1
  second. Automatic chains contain two native managed-agent candidates: execution and independent
  review fall back to gpt-5.6-sol, while drawing falls back to Qwen 3.8 Flash. DeepSeek V4 Pro,
  Qwen 3.8 Max and Claude Opus remain installed explicit or user-approved exception targets but are
  excluded from automatic chains. Command-terminal agents disable nested agents and have explicit turn, wall-time
  and tool-call ceilings; a ceiling stop is a failed attempt and never proof of completion. Never infer
  price or quality superiority from a subscription label; benchmark bounded representative
  operations before proposing another routing change. A native Qwen worker is released after its
  exact worker_done result is accepted; the workflow child remains until integration is complete.
assetFallback: When image generation is unavailable, reuse verified assets first; Claude may leave
  decorative image slots blank with a concrete deferred brief. Never mark missing artwork generated
  or satisfy a functional criterion with a blank slot.
examples:
  codexFrontend:
    runtime: codex
    profile: gpt-5.6-sol
    model: gpt-5.6-sol
    imageGenerationAvailable: true
  claudeFrontend:
    runtime: claude
    profile: opus
    model: null
    imageGenerationAvailable: false
  orcaInterfaceImplementation:
    skill: starci
    op: interface.implement
    availableRuntimes:
      - codex
      - claude
      - qwen
examplesNote: Examples of frontend context.execution only. Set availability from observed host
  tools, never copy true as proof. Fixed-runtime contexts may omit model to inherit the actual host
  configuration. Orca resolves ordered skill/operator candidates from observed readiness instead.
