schema: starci/fixture-report@1
synthetic: true
description: >
  # Independent synthetic workspace.prepare and review.verify forward-tests


  Date: 2026-09-07. This is local workflow evaluation, not product UAT, browser evidence, deployment
  acceptance, or a guarantee that an agent cannot fabricate observations.


  ## Request and authority


  The evaluator was asked to use the actual installed v3 instructions for one small purpose in a
  temporary synthetic repository. Scope: author only initial todo business planning; no product
  source, accounts, browser/network activity, commits, native platform goal or successor op.


  Synthetic purpose: a local text draft should survive reopening the application. Only initial
  requirement definition and acceptance planning are requested. Storage technology, client support,
  actor permissions, failure policy and numeric performance targets are unspecified.


  The evaluator installed the package into a new temporary host, read the installed bootstrap,
  SKILL.md, v3 runtime guide, common protocol, selected workspace.prepare document and current
  schema, and invoked the relocated public `work op workspace.prepare` command. The final
  common/goal changes were read again before handoff. The test is not based on a supplied expected
  completion verdict.


  The retained fixture is [forward-goal/draft](forward-goal/draft/index.yaml). Its body explicitly
  identifies synthetic user intent and unknowns. No existing product implementation is claimed.


  ## Executable replay and observations


  The installed workspace.prepare case in `cli.spec.mjs` replays the evaluator's bounded authoring
  decision in a fresh `git init` repository with a relocated installation. It is deterministic
  regression coverage of that decision, not a claim that a model independently re-reasons on every
  test run.


  Observed sequence:


  1. Initialize only the new `.starciwork` identity.

  2. Read/display `workspace.prepare`; byte hashes and modification times show no resulting
  filesystem mutation.

  3. Author the scoped parent plus setup, functional-planning and acceptance-planning leaves from
  the retained fixture.

  4. Invoke installed `validate` and `tree`; both return exit zero and leave product, Git and
  installed-package bytes unchanged.

  5. Stop. No successor command is invoked.


  Observed results:


  - Four nodes exist. Parent has no stored state; all four derive `todo`.

  - The acceptance-planning leaf is not eligible while its functional prerequisite is unfinished.

  - Zero account/environment/repository resource records are fabricated.

  - No completion binding, manifest, screenshot, code, product commit, `.worktrees`, request.json,
  response.json, run/session ledger or automatic successor appears.

  - Setup remains todo because this narrower evaluation requested initial scaffolding only. There is
  no invented setup review completion or product acceptance claim.

  - The actual operator catalogue resolves and displays all 31 contracts from an isolated relocated
  installation; before/after snapshots are identical.


  ## Results and findings


  The initial goal/quality stage executed `node --test cli.spec.mjs acceptance.spec.mjs` with **29
  tests passed, zero failed, zero skipped**. The dependency/impact extension below records its
  expanded final result separately.


  Earlier failures are not concealed: the catalogue test first failed while catalog.json had not yet
  been produced. A later no-mutation snapshot caught concurrent operator-source regeneration, so the
  test was corrected to inspect an isolated installed copy. The final passing run includes the full
  all-op check, not a skipped replacement.


  Independent core regressions found during this work and fixed by the core owner: malformed UAT
  assertion diagnostics lost behind a generic failure; inherited ancestor prerequisites not
  constraining descendant eligibility. Separate acceptance coverage proves shared evidence requires
  explicit per-consumer bindings and independently becomes suspended for a changed consumer.


  Operator feedback: new-business target absence and setup evidence ownership were initially
  ambiguous; the actual generated contract now names the setup leaf and treats absent new targets as
  expected. The owner also resolved the fresh workspace write-scope omission and undefined
  repository placeholders. The evaluator did not edit operator source.


  ## review.verify: actual local gate without self-invalidation


  After the coordinator identified post-verification semantic-body writes in operator documents, the
  operator owner revised the final common/quality contracts. The evaluator read those final
  documents fully and added a separate installed review.verify forward-test using
  [quality-source.spec.mjs](quality-source.spec.mjs), explicitly synthetic arithmetic rather than
  product behavior.


  Before selecting the consumer, the fixture provider establishes an unborn temporary Git
  repository, finalizes its repository resource from actual scoped source bytes, and supplies an
  existing operations leaf's gate/criteria/limits. This preparation is not a review.verify side
  effect: the consumer requires an existing scoped graph and may not create or repair missing
  inputs. It obtains the input digest through the installed read-only validator. No fabricated
  commit is supplied, and no resource evidence pointer is added after freezing the digest.


  The actual standalone Node test process reports one test, one pass, zero failures and exit zero.
  Its exact command, output, measured counts, source digest, absent performance threshold and
  unborn-HEAD limitation are retained in the temporary evidence bundle: gates/unit.json,
  logs/unit.txt, coverage.json, result.md and a manifest hashing those actual bytes. Completion
  changes only state/completion in the node.


  Final validation accepts the quality leaf as done while its specDigest, inputDigest, semantic
  body, repository resource bytes and source bytes remain unchanged. Thus this selected gate can
  complete without rewriting its own inputs. This does not mark any browser/UAT/product leaf
  complete.


  The first nested gate attempt returned zero but the runner warned that recursive test execution
  was skipped. The required nonzero test-count assertion rejected it; no evidence was accepted. The
  harness then launched a standalone subprocess without the parent test worker's NODE_TEST_CONTEXT.
  This execution produced the measured test result above. That correction changes harness execution
  context, not the source or passing criteria.


  ## Dependency graph, suspended completion and read-only impact


  Independent extension cases exercise explicit `.starciwork` graph relationships, never a
  hard-coded automatic operator sequence:


  - A business specification edit suspends completed architecture, implementation and UAT across
  several declared dependency hops. Authored done state, commits and evidence files are preserved.

  - Missing, todo and reasoned-na module nodes do not make account/chat consumers eligible. A
  previously completed consumer also suspends when a prerequisite loses done even if all semantic
  digests still match.

  - Changing actual bytes in a design resource's declared local `files` suspends its UI
  implementation and dependent UAT. Unrelated backend remains done; no manual resource revision edit
  is needed for these declared bytes.

  - `work impact` uses the core's typed dependency/reference/ancestor-spec/child-input graph. It
  reports direct/transitive consumers and parent-input effects without spreading a child's input
  change into an unrelated sibling. A parent specification change does affect its descendants.

  - Unknown target, dependency typo, missing references, cycles and secret-bearing invalid resource
  metadata fail closed. Impact terminates on cycles and does not print credential values.

  - CLI impact/validation/tree snapshots prove no rewritten evidence, resource state,
  request/response ledger or automatic operation execution.


  Final expanded command: `node --test cli.spec.mjs acceptance.spec.mjs` — **37 tests passed, zero
  failed, zero skipped**. This remains synthetic workflow correctness, not live product acceptance.


  ## Limits


  This test proves bounded local authoring, schema compatibility, completion gating and lack of
  observed command side effects in these synthetic cases. It does not prove semantic adequacy of
  every business specification, actual UAT execution, authentic screenshots, remote artifact
  availability, Git commit-object existence, secret detection completeness or all possible agent
  decisions. Those limits remain explicit in the runtime contracts and validator documentation.
