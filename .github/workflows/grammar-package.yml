name: grammar-package

# Gates for the published @starci/grammar package (packages/grammar), which has its own install and
# is not part of the root checks. One job, in order:
#   typecheck         - the shipped sources plus stories (tsconfig.stories.json)
#   build             - the dist the package ships
#   pack:check        - `npm pack --dry-run` of that dist
#   build-storybook   - the static Storybook still builds
# The grammar carries no spec suites (owner 2026-10-12): its proof is typecheck + build and the grammar DNA snapshot.
# It runs ONCE per release, on the push of a v* tag (and when a person dispatches it): never on a branch push or a pull request (rule CI_TRIGGERS_RELEASE_ONLY).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grammar-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grammar:
    name: typecheck + build + pack + storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/grammar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/grammar/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Pack check (no stories in the tarball)
        run: npm run pack:check

      - name: Build Storybook
        run: npm run build-storybook
