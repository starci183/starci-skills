name: example-unit

# Runs the unit suite of each example app. An app's `npm test` runs its back end's unit project with --coverage and
# fails below the per-file 100 threshold on its `*.service.ts` files; nothing is uploaded anywhere and Sonar reads no
# coverage. A front end has no tests.

on:
  push:
    paths:
      - 'examples/**'
  pull_request:
    paths:
      - 'examples/**'

permissions:
  contents: read

concurrency:
  group: example-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  unit:
    name: ${{ matrix.app.flag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: examples/todo-app
            flag: todo-app
          - dir: examples/ecommerce-app
            flag: ecommerce-app
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
