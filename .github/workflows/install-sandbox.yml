name: install-sandbox

# A person dispatches this to prove, on a clean Linux runner and a clean Windows runner, that the packaged runtime installs and that the host configuration
# works. `pack` builds the same `npm pack` tarball as runtime-artifact.yml (same commands, the `files` list stays the one inventory); each `sandbox` leg then takes
# ONLY that tarball and runs `starci gate install-sandbox`, which installs it into an empty HOME and an empty app repository, asserts the configuration
# (payload, seeded config.yaml, bootstrap entry, host ignores, shim, entry check, machine database, idempotent second install) and fails when anything was written
# to the runner's real home. The runtime under test is the installed tarball, never this checkout: the checkout holds only the CLI dispatcher and the gate script it runs (no `npm ci`).
# Trigger is workflow_dispatch only (docs/git-governance.md, rule CI_TRIGGERS_RELEASE_ONLY). Local equivalents: docs/installation.md, "Install sandboxes".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: build + pack + verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The packages' runtime copies and the ui catalog map are ignored generated roots that `files` ships (same entry as runtime-artifact.yml).
      - name: Generate the packaged runtime copies
        run: npm run starci --silent -- release sync-runtime

      - name: Pack the root package
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/out"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/npm-pack.json"
          echo "tarball=$(node -p "require(process.env.RUNNER_TEMP + '/npm-pack.json')[0].filename")" >> "$GITHUB_OUTPUT"

      - name: Verify the inventory
        run: npm run starci --silent -- gate runtime-artifact --pack "$RUNNER_TEMP/npm-pack.json" --dir "$RUNNER_TEMP/pack" --out "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-sandbox-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  sandbox:
    name: sandbox (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Only the CLI dispatcher and the gate script it runs are taken from the repository (no dependency install); the runtime under test is the downloaded tarball.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            /scripts/
            /engine/
            /modules/
            /packages/cli/
            /package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-sandbox-tarball
          path: ${{ runner.temp }}/tarball

      # The init identity setup generates the host's age key with age-keygen, a pinned 1.2.1 or 1.3.1 (scripts/api/sops/lib.mjs). The runner's Go builds the
      # pinned release (module checksums verified by the Go checksum database); no other tool is provisioned.
      - name: Provide the pinned age-keygen
        run: |
          go install filippo.io/age/cmd/age-keygen@v1.3.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Exit 0 every assertion passed, 1 an assertion failed, 2 a step could not run. The script writes its table to $GITHUB_STEP_SUMMARY.
      - name: Run the install sandbox
        run: node packages/cli/bin/starci.mjs gate install-sandbox --tarball "$RUNNER_TEMP/tarball/${{ needs.pack.outputs.tarball }}"
