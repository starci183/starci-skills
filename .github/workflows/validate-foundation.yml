name: Validate v3 foundation

on:
  push:
    branches: [main, codex/starci-v3.0]
  pull_request:
    paths: ['.claude/**', '.dist/**', 'scripts/*.py', 'tests/requirements-schema.txt', '.github/workflows/validate-foundation.yml']

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-schema.txt
      - run: python scripts/test_foundation.py
