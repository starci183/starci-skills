name: ci

# The repository's own gate: `npm run check` (node --check over every runtime .mjs, the ops-registry
# freshness check, the provider validator) then the full `npm test` suite, on the Node 22 line the
# engines field requires. Runs on every push and pull request so a red tree shows up before review.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The eslint canons are npm workspaces of packages/ with their own lockfile: the runtime HFS check loads them
      # (R38 names eslint-be:error-home), so without this install it cannot resolve @typescript-eslint/parser.
      - name: Install the eslint canon workspace
        working-directory: packages
        run: npm ci

      # packages/grammar/dist is untracked; `npm run check` refuses a missing or stale one
      # (scripts/checks/check-grammar-dist.mjs), so build it from this commit's source first.
      - name: Build @starci/grammar
        working-directory: packages/grammar
        run: |
          npm ci
          npm run build

      - name: Static checks
        run: npm run check

      - name: Test suite
        run: npm test

      # Every published @starci package (the starci pins of knowledge/hfs/canon-pins.yaml) passes its own tests from a
      # clean install of its own manifest and lock in a temp dir: nothing hoisted in this checkout can hide an undeclared
      # dependency (test-world 1.0.0 shipped one). Exit 1 a red package, 2 a proof that could not run - never a pass.
      - name: Published packages from a clean install
        run: node scripts/gates/package-clean-test.mjs

      # The scaffolded app is proven against fresh registry installs: lint, typecheck and the api boot must RUN.
      # STARCI_REQUIRE_APP_INSTALLS=1 inside the script turns a missing install into a failure, never a skip.
      - name: Scaffold app against registry installs
        run: node scripts/gates/release-app-installs.mjs
