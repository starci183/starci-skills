name: ci

# The repository's own gate: `npm run check` (node --check over every runtime .mjs, the runtime HFS check and the self-checks), then the
# real tests of the runtime - every published package from a clean install (`starci release clean-test`), the scaffolded app against
# registry installs (`starci release app-installs`) and the scaffold end-to-end proof (`starci release scaffold-e2e`) - on the Node 22
# line the engines field requires. The runtime has no specs of its own and measures no coverage of its own (owner ruling no-runtime-specs,
# 2026-10-17: "Tests in packages/ and examples/ stay; the .claude runtime's own specs are removed entirely; delete codecov. Real tests
# (package clean-test + scaffold e2e) decide."; Codecov stays for the examples, uploaded by examples.yml). It runs on every push to main,
# on the push of a v* tag, on the push of a release candidate ref release/candidate-<version> and when a person dispatches it, never on
# another branch or a pull request (docs/git-governance.md, rule CI_TRIGGERS_RELEASE_ONLY): the release flow runs the same rows locally first,
# then `starci release cut` pushes the release sha to its candidate ref and moves main and the tag only when this run (and examples.yml and sonar.yml) of
# that sha is green (OWNER RULING candidate-ci, 2026-10-18). This workflow is check + test, plus the GitHub Release on the tag. The runtime's SonarCloud
# analysis and quality gate are sonar.yml: a workflow of their own that runs on main and on the candidate ref, so no run of this workflow carries a
# skipped Sonar job (a skipped check is red, owner ruling 2026-10-22) and the candidate is judged by its own Sonar gate before main moves.

on:
  push:
    branches: [main, 'release/candidate-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  check-and-test:
    name: check + test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The eslint canons are npm workspaces of packages/ with their own lockfile: the runtime HFS check loads them
      # (R38 names eslint-be:error-home), so without this install it cannot resolve @typescript-eslint/parser.
      - name: Install the eslint canon workspace
        working-directory: packages
        run: npm ci --ignore-scripts

      # @starci/test-world is built by the scaffold end-to-end spec (e2e/hfs-scaffold-app.e2e.spec.mjs) with ITS OWN pinned
      # TypeScript: it needs its own install (without one tsc resolves the newer compiler of packages/node_modules and refuses its tsconfig).
      - name: Install @starci/test-world
        working-directory: packages/test-world
        run: npm ci --ignore-scripts

      # packages/grammar/dist is untracked; `npm run check` refuses a missing or stale one
      # (scripts/checks/check-grammar-dist.mjs), so build it from this commit's source first.
      - name: Build @starci/grammar
        working-directory: packages/grammar
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Static checks
        run: npm run check

      # Every published @starci package (the starci pins of knowledge/hfs/canon-pins.yaml) passes its own tests from a
      # clean install of its own manifest and lock in a temp dir: nothing hoisted in this checkout can hide an undeclared
      # dependency (test-world 1.0.0 shipped one). Exit 1 a red package, 2 a proof that could not run - never a pass.
      # This is the CI run of every package suite under packages/ (heroicons, grammar, both eslint canons, stylelint, tsconfig,
      # prettier-config, jest-preset, test-world, cli, hfs); `npm run test:packages` is the same proof on a developer machine.
      # It runs after a red static check too, so a red package suite is never hidden behind another red step.
      - name: Published packages from a clean install
        if: ${{ !cancelled() }}
        run: npm run starci --silent -- release clean-test

      # The scaffolded app is proven against fresh registry installs: lint, typecheck and the api boot must RUN.
      # A missing install fails the step: the proof has no skip and no switch that would allow one.
      - name: Scaffold app against registry installs
        if: ${{ !cancelled() }}
        run: npm run starci --silent -- release app-installs

      # The scaffold end-to-end proof: the full and the lite scaffold installed from this checkout's packed packages, built, linted, type-checked and
      # run against a real Postgres and a local Supabase stack. A skipped test is red: every scaffold test must run.
      - name: Scaffold end to end
        if: ${{ !cancelled() }}
        run: npm run test:e2e

  # A pushed release tag becomes a GitHub Release: named after the tag, its body exactly the CHANGELOG section of that version (the same
  # section `starci release cut` made the annotated tag message from: `starci release notes`), marked a pre-release when the version has a
  # pre-release part. It runs only on a tag run and only after the check-and-test job is green; the trigger set is unchanged (R221).
  github-release:
    name: github release
    needs: check-and-test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node packages/cli/bin/starci.mjs release notes --tag "$TAG" --out "$RUNNER_TEMP/notes.md" --json > "$RUNNER_TEMP/notes.json"
          PRERELEASE=""
          if [ "$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).prerelease" "$RUNNER_TEMP/notes.json")" = "true" ]; then PRERELEASE="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE
          fi
