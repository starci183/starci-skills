name: todo-app-example

# Proves the todo-app example (examples/todo-app, its back end in be/ and its front end in fe/): record layout,
# type-check, unit tests, lint and build, on a declared GitHub-hosted runner, so the runtime's own gates
# (record layout, hfs lint) stay green for the example at all times. See
# examples/todo-app/README.md#continuous-verification for the job-by-job summary. The live stack and
# Playwright UAT job is e2e and runs MANUALLY only (owner ruling 2026-09-29): see todo-app-live-e2e.yml.
#
# The front end compiles sources out of packages/ (`@fe-kit/*`), so a change there is a change to what
# these jobs check.

on:
  push:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'

# A second push to the same branch/PR makes the still-running attempt pointless; cancel it instead of
# burning two live Postgres/Keycloak stacks on the same ref.
concurrency:
  group: todo-app-example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1) The example tree itself: the runtime's own YAML loader and Work-layout gate. There is no
  #    build step — the runtime reads this source tree directly (distless layout).
  records:
    name: records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies
        run: npm ci

      - name: Check example YAML parses under the runtime's own loader
        run: node scripts/checks/check-example-yaml.mjs

      - name: Check example Work-tree layout (ids, refs, evidence)
        run: node scripts/checks/check-example-work.mjs

      - name: Run the example Work-gate fixture suite
        run: node --test tests/example-work-gate.spec.mjs

  # 2) The app: one install at its root for both sides, then the type-check of both sides, the back end's unit
  #    tests, the front end's production build and hfs lint (the checker loads TypeScript through the app's own
  #    node_modules, never the runtime's). A front end has no tests.
  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/todo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies (repo root)
        working-directory: .
        run: npm ci

      - name: Install app dependencies
        run: npm ci

      # packages/fe-kit ships as source behind the `@fe-kit/*` alias, and nothing resolves its peers
      # (react, next, next-intl, @starci/grammar and their types) from packages/fe-kit upward. This
      # junctions them onto the app's installed copies, which is what tsc, eslint and next read.
      - name: Link fe-kit peers to the app's install
        working-directory: .
        run: node packages/fe-kit/scripts/link-peers.mjs todo-app

      - name: Type-check both sides (no emit)
        run: npm run typecheck

      - name: Unit tests (back end)
        run: npm test

      - name: Production build (front end)
        run: npm run build:fe

      # THE lint of the app: ESLint over be/ with the BE canon and over fe/ with the FE canon, stylelint over fe/ and
      # `hfs check` (which carries the architecture check); the layout is derived from the hfs.json of `--repo`. The
      # process exit code is the verdict - 0 no finding, 1 findings, 2 a tool could not run - and the command is run
      # unpiped so the runner sees it.
      - name: hfs lint
        working-directory: .
        run: node packages/hfs/bin/hfs.mjs lint --repo examples/todo-app
