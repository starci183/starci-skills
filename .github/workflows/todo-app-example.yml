name: todo-app-example

# Proves the todo-app example (examples/todo-app-backend + examples/todo-app-frontend): record layout,
# type-check, unit tests, lint and build, on a declared GitHub-hosted runner, so the runtime's own gates
# (record layout, scoped lint) stay green for the example at all times. See
# examples/todo-app-backend/README.md#continuous-verification for the job-by-job summary. The live stack and
# Playwright UAT job is e2e and runs MANUALLY only (owner ruling 2026-09-29): see todo-app-live-e2e.yml.
#
# Both example apps compile sources out of packages/ (`@fe-kit/*`, `@e2e-kit/*`), so a change there is a
# change to what these jobs check.

on:
  push:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'

# A second push to the same branch/PR makes the still-running attempt pointless; cancel it instead of
# burning two live Postgres/Keycloak stacks on the same ref.
concurrency:
  group: todo-app-example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1) The example tree itself: the runtime's own YAML loader and Work-layout gate. There is no
  #    build step — the runtime reads this source tree directly (distless layout).
  records:
    name: records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies
        run: npm ci

      - name: Check example YAML parses under the runtime's own loader
        run: node scripts/checks/check-example-yaml.mjs

      - name: Check example Work-tree layout (ids, refs, evidence)
        run: node scripts/checks/check-example-work.mjs

      - name: Run the example Work-gate fixture suite
        run: node --test tests/example-work-gate.spec.mjs

  # 2) todo-app-backend: unit tests plus the scoped-lint gate, both read-only and requiring nothing but
  #    the backend's own installed dependencies (the checker loads TypeScript through the checked
  #    repository's own node_modules, never the runtime's).
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/todo-app-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies (repo root)
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check (no emit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --selectProjects unit

      # The aggregate gate for this repository. The architecture check is one of its machine kinds, so it
      # runs here and nowhere else (docs/architecture-check.md); `--architecture-config` is resolved inside
      # `--root`. The process exit code is the verdict - 0 `clean`, 1 `findings`, 2 `unavailable` - and the
      # `starci/code-pattern-check@1` report on stdout is the detail, so no second step re-reads it.
      - name: Scoped lint (nest profile)
        working-directory: .
        run: node scripts/checks/check-scoped-lint.mjs --profile nest --root examples/todo-app-backend --architecture-config architecture.json --all

  # 3) todo-app-frontend: type-check, unit tests, lint, production build and the scoped-lint gate.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/todo-app-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies (repo root)
        working-directory: .
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      # packages/fe-kit ships as source behind the `@fe-kit/*` alias, and nothing resolves its peers
      # (react, next, next-intl, @starci/grammar and their types) from packages/fe-kit upward. This
      # junctions them onto this app's installed copies, which is what tsc, eslint, vitest and next read.
      - name: Link fe-kit peers to this app's install
        working-directory: .
        run: node packages/fe-kit/scripts/link-peers.mjs todo-app-frontend

      - name: Type-check (no emit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npx next build

      # Same gate as the backend's, on the `next` profile: the architecture check is one of its machine
      # kinds, and the exit code is the verdict (0 `clean`, 1 `findings`, 2 `unavailable`). The command is
      # run unpiped so the runner sees that exit code rather than `tee`'s.
      - name: Scoped lint (next profile)
        working-directory: .
        run: node scripts/checks/check-scoped-lint.mjs --profile next --root examples/todo-app-frontend --architecture-config architecture.json --all
