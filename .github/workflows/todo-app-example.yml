name: todo-app-example

# Proves the todo-app example (examples/todo-app-backend + examples/todo-app-frontend) end to end, on a
# declared GitHub-hosted runner, so UAT/demo evidence never has to come from a developer's laptop and the
# runtime's own gates (record layout, scoped lint) stay green for the example at all times. See
# examples/todo-app-backend/README.md#continuous-verification for the job-by-job summary.
#
# Both example apps compile sources out of packages/ (`@fe-kit/*`, `@e2e-kit/*`), so a change there is a
# change to what these jobs check.

on:
  push:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'modules/schemas/**'
      - 'scripts/checks/**'

# A second push to the same branch/PR makes the still-running attempt pointless; cancel it instead of
# burning two live Postgres/Keycloak stacks on the same ref.
concurrency:
  group: todo-app-example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1) The example tree itself: the runtime's own YAML loader and Work-layout gate. There is no
  #    build step — the runtime reads this source tree directly (distless layout).
  records:
    name: records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies
        run: npm ci

      - name: Check example YAML parses under the runtime's own loader
        run: node scripts/checks/check-example-yaml.mjs

      - name: Check example Work-tree layout (ids, refs, evidence)
        run: node scripts/checks/check-example-work.mjs

      - name: Run the example Work-gate fixture suite
        run: node --test tests/example-work-gate.spec.mjs

  # 2) todo-app-backend: unit tests plus the scoped-lint gate, both read-only and requiring nothing but
  #    the backend's own installed dependencies (the checker loads TypeScript through the checked
  #    repository's own node_modules, never the runtime's).
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/todo-app-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies (repo root)
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check (no emit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest

      # The aggregate gate for this repository. The architecture check is one of its machine kinds, so it
      # runs here and nowhere else (docs/architecture-check.md); `--architecture-config` is resolved inside
      # `--root`. The process exit code is the verdict - 0 `clean`, 1 `findings`, 2 `unavailable` - and the
      # `starci/code-pattern-check@1` report on stdout is the detail, so no second step re-reads it.
      - name: Scoped lint (nest profile)
        working-directory: .
        run: node scripts/checks/check-scoped-lint.mjs --profile nest --root examples/todo-app-backend --architecture-config architecture.json --all

  # 3) todo-app-frontend: type-check, unit tests, lint, production build and the scoped-lint gate.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/todo-app-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies (repo root)
        working-directory: .
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      # packages/fe-kit ships as source behind the `@fe-kit/*` alias, and nothing resolves its peers
      # (react, next, next-intl, @starci/grammar and their types) from packages/fe-kit upward. This
      # junctions them onto this app's installed copies, which is what tsc, eslint, vitest and next read.
      - name: Link fe-kit peers to this app's install
        working-directory: .
        run: node packages/fe-kit/scripts/link-peers.mjs todo-app-frontend

      - name: Type-check (no emit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npx next build

      # Same gate as the backend's, on the `next` profile: the architecture check is one of its machine
      # kinds, and the exit code is the verdict (0 `clean`, 1 `findings`, 2 `unavailable`). The command is
      # run unpiped so the runner sees that exit code rather than `tee`'s.
      - name: Scoped lint (next profile)
        working-directory: .
        run: node scripts/checks/check-scoped-lint.mjs --profile next --root examples/todo-app-frontend --architecture-config architecture.json --all

  # 4) Bring up the example's real dev stack (Postgres + Keycloak, realm `todo`, demo user) on the runner,
  #    build and run the real API and the real Next.js production server against it, and prove the product
  #    behavior with curl - not a mock. Every secret used here is the committed DEMO-ONLY SOPS material;
  #    nothing is read from GitHub Actions secrets.
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/todo-app-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned, checksum-verified installs (no `curl | sh`). Versions match what this repository already
      # pins elsewhere: sops v3.10.2 (ghcr.io/getsops/sops:v3.10.2, used by with-dev-secrets.sh's own
      # Docker fallback and by scripts/prepare.ps1/.sh) and age v1.2.1 (the apk version pinned in
      # scripts/prepare.sh). Both secrets/env files compose.yaml references (env_file / the keycloak
      # secret file) must exist as plaintext before `docker compose up`, so secrets are decrypted first.
      - name: Install sops (pinned, checksum-verified)
        run: |
          set -eu
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64"
          echo "79b0f844237bd4b0446e4dc884dbc1765fc7dedc3968f743d5949c6f2e701739  /tmp/sops" | sha256sum -c -
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Install age (pinned, checksum-verified)
        run: |
          set -eu
          curl -fsSL -o /tmp/age.tar.gz "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz"
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          chmod +x /tmp/age/age /tmp/age/age-keygen
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          age --version

      # `.starcistacks/dev/runtime/env/demo.agekey` is a demo key committed on purpose: it encrypts demo
      # values only, so this job needs no GitHub Actions secret. See that example's README and
      # .starcistacks/dev/runtime/env/KEYS.md.
      - name: Decrypt DEMO-ONLY dev secrets and bring up Postgres + Keycloak (not the app profile)
        run: |
          ./scripts/with-dev-secrets.sh \
            docker compose -f .starcistacks/dev/infra/compose/compose.yaml up -d

      - name: Wait for Postgres
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if docker compose -f .starcistacks/dev/infra/compose/compose.yaml exec -T postgres pg_isready -U postgres -d todo >/dev/null 2>&1; then
              echo "Postgres is ready."
              exit 0
            fi
            echo "Waiting for Postgres (attempt $attempt/30)..."
            sleep 2
          done
          echo "Postgres did not become ready in time." >&2
          exit 1

      - name: Wait for Keycloak (realm todo)
        run: |
          set -eu
          for attempt in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8089/realms/todo/.well-known/openid-configuration" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Keycloak realm todo is ready."
              exit 0
            fi
            echo "Waiting for Keycloak (attempt $attempt/45, last status $status)..."
            sleep 4
          done
          echo "Keycloak did not become ready in time." >&2
          exit 1

      - name: Install backend dependencies and build
        run: |
          npm ci
          npm run build

      - name: Start the API in the background (PORT=3001)
        run: |
          set -eu
          PORT=3001 ./scripts/with-dev-secrets.sh node dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/tasks || echo 000)
            # No session token is sent, so a live API answers 401; 000 means "not listening yet".
            if [ "$status" != "000" ]; then
              echo "API is answering (status $status)."
              exit 0
            fi
            echo "Waiting for the API (attempt $attempt/30)..."
            sleep 2
          done
          echo "API did not start in time." >&2
          cat api.log >&2
          exit 1

      - name: Curl proof - sign-in, refusal uniformity, task lifecycle, CORS
        run: |
          set -eu
          api="http://localhost:3001"

          # --- sign-in: demo user succeeds and returns a session token ---
          signin_body=$(curl -s -w '\n%{http_code}' -X POST "$api/auth/sign-in" \
            -H 'content-type: application/json' \
            -d '{"email":"demo@todo.dev","password":"todo-demo-pass"}')
          signin_status=$(echo "$signin_body" | tail -n1)
          signin_json=$(echo "$signin_body" | sed '$d')
          [ "$signin_status" = "201" ] || [ "$signin_status" = "200" ] || { echo "sign-in failed: $signin_status $signin_json" >&2; exit 1; }
          token=$(node -e "console.log(JSON.parse(process.argv[1]).sessionToken)" "$signin_json")
          [ -n "$token" ] || { echo "sign-in did not return a sessionToken" >&2; exit 1; }
          echo "signed in, session token acquired."

          # --- br.login.password.sign-in: wrong password and unknown email refuse identically ---
          wrong_password=$(curl -s -w '\n%{http_code}' -X POST "$api/auth/sign-in" \
            -H 'content-type: application/json' \
            -d '{"email":"demo@todo.dev","password":"not-the-password"}')
          unknown_email=$(curl -s -w '\n%{http_code}' -X POST "$api/auth/sign-in" \
            -H 'content-type: application/json' \
            -d '{"email":"nobody@todo.dev","password":"todo-demo-pass"}')
          wrong_status=$(echo "$wrong_password" | tail -n1); wrong_json=$(echo "$wrong_password" | sed '$d')
          unknown_status=$(echo "$unknown_email" | tail -n1); unknown_json=$(echo "$unknown_email" | sed '$d')
          [ "$wrong_status" = "401" ] || { echo "wrong password did not refuse with 401: $wrong_status" >&2; exit 1; }
          [ "$wrong_status" = "$unknown_status" ] || { echo "refusal status differs: wrong=$wrong_status unknown=$unknown_status" >&2; exit 1; }
          [ "$wrong_json" = "$unknown_json" ] || { echo "refusal body differs: wrong=$wrong_json unknown=$unknown_json" >&2; exit 1; }
          echo "wrong-password and unknown-email refuse with identical status and body."

          # --- task lifecycle: create two, act on one, delete it, keep the other for the persistence proof ---
          create() { curl -s -w '\n%{http_code}' -X POST "$api/tasks" -H "x-session-token: $token" -H 'content-type: application/json' -d "{\"title\":\"$1\"}"; }

          taskA=$(create "Buy milk"); taskA_status=$(echo "$taskA" | tail -n1); taskA_json=$(echo "$taskA" | sed '$d')
          [ "$taskA_status" = "201" ] || [ "$taskA_status" = "200" ] || { echo "create task A failed: $taskA_status $taskA_json" >&2; exit 1; }
          taskA_id=$(node -e "console.log(JSON.parse(process.argv[1]).taskId)" "$taskA_json")

          taskB=$(create "Walk the dog"); taskB_status=$(echo "$taskB" | tail -n1); taskB_json=$(echo "$taskB" | sed '$d')
          [ "$taskB_status" = "201" ] || [ "$taskB_status" = "200" ] || { echo "create task B failed: $taskB_status $taskB_json" >&2; exit 1; }
          taskB_id=$(node -e "console.log(JSON.parse(process.argv[1]).taskId)" "$taskB_json")
          echo "created task A ($taskA_id) and task B ($taskB_id)."

          list_has() { curl -s "$api/tasks" -H "x-session-token: $token" | node -e "
            const data = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
            process.exit(data.tasks.some(t => t.taskId === process.argv[1]) ? 0 : 1);
          " "$1"; }
          list_has "$taskA_id" && list_has "$taskB_id" || { echo "list did not contain both created tasks" >&2; exit 1; }
          echo "list contains both tasks."

          complete_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/tasks/$taskA_id/complete" -H "x-session-token: $token")
          [ "$complete_status" = "200" ] || [ "$complete_status" = "201" ] || { echo "complete failed: $complete_status" >&2; exit 1; }
          complete_again_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/tasks/$taskA_id/complete" -H "x-session-token: $token")
          [ "$complete_again_status" = "200" ] || [ "$complete_again_status" = "201" ] || { echo "complete-again is not a no-op success: $complete_again_status" >&2; exit 1; }
          echo "complete and complete-again both succeed (br.task.complete.once)."

          reopen_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/tasks/$taskA_id/reopen" -H "x-session-token: $token")
          [ "$reopen_status" = "200" ] || [ "$reopen_status" = "201" ] || { echo "reopen failed: $reopen_status" >&2; exit 1; }
          echo "reopen succeeds."

          delete_status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$api/tasks/$taskA_id" -H "x-session-token: $token")
          [ "$delete_status" = "200" ] || [ "$delete_status" = "204" ] || { echo "delete failed: $delete_status" >&2; exit 1; }
          echo "delete succeeds."

          list_has "$taskA_id" && { echo "deleted task A still listed" >&2; exit 1; }
          list_has "$taskB_id" || { echo "task B disappeared after deleting task A" >&2; exit 1; }
          echo "list after delete: task A gone, task B remains."

          # --- CORS: the configured browser origin gets the allow-origin header back ---
          cors_header=$(curl -s -D - -o /dev/null "$api/tasks" -H "x-session-token: $token" -H 'Origin: http://localhost:3000' | tr -d '\r' | grep -i '^access-control-allow-origin:' || true)
          echo "$cors_header" | grep -qi 'http://localhost:3000' || { echo "missing/incorrect CORS header: '$cors_header'" >&2; exit 1; }
          echo "CORS allow-origin header present for http://localhost:3000."

          echo "$token" > session.token
          echo "$taskB_id" > taskB.id

      - name: Restart the API process and prove persistence
        run: |
          set -eu
          kill "$(cat api.pid)" 2>/dev/null || true
          for attempt in $(seq 1 15); do
            kill -0 "$(cat api.pid)" 2>/dev/null || break
            sleep 1
          done

          PORT=3001 ./scripts/with-dev-secrets.sh node dist/main.js > api-restarted.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/tasks || echo 000)
            [ "$status" != "000" ] && break
            echo "Waiting for the restarted API (attempt $attempt/30)..."
            sleep 2
          done

          token=$(cat session.token)
          taskB_id=$(cat taskB.id)
          restarted_list=$(curl -s -w '\n%{http_code}' "http://localhost:3001/tasks" -H "x-session-token: $token")
          restarted_status=$(echo "$restarted_list" | tail -n1)
          restarted_json=$(echo "$restarted_list" | sed '$d')
          [ "$restarted_status" = "200" ] || { echo "list after restart failed: $restarted_status $restarted_json" >&2; cat api-restarted.log >&2; exit 1; }
          echo "$restarted_json" | node -e "
            const data = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
            if (!data.tasks.some(t => t.taskId === process.argv[1])) { console.error('task B did not survive the API restart'); process.exit(1); }
          " "$taskB_id"
          echo "session token and task B both survived an API process restart: Postgres-backed persistence proven."

      - name: Build and start the frontend against the live API
        working-directory: examples/todo-app-frontend
        run: |
          set -eu
          npm ci
          node ../../packages/fe-kit/scripts/link-peers.mjs todo-app-frontend
          npx next build
          npx next start -p 3000 > web.log 2>&1 &
          echo $! > web.pid
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in || echo 000)
            [ "$status" = "200" ] && break
            echo "Waiting for the frontend (attempt $attempt/30)..."
            sleep 2
          done

      - name: Curl proof - frontend routes render
        run: |
          set -eu
          for path in /sign-in /tasks; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            [ "$status" = "200" ] || { echo "$path returned $status, expected 200" >&2; exit 1; }
            echo "$path -> 200"
          done

      # The Playwright harness (examples/todo-app-frontend/uat, run by that app's own `uat` script) drives
      # the served frontend at http://localhost:3000; its config declares no webServer, so it runs in this
      # job, against the stack the steps above brought up.
      - name: Playwright UAT flows against the live stack
        working-directory: examples/todo-app-frontend
        run: |
          set -eu
          npx playwright install --with-deps chromium
          npm run uat

      # `uat/lib/paths.ts` writes each run into the backend's Work tree, the one `.starciwork` this product
      # owns, as `features/<feature>/uat/<flow>/runs/<runId>/{manifest.yaml,result.md,screens/,videos/}`,
      # with every screen and video referenced from that manifest by sha256. Uploading them by run id is
      # what makes a failed run readable without re-running it.
      - name: Upload UAT run evidence (manifest, result, screens, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-uat-runs-${{ github.run_id }}
          path: |
            examples/todo-app-backend/.starciwork/features/*/uat/*/runs/*/manifest.yaml
            examples/todo-app-backend/.starciwork/features/*/uat/*/runs/*/result.md
            examples/todo-app-backend/.starciwork/features/*/uat/*/runs/*/screens/*
            examples/todo-app-backend/.starciwork/features/*/uat/*/runs/*/videos/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API and compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-live-logs
          path: |
            examples/todo-app-backend/api.log
            examples/todo-app-backend/api-restarted.log
            examples/todo-app-frontend/web.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump compose logs
        if: failure()
        run: docker compose -f .starcistacks/dev/infra/compose/compose.yaml logs --no-color > compose.log 2>&1 || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-compose-logs
          path: examples/todo-app-backend/compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes and tear down the stack
        if: always()
        run: |
          kill "$(cat ../todo-app-frontend/web.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat api.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f .starcistacks/dev/infra/compose/compose.yaml down -v || true
