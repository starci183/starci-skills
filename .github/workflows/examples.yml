name: examples

# Every example app of this repository in CI: GitHub runs only the root workflows, so the app's own ci.yml (the app-repository
# form starci app sync renders) never runs here. The app list is DERIVED: job `apps` prints every examples/* folder whose hfs.json is of
# kind app (scripts/checks/check-examples-ci.mjs --matrix), and the `app` job runs once per entry. npm run check refuses a hand-written
# list, a per-example root workflow and a root codecov.yml that lacks a flag for an app (scripts/checks/check-examples-ci.mjs).
#
# Two triggers, one workflow (owner ruling: e2e runs manually only; rule CI_TRIGGERS_RELEASE_ONLY: CI runs once per release):
#   push of a v* tag      per app: install, typecheck (tsc over be, then turbo over the fe workspaces), starci app lint (with the Sonar import file),
#                         the unit project with coverage (per-file 100 on the logic of be/src/modules/**; it writes be/coverage/lcov.info), the Codecov
#                         upload under the app's flag, the be build (tsc and tsc-alias) and the fe build (turbo, the packages first, then
#                         every Next app), and the Sonar scan and quality gate where a server is configured
#                         (SonarCloud: secrets.SONAR_TOKEN and vars.SONAR_ORGANIZATION, the same the runtime's ci.yml reads; project <organization>_starci-example-<app>; otherwise the job notes the skip). A second job, `images`, builds the
#                         deployable images declared by every example (full: be+fe; lite: be only; the matrix is
#                         `check-examples-ci.mjs --images`) and never pushes
#   workflow_dispatch     the same, plus the layers that start the docker stack through the test world, chosen by the
#                         `layers` input: integration, e2e, or both. They never run on a tag push (npm run check
#                         refuses an integration or e2e step that is not gated on workflow_dispatch). A third manual job,
#                         `browser`, runs each app's one Playwright journey against a stack it provisions itself.
# The release cut's Sonar proof (scripts/supervisor/release-l4-sonar.mjs) reads the same projects on SonarCloud with the dashboard gate (scripts/gates/sonar-local.mjs dashboard).
#
# Codecov and Sonar upload only in the tag run (startsWith(github.ref, refs/tags/v)): a manual dispatch checks the app but publishes no measurement.
#
# Coverage upload: Codecov authenticates the job with GitHub's OIDC token (use_oidc, permissions id-token: write), so there is no
# repository secret and no step that skips silently without one; a failed upload fails the job.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      layers:
        description: The docker-stack layers to run on top of the automatic steps (manual only)
        type: choice
        options: [integration-and-e2e, integration, e2e]
        default: integration-and-e2e

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # The example apps, derived from examples/*/hfs.json (kind app).
  apps:
    name: apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts
      - id: list
        run: echo "apps=$(npm run starci --silent -- runtime check --only examples-ci -- --matrix)" >> "$GITHUB_OUTPUT"
      - id: images
        run: echo "images=$(npm run starci --silent -- runtime check --only examples-ci -- --images)" >> "$GITHUB_OUTPUT"

  # The example trees as records: the runtime's own YAML loader and Work-layout gate (no build: the runtime reads this tree).
  records:
    name: records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts
      - name: Example YAML parses under the runtime's own loader
        run: npm run starci --silent -- runtime check --only example-yaml
      - name: Example Work-tree layout (ids, refs, evidence)
        run: npm run starci --silent -- work check-example-work
      - name: Example Work-gate fixture suite
        run: node --test tests/checks/example-work-gate.spec.mjs

  app:
    name: ${{ matrix.app }}
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    permissions:
      contents: read
      id-token: write
    env:
      APP_DIR: examples/${{ matrix.app }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    defaults:
      run:
        working-directory: examples/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install runtime dependencies (repository root)
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Read generated test policy
        id: policy
        working-directory: .
        run: |
          if [ -f "$APP_DIR/codecov.yml" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi
      # The generated inputs (gitignored) first: the fe apps import the typed document table codegen writes, before any type-check or lint.
      - name: Codegen
        run: npm run codegen --silent
      # tsc over be/, then turbo typecheck over every fe workspace (the packages are built first: ^build).
      - name: Typecheck both sides
        run: npm run typecheck
      # THE lint of the app (ESLint with both canons, stylelint, starci app check), also written as the one Sonar import file.
      - name: starci app lint
        working-directory: .
        run: npm run starci --silent -- app lint --cwd "$APP_DIR" --sonar "$APP_DIR/reports/lint.sonar.json"
      - name: Unit tests with coverage (per-file 100 on the logic of be/src/modules/**; writes be/coverage/lcov.info)
        if: ${{ !cancelled() && steps.policy.outputs.tests == 'true' }}
        run: npm test -- --ci
      - name: Coverage upload (Codecov, flag ${{ matrix.app }})
        if: ${{ !cancelled() && steps.policy.outputs.tests == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: ${{ env.APP_DIR }}/be/coverage/lcov.info
          flags: ${{ matrix.app }}
          disable_search: true
          fail_ci_if_error: true
      - name: Back-end build (tsc, tsc-alias)
        run: npm run build:be
      # turbo builds the fe packages first, then every Next app; its cache is restored between runs.
      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: examples/${{ matrix.app }}/.turbo
          key: turbo-${{ matrix.app }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.app }}-
      - name: Front-end build
        run: npm run build:fe
      # Manual only: the docker-stack layers run on workflow_dispatch, never on the tag push.
      - name: Integration tests (test world, manual)
        if: ${{ steps.policy.outputs.tests == 'true' && github.event_name == 'workflow_dispatch' && contains(inputs.layers, 'integration') }}
        run: npm run test:integration -- --ci
      - name: E2E tests (test world, manual)
        if: ${{ steps.policy.outputs.tests == 'true' && github.event_name == 'workflow_dispatch' && contains(inputs.layers, 'e2e') }}
        run: npm run test:e2e -- --ci
      - name: Sonar scan
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        with:
          projectBaseDir: ${{ env.APP_DIR }}
          args: -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} -Dsonar.projectKey=${{ env.SONAR_ORGANIZATION }}_starci-example-${{ matrix.app }}
      - name: Sonar quality gate
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 10
        with:
          scanMetadataReportFile: ${{ env.APP_DIR }}/.scannerwork/report-task.txt
      - name: Sonar skipped (no server configured)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '') }}
        run: echo "::notice title=Sonar skipped::SonarCloud is not configured for this repository (secrets.SONAR_TOKEN and vars.SONAR_ORGANIZATION, the runtime's own ci.yml settings), so ${{ matrix.app }} was not scanned."

  # The one Playwright journey of each example app (owner ruling: manual only, like the docker-stack layers). It
  # provisions the whole product itself: ephemeral env values for the compose services (never the sealed demo
  # secrets), the infra containers, migrations and seeds, the host-run apis, and the built shop app that
  # Playwright's webServer serves.
  browser:
    name: browser ${{ matrix.app }}
    needs: apps
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    defaults:
      run:
        working-directory: examples/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Read generated test policy
        id: policy
        working-directory: .
        run: |
          if [ -f "examples/${{ matrix.app }}/codecov.yml" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Back-end build (tsc, tsc-alias)
        run: npm run build:be
      - name: Front-end build
        run: npm run build:fe
      - name: Browser stack up (ephemeral env, infra, migrate, seed, apis)
        if: ${{ steps.policy.outputs.tests == 'true' }}
        run: node browser/stack.mjs up
      - name: Install Chromium
        if: ${{ steps.policy.outputs.tests == 'true' }}
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Browser journey
        if: ${{ steps.policy.outputs.tests == 'true' }}
        run: npm run test:browser
      - name: Browser stack down
        if: ${{ always() && steps.policy.outputs.tests == 'true' }}
        run: node browser/stack.mjs down

  # Every deployable image, built and never pushed: full examples own be+fe images; lite examples own be images only.
  images:
    name: image ${{ matrix.app }}/${{ matrix.name }}
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.apps.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: examples/${{ matrix.app }}
          file: examples/${{ matrix.app }}/${{ matrix.file }}
          push: false
          tags: ${{ matrix.app }}/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.name }},mode=max
