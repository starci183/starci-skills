language: vi
model: null
effort: medium
# Adaptive mode combines fresh quota, live reservations and task/model suitability. Set preferredProvider to a
# provider id such as codex for a bounded owner bias; it is not a fallback chain.
allocation: {mode: adaptive, preferredProvider: null}
# Non-operation models are quota-aware peer pools. Eligibility and qualification still admit every actual call.
models:
  selection: quota-aware
  pools:
    fable-astra: [claude-fable-5.1, gpt-6-astra]
    opus-sol: [claude-opus, gpt-5.6-sol]
  nonOperation:
    planner: fable-astra
    kernelManager: opus-sol
    validator: fable-astra
