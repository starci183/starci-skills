# config.example.yaml — seed for the per-project owner config.
# The installer copies this file to the gitignored `config.yaml` next to it;
# owners edit that copy. Everything below is read at runtime — no key here is
# decorative. Kernel route precedence: explicit `--agent` flag >
# `kernel` below > the route-model default.
language: vi
model: null
effort: medium
# kernel — the long-lived [Kernel] agent's route, in one of two shapes
# (docs/config-format.md "Kernel group"):
#   group form (the default below): {group: [{agent, model?}, ...], effort?}.
#     start-workflow tries the members in order; a member whose provider is
#     unavailable (quota dead, provider circuit open) is skipped, a limited one
#     goes last, and a launch refused before the model took any input (an
#     interactive gate, an auth screen, a readiness or model-attestation
#     failure) falls through to the next member in the same boot.
#   single pin: {agent?, model?, effort?} — agent is an execution-agent id
#     (claude|codex|qwen|devin), model a modules/models/runtimes.yaml model id
#     (without agent, the pool that carries it supplies the agent). A pin is
#     authoritative: a dead probe, unknown model, unsupported CLI flag or
#     model-attestation mismatch fails closed instead of substituting.
#   effort: effort for the kernel seat (same vocabulary as `effort` above);
#     null inherits `effort`.
# Owner default: Claude Opus 5.5 first, GPT-6 Sol when Claude is unavailable.
kernel: {group: [{agent: claude, model: claude-opus-5-5}, {agent: codex, model: gpt-6-sol}], effort: high}
# parallel — the one knob for how wide the fleet runs. `gear` indexes the agent
# table in modules/models/runtimes.yaml allocation.slicing.size: a long (`l`)
# operation asks for the `l.agents[gear]` agents, an extra-long (`xl`) one for
# `xl.agents[gear]`; `s` and `m` operations are always one agent. Declared gears
# are allocation.slicing.gears — an undeclared value fails closed. Absent means
# the first declared gear. A gear raises only what `api estimate` requests; it
# never raises a pool's maxParallel, maxParallelOps or budgets.maxOps below.
parallel: {gear: 1}
# supervisor — the monitoring chat's cadence. pollIntervalMs is how often
# scripts/supervisor/poll.mjs prints a digest (at least 60000). null uses the
# script default; --interval-ms on the command line wins over this key.
supervisor:
  pollIntervalMs: null
# delegation — while the owner is away, a named delegate (e.g. the supervisor chat) may
# answer owner asks until the given time; excluded classes stay owner-only. null = none.
#   delegation: {asks: supervisor, until: 2026-09-23T09:00:00+07:00,
#     excludes: [credentials, oauth-consent, payments, legal, payment-provider]}
delegation: null
# budgets — owner-declared ceilings surfaced by every plan before `ok`, so the
# envelope the owner approves shows the caps the kernel was configured with.
# Null = unbounded. These are caps, not targets.
budgets:
  maxOps: null       # max concurrent dispatched ops one workflow may hold open;
                     # route/dispatch refuse `max-ops` at min(this, maxParallelOps)
  perOpMs: null      # per-op wall-clock ceiling in milliseconds
  dailyTokens: null  # daily token ceiling across kernel + ops
# Adaptive mode combines fresh quota, live reservations and task/model suitability. Set preferredProvider to a
# provider id such as codex or devin for a bounded owner bias; it is not a fallback chain. Devin also requires
# an explicit workflow allocation such as `devin-agent=2@implement+verify+write` before it has any capacity.
allocation: {mode: adaptive, preferredProvider: null}
# Non-operation models are a quota-aware peer pool over the provider-window runtime pools of
# modules/models/runtimes.yaml: claude-agent (Claude Opus 5.5) and codex-agent (GPT-6 Sol), the two
# runtimes that carry plan, decide and verify. Member order is the route order; eligibility and qualification
# still admit every actual call.
models:
  selection: quota-aware
  pools:
    sol-opus: [claude-agent, codex-agent]
  nonOperation:
    planner: sol-opus
    kernelManager: sol-opus
    validator: sol-opus
