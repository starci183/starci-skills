# config.example.yaml — seed for the per-project owner config.
# The installer copies this file to the gitignored `config.yaml` next to it;
# owners edit that copy. Everything below is read at runtime — no key here is
# decorative. Kernel route precedence: explicit `--agent` flag >
# `kernel.agent`/`kernel.model` below > the route-model default.
language: vi
model: null
effort: medium
# kernel — the long-lived [Kernel] agent's route pin. All three keys are
# optional; null means "no owner pin, let routing decide".
#   agent: an execution-agent id (claude|codex|qwen|devin). When set, Orca
#     launches that agent in a dedicated [Kernel] terminal (routedBy: config) and route-model is
#     not consulted for the kernel seat.
#   model: a model id declared by a modules/models/runtimes.yaml pool (e.g.
#     claude-opus-5-5). When set without agent, the pool that carries the
#     model supplies the agent. An unknown id fails closed.
#   effort: effort for the kernel seat (same vocabulary as `effort` above);
#     recorded on the kernel job and shown in plans. null inherits `effort`.
# Owner default: the codex pool on GPT-6 Sol at high effort. The Claude
# alternative is `kernel: {agent: claude, model: claude-opus-5-5,
# effort: high}`. An explicit pin is authoritative: a missing agent, dead
# authentication probe, unsupported CLI flag or model-attestation mismatch
# fails closed instead of substituting another agent.
kernel: {agent: codex, model: gpt-6-sol, effort: high}
# budgets — owner-declared ceilings surfaced by every plan before `ok`, so the
# envelope the owner approves shows the caps the kernel was configured with.
# Null = unbounded. These are caps, not targets.
budgets:
  maxOps: null       # max concurrent dispatched ops the kernel may hold open
  perOpMs: null      # per-op wall-clock ceiling in milliseconds
  dailyTokens: null  # daily token ceiling across kernel + ops
# Adaptive mode combines fresh quota, live reservations and task/model suitability. Set preferredProvider to a
# provider id such as codex or devin for a bounded owner bias; it is not a fallback chain. Devin also requires
# an explicit workflow allocation such as `devin-agent=2@implement+verify+write` before it has any capacity.
allocation: {mode: adaptive, preferredProvider: null}
# Non-operation models are a quota-aware peer pool over the provider-window runtime pools of
# modules/models/runtimes.yaml: codex-agent (GPT-6 Sol/Luna) and claude-agent (Claude Opus 5.5), the two
# runtimes that carry plan, decide and verify. Member order is the route order; eligibility and qualification
# still admit every actual call.
models:
  selection: quota-aware
  pools:
    sol-opus: [codex-agent, claude-agent]
  nonOperation:
    planner: sol-opus
    kernelManager: sol-opus
    validator: sol-opus
