# OPS section 3 item 16 (owner: observability, R262): `HEALTHCHECK CMD true` passes R189 - no rule defines what
# the probe must reach. The same item's `/readyz` aliasing liveness is the BE_READY_REAL half.
# Witnessed by R262 health-ready (HFS_DOCKER_HEALTHCHECK_FAKE is the hfs-side code of that rule).
name: healthcheck-fake
edition: lite
base: examples/lite-app
mutate:
  - op: edit
    path: be/apps/api/Dockerfile
    content: |
      # lite-app/api - the api app. The build context is the APP ROOT (the folder holding the one package.json and
      # package-lock.json), not this folder:
      #
      #   docker build -f be/apps/api/Dockerfile -t lite-app/api:<tag> .
      #
      # It follows the image canon and diverges from it nowhere. Credentials are mounted at run time and never enter the image.

      FROM node:22.14.0-alpine3.21 AS manifests
      WORKDIR /app
      COPY package.json package-lock.json ./
      COPY fe fe
      RUN find fe -type f ! -name package.json -delete

      FROM node:22.14.0-alpine3.21 AS build
      WORKDIR /app
      COPY --from=manifests /app ./
      RUN npm ci --ignore-scripts

      COPY be/tsconfig.json be/tsconfig.build.json be/
      COPY be/src be/src
      COPY supabase/types supabase/types
      COPY be/apps/api be/apps/api
      RUN npm run build:be

      FROM node:22.14.0-alpine3.21 AS runtime
      WORKDIR /app
      ENV NODE_ENV=production
      ENV PORT=3000

      COPY --from=manifests /app ./
      RUN npm ci --omit=dev --ignore-scripts && npm cache clean --force

      COPY --from=build /app/be/dist be/dist

      USER node
      EXPOSE 3000
      HEALTHCHECK CMD true
      CMD ["node", "be/dist/apps/api/src/main.js"]
expect:
  - HFS_DOCKER_HEALTHCHECK_FAKE
pending: R262
