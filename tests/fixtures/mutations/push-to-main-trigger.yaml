# OPS section 3 item 7: a product workflow triggered by push-to-main (and a cron schedule) passes - R221's
# enforcer runs over the StarCi repo, its examples and the templates, never over a product tree.
# Witnessed by R251 deploy-workflow.
name: push-to-main-trigger
edition: lite
base: examples/lite-app
mutate:
  - op: edit
    path: .github/workflows/ci.yml
    content: |
      name: api-deploy
      on:
        push:
          branches: [main]
        schedule:
          - cron: '*/5 * * * *'
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - run: echo deploying
expect:
  - HFS_APP_WORKFLOW_TRIGGER
