# Owner ruling 5 (2026-10-14) + OPS section 3 item 4 (RUN): secrets exist only as sealed
# .starcistacks/<env>/secrets/*.enc envelopes. A tracked plaintext secrets.env passes today: the R06
# assigned-secret pattern needs a quoted value and a bare keyword, so DB_PASSWORD, API_SECRET and
# OPENAI_API_KEY in dotenv form all escape it. Witnessed by R277.
name: plaintext-secrets-env
edition: lite
base: examples/lite-app
mutate:
  - op: add
    path: secrets.env
    content: |
      DB_PASSWORD=hunter2hunter2hunter2
      API_SECRET=9f8e7d6c5b4a3210fedc
      OPENAI_API_KEY=abcdefghijklmnopqrstuvwxyz012345
expect:
  - HFS_SECRET_PLAINTEXT_FILE
pending: R277
