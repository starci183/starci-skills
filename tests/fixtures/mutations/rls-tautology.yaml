# OPS section 3 item 6: a policy `using (id is not null) with check (id is not null)` passes R214 - only the
# literal `(true)` is refused today. Witnessed by R256 database-access (the DB rules run beside `starci app
# check`; the witness runner feeds the mutated tree to them).
name: rls-tautology
edition: lite
base: examples/lite-app
mutate:
  - op: add
    path: supabase/migrations/20261014090000_tautology-policy.sql
    content: |
      create policy t_app_be_update on public.t for update to app_be
        using (id is not null) with check (id is not null);
expect:
  - DB_POLICY_TAUTOLOGY
pending: R256
