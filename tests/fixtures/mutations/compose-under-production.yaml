# Owner ruling 2 (2026-10-14): lite production is docker-swarm declared in .starcistacks/application-stacks.yaml;
# a compose file under the production environment is the pre-ruling VPS deploy shape (OPS section 3, item 2 family;
# the owner's trigger case). Witnessed by R250 deploy-scan.
name: compose-under-production
edition: lite
base: examples/lite-app
mutate:
  - op: add
    path: .starcistacks/production/compose.yaml
    content: |
      services:
        api:
          image: lite-app/api:latest
          ports:
            - "3000:3000"
expect:
  - HFS_DEPLOY_COMPOSE_ON_VPS
pending: R250
