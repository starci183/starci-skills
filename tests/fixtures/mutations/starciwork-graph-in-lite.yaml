# Owner ruling 6 (2026-10-14): lite .starciwork holds .gitignore, workspace.yaml and brand/** and nothing else;
# the Work graph is a full-edition tree (R212 case-4). A work-graph record under a lite app is refused.
# This code has an enforcer today, so this fixture is the live proof that the mutation runner works.
name: starciwork-graph-in-lite
edition: lite
base: examples/lite-app
mutate:
  - op: add
    path: .starciwork/graph/x.yaml
    content: |
      nodes: []
expect:
  - HFS_STARCIWORK_LITE_FORBIDDEN
