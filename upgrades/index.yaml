schema: starci/upgrades@1
purpose: |-
  One entry per version an operator of an installed runtime has to do something about. This is not a
  changelog: a version appears here only when updating to it requires a person to know or to run something
  beyond `starci update`. The note beside each entry is the page that says what.

  `starci update` prints the note of the version it installed whenever the installed version changed, so an
  operator who only ever runs the installer is still told where to read.
upgrades:
  - version: 1.0.4
    note: upgrades/1.0.4.md
    summary: >-
      A workflow's record is one SQLite ledger per Work root, `.starciwork/runtime.sqlite`; the kernel no
      longer writes or reads `.starciwork/_local/workflows/<id>/`, and a workflow directory with no ledger row
      stops the kernel with `ledger-unmigrated`. Run `starci ledger-migrate --repo <root>` once per Work root,
      with the supervisor and its kernels stopped; nothing is deleted and a second run is a no-op. Commit the
      tracked `.starciwork/ledger-anchor.json`, which is what makes a lost or rolled-back ledger a refusal
      instead of a silent restart at generation 0. `journal-prune`/`journal-retire` are now
      `ledger-prune`/`ledger-retire` and take `--repo`; workers read their contract through
      `starci op-contract` and files are produced by `workflow-export`, never read as the record.
  - version: 1.0.0
    note: upgrades/1.0.0.md
    summary: >-
      StarCi 1.0 opt-in execution with SQLite admission, detached model/check jobs, strict candidate acceptance,
      unified Orca owner input, sealed runtime pins and optional agent-led coordination through a bounded
      manager decision function. Requires Node 22.13 or newer. Existing workflows
      stay on their recorded execution policy until paused, dispatches settled and explicitly retried into StarCi 1.0.
      Orca native write isolation is detection-only; native writers are serialized. This is a trial build,
      not a declaration that live provider integrations or a complete unattended workflow have passed.
  - version: 5.0.0-plus
    note: upgrades/5.0.0-plus.md
    summary: >-
      The runtime tree is laid out by concept and every command is one entry. A supervisor still using the
      retired launcher path must be restarted once through bin/starci.mjs; supervisors already using that
      entry need no manual restart for incremental updates, which follow the ordinary build-follows path.
      Existing workflow stores and product records are unchanged and resume.
