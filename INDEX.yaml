schema: starci/layout@3
version: 1.0.0-alpha.1
entry: SKILL.md
# Distless layout: there is no build step and no .dist output. The runtime reads
# the YAML/MD/MJS sources in this tree directly. Draft material stages in
# .experiments/ until promoted; superseded trees move to legacy/.
folders:
  init: Host AGENTS.md and CLAUDE.md bootstrap templates; never routed-source scaffolding
  skills: Companion skills a host discovers beside the entry (workflow chat, Orca stubs); routing stays in SKILL.md
  modules: Pure-YAML context catalog — modules/ops/ops/*.yaml op manifests with route keys, modules/models/ selection rules, modules/goal/ goal-chain rules, modules/schemas/ schema context
  workflows: Matrices, contracts and runtime gates
  kernel: The workflow control loop, one file per concern - the graph, the record catalog, the goal, the intake, the reconciliation, the owner loop, the ledger and its sync, contracts, scheduling, guards, terminals and the status view
  hosts: The host model as data and the adapters the kernel launches operations through, behind one call surface
  models: The model functions the runtime calls with a typed form - assess, critique, plan, decide and validate - and their headless providers
  upgrades: What an operator of an installed runtime must know and run after each version, one note per version
  providers: Provider capabilities, full API inventories, adapters, recipes and fail-closed validation
  knowledge: Lazy-loaded YAML guidance, read directly as canonical source
  contracts: Validation code
  core: Work validation runtime
  schemas: YAML schemas (workflow-state.schema.yaml documents the durable engine record; ledger-db.schema.yaml documents the runtime.sqlite/machine.sqlite table catalog of docs/ledger-db.md)
  specifications: Business and architecture contracts
  sqlite: Ledger DB schema and migrations for .starciwork/runtime.sqlite
  cli: Inspection commands
  scripts: Tooling; scripts/checks/ owns verification, scripts/route/ owns selection, scripts/example/ the example-derivation and evidence tools, scripts/work/ the plan/presentation/work-tree tools, scripts/ledger/ ledger migration, scripts/config/ local config loading, scripts/goal/ and scripts/kernel/ lifecycle entry points
  tests: Regression checks
  docs: Documentation, one file per concept
  sites: Documentation sites generated from catalogs
  legacy: Superseded trees kept for recovery (the old ops/ operator dirs and model/ catalog land here); nothing live reads it
limits:
  rows: 3
  parallel: 3
  secondaryPerCaller: 3
counts:
  skills: 1
  publicWorkflows: 16
  operators: 30
gates: workflows/gates.yaml
work:
  format: yaml-1.2
  schema: schemas/work.schema.yaml
  node: index.yaml
  approval: goal-before-effects-and-result-before-done
  checklist: <business>/<item>/**/index.yaml
  evidence: <business>/<item>/evidence/<id>/manifest.yaml
  workflowState: <backend>/.starciwork/_local/plans/<plan-id>/{index.yaml,goal/index.yaml,approval/index.yaml,run/index.yaml}
  layout: schemas/work-layout.yaml
executionModes:
  default: planned
  explicitFlash: workflows/flash.yaml
  providerCatalog: providers/catalog.yaml
