schema: starci/application-stacks@1
sources:
  - repository: ecommerce-app-be
components:
  postgres:
    image: postgres:16
    role: stateful
    compose: infra/compose/postgres.yaml
  redis:
    image: redis:7
    role: stateful
    compose: infra/compose/redis.yaml
  identity:
    image: ecommerce-app-be/identity
    role: service
    compose: infra/compose/identity.yaml
  order:
    image: ecommerce-app-be/order
    role: service
    compose: infra/compose/order.yaml
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      postgres:
        port: 5501
      redis:
        port: 6448
      identity:
        port: 5070
      order:
        port: 6070
    runbook: README.md
    # The dev stack carries no secret material (the local Postgres runs with trust auth), so there is
    # nothing to custody yet - a real environment adopts the SOPS+age pattern the todo-app example
    # demonstrates before it holds anything worth encrypting.
    secrets: []
# Delivery/quality services (contract change starcistacks-services). Codecov is the one service CI
# calls for this repository: the parent's example-coverage.yml uploads coverage/lcov.info under flag
# ecommerce-be with OIDC. Sonar points to the shared host extension; CI does not scan this example.
services:
  sonar:
    provider: sonarqube
    mode: local
    purpose: Local static analysis for the ecommerce backend example.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-new-code
    projects:
      - {repository: ecommerce-app-be, key: starci-ecommerce-app-be}
    credentials:
      - id: admin
        purpose: Host SonarQube project provisioning for this example; no CI analysis token is declared.
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-admin-token.key}
    ci:
      workflow: .github/workflows/ci.yml
      wiring: optional-follow-up
      secrets: []
      vars:
        - {name: SONAR_HOST_URL, value: https://sonar.starci.org}
      provisioning: >-
        The generated ci.yml scans and gates only when the repository has a SONAR_TOKEN secret (steps guarded by
        env.SONAR_TOKEN != ''); no project token is in custody for this example, so a Kernel (never the owner) mints
        one with sonar-local.mjs and sets it when it chooses to.
    ownerAction: none
  codecov:
    provider: codecov
    mode: hosted
    purpose: Coverage dashboard for the example unit suite (lcov.info upload, flag ecommerce-be).
    host:
      public: https://app.codecov.io
    auth: oidc
    projects:
      - {repository: ecommerce-app-be, key: gh/starci183/starci-skills, name: starci-skills}
    credentials: []
    ci:
      workflow: .github/workflows/example-coverage.yml
      wiring: required
      permissions: ['id-token: write']
      secrets: []
      vars: []
      provisioning: >-
        codecov/codecov-action@v5 with use_oidc true, flags ecommerce-be; the workflow lives in the
        parent repository's .github/workflows because examples carry no CI of their own.
    ownerAction: none
k8s:
  status: deferred
  reason: >-
    No Kubernetes deployment is declared for the dev-only second example.
