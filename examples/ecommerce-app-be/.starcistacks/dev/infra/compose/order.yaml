services:
  order:
    # See identity.yaml: same placeholder-image contract for the second service.
    image: ecommerce-app-be/order
    profiles: [app]
    depends_on:
      - postgres
    environment:
      ECOMMERCE_APP_BE_METADATA: /repo/examples/ecommerce-app-be/metadata.json
    ports:
      - "6070:6070"
