services:
  postgres:
    # DEMO-ONLY local dev database: trust authentication, so there is no password to custody
    # (metadata.json's shared-postgres resolution is 5432 + offset 69 = 5501; the host binding below
    # is that resolved number, never the docker-internal default). The init script creates one
    # database per connection: ecommerce_identity and ecommerce_order.
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5501:5432"
    volumes:
      - ecommerce-app-be-postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
volumes:
  ecommerce-app-be-postgres: {}
