type AccountType {
  email: String!
  hasOrders: Boolean!
  personId: ID!
}

type Mutation {
  register(input: RegisterInput!): RegisterType!
  revokeSession(input: RevokeSessionInput!): RevokeSessionType!
  signIn(input: SignInInput!): SignInType!
}

type Query {
  account: AccountType!
  verifySession(input: VerifySessionInput!): VerifySessionType!
}

input RegisterInput {
  email: String!
  password: String!
}

type RegisterType {
  personId: ID!
}

input RevokeSessionInput {
  sessionToken: String!
}

type RevokeSessionType {
  revoked: Boolean!
}

input SignInInput {
  email: String!
  password: String!
}

type SignInType {
  personId: ID!
  sessionToken: String!
}

input VerifySessionInput {
  sessionToken: String!
}

type VerifySessionType {
  personId: ID!
}
