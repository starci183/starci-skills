# Run-owned ephemeral stack for the end-to-end suite (npm run test:e2e).
#
# The suite starts and disposes this project itself, on every run, with a project name unique to that run
# (ec-e2e-<spec-hash>-<run-token>) and host ports allocated from the OS on 127.0.0.1 - a concurrent
# ecommerce-app-be-dev stack is never touched and never becomes the proof surface.
#
# Only postgres + redis live here: the suite spawns the compiled apps/identity and apps/order entrypoints as host
# child processes (the real AppModule, configured through the environment like any deployment), identity first.
# The stack creates one database per connection (ecommerce_identity, ecommerce_order), runs apps/migrate once and
# applies the seeds of .starcistacks/dev/seeds.
#
# Secrets are generated per run and passed through the environment; no plaintext credential sits in this tracked file.

name: ${E2E_COMPOSE_PROJECT}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${E2E_PG_USER}
      POSTGRES_PASSWORD: ${E2E_PG_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${E2E_PG_PORT}:5432"
    volumes:
      - ec-e2e-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT}:6379"

volumes:
  ec-e2e-postgres: {}
