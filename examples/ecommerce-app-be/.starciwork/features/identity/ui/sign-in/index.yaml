    anatomy: Desktop left illustration panel and right form region; never reversed. One cream duck stays
      wholly within the left panel.
  - name: frameless-auth-form
    anatomy: Right-side heading, two grey secondary inputs with external labels, submit pill and Back
      to browse on page background; no enclosing raised card.
  - name: review-caption
    anatomy: DIRECTION - NOT IMPLEMENTATION at bottom-right outside product regions. Artifact metadata
      only; omit from production UI.
  controls:
  - label: Email
    destination: Email field in the sign-in/register form (blocks/SessionForm)
    status: Wired. Bound to the SessionForm's controlled state; browser type=email validation applies.
  - label: Password
    destination: Password field with masked input (kind=password / newPassword in register mode)
    status: Wired. Bound to the SessionForm's controlled state; submit withheld while either field is empty.
  - label: Sign in
    destination: Submit credentials under fr.identity.sign-in
    status: Wired. Posts to the shop's own /api/session door, which calls the identity GraphQL signIn
      mutation server-side and stores the minted bearer in the httpOnly northwind-session cookie;
      INVALID_CREDENTIALS renders the one uniform refusal naming neither half.
  - label: Back to browse
    destination: http://localhost:4069/en/browse
    status: Wired. TextAction link on the form's footer row.
