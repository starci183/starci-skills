provenance:
  # Same note as the todo evidence files: the layout's provenance.actor vocabulary has only starci-kernel
  # and example-evidence, and neither wrote this - no kernel workflow settled it and example-evidence.mjs
  # cannot emit a `run:` field. The value names the mechanism that actually produced the proof.
  actor: playwright-harness
  tool: 'npx playwright test uat.identity.sign-in, run in examples/ecommerce-app-fe with UAT_LIVE_LOGIN_AUTHORIZED=true'
  environment: local
  capturedAt: '2026-09-19T15:21:53.502Z'
  stack: >-
    The ecommerce example's own topology per examples/ecommerce-app-be/.starcistacks/dev/infra/metadata.json: identity GraphQL
    API on 5070 (built with npm run build, started with npm run start:identity), order API on 6070, and
    the shop served by npm run dev:shop on 4069 (Next dev, not a production build). The browser served
    and the browser proved are the same bytes as the frontendCommit/backendCommit recorded in the run
    manifest (5c10a673 for both). Session carrier is the product's settled handoff: the shop's
    /api/session door calls identity's register/signIn GraphQL mutations server-side and sets the
    httpOnly northwind-session cookie; sign-out is the product's own DELETE /api/session ->
    internal/sessions/revoke.
  authorization: >-
    UAT_LIVE_LOGIN_AUTHORIZED=true. The run registered a fresh disposable address
    (uat-person-20260919t152145z-5c10a673@ecommerce.dev) with the accounts.yaml throwaway password
    pattern; no credential value is stored in this record, and session bearer values are withheld from
    the run folder entirely (cleanup.json notes why).
  observed_effect: >-
    Matches the flow record's declared effects and cleanup: one disposable person row was registered in
    the identity store and three sessions were issued across the walk. Sessions 1 and 2 were revoked by
    the product's own sign-out (verify door read-back: SESSION_INVALID / 401 for both); session-3 stays
    live until the identity TTL and the person row remains, exactly as the record's cleanup note states -
    the product exposes no account deletion. cleanup.json's "unresolved owned resources" note names the
    same two rows.
  recording: >-
    videos/sign-in.webm, 349,624 bytes, VP8 800x450 at 25 fps, 8.28s; verified by full remux and by
    decoding frames with Playwright's bundled ffmpeg (ms-playwright/ffmpeg-1011/ffmpeg-win64.exe -v
    error -i sign-in.webm -vsync 0 -frames:v 5) - zero decode errors. Password fields are masked at
    capture time on every screenshot and video frame, so nothing secret is in the committed bytes.
stale: true
