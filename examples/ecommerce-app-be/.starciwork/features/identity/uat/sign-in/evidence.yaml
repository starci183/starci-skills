# outcome is pass). Every byte named below was produced by the Playwright harness at
# the ecommerce-app-fe Playwright harness (no longer in the tree), which wrote runs/<runId>/ itself; this file only settles which run.
# Two earlier run folders (runs/20260919T151633Z-5c10a673 and runs/20260919T151937Z-5c10a673) were
# failed spec-repair history that settled nothing; they were pruned from the tree as generated
# artifacts and remain in git history.
