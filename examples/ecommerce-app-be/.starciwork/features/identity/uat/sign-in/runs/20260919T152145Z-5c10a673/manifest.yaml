        note: Verify-door read-back after sign-out answered SESSION_INVALID (401).
    note: Unresolved owned resource(s) remain - see ownedResourcesCreated vs
      ownedResourcesDeleted/verifiedAbsent.
  flows.json:
    schema: starci/uat-flows@1
    flow:
      id: uat.identity.sign-in
      title: Register a pair, be refused alike on a wrong one, sign in
      steps:
        - order: 1
          actor: person
          action: Register a new email and password pair for the disposable person.
          expected: the account page shows that person signed in
          checks:
            - id: loading
              expected: yes
            - id: completion
              expected: yes
        - order: 2
          actor: person
          action: Submit the registered email with a wrong password.
          expected: a single uniform refusal shows; nothing names which half was wrong
          checks:
            - id: errorFeedback
              expected: yes
        - order: 3
          actor: person
          action: Submit the sign-in form with the password left empty.
          expected: the submit is refused before any credential check runs
          checks:
            - id: validation
              expected: yes
        - order: 4
          actor: person
          action: Register the same email again with a different password.
          expected: a conflict refusal shows; the first pair still signs in
          checks:
            - id: errorFeedback
              expected: yes
        - order: 5
          actor: person
          action: Sign in with the registered pair a second time.
          expected: a session issues again and the account page keeps showing the same person
          checks:
            - id: completion
              expected: yes
      proves:
        - fr.identity.sign-in
        - br.identity.sign-in
