schema: work/business-rule@1
id: br.identity.account
title: An account view joins the known person with their live buyer status
state: todo
statements:
  - The account view answers only for a person this service knows; an unknown person id is refused before the order service is ever asked.
  - The buyer half of the view is read live from the order service once per ask - never cached, never copied into the person row.
  - A failed read of the order service is a typed refusal the view propagates; it never renders hasOrders false for a call that did not answer.
authorityRefs:
  - "contract.checkout.order-for-identity consumerObligations - this rule is the owning home of what that contract demands of its consumer; the obligations floated unbound until this record existed."
acceptance:
  - id: ac.identity.account.unknown-person-refuses-before-asking-order
    given: A person id nobody registered
    when: The account view is asked for it
    then:
      - The refusal is PERSON_UNKNOWN and the order service saw no call.
  - id: ac.identity.account.order-outage-surfaces-a-refusal
    given: A known person and an unreachable or non-answering order service
    when: The account view is asked for that person
    then:
      - The answer is a typed refusal the caller sees as such - never a view rendering hasOrders false for a call that did not answer.
  - id: ac.identity.account.live-answer-not-a-copy
    given: A person whose orders change between two asks
    when: The account view is asked around an order confirmation on the order side
    then:
      - The second read reflects the change live, without anyone updating the identity store.
module:
  - src/modules/bussiness/account
  - src/modules/integrations/order
change:
