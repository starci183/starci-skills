schema: work/contract@1
id: contract.identity.health
title: How a caller asks the identity service whether it can serve
state: done
between:
  provider: identity
  consumer: checkout
owner: identity
surface:
  - name: healthCheck
    shape: GET /health -> {status, service, checks}
    transport: >-
      Plain HTTP/JSON on the port metadata.json resolves (identityApi). The door is a probe
      door served by features/identity/transport/http/health.controller.ts - but it is not only
      a host's probe: the order service's own /health aggregation calls it for real through
      modules/integrations/identity/identity.client.ts (isHealthy), so this door has a feature
      consumer and belongs in a contract. Order's own /health door, which no in-repo feature
      consumes, is the probe-only half decision.checkout.ops-doors names exempt.
    guarantee: >-
      When Postgres and Redis both answer, the door answers 200 with {status: "ok",
      service: "identity", checks: {postgres: "ok", redis: "ok"}}. When either refuses, the
      door answers a typed 503 with code DEPENDENCY_UNAVAILABLE and the per-dependency map in
      the message - never a 200 that hides a dead dependency.
    stability: >-
      Changing the route or the 2xx-means-serving rule is breaking for the order service's
      health aggregation; adding fields to the checks map is not.
guarantees:
  - a 200 means both named dependencies answered in that instant; the door never reports "ok" for a dependency it did not ping.
  - an unhealthy answer is a typed 503 naming which dependency refused, so the consumer can cascade honestly instead of guessing.
consumerObligations:
  - "checkout treats any non-2xx answer, a timeout, or an unreachable service as identity: unreachable on its own /health, and cascades to its own DEPENDENCY_UNAVAILABLE 503 - it never reports identity healthy on a guess."
refs: [decision.checkout.ops-doors]

requiresProof:
  provider:
    required: true
    note: The provider proves the door reports its real dependencies and refuses with a typed 503 when one is down.
  consumer:
    required: true
    note: The consumer proves it calls the door for real and cascades a non-ok answer into its own probe refusal.

change:
  rev: 1
  kind: initial
  at: 2026-09-19T21:30:00.000Z
  reason: >-
    v10-3: the deep check's CAPABILITY_WITHOUT_SPEC named /health a shipped capability no spec
    record owns. Identity's /health is genuinely consumed - the order service's health
    aggregation calls it on every probe - so it gets a real contract, not an exemption; the
    probe-only half (order's own door) is named exempt by decision.checkout.ops-doors.
