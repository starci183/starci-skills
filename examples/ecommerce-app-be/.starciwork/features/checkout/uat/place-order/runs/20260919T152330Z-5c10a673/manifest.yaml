outcome: fail
assertions:
  - id: step1.loading
    expected: yes
    observed: yes
    note: The sign-in submit shows its own pending label ("Signing in…") while /api/session answers; the
      catalogue read is a server render, so the grid is the settled answer.
  - id: step1.completion
    expected: yes
    observed: yes
    note: After signing in through /api/session, /en/browse listed the catalogue with prices (the order
      service's session-guarded cart query's catalog snapshot).
  - id: step2.completion
    expected: yes
    observed: no
    note: "Running count visible: false; cart line rendered: true."
  - id: step3.loading
    expected: yes
    observed: yes
    note: The confirm button renders its pending label ("Confirming…") while placeOrder answers.
  - id: step3.completion
    expected: yes
    observed: yes
    note: 'The confirmation card answered order 91e9557a-f79b-4910-a407-47d9d99150f3 with status, total
      and payment id; the cart then read as the empty state ("Your cart is empty": true).'
  - id: step4.completion
    expected: yes
    observed: yes
    note: Re-pressing the same rendered confirmation re-sent the same idempotency key; the service
      returned the first order (same orderId shown) marked "already sent" - no second order was
      written.
  - id: step4.errorFeedback
    expected: no
    observed: no
    note: A replayed confirmation must not surface a refusal line.
  - id: step5.errorFeedback
    expected: yes
    observed: no
    note: Confirm was offered on the empty cart but the cart-empty refusal line did not render.
  - id: step6.errorFeedback
    expected: yes
    observed: yes
    note: "The insufficient-stock refusal named the product, the stock that exists and the asked
      quantity (catalogue stock is 2, the cart asked for 3); the cart kept its lines (Steel thermos
      still listed: true)."
  - id: step7.order-known
    expected: yes
    observed: yes
    note: The account surface names the signed-in person and the order service's joined answer that this
      account HAS placed orders (hasOrders).
  - id: step7.completion
    expected: yes
    observed: no
    note: "BE_CAPABILITY_MISSING: the confirmed order 91e9557a-f79b-4910-a407-47d9d99150f3 is NOT listed
      - the backend serves no order-list door (identity's account query answers hasOrders only, and
      order serves no orders read), so the surface honestly states that orders exist without
      fabricating rows."
