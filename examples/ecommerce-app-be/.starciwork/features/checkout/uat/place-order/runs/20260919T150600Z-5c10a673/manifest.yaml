  flows.json:
    schema: starci/uat-flows@1
    flow:
      id: uat.checkout.place-order
      title: Browse, confirm an order, replay it, and hit both refusals
      steps:
        - order: 1
          actor: person
          action: Sign in as the disposable person and open the catalogue.
          expected: products list with their prices
          checks:
            - id: loading
              expected: yes
            - id: completion
              expected: yes
        - order: 2
          actor: person
          action: Add one product to the cart.
          expected: the cart shows the line
          checks:
            - id: completion
              expected: yes
        - order: 3
          actor: person
          action: Confirm the order.
          expected: a confirmation shows and the cart reads empty
          checks:
            - id: loading
              expected: yes
            - id: completion
              expected: yes
        - order: 4
          actor: person
          action: Send the same confirmation again unchanged.
          expected: the first confirmation returns; no second order is written
          checks:
            - id: completion
              expected: yes
            - id: errorFeedback
              expected: no
        - order: 5
          actor: person
          action: Try to confirm with the cart now empty.
          expected: a refusal shows the cart-empty reason; nothing changes
          checks:
            - id: errorFeedback
              expected: yes
        - order: 6
          actor: person
          action: Add a line for more of a product than the catalogue holds, then confirm.
          expected: a refusal names the product, the requested quantity and the stock that exists; the cart
            keeps its lines
          checks:
            - id: errorFeedback
              expected: yes
        - order: 7
          actor: person
          action: Open the account page.
          expected: the confirmed order is listed for this person
          checks:
            - id: completion
              expected: yes
      proves:
        - fr.checkout.place-order
        - br.checkout.place-order
        - fr.checkout.cart.add
        - fr.checkout.cart.list
        - br.checkout.cart
