schema: work/uat-flow@1
id: uat.checkout.place-order
title: Browse, confirm an order, replay it, and hit both refusals
state: done
entry: /browse
actor: person
accounts: accounts.yaml
steps:
    - {order: 1, actor: person, action: "Sign in as the disposable person and open the catalogue.", expected: "products list with their prices", checks: [{id: loading, expected: yes}, {id: completion, expected: yes}]}
    - {order: 2, actor: person, action: "Add one product to the cart.", expected: "the cart shows the line", checks: [{id: completion, expected: yes}]}
    - {order: 3, actor: person, action: "Confirm the order.", expected: "a confirmation shows and the cart reads empty", checks: [{id: loading, expected: yes}, {id: completion, expected: yes}]}
    - {order: 4, actor: person, action: "Send the same confirmation again unchanged.", expected: "the first confirmation returns; no second order is written", checks: [{id: completion, expected: yes}, {id: errorFeedback, expected: no}]}
    - {order: 5, actor: person, action: "Try to confirm with the cart now empty.", expected: "a refusal shows the cart-empty reason; nothing changes", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 6, actor: person, action: "Add a line for more of a product than the catalogue holds, then confirm.", expected: "a refusal names the product, the requested quantity and the stock that exists; the cart keeps its lines", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 7, actor: person, action: "Open the account page.", expected: "the account page confirms this person has orders - the order-for-identity answer the confirmation set for a person this run registered", checks: [{id: completion, expected: yes}]}
effects:
  - "register one disposable person, write one order with its lines and captured payment, and clear that person's cart"
cleanup:
  - "none - a confirmed order is final in this product and no delete exists for it or for the account, so the disposable person's rows stay in the demo store"
# The walk also exercises fr.checkout.cart.add (steps 2 and 6) and fr.checkout.cart.list under
# br.checkout.cart (the cart reads on steps 2, 3, 5 and 6), but all three cart records are still
# state: todo and a done uat-flow may not prove a todo target, so proves names only the two done
# records. If those records settle done, extend proves back over them.
proves: [fr.checkout.place-order, br.checkout.place-order]
change: {rev: 6, kind: clarifying, at: 2026-09-19T15:56:00.000Z, reason: "v9-10 settled the record: runs/20260919T155312Z-5c10a673 walked all seven steps against the live stack (fresh production shop on the projected :4069, identity :5070, order :6070) and recorded Outcome: pass - every authored check observed its expected value, including the repaired step 7 (buyer confirmation rendered for the run-registered person; GET /internal/buyers read-back answered hasOrders=true). Session revoked by the product's own sign-out and verified absent at the verify door; the person and the confirmed order stay per this record's cleanup note. The earlier runs are kept untouched as append-only history. blockedBy lifted - gap.checkout.live-proof closes on this done record."}
