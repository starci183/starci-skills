schema: work/business-rule@1
id: br.checkout.place-order
title: A visitor becomes a buyer by placing an order
state: done
statements:
  - A confirmation succeeds only for a live session, with every cart line in stock at the moment of the call.
  - "A confirmed order is final in this example: the same idempotency key replayed by the same person returns the first answer and never writes a second order; the key is scoped per person, so two buyers never share one answer."
  - "A refused confirmation changes nothing: the cart keeps its lines, no stock moves, no payment exists."
  - Once an order is confirmed, the person has orders - and that is checkout's fact to answer, not identity's to guess.
authorityRefs:
  - "owner-intent: The whole point of the second example - the first rule in the product that only makes sense across two services."
acceptance:
  - id: ac.checkout.place-order.becomes-a-buyer
    given: A person who has just confirmed an order through the checkout
    when: identity is asked, over its own HTTP surface, whether that person has orders
    then:
      - The answer is yes, read live from the order service - never inferred from anything shared.
  - id: ac.checkout.place-order.empty-cart-is-refused
    given: A live session whose cart holds no lines
    when: The person confirms the order
    then:
      - The confirmation is refused by the reason cart-empty, and no order or payment is written.
  - id: ac.checkout.place-order.stock-is-checked-at-confirmation
    given: A cart line whose quantity exceeds what the catalog holds
    when: The person confirms the order
    then:
      - The confirmation is refused for that product by name, the cart keeps its lines, and no stock moved.
module:
  - src/modules/bussiness/order
  - src/modules/integrations/identity
  - src/modules/integrations/order
change:
  rev: 2
  kind: breaking
  at: 2026-09-19T15:58:00.000Z
