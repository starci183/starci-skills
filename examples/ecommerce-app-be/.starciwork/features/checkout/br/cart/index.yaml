schema: work/business-rule@1
id: br.checkout.cart
title: A cart is the person's own accumulating list of product lines
state: todo
statements:
  - A cart line belongs to exactly one person and one product; adding to a held product accumulates onto the held quantity - there is never a second row for the same pair.
  - Adding a line demands only a present product id and a positive integer quantity; whether the catalog knows the product is checked at order confirmation, not here.
  - Clearing removes every line the person holds and touches nobody else's; a confirmed order clears the cart inside its own transaction.
  - The cart read answers the person's own lines in product order, together with the catalog's live price-and-stock snapshot.
authorityRefs:
  - "code-truth: src/modules/bussiness/cart/cart.service.ts and the add-cart-item / clear-cart / cart resolvers - these doors shipped without a record; this rule states what they actually do."
acceptance:
  - id: ac.checkout.cart.accumulates-on-held-product
    given: A person whose cart already holds 2 of a product
    when: They add 3 more of that same product
    then:
      - Their cart answers one line of 5 for the product - the quantity accumulated onto the held row.
  - id: ac.checkout.cart.lines-are-person-scoped
    given: Two signed-in people
    when: One of them adds a line or clears their cart
    then:
      - The other person's cart read shows no such line and keeps every line it held.
  - id: ac.checkout.cart.clear-empties-every-line
    given: A person whose cart holds lines
    when: They clear the cart
    then:
      - A later read answers no lines, and the lines of nobody else were touched.
module: src/modules/bussiness/cart
