schema: work/contract@1
id: contract.checkout.order-for-identity
title: How identity learns a person has orders
state: done
between:
  provider: checkout
  consumer: identity
owner: checkout
surface:
  - name: buyerStatus
    shape: GET /internal/buyers/:personId -> {personId, hasOrders}
    transport: >-
      Plain HTTP/JSON between the two services on the ports metadata.json resolves (order on
      orderApi). The door is internal - it sits under /internal/buyers on the order service
      (features/checkout/transport/http/buyer.controller.ts), beside /internal/sessions on the
      identity side, never on a user-facing route. The consumer is the identity service's
      account view: the account(personId) GraphQL query composes its own person row with this
      call's answer and nothing else (features/identity/graphql/queries/account). There is no
      shared table and no shared cache behind the answer - the call is the only way identity
      learns it.
    guarantee: >-
      The provider always answers 200 with {personId, hasOrders} for any personId, known or not;
      no orders is the honest answer, never a 404. A network failure, a timeout inside the
      consumer's deadline, or a non-200 answer is a typed 503 with a stable code on the
      consumer side (ORDER_SERVICE_UNAVAILABLE), never a silently implied false - with one
      deliberate exception: a 404, which this provider never sends, reads as the honest
      no-orders answer under the asked id. A 200 whose body does not echo the asked personId
      with a boolean hasOrders is refused as ORDER_CONTRACT_MISMATCH, not trusted.
    stability: >-
      Changing the route, the body shape, or the always-200 rule is breaking for identity;
      adding fields is not.
guarantees:
  - hasOrders reports what the order service holds at the moment of the call, not a copied flag that can drift.
  - An unreachable provider is surfaced as a refusal the consumer propagates; the account view never falls back to a guess.
consumerObligations:
  - identity asks this surface once per account read, after the person row is known, and caches nothing.
  - identity turns a failed call into its own typed 503 and never renders hasOrders false for it - a 404 is the single exception, read as the absent answer the provider itself would have given.
refs: [br.checkout.place-order, fr.checkout.place-order, br.identity.sign-in, br.identity.account, fr.identity.account]

requiresProof:
  provider:
    required: true
    note: The provider proves it honours the surface.
  consumer:
    required: true
    note: The consumer proves it honours its obligations.

change:
  rev: 2
  kind: clarifying
  at: 2026-09-19T14:00:00.000Z
  reason: >-
    Corrected the declared wire shape to the door the code actually serves: the provider is
    @Controller("internal/buyers"), so the route is GET /internal/buyers/:personId, and the
    consumer door moved from the retired REST GET /accounts/:personId to the account GraphQL
    query. The guarantee and consumerObligations now state the refusal taxonomy the consumer
    implements verbatim (404 as the absent answer, other non-200/timeout as
    ORDER_SERVICE_UNAVAILABLE, off-shape 200 as ORDER_CONTRACT_MISMATCH) instead of the
    drafted absolute - code is truth here; the contract was wrong about its own wire.
