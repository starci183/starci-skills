schema: work/policy-decision@1
id: decision.checkout.ops-doors
title: The order service's /health probe door is exempt from feature-contract coverage
state: done
outcome: decided
question: >-
  Both services serve GET /health - order at
  features/checkout/transport/http/health.controller.ts (answering only when Postgres answers
  and identity's own /health does), identity at
  features/identity/transport/http/health.controller.ts (Postgres and Redis). The surface
  checks flag a served route no record names. Does each /health door need a contract of its
  own?
options:
  - id: contract-per-door
    summary: Declare each /health as a work/contract@1 surface between the service and its probe.
    consequence: >-
      Half right. Identity's /health does have a feature consumer - the order service's health
      aggregation calls it through modules/integrations/identity/identity.client.ts
      (isHealthy) - so that half is a real contract and gets one:
      contract.identity.health. Order's own /health has no in-repo feature consumer at all -
      only hosts, orchestrators and e2e specs ask it. A contract there would record a business
      caller that does not exist.
  - id: exempt-as-ops
    summary: >-
      Name order's own /health an ops/probe door - real, code-owned by the checkout
      implementation record, exempt from feature-contract coverage.
    consequence: >-
      The door stays explained - this record names it, its semantics and its owner - without
      pretending a business contract exists. The honest cost: a decision is not a spec record,
      so if the deep check still lists /health as CAPABILITY_WITHOUT_SPEC despite
      contract.identity.health covering the consumed half, this record is the named answer for
      the probe-only door.
recommendation: exempt-as-ops
recommendationReason: >-
  Split the pair honestly: identity's /health is consumed by order's health aggregation, so it
  is declared by contract.identity.health like any other wire. Order's own /health answers
  only for the host's sake - the code already has an owner
  (impl.checkout.ecommerce-app-be.order-checkout owns the whole src/features/checkout root,
  transport/http included) and scripts/check-work-surfaces.mjs already classifies /health as
  an ops/probe door ("real, but no contract could ever own it"). This record makes the
  probe-only half a written decision rather than a silence.
chosen: exempt-as-ops
refs:
  - contract.identity.health
  - impl.checkout.ecommerce-app-be.order-checkout
  - impl.identity.ecommerce-app-be.identity-account

change:
  rev: 1
  kind: initial
  at: 2026-09-19T21:30:00.000Z
  reason: >-
    v10-3: the deep check's CAPABILITY_WITHOUT_SPEC named /health a shipped capability no spec
    record owns. The pair splits: identity's door is consumed by order's health aggregation
    (contract.identity.health declares it); order's own door is a probe-only surface -
    declared exempt here so no suspect stands silent.
