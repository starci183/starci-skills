schema: work/functional-requirement@1
id: fr.checkout.place-order
title: Place an order
state: done
actors: [visitor, person]
trigger: The person with a live session asks to confirm what is in their cart.
mainFlow:
  - The session is verified against the identity service over HTTP.
  - The cart lines accumulate per product, and the catalog answers stock and unit prices.
  - The confirmation writes the order, its lines and the captured payment in one transaction, and clears the cart.
exceptionFlows:
  - A call whose bearer token does not verify is refused before any cart or order work.
  - An empty cart refuses by the reason cart-empty.
  - A line naming a product the catalog does not know refuses by the reason unknown-product; nothing changes.
  - A beyond-stock line refuses with the product, the requested quantity and the stock that exists; nothing changes.
  - A replayed idempotency key, carried in the mutation input, returns the first confirmation instead of a second order, scoped to that person's own orders.
postconditions:
  - A confirmed person has orders - visible through contract.checkout.order-for-identity.
composes:
  - rule: br.checkout.place-order
    module: src/modules/bussiness/order

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npx jest --config src/tests/e2e/jest.config.js checkout/checkout-journey

change:
  rev: 2
  kind: clarifying
  at: 2026-09-19T14:00:00.000Z
  reason: >-
    Named the two preconditions the door enforces that the draft omitted: the SessionGuard
    refuses an unverifiable token before any work, and the CheckoutPolicy refuses a cart line
    whose product the catalog does not know with the named reason unknown-product - both
    enforced in code and carried on the wire (SESSION_INVALID / CHECKOUT_REFUSAL.reason).
    The idempotency key now reads as the mutation input it actually is, not a REST header.
