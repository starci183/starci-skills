schema: work/integration@1
id: integration.checkout.postgres
title: PostgreSQL holds the catalog, cart, order and payment rows
state: todo
provider: postgresql
boundary: The product owns its schema and its migrations. The dev container is shared with the
  identity service only as a server - the table sets are disjoint, and a breaking migration stays
  this product's decision alone.
endpoints:
  - {name: primary, method: TCP, path: postgres://localhost:5501/ecommerce}
credential:
  name: ORDER_DATABASE_URL
  providedBy: owner
  where: .starcistacks/dev - the local dev container runs with trust authentication (demo-only), so there is no secret to custody yet
sandbox: The dev environment runs PostgreSQL 16 in Compose on 5501, seeded by the services' own migrations.
refs: [sds.checkout.order-flow]

requiresProof:
  live:
    required: true
    note: A migration applied and a row round-tripped against the real server, not against a fake.
