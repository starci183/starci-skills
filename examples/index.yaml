schema: starci/code-example-catalog@1
title: Current app source references
purpose: |
  These entries point to authored files in real HFS example apps. Read every listed source and its
  actual module context; the owning tsconfigs and test paths declare how that source is checked.
  Metadata is not a compiler result, test result, architecture approval or browser verification.
  A missing behavioral test remains a coverage gap, never an inferred pass.
