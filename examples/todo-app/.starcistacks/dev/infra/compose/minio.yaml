services:
  minio:
    # MinIO no longer publishes a community image on Docker Hub; the Chainguard public build is the source,
    # pinned by the digest its latest tag had on 2026-10-01.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    command: server /data --console-address ":9001"
    environment:
      # The image boots only when both the root user and root password are set; only the password was
      # declared as a secret file. The user name is not a secret (paired with the real secret password),
      # so it is a literal here, the same pattern postgres.yaml already uses for POSTGRES_USER. DEMO-ONLY.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-root-password
    secrets:
      - minio-root-password
    ports:
      - "9000:9000"
    volumes:
      - todo-minio:/data
secrets:
  minio-root-password:
    file: ../../runtime/files/minio-root-password.key
volumes:
  todo-minio: {}

