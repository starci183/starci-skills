services:
  api:
    # No build context is declared for this placeholder image, so it is profile-gated: `docker compose up`
    # (no --profile app) brings up only the infra this example actually proves (postgres, keycloak) - the
    # api itself runs on the host via `npm run build && npm run start`, per the dev README.
    image: todo-app/api
    profiles: [app]
    depends_on:
      - postgres
      - keycloak
      - redis
      - minio
    env_file:
      - ../../runtime/env/app.env
    environment:
      CACHE_REDIS_URL: redis://redis:6379/0
      # Uploads live in the stack's MinIO (S3, path-style); the secret access key is the MinIO root password file.
      UPLOAD_S3_ENDPOINT: http://minio:9000
      UPLOAD_S3_BUCKET: todo-uploads
      UPLOAD_S3_ACCESS_KEY_ID: minioadmin
      UPLOAD_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/minio-root-password
    secrets:
      - minio-root-password
    ports:
      - "3001:3001"

