schema: starci/application-stacks@1
sources:
  - repository: todo-app
components:
  postgres:
    image: postgres:16
    role: stateful
    compose: infra/compose/postgres.yaml
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    role: stateful
    compose: infra/compose/keycloak.yaml
  redis:
    image: redis:7
    role: stateful
    compose: infra/compose/redis.yaml
  minio:
    image: cgr.dev/chainguard/minio:latest
    role: stateful
    compose: infra/compose/minio.yaml
  prometheus:
    image: prom/prometheus:latest
    role: observability
    compose: infra/compose/prometheus.yaml
  api:
    image: todo-app/api
    role: service
    compose: infra/compose/api.yaml
  web:
    image: todo-app/web
    role: service
    compose: infra/compose/web.yaml
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      postgres:
        port: 5432
      keycloak:
        port: 8089
      redis:
        port: 6379
      minio:
        port: 9000
      prometheus:
        port: 9090
      api:
        port: 3001
      web:
        port: 3000
    runbook: README.md
    secrets:
      - name: app-env
        where: secrets/app-env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: seed-yaml
        where: secrets/seed-yaml
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: keycloak-admin-password-key
        where: secrets/keycloak-admin-password-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: postgres-password-key
        where: secrets/postgres-password-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: minio-root-password-key
        where: secrets/minio-root-password-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: sepay-api-key-key
        where: secrets/sepay-api-key-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: sepay-webhook-secret-key
        where: secrets/sepay-webhook-secret-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: upload-signing-secret-key
        where: secrets/upload-signing-secret-key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: identity-todo-app-demo
        where: secrets/identity-todo-app-demo
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
  vps:
    status: supported
    runtime: docker-swarm
    composeFiles:
      - infra/compose/stack.yaml
    components:
      postgres: {}
      keycloak: {}
      redis: {}
      minio: {}
      api:
        replicas: 2
      web:
        replicas: 2
    runbook: README.md
    secrets:
      - name: app-env
        where: secrets/app-env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity shared from dev/runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: uat
        where: secrets/uat
        recipientPolicy: DEMO-ONLY - encrypted to the example identity shared from dev/runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
k8s:
  status: deferred
  reason: One host serves the current load; a cluster would add a control plane nobody operates yet.

services:
  sonar:
    provider: sonarqube
    mode: local
    purpose: Static analysis of the todo backend example on the shared host SonarQube.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-new-code
    projects:
      - {repository: todo-app, key: starci-todo-app}
    credentials:
      - id: admin
        purpose: Host-owned project provisioning and local example analysis.
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-admin-token.key}
    ci:
      workflow: .github/workflows/ci.yml
      wiring: optional-follow-up
      secrets: []
      vars:
        - {name: SONAR_HOST_URL, value: https://sonar.starci.org}
      provisioning: >-
        The generated ci.yml scans and gates only when the repository has a SONAR_TOKEN secret (steps guarded by
        env.SONAR_TOKEN != ''); no project token is in custody for this example, so a Kernel (never the owner) mints
        one with sonar-local.mjs and sets it when it chooses to.
    ownerAction: none
