blockers:
  - "Converted from work/app-shell@1: every visible layout needs slot-keyed captures at each
    breakpoint and theme, and every layout with chrome unknown needs brand.decide to decide it,
    before anything draws under it."
  - The destination row (DestinationNav in WorkspaceShell) is composed inside TasksPage
    (apps/web/src/features/pages/tasks/index.tsx), not by a route layout, so the tree has no layout
    that draws it and no navigation registry to read labels from; moving it into a (workspace)
    route-group layout is an interface.implement change the owner has not ruled.
  - The brand logo is unruled (brand/index.yaml logo.status), so no lockup exists to record.
  - No demo persona is fixed - the header shows the synthetic account Alex, amounts default to VND
    and no date format is recorded - so `personas` waits for brand.decide to read them from the seed
    and the app.
