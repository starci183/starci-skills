id: impl.share.fe.invite-screen
title: The invitation screen and its create/revoke controls
state: done
repository: fe
# v7-3 (2026-09-19): route corrected to the directory that exists. Every page route in this app sits
# under the [lang] locale segment (locales en|vi), so the dynamic task segment is one level deeper
# than authored: src/app/[lang]/tasks/[taskId]/share. src/app/tasks never existed. The rev-1 reason's
# served-route claim /tasks/<id>/share is the locale-prefixed URL beneath that segment.
owners:
  - {role: route, path: "fe/apps/web/src/app/[locale]/tasks/[taskId]/share"}
  - {role: feature, path: fe/apps/web/src/features/pages/TaskSharePage}
  - {role: block, path: fe/apps/web/src/components/blocks/share-invite}
  - {role: hooks, path: fe/apps/web/src/hooks/share}
  - {role: api, path: fe/apps/web/src/modules/api}
  - {role: hooks, path: fe/apps/web/src/hooks/auth}
proves: [ui.share.invite]
change:
  rev: 3
  kind: editorial
  at: 2026-09-19T22:40:00.000Z
  reason: "w10: state restored todo -> done - the isPending button tint that
    dominated the inviting captures' saturated pixels was the installed theme's
    blended label ink; globals.css now uses declared tokens (accent primary
    with black labels, neutral disabled variants), the accepted-state list
    markup passes entity-list-in-card, all 10 captures were re-shot with the
    shared convention against a fresh production build, and
    scripts/example-render-proof.mjs holds for every capture;
    gap.share.render-proof is closed. Prior narrative kept verbatim: v7-13:
    state rescinded done -> todo - the fresh captures v7-9 produced fail
    entity-list-in-card (accepted states) and palette-off-brand (#97b5ff on inviting states), so
    the done claim is unproven and the record is held by gap.share.render-proof. The rev-1 build
    description below stands as the record of what was built. Implements ui.share.invite against its settled direction (features/share/ui/invite,
    invite-refused representative). Route adapter src/app/tasks/[taskId]/share/page.tsx mounts
    features/pages/share -> components/blocks/share-invite (connected index.tsx hands every render
    to the pure component.tsx); hooks share/* adapt the real GraphQL collaborators / invite /
    revokeCollaborator operations through src/modules/api transport with SWR reads and
    useSWRMutation writes, and WorkspaceShell + SurfaceCard + SurfaceListCard + Input + Button +
    Badge + Text + TextAction render all five mapped states at desktop-1280 and mobile-390.
    Route deviation kept visible: the lane brief guessed src/app/share, but the settled
    direction and uat.share.invite-and-collaborate both name /tasks/:taskId/share, and the
    frontend canon's route -> feature -> block -> hooks layering (FE_* checks in
    cli/main.mjs architecture + scripts/check-scoped-lint.mjs, both green) requires the
    feature/block/hooks homes, so the served route is /tasks/<id>/share.
    Rendered proof: the 10 PNG+HTML captures in ./assets were captured from this worktree's own
    `next start` production build at localhost:3010 driving the live backend at :3001; the only
    harness seam is a Playwright route that rewrites Access-Control-Allow-Origin for the 3010
    origin - every request executes against the real backend and dev database. Real data: two
    invitations created through the real invite mutation (pat viewer, sam editor), pat accepted
    through the real acceptInvitation mutation with a dev invitee session, lee/kim invited and
    revoked through the running UI mid-capture (revoked rows cleaned from the dev database
    afterwards), and the refused state is a real SHARE_INVALID_EMAIL refusal that retains the
    draft. Mobile captures are viewport-sized because compactNavigation is position:sticky and a
    fullPage stitch paints it mid-page. Known open conflicts kept visible: the canon palette
    check reports off-brand dominant colours that are all installed-Grammar theme rendering -
    the isPending button tint (~88% of saturated pixels in the inviting captures), HeroUI's
    danger hue in the refused captures (deltaE 9.1 from the brand danger token), and antialiased
    accent blends on glyph edges; activating the accepted Core token vocabulary is the
    THEME_IMPLEMENTATION_REQUIRED gap ui.share.invite already records, and globals.css is outside
    this lane's ceiling. Installed @starci/grammar 0.4.13 has no danger Button variant
    (GRAMMAR_REQUIRED), so revoke uses ghost variant exactly as the coverage map declares.
    `starci render check` was not run on this example tree, so the three render rules were executed directly:
    entity-list-in-card and primary-absent pass on all 10 captures, palette-off-brand fails as
    recorded. Sonar and coverage gates: no runner is configured in this repository - not run,
    never claimed."
