schema: work/integration@1
id: integration.upload.minio
title: MinIO holds the bytes of the uploads
state: todo
provider: minio
boundary: The uploads bucket belongs to the todo api alone; objects are keyed uploads/<upload id>, minted server-side, and
  the api speaks S3 with AWS Signature Version 4 through its outbound HTTP port.
endpoints:
  - {name: object, method: PUT, path: http://minio:9000/todo-uploads/uploads/<upload id>}
credential:
  name: UPLOAD_S3_SECRET_ACCESS_KEY_FILE
  providedBy: owner
  custody: identity:upload-s3-secret-access-key-file
  # the MinIO root password, sealed in .starcistacks/dev/secrets/minio-root-password-key.enc
sandbox: The dev environment runs MinIO (the Chainguard build, pinned by digest) in Compose on 9000.
refs: [fr.upload.intake]

requiresProof:
  live:
    required: true
    note: An object stored, read back and deleted against the real server, not against a fake.

change: {rev: 1, kind: initial, at: 2026-10-01T23:00:00.000Z}
