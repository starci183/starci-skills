schema: work/data@1
id: data.audit.erasure-request
title: Erasure request
state: done
fields:
  - {name: requestId, type: text, required: true, note: "Opaque, the id every log line about this
      erasure names instead of the person."}
  - {name: personId, type: text, required: true, note: "The subject, held in this record's own row
      until state reaches complete, when AuditErasureService.tComplete drops it (sets it to null)
      rather than deleting the row - see the invariant below, which this note now matches."}
  - {name: state, type: text, required: true, note: "requested | verified | executing | complete | refused"}
  - {name: requestedAt, type: timestamp, required: true}
  - {name: verifiedAt, type: timestamp, required: false}
  - {name: refusedAt, type: timestamp, required: false}
  - {name: executingAt, type: timestamp, required: false}
  - {name: completedAt, type: timestamp, required: false}
invariants:
  - personId is dropped from this record once state reaches complete; only requestId and the
    timestamps remain, so this table does not itself become a second place a person's identity lingers.
refs: [br.audit.erasure.right, br.audit.erasure.logged]

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "sds.audit.erasure-request is done: AuditErasureRequestEntity
    (src/modules/platform/databases/postgresql/primary/entities/audit-erasure-request.entity.ts) is
    this shape, and AuditErasureService.tComplete really does drop personId to null on completion
    (never deletes the row), proven in audit-erasure.service.spec.ts. The personId field's own note was
    stale against the invariant it sits beside (it said the row is deleted; the invariant it echoes -
    and the real implementation - only drop personId, keeping requestId/state/timestamps) and is
    corrected here to match."
