# v7-3 (2026-09-19): route corrected to the directory that exists. Every page route in this app sits
# under the [lang] locale segment (locales en|vi); src/app/audit never existed, so the rev-1 narrative
# below names a route adapter at a path the repository has never had. src/app/[lang]/audit holds only
# privacy/, so the served route is still /<lang>/audit/privacy as that narrative says. Quoted because
# core/yaml.mjs rejects a bracketed plain scalar inside a flow mapping.
