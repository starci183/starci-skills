      title: A task has exactly one owner
      statements:
        - A task belongs to exactly one person, and only that person may complete or delete it.
      acceptanceCriteria:
        - id: AC-BR-TASK-SINGLE-OWNER
          given: A task exists with an owner
          when: Somebody who is not the owner attempts to complete or delete it
          then:
            - The attempt is refused and the task is unchanged.
