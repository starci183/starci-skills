schema: work/customer-journey
id: journey.task.first-task
title: A new person captures their first task
state: done
crossesFeatures: [login, task]
steps:
  - {actor: person, does: "Signs in and lands on an empty list, expects: An empty state that says what to do next."}
  - {actor: person, does: "Types a title and submits, expects: The task appears immediately, owned by them."}
  - {actor: person, does: "Returns the next day, expects: The task is still there."}
requirements: [fr.login.sign-in, fr.task.create]

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
provenBy:
  uat: [uat.task.create, uat.login.sign-in]
  requirements: [fr.login.sign-in, fr.task.create]
