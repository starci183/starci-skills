schema: work/customer-journey
id: journey.task.first-task
title: A new person captures their first task
state: done
crossesFeatures: [login, task]
steps:
  - {actor: person, does: Signs in and lands on an empty list, expects: An empty state that says what to do next.}
  - {actor: person, does: Types a title and submits, expects: The task appears immediately, owned by them.}
  - {actor: person, does: Returns the next day, expects: The task is still there.}
requirements: [fr.login.sign-in, fr.task.create]

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
provenBy:
  uat: [uat.task.create, uat.login.sign-in]
  requirements: [fr.login.sign-in, fr.task.create]

# evidence is written by starci-kernel when it settles the operation: the assertions below are
# the checks it re-ran itself, not what the worker reported. An operation may edit this file, so
# the kernel overwrites this block on every settle - that overwrite is what makes it proof.
evidence:
  recordDigest: 3635d82a2df91c136fdf14327769588616400ca4f64824a3cbaa4d9390c42783
  outcome: pass
  assertions:
    - id: empty-state-explains-itself
      outcome: pass
      observation: uat run 20260918-create step 1 captured the guidance
    - id: task-survives-a-new-session
      outcome: pass
      observation: uat run 20260918-create step 6 captured the same row after signing in again
  provenance:
    actor: starci-kernel
    tool: starci-kernel
    environment: local
    servedVersions:
