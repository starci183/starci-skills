schema: work/event@1
id: event.task.completed
title: A task was completed
state: done
producer: fr.task.complete
payload:
  - {name: taskId, type: text}
  - {name: ownerId, type: text}
  - {name: completedAt, type: timestamp}
  - {name: sourceEventId, type: text, note: "Stable and unique per real completion, including a reopen-then-complete cycle producing a new one."}
delivery: {guarantee: at-least-once, ordering: none}
refs: [fr.task.complete]
change:
  rev: 3
  kind: clarifying
  at: 2026-10-01T12:00:00.000Z
  reason: "The in-process platform event bus is gone: the event travels through the outbox in the transaction of the
    write, so delivery is at least once in no promised order (ordering none, was per-key) and the note names the
    emitting code that exists."
# The task flow emits this event through the outbox, in the transaction of the write: TaskflowService.complete
# enqueues an audit.append message with action task.completed, and a notify.admit message for the owner
# (be/src/modules/domain/taskflow/taskflow.service.ts); each carries the task id, the owner, the completion instant
# and a fresh eventId per real completion, so a reopen-then-complete cycle produces a new one. Delivery is the
# outbox's: at least once across restarts, in no promised order. A done event is not a done flow: the producer
# fr.task.complete keeps its own requiresProof.
