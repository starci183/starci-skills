schema: work/event@1
id: event.task.created
title: A task was created
state: done
producer: fr.task.create
payload:
  - {name: taskId, type: text, note: "The created task's id."}
  - {name: ownerId, type: text, note: "The submitter, bound at creation and never rewritten."}
  - {name: createdAt, type: timestamp}
  - {name: sourceEventId, type: text, note: "Stable and unique per real create; the only thing a subscriber's dedupe key can honestly hash."}
delivery: {guarantee: at-least-once, ordering: none}
refs: [fr.task.create]
change:
  rev: 3
  kind: clarifying
  at: 2026-10-01T12:00:00.000Z
  reason: "The in-process platform event bus is gone: the event travels through the outbox in the transaction of the
    write, so delivery is at least once in no promised order (ordering none, was per-key) and the note names the
    emitting code that exists."
# The task flow emits this event through the outbox, in the transaction of the write: TaskflowService.create
# enqueues an audit.append message (be/src/modules/domain/taskflow/taskflow.service.ts) whose action is
# task.created, target the task id, actor the owner, at the creation instant and eventId a fresh id - the payload
# above under the outbox's names. The audit capability consumes it (fr.audit.log.append). Delivery is the outbox's:
# at least once across restarts, in no promised order, so a subscriber dedupes on sourceEventId (the eventId).
