schema: work/event@1
id: event.task.deleted
title: A task was deleted
state: done
producer: fr.task.delete
payload:
  - {name: taskId, type: text}
  - {name: ownerId, type: text}
  - {name: deletedAt, type: timestamp}
  - {name: sourceEventId, type: text, note: "Stable and unique per real delete."}
delivery: {guarantee: at-least-once, ordering: none}
refs: [fr.task.delete, br.task.delete.final]
change:
  rev: 4
  kind: clarifying
  at: 2026-10-01T12:00:00.000Z
  reason: "The in-process platform event bus is gone: the event travels through the outbox in the transaction of the
    write, so delivery is at least once in no promised order (ordering none, was per-key) and the note names the
    emitting code that exists."
# The task capability emits this event through the outbox, in the transaction of the delete: TaskService enqueues
# an audit.append message with action task.deleted (be/src/modules/domain/task/task.service.ts), only once the row
# is gone, carrying the task id, the owner, the deletion instant and a fresh eventId. Delivery is the outbox's: at
# least once across restarts, in no promised order. A done event is not a done flow: the producer fr.task.delete
# keeps its own requiresProof.
