schema: work/data
id: data.task.task
title: Task
state: done
fields:
  - {name: id, type: text, required: true, note: Opaque, assigned at creation, never reused.}
  - {name: owner, type: text, required: true, note: Bound at creation and never rewritten.}
  - {name: title, type: text, required: true}
  - {name: complete, type: boolean, required: true, default: false}
  - {name: completedAt, type: timestamp, required: false}
invariants:
  - owner is never null and never changes for a given id.
  - completedAt is set if and only if complete is true.
appliesTo: [br.task.single-owner, br.task.complete.once]

