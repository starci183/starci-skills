schema: work/contract
id: contract.login.identity-for-task
title: How task learns who the actor is
state: done
between:
  provider: login
  consumer: task
owner: login
surface:
  - name: actorOf
    shape: (request) -> {personId} or null
    guarantee: Returns the person of a live session, or null. Never throws, never a partial person.
    stability: A change to the shape or to the null case is breaking for task.
guarantees:
  - A returned personId belongs to a session that was live at the moment of the call.
  - null means unauthenticated, never "unknown"; task must not retry on it.
consumerObligations:
  - task treats null as a refusal and never invents an actor.
  - task does not cache the personId beyond one request.
refs: [br.login.session.restores, br.task.single-owner]

requiresProof:
  provider:
    required: true
    note: The provider proves it honours the surface.
  consumer:
    required: true
    note: The consumer proves it honours its obligations.

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
provenBy:
  provider: [impl.login.todo-app.auth]
  consumer: [impl.task.todo-app.ownership]
