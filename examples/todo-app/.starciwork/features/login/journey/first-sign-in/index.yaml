schema: work/customer-journey
id: journey.login.first-sign-in
title: A new person gets in and stays in
state: done
crossesFeatures: [login, task]
steps:
  - {actor: person, does: Signs up, expects: Lands on an empty list that says what to do next.}
  - {actor: person, does: Returns the next day, expects: Still signed in.}
requirements: [fr.login.sign-in]
evidence: walks-first-sign-in

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
provenBy:
  uat: [uat.login.sign-in]
  requirements: [fr.login.sign-in]
