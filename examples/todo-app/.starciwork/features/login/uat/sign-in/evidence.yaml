provenance:
  # The layout declares exactly two provenance.actor values (schemas/work-layout.yaml's work/evidence@1
  # rule): starci-kernel, for a live kernel workflow's own markDone write, and example-evidence, for a
  # file scripts/example-evidence.mjs produced by running its --assert commands. Neither is true of this
  # file - no kernel workflow settled it, and example-evidence.mjs cannot produce a `run:` field, so it
  # never ran here. The value below therefore names the mechanism that actually produced the proof
  # instead of claiming a writer that did not write it; the missing third value in a two-value vocabulary
  # is written up as grit ledger item 57 (docs/examples/todo-app-grit.md).
  actor: playwright-harness
  tool: 'npm run uat -- uat.login.sign-in.spec.ts (uat/playwright.config.ts, reporter uat/lib/run-writer.ts)'
  environment: local
  capturedAt: '2026-09-18T17:47:21.875Z'
