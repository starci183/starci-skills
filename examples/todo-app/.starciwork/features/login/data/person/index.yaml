schema: work/data@1
id: data.login.person
title: Person
state: done
fields:
  - {name: id, type: text, required: true, note: "Opaque, assigned at sign-up, never reused."}
  - {name: email, type: text, required: true, note: "Unique, lowercased on write."}
  - {name: createdAt, type: timestamp, required: true}
invariants:
  - email is unique across every person, compared lowercased.
refs: [br.login.password.sign-in]
change:
  rev: 2
  kind: breaking
  at: 2026-09-18T07:30:00.000Z
  withdraws: ["passwordHash is never read back out of the product."]
  retains: ["email is unique across every person, compared lowercased."]
  reason: Keycloak is the credential authority now (see integration.login.keycloak and
    src/features/sign-in/application/sign-in.use-case.ts); the product's own Person shape never holds a
    passwordHash field at all, so there is no longer a field whose read-back the withdrawn invariant could
    even describe. This is not merely satisfying the old invariant more thoroughly - it removes the
    statement's subject. The product stores no credential of its own; email uniqueness is untouched by
    that move and is retained verbatim.
