schema: work/implementation@1
id: impl.notify.fe.preferences
title: The notification preferences screen - email digest control and unsubscribe link
state: done
repository: fe
# v7-3 (2026-09-19): route corrected to the directory that exists. Every page route in this app sits
# under the [lang] locale segment (locales en|vi); src/app/notify never existed. The extent is
# unchanged - this record owns both notify routes, as its rev-1 reason already says. Quoted because
# core/yaml.mjs rejects a bracketed plain scalar inside a flow mapping.
owners:
  - {role: route, path: "apps/web/src/app/[lang]/notify"}
  - {role: block, path: apps/web/src/components/blocks/notify-preferences}
  - {role: block, path: apps/web/src/components/blocks/notify-unsubscribe}
proves: [ui.notify.preferences]
change:
  rev: 3
  kind: editorial
  at: 2026-09-19T22:40:00.000Z
  reason: "w10: state restored todo -> done - the palette failures were real
    style defects (undeclared accent blends on loading/saving, disabled-opacity
    blended label ink on unsubscribe-link, and shell controls occluded by the
    compact sticky nav). globals.css now uses declared neutral tokens for
    disabled variants and dark neutral ink for secondary labels, and
    .shell-controls sits above the nav. All 12 states were re-captured with the
    shared convention and scripts/example-render-proof.mjs holds for every
    capture; gap.notify.render-proof is closed. Prior narrative kept verbatim:
    v7-13: state rescinded done -> todo - the fresh captures v7-9 produced fail
    palette-off-brand on six of twelve captures (#92b0fa on loading/saving, #90a4d5 and #acbde7 on
    unsubscribe-link), so the done claim is unproven and the record is held by
    gap.notify.render-proof. The rev-1 build description below stands as the record of what was
    built. Implements ui.notify.preferences against its settled direction
    (features/notify/ui/preferences, the refused representative state). Route
    adapters src/app/notify/{preferences,unsubscribe}/page.tsx mount the
    connected blocks src/components/notify/{preferences,unsubscribe}/index.tsx;
    each pure view component.tsx renders Grammar WorkspaceShell + PageContainer +
    SurfaceCard + Heading + Text + TextAction + Button for all five mapped
    preferences states and the signed-out unsubscribe-link projection at
    desktop-1280 and mobile-390, and api.ts adapts the real GraphQL operations
    notificationPreferences / updateNotificationPreferences / unsubscribe plus
    signOut through src/modules/api transport. The unsubscribe-link projection is
    honest about the backend contract: the unsubscribe mutation is session-bound,
    so the served link carries the session token and the screen never claims a
    tokenless email-link flow the API does not expose. Rendered proof: the 12
    PNG+HTML captures in ./assets were produced by ./assets/capture.mjs from this
    worktree's own `next build` + `next start` at localhost:3210 driving the live
    dev API at localhost:3901 (started with CORS_ORIGIN for the served origin);
    the refused state was triggered by answering the real
    updateNotificationPreferences request with a GraphQL error, and loading and
    saving were captured while the real requests were held in flight - no state
    is staged in the DOM. Known open conflicts kept visible: `node
    ../../cli/main.mjs architecture check .` reports
    13 violations that are all direct consequences of the lane write ceiling -
    the frontend canon wants src/features/, src/components/{blocks,...}/ and
    src/hooks/ homes plus an owner slot, none of which this
    lane may create (FE_SOURCE_LAYOUT_INVALID x7,
    FE_COMPONENT_IMPORTS_TRANSPORT x2, FE_APP_INTERNAL_IMPORT_OUTSIDE_FEATURES
    x2, FE_ROUTE_ONE_PAGE x2); and the direction's own
    THEME_IMPLEMENTATION_REQUIRED gap stands - installed token wiring ships only
    the accent override, so primary Button labels render white-on-primary until a
    separately authorized theme implementation supplies black label ink."
