input AddCartItemInput {
  productId: ID!
  quantity: Int!
}

type AddCartItemType {
  item: CartLineType!
}

type BuyerStatusType {
  hasOrders: Boolean!
  personId: ID!
}

type CartLineType {
  productId: ID!
  quantity: Int!
}

type CartType {
  catalog: [ProductType!]!
  items: [CartLineType!]!
}

type ClearCartType {
  cleared: Boolean!
}

type Mutation {
  addCartItem(input: AddCartItemInput!): AddCartItemType!
  clearCart: ClearCartType!
  placeOrder(input: PlaceOrderInput!): PlaceOrderType!
}

input OrderReceiptInput {
  orderId: ID!
}

type OrderReceiptType {
  expiresAt: String!
  url: String!
}

input PlaceOrderInput {
  idempotencyKey: String
}

type PlaceOrderType {
  currency: String!
  orderId: ID!
  replayed: Boolean!
  status: String!
  totalMinorUnits: Int!
}

type ProductType {
  id: ID!
  name: String!
  priceMinorUnits: Int!
  stock: Int!
}

type Query {
  buyerStatus: BuyerStatusType!
  cart: CartType!
  orderReceipt(input: OrderReceiptInput!): OrderReceiptType!
}
