# Generated by hfs sync (app root). Do not edit: run "npx hfs sync --write".
# The be unit run's lcov (be/coverage/lcov.info), uploaded by the managed CI workflow. Coverage is the services' alone: the status
# paths are the one coverage scope whose complement hfs sync renders into sonar.coverage.exclusions, held at 100 on the project and on
# the patch. fe/ is outside coverage (a front end has no tests).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/**/*.service.ts"
    patch:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/**/*.service.ts"
ignore:
  - "fe/**"
