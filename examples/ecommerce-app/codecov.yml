# Generated by hfs sync (app root). Do not edit: run "npx hfs sync --write".
# The be unit run's lcov (be/coverage/lcov.info), uploaded by the managed CI workflow. Coverage is the logic of be/src/modules/**: the status
# paths are the measured roots of the one coverage scope (derived from the slot manifest's `coverage` field; its complement is rendered into
# sonar.coverage.exclusions and its roots into be/jest.config.js), held at 100 on the project and on the patch, and each component (one per
# service app, plus platform) is held at 100 too. fe/ and be/src/features are outside coverage (features are thin by rule; a front end has no tests).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/modules/domain/*/**"
          - "be/src/modules/integrations/*/**"
          - "be/src/modules/platform/*/**"
          - "be/src/modules/projections/*/**"
    patch:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/modules/domain/*/**"
          - "be/src/modules/integrations/*/**"
          - "be/src/modules/platform/*/**"
          - "be/src/modules/projections/*/**"
component_management:
  default_rules:
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_components:
    - component_id: identity
      name: identity
      paths:
        - "be/src/modules/domain/account/**"
        - "be/src/modules/domain/identity/**"
        - "be/src/modules/domain/session/**"
        - "be/src/modules/integrations/cache/**"
        - "be/src/modules/integrations/keycloak-admin/**"
        - "be/src/modules/integrations/keycloak/**"
        - "be/src/modules/integrations/order-api/**"
    - component_id: order
      name: order
      paths:
        - "be/src/modules/domain/cart/**"
        - "be/src/modules/domain/catalog/**"
        - "be/src/modules/domain/loyalty/**"
        - "be/src/modules/domain/order/**"
        - "be/src/modules/integrations/receipt-storage/**"
        - "be/src/modules/projections/order-summary/**"
    - component_id: billing
      name: billing
      paths:
        - "be/src/modules/domain/invoice/**"
        - "be/src/modules/domain/payment/**"
    - component_id: platform
      name: platform
      paths:
        - "be/src/modules/integrations/identity-api/**"
        - "be/src/modules/platform/*/**"
ignore:
  - "fe/**"
