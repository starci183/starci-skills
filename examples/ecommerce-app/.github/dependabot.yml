# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@starci/*"
  - package-ecosystem: docker
    directories:
      - /be/apps/*
      - /fe/apps/*
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
