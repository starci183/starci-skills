# Generated by hfs sync (app root). Do not edit: run "npx hfs sync --write".
# Builds the image of every app on the release tag, so a Dockerfile that no longer builds fails the release (or a manual dispatch) that carries it.
# It never pushes: publishing an image is the product's decision, not this file's.
name: images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            file: be/apps/identity/Dockerfile
          - name: order
            file: be/apps/order/Dockerfile
          - name: billing
            file: be/apps/billing/Dockerfile
          - name: cli
            file: be/apps/cli/Dockerfile
          - name: landing
            file: fe/apps/landing/Dockerfile
          - name: app
            file: fe/apps/app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ecommerce-app/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
