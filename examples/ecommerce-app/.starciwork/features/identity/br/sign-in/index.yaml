schema: work/business-rule@1
id: br.identity.sign-in
title: A person signs in with an email and a password
state: done
statements:
  - A sign-in succeeds only when the stack's Keycloak realm accepts the pair (its password grant); the product never
    stores a password, and the person is keyed by the realm's subject.
  - A failed sign-in says only that the pair is wrong, never which half.
  - A session is an opaque token held in the identity service's Redis with a TTL; other services verify it over HTTP and never read the store.
authorityRefs:
  - "owner-intent: The second service has to keep its own credential surface honest before the cross-service contract means anything."
acceptance:
  - id: ac.identity.sign-in.known-pair-issues-a-session-token
    given: A registered email and its password
    when: The pair is submitted to sign-in
    then:
      - One live session answers with an opaque token, and a second sign-in issues a different token.
  - id: ac.identity.sign-in.wrong-pair-is-refused-alike
    given: Any email and any password that do not form a known pair
    when: The pair is submitted to sign-in
    then:
      - The refusal is one status and one body, indistinguishable whether the email is unknown or the password is wrong.
module:
  - be/src/modules/domain/account
  - be/src/modules/domain/session
change:
  rev: 3
  kind: breaking
  at: 2026-10-02T10:00:00.000Z
  reason: >-
    The realm owns the credential now: registering creates the shopper in Keycloak and signing in is its password grant,
    so the statement that a pair matches a stored hash is replaced; the uniform refusal and the session rules hold.
