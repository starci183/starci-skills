schema: work/integration@1
id: integration.identity.keycloak
title: Keycloak owns the shoppers' credentials
state: todo
provider: keycloak
boundary: The realm owns every shopper credential. The identity service creates shoppers through the admin API as the
  service account of the confidential identity-admin client (realm-management manage-users), signs them in with the
  password grant of the public identity-api client, and ends the realm session with the kept refresh token at sign-out.
endpoints:
  - {name: token, method: POST, path: /realms/ecommerce/protocol/openid-connect/token}
  - {name: logout, method: POST, path: /realms/ecommerce/protocol/openid-connect/logout}
  - {name: create-user, method: POST, path: /admin/realms/ecommerce/users}
credential:
  name: KEYCLOAK_ADMIN_CLIENT_SECRET
  providedBy: owner
  custody: identity:keycloak-admin-client-secret
  # a DEMO-ONLY default of the compose file (KEYS.md), not a secret; a run exports another value
sandbox: The dev environment runs its own Keycloak on 8149 with the imported ecommerce realm; it is a real Keycloak, not a
  stub.
refs: [fr.identity.sign-in]

requiresProof:
  live:
    required: true
    note: A shopper created and signed in against the real realm, not against a fake.

change:
  rev: 2
  kind: breaking
  at: 2026-10-02T10:00:00.000Z
  reason: >-
    The member directory had no product use and is gone; Keycloak now owns the shoppers' credentials (user creation,
    password grant, logout).
