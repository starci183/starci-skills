schema: work/uat-flow@1
id: uat.identity.sign-in
title: Register a pair, be refused alike on a wrong one, sign in
state: todo
entry: /account
actor: person
accounts: accounts.yaml
steps:
    - {order: 1, actor: person, action: "Register a new email and password pair for the disposable person.", expected: "the account page shows that person signed in", checks: [{id: loading, expected: yes}, {id: completion, expected: yes}]}
    - {order: 2, actor: person, action: "Submit the registered email with a wrong password.", expected: "a single uniform refusal shows; nothing names which half was wrong", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 3, actor: person, action: "Submit the sign-in form with the password left empty.", expected: "the submit is refused before any credential check runs", checks: [{id: validation, expected: yes}]}
    - {order: 4, actor: person, action: "Register the same email again with a different password.", expected: "a conflict refusal shows; the first pair still signs in", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 5, actor: person, action: "Sign in with the registered pair a second time.", expected: "a session issues again and the account page keeps showing the same person", checks: [{id: completion, expected: yes}]}
effects:
  - "register one disposable person row in the identity store and open one session per successful sign-in"
cleanup:
  - "none - the example exposes no account deletion, so the disposable person's row and its sessions stay in the demo store; every run registers a fresh synthetic address"
proves: [fr.identity.sign-in, br.identity.sign-in]
blockedBy:
  - {record: gap.identity.live-proof, rev: 5, because: "the recorded run's result, screens and video are cited by digest in evidence.yaml but no artifact store holds those bytes, so the run cannot be verified; the flow is walked again to file a verifiable run"}
change: {rev: 3, kind: clarifying, at: 2026-10-06T00:00:00.000Z, reason: "state returns to todo: the done claim cites run 20260919T152145Z-5c10a673 by digest, and the result, screen and video bytes it names are held by no artifact store, so the evidence cannot be verified; the record waits on gap.identity.live-proof until the flow is walked again and its run is filed."}
