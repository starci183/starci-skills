id: gap.checkout.second-example-gates
title: No host port-registry entry exists for this second example yet
state: todo
statement: >-
  CI is no longer part of this gap: the root workflow .github/workflows/examples.yml derives its job
  matrix from every examples/*/hfs.json of kind app, so this example is type-checked, linted, unit-tested
  with coverage and built on every push, and its integration and e2e layers run on workflow_dispatch. The
  host port registry (.workspaces/ports/ on the orchestrating machine) also has no ecommerce-app
  entry at this writing: offset 69 is the orchestrating plan's assignment and this repository's
  .starcistacks/dev/infra/metadata.json carries its resolved projection, but the registry file itself is a host action
  outside every lane's boundary. Third, and new to this topology: scripts/build-workflows.mjs
  refuses the whole build mirror as soon as this example's dependencies are installed, because its
  examples/ walk throws on npm's workspace symlinks and skips node_modules only under the
  .starcistacks/scripts/gateway prefixes. The authored tree mirrors clean (ok:true, stale:[]), so
  the blocker is the install this example's own runbook requires - a monorepo with linked
  workspaces is exactly what the todo app back end never had. Fourth: schemas/json-exceptions.yaml
  allowlists authored JSON by exact todo-app path, so none of this example's nine JSON files is
  visible to it (.starcistacks/dev/infra/metadata.json and the two per-workspace package.json files have no analogue at
  all); the gate cannot report that today because it throws on its own path-ordering rule first.
  Measured counts, the isolation test and both attributions:
  docs/examples/grit/second-example-gates.md §5, §6 and §7.
