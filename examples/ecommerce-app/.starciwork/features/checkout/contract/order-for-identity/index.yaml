schema: work/contract@1
id: contract.checkout.order-for-identity
title: How identity learns a person has orders
state: done
between:
  provider: checkout
  consumer: identity
owner: checkout
surface:
  - name: buyerStatus
    shape: "query buyerStatus -> {personId, hasOrders}"
    transport: >-
      The buyerStatus GraphQL query of the order service (POST /graphql on orderApi, the port
      .starcistacks/dev/infra/metadata.json resolves; served by features/checkout/transport/graphql/buyer-status.resolver.ts).
      The consumer is the identity service's account view, through
      modules/integrations/order-api/order-api.client.ts: it forwards the caller's own bearer token, so the answer is
      about the person that token authenticates and no person id travels in the request. There is no shared table and
      no shared cache behind the answer - the call is the only way identity learns it.
    guarantee: >-
      For an authenticated caller the provider answers {personId, hasOrders}; no orders is the honest answer, never an
      error. A network failure, a timeout inside the consumer's deadline or a GraphQL error answer is a typed
      ORDER_API_UNAVAILABLE on the consumer side, never a silently implied false. An answer without a personId string
      and a boolean hasOrders is refused as ORDER_API_CONTRACT_MISMATCH, not trusted.
    stability: >-
      Changing the operation name or the answer shape is breaking for identity; adding fields is not.
guarantees:
  - hasOrders reports what the order service holds at the moment of the call, not a copied flag that can drift.
  - An unreachable provider is surfaced as a refusal the consumer propagates; the account view never falls back to a guess.
consumerObligations:
  - identity asks this surface once per account read, with the caller's bearer token, and caches nothing.
  - identity turns a failed call into its own typed ORDER_API_UNAVAILABLE and never renders hasOrders false for it.
refs: [br.checkout.place-order, fr.checkout.place-order, br.identity.sign-in, br.identity.account, fr.identity.account]

requiresProof:
  provider:
    required: true
    note: The provider proves it honours the surface.
  consumer:
    required: true
    note: The consumer proves it honours its obligations.

change:
  rev: 3
  kind: clarifying
  at: 2026-10-01T12:00:00.000Z
  reason: >-
    Corrected the declared wire to the door the code serves since the services moved to GraphQL: the provider is the
    order service's buyerStatus query (the internal REST door is gone) and the consumer forwards the caller's bearer
    token instead of naming a person id. The refusal taxonomy states the consumer's codes as the code names them
    (ORDER_API_UNAVAILABLE, ORDER_API_CONTRACT_MISMATCH) - code is truth here; the contract was wrong about its own wire.
