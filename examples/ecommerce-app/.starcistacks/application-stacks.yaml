schema: starci/application-stacks@1
sources:
  - repository: ecommerce-app
components:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    role: stateful
    compose: infra/compose/postgres.yaml
  redis:
    image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    role: stateful
    compose: infra/compose/redis.yaml
  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    role: stateful
    compose: infra/compose/keycloak.yaml
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    role: stateful
    compose: infra/compose/minio.yaml
  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    role: stateful
    compose: infra/compose/kafka.yaml
    purpose: The event bus (Apache Kafka in KRaft mode, no ZooKeeper) the order and billing services publish to and consume from; healthchecked by kafka-topics.sh.
  identity:
    image: ecommerce-app/identity:1.0.0
    role: service
    compose: infra/compose/identity.yaml
  order:
    image: ecommerce-app/order:1.0.0
    role: service
    compose: infra/compose/order.yaml
  billing:
    image: ecommerce-app/billing:1.0.0
    role: service
    compose: infra/compose/billing.yaml
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      postgres:
        port: 5501
      redis:
        port: 6448
      keycloak:
        port: 8149
      minio:
        port: 9069
      kafka:
        port: 9161
      identity:
        port: 5070
      order:
        port: 6070
    runbook: README.md
    # The local Postgres runs with trust auth; the secret material is Keycloak's (its bootstrap admin password and the secret
    # of the identity-admin client) and MinIO's root password, sealed with SOPS+age as the todo-app example does.
    secrets:
      - name: keycloak-env
        where: secrets/keycloak-env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
      - name: minio-env
        where: secrets/minio-env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - private identity is untracked and provisioned externally before decryption
# Delivery/quality services (contract change starcistacks-services). Sonar points to the shared host extension;
# CI does not scan this example.
services:
  sonar:
    provider: sonarqube
    mode: local
    purpose: Local static analysis for the ecommerce backend example.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-new-code
    projects:
      - {repository: ecommerce-app, key: starci-ecommerce-app}
    credentials:
      - id: admin
        purpose: Host SonarQube project provisioning for this example; no CI analysis token is declared.
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-admin-token.key}
      - id: starci-ecommerce-app
        purpose: Local analysis of this example (a PROJECT_ANALYSIS_TOKEN of project starci-ecommerce-app, sealed in the host's ext/sonar custody).
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-starci-ecommerce-app-token.key}
    ci:
      workflow: .github/workflows/ci.yml
      wiring: optional-follow-up
      secrets: []
      vars:
        - {name: SONAR_HOST_URL, value: https://sonar.starci.org}
      provisioning: >-
        The generated ci.yml scans and gates only when the repository has a SONAR_TOKEN secret (steps guarded by
        env.SONAR_TOKEN != ''); no project token is in custody for this example, so a Kernel (never the owner) mints
        one with sonar-local.mjs and sets it when it chooses to.
    ownerAction: none
k8s:
  status: deferred
  reason: >-
    No Kubernetes deployment is declared for the dev-only second example.
