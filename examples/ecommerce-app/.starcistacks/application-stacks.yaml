schema: starci/application-stacks@1
sources:
  - repository: ecommerce-app
# Public example CI names only; no real deployment is configured.
ci:
  secrets:
    - {name: SONAR_TOKEN, scope: repository, purpose: Optional SonarCloud analysis token for the host repository, optional: true}
    - {name: SOPS_AGE_KEY, scope: repository, purpose: Unused example deploy workflow age identity, optional: true}
    - {name: VPS_SSH_KEY, scope: repository, purpose: Unused example deploy workflow SSH key, optional: true}
    - {name: VPS_KNOWN_HOSTS, scope: repository, purpose: Unused example deploy workflow pinned SSH host keys, optional: true}
  vars:
    - {name: SONAR_HOST_URL, scope: repository, value: https://sonarcloud.io, purpose: Public SonarCloud analysis endpoint, optional: true}
    - {name: SONAR_ORGANIZATION, scope: repository, value: your-organization, purpose: Documentation placeholder for the host repository SonarCloud organization key, optional: true}
    - {name: VPS_HOST, scope: repository, value: 203.0.113.10, purpose: Documentation address for the unused example deploy workflow, optional: true}
    - {name: VPS_USER, scope: repository, value: deploy, purpose: Documentation user for the unused example deploy workflow, optional: true}
components:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    role: stateful
    compose: infra/compose/postgres.yaml
  redis:
    image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    role: stateful
    compose: infra/compose/redis.yaml
  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    role: stateful
    compose: infra/compose/keycloak.yaml
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    role: stateful
    compose: infra/compose/minio.yaml
  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    role: stateful
    compose: infra/compose/kafka.yaml
    purpose: The event bus (Apache Kafka in KRaft mode, no ZooKeeper) the order and billing services publish to and consume from; healthchecked by kafka-topics.sh.
  identity:
    image: ecommerce-app/identity:1.0.0
    role: service
    compose: infra/compose/identity.yaml
  order:
    image: ecommerce-app/order:1.0.0
    role: service
    compose: infra/compose/order.yaml
  billing:
    image: ecommerce-app/billing:1.0.0
    role: service
    compose: infra/compose/billing.yaml
jobs:
  expire-pending-orders:
    schedule: every:60000
    command: node be/dist/apps/cli/src/main.js order-expiry tick
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      postgres:
        port: 5501
      redis:
        port: 6448
      keycloak:
        port: 8149
      minio:
        port: 9069
      kafka:
        port: 9161
      identity:
        port: 5070
      order:
        port: 6070
      billing:
        port: 7070
    runbook: README.md
    # The local Postgres uses trust auth. Keycloak and MinIO require runtime credentials;
    # browser/stack.mjs generates ephemeral values for an isolated browser run.
    # Production secret custody is outside this dev-only example scope.
    secrets: []
# Delivery and quality services for this public example; host CI analysis is optional.
services:
  sonar:
    provider: sonarcloud
    mode: hosted
    purpose: Release analysis of the ecommerce-app example on SonarCloud, with the one SONAR_TOKEN the runtime holds in its secret.env.
    host:
      public: https://sonarcloud.io
    auth: token
    qualityGate: starci-quality
    projects:
      - {repository: ecommerce-app, key: starci-example-ecommerce-app}
    runtimeSecrets: [SONAR_TOKEN]
    ci:
      workflow: .github/workflows/examples.yml
      wiring: optional-follow-up
      token: SONAR_TOKEN
      hostVar: SONAR_HOST_URL
      organizationVar: SONAR_ORGANIZATION
      provisioning: >-
        The tag workflow scans only when the host repository has the secret SONAR_TOKEN and the variables SONAR_HOST_URL and SONAR_ORGANIZATION;
        the project key on SonarCloud is <SONAR_ORGANIZATION>_<key above>. The release cut scans with the SONAR_TOKEN of the runtime's secret.env and the organization of the runtime's config.yaml (sonar.organization).
    ownerAction:
      needed: SONAR_TOKEN (a SonarCloud token) in .claude/secret.env and as the repository secret, the SonarCloud organization key as config.yaml sonar.organization and as the repository variable SONAR_ORGANIZATION.
      reason: the runtime repository is public and holds no secret, so the token lives only in the owner's untracked secret.env and in GitHub.
  codecov:
    provider: codecov
    mode: hosted
    purpose: Public example coverage uploads using GitHub OIDC.
    auth: oidc
    target: 100
    components: auto
    required: true
    ci:
      wiring: optional-follow-up
      workflow: .github/workflows/examples.yml
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Dependency updates with grouped minor and patch releases and separate majors.
    ecosystems: [npm, docker, github-actions]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Production dependency vulnerability checks in release and CI gates.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
  container-registry:
    provider: ghcr
    mode: hosted
    purpose: Image publishing template for the unused example deploy workflow.
    host: {public: https://ghcr.io}
    auth: github-token
    projects: [{repository: ecommerce-app, key: ecommerce-app}]
    ci:
      wiring: optional-follow-up
      workflow: .github/workflows/stack-deploy.yml
      provisioning: The public example has no deploy images; a real app grants packages write to its automatic GitHub workflow token.
    ownerAction: none
k8s:
  status: deferred
  reason: >-
    No Kubernetes deployment is declared for the dev-only second example.
