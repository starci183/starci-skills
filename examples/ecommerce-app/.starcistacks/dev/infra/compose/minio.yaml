services:
  minio:
    # Resolved shared-port arithmetic: 9000 + offset 69 = 9069 (metadata.json is the projection).
    # MinIO no longer publishes a community image on Docker Hub; the Chainguard public build is the source,
    # pinned by the digest its latest tag had on 2026-10-01.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    command: server /data
    environment:
      MINIO_ROOT_USER: ecommerce
      # DEMO-ONLY default of a local stack on loopback: not a secret; a run that wants another value exports the name.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demo-only-minio-root-password}
    ports:
      - "9069:9000"
