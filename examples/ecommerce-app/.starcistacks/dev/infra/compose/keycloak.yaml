services:
  keycloak:
    # Resolved shared-port arithmetic: 8080 + offset 69 = 8149 (metadata.json is the projection).
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Runtime credentials are supplied by the operator; browser/stack.mjs generates fresh values for its run.
      # The realm import reads the same KEYCLOAK_ADMIN_CLIENT_SECRET the identity API presents.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Supply this credential in the runtime environment}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Supply this credential in the runtime environment}
    volumes:
      - ./realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
    ports:
      - "8149:8080"
