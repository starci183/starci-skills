schema: starci/application-stacks@1
components:
  - id: app
    role: backend
    purpose: Persist and expose the synthetic counter.
    required: true
  - id: gateway
    role: gateway
    purpose: Provide the stack HTTP entry point.
    required: true
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles: [.stacks/dev/compose.yaml]
    components:
      app: {ownership: managed, service: app, failureDomain: single Docker host}
      gateway: {ownership: managed, service: gateway, failureDomain: single Docker host, endpointRef: 'http://127.0.0.1:${STACK_PORT:-18080}'}
    runbook:
      prepare: ./scripts/prepare.sh dev <caller-owned-age-key-path> --initialize
      doctor: ./scripts/doctor.sh dev <caller-owned-age-key-path>
      up: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml up -d --build
      status: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml ps
      logs: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml logs --no-log-prefix
      down: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml down
      update: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml build --pull && docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml up -d
      rollback: Restore reviewed image digests and recreate the same Compose project; this sample does not automate rollback.
      backup: Stop writes and back up the exact tiny-stateful-dev_app-data volume plus ciphertext and the external age identity separately.
      restore: Restore the volume into an isolated project, import the matching age identity, prepare, and verify before cutover.
      verification:
        coldStart: ./scripts/verify.sh dev
        restart: docker compose -p tiny-stateful-dev -f .stacks/dev/compose.yaml restart
        persistence: ./scripts/verify.sh dev
    secrets:
      - name: app-token
        source: generated
        generationAlgorithm: CSPRNG 32 bytes
        formatPolicy: 64 lowercase hexadecimal characters
        encryptedRef: .stacks/dev/secrets.yaml.enc
        materializedPath: .stacks/dev/secrets.yaml
        recipientPolicy: One environment-specific age recipient; rotation explicitly re-encrypts ciphertext.
        keyCustody: Caller-owned path outside Git, backed up independently; missing key refuses preparation.
  vps:
    status: supported
    runtime: docker-swarm
    composeFiles: [.stacks/vps/stack.yaml]
    platform: {ubuntu: '22.04 or 24.04 single host; documented, not independently proven by this kit', architectures: [amd64, arm64]}
    components:
      app: {ownership: managed, service: app, failureDomain: single VPS Docker host}
      gateway: {ownership: managed, service: gateway, failureDomain: single VPS Docker host, endpointRef: 'http://127.0.0.1:${STACK_PORT:-18081}'}
    runbook:
      prepare: ./scripts/swarm-secret.sh create vps <caller-owned-age-key-path> --initialize
      doctor: ./scripts/swarm-doctor.sh
      up: docker stack deploy -c .stacks/vps/stack.yaml tiny-stateful
      status: docker stack services tiny-stateful
      logs: docker service logs tiny-stateful_app
      down: docker stack rm tiny-stateful
      update: Build and publish a reviewed immutable image, declare a new versioned secret runtimeName if rotating, then docker stack deploy.
      rollback: docker service rollback tiny-stateful_app
      backup: Quiesce app writes and back up the tiny-stateful_app-data volume, ciphertext, and external age identity separately.
      restore: Restore the volume under a new stack name, recreate the exact versioned Swarm secret, deploy, and verify before cutover.
      verification:
        coldStart: docker stack deploy -c .stacks/vps/stack.yaml tiny-stateful && ./scripts/swarm-wait.sh tiny-stateful
        restart: docker service update --force tiny-stateful_app && ./scripts/swarm-wait.sh tiny-stateful
        persistence: Increment the counter, force-update tiny-stateful_app, wait for convergence, then assert the same count.
    secrets:
      - name: app-token
        source: generated
        generationAlgorithm: CSPRNG 32 bytes
        formatPolicy: 64 lowercase hexadecimal characters
        encryptedRef: .stacks/vps/secrets.yaml.enc
        runtimeName: tiny-stateful-app-token-v1
        version: v1
        recipientPolicy: A VPS-specific age recipient distinct from dev; rotation explicitly re-encrypts ciphertext.
        keyCustody: VPS operator-owned path outside Git with independent encrypted backup; missing key refuses preparation.
k8s:
  status: deferred
  reason: This single-node reference does not need Kubernetes; no untested cluster deployment is implied.
