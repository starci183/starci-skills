name: tiny-stateful-dev
services:
  app:
    build: {context: ../.., dockerfile: app/Dockerfile}
    environment: {APP_TOKEN_FILE: /run/secrets/app_token}
    secrets:
      - source: app-token
        target: app_token
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes: [app-data:/var/lib/app]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  gateway:
    image: nginx:1.27.5-alpine3.21
    command: ["nginx", "-g", "daemon off;"]
    configs:
      - source: gateway_config
        target: /etc/nginx/nginx.conf
    ports: ["${STACK_BIND_IP:-127.0.0.1}:${STACK_PORT:-18080}:8080"]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    depends_on: [app]
    restart: unless-stopped
secrets:
  app-token: {file: ./secrets.yaml}
configs:
  gateway_config: {file: ../../gateway/nginx.conf}
volumes:
  app-data: {}
