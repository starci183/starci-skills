name: ci

# The repository gate every change answers to: the checks package.json's scripts declare, run
# against a clean install. e2e (Playwright) is deliberately absent - it needs both apps serving
# with their backend projection, which a workflow runner does not have.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
