# Generated by hfs sync (app root). Do not edit: run "npx hfs sync --write".
# Builds each image declared by the lite app. The API image is required; a front-end image is emitted only when declared.
# Entries are path-filtered and never pushed.
name: images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: be/apps/api/Dockerfile
            paths: '["be/apps/api/**","be/src/**","be/tsconfig*.json","fe/**/package.json","package.json","package-lock.json",".dockerignore"]'
          - name: cli
            file: be/apps/cli/Dockerfile
            paths: '["be/apps/cli/**","be/src/**","be/tsconfig*.json","fe/**/package.json","package.json","package-lock.json",".dockerignore"]'
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            image: ${{ matrix.paths }}
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.image == 'true'
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.image == 'true'
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: lite-app/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
