# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
name: ci

# The release candidate ref first (starci app release push waits for this run of the release sha before the branch and the tag move), then the tag.
on:
  push:
    branches: ["release/candidate-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: lint baseline
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="origin/$BASE_BRANCH"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base=$(git describe --tags --abbrev=0 "$GITHUB_REF^" 2>/dev/null) || base="origin/$DEFAULT_BRANCH"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          echo "STARCI_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: lint be
        if: env.SONAR_TOKEN == ''
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run lint -- --side be
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: lint fe
        if: env.SONAR_TOKEN == ''
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run lint -- --side fe
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: lint be with Sonar import
        if: env.SONAR_TOKEN != ''
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run lint -- --side be --sonar reports/lint.be.sonar.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: lint fe with Sonar import
        if: env.SONAR_TOKEN != ''
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run lint -- --side fe --sonar reports/lint.fe.sonar.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: merge Sonar lint reports
        if: always() && env.SONAR_TOKEN != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['reports/lint.be.sonar.json', 'reports/lint.fe.sonar.json'];
          const reports = files.filter(file => fs.existsSync(file)).map(file => JSON.parse(fs.readFileSync(file, 'utf8')));
          const rules = [...new Map(reports.flatMap(report => report.rules).map(rule => [rule.id, rule])).values()];
          const issues = reports.flatMap(report => report.issues);
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/lint.sonar.json', JSON.stringify({ rules, issues }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.SONAR_TOKEN != '' && hashFiles('reports/lint.sonar.json') != ''
        with:
          name: sonar-lint
          path: reports/lint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck

  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Jest cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-jest-
      - name: unit
        run: npm test -- --ci --forceExit --cacheDirectory .jest-cache
      - name: coverage proof
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npx starci app check --coverage-from be/coverage/lcov.info
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('be/coverage/lcov.info') != ''
        with:
          name: coverage-lcov
          path: be/coverage/lcov.info
      - name: coverage upload skipped
        if: ${{ !cancelled() && hashFiles('be/coverage/lcov.info') == '' }}
        run: |
          echo "::notice::codecov upload skipped: no coverage file at be/coverage/lcov.info (the test step failed or produced none)"
          exit 0
      - name: coverage upload
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && hashFiles('be/coverage/lcov.info') != '' }}
        with:
          use_oidc: true
          files: be/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
        env:
          NEXT_PUBLIC_GRAPHQL_URL: "https://api.lite-app.example/graphql"
          NEXT_PUBLIC_SITE_URL: "https://lite-app.example"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_fake_example_lite_app_public_key"
          NEXT_PUBLIC_SUPABASE_URL: "https://example-project.supabase.co"
      - name: database migration checks
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run db:lint

  sonar:
    needs: [fast, test]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
        with:
          name: coverage-lcov
          path: be/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
        with:
          name: sonar-lint
          path: reports
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && env.SONAR_TOKEN != '' }}
        timeout-minutes: 10

  db-types:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: start Supabase
        run: npm run db:start
      - name: apply migrations
        run: npm run db:reset
      - name: regenerate database types
        run: npm run db:types
      - name: database types are committed
        run: git diff --exit-code -- supabase/types/database.types.ts
      - name: stop Supabase
        if: always()
        run: npm run db:stop
