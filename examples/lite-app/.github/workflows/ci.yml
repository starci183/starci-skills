# Generated by hfs sync (app root). Do not edit: run "npx hfs sync --write".
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        if: env.SONAR_TOKEN == ''
        run: npm run lint
      - name: lint with Sonar import
        if: env.SONAR_TOKEN != ''
        run: npm run lint -- --sonar reports/lint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
      - name: database migration checks
        run: npm run db:lint
      - uses: SonarSource/sonarqube-scan-action@v7
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  db-types:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: start Supabase
        run: npm run db:start
      - name: apply migrations
        run: npm run db:reset
      - name: regenerate database types
        run: npm run db:types
      - name: database types are committed
        run: git diff --exit-code -- supabase/types/database.types.ts
      - name: stop Supabase
        if: always()
        run: npm run db:stop
