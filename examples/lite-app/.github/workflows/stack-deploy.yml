# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
# Deploys the app's Docker Swarm stack. This file only assembles arguments: the logic lives in the verbs connect, build-args, deploy,
# rollback and disconnect of "starci app stack". It runs by hand only (Actions > deploy stack > Run workflow) from a release tag v*
# whose version is the package.json version; it has no push or schedule trigger.
# operation deploy    builds and pushes one image per environments.<env>.deploy.images entry of .starcistacks/application-stacks.yaml,
#                     then deploys their immutable digests (render, provision, converge, verify, accept; a failure redeploys the previous release)
# operation rollback  redeploys a stored release; "release" is 16 lowercase hex characters, empty means the previous accepted release
# The environment input names a protected GitHub environment (required reviewers) that holds:
#   vars    VPS_HOST, VPS_USER (the swarm manager); a variable named in deploy.passEnv, when the stack interpolates one
#   secrets SOPS_AGE_KEY (the age identity of .sops.yaml), VPS_SSH_KEY (CI-only deploy key), VPS_KNOWN_HOSTS (pinned host keys)
# Nothing else is a secret: images are pushed with the workflow token. Dispatch inputs reach scripts only through env.
name: deploy stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment holding the VPS variables and the sealed custody under .starcistacks
        required: true
        type: environment
      operation:
        description: Deploy a new release or roll back to a stored one
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      release:
        description: "Rollback only: release id (16 lowercase hex) to deploy again; empty means the previous accepted release"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: stack-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      STACK_ENVIRONMENT: ${{ inputs.environment }}
      XDG_DATA_HOME: ${{ runner.temp }}/starci-data
    steps:
      - name: require release tag
        shell: bash
        run: '[[ "$GITHUB_REF" == refs/tags/v* ]] || exit 1'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: release tag matches package version
        run: node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+version)process.exit(1)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: install SOPS
        uses: mdgreenwald/mozilla-sops-action@bb2d96a13ef438ad122e5827a57ebd75d6ff118d # v2.1.0
        with:
          version: v3.13.2
      - name: image repositories
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/lite-app-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/lite-app-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push api
        id: build-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: be/apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: public build values of web
        id: args-web
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: npx --no-install starci app stack build-args --env "$STACK_ENVIRONMENT" --app web
      - name: build and push web
        id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: fe/apps/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          build-args: ${{ steps.args-web.outputs.args }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: connect to the swarm manager
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: npx --no-install starci app stack connect --env "$STACK_ENVIRONMENT" --execute
      - name: deploy the release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          IMAGE_API: ${{ steps.names.outputs.api }}@${{ steps.build-api.outputs.digest }}
          IMAGE_WEB: ${{ steps.names.outputs.web }}@${{ steps.build-web.outputs.digest }}
        run: |
          npx --no-install starci app stack deploy --env "$STACK_ENVIRONMENT" \
            --image "api=$IMAGE_API" \
            --image "web=$IMAGE_WEB" \
            --source-sha "$GITHUB_SHA" --execute
      - name: disconnect from the swarm manager
        if: ${{ always() }}
        run: npx --no-install starci app stack disconnect --env "$STACK_ENVIRONMENT" --execute

  rollback:
    if: ${{ inputs.operation == 'rollback' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      STACK_ENVIRONMENT: ${{ inputs.environment }}
      XDG_DATA_HOME: ${{ runner.temp }}/starci-data
    steps:
      - name: require release tag
        shell: bash
        run: '[[ "$GITHUB_REF" == refs/tags/v* ]] || exit 1'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: release tag matches package version
        run: node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+version)process.exit(1)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: install SOPS
        uses: mdgreenwald/mozilla-sops-action@bb2d96a13ef438ad122e5827a57ebd75d6ff118d # v2.1.0
        with:
          version: v3.13.2
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: connect to the swarm manager
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: npx --no-install starci app stack connect --env "$STACK_ENVIRONMENT" --execute
      - name: redeploy the stored release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          release=()
          [ -z "$RELEASE" ] || release=(--release "$RELEASE")
          npx --no-install starci app stack rollback --env "$STACK_ENVIRONMENT" "${release[@]}" --execute
      - name: disconnect from the swarm manager
        if: ${{ always() }}
        run: npx --no-install starci app stack disconnect --env "$STACK_ENVIRONMENT" --execute
