http:
  routers:
    web:
      rule: Host(`lite-app.example`)
      entryPoints: [websecure]
      service: web
      tls:
        certResolver: production
    api:
      rule: Host(`api.lite-app.example`)
      entryPoints: [websecure]
      service: api
      tls:
        certResolver: production
  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s
    api:
      loadBalancer:
        servers:
          - url: http://api:8787
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s
