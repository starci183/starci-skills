# Local release analysis uses the shared host SonarQube extension and its sealed custody.
schema: starci/application-stacks@1
services:
  sonar:
    provider: sonarqube
    mode: local
    purpose: Local release analysis for the lite app example.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-quality-lite
    projects:
      - {repository: lite-app, key: lite-app}
    credentials:
      - id: admin
        purpose: Host project provisioning through the existing Sonar gate.
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-admin-token.key}
      - id: lite-app
        purpose: Project analysis token provisioned and sealed by the existing Sonar gate before release analysis.
        env: SONAR_TOKEN
        custody: {repository: starci-academy-backend, path: .claude/ext/sonar/secrets/sonarqube-lite-app-token.key}
    ci:
      workflow: .github/workflows/examples.yml
      wiring: optional-follow-up
      secrets: []
      vars:
        - {name: SONAR_HOST_URL, value: https://sonar.starci.org}
      provisioning: >-
        The tag workflow scans only when the host repository has SONAR_TOKEN and SONAR_HOST_URL.
        The release host uses this example's local project token; CI credential wiring is a separate follow-up.
    ownerAction: none
