# The stack declaration of the app, at the app root beside be/, fe/ and .starciwork (never under a side).
schema: starci/application-stacks@1
ci:
  github: {repository: starci183/starci-skills, defaultBranch: main, workflow: examples.yml}
  secrets:
    - {name: SONAR_TOKEN, scope: repository, purpose: Optional SonarCloud analysis token for the public example, optional: true}
    - {name: SOPS_AGE_KEY, scope: repository, purpose: Documentation-only deploy age identity; this example has no real deploy, optional: true}
    - {name: VPS_SSH_KEY, scope: repository, purpose: Documentation-only deploy SSH key; this example has no real deploy, optional: true}
    - {name: VPS_KNOWN_HOSTS, scope: repository, purpose: Documentation-only pinned host keys; this example has no real deploy, optional: true}
  vars:
    - {name: SONAR_HOST_URL, scope: repository, value: 'https://sonarcloud.io', purpose: Optional SonarCloud analysis host, optional: true}
    - {name: SONAR_ORGANIZATION, scope: repository, value: starci183, purpose: Public SonarCloud organization key for the runtime example, optional: true}
    - {name: VPS_HOST, scope: repository, value: '203.0.113.10', purpose: Documentation-only deploy host; this example has no real deploy, optional: true}
    - {name: VPS_USER, scope: repository, value: deploy, purpose: Documentation-only deploy user; this example has no real deploy, optional: true}
operations:
  # `starci sonar project ensure --target sonarcloud` ensures this project on SonarCloud and its quality gate starci-quality: the gate exists in the
  # organization with exactly the conditions of knowledge/sonar-gate.yaml and is selected for the project. The admin credential is the
  # variable SONAR_TOKEN of the runtime's untracked secret.env (the public runtime repository tracks no sealed secret).
  targets:
    sonarcloud:
      provider: sonar-cloud
      context: production
      origin: https://sonarcloud.io
      resource:
        projectKey: starci183_starci-example-shape-slot
        name: starci183_starci-example-shape-slot
        organization: starci183
        qualityGate: starci-quality
      credentials:
        - {id: admin, hostConnection: sonar-runtime-secret-env, env: SONAR_TOKEN, purpose: The SonarCloud token of the runtime's secret.env}
      actions: [sonar.project.ensure]
services:
  sonar:
    provider: sonarcloud
    mode: hosted
    purpose: Release analysis of the shape-slot example on SonarCloud, with the one SONAR_TOKEN the runtime holds in its secret.env.
    host:
      public: https://sonarcloud.io
    auth: token
    qualityGate: starci-quality
    projects:
      - {repository: shape-slot, key: starci-example-shape-slot}
    runtimeSecrets: [SONAR_TOKEN]
    ci:
      workflow: .github/workflows/examples.yml
      wiring: optional-follow-up
      token: SONAR_TOKEN
      hostVar: SONAR_HOST_URL
      organizationVar: SONAR_ORGANIZATION
      provisioning: >-
        The runtime tag workflow scans only when the host repository has the secret SONAR_TOKEN and the variables SONAR_HOST_URL and SONAR_ORGANIZATION;
        the project key on SonarCloud is <SONAR_ORGANIZATION>_<key above>. The rendered app CI leaves analysis as an optional follow-up.
        The release cut scans with the SONAR_TOKEN of the runtime's secret.env and the organization of the runtime's config.yaml (sonar.organization).
    ownerAction:
      needed: SONAR_TOKEN (a SonarCloud token) in .claude/secret.env and as the repository secret, the SonarCloud organization key as config.yaml sonar.organization and as the repository variable SONAR_ORGANIZATION.
      reason: the runtime repository is public and holds no secret, so the token lives only in the owner's untracked secret.env and in GitHub.
  codecov:
    provider: codecov
    flag: shape-slot
    mode: hosted
    purpose: Public example coverage reporting through Codecov OIDC.
    auth: oidc
    target: 100
    components: auto
    required: true
    ci: {wiring: optional-follow-up, workflow: .github/workflows/examples.yml}
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Group minor and patch dependency updates and keep security updates immediate.
    ecosystems: [npm, docker, github-actions]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Refuse high severity production dependency vulnerabilities in CI and the release gate.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
  container-registry:
    provider: ghcr
    mode: hosted
    purpose: Publish declared release images through the managed workflow when deployment is configured.
    host: {public: 'https://ghcr.io'}
    auth: github-token
    projects: [{repository: shape-slot, key: shape-slot}]
    ci: {wiring: optional-follow-up}
    ownerAction: none
