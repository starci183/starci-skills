# Generated by hfs sync (profile fe). Do not edit: run "npx hfs sync --write".
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: hfs check
        run: npm run hfs:report
      - name: lint
        run: npm run lint:check
      - name: eslint report
        if: ${{ !cancelled() }}
        run: npm run lint:report
      - name: eslint sonar import
        if: ${{ !cancelled() }}
        run: npx hfs report eslint reports/eslint.json reports/eslint.sonar.json
      - name: stylelint report
        if: ${{ !cancelled() }}
        run: npm run lint:report:css
      - name: stylelint sonar import
        if: ${{ !cancelled() }}
        run: npx hfs report stylelint reports/stylelint.json reports/stylelint.sonar.json
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - uses: SonarSource/sonarqube-scan-action@v7
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
