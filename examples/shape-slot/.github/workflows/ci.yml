# Generated by hfs sync (profile fe). Do not edit: run "npx hfs sync --write".
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: starci183/starci-skills
          path: .starci-runtime
      - run: echo "STARCI_HOME=$GITHUB_WORKSPACE/.starci-runtime" >> "$GITHUB_ENV"
      - run: node "$STARCI_HOME/bin/starci.mjs" link --side fe
      - run: npm ci
      - name: hfs sync
        run: npx hfs sync --check
      - name: hfs check
        run: npx hfs check
      - name: lint
        run: npm run lint:check
      - name: typecheck
        run: npm run typecheck
      - name: unit
        run: npm run test:ci
      - name: build
        run: npm run build
      - uses: SonarSource/sonarqube-scan-action@v7
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: env.SONAR_TOKEN != ''
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
