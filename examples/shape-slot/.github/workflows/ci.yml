# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
name: ci

# The release candidate ref first (starci app release push waits for this run of the release sha before the branch and the tag move), then the tag.
on:
  push:
    branches: ["release/candidate-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a release tag is never cancelled by another run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# The job shape of the StarCi CI standard (knowledge/hfs/ci-standard.yaml): fast, lint per side, the unit run in shards, one coverage merge, build,
# and sonar. Timeouts and the shard count come from ci.jobs of .starcistacks/application-stacks.yaml (defaults in the standard).
jobs:
  fast:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [be, fe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: lint baseline
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="origin/$BASE_BRANCH"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base=$(git describe --tags --abbrev=0 "$GITHUB_REF^" 2>/dev/null) || base="origin/$DEFAULT_BRANCH"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          echo "STARCI_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: lint with Sonar import
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npm run lint -- --side ${{ matrix.side }} --sonar reports/lint.${{ matrix.side }}.sonar.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles(format('reports/lint.{0}.sonar.json', matrix.side)) != ''
        with:
          name: sonar-lint-${{ matrix.side }}
          path: reports/lint.${{ matrix.side }}.sonar.json

  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Jest cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-
      # A shard (STARCI_COVERAGE_SHARD=1, the jest preset) measures only the files its specs load, without the per-file threshold, and writes istanbul
      # JSON; the coverage job merges the shards by source location and proves 100 per file on the merged report. The shard count never exceeds what the unit specs fill.
      - name: unit
        run: npm test -- --ci --forceExit --cacheDirectory .jest-cache --shard=${{ matrix.shard }}/6
        env:
          STARCI_COVERAGE_SHARD: "1"
      - name: Jest cache save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('be/coverage/coverage-final.json') != ''
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: be/coverage/coverage-final.json

  coverage:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: be/coverage/shards
      - name: merge coverage
        run: npx starci app coverage merge --out be/coverage/lcov.info be/coverage/shards
      - name: coverage proof
        run: node node_modules/@starci/hfs/runtime/scripts/hfs/example-secrets.mjs --run . -- npx starci app coverage verify be/coverage/lcov.info
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('be/coverage/lcov.info') != ''
        with:
          name: coverage-lcov
          path: be/coverage/lcov.info
      - name: coverage upload
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        with:
          use_oidc: true
          files: be/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
      - name: build cache save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

  sonar:
    needs: [lint, coverage]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Sonar token
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is not set: Sonar is required, so a missing token fails this job (secret SONAR_TOKEN)"; exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: coverage-lcov
          path: be/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        with:
          pattern: sonar-lint-*
          path: reports
          merge-multiple: true
      - name: merge Sonar lint reports
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['reports/lint.be.sonar.json', 'reports/lint.fe.sonar.json'];
          const reports = files.filter(file => fs.existsSync(file)).map(file => JSON.parse(fs.readFileSync(file, 'utf8')));
          const rules = [...new Map(reports.flatMap(report => report.rules).map(rule => [rule.id, rule])).values()];
          const issues = reports.flatMap(report => report.issues);
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/lint.sonar.json', JSON.stringify({ rules, issues }, null, 2) + '\n');
          NODE
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 10
