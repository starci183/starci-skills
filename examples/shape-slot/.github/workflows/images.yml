# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
# Builds the image of every app, so a Dockerfile that no longer builds fails the pull request that broke it. An entry builds only
# when a path it depends on changed. It never pushes: publishing an image is the product's decision, not this file's.
name: images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            file: be/apps/core/Dockerfile
            paths: '["be/apps/core/**","be/src/**","be/tsconfig*.json","fe/**/package.json","package.json","package-lock.json",".dockerignore"]'
          - name: cli
            file: be/apps/cli/Dockerfile
            paths: '["be/apps/cli/**","be/src/**","be/tsconfig*.json","fe/**/package.json","package.json","package-lock.json",".dockerignore"]'
          - name: shape-slot
            file: fe/apps/shape-slot/Dockerfile
            paths: '["fe/apps/shape-slot/**","fe/packages/**","fe/tsconfig.json","be/contracts/**","turbo.json","scripts/**","package.json","package-lock.json",".dockerignore"]'
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            image: ${{ matrix.paths }}
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.image == 'true'
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.image == 'true'
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: shape-slot/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
