      id: FLOW-CMD
      nodeType: flow
      name: Command to UI result
      summary: Synthetic Command to UI result; all code units are planned and tests are not executed.
      refs:
        - type: functional-requirement
          nodeId: srs-fr-command
          itemId: FR-CMD-01
        - type: acceptance
          nodeId: srs-fr-command
          itemId: AC-CMD-OK
        - type: acceptance
          nodeId: srs-fr-command
          itemId: AC-CMD-UNKNOWN
        - type: code-unit
          nodeId: sds-code-page
          itemId: CU-COMMAND-PAGE
        - type: code-unit
          nodeId: sds-code-router
          itemId: CU-ROUTER
        - type: code-unit
          nodeId: sds-code-recipient
          itemId: CU-RECIPIENT
        - type: deployment
          nodeId: sds-deployment-monolith
          itemId: DEP-MONOLITH
        - type: verification
          nodeId: sds-verification-command
          itemId: VER-CMD
      content:
        goal: Map a consented versioned command from UI to recipient receipt and back.
        businessRefs:
          - FR-CMD-01
          - AC-CMD-OK
          - AC-CMD-UNKNOWN
        entryPoint:
          kind: ui
          description: Operator submits the named command.
          codeUnitRef: CU-COMMAND-PAGE
        preconditions:
          - Authenticated operator and installed target.
        inputs:
          - Intent ID, capability version, schema version, payload and fingerprint.
        participants:
          - CU-COMMAND-PAGE
          - CU-ROUTER
          - CU-RECIPIENT
        mainSequence:
          - id: S1
            codeUnitRef: CU-COMMAND-PAGE
            callerRef: actor:authorized-operator
            input: Named command form.
            validation: Validate required UI fields.
            authorization: Server remains authoritative.
            state: Set local submitting state.
            transaction: Not applicable in this planned boundary.
            call: Call CMD-V1 through CU-ROUTER.
            effect: No domain effect in shared routing.
            output: Pending result.
            failure: Render request validation failure.
            verificationRefs:
              - VER-CMD
          - id: S2
            codeUnitRef: CU-RECIPIENT
            callerRef: CU-ROUTER
            input: Versioned command envelope.
            validation: Validate capability/schema and fingerprint.
            authorization: Check principal, consent, target and named command scope.
            state: Load or create recipient-owned receipt.
            transaction: Named InjectEntityManager transaction commits receipt and domain effect.
            call: Invoke only the named recipient handler.
            effect: Recipient owns the domain effect.
            output: Receipt result.
            failure: Map unavailable, wrong-scope, conflict or outcome-unknown.
            verificationRefs:
              - VER-CMD
        alternativeSequences:
          - id: ALT-OFFLINE
            fromStep: S2
            condition: Target installation unavailable.
            steps:
              - id: SA
                codeUnitRef: CU-ROUTER
                callerRef: CU-COMMAND-PAGE
                input: Dispatch attempt.
                validation: Target binding remains valid.
                authorization: No authority expansion.
                state: Record integration unavailable.
                transaction: Not applicable in this planned boundary.
                call: Do not invoke recipient handler.
                effect: No domain effect.
                output: Unavailable result.
                failure: None beyond the scoped unavailability.
                verificationRefs:
                  - VER-CMD
            resumeAt: end
            end: UI renders unavailable.
            postconditions:
              - Unrelated capability remains available.
        exceptionSequences:
          - id: EX-UNKNOWN
            fromStep: S2
            condition: Response is lost after possible commit.
            steps:
              - id: SE
                codeUnitRef: CU-ROUTER
                callerRef: CU-COMMAND-PAGE
                input: Timeout for existing intent.
                validation: Retain original fingerprint.
                authorization: Recheck status-read scope.
                state: Mark local view outcome unknown.
                transaction: Not applicable in this planned boundary.
                call: Query recipient receipt for the same intent.
                effect: Never blind replay.
                output: Reconciled or still-pending result.
                failure: Remain outcome unknown and retry lookup later.
                verificationRefs:
                  - VER-CMD
            resumeAt: end
            end: UI renders reconciliation state.
            postconditions:
              - Same intent remains authoritative.
        recovery:
          - Recipient owns receipt lookup and reconciliation.
        postconditions:
          - Success returns the recipient-owned result; conflict preserves original state.
        resultMapping:
          - CMD-V1 response maps through router state to CommandResult component.
        topologyRefs:
          - DEP-MONOLITH
        verificationRefs:
          - VER-CMD
