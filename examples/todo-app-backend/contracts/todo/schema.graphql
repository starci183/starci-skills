  completeErasure(input: CompleteErasureInput!): CompleteErasureType!
  completeOccurrence(input: CompleteOccurrenceInput!): CompleteOccurrenceType!
  completeTask(input: CompleteTaskInput!): CompleteTaskType!
  createTask(input: CreateTaskInput!): CreateTaskType!
  createUploadIntent(input: CreateUploadIntentInput!): CreateUploadIntentType!
  deleteTask(input: DeleteTaskInput!): DeleteTaskType!
  deleteUpload(input: DeleteUploadInput!): DeleteUploadType!
  downgradePlan: DowngradePlanType!
  editRecurrence(input: EditRecurrenceInput!): EditRecurrenceType!
  endRecurrence(input: EndRecurrenceInput!): EndRecurrenceType!
  invite(input: InviteInput!): InviteType!
  makeRecurring(input: MakeRecurringInput!): MakeRecurringType!
  reconcilePayment(input: ReconcilePaymentInput!): ReconcilePaymentType!
  reopenTask(input: ReopenTaskInput!): ReopenTaskType!
  requestErasure: RequestErasureType!
  revokeCollaborator(input: RevokeCollaboratorInput!): RevokeCollaboratorType!
  signIn(input: SignInInput!): SignInType!
  signOut(input: SignOutInput!): SignOutType!
  skipOccurrence(input: SkipOccurrenceInput!): SkipOccurrenceType!
  unsubscribe(input: UnsubscribeInput!): UnsubscribeType!
  updateNotificationPreferences(input: UpdateNotificationPreferencesInput!): UpdateNotificationPreferencesType!
  upgradePlan: UpgradePlanType!
}

