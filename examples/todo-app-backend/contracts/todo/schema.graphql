type Mutation {
  """Accept a pending invitation addressed to the caller."""
  acceptInvitation(request: AcceptInvitationInput!): AcceptInvitationType!

  """Attach a ready upload of the caller to a task of the caller."""
  attachUpload(request: AttachUploadInput!): UploadType!

  """
  Complete a verified erasure request: destroy the subject key, then confirm and log completion.
  """
  completeErasure(request: CompleteErasureInput!): CompleteErasureType!

  """
  Complete an occurrence of a recurrence rule owned by the caller, and the task it spawned.
  """
  completeOccurrence(request: CompleteOccurrenceInput!): CompleteOccurrenceType!

  """Mark a task complete."""
  completeTask(request: CompleteTaskInput!): CompleteTaskType!

  """Create a task owned by the caller."""
  createTask(request: CreateTaskInput!): CreateTaskType!

  """
  Open an upload intent; the answer is the presigned request that stores the bytes.
  """
  createUploadIntent(request: CreateUploadIntentInput!): CreateUploadIntentType!

  """Delete a task permanently."""
  deleteTask(request: DeleteTaskInput!): DeleteTaskType!

  """Delete an upload of the caller together with its stored bytes."""
  deleteUpload(request: DeleteUploadInput!): DeleteUploadType!

  """
  Return to the free plan, effective at once. Tasks are untouched; the cap applies from the next create.
  """
  downgradePlan: DowngradePlanType!

  """
  Edit a recurrence rule owned by the caller. Only the owner may edit a rule.
  """
  editRecurrence(request: EditRecurrenceInput!): EditRecurrenceType!

  """
  End a recurrence rule owned by the caller: no occurrence is generated after the given date.
  """
  endRecurrence(request: EndRecurrenceInput!): EndRecurrenceType!

  """Invite a collaborator onto one of the caller's own tasks."""
  invite(request: InviteInput!): InviteType!

  """Create a recurrence rule owned by the caller."""
  makeRecurring(request: MakeRecurringInput!): MakeRecurringType!

  """
  Ask the payment gateway for the state of a pending payment and apply it.
  """
  reconcilePayment(request: ReconcilePaymentInput!): ReconcilePaymentType!

  """Reopen a completed task."""
  reopenTask(request: ReopenTaskInput!): ReopenTaskType!

  """
  Request that everything identifying the caller be erased from the audit log.
  """
  requestErasure: RequestErasureType!

  """Revoke a collaborator on one of the caller's own tasks."""
  revokeCollaborator(request: RevokeCollaboratorInput!): RevokeCollaboratorType!

  """
  Sign in with email and password; returns a session token to send as a Bearer authorization header.
  """
  signIn(request: SignInInput!): SignInType!

  """End a session by its token."""
  signOut(request: SignOutInput!): SignOutType!

  """
  Skip an occurrence of a recurrence rule owned by the caller, without completing its task.
  """
  skipOccurrence(request: SkipOccurrenceInput!): SkipOccurrenceType!

  """Stop receiving notifications on one channel."""
  unsubscribe(request: UnsubscribeInput!): UnsubscribeType!

  """
  Change the digest window and/or unsubscribed flag for one notification channel.
  """
  updateNotificationPreferences(request: UpdateNotificationPreferencesInput!): UpdateNotificationPreferencesType!

  """
  Start checkout for the paid plan: records the pending subscription and payment intent and returns the checkout URL.
  """
  upgradePlan: UpgradePlanType!
}

input NotificationPreferencesInput {
  channel: String
}

type NotificationPreferencesType {
  channel: String!
  digestWindowMinutes: Int
  unsubscribed: Boolean!
}

type PlanUsageType {
  activeCount: Int!
  cap: Int
  plan: String!
}

type Query {
  """
  The caller's own audit log lines, oldest first; an administrator reads the whole chain.
  """
  auditLog(action: String, target: String): [AuditLogType!]!

  """
  List a task's collaborators, visible to the owner and to bound collaborators.
  """
  collaborators(request: ListCollaboratorsInput!): [ListCollaboratorsType!]!

  """
  Every log line naming the caller, decrypted, or nothing once the caller's key has been erased.
  """
  exportMyData: [ExportMyDataType!]!

  """The caller's own notification preferences for one channel."""
  notificationPreferences(request: NotificationPreferencesInput): NotificationPreferencesType!

  """
  The plan of the caller against the active tasks the caller holds; the cap is null on the paid plan.
  """
  planUsage: PlanUsageType!

  """How many tasks of the caller are open and complete."""
  taskCounts: TaskCountsType!

  """List the uploads attached to a task of the caller."""
  taskUploads(request: TaskUploadsInput!): [UploadType!]!

  """List the tasks owned by the caller."""
  tasks: [ListTasksType!]!

  """
  The materialised occurrences of a rule of the caller, with a live preview of the dates it fires on next.
  """
  upcomingOccurrences(request: UpcomingOccurrencesInput!): UpcomingOccurrencesType!
}

