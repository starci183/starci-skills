# Run-owned ephemeral stack for the end-to-end suite (npm run test:e2e).
#
# The suite starts and disposes this project itself, on every run, with a project name unique to that run
# (todo-e2e-<spec-hash>-<run-token>) and host ports allocated from the OS on 127.0.0.1: a concurrent todo-app-dev stack is
# never touched and never becomes the proof surface.
#
# Only postgres + keycloak live here. The suite spawns the compiled apps/todo (api) and apps/worker entrypoints as host
# child processes (the real AppModules, configured through the environment like any deployment) after apps/migrate applied
# the schema to the one database. There is no redis: the notify queue is the Postgres outbox. The keycloak service imports
# the tracked realm of the dev stack read-only, so the demo identities a scenario signs in with are the same bytes the
# dev stack ships; the bind-mount source comes from E2E_BACKEND_ROOT, an absolute path set by the suite. No seed script is
# mounted: the schema comes only from apps/migrate and every row a scenario needs is created through the public doors.
#
# Secrets are generated per run and passed through the environment; no plaintext credential sits in this tracked file.

name: ${E2E_COMPOSE_PROJECT}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${E2E_PG_USER}
      POSTGRES_PASSWORD: ${E2E_PG_PASSWORD}
      POSTGRES_DB: ${E2E_PG_DB}
    ports:
      - "127.0.0.1:${E2E_PG_PORT}:5432"
    volumes:
      - todo-e2e-postgres:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${E2E_KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${E2E_KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: "8089"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${E2E_BACKEND_ROOT}/.starcistacks/dev/infra/compose/realm-todo.json:/opt/keycloak/data/import/realm-todo.json:ro
    ports:
      - "127.0.0.1:${E2E_KC_PORT}:8089"

volumes:
  todo-e2e-postgres: {}
