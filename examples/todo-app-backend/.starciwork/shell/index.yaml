# The todo app's layout tree (work/layout-tree@1), scanned out of examples/todo-app-frontend/src/app by
# `node scripts/work/layout-tree.mjs convert` from the app-shell@1 record lane S wrote. It is honest about
# being unsettled: the only layout, [lang]/layout.tsx, mounts providers plus a floating theme and locale
# control, and the chrome the accepted ui.task.list direction drew (WorkspaceShell, DestinationNav) is
# composed inside TasksPage rather than by a layout every screen sits in - so no layout draws the
# destinations, the scan finds no navigation registry, and nothing is captured. Until brand.decide decides
# the [lang] layout's chrome, captures it and fixes a persona and a lockup, a draw under it is refused
# (LAYOUT_ANCESTOR_UNSETTLED) instead of inventing a chrome of its own.
