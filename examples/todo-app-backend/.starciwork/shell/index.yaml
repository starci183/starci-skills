change:
  rev: 2
  kind: breaking
  at: 2026-09-23T18:49:19Z
  reason: Converted from work/app-shell@1 rev 1 into the layout tree scanned from src/app.
refs:
  - ui.task.list
blockers:
  - "Converted from work/app-shell@1: every visible layout needs slot-keyed captures at each
    breakpoint and theme, and every layout with chrome unknown needs brand.decide to decide it,
    before anything draws under it."
  - The destination row (DestinationNav in WorkspaceShell) is composed inside TasksPage
    (src/features/pages/tasks/index.tsx), not by a route layout, so the tree has no layout that draws it
    and no navigation registry to read labels from; moving it into a (workspace) route-group layout is an
    interface.implement change the owner has not ruled.
  - The brand logo is unruled (brand/index.yaml logo.status), so no lockup exists to record.
  - No demo persona is fixed - the header shows the synthetic account Alex, amounts default to VND and no
    date format is recorded - so `personas` waits for brand.decide to read them from the seed and the app.
