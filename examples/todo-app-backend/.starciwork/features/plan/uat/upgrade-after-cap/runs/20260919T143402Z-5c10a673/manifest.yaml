  flows.json:
    schema: starci/uat-flows@1
    flow:
      id: uat.plan.upgrade-after-cap
      title: Hit the cap, get refused, upgrade, create past it
      steps:
        - order: 1
          actor: owner-at-cap
          action: Sign in as an owner already at 20 active tasks.
          expected: the usage screen shows the at-cap state
          checks: []
        - order: 2
          actor: owner-at-cap
          action: Attempt to create a 21st task.
          expected: the create is refused, naming the cap and the upgrade path
          checks:
            - id: errorFeedback
              expected: yes
            - id: validation
              expected: yes
        - order: 3
          actor: owner-at-cap
          action: Start checkout for the paid plan and complete it at the gateway sandbox.
          expected: the gateway acknowledges the payment
          checks:
            - id: loading
              expected: yes
        - order: 4
          actor: owner-at-cap
          action: Return to the app once the gateway acknowledges.
          expected: the usage screen shows no cap
          checks:
            - id: completion
              expected: yes
        - order: 5
          actor: owner-at-cap
          action: Create the 21st task.
          expected: it appears in the list
          checks:
            - id: completion
              expected: yes
      proves: []
