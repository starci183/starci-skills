schema: work/functional-requirement
id: fr.plan.reconcile
title: Reconcile a payment whose webhook never arrived
state: todo
actors: [scheduler, owner]
trigger: A payment intent has been pending past a short grace window, either found by a scheduled sweep or
  by the owner asking the usage screen to check their payment.
mainFlow:
  - The intent's status is fetched directly from the gateway (sds.plan.reconciliation).
  - If the gateway shows it paid, the same activation a webhook would have caused is applied, once, per
    br.plan.payment.idempotent.
  - If the gateway shows it failed or expired, the subscription returns to free (t-gateway-abandoned).
exceptionFlows:
  - The gateway still shows the intent pending; nothing changes and it is checked again later.
  - The webhook arrives after reconciliation already applied the same intent; the webhook is a no-op, per
    br.plan.payment.idempotent.
postconditions:
  - No pending intent is left unresolved forever.
  - A person is never charged twice for one intent, however many times reconciliation and a webhook both
    try to apply it.
composes:
  - {rule: br.plan.payment.idempotent, module: src/modules/bussiness/plan}
refs: [sds.plan.reconciliation, integration.plan.sepay]

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: The unit half is satisfied - br.plan.payment.idempotent is done, and
    reconcile-payment.handler.spec.ts unit-proves this flow's mainFlow/exceptionFlows against a fake
    SepayClient. The remaining blocker is the uat half alone, narrowed to the real absences below.

blockedBy:
  - {record: integration.plan.sepay, because: "The mainFlow's gateway poll has never reached the real SePay sandbox; a unit test against a fake proves this flow's logic, not the live integration."}
  - {record: gap.plan.live-proof, because: "uat.verify has not run this flow, or the journey it belongs to, against the running product yet."}
