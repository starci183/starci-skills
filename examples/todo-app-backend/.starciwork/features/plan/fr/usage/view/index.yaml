schema: work/functional-requirement
id: fr.plan.usage.view
title: View usage against the cap
state: todo
actors: [owner]
trigger: The owner opens the usage screen.
mainFlow:
  - The owner's effective plan is read (t-revert-on-read) and their active task count is computed
    (br.plan.active-scope).
  - The screen shows the count against the cap, or "no cap" on the paid plan, and an upgrade action when free.
postconditions:
  - The count shown always matches what the cap guard would compute for the same person at that moment.
refs: [sds.plan.subscription-lifecycle, br.plan.active-scope, ui.plan.usage]

requiresProof:
  uat:
    required: true

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: The backend half exists and is unit-proven - PlanUsageHandler (plan-usage.handler.spec.ts)
    computes exactly the count/cap pair this mainFlow describes, exposed as the planUsage GraphQL query.
    Only the usage screen itself (app/plan/usage-screen.tsx) is missing, which is what still blocks the
    uat this record requires.

blockedBy:
  - {record: impl.plan.todo-app-frontend.usage, because: "No usage screen exists yet at app/plan/usage-screen.tsx for an owner to actually open; this backend-only lane does not build the frontend."}
