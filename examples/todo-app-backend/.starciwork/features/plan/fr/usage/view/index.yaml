schema: work/functional-requirement
id: fr.plan.usage.view
title: View usage against the cap
state: todo
actors: [owner]
trigger: The owner opens the usage screen.
mainFlow:
  - The owner's effective plan is read (t-revert-on-read) and their active task count is computed
    (br.plan.active-scope).
  - The screen shows the count against the cap, or "no cap" on the paid plan, and an upgrade action when free.
postconditions:
  - The count shown always matches what the cap guard would compute for the same person at that moment.
refs: [sds.plan.subscription-lifecycle, br.plan.active-scope, ui.plan.usage]

requiresProof:
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-18T15:00:00.000Z
  reason: impl.plan.todo-app-frontend.usage reached done - the usage screen exists at src/app/plan/usage
    with rendered proof - so its blockedBy edge here is stale (the gate refuses a blocker whose target
    is done) and is removed. The remaining blocker is the uat half this record requires, named
    explicitly as gap.plan.live-proof (the same root fr.plan.upgrade already cites) so the blockedBy
    chain roots at the real gap.
  withdraws:
    - "No usage screen exists yet at app/plan/usage-screen.tsx for an owner to actually open; this backend-only lane does not build the frontend."

blockedBy:
  - {record: gap.plan.live-proof, because: "The screen exists and is render-proven, but this record requires live uat proof and uat.verify has not run the usage surface against the running product yet."}
