schema: work/functional-requirement
id: fr.plan.upgrade
title: Upgrade to the paid plan
state: todo
actors: [owner]
trigger: The owner chooses the paid plan from the usage screen.
mainFlow:
  - The owner starts checkout; a pending subscription and a payment intent are created (t-checkout-started).
  - The owner completes payment at the gateway.
  - The gateway's webhook confirms the intent, and the subscription becomes active (t-gateway-confirmed).
exceptionFlows:
  - The owner abandons checkout, or the gateway's webhook never arrives and reconciliation finds the intent
    unpaid; the subscription returns to free (t-gateway-abandoned), and fr.plan.reconcile is what notices.
  - The webhook arrives with an invalid signature; it is ignored, the subscription stays pending, and no
    money is treated as received.
postconditions:
  - The subscription is active only once a gateway acknowledgement has actually been observed, never on the
    redirect back to the app alone.
  - Exactly one activation is recorded per payment intent, per br.plan.payment.idempotent.
composes:
  - {rule: br.plan.caps.limit, module: src/modules/bussiness/plan}
refs: [sds.plan.subscription-lifecycle, integration.plan.sepay]

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: The unit half is satisfied - br.plan.caps.limit is done, and upgrade-plan.handler.spec.ts /
    confirm-payment.handler.spec.ts unit-prove t-checkout-started and t-gateway-confirmed against a fake
    SepayClient. The remaining blocker is the uat half alone, narrowed from "not built" to the real
    absences below.

blockedBy:
  - {record: impl.plan.todo-app-frontend.usage, because: "No usage screen or upgrade action exists yet at app/plan for an owner to actually reach; this backend-only lane does not build the frontend."}
  - {record: gap.plan.live-proof, because: "uat.verify has not run this flow against the running product yet, and integration.plan.sepay (the live gateway leg the mainFlow's checkout step depends on) is still todo."}
