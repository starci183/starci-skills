schema: work/functional-requirement@1
id: fr.plan.downgrade
title: Downgrade to the free plan
state: todo
actors: [owner]
trigger: The owner chooses to cancel or downgrade from the usage screen.
mainFlow:
  - The subscription becomes free immediately (t-downgrade), per decision.plan.downgrade.policy.
  - No task is touched.
exceptionFlows:
  - The owner is left over the free cap; task creation is refused from then on until the count is back at
    or under 20, exactly as an at-cap create is refused (br.plan.downgrade.freeze).
postconditions:
  - The downgrade is never refused for being over the new cap.
composes:
  - {rule: br.plan.downgrade.freeze, module: src/modules/bussiness/plan}
refs: [decision.plan.downgrade.policy, sds.plan.subscription-lifecycle]

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-18T15:00:00.000Z
  reason: impl.plan.todo-app-frontend.usage reached done - the usage screen exists at src/app/plan/usage
    with rendered proof - so its blockedBy edge here is stale (the gate refuses a blocker whose target
    is done) and is removed. The remaining blocker is the uat half this record requires, named
    explicitly as gap.plan.live-proof (the same root fr.plan.upgrade already cites) so the blockedBy
    chain roots at the real gap.

blockedBy:
  - {record: gap.plan.live-proof, because: "The screen exists and is render-proven, but this record requires live uat proof and uat.verify has not run the downgrade surface against the running product yet."}
