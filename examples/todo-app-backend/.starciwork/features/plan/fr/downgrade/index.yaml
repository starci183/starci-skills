schema: work/functional-requirement
id: fr.plan.downgrade
title: Downgrade to the free plan
state: todo
actors: [owner]
trigger: The owner chooses to cancel or downgrade from the usage screen.
mainFlow:
  - The subscription becomes free immediately (t-downgrade), per decision.plan.downgrade.policy.
  - No task is touched.
exceptionFlows:
  - The owner is left over the free cap; task creation is refused from then on until the count is back at
    or under 20, exactly as an at-cap create is refused (br.plan.downgrade.freeze).
postconditions:
  - The downgrade is never refused for being over the new cap.
composes:
  - {rule: br.plan.downgrade.freeze, module: src/modules/bussiness/plan}
refs: [decision.plan.downgrade.policy, sds.plan.subscription-lifecycle]

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: The unit half is satisfied - br.plan.downgrade.freeze is done, proven by
    downgrade-plan.handler.spec.ts. The remaining blocker is the uat half alone - no usage screen exists
    yet for an owner to actually downgrade from.

blockedBy:
  - {record: impl.plan.todo-app-frontend.usage, because: "No usage screen or downgrade action exists yet at app/plan for an owner to actually reach; this backend-only lane does not build the frontend."}
