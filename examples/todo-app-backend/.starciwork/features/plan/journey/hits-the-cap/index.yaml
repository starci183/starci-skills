schema: work/customer-journey
id: journey.plan.hits-the-cap
title: A free person fills up their list and pays to keep going
state: todo
crossesFeatures: [task, plan]
steps:
  - {actor: person, does: "Creates twenty tasks one at a time, expects: Each appears, same as always."}
  - {actor: person, does: "Tries to create a twenty-first, expects: A refusal that says why and how to fix it."}
  - {actor: person, does: "Upgrades from that refusal and the gateway acknowledges, expects: A short checkout, then a confirmation."}
  - {actor: person, does: "Creates the twenty-first task, expects: It appears; the usage screen shows no cap."}
requirements: [fr.task.create, fr.plan.upgrade, fr.plan.usage.view]

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: "The cap guard is now wired into the real create path (contract.plan.create-precondition is
    done) - a walk of this journey today would genuinely be refused at the 21st task and would genuinely
    need to upgrade to proceed, per create-precondition.contract.spec.ts. The stale \"not wired\" reason
    is dropped; the remaining blockers are fr.plan.upgrade and fr.plan.usage.view themselves, still todo
    on their own uat requirement (no usage screen exists yet)."

blockedBy:
  - {record: fr.plan.upgrade, because: "fr.plan.upgrade is todo: the usage screen and upgrade action exist, but its required live uat proof has not run and the live SePay leg is unproven (gap.plan.live-proof)."}
  - {record: fr.plan.usage.view, because: "fr.plan.usage.view is todo: the usage screen exists and is render-proven, but its required live uat proof has not run (gap.plan.live-proof)."}
