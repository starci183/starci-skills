schema: work/sds-component@1
id: sds.plan.subscription-lifecycle
title: How a subscription moves between free and paid
state: done
responsibility: Holds one row per person's plan and the only place its status is written. Every transition
  below is a guarded write; nothing reads a raw status directly - it goes through the read-time revert
  (t-revert-on-read) so a lapsed row can never look paid because no sweep got to it yet.
interfaces:
  - The plan module is the only writer of a subscription row's status, through SubscriptionService
    (src/modules/bussiness/plan/subscription.service.ts).
  - Every reader of "is this person paid" calls the t-revert-on-read function
    (SubscriptionService.readEffectivePlan), never the stored column.
owners:
  - {role: module, path: src/modules/bussiness/plan}
refs: [br.plan.caps.limit, br.plan.downgrade.freeze, br.plan.lapse.reverts-on-read, decision.plan.downgrade.policy]
dependsOn: [integration.plan.sepay, integration.login.postgres]

stateMachine:
  states: [free, pending, active, past-due, lapsed]
  initial: free
  transitions:
    - id: t-checkout-started
      from: free
      to: pending
      on: checkout-started
      guard: The owner chose the paid plan and a payment intent was created.
    - id: t-gateway-confirmed
      from: pending
      to: active
      on: webhook-received
      guard: The gateway's webhook signature is valid and its status is paid.
      effect: periodEnd is set from the gateway's period; the intent is recorded applied, once.
    - id: t-gateway-abandoned
      from: pending
      to: free
      on: checkout-abandoned-or-reconciled-unpaid
      guard: Either the owner never completed checkout, or fr.plan.reconcile polled the gateway and found
        the intent failed or expired.
    - id: t-renewal-due
      from: active
      to: past-due
      on: billing-period-ended-without-renewal
      guard: now is at or past periodEnd and no renewal webhook has arrived.
    - id: t-renewal-confirmed
      from: past-due
      to: active
      on: webhook-received
      guard: The gateway's webhook signature is valid and its status is paid.
      effect: periodEnd is extended; still paid the whole time, since past-due is a grace window, not a cap.
    - id: t-lapse
      from: past-due
      to: lapsed
      on: grace-period-elapsed
      guard: now is at or past the grace deadline and no renewal webhook has arrived.
    - id: t-downgrade
      from: [active, past-due]
      to: free
      on: owner-downgrades
      effect: Accepted immediately per decision.plan.downgrade.policy. No task row is touched; if the owner
        is now over the free cap, br.plan.downgrade.freeze takes over from here, not this record.
  note: Lapsed is not marked terminal. A lapsed row never transitions by itself again in storage; instead
    every read passes through t-revert-on-read, which answers free for a lapsed row without writing to it.
    Only a fresh t-checkout-started ever writes a lapsed row again.

sequence:
  participants: [owner, api, sepay, postgres]
  steps:
    - {from: owner, to: api, message: "POST /plan/upgrade selects the paid plan, observable: http"}
    - {from: api, to: sepay, message: "create a payment intent and return a checkout reference, observable: http"}
    - {from: sepay, to: api, message: "webhook with the intent's signed status, observable: http"}
    - {from: api, to: postgres, message: "UPDATE the subscription row to active, once per intent id, observable: write"}
    - {from: api, to: owner, message: "the usage screen reflects the paid plan, observable: http"}
  note: Only interactions an end-to-end run can observe are bound here. The reconciliation poll of
    fr.plan.reconcile is a separate, less frequent path and is sequenced in sds.plan.reconciliation instead
    of duplicated here.

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T16:00:00.000Z
  reason: Built at src/modules/bussiness/plan (subscription.service.ts); every transition proven directly
    in subscription.service.spec.ts (t-checkout-started, t-gateway-confirmed, t-gateway-abandoned,
    t-renewal-due, t-renewal-confirmed, t-lapse, t-downgrade) and t-revert-on-read proven by the same
    file's lapse case. The webhook/reconcile callers of t-gateway-confirmed/t-renewal-confirmed are
    ConfirmPaymentHandler and ReconcilePaymentHandler (confirm-payment.handler.spec.ts,
    reconcile-payment.handler.spec.ts); dependsOn's integration.plan.sepay is the live gateway call these
    handlers make in production, not a precondition for this component's own state-machine proof.
