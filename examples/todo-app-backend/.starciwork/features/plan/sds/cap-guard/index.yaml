schema: work/sds-component
id: sds.plan.cap-guard
title: The guard that refuses over the cap
state: todo
responsibility: Given a person's effective plan (read through t-revert-on-read, never the raw stored status)
  and their active task count (br.plan.active-scope), decides whether one more task may be created, before
  anything is written.
interfaces:
  - Every task create is meant to consult this guard before writing. Nothing in this tree does yet - see
    appliesTo below.
refs: [br.plan.caps.limit, br.plan.active-scope]
dependsOn: [sds.plan.subscription-lifecycle, contract.plan.create-precondition]
appliesTo: [fr.task.create]

stateMachine:
  states: [unchecked, allowed, refused]
  initial: unchecked
  terminal: [allowed, refused]
  transitions:
    - id: t-under-cap
      from: unchecked
      to: allowed
      on: active-count-below-cap
      effect: The create proceeds.
    - id: t-at-cap
      from: unchecked
      to: refused
      on: active-count-at-or-over-cap
      effect: The create is refused, naming the cap of 20 and the upgrade path (fr.plan.upgrade). Nothing is
        written.

sequence:
  participants: [owner, api, postgres]
  steps:
    - {from: owner, to: api, message: "POST /tasks with a title, observable: http"}
    - {from: api, to: postgres, message: "SELECT the owner's subscription and active task count, observable: read"}
    - {from: api, to: owner, message: "the refusal, naming the cap and the upgrade path, when at or over it, observable: http"}
    - {from: api, to: postgres, message: "INSERT the task, only when under the cap, observable: write"}
  note: This is the sequence the guard is specified to run. It does not run today because nothing on the
    real create path calls it - see appliesTo.

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

blockedBy:
  - {record: gap.plan.unbuilt-module, because: "No module exists yet at src/plan/cap-guard. The example backend is moving to NestJS; this component is specified but not built."}
  - {record: gap.plan.cap-guard-not-wired, because: "Even once built, nothing calls it today - fr.task.create's mainFlow (\"The task is created, owned by the submitter, not complete.\") and its implementation (impl.task.todo-app-backend.ownership) create unconditionally once the title is non-empty. This feature owns only features/plan/**; it does not edit fr.task.create or the task module, and appliesTo (above) is exactly this record's constraint on that record, not a request the task feature has honored yet. gap.plan.cap-guard-not-wired names that absence instead of citing contract.plan.create-precondition directly, which itself waits on this record - the two are not both allowed to cite each other over the same fact."}

# fr.task.create's postcondition guarantees exactly one task is created for any non-empty title from its
# owner, with no precondition step in its mainFlow; that guarantee cannot hold once a free-plan owner is at
# the cap and the create must be refused instead. This is not authored as conflictsWith: it is exactly the
# case concept 7 names - a rule this lane owns (sds.plan.cap-guard) constraining a record it does not own
# (fr.task.create) - so it is appliesTo (above), and fr.task.create reads as effectiveState: suspended once
# this edge is newer than fr.task.create's own proof, until task re-proves it against the guard.
