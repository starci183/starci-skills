schema: work/sds-component@1
id: sds.plan.reconciliation
title: What happens when the webhook never arrives
state: todo
responsibility: Polls the gateway directly for a payment intent's status and applies exactly the transition
  a webhook would have applied, through the same idempotent ledger (br.plan.payment.idempotent), so a
  reconcile and a late webhook racing each other apply an intent at most once between them.
interfaces:
  - Runs on a schedule against every pending intent older than a short grace window, and may also be
    triggered by the owner from the usage screen ("check my payment").
owners:
  - {role: module, path: src/modules/bussiness/plan}
refs: [br.plan.payment.idempotent, fr.plan.reconcile]
dependsOn: [sds.plan.subscription-lifecycle, integration.plan.sepay]

sequence:
  participants: [scheduler, api, sepay, postgres]
  steps:
    - {from: scheduler, to: api, message: "trigger reconcile for one pending intent older than 10 minutes, observable: internal-trigger"}
    - {from: api, to: sepay, message: "GET the intent's current status, observable: http"}
    - {from: api, to: postgres, message: "UPDATE the subscription to active, only if the intent was not already applied, observable: write"}
    - {from: api, to: postgres, message: "no write at all, when the intent is still pending at the gateway, observable: read"}
  note: A webhook that arrives after a reconcile already applied the same intent finds it already recorded
    and writes nothing; this sequence and t-gateway-confirmed's sequence in sds.plan.subscription-lifecycle
    converge on the same idempotency check rather than each carrying its own.

requiresProof:
  implementation:
    required: true

change:
  rev: 3
  kind: clarifying
  at: 2026-09-18T11:32:43.321Z
  reason: The blocker's wording was stale, not its direction. integration.plan.sepay has now been called
    for real from this machine and its measured outcomes sit in that record's own evidence.yaml, so the
    honest statement is that the gateway leg has never completed, not that it was never attempted. One more
    absence this rev names instead of leaving to a reader's inference. This record's first interface is a
    scheduled sweep over pending intents, and no scheduler exists in the plan module -
    ReconcilePaymentHandler is dispatchable and unit-proven, but nothing dispatches it on a timer (the
    recur feature's scheduler.service.ts is the precedent for how that gets wired here). This op builds
    what an accepted record requires and reports what it does not; it does not add an unrequested scheduler
    ahead of the live proof that has to land first.

blockedBy:
  - {record: integration.plan.sepay, because: "integration.plan.sepay is todo. Its gateway leg has been
      called for real since this rev but has never completed - this checkout holds no real SePay credential
      and the create-intent route it names answers 404 on the live host (measured in that record's
      evidence.yaml) - so this component's poll is still only unit-tested against an in-process fake
      override (reconcile-payment.handler.spec.ts), which proves this component's own transitions and never
      the live integration."}
