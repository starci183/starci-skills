change:
  rev: 5
  kind: editorial
  at: 2026-09-19T22:40:00.000Z
  reason: "w10: state restored todo -> done - the #2a52b4 off-brand pixels were
    HeroUI's --accent-soft-foreground on secondary button labels; globals.css
    now keeps secondary labels on the declared dark neutral ink, and the list
    markup passed entity-list-in-card on the re-capture. All states were
    re-captured with the shared convention against a fresh production build and
    scripts/example-render-proof.mjs holds for every capture;
    gap.plan.render-proof is closed. Prior narrative kept verbatim: v7-13:
    state rescinded done -> todo - the fresh captures v7-9 produced fail
    entity-list-in-card and palette-off-brand, so the done claim is unproven and the record is
    held by gap.plan.render-proof. The rev-3 build description below stands as the record of
    what was built. Built and rendered-proofed ui.plan.usage against the live dev stack. Owners are the real
    directories now - the earlier app/plan/usage-screen.tsx and app/plan/upgrade-button.tsx paths were
    authored intentions, never built; the lane's write ceiling (src/app/plan/**, src/components/plan/**)
    is narrower than the app's feature/hooks/modules layering, so the route adapter mounts
    src/components/plan/usage-screen (the connected owner folding feature-entry + block) and the
    planUsage/upgradePlan transport lives beside it in src/components/plan/api.ts. Those ceiling-forced
    placements are the whole deviation set in the architecture check's findings; the pure view itself
    satisfies the connected/pure render boundary, Grammar exports, session-token threading and the
    routed-action link rule. Rendered captures for all six states at desktop and mobile are under
    assets/ with CAPTURES.md's full provenance; evidence.yaml carries replayable gate assertions."
