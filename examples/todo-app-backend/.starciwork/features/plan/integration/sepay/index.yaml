schema: work/integration
id: integration.plan.sepay
title: SePay processes the checkout and confirms payment
state: todo
provider: sepay
boundary: The product never stores a card or bank credential; SePay owns the transfer, and this product owns
  the subscription row that follows a confirmed payment, keyed by SePay's payment intent id.
endpoints:
  - {name: create-intent, method: POST, path: /userapi/transactions/qr}
  - {name: get-transaction, method: GET, path: /userapi/transactions/details/:id}
  - {name: webhook, method: POST, path: /webhooks/sepay}
credential:
  name: SEPAY_API_KEY_FILE
  providedBy: owner
  where: .starcistacks/dev/runtime/files/sepay-api-key.key.enc
sandbox: SePay's own sandbox merchant account, called for real from the dev environment; not a stub.
refs: [br.plan.payment.idempotent, sds.plan.subscription-lifecycle]

requiresProof:
  live:
    required: true
    note: A run against the real SePay sandbox API. Evidence must carry proof.boundary live and an empty
      fakes list.

change:
  rev: 2
  kind: editorial
  at: 2026-09-18T16:00:00.000Z
  reason: sds.plan.subscription-lifecycle reached done (built and unit-proven at
    src/modules/bussiness/plan), so citing it as a blocker is stale; that edge is dropped. A real
    SepayClient now exists (src/modules/integrations/sepay/sepay.client.ts) modelled on these exact
    endpoints, with an in-process fake override for tests - but no call from it has reached SePay's
    sandbox for real, which is exactly what gap.plan.sepay-not-reachable still names.

blockedBy:
  - {record: gap.plan.sepay-not-reachable, because: "No call has been made against the real SePay sandbox yet. SepayClient (src/modules/integrations/sepay/sepay.client.ts) makes the real HTTP calls this record's endpoints name, and is unit-tested against an in-process fake override, but a fake proves the guard (sds.plan.cap-guard, sds.plan.subscription-lifecycle, sds.plan.reconciliation), never this integration itself."}
