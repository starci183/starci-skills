schema: work/integration
id: integration.plan.sepay
title: SePay processes the checkout and confirms payment
state: todo
provider: sepay
boundary: The product never stores a card or bank credential; SePay owns the transfer, and this product owns
  the subscription row that follows a confirmed payment, keyed by SePay's payment intent id.
endpoints:
  - {name: create-intent, method: POST, path: /userapi/transactions/qr}
  - {name: get-transaction, method: GET, path: /userapi/transactions/details/:id}
  - {name: webhook, method: POST, path: /webhooks/sepay}
credential:
  name: SEPAY_API_KEY_FILE
  providedBy: owner
  where: .starcistacks/dev/runtime/files/sepay-api-key.key.enc
sandbox: SePay's own sandbox merchant account, called for real from the dev environment; not a stub.
refs: [br.plan.payment.idempotent, sds.plan.subscription-lifecycle]

requiresProof:
  live:
    required: true
    note: A run against the real SePay sandbox API. Evidence must carry proof.boundary live and an empty
      fakes list.

change:
  rev: 3
  kind: clarifying
  at: 2026-09-18T11:32:43.321Z
  reason: Rev 2's blocker said no call had reached SePay's sandbox; calls have now been made from this
    machine, and the sibling evidence.yaml records each one as a replayable command with its real exit
    code. Its outcome is fail, not pass. The live proof this record's requiresProof.live demands is still
    not earned, and this rev does not pretend otherwise. endpoints stays exactly as authored - measuring
    the provider is implementation's job, correcting an accepted design record is
    architecture.decide's, and gap.plan.sepay-not-reachable names which of these two paths the measurement
    opened.

blockedBy:
  - {record: gap.plan.sepay-not-reachable, because: "Two measured absences, both replayable from this record's own evidence.yaml (2026-09-18) - this checkout holds no real SePay credential (SEPAY_API_KEY_FILE is the DEMO-ONLY placeholder .starcistacks/dev/runtime/env/KEYS.md says is never a real credential), so the get-transaction route answers 401; and the create-intent route named above answers 404 on the live host the way an unrouted path does, so a credential alone would not complete a checkout either. A fake gateway proves sds.plan.cap-guard, sds.plan.subscription-lifecycle and sds.plan.reconciliation's transitions, never this integration. SepayClient (src/modules/integrations/sepay/sepay.client.ts) does make the real call every time - it now reports the gateway's own HTTP status instead of masking it behind a JSON parse error, and refuses any transaction status outside pending|paid|failed rather than casting one into a subscription activation."}
