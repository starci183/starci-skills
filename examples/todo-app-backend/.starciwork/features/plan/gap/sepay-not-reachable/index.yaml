schema: work/gap@1
id: gap.plan.sepay-not-reachable
title: No live run has completed a checkout against the real SePay sandbox
state: todo
statement: integration.plan.sepay requires a live proof and none exists, which is what keeps
  sds.plan.reconciliation blocked behind it. What is actually missing was measured from this machine on
  2026-09-18 by sending real requests through the shipped client's own request path, and recorded as
  replayable assertions in integration.plan.sepay's evidence.yaml. my.sepay.vn and
  userapi-sandbox.sepay.vn both answer, in 0.4-0.7s. The record's own get-transaction path
  (GET /userapi/transactions/details/1) is a live route that answers 401, because this checkout holds no
  real SePay credential - SEPAY_API_KEY_FILE decrypts to the DEMO-ONLY placeholder that
  .starcistacks/dev/runtime/env/KEYS.md describes as "a placeholder string, never a real credential". The
  record's create-intent path (POST /userapi/transactions/qr) answers 404, the same bare text/html 404 an
  invented path gets, while a route that does exist answers its own 404 as a JSON body when called with the
  wrong method - so that path is not served by SePay at all. Two distinct absences therefore keep this gap
  open, and neither is a fake-gateway test's to settle - the owner's real sandbox credential, and a
  create-intent endpoint the provider actually serves. The first is out of this lane's reach by design (the
  credential is the owner's, and the record names the variable, never a value). The second is a correction
  to an accepted design record, which an implementation op may not author - the backend worker reports and
  never edits SDS - so it is named here and in docs/examples/todo-app-grit.md for a separately selected
  architecture revision.
closedBy: integration.plan.sepay
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T11:32:43.321Z
  withdraws:
    - "no module exists yet at src/plan/payments (gap.plan.unbuilt-module)"
    - "no request has ever reached SePay's sandbox merchant account for real"
  reason: Both withdrawn clauses are now false and the measurement replaces them. The plan module and the
    SePay client exist (src/modules/bussiness/plan, src/modules/integrations/sepay;
    gap.plan.unbuilt-module is done), and requests have reached SePay's hosts for real from this machine -
    what has not happened is a call that completed, which is the fact this gap has always stood on. The
    record's id keeps its original "not-reachable" spelling because ids are identity, not summary; the
    title and statement now say what the probe measured, which is that the host is reachable and the
    integration still is not proven.
