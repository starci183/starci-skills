title: uat.plan.upgrade-after-cap's gateway leg and the create-refusal feedback surface are unproven
state: todo
statement: >-
  uat.plan.upgrade-after-cap now has a real implemented spec and a real run folder
  (runs/20260919T143402Z-5c10a673) with screens, video and an honest fail result.md - but it cannot
  reach pass today, for two named absences. (a) The pending gateway leg: steps 3-5 need a real SePay
  checkout plus its signed webhook confirmation, the owner directive forbids simulating that webhook,
  and the app's own upgradePlan call carries the provider's real answer - "SePay create-intent
  failed: empty body (HTTP 404; no credential is configured; https://my.sepay.vn)" - which is
  gap.plan.sepay-not-reachable's measured pair (no real credential; a create-intent route the provider
  does not serve). The app's served surface is proven instead: the at-cap usage state names the cap
  with the upgrade action, and the refused checkout renders "Checkout could not be started." while
  writing nothing (payment_intents 0 -> 0, subscription free -> free, psql read-back). (b) The record's
  step-2 errorFeedback check is observed no: the task screen renders no feedback for the refused 21st
  create - TaskListBlock.onCreate drops the mutation rejection (src/components/blocks/task-list/
  index.tsx never reads createTask.error), matching ui.task.list's own state vocabulary, which names
  no create-refusal state; the cap-and-upgrade naming a person can read lives on /plan/usage. What IS
  proven live: the seeded owner reaches activeCount 20 through the app's own createTask and the 21st
  create is refused on the wire as PLAN_CAP_EXCEEDED naming the cap and the upgrade path before
  anything is written.
