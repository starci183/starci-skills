          Form fields stack and row actions wrap without hiding controls or horizontal page
          scrolling. the cap and upgrade action are both removed; only the usage count remains"
        directionAsset: assets/usage-over-cap-frozen.png
  accessibility:
    - Keyboard order follows visual and DOM order; all control names remain visible.
    - "Text(live: assertive) announces refusal; plain foreground copy, no invented Message/Alert
      export."
    - "Primary labels use installed --color-black on #2F6BFF (unrounded contrast 4.667946:1);
      white-on-primary is prohibited."
    - Danger outline/edge communicates destructive consequence alongside a visible action verb; dark
      labels remain legible.
    - Exactly one main landmark; navigation has a name; focus remains visible and returns to the
      action after a dismissed confirmation.
    - Decorative turtle uses empty alt text; the adjacent copy supplies meaning.
  responsive:
    - "desktop-1280: WorkspaceShell header and primary slots; heading, content and footer remain
      within readable page measure."
    - "mobile-390: WorkspaceShell compactHeader and compactNavigation own the compact shell; include
      all four destinations and account access. Form fields stack and row actions wrap without
      hiding controls or horizontal page scrolling."
  artworkSlots: []
  observations:
    - Direction is an ImageGen design input, not a running-product capture, exact Grammar rendering,
      interaction or API proof.
    - Read brand/index.yaml rev 3 for palette and master provenance; generated colours and glyphs
      are approximate until implementation uses the exact CSS tokens.
    - Free plan shows 40 active tasks against a 20 task cap, preserved work, paused creation,
      Upgrade plan and Manage tasks within the app shell.
    - Corrected the initial 100% caption to 200% of cap. Progress fill is clamped to its published
      0-100 value while the visible actual ratio remains 40/20.
    - No price or payment success invented. No mascot; frozen creation does not remove existing
      tasks.
  gaps:
    - code: THEME_IMPLEMENTATION_REQUIRED
      detail: Only the accent override is wired here. Activate the accepted Core token vocabulary, load
        Inter and supply black primary-label ink in a separately authorized implementation.
