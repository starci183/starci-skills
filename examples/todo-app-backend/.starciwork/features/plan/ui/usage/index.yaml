  accessibility:
    - Keyboard order follows visual and DOM order; all control names remain visible.
    - "Text(live: assertive) announces refusal; plain foreground copy, no invented Message/Alert
      export."
    - Exactly one main landmark; navigation has a name; focus remains visible and returns to the
      action after a dismissed confirmation.
    - Decorative turtle uses empty alt text; the adjacent copy supplies meaning.
    - Preserve actual component foreground/state styling, including white primary labels; measure
      composed browser contrast in implementation. The old black-label prescription is superseded by
      ADDENDUM 2; this generated direction certifies no contrast pass.
    - Destructive actions use the real outline variant with explicit consequence copy and
      confirmation; do not invent a danger Button prop or custom outline.
  responsive:
    - "desktop-1280: WorkspaceShell header and primary slots; heading, content and footer remain
      within readable page measure."
    - "mobile-390: WorkspaceShell compactHeader and compactNavigation own the compact shell; include
      all four destinations and account access. Form fields stack and row actions wrap without
      hiding controls or horizontal page scrolling."
