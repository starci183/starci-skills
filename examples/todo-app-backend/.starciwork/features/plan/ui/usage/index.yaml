schema: work/ui-screen
id: ui.plan.usage
title: The usage screen and its upgrade action
state: done
brand: {rev: 2}
refs: [fr.plan.usage.view, fr.plan.upgrade]
ui:
  intent: >-
    This is the highest-conversion moment in the product; the upgrade Button must sit beside the refusal
    line, not below the fold. The representative direction is drawn for the over-cap-frozen state because
    it combines the densest actual Grammar anatomy this screen uses (the metric-lead Text, the Progress
    bar, the refusal line and the upgrade Button) and, where the state is an error/refusal, the
    accessibility-critical assertive-live Text carrying the refusal and the brand's contrast don't (Never
    place text on the primary colour below a 4.5:1 contrast ratio.). @starci/grammar/common ships no
    Message/Alert renderer; the refusal is a plain Text line.
  surfaces:
    - {name: usage, route: /plan/usage, purpose: "see usage against the free cap and upgrade", actors: [owner]}
  states:
    - {name: under-cap, trigger: "active task count is below the free cap", behavior: "a plain usage count is shown, no message, no upgrade prompt required"}
    - {name: at-cap, trigger: "active task count equals the free cap", behavior: "a non-danger message warns the next create will be refused; the upgrade GrammarButton is shown but not forced"}
    - {name: over-cap-frozen, trigger: "a create was attempted at the cap and refused", behavior: "a GrammarMessage(tone: danger) names the cap and the upgrade path; the upgrade GrammarButton is the primary action"}
    - {name: paid-unlimited, trigger: "the owner is on the paid plan", behavior: "the cap and upgrade action are both removed; only the usage count remains"}
  coverage:
    scale: bounded
    representativeScreens: [usage]
    map:
      - {screen: usage, state: under-cap, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Usage)", "Text (size: metric-lead, usage count)", "Progress (label: Tasks used against your free plan cap)"], derivation: "Derives from the over-cap-frozen representative direction: same SurfaceCard, Text (metric-lead), Progress anatomy, minus the refusal Text and the upgrade Button; a plain usage count and progress bar are shown, no message, no upgrade prompt required."}
      - {screen: usage, state: at-cap, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Usage)", "Text (size: metric-lead, usage count)", "Progress (label: Tasks used against your free plan cap)", "Text (live: polite, non-danger warning)", "Button (upgrade, variant: secondary)"], derivation: "Derives from the over-cap-frozen representative direction: same SurfaceCard, Text (metric-lead), Progress, Button (upgrade) anatomy; a `live: polite` Text warns the next create will be refused; the upgrade Button is shown as variant: secondary, not forced, in place of the assertive refusal Text."}
      - {screen: usage, state: over-cap-frozen, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Usage)", "Text (size: metric-lead, usage count)", "Progress (label: Tasks used against your free plan cap)", "Text (live: assertive, the cap-and-upgrade sentence)", "Button (upgrade, variant: primary)"], derivation: "Representative direction; generated by interface.draw once gap.plan.direction-not-drawn closes.", directionAsset: assets/usage-over-cap-frozen.png}
      - {screen: usage, state: paid-unlimited, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Usage)", "Text (size: metric-lead, usage count)"], derivation: "Derives from the over-cap-frozen representative direction: same SurfaceCard, Text (metric-lead) anatomy, minus Progress, the refusal Text and the upgrade Button; the cap and upgrade action are both removed, only the usage count remains."}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone. The at-cap warning uses `live: \"polite\"` since it is not itself an error."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
assets:
  - path: assets/usage-over-cap-frozen.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
  - path: assets/usage-over-cap-frozen.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/usage-over-cap-frozen.prompt.txt
      inputRefs: [ui.plan.usage, fr.plan.usage.view, fr.plan.upgrade, brand]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: 2026-09-18T07:42:00.301Z
