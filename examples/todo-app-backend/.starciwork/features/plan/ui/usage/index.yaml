ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The usage screen and its upgrade action. The representative state is
    over-cap-frozen.
  surfaces:
    - name: usage
      route: /plan/usage
      purpose: see usage against the free cap and upgrade
      actors:
        - owner
  states:
    - name: under-cap
      trigger: active task count is below the free cap
      behavior: a plain usage count is shown, no message, no upgrade prompt required
    - name: at-cap
      trigger: active task count equals the free cap
      behavior: a non-danger message warns the next create will be refused; the upgrade Button is shown
        but not forced
    - name: over-cap-frozen
      trigger: A paid user downgrades with 40 active tasks to the free cap of 20, and further creation is
        refused
      behavior: Show 40 active tasks against cap 20; existing tasks are preserved, creation frozen,
        Upgrade plan and Manage tasks available. At exactly cap, the next create is still refused by
        br.plan.caps.limit.
    - name: paid-unlimited
      trigger: the owner is on the paid plan
      behavior: the cap and upgrade action are both removed; only the usage count remains
  coverage:
    scale: bounded
    representativeScreens:
      - usage
