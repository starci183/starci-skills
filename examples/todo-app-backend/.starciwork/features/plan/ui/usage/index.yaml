schema: work/ui-screen
id: ui.plan.usage
title: The usage screen and its upgrade action
state: done
brand: {rev: 2}
refs: [fr.plan.usage.view, fr.plan.upgrade]
ui:
  intent: >-
    This is the highest-conversion moment in the product; the upgrade GrammarButton must sit beside the danger message, not below the fold. The representative direction is drawn for the over-cap-frozen state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: usage, route: /plan/usage, purpose: "see usage against the free cap and upgrade", actors: [owner]}
  states:
    - {name: under-cap, trigger: "active task count is below the free cap", behavior: "a plain usage count is shown, no message, no upgrade prompt required"}
    - {name: at-cap, trigger: "active task count equals the free cap", behavior: "a non-danger message warns the next create will be refused; the upgrade GrammarButton is shown but not forced"}
    - {name: over-cap-frozen, trigger: "a create was attempted at the cap and refused", behavior: "a GrammarMessage(tone: danger) names the cap and the upgrade path; the upgrade GrammarButton is the primary action"}
    - {name: paid-unlimited, trigger: "the owner is on the paid plan", behavior: "the cap and upgrade action are both removed; only the usage count remains"}
  coverage:
    scale: bounded
    representativeScreens: [usage]
    map:
      - {screen: usage, state: under-cap, viewport: desktop-1280, components: ["GrammarButton (upgrade)", "GrammarMessage (tone: danger, over-cap-frozen only)"], derivation: "Derives from the over-cap-frozen representative direction: same GrammarButton (upgrade), GrammarMessage (tone: danger, over-cap-frozen only) anatomy; a plain usage count is shown, no message, no upgrade prompt required."}
      - {screen: usage, state: at-cap, viewport: desktop-1280, components: ["GrammarButton (upgrade)", "GrammarMessage (tone: danger, over-cap-frozen only)"], derivation: "Derives from the over-cap-frozen representative direction: same GrammarButton (upgrade), GrammarMessage (tone: danger, over-cap-frozen only) anatomy; a non-danger message warns the next create will be refused; the upgrade GrammarButton is shown but not forced."}
      - {screen: usage, state: over-cap-frozen, viewport: desktop-1280, components: ["GrammarButton (upgrade)", "GrammarMessage (tone: danger, over-cap-frozen only)"], derivation: "Representative direction; generated by interface.draw once gap.plan.direction-not-drawn closes.", directionAsset: assets/usage-over-cap-frozen.png}
      - {screen: usage, state: paid-unlimited, viewport: desktop-1280, components: ["GrammarButton (upgrade)", "GrammarMessage (tone: danger, over-cap-frozen only)"], derivation: "Derives from the over-cap-frozen representative direction: same GrammarButton (upgrade), GrammarMessage (tone: danger, over-cap-frozen only) anatomy; the cap and upgrade action are both removed; only the usage count remains."}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.plan.direction-not-drawn.
assets:
