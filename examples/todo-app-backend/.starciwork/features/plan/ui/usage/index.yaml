          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Usage)"
          - "Text (size: metric-lead, usage count)"
          - "Progress (label: Tasks used against your free plan cap)"
          - "Text (live: assertive, the cap-and-upgrade sentence)"
          - "Button (upgrade, variant: primary)"
        derivation: Representative direction. Show 40 active tasks against cap 20; existing tasks are
          preserved, creation frozen, Upgrade plan and Manage tasks available. At exactly cap, the
          next create is still refused by br.plan.caps.limit. Progress receives value 100 (clamped),
          while visible ratio/aria description states 40 of 20, 200% of cap.
        directionAsset: assets/usage-over-cap-frozen.png
      - screen: usage
        state: over-cap-frozen
        viewport: mobile-390
        components:
