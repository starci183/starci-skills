schema: work/ui-screen
id: ui.plan.usage
title: The usage screen and its upgrade action
state: done
brand: {rev: 2}
refs: [fr.plan.usage.view, fr.plan.upgrade]
ui:
  intent: >-
    A single usage summary that makes active-task count, free cap and the path back to creation legible
    at a glance. The over-cap-frozen state is representative because it shows the densest truthful
    relationship without inventing prices, deleting tasks or treating completed tasks as active.
  surfaces:
    - name: usage
      route: /plan/usage
      purpose: see active-task usage against the free cap and upgrade
      actors: [owner]
  states:
    - {name: under-cap, trigger: "active task count is below 20 on the free plan", behavior: "count, cap and proportional progress are shown; creation remains available elsewhere"}
    - {name: at-cap, trigger: "active task count is exactly 20", behavior: "count and full progress are shown with a concise next-create explanation and upgrade action"}
    - {name: over-cap-frozen, trigger: "a downgrade leaves more than 20 active tasks", behavior: "existing tasks remain, creation is frozen, and the screen names complete, delete or upgrade as recovery paths"}
    - {name: paid-unlimited, trigger: "the paid plan is active", behavior: "active usage remains visible while the finite cap, progress and upgrade action are omitted"}
  coverage:
    scale: bounded
    representativeScreens: [usage]
    map:
      - {screen: usage, state: under-cap, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Progress], derivation: "Show actual count and proportional progress; omit the over-cap status and upgrade pressure."}
      - {screen: usage, state: at-cap, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Progress, Button], derivation: "Show 20 of 20 and explain the next-create boundary without claiming an existing task changed."}
      - {screen: usage, state: over-cap-frozen, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Progress, Button], derivation: "Representative generated direction; the bar stops at 100 percent while adjacent text preserves 24 against 20.", directionAsset: assets/usage-over-cap-frozen.png}
      - {screen: usage, state: paid-unlimited, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard], derivation: "Retain active usage but remove finite-cap progress, frozen status and upgrade action."}
  accessibility:
    - Progress has an accessible label and adjacent text carries the exact count and cap.
    - The frozen explanation is assertive Text and is never communicated by color alone.
    - Upgrade is a named primary action with compliant text contrast.
  responsive:
    - desktop-1280 uses a reading-width summary; mobile-390 preserves count, cap, progress, explanation then action.
    - Numeric meaning remains explicit when text wraps and the progress bar never clips its label.
  artworkSlots: []
  observations:
    - "Installed Common Progress accepts 0 through 100, so overage truth remains in adjacent count and cap text."
    - "The metric is the focal point, explanation is subordinate and Upgrade is the only saturated action."
    - "The image is proposed direction only and does not prove subscription or billing behavior."
  gaps: []
  assets:
    - path: assets/usage-over-cap-frozen.prompt.txt
      role: prompt
    - path: assets/usage-over-cap-frozen.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/usage-over-cap-frozen.prompt.txt
        inputRefs: [ui.plan.usage, fr.plan.usage.view, fr.plan.upgrade, br.plan.downgrade.freeze, sds.plan.cap-guard, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/usage-over-cap-frozen.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/usage-over-cap-frozen.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/usage-over-cap-frozen.prompt.txt
      inputRefs: [ui.plan.usage, fr.plan.usage.view, fr.plan.upgrade, br.plan.downgrade.freeze, sds.plan.cap-guard, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: 2026-09-18T10:07:36.391Z
