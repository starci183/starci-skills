          Form fields stack and row actions wrap without hiding controls or horizontal page
          scrolling. a non-danger message warns the next create will be refused; the upgrade Button
          is shown but not forced"
        directionAsset: assets/usage-over-cap-frozen.png
      - screen: usage
        state: over-cap-frozen
        viewport: desktop-1280
        components:
