schema: work/data
id: data.plan.subscription
title: Subscription
state: done
fields:
  - {name: id, type: text, required: true, note: Opaque, assigned at creation.}
  - {name: personId, type: text, required: true, note: Bound at creation and never rewritten.}
  - {name: plan, type: text, required: true, default: free, note: "References data.plan.plan by id."}
  - {name: status, type: text, required: true, default: free,
     note: "One of free, pending, active, past-due, lapsed; see sds.plan.subscription-lifecycle."}
  - {name: periodEnd, type: timestamp, required: false, note: Set on activation or renewal, null while free.}
  - {name: gatewayCustomerId, type: text, required: false, note: Set once a checkout has been started.}
invariants:
  - Exactly one subscription row exists per personId; a person's plan is looked up, never listed.
  - periodEnd is set if and only if status is active or past-due.
  - status is authored by sds.plan.subscription-lifecycle's transitions only; nothing writes it directly.
appliesTo: [br.plan.caps.limit, br.plan.downgrade.freeze, br.plan.lapse.reverts-on-read]
refs: [data.plan.plan]
