schema: work/business-rule
id: br.plan.payment.idempotent
title: The same payment intent is never applied twice
state: todo
statements:
  - A gateway event names a payment intent id. Applying an event for an intent already recorded as applied
    changes nothing - no second activation, no second period extension, no second ledger entry.
  - This holds regardless of which path applies the event first - a webhook (fr.plan.upgrade,
    sds.plan.subscription-lifecycle's t-gateway-confirmed) or a reconciliation poll standing in for a
    webhook that never arrived (fr.plan.reconcile) - so a late webhook after a reconcile already activated
    the same intent is a no-op, not a second charge.
authorityRefs:
  - "money-intent: A person is charged once per thing they bought. A replay of the same webhook, or a
    reconciliation racing a late webhook, is an infrastructure fact and must never become a billing fact."
acceptanceCriteria: [replay-is-noop]
module: src/plan/payments
change: {rev: 1, kind: initial, at: 2026-09-18T07:02:00.000Z}
refs: [sds.plan.subscription-lifecycle, sds.plan.reconciliation]
