schema: work/business-rule
id: br.plan.lapse.reverts-on-read
title: A lapsed plan reverts to free on read, not by a sweep
state: done
statements:
  - Once a subscription reaches lapsed (sds.plan.subscription-lifecycle's t-lapse), every subsequent read of
    that person's effective plan - the cap guard, the usage screen, anything - returns free, computed at the
    moment of the read.
  - No scheduled job scans subscription rows to flip a lapsed one to free. A stopped or delayed sweep must
    never leave a lapsed person holding paid-plan behaviour, the same way sds.login.session-store enforces
    session expiry on read rather than by a sweeper.
  - The stored row still says lapsed; only the computed effective plan says free. History is not rewritten.
authorityRefs:
  - "money-intent: A cap that only tightens once a background job gets around to it is a cap a lapsed person
    can outrun for as long as the job is behind or down."
acceptanceCriteria: [read-after-grace-is-free]
module: src/modules/bussiness/plan
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T16:00:00.000Z
  reason: SubscriptionService.readEffectivePlan (t-revert-on-read) answers free for a lapsed row by
    computation, never writing to it; proven by subscription.service.spec.ts's
    ac.plan.lapse.reverts-on-read.read-after-grace-is-free case.
refs: [sds.login.session-store, sds.plan.subscription-lifecycle]
