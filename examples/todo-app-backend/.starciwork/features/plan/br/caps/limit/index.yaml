schema: work/business-rule@1
id: br.plan.caps.limit
title: A free plan holds at most 20 active tasks
state: done
statements:
  - A person on the free plan may hold at most 20 active tasks, counted per br.plan.active-scope.
  - The create that would exceed the cap is refused before anything is written, and the refusal names both
    the cap and the upgrade path (fr.plan.upgrade).
authorityRefs:
  - "product-intent: The free tier is a real product, not a trial that quietly stops working; the refusal
    must say why and what to do next, never fail silently or degrade some other way."
acceptance:
  - id: ac.plan.caps.limit.refuses-over-cap
    given: A free-plan owner already holding 20 active tasks
    when: They submit a title to create one more
    then:
      - Creation is refused.
      - Nothing is written.
      - The refusal names the cap of 20 and the upgrade path.
module: src/modules/bussiness/plan
change:
  rev: 3
  kind: editorial
  at: 2026-09-19T15:59:33.966Z
  reason: PlanCapGuardPolicy throws PlanCapExceededException (naming the cap and the upgrade path) before
    anything is written, registered into TaskCreationPolicyRegistry by PlanModule.onModuleInit per
    contract.plan.create-precondition; proven by cap-guard.policy.spec.ts's
    ac.plan.caps.limit.refuses-over-cap case.

    rev 3 (v11 ac-collapse) - acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.plan.caps.limit#<former-ac-id>. Encoding change only, no semantic change.
