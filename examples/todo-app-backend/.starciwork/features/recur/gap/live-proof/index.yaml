id: gap.recur.live-proof
title: No passing uat.verify run for recur.make-recurring - the product has no occurrence-completion door
state: todo
statement: uat.recur.make-recurring names its entry, actor, ordered steps, fixtures, effects and cleanup
  in the op's own shape, and as of 2026-09-19 the Playwright walk is implemented and has run for real -
  runs/20260919T150331Z-5c10a673 carries nine step screenshots, a playable video, and verified cleanup,
  with outcome fail. The remaining blocker is no longer "never executed"; it is a missing product
  capability - the record's step 5 ("complete that occurrence ... its status becomes completed") has no
  door in the served product - the schedule screen's occurrence rows are read-only, the public GraphQL
  schema registers no completeOccurrence/skipOccurrence mutation (OccurrenceService.complete is internal
  CQRS only), and completing the occurrence's backing task row via completeTask sets tasks.complete but
  never touches occurrences.status, so a passing run cannot be produced until the product exposes an
  occurrence-completion surface. A second, lesser defect also named by the run - the record's designed
  entry /tasks/:taskId/schedule is not served (the task list's Schedule link 404s); the surface that
  exists is /<lang>/recur?task=<task title>.
closedBy: uat.recur.make-recurring
