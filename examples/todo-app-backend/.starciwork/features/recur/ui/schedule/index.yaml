schema: work/ui-screen
id: ui.recur.schedule
title: A recurring task's schedule
state: done
brand: {rev: 2}
refs: [fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule]
ui:
  intent: >-
    A focused recurrence form uses text-only pressable fields for frequency, time and time zone, with a
    numeric interval Input owning its correction. The representative refused state preserves zero so the
    person can correct it and does not imply an invalid rule created upcoming tasks.
  surfaces:
    - name: schedule
      route: "/tasks/:taskId/schedule"
      purpose: set recurrence and review upcoming occurrences
      actors: [owner]
  states:
    - {name: no-rule, trigger: "the task has no accepted recurrence rule", behavior: "the recurrence form is shown and no upcoming collection is present"}
    - {name: active, trigger: "an accepted rule has not ended", behavior: "rule summary and upcoming occurrences appear in one collection with a named End recurrence action"}
    - {name: ended, trigger: "the rule has ended", behavior: "no future occurrence is added and historical occurrences retain their original status"}
    - {name: refused, trigger: "the submitted schedule is invalid such as interval zero", behavior: "the Repeat every Input retains zero and owns the correction message; no rule is accepted"}
  coverage:
    scale: bounded
    representativeScreens: [schedule]
    map:
      - {screen: schedule, state: no-rule, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, PressableField, Input, Button], derivation: "Use the representative form without the interval error and with valid initial values."}
      - {screen: schedule, state: active, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, SurfaceListCard, Button], derivation: "Replace the create form with a rule summary followed by one upcoming-occurrence collection."}
      - {screen: schedule, state: ended, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, SurfaceListCard, StaticStateRow], derivation: "Mark the rule ended, omit future generation and retain historical rows without interactive affordance."}
      - {screen: schedule, state: refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, PressableField, Input, Button], derivation: "Representative generated direction; mobile keeps all fields and the local error in the same order.", directionAsset: assets/schedule-refused.png}
  accessibility:
    - Every field has a persistent visible label and the interval error is associated with Repeat every.
    - PressableField controls expose their label and current value without relying on a decorative icon.
    - Keyboard order follows frequency, interval, time, time zone and save.
  responsive:
    - desktop-1280 uses a reading-width single-column form; mobile-390 keeps the same order in a fluid card.
    - Local error text and long time-zone values wrap without clipping or hiding Save schedule.
  artworkSlots: []
  observations:
    - "Installed Common proves PressableField for input-like choices, Input error ownership and a primary Button; it does not prove a select or calendar."
    - "The corrected generation removed unproven chevrons and keeps one clear top-to-bottom form rhythm."
    - "The image is proposed direction only and does not prove recurrence generation, time-zone computation or persistence."
  gaps:
    - "Common has no select or date-time picker; application behavior behind each text-only PressableField needs separate interaction specification."
  assets:
    - path: assets/schedule-refused.prompt.txt
      role: prompt
    - path: assets/schedule-refused.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/schedule-refused.prompt.txt
        inputRefs: [ui.recur.schedule, fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule, sds.recur.generation-engine, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/schedule-refused.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/schedule-refused.png
    role: direction
    generation:
