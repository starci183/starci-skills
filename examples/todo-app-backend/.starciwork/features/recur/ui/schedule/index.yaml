schema: work/ui-screen
id: ui.recur.schedule
title: A recurring task's schedule
state: done
brand: {rev: 2}
refs: [fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule]
ui:
  intent: >-
    The upcoming-occurrences list is a page section with its own heading, never a card, per COLLECTION-1. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: schedule, route: /tasks/:taskId/schedule, purpose: "turn a task into a recurring rule and see upcoming occurrences", actors: [owner]}
  states:
    - {name: no-rule, trigger: "the task has no recurrence rule yet", behavior: "only the make-recurring form is shown, no upcoming-occurrences list"}
    - {name: active, trigger: "a rule is set and has not ended", behavior: "the upcoming-occurrences list renders below the rule summary and an end-rule GrammarButton"}
    - {name: ended, trigger: "the rule has been ended", behavior: "the upcoming list is empty going forward; past occurrences remain listed with their original status, unchanged"}
    - {name: refused, trigger: "the submitted schedule is invalid, for example a weekend-only rule with no matching weekday", behavior: "a GrammarMessage(tone: danger) names the invalid field; the form retains the entered values"}
  coverage:
    scale: bounded
    representativeScreens: [schedule]
    map:
      - {screen: schedule, state: no-rule, viewport: desktop-1280, components: ["GrammarTextField (rule expression / time / timezone)", "GrammarButton (save rule / end rule)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (rule expression / time / timezone), GrammarButton (save rule / end rule), GrammarMessage (tone: danger, refused only) anatomy; only the make-recurring form is shown, no upcoming-occurrences list."}
      - {screen: schedule, state: active, viewport: desktop-1280, components: ["GrammarTextField (rule expression / time / timezone)", "GrammarButton (save rule / end rule)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (rule expression / time / timezone), GrammarButton (save rule / end rule), GrammarMessage (tone: danger, refused only) anatomy; the upcoming-occurrences list renders below the rule summary and an end-rule GrammarButton."}
      - {screen: schedule, state: ended, viewport: desktop-1280, components: ["GrammarTextField (rule expression / time / timezone)", "GrammarButton (save rule / end rule)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (rule expression / time / timezone), GrammarButton (save rule / end rule), GrammarMessage (tone: danger, refused only) anatomy; the upcoming list is empty going forward; past occurrences remain listed with their original status, unchanged."}
      - {screen: schedule, state: refused, viewport: desktop-1280, components: ["GrammarTextField (rule expression / time / timezone)", "GrammarButton (save rule / end rule)", "GrammarMessage (tone: danger, refused only)"], derivation: "Representative direction; generated by interface.draw once gap.recur.direction-not-drawn closes.", directionAsset: assets/schedule-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.recur.direction-not-drawn.
assets:
  - path: assets/schedule-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
  - path: assets/schedule-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/schedule-refused.prompt.txt
      inputRefs: [ui.recur.schedule, fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule, brand]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: "2026-09-18T06:10:35.1568108Z"
