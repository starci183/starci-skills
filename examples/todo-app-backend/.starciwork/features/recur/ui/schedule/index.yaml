schema: work/ui-screen
id: ui.recur.schedule
title: A recurring task's schedule
state: todo
brand: {rev: 2}
refs: [fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule]
ui:
  intent: >-
    The upcoming-occurrences list is its own page section, named by SurfaceListCard's own `label` (the
    real published collection container per COLLECTION-1 case-5), never nested inside the make-recurring
    SurfaceCard. The representative direction is drawn for the refused state because a submitted-but-invalid
    schedule is the densest single-surface state the make-recurring form itself reaches, and, where the
    state is an error/refusal, the accessibility-critical assertive-live Text carrying the refusal and the
    brand's contrast don't (Never place text on the primary colour below a 4.5:1 contrast ratio.) both
    apply. Refused is reached only from no-rule, so it does not carry the upcoming-occurrences section or
    the end-rule Button - those exist only once active names a saved rule; the coverage map below marks
    that difference explicitly rather than repeating one component list across every state.
    @starci/grammar/common ships no Message/Alert renderer and no dropdown/select input; the refusal is a
    plain Text line and the time-of-day value is chosen through PressableField, not a `<select>`.
  surfaces:
    - {name: schedule, route: /tasks/:taskId/schedule, purpose: "turn a task into a recurring rule and see upcoming occurrences", actors: [owner]}
  states:
    - {name: no-rule, trigger: "the task has no recurrence rule yet", behavior: "only the make-recurring form is shown, no upcoming-occurrences list"}
    - {name: active, trigger: "a rule is set and has not ended", behavior: "the upcoming-occurrences list renders below the rule summary and an end-rule GrammarButton"}
    - {name: ended, trigger: "the rule has been ended", behavior: "the upcoming list is empty going forward; past occurrences remain listed with their original status, unchanged"}
    - {name: refused, trigger: "the submitted schedule is invalid, for example a weekend-only rule with no matching weekday", behavior: "a GrammarMessage(tone: danger) names the invalid field; the form retains the entered values"}
  coverage:
    scale: bounded
    representativeScreens: [schedule]
    map:
      - {screen: schedule, state: no-rule, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Schedule)", "Input (id: recur-rule, label: Repeat)", "PressableField (label: Time of day)", "Button (save rule, type: submit, variant: primary)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input (rule), PressableField (time), Button (save rule) anatomy, minus the refusal Text; only the make-recurring form is shown, no upcoming-occurrences section and no end-rule Button since no rule is saved yet."}
      - {screen: schedule, state: active, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Schedule)", "Text (rule summary sentence)", "Button (end rule, variant: outline)", "SurfaceListCard (label: Upcoming occurrences)", "StaticStateRow (one per occurrence)"], derivation: "Once a rule is saved, the editable Input/PressableField form is replaced by a Text rule summary and an end-rule Button (variant: outline) inside the same SurfaceCard; the upcoming-occurrences SurfaceListCard renders below it with one StaticStateRow per occurrence - anatomy the refused state, reached only from no-rule, never shows."}
      - {screen: schedule, state: ended, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Schedule)", "Text (rule summary sentence, ended)", "SurfaceListCard (label: Upcoming occurrences)", "StaticStateRow (past occurrences, unchanged state)", "EmptyNotice (nothing upcoming)"], derivation: "Derives from the active state: same SurfaceCard, Text (rule summary), SurfaceListCard anatomy, minus the end-rule Button (the rule is already ended); the list's StaticStateRow entries for past occurrences keep their original `state` unchanged, and an EmptyNotice marks that nothing new is upcoming."}
      - {screen: schedule, state: refused, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Schedule)", "Input (id: recur-rule, label: Repeat)", "PressableField (label: Time of day)", "Text (live: assertive, the invalid-field sentence)", "Button (save rule, type: submit, variant: primary)"], derivation: "Representative direction; generated by interface.draw once gap.recur.direction-not-drawn closes.", directionAsset: assets/schedule-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
assets:
  - path: assets/schedule-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
blockedBy:
  - {record: gap.recur.direction-not-drawn, because: "interface.draw has not run for this screen; no built-in image_gen.imagegen invocation has produced the refused representative direction or its sibling prompt bytes yet, only the prompt this record's assets entry names."}
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T09:00:00.000Z
  reason: Re-authored the prompt and coverage map from the actual installed @starci/grammar@0.4.13 common anatomy, replacing the vendored stub's fictitious GrammarTextField/GrammarButton/GrammarMessage names and tightening which states actually carry the upcoming-occurrences section.
