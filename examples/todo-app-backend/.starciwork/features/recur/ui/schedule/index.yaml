refs:
  - fr.recur.make-recurring
  - fr.recur.see-upcoming
  - fr.recur.end-rule
ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. A recurring task's schedule. The representative state is refused.
  surfaces:
    - name: schedule
      route: /tasks/:taskId/schedule
      purpose: turn a task into a recurring rule and see upcoming occurrences
      actors:
        - owner
  states:
    - name: no-rule
      trigger: the task has no recurrence rule yet
      behavior: only the make-recurring form is shown, no upcoming-occurrences list
    - name: active
      trigger: a rule is set and has not ended
      behavior: the upcoming-occurrences list renders below the rule summary and an end-rule Button
    - name: ended
      trigger: the rule has been ended
      behavior: Remove future previews and end action; keep materialised history. Completed/skipped
        statuses stay; outstanding materialised occurrences become orphaned under fr.recur.end-rule.
    - name: refused
      trigger: An every-n-days rule is submitted with n=0
      behavior: Retain frequency, n, local time, IANA time zone and start date; identify n as requiring a
        positive integer. No rule or upcoming preview exists yet. Monthly day 31 remains valid.
  coverage:
    scale: bounded
    representativeScreens:
      - schedule
    map:
      - screen: schedule
        state: no-rule
        viewport: desktop-1280
        components:
          - WorkspaceShell (header, primary, primaryLabel, compactHeader, compactNavigation)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Schedule)"
          - "Input (id: recur-rule, label: Repeat)"
          - "Button (save rule, type: submit, variant: primary)"
          - native frequency radio group (every-weekday/every-n-days/monthly-day)
          - "Input (kind: text; conditional n/dayOfMonth)"
          - "Input (kind: text; time HH:MM)"
          - "Input (kind: text; timeZone IANA)"
          - "Input (kind: text; startDate YYYY-MM-DD)"
