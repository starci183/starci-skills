# gap.recur.unbuilt-module closed at rev 2 (closedBy: impl.recur.todo-app-backend.engine, the backend
# half); the blockedBy edge that named it was removed at rev 1 because it was stale.
#
# rev 2 (this change) is the interface.implement run itself: the route and block named by owners
# above now exist under src/app/recur and src/components/recur in examples/todo-app-frontend, built
# on the installed @starci/grammar 0.4.13 exports the ui.recur.schedule map names (WorkspaceShell,
# PageContainer, SurfaceCard, SurfaceListCard, StaticStateRow, EmptyNotice, Input, Button, Text,
# TextAction, Heading). All four mapped states and both viewports are proven by the running-page
# captures listed under assets, each reached through the page's own controls against the live
# GraphQL API (makeRecurring/upcomingOccurrences/endRecurrence); evidence.yaml beside this file
# binds the check commands and the code digest. The owners entries were corrected from the record's
# originally intended file paths (app/recur/*.tsx) to the module-root directories the layout's
# owners vocabulary requires, matching how the code actually landed.
#
# Quality checks: lint (next build's starci-fe canon pass), typecheck (tsc --noEmit), tests (vitest,
# 39 green incl. 7 schedule-screen specs) and build (next build, /recur compiled) all pass and are
# the evidence assertions. Coverage has no configured runner or threshold in this example repo -
# recorded not-run, not pass. Sonar is likewise not-run: a SonarQube server responds at :9010 but no
# project binding, scanner runner or token reference exists in either example repository, so the
# required server quality gate cannot be proven from this checkout - reported, never fabricated.
#
# Integration note: the live RecurFrequency GraphQL enum travels under its registered keys
# (EveryWeekday/EveryNDays/MonthlyDay), not the data.recur.rule.frequency kebab-case domain values;
# the block maps domain<->wire at the transport call site. No business or schema change was needed.
change: {rev: 4, kind: editorial, at: 2026-09-19T22:40:00.000Z, reason: "w10: state restored todo -> done - the #6d97ff/#b2c8ff/#95b3ff buckets were antialiasing fringe around the checked radio dominating viewport-only mobile captures, not an undeclared stylesheet colour; assets/capture.mjs now takes full-page mobile screenshots and the re-run scripts/example-render-proof.mjs holds for every capture (entity-list-in-card included), so gap.recur.render-proof is closed. Prior narrative kept verbatim: v7-13: state rescinded done -> todo - the fresh captures v7-9 produced fail entity-list-in-card (active states) and palette-off-brand (#6d97ff on no-rule/refused mobile), so the done claim is unproven and the record is held by gap.recur.render-proof. Rev 2's build description stands as the record of what was built: built the /recur route and src/components/recur block on installed Grammar exports, captured all four mapped states at both viewports with real running-page captures under assets/, corrected owners to the module-root directories that exist, and bound checks + code digest in evidence.yaml. Coverage and Sonar recorded not-run for missing configured runners rather than falsely passed."}
