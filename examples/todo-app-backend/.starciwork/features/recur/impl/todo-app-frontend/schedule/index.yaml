# v7-3 (2026-09-19): route corrected to the directory that exists. Every page route in this app sits
# under the [lang] locale segment (locales en|vi); src/app/recur never existed. The rev-2 reason below
# claims the owners were already "corrected to the module-root directories that exist" - that held
# for src/components/recur and not for the route, and the comment naming "src/app/recur" as where the
# route now lives is stale for the same reason. Quoted because core/yaml.mjs rejects a bracketed
# plain scalar inside a flow mapping.
owners:
  - {role: route, path: "src/app/[lang]/recur"}
  - {role: block, path: src/components/recur}
proves: [ui.recur.schedule]
