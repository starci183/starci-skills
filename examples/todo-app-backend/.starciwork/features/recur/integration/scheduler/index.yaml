schema: work/integration
id: integration.recur.scheduler
title: A scheduled tick materialises every rule's due occurrences
state: todo
provider: nestjs-schedule
boundary: "This product owns the generation logic entirely (sds.recur.generation-engine): the provider's
  only job is to fire a callback at a configured interval, in-process, inside the same NestJS application
  as the API. There is no external service to be down independently of the app itself; the \"outage\"
  decision.recur.generation.backfill answers is the app process not running, not a provider being
  unreachable."
endpoints:
  - {name: tick, method: CRON, path: "*/5 * * * *"}
sandbox: The dev environment runs the same in-process scheduler as production, on the same interval; there
  is no separate sandbox instance to run it against, only a shorter observation window.
refs: [sds.recur.generation-engine]

requiresProof:
  live:
    required: true
    note: A run of the real in-process scheduler on the dev server producing a materialised occurrence,
      not a manually invoked function call standing in for the tick.

blockedBy:
  - {record: gap.recur.unbuilt-module, because: "Not implemented. There is no NestJS scheduler module for this feature yet, so there is no tick to run against."}
