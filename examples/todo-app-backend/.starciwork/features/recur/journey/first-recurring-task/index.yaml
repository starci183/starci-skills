schema: work/customer-journey
id: journey.recur.first-recurring-task
title: A person turns their morning routine into a rule
state: todo
crossesFeatures: [task, recur]
steps:
  - {actor: person, does: "Creates an ordinary task, expects: A task they can complete once."}
  - {actor: person, does: "Turns it into a rule that fires every weekday, expects: The same task, now with a schedule instead of a single date."}
  - {actor: person, does: "Comes back Monday, expects: The task is there again, freshly materialised, not the same row from Friday."}
  - {actor: person, does: "Stops the routine weeks later, expects: Every day they already did it stays marked done; nothing is erased."}
requirements: [fr.task.create, fr.recur.make-recurring, fr.recur.end-rule]

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements

blockedBy:
  - {record: fr.recur.make-recurring, because: "No implementation yet; fr.recur.make-recurring and fr.recur.end-rule have no uat evidence to compose into a cross-feature proof."}
  - {record: fr.recur.end-rule, because: "No implementation yet; fr.recur.make-recurring and fr.recur.end-rule have no uat evidence to compose into a cross-feature proof."}
