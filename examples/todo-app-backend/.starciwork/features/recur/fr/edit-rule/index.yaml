schema: work/functional-requirement
id: fr.recur.edit-rule
title: Edit a recurring rule
state: todo
actors: [owner]
trigger: The owner changes a rule's frequency, time of day or time zone.
mainFlow:
  - The owner submits the changed fields.
  - The rule is updated; every occurrence already materialised is left as it is.
  - Occurrences not yet materialised are generated from the new rule the next time the generator runs.
exceptionFlows:
  - Someone who is not the rule's owner may not edit it.
postconditions:
  - The rule reflects the new schedule, and no already-materialised occurrence is rewritten to match it.
composes:
  - {rule: br.recur.occurrence.owned-by-rule-owner, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- recur/edit-rule
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real and unit-tested (EditRecurrenceHandler/RuleService.edit, edit-recurrence.handler.spec.ts), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's editRecurrence step, including the non-owner refusal). What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e's npm run test:e2e script, which does not exist in this generation of the backend."}
change: {rev: 1, kind: editorial, at: 2026-09-18T16:00:00.000Z, reason: "composes module path corrected from the stale pre-migration src/recur/occurrence to the real module root src/modules/bussiness/recur; blockedBy re-rooted from the now-resolved gap.recur.unbuilt-module to gap.recur.live-proof."}
