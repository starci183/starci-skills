schema: work/functional-requirement@1
id: fr.recur.edit-rule
title: Edit a recurring rule
state: todo
actors: [owner]
trigger: The owner changes a rule's frequency, time of day or time zone.
mainFlow:
  - The owner submits the changed fields.
  - The rule is updated; every occurrence already materialised is left as it is.
  - Occurrences not yet materialised are generated from the new rule the next time the generator runs.
exceptionFlows:
  - Someone who is not the rule's owner may not edit it.
postconditions:
  - The rule reflects the new schedule, and no already-materialised occurrence is rewritten to match it.
composes:
  - {rule: br.recur.occurrence.owned-by-rule-owner, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real and unit-tested (EditRecurrenceHandler/RuleService.edit, edit-recurrence.handler.spec.ts), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's editRecurrence step, including the non-owner refusal). What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e, whose command now names the real spec (src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts walks the edit -> occurrences-reflect-edit leg) but has no passing run captured as evidence here yet."}
change: {rev: 2, kind: editorial, at: 2026-09-19T00:00:00.000Z, reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern 'recur/edit-rule' matched no file under src/tests/e2e; recurrence-lifecycle.e2e-spec.ts covers the edit leg. Rev 1's module-path correction stands."}
