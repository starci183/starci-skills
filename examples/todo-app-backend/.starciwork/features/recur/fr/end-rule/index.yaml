schema: work/functional-requirement@1
id: fr.recur.end-rule
title: End a recurring rule
state: todo
actors: [owner]
trigger: The owner ends a rule they no longer want occurrences from.
mainFlow:
  - The owner ends the rule.
  - No occurrence dated after the day it ended is generated.
  - Every occurrence already materialised is kept; any of them not already completed or skipped becomes
    orphaned.
postconditions:
  - The rule carries an endedAt local date, and nothing it already produced was deleted.
composes:
  - {rule: br.recur.ending.preserves-history, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real and unit-tested (EndRecurrenceHandler/OccurrenceService.orphanEndedOccurrences, end-recurrence.handler.spec.ts, proving ac.recur.ending.preserves-history.ended-rule-keeps-past-occurrences exactly), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's endRecurrence step). What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e, whose command now names the real spec (src/tests/e2e/recur/recurrence-lifecycle.e2e-spec.ts walks end -> no-new-occurrences) but has no passing run captured as evidence here yet."}
change: {rev: 2, kind: editorial, at: 2026-09-19T00:00:00.000Z, reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern 'recur/end-rule' matched no file under src/tests/e2e; recurrence-lifecycle.e2e-spec.ts covers the end leg. Rev 1's module-path correction stands."}
