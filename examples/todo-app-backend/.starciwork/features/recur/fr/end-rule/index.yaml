schema: work/functional-requirement
id: fr.recur.end-rule
title: End a recurring rule
state: todo
actors: [owner]
trigger: The owner ends a rule they no longer want occurrences from.
mainFlow:
  - The owner ends the rule.
  - No occurrence dated after the day it ended is generated.
  - Every occurrence already materialised is kept; any of them not already completed or skipped becomes
    orphaned.
postconditions:
  - The rule carries an endedAt local date, and nothing it already produced was deleted.
composes:
  - {rule: br.recur.ending.preserves-history, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- recur/end-rule
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real and unit-tested (EndRecurrenceHandler/OccurrenceService.orphanEndedOccurrences, end-recurrence.handler.spec.ts, proving ac.recur.ending.preserves-history.ended-rule-keeps-past-occurrences exactly), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's endRecurrence step). What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e's npm run test:e2e script, which does not exist in this generation of the backend."}
change: {rev: 1, kind: editorial, at: 2026-09-18T16:00:00.000Z, reason: "composes module path corrected from the stale pre-migration src/recur/occurrence to the real module root src/modules/bussiness/recur; blockedBy re-rooted from the now-resolved gap.recur.unbuilt-module to gap.recur.live-proof."}
