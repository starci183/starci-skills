schema: work/functional-requirement
id: fr.recur.see-upcoming
title: See a rule's upcoming occurrences
state: todo
actors: [owner]
trigger: The owner opens their recurring task's schedule.
mainFlow:
  - The owner sees every occurrence already materialised (with its status) and a preview of the dates the
    rule will next fire on, computed live from the rule, not read from stored rows.
exceptionFlows:
  - An ended rule shows no upcoming preview, only its history.
postconditions:
  - Nothing shown as "upcoming" implies a row exists yet; a preview is not a promise the generator has
    already kept.
composes:
  - {rule: br.recur.impossible-date.skips, module: src/modules/bussiness/recur}
refs: [data.recur.rule, data.recur.occurrence]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- recur/see-upcoming
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved on the backend - impl.recur.todo-app-backend.engine is real and unit-tested (UpcomingOccurrencesHandler, upcoming-occurrences.handler.spec.ts, including the ended-rule-shows-no-preview exceptionFlow), and this flow's backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's upcomingOccurrences steps, before and after ending). The frontend schedule screen (impl.recur.todo-app-frontend.schedule) remains unbuilt and is outside this lane's scope. What remains unmet is requiresProof.uat (uat.recur.make-recurring's own run composes this flow, and has no runs/ folder yet - gap.recur.live-proof, not mine to close) and requiresProof.e2e's npm run test:e2e script, which does not exist in this generation of the backend."}
change: {rev: 1, kind: editorial, at: 2026-09-18T16:00:00.000Z, reason: "composes module path corrected from the stale pre-migration src/recur/rule to the real module root src/modules/bussiness/recur; blockedBy re-rooted from the now-resolved (backend half of) gap.recur.unbuilt-module to gap.recur.live-proof."}
