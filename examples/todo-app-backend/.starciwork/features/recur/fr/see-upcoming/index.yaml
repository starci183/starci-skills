schema: work/functional-requirement
id: fr.recur.see-upcoming
title: See a rule's upcoming occurrences
state: todo
actors: [owner]
trigger: The owner opens their recurring task's schedule.
mainFlow:
  - The owner sees every occurrence already materialised (with its status) and a preview of the dates the
    rule will next fire on, computed live from the rule, not read from stored rows.
exceptionFlows:
  - An ended rule shows no upcoming preview, only its history.
postconditions:
  - Nothing shown as "upcoming" implies a row exists yet; a preview is not a promise the generator has
    already kept.
composes:
  - {rule: br.recur.impossible-date.skips, module: src/recur/rule}
refs: [data.recur.rule, data.recur.occurrence]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- recur/see-upcoming
  uat:
    required: true

blockedBy:
  - {record: gap.recur.unbuilt-module, because: "No implementation yet. The example's backend target moved to NestJS and the frontend to Next.js; the schedule screen has not been built on either side."}
