schema: work/functional-requirement
id: fr.recur.make-recurring
title: Make a task recurring
state: todo
actors: [owner]
trigger: The owner turns an existing task, or a new one, into a recurring rule.
mainFlow:
  - The owner picks a frequency (every weekday, every N days, or a day of the month), a time of day and
    a time zone, defaulting to their own.
  - The rule is created, owned by the submitter, and its first occurrence is previewed.
exceptionFlows:
  - A day-of-month rule naming a day that does not exist every month (e.g. the 31st) is accepted; nothing
    is refused at creation, per decision.recur.impossible-date.
postconditions:
  - Exactly one recurrence rule exists for that submission, and it exists whether or not the day it names
    exists in the current month.
composes:
  - {rule: br.recur.impossible-date.skips, module: src/modules/bussiness/recur}
  - {rule: br.recur.timezone.owner-local-time, module: src/modules/bussiness/recur}
refs: [data.recur.rule]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- recur/make-recurring
  uat:
    required: true

blockedBy:
  - {record: gap.recur.live-proof, because: "gap.recur.unbuilt-module is resolved - impl.recur.todo-app-backend.engine is real, unit-tested (composes' both rules pass) and this flow's own backend half runs end to end against the live dev stack (scripts/live-proof-recur.sh's makeRecurring/upcomingOccurrences steps). What remains unmet is this record's own uat.required and e2e proof: uat.recur.make-recurring has no runs/ folder yet (gap.recur.live-proof, not mine to close - ui/uat records are out of this lane's scope) and requiresProof.e2e's npm run test:e2e script does not exist in this generation of the backend (scripts/live-proof-recur.sh is its current successor, per this feature's own brief, but requiresProof.e2e.command itself is left as authored rather than edited by this lane)."}
change: {rev: 1, kind: editorial, at: 2026-09-18T16:00:00.000Z, reason: "module paths in composes corrected from the stale pre-migration src/recur/rule and src/recur/zone to the real module root src/modules/bussiness/recur; blockedBy re-rooted from the now-resolved gap.recur.unbuilt-module to gap.recur.live-proof, the real remaining reason this record cannot yet be claimed done."}
