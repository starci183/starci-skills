schema: work/uat-flow
id: uat.recur.make-recurring
title: Make a task recurring, see its upcoming occurrences, then end it
state: todo
accounts: accounts.yaml
steps:
  - Sign in as the owner.
  - Turn a task into a rule that fires every weekday at 09:00 in the owner's own time zone.
  - See the upcoming occurrences preview, and confirm none of them is a weekend date.
  - Wait for (or trigger) a generation run, and see the day's occurrence appear with status materialised.
  - Complete that occurrence, and see its status become completed.
  - End the rule, and confirm the completed occurrence's status is unchanged, and no new occurrence
    appears after the day the rule ended.
proves: [fr.recur.make-recurring, fr.recur.see-upcoming, fr.recur.end-rule, br.recur.generation.once,
  br.recur.ending.preserves-history]
