  _VOID.md: >
    # VOID — this run folder must not be relied on


    This run's `result.md` reads `Outcome: pass`, but the walk **crashed
    mid-flow** and is not a pass:


    - The Playwright test failed at `occurrence-complete-attempted` (a
    `locator.check()` race against the
      task row's controlled checkbox — the click fired the real `completeTask` mutation but the `checked`
      prop only flips after the roundtrip + list refetch, which `check()` did not wait for).
    - Only the first five `walkStep` checkpoints ran; the end-rule,
    post-end-stillness and cleanup legs
      never executed, and `cleanup.json` honestly reports the run-owned rows unresolved (they were
      deleted manually afterwards: rule `240b86a4-f446-44dc-9ec1-5db8daa5fba8`, its occurrence row, and
      both `uat-20260919T143618Z-5c10a673-recur` task rows).
    - The `pass` label is a harness defect, since fixed in
    `uat/lib/run-writer.ts`: the outcome was
      computed from recorded assertions alone and ignored `TestResult.status`, so a crashed walk with
      two passing assertions wrote `Outcome: pass`. The writer now forces `fail` whenever
      `result.status !== 'passed'`.

    The folder is retained append-only (the harness never edits or deletes a
    previous run). What the

    retained evidence DOES truthfully show: steps 1–4 walked for real — sign-in,
    task creation,

    weekday/09:00 rule `240b86a4-…` activated with a correct all-weekday
    preview, and a real scheduler

    tick materialising occurrence `20d198cc-9bd5-403d-ab0c-f675ff4e4204` — and
    Postgres confirmed the

    key lane finding: completing that occurrence's backing task row left
    `occurrences.status` =

    `materialised`. The superseding run (later `runs/<runId>/`) carries the
    completed walk and the

    honest outcome.
