  _NOTE.md: >
    # NOTE — read this run in the context of a stale API process


    This run's walk completed end-to-end and every artifact is real. But two of
    its `no` verdicts

    (`br.recur.generation.once`, `fr.recur.end-rule`) observed a **stale API
    process**, not the current

    code: the ts-node-dev API on :3001 had not reloaded the recur module, and
    its `endRecurrence`

    ended a different rule (`e4a728d3-…`, an already-ended foreign fixture)
    instead of this run's rule

    `172a408e-2adb-4399-b836-5bf356e9a790`. The screen still showed the ended
    state (it trusts the

    response), and the re-read of the run's own rule - never actually ended -
    returned a non-empty

    preview, which is what drove the two `no`s.


    The process respawned at 14:54Z; against current code `endRecurrence`
    returns the targeted ruleId

    and an ended rule's `previewDates` is `[]` (verified live 2026-09-19). The
    spec now captures the

    mutation response's ruleId so a wrong-rule end is recorded rather than
    trusted.


    What this run still truthfully proves, independent of the stale process:

    - `br.recur.occurrence.owned-by-rule-owner` observed `no` stands - the
    product exposes no
      occurrence-completion door (read-only occurrence rows; no `completeOccurrence` mutation;
      completing the backing task does not touch `occurrences.status`).

    Superseded by the next run's folder for the end-rule/generation verdicts.
