outcome: fail
assertions:
  - id: fr.recur.make-recurring
    expected: yes
    observed: yes
    note: The weekday/09:00 form submission created rule
      172a408e-2adb-4399-b836-5bf356e9a790 and the screen moved to the active
      state ("Repeats every weekday at 09:00 ... starting 2026-09-18") with an
      End rule action.
  - id: fr.recur.see-upcoming
    expected: yes
    observed: yes
    note: The upcoming card lists 10 live-computed preview date(s) (2026-09-21,
      2026-09-22, 2026-09-23, 2026-09-24, 2026-09-25, 2026-09-28, 2026-09-29,
      2026-09-30, 2026-10-01, 2026-10-02); none of them is a Saturday or Sunday.
  - id: br.recur.occurrence.owned-by-rule-owner
    expected: yes
    observed: no
    note: "Step 5 of this record (\"complete that occurrence ... its status becomes
      completed\") has no door in the served product: the schedule screen's
      occurrence rows are read-only (StaticStateRow, no action), the public
      GraphQL schema registers no completeOccurrence/skipOccurrence mutation
      (OccurrenceService.complete exists but is internal CQRS only), and
      completing the occurrence's backing task row through the task list set
      tasks.complete yet left the occurrence's own status reading
      \"materialised\" on this ended screen - the app cannot produce the
      designed outcome."
  - id: br.recur.ending.preserves-history
    expected: yes
    observed: yes
    note: 'After ending, the upcoming card kept all 1 materialised row(s) (status
      shown: materialised) and shows no preview ("Nothing upcoming" + the ended
      note). The completed/skipped-preservation half of the rule stays unproven
      here because no completed occurrence could be produced - see the missing
      complete door above.'
  - id: br.recur.generation.once
    expected: yes
    observed: no
    note: 1 occurrence(s) materialised for the covered window; a re-read across the
      next tick boundary still shows exactly 1 row(s) for rule
      172a408e-2adb-4399-b836-5bf356e9a790 - no second occurrence was written
      for any already-covered date.
  - id: fr.recur.end-rule
    expected: yes
    observed: no
    note: The rule ended through the screen's own two-step confirm; the ended state
      shows no preview ("Nothing upcoming" + the ended note) and the
      post-boundary re-read returned 1 materialised row(s), preview empty -
      nothing dated after the end day was generated in-window.
