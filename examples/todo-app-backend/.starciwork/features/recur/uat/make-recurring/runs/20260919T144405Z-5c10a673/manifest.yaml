          expected: the rule is saved as active
          checks:
            - id: completion
              expected: yes
        - order: 3
          actor: owner
          action: See the upcoming occurrences preview.
          expected: none of the previewed dates is a weekend date
          checks: []
        - order: 4
          actor: owner
          action: Wait for (or trigger) a generation run.
          expected: the day's occurrence appears with status materialised
          checks:
            - id: loading
              expected: yes
        - order: 5
          actor: owner
          action: Complete that occurrence.
          expected: its status becomes completed
          checks:
            - id: completion
              expected: yes
        - order: 6
          actor: owner
          action: End the rule.
          expected: the completed occurrence status is unchanged, and no new occurrence
            appears after the end day
          checks: []
