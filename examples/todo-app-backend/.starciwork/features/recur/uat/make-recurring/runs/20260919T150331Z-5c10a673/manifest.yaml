  flows.json:
    schema: starci/uat-flows@1
    flow:
      id: uat.recur.make-recurring
      title: Make a task recurring, see its upcoming occurrences, then end it
      steps:
        - order: 1
          actor: owner
          action: Sign in as the owner.
          expected: the task list loads
          checks: []
        - order: 2
          actor: owner
          action: Turn a task into a rule that fires every weekday at 09:00 in the owner's
            own time zone.
          expected: the rule is saved as active
          checks:
            - id: completion
              expected: yes
        - order: 3
          actor: owner
          action: See the upcoming occurrences preview.
          expected: none of the previewed dates is a weekend date
          checks: []
        - order: 4
          actor: owner
          action: Wait for (or trigger) a generation run.
          expected: the day's occurrence appears with status materialised
          checks:
            - id: loading
              expected: yes
        - order: 5
          actor: owner
          action: Complete that occurrence.
          expected: its status becomes completed
          checks:
            - id: completion
              expected: yes
        - order: 6
          actor: owner
          action: End the rule.
          expected: the completed occurrence status is unchanged, and no new occurrence
            appears after the end day
          checks: []
      proves:
        - fr.recur.make-recurring
        - fr.recur.see-upcoming
        - fr.recur.end-rule
        - br.recur.generation.once
        - br.recur.ending.preserves-history
