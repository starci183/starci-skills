schema: work/data@1
id: data.recur.occurrence
title: Occurrence
state: done
extends: data.task.task
adds:
  - {name: ruleId, type: text, required: true, note: The recurrence rule that produced this occurrence.}
  - {name: windowKey, type: text, required: true, note: "ruleId plus the occurrence's local calendar date, e.g. r1:2026-09-18. The identity decision.recur.occurrence.identity names; unique across every occurrence."}
  - {name: localDate, type: text, required: true, note: "The calendar date, in the rule's time zone, this occurrence is for."}
  - {name: dueAtUtc, type: timestamp, required: true, note: "The instant resolved from the rule's local time and time zone at generation time (decision.recur.timezone.anchor); not recomputed once written."}
  - {name: status, type: text, required: true, note: "materialised | completed | skipped | orphaned; see sds.recur.occurrence-lifecycle."}
fields:
  - {name: id, type: text, required: true, note: "Opaque, assigned at materialisation, never reused."}
  - {name: ruleId, type: text, required: true, note: The recurrence rule that produced this occurrence.}
  - {name: owner, type: text, required: true, note: "Copied from the rule's owner at materialisation and never rewritten (br.recur.occurrence.owned-by-rule-owner)."}
  - {name: windowKey, type: text, required: true, note: "ruleId plus the occurrence's local calendar date, e.g. r1:2026-09-18. The identity decision.recur.occurrence.identity names; unique across every occurrence."}
  - {name: localDate, type: text, required: true, note: "The calendar date, in the rule's time zone, this occurrence is for."}
  - {name: dueAtUtc, type: timestamp, required: true, note: "The instant resolved from the rule's local time and time zone at generation time (decision.recur.timezone.anchor); not recomputed once written."}
  - {name: title, type: text, required: true}
  - {name: complete, type: boolean, required: true, default: false}
  - {name: completedAt, type: timestamp, required: false}
  - {name: status, type: text, required: true, note: "materialised | completed | skipped | orphaned; see sds.recur.occurrence-lifecycle."}
invariants:
  - windowKey is unique across every occurrence of every rule; this is what makes generation idempotent
    (br.recur.generation.once).
  - owner is never null and never changes for a given id.
  - completedAt is set if and only if complete is true.
  - status becomes orphaned only once, only after the owning rule has ended, and only if the occurrence
    was not already completed or skipped (br.recur.ending.preserves-history).
refs: [br.recur.generation.once, br.recur.occurrence.owned-by-rule-owner, br.recur.ending.preserves-history, sds.task.completion-state]
change: {rev: 2, kind: clarifying, at: 2026-09-19T12:00:00.000Z, reason: "Dropped the conflictsWith edge on sds.task.completion-state: it recorded a difference, not a contradiction - an occurrence's five-state lifecycle and a task's two-state machine govern different entities, and this record's own text conceded extending data.task.task's fields does not extend that state machine, so the two records never claimed incompatible things about the same subject. sds.task.completion-state moves to refs as the related-model link. Rev 1's entity/shape correction stands unchanged."}
