schema: work/data@1
id: data.recur.rule
title: Recurrence rule
state: done
fields:
  - {name: id, type: text, required: true, note: "Opaque, assigned at creation, never reused."}
  - {name: owner, type: text, required: true, note: Bound at creation and never rewritten.}
  - {name: title, type: text, required: true, note: Copied onto every occurrence the rule materialises.}
  - {name: frequency, type: text, required: true, note: "One of every-weekday, every-n-days, monthly-day."}
  - {name: n, type: integer, required: false, note: "Set only when frequency is every-n-days; the interval in days."}
  - {name: dayOfMonth, type: integer, required: false, note: "Set only when frequency is monthly-day; 1-31, may not exist in every month."}
  - {name: timeZone, type: text, required: true, note: "IANA zone name. The owner's declared clock, per decision.recur.timezone.anchor."}
  - {name: time, type: text, required: true, note: "Local HH:MM the rule fires at, in timeZone."}
  - {name: startDate, type: text, required: true, note: "Local calendar date (YYYY-MM-DD) the rule begins; never a date before an occurrence exists."}
  - {name: endedAt, type: text, required: false, note: "Local calendar date the owner ended the rule; null while active."}
invariants:
  - owner is never null and never changes for a given id.
  - endedAt, once set, is never cleared; ending a rule is not reversible into the same rule.
  - dayOfMonth is required and between 1 and 31 when frequency is monthly-day, and absent otherwise; n is
    required and a positive integer when frequency is every-n-days, and absent otherwise.
refs: [br.recur.impossible-date.skips, br.recur.timezone.owner-local-time, br.recur.ending.preserves-history]