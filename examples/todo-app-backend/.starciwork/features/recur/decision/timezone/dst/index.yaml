schema: work/policy-decision
id: decision.recur.timezone.dst
title: What a rule does at a DST gap and at a DST fold
state: done
outcome: shift-forward-by-gap-and-earliest-of-fold
question: Given decision.recur.timezone.anchor (the owner's clock, resolved fresh each time), what happens
  when that clock lies about the local time twice a year - a spring-forward gap where the nominal local
  time never occurs, and a fall-back fold where it occurs twice?
options:
  - id: refuse-the-day
    summary: Skip generating any occurrence on a transition day.
    consequence: Simplest to implement, but a daily rule silently loses a day twice a year with no owner
      action and no record of why.
  - id: clamp-to-transition-instant
    summary: On a gap, use the transition instant itself (03:00, not 02:30+gap); on a fold, still pick the
      earlier instant.
    consequence: Defensible, but ties the answer to the transition's exact minute rather than to the
      rule's own nominal time offset by a fixed, explainable amount.
  - id: shift-forward-by-gap-and-earliest-of-fold
    summary: On a gap, shift the nominal time forward by exactly the size of the gap (02:30 becomes 03:30
      across a one-hour jump). On a fold, always take the earlier of the two real instants.
    consequence: An owner who reads "shifted forward by the gap" can predict the exact instant without
      knowing the transition's clock time, and the fold rule (earliest, always) means a rule can never fire
      twice for one calendar day because of it - which keeps br.recur.generation.once true without a special
      case for DST.
recommendation: shift-forward-by-gap-and-earliest-of-fold
recommendationReason: "Both halves of this decision exist to keep br.recur.generation.once and
  br.recur.impossible-date.skips honest without carving out a DST exception inside them: the fold always
  resolving to one instant is what stops a fold from ever producing a second occurrence for the same
  window, and the gap resolving to a real, defined instant rather than being skipped is what keeps a
  transition day from silently losing the rule's occurrence."
