schema: work/policy-decision@1
id: decision.recur.generation.backfill
title: A generator that missed a window backfills everything, one, or nothing
state: done
outcome: decided
chosen: backfill-everything
question: The scheduler tick that runs the generator was down for three days - a deploy, an outage, a
  paused queue. When it runs again, does it materialise every occurrence that fell due while it was down,
  only the most recent one, or none of them?
options:
  - id: skip-missed
    summary: Generate only occurrences due from now on; the missed window is never materialised.
    consequence: Simplest, and silently drops a commitment the owner made. A daily task that should have
      reminded them three times has a three-day hole in its history with no occurrence to mark complete or
      skipped.
  - id: latest-only
    summary: Materialise a single occurrence for the most recent missed date, folding the gap into it.
    consequence: Loses the per-day identity a daily rule promises - three missed days become one row, which
      also breaks decision.recur.occurrence.identity's premise that a windowKey names one real calendar
      date.
  - id: backfill-everything
    summary: Materialise one occurrence per missed date, in order, the next time the generator runs.
    consequence: The owner sees exactly what should have existed, each dated correctly, each independently
      completable or skippable. The generator must walk every date since its last run rather than only
      "today", which is more work per call but no more code.
recommendation: backfill-everything
recommendationReason: "A task that \"comes back\" is a promise about specific dates, not a vague
  resumption. Backfilling everything is also what makes br.recur.generation.once meaningful as a safety
  property rather than an accident: the generator is expected to be re-run over ranges it may have partly
  or fully already covered, and this decision is what makes \"partly\" the normal case instead of an edge
  case."
