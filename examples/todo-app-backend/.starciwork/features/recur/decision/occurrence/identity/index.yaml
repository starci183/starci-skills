schema: work/policy-decision
id: decision.recur.occurrence.identity
title: What makes two generator runs agree they made the same occurrence
state: done
outcome: rule-id-plus-local-date
question: The generator may be called twice for an overlapping window - a retry, an overlapping cron tick,
  a backfill that recovers a range it partly already covered. What key must two calls agree on before the
  second one refuses to write a second row?
options:
  - id: dueAtUtc
    summary: Key on the rule id plus the computed dueAtUtc instant.
    consequence: Breaks under decision.recur.timezone.dst on its own terms - the whole point of "shift
      forward by the gap" is that the instant is a computed, decision-dependent value; keying identity on
      its output makes a future change to that computation silently change which occurrences are
      considered "the same one", which is the wrong thing to be sensitive to.
  - id: generation-run-id
    summary: Key on which generator invocation produced the row.
    consequence: Guarantees the opposite of idempotency - two calls are two different run ids by
      definition, so this key produces a duplicate on every retry, which is exactly br.recur.generation.once
      refusing to happen.
  - id: rule-id-plus-local-date
    summary: Key on the rule id plus the occurrence's local calendar date (windowKey, e.g. r1:2026-09-18).
    consequence: Stable under any change to how the instant is computed, because the local date is what the
      rule actually names ("the 31st", "Monday") independent of time zone arithmetic; two calls for the same
      rule and the same calendar date are unambiguously the same occurrence.
recommendation: rule-id-plus-local-date
recommendationReason: A rule's identity promise is about a calendar date, not an instant; the instant is a
  derived fact about that date. Keying on the derived fact would make the identity depend on exactly the
  computation decision.recur.timezone.dst reserves the right to refine.
