schema: work/business-rule
id: br.recur.impossible-date.skips
title: A month without the rule's day produces no occurrence
state: done
statements:
  - A monthly-day rule whose day does not exist in a given month (the 31st in a month with 30 or fewer
    days, February most of all) produces no occurrence for that month.
  - No other date is substituted; the month is not clamped to its last day and the rule is not refused
    at creation for naming a day that will not exist every month.
authorityRefs:
  - "decision.recur.impossible-date: skip is the chosen behaviour, over clamp and over refusing the rule at creation."
acceptanceCriteria: [skips-nonexistent-day]
module: src/modules/bussiness/recur
