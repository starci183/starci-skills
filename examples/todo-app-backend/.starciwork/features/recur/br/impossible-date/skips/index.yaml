schema: work/business-rule@1
id: br.recur.impossible-date.skips
title: A month without the rule's day produces no occurrence
state: done
statements:
  - A monthly-day rule whose day does not exist in a given month (the 31st in a month with 30 or fewer
    days, February most of all) produces no occurrence for that month.
  - No other date is substituted; the month is not clamped to its last day and the rule is not refused
    at creation for naming a day that will not exist every month.
authorityRefs:
  - "decision.recur.impossible-date: skip is the chosen behaviour, over clamp and over refusing the rule at creation."
acceptance:
  - id: ac.recur.impossible-date.skips.skips-nonexistent-day
    given: A monthly-day rule r3 (UTC, 09:00, dayOfMonth 31, startDate 2026-01-01)
    when: The generator runs with now = 2026-03-31T10:00:00.000Z, covering January through March 2026
    then:
      - Occurrences exist for windowKey r3:2026-01-31 and r3:2026-03-31.
      - No occurrence exists whose windowKey starts with r3:2026-02, because 2026 is not a leap year and
        February 2026 has 28 days.
      - No occurrence's localDate is 2026-02-28 or any other February date; the month is skipped
        entirely, not clamped to its last day.
module: src/modules/bussiness/recur
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "impl.recur.todo-app-backend.engine now exists: module corrected from the stale pre-migration path src/recur/rule to the real module root src/modules/bussiness/recur (calendar.util.ts's datesForRule walk), and the gap.recur.unbuilt-module blockedBy edge is removed since that gap is now closed by this feature's implementation. ac.recur.impossible-date.skips.skips-nonexistent-day passes at src/modules/bussiness/recur/calendar.util.spec.ts. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.recur.impossible-date.skips#<former-ac-id>. Encoding change only, no semantic change."}
