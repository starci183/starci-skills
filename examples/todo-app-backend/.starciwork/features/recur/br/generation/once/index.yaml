schema: work/business-rule@1
id: br.recur.generation.once
title: A rule never produces two occurrences for one window
state: done
statements:
  - Running the generator twice for a window that overlaps a previous run creates no second occurrence
    for any date that run already covered.
  - "What makes two runs agree on \"the same occurrence\" is decision.recur.occurrence.identity: the rule
    id plus the occurrence's local calendar date."
authorityRefs:
  - "product-intent: A generator that can be safely re-run is the only kind that can also be safely retried after a crash."
acceptance:
  - id: ac.recur.generation.once.is-idempotent-on-rerun
    given: A daily rule r1 (Europe/Berlin, 09:00) whose generator has already materialised its
      2026-09-14 occurrence
    when: The generator runs again with now = 2026-09-14T12:00:00.000Z, the same instant range it
      already covered
    then:
      - No second occurrence exists for windowKey r1:2026-09-14.
      - The occurrence's id, dueAtUtc and status are unchanged from the first run.
module: src/modules/bussiness/recur
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "impl.recur.todo-app-backend.engine now exists: module corrected from the stale pre-migration path src/recur/generator to the real module root src/modules/bussiness/recur (GeneratorService/OccurrenceService), and the gap.recur.unbuilt-module blockedBy edge is removed since that gap is now closed by this feature's implementation. ac.recur.generation.once.is-idempotent-on-rerun passes at src/modules/bussiness/recur/generator.service.spec.ts and occurrence.service.spec.ts. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.recur.generation.once#<former-ac-id>. Encoding change only, no semantic change."}
