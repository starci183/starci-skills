schema: work/acceptance-criterion
id: ac.recur.generation.once.is-idempotent-on-rerun
rule: br.recur.generation.once
given: A daily rule r1 (Europe/Berlin, 09:00) whose generator has already materialised its 2026-09-14 occurrence
when: The generator runs again with now = 2026-09-14T12:00:00.000Z, the same instant range it already covered
then:
  - No second occurrence exists for windowKey r1:2026-09-14.
  - The occurrence's id, dueAtUtc and status are unchanged from the first run.
