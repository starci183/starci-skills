schema: work/business-rule
id: br.recur.timezone.owner-local-time
title: An occurrence's due instant follows the owner's clock, not a fixed offset
state: done
statements:
  - A rule stores an IANA time zone and a local time of day. An occurrence's due instant is resolved from
    that local time and zone at generation time, never from a UTC offset fixed once at rule creation.
  - Two owners with the same rule (same local time of day) in different zones are not due at the same
    instant, and the same owner's rule is not even due at the same instant on every day of the year if
    their zone observes daylight saving time.
  - "A local time that a DST transition made ambiguous (occurs twice, on the fold) always resolves to its
    earlier instant. A local time a DST transition made impossible (does not occur, in the gap) resolves to
    the nominal time shifted forward by the size of the gap."
authorityRefs:
  - "decision.recur.timezone.anchor: the owner's wall clock, not a stored offset."
  - "decision.recur.timezone.dst: earliest-of-fold, shift-forward-by-gap."
acceptanceCriteria: [dst-spring-forward-shifts-by-gap, dst-fall-back-picks-earliest, distinct-zones-differ]
module: src/modules/bussiness/recur
