schema: work/acceptance-criterion
id: ac.recur.timezone.owner-local-time.distinct-zones-differ
rule: br.recur.timezone.owner-local-time
given: Two identical daily 09:00 rules, one owned by a person in Asia/Ho_Chi_Minh (no DST) and one by a
  person in Europe/Berlin (observes DST)
when: The generator materialises both rules' occurrence for 2026-01-15 and again for 2026-07-15
then:
  - "The Ho_Chi_Minh occurrence's dueAtUtc is 2026-01-15T02:00:00.000Z and 2026-07-15T02:00:00.000Z: the
    same UTC offset (+07:00) on both dates."
  - "The Berlin occurrence's dueAtUtc is 2026-01-15T08:00:00.000Z (CET, +01:00) and 2026-07-15T07:00:00.000Z
    (CEST, +02:00): a different UTC offset between the two dates, for the same rule."
  - On both dates, the Ho_Chi_Minh and Berlin occurrences' dueAtUtc values differ from each other, even
    though both rules say "09:00" in their own owner's clock.
