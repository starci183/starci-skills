schema: work/acceptance-criterion
id: ac.recur.timezone.owner-local-time.dst-fall-back-picks-earliest
rule: br.recur.timezone.owner-local-time
given: A daily rule (America/New_York, local time 01:30) whose next date is 2024-11-03, the night
  America/New_York clocks fall 02:00 -> 01:00 so that 01:30 happens twice
when: The generator materialises the 2024-11-03 occurrence
then:
  - The occurrence's dueAtUtc is exactly 2024-11-03T05:30:00.000Z (01:30 EDT, the earlier of the two real
    instants that both read 01:30 local), not 2024-11-03T06:30:00.000Z (01:30 EST, the later one).
  - Exactly one occurrence exists for windowKey <rule>:2024-11-03; the fold never produces two.
