        directionAsset: assets/preferences-refused.png
      - screen: unsubscribe-link
        state: unsubscribed
        viewport: desktop-1280
        components:
          - "Text (status, live: polite)"
          - Button (unsubscribe, isPending)
          - TextAction (policy links)
        derivation: "Signed-out email-link projection: omit authenticated shell and Alex; keep product name,
          token-bound unsubscribe control, explicit outcome and policy links. Never require sign-in.
          Link token validation and failure use the backend contract."
        directionAsset: assets/preferences-refused.png
