          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Notification preferences)"
          - Text (row label)
          - Button (toggle, isSkeleton)
          - Button (save, isDisabled)
        derivation: Derives from refused with the same workspace shell. the toggle renders in a
