schema: work/ui-screen
id: ui.notify.preferences
title: The notification preferences screen
state: done
brand: {rev: 2}
refs: [fr.notify.unsubscribe]
ui:
  intent: >-
    One setting per row, no card wrapper; the unsubscribe control must remain reachable without an active session per fr.notify.unsubscribe. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses (SurfaceCard, the toggle Button, the save
    Button and the refusal line) and, where the state is an error/refusal, the accessibility-critical
    assertive-live Text carrying the refusal and the brand's contrast don't (Never place text on the
    primary colour below a 4.5:1 contrast ratio.). @starci/grammar/common ships no switch/toggle renderer
    and no Message/Alert renderer; the digest control is an ordinary Button and the refusal is a plain
    Text line.
  surfaces:
    - {name: preferences, route: /notify/preferences, purpose: "control digest and unsubscribe settings", actors: [owner]}
  states:
    - {name: loading, trigger: "first paint, preferences not yet fetched", behavior: "the toggle renders in a disabled/skeleton state, no message shown"}
    - {name: subscribed, trigger: "the owner currently receives the digest", behavior: "the toggle is on, save is available"}
    - {name: unsubscribed, trigger: "the owner has unsubscribed", behavior: "the toggle is off; a non-danger message confirms the change on the next successful save"}
    - {name: saving, trigger: "save clicked, response pending", behavior: "the save GrammarButton is disabled and shows a busy label"}
    - {name: refused, trigger: "save fails, for example a stale link", behavior: "a GrammarMessage(tone: danger) appears above the toggle; the toggle keeps its pre-save value"}
  coverage:
    scale: bounded
    representativeScreens: [preferences]
    map:
      - {screen: preferences, state: loading, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Notification preferences)", "Text (row label)", "Button (toggle, isSkeleton)", "Button (save, isDisabled)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Text (row label), Button (toggle), Button (save) anatomy, minus the refusal Text; the toggle Button renders isSkeleton, no message shown."}
      - {screen: preferences, state: subscribed, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Notification preferences)", "Text (row label)", "Button (toggle, variant: primary)", "Button (save, variant: primary)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Text (row label), Button (toggle), Button (save) anatomy, minus the refusal Text; the toggle Button reads variant: primary for on, save is available."}
      - {screen: preferences, state: unsubscribed, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Notification preferences)", "Text (row label)", "Button (toggle, variant: secondary)", "Button (save, variant: primary)", "Text (live: polite, non-danger confirmation)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Text (row label), Button (toggle), Button (save) anatomy; the toggle Button reads variant: secondary for off; a `live: polite` Text confirms the change on the next successful save, in place of the refusal Text."}
      - {screen: preferences, state: saving, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Notification preferences)", "Text (row label)", "Button (toggle)", "Button (save, isDisabled, isPending)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Text (row label), Button (toggle), Button (save) anatomy, minus the refusal Text; the save Button is isDisabled and isPending, showing its busy label."}
      - {screen: preferences, state: refused, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Notification preferences)", "Text (row label)", "Button (toggle)", "Button (save, variant: primary)", "Text (live: assertive, the refusal sentence)"], derivation: "Representative direction; generated by interface.draw once gap.notify.direction-not-drawn closes.", directionAsset: assets/preferences-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone. The confirmation on unsubscribed uses `live: \"polite\"` since it is not an
      error."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
assets:
  - path: assets/preferences-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
  - path: assets/preferences-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/preferences-refused.prompt.txt
      inputRefs: [ui.notify.preferences, fr.notify.unsubscribe, brand]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: 2026-09-18T07:42:00.301Z
