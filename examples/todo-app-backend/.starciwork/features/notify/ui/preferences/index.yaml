schema: work/ui-screen
id: ui.notify.preferences
title: The notification preferences screen
state: todo
brand: {rev: 2}
refs: [fr.notify.unsubscribe]
ui:
  intent: >-
    One setting per row, no card wrapper; the unsubscribe control must remain reachable without an active session per fr.notify.unsubscribe. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: preferences, route: /notify/preferences, purpose: "control digest and unsubscribe settings", actors: [owner]}
  states:
    - {name: loading, trigger: "first paint, preferences not yet fetched", behavior: "the toggle renders in a disabled/skeleton state, no message shown"}
    - {name: subscribed, trigger: "the owner currently receives the digest", behavior: "the toggle is on, save is available"}
    - {name: unsubscribed, trigger: "the owner has unsubscribed", behavior: "the toggle is off; a non-danger message confirms the change on the next successful save"}
    - {name: saving, trigger: "save clicked, response pending", behavior: "the save GrammarButton is disabled and shows a busy label"}
    - {name: refused, trigger: "save fails, for example a stale link", behavior: "a GrammarMessage(tone: danger) appears above the toggle; the toggle keeps its pre-save value"}
  coverage:
    scale: bounded
    representativeScreens: [preferences]
    map:
      - {screen: preferences, state: loading, viewport: desktop-1280, components: ["GrammarButton (toggle proxy: on/off submit)", "GrammarButton (save)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarButton (toggle proxy: on/off submit), GrammarButton (save), GrammarMessage (tone: danger, refused only) anatomy; the toggle renders in a disabled/skeleton state, no message shown."}
      - {screen: preferences, state: subscribed, viewport: desktop-1280, components: ["GrammarButton (toggle proxy: on/off submit)", "GrammarButton (save)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarButton (toggle proxy: on/off submit), GrammarButton (save), GrammarMessage (tone: danger, refused only) anatomy; the toggle is on, save is available."}
      - {screen: preferences, state: unsubscribed, viewport: desktop-1280, components: ["GrammarButton (toggle proxy: on/off submit)", "GrammarButton (save)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarButton (toggle proxy: on/off submit), GrammarButton (save), GrammarMessage (tone: danger, refused only) anatomy; the toggle is off; a non-danger message confirms the change on the next successful save."}
      - {screen: preferences, state: saving, viewport: desktop-1280, components: ["GrammarButton (toggle proxy: on/off submit)", "GrammarButton (save)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarButton (toggle proxy: on/off submit), GrammarButton (save), GrammarMessage (tone: danger, refused only) anatomy; the save GrammarButton is disabled and shows a busy label."}
      - {screen: preferences, state: refused, viewport: desktop-1280, components: ["GrammarButton (toggle proxy: on/off submit)", "GrammarButton (save)", "GrammarMessage (tone: danger, refused only)"], derivation: "Representative direction; generated by interface.draw once gap.notify.direction-not-drawn closes.", directionAsset: assets/preferences-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.notify.direction-not-drawn.
assets:
  - path: assets/preferences-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
  - path: assets/preferences-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/preferences-refused.prompt.txt
      inputRefs: [ui.notify.preferences, fr.notify.unsubscribe, brand]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: "2026-09-18T06:05:50.5142422Z"
blockedBy:
  - {record: gap.notify.direction-not-drawn, because: "interface.draw has not run for this screen; no built-in image_gen.imagegen invocation has produced the refused representative direction or its sibling prompt bytes yet, only the prompt this record's assets entry names."}
