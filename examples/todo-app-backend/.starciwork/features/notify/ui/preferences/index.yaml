schema: work/ui-screen
id: ui.notify.preferences
title: The notification preferences screen
state: done
brand:
  rev: 3
refs:
  - fr.notify.unsubscribe
ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The notification preferences screen. The representative state is
    refused.
  surfaces:
    - name: preferences
      route: /notify/preferences
      purpose: control digest and unsubscribe settings
      actors:
        - owner
  states:
    - name: loading
      trigger: first paint, preferences not yet fetched
      behavior: the toggle renders in a disabled/skeleton state, no message shown
    - name: subscribed
      trigger: the owner currently receives the digest
      behavior: the toggle is on, save is available
    - name: unsubscribed
      trigger: the owner has unsubscribed
      behavior: the toggle is off; a non-danger message confirms the change on the next successful save
    - name: saving
      trigger: save clicked, response pending
      behavior: the save Button is disabled and shows a busy label
    - name: refused
      trigger: save fails, for example a stale link
      behavior: "a Text(live: assertive) appears above the toggle; the toggle keeps its pre-save value"
  coverage:
    scale: bounded
    representativeScreens:
      - preferences
    map:
      - screen: preferences
        state: loading
        viewport: desktop-1280
        components:
          - WorkspaceShell (header, primary, primaryLabel, compactHeader, compactNavigation)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Notification preferences)"
          - Text (row label)
          - Button (toggle, isSkeleton)
          - Button (save, isDisabled)
        derivation: Derives from refused with the same workspace shell. the toggle renders in a
          disabled/skeleton state, no message shown
        directionAsset: assets/preferences-refused.png
      - screen: preferences
        state: loading
        viewport: mobile-390
        components:
          - WorkspaceShell (header, primary, primaryLabel, compactHeader, compactNavigation)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Notification preferences)"
          - Text (row label)
          - Button (toggle, isSkeleton)
          - Button (save, isDisabled)
        derivation: "Derived compact projection; mobile-390: WorkspaceShell compactHeader and
          compactNavigation own the compact shell; include all four destinations and account access.
          Form fields stack and row actions wrap without hiding controls or horizontal page
          scrolling. the toggle renders in a disabled/skeleton state, no message shown"
        directionAsset: assets/preferences-refused.png
      - screen: preferences
        state: subscribed
