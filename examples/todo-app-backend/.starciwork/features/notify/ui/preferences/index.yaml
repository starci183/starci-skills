schema: work/ui-screen
id: ui.notify.preferences
title: The notification preferences screen
state: done
brand: {rev: 2}
refs: [fr.notify.unsubscribe]
ui:
  intent: >-
    A small settings page with one email-notification decision and one save action. Because installed
    Common has no switch, the preference is a fully labelled state button. The representative refused
    state preserves the previous value and keeps correction and retry close to the setting.
  surfaces:
    - name: preferences
      route: /notify/preferences
      purpose: control whether Todo sends updates by email
      actors: [owner]
  states:
    - {name: loading, trigger: "preferences are being fetched", behavior: "the setting and save action use documented skeleton or unavailable states"}
    - {name: subscribed, trigger: "email updates are enabled", behavior: "the labelled state control reads On and save is available"}
    - {name: unsubscribed, trigger: "email updates are disabled", behavior: "the labelled state control reads Off and save is available"}
    - {name: saving, trigger: "save is awaiting a response", behavior: "Save preference owns pending and repeated submission is unavailable"}
    - {name: refused, trigger: "the preference update is refused", behavior: "assertive Text states that the previous choice remains and retry stays available"}
  coverage:
    scale: bounded
    representativeScreens: [preferences]
    map:
      - {screen: preferences, state: loading, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Use documented skeleton or unavailable states without adding another surface."}
      - {screen: preferences, state: subscribed, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Show the labelled state control as On and omit status text."}
      - {screen: preferences, state: unsubscribed, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Show the labelled state control as Off and omit status text."}
      - {screen: preferences, state: saving, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Keep the selected value and apply pending to Save preference."}
      - {screen: preferences, state: refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Representative generated direction; mobile keeps both labelled controls full width.", directionAsset: assets/preferences-refused.png}
  accessibility:
    - The preference control includes its setting name and current On or Off value in visible text.
    - Refusal uses assertive live Text and states that the persisted choice did not change.
    - Keyboard order follows heading, preference control, status and save action.
  responsive:
    - desktop-1280 uses a reading-width card; mobile-390 makes the card and both controls fluid without reordering.
    - Long refusal copy wraps without clipping or hiding retry.
  artworkSlots: []
  observations:
    - "Installed Common proves PageContainer, SurfaceCard, Text and Button but no switch or general Message primitive."
    - "The composition uses one setting, one correction owner and one primary save action."
    - "The image is proposed direction only and does not prove delivery, persistence or exact semantics."
  gaps:
    - "Common exposes no switch primitive; a labelled Button carries the binary setting until a switch is specified."
  assets:
    - path: assets/preferences-refused.prompt.txt
      role: prompt
    - path: assets/preferences-refused.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/preferences-refused.prompt.txt
        inputRefs: [ui.notify.preferences, fr.notify.unsubscribe, br.notify.unsubscribe.honored, sds.notify.delivery-lifecycle, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/preferences-refused.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/preferences-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/preferences-refused.prompt.txt
      inputRefs: [ui.notify.preferences, fr.notify.unsubscribe, br.notify.unsubscribe.honored, sds.notify.delivery-lifecycle, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: 2026-09-18T10:07:36.391Z
