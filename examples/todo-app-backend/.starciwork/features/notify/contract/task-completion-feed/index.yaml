schema: work/contract@1
id: contract.notify.task-completion-feed
title: What notify needs from task to notify on completion
state: todo
between:
  provider: task
  consumer: notify
owner: notify
surface:
  - name: onTaskComplete
    shape: "(event: {taskId, ownerId, completedAt, sourceEventId}) -> void, called once per real
      completion"
    guarantee: sourceEventId is stable and unique per real completion, including a reopen-then-complete
      cycle producing a new one; it is the only thing notify's dedupe key can honestly hash.
    stability: A change to sourceEventId's stability (e.g. reusing it across completions) is breaking
      for notify, silently, because dedupe would start merging distinct events.
guarantees: []
consumerObligations:
  - notify never invents a sourceEventId when the producer omits one; it leaves the record todo instead,
    per br.notify.delivery.once.
refs: [br.notify.delivery.once, fr.notify.on-completion]

requiresProof:
  provider:
    required: true
    note: task proves it calls onTaskComplete exactly once per real completion with a stable
      sourceEventId.
  consumer:
    required: true
    note: notify proves it only ever hashes a sourceEventId the provider actually supplied.

change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "Dropped the conflictsWith on br.task.complete.once rev 2 and the blockedBy on gap.notify.unbuilt-module: both premises are now false. complete-task's use case really publishes event.task.completed with a stable sourceEventId after every write (src/modules/bussiness/task/complete-task.handler.ts), and notify really subscribes to it and only ever hashes the sourceEventId that event carries, never inventing one (src/modules/bussiness/notify/notify-event.subscriber.ts, dedupe.service.ts - proven by notify-event.subscriber.spec.ts and dedupe.service.spec.ts). This consumer-side requiresProof is met. State stays todo: the `surface` above still describes a direct onTaskComplete function call, but the real integration is event-bus publish/subscribe (PlatformEventBus), a different (and, per the seam rules in the common brief, preferred) shape than this contract originally specified; requiresProof.provider - task formally proving it calls this exact surface - is task's side to assert, not this lane's, and is left open rather than claimed here."}
