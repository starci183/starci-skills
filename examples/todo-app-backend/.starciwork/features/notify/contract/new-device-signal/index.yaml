schema: work/contract
id: contract.notify.new-device-signal
title: What notify needs from login to notify on a new device
state: todo
between:
  provider: login
  consumer: notify
owner: notify
surface:
  - name: onNewDeviceSignIn
    shape: "(event: {personId, deviceId, signedInAt, sourceEventId}) -> void, called once per sign-in
      that ends a prior session under single-device semantics"
    guarantee: deviceId identifies the device well enough that the same device signing in twice is
      recognizable as not new; sourceEventId is stable and unique per sign-in.
    stability: A change to what deviceId is derived from is breaking for notify, silently, because a
      device that used to read as known would start reading as new.
guarantees: []
consumerObligations:
  - notify never infers a device identity from anything other than what this surface supplies.
refs: [br.notify.delivery.once, fr.notify.on-new-device]

conflictsWith:
  - {record: br.login.session.single-device, rev: 1, because: "the login session store has no device
    field: sds.login.session-store's stateMachine and data.login.person's fields carry no device
    identity, and session.mjs's accept()/actorOf() take no device argument.
    decision.login.session.devices is now decided (single-device), so the question of how many devices a
    session model allows is settled, but the field itself still does not exist. There is no deviceId this
    surface could honestly be given."}

requiresProof:
  provider:
    required: true
    note: login proves it calls onNewDeviceSignIn exactly once per sign-in that ends a prior session,
      with a deviceId that survives decision.login.session.devices being settled.
  consumer:
    required: true
    note: notify proves it only ever reads deviceId from this surface.

blockedBy:
  - {record: gap.login.device-field, because: "Owned entirely by the notify side of an interface that login has not built. decision.login.session.devices is now decided (single-device), but that settles the question, not the field: sds.login.session-store and data.login.person still carry no device identity, so there is no deviceId this surface could honestly be given yet. This record cannot move to done without a change in features/login, which this lane does not own."}
