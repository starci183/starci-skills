schema: work/gap
id: gap.notify.render-proof
title: The preferences captures fail the canonical render checks - impl.notify.todo-app-frontend.preferences cannot claim done
state: todo
statement: "impl.notify.todo-app-frontend.preferences keeps real captures - the five mapped
  preferences states plus the signed-out unsubscribe-link projection at desktop-1280 and
  mobile-390, produced by ./assets/capture.mjs from the running product. The artifacts are real;
  the proof is not. Run through checks/render.mjs (the canon scripts/example-render-proof.mjs
  composes), palette-off-brand fails on six of the twelve captures: the loading and saving states
  are dominated by #92b0fa (49-58% of saturated pixels, nearest declared token
  --starci-core-border at deltaE 17.6) and the unsubscribe-link-unsubscribed states carry
  #90a4d5 and #acbde7 (nearest --starci-core-muted at deltaE 18.5). No brand token or scale step
  declares these colours - the skeleton shimmer and link states paint pixels the palette does not
  own. The fix lives in the page's own styles (todo-app-frontend source), outside the .starciwork
  record scope, so the done claim is unproven and the record is held at todo, blockedBy this gap.
  Repro: node scripts/example-render-proof.mjs --work examples/todo-app-backend/.starciwork
  --record impl.notify.todo-app-frontend.preferences"
closedBy: impl.notify.todo-app-frontend.preferences
change:
  rev: 1
  kind: initial
  at: 2026-09-19T21:30:00.000Z
  reason: "Opened at the v7-13 gate close: v7-9's honest recapture surfaced the palette failures
    above on real bytes. Neither editing checks/*.mjs nor staging captures can close this - the
    rendered page itself carries colours the brand does not declare."
