schema: work/uat-flow
id: uat.notify.digest-and-unsubscribe
title: Two events settle into one digest, then an unsubscribe silences the next one
state: todo
accounts: accounts.yaml
steps:
  - Sign in as the owner.
  - Trigger two notify-worthy events for the owner inside one digest window.
  - Read the owner's inbox and see exactly one message covering both events.
  - Unsubscribe from email in the preferences screen.
  - Trigger a third notify-worthy event.
  - Confirm no new message arrives for it.
proves: [fr.notify.digest, fr.notify.unsubscribe, br.notify.digest.window, br.notify.unsubscribe.honored]

