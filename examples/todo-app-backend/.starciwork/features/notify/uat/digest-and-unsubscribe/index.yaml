schema: work/uat-flow
id: uat.notify.digest-and-unsubscribe
title: Two events settle into one digest, then an unsubscribe silences the next one
state: todo
entry: /notify/preferences
actor: owner
accounts: accounts.yaml
environment: environment.todo-app.dev
fixtures: [fixture.todo-app.seed]
steps:
    - {order: 1, actor: owner, action: "Sign in as the owner.", expected: "the preferences screen is reachable", checks: []}
    - {order: 2, actor: owner, action: "Trigger two notify-worthy events for the owner inside one digest window.", expected: "both events are recorded for the window", checks: []}
    - {order: 3, actor: owner, action: "Read the owner's inbox.", expected: "exactly one message covers both events", checks: [{id: completion, expected: yes}]}
    - {order: 4, actor: owner, action: "Unsubscribe from email in the preferences screen.", expected: "the preference is saved as unsubscribed", checks: [{id: completion, expected: yes}]}
    - {order: 5, actor: owner, action: "Trigger a third notify-worthy event.", expected: "the event is recorded", checks: []}
    - {order: 6, actor: owner, action: "Confirm no new message arrives for it.", expected: "the inbox is unchanged since step 3", checks: []}
effects:
  - "trigger three notify-worthy product events for the seeded owner"
  - "save one preference change"
cleanup:
  - "restore the preference to its pre-run value; delete any disposable message rows created for this run"
proves: [fr.notify.digest, fr.notify.unsubscribe, br.notify.digest.window, br.notify.unsubscribe.honored]
blockedBy:
  - {record: fr.notify.on-new-device, because: "Steps 2 and 5 ask for two/one \"notify-worthy events\" for the owner. A real task completion (fr.notify.on-completion, now done) is one honest way to produce one, but this flow's steps do not name which mechanism, and fr.notify.on-new-device - the other one a real person could trigger - is still todo (login supplies no deviceId, gap.notify.new-device-event). Left as a blocker for whoever walks this flow to decide whether a task-completion-only walk satisfies steps 2 and 5's intent, or whether both trigger mechanisms need to exist first."}
  - {record: gap.notify.live-proof, because: "uat.verify has not run this flow against the running product yet; no run folder under uat/digest-and-unsubscribe/runs/** exists with screens, video and a passing result.md, only this designed flow shape. The backend half this flow depends on (notify pipeline, GraphQL preferences/unsubscribe surface) is now real and end-to-end live-proven at the API level by scripts/live-proof-notify.sh; what remains is a real browser walk through ui.notify.preferences, which is outside this backend lane's scope."}
change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "Dropped the blockedBy edges on gap.notify.unbuilt-module and fr.notify.on-completion: both are now done (the be-notify lane built the notify pipeline module and its GraphQL surface, live-proven by scripts/live-proof-notify.sh). Reworded the fr.notify.on-new-device and gap.notify.live-proof entries to drop the now-false claim that fr.notify.on-completion is also todo, and to stop citing 'a foreign gap' via conflictsWith (fr.notify.on-completion's conflictsWith was itself dropped as stale). This lane did not walk or otherwise change this UAT record's steps, fixtures or state - ui/uat records are not this lane's to build, only its stale blocker edges needed correcting once their targets changed state."}
