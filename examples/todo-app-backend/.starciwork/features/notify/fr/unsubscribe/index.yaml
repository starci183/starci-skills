schema: work/functional-requirement
id: fr.notify.unsubscribe
title: Stop receiving notifications on a channel
state: done
actors: [person]
trigger: The person unsubscribes from a channel.
mainFlow:
  - The preference is recorded for that person and channel.
  - Every event enqueued afterward for that person and channel is suppressed before dispatch.
exceptionFlows:
  - The person re-subscribes; a later event reaches the digest window again.
postconditions:
  - No message on that channel is sent to that person until they re-subscribe.
composes:
  - {rule: br.notify.unsubscribe.honored, module: src/modules/bussiness/notify}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: bash scripts/live-proof-notify.sh
  uat:
    required: true

change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "GraphQL now exposes updateNotificationPreferences and unsubscribe mutations (src/features/todo/graphql/mutations/notify/**) backing this requirement's `unsubscribe from a channel` trigger, and PreferencesService/NotifyService (src/modules/bussiness/notify) enforce it on every admission. `requiresProof.e2e.command` corrected from the aspirational `npm run test:e2e -- notify/unsubscribe` (no such script exists in this repository) to the real command. Proven by unsubscribe.handler.spec.ts, notify.service.spec.ts's fr.notify.unsubscribe case, and a live run of scripts/live-proof-notify.sh (real unsubscribe mutation, then a real task completion lands suppressed). `requiresProof.uat.required` stays true and unmet: uat.notify.digest-and-unsubscribe (not owned by this lane) has not been walked - see gap.notify.live-proof. gap.notify.unbuilt-module's blocker is resolved."}
