schema: work/functional-requirement
id: fr.notify.unsubscribe
title: Stop receiving notifications on a channel
state: todo
actors: [person]
trigger: The person unsubscribes from a channel.
mainFlow:
  - The preference is recorded for that person and channel.
  - Every event enqueued afterward for that person and channel is suppressed before dispatch.
exceptionFlows:
  - The person re-subscribes; a later event reaches the digest window again.
postconditions:
  - No message on that channel is sent to that person until they re-subscribe.
composes:
  - {rule: br.notify.unsubscribe.honored, module: src/notify/preferences}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- notify/unsubscribe
  uat:
    required: true

blockedBy:
  - {record: gap.notify.unbuilt-module, because: "No implementation exists at src/notify/preferences or app/notify under the NestJS/Next.js layout the example is moving to; ui.notify.preferences (the only surface a person would use to unsubscribe) now has its interface.draw direction and reached done, but nothing on either side has been built against it yet."}
change: {rev: 1, kind: editorial, at: 2026-09-18T10:00:00.000Z, reason: "Replaced the blockedBy edge on ui.notify.preferences (stale: that record reached done once interface.draw ran) with gap.notify.unbuilt-module, which names the real remaining reason - no notify module exists yet."}
