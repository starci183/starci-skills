schema: work/functional-requirement@1
id: fr.notify.on-completion
title: Notify a person when their task completes
state: done
actors: [owner]
trigger: A task the person owns transitions to complete.
mainFlow:
  - The completion is admitted as an event with a stable id for that completion, the owner as
    recipient, and kind task-complete.
  - It joins the owner's open digest window for the email channel and is included in the next flushed
    message.
exceptionFlows:
  - The owner unsubscribed from email; the event is suppressed and no message is sent.
postconditions:
  - Within the owner's digest window after completion, one message names the task, unless suppressed.
composes:
  - {rule: br.notify.delivery.once, module: src/modules/bussiness/notify}
  - {rule: br.notify.digest.window, module: src/modules/bussiness/notify}
refs: [contract.notify.task-completion-feed]
subscribes: [event.task.completed]

change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "Dropped the conflictsWith on br.task.complete.once rev 2: it is stale - complete-task's use case (src/modules/bussiness/task/complete-task.handler.ts) now publishes event.task.completed with a stable sourceEventId after every write, exactly the trigger this requirement needed. NotifyEventSubscriber (src/modules/bussiness/notify/notify-event.subscriber.ts) subscribes to it via PlatformEventBus and admits a task-complete notification through NotifyService, joining the owner's digest window unless they are unsubscribed. Proven by notify-event.subscriber.spec.ts, notify.service.spec.ts's fr.notify.on-completion case, and scripts/live-proof-notify.sh (a real createTask+completeTask call produces a real notify_notifications/notify_delivery_attempts row for the owner). gap.notify.unbuilt-module's blocker is resolved."}
