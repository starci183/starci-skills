schema: work/data
id: data.notify.delivery-attempt
title: Delivery attempt
state: todo
fields:
  - {name: notificationId, type: text, required: true}
  - {name: state, type: text, required: true, note: "queued | sending | delivered | bounced | suppressed. See sds.notify.delivery-lifecycle."}
  - {name: attempt, type: integer, required: true, default: 0, note: "Incremented on every t-dispatch."}
  - {name: failureClass, type: text, required: false, note: "transient | permanent-bounce | retries-exhausted | unsubscribed. Null while queued and never attempted."}
  - {name: startedAt, type: timestamp, required: false}
  - {name: endedAt, type: timestamp, required: false, note: "Set only on a terminal state."}
  - {name: history, type: array, required: true, note: "Every transition this attempt made, in order, for audit and for a reader to see the retry story."}
invariants:
  - state is exactly one of the five sds.notify.delivery-lifecycle states at any time.
  - endedAt is set if and only if state is delivered, bounced or suppressed.
  - failureClass is set if and only if the attempt is or was in a failure-carrying state.
appliesTo: [br.notify.failure.classified, br.notify.unsubscribe.honored]
blockedBy:
  - No entity or table exists yet. The example is moving to a NestJS/TypeORM backend and this shape has
    not been created against that layout.
