schema: work/data
id: data.notify.preference
title: Preference
state: todo
fields:
  - {name: personId, type: text, required: true}
  - {name: channel, type: text, required: true, note: "e.g. email. One row per person per channel."}
  - {name: unsubscribed, type: boolean, required: true, default: false}
  - {name: digestWindowMinutes, type: integer, required: false, note: "Overrides the pipeline default from decision.notify.digest-window; null means use the default."}
invariants:
  - At most one row exists per (personId, channel) pair.
  - unsubscribed true suppresses every future notification on that channel until it is set back to false.
refs: [br.notify.unsubscribe.honored]
blockedBy:
  - {record: gap.notify.unbuilt-module, because: "No entity or table exists yet. The example is moving to a NestJS/TypeORM backend and this shape has not been created against that layout."}
