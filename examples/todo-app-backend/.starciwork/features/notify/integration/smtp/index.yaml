schema: work/integration
id: integration.notify.smtp
title: The SMTP host that carries a notification out of the product
state: todo
provider: smtp
boundary: notify hands a rendered message to this host and afterward owns only the outcome of that
  handoff (accepted, permanently rejected, or a transient failure); it never sees whether the person
  actually reads it.
endpoints:
  - {name: send, method: SMTP, path: "the SMTP submission port of the configured host"}
credential:
  name: SMTP_API_KEY_FILE
  providedBy: owner
  where: .starcistacks/dev/runtime/files/smtp-api-key.key.enc
sandbox: Undecided. The secret already exists in the stack (see KEYS.md, purpose currently reads "task
  reminders", a different feature's placeholder) but no compose component, no port and no dev host for
  an SMTP server exist in application-stacks.yaml at this commit; this lane added no infra.
refs: [br.notify.failure.classified, br.notify.delivery.once]

requiresProof:
  live:
    required: true
    note: A run against a real SMTP host. Evidence must carry proof.boundary live and an empty fakes
      list.

module: src/modules/integrations/notify-smtp
change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "NotifySmtpClient now exists and really speaks SMTP over a TCP socket (EHLO/MAIL FROM/RCPT TO/DATA), classifying a connection failure or a 4xx as transient and a 5xx on RCPT TO as a permanent rejection - proven against FakeNotifySmtpClient in delivery.service.spec.ts. The remaining blocker is narrowed from gap.notify.unbuilt-module (resolved: the module exists) to gap.notify.smtp-host-unreachable (still open: no dev SMTP host is declared or reachable), which is the real, specific reason this integration cannot be marked done."}
blockedBy:
  - {record: gap.notify.smtp-host-unreachable, because: "No dev SMTP host is declared in application-stacks.yaml or reachable from this worktree; scripts/live-proof-notify.sh's dispatch attempt against the configured host fails transiently for exactly that reason. No fake run counts as this integration's proof - a run against a fake would only prove it against the fake, per the common brief's own rule."}
