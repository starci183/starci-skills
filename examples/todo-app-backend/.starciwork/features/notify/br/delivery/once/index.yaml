schema: work/business-rule@1
id: br.notify.delivery.once
title: A delivery may be attempted twice; the person is told once
state: done
statements:
  - "The transport that carries a notification out of the product is at-least-once: a network retry, a
    redelivered queue message or a re-run producer can call the pipeline again for the same event."
  - A second call for the same event admits the same notification rather than creating a second one.
authorityRefs:
  - "owner-intent: A person who is told about the same task completing twice trusts the product less,
    not more."
acceptance:
  - id: ac.notify.delivery.once.dedupe-collapses-retry
    given: A notification already admitted for a kind, a source event id and a recipient
    when: The same triple is admitted again
    then:
      - The same notification object is returned, not a new one.
      - The store's count of notifications does not increase.
module: src/modules/bussiness/notify
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "The NestJS Nest scaffold this record was waiting on now exists: DedupeService (src/modules/bussiness/notify/dedupe.service.ts) hashes kind+sourceEventId+recipientId per decision.notify.dedupe-key and admits by primary key, proven by dedupe.service.spec.ts's ac.notify.delivery.once.dedupe-collapses-retry case and exercised end to end by notify.service.spec.ts and scripts/live-proof-notify.sh. gap.notify.unbuilt-module's blocker is resolved; module updated from the retired src/notify/dedupe prototype path to the real house-shape directory. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.notify.delivery.once#<former-ac-id>. Encoding change only, no semantic change."}
