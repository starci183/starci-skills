schema: work/business-rule@1
id: br.notify.digest.window
title: Several events in a person's quiet window become one message
state: done
statements:
  - Every notification admitted for one person and one channel before their window closes joins the
    same group.
  - The group's content is read when the window closes, never when it opens - a message can carry an
    event that had not happened yet when the first one in the group arrived.
authorityRefs:
  - "owner-intent: A separate email for every task completed in one busy minute is the failure mode
    this rule exists to prevent."
acceptance:
  - id: ac.notify.digest.window.collapses-into-one-message
    given: A person's window is open and one event has already joined it
    when: A second event for the same person and channel arrives before the window closes
    then:
      - Both events are in the same group.
      - Flushing the group at close returns both events as one message, in admission order.
      - Flushing before the window closes returns nothing.
module: src/modules/bussiness/notify
change: {rev: 3, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "DigestService (src/modules/bussiness/notify/digest.service.ts) implements the one-rolling-window-per-channel design decision.notify.digest-window chose: a window opens on the first admitted event, closes windowMs later, and is read only at close. Proven by digest.service.spec.ts's ac.notify.digest.window.collapses-into-one-message case, notify.service.spec.ts's end-to-end admit-then-flush case, and scripts/live-proof-notify.sh against the real dev stack (two real task completions joining one window, flushed by the real NotifyScheduler timer). gap.notify.unbuilt-module's blocker is resolved; module updated from the retired src/notify/digest prototype path. rev 3 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.notify.digest.window#<former-ac-id>. Encoding change only, no semantic change."}
