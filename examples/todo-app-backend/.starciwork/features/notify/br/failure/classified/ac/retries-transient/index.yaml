schema: work/acceptance-criterion
id: ac.notify.failure.classified.retries-transient
rule: br.notify.failure.classified
given: A dispatched delivery that fails with a transient reason
when: It is retried within the retry budget
then:
  - The delivery returns to queued with failureClass transient, not bounced.
  - A later dispatch from that state can still reach delivered.
  - Exhausting the retry budget lands on bounced with failureClass retries-exhausted, a value distinct
    from a real bounce.
