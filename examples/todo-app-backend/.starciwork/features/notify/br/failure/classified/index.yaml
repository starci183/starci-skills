schema: work/business-rule
id: br.notify.failure.classified
title: A mail host outage, a bounce and an unsubscribe are three different outcomes
state: done
statements:
  - A transient failure (the mail host is unreachable) retries up to a bounded number of attempts and
    is not reported as an error while attempts remain.
  - A permanent bounce (the address is rejected by the provider) is terminal and does not retry.
  - A recipient who unsubscribed is suppressed before an attempt is ever made, so an unsubscribe never
    shows up as a delivery failure at all.
  - Retries exhausted on a transient failure is recorded as its own outcome, not silently merged into a
    bounce and not silently dropped.
authorityRefs:
  - "owner-intent: An operator paging on 'delivery error' should not be woken by an unsubscribe, and
    should not be told an outage is the same problem as a bad address."
acceptanceCriteria: [retries-transient, suppresses-bounced-address, suppresses-unsubscribed]
module: src/modules/bussiness/notify
change: {rev: 2, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "DeliveryService (src/modules/bussiness/notify/delivery.service.ts) classifies NotifySmtpPort's two thrown exceptions (NotifySmtpTransientFailureException, NotifySmtpPermanentRejectionException) plus the recipient's own unsubscribed flag into the three outcomes this rule names, with a bounded RETRY_BUDGET. Proven by delivery.service.spec.ts's three ac cases (retries-transient, suppresses-bounced-address, suppresses-unsubscribed) against FakeNotifySmtpClient, and exercised live by scripts/live-proof-notify.sh, which observes a real dispatch attempt (attempt incremented) against the configured but unreachable dev SMTP host. gap.notify.unbuilt-module's blocker is resolved; module updated from the retired src/notify/delivery prototype path."}
