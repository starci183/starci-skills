schema: work/customer-journey
id: journey.notify.told-about-completion
title: A person closes their laptop and later learns their task was handled
state: todo
crossesFeatures: [task, notify]
steps:
  - {actor: owner, does: "Completes a task and closes the browser, expects: nothing further from them is required."}
  - {actor: owner, does: "Some time later, checks email, expects: a message naming the completed task, not a raw log line."}
  - {actor: owner, does: "Had unsubscribed last week, expects: no message at all, and no sense that something went wrong."}
requirements: [fr.task.complete, fr.notify.on-completion, fr.notify.digest, fr.notify.unsubscribe]

change: {rev: 1, kind: clarifying, at: 2026-09-18T12:00:00.000Z, reason: "Dropped the blockedBy on fr.notify.on-completion: it is done. Three of this journey's four requirements are now done (fr.notify.on-completion, fr.notify.digest, fr.notify.unsubscribe); the remaining blocker is fr.task.complete (task's own record, still todo - blockedBy br.task.complete.once rev 2, br.task.single-owner rev 2 and gap.task.collaborator-completion, none of which this lane owns or can close), which is what actually still prevents a real person from walking this journey end to end."}
blockedBy:
  - {record: fr.task.complete, because: "The first step (\"completes a task\") is fr.task.complete, which is itself todo - blockedBy br.task.complete.once rev 2, br.task.single-owner rev 2 and gap.task.collaborator-completion. The notify half of this journey (fr.notify.on-completion, fr.notify.digest, fr.notify.unsubscribe) is done and live-proven (scripts/live-proof-notify.sh), but a journey crossing task and notify cannot be walked while either half is still todo."}
