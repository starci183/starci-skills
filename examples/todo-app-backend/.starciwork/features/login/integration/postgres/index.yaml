schema: work/integration
id: integration.login.postgres
title: PostgreSQL holds the session and person rows
state: todo
provider: postgresql
boundary: The product owns its schema and its migrations. The database is not shared with another product,
  so a breaking migration is this product's decision alone.
endpoints:
  - {name: primary, method: TCP, path: postgres://postgres:5432/todo}
credential:
  name: DATABASE_URL
  providedBy: owner
  where: .starcistacks/dev/runtime/env/app.env.enc
sandbox: The dev environment runs PostgreSQL 16 in Compose on 5432, seeded from .starcistacks/dev/seeds.
refs: [data.login.person, sds.login.session-store]

requiresProof:
  live:
    required: true
    note: A migration applied and a row round-tripped against the real server, not against a fake.

blockedBy:
  - {record: gap.login.live-proof, because: "live proof needs the docker-compose dev stack (Postgres on 5432) up and the migrations applied against it, and this host cannot start that stack."}
