schema: work/sds-component
id: sds.login.session-store
title: Where a session lives and how it ends
state: done
responsibility: Holds one row per live session with its person, its device and its expiry. Expiry is
  enforced on read, never by a sweep, so a stopped sweeper can never leave a session alive past its time.
interfaces:
  - The auth module is the only writer; every other reader goes through it.
owners:
  - {role: module, path: src/modules/bussiness/session}
refs: [br.login.session.restores, br.login.session.single-device]
dependsOn: [integration.login.postgres, integration.login.keycloak]

stateMachine:
  states: [anonymous, authenticating, active, expired, revoked]
  initial: anonymous
  terminal: [expired, revoked]
  transitions:
    - id: t-begin
      from: anonymous
      to: authenticating
      on: credentials-submitted
      guard: The email is well formed.
    - id: t-accept
      from: authenticating
      to: active
      on: credentials-accepted
      guard: Keycloak returned a subject for the pair.
      effect: One row is written with issuedAt and a thirty-day expiry.
    - id: t-refuse
      from: authenticating
      to: anonymous
      on: credentials-refused
      guard: Keycloak returned no subject.
      effect: Nothing is written, and the refusal does not say which half was wrong.
    - id: t-expire
      from: active
      to: expired
      on: read-after-ttl
      guard: now is later than issuedAt plus thirty days.
      effect: The read is refused and the row is deleted on the way out.
    - id: t-revoke
      from: active
      to: revoked
      on: sign-out
      effect: The row is deleted; the next read of that token finds nothing.

sequence:
  participants: [browser, api, keycloak, postgres]
  steps:
    - {from: browser, to: api, message: "POST /auth/sign-in with the pair, observable: http"}
    - {from: api, to: keycloak, message: "token request for the pair, observable: http"}
    - {from: keycloak, to: api, message: "subject, or a refusal that names nothing, observable: http"}
    - {from: api, to: postgres, message: "INSERT one session row with its expiry, observable: write"}
    - {from: api, to: browser, message: "the session cookie and a redirect to the list, observable: http"}
  note: Only interactions an end-to-end run can observe are bound here. Internal call order is the
    implementation's business; binding it would make a correct refactor read as a defect.

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
provenBy:
  implementation: [impl.login.todo-app-backend.auth]
  transitions: [t-begin, t-accept, t-refuse, t-expire, t-revoke]
