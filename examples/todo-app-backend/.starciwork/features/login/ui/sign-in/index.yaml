schema: work/ui-screen
id: ui.login.sign-in
title: The sign-in screen
state: done
brand: {rev: 2}
refs: [fr.login.sign-in]
ui:
  intent: >-
    A single centred form, no page chrome besides the product wordmark; this is the only unauthenticated screen. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: sign-in, route: /login, purpose: "authenticate and resume a session", actors: [person]}
  states:
    - {name: empty, trigger: "first paint, no input yet", behavior: "both fields empty, submit disabled until both carry a value"}
    - {name: filled, trigger: "person has typed an email and password", behavior: "submit enabled, no message shown"}
    - {name: refused, trigger: "server rejects the credentials or the account is unknown", behavior: "a single uniform GrammarMessage(tone: danger) appears above the form; the password field clears, the email is retained"}
    - {name: working, trigger: "submit clicked, response pending", behavior: "submit is disabled and shows a busy label; no optimistic navigation"}
  coverage:
    scale: bounded
    representativeScreens: [sign-in]
    map:
      - {screen: sign-in, state: empty, viewport: desktop-1280, components: ["GrammarTextField (email)", "GrammarTextField (password, kind: password)", "GrammarButton (type: submit)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (email), GrammarTextField (password, kind: password), GrammarButton (type: submit), GrammarMessage (tone: danger, refused only) anatomy; both fields empty, submit disabled until both carry a value."}
      - {screen: sign-in, state: filled, viewport: desktop-1280, components: ["GrammarTextField (email)", "GrammarTextField (password, kind: password)", "GrammarButton (type: submit)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (email), GrammarTextField (password, kind: password), GrammarButton (type: submit), GrammarMessage (tone: danger, refused only) anatomy; submit enabled, no message shown."}
      - {screen: sign-in, state: refused, viewport: desktop-1280, components: ["GrammarTextField (email)", "GrammarTextField (password, kind: password)", "GrammarButton (type: submit)", "GrammarMessage (tone: danger, refused only)"], derivation: "Representative direction; generated by interface.draw once gap.login.direction-not-drawn closes.", directionAsset: assets/sign-in-refused.png}
      - {screen: sign-in, state: working, viewport: desktop-1280, components: ["GrammarTextField (email)", "GrammarTextField (password, kind: password)", "GrammarButton (type: submit)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (email), GrammarTextField (password, kind: password), GrammarButton (type: submit), GrammarMessage (tone: danger, refused only) anatomy; submit is disabled and shows a busy label; no optimistic navigation."}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.login.direction-not-drawn.
