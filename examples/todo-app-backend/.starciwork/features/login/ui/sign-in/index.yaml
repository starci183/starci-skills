schema: work/ui-screen
id: ui.login.sign-in
title: The sign-in screen
state: todo
brand: {rev: 2}
refs: [fr.login.sign-in]
ui:
  intent: >-
    A single centred form, no page chrome besides the product wordmark; this is the only unauthenticated screen. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses (SurfaceCard, both Input fields, the
    submit Button and the refusal line) and, where the state is an error/refusal, the accessibility-critical
    assertive-live Text carrying the refusal and the brand's contrast don't (Never place text on the
    primary colour below a 4.5:1 contrast ratio.). @starci/grammar/common ships no Message/Alert renderer
    and no danger tone on Text; the refusal is a plain Text line with `live: "assertive"`, not a coloured
    banner.
  surfaces:
    - {name: sign-in, route: /login, purpose: "authenticate and resume a session", actors: [person]}
  states:
    - {name: empty, trigger: "first paint, no input yet", behavior: "both fields empty, submit disabled until both carry a value"}
    - {name: filled, trigger: "person has typed an email and password", behavior: "submit enabled, no message shown"}
    - {name: refused, trigger: "server rejects the credentials or the account is unknown", behavior: "a single uniform GrammarMessage(tone: danger) appears above the form; the password field clears, the email is retained"}
    - {name: working, trigger: "submit clicked, response pending", behavior: "submit is disabled and shows a busy label; no optimistic navigation"}
  coverage:
    scale: bounded
    representativeScreens: [sign-in]
    map:
      - {screen: sign-in, state: empty, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Sign in, measure: formCompact)", "Input (id: sign-in-email, kind: email)", "Input (id: sign-in-password, kind: password)", "Button (type: submit, variant: primary, width: fill)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input (email), Input (password), Button (type: submit) anatomy, minus the refusal Text; both fields empty, submit disabled until both carry a value."}
      - {screen: sign-in, state: filled, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Sign in, measure: formCompact)", "Input (id: sign-in-email, kind: email)", "Input (id: sign-in-password, kind: password)", "Button (type: submit, variant: primary, width: fill)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input (email), Input (password), Button (type: submit) anatomy, minus the refusal Text; submit enabled, no message shown."}
      - {screen: sign-in, state: refused, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Sign in, measure: formCompact)", "Input (id: sign-in-email, kind: email)", "Input (id: sign-in-password, kind: password)", "Text (live: assertive, the refusal sentence)", "Button (type: submit, variant: primary, width: fill, isDisabled)"], derivation: "Representative direction; generated by interface.draw once gap.login.direction-not-drawn closes.", directionAsset: assets/sign-in-refused.png}
      - {screen: sign-in, state: working, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Sign in, measure: formCompact)", "Input (id: sign-in-email, kind: email, isDisabled)", "Input (id: sign-in-password, kind: password, isDisabled)", "Button (type: submit, variant: primary, width: fill, isDisabled, isPending)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input (email), Input (password), Button (type: submit) anatomy, minus the refusal Text; submit is disabled and shows the isPending busy label 'Signing in...'; no optimistic navigation."}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
assets:
  - path: assets/sign-in-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
blockedBy:
  - {record: gap.login.direction-not-drawn, because: "interface.draw has not run for this screen; no built-in image_gen.imagegen invocation has produced the refused representative direction or its sibling prompt bytes yet, only the prompt this record's assets entry names."}
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T09:00:00.000Z
  reason: Re-authored the prompt and coverage map from the actual installed @starci/grammar@0.4.13 common anatomy, replacing the vendored stub's fictitious GrammarButton/GrammarTextField/GrammarMessage names.
