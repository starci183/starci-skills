          - "SurfaceCard (ariaLabel: Sign in, measure: formCompact)"
          - "Input (id: sign-in-email, kind: email)"
          - "Input (id: sign-in-password, kind: password)"
          - "Text (live: assertive, the refusal sentence)"
          - "Button (type: submit, variant: primary, width: fill, isDisabled)"
          - "TextAction (href: forgot-password/create-account/privacy-policy/terms)"
        derivation: Representative direction. Same split layout and links; uniform assertive-live refusal
          retains email and clears password. Submit remains disabled until password is re-entered.
          Submit is unavailable with explicit guidance; the enabled filled state restores solid blue
          with black label. No glyph opacity is used to make copy illegible.
        directionAsset: assets/sign-in-refused.png
      - screen: sign-in
        state: refused
