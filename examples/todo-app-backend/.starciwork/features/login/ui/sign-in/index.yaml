schema: work/ui-screen
id: ui.login.sign-in
title: The sign-in screen
state: done
brand:
  rev: 3
refs:
  - fr.login.sign-in
ui:
  intent: Desktop split-screen with the brand turtle welcome panel on the left and a complete sign-in
    form on the right; the refused representative keeps the same layout. Real email/password labels,
    forgot-password and create-account destinations, and policy links stay visible.
  surfaces:
    - name: sign-in
      route: /sign-in
      purpose: authenticate and resume a session
      actors:
        - person
  states:
    - name: empty
      trigger: first paint, no input yet
      behavior: both fields empty, submit disabled until both carry a value
    - name: filled
      trigger: person has typed an email and password
      behavior: submit enabled, no message shown
    - name: refused
      trigger: server rejects the credentials or the account is unknown
      behavior: Same split layout and links; uniform assertive-live refusal retains email and clears
        password. Submit remains disabled until password is re-entered.
    - name: working
      trigger: submit clicked, response pending
      behavior: submit is disabled and shows a busy label; no optimistic navigation
  coverage:
    scale: bounded
    representativeScreens:
      - sign-in
    map:
      - screen: sign-in
        state: empty
        viewport: desktop-1280
        components:
          - app-owned auth split layout (left illustration panel, compact frameless right form;
            sign-in-screen.png)
          - native decorative img (brand turtle master in left illustration panel)
          - "Input (variant: secondary, id: sign-in-email, kind: email)"
          - "Input (variant: secondary, id: sign-in-password, kind: password)"
          - "Button (type: submit, variant: primary, width: fill, isDisabled)"
          - "TextAction (href: forgot-password/create-account/privacy-policy/terms)"
        derivation: "Derives from refused with the same split-screen. both fields empty, submit disabled
          until both carry a value Submit uses the actual disabled primary treatment until the
          missing password is supplied. Preserve the referenced Input/Button geometry and any mapped
          raised SurfaceCard at this viewport. Apply ANATOMY-1/2/3/4: nested inputs are secondary;
          white primary labels and actual variant/state treatment come from current renders.
          App-owned regions are declared separately."
        directionAsset: assets/sign-in-refused.png
