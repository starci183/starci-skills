schema: work/ui-screen
id: ui.login.sign-in
title: The sign-in screen
state: done
brand: {rev: 2}
refs: [fr.login.sign-in]
ui:
  intent: >-
    A focused authentication form with one compact surface and no competing page chrome. The refused
    state is the representative direction because it carries both fields, the retry action and the
    uniform credential-pair refusal while preserving the email and clearing the password.
  surfaces:
    - name: sign-in
      route: /login
      purpose: authenticate and resume a session
      actors: [person]
  states:
    - {name: empty, trigger: "first paint with no input", behavior: "both labelled fields are empty and submit is unavailable"}
    - {name: filled, trigger: "email and password are present", behavior: "submit is available and no status is shown"}
    - {name: refused, trigger: "the credential pair is refused", behavior: "one uniform assertive Text status is shown; email remains, password clears, and retry stays available"}
    - {name: working, trigger: "sign-in is awaiting a response", behavior: "fields and submit are unavailable and the submit control owns its pending state"}
  coverage:
    scale: bounded
    representativeScreens: [sign-in]
    map:
      - {screen: sign-in, state: empty, viewport: [desktop-1280, mobile-390], components: [PageContainer, SurfaceCard, Heading, Text, Input, Button], derivation: "Use the same form frame without the refusal status; mobile keeps the order and makes the card fluid."}
      - {screen: sign-in, state: filled, viewport: [desktop-1280, mobile-390], components: [PageContainer, SurfaceCard, Heading, Text, Input, Button], derivation: "Populate both inputs and enable the same primary action; mobile preserves focus order."}
      - {screen: sign-in, state: refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, SurfaceCard, Heading, Text, Input, Button], derivation: "Representative generated direction; mobile derives the same single column without hidden controls.", directionAsset: assets/sign-in-refused.png}
      - {screen: sign-in, state: working, viewport: [desktop-1280, mobile-390], components: [PageContainer, SurfaceCard, Heading, Text, Input, Button], derivation: "Apply documented disabled and pending control states to the same anatomy; do not navigate optimistically."}
  accessibility:
    - Labels remain visible above both inputs and keyboard focus follows the visual order.
    - The refusal uses assertive live Text and does not reveal which half of the pair failed.
    - Text on brand primary keeps at least 4.5 to 1 contrast.
  responsive:
    - desktop-1280 centers a compact form; mobile-390 uses the same order in a fluid card within the page inset.
    - No state hides, reorders or converts a labelled control to an icon-only action.
  artworkSlots: []
  observations:
    - "Installed Common anatomy proves PageContainer, SurfaceCard, Heading, Text, Input and Button; it does not prove a Message or Alert primitive."
    - "Composition uses one focal surface, region spacing greater than field spacing, and one primary accent action."
    - "The image is proposed direction only and does not prove exact component rendering, DOM, accessibility or API behavior."
  gaps: []
  assets:
    - path: assets/sign-in-refused.prompt.txt
      role: prompt
    - path: assets/sign-in-refused.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/sign-in-refused.prompt.txt
        inputRefs: [ui.login.sign-in, fr.login.sign-in, br.login.password.sign-in, sds.login.session-store, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/sign-in-refused.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/sign-in-refused.png
    role: direction
