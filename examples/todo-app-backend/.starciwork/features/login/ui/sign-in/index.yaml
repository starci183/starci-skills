        directionAsset: assets/sign-in-refused.png
      - screen: sign-in
        state: working
        viewport: mobile-390
        components:
          - "PrimaryRailLayout (primary: left artwork, rail: form, collapsedOrder: primary-first)"
          - MediaFrame (master turtle; decorative)
          - "SurfaceCard (ariaLabel: Sign in, measure: formCompact)"
          - "Input (id: sign-in-email, kind: email, isDisabled)"
          - "Input (id: sign-in-password, kind: password, isDisabled)"
          - "Button (type: submit, variant: primary, width: fill, isDisabled, isPending)"
          - "TextAction (href: forgot-password/create-account/privacy-policy/terms)"
        derivation: "Derived compact projection; mobile-390: published collapsed primary-first flow puts a
          compact turtle welcome panel before the form; labels, refusal, submit and all links remain
          visible with no horizontal page scroll. submit is disabled and shows a busy label; no
          optimistic navigation"
        directionAsset: assets/sign-in-refused.png
  accessibility:
    - Keyboard order follows visual and DOM order; all control names remain visible.
    - "Text(live: assertive) announces refusal; plain foreground copy, no invented Message/Alert
      export."
    - "Primary labels use installed --color-black on #2F6BFF (unrounded contrast 4.667946:1);
      white-on-primary is prohibited."
    - Danger outline/edge communicates destructive consequence alongside a visible action verb; dark
      labels remain legible.
    - Exactly one main landmark; navigation has a name; focus remains visible and returns to the
      action after a dismissed confirmation.
    - Decorative turtle uses empty alt text; the adjacent copy supplies meaning.
  responsive:
    - "desktop-1280: PrimaryRailLayout primary illustration LEFT, rail form RIGHT; never drop the
      illustration panel at desktop measure."
    - "mobile-390: published collapsed primary-first flow puts a compact turtle welcome panel before
      the form; labels, refusal, submit and all links remain visible with no horizontal page
      scroll."
  artworkSlots:
    - id: auth-turtle
      screen: sign-in
      states:
        - empty
        - filled
        - refused
        - working
      master:
        record: brand
        path: assets/turtle-master.png
      placement: left welcome illustration region, separate from refusal/form
      decorative: true
      status: master-placeholder; direction artwork is illustrative; implementation reuses master bytes
  observations:
    - Direction is an ImageGen design input, not a running-product capture, exact Grammar rendering,
      interaction or API proof.
    - Read brand/index.yaml rev 3 for palette and master provenance; generated colours and glyphs
      are approximate until implementation uses the exact CSS tokens.
    - Left panel shows the calm blue turtle; right panel holds email and cleared password fields,
      uniform refusal, disabled sign-in helper, forgot-password, create-account and both policy
      links.
    - Corrected coloured link text and the apparently enabled empty-password action. Final link
      labels are dark, with blue underlines; the disabled action has a blue outline and explicit
      helper.
    - No authenticated shell. Turtle stays in the welcome panel, outside the refusal and form.
      Ready/working states use the same composition; enabled primary fill uses black ink.
  gaps:
    - code: THEME_IMPLEMENTATION_REQUIRED
      detail: Only the accent override is wired here. Activate the accepted Core token vocabulary, load
        Inter and supply black primary-label ink in a separately authorized implementation.
    - code: DIRECTION_LINKS_UNIMPLEMENTED
      detail: Forgot-password, create-account, privacy-policy and terms links are direction-only; /login
        was the old direction route, while the existing app route is /sign-in.
    - code: GRAMMAR_REQUIRED
      detail: The readable disabled primary treatment shown here must be supplied through Grammar-owned
        state/theme support; the stock Button disabled opacity must not be assumed to match this
        direction.
  status: reviewed-proposed-direction
  shell:
    kind: auth-split
    owner: PrimaryRailLayout
    primary: left illustration
    rail: right form
    appShell: false
  links:
    - label: Forgot password?
      href: /forgot-password
      status: proposed unimplemented route
    - label: Create an account
      href: /create-account
      status: proposed unimplemented route
    - label: Privacy policy
      href: /privacy-policy
      status: proposed unimplemented policy route
    - label: Terms
      href: /terms
      status: proposed unimplemented policy route
