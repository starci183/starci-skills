schema: work/functional-requirement@1
id: fr.login.sign-out
title: Sign out
state: todo
actors: [person]
trigger: The person signs out.
mainFlow:
  - The session ends and the next request is unauthenticated.
composes:
  - rule: br.login.session.restores
    module: src/modules/bussiness/session

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/session/sign-out.e2e-spec.ts
  uat:
    required: true

# The compose of br.login.session.single-device is removed: that rule governs a *new* sign-in ending a
# prior session (its ac is second-sign-in-ends-the-first), which sign-out never exercises - the compose
# made this flow wait on a rule its own steps do not touch (v6-3 Q2-10). The blockedBy edge that cited
# it existed only because of that compose ("the device rule it composes"), so it is removed with it;
# the code agrees - SignOutHandler revokes the row and publishes event.login.signed-out and touches no
# device logic (src/modules/bussiness/session/sign-out.handler.ts). This record stays todo on its own
# requiresProof: the e2e command now names the real spec (session/sign-out.e2e-spec.ts walks
# sign-in -> sign-out -> token refused -> re-sign-in) but no passing run is captured as evidence here,
# and requiresProof.uat is unmet - uat.login.sign-in is the only login uat flow.
