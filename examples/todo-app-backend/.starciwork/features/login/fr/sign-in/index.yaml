schema: work/functional-requirement@1
id: fr.login.sign-in
title: Sign in
state: done
actors: [person]
trigger: The person submits an email and a password.
mainFlow:
  - The pair is checked.
  - A session is created and the person lands on their list.
exceptionFlows:
  - A wrong pair is refused without naming which half was wrong.
postconditions:
  - Exactly one live session exists for that person.
composes:
  - rule: br.login.password.sign-in
    module: src/modules/bussiness/session
  - rule: br.login.session.restores
    module: src/modules/bussiness/session

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/auth/sign-in.e2e-spec.ts
  uat:
    required: true
  perf:
    optional: true

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
# A hand-authored block sat here naming a captured run at 6f1e4b7d and uat.login.sign-in as proof; it is
# removed, and the kernel derives the real one. Two dead commands were also corrected: e2e now names the
# real spec path, and perf's `node scripts/load/sign-in-timing.mjs` named a harness that does not exist
# in this repository (no scripts/load/), so the optional demand stands without a fabricated command.
