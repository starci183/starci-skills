schema: work/functional-requirement
id: fr.login.sign-in
title: Sign in
state: done
actors: [person]
trigger: The person submits an email and a password.
mainFlow:
  - The pair is checked.
  - A session is created and the person lands on their list.
exceptionFlows:
  - A wrong pair is refused without naming which half was wrong.
postconditions:
  - Exactly one live session exists for that person.
composes:
  - rule: br.login.password.sign-in
    module: src/features/sign-in/**
  - rule: br.login.session.restores
    module: src/modules/domain/session/**

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- auth/sign-in
  uat:
    required: true
  perf:
    optional: true
    command: node scripts/load/sign-in-timing.mjs

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
provenBy:
  unit: [impl.login.todo-app-backend.auth]
  e2e:
    - command: npm run test:e2e -- auth/sign-in
      exit: 0
      at: 6f1e4b7d
  uat: [uat.login.sign-in]
  perf: []
