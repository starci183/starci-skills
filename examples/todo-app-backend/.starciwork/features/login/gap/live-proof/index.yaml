schema: work/gap
id: gap.login.live-proof
title: No live proof exists against the real Keycloak/Postgres stack, and no uat.verify run has executed login.sign-in against it
state: todo
statement: integration.login.keycloak's and integration.login.postgres's requiresProof.live both need a run
  against the real provider (a real Keycloak token exchange, a real Postgres migration and round-trip),
  not against FakeKeycloakClient or an in-memory Repository stand-in, and uat.login.sign-in - which would
  exercise exactly that pair - has never been executed by uat.verify against the running product either -
  there is no uat/sign-in/runs/<runId>/ folder with real screenshots, a playable video and a passing
  result.md, only the designed flow this record and its accounts.yaml/fixtures ref describe. This host
  cannot start the docker-compose dev stack (Keycloak on 8089, Postgres on 5432) that a live run needs, so
  no such run has happened from here. This is a designed todo, not an oversight - it names exactly the two
  integrations the owner's own requiresProof.live already curated as needing a real provider, together with
  the one uat flow that would prove both at once, and it stays open until proof is captured on a host that
  can boot that stack - it is not a stand-in for missing code, missing tests, or an unimplemented feature.
