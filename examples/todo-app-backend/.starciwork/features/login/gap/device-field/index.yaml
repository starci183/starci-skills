id: gap.login.device-field
title: No device field exists on a session or person
state: todo
statement: sds.login.session-store's stateMachine and data.login.person's fields carry no device identity.
  session.mjs's accept()/actorOf() take no device argument. decision.login.session.devices - which is
  exactly the open question of how many devices a session model allows - is still open, so there is no
  deviceId anything downstream could honestly be given.
