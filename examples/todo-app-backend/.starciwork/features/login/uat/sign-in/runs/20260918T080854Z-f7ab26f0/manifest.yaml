assertions:
  - id: ux.sign-in.validation-feedback
    expected: yes
    observed: yes
    note: The submit button stays disabled while either field is empty
      (SignInFormView disabled logic).
  - id: ux.sign-in.lands-on-task-list
    expected: yes
    observed: no
    note: Signing in does not navigate anywhere; this harness then navigated to
      /tasks by URL to keep walking the flow.
  - id: fr.login.sign-in
    expected: yes
    observed: yes
    note: After navigating to /tasks by URL, the browser rendered
      data-state="empty", matching a correctly-headed API read-back of
      demo@todo.dev's own 0 task(s).
  - id: br.login.session.restores
    expected: yes
    observed: yes
    note: The session token lives in localStorage, not a cookie - the record's own
      wording is stale against src/modules/session - so reloading /tasks re-read
      it without re-authenticating; the list rendered data-state="empty" after
      reload. This matches a correctly-headed API read-back of demo@todo.dev's
      own 0 task(s).
  - id: ux.sign-in.error-feedback
    expected: yes
    observed: yes
    note: form[data-state="refused"] renders a role="alert" message after the
      wrong-password submit.
  - id: br.login.password.sign-in
    expected: yes
    observed: yes
    note: The refusal text is the one normalized SIGN_IN_REFUSAL_MESSAGE regardless
      of which half of the pair was wrong (src/modules/api/auth.ts) - the same
      text an unknown email would produce.
