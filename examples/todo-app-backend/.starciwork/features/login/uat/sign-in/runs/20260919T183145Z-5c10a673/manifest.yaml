    expected: yes
    observed: not-run
    note: No response observed from /graphql within the timeout; the API origin did
      not answer.
  - id: br.login.password.sign-in
    expected: yes
    observed: not-run
    note: "Same reason: no backend response to compare against a normalized refusal
      message."
