  - id: ux.sign-in.validation-feedback
    expected: yes
    observed: yes
    note: The submit button stays disabled while either field is empty
      (SignInFormView disabled logic).
  - id: fr.login.sign-in
    expected: yes
    observed: not-run
    note: A successful sign-in writes a session row to Postgres.
      UAT_LIVE_LOGIN_AUTHORIZED is not true in this environment, so this step is
      not-run here rather than attempted against infrastructure this run does
      not own.
  - id: br.login.session.restores
    expected: yes
    observed: not-run
    note: Depends on the real signed-in session from fr.login.sign-in above; not-run
      for the same reason.
