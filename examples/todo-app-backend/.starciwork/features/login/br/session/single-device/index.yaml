schema: work/business-rule@1
id: br.login.session.single-device
title: Signing in on a new device ends the old session
state: todo
statements:
  - A person holds at most one live session; a new sign-in ends the previous one.
acceptance:
  - id: ac.login.session.single-device.second-sign-in-ends-the-first
    given: A person signed in on one device
    when: They sign in on another
    then:
      - The first session is refused on its next request.
module: src/modules/bussiness/session
blockedBy:
  - {record: gap.login.device-field, because: "decision.login.session.devices is now decided (single-device), settling this statement, but sds.login.session-store's stateMachine and data.login.person's fields carry no device identity and session.mjs's accept()/actorOf() take no device argument - there is no device field to evict a prior session against yet."}
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.login.session.single-device#<former-ac-id>. Encoding change only, no semantic change."}

