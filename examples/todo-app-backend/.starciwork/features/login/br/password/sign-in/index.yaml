schema: work/business-rule@1
id: br.login.password.sign-in
title: A person signs in with an email and a password
state: done
statements:
  - A sign-in succeeds only when the email is known and the password matches its stored hash.
  - A failed sign-in says only that the pair is wrong, never which half.
authorityRefs:
  - "owner-intent: Telling an attacker that an email exists is a leak, and it buys the person nothing."
acceptance:
  - id: ac.login.password.sign-in.wrong-pair-is-refused
    given: A known email
    when: The password does not match
    then:
      - Sign-in is refused and no session is created.
  - id: ac.login.password.sign-in.refusal-does-not-name-the-half
    given: An unknown email and a known email with a wrong password
    when: Each is submitted
    then:
      - Both refusals carry the same message and the same status.
      - Their response times do not separate the two cases.
module: [src/modules/bussiness/session, src/modules/integrations/keycloak]
change: {rev: 2, kind: editorial, at: 2026-09-19T15:59:33.966Z, reason: "rev 2 (v11 ac-collapse): acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.login.password.sign-in#<former-ac-id>. Encoding change only, no semantic change."}
