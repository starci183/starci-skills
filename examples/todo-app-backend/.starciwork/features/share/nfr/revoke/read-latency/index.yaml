schema: work/non-functional-requirement@1
id: nfr.share.revoke.read-latency
title: Checking a collaborator's live status adds no perceptible cost to a read
quality: latency
state: todo
observableCriterion: A task read that must re-check an invitation's status answers in under 200 ms at the
  95th percentile for a task with up to twenty collaborators, matching nfr.task.list.latency's own bound.
measurement:
  how: k6 run scripts/load/share-status.js with 20 seeded collaborators and 50 virtual users for 60 seconds
  threshold: p95 < 200ms
  environment: dev
refs: [br.share.revoke.on-read, br.share.invite.expiry]
blockedBy:
  - {record: gap.share.load-proof, because: "The share module now exists (src/modules/bussiness/share) and its read path is functionally proven, but no k6 run has been made against it - this lane ran jest unit/integration tests and a curl-based live-proof script, neither of which say anything about latency under load."}

requiresProof:
