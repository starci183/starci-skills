schema: work/customer-journey
id: journey.share.collaborate-on-a-task
title: A person invites help onto their task and can take it back
state: todo
crossesFeatures: [task, share]
steps:
  - {actor: owner, does: "Creates a task, then invites a friend as an editor, expects: An invitation the
      friend can accept within two weeks."}
  - {actor: collaborator, does: "Accepts the invitation and marks the task complete, expects: The owner
      sees it complete without doing anything themselves."}
  - {actor: owner, does: "Changes their mind and revokes the collaborator, expects: The next thing that
      collaborator tries fails, immediately, with no delay."}
requirements: [fr.task.create, fr.share.invite, fr.share.accept, fr.share.revoke]
blockedBy:
  - {record: fr.share.invite, because: "fr.share.invite, fr.share.accept and fr.share.revoke are all todo; there is no running product yet for this journey to be walked against."}
  - {record: fr.share.accept, because: "fr.share.invite, fr.share.accept and fr.share.revoke are all todo; there is no running product yet for this journey to be walked against."}
  - {record: fr.share.revoke, because: "fr.share.invite, fr.share.accept and fr.share.revoke are all todo; there is no running product yet for this journey to be walked against."}

requiresProof:
  uat:
    required: true
  requirements:
    forEach: requirements
