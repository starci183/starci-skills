schema: work/policy-decision
id: decision.share.invite.expiry-window
title: Why an invitation expires rather than staying pending indefinitely
state: done
outcome: fixed-window
question: Should a pending invitation stay open until the owner revokes it, or expire on its own after a
  fixed window?
options:
  - id: indefinite
    summary: A pending invitation never expires; only an explicit revoke closes it.
    consequence: One fewer state transition to prove, but a forgotten invitation to a stale or mistyped
      address stays acceptable forever, and br.share.revoke.on-read becomes the only closing mechanism -
      the owner must remember every invitation they ever sent.
  - id: fixed-window
    summary: A pending invitation expires fourteen days after being sent if never accepted.
    consequence: Bounds the exposure of a single mistake without the owner having to act, and gives
      br.share.invite.expiry an acceptance criterion that is actually testable by advancing a clock.
recommendation: fixed-window
recommendationReason: An indefinite pending invitation is a standing grant of nothing enforced, which is a
  worse failure mode than a stale invitation the invited person can no longer accept - the latter fails
  closed, the former fails open. Fourteen days mirrors thirty-day sessions being long enough to act on
  without inventing a second unrelated duration to defend.
