schema: work/uat-flow@1
id: uat.share.invite-and-collaborate
title: Invite an editor, have them complete a task, then revoke them
state: inprogress
entry: /tasks/:taskId/share
actor: owner
accounts: accounts.yaml
environment: environment.todo-app.dev
fixtures: [fixture.todo-app.seed]
steps:
    - {order: 1, actor: owner, action: "Sign in as the owner and create a task.", expected: "the task appears in the owner list", checks: [{id: completion, expected: yes}]}
    - {order: 2, actor: owner, action: "Invite a second person as editor and a third as viewer.", expected: "both invitations show pending", checks: [{id: completion, expected: yes}]}
    - {order: 3, actor: editor, action: "Sign in as the editor, accept the invitation, and complete the task.", expected: "the task shows complete", checks: [{id: completion, expected: yes}]}
    - {order: 4, actor: viewer, action: "Sign in as the viewer, accept the invitation, and attempt to complete the task.", expected: "the attempt is refused", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 5, actor: viewer, action: "Re-read the task.", expected: "still shows complete, unchanged by the refused attempt", checks: []}
    - {order: 6, actor: owner, action: "Sign in as the owner and revoke the editor.", expected: "the editor no longer appears in the collaborator list", checks: [{id: completion, expected: yes}]}
    - {order: 7, actor: editor, action: "Sign in as the editor and read the task again.", expected: "access is refused", checks: [{id: errorFeedback, expected: yes}]}
    - {order: 8, actor: editor, action: "(same step, no wait) confirm the refusal is immediate.", expected: "no wait and no background sweep was needed between revoke and refusal", checks: []}
effects:
  - "insert one task row"
  - "create two invitation rows"
  - "accept two invitations"
  - "revoke one"
cleanup:
  - "delete the run-owned task, invitation and access rows by recorded id"
proves: [fr.share.invite, fr.share.accept, fr.share.revoke, br.share.role.permissions, br.share.revoke.on-read]
blockedBy:
  - {record: gap.share.live-proof, because: "uat.verify has now run this flow twice (runs/20260919T142631Z-5c10a673, runs/20260919T142709Z-5c10a673); both settle partial-pass, never pass - the owner-side legs (invite, pending list, t-revoke-pending, cleanup) are proven live, while the invitee legs cannot be walked at all because the product has no acceptance surface (see the gap's statement)."}
change: {rev: 1, kind: clarifying, at: 2026-09-19T14:30:00.000Z, reason: "v9-5 implemented the spec and ran it against the live shared stack. The realm seeds only two accounts, so the record's 'third person' viewer was invited as a run-namespaced address; the invitee accept/complete/read legs have no UI to walk (no accept route, no inbox, no invitation delivery, ownership-only task list) and are recorded not-run, so the record is partially provable - inprogress, not done."}
