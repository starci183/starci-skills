schema: starci/uat-run-manifest@1
id: uat.share.invite-and-collaborate.runs.20260919T142709Z-5c10a673
nodeId: uat.share.invite-and-collaborate
inputDigest: 94876e4ae7690652c9c09389f78f1520bcb5390d4f7b24573b02aad722cd3c73
outcome: partial-pass
assertions:
  - id: fr.share.invite
    expected: yes
    observed: yes
    note: Two invitations submitted through ui.share.invite - demo2@todo.dev as
      editor, uat-20260919T142709Z-5c10a673-viewer@todo.dev as viewer - both
      render as Pending rows in the collaborator list. The realm seeds only two
      accounts, so the "third person" viewer is a run-namespaced address with no
      login; the invitation row itself is real.
  - id: fr.share.accept
    expected: yes
    observed: not-run
    note: "No acceptance surface exists in the product: invite publishes no event
      and sends no email (src/modules/bussiness/share/invite.handler.ts), there
      is no notifications inbox, no route under src/app serves acceptInvitation,
      and no query lets an unbound invitee learn the invitationId -
      collaborators(taskId) returns [] to them (InvitationService.listFor). The
      shared task can never appear in the invitee list either (tasks is
      ownership-only). This step's screenshots are the observed absence. Signed
      in as the invited editor: the run task is absent from their list and the
      share route renders an empty state with nothing to accept."
  - id: br.share.role.permissions
    expected: yes
    observed: not-run
    note: Depends on an accepted invitation (unreachable above); even post-accept no
      UI affordance would exist, since a collaborator has no task surface to
      complete on.
  - id: fr.share.revoke
    expected: yes
    observed: yes
    note: The owner revoked both pending invitations through the UI (Revoke +
      window.confirm); each row now reads Revoked. This proves t-revoke-pending
      only - the record's designed leg revokes an accepted editor, which the
      missing accept surface makes unreachable.
  - id: br.share.revoke.on-read
    expected: yes
    observed: not-run
    note: Depends on an accepted collaborator whose next read is refused; no
      invitation could be accepted (missing surface above), so there is no bound
      access for a read to lose.
