  flows.json:
    schema: starci/uat-flows@1
    flow:
      id: uat.share.invite-and-collaborate
      title: Invite an editor, have them complete a task, then revoke them
      steps:
        - order: 1
          actor: owner
          action: Sign in as the owner and create a task.
          expected: the task appears in the owner list
          checks:
            - id: completion
              expected: yes
        - order: 2
          actor: owner
          action: Invite a second person as editor and a third as viewer.
          expected: both invitations show pending
          checks:
            - id: completion
              expected: yes
        - order: 3
          actor: editor
          action: Sign in as the editor, accept the invitation, and complete the task.
          expected: the task shows complete
          checks:
            - id: completion
              expected: yes
        - order: 4
          actor: viewer
          action: Sign in as the viewer, accept the invitation, and attempt to complete
            the task.
          expected: the attempt is refused
          checks:
            - id: errorFeedback
              expected: yes
        - order: 5
          actor: viewer
          action: Re-read the task.
          expected: still shows complete, unchanged by the refused attempt
          checks: []
        - order: 6
          actor: owner
          action: Sign in as the owner and revoke the editor.
          expected: the editor no longer appears in the collaborator list
          checks:
            - id: completion
              expected: yes
        - order: 7
          actor: editor
          action: Sign in as the editor and read the task again.
          expected: access is refused
          checks:
            - id: errorFeedback
              expected: yes
        - order: 8
          actor: editor
          action: (same step, no wait) confirm the refusal is immediate.
          expected: no wait and no background sweep was needed between revoke and refusal
          checks: []
      proves:
        - fr.share.invite
        - fr.share.accept
        - fr.share.revoke
        - br.share.role.permissions
        - br.share.revoke.on-read
