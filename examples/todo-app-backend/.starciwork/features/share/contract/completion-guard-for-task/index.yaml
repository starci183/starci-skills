schema: work/contract@1
id: contract.share.completion-guard-for-task
title: What fr.task.complete may rely on when a task is shared
state: todo
between:
  provider: share
  consumer: task
owner: share
surface:
  - name: mayComplete
    shape: (actor, task) -> {allowed, reason}
    guarantee: true only for the owner, or for a collaborator whose invitation is, at this exact call, an
      accepted editor. The invitation is re-read live; a revoked or expired one is never cached as accepted.
    stability: Widening who may complete is additive for task; narrowing it, or changing what accepted
      means, is breaking.
  - name: mayDelete
    shape: (actor, task) -> {allowed, reason}
    guarantee: true only for the owner. No role sharing grants ever makes this true for anyone else.
    stability: This guarantee is never loosened; br.share.editor.no-delete makes any such change a
      breaking change to that rule first.
guarantees:
  - A revoked or expired collaborator fails mayComplete on their very next call, per br.share.revoke.on-read.
  - mayDelete answers exactly as it would if sharing did not exist, per br.share.editor.no-delete.
consumerObligations:
  - task calls mayComplete on every attempt to complete a task it did not itself create for the caller, and
    never substitutes its own owner-only check for it once this contract is proven.
  - task continues to enforce delete itself, or calls mayDelete; either way the answer for a non-owner is
    always refusal.
  - task treats a null or throwing actor as unauthenticated, never as an owner.
refs: [br.task.single-owner, br.share.role.permissions, br.share.revoke.on-read, br.share.editor.no-delete]

requiresProof:
  provider:
    required: true
    note: share proves mayComplete and mayDelete honour the guarantees above.
  consumer:
    required: true
    note: task proves fr.task.complete calls mayComplete instead of its own single-owner-only check.

blockedBy:
  - {record: fr.task.complete, because: "Both sides now exist in code - ShareCompletionAuthority is registered into task's CompletionAuthorityRegistry (impl.share.todo-app-backend.access is done) - but the consumer flow record is still todo behind br.task.single-owner, so this contract's provider/consumer proof has not settled. The earlier rev pin is dropped: fr.task.complete carries no change.rev, so a pinned cite could never stale correctly when it flips done."}
  - {record: br.task.single-owner, rev: 4, because: "The rule this contract's mayComplete guarantee restates is still todo at rev 4, held by gap.task.single-owner-editor-arm - no captured run exercises the accepted-editor arm this surface exists to answer for."}

change: {rev: 1, kind: initial, at: 2026-09-19T12:00:00.000Z, reason: "Blocked-edge repair by the edges lane: both entries' because text still said 'Neither side exists yet', which has been false since impl.share.todo-app-backend.access proved the provider half; and the fr.task.complete cite pinned rev 2 against a record that carries no change.rev - a pin that can never stale on schedule. Both entries now name the current truth; the targets are unchanged."}
