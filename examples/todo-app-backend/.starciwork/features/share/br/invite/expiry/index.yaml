schema: work/business-rule
id: br.share.invite.expiry
title: An invitation expires after fourteen days
state: todo
statements:
  - An invitation not accepted within fourteen days of being sent can no longer be accepted.
  - Expiry is computed the moment an invitation is read, never by a background sweep.
authorityRefs:
  - "owner-intent: An open invitation to somebody's task is a standing exposure; bounding it removes the
    need for the owner to remember and manually close it."
acceptanceCriteria: [expires-after-14-days, accept-before-expiry-succeeds]
