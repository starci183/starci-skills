schema: work/business-rule@1
id: br.share.editor.no-delete
title: An editor may never delete
state: done
statements:
  - No role a collaborator can hold ever authorizes deleting the task. Deletion stays with the owner alone,
    unconditionally, regardless of any role sharing grants.
authorityRefs:
  - "owner-intent: Sharing is meant to let somebody help finish the work, never to let somebody else remove
    it. Widening delete would make an invitation as dangerous to accept as it is useful."
acceptance:
  - id: ac.share.editor.no-delete.delete-refused-for-editor
    given: A task has an accepted editor collaborator
    when: That collaborator attempts to delete the task
    then:
      - The attempt is refused.
      - The task still exists afterward.
module: src/modules/bussiness/share
change:
  rev: 3
  kind: editorial
  at: 2026-09-19T15:59:33.966Z
  reason: impl.share.todo-app-backend.access is built (src/modules/bussiness/share, not the earlier-guessed
    src/share); completion-authority.spec.ts proves an accepted editor collaborator refused at delete
    through task's own unmodified OwnershipGuard, and scripts/live-proof-share.sh proves the same refusal
    end to end against the real running stack. gap.share.unbuilt-module's blockedBy is resolved.

    rev 3 (v11 ac-collapse) - acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.share.editor.no-delete#<former-ac-id>. Encoding change only, no semantic change.
