schema: work/functional-requirement
id: fr.share.invite
title: Invite a collaborator
state: todo
actors: [owner]
trigger: The owner submits an email and a role for one of their own tasks.
mainFlow:
  - The owner submits a well formed email and a role of viewer or editor.
  - A pending invitation is created, bound to that task, email and role, with a fourteen-day expiry.
exceptionFlows:
  - An invalid email is refused and nothing is created.
  - A role other than viewer or editor is refused and nothing is created.
postconditions:
  - Exactly one pending invitation exists for that submission.
composes:
  - {rule: br.share.role.permissions, module: src/share/access.service.ts}
  - {rule: br.share.invite.expiry, module: src/share/invitation.service.ts}
blockedBy:
  - {record: br.share.role.permissions, because: "br.share.role.permissions and br.share.invite.expiry are both todo; the NestJS module they compose does not exist yet."}
  - {record: br.share.invite.expiry, because: "br.share.role.permissions and br.share.invite.expiry are both todo; the NestJS module they compose does not exist yet."}

requiresProof:
  unit:
    forEach: composes
  uat:
    required: true
