schema: work/ui-screen
id: ui.share.invite
title: The invitation screen and the collaborator list
state: todo
brand: {rev: 2}
refs: [fr.share.invite, fr.share.list]
ui:
  intent: >-
    The collaborator list is a page section named by SurfaceListCard's own `label` - the real published
    collection container per COLLECTION-1 case-5 - never a second SurfaceCard; one collaborator is one
    application-owned row inside it, per COLLECTION-1/COLLECTION-2. The representative direction is drawn
    for the refused state because it combines the densest actual Grammar anatomy this screen uses (the
    invite SurfaceCard, Input, Button and the refusal line, beside an unchanged populated collaborator
    SurfaceListCard) and, where the state is an error/refusal, the accessibility-critical assertive-live
    Text carrying the refusal and the brand's contrast don't (Never place text on the primary colour below
    a 4.5:1 contrast ratio.). @starci/grammar/common ships no Message/Alert renderer; the refusal is a
    plain Text line, and each collaborator row is application-owned markup since StaticStateRow cannot
    carry the required revoke action.
  surfaces:
    - {name: invite, route: /tasks/:taskId/share, purpose: "invite collaborators and manage their access", actors: [owner]}
  states:
    - {name: empty, trigger: "no invitations exist yet", behavior: "only the invite form is shown, no collaborator list section"}
    - {name: inviting, trigger: "invite submitted, response pending", behavior: "the invite GrammarButton is disabled and shows a busy label"}
    - {name: pending-list, trigger: "one or more invitations are outstanding", behavior: "the collaborator list section renders with a heading; pending rows show role and a revoke GrammarButton"}
    - {name: accepted, trigger: "a collaborator has accepted", behavior: "that row's status changes from pending to accepted; revoke remains available"}
    - {name: refused, trigger: "the invite is rejected, for example inviting an existing collaborator twice", behavior: "a GrammarMessage(tone: danger) appears beside the invite form; the collaborator list is unchanged"}
  coverage:
    scale: bounded
    representativeScreens: [invite]
    map:
      - {screen: invite, state: empty, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Invite collaborators)", "Input (id: invite-email, kind: email)", "Button (invite, type: submit, variant: primary)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input, Button (invite) anatomy, minus the refusal Text and the SurfaceListCard; only the invite form is shown, no collaborator SurfaceListCard section yet."}
      - {screen: invite, state: inviting, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Invite collaborators)", "Input (id: invite-email, kind: email, isDisabled)", "Button (invite, type: submit, variant: primary, isDisabled, isPending)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input, Button (invite) anatomy, minus the refusal Text; the invite Button is isDisabled and isPending, showing its busy label."}
      - {screen: invite, state: pending-list, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Invite collaborators)", "Input (id: invite-email, kind: email)", "Button (invite, type: submit, variant: primary)", "SurfaceListCard (label: Collaborators)", "Text (row email)", "Badge (tone: neutral, pending)", "Button (revoke, variant: ghost)"], derivation: "Derives from the refused representative direction: same SurfaceCard, Input, Button (invite), SurfaceListCard anatomy, minus the refusal Text; the collaborator SurfaceListCard section renders with its own `label`; pending rows show Badge (tone: neutral) and a revoke Button (variant: ghost)."}
      - {screen: invite, state: accepted, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Invite collaborators)", "Input (id: invite-email, kind: email)", "Button (invite, type: submit, variant: primary)", "SurfaceListCard (label: Collaborators)", "Text (row email)", "Badge (tone: success, accepted)", "Button (revoke, variant: ghost)"], derivation: "Derives from the pending-list state: same SurfaceCard, Input, Button (invite), SurfaceListCard anatomy; that row's Badge changes from tone: neutral to tone: success; the revoke Button remains available."}
      - {screen: invite, state: refused, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Invite collaborators)", "Input (id: invite-email, kind: email)", "Text (live: assertive, the refusal sentence)", "Button (invite, type: submit, variant: primary)", "SurfaceListCard (label: Collaborators)", "Text (row email)", "Badge (tone: neutral or success, unchanged)", "Button (revoke, variant: ghost)"], derivation: "Representative direction; generated by interface.draw once gap.share.direction-not-drawn closes.", directionAsset: assets/invite-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
assets:
  - path: assets/invite-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
blockedBy:
  - {record: gap.share.direction-not-drawn, because: "interface.draw has not run for this screen; no built-in image_gen.imagegen invocation has produced the refused representative direction or its sibling prompt bytes yet, only the prompt this record's assets entry names."}
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T09:00:00.000Z
  reason: Re-authored the prompt and coverage map from the actual installed @starci/grammar@0.4.13 common anatomy, replacing the vendored stub's fictitious GrammarTextField/GrammarButton/GrammarMessage names with SurfaceListCard/Badge-based collaborator rows.
