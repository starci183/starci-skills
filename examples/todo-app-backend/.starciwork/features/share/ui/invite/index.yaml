schema: work/ui-screen
id: ui.share.invite
title: The invitation screen and the collaborator list
state: done
brand: {rev: 2}
refs: [fr.share.invite, fr.share.list]
ui:
  intent: >-
    An owner-facing invite form followed by one stable collaborator collection. The representative refused
    state keeps current collaborators visible, places invalid-email feedback on the Email Input and exposes
    exactly the Viewer and Editor roles without inventing permissions.
  surfaces:
    - name: invite
      route: "/tasks/:taskId/share"
      purpose: invite collaborators and manage their access
      actors: [owner]
  states:
    - {name: empty, trigger: "no invitation or collaborator exists", behavior: "the invite form remains and an empty notice replaces collaborator rows"}
    - {name: inviting, trigger: "an invite is awaiting a response", behavior: "the initiating button owns pending and duplicate submission is unavailable"}
    - {name: pending-list, trigger: "one or more invitations are pending", behavior: "pending rows show email, role, live status and a named Revoke action"}
    - {name: accepted, trigger: "a collaborator accepted", behavior: "the row status becomes Accepted and Revoke remains available"}
    - {name: refused, trigger: "invite input is invalid or the invite is refused", behavior: "correctable email feedback stays on the Input and the collaborator list is unchanged"}
  coverage:
    scale: bounded
    representativeScreens: [invite]
    map:
      - {screen: invite, state: empty, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, EmptyNotice], derivation: "Keep the invite form and replace collaborator rows with one empty notice."}
      - {screen: invite, state: inviting, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard], derivation: "Apply pending to Send invite while preserving entered email, selected role and current rows."}
      - {screen: invite, state: pending-list, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard, Badge], derivation: "Use the same collection with pending badges and named revoke actions; mobile wraps row fields."}
      - {screen: invite, state: accepted, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard, Badge], derivation: "Change only the affected live status to Accepted; preserve role and access action."}
      - {screen: invite, state: refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard, Badge], derivation: "Representative generated direction; mobile preserves form then collection order.", directionAsset: assets/invite-refused.png}
  accessibility:
    - Email error text is programmatically associated with its labelled Input.
    - The native Role radio group has a group label and exactly two named choices.
    - Status is conveyed in text, and every Revoke action includes the collaborator identity in its accessible name.
  responsive:
    - desktop-1280 uses aligned form and collection regions; mobile-390 stacks form controls and permits email and row actions to wrap.
    - Header, invite form and collaborator list remain in the same reading and focus order.
  artworkSlots: []
  observations:
    - "Installed Common proves Input error ownership, Button, Badge and SurfaceListCard; the radio group and collaborator rows remain application-owned."
    - "One primary invite action anchors the decision region while revoke stays visually weaker."
    - "The generated image proposes direction and does not prove an exact Badge palette, component render or interaction."
  gaps:
    - "Common has no role-selector primitive, so the application owns a native labelled radio group."
    - "Common has no destructive Button variant, so Revoke remains a weak labelled outline action."
  assets:
    - path: assets/invite-refused.prompt.txt
      role: prompt
    - path: assets/invite-refused.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/invite-refused.prompt.txt
        inputRefs: [ui.share.invite, fr.share.invite, fr.share.list, sds.share.invitation-lifecycle, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/invite-refused.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/invite-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/invite-refused.prompt.txt
      inputRefs: [ui.share.invite, fr.share.invite, fr.share.list, sds.share.invitation-lifecycle, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: 2026-09-18T10:07:36.391Z
