schema: work/ui-screen
id: ui.share.invite
title: The invitation screen and the collaborator list
state: todo
brand: {rev: 2}
refs: [fr.share.invite, fr.share.list]
ui:
  intent: >-
    The collaborator list is a page section with its own heading, never a card; one collaborator is one plain list item, per COLLECTION-1. The representative direction is drawn for the refused state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: invite, route: /tasks/:taskId/share, purpose: "invite collaborators and manage their access", actors: [owner]}
  states:
    - {name: empty, trigger: "no invitations exist yet", behavior: "only the invite form is shown, no collaborator list section"}
    - {name: inviting, trigger: "invite submitted, response pending", behavior: "the invite GrammarButton is disabled and shows a busy label"}
    - {name: pending-list, trigger: "one or more invitations are outstanding", behavior: "the collaborator list section renders with a heading; pending rows show role and a revoke GrammarButton"}
    - {name: accepted, trigger: "a collaborator has accepted", behavior: "that row's status changes from pending to accepted; revoke remains available"}
    - {name: refused, trigger: "the invite is rejected, for example inviting an existing collaborator twice", behavior: "a GrammarMessage(tone: danger) appears beside the invite form; the collaborator list is unchanged"}
  coverage:
    scale: bounded
    representativeScreens: [invite]
    map:
      - {screen: invite, state: empty, viewport: desktop-1280, components: ["GrammarTextField (invitee email)", "GrammarButton (invite / revoke)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (invitee email), GrammarButton (invite / revoke), GrammarMessage (tone: danger, refused only) anatomy; only the invite form is shown, no collaborator list section."}
      - {screen: invite, state: inviting, viewport: desktop-1280, components: ["GrammarTextField (invitee email)", "GrammarButton (invite / revoke)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (invitee email), GrammarButton (invite / revoke), GrammarMessage (tone: danger, refused only) anatomy; the invite GrammarButton is disabled and shows a busy label."}
      - {screen: invite, state: pending-list, viewport: desktop-1280, components: ["GrammarTextField (invitee email)", "GrammarButton (invite / revoke)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (invitee email), GrammarButton (invite / revoke), GrammarMessage (tone: danger, refused only) anatomy; the collaborator list section renders with a heading; pending rows show role and a revoke GrammarButton."}
      - {screen: invite, state: accepted, viewport: desktop-1280, components: ["GrammarTextField (invitee email)", "GrammarButton (invite / revoke)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the refused representative direction: same GrammarTextField (invitee email), GrammarButton (invite / revoke), GrammarMessage (tone: danger, refused only) anatomy; that row's status changes from pending to accepted; revoke remains available."}
      - {screen: invite, state: refused, viewport: desktop-1280, components: ["GrammarTextField (invitee email)", "GrammarButton (invite / revoke)", "GrammarMessage (tone: danger, refused only)"], derivation: "Representative direction; generated by interface.draw once gap.share.direction-not-drawn closes.", directionAsset: assets/invite-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.share.direction-not-drawn.
assets:
  - path: assets/invite-refused.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
  - path: assets/invite-refused.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/invite-refused.prompt.txt
      inputRefs: [ui.share.invite, fr.share.invite, fr.share.list, brand]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
      capturedAt: "2026-09-18T06:03:06.7117127Z"
blockedBy:
