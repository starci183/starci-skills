          - NavigationFeatureNav (identity, navigation, navigationLabel, compactNavigationTrigger,
            compactNavigationTriggerLabel, actions)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "SurfaceCard (ariaLabel: Invite collaborators)"
          - "Input (id: invite-email, kind: email)"
          - "Button (invite, type: submit, variant: primary)"
          - native labelled radio group (viewer/editor; no fabricated Grammar Select)
        derivation: Derives from refused with the same workspace shell. only the invite form is shown, no
          collaborator list section. Preserve the referenced Input/Button geometry and any mapped
          raised SurfaceCard at this viewport.
