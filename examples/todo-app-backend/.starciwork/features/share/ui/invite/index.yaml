  accessibility:
    - Keyboard order follows visual and DOM order; all control names remain visible.
    - "Text(live: assertive) announces refusal; plain foreground copy, no invented Message/Alert
      export."
    - Exactly one main landmark; navigation has a name; focus remains visible and returns to the
      action after a dismissed confirmation.
    - Decorative turtle uses empty alt text; the adjacent copy supplies meaning.
    - Preserve actual component foreground/state styling, including white primary labels; measure
      composed browser contrast in implementation. The old black-label prescription is superseded by
      ADDENDUM 2; this generated direction certifies no contrast pass.
    - Destructive actions use the real outline variant with explicit consequence copy and
      confirmation; do not invent a danger Button prop or custom outline.
  responsive:
    - "desktop-1280: WorkspaceShell header and primary slots; heading, content and footer remain
      within readable page measure."
    - "mobile-390: WorkspaceShell compactHeader and compactNavigation own the compact shell; include
      all four destinations and account access. Form fields stack and row actions wrap without
      hiding controls or horizontal page scrolling."
  artworkSlots: []
  observations:
    - Grey invalid secondary field with actual label/error treatment, white Send invitation label,
      neutral Revoke buttons and reference-backed collection shell.
    - image_gen.imagegen generated this proposed direction; actual component render references are
      separate inputs, not a claim this PNG is a running product.
    - All on-surface Input controls explicitly use the real secondary variant. Primary white ink,
      secondary blue ink and neutral outline actions follow current captures.
    - Current selected sources supersede historical .initial/.v4/.anatomy-initial assets; those
      files remain history only and are not accepted current anatomy.
  gaps:
    - code: THEME_IMPLEMENTATION_REQUIRED
      detail: Activate the accepted Grammar family and load Inter during implementation; preserve stock
        component styling and secondary nested Input variants. No black-label or custom
        disabled/error theme patch is requested.
    - code: KNOWLEDGE_RENDERER_CONFLICT
      detail: COLLECTION-1 cases 1-4 and COLLECTION-2 prohibit an enclosing card, but @starci/grammar
        0.4.13 SurfaceListCard actually renders a raised shell around its rows. The coordinator
        addendum explicitly requires this shipped anatomy. Preserve the external section label/fact
        and footer; use the published collection owner without an extra SurfaceCard or per-row
        cards. This is a documented knowledge/renderer conflict, not a claimed pass of those
        contradictory cases.
    - code: BRAND_ANATOMY_SPEC_DIFFERENCE
      detail: ADDENDUM 2 explicitly requires white primary label ink and actual component anatomy. This
        supersedes earlier agent-derived black label, dark Input-error, custom disabled,
        danger-outline and auth-card treatments. Brand rev 3 stays byte-identical; its conflicting
        foreground/contrast prescriptions are recorded as unresolved specification differences, not
        used to recolour component internals. No accessibility contrast pass is claimed.
