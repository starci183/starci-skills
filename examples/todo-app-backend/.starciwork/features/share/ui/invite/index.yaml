ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The invitation screen and the collaborator list. The representative
    state is refused.
  surfaces:
    - name: invite
      route: /tasks/:taskId/share
      purpose: invite collaborators and manage their access
      actors:
        - owner
  states:
    - name: empty
      trigger: no invitations exist yet
      behavior: only the invite form is shown, no collaborator list section
    - name: inviting
      trigger: invite submitted, response pending
      behavior: the invite Button is disabled and shows a busy label
    - name: pending-list
      trigger: one or more invitations are outstanding
      behavior: the collaborator list section renders with a heading; pending rows show role and a revoke
        Button
    - name: accepted
      trigger: a collaborator has accepted
      behavior: that row's status changes from pending to accepted; revoke remains available
    - name: refused
      trigger: Invalid email or role is refused
      behavior: Retain entered email and viewer/editor choice, show field error and assertive Text, keep
        existing collaborator rows unchanged.
