schema: work/data
id: data.share.invitation
title: Invitation
state: done
fields:
  - {name: id, type: text, required: true, note: "Opaque, assigned at invite, never reused."}
  - {name: taskId, type: text, required: true, note: Bound at invite and never rewritten.}
  - {name: ownerId, type: text, required: true, note: The person who sent the invitation.}
  - {name: email, type: text, required: true, note: The invited person's address; not yet a personId.}
  - {name: role, type: text, required: true, note: "One of: viewer, editor."}
  - {name: status, type: text, required: true, default: pending, note: "One of: pending, accepted, expired, revoked. Computed at read time for expiry; written directly for accept and revoke."}
  - {name: sentAt, type: timestamp, required: true}
  - {name: acceptedAt, type: timestamp, required: false}
  - {name: revokedAt, type: timestamp, required: false}
  - {name: personId, type: text, required: false, note: "Null until accepted, then the accepting actor's
      own personId (contract.login.identity-for-task's opaque id, never an email). Bound the moment
      accept succeeds and cleared the moment revoke succeeds; it is what
      contract.share.completion-guard-for-task's mayComplete matches against, since the session seam
      resolves only {personId}, never an email - see impl.share.todo-app-backend.invitations for why the
      accept flow still needs a self-declared email to authorize that one bind."}
invariants:
  - status is pending, accepted, expired or revoked, and never anything else.
  - acceptedAt is set if and only if status has ever been accepted.
  - Once status is expired or revoked, it never returns to pending or accepted.
  - Exactly one row exists per (taskId, email) pair at a time.
  - personId is set if and only if status is accepted or was once accepted before being revoked.
refs: [br.share.invite.expiry, br.share.revoke.on-read, br.share.role.permissions]
change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T16:00:00.000Z
  reason: impl.share.todo-app-backend.invitations needed a real field to bind an accepted invitation to
    the actor who is allowed to act as that collaborator on every later call, since
    contract.login.identity-for-task's session seam resolves only {personId} and never an email. This
    adds personId; it withdraws nothing this record declared before.