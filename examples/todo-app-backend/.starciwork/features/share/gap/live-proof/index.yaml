schema: work/gap@1
id: gap.share.live-proof
title: The share collaboration loop has no invitee-side product surface for a uat.verify run to walk
state: todo
statement: >-
  uat.share.invite-and-collaborate now has a real implemented spec and two real run folders
  (runs/20260919T142631Z-5c10a673, runs/20260919T142709Z-5c10a673) with screens, video and an honest
  partial-pass result.md - but it can never reach pass, because the product has no invitee-side
  surface at all. Precisely: (a) nothing delivers an invitation to the invited person -
  InviteHandler publishes no event and no email is sent; (b) no route under src/app, no inbox and no
  GraphQL query lets an unbound invitee learn its invitationId - collaborators(taskId) returns [] to
  them (InvitationService.listFor requires owner or bound personId); (c) no acceptInvitation call
  exists anywhere in the frontend src/, so no UI can perform fr.share.accept; (d) the tasks query is
  ownership-only, so even a bound collaborator never sees the shared task and has no complete/read
  affordance. The owner-side legs are proven live by the run (invite x2 pending, revoke-pending,
  cleanup by recorded id). Secondary constraint - the realm seeds only two accounts
  (demo@todo.dev, demo2@todo.dev), so the record's "third person" viewer leg has no sign-in-able
  identity even if the surface existed; a disposable third user is allowed by
  environment.todo-app.dev's allowedEffects but unblocks nothing while (a)-(d) stand.
closedBy: uat.share.invite-and-collaborate
