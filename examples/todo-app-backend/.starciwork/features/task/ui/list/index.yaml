  interactions:
    - Add submits a nonempty title; action owns pending and failure; no optimistic successful write
      claim.
    - Checkbox toggles completion; accessible row label names the task.
    - Delete asks a concise inline confirmation naming the task, then exposes stock outline Delete
      and secondary Cancel; use explicit consequence copy and the captured outline variant for the
      destructive commit.
  anatomyReview:
    reviewer: codex
    reviewedAt: 2026-09-18T14:41:21.685Z
    formula: direction = real-render(anatomy) + brand(surface) + composition(intent)
    comparison: all seven selected directions compared before regeneration
    before: White nested field, black primary label, custom danger outlines and larger component scale.
    after: Reference-scale shell, grey composer input, white Add task label, neutral Delete outline and
      raised list body with external label/count/footer.
    reviewPath: assets/visual-review.md
    authorityResolution: ADDENDUM 2 explicitly requires white primary label ink and actual component
      anatomy. This supersedes earlier agent-derived black label, dark Input-error, custom disabled,
      danger-outline and auth-card treatments. Brand rev 3 stays byte-identical; its conflicting
      foreground/contrast prescriptions are recorded as unresolved specification differences, not
      used to recolour component internals. No accessibility contrast pass is claimed.
    referenceLimits: "The new empty-state.png shows shell, heading, zero count and a blank raised list
      body. It does not visibly show EmptyNotice content, turtle or composer. StaticStateRow and
      Progress are not rendered by this four-image set. Those names no longer claim a proven visual
