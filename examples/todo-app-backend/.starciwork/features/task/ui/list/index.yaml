schema: work/ui-screen
id: ui.task.list
title: The task list and its create form
state: done
brand: {rev: 2}
refs: [fr.task.create]
ui:
  intent: >-
    A product page with a concise create region followed by one collection surface. Tasks are rows in a
    SurfaceListCard, never a card per task. The many-tasks state is representative because it proves the
    collection hierarchy, row rhythm, completion controls and named delete actions together.
  surfaces:
    - name: list
      route: /tasks
      purpose: create tasks and see the owner's own list
      actors: [owner]
  states:
    - {name: empty, trigger: "no owned task exists", behavior: "the create region remains and an EmptyNotice replaces task rows"}
    - {name: one-task, trigger: "one owned task exists", behavior: "one collection row shows completion, title and a named delete action"}
    - {name: many-tasks, trigger: "multiple owned tasks exist", behavior: "one SurfaceListCard contains repeated task rows with consistent alignment"}
    - {name: refused, trigger: "creation is refused such as for an empty title", behavior: "the create Input owns the correction message and the existing collection remains unchanged"}
  coverage:
    scale: bounded
    representativeScreens: [list]
    map:
      - {screen: list, state: empty, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, EmptyNotice], derivation: "Replace the collection rows with one empty notice; mobile stacks input and action."}
      - {screen: list, state: one-task, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard], derivation: "Use one application-owned row in the same collection; mobile wraps title before row action."}
      - {screen: list, state: many-tasks, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard], derivation: "Representative generated direction; mobile preserves create then collection order.", directionAsset: assets/list-many-tasks.png}
      - {screen: list, state: refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Input, Button, SurfaceListCard], derivation: "Apply Input isError and errorMessage locally while keeping the existing list stable."}
  accessibility:
    - The create Input has a persistent label and owns its correctable error message.
    - Each native completion checkbox has a task-specific label; Delete is always text-labelled.
    - Keyboard order follows heading, create controls, then rows from top to bottom.
  responsive:
    - desktop-1280 aligns create and collection regions; mobile-390 stacks create controls and lets rows wrap without clipping.
    - Titles wrap before row actions and no task control becomes icon-only.
  artworkSlots: []
  observations:
    - "Installed Common proves SurfaceCard for the create region and SurfaceListCard for the collection; application code owns each row."
    - "Collection knowledge requires one section container and forbids a card per task."
    - "The image is proposed direction only and is not a screenshot or proof of exact runtime behavior."
  gaps:
    - "Common has no destructive Button variant; Delete remains a weak labelled outline or ghost action until a destructive treatment is specified."
  assets:
    - path: assets/list-many-tasks.prompt.txt
      role: prompt
    - path: assets/list-many-tasks.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/list-many-tasks.prompt.txt
        inputRefs: [ui.task.list, fr.task.create, br.task.title.required, sds.task.ownership-guard, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
assets:
  - path: assets/list-many-tasks.prompt.txt
    role: prompt
    provenance: exact prompt retained from the image generation run
  - path: assets/list-many-tasks.png
    role: direction
    generation:
      tool: image_gen.imagegen
      promptPath: assets/list-many-tasks.prompt.txt
      inputRefs: [ui.task.list, fr.task.create, br.task.title.required, sds.task.ownership-guard, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
    provenance:
      actor: codex
      profile: gpt-5.6-sol
