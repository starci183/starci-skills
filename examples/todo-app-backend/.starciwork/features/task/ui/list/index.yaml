schema: work/ui-screen
id: ui.task.list
title: The task list and its create form
state: done
brand:
  rev: 3
refs:
  - fr.task.create
ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The task list and its create form. The representative state is
    many-tasks.
  surfaces:
    - name: list
      route: /tasks
      purpose: create tasks and see the owner's own list
      actors:
        - owner
  states:
    - name: empty
      trigger: first paint, or every task has been deleted
      behavior: Keep shell and add form. Replace rows with the turtle master and No tasks yet. Add the
        first one. No delete controls exist in this state.
    - name: one-task
      trigger: exactly one task exists
      behavior: the create form renders above a single row with its own completion checkbox, title and
        delete action
    - name: many-tasks
      trigger: two or more tasks exist
      behavior: the create form renders above multiple rows, each with its own completion checkbox, title
        and delete action
    - name: refused
      trigger: Task-list read is refused
      behavior: Keep the shell, navigation and heading. The current block replaces form/list with
        assertive-live refusal; do not claim a successful empty list.
  coverage:
    scale: bounded
    representativeScreens:
      - list
    map:
      - screen: list
        state: empty
        viewport: desktop-1280
        components:
          - WorkspaceShell (header, primary, primaryLabel, compactHeader, compactNavigation)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "Input (id: new-task-title, label: New task)"
          - "Button (type: submit, variant: primary, create)"
          - "Text (tone: muted, 'No tasks yet. Add the first one.')"
          - "SurfaceListCard (label: All tasks; separate page section)"
          - MediaFrame (brand turtle master, decorative)
        derivation: Derives from many-tasks with the same workspace shell. Keep shell and add form. Replace
          rows with the turtle master and No tasks yet. Add the first one. No delete controls exist
          in this state.
