  interactions:
    - Add submits a nonempty title; action owns pending and failure; no optimistic successful write
      claim.
    - Checkbox toggles completion; accessible row label names the task.
    - Delete asks a concise inline confirmation naming the task, then exposes danger Delete and
      secondary Cancel; never use blue for the destructive commit.
