  accessibility:
    - Keyboard order follows visual and DOM order; all control names remain visible.
    - "Text(live: assertive) announces refusal; plain foreground copy, no invented Message/Alert
      export."
    - "Primary labels use installed --color-black on #2F6BFF (unrounded contrast 4.667946:1);
      white-on-primary is prohibited."
    - Danger outline/edge communicates destructive consequence alongside a visible action verb; dark
      labels remain legible.
    - Exactly one main landmark; navigation has a name; focus remains visible and returns to the
      action after a dismissed confirmation.
    - Decorative turtle uses empty alt text; the adjacent copy supplies meaning.
  responsive:
    - "desktop-1280: WorkspaceShell header and primary slots; heading, content and footer remain
      within readable page measure."
    - "mobile-390: WorkspaceShell compactHeader and compactNavigation own the compact shell; include
      all four destinations and account access. Form fields stack and row actions wrap without
      hiding controls or horizontal page scrolling."
  artworkSlots:
    - id: empty-turtle
      screen: list
      states:
        - empty
      master:
        record: brand
        path: assets/turtle-master.png
      placement: Inside the empty SurfaceListCard body as a decorative MediaFrame sibling of EmptyNotice,
        outside the separate composer; no rows/delete controls exist.
      decorative: true
      status: derived state; use master bytes during implementation
  observations:
    - Direction is an ImageGen design input, not a running-product capture, exact Grammar rendering,
      interaction or API proof.
    - Read brand/index.yaml rev 3 for palette and master provenance; generated colours and glyphs
      are approximate until implementation uses the exact CSS tokens.
    - Raised composer card and one rounded raised SurfaceListCard enclosing all four rows; external
      All tasks / 4 tasks header and external footer; pill actions; no mascot in populated state.
    - Compared all mapped components against actual supplied renders and installed source. See
      assets/visual-review.md for component-level decisions and remaining coverage limits.
  gaps:
    - code: THEME_IMPLEMENTATION_REQUIRED
      detail: Only the accent override is wired here. Activate the accepted Core token vocabulary, load
        Inter and supply black primary-label ink in a separately authorized implementation.
    - code: GRAMMAR_REQUIRED
      detail: Installed ButtonVariant has no danger variant. Delete/revoke/erasure/end-rule danger
        direction requires a Grammar-owned capability; no invented prop or app-local red is
        authorized.
    - code: KNOWLEDGE_RENDERER_CONFLICT
      detail: COLLECTION-1 cases 1-4 and COLLECTION-2 prohibit an enclosing card, but @starci/grammar
        0.4.13 SurfaceListCard actually renders a raised shell around its rows. The coordinator
        addendum explicitly requires this shipped anatomy. Preserve the external section label/fact
        and footer; use the published collection owner without an extra SurfaceCard or per-row
        cards. This is a documented knowledge/renderer conflict, not a claimed pass of those
        contradictory cases.
  status: reviewed-proposed-direction
