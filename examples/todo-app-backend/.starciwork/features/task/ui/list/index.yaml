        state: empty
        viewport: desktop-1280
        components:
          - WorkspaceShell (header, primary, primaryLabel, compactHeader, compactNavigation)
          - NavigationFeatureNav (identity, navigation, navigationLabel, compactNavigationTrigger,
            compactNavigationTriggerLabel, actions)
          - TextAction (href, actual destination)
          - "Text (synthetic account presence: Alex)"
          - "Input (id: new-task-title, label: New task)"
          - "Button (type: submit, variant: primary, create)"
          - "Text (tone: muted, 'No tasks yet. Add the first one.')"
          - "SurfaceListCard (label: All tasks, fact: task count; raised white body encloses all
            rows; footer outside below)"
          - MediaFrame (brand turtle master, decorative)
          - "SurfaceCard (ariaLabel: New task; bounded raised composer around label, Input and add
            Button)"
          - "EmptyNotice (message: No tasks yet. Add the first one.; inside SurfaceListCard body,
            with decorative MediaFrame sibling)"
        derivation: Derives from many-tasks with the same workspace shell. Keep shell and add form. Replace
          rows with the turtle master and No tasks yet. Add the first one. No delete controls exist
          in this state. Preserve the referenced Input/Button geometry and any mapped raised
          SurfaceCard at this viewport. Keep label/fact above the shared raised row body and footer
