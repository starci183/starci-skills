schema: work/ui-screen
id: ui.task.list
title: The task list and its create form
state: todo
brand: {rev: 2}
refs: [fr.task.create]
ui:
  intent: >-
    The list is a page section with its own heading, never wrapped in a card (COLLECTION-1); one row is one plain list item. The representative direction is drawn for the many-tasks state because it
    combines the densest actual Grammar anatomy this screen uses and, where the state is an error/refusal,
    the accessibility-critical GrammarMessage(tone: danger, role=alert) and the brand's contrast don't
    (Never place text on the primary colour below a 4.5:1 contrast ratio.).
  surfaces:
    - {name: list, route: /tasks, purpose: "see and create owned tasks", actors: [owner]}
  states:
    - {name: empty, trigger: "the owner has no tasks yet", behavior: "the create form is shown above an empty-state sentence, no list section is rendered"}
    - {name: one-task, trigger: "exactly one task exists", behavior: "the list section renders with a heading and a single row"}
    - {name: many-tasks, trigger: "more than one task exists", behavior: "the list section renders with a heading and every row stacked; each row is a plain list item, never a card, per COLLECTION-1"}
    - {name: refused, trigger: "create is rejected, for example an empty title", behavior: "a GrammarMessage(tone: danger) appears beside the create form; the list below is unchanged"}
  coverage:
    scale: bounded
    representativeScreens: [list]
    map:
      - {screen: list, state: empty, viewport: desktop-1280, components: ["GrammarTextField (title)", "GrammarButton (type: submit, create)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the many-tasks representative direction: same GrammarTextField (title), GrammarButton (type: submit, create), GrammarMessage (tone: danger, refused only) anatomy; the create form is shown above an empty-state sentence, no list section is rendered."}
      - {screen: list, state: one-task, viewport: desktop-1280, components: ["GrammarTextField (title)", "GrammarButton (type: submit, create)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the many-tasks representative direction: same GrammarTextField (title), GrammarButton (type: submit, create), GrammarMessage (tone: danger, refused only) anatomy; the list section renders with a heading and a single row."}
      - {screen: list, state: many-tasks, viewport: desktop-1280, components: ["GrammarTextField (title)", "GrammarButton (type: submit, create)", "GrammarMessage (tone: danger, refused only)"], derivation: "Representative direction; generated by interface.draw once gap.task.direction-not-drawn closes.", directionAsset: assets/list-many-tasks.png}
      - {screen: list, state: refused, viewport: desktop-1280, components: ["GrammarTextField (title)", "GrammarButton (type: submit, create)", "GrammarMessage (tone: danger, refused only)"], derivation: "Derives from the many-tasks representative direction: same GrammarTextField (title), GrammarButton (type: submit, create), GrammarMessage (tone: danger, refused only) anatomy; a GrammarMessage(tone: danger) appears beside the create form; the list below is unchanged."}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - GrammarMessage(tone: danger) carries role=alert and is announced without requiring focus.
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps:
    - No direction has been generated yet; drawing is deferred to gap.task.direction-not-drawn.
assets:
  - path: assets/list-many-tasks.prompt.txt
    role: prompt
    provenance: authored-prompt-awaiting-interface.draw
blockedBy:
  - {record: gap.task.direction-not-drawn, because: "interface.draw has not run for this screen; no built-in image_gen.imagegen invocation has produced the many-tasks representative direction or its sibling prompt bytes yet, only the prompt this record's assets entry names."}
