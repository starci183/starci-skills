schema: work/gap@1
id: gap.task.collaborator-completion
title: The collaborator completion path is not implemented
state: done
statement: "br.task.single-owner rev 2 split completion (owner or an accepted editor collaborator) from
  deletion (owner only), naming contract.share.completion-guard-for-task as the boundary that call goes
  through. Neither side of that contract exists yet - share has not built the guard
  (gap.share.unbuilt-module), and task's own ownership guard (sds.task.ownership-guard) has not been
  rebuilt to call it, still only knowing t-owner/t-stranger, not t-collaborator. Until
  impl.share.todo-app-backend.access exists and sds.task.ownership-guard is rebuilt against it, an editor
  collaborator completing a shared task is a specified path with no implementation, which is the one fact
  br.task.single-owner, sds.task.ownership-guard and fr.task.complete were each independently citing each
  other over before this record gave it one name."
closedBy: [impl.share.todo-app-backend.access]
verificationSource: authored-claim
because: "closedBy's impl.share.todo-app-backend.access is done: ShareCompletionAuthority is a real
  CompletionAuthority subclass, registered into task's own (unmodified) CompletionAuthorityRegistry
  through the sanctioned seam (task.module.ts's registry export, consumed from
  ShareCompletionAuthoritySetup.onModuleInit) - task's side of that seam already existed and was already
  tested (bussiness/task/completion-authority.spec.ts's 'a registered widened authority lets a non-owner
  complete/reopen' predates this lane). completion-authority.spec.ts and scripts/live-proof-share.sh both
  prove an accepted editor collaborator can complete/reopen a shared task while delete stays refused.
  This closes the specific absence this gap named (no implementation on either side); it does not itself
  re-prove sds.task.ownership-guard or set fr.task.complete to done - both remain for lane login-impl/task
  to re-run from their own composed rules, per this lane's brief, and br.task.single-owner/its evidence
  are left untouched."
change: {rev: 2, kind: clarifying, at: 2026-09-18T16:00:00.000Z}
