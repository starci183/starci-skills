schema: work/business-rule@1
id: br.task.complete.once
title: Completing a task twice changes nothing
state: done
statements:
  - Completing a task that is already complete leaves it unchanged and is not an error.
  - The owner may reopen a task they completed.
acceptance:
  - id: ac.task.complete.once.is-idempotent
    given: A task already complete
    when: It is completed again
    then:
      - The task is unchanged.
      - The response is success, not an error.
  - id: ac.task.complete.once.is-reversible
    given: A task the owner completed
    when: The owner reopens it
    then:
      - The task reads incomplete.
      - Its completion timestamp is cleared.
module: [src/modules/bussiness/task]
change:
