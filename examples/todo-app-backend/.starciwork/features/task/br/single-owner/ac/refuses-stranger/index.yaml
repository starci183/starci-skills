schema: work/acceptance-criterion
id: ac.task.single-owner.refuses-stranger
rule: br.task.single-owner
given: A task exists with an owner
when: Somebody who is neither the owner nor an accepted editor collaborator attempts to complete or delete
  it, or an accepted editor collaborator attempts to delete it
then:
  - The attempt is refused.
  - The task is unchanged, now and after a restart.
