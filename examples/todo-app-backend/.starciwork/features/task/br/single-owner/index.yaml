schema: work/business-rule
id: br.task.single-owner
title: A task has exactly one owner
state: todo
statements:
  - A task belongs to exactly one person, who is its owner and never changes.
  - Only the owner may delete a task; sharing grants no role that authorizes deletion.
  - The owner may always complete their own task; an accepted editor collaborator may also complete it,
    per br.share.role.permissions and contract.share.completion-guard-for-task.
authorityRefs:
  - "owner-intent: One person's list is private to them; sharing is a later product, not a default."
acceptanceCriteria: [refuses-stranger]
module: [src/modules/bussiness/task]
change:
  rev: 3
  kind: editorial
  at: 2026-09-18T11:30:00.000Z
  retains:
    - A task belongs to exactly one person, who is its owner and never changes.
    - Only the owner may delete a task; sharing grants no role that authorizes deletion.
    - The owner may always complete their own task; an accepted editor collaborator may also complete it, per br.share.role.permissions and contract.share.completion-guard-for-task.
  reason: >-
    Removed the blockedBy edge on gap.task.collaborator-completion. That gap reached done at rev 2, closed
    by impl.share.todo-app-backend.access, whose ShareCompletionAuthority really does register into task's
    own CompletionAuthorityRegistry - so the absence the edge named no longer exists, and citing it further
    is exactly the stale blocker this layout refuses ("a blocker whose target has since reached done ... the
    thing that was supposed to unblock it has happened"). Nothing else moved: this rev withdraws no
    statement and retains all three rev-2 statements verbatim, listed above, so the change this record's
    evidence is stale since remains precisely rev 2's breaking split - the withdrawal of "A task belongs to
    exactly one person, and only that person may complete or delete it." in favour of the separate
    owner-only-delete and owner-or-accepted-editor-complete statements retained here. The record stays
    state: todo: a resolved blocker is not a proof. What still keeps it from done is its own evidence.yaml,
    whose single run proves the unchanged delete half and the stranger-negative part of the complete half
    and never exercises the accepted-editor arm; no run has yet re-proven this rule through
    contract.share.completion-guard-for-task. That remaining wait is deliberately not authored as a
    blockedBy edge here: contract.share.completion-guard-for-task and fr.task.complete each already name
    this rule in their own blockedBy, so an edge back to either one would be the BLOCKER_CYCLE this same
    gate refuses (grit ledger item 31's ring, closed once by gap.task.collaborator-completion and not to be
    reopened by a citation). The stale evidence beside this record is where that fact lives.
