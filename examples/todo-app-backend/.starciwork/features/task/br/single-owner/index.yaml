schema: work/business-rule
id: br.task.single-owner
title: A task has exactly one owner
state: todo
statements:
  - A task belongs to exactly one person, who is its owner and never changes.
  - Only the owner may delete a task; sharing grants no role that authorizes deletion.
  - The owner may always complete their own task; an accepted editor collaborator may also complete it,
    per br.share.role.permissions and contract.share.completion-guard-for-task.
authorityRefs:
  - "owner-intent: One person's list is private to them; sharing is a later product, not a default."
acceptanceCriteria: [refuses-stranger]
module: [src/modules/bussiness/task]
change:
  rev: 2
  kind: breaking
  at: 2026-09-18T06:20:00.000Z
  withdraws: ["A task belongs to exactly one person, and only that person may complete or delete it."]
  reason: The share feature lets an owner grant an editor collaborator the right to complete a task the
    owner still exclusively owns and can still exclusively delete. The withdrawn clause conflated
    ownership (unchanged) with sole authority to complete (now shared with an accepted editor), so it no
    longer describes the product. Delete stays owner-only exactly as before; only the complete half moved,
    and it moved into a contract this record now names instead of re-describing.
blockedBy:
  - {record: gap.task.share-edge-hold, because: "The proof of the rev-2 split now exists and this record's
    evidence.yaml carries it (stranger refused on complete/reopen/delete; owner passes both guards; an
    accepted editor completes via the real ShareCompletionAuthority and is still refused delete -
    share/completion-authority.spec.ts). What still holds the state at todo is mechanical, not evidential:
    contract.share.completion-guard-for-task's own blockedBy still cites this record at rev 2, so marking
    this rule done would refuse that (out-of-lane) record as carrying a stale blocker. gap.task.share-edge-hold
    names that absence; the share lane retiring its edge unblocks this record with no further task-lane work."}
# The old edge onto gap.task.collaborator-completion is dropped: the gap is done (lane be-share), the
# layout refuses a blockedBy citing a done record, and the edge's own text ("no implementation yet") is
# false against the current tree - ShareCompletionAuthority registers into task's
# CompletionAuthorityRegistry at boot (share.module.ts, ShareCompletionAuthoritySetup.onModuleInit).
# The task-side tests this rule's AC names are green; the residual hold is recorded on
# gap.task.share-edge-hold instead of restated here.
