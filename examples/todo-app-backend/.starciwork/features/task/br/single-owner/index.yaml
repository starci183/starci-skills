schema: work/business-rule@1
id: br.task.single-owner
title: A task has exactly one owner
state: todo
statements:
  - A task belongs to exactly one person, who is its owner and never changes.
  - Only the owner may delete a task; sharing grants no role that authorizes deletion.
  - The owner may always complete their own task; an accepted editor collaborator may also complete it,
    per br.share.role.permissions and contract.share.completion-guard-for-task.
authorityRefs:
  - "owner-intent: One person's list is private to them; sharing is a later product, not a default."
acceptance:
  - id: ac.task.single-owner.refuses-stranger
    given: A task exists with an owner
    when: Somebody who is neither the owner nor an accepted editor collaborator attempts to complete or
      delete it, or an accepted editor collaborator attempts to delete it
    then:
      - The attempt is refused.
      - The task is unchanged, now and after a restart.
module: [src/modules/bussiness/task]
blockedBy:
  - {record: gap.task.single-owner-editor-arm, because: "The rule's own evidence.yaml is stale: true over exactly this absence - its one captured run proves the delete half and the stranger negatives but never exercises the accepted-editor complete arm, and contract.share.completion-guard-for-task's provider/consumer proof is still todo. The gap names that absence."}
change:
  rev: 5
  kind: editorial
  at: 2026-09-19T15:59:33.966Z
  retains:
    - A task belongs to exactly one person, who is its owner and never changes.
    - Only the owner may delete a task; sharing grants no role that authorizes deletion.
    - The owner may always complete their own task; an accepted editor collaborator may also complete it, per br.share.role.permissions and contract.share.completion-guard-for-task.
  reason: >-
    Rev 3 left the remaining wait unedged on purpose: the only namable targets then were
    contract.share.completion-guard-for-task and fr.task.complete, both of which already name this rule
    in their own blockedBy, so an edge back to either one would have been the BLOCKER_CYCLE this gate
    refuses (grit ledger item 31's ring). The edges lane has since authored the absence itself as
    gap.task.single-owner-editor-arm, and an edge to a terminal gap cannot cycle - so the wait is now
    written where it belongs: this rule is todo until a captured run exercises the accepted-editor arm.
    Authoring it also retires the BLOCKER_UNROOTED warning on all four chains that dead-ended here -
    fr.task.complete, fr.task.delete, contract.share.completion-guard-for-task and
    journey.notify.told-about-completion now root at the gap through this edge. No statement moved;
    retains lists all three verbatim, so the staleness this record's evidence carries remains rev 2's
    breaking split plus the missing editor-arm proof, unchanged.

    rev 5 (v11 ac-collapse) - acceptanceCriteria renamed to acceptance and now carries each criterion's id, given, when and then inline from the retired ac/ sub-records; refs to the old ac ids remap to br.task.single-owner#<former-ac-id>. Encoding change only, no semantic change.
