schema: work/functional-requirement@1
id: fr.task.complete
title: Complete a task
state: todo
actors: [owner, collaborator]
trigger: The owner, or an accepted editor collaborator, marks a task complete.
mainFlow:
  - The actor names a task they own, or a task on which they hold an accepted editor invitation.
  - The task becomes complete.
exceptionFlows:
  - A task the actor neither owns nor holds an accepted editor invitation on is refused.
composes:
  - {rule: br.task.single-owner, module: src/modules/bussiness/task}
  - {rule: br.task.complete.once, module: src/modules/bussiness/task}
  - {rule: br.share.role.permissions, module: src/modules/bussiness/share}
refs: [contract.share.completion-guard-for-task]
blockedBy:
  - {record: br.task.single-owner, rev: 4, because: "br.task.single-owner is still todo at rev 4: its evidence.yaml is stale: true - the captured run proves the delete half and the stranger negatives but never exercises the accepted-editor complete arm this flow composes (that absence is now named by gap.task.single-owner-editor-arm, which the rule's own blockedBy points at). A composed flow does not outrun a rule that is not yet done."}
  # gap.task.collaborator-completion closed (lane be-share): share's guard now exists and is tested
  # (impl.share.todo-app-backend.access, contract.share.completion-guard-for-task's provider half). This
  # flow's own call into it - through task's CompletionAuthorityRegistry seam - still needs its
  # composed proof re-run by lane login-impl/task (br.task.single-owner's edge above already covers why),
  # so this record stays blocked on the entry above rather than a third, now-resolved one.
# The blockedBy onto br.task.complete.once rev 2 is dropped: that rule is now done at rev 2, its
# reversible statement is proven (that was the edge's whole text), and the layout refuses an edge
# onto a done record. composes[].module paths were corrected to the real capability directories
# (src/modules/bussiness/task and src/modules/bussiness/share - the earlier src/modules/domain/task/**,
# src/features/complete-task/** and src/share/access.service.ts were pre-migration paths that never
# existed in this generation). What still keeps this flow todo is br.task.single-owner's held flag
# above, requiresProof.e2e (the command now names the real spec - task-lifecycle.e2e-spec.ts covers
# complete and reopen through the assembled stack, and task-isolation.e2e-spec.ts covers the stranger
# refusal - but no passing run is captured as evidence here yet), and requiresProof.uat (no uat.flow
# for completing a task exists under features/task/uat/** - uat.task.create is the only one, and its
# settled run walks create, not complete).

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/task/task-lifecycle.e2e-spec.ts
  uat:
    required: true
