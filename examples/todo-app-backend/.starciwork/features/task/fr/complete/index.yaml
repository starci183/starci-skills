schema: work/functional-requirement
id: fr.task.complete
title: Complete a task
state: todo
actors: [owner, collaborator]
trigger: The owner, or an accepted editor collaborator, marks a task complete.
mainFlow:
  - The actor names a task they own, or a task on which they hold an accepted editor invitation.
  - The task becomes complete.
exceptionFlows:
  - A task the actor neither owns nor holds an accepted editor invitation on is refused.
composes:
  - {rule: br.task.single-owner, module: src/modules/domain/task/**}
  - {rule: br.task.complete.once, module: src/features/complete-task/**}
  - {rule: br.share.role.permissions, module: src/share/access.service.ts}
refs: [contract.share.completion-guard-for-task]
blockedBy:
  - {record: br.task.complete.once, rev: 2, because: "br.task.complete.once is todo at rev 2; its reversible statement has no evidence yet."}
  - {record: br.task.single-owner, rev: 2, because: "br.task.single-owner is todo at rev 2; the split it made between complete and delete is not proven."}
  # gap.task.collaborator-completion closed (lane be-share): share's guard now exists and is tested
  # (impl.share.todo-app-backend.access, contract.share.completion-guard-for-task's provider half). This
  # flow's own call into it - through task's CompletionAuthorityRegistry seam - still needs its
  # composed proof re-run by lane login-impl/task (br.task.single-owner rev 2 above already covers why),
  # so this record stays blocked on the two entries above rather than a third, now-resolved one.

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- tasks/complete
  uat:
    required: true
