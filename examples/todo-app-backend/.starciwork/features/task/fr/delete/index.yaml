schema: work/functional-requirement@1
id: fr.task.delete
title: Delete a task
state: todo
actors: [owner]
trigger: The owner deletes one of their tasks.
mainFlow:
  - The owner names a task they own.
  - The task is removed; a later read of the same identifier resolves to nothing.
exceptionFlows:
  - A task the actor does not own is refused and nothing is removed - an accepted collaborator is
    refused the same as a stranger.
  - An identifier that names no task is refused and nothing is removed.
postconditions:
  - event.task.deleted is published, and only after the row is gone.
composes:
  - {rule: br.task.delete.final, module: src/modules/bussiness/task}
  - {rule: br.task.single-owner, module: src/modules/bussiness/task}
refs: [event.task.deleted]

blockedBy:
  - {record: br.task.single-owner, rev: 4, because: "br.task.single-owner is still todo at rev 4: its evidence proves the delete half this flow composes (only the owner may delete) but never re-proved the accepted-editor complete arm, so the rule record is held by stale evidence - that absence is named by gap.task.single-owner-editor-arm, which the rule's own blockedBy now points at. A composed flow does not outrun a rule that is not yet done - same edge fr.task.complete carries."}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: bash scripts/live-proof.sh
  uat:
    required: true

change: {rev: 1, kind: initial, at: 2026-09-19T00:00:00.000Z}

# The flow exists in code and had no record (v6-3 Q1): DeleteTaskResolver
# (src/features/todo/graphql/mutations/task/delete-task) resolves the session actor and dispatches
# DeleteTaskCommand to DeleteTaskHandler (src/modules/bussiness/task/delete-task.handler.ts), which calls
# TaskService.delete - findOwnedRow applies OwnershipGuard unconditionally, so only the owner ever deletes
# (br.task.single-owner's second statement; br.share.editor.no-delete's ac exercises the same single
# check), a missing row throws TaskNotFoundException, and TaskDeletedEvent is published after the row is
# gone.
#
# ac children are not authored here on purpose: the code's checkable enforcements are already named -
# ac.task.delete.final.stays-gone and ac.task.single-owner.refuses-stranger are both asserted by named
# tests in delete-task.handler.spec.ts, and br.share.editor.no-delete's ac.task.share.editor.no-delete.
# delete-refused-for-editor covers the collaborator arm. Inventing more criteria would restate them.
#
# requiresProof.e2e names the live-proof script, not a jest spec, because neither spec under
# src/tests/e2e/task/ performs an owner's delete: task-isolation.e2e-spec.ts exercises only the
# stranger-refusal half (deleteTask -> TASK_FORBIDDEN), while scripts/live-proof.sh runs the real
# deleteTask -> deleted:true -> absent-from-list sequence against an API built from this tree.
# requiresProof.uat stays unmet: no uat flow walks an owner's delete - uat.task.create's step 4 walks
# only the stranger-refusal arm ("the delete is refused"), and that flow is uat.task.create's evidence
# to carry, not this record's.
