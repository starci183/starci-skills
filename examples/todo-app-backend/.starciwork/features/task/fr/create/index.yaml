schema: work/functional-requirement
id: fr.task.create
title: Create a task
state: done
actors: [owner]
trigger: The owner submits a title.
mainFlow:
  - The owner submits a non-empty title.
  - The task is created, owned by the submitter, not complete.
exceptionFlows:
  - An empty title is refused and nothing is created.
postconditions:
  - Exactly one task exists for that submission.
composes:
  - {rule: br.task.single-owner, module: src/modules/domain/task/**}
  - {rule: br.task.title.required, module: src/features/create-task/**}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- tasks/create
  uat:
    required: true

# provenBy is written by starci-kernel from requiresProof and the provers' own proves edges.
# An agent-authored provenBy is refused: it would be this record speaking for another one.
provenBy:
  unit: [impl.task.todo-app-backend.ownership]
  e2e:
    - command: npm run test:e2e -- tasks/create
      exit: 0
      at: 6f1e4b7d
  uat: [uat.task.create]
