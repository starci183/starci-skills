schema: work/functional-requirement@1
id: fr.task.create
title: Create a task
state: done
actors: [owner]
trigger: The owner submits a title.
mainFlow:
  - The owner submits a non-empty title.
  - The task is created, owned by the submitter, not complete.
exceptionFlows:
  - An empty title is refused and nothing is created.
  - The person's effective plan has no room for one more active task - the create is refused before
    anything is written, and the refusal names the cap and the upgrade path (br.plan.caps.limit,
    enforced through contract.plan.create-precondition).
postconditions:
  - Exactly one task exists for that submission.
composes:
  - {rule: br.task.single-owner, module: src/modules/bussiness/task}
  - {rule: br.task.title.required, module: src/modules/bussiness/task}
  - {rule: br.plan.caps.limit, module: src/modules/bussiness/plan}
refs: [contract.plan.create-precondition]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/task/task-lifecycle.e2e-spec.ts
  uat:
    required: true

change: {rev: 1, kind: clarifying, at: 2026-09-19T12:00:00.000Z, reason: "The record's flow was spec-wrong about enforced behavior (v6-3 Q2-2): create-precondition.contract.spec.ts proves the real CreateTaskHandler calls TaskCreationPolicy.assertMayCreate before writing and propagates PlanCapExceededException - the plan-cap refusal has always been on this path, the flow just never said so. Added the cap exceptionFlow, the br.plan.caps.limit compose and the contract ref; nothing else moved. This resolves the tension contract.plan.create-precondition's conflictsWith declared - no policy decision was needed because code and contract already agreed and only this record lagged."}

