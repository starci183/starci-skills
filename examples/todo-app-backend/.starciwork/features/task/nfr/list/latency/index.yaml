schema: work/non-functional-requirement@1
id: nfr.task.list.latency
title: A list read feels immediate
quality: latency
state: todo
observableCriterion: The list endpoint answers in under 200 ms at the 95th percentile for a person with
  1000 tasks.
measurement:
  how: k6 run scripts/load/list.js with 1000 seeded tasks and 50 virtual users for 60 seconds
  threshold: p95 < 200ms
  environment: dev
refs: [br.task.list.owned]
blockedBy:
  - {record: gap.task.no-load-harness, because: "No scripts/load/list.js or k6 installation exists in this repository to run the measurement this record specifies."}
requiresProof:
  measurement:
    required: true

