# decision.task.list.scope is decided (owner-only: this product has no organization concept, so a
# list is unconditionally the reader's own tasks), which is exactly br.task.list.owned's own
# statement - now proven (named ac.task.list.owned.excludes-others test, plus the two-identity live
# scripts/live-proof.sh steps against an API built from this source tree), so this record no longer
# sits behind it. nfr.task.list.latency has been dropped from proves: this lane never measured a p95
# - there is no k6 harness on this host - and a done record claiming an unmeasured nfr is exactly
# the pattern the tree's own gate exists to refuse. The nfr stays todo on its own terms; nothing
# here pretends its number was observed. The provider half of contract.task.list-for-dashboard
# (TaskCountsQuery/TaskCountsHandler, counting through this record's own read path) is carried as an
# assertion in this record's evidence.yaml; the contract itself stays todo because its consumer half
# - a dashboard - has no record in any lane to do the reading with.
