# Shared like platform-database: this is the seam event.task.created/completed/deleted and
# event.login.signed-in/signed-out are typed against, and every producer (task's and login's use cases
# alike) depends on it. Recorded once, here under task, for the same reason platform-database is.
#
# Done, on the terms the old follow-up note laid out and the tree has since met: all three task events
# this record publishes into are themselves done now - event.task.created (producer fr.task.create
# done), event.task.completed and event.task.deleted (their blocker gaps were retired at rev 2 when
# the notify and audit subscribers landed and were proven in their own lanes, and this lane has now
# advanced the states with fresh publish+payload captures) - so `proves` claims three done product
# events a subscriber can rely on, not todo ones. The bus and every task call site were already real
# and unit-tested; the named event.* tests in task/{create,complete,delete}-task.handler.spec.ts are
# the captured assertions. Login's two events stay this module's declared-but-not-yet-state-advanced
# vocabulary, exactly as before: event.login.signed-in/signed-out are login lane's records to advance,
# and this flip says nothing about them.
proves: [event.task.created, event.task.completed, event.task.deleted]
