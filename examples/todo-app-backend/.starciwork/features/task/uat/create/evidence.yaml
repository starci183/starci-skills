# Written by hand (not scripts/example-evidence.mjs, which only proves unit/integration records
# against --assert commands and cannot emit the `run:` field a uat-flow needs): a uat-flow's evidence is
# the run itself - schemas/work-layout.yaml's uatRun note is what check-example-work.mjs's concept 12
# actually checks (a `run` field naming runs/<runId>, that run having screens/, videos/ and a result.md
# whose outcome is pass). Every byte named below was produced by the Playwright harness at
# examples/todo-app-frontend/uat, which wrote runs/<runId>/ itself; this file only settles which run.
schema: work/evidence
record: uat.task.create
recordDigest: 13376ae19d9698ca10a0d17638482626c150e267adf3074b19cf7d802c9c753a
run: runs/20260919T112844Z-5c10a673
outcome: pass
# The run's own manifest.yaml carries the full asset list with a sha256 per file; these lines repeat
# only the recording concept 12 refuses a done record for lacking, so the video is named by the record
# that settles on it and not only by a file inside the run it points at.
assets:
  - path: runs/20260919T112844Z-5c10a673/videos/create.webm
    sha256: 7f7a0acc77ae08ea11c69a40a56c73c3e24ee081d828a47bb85b8938936ace82
provenance:
  # Same actor caveat as uat.login.sign-in's evidence: neither starci-kernel nor example-evidence wrote
  # this file - the playwright harness produced the proof, so the actor names it (grit item 57).
  actor: playwright-harness
  tool: 'npx playwright test -c uat/playwright.config.ts uat.task.create.spec.ts (reporter uat/lib/run-writer.ts)'
  environment: local
  capturedAt: '2026-09-19T11:28:44.857Z'
  stack: >-
    A run-owned compose project (todo-uat-v7) booted for this lane from
    src/tests/infra/platform/stack/compose.e2e.yaml - the same file E2EStackService drives - pinned to
    the dev-convention ports: postgres:16 on 127.0.0.1:5432 (database todo, schema+seed mounted from
    .starcistacks/dev/seeds), keycloak 26.0 on 127.0.0.1:8089 (realm todo imported from
    .starcistacks/dev/infra/compose/realm-todo.json), redis on 6379. The dev compose stack itself was
    never started: its runtime secrets are sops/age-encrypted (.starcistacks/dev/runtime/*.enc) and
    this lane does not decrypt them, so the e2e compose generated its own throwaway credentials instead.
    The api was this worktree's own backend (npm run build output, node -r tsconfig-paths/register
    dist/main.js) on 3001, and the page was this worktree's own frontend (npm run build then
    npx next start -p 3000), so the browser served and the browser proved are the same bytes as the
    frontendCommit/backendCommit recorded in the run manifest (5c10a673 for both).
  authorization: >-
    UAT_LIVE_LOGIN_AUTHORIZED=true, UAT_DEMO_PASSWORD and UAT_PASSWORD_STRANGER set to the DEMO-ONLY
    plaintext users already committed in .starcistacks/dev/infra/compose/realm-todo.json
    (demo@todo.dev, demo2@todo.dev); no credential value is stored in this record or in the run folder.
  observed_effect: >-
    Three real sign-ins wrote session rows to Postgres (owner, stranger, owner again) - the harness
    does not count sessions as run-owned resources, the same caveat uat.login.sign-in's evidence
    records. The run also created one run-owned task row (uat-20260919T112844Z-5c10a673-task), which
    the final step deleted through the app's two-step inline confirm and verified absent by list
    read-back; cleanup.json's created/deleted/verified-absent triplet is what this run's evidence is
    for. Verified in Postgres afterward: only the seed task row remains.
  recording: >-
    videos/create.webm, 159,113 bytes, VP8 yuv420p 800x450 at 25 fps, 2.56s (metadata read by
    Playwright's bundled ffmpeg, ms-playwright/ffmpeg-1011). Password fields render as the browser's
    own bullets during capture and page.screenshot masks them whenever present, so no credential is
    in the committed bytes.
