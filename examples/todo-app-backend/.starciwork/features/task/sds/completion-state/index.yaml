schema: work/sds-component@1
id: sds.task.completion-state
title: How completion is stored and undone
state: done
responsibility: A boolean column and a timestamp, both cleared when the owner reopens the task.
refs: [br.task.complete.once]
dependsOn: [integration.login.postgres]

owners:
  - {role: module, path: src/modules/bussiness/task}

stateMachine:
  states: [open, complete]
  initial: open
  transitions:
    - {id: t-complete, from: open, to: complete, on: owner-completes, effect: completedAt is set.}
    - {id: t-complete-again, from: complete, to: complete, on: owner-completes, effect: Nothing changes and the response is success.}
    - {id: t-reopen, from: complete, to: open, on: owner-reopens, effect: completedAt is cleared.}

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

# The old blockedBy onto br.task.complete.once rev 2 is dropped twice over: that rule is now done, and
# the edge's text ("t-reopen has no implementation and no test") is false against the current tree -
# TaskService.tReopen exists, and all three transitions now have tests named after them in
# task.service.spec.ts (sds.task.completion-state.t-complete, .t-complete-again, .t-reopen), captured
# fresh in the sibling evidence.yaml. The persistence itself (the boolean column, the timestamp
# column, the row living in Postgres) is what impl.task.todo-app-backend.platform-database proves done.
