schema: work/sds-component
id: sds.task.ownership-guard
title: The guard that refuses a stranger
state: todo
responsibility: Every mutation names the actor. Delete compares the actor with the row's owner exactly as
  before. Complete now defers to contract.share.completion-guard-for-task, which answers true for the owner
  or for a live accepted editor collaborator, and refuses everyone else, before either mutation writes.
interfaces:
  - No write path reaches the repository without passing this guard.
  - The complete path calls the share module's mayComplete through contract.share.completion-guard-for-task
    instead of comparing actor to owner directly.
refs: [br.task.single-owner]
dependsOn: [integration.login.postgres, contract.share.completion-guard-for-task]
blockedBy:
  - {record: gap.task.collaborator-completion, because: "This component's t-owner/t-stranger transitions below described an owner-or-nobody guard for every mutation; that is still true for delete but no longer for complete, and this component has not been rebuilt to call contract.share.completion-guard-for-task. Its previous proof stood for br.task.single-owner's withdrawn rev 1 statement, not the current one - and the reason it cannot be rebuilt yet is exactly the absence gap.task.collaborator-completion names."}

stateMachine:
  states: [unchecked, owned, collaborating, foreign]
  initial: unchecked
  terminal: [owned, collaborating, foreign]
  transitions:
    - {id: t-owner, from: unchecked, to: owned, on: actor-matches-owner, effect: The write proceeds; true for delete and complete alike.}
    - {id: t-collaborator, from: unchecked, to: collaborating, on: actor-is-accepted-editor, effect: A complete write proceeds; a delete write is refused regardless of this transition.}
    - {id: t-stranger, from: unchecked, to: foreign, on: actor-differs-and-is-not-an-accepted-editor, effect: The write is refused and nothing is written.}

sequence:
  participants: [browser, api, postgres]
  steps:
    - {from: browser, to: api, message: "PATCH /tasks/:id with the actor's session, observable: http"}
    - {from: api, to: postgres, message: "SELECT the row's owner, observable: read"}
    - {from: api, to: postgres, message: "SELECT any accepted invitation for the actor on this task, when the actor is not the owner and the write is a completion, observable: read"}
    - {from: api, to: browser, message: "the refusal, when neither check passes, observable: http"}
    - {from: api, to: postgres, message: "UPDATE the row, only when the actor is the owner, or is an accepted editor completing it, observable: write"}

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions
