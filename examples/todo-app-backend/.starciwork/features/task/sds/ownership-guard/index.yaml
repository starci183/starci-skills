schema: work/sds-component@1
id: sds.task.ownership-guard
title: The guard that refuses a stranger
state: done
responsibility: Every mutation names the actor. Delete compares the actor with the row's owner exactly as
  before. Complete now defers to contract.share.completion-guard-for-task, which answers true for the owner
  or for a live accepted editor collaborator, and refuses everyone else, before either mutation writes.
interfaces:
  - No write path reaches the repository without passing this guard.
  - The complete path calls the share module's mayComplete through contract.share.completion-guard-for-task
    instead of comparing actor to owner directly.
refs: [br.task.single-owner]
dependsOn: [integration.login.postgres, contract.share.completion-guard-for-task]

owners:
  - {role: module, path: src/modules/bussiness/task}

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T17:30:00.000Z
  reason: "No content moved. The sequence block named PATCH /tasks/:id - the pre-GraphQL REST door that
    ex-nivo-shape replaced; the steps now name the actual GraphQL operations the transport exposes.
    State also advances todo -> done: both interfaces are true of the boot wiring (TaskService.complete/
    reopen route every call through CompletionAuthorityRegistry.current(), which share.module.ts's
    ShareCompletionAuthoritySetup registers with the real ShareCompletionAuthority delegating to
    AccessService.mayComplete; delete still passes OwnershipGuard.assert before any repository call), and
    all three transitions now have tests named after them - see the sibling evidence.yaml."

stateMachine:
  states: [unchecked, owned, collaborating, foreign]
  initial: unchecked
  terminal: [owned, collaborating, foreign]
  transitions:
    - {id: t-owner, from: unchecked, to: owned, on: actor-matches-owner, effect: The write proceeds; true for delete and complete alike.}
    - {id: t-collaborator, from: unchecked, to: collaborating, on: actor-is-accepted-editor, effect: A complete write proceeds; a delete write is refused regardless of this transition.}
    - {id: t-stranger, from: unchecked, to: foreign, on: actor-differs-and-is-not-an-accepted-editor, effect: The write is refused and nothing is written.}

sequence:
  participants: [browser, api, postgres]
  steps:
    - {from: browser, to: api, message: "completeTask/reopenTask/deleteTask GraphQL mutation with the actor's Bearer session, observable: http"}
    - {from: api, to: postgres, message: "SELECT the row's owner, observable: read"}
    - {from: api, to: postgres, message: "SELECT any accepted invitation for the actor on this task, when the actor is not the owner and the write is a completion, observable: read"}
    - {from: api, to: browser, message: "the refusal, when neither check passes, observable: http"}
    - {from: api, to: postgres, message: "UPDATE the row, only when the actor is the owner, or is an accepted editor completing it, observable: write"}

requiresProof:
  implementation:
    required: true
  transitions:
    forEach: stateMachine.transitions

# The old blockedBy onto gap.task.collaborator-completion is gone with the gap itself; the seam the
# gap named is now built and tested from both sides. The task-lane re-proving the sds comment deferred
# to "lane login-impl/task" is this lane's own job, done: the three transitions carry named tests in
# completion-authority.spec.ts (sds.task.ownership-guard.t-owner, .t-collaborator, .t-stranger), and
# the real ShareCompletionAuthority wiring - not a stub - is captured as an additional assertion
# running the share lane's own completion-authority.spec.ts, which drives an unmodified TaskService.
# What stays open on the complete half lives in br.task.single-owner's own record (evidence captured,
# done flag held by gap.task.share-edge-hold) and in fr.task.complete (uat); this record describes the
# component, and the component is built and proven.
