schema: work/contract
id: contract.task.list-for-dashboard
title: What a dashboard may read about a person's tasks
state: todo
between:
  provider: task
  consumer: dashboard
owner: task
surface:
  - name: countsFor
    shape: (personId) -> {open, complete}
    guarantee: Two integers for one person. Never the tasks themselves, never another person's.
    stability: Adding a counter is additive; changing what open means is breaking.
guarantees:
  - The counts obey br.task.list.owned: they cover exactly the person's own tasks.
consumerObligations:
  - The dashboard renders counts and never derives a task list from them.
refs: [br.task.list.owned]

# decision.task.list.scope is now decided (owner-only: this product has no organization concept, so a
# list is unconditionally the reader's own tasks), which is exactly br.task.list.owned's own statement.
# This contract's guarantee that counts obey that rule still cannot honestly move to done ahead of it -
# br.task.list.owned itself is todo and unproven - but br.task.list.owned is an ordinary record with no
# gap or open decision of its own to name as the reason, so no blockedBy edge is authored onto it here
# (a dead-end edge is a warned, not refused, shape, but this lane's own scope is to bring the tree's
# BLOCKER_UNROOTED count down, not add to it for a record no gap has been written against yet).
requiresProof:
  provider: {required: true}
  consumer: {required: true}
