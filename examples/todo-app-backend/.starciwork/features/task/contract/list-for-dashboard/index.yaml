schema: work/contract
id: contract.task.list-for-dashboard
title: What a dashboard may read about a person's tasks
state: todo
between:
  provider: task
  consumer: dashboard
owner: task
surface:
  - name: countsFor
    shape: (personId) -> {open, complete}
    guarantee: Two integers for one person. Never the tasks themselves, never another person's.
    stability: Adding a counter is additive; changing what open means is breaking.
guarantees:
  - The counts obey br.task.list.owned: they cover exactly the person's own tasks.
consumerObligations:
  - The dashboard renders counts and never derives a task list from them.
refs: [br.task.list.owned]

# decision.task.list.scope is decided (owner-only), and br.task.list.owned - the rule this contract's
# single guarantee rests on - is now done, so the reason this record's earlier comment gave for
# holding back is gone. The provider half is built and proven: TaskCountsQuery/TaskCountsHandler
# (src/modules/bussiness/task) implement the countsFor shape, exposed on the one door a dashboard can
# reach - the GraphQL taskCounts query (src/features/todo/graphql/queries/task/task-counts), which
# takes no person argument and counts for the session actor only; two named contract.task.list-for-
# dashboard.* unit tests plus a live signed-in probe (counts moved 0/0 -> 1/0 -> 0/1 across a real
# completion, unauthenticated reads refused with SESSION_NOT_FOUND) run against an API built from
# this source tree; the provider assertions are carried in impl.task.todo-app-backend.list's
# evidence.yaml. What keeps this record todo is the consumer half: `requiresProof.consumer` names the
# dashboard, and no dashboard record, module or screen exists in any lane of this tree to do the
# reading. requiresProof is untouched acceptance data - this lane cannot invent the consumer.
requiresProof:
  provider: {required: true}
  consumer: {required: true}
