schema: work/functional-requirement@1
id: fr.audit.export
title: Export a person's data from the log
state: done
actors: [person]
trigger: A signed-in person asks for every log line naming them.
mainFlow:
  - Every line resolving to that person through their live key is decrypted and returned.
exceptionFlows:
  - Once the person's key has been destroyed by a completed erasure, export returns nothing - the
    same key an erasure destroys is the key export depends on, so the two agree by construction.
postconditions:
  - The export contains no other person's lines.
composes:
  - {rule: br.audit.append-only, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/audit/export-and-log.e2e-spec.ts
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-19T00:00:00.000Z
  reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern
    'audit/export' matched no file under src/tests/e2e; export-and-log.e2e-spec.ts is the spec that
    walks tracked activity -> appended lines -> exportMyData -> auditLog agreement against the
    assembled stack. Rev 2's clarifying content stands; requiresProof.uat stays unfulfilled as before
    (uat.audit.right-to-be-forgotten, gap.audit.live-proof)."
