schema: work/functional-requirement
id: fr.audit.export
title: Export a person's data from the log
state: done
actors: [person]
trigger: A signed-in person asks for every log line naming them.
mainFlow:
  - Every line resolving to that person through their live key is decrypted and returned.
exceptionFlows:
  - Once the person's key has been destroyed by a completed erasure, export returns nothing - the
    same key an erasure destroys is the key export depends on, so the two agree by construction.
postconditions:
  - The export contains no other person's lines.
composes:
  - {rule: br.audit.append-only, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/export
  uat:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "gap.audit.unbuilt-module is closed. The GraphQL exportMyData query
    (features/todo/graphql/queries/audit/export-my-data) dispatches ExportMyDataQuery to
    ExportMyDataHandler, which calls AuditLogService.exportForPerson
    (src/modules/bussiness/audit/audit-log.service.ts) - filters by the caller's own keyId, decrypts,
    and returns nothing once a completed erasure has destroyed that keyId's mapping (the exceptionFlow
    above), proven in export-my-data.handler.spec.ts and exercised end to end by
    scripts/live-proof-audit.sh. composes[].module corrected to the real capability directory.
    requiresProof.uat stays unfulfilled: uat.audit.right-to-be-forgotten (gap.audit.live-proof) has not
    run and is outside this backend lane's scope."
