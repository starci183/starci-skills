schema: work/functional-requirement
id: fr.audit.log.append
title: Append a line for a tracked action
state: todo
actors: [system]
trigger: A tracked action completes elsewhere in the product - a sign-in, a sign-out, a task created,
  completed or deleted.
mainFlow:
  - The acting person's id and the action are handed to the log.
  - One line is appended, sealed and hashed onto the chain.
postconditions:
  - The line count increases by exactly one.
  - Recomputing the chain from the first line still reports valid.
composes:
  - {rule: br.audit.append-only, module: src/audit/log}
  - {rule: br.audit.retention, module: src/audit/log}
subscribes: [event.task.created, event.task.completed, event.task.deleted, event.login.signed-in, event.login.signed-out]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/log-append
  uat:
    required: true

blockedBy:
  - {record: gap.audit.unbuilt-module, because: "subscribes now names the five events this FR needs, and login's and task's implementations actually raise all five today - the remaining absence is that no audit module exists yet under the NestJS layout to host this trigger and wire it to them."}
