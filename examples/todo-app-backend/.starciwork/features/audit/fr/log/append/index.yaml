schema: work/functional-requirement@1
id: fr.audit.log.append
title: Append a line for a tracked action
state: done
actors: [system]
trigger: A tracked action completes elsewhere in the product - a sign-in, a sign-out, a task created,
  completed or deleted.
mainFlow:
  - The acting person's id and the action are handed to the log.
  - One line is appended, sealed and hashed onto the chain.
postconditions:
  - The line count increases by exactly one.
  - Recomputing the chain from the first line still reports valid.
composes:
  - {rule: br.audit.append-only, module: src/modules/bussiness/audit}
  - {rule: br.audit.retention, module: src/modules/bussiness/audit}
subscribes: [event.task.created, event.task.completed, event.task.deleted, event.login.signed-in, event.login.signed-out]

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/audit/export-and-log.e2e-spec.ts
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-19T00:00:00.000Z
  reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern
    'audit/log-append' matched no file under src/tests/e2e; export-and-log.e2e-spec.ts is the spec
    that drives tracked activity -> appended audit lines against the assembled stack. Rev 2's
    clarifying content stands; requiresProof.uat stays unfulfilled as before
    (uat.audit.right-to-be-forgotten, gap.audit.live-proof)."
