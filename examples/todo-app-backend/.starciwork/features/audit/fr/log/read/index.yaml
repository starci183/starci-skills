schema: work/functional-requirement
id: fr.audit.log.read
title: Read the log
state: todo
actors: [operator]
trigger: An authorized operator asks to see recent activity, optionally filtered by action or target.
mainFlow:
  - The operator's authorization is checked.
  - Matching lines are returned, each resolved through readLine so a tombstoned line reads as
    tombstoned rather than throwing.
exceptionFlows:
  - An unauthorized reader is refused before any line is touched.
postconditions:
  - No response ever includes a sealed actor blob or a keyId a reader could use to correlate lines
    across an erasure.
composes:
  - {rule: br.audit.append-only, module: src/audit/log}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/log-read
  uat:
    required: true

blockedBy:
  - {record: decision.audit.operator-role, because: "The operator authorization this FR's mainFlow step 1 names has no accepted source: the example's session seam resolves only {token, personId, issuedAt, expiresAt} and data.login.person has no role field (gap.audit.operator-role rev 2). audit-operator-read.ts's fail-closed check stands built and unit-proven waiting for that decision; until it is decided, only the caller's-own-lines read is reachable, which is not this record's whole mainFlow, so it stays todo."}
