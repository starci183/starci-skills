schema: work/functional-requirement
id: fr.audit.log.read
title: Read the log
state: done
actors: [operator]
trigger: An authorized operator asks to see recent activity, optionally filtered by action or target.
mainFlow:
  - The operator's authorization is checked.
  - Matching lines are returned, each resolved through readLine so a tombstoned line reads as
    tombstoned rather than throwing.
exceptionFlows:
  - An unauthorized reader is refused before any line is touched.
postconditions:
  - No response ever includes a sealed actor blob or a keyId a reader could use to correlate lines
    across an erasure.
composes:
  - {rule: br.audit.append-only, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/log-read
  uat:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-19T12:00:00.000Z
  reason: "decision.audit.operator-role is now decided (audit-verified-roster), so the blockedBy edge on it
    is satisfied and dropped - the layout refuses a stale blockedBy on a done record. The operator read is
    therefore live: AuditLogHandler checks the verified claim (audit-operator-read.ts) before any line is
    touched, an allowlisted operator reads the whole chain filtered by an action the contract emits
    (contract.audit.emitted-events' five sealed kinds) via readAllLines -> matchOperatorFilter ->
    toAuditLineSummary, a tombstoned line reads back as tombstoned, and the summary shape carries exactly
    at/action/target - never a sealed actor blob or keyId (postconditions). Proven at unit level bound to
    impl.audit.todo-app-backend.operator-read's fresh evidence (audit-log.handler.spec.ts +
    audit-operator.guard.spec.ts). composes[].module corrected to the real capability directory, matching
    fr.audit.log.append. requiresProof.e2e and the live uat run stay unfulfilled here as they do for every
    audit backend record: uat.audit.right-to-be-forgotten (gap.audit.live-proof) has not produced a run and
    is outside this backend lane."
