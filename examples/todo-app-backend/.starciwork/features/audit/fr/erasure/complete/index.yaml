schema: work/functional-requirement@1
id: fr.audit.erasure.complete
title: Complete an erasure
state: done
actors: [system]
trigger: A verified erasure request is picked up by the erasure worker.
mainFlow:
  - The subject's key and the keystore's personId-to-keyId mapping are destroyed.
  - Every line the subject produced is confirmed unreadable.
  - The request moves to complete and an erasure-completed line is appended, naming the requestId.
exceptionFlows:
  - If any of the subject's lines still decrypts after key destruction, completion is refused rather
    than reported as done.
postconditions:
  - No reader, including export, can resolve the subject's identity from any line they produced.
  - Every line's bytes, position and hash are unchanged from before the request.
composes:
  - {rule: br.audit.erasure.right, module: src/modules/bussiness/audit}
  - {rule: br.audit.erasure.logged, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/audit/erasure-journey.e2e-spec.ts
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-19T00:00:00.000Z
  reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern
    'audit/erasure-complete' matched no file under src/tests/e2e; erasure-journey.e2e-spec.ts is the
    spec that walks request -> verify -> complete -> anonymized against the assembled stack. Rev 2's
    clarifying content stands; requiresProof.uat stays unfulfilled as before
    (uat.audit.right-to-be-forgotten, gap.audit.live-proof)."
