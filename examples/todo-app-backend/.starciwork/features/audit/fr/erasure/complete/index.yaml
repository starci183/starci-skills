schema: work/functional-requirement
id: fr.audit.erasure.complete
title: Complete an erasure
state: done
actors: [system]
trigger: A verified erasure request is picked up by the erasure worker.
mainFlow:
  - The subject's key and the keystore's personId-to-keyId mapping are destroyed.
  - Every line the subject produced is confirmed unreadable.
  - The request moves to complete and an erasure-completed line is appended, naming the requestId.
exceptionFlows:
  - If any of the subject's lines still decrypts after key destruction, completion is refused rather
    than reported as done.
postconditions:
  - No reader, including export, can resolve the subject's identity from any line they produced.
  - Every line's bytes, position and hash are unchanged from before the request.
composes:
  - {rule: br.audit.erasure.right, module: src/modules/bussiness/audit}
  - {rule: br.audit.erasure.logged, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/erasure-complete
  uat:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "fr.audit.erasure.request and gap.audit.unbuilt-module are both closed. This example has no
    background worker; the GraphQL completeErasure mutation
    (features/todo/graphql/mutations/audit/complete-erasure) exposes the worker's pickup directly for
    the caller who requested it to trigger, dispatching CompleteErasureCommand to
    AuditErasureService.execute (src/modules/bussiness/audit/audit-erasure.service.ts) - t-execute, the
    unreadability confirmation, then t-complete, refusing with ERASURE_NOT_CONFIRMED rather than
    completing if any line still decrypted (the exceptionFlow above), all proven in
    audit-erasure.service.spec.ts and complete-erasure.handler.spec.ts, and exercised end to end by
    scripts/live-proof-audit.sh. composes[].module corrected to the real capability directory.
    requiresProof.uat stays unfulfilled: uat.audit.right-to-be-forgotten (gap.audit.live-proof) has not
    run and is outside this backend lane's scope."
