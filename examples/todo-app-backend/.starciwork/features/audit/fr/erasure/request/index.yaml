schema: work/functional-requirement@1
id: fr.audit.erasure.request
title: Request erasure
state: done
actors: [person]
trigger: A signed-in person asks to have what identifies them removed from the log.
mainFlow:
  - A fresh requestId is minted and an erasure-request row is created in state requested.
  - An erasure-requested line is appended, naming the requestId, not the person.
postconditions:
  - Exactly one erasure-request row exists per submission, in state requested.
composes:
  - {rule: br.audit.erasure.right, module: src/modules/bussiness/audit}
  - {rule: br.audit.erasure.logged, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- src/tests/e2e/audit/erasure-journey.e2e-spec.ts
  uat:
    required: true

change:
  rev: 3
  kind: editorial
  at: 2026-09-19T00:00:00.000Z
  reason: "requiresProof.e2e.command corrected to a real spec path: the jest positional pattern
    'audit/erasure-request' matched no file under src/tests/e2e; erasure-journey.e2e-spec.ts is the
    spec that walks request -> verify -> complete against the assembled stack. Rev 2's clarifying
    content stands."
