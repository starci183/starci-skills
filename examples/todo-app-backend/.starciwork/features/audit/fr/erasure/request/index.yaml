schema: work/functional-requirement
id: fr.audit.erasure.request
title: Request erasure
state: done
actors: [person]
trigger: A signed-in person asks to have what identifies them removed from the log.
mainFlow:
  - A fresh requestId is minted and an erasure-request row is created in state requested.
  - An erasure-requested line is appended, naming the requestId, not the person.
postconditions:
  - Exactly one erasure-request row exists per submission, in state requested.
composes:
  - {rule: br.audit.erasure.right, module: src/modules/bussiness/audit}
  - {rule: br.audit.erasure.logged, module: src/modules/bussiness/audit}

requiresProof:
  unit:
    forEach: composes
  e2e:
    command: npm run test:e2e -- audit/erasure-request
  uat:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "sds.audit.erasure-request and gap.audit.unbuilt-module are both closed. The GraphQL
    requestErasure mutation (features/todo/graphql/mutations/audit/request-erasure) dispatches
    RequestErasureCommand, handled by RequestErasureHandler, which calls
    AuditErasureService.request (src/modules/bussiness/audit/audit-erasure.service.ts) - t-request then
    t-verify, proven in audit-erasure.service.spec.ts and request-erasure.handler.spec.ts, and exercised
    end to end by scripts/live-proof-audit.sh. composes[].module corrected to the real capability
    directory. requiresProof.uat stays unfulfilled: uat.audit.right-to-be-forgotten (gap.audit.live-proof)
    has not run and is outside this backend lane's scope."
