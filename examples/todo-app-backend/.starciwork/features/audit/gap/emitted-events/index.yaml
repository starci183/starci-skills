title: login and task expose no emitted-event contract for audit to subscribe to
state: done
statement: login and task now expose an emitted-event contract for audit to subscribe to -
  impl.task.todo-app-backend.platform-events's typed in-process PlatformEventBus is done, and
  create-task, complete-task, delete-task, sign-in and sign-out each publish event.task.created,
  event.task.completed, event.task.deleted, event.login.signed-in and event.login.signed-out on it after
  their respective writes succeed. fr.audit.log.append itself remains unbuilt - gap.audit.unbuilt-module
  names that separately - so no subscriber exists yet to actually seal a line from these signals, but the
  signals themselves fire today.
closedBy: [impl.task.todo-app-backend.platform-events]
