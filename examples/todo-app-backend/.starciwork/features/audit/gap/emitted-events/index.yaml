schema: work/gap
id: gap.audit.emitted-events
title: login and task expose no emitted-event contract for audit to subscribe to
state: todo
statement: login and task now expose an emitted-event contract for audit to subscribe to -
  impl.task.todo-app-backend.platform-events's typed in-process PlatformEventBus and every publish call
  site are real and unit-tested (create-task, complete-task, delete-task, sign-in and sign-out each
  publish event.task.created, event.task.completed, event.task.deleted, event.login.signed-in and
  event.login.signed-out on it after their respective writes succeed) - but
  impl.task.todo-app-backend.platform-events itself stays todo rather than done, because its own proves
  list (event.task.created, event.task.completed, event.task.deleted) is not yet a done product event a
  subscriber can rely on (PROVES_TARGET_NOT_DONE), and this gap's own closedBy names that same
  not-yet-done record. fr.audit.log.append itself remains unbuilt - gap.audit.unbuilt-module names that
  separately - so no subscriber exists yet to actually seal a line from these signals, even once the
  events themselves are proven done.
closedBy: [impl.task.todo-app-backend.platform-events]
change: {rev: 2, kind: clarifying, at: 2026-09-18T09:00:00.000Z, reason: "impl.task.todo-app-backend.platform-events reopened to todo (PROVES_TARGET_NOT_DONE on its own proves list); this gap's done claim and authored-claim evidence were stale against that and are withdrawn - the closedBy target is unchanged, only its own state is not done yet."}
