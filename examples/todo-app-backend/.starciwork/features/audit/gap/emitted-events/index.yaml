because: closedBy names an already-done implementation record, so no additional test run proves this
  specific claim - that login and task raise these five events is independently verifiable by reading
  create-task's, complete-task's, delete-task's, sign-in's and sign-out's use cases, which
  impl.task.todo-app-backend.platform-events owns and proves.
