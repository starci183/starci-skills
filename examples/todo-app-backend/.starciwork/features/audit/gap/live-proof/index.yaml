schema: work/gap@1
id: gap.audit.live-proof
title: No uat.verify run has produced a live run for audit.right-to-be-forgotten
state: todo
statement: uat.audit.right-to-be-forgotten names its entry, actor, ordered steps, fixtures, effects and cleanup
  in the op's own shape, but no uat.verify run has executed it against the running product yet - there is
  no uat/right-to-be-forgotten/runs/<runId>/ folder with real screenshots, a playable video and a passing result.md,
  only the designed flow this record and its accounts.yaml/fixtures ref describe. Lane v9-1 (2026-09-19)
  verified the surfaces before writing the walk and found the first three steps servable but the fourth
  unwalkable in this deployment, on two stacked absences. First, no operator-facing audit-log screen
  exists - the frontend serves only audit/privacy and the auditLog resolver's own comment keeps the
  action/target filter args for when the operator-facing UI lands, so there is no screen an operator
  could read. Second, the running API names no operator subject - AUDIT_OPERATOR_SUBJECTS is unset
  (verified live - demo@todo.dev's auditLog returned exactly its own keyId's 106 lines while a second
  subject's 10 lines sat in the same chain, i.e. the own-lines fallback, not the whole-chain read), and
  the roster is read once at process start on a stack this lane does not own and may not re-boot. With
  neither a surface nor a configured operator, step 4's "the lines exist and are unnamed" cannot be
  observed truthfully - an own-lines read after erasure returns nothing, which is the opposite of the
  step's expectation. The Playwright spec additionally remains an unimplemented test.skip stub
  (examples/todo-app-frontend/uat/flows/uat.audit.right-to-be-forgotten.spec.ts); writing its first three
  steps is now possible but cannot settle this record done while step 4 stays unprovable.
closedBy: uat.audit.right-to-be-forgotten
change: {rev: 3, kind: clarifying, at: 2026-09-19T00:00:00.000Z, reason: "v9-1 verified the walk's surfaces against the live stack before implementing: erasure request + export are real (ui.audit.privacy -> requestErasure/completeErasure/exportMyData), but step 4's operator read is unreachable - no operator-facing audit-log UI exists and the running API's AUDIT_OPERATOR_SUBJECTS roster is empty (empirically the own-lines path). The blocker is named precisely rather than left as 'missing spec'."}
