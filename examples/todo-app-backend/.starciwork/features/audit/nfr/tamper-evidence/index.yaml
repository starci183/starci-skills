schema: work/non-functional-requirement
id: nfr.audit.tamper-evidence
title: Any alteration or removal of a stored line is detectable
quality: integrity
state: done
observableCriterion: For a log of N appended lines, mutating any single stored field on any single
  line causes a full-chain recomputation to report a content-mismatch break exactly at that line's
  index, on 100% of a fuzz over every line and every mutable field. Removing any single line that has
  a successor causes a broken-prevHash break exactly at that successor's (shifted) index, on 100% of a
  fuzz over every such removal. An unmutated log always recomputes as fully valid. Removing the current
  last line is out of this criterion's scope - hash-chaining alone cannot distinguish a truncated tail
  from a log that simply stopped growing, since there is no later line whose prevHash could witness the
  removal - detecting tail truncation needs an externally anchored checkpoint (e.g. a periodically
  published head hash), which this feature does not build.
measurement:
  how: A property-style test (or a plain loop, if the Nest module's test tooling has no fuzz library)
    that, for each line index and each field of that line, takes a fresh log, applies exactly one
    out-of-band mutation to the underlying store (not through the module's own write path - a real
    tamper does not ask permission), recomputes the chain, and asserts a break is reported. Repeats
    for a line-removal mutation at each index that has a successor. A green run with zero mutations
    attempted is not a passing run of this criterion; the harness must assert it actually executed >0
    mutation cases.
  threshold: 100% of attempted mutations detected (content and removal-with-successor); 0 false
    positives on the unmutated baseline
  environment: dev
refs: [br.audit.append-only]
requiresProof:
  measurement:
    required: true

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "gap.audit.unbuilt-module is closed: AuditLogService.verifyChain
    (src/modules/bussiness/audit/audit-log.service.ts) recomputes prevHash from each row's actual
    predecessor rather than trusting a row's own stored prevHash, so a removed middle line surfaces as
    a broken link at its successor and a changed field surfaces as a content mismatch at that line -
    both proven by an out-of-band-mutation fuzz in audit-log.service.spec.ts (every line x every
    mutable field, plus every middle-line removal), with a green, zero-mutation baseline check.
    observableCriterion is narrowed from an unqualified '100% of removals' to exclude removing the
    current last line: that case produces no detectable break under hash-chaining alone (there is no
    successor to witness it), which the original wording did not account for and no implementation
    could have satisfied as originally written - this is a correction to the requirement's own text,
    not a shortfall in what was built against it. The harness this record's own blockedBy note asked a
    future implementer to port (mutate the store directly, then call verify, never the other way
    round) is exactly audit-log.service.spec.ts's shape."
