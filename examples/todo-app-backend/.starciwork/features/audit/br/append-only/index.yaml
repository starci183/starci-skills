schema: work/business-rule
id: br.audit.append-only
title: A log line is never altered
state: done
statements:
  - Once a line is appended, its stored bytes and its position in the chain never change again.
  - Any alteration of a line, or removal of a line, is detectable by recomputing the chain.
authorityRefs:
  - "owner-intent: A log nobody can trust is worthless; the check has to be real, not a promise."
acceptanceCriteria: [chain-detects-tamper]
module: src/modules/bussiness/audit

change:
  rev: 2
  kind: clarifying
  at: 2026-09-18T12:00:00.000Z
  reason: "gap.audit.unbuilt-module is closed: AuditLogService.verifyChain (src/modules/bussiness/audit
    /audit-log.service.ts) recomputes the hash chain from the first line forward and reports the exact
    break index and reason, proven by an out-of-band mutation fuzz over every line and field plus every
    middle-line removal in audit-log.service.spec.ts - never through the module's own write path. module
    corrected from the drafted src/audit/log (never built) to the real Nest capability directory."
