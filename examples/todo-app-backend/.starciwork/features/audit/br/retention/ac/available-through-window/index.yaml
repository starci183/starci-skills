schema: work/acceptance-criterion
id: ac.audit.retention.available-through-window
rule: br.audit.retention
given: A line captured at time zero
when: 400 days pass with no erasure request against its subject
then:
  - The line is still present, still chained, and still readable.
  - Nothing in the storage layer evicts a line on a clock alone.
  - "The check that proves this: inject a fake clock into the retention sweep (never rely on real
    wall-clock delay in a test), advance it past 400 days, and assert the line count and chain
    validity are unchanged. A separate case must advance to well past the window with an active
    erasure against the line's subject and assert the line still exists but no longer decrypts -
    proving retention and erasure are independent axes, not one flag."
