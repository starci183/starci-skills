schema: work/contract@1
id: contract.audit.emitted-events
title: The emitted-event contract audit subscribes to
state: todo
between:
  provider: task
  consumer: audit
owner: audit
surface:
  - name: event.login.signed-in
    shape: publish(SignedInEvent) -> subscriber dispatches AppendLogLineCommand
    transport: >-
      In-process PlatformEventBus (src/modules/platform/events) - the typed publish/subscribe port every
      feature uses for domain signals, so no feature imports another feature's module for that purpose.
      The payload fields below mirror the SignedInEvent class in
      src/modules/platform/events/events.types.ts exactly, and the event id is this lane's declaration
      of what audit needs emitted; the owning lane (ex-auth-fix, session side) proves the emission from
      its own implementation record.
    guarantee: >-
      login publishes SignedInEvent from SignInHandler (src/modules/bussiness/session/sign-in.handler.ts)
      with Keycloak's stable subject id as personId, only after sds.login.session-store's t-accept wrote
      the session row.
    stability: Renaming the event, dropping or re-typing a payload field, or moving publication before
      the write succeeds is breaking for audit - the subscriber seals its first audit line from it.
  - name: event.login.signed-out
    shape: publish(SignedOutEvent) -> subscriber dispatches AppendLogLineCommand
    transport: In-process PlatformEventBus, as above; payload mirrors the SignedOutEvent class.
    guarantee: >-
      login publishes SignedOutEvent from SignOutHandler (src/modules/bussiness/session/sign-out.handler.ts)
      after t-revoke removed the session row.
    stability: As above - breaking for audit's subscriber.
  - name: event.task.created
    shape: publish(TaskCreatedEvent) -> subscriber dispatches AppendLogLineCommand
    transport: >-
      In-process PlatformEventBus, as above; payload mirrors the TaskCreatedEvent class. This id is the
      product event already declared in the task feature's vocabulary (fr.audit.log.append's
      subscribes names it) - this contract restates it as audit's requirement, the task lane's
      impl.task.todo-app-backend.platform-events proves the emission from its own record.
    guarantee: >-
      task publishes TaskCreatedEvent from CreateTaskHandler
      (src/modules/bussiness/task/create-task.handler.ts) after the row exists, with ownerId the
      resolved actor, never a client-supplied id.
    stability: As above - breaking for audit's subscriber.
  - name: event.task.completed
    shape: publish(TaskCompletedEvent) -> subscriber dispatches AppendLogLineCommand
    transport: >-
      In-process PlatformEventBus, as above; payload mirrors the TaskCompletedEvent class, whose
      sourceEventId is also notify's dedupe key (decision.notify.dedupe-key) - one occurrence id,
      read the same way by both subscribers.
    guarantee: >-
      task publishes TaskCompletedEvent from CompleteTaskHandler
      (src/modules/bussiness/task/complete-task.handler.ts) only when the write changed anything
      (br.task.complete.once), so audit never seals a line for a no-op retry.
    stability: As above - breaking for audit's subscriber and for notify.
  - name: event.task.deleted
    shape: publish(TaskDeletedEvent) -> subscriber dispatches AppendLogLineCommand
    transport: >-
      In-process PlatformEventBus, as above; payload mirrors the TaskDeletedEvent class. The taskId the
      event carries is the id the log keeps naming after the row is gone - the accepted
      data.audit.log-line vs br.task.delete.final tension, restated here from the emitter's side.
    guarantee: >-
      task publishes TaskDeletedEvent from DeleteTaskHandler
      (src/modules/bussiness/task/delete-task.handler.ts) after the deletion.
    stability: As above - breaking for audit's subscriber.
guarantees:
  - Every event names exactly one occurrence through sourceEventId, so a subscriber can dedupe on the
    event's own field rather than inventing a key.
  - Publication happens after the write succeeded, never before - an audit line is only ever sealed for
    something that really happened.
  - The payloads carry ids only (personId, taskId), never emails, passwords or sealed blobs - what audit
    stores identifies actors and targets, not their credentials.
consumerObligations:
  - audit's AuditEventSubscriber routes every one of the five kinds to AppendLogLineCommand and nothing
    else, and ignores kinds outside the vocabulary rather than failing the producer's call -
    src/modules/bussiness/audit/audit-event.subscriber.ts over AUDIT_SEALED_ACTIONS
    (src/modules/bussiness/audit/audit-operator-read.ts), proven per kind in
    audit-event.subscriber.spec.ts.
  - audit never imports login's or task's modules to learn these signals - PlatformEventBus is the only
    seam (sds.audit.log-chain's interfaces rule).
requiresProof:
  provider:
    required: true
    note: >-
      task's impl.task.todo-app-backend.platform-events (the bus and its three task emissions) and
      login's session-side prover for SignedInEvent/SignedOutEvent (the handler specs assert each
      publish today) must prove they honour the surface. This lane never writes those records - the
      brief names the emitters as parallel lanes' own (ex-auth-fix, ex-be-task).
  consumer:
    required: true
    note: >-
      This lane proves audit honours its obligations: audit-event.subscriber.spec.ts drives the real
      PlatformEventBus and asserts every declared kind routes to exactly one AppendLogLineCommand,
      with the actor and target this contract names.
change: {rev: 1, kind: initial, at: 2026-09-18T19:30:00.000Z}

# This record is gap.audit.emitted-events' declaration half: the vocabulary audit needs emitted is now
# named precisely - five events, payloads mirroring the bus's typed classes field for field. The
# provider half is true on this base - all five publish call sites exist and their specs assert them -
# but the provider-side records stay todo until their owning lanes prove them
# (PROVES_TARGET_NOT_DONE on impl.task.todo-app-backend.platform-events' own proves list), so this
# contract and the gap both honestly stay todo, pointing at the provider lanes rather than claiming
# their proof from this side.
