ui:
  intent: A real Todo app workspace with top navigation, current feature, synthetic account presence
    and secondary destinations. The privacy screen - request erasure, export data. The
    representative state is erasure-refused.
  surfaces:
    - name: privacy
      route: /privacy
      purpose: export personal data and request erasure
      actors:
        - person
  states:
    - name: idle
      trigger: first paint
      behavior: export and request-erasure actions are both available, no message shown
    - name: exporting
      trigger: export clicked, response pending
      behavior: the export Button is disabled and shows a busy label
    - name: requesting-erasure
      trigger: request-erasure clicked, a confirmation is pending
      behavior: a confirm/cancel pair of Button replaces the single request action
    - name: erasure-pending
      trigger: erasure confirmed, not yet complete
      behavior: both actions are disabled with a pending status message (non-danger)
    - name: erasure-complete
      trigger: erasure has completed
      behavior: "a non-danger Text(live: polite) confirms completion; both actions are removed"
    - name: erasure-refused
      trigger: The erasure request is refused or cannot be submitted
      behavior: Show the actual refusal reason through assertive Text. Do not invent a legal hold. Export
        remains independent; retry must respect authentication and refusal cause.
