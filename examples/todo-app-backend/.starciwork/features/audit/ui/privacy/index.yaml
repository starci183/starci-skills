schema: work/ui-screen
id: ui.audit.privacy
title: The privacy screen - request erasure, export data
state: done
brand: {rev: 2}
refs: [fr.audit.erasure.request, fr.audit.export]
ui:
  intent: >-
    One joined privacy surface separates safe export from deliberate erasure without inventing a red
    danger style. The representative refusal state states that identity verification failed and nothing
    changed, while preserving the architecture truth that identifying content becomes unreadable but
    audit history remains.
  surfaces:
    - name: privacy
      route: /privacy
      purpose: export personal data and request erasure
      actors: [person]
  states:
    - {name: idle, trigger: "first paint", behavior: "export and request-erasure actions are available and no status is shown"}
    - {name: exporting, trigger: "export is awaiting a response", behavior: "Export my data owns pending while the erasure region remains stable"}
    - {name: requesting-erasure, trigger: "the person begins an erasure request", behavior: "a clear confirm and cancel decision replaces the single request action"}
    - {name: erasure-pending, trigger: "a verified erasure request was accepted", behavior: "pending status is shown and duplicate privacy actions are unavailable"}
    - {name: erasure-complete, trigger: "identifying content has been crypto-shredded", behavior: "completion says identifying content is unreadable and audit history remains"}
    - {name: erasure-refused, trigger: "identity for the erasure request cannot be verified", behavior: "assertive status says nothing changed and Request erasure remains available for a new verified attempt"}
  coverage:
    scale: bounded
    representativeScreens: [privacy]
    map:
      - {screen: privacy, state: idle, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Use the two joined bands without status text; mobile stacks copy before each action."}
      - {screen: privacy, state: exporting, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Apply pending only to Export my data and preserve the erasure band."}
      - {screen: privacy, state: requesting-erasure, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Replace Request erasure with named confirm and cancel actions in the same band."}
      - {screen: privacy, state: erasure-pending, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Show one pending status and make duplicate actions unavailable without changing the truth explanation."}
      - {screen: privacy, state: erasure-complete, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard], derivation: "Replace request controls with settled completion Text that preserves retained audit history."}
      - {screen: privacy, state: erasure-refused, viewport: [desktop-1280, mobile-390], components: [PageContainer, Heading, Text, SurfaceCard, Button], derivation: "Representative generated direction; mobile preserves export before erasure and wraps the refusal.", directionAsset: assets/privacy-erasure-refused.png}
  accessibility:
    - Both actions have explicit text labels and keyboard order follows export then erasure.
    - Refusal uses assertive live Text and identifies the failed request without claiming a destructive result.
    - Confirmation must move focus to the decision and return it to Request erasure on cancel.
  responsive:
    - desktop-1280 presents two joined bands; mobile-390 stacks each band's copy and action without changing their order.
    - Privacy explanations wrap at readable measure and no action becomes icon-only.
  artworkSlots: []
  observations:
    - "Installed Common proves joined SurfaceCard composition, Text and Buttons but no destructive Button variant or modal."
    - "Export owns the single primary accent; erasure remains a deliberate outline action."
    - "The image is proposed direction only and does not prove identity verification, export or crypto-shredding."
  gaps:
    - "Common has no destructive Button variant; Request erasure remains a labelled outline action until a semantic treatment is specified."
  assets:
    - path: assets/privacy-erasure-refused.prompt.txt
      role: prompt
    - path: assets/privacy-erasure-refused.png
      role: direction
      generation:
        tool: image_gen.imagegen
        promptPath: assets/privacy-erasure-refused.prompt.txt
        inputRefs: [ui.audit.privacy, fr.audit.erasure.request, fr.audit.export, decision.audit.erasure-method, sds.audit.erasure-request, brand, knowledge/ui/composition/index.yaml, knowledge/ui/presentation/index.yaml, knowledge/ui/proof/index.yaml, "@starci/grammar@0.4.13/common"]
