schema: work/ui-screen
id: ui.audit.privacy
title: The privacy screen - request erasure, export data
state: todo
brand: {rev: 2}
refs: [fr.audit.erasure.request, fr.audit.export]
ui:
  intent: >-
    Two independent actions on one screen; never merge export and erasure into one control since they have separate acceptance criteria. The representative direction is drawn for the erasure-refused state because it
    combines the densest actual Grammar anatomy this screen uses (SurfaceCard, both Button actions and
    the refusal line) and, where the state is an error/refusal, the accessibility-critical assertive-live
    Text carrying the refusal and the brand's contrast don't (Never place text on the primary colour below
    a 4.5:1 contrast ratio.). @starci/grammar/common ships no Message/Alert renderer, no danger tone on
    Text, and no destructive button variant; the refusal is a plain Text line and the erasure action stays
    an ordinary Button.
  surfaces:
    - {name: privacy, route: /privacy, purpose: "export personal data and request erasure", actors: [person]}
  states:
    - {name: idle, trigger: "first paint", behavior: "export and request-erasure actions are both available, no message shown"}
    - {name: exporting, trigger: "export clicked, response pending", behavior: "the export GrammarButton is disabled and shows a busy label"}
    - {name: requesting-erasure, trigger: "request-erasure clicked, a confirmation is pending", behavior: "a confirm/cancel pair of GrammarButton replaces the single request action"}
    - {name: erasure-pending, trigger: "erasure confirmed, not yet complete", behavior: "both actions are disabled with a pending status message (non-danger)"}
    - {name: erasure-complete, trigger: "erasure has completed", behavior: "a non-danger GrammarMessage confirms completion; both actions are removed"}
    - {name: erasure-refused, trigger: "the erasure request is rejected, for example a hold applies", behavior: "a GrammarMessage(tone: danger) states the refusal reason; the request action remains available to retry once the hold clears"}
  coverage:
    scale: bounded
    representativeScreens: [privacy]
    map:
      - {screen: privacy, state: idle, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Button (export, variant: secondary)", "Button (request erasure, variant: outline)"], derivation: "Derives from the erasure-refused representative direction: same SurfaceCard, Button (export), Button (request erasure) anatomy, minus the refusal Text; export and request-erasure actions are both available, no message shown."}
      - {screen: privacy, state: exporting, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Button (export, variant: secondary, isPending)", "Button (request erasure, variant: outline)"], derivation: "Derives from the erasure-refused representative direction: same SurfaceCard, Button (export), Button (request erasure) anatomy, minus the refusal Text; the export Button is isPending and shows its busy label."}
      - {screen: privacy, state: requesting-erasure, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Button (export, variant: secondary)", "Button (confirm, variant: primary)", "Button (cancel, variant: ghost)"], derivation: "Derives from the erasure-refused representative direction: same SurfaceCard, Button (export) anatomy; a confirm (variant: primary)/cancel (variant: ghost) Button pair replaces the single request-erasure Button."}
      - {screen: privacy, state: erasure-pending, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Button (export, variant: secondary, isDisabled)", "Button (request erasure, variant: outline, isDisabled)", "Text (live: polite, non-danger pending status)"], derivation: "Derives from the erasure-refused representative direction: same SurfaceCard, Button (export), Button (request erasure) anatomy, with both isDisabled and a `live: polite` Text pending line in place of the refusal Text."}
      - {screen: privacy, state: erasure-complete, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Text (live: polite, non-danger completion status)"], derivation: "Derives from the erasure-refused representative direction: same SurfaceCard anatomy; both action Buttons are removed and a `live: polite` Text confirms completion in place of the refusal Text."}
      - {screen: privacy, state: erasure-refused, viewport: desktop-1280, components: ["SurfaceCard (ariaLabel: Privacy, composition: joined)", "Button (export, variant: secondary)", "Button (request erasure, variant: outline)", "Text (live: assertive, the refusal sentence)"], derivation: "Representative direction; generated by interface.draw once gap.audit.direction-not-drawn closes.", directionAsset: assets/privacy-erasure-refused.png}
  accessibility:
    - Every interactive control is reachable by keyboard alone in visual order.
    - "The refusal Text carries `live: \"assertive\"` and is announced without requiring focus; Common
      sets no `role=\"alert\"` and Text has no danger tone, so severity is carried by the sentence and
      the live region alone. Pending/complete status uses `live: \"polite\"` since it is not an error."
    - Text on the primary colour (#2F6BFF) keeps at least a 4.5:1 contrast ratio.
  responsive:
    - desktop-1280 is the representative viewport; mobile-390 keeps the same single-column order with no
      hidden controls, derived rather than separately generated.
  artworkSlots: []
  observations: []
  gaps: []
