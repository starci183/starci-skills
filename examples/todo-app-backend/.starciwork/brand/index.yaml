  limitations:
    - No current-worktree dependency installation or browser rendering is claimed.
    - Common CSS declares structure and token consumers, not the Core palette. Core CSS import and
      family scope are not active in the existing app; this lane is limited to the accent override.
    - The existing primary foreground is not rewired by this lane. Implementation must provide the
      direction's black primary label through an authorized Grammar theme capability.
    - Grammar ButtonVariant has no destructive variant; danger treatment needs a Grammar capability
      before implementation.
    - Master is a generated placeholder, not final owner acceptance.
