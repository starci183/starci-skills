    policy:
      dangerMayMatchPrimary: false
      minContrast: 4.5
    primaryAlias:
      token: --accent
      value: var(--starci-core-accent)
      source: src/app/globals.css
      line: 17
    surface: "#FFFFFF"
    usage:
      - Primary actions use the exact blue token and black label ink from the installed
        --color-black primitive; black on primary measures above 4.5:1.
      - Danger uses the unchanged --starci-core-danger token for an edge, outline or fill with dark
        foreground; do not use small danger-coloured text on white.
      - Body text and link labels use foreground on white/canvas; blue underline or selection edge
        carries link/current context.
      - Core palette is the direction source, not a claim that the existing neutral Common root
        activates Core CSS.
  typography:
    sans: Inter
    authority: Settled at rev 2
    intent: Use Grammar Heading and Text sizes; body md, secondary sm, labels medium/semibold.
      Product-specific numeric type scale is unruled.
    implementation: Inter is not loaded in the existing app; globals.css currently uses system-ui. Font
      loading belongs to interface.implement.
  mascot:
    name: turtle
    description: A friendly, calm turtle (con rùa), suited to keeping tasks steadily moving.
    status: generated-placeholder-pending-owner-asset-acceptance
    allowedIn:
      - auth illustration panel
      - empty states
      - welcome/marketing surfaces
      - loading idles
    forbiddenIn:
      - danger contexts
      - destructive contexts
      - inside form controls
    rules:
      - Reuse this one master; preserve blue shell, pale neutral body and calm expression.
      - On refused auth, keep the turtle confined to the separate welcome illustration panel; the
        form/refusal region carries no mascot.
      - Do not use the turtle as a logo, action icon or decorative danger companion.
    assets:
      - path: assets/turtle-master.png
        sha256: 9290de9aea7fa6950d39ae55f1fb19d3f7d160eecc9c89c17bf2547fc70b183d
        width: 1254
        height: 1254
        format: png
        background: white canvas
        purpose: master placeholder
        provenance:
          tool: image_gen.imagegen
          promptPath: assets/turtle-master.prompt.txt
          modelDisclosure: The tool response did not expose a model field; no model identity is claimed.
          generatedAt: 2026-09-18T12:14:51.613Z
          source: built-in tool output copied without pixel modification
          rights: Generated for this brief; no third-party reference image supplied. Final asset acceptance is
            pending.
  logo:
    status: unruled
    assets: []
    usage: Use the existing product name Todo app as plain text; no invented symbol or approved wordmark
      claim.
  iconography:
    status: unruled
    set: []
    custom: []
    forbidden:
      - additional icon packages without owner ruling
    usage: No pictographic icon set selected. These directions use visible text actions and native
      checkboxes, with no decorative icon library.
  imagery:
    style: Flat illustration in the declared brand hues and neutrals.
    photography: false
    auth: At desktop measure place the turtle illustration panel on the LEFT and the form on the RIGHT.
      At narrow widths place compact illustration before the form; retain every link.
    emptyStates: Task-list empty state includes the turtle master, a concise explanation and the
      existing add-task control.
    forbidden:
      - photography
      - off-palette illustration
      - mascot inside a control
      - mascot in a danger/destructive surface
    promptRules:
      - Cite examples/todo-app-backend/.starciwork/brand/index.yaml rev 3 first, then inspected
        Grammar anatomy, then relevant knowledge rule ids.
      - Name Todo app, common anatomy/core token vocabulary, exact palette and turtle placement
        policy.
      - Use the master as an input reference when a turtle appears. Generated directions are not
        shipped-product captures.
  voice:
    status: unruled beyond owner request
    rule: Plausible, concise English; name the action, outcome and recovery without inventing product
      promises.
  motion:
    status: unruled
    rule: No bespoke animation selected. Retain published Grammar pending states and reduced-motion
      behavior; static drawings make no motion proof.
  forbidden:
    - Never place text on the primary colour below a 4.5 to 1 contrast ratio.
    - never show the mascot in a danger or destructive surface
    - never render the auth form without the illustration panel at desktop measure
    - Never redefine --starci-core-danger or introduce a second red.
  artworkSlots:
    - id: auth-turtle
      surfaces:
        - sign-in
      placement: left illustration panel at desktop; compact illustration before form at mobile
      master: assets/turtle-master.png
      purpose: calm welcome
      decorative: true
    - id: empty-turtle
      surfaces:
        - list
      states:
        - empty
      placement: empty-state section outside form controls
      master: assets/turtle-master.png
      purpose: explain absence and invite the first task
      decorative: true
