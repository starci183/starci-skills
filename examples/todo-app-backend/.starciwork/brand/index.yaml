schema: work/brand@1
id: brand
kind: brand
state: done
rev: 3
brand:
  identity:
    name: Todo app
    product: todo-app
    family: common
    tokenVocabulary: core, with imported Tailwind black/white primitives
    ownerRulingsVerbatim: |-
      - **Mascot: a turtle** (con rùa). A friendly, calm turtle — it suits a product
        about keeping tasks steadily moving. It may appear in: the auth split-screen
        illustration panel, empty states, welcome/marketing surfaces, loading idles.
        It must never appear in destructive/danger contexts or inside form controls.
      - **Primary colour stays `#2F6BFF`** (blue — already settled at rev 2, owner
        confirms). Danger keeps the grammar token `--starci-core-danger`, do not
        redefine it.
      - **Auth aesthetic**: split-screen — illustration/mascot panel on the LEFT,
        form on the RIGHT. The owner calls this "thẩm mỹ": the v3 empty-canvas
        centered card was wrong.
      - **Real web UX**: sign-in must carry the furniture a real site has — email and
        password fields, a forgot-password link, a create-account link, and policy /
        terms footer links. These links may point at unimplemented routes (record that
        honestly in the ui record — links exist in direction before the feature does).
    decisions:
      - subject: mascot
        options:
          - turtle
        chosen: turtle
        authority: OP-BRIEF.md
      - subject: primary
        options:
          - "#2F6BFF"
        chosen: "#2F6BFF"
        authority: Owner confirms rev 2 in OP-BRIEF.md
      - subject: dangerMayMatchPrimary
        options:
          - false
        chosen: false
        authority: Owner keeps grammar danger and blue primary
      - subject: auth
        options:
          - illustration-left-form-right
        chosen: illustration-left-form-right
        authority: OP-BRIEF.md
