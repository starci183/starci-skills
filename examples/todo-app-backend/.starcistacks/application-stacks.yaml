schema: starci/application-stacks
sources:
  - repository: todo-app
components:
  postgres:
    image: postgres:16
    role: stateful
    compose: infra/compose/postgres.yaml
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    role: stateful
    compose: infra/compose/keycloak.yaml
  redis:
    image: redis:7
    role: stateful
    compose: infra/compose/redis.yaml
  minio:
    image: minio/minio:latest
    role: stateful
    compose: infra/compose/minio.yaml
  prometheus:
    image: prom/prometheus:latest
    role: observability
    compose: infra/compose/prometheus.yaml
  api:
    image: todo-app/api
    role: service
    compose: infra/compose/api.yaml
  web:
    image: todo-app/web
    role: service
    compose: infra/compose/web.yaml
environments:
  dev:
    status: supported
    runtime: docker-compose
    composeFiles:
      - infra/compose/compose.yaml
    components:
      postgres:
        port: 5440
        # Declared port 5432 collides with an already-running starci-postgres container on this
        # machine (docker ps / netstat -ano confirmed host 5432 LISTENING before this stack ever
        # started). Only the host-side mapping moves; the container still listens on 5432 inside.
      keycloak:
        port: 8089
      redis:
        port: 6389
        # Declared port 6379 collides with an already-running starci-redis container. Host-side only.
      minio:
        port: 9030
        # Declared port 9000 collides with an already-running starci-minio container. Host-side only.
      prometheus:
        port: 9091
        # Declared port 9090 collides with an already-running starci-prometheus container. Host-side only.
      api:
        port: 3001
      web:
        port: 3000
    runbook: README.md
    secrets:
      - name: app.env
        where: runtime/env/app.env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: seed.yaml
        where: runtime/config/seed.yaml
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: keycloak-admin-password.key
        where: runtime/files/keycloak-admin-password.key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: minio-root-password.key
        where: runtime/files/minio-root-password.key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: sepay-api-key.key
        where: runtime/files/sepay-api-key.key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: sepay-webhook-secret.key
        where: runtime/files/sepay-webhook-secret.key
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: uat
        where: secrets/uat
        recipientPolicy: DEMO-ONLY - encrypted to the example identity at runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
  vps:
    status: supported
    runtime: docker-swarm
    composeFiles:
      - infra/stack.yaml
    components:
      postgres: {}
      keycloak: {}
      redis: {}
      minio: {}
      api:
        replicas: 2
      web:
        replicas: 2
    runbook: README.md
    secrets:
      - name: app.env
        where: runtime/env/app.env
        recipientPolicy: DEMO-ONLY - encrypted to the example identity shared from dev/runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
      - name: uat
        where: secrets/uat
        recipientPolicy: DEMO-ONLY - encrypted to the example identity shared from dev/runtime/env/demo.agekey, never a real recipient
        keyCustody: DEMO-ONLY - identity committed in this repository for reader round-trip, not real custody
k8s:
  status: deferred
  reason: One host serves the current load; a cluster would add a control plane nobody operates yet.

