services:
  postgres:
    image: postgres:16
    environment:
      # The postgres image refuses to boot without a superuser password (env_file alone declared
      # DATABASE_URL/REDIS_URL, which this image does not read). These literals match the api's own
      # default DATABASE_URL (AppConfigService) so the two need no coordination; DEMO-ONLY, never a real
      # credential.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    env_file:
      - ../../runtime/env/app.env
    ports:
      # Host 5432 collides with an already-running starci-postgres container on this
      # machine; only the host side moves, the container still listens on 5432 inside.
      - "5440:5432"
    volumes:
      - ../../seeds:/docker-entrypoint-initdb.d:ro
      - todo-postgres:/var/lib/postgresql/data
volumes:
  todo-postgres: {}
