services:
  postgres:
    image: postgres:16
    environment:
      # The postgres image refuses to boot without a superuser password (env_file alone declared
      # DATABASE_URL/REDIS_URL, which this image does not read). POSTGRES_PASSWORD_FILE (not the
      # POSTGRES_PASSWORD literal this used to be) matches the api's own default DATABASE_URL
      # (AppConfigService) so the two need no coordination; DEMO-ONLY, never a real credential - the
      # value behind the file is still the literal "postgres", just no longer sitting in a tracked
      # compose file in plaintext (stacks-check's plaintext-sensitive-environment finding).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: todo
    env_file:
      - ../../runtime/env/app.env
    secrets:
      - postgres-password
    ports:
      - "5432:5432"
    volumes:
      - ../../seeds:/docker-entrypoint-initdb.d:ro
      - todo-postgres:/var/lib/postgresql/data
volumes:
  todo-postgres: {}
secrets:
  postgres-password:
    file: ../../runtime/files/postgres-password.key
