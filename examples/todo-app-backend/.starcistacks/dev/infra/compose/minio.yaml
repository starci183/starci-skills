services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-root-password
    secrets:
      - minio-root-password
    ports:
      - "9000:9000"
    volumes:
      - todo-minio:/data
secrets:
  minio-root-password:
    file: ../../runtime/files/minio-root-password.key
volumes:
  todo-minio: {}

