schema: work/business-rule@1
id: br.pricing.cap-required
title: Every account is capped
state: done
verificationSource: authored-claim
because: Fixture carries an authored-claim so the only refusal in this case is the unresolved conflict.
statements:
  - Every account has a finite active-task cap decided by its plan.
  - A create that would exceed the cap is refused before anything is written.
conflictsWith:
  - record: br.pricing.free-for-all
    because: br.pricing.free-for-all says no cap may exist; this rule makes the cap universal.
acceptance:
  - id: ac.pricing.cap-required.refusal
    given: An account at its cap
    when: It creates one more task
    then:
      - The create is refused and names the cap.
