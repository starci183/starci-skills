# Generated by scripts/checks/check-examples-ci.mjs --write. Do not edit: npm run check fails on any difference.
# One flag per example app (both editions run the unit project with coverage), uploaded by .github/workflows/examples.yml. The paths are the app's coverage
# scope (the logic of be/src/modules/**: the slot manifest's `coverage` field, derived once by scripts/hfs/coverage-scope.mjs, the same scope the
# app's own codecov.yml, be/jest.config.js and sonar.coverage.exclusions render); every flag is held at 100 on the project and on the patch,
# and so is every component (one per service app of each example, plus its platform). The runtime has no flag: it has no specs of its own
# (owner ruling no-runtime-specs, 2026-10-17), so nothing of it is measured.
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        flags:
          - full-app
          - lite-app
          - shape-slot
    patch:
      default:
        target: 100%
        threshold: 0%
        flags:
          - full-app
          - lite-app
          - shape-slot
flag_management:
  default_rules:
    carryforward: false
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_flags:
    - name: full-app
      paths:
        - "examples/full-app/be/src/modules/domain/*/**"
        - "examples/full-app/be/src/modules/integrations/*/**"
        - "examples/full-app/be/src/modules/platform/*/**"
        - "examples/full-app/be/src/modules/projections/*/**"
    - name: lite-app
      paths:
        - "examples/lite-app/be/src/modules/domain/*/**"
        - "examples/lite-app/be/src/modules/integrations/*/**"
        - "examples/lite-app/be/src/modules/platform/*/**"
        - "examples/lite-app/be/src/modules/projections/*/**"
    - name: shape-slot
      paths:
        - "examples/shape-slot/be/src/modules/domain/*/**"
        - "examples/shape-slot/be/src/modules/integrations/*/**"
        - "examples/shape-slot/be/src/modules/platform/*/**"
        - "examples/shape-slot/be/src/modules/projections/*/**"
component_management:
  default_rules:
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_components:
    - component_id: full-app-identity
      name: full-app-identity
      paths:
        - "examples/full-app/be/src/modules/domain/account/**"
        - "examples/full-app/be/src/modules/domain/identity/**"
        - "examples/full-app/be/src/modules/domain/session/**"
        - "examples/full-app/be/src/modules/integrations/cache/**"
        - "examples/full-app/be/src/modules/integrations/keycloak-admin/**"
        - "examples/full-app/be/src/modules/integrations/keycloak/**"
        - "examples/full-app/be/src/modules/integrations/order-api/**"
    - component_id: full-app-order
      name: full-app-order
      paths:
        - "examples/full-app/be/src/modules/domain/cart/**"
        - "examples/full-app/be/src/modules/domain/catalog/**"
        - "examples/full-app/be/src/modules/domain/loyalty/**"
        - "examples/full-app/be/src/modules/domain/order/**"
        - "examples/full-app/be/src/modules/integrations/receipt-storage/**"
        - "examples/full-app/be/src/modules/projections/order-summary/**"
    - component_id: full-app-billing
