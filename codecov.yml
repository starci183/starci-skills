    - component_id: lite-app-api
      name: lite-app-api
      paths:
        - "examples/lite-app/be/src/modules/domain/bookings/**"
        - "examples/lite-app/be/src/modules/domain/calendar-inbox/**"
        - "examples/lite-app/be/src/modules/domain/calendars/**"
