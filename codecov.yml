# Generated by scripts/checks/check-examples-ci.mjs --write. Do not edit: npm run check fails on any difference.
# One flag per full-edition example app (lite has no tests or coverage), uploaded by .github/workflows/examples.yml. The paths are the app's coverage
# scope (the logic of be/src/modules/**: the slot manifest's `coverage` field, derived once by scripts/hfs/coverage-scope.mjs, the same scope the
# app's own codecov.yml, be/jest.config.js and sonar.coverage.exclusions render); every flag is held at 100 on the project and on the patch,
# and so is every component (one per service app of each example, plus its platform).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%
flag_management:
  default_rules:
    carryforward: false
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_flags:
    - name: ecommerce-app
      paths:
        - "examples/ecommerce-app/be/src/modules/domain/*/**"
        - "examples/ecommerce-app/be/src/modules/integrations/*/**"
        - "examples/ecommerce-app/be/src/modules/platform/*/**"
        - "examples/ecommerce-app/be/src/modules/projections/*/**"
    - name: shape-slot
      paths:
        - "examples/shape-slot/be/src/modules/domain/*/**"
        - "examples/shape-slot/be/src/modules/integrations/*/**"
        - "examples/shape-slot/be/src/modules/platform/*/**"
        - "examples/shape-slot/be/src/modules/projections/*/**"
component_management:
  default_rules:
    statuses:
      - type: project
        target: 100%
        threshold: 0%
      - type: patch
        target: 100%
        threshold: 0%
  individual_components:
    - component_id: ecommerce-app-identity
      name: ecommerce-app-identity
      paths:
        - "examples/ecommerce-app/be/src/modules/domain/account/**"
        - "examples/ecommerce-app/be/src/modules/domain/identity/**"
        - "examples/ecommerce-app/be/src/modules/domain/session/**"
        - "examples/ecommerce-app/be/src/modules/integrations/cache/**"
        - "examples/ecommerce-app/be/src/modules/integrations/keycloak-admin/**"
        - "examples/ecommerce-app/be/src/modules/integrations/keycloak/**"
        - "examples/ecommerce-app/be/src/modules/integrations/order-api/**"
    - component_id: ecommerce-app-order
      name: ecommerce-app-order
      paths:
        - "examples/ecommerce-app/be/src/modules/domain/cart/**"
        - "examples/ecommerce-app/be/src/modules/domain/catalog/**"
        - "examples/ecommerce-app/be/src/modules/domain/loyalty/**"
        - "examples/ecommerce-app/be/src/modules/domain/order/**"
        - "examples/ecommerce-app/be/src/modules/integrations/receipt-storage/**"
        - "examples/ecommerce-app/be/src/modules/projections/order-summary/**"
    - component_id: ecommerce-app-billing
