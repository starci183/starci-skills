schema: starci/document@1
sections:
  - title: 6.0 opt-in execution
    blocks:
      - The 6.0 alpha is an explicit workflow engine enrollment, not a silent upgrade of existing Work.
        Read docs/runtime-v6.md and upgrades/6.0.0-alpha.1.md. Build and test privately before sealing a
        runtime pin; incomplete builds must not replace a live .dist. Follow the existing approval scope
        for push and retry. A version edit alone does not authorize publication.
      - Runtime helpers that execute in detached children must be listed in scripts/runtime-modules.txt.
        Test their relocated installed paths, durable result replay, lost process reconciliation, owner
        action continuation and actual validator transport. Pure helper tests do not prove kernel wiring.
      - Keep alpha limitations explicit. A resumed workflow trial is not a fresh end-to-end trial; a
        container mount probe is not an attested Orca worker sandbox. Preserve old tags and explain the
        independent engine identity when historical package versions compare higher.
      - Agent-led coordination is an explicit v6 enrollment. The manager receives a bounded semantic
        snapshot and orders only kernel-authored executable action IDs; the kernel remains the state writer,
        rechecks preconditions and owns evidence acceptance. Count the manager inside the global ten-slot
        limit. Never expose secrets, raw owner answers or evidence bodies to its context, and never migrate an
        existing workflow into this mode without the authorized retry boundary.
      - Keep the three non-operation roles in the closed `models.nonOperation` map in host-local
        `config.json`; planner and validator use the Fable/Astra pool, while kernel manager and technical decide use
        the Opus/Sol pool. Admission selects against eligibility, qualification, known quota, capacity and
        budget before a call. Shared pools do not merge typed contexts, unknown quota is not unlimited, and
        the pools never change operation-agent policy.
  - title: Maintaining StarCi 3.0
    blocks:
      - Read the current entry, selected code/contract and its consumers before editing. The user's
        explicit requested major refactor defines the scope; do not open a v2 session or reconstruct
        request/response chains to maintain v3.
  - title: One authority per concept
    blocks:
      - Core schemas define machine shapes; core computes validation/digests/rollups. Operator
        common policy defines shared execution rules; op documents define domain-specific reads,
        writes and proof. SKILL.md is the only active skill; workflows/catalog.json owns workflow
        discovery, and workflow matrices own bounded sequence and handoffs. Entrypoints reference
        these authorities, never invent another routing graph. Scope/dependencies remain
        product-owned.
      - Change a contract and all affected consumers together. Preserve stable IDs; incompatible
        meanings require a version transition. Operator JSON contracts and runtime documentation are
        English only. Keep domain-specific implementation details in the actual operation, not
        universal policy.
  - title: Grounding
    blocks:
      - Inspect existing behavior before prescribing a fix. Separate observations from requirements
        and inference. Keep concrete product identities, machine paths and credentials out of
        reusable contracts. Synthetic examples must be labeled and must not masquerade as product
        acceptance.
      - Implement rejection checks where deterministic validation is possible. Test missing/changed
        evidence, stale inputs, path escape, ambiguous ownership and incomplete coverage. A hash
        cannot verify honesty of an authored statement; do not advertise it as such.
  - title: Verification and commits
    blocks:
      - Run affected v3 tests and the complete npm test before final delivery. Test relocated
        installation and CLI consumers when entrypoints or payload change. Commit exact piece
        ownership sets; do not sweep unrelated user edits into a commit. Preserve failed evidence
        and describe any unrun verification.
      - Do not hand-edit generated op documents; edit ops/<op>/operator.yaml and its applicable
        specification/secondary YAML, then regenerate the runtime payload through npm run build and
        verify reproducibility with npm run build:check. Source-tree generation is retired. Removed V2 source/docs/tests are recoverable through Git, not an
        executable fallback. Verify installed references and package contents without old
        directories. Preserve domain knowledge while removing obsolete session/routing instructions.
  - title: Release and migration
    blocks:
      - A version change is not publication. Keep alpha/release status accurate. No npm publish,
        remote push, runtime deployment, real account operation or .worktrees migration is
        authorized merely by a request to edit this package.
      - A major installer upgrade requires deliberate opt-in and must not mutate product
        .starciwork/.worktrees contents. Preserve custom bootstrap instructions; if they conflict
        with the new protocol, stop before payload writes and explain the conflict. Audit and
        preserve canonical Git/evidence/secret ownership before any separate data migration.
  - title: 5-plus
    blocks:
      - The runtime tree is laid out by concept. The declared data the runtime runs on is `model/`
        (it was `profiles/`), and the one `execution/` folder became four - `kernel/` for the control
        loop, one file per concern, `hosts/` for the host adapters and the host model, `models/` for
        the model functions, `checks/` for the machine checks that read bytes. `execution/` itself
        stays and still carries the 4.x Plan-route execution modes. `.dist` mirrors the source tree,
        so a compiled path moves with its source. Add a new root to `package.json` `files` and to
        `INDEX.yaml` `folders` together; add it to the installer's owned-roots set only when a file
        dropped from a later payload should be cleaned out of an installed tree.
      - There is one entry, `bin/starci.mjs`. It forwards every workflow command to the launcher with
        its argv untouched and answers everything else from the CLI, so no document, contract, prompt
        or instruction names a module path inside the runtime. When a command is added, add it to the
        forwarded list and to the help block of that entry in the same change; a person reading the
        help must see the whole command line, not half of it.
      - Restarting a running supervisor is part of shipping a tree move. The supervisor is the only
        long-running process, and it was started from a module path the move deletes, so an operator
        has to stop it and start it once with the new command. Kernels need no hand - they notice the
        runtime's modules moved, end cleanly and are started again. Say so in the version's upgrade
        note rather than assuming it is obvious.
      - Three declarations are versioned, and a change to one is a schema change with a migration
        story, never a silent edit. `kinds@2` replaced the single `mutates` list per operation kind
        with `reads` and `writes` over `records@1`, the closed catalog of what a thing in the tree
        or the product IS. `hosts@1` declares what a host offers and whether it runs operations in
        parallel, which two adapters used to hold as constants of their own. Keep the closed
        constants in `kernel/graph.mjs`, `kernel/io.mjs` and `hosts/index.mjs` in step with the
        profiles they close; the validators refuse a drift in either direction on purpose.
      - The node kind `integration` has a completion profile of its own - one declared external
        system, one node, one live proof. A tree that declares an integration and holds no node for
        it reads as incomplete. When a declaration gains a node kind, the completion profile, the
        lane, the record catalog entry and the layout pattern all change together, or the graph
        refuses the catalog.
      - Records may carry `extensions.work3.integrations` (the external systems a business or design
        record talks to, each naming the environment variable the owner provides its credential in -
        never the value), `extensions.work3.reconciliation` (one typed row per decided record a
        feature touches) and `extensions.work3.kernel.contractDigest` with the kind it was taken for
        (the rules a completion was accepted under). An evidence manifest may carry `proof`, which
        says what a run actually proved against. All are written by the runtime; none is authored by
        hand, and none is migrated onto records that predate it.
      - A completion recorded before the contract digest existed carries none, and is left exactly as
        it is rather than reopened. Reopening every earlier proof is a whole product's work nobody
        asked for; those are reopened only when the owner asks. A rule that reopens existing accepted
        work needs that same treatment - a forward-only default, and the owner's request for the rest.
  - title: Current documentation and sites
    blocks:
      - Docs and sites use the current operator/workflow catalogs. Regenerate and build both sites
        when contracts change. There is no legacy directory or version wrapper. Installer updates
        replace unchanged owned documentation while preserving custom user content and builds.
