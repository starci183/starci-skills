schema: starci/job-matrices@1
limits:
  rows: 3
  columns: 3
  secondaryDefinitions: 3
purpose: |-
  One-job workflow actions selected from a frozen semantic classification. Long requests use an explicit ordered plan; no successor is inferred.
bindingRules:
  - |-
    Each workflow is exactly one bounded job.
  - |-
    Accepted producer outputs are copied unchanged into explicitly selected later job inputs.
  - |-
    Planning does not grant effects or result acceptance.
  - |-
    Backend unit and backend E2E evidence must be accepted before implement-frontend.
workflows:
  - id: analyze-request
    parameters:
      - request
    matrix:
      - - id: analyze-request
          op: task.execute
          inputs:
            request:
              parameter: request
          outputs:
            - analysis
          criteria:
            - request-understood
          writeScopes:
            - read-only-analysis
    transition:
      request: exact-cell-op-mode-inputs-criteria
      response: matching-request-digest-and-op-mode
      advance: all-required-criteria-pass-and-output-evidence-verified
      missingOrFailed: remain-in-cell
      repair: same-cell-same-acceptance-bounded-retry
      evidence: actual-artifacts-and-selected-work-completion-profile
      dispatch: explicit-coordinator-only
  - id: prepare-work
    parameters:
      - request
    matrix:
      - - id: prepare-work
          op: workspace.manage
          inputs:
            request:
              parameter: request
          outputs:
            - workRef
          criteria:
            - work-valid
          writeScopes:
            - selected-prepare-work
          operation: prepare
    transition:
      request: exact-cell-op-mode-inputs-criteria
      response: matching-request-digest-and-op-mode
      advance: all-required-criteria-pass-and-output-evidence-verified
      missingOrFailed: remain-in-cell
      repair: same-cell-same-acceptance-bounded-retry
      evidence: actual-artifacts-and-selected-work-completion-profile
      dispatch: explicit-coordinator-only
    operations:
      - prepare
      - import
  - id: define-business
