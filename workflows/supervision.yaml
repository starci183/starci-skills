schema: starci/orchestration-supervision@1
purpose: |-
  Define the Orca parent Coordinator control loop between workflow boundaries. This is
  an orchestration protocol, not a product workflow, workflow child or operation.
ownership:
  coordinator:
    - workflow-dependency-resolution
    - question-resolution
    - escalation-resolution
    - final-outcome-review
    - conflict-workflow-dispatch
  workflowWrapper:
    - operation-scheduling
    - bounded-retry
    - provider-fallback-with-no-effects
    - operation-boundary-decision
    - normalized-workflow-reporting
  operationAgent:
    - implementation-and-repair
    - test-and-verification-execution
    - operation-output-production
routing:
  operationToWorkflow:
    recipient: workflow-manager
    events:
      - question
      - escalation
      - heartbeat
      - worker_done
      - worker_failed
  workflowInternal:
    execution: operation-agent-only
    resolveWithoutCoordinator:
      - operation-dependency
      - safe-command-approval
      - no-effect-provider-fallback
      - bounded-retry
      - module-owned-small-fix
      - module-local-architecture-sidearm
      - focused-test-failure
    coordinatorNotification: none
  workflowToCoordinator:
    onlyWhen:
      - cross-workflow-dependency
      - shared-owner-change
      - cross-workflow-conflict
      - accepted-scope-or-authority-change
      - human-product-decision
      - workflow-manager-terminal-failure
      - normalized-workflow-done
    envelope: normalized-workflow-boundary
  coordinatorToWorkflow:
    recipient: workflow-manager
    transport: launcher-notify
    eventType: escalation
    reason: a-terminal-consumes-one-run-so-parent-run-mail-never-reaches-a-monitor-bound-to-its-nested-run
    statusEvent: forbidden-for-control-instruction
    fileFirst: message-file-then-typed-pointer-verified-on-screen
  coordinatorToOperation:
    direct: forbidden
    route: coordinator-to-workflow-manager-to-operation
  managerRecovery:
    onManagerFailure: coordinator-replaces-or-recovers-manager
    bypassManager: forbidden
waitHierarchy:
  workflowManager:
    waitsFor: operation-boundary
    accepts:
      - question
      - escalation
      - heartbeat
      - worker_done
      - worker_failed
    actsBy: decide-dispatch-retry-or-replace-operation
    directExecution: forbidden
  coordinator:
    waitsFor: normalized-workflow-boundary
    accepts:
      - cross-workflow-dependency
      - shared-owner-change
      - cross-workflow-conflict
      - accepted-scope-or-authority-change
      - human-product-decision
      - workflow-manager-terminal-failure
      - normalized-workflow-done
    actsBy: decide-schedule-recover-or-replace-workflow-manager
    workflowLocalExecution: forbidden
    operationExecution: forbidden
workerLifecycle:
  displayNames:
    coordinatorWorktree: "[Coordinator] <Plan>"
    coordinator: "[Monitor] <Plan>"
    workflowWorktree: "[Workflow] <Workflow>"
    workflowManager: "[Monitor] <Workflow>"
    operationAgent: "[Op] <operation> - <scope>"
    applyAgentNameWith: task-display-name-then-provider-attestation-then-terminal-canonicalization
  coordinator:
    lifetime: parent-run
    host: orca-main-worktree
    launch: persistent-native-agent
    bootstrap: external-chat-creates-and-hands-off
    authority: owns-plan-run-and-dag
    release: after-final-run-settlement
  workflowWrapper:
    lifetime: workflow-attempt
    host: workflow-child-worktree
    launch: persistent-native-manager-agent
    authority: owns-operation-dag-and-boundary-loop
    reportsTo: parent-coordinator
    worktree: one-isolated-child
    release: after-reviewed-integration
  operationAgent:
    lifetime: operation-attempt
    launch: supervised-native-agent
    isolation: one-operation-one-agent
    release: after-accepted-worker_done
    reuse: forbidden
    dispatchAdmission:
      required:
        - expected-operation-from-active-dag-node
        - exact-operation-contract
        - resolved-provider-selection
        - canonical-display-name
      providerProof: worker-show-exact-effective-agent-model
      effectAcceptance: only-after-provider-proof
      onOperationMismatch: fence-reconcile-release-and-dispatch-expected-operation
      onProviderMismatch: fence-reconcile-release-and-retry-resolved-target
    displayNameStability:
      identityAuthority: task-display-name-plus-worker-provider-receipt
      terminalTitle: mutable-native-ui-metadata
      launch: provider-attest-then-rename-and-verify
      runtimeDrift: recanonicalize-without-fencing-when-immutable-identity-is-exact
      settlement: recanonicalize-before-release
      effectDecision: never-reject-solely-for-runtime-terminal-title-drift
    architectureSidearm:
      onlyTrigger: active-implementation-secondary_request
      requiredReason: sds-technical-gap
      requiredSecondaryOp: architecture.decide
      requiredAuthority: explicit-bounded-sds-allowlist
      forbiddenTriggers:
        - review-finding
        - review-suggestion
        - unanswered-design-question
        - inferred-sds-gap
    qwenLaunch:
      agent: qwen
      model: qwen3.8-flash
      modelAuthority: rendered-terminal-footer
      create: command-terminal-per-attempt
      readiness: rendered-input-prompt
      supervise: dispatch-return-preamble
      promptDelivery: terminal-send-with-submit-verification
      credentialRefresh: unset-stale-process-env-then-qwen-env-file
      terminalCommand: declared-target-command-only
      nestedAgents: forbidden
    nativeLaunchFailure:
      recognizedFailures:
        - agent_prompt_stalled
        - session_not_reported
      action: fence-and-reconcile-exact-attempt
      nextCandidate: only-after-verified-no-effects
      fallthroughOwner: canonical-launcher-within-one-start-op-invocation
      classification: typed-call-result-outcome-and-effect-state
      unsupervisedFallback: forbidden
      release: release-or-retain-from-worker-receipt
      duplicateSubmit: forbidden
    deadTerminals:
      owner: workflow-manager
      when: after-every-settlement-and-before-workflow-completion
      command: sweep
      closes: settled-dispatch-terminals-and-residual-agent-terminals-in-the-workflow-worktree
      never: live-worker-monitor-coordinator-or-user-terminal
    managerReplacement:
      owner: plan-coordinator
      command: replace-monitor
      precondition: worker-show-state-not-ready-or-running
      settlement: worker-stop-then-worker-release-released-or-already_released
      relaunch: worker-start-retry-of-with-supervisor-chain
      liveManager: never-replaced
reports:
  schema: starci/op-report@1
  workflowSchema: starci/workflow-report@1
  outcomes: [done, partial, failed, ask, blocked]
  signals: {done: worker_done, partial: worker_done, failed: worker_failed, ask: question, blocked: escalation}
  authority: report-file-then-signal
  command: report
  onceOnly: true
wait:
  mode: blocking-event-wait
  owner: launcher-wait-tick
  subscribe:
    - question
    - escalation
    - worker_done
    - worker_failed
  tickMs: 120000
  heartbeatGraceMs: 600000
  ping: operation-heartbeat-every-5-minutes-peeked-per-tick
  tick:
    - check-wait-with-previous-batch-acknowledged
    - scan-report-files
    - classify-every-live-worker
    - sweep-dead-terminals
    - recanonicalize-titles
  events: [report, stalled-idle, stalled-silent, stalled-prompt, dead, timeout]
  onTimeout:
    action: wait-again
    inspectWorker: true
    notifyUser: false
  endsTurnOnlyOn: [workflow-goal, blocked-escalation-to-parent]
  onHealthyHeartbeat:
    action: none
    inspectWorker: false
    notifyUser: false
liveness:
  checkWhen:
    - heartbeat-grace-expired
    - workflow-deadline-expired
    - terminal-closed
    - terminal-crashed
  inspectionOrder:
    - workflow-state
    - task-and-dispatch-state
    - latest-heartbeat
    - bounded-terminal-tail
  maxTerminalTailReads: 1
messages:
  identity:
    required:
      - messageId
      - deliveryId
      - runId
      - workflowTaskId
      - dispatchId
      - attempt
      - eventType
      - emittedAt
  deduplicateBy: messageId
  acknowledgeAfter: successful-processing
  changedRedelivery: reject
transitions:
  question:
    action: reply
    next: wait
  escalation:
    action: resolve-boundary
    next: wait
  worker_done:
    action: validate-review-release
    next: unlock-dependent-workflows
  worker_failed:
    action: reconcile-effects
    next: recover-or-escalate
forbidden:
  - external-bootstrap-retains-coordinator-loop
  - shell-only-main-without-coordinator-agent
  - workflow-child-without-manager-agent
  - operation-agent-acts-as-workflow-manager
  - operation-agent-creates-nested-agent
  - operation-agent-messages-parent-coordinator-directly
  - parent-coordinator-controls-operation-directly
  - workflow-manager-implements-operation
  - workflow-manager-runs-operation-tests
  - coordinator-performs-workflow-local-work
  - higher-manager-performs-lower-layer-work
  - periodic-terminal-poll
  - periodic-log-read
  - periodic-diff-read
  - progress-prompt
  - duplicate-test-run
  - restart-healthy-workflow
  - coordinator-implements-worker-scope
  - user-report-on-unchanged-state
  - dispatch-operation-not-selected-by-active-dag-node
  - accept-effect-before-provider-attestation
  - dispatch-operation-to-existing-terminal
  - infer-architecture-sidearm-from-review
