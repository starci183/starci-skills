schema: starci/matrix@1
id: frontend
limits:
  steps: 3
  parallel: 3
  primary: 9
  secondaryPerPrimary: 3
rows:
  - - id: draw
      op: interface.draw
  - - id: implement
      op: interface.implement
  - - id: uat
      op: uat.verify
semantics:
  row: |-
    One sequential step; every occupied cell must pass before the next row.
  cell: |-
    A primary operation slot, at most three in one row and nine total in a 3 by 3 matrix.
  empty: |-
    Unused capacity; never invent work to fill it.
  repairs: |-
    Attempts revisit an existing cell; they do not add a fourth step.
  uatFlows: |-
    flows[] execute in request order inside uat.verify, never as parallel cells.
secondaryDefinitions: |-
  Each primary operator may define at most three distinct secondary operator types in its own secondary.json, with permissions specific to that caller. Unlisted types cannot be called.
