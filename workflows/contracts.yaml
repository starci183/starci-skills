schema: starci/workflow-contracts@1
workflow: frontend
input:
  schema: starci/frontend-input@1
  requiredFields:
    - schema
    - runId
    - context
    - journeys
  optionalFields:
    - criteria
  context: |-
    References to business, architecture, knowledge, repository, environment, accounts, fixtures and current authorization; never credentials. A fixed-runtime caller may select one observed runtime/profile. An Orca caller consumes the request-bound skill/operator execution chain and launches its first ready external agent. Profile policy never installs an agent, grants a missing tool or expands authority.
  journeys: |-
    Ordered business journeys with id, title, entry, actor, preconditions, steps and cleanup. Steps have id, action, expected and uxChecks; each check has id, question, expected yes/no. Copy accepted business specification.journeys without reconstructing actions from internal service-call steps; journeyCoverage provides AC links in the .starciwork specification.
  criteria: |-
    Optional extra criterion IDs per draw/implement/uat; required workflow criteria cannot be removed.
request:
  schema: starci/request@1
  requiredFields:
    - schema
    - workflow
    - runId
    - step
    - slot
    - op
    - requestId
    - upstreamDigest
    - inputs
    - criteria
  strict: |-
    Unknown/missing fields, invalid types, mismatched op/step and missing required criteria are rejected.
  inputsByOp:
    interface.draw:
      - context
      - journeys
    interface.implement:
      - context
      - journeys
      - draws
      - drawArtifacts
    uat.verify:
      - context
      - flows
      - codeRefs
      - runtime
      - assets
response:
  schema: starci/response@1
  requiredFields:
    - schema
    - workflow
    - runId
    - step
    - slot
    - op
    - requestId
    - requestDigest
    - status
    - criteria
    - outputs
    - artifacts
  status:
    - pass
    - fail
    - blocked
  criteria: |-
    Exactly the request criterion IDs; each has id, status, observation, evidence artifact IDs. All must pass before advance.
  outcomes:
    - pass
    - fail
    - not-run
    - inconclusive
  failedOutput: |-
    For fail/blocked outputs must be null; preserve failure observations and artifacts.
  outputsByOp:
    interface.draw:
      draws: |-
        Nonempty array: id, artifact image ID, screen, state, viewport {width,height}. Every image was opened and reviewed. Follow interface.draw's single-direction default; array length counts required screen/state/viewport images, not permission to generate competing design alternatives.
    interface.implement:
      flows: |-
        Ordered ready-to-run journeys. Preserve every original journey field/step/expected/UX check; add nonempty sourcePaths per flow.
      codeRefs: |-
        Array of {repository,commit}, full real SHA; include FE and every accepted backend secondary contribution.
      runtime: |-
        {environment,origin,build} observed for the render; source HEAD alone is not served identity.
      assets: |-
        Required manifest {reviewedDrawIds,items}; cover all input draws. Each item has id,drawIds,usage,requiredForFlow,status(reused/generated/deferred),sourcePath,artifact,provenance,brief. Ready items reference real image artifacts and source paths. Claude may defer decorative artwork only with null file/artifact and a concrete blank-slot brief. Required functional assets cannot be deferred.
    uat.verify:
      results: |-
        One result per input flow in exact order: flowId,status,steps,evidence. Every original step and UX check must be present; screenshot and real video evidence per executed passing flow.
      cleanup: |-
        {status,remaining,evidence}; pass and an empty remaining list are mandatory for done.
artifact:
  requiredFields:
    - id
    - path
    - sha256
    - kind
  kinds:
    - image
    - video
    - log
    - json
  path: |-
    Nonempty regular file relative to the durable run directory; reject traversal and symlinks.
  truthLimit: |-
    Gate verifies field shapes, references, equality, completeness and byte hashes. Workers must inspect actual images/videos and outcomes; hashes and declared criteria alone cannot prove semantic honesty.
secondary:
  scopeInputFields:
    - repository
    - paths
    - changeKind
    - problem
    - businessRefs
  request: |-
    support() emits starci/support-request@1 with parent request identity/digest and criteria from the caller-owned interface.implement/secondary.json.
  responseRequiredFields:
    - schema
    - supportId
    - requestDigest
    - status
    - criteria
    - outputs
    - artifacts
  responseSchema: starci/support-response@1
  passOutput:
    - codeRefs
    - changedPaths
    - businessChanged
    - apiCompatible
  constraints: |-
    At most three secondary jobs per primary; exact disjoint backend paths for simultaneous jobs; no business change; all required secondary gates must pass before FE resumes. Secondary jobs cannot spawn children or advance the workflow.
commands:
  build: npm run build
  init: node dist/workflows/frontend.mjs init INPUT_JSON NEW_DURABLE_RUN_DIR
  advance: |-
    node dist/workflows/frontend.mjs advance RUN_DIR RESPONSE_JSON
  repair: |-
    node dist/workflows/frontend.mjs repair RUN_DIR DIAGNOSIS_JSON
  support: node dist/workflows/frontend.mjs support RUN_DIR SUPPORT_INPUT_JSON
  resume: |-
    node dist/workflows/frontend.mjs resume RUN_DIR SUPPORT_RESPONSE_JSON
  status: node dist/workflows/frontend.mjs status RUN_DIR
execution: |-
  One shared Orca workflow may coordinate the resolved AgentOS workspace and its modules. The workflow runner emits operator requests containing an ordered external-agent chain; Orca selects the first observed ready candidate and may fall through only after an allowed failure with verified no effects. Providers remain workers below the common workflow. The Plan coordinator owns goal approval and complete-result acceptance. This local engine still does not install agents, authenticate providers or grant tools by itself.
standaloneFE: |-
  The identical {flows,codeRefs,runtime} object is always written to E/flows.json, validated against accepted journeys with validateFEHandoff; this does not certify UAT.
